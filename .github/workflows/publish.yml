name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regroup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python src/regroup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A to_review data
          git diff --cached --quiet || git commit -m "Regroup reviewed entries"
          git push

  publish:
    needs: regroup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python RSD_API_connector/format_candidates.py
      - env:
          RSD_TOKEN: ${{ secrets.RSD_TOKEN }}
          RSD_PUBLISH: 'false'
        run: python RSD_API_connector/main.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "Record RSD publication"
          git push
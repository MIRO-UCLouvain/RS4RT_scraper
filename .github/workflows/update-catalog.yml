name: Update catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 */2 *"

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run.py

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            README.md
            data/
            site/
          branch: catalog/run-${{ github.run_number }}
          title: "Catalog update (run ${{ github.run_number }})"
          commit-message: "Update generated catalog"
          body: |
            Automated scraper run.

            Review new entries in `data/catalog.json` before merging.
          delete-branch: true
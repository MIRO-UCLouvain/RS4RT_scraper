name: Clean

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET to confirm. This deletes every RSD entry you maintain and clears local data.'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'RESET' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Delete RSD entries
        env:
          RSD_TOKEN: ${{ secrets.RSD_TOKEN }}
        run: python RSD_API_connector/purge_rsd.py

      - name: Clear local data
        run: |
          rm -f data/catalog.json
          rm -f data/all_candidates.json
          rm -f data/new_elements.json
          rm -f data/rsd_entries.json
          rm -f data/repo_cache.json
          rm -f data/published.json
          rm -rf data/images
          rm -rf to_review

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data to_review
          git diff --cached --quiet || git commit -m "Reset catalog"
          git push
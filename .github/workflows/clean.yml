name: Clean

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET to confirm. Clears local catalog data, keeps published.json.'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'RESET' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clear catalog data
        run: |
          rm -f data/catalog.json
          rm -f data/all_candidates.json
          rm -f data/new_elements.json
          rm -f data/rsd_entries.json
          rm -f data/repo_cache.json
          rm -rf data/images

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data to_review
          git diff --cached --quiet || git commit -m "Reset catalog files"
          git push
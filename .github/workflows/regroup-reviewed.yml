name: Regroup reviewed entries

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  regroup:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regroup entries
        run: python src/regroup.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A to_review data
          git diff --cached --quiet || git commit -m "Regroup reviewed entries"
          git push

      - name: Trigger publication
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish-rsd.yml',
              ref: context.ref,
            })

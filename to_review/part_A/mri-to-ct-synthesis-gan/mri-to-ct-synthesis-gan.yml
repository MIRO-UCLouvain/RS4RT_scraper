readme_excerpt: "# MRI-to-CT Synthesis using GANs (Pix2Pix + NGF)\n\nThis project focuses on generating\
  \ **high-fidelity CT images from MRI scans** using a **Conditional GAN (Pix2Pix)** architecture enhanced\
  \ with **structural regularization (NGF – Normalized Gradient Fields)**.\n\nThe goal is to improve **anatomical\
  \ accuracy** of the generated CT images, which is critical for **clinical applications such as radiotherapy\
  \ planning**, where precise structural information is required.\n\n---\n\n## Project Overview\n\nMRI-only\
  \ clinical workflows aim to reduce patient exposure to radiation by avoiding CT acquisitions.  \nHowever,\
  \ CT images are still required for tasks that rely on accurate tissue density and structural boundaries.\n\
  \nThis project addresses this challenge by:\n- Learning a mapping from MRI to CT using deep learning\n\
  - Enforcing structural consistency between modalities\n- Evaluating the impact of structural regularization\
  \ on image quality\n\n---\n\n## Methodology\n\n- **Model:** Conditional GAN (Pix2Pix)\n  - Generator:\
  \ U-Net (implemented with MONAI)\n  - Discriminator: Multi-scale PatchGAN\n- **Loss Functions:**\n \
  \ - L1 reconstruction loss\n  - Adversarial loss\n  - Normalized Gradient Field (NGF) loss for structural\
  \ consistency\n- **Training Strategy:**\n  - Comparison between models trained with and without NGF\n\
  \  - High-fidelity variant using cropped training, anatomical masking, and background constraints\n\
  - **Inference:**\n  - 2D slice-based training with 3D volumetric reconstruction at test time\n\n---\n\
  \n## Data Processing\n\n- Paired MRI–CT scans\n- DICOM to NIfTI conversion\n- Slice extraction and intensity\
  \ normalization\n- Orientation consistency checks\n- Optional cranial masking for high-fidelity experiments\n\
  \n---\n\n## Evaluation Metrics\n\nModel performance is evaluated using:\n- **SSIM (Structural Similarity\
  \ Index Measure)**\n  - Global SSIM\n  - Local SSIM (within cranial region)\n- **Dice coefficient**\
  \ for structural overlap\n\n---\n\n## Key Results\n\n- NGF regularization improved **global SSIM from\
  \ 0.7134 to 0.7315**\n- Structural overlap (Dice) increased from **0.8826 to 0.8851**\n- High-fidelity\
  \ variant achieved the **best local SSIM (0.6931)**\n\nThese results show that enforcing structural\
  \ constraints leads to **more anatomically accurate CT synthesis**, suitable for clinical use.\n\n---\n\
  \n## Technologies Used\n\n- Python\n- PyTorch\n- MONAI\n- Pix2Pix (GAN)\n- Medical image processing\
  \ (MRI / CT)\n\n---\n\n## Use Cases\n\n- MRI-only clinical workflows\n- Radiotherapy planning support\n\
  - Medical image synthesis research\n- Structural image-to-image translation\n\n---\n\n## Disclaimer\n\
  \nThis project is intended for **research and educational purposes only** and is **not a certified medical\
  \ device**.\n\n---\n\n## Author\n\n**Yaghmoracen Belmir**  \nAI Engineer / Computer Vision  \n"

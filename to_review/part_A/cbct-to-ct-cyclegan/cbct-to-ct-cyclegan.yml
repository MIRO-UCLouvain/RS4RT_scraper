readme_excerpt: "# CBCT-to-CT-CycleGAN\nCBCT generates pseudo CT using CycleGAN.\n\n## [Visdom](https://github.com/facebookresearch/visdom)\n\
  To plot loss graphs and draw images in a nice web browser view\n\n```\npip install visdom\n```\n\n```\n\
  python -m visdom.server\n```\n\nhttp://localhost:8097\n\n## Environment\n\n```bash\nconda env create\
  \ -f env.yml\n```\n\n```bash\nconda activate cyclegan\n```\n\nExport env\n```bash\nconda env export\
  \ --no-builds --ignore-channels > env.yml\n```\n\n## Dataset\nAlternatively you can build your own dataset\
  \ by setting up the following directory structure:\n\n    .\n    ├── datasets                   \n \
  \   |   ├── <dataset_name>         # i.e. cbct2ct\n    |   |   ├── train              # Training\n \
  \   |   |   |   ├── A              # Contains domain A images (i.e. cbct)\n    |   |   |   └── B   \
  \           # Contains domain B images (i.e. ct)\n    |   |   └── test               # Testing\n   \
  \ |   |   |   ├── A              # Contains domain A images (i.e. cbct)\n    |   |   |   └── B     \
  \         # Contains domain B images (i.e. ct)\n\n\n## Train, Test & Predict\n\n```bash\npython train.py\n\
  python test.py\npython test_A2B.py\n```\n\n## PyInstaller Installation Guide:\n\n### 1. Create and Activate\
  \ Conda Environment\n\n```bash\nconda create --name cbct2ct python=3.9\n```\n\n```bash\nconda activate\
  \ cbct2ct\n```\n\n### 2. Install Required Python Packages\n\n```bash\npip install -i https://pypi.tuna.tsinghua.edu.cn/simple\
  \ pyinstaller\npip install -i https://pypi.tuna.tsinghua.edu.cn/simple SimpleITK\npip install -i https://pypi.tuna.tsinghua.edu.cn/simple\
  \ onnxruntime\npip install -i https://pypi.tuna.tsinghua.edu.cn/simple tqdm\n```\n\n### 3. Use PyInstaller\
  \ to Package Python Script\n\n```bash\ncd installer\npyinstaller --name CBCT2CT --onefile --icon=cbct2ct_logo.ico\
  \ CBCT2CT.py\n```\n\n### 4. Clean the Build Cache and Temporary Files\n\n```bash\npyinstaller --clean\
  \ CBCT2CT.spec\n```\n\n### 5. Run the Executable\n\nOnce the build is complete, you can run the generated\
  \ `CBCT2CT.exe` with the required parameters:\n\n```bash\nCBCT2CT.exe --cbct_path ./test_data/brain.nii.gz\
  \ --result_path ./result --anatomy brain\n```\n\n```bash\nCBCT2CT.exe --cbct_path ./test_data/pelvis.nii.gz\
  \ --result_path ./result --anatomy pelvis\n```\n\n- `--cbct_path`: Path to the input CBCT image file.\n\
  - `--result_path`: Path where the results will be saved.\n- `--anatomy`: Choose a model based on anatomical\
  \ region.\n\n### 6. Deactivate and Remove Conda Environment\n\n```bash\nconda deactivate\nconda remove\
  \ --name cbct2ct --all\n```\n\n# Reference\n[CycleGAN-and-pix2pix](https://github.com/junyanz/pytorch-CycleGAN-and-pix2pix)\n\
  \n[PyTorch-CycleGAN](https://github.com/YMZ1998/PyTorch-CycleGAN)\n\n[CycleGANBlog](https://hardikbansal.github.io/CycleGANBlog/)\n\
  \n[CycleGAN](https://junyanz.github.io/CycleGAN/)\n\n[Training tips](https://github.com/junyanz/pytorch-CycleGAN-and-pix2pix/blob/master/docs/tips.md)\n\
  \n[PyTorch-CycleGAN](https://github.com/aitorzip/PyTorch-CycleGAN)\n\n[Tips](https://www.icviews.cn/semiCommunity/postDetail/5923)"

readme_excerpt: '\# FedDUS: Lung Tumor Segmentation




  This project implements Federated Semi-Supervised Learning for lung tumor segmentation on CT images.




  \## Features


  \- U-Net segmentation


  \- Teacher-Student Learning


  \- Pseudo-label generation


  \- Dynamic Update Strategy (DUS)


  \- Federated Learning




  \## Project Structure


  \- preprocess.py


  \- pre\_train.py


  \- pre\_test.py


  \- fed\_train.py


  \- fed\_test.py


  \- visualization.py




  \## Installation




  pip install -r requirements.txt




  \## Run




  python preprocess.py


  python pre\_train.py


  python fed\_train.py


  python fed\_test.py


  '

readme_excerpt: '# CBCT2CT_cDDPM

  Official repo of CBCT-Based synthetic CT image generation using conditional denoising diffusion probabilistic
  model. Med Phys. 2023; 1-13. https://doi.org/10.1002/mp.16704


  It is also a general framework for any image-to-image translation task using a conditional denoising
  diffusion probabilistic model.



  - datasets.py

  - Diffusion_condition.py

  - Model_condition.py

  - Train_condition.py


  If you find it helpful to your project, please cite our paper: Peng J, Qiu RLJ, Wynne JF, et al. CBCT-Based
  synthetic CT image generation using conditional denoising diffusion probabilistic model. Med Phys. 2023;
  1-13. https://doi.org/10.1002/mp.16704



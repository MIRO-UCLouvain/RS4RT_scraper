readme_excerpt: "# dosi_metrics\nused for radiotherapy dosimetrics extract\nThe two XLS files, which are\
  \ used to set equal OAR or target names, are for different patients. \nFor the EqOAR file: the first\
  \ row contains the OAR or target names set in the Python script; \nyou should input all the patient's\
  \ OAR names into the Excel file and save it. \nThe other Excel file contains the dosimetry data you\
  \ want to extract from the RT files.\nHow to use the script? \n\nFirst, install Python 3, version 10\
  \ or later; \nsecond, use pip to install the required packages for the script, which you can find listed\
  \ in the script itself. \nThird, set the different working paths in the script and save it. \nFinally,\
  \ run the file using Python and wait for the results.\n \n"

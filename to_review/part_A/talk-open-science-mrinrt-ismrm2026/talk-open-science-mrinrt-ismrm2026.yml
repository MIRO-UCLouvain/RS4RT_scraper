readme_excerpt: "[![DOI](https://zenodo.org/badge/1170876878.svg)](https://doi.org/10.5281/zenodo.18841703)\n\
  \n# The Importance and Benefits of Open Science: Practical Lessons for Sustainable MR Research\n\n\n\
  Presented as part of the Virtual Meeting: _Open Science for MR in Radiation Therapy_\n\nSlides from\
  \ a 12-minute presentation given at the ISMRM MR in Radiation Therapy (MRinRT) Study Group.\n\nThis\
  \ talk discusses the practical, self-interested benefits of open science practices in MRI research,\
  \ with a focus on clinical and translational environments.\n\n---\n\n## Abstract\n\nOpen science is\
  \ often framed as a moral or systemic imperative. In this talk, I argue for a complementary perspective:\
  \ open science is strategically advantageous for individual researchers, labs, and clinical research\
  \ groups.\n\nDrawing on examples from MRI research and translational neuromodeling, I discuss:\n\n-\
  \ The practical benefits of reproducible workflows  \n- Increased reuse, visibility, and citation impact\
  \  \n- Reduction of technical debt and legacy code risk  \n- Improved collaboration and lab culture\
  \  \n- GDPR-compliant data sharing strategies  \n\nThe talk concludes with low-barrier steps for getting\
  \ started.\n\n---\n\n## Files\n\n- `2026-03-02_LarsKasper_ISMRM-MRinRT-SG_BenefitsOfOpenScience.pdf`\
  \ – Presentation slides (final version)\n- `2026-03-02_LarsKasper_ISMRM-MRinRT-SG_BenefitsOfOpenScience.pptx`\
  \ – Source file\n- `LICENSE` – CC BY 4.0 license\n\n---\n\n## License\n\nThis work is licensed under\

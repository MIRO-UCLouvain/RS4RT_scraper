readme_excerpt: "# \U0001F9E0 Brain MRI Tumor Analyzer\n\n> **Deep Learning-based Brain Tumor Detection\
  \ & Segmentation**  \n> Classification: **85.8% Accuracy** | Segmentation: **86.7% Dice Score**\n\n\
  [![Live Demo](https://img.shields.io/badge/\U0001F917%20Live%20Demo-Hugging%20Face-yellow)](https://huggingface.co/spaces/Vanshika250/Brain-mri-analyzer)\n\
  [![Python](https://img.shields.io/badge/Python-3.8+-blue)](https://python.org)\n[![TensorFlow](https://img.shields.io/badge/TensorFlow-2.x-orange)](https://tensorflow.org)\n\
  [![Gradio](https://img.shields.io/badge/Gradio-App-green)](https://gradio.app)\n\n---\n\n## \U0001F4CC\
  \ Overview\n\nThis project implements a **two-stage deep learning pipeline** for brain MRI analysis:\n\
  \n1. **Tumor Classification** — Identifies tumor type using EfficientNetB3\n2. **Tumor Segmentation**\
  \ — Localizes tumor region using a custom U-Net\n\nUpload any brain MRI scan and get instant predictions\
  \ with tumor type, confidence score, and segmentation mask.\n\n---\n\n## \U0001F680 Live Demo\n\n\U0001F449\
  \ **Try it here:** [huggingface.co/spaces/Vanshika250/Brain-mri-analyzer](https://huggingface.co/spaces/Vanshika250/Brain-mri-analyzer)\n\
  \n---\n\n## \U0001F3C6 Results\n\n### Classification (EfficientNetB3)\n\n| Class | Recall |\n|-------|--------|\n\
  | Glioma | 56% |\n| Meningioma | 94% |\n| No Tumor | 97% |\n| Pituitary | 97% |\n| **Overall Accuracy**\
  \ | **85.8%** |\n\n### Confusion Matrix\n![Confusion Matrix](images/confusion_matrix.png)\n\n---\n\n\
  ### Segmentation (U-Net)\n\n| Metric | Score |\n|--------|-------|\n| Dice Score | **86.71%** |\n| Parameters\
  \ | 31.4M |\n\n### U-Net Predictions\n![U-Net Predictions](images/unet_predictions.png)\n\n---\n\n##\
  \ \U0001F6E0️ Tech Stack\n\n| Component | Technology |\n|-----------|-----------|\n| Classification\
  \ Model | EfficientNetB3 + Focal Loss |\n| Segmentation Model | Custom U-Net (BCE + Dice Loss) |\n|\
  \ Preprocessing | CLAHE contrast enhancement |\n| Framework | TensorFlow 2.x |\n| Web App | Gradio |\n\
  | Deployment | Hugging Face Spaces |\n\n---\n\n## \U0001F4C1 Project Structure\n"

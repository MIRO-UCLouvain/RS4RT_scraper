readme_excerpt: "# Deep Learning for Wood Moisture Monitoring and Deformation Analysis Using 4D-CT\n\n\
  This repo is the official implementation of ‘Cutting-Edge Deep Learning and 4D-CT Imaging: Revolutionizing\
  \ Moisture Monitoring and Deformation Analysis in Wood during Drying’. It currently includes code for\
  \ the following tasks:\n\n## 1. Abstract\nWood plays a pivotal role in building a sustainable future\
  \ due to its renewable properties, carbon sequestration capabilities, and versatility across applications\
  \ such as construction, furniture, and energy production. However, the wood drying process poses substantial\
  \ challenges. To address these, our study introduces a novel method combining U-net deep learning image\
  \ registration with Four-Dimensional Computed Tomography (4D-CT). This approach enables time-resolved,\
  \ three-dimensional visualization of moisture migration and deformation during the wood drying process.\
  \ \n\nOur methodology reveals detailed information about wood's anisotropic nature, supporting advanced\
  \ modeling and optimization of drying schedules, ultimately improving wood quality.\n\n## 2. Getting\
  \ Started\n\n### 2.1 Preprocessing\nThe raw CT files are normalized and rigidly registered with the\
  \ allometric quantities after undergoing filtering processes. Preprocessing is crucial for improving\
  \ the quality of model training.\n\n- **readCTslices.m**: Reads all DICOM files in a folder and reorganizes\
  \ them into a matrix.\n- **normalizeCTData.m**: Normalizes CT data and removes background noise.\n-\
  \ **registerImages.m**: Aligns CT matrix data at translation and rotation levels.\n- **nomorliaztion.m**:\
  \ Performs batch normalization.\n- **nii_save.m**: Batch aligns data and stores it as NIfTI (.nii) files.\n\
  \n### 2.2 Deep-learning Model\nThe VoxelMorph library (https://github.com/voxelmorph/voxelmorph) is\
  \ utilized as the foundation for deep learning-based registration, with significant improvements to\
  \ the generator, mesh structure, and loss functions for wood-specific applications.\n\n- **train.py**:\
  \ Main program for training the deep learning model. You can customize mesh structures, loss functions,\
  \ and other parameters. During each epoch, images are outputted for alignment evaluation.\n- **test.py**:\
  \ Inference script.\n- **visualise.py**: Functions for visualizing results.\n\n## 3. Requirements\n\
  - Python 3.8\n- Pytorch 2.1\n- Keras \n- MATLAB (for preprocessing)\n\n## 4. Acknowledgements\nWe gratefully\
  \ acknowledge the use of the VoxelMorph library (https://github.com/voxelmorph/voxelmorph). Their contributions\
  \ significantly helped shape our work on deep learning registration models. \n\n## 5. License\nThis\
  \ project is licensed under the MIT License. You are free to use, modify, and distribute the code, provided\
  \ that the original copyright notice and permission notice are retained in all copies or substantial\
  \ portions of the code.\n"

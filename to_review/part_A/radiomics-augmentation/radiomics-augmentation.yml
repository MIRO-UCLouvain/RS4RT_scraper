readme_excerpt: "# Radiomics Augmentation\n\n[![License](https://img.shields.io/badge/License-MIT-blue.svg)](https://opensource.org/license/mit)\n\
  [![Python Version](https://img.shields.io/badge/python-3.10%2B-blue.svg)](https://www.python.org/downloads/)\n\
  \nWelcome to **Radiomics Augmentation**, a pipeline design to help you apply data augmentation transforms\
  \ to medical images in order to generate augmented radiomics feature sets.\nRadiomics Augmentation was\
  \ designed to combat class imbalance and small sample sizes typical in medical datasets.\n\n## \U0001F4D6\
  \ Table of Contents\n- [Overview](#-overview)\n- [Features](#-features)\n- [Installation](#️-installation)\n\
  - [Quick Start](#-quick-start)\n- [Requirements](#-requirements)\n- [Contributing](#-contributing)\n\
  - [License](#-license)\n- [Acknowledgments](#-acknowledgments)\n\n## \U0001F3AF Overview\nIn radiomics\
  \ studies, machine learning algorithms often struggle with high-dimensional feature spaces and small\
  \ patient cohorts.\nThis repository provides an end-to-end framework to augment radiomics data, ensuring\
  \ more robust, generalizable, and reproducible predictive models (e.g., for survival prediction). \n\
  \nIt integrates popular medical imaging frameworks such as `SimpleITK`, `torchio`, and `pyradiomics`.\n\
  \n## ✨ Features\n* **Image-Level Perturbations:** Apply spatial transformations (rotation, translation,\
  \ scaling) and domain-specific artifacts (noise injection, low-resolution simulation) to 3D medical\
  \ images (CT, PET, MRI) and their corresponding segmentation masks prior to feature extraction.\n* **Automated\
  \ Pipeline:** Automated radiomic features extraction across augmented image variants.\n\n## ⚙️ Installation\n\
  \nClone the repository and install the required dependencies:\n\n```bash\ngit https://github.com/Zhack47/radiomics-augmentation.git\n\
  cd radiomics-augmentation\npip install -r requirements.txt\n```\n\nNote: It is highly recommended to\
  \ use a virtual environment (e.g., conda or venv).\n\n## \U0001F680 Quick Start\n\nAn example demonstrating\
  \ the use of Radiomics Augmentation on the HECKTOR2022 dataset is available in ```examples/Hecktor22.py```.\n\
  \n## \U0001F4C4 License\n\nThis project is licensed under the MIT License\n\n## \U0001F64F Contributors\n\
  Developed and maintained by @Zhack47.\n\nBuilt to support robust medical imaging and radiomics research."

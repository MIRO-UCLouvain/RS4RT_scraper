readme_excerpt: "# JRM-ADM\n\nOfficial implementation of **Adaptive Diffusion Models for Sparse-View Motion-Corrected\
  \ Head Cone-Beam CT**.\n\n## Installation\n\nCreate and activate your Python environment, then install\
  \ `torch-radon` with conda:\n\n```bash\nconda install conda-forge::carterbox-torch-radon\n```\n\nInstall\
  \ the remaining Python requirements:\n\n```bash\npip install -r requirements.txt\n```\n\n## Pretrained\
  \ Weights\n\nDownload the pretrained W3DM weights and place them at the path expected by the YAML config:\n\
  \n```bash\nmkdir -p weights\nwget -O weights/model_state_dict.pth \"https://huggingface.co/antoinedepaepe/adm-jrm-w3dm/resolve/main/model_state_dict.pth?download=true\"\
  \n```\n\nThe default config expects:\n\n```yaml\nadm_jrm:\n  model_path: \"./weights/model_state_dict.pth\"\
  \n```\n\n## Configuration\n\nBefore running the code, set the experiment parameters in:\n\n```bash\n\
  config/adm_jrm.yaml\n```\n\nThis file controls the device, data location, acquisition geometry, motion\
  \ parameters, noise level, diffusion schedule, optimizer settings, and output paths. We refer to the\
  \ paper for the detailed parameter choices.\n\n## Generate Motion-Affected Measurements\n\nFirst generate\
  \ simulated motion-corrupted cone-beam measurements:\n\n```bash\npython generate_data.py\n```\n\n##\
  \ Run JRM-ADM Reconstruction\n\nThen run JRM-ADM reconstruction:\n\n```bash\npython run_jrm_adm.py\n\
  ```\n\n\n## Citation\n\nIf you use this code, please cite our paper:\n\n```bibtex\n@article{de2025adaptive,\n\
  \  title={Adaptive Diffusion Models for Sparse-View Motion-Corrected Head Cone-Beam CT},\n  author={De\
  \ Paepe, Antoine and Bousse, Alexandre and Phung-Ngoc, Cl{\\'e}mentine and Mellak, Youness and Visvikis,\
  \ Dimitris},\n  journal={IEEE Transactions on Radiation and Plasma Medical Sciences},\n  year={2025},\n\
  \  publisher={IEEE}\n}\n```\n"

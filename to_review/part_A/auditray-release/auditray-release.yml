readme_excerpt: "<h1 align=\"center\">\n  <img src=\"AuditRay_img.png\" alt=\"AuditRay\" width=\"720\"\
  \ />\n</h1>\n\n<p align=\"center\">\n  <strong>Le contrôle qualité en radiothérapie, enfin unifié.</strong><br\
  \ />\n  <em>Centralisez vos 135 contrôles ANSM, automatisez vos analyses et générez vos rapports d'audit\
  \ en un clic.</em>\n</p>\n\n<p align=\"center\">\n  <a href=\"README.md\">Français</a> |\n  <a href=\"\
  READMEs/README.en.md\">English</a> |\n  <a href=\"READMEs/README.es.md\">Español</a> |\n  <a href=\"\

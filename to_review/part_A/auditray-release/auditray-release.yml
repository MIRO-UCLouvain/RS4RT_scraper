  >中文</a>\n</p>\n\n<p align=\"center\">\n  <a href=\"https://www.kaptan-data-solutions.app/upcoming_saas\"\
  ><img src=\"https://img.shields.io/badge/\U0001F680_Accès_anticipé-Rejoindre_la_liste-E8622A?style=flat-square\"\
  \ alt=\"Accès anticipé\" /></a>\n  <a href=\"https://kaptan-data-solutions.app/\"><img src=\"https://img.shields.io/badge/Site_Officiel-AuditRay-E8622A?style=flat-square&logo=safari&logoColor=white\"\
  \ alt=\"Site Officiel\" /></a>\n  <a href=\"https://kaptandatasolutions.github.io/\"><img src=\"https://img.shields.io/badge/Blog_KDS-kaptandatasolutions.github.io-1A2B4A?style=flat-square&logo=github&logoColor=white\"\
  \ alt=\"Blog KDS\" /></a>\n  <a href=\"https://github.com/kaptandatasolutions\"><img src=\"https://img.shields.io/badge/Créateur-kaptandatasolutions-24292e?style=flat-square&logo=github&logoColor=white\"\
  \ alt=\"kaptandatasolutions\" /></a>\n  <a href=\"https://ansm.sante.fr/actualites/decision-du-28-02-2023-fixant-les-modalites-du-controle-de-qualite-des-installations-de-radiotherapie-externe-et-de-radiochirurgie\"\
  ><img src=\"https://img.shields.io/badge/ANSM_2023-Conforme-2C9E4A?style=flat-square\" alt=\"ANSM 2023\"\
  \ /></a>\n  <a href=\"#\"><img src=\"https://img.shields.io/badge/135_Contrôles-UC1–UC8_•_S1–S3-1D7A8A?style=flat-square\"\
  \ alt=\"135 contrôles\" /></a>\n  <a href=\"Jeux%20de%20données/README.md\"><img src=\"https://img.shields.io/badge/Jeux_de_données-Open_Data-C9962B?style=flat-square&logo=files&logoColor=white\"\
  \ alt=\"Jeux de données\" /></a>\n  <a href=\"#\"><img src=\"https://img.shields.io/badge/Python-pylinac-3776AB?style=flat-square&logo=python&logoColor=white\"\
  \ alt=\"Python pylinac\" /></a>\n  <a href=\"#\"><img src=\"https://img.shields.io/badge/Format-DICOM_•_CSV_•_PTW_•_IBA-6366F1?style=flat-square\"\
  \ alt=\"Formats\" /></a>\n  <a href=\"SECURITY.md\"><img src=\"https://img.shields.io/badge/PHI--Free-Données_anonymisées-E8622A?style=flat-square&logo=shield&logoColor=white\"\
  \ alt=\"PHI Free\" /></a>\n</p>\n\n---\n\n<p align=\"center\">\n  <a href=\"https://www.kaptan-data-solutions.app/upcoming_saas\"\
  >\n    <img src=\"https://img.shields.io/badge/\U0001F680%20Accès%20anticipé%20—%20Rejoignez%20la%20liste%20des%20physiciens%20pionniers-Inscription%20gratuite-E8622A?style=for-the-badge\"\
  \ alt=\"Rejoindre la liste d'attente\" />\n  </a>\n</p>\n\n> **Un service de radiothérapie génère des\
  \ dizaines de contrôles qualité par semaine, répartis sur des outils hétérogènes. Comment garantir la\
  \ traçabilité, la conformité ANSM et la capitalisation des données — tout en gagnant du temps ?**\n\n\
  **AuditRay** est la plateforme SaaS qui unifie l'ensemble de vos contrôles qualité LINAC autour d'une\
  \ architecture native ANSM 2023, d'un hub d'analyse Python ouvert et d'un écosystème communautaire de\
  \ scripts et de templates.\n\n> *Le but n'est pas un tableau de bord qui impressionne — c'est une plateforme\
  \ qui fiabilise votre AQ au quotidien et libère du temps pour ce qui compte.*\n\n---\n\n## À propos\
  \ de ce dépôt\n\nCe dépôt héberge les **releases publiques d'AuditRay**, la documentation officielle,\
  \ les templates de rapports, les jeux de données de référence et les guides d'intégration communautaires.\n\
  \n**AuditRay n'est pas open-source** — ce dépôt ne contient pas le code source de la plateforme principale.\
  \ En revanche, il est ouvert aux contributions de la communauté via l'API publique et le système de\
  \ templates/plugins.\n\n<p align=\"center\">\n  <strong>Un projet porté par <a href=\"https://github.com/kaptandatasolutions\"\
  >kaptandatasolutions</a></strong><br />\n  <em>Retrouvez nos articles et tutoriels sur le <a href=\"\
  https://kaptandatasolutions.github.io/\">blog KDS</a> — physique médicale, Python, IA et AQ en radiothérapie.</em>\n\
  </p>\n\n---\n\n## ✨ Fonctionnalités\n\n> [!NOTE]\n> Ce dépôt contient un **référentiel national collaboratif**\
  \ structuré en 4 axes à la racine : [`jeux-reels-anonymises/`](jeux-reels-anonymises/README.md), [`donnees-synthetiques/`](donnees-synthetiques/README.md),\
  \ [`cas-hors-tolerances/`](cas-hors-tolerances/README.md) et [`scripts-analyse/`](scripts-analyse/README.md).\
  \ Les données brutes par type de test (Picket Fence, Winston-Lutz, VMAT…) se trouvent dans [`Jeux de\
  \ données/`](Jeux%20de%20données/README.md).\n\n<table>\n  <tr>\n    <td width=\"50%\" valign=\"top\"\
  >\n      <h3>\U0001F3D7️ Architecture native ANSM 2023</h3>\n      <p>Les 135 contrôles UC1–UC8 et S1–S3\
  \ sont modélisés directement dans la structure de données et les workflows. Aucune reconstruction documentaire\
  \ a posteriori.</p>\n    </td>\n    <td width=\"50%\" valign=\"top\">\n      <h3>\U0001F4E5 Import multi-sources</h3>\n\
  \      <p>DICOM, CSV, formats propriétaires PTW / IBA (quand non cryptés). Moteur d'import centralisé\
  \ avec traçabilité complète jusqu'à la mesure source.</p>\n    </td>\n  </tr>\n  <tr>\n    <td width=\"\
  50%\" valign=\"top\">\n      <h3>\U0001F40D Hub d'analyse Python — API REST</h3>\n      <p>Chaque physicien\
  \ déploie ses propres modules d'analyse via l'API REST publique. Les résultats alimentent directement\
  \ les tableaux de bord de conformité AuditRay.</p>\n    </td>\n    <td width=\"50%\" valign=\"top\"\
  >\n      <h3>\U0001F4CA Benchmark inter-centres</h3>\n      <p>Comparaison LINAC du même type entre\
  \ établissements. Ajustez vos seuils d'action par retours d'expérience agrégés sur la plateforme.</p>\n\
  \    </td>\n  </tr>\n  <tr>\n    <td width=\"50%\" valign=\"top\">\n      <h3>\U0001F4C4 Rapports d'audit\
  \ en un clic</h3>\n      <p>Génération automatique de rapports réglementaires traçables, prêts à présenter\
  \ lors des visites de contrôle ANSM.</p>\n    </td>\n    <td width=\"50%\" valign=\"top\">\n      <h3>\U0001F91D\
  \ Écosystème communautaire</h3>\n      <p>Marketplace de plugins d'analyse et de templates de rapports\
  \ développés par la communauté des physiciens médicaux français et internationaux.</p>\n    </td>\n\
  \  </tr>\n</table>\n\n---\n\n## \U0001F4C1 Structure du dépôt\n\n```\nauditray-release/\n│\n│  ── Référentiel\
  \ national collaboratif ──────────────────────────────────\n├── jeux-reels-anonymises/             #\
  \ Données terrain LINAC réels, anonymisées\n├── donnees-synthetiques/              # Données générées\
  \ pour l'entraînement IA\n├── cas-hors-tolerances/               # Dépassements cliniques pertinents\
  \ et rares\n├── scripts-analyse/                   # Scripts Python intégrables via API AuditRay\n│\n\
  │  ── Données de référence par type de test (ANSM) ───────────────────────\n├── Jeux de données/   \
  \                # Données brutes de référence\n│   ├── README.md\n│   ├── picket-fence/           \
  \       # UC3 — MLC\n│   ├── winston-lutz/                  # UC3 — Isocentre\n│   ├── vmat-qa/    \
  \                   # UC4/UC5 — Contrôle patient VMAT\n│   ├── mlc-transmission/              # UC3\
  \ — Transmission MLC\n│   ├── starshot/                      # UC3 — Rotation gantry\n│   ├── beam-output/\
  \                   # UC2 — Rendement faisceau\n│   ├── field-size/                    # UC2 — Taille\
  \ de champ\n│   ├── gamma-index/                   # UC4/UC5 — Indice gamma patient\n│   └── image-qualite/\
  \                 # UC6 — Qualité d'image\n│\n│  ── Documentation & gouvernance ────────────────────────────────────────\n\
  ├── AuditRay_img.png                   # Logo officiel AuditRay\n├── README.md                     \
  \     # Ce fichier (Français)\n├── READMEs/                           # Traductions\n│   ├── README.en.md\
  \                   # English\n│   ├── README.es.md                   # Español\n│   ├── README.de.md\
  \                   # Deutsch\n│   ├── README.it.md                   # Italiano\n│   ├── README.pt.md\
  \                   # Português\n│   ├── README.ja.md                   # 日本語\n│   └── README.zh.md\
  \                   # 中文\n├── CONTRIBUTING.md                    # Guide de contribution\n├── CODE_OF_CONDUCT.md\
  \                 # Code de conduite\n├── SECURITY.md                        # Signalement de vulnérabilités\n\
  └── poster_SFPM2026_AuditRay.html      # Poster SFPM 2026 — Lyon\n```\n\n---\n\n## \U0001F680 Contribuer\n\
  \n### Plugins d'analyse\n\nSoumettez votre script Python via une pull request sur `community-plugins.json`\
  \ :\n\n```json\n{\n  \"id\": \"mon-analyse-picket-fence\",\n  \"name\": \"Picket Fence — Mon LINAC\"\
  ,\n  \"author\": \"Prénom Nom / CHU de Ville\",\n  \"description\": \"Analyse UC3 — positionnement MLC\
  \ pour Varian TrueBeam.\",\n  \"ansm_controls\": [\"UC3\"],\n  \"linac_type\": [\"Varian TrueBeam\"\
  ],\n  \"repo\": \"utilisateur/depot-github\",\n  \"language\": \"Python\",\n  \"requires\": [\"pylinac>=3.0\"\
  , \"pydicom\"]\n}\n```\n\n### Templates de rapports\n\nSoumettez votre mise en page via `community-templates.json`\
  \ :\n\n```json\n{\n  \"name\": \"Rapport UC1-UC8 mensuel — CHU\",\n  \"screenshot\": \"previews/rapport-chu-blurred.png\"\
  ,\n  \"regulatory_version\": \"ANSM 2023\",\n  \"controls_covered\": [\"UC1\",\"UC2\",\"UC3\",\"UC4\"\
  ,\"UC5\",\"UC6\",\"UC7\",\"UC8\"],\n  \"author\": \"Prénom Nom / CHU de Ville\"\n}\n```\n\n> [!IMPORTANT]\n\
  > **Aucune donnée patient (PHI / DCP) ne doit figurer dans vos contributions.** Anonymisez systématiquement\
  \ vos fichiers DICOM avant tout commit. Consultez [SECURITY.md](SECURITY.md) pour les règles d'anonymisation.\n\
  \nConsultez [CONTRIBUTING.md](CONTRIBUTING.md) pour le guide complet.\n\n---\n\n## \U0001F680 Accès\
  \ anticipé — Rejoignez les physiciens pionniers\n\n> [!IMPORTANT]\n> **AuditRay est en cours de déploiement.**\
  \ Les physiciens médicaux qui s'inscrivent dès maintenant bénéficient d'un **accès prioritaire**, d'une\
  \ **période d'essai offerte** et d'une **influence directe sur la roadmap** — vos retours terrain façonnent\
  \ la plateforme.\n\n**Pourquoi s'inscrire maintenant ?**\n\n- ✅ **Accès prioritaire** — soyez parmi\
  \ les premiers établissements à utiliser AuditRay avant le lancement public.\n- ✅ **Essai gratuit**\
  \ — testez la plateforme sur vos propres données LINAC sans engagement.\n- ✅ **Co-construction** — vos\
  \ besoins terrain (équipements, protocoles, formats) guident les développements prioritaires.\n- ✅ **Communauté\
  \ fondatrice** — intégrez le réseau des physiciens pionniers et partagez scripts et retours d'expérience.\n\
  - ✅ **Conformité ANSM dès le premier jour** — architecture UC1–UC8 / S1–S3 native, sans adaptation.\n\

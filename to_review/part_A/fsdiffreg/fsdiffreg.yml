readme_excerpt: "# MICCAI 2023: FSDiffReg: Feature-wise and Score-wise Diffusion-guided Unsupervised Deformable\
  \ Image Registration for Cardiac Images\r\n\r\nThis repository is the official implementation of \"\
  FSDiffReg: Feature-wise and Score-wise Diffusion-guided Unsupervised Deformable Image Registration for\
  \ Cardiac Images\".\r\n<img src=\"./img/mainfigure.png\">\r\n\r\n## Requirements\r\nPlease use command\r\
  \n```\r\npip install -r requirements.txt\r\n```\r\nto install the environment. We used PyTorch 1.12.0,\
  \ Python 3.8.10 for training.\r\n\r\n## Data\r\n* We used 3D cardiac MR images for training: [ACDC dataset](https://www.creatis.insa-lyon.fr/Challenge/acdc/)\r\
  \n\r\n## Training\r\n\r\nTo run training process:\r\n\r\n```\r\npython train.py -c config/train_3D.json\r\
  \n```\r\n\r\n## Test\r\n\r\nTo run testing process:\r\n\r\n```\r\npython3 test.py -c config/test_3D.json\
  \ -w [YOUR TRAINED WEIGHTS]\r\n```\r\nTrained model can be found [here](https://drive.google.com/drive/folders/1x4NC9hHor2JexrclDmUMfKYTHhOQvVYT?usp=sharing)\r\
  \n\r\n## Acknowledgement\r\n\r\nWe would like to thank the great work of the following open-source project:\
  \ [DiffuseMorph](https://github.com/DiffuseMorph/DiffuseMorph).\r\n\r\n## Citation\r\n\r\n"

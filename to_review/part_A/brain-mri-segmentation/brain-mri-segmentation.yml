readme_excerpt: "# Brain MRI Segmentation\n\nA deep learning project for brain tumor segmentation from\
  \ MRI scans.  \nThe goal of this project is to detect and segment tumor regions in brain MRI images\
  \ using image-mask pairs and semantic segmentation models.\n\n## Overview\n\nBrain tumor segmentation\
  \ is an important medical imaging task where the objective is to identify the exact tumor region inside\
  \ an MRI scan.  \nThis project uses MRI images together with their corresponding segmentation masks\
  \ to train and evaluate deep learning models for automatic tumor localization.\n\nThe work is implemented\
  \ in a Jupyter Notebook and includes:\n\n- Dataset loading and image-mask pairing\n- Data preprocessing\n\
  - Tumor / non-tumor distribution analysis\n- Train-validation-test splitting\n- Deep learning model\
  \ development\n- Segmentation evaluation using metrics such as Dice score\n- Visualization of predicted\
  \ masks against ground-truth masks\n\n## Dataset\n\nThis project uses the **LGG MRI Segmentation Dataset**\
  \ from Kaggle.\n\nThe dataset contains brain MRI images with manually annotated FLAIR abnormality segmentation\
  \ masks. These masks represent the tumor regions used as ground truth for training segmentation models.\n\
  \nDataset link:  \nhttps://www.kaggle.com/datasets/mateuszbuda/lgg-mri-segmentation\n\n## Dataset Structure\n\
  \nEach MRI image has a corresponding mask image.  \nThe mask is used to identify whether a tumor exists\
  \ and where it is located in the MRI scan.\n\nAfter preprocessing, the dataset contains:\n\n- Total\
  \ image-mask pairs: 3,929\n- Tumor samples: 1,373\n- Non-tumor samples: 2,556\n\n## Project Workflow\n\
  \n### 1. Data Loading\n\nThe notebook loads MRI images and their corresponding masks, then matches each\
  \ MRI scan with its correct ground-truth mask based on the file names.\n\n### 2. Preprocessing\n\nThe\
  \ images and masks are prepared for model training through steps such as:\n\n- Reading image and mask\
  \ files\n- Resizing / formatting inputs\n- Normalizing pixel values\n- Converting masks into binary\
  \ segmentation targets\n- Creating structured image-mask pairs\n\n### 3. Data Splitting\n\nThe dataset\
  \ is split into:\n\n- Training set\n- Validation set\n- Testing set\n\nStratified splitting is used\
  \ to preserve the tumor and non-tumor distribution across the splits.\n\n### 4. Model Training\n\nSeveral\
  \ segmentation models are explored, including:\n\n- Simple CNN baseline\n- U-Net\n- FPN\n- ResNeXt50-U-Net\n\
  - U-Net++\n\nThe models are trained to predict tumor masks from MRI images.\n\n### 5. Evaluation\n\n\
  The models are evaluated using segmentation metrics, mainly:\n\n- Dice coefficient\n- IoU / Jaccard\
  \ score\n- Accuracy\n- Loss curves\n- Visual comparison between predicted masks and ground-truth masks\n\
  \nThe Dice score is especially important because it measures the overlap between the predicted tumor\
  \ region and the actual tumor mask.\n\n## Technologies Used\n\n- Python\n- Jupyter Notebook\n- TensorFlow\
  \ / Keras\n- NumPy\n- Pandas\n- Matplotlib\n- OpenCV\n- Scikit-learn\n\n## Repository Structure\n\n\
  ```text\nBrain-MRI-Segmentation/\n│\n├── Brain_Tumor_Segmentation (3).ipynb   # Main project notebook\n\
  ├── README.md                            # Project documentation\n"

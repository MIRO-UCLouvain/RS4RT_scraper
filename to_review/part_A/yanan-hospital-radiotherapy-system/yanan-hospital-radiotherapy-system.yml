readme_excerpt: "# 延安市人民医院放疗病人信息及靶区剂量管理系统\n\n这是一个为**延安市人民医院放疗科**定制开发的病人信息管理与靶区剂量精细化跟踪系统。系统采用 **React 19\
  \ + TypeScript + Vite + Tailwind CSS** 现代全栈前端技术栈构建，并且支持 **Firebase Firestore** 进行无感知的多端云同步。\n\n---\n\
  \n## \U0001F31F 系统核心优化特征\n\n针对之前版本中的显示截断、排版死板、手机端由于表格过长不能完整拖曳查看等问题，本项目进行了如下的**排版优化与体验升级**：\n\n1. **移动端手势优化**：\n\
  \   * 在移动端（包括手机竖屏/横屏、平板电脑）上隐藏不必要的硬性裁剪。\n   * 为数据表格加入了移动端滑动手势区域逻辑，同时在表格上方提供直观动态的滑动指引语：`← 左右拖拽或滑动可查看表格右侧隐藏栏目\
  \ →`。\n   * 技术展示和进度部分经过重新精简重排，自适应伸缩不换行。\n\n2. **自适应两栏重构（响应式布局）**：\n   * 电脑大屏幕下，左侧录入/编辑表单与右侧高密度表格列表、详情卡片形成完美的空间级节奏感；\n\
  \   * 在小屏幕/手机端，采用无缝的串联列式（Order Reordered）排版。系统优先向用户渲染病患表格列表，以便医务人员在巡视病房时最快地获取患者信息，而将录入表单和编辑细节折叠在后方，提高浏览效率。\n\
  \n3. **双重自适应控制卡片**：\n   * 细化了病患详情页（CRITICAL CLINICAL DETAIL）卡片。\n   * 在点击“详情”后，系统提供平滑、渐进式的**自动滚动（Auto-Scroll）锁定**。手机网页不会被卡片撑开，而是将内容动态平滑地平滑至屏幕中视口，杜绝截断。\n\
  \   * 集成了 `+1 次 (执行照射)` 和 `-1 次 (扣减)` 一键式极简按钮操作，便于医师或放疗技术员床旁操作。\n\n---\n\n## \U0001F6E0️ 本地开发运行步骤\n\n\
  要将本项目部署并运行在您的本地电脑硬件（Windows / macOS / Linux）上，请按照以下步骤进行操作：\n\n### 1. 软件环境准备 (Prerequisites)\n\n您需要在电脑中安装运行环境\
  \ **Node.js**（推荐使用 LTS 长期支持版，Node 18+ 或更高版本）。\n\n* [Node.js 官方下载页面](https://nodejs.org/)\n\n安装完成后，打开您的终端（Terminal\
  \ 或命令提示符 CMD/PowerShell）运行以下命令，验证是否安装成功：\n```bash\nnode -v\nnpm -v\n```\n\n---\n\n### 2. 拷贝代码并初始化 (Installation)\n\
  \n1. 下载此项目源码包并解压到您的本地目录。\n2. 打开终端，并切换工作目录进入该文件夹所在的根目录：\n   ```bash\n   cd yanan-hospital-radiotherapy-system\n\
  \   ```\n3. 在本地执行依赖包拉取，自动安装项目所需的 React 19、Vite、Tailwind CSS、Firebase SDK、Lucide 图标包等模块：\n   ```bash\n\
  \   npm install\n   ```\n\n---\n\n### 3. 本地启动开发服务器 (Local Dev Server)\n\n执行以下命令，在本地构建即时开发服务器：\n\n```bash\n\
  npm run dev\n```\n\n运行成功后，终端会打印出类似以下的信息：\n```text\n  VITE v6.2.3  ready in 321 ms\n\n  ➜  Local:   http://localhost:3000/\n\
  \  ➜  Network: http://192.168.1.100:3000/\n```\n打开任一主流浏览器（Chrome, Edge, Safari），访问 `http://localhost:3000`\
  \ 便可以直接体验系统。\n\n> **\U0001F4A1 电脑大屏与手机端跨设备联合调试方法**\n>\n> 确保您的手机和电脑连接在**同一个局域网/Wi-Fi 下**。直接在手机浏览器中输入终端显示的\
  \ `Network` 共享地址（如 `http://192.168.1.100:3000`），即可立刻在手机上交互测试，轻松横屏/竖屏自由滑动浏览！\n\n---\n\n### 4. 生产环境打包\
  \ (Build)\n\n如果您决定将系统正式发布到医院的私有服务器、局域网静态服务器或者各类公有云上，可以通过以下命令进行压缩与优化打包：\n\n```bash\nnpm run build\n```\n\
  \n* 构建成功后，会在根目录下生成一个名为 `dist` 的打包文件夹。\n* 该文件夹包含了极度压缩优化的 HTML、CSS 和 JavaScript 静态资源。您可直接将 `dist` 下的全部内容复制到任何静态\
  \ Web 服务器（如 Nginx、Apache、IIS）进行分发托管。\n\n若要在打包后在本地预览生产版本的效果，可执行：\n```bash\nnpm run preview\n```\n\n---\n\
  \n## \U0001F510 数据库配置说明 (Firebase Integration)\n\n为了保证医疗数据的持久性、高可用与安全保障，本系统默认接入了 **Firebase Firestore**\
  \ 进行底层数据存储。\n\n在本地运行时，系统会读取根目录下的 **`firebase-applet-config.json`** 文件进行云端握手初始化：\n\n### 项目自带测试配置\n本项目目前内置了云端演示数据库。若您只是进行本地体验或流程演示，**无需进行任何额外设置**，直接执行\
  \ `npm run dev` 即可。若云端由于网络问题无法畅通，系统会自动无缝切换至 **LocalStorage 本地高抗离线脱机模式**，完全不影响您的任何数据录入。\n\n### 更改为医院私有数据库\n\
  如需将系统切换至医院专属的 Firebase 项目：\n\n1. 打开 [Firebase 控制台 (Firebase Console)](https://console.firebase.google.com/)\
  \ 创建新项目。\n2. 创建并启用 **Cloud Firestore** 数据库，进入“规则 (Rules)”将策略配置为本项目同级的 `firestore.rules`。\n3. 在项目设置中添加“Web\
  \ 应用程序”，获取对应的 JSON 端点配置。\n4. 打开你本地的 `firebase-applet-config.json`，将对应的值替换为您自己数据库实例的参数（如 `apiKey`, `authDomain`,\
  \ `projectId` 等）即可：\n   ```json\n   {\n     \"apiKey\": \"您的API密匙\",\n     \"authDomain\": \"您的Domain.firebaseapp.com\"\
  ,\n     \"projectId\": \"您的项目ID\",\n     \"storageBucket\": \"您的存储桶名\",\n     \"messagingSenderId\"\
  : \"您的通知码\",\n     \"appId\": \"您的应用ID\"\n   }\n   ```\n\n---\n\n## \U0001F4C2 项目模块结构树简览\n\n```text\n\
  ├── firebase-applet-config.json  # Firebase 链接参数\n├── firebase-blueprint.json      # 数据库基础架构描述\n├──\
  \ firestore.rules              # 数据库安全访问控制白名单\n├── index.html                   # 系统单页应用根入口\n├── package.json\
  \                 # 依赖声明与运行脚本命令(dev/build/preview)\n├── src\n│   ├── App.tsx                  # 核心应用逻辑、病患管理系统交互主视图（包含排版重构）\n\
  │   ├── main.tsx                 # React 基底 DOM 挂载入口\n│   ├── index.css                # Tailwind 核心注入与定制全局滚动条\n\
  │   └── types.ts                 # 严格类型安全性定义（包含患者、靶区信息标准）\n├── tsconfig.json                # TypeScript\
  \ 编译器定制规范\n└── vite.config.ts               # Vite 打包优化管道规则\n```\n\n---\n\n## \U0001F4CB 常见维护及排障指南 (FAQ)\n\
  \n* **Q：在执行 `npm install` 或者是编译时报错提示模块不存在？**\n  * **A**：通常是由于本地 Node 版本过低。请确认您的 Node.js 版本号不低于 v18，其次可以执行\
  \ `npm run clean` 去除残留，重新执行 `npm install` 即可。\n* **Q：移动端真机测试无法滚动或者卡顿？**\n  * **A**：本系统已经注入了流畅的滑动自适应机制（`-webkit-overflow-scrolling:\
  \ touch`）。请确保您没有在移动端浏览器上锁定触控滚动，在表格上方按住横向划动，即可完整且平移流畅地浏览放疗技术与靶区细节。\n\n---\n\n*如在使用、二次排版设计或本地打包部署过程中遇到任何其他问题，请随时联系系统管理维护人员。*\n"

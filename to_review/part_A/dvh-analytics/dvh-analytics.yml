readme_excerpt: "<h3 align=\"center\">\n  <img src=\"https://user-images.githubusercontent.com/4778878/30754005-b7a7e808-9f86-11e7-8b0f-79d1006babdf.jpg\"\
  \ alt=\"fastlane Logo\" />\n</h3>\n\n# DVH Analytics\n<img src='https://user-images.githubusercontent.com/4778878/37943568-11f856fc-3146-11e8-85ec-4c0d3cbf2492.png'\
  \ align='right' width='300' alt=\"DVH Analytics screenshot\">  \n \nDVH Analytics is a software application\
  \ to help radiation oncology departments build an in-house database of treatment planning data \nfor\
  \ the purpose of historical comparisons and statistical analysis. This code is still in development.\
  \  Please contact the developer if  you are interested in testing or collaborating.\n\nThe application\
  \ builds a SQL database of DVHs and various planning parameters from DICOM files \n(i.e., Plan, Structure,\
  \ Dose). Since the data is extracted directly from DICOM files, we intend\nto accommodate an array of\
  \ treatment planning system vendors.\n\nIn addition to viewing DVH data, this software provides methods\
  \ to:\n\n- download queried data\n- view plan contours\n- create time-series plots of various planning\
  \ and dosimetric variables\n- calculate correlations\n- and generate multi-variable linear regressions.\n\
  \n\nThe code is built upon these core libraries:\n* [pydicom](http://code.google.com/p/pydicom/) - Read,\
  \ modify and write DICOM files with python code\n* [dicompyler-core](https://pypi.python.org/pypi/dicompyler-core)\
  \ - Extensible radiation therapy research platform and viewer for DICOM and DICOM RT\n* [Bokeh](http://bokeh.pydata.org/en/latest/index.html)\
  \ - Interactive Web Plotting for Python\n\nFor installation instructions of the source code, see our\
  \ [installation notes](https://github.com/cutright/DVH-Analytics/blob/master/install_notes.md).\n\n\n\
  ### Docker\nWe're working on an easier way to deploy DVH Analytics [here](https://github.com/cutright/DVH-Analytics-Docker).\n\
  \nSome installation challenges with DVH Analytics that are resolved with Docker:\n* Complete DVH Analytics\
  \ [docker image](https://hub.docker.com/r/cutright/dvh-analytics/) is used.\n* A workaround for [this](https://github.com/bokeh/bokeh/issues/7771)\
  \ Bokeh bug is applied.\n* Postgres SQL is included (so no need for setting up a database and user access).\n\
  * All three servers for the main, admin, and settings views are started.\n\n\n### Citing DVH Analytics\n\
  DOI: [https://doi.org/10.1002/acm2.12401](https://doi.org/10.1002/acm2.12401)  \n“DVH Analytics: A DVH\
  \ Database for Clinicians and Researchers,” J. App. Clin. Med. Phys. - JACMP-2018-01083\n\n\n### New\
  \ MLC Analyzer Module added\nMLC Analyzer module added to DVH Analytics. Still in development, current\
  \ complexity score based on:\nYounge et al. Penalization of aperture complexity in inversely planned\
  \ volumetric modulated arc therapy.  \nMed Phys. 2012;39(11):7160–70.\n<h3 align=\"left\">\n<img src='https://user-images.githubusercontent.com/4778878/37878772-09faa32a-303c-11e8-8732-39346f516ec8.png'\
  \ width='600' alt=\"DVH Analytics screenshot\">  \n</h3>\n\n## Dependencies\n* [Python](https://www.python.org)\
  \ 2.7  \n    * Python 3 not currently supported\n    * [Future](https://pypi.python.org/pypi/future)\
  \ 0.16.0\n        * for bridging gap between 2.7 and 3.x\n        * we're still working on the Python\
  \ 3 transition for DVH Analytics\n* [PostgreSQL](https://www.postgresql.org/) and [psycopg2](http://initd.org/psycopg/)\n\
  * [SciPy](https://scipy.org)\n* [pydicom](https://github.com/darcymason/pydicom) 0.9.9\n* [shapely](https://github.com/Toblerity/Shapely)\
  \ 1.6b2\n* [Statsmodels](https://github.com/statsmodels/statsmodels) 0.8.0\n* [dicompyler-core](https://pypi.python.org/pypi/dicompyler-core)\
  \ 0.5.3\n    * requirements per [developer](https://github.com/bastula)\n        * [numpy](http://www.numpy.org/)\
  \ 1.2 or higher\n        * [pydicom](https://github.com/pydicom/pydicom) 0.9.9 or higher\n         \
  \   * pydicom 1.0 is preferred and can be installed via pip using: pip install https://github.com/darcymason/pydicom/archive/master.zip\n\
  \        * [matplotlib](http://matplotlib.sourceforge.net/) 1.3.0 or higher (for DVH calculation)\n\
  \        * [six](https://pythonhosted.org/six/) 1.5 or higher\n* [Bokeh](http://bokeh.pydata.org/en/latest/index.html)\
  \ 0.13.0\n    * requirements per [developer](http://bokeh.pydata.org/en/latest/docs/installation.html)\n\
  \        * [NumPy](http://www.numpy.org/)\n        * [Jinja2](http://jinja.pocoo.org/)\n        * [Six](https://pythonhosted.org/six/)\n\
  \        * [Requests](http://docs.python-requests.org/en/master/user/install/)\n        * [Tornado](http://www.tornadoweb.org/en/stable/)\
  \ >= 4.0, <=4.4.2\n        * [PyYaml](https://pypi.python.org/pypi/pyaml)\n        * [DateUtil](https://pypi.python.org/pypi/python-dateutil)\n"

readme_excerpt: "# Lung Cancer Classification and Segmentation with GUI\n\nDeep learning system for classifying\
  \ lung CT scans and segmenting tumor regions, \ndeployed via an interactive Streamlit application.\n\
  \n## Dataset\n- **Classification:** [Chest CT-Scan Images Dataset](https://www.kaggle.com/datasets/mohamedhanyyy/chest-ctscan-images)\
  \ by Mohamed Hany (Kaggle) — 4-class CT scan dataset (~1000 images)\n- **Segmentation:** [Lung Cancer\
  \ Segmentation Dataset](https://www.kaggle.com/datasets/rasoulisaeid/lung-cancer-segment) by rasoulisaeid\
  \ (Kaggle) — tumor-annotated CT scans\n  \n## Project Structure\n- `classification_code/` — CT scan\
  \ classification (EfficientNetV2-L)\n- `segmentation_code/` — Tumor segmentation (U-Net + ResNet34)\n\
  - `streamlit_app/` — GUI for real-time diagnosis\n- `models/` — Trained model weights (not included\
  \ in repo, see below)\n\n## Results\n- Classification Accuracy: 87.50%\n- Segmentation Dice Score: 0.8154\n\
  - Segmentation IoU: 0.6884\n\n## Model Weights\nModel files are too large for GitHub. Download here:\n\
  - [EfficientNetV2-L (classification)](https://drive.google.com/file/d/1IkfjRVFqf51ETB7Iz8H-bv3f8nTI8D6Q/view?usp=sharing)\n\
  - [U-Net ResNet34 (segmentation)](https://drive.google.com/file/d/1x5J1ieGw9DTBn_Lu7ETA6wFjxburqTuw/view?usp=sharing)\n\
  \nAfter downloading, place both files inside a `models/` folder in the project root.\n\n## How to Run\n\
  ```bash\npip install -r requirements.txt\ncd streamlit_app\nstreamlit run app.py\n```\n"

readme_excerpt: "# EM Algorithm and Its Applications: MRI Image Segmentation\n\n## Overview\n\nThis project\
  \ is a group academic study that implements the Expectation–Maximization (EM) algorithm for MRI image\
  \ segmentation. The objective is to classify MRI images into tumor and non-tumor regions using probabilistic\
  \ modeling and iterative parameter estimation.\n\nThe study combines image preprocessing techniques\
  \ with statistical learning methods to improve segmentation accuracy.\n\n---\n\n## Project Year: 2024\n\
  \n## Objectives\n\n* Apply EM algorithm for image segmentation\n* Preprocess MRI images for analysis\n\
  * Perform contrast enhancement and noise reduction\n* Model pixel intensities using probabilistic distributions\n\
  * Classify regions into tumor and non-tumor classes\n\n---\n\n## Data\n\nThe dataset consists of MRI\
  \ scan images used for segmentation tasks, including:\n\n* Brain MRI images\n* Pixel intensity distributions\n\
  * Labeled tumor and non-tumor regions (where available)\n\n---\n\n## Methodology\n\n### Image Preprocessing\n\
  \n* Noise removal\n* Contrast enhancement\n* Normalization of pixel intensities\n\n### EM Algorithm\n\
  \n* Initialization of parameters\n* Expectation step (E-step) for probability estimation\n* Maximization\
  \ step (M-step) for parameter updates\n* Iterative convergence until stability\n\n### Classification\n\
  \n* Probabilistic assignment of pixels\n* Tumor vs non-tumor segmentation\n\n---\n![Tumor Segmentation](Latex/Images/Figure_2%20Segmentation%20into%20tumor%20and%20non%20tumor%20region.png)\n\
  \n**Figure 2: Segmentation into Tumor and Non-Tumor Region**\n\n![Final Output](Latex/Images/Figure_3_Final%20Output.png)\n\
  \n**Figure 3: Final Output**\n## Key Contributions\n\n* Implemented EM algorithm for medical image segmentation\n\
  * Developed probabilistic modeling framework for MRI data\n* Improved segmentation using preprocessing\
  \ techniques\n* Performed tumor detection using unsupervised learning\n\n---\n\n## Tools and Technologies\n\
  \n* Python / R\n* NumPy, SciPy\n* Image processing libraries\n* Statistical modeling\n* Expectation–Maximization\
  \ algorithm\n\n---\n\n## Repository Structure\n\n```text id=\"em_struct\"\nREADME.md\nEm.pdf\nLatex/\
  \                   \nLatex/Codes/\nLatex/Images/\n```\n\n---\n\n## Authors and Contributions\n\nThis\
  \ project was completed as a group academic project. \n\n### Authors\n\n* Rahul Ganguly(B.Stat ISI Kolkata)\n\
  * [Other authors as listed in the project report]\n\n---\n\n### Individual Contributions (Rahul Ganguly)\n\
  \nRahul Ganguly contributed to:\n\n* Implementation of the EM algorithm\n* Image preprocessing and contrast\
  \ enhancement\n* Probabilistic modeling of pixel intensities\n* Iterative parameter estimation using\
  \ EM steps\n* Tumor vs non-tumor classification logic\n* Visualization and result interpretation\n*\
  \ Preparation of analytical sections of the report\n\n---\n\n## Project Summary\n\nThis study demonstrates\
  \ the application of the Expectation–Maximization algorithm for MRI image segmentation, enabling probabilistic\
  \ classification of tumor and non-tumor regions using statistical learning techniques.\n"

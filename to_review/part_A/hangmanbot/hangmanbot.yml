readme_excerpt: "# \U0001F3AE Hangman Bot\n\nA Discord bot that lets you play **Hangman** in both **single-player**\
  \ and **multiplayer** modes. Challenge yourself or invite friends to compete in guessing words — all\
  \ powered by **Discord.js** and JavaScript.\n\n## ✨ Features\n\n- **Single Player Mode**: Play hangman\
  \ solo.\n- **Multiplayer Mode**: Challenge other users in your server.\n- **Word Bank**: Randomized\
  \ words for replayability.\n- **Interactive Gameplay**: Real-time updates with embeds/messages.\n\n\
  ## \U0001F6E0️ Tech Stack\n\n- Discord.js — for Discord API interactions\n- Node.js — runtime environment\n\
  - JavaScript — core language\n\n## \U0001F4E6 Installation\n\n1. Clone the repository:\n   ```bash\n\
  \   git clone https://github.com/open-devhub/hangmanbot.git\n   cd hangmanbot\n   ```\n2. Install dependencies:\n\
  \   ```bash\n   npm install\n   ```\n3. Create a `.env` file and add your bot token:\n   ```bash\n \
  \  DISCORD_TOKEN=your-bot-token-here\n   ```\n4. Start the bot:\n   ```bash\n   npm start\n   ```\n\n\
  ## \U0001F680 Usage\n\n- **Start a game**:  \n  `/play` → begins a single-player game.  \n  `/challenge\
  \ <@user> <word> [hint]` → challenge another user.\n\n- **Gameplay**:  \n  Guess letters by selecting\
  \ from select menu.  \n  The bot updates the word, lives remaining, and progress.\n"

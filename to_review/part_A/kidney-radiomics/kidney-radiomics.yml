readme_excerpt: "# Cause \nThere are some reasons that you should perform **Feature Extraction** stage\
  \ with a python script named \"feature_extraction.py\".  \n  \n## 1. Incompatible Dependency \nIf you\
  \ running iPython notebook (**\"kidney_radiomics.ipynb\"**) with only python version 3.7 and install\
  \ pyradiomics, you could perform **Feature Extraction** stage with iPython notebook.  \n  \nHowever,\
  \ sklearn version 1.1+, which could be only compatible with only python 3.8+, only support ```n_features_to_select='auto'```\
  \ option in sklearn.feature_selection.SequentialFeatureSelector.  \n  \nIn other words, **Feature Extraction**\
  \ stage and **Feature Selection 2 & Model Selection** stage could not be run in a single iPython notebook\
  \ with a single environment.  \n  \n  \n## 2. Multiprocessing \nIt's because iPython notebook do not\
  \ support multiprocess which could dramatically speed up feature extraction process.  \n  \nPerforming\
  \ **Feature Extraction** stage with a single process require too long time to extract radiomics features.\
  \ \n  \nThus, it is highly recommend to perform **Feature Extraction** with a python script named \"\
  feature_extraction.py\" before running code blocks in iPython notebook (**\"kidney_radiomics.ipynb\"\
  **).  \n\n\n# Environment (anaconda)  \nFor **Feature Extraction** stage, use **\"feature_extracion.yml\"\
  ** which based on ```python == 3.7``` and contain ***pyradiomics*** python module.  \n  \nFor running\
  \ iPython notebook (**\"kidney_radiomics.ipynb\"**), use **\"kidney_radiomics.yml\"** which based on\
  \ ```python >= 3.8``` and contain ```scikit-learn >= 1.1.0```.\n  \n\n# Usage \n## 1. Performing Feature\
  \ Extraction with a stand alone python script \n```\n$python3 feature_extraction.py --n_process 4 --param_config\
  \ /Users/wangheehwan/Desktop/kidney_radiomics/pipeline/params/Params2.yaml --nifti_Dir /Users/wangheehwan/Desktop/kidney_radiomics/NifTi\
  \ --mask_Dir /Users/wangheehwan/Desktop/kidney_radiomics/Segmentation --save_Dir /Users/wangheehwan/Desktop/kidney_radiomics/pipeline/result\n\
  ```  \n  \n## 2. Running code blocks in iPython notebook while skipping Feature Extraction stage\nrunning\
  \ code blocks in the following procedure:   \n- import modules and functions \n- perform **Split Dataset**\
  \ stage. In this stage, loading csv files resulted from **Feature Extraction** stage and meta data files\n\
  - perform machine learning experiments \n- visualize the result\n\n\n\n"

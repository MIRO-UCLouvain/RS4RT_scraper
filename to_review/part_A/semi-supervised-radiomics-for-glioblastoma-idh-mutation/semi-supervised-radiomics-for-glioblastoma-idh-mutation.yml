readme_excerpt: "# Semi-Supervised-Radiomics-for-Glioblastoma-IDH-Mutation\n\n**Title:** Semi-Supervised\
  \ Radiomics for Glioblastoma IDH Mutation: Limited Labels, Data Sensitivity, and SHAP Interpretation\
  \  \n\n\n## \U0001F4D6 Overview\nThis repository contains the code, supplemental files, and results\
  \ for our paper:  \n\n*Semi-Supervised Radiomics for Glioblastoma IDH Mutation: Limited Labels, Data\
  \ Sensitivity, and SHAP Interpretation.*  \n\nGlioblastoma (GBM) is one of the most aggressive brain\
  \ tumors. **IDH mutation status** is a crucial prognostic biomarker, but conventional testing requires\
  \ invasive biopsies.  \nThis work introduces a **semi-supervised learning (SSL) framework** that leverages\
  \ **multi-sequence MRI radiomics** (T1, T2, T1CE, FLAIR) to predict IDH status.  \n\nWe systematically\
  \ compared **supervised (SL)** and **semi-supervised (SSL)** models across **8 multicenter datasets**\
  \ (n = 1,329 patients) and incorporated **SHAP-based interpretation** for feature importance analysis.\
  \  \n\n\n## \U0001F9EA Key Contributions\n- ✅ First large-scale multicenter SSL framework for IDH prediction\
  \  \n- ✅ Integration of **38 feature selection/attribute extraction methods** and **24 classifiers**\
  \  \n- ✅ Comprehensive **cross-validation and external validation** (UCSF-PDGM, UPENN-GBM, IvyGAP, TCGA-GBM,\
  \ TCGA-LGG)  \n- ✅ Data sensitivity analysis under varying labeled/unlabeled proportions  \n- ✅ SHAP\
  \ interpretability to identify **stable and biologically relevant radiomic biomarkers**  \n\n\n## \U0001F4CA\
  \ Main Results\n\n**Best SSL model (RFE + SVM):**\n- Cross-validation accuracy: **0.93 ± 0.01**  \n\
  - External accuracy: **0.75 ± 0.02**  \n- High F1 (0.94 CV, 0.74 test) and AUC (0.97 CV, 0.84 test)\
  \  \n\n**Best SL model (RFE + Complement Naïve Bayes):**\n- Cross-validation accuracy: **0.90 ± 0.02**\
  \  \n- External accuracy: **0.80 ± 0.006**  \n\n**Key findings:**\n- Multimodal MRI (**T1+T2+T1CE+FLAIR**)\
  \ consistently outperformed single-sequence models  \n- SSL reduced sensitivity to dataset size, enabling\
  \ robust performance with limited labels  \n- SHAP analysis highlighted the importance of **FO_RMS (T1CE)**\
  \ and **wavelet-derived features**  \n\n\n## \U0001F4C2 Repository Structure\n      ├── Classification\
  \ Code.ipynb\n      ├── Supplemental File 1.xlsx   # SL – FLAIR (Sheets 1–4: Selected_Features, Best_Parameters,\
  \ Aggregated_Results, Aggregated_Std_Results)\n      ├── Supplemental File 2.xlsx   # SL – Combined\
  \ sequences (Sheets 1–4 as above)\n      ├── Supplemental File 3.xlsx   # SL – T1\n      ├── Supplemental\
  \ File 4.xlsx   # SL – T1CE\n      ├── Supplemental File 5.xlsx   # SL – T2\n      ├── Supplemental\
  \ File 6.xlsx   # SSL – FLAIR\n      ├── Supplemental File 7.xlsx   # SSL – Combined sequences\n   \
  \   ├── Supplemental File 8.xlsx   # SSL – T1\n      ├── Supplemental File 9.xlsx   # SSL – T1CE\n \
  \     └── Supplemental File 10.xlsx  # SSL – T2\n\n\n## \U0001F4D1 Citation\nIf you use this repository\
  \ in your work, please cite:  \n\nPouria, A.H., Jabarzadeh Ghandilu, S., Taeb, S., Mehrnia, S.S., Oveisi,\
  \ M., Hacihaliloglu, I., Rahmim, A., Salmanpour, M.R.  \n*Semi-Supervised Radiomics for Glioblastoma\
  \ IDH Mutation: Limited Labels, Data Sensitivity, and SHAP Interpretation.* 2025.  \n\n## \U0001F64F\

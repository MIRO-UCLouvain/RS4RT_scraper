readme_excerpt: "# Brain MRI Tumor Segmentation & Analysis\r\n\r\nA MATLAB project for brain MRI tumor\
  \ segmentation, visualization, and quantitative image analysis.\r\n\r\n## Project Overview\r\n\r\nThis\
  \ project analyzes a brain MRI image using a corresponding tumor mask. The mask is used to identify\
  \ the tumor region and extract quantitative and visual features from the segmented area.\r\n\r\nThe\
  \ project demonstrates fundamental medical image processing techniques using MATLAB.\r\n\r\n## Methods\r\
  \n\r\nThe project includes:\r\n\r\n- MRI image and tumor mask visualization\r\n- Tumor mask overlay\
  \ on the MRI image\r\n- Binary image segmentation\r\n- Tumor area calculation\r\n- Tumor area percentage\
  \ calculation\r\n- Bounding box extraction\r\n- Tumor centroid calculation\r\n- Tumor width and height\
  \ estimation\r\n- Tumor pixel intensity analysis\r\n- Intensity histogram\r\n- Mean, minimum, and maximum\
  \ intensity\r\n- Standard deviation of tumor intensity\r\n- Comparison between tumor and whole-image\
  \ mean intensity\r\n\r\n## MATLAB Functions Used\r\n\r\nSome of the main MATLAB functions used in this\
  \ project are:\r\n\r\n- `imread`\r\n- `imshow`\r\n- `subplot`\r\n- `regionprops`\r\n- `rectangle`\r\n\
  - `plot`\r\n- `text`\r\n- `histogram`\r\n- `mean`\r\n- `min`\r\n- `max`\r\n- `std`\r\n- `numel`\r\n\r\
  \n## Results\r\n\r\nFor the analyzed MRI image:\r\n\r\n- Tumor area: **3207 pixels**\r\n- Tumor percentage:\
  \ **1.22%**\r\n- Tumor width: **63 pixels**\r\n- Tumor height: **67 pixels**\r\n- Tumor centroid: **(247.85,\
  \ 220.03)**\r\n- Mean tumor intensity: **116.28**\r\n- Minimum tumor intensity: **37**\r\n- Maximum\
  \ tumor intensity: **161**\r\n- Tumor intensity standard deviation: **19.57**\r\n- Mean image intensity:\
  \ **37.75**\r\n\r\n## Visualization\r\n\r\nThe project generates visualizations of:\r\n\r\n1. The original\
  \ MRI image\r\n2. The tumor mask\r\n3. The tumor mask overlaid on the MRI\r\n4. The binary tumor segmentation\r\
  \n5. The tumor bounding box\r\n6. The tumor centroid\r\n7. The distribution of tumor pixel intensities\r\
  \n\r\n## Purpose\r\n\r\nThe purpose of this project is to practice MATLAB-based medical image processing\
  \ and develop a basic understanding of how segmented regions in medical images can be analyzed quantitatively.\r\
  \n\r\n## Tools\r\n\r\n- MATLAB\r\n- Image Processing Toolbox\r\n\r\n## Disclaimer\r\n\r\nThis project\
  \ is intended for educational and portfolio purposes only. The analysis is not intended for clinical\
  \ diagnosis or medical decision-making."

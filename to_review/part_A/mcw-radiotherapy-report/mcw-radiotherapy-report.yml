readme_excerpt: '# MCW-Radiotherapy-Report

  Radiotherapy Report Generator for the Medical College of Wisconsin


  Program returns report detailing changes in radiotherapy treatment criteria over across .hyp files generated
  by treatment system.


  This program was made using Java and the Mim Radiotherapy library. ic1.hyp shows an example of a file
  generated by the treatment system. Sample report IMRT constraints shows an example of a report generated
  by the system.


  NOTICE: Build path has yet to be attached and code is a bit disorganized. This will be resolved.

  '

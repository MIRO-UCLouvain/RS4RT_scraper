readme_excerpt: "# braggpeak_sampler\n\nSimulation and Beamtime data analysis of the Braggpeak Sampler.\n\
  \n## Description\nGeant4 simulation of the Braggpeak Sampler for 220 MeV Protons with no target, a RW3\
  \ target (equivalent to 5cm of water) and a LN300 target (using DCM files where 1/4 of the voxels are\
  \ water and 3/4 are air).\nBeamtime data analysis with root. \n\n## Project status\nIn progress\n"

readme_excerpt: "# MSc-Project-2025\n### Synthetic Lung Tumor Generation and U-Net Segmentation\nThis\
  \ repository contains an automated pipeline for generating synthetic lung tumor CT images and corresponding\
  \ segmentation masks, developed to support deep learning model training in limited-data settings. The\
  \ project also includes Google Colab notebooks for 2D U-Net segmentation experiments using real and\
  \ synthetic data.\n\n\n## Project Overview\n\nThis project is divided into two main components:\n\n\
  1. Synthetic Tumor Generation Pipeline\n2. U-Net Segmentation Training (4 Experimental Trials)\n\n##\
  \ Code Files\n**MSc project tools file.zip** has the Synthetic Tumor Generation Pipeline code files\n\
  \n- **synthetic_poisson_enhanced.py**\nMain script for generating synthetic tumor patches using Poisson\
  \ blending and 2D Tukey windowing. Masks are generated via SAM and post-processed.\n\n- **extract_real_tumor_slices_and_masks.py**\n\
  Extracts real tumor slices and creates binary masks from the Lung-PET-CT-Dx dataset using SAM.\n\n-\
  \ **run_viewer.py**\nTool for visualizing bounding boxes from XML annotations on top of DICOM images.\n\
  \n- **requirements.txt**\nContains the Python environment dependencies (Anaconda environment).\n\n-\
  \ **Two utility functions** —  `getUID`, and `get_gt`  — were used in this project. These scripts were\
  \ sourced from the official Python code provided with the publicly available [Lung-PET-CT-Dx](https://www.cancerimagingarchive.net/collection/lung-pet-ct-dx/)\
  \ dataset by The Cancer Imaging Archive (TCIA).\n\n\n##  Data Sources\n\nThis project uses the following\
  \ datasets:\n\n- **Tumor Data**  \n  Cropped tumor regions were extracted from the publicly available\
  \ [Lung-PET-CT-Dx](https://www.cancerimagingarchive.net/collection/lung-pet-ct-dx/) dataset, provided\
  \ by The Cancer Imaging Archive (TCIA). Tumor annotations are stored as XML files in PASCAL VOC format.\n\
  \n- **Healthy CT Scans**  \n  Healthy lung CT images were obtained from the [ICASSP 2024 SPGC-3D CBCT\
  \ dataset](https://sites.google.com/view/icassp2024-spgc-3dcbct/data?authuser=0). Access to this dataset\
  \ may require a request to the authors.\n\n- **Segmentation Model (SAM)**  \n  The Segment Anything\
  \ Model (SAM) for lung CT segmentation was adapted from the open-source repository [rekalantar/MedSegmentAnything_SAM_LungCT](https://github.com/rekalantar/MedSegmentAnything_SAM_LungCT).\n\
  \n- **Annotation Viewer Tool**  \n  Bounding box annotations were visualized using the TCIA-provided\
  \ toolkit, available [here](https://www.cancerimagingarchive.net/wp-content/uploads/VisualizationTools.zip).\n\
  \n## U-Net Training\n- Training, validation, and testing were carried out across four trials to compare\
  \ the performance of real vs. synthetic data.\n- The U-Net architecture is based on the 2D implementation\
  \ proposed by Ronneberger et al.\n- All training experiments are provided as Google Colab notebooks\
  \ in this repository.\n- \n## Experimental Trials\n\n| Trial | Description |\n|-------|-------------|\n\
  | **Trial 1** | Trained on raw synthetic images with unrefined segmentation masks. |\n| **Trial 2**\
  \ | Used enhanced synthetic images and refined masks via morphological closing. |\n| **Trial 3** | Filtered\
  \ unrealistic samples from Trial 2 to improve data quality. |\n| **Trial 4** | Baseline model trained\
  \ only on real tumor images and masks. |\n\n## Google Colab Notebooks\nFour notebooks ( Trial#.ipynb)\
  \ for U-Net training, validation, and testing under different experimental conditions.\nClick below\
  \ to open them in Google Colab:\n\n- [Trial 1 Notebook](https://drive.google.com/file/d/199nOQGTIj9nILdAsfkH4EUY_6imxyCEt/view?usp=sharing)\n\
  - [Trial 2 Notebook](https://drive.google.com/file/d/1mFzYeoCPGkR8Q7XqmSUeuq6nDSZofWfs/view?usp=sharing)\n\
  - [Trial 3 Notebook](https://drive.google.com/file/d/1OqW-jlm4M44LsGYgKwq7uu1zdjenEi_k/view?usp=sharing)\n\
  - [Trial 4 Notebook](https://drive.google.com/file/d/16LHqykL0fGPLlZu1At0g4MCHo-XwOUy3/view?usp=sharing)\n\
  \n"

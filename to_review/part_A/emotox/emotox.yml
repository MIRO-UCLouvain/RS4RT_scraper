readme_excerpt: "# \U0001F9E0 EmoTox — Hybrid Toxicity Detection Using Emotion and Sarcasm Analysis\n\n\
  A hybrid deep learning toxicity detection system built using **TensorFlow**, **Keras**, **Word2Vec**,\
  \ **CNN-LSTM**, **BiLSTM with Multi-Head Attention**, and **Streamlit**.\n\nEmoTox classifies text comments\
  \ as **toxic** or **non-toxic** by combining emotion classification, sarcasm detection, and a final\
  \ toxicity meta-classifier.\n\nUnlike basic keyword-based toxicity detectors, EmoTox does not only look\
  \ for offensive words. It also analyzes the **emotional tone**, **sarcastic meaning**, and **contextual\
  \ pattern** of a comment before making the final prediction.\n\n\U0001F517 **Live Demo:** Add your Streamlit\
  \ demo link here\n\n> **Important Note About the Live Demo:**  \n> The live demo is mainly intended\
  \ to demonstrate the full machine learning pipeline, model loading, tokenizer handling, custom Keras\
  \ layer usage, and Streamlit deployment.\n>\n> The model performed well during training and evaluation,\
  \ but the live demo may not always classify every input correctly, especially very short or direct profanity-only\
  \ comments. This project is best viewed as an **academic deep learning prototype**, not a production-ready\
  \ moderation system.\n\n---\n\n# \U0001F680 Features\n\n### \U0001F9E0 Hybrid Toxicity Detection\n-\
  \ Classifies text comments as **toxic** or **non-toxic**\n- Uses emotion and sarcasm as supporting signals\n\
  - Designed to detect more than obvious toxic keywords\n- Helps identify contextual toxicity, passive-aggressive\
  \ wording, and indirect harmful comments\n\n### ❤️ Emotion Classification\n- Uses a **CNN-LSTM** deep\
  \ learning model\n- Detects emotional patterns in text\n- Helps identify emotional cues such as anger,\
  \ sadness, fear, joy, and other emotion-related signals\n- Produces an emotion probability vector used\
  \ by the final toxicity classifier\n\n### \U0001F60F Sarcasm Detection\n- Uses a **Bidirectional Long\
  \ Short-Term Memory (BiLSTM)** model\n- Includes **Multi-Head Attention** through a custom Keras layer\n\
  - Helps detect sarcastic or indirect negative meaning\n- Useful for comments that appear positive on\
  \ the surface but are actually hostile or insulting\n\n### \U0001F517 Ensemble Learning\n- Combines\
  \ the outputs of the emotion model and sarcasm model\n- Uses probability vectors as additional features\n\
  - Final toxicity prediction is based on multiple contextual signals\n- Improves over simple keyword-based\
  \ or lexicon-based toxicity detection\n\n### \U0001F9EA Keras-Based Deep Learning Pipeline\n- Built\
  \ using **TensorFlow** and **Keras**\n- Uses saved `.keras` model files\n- Loads a custom Keras layer\
  \ called `SelfAttentionBlock`\n- Uses a saved Keras tokenizer for inference consistency\n\n### \U0001F310\
  \ Streamlit Web Demo\n- Simple web interface for testing comments\n- Loads trained model files\n- Processes\
  \ user input through the same model pipeline\n- Displays toxicity confidence score and final classification\n\
  \n---\n\n# \U0001F9E0 How It Works\n\n```text\nUser enters a comment\n        ↓\nText is cleaned and\
  \ preprocessed\n        ↓\nKeras tokenizer converts words into token IDs\n        ↓\nToken IDs are padded\
  \ to a fixed sequence length\n        ↓\nWord2Vec embedding representation is used by the trained model\n\
  \        ↓\nEmotion model extracts emotional meaning\n        ↓\nSarcasm model extracts sarcastic/contextual\
  \ meaning\n        ↓\nProbability outputs are combined\n        ↓\nMeta-classifier predicts final toxicity\
  \ score\n        ↓\nSystem returns Toxic or Non-toxic\n```\n\nIn simple terms, EmoTox first prepares\
  \ the text, converts it into numbers, analyzes emotion and sarcasm, then uses those signals to decide\
  \ whether the comment is toxic.\n\n---\n\n# \U0001F6E0️ Tech Stack\n\n| Technology | Purpose |\n|---|---|\n\
  | Python | Core programming language |\n| TensorFlow | Deep learning framework |\n| Keras | Model building,\
  \ training, saving, and loading |\n| Streamlit | Web app interface and deployment |\n| Word2Vec | Word\
  \ embedding representation |\n| Gensim | Word2Vec model handling |\n| CNN-LSTM | Emotion classification\
  \ architecture |\n| BiLSTM | Sarcasm sequence modeling |\n| Multi-Head Attention | Focuses on important\
  \ contextual words |\n| NumPy | Numerical operations |\n| Pandas | Dataset handling and analysis |\n\
  | Scikit-learn | Evaluation metrics and data splitting |\n| NLTK | Text preprocessing support |\n| GitHub\
  \ | Version control |\n| Git LFS | Storage for large model files |\n| Streamlit Cloud | Deployment platform\
  \ |\n\n---\n\n# \U0001F3D7️ Architecture\n\n## Full System Pipeline\n\n```text\nInput Text Dataset\n\
  \        ↓\nData Preprocessing\n        ↓\nKeras Tokenization\n        ↓\nWord2Vec Embedding Layer\n\
  \        ↓\nTrain / Validation / Test Split\n        ↓\nEmotion Model + Sarcasm Model\n        ↓\nConcatenated\
  \ Probability Vectors\n        ↓\nMeta-Classifier\n        ↓\nFinal Toxicity Prediction\n```\n\n---\n\
  \n## Dataset Pipeline\n\n```text\nWikipedia Toxicity Dataset\nSARC Sarcasm Dataset\nAugmented Emotion\
  \ Dataset\n        ↓\nDataset Cleaning and Preprocessing\n        ↓\nDataset Concatenation\n       \
  \ ↓\nUnified Text Corpus\n        ↓\nShared Vocabulary\n        ↓\nWord2Vec Embedding Representation\n\
  ```\n\nThe system uses different datasets because toxicity, sarcasm, and emotion are different but related\
  \ tasks.\n\nThe **toxicity dataset** teaches the model toxic and non-toxic patterns.  \nThe **sarcasm\
  \ dataset** teaches the model indirect or sarcastic meaning.  \nThe **emotion dataset** teaches the\
  \ model emotional tone in text.\n\nTogether, these datasets help EmoTox understand more context than\
  \ a normal keyword-based toxicity detector.\n\n---\n\n## Text Preprocessing Pipeline\n\n```text\nRaw\
  \ Text Comment\n        ↓\nRemove unnecessary characters\n        ↓\nRemove URLs\n        ↓\nConvert\
  \ text to lowercase\n        ↓\nTokenization\n        ↓\nRemove punctuation\n        ↓\nLemmatization\n\
  \        ↓\nCleaned Text\n```\n\nExample:\n\n```text\nOriginal Comment:\nWow!!! You are SO stupid \U0001F602\
  \ https://example.com\n\nAfter Preprocessing:\nwow you are so stupid\n```\n\nPreprocessing removes noise\
  \ from the text so the model can focus on the actual words and patterns.\n\n---\n\n## Keras Tokenizer\
  \ Pipeline\n\n```text\nCleaned Text\n        ↓\nSplit into words\n        ↓\nConvert each word into\
  \ an integer ID\n        ↓\nCreate token sequence\n        ↓\nPad sequence to fixed length\n```\n\n\
  Example:\n\n```text\nText:\nyou are stupid\n\nToken IDs:\n[7, 24, 501]\n```\n\nThe Keras tokenizer is\
  \ important because deep learning models do not understand raw text. They only understand numbers.\n\
  \nFor deployment, the tokenizer is saved as:\n\n```text\nmodels/tokenizer.pkl\n```\n\nThe Streamlit\
  \ app must use the same tokenizer used during training. If the tokenizer is different, the model may\
  \ receive the wrong word IDs and produce unreliable predictions.\n\n---\n\n## Word2Vec Embedding Pipeline\n\
  \n```text\nToken ID\n        ↓\nLook up word in embedding matrix\n        ↓\nRetrieve Word2Vec vector\n\
  \        ↓\nPass vector sequence into model\n```\n\nExample:\n\n```text\ntokenizer.word_index[\"stupid\"\
  ] = 501\n\nembedding_matrix[501] = Word2Vec vector for \"stupid\"\n```\n\nA normal token ID only represents\
  \ a word number. Word2Vec represents the meaning of the word as a vector.\n\nExample:\n\n```text\nstupid\
  \ → [0.12, -0.44, 0.03, ...]\n```\n\nThese vectors help the model understand relationships between words.\
  \ Words with similar meanings can have similar vector representations.\n\nThe saved Word2Vec file is:\n\
  \n```text\nmodels/unified_word2vec_vectors.kv\n```\n\n---\n\n# \U0001F4DA Datasets Used\n\n### Wikipedia\
  \ Toxicity Dataset\n- Used for toxic and non-toxic classification\n- Provides the main labels for toxicity\
  \ detection\n- Helps the final classifier learn harmful and non-harmful comment patterns\n\n### SARC\
  \ Dataset\n- Used for sarcasm detection\n- Helps the model identify indirect or sarcastic meaning\n\
  - Useful for comments where the surface meaning is different from the actual intent\n\n### Augmented\
  \ Emotion Dataset\n- Used for emotion classification\n- Helps the model detect emotional tone\n- Supports\
  \ the final toxicity model by providing emotion-based signals\n\n---\n\n# ❤️ Emotion Classification\
  \ Model\n\nThe emotion model uses a **CNN-LSTM architecture**.\n\nIts job is to detect the emotional\
  \ tone of a comment. This matters because toxic comments often contain emotional signals such as anger,\
  \ sadness, fear, or hostility.\n\n## Emotion Model Architecture\n\n```text\nWord2Vec Embeddings\n  \
  \      ↓\nSpatial Dropout\n        ↓\nLSTM\n        ↓\n1D Convolution\n        ↓\nDropout\n        ↓\n\
  LSTM\n        ↓\n1D Convolution\n        ↓\nDropout\n        ↓\nGlobal Max Pooling\n        ↓\nSoftmax\
  \ Output\n        ↓\nEmotion Probability Vector\n```\n\n## Why CNN?\n\nA **Convolutional Neural Network\
  \ (CNN)** helps detect short word patterns or phrase-level features.\n\nExample:\n\n```text\nyou are\
  \ stupid\n```\n\nThe CNN can learn that this phrase may contain hostile or negative meaning.\n\n## Why\
  \ LSTM?\n\nA **Long Short-Term Memory (LSTM)** layer understands word order and sequence.\n\nExample:\n\
  \n```text\nI am not happy with you\n```\n\nThe meaning depends on the order of the words. LSTM helps\
  \ the model understand this sequence.\n\n## Emotion Output\n\nThe emotion model produces an emotion\
  \ probability vector.\n\nExample:\n\n```text\nanger: 0.70\njoy: 0.02\nsadness: 0.15\nfear: 0.10\nsurprise:\
  \ 0.03\n```\n\nThis output becomes one of the inputs used by the final toxicity classifier.\n\n---\n\
  \n# \U0001F60F Sarcasm Detection Model\n\nThe sarcasm model uses a **Bidirectional Long Short-Term Memory\
  \ (BiLSTM)** architecture with **Multi-Head Attention**.\n\nIts job is to detect whether a comment contains\
  \ sarcastic or indirect meaning.\n\nExample:\n\n```text\nGreat job, you ruined everything again.\n```\n\
  \nThe word **“great”** looks positive, but the full sentence is sarcastic and negative.\n\n## Sarcasm\
  \ Model Architecture\n\n```text\nWord2Vec Embeddings\n        ↓\nBidirectional LSTM\n        ↓\nMulti-Head\
  \ Attention\n        ↓\nFlatten\n        ↓\nLinear Layer\n        ↓\nDropout\n        ↓\nSigmoid Output\n\
  \        ↓\nSarcasm Probability\n```\n\n## Why BiLSTM?\n\nA normal LSTM reads text in one direction.\
  \ A **BiLSTM** reads text in both directions.\n\n```text\nForward:  word 1 → word 2 → word 3\nBackward:\
  \ word 3 → word 2 → word 1\n```\n\nThis helps the model understand the context before and after each\
  \ word.\n\n## Why Multi-Head Attention?\n\n**Multi-Head Attention** helps the model focus on important\
  \ words or phrases that may signal sarcasm.\n\nExample:\n\n```text\nYeah, because that was such a smart\
  \ idea.\n```\n\nThe model may focus on phrases such as:\n\n```text\nyeah\nsuch a smart idea\n```\n\n\
  These phrases may signal sarcasm depending on the full sentence.\n\n---\n\n# \U0001F9E9 Custom Keras\
  \ Layer: SelfAttentionBlock\n\nThe sarcasm model uses a custom Keras layer called `SelfAttentionBlock`.\n\
  \nThis layer contains:\n\n- `MultiHeadAttention`\n- `LayerNormalization`\n- residual connection\n\n\
  Simplified logic:\n\n```python\nattn_out = self.attn(x, x)\noutput = self.norm(x + attn_out)\n```\n\n\
  ## What This Means\n\nThe layer first applies attention to the input sequence. Then it adds the original\
  \ input back to the attention output. This is called a **residual connection**.\n\nAfter that, it normalizes\
  \ the result using `LayerNormalization`.\n\nThis helps stabilize training and allows the model to keep\
  \ both the original sequence information and the attention-enhanced information.\n\n## Why This Matters\
  \ in Deployment\n\nBecause `SelfAttentionBlock` is a custom layer, Keras cannot load the saved sarcasm\
  \ model unless the same class is defined in `app.py`.\n\nThat is why the Streamlit app includes the\
  \ custom layer code before loading the `.keras` models.\n\n---\n\n# \U0001F517 Ensemble Learning\n\n\
  EmoTox uses ensemble learning by combining the outputs of the emotion model and sarcasm model.\n\n```text\n\
  Emotion Probability Vector\n        +\nSarcasm Probability\n        ↓\nConcatenated Probability Vector\n\
  \        ↓\nMeta-Classifier\n```\n\nInstead of only asking:\n\n```text\nDoes this comment contain toxic\
  \ words?\n```\n\nThe system also asks:\n\n```text\nWhat emotion does this comment express?\nIs the comment\
  \ sarcastic?\nDo emotion and sarcasm together suggest toxicity?\n```\n\nThis makes the system more context-aware\
  \ than a simple keyword-based toxicity detector.\n\n---\n\n# \U0001F9FE Meta-Classifier\n\nThe meta-classifier\
  \ receives the combined probability outputs from the emotion and sarcasm models.\n\n## Meta-Classifier\
  \ Archite"

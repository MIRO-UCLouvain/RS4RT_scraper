readme_excerpt: "# 3D Dental Segmentation\n\n![Python](https://img.shields.io/badge/Python-3.8%2B-blue)\n\
  ![PyTorch](https://img.shields.io/badge/PyTorch-EE4C2C?logo=pytorch&logoColor=white)\n![MONAI](https://img.shields.io/badge/MONAI-Medical_AI-161616)\n\
  \nThis repository contains an end-to-end deep learning pipeline for 3D instance segmentation of dental\
  \ CBCT scans. The model automatically identifies and segments 32 individual teeth alongside 10 complex\
  \ anatomical and prosthetic structures, outputting the results into a lightweight, interactive web viewer.\n\
  \nhttps://github.com/user-attachments/assets/e0951276-9720-4177-9e3a-125a1a5ed52a\n\n## Project Overview\n\
  \nI built this pipeline to handle the complexities of real-world dental scans, specifically focusing\
  \ on handling metal artifacts, variable scan resolutions, and instance-level tooth identification. \n\
  \n* **Dataset:** Processed the full public **ToothFairy2** dataset (335 volumes) into a standardized\
  \ format. To optimize for compute efficiency during training, a curated subset of 82 volumes was sampled\
  \ from this larger split and partitioned into **65 training**, **10 validation**, and **7 test** samples.\n\
  * **Architecture:** 5-Layer 3D U-Net implemented via MONAI and PyTorch, trained with Automatic Mixed\
  \ Precision (AMP).\n* **Viewer:** A zero-dependency, local web viewer built with NiiVue. It runs entirely\
  \ in the browser via WebGL.\n\n## How It Works\n\n### 1. Data Engineering (`01_Dataset_Curation_ToothFairy2.ipynb`)\n\
  Raw `.mha` files from the dataset are processed using `SimpleITK` into a standard `nnU-Net` directory\
  \ structure. \n* **Label Harmonization:** The standard FDI tooth numbering system contains numerical\
  \ gaps (e.g., jumping from 18 to 21). We re-mapped these IDs into 43 consecutive classes (0 for background,\
  \ 1-10 for anatomy/prosthetics, and 11-42 for individual teeth). This stabilizes the multi-class cross-entropy\
  \ loss function during training.\n* **Configuration:** Automatically generates the `dataset.json` required\
  \ for structured dataloading.\n\n### 2. Training Pipeline (`02_3D_UNet_Segmentation_MONAI.ipynb`)\n\
  We used MONAI to handle 3D volumetric data and augmentations. The model is trained using `DiceCELoss`\
  \ (Dice + Cross Entropy) to balance class frequencies.\n* **Isotropic Resampling:** All scans are forced\
  \ to `0.5 x 0.5 x 0.5 mm` voxel spacing.\n* **Intensity Windowing:** Hounsfield Units (HU) are clipped\
  \ between `0` and `1500`. This ignores soft tissue/air and forces the model to focus strictly on dentin\
  \ and enamel contrast.\n* **Augmentations:** Random spatial cropping (128³ patches), axis flipping,\
  \ rotations, intensity shifts, and Gaussian noise injections to prevent overfitting to scanner-specific\
  \ artifacts.\n\n### 3. Inference & Visualization\nThe inference script uses sliding-window evaluation\
  \ (`128x128x128` with an overlap of 4) to reconstruct the full high-resolution volume without running\
  \ out of GPU memory. The output is saved as a NIfTI file (`mask.nii.gz`) with the original affine matrix\
  \ preserved, ensuring perfect spatial alignment when overlaid on the raw scan.\n\n## Repository Structure\n\
  \n```text\n3d-dental-cbct-segmentation/\n├── 01_Dataset_Curation_ToothFairy2.ipynb  # Initial data cleaning\
  \ & JSON setup\n├── 02_3D_UNet_Segmentation_MONAI.ipynb    # Core training and inference loop\n├── dataset.json\
  \                           # Config generated by Notebook 01\n├── dental_unet_final.pth           \
  \       # Pre-trained weights\n├── index.html                             # Local 3D web viewer\n├──\
  \ scan.nii.gz                            # Sample CBCT patient scan\n├── mask.nii.gz               \
  \             # AI-generated prediction mask\n├── requirements.txt                       # Dependency\
  \ list\n└── README.md                              # This documentation\n"

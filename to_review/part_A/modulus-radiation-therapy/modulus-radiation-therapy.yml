readme_excerpt: "Codes for PINNs (based on Nvidia's Modulus package) for radiation therapy planning using\
  \ mechanistic models for tumor growth and response to radiation\n\n## Objective\n\nConventional RT for\
  \ cancers usually utilizes a single set of imaging acquired prior to the start of treatment and selects\
  \ a treatment plan that has been shown to work well \non an ``average patient'' However, cancer is a\
  \ complex, evolving system that exhibits\nsignificant inter-patient variations that depend on various\
  \ factors, \nincluding the underlying genomic instability and tumor microenvironment. \nPhysics-informed\
  \ neural networks (PINNs) are being developed in this repo by integrating \nmechanistic modeling with\
  \ MRI data to model the spatio-temporal response of \ntumors to RT, to create therapy plans based on\
  \ individual tumor biology. \n\nSuch a PINN model, trained over a broad range of relevant parameters\
  \ \n(e.g., diffusion coefficients, tumor proliferation rates, RT dose) and \nregularized/guided using\
  \ available MRI data, \ncan be used to carry out near-instantaneous predictions for the tumor trajectory\
  \ \nbased on parameters corresponding to any new patient, \nthus streamlining RT planning and precluding\
  \ the need for a huge number of \nparameter-specific computer simulations.\n\n## Steps:\n\n1. View brain\
  \ cross sections from MRI scans using [view_mat_interactive_all.py](https://github.com/tnnandi/modulus_radiation_therapy/blob/main/view_mat_interactive_all.py)\
  \ to ensure the geometry is well represented for meshing\n2. Generate surface mesh (STL) from the cross\
  \ sections using [convert_to_stl_surface_use_gmsh_volume.py](https://github.com/tnnandi/modulus_radiation_therapy/blob/main/convert_to_stl_surface_use_gmsh_volume.py)\
  \ \n3. Generate volume mesh (STL) from the surface mesh using [gmsh](https://gmsh.info/). Generated\
  \ meshes for a single patient are available at [Box](https://anl.box.com/s/tlyfb74wyuma0jm4zha8zfrwcspxshlb)\n\
  4. Edit governing equation/s at [diffusion_proliferation_treatment.py](https://github.com/tnnandi/modulus_radiation_therapy/blob/main/modulus-sym/examples/brain_RT/diffusion_proliferation_treatment.py).\
  \ \n5. Execute [brain_param_kp_dose_time.windowing.py](https://github.com/tnnandi/modulus_radiation_therapy/blob/main/modulus-sym/examples/brain_RT/brain_param_kp_dose_time.windowing.py)\
  \  \"python \" to begin PINN training. \n   - Edit the NN configuration, fixed physical properties,\
  \ ICs/BCs and the parameterized variables as required.\n   - The initial tumor is represented using\
  \ a gaussian distribution centered around a specific location \n6. Use [inference_kp_dose_time_autoloopstructure.py](https://github.com/tnnandi/modulus_radiation_therapy/blob/main/modulus-sym/examples/brain_RT/inference_kp_dose_time_autoloopstructure.py)\
  \ to carry out inference and write out vtk file consistent with Paraview naming (varying quantity listed\
  \ last in the file name) \\\n\\\nNote: Step 4 needs to be carried out within a singularity shell for\
  \ Nvidia's Modulus and the STL files need to be placed at the approriate locations \n\n## Implementation\
  \ of the governing equations\n\n### Tumor growth equation without the treatment term included\nThe single-species\
  \ model for tumor growth is given by:\\\n$\\frac{\\partial \\hat{N}_T(x,t)}{\\partial t} = \\nabla \\\
  cdot (D_T \\nabla \\hat{N}_T(x,t)) + \\kappa_T\\hat{N}_T(x,t)(1 - \\frac{\\hat{N}_T(x,t)}{\\theta_T})$\n\
  \nwhere the terms on the LHS represented the temporal evolution of the normalized tumor density $\\\
  hat{N}$. The first and the second terms on the RHS represent diffusion and proliferation, respectively.\
  \ \n\n\n${N}_T(x,t)$: Normalized tumor density (unitless) \\\n$D_T$: Tumor cell diffusion coefficient\
  \ ($mm^2/day$)\\\n$\\kappa_T$: Tumor cell proliferation rate ($day^{-1}$) \\\n$\\theta_T$: Carrying\
  \ capacity of the tumor (unitless)\n\n### Treatment response model\nThe response to radiotherapy (RT)\
  \ and chemotherapy (CT) is modeled as a discrete event:\n\n```math\n\\hat{N}_{i,\\text{post}}(x,t) =\
  \ \\hat{N}_{i,\\text{pre}}(x,t) \\text{SF}_{\\text{RT+CT}}(x,t)\n```\nwhere the surviving fractions\
  \ of cells due to a single dose of combined radiotherapy and chemotherapy is given by: \n\n$$\n\\text{SF}_{\\\
  text{RT+CT}}(x,t) = e^{-\\alpha \\cdot \\text{Dose}(x,t) \\left(1 + \\frac{\\text{Dose}(x,t)}{\\alpha/\\\
  beta} \\right)}, \n$$\n\nwhere $\\alpha$ is a treatment sensitivity term, $\\text{Dose}(x,t)$ is the\
  \ dose of RT+CT given in a single fraction, and $\\alpha/\\beta$ is the ratio of the linear and quadratic\
  \ sensitivity terms <!-- set to a fixed value of 5.6 Gy. -->\nTo account for the effects of RT, tumor\
  \ density is multiplied the surviving fraction of cells at the beginning of each time window representing\
  \ delivery of RT \n\nNote 1: Currently, the PINN model is set up with parameterized proliferation rate\
  \ and dose terms. \n\nNote 2: Further complexities can be introduced by \n- solving separate transport\
  \ equations for the enhancing and non-enhancing parts of the tumor withe competition term included \n\
  - making the diffusion coefficient spatially and temporally varying to more accurately represent areas\
  \ of hypoxia and angiogenesis, and the tumor microenvironment \n## Assignment of physical parameters\
  \ and the parameterized quantities\n\nList of relevant parameterized quantities and their representative\
  \ ranges (from David and Caroline)\n![img.png](img.png)\n\nCurrently, the fixed and parameterized quantities\
  \ are set as follows:\n\n$D_T$:  0.125 $mm^2/day$\\\n$\\theta_T$: 0.1 $day^{-1}$ \\\n$\\alpha $: 0.035\
  \ \\\n$\\frac{\\alpha}{\\beta}$: 10 \nDays on which RT is administered: [1, 2, 3, 4, 5, 8, 9, 10, 11,\
  \ 12, 15, 16, 17, 18, 19]\n\n$\\kappa_T$: 0 to 0.2 \\\nDose: 0 to 8 $Gy$ included as a discrete event\
  \ at the beginning of the days on which RT was administered\n\n## Changes in source code for handling\
  \ the RT dose term and improved convergence\n1. [moving_time_window.py](https://github.com/tnnandi/modulus_radiation_therapy/blob/main/modulus-sym/examples/brain_RT/moving_time_window.py#L106):\
  \ Edited to multiply the tumor density corresponding to the end of the previous time window by SF before\
  \ enforcing the constraint to match it with the tumor density at the beginning of the current time window\
  \ corresponding to the days on which RT was administered.\n2. [trainer.py](https://github.com/tnnandi/modulus_radiation_therapy/blob/main/modulus-sym/examples/brain_RT/trainer.py#L422):\
  \ Edited for improved IC convergence, using 4 times the max_steps specified in the config file\n\n"

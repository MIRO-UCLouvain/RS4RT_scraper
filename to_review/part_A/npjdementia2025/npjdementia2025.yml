readme_excerpt: "# Augmenting radiological assessment of imaging evident dementias with radiomic analysis\n\
  \nThis work is published in _npj Dementia_ (https://doi.org/10.1038/s44400-025-00031-1).\n\n## Overview\n\
  This repository provides a comprehensive pipeline for preprocessing, feature extraction, modeling, and\
  \ evaluation of neuroradiology imaging data. It integrates FreeSurfer-based volumetric analysis, white\
  \ matter hyperintensity (WMH) burden estimation, and machine learning models (XGBoost) for Alzheimer’s\
  \ disease (AD) and Other Imaging Evident Dementia (OIED) predictions.\n\n## Table of Contents\n- [Environment\
  \ Setup](#environment-setup)\n- [Data Structure](#data-structure)\n- [Preprocessing](#preprocessing)\n\
  - [Model Training](#model-training)\n- [Results & Analysis](#results--analysis)\n- [Utilities](#utilities)\n\
  \n## Environment Setup\n1. Create a Conda environment:\n   ```bash\n   conda env create -f environment.yml\n\
  \   # or for macOS specific\n   conda env create -f environment-macos.yml\n   ```\n2. Activate the environment:\n\
  \   ```bash\n   conda activate neurorad-radiomics\n   ```\n\n## Data Structure\n- `data/`\n  - `ml_data/`:\
  \ preprocessed tabular datasets (`ml_data_filtered.csv`, `ml_test_data_filtered.csv`, etc.)\n  - `dev-model/`:\
  \ saved XGBoost models and tuning parameters\n  - `feature_config.json`: definitions of volumetric,\
  \ WMH, imaging, and demographic features\n  - `lobe_mapping.json`, `feature_names_map.json`, etc.\n\n\
  ## Preprocessing\nScripts under `preprocessing/` handle MRI data conversion and feature extraction:\n\
  - `fs_scripts.py`: filter and convert FreeSurfer outputs, parse volume statistics\n- `lst_scripts.py`:\
  \ run LST (Lesion Segmentation Tool) for WMH estimation\n- `NACC_mris.py` & `prep_array_job_csv_.py`:\
  \ generate batch arguments for array jobs on NACC datasets\n\n## Model Training\nTraining scripts are\
  \ in `train/`:\n- `model.py`: preprocessing and label generation\n- `wandb_sweep.py`: hyperparameter\
  \ sweep setup with Weights & Biases\n- `cv.py`: cross-validation with GroupKFold\n- `final_train.py`:\
  \ train final AD, OIED models with hyperparmeters defined from sweeps\n\n## Results & Analysis\nMisc.\
  \ analyses and plotting scripts are in `results/`\n\n## Utilities\n- `utils/load_data.py`: load and\
  \ derive feature lists from JSON config\n- `utils/dump_dkt_atlas.py`: export region names grouped by\
  \ lobes\n"

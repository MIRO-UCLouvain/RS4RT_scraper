readme_excerpt: "# Replicating the Results of \"Superiorization as a novel strategy for linearly constrained\
  \ inverse radiotherapy treatment planning\"\nScripts to reproduce results from \"Superiorization as\
  \ a novel strategy for linearly constrained inverse radiotherapy treatment planning\" (arxiv:2207.13187)\n\
  \n## Prerequisites\n\nBefore you begin, ensure you have met the following requirements:\n\n- [Git](https://git-scm.com/downloads):\
  \ Install Git on your machine.\n- [MATLAB](https://www.mathworks.com/products/matlab.html): MATLAB is\
  \ required to run the code.\n\n## Reproducing the Results\n\nTo replicate the results of our paper,\
  \ follow these steps:\n\n1. Clone the repository to your local machine:\n\n   ```bash\n   git clone\
  \ https://github.com/e0404/paper-superiorization-imrt.git\n   ```\n\n2. Change your current directory\
  \ to the repository:\n\n   ```bash\n   cd paper-superiorization-imrt\n   ```\n\n3. Download the correct\
  \ version of matRad by initializing and updating submodules:\n\n   ```bash\n   git submodule init\n\
  \   git submodule update\n   ```\n\n4. Start MATLAB.\n\n5. Navigate into the `matRad` submodule:\n\n\
  \   ```matlab\n   cd matRad\n   ```\n\n6. Run the `matRad_rc` script to set up the matRad radiotherapy\
  \ planning tool:\n\n   ```matlab\n   matRad_rc\n   ```\n\n7. Prepare the datasets by running the following\
  \ scripts from the `scripts` folder:\n   - `Prepare_HN.m` for the Head and Neck dataset.\n   - `Prepare_prostate.m`\
  \ for the Prostate dataset.\n   - `Prepare_TG119.m` for the TG119 dataset.\n\n\n8. To reproduce the\
  \ figures from the paper run the following scripts:\n   - `Figure_1.m` to produce all subplots of Figure\
  \ 1.\n   - `Figure_2_1.m` to produce all subplots of Figure 3 and Figure 2, treatment plan I.\n   -\
  \ `Figure_2_2.m` to produce all subplots of Figure 2, treatment plan II.\n   - `Figure_2_3.m` to produce\
  \ all subplots of Figure 2, treatment plan III.\n   - `Figure_4_5_HN.m` to produce all subplots of Figures\
  \ 4 and 5.\n   - `Figure_6_prostate.m` to produce all subplots of Figure 6.\n\n\n## Directory Structure\n\
  \nThe repository is organized as follows:\n\n- `matRad/`: Submodule containing the matRad radiotherapy\
  \ planning tool.\n- `scripts/`: Contains scripts and functions to reproduce all figures from the paper.\n\
  \n## Citing the Paper\n\nIf you use the code or replicate the results for your research, please consider\
  \ citing our paper:\n\n```\n@misc{barkmann2022superiorization,\n      title={Superiorization as a novel\
  \ strategy for linearly constrained inverse radiotherapy treatment planning}, \n      author={Florian\
  \ Barkmann and Yair Censor and Niklas Wahl},\n      year={2022},\n      eprint={2207.13187},\n     \
  \ archivePrefix={arXiv},\n      primaryClass={physics.med-ph}\n}\n```\n\n## Issues and Contributions\n\
  \nIf you encounter any issues while replicating the results or have suggestions for improvements, please\
  \ open an issue in this repository. We welcome contributions from the community to enhance and extend\
  \ the provided codebase.\n\n"

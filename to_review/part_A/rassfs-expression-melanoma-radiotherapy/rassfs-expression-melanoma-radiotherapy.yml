readme_excerpt: "# The Expression of RASSFs in Response to Radiation Therapy in Primary and Metastatic\
  \ Melanoma\n\n## \U0001F4CB Project Overview\n\nThis study investigates the expression patterns of RASSF\
  \ family genes (RASSF1-10) in melanoma patients, with a focus on:\n- Response to radiation therapy\n\
  - Differences between primary and metastatic melanoma\n- Potential biomarkers for melanoma progression\n\
  \n## \U0001F9EC Original Hypothesis vs Findings\n\n**Initial Hypothesis**: Based on previous studies\
  \ showing RASSF9 upregulation in sun-exposed skin, we hypothesized that RASSF9 would show significant\
  \ expression differences in melanoma patients receiving radiotherapy versus those not receiving treatment.\n\
  Key Reference: Kita R, Fraser HB. Local Adaptation of Sun-Exposure-Dependent Gene Expression Regulation\
  \ in Human Skin. PLoS Genet. 2016 Oct 19;12(10):e1006382. doi: 10.1371/journal.pgen.1006382. PMID: 27760139;\
  \ PMCID: PMC5070784.\n\n**Key Finding**: Contrary to our hypothesis, RASSF9 expression did not show\
  \ significant differences between radiation therapy groups. However, we discovered that other RASSF\
  \ family members (particularly RASSF4, RASSF5, and RASSF10) show highly significant differential expression\
  \ between primary and metastatic melanoma.\n\n## \U0001F4CA Dataset Source\n\n**Primary Dataset**: TCGA-SKCM\
  \ (The Cancer Genome Atlas - Skin Cutaneous Melanoma)\n- **Data Category**: Transcriptome Profiling\n\
  - **Data Type**: Gene Expression Quantification\n- **Workflow Type**: STAR - Counts\n- **Sample Size**:\
  \ 473 melanoma samples (primary and metastatic)\n- **Access**: Publicly available through NCI Genomic\
  \ Data Commons\n\n**Clinical Variables Extracted**:\n- Radiation therapy status\n- Chemotherapy treatment\n\
  - Immunotherapy treatment\n- Tumor type (primary vs metastatic)\n- Patient survival data\n\n## \U0001F50D\
  \ Methodology\n\n### Data Acquisition\n- Used TCGAbiolinks R package to query and download TCGA-SKCM\
  \ data\n- Extracted raw counts and normalized TPM values\n- Processed clinical data to extract treatment\
  \ information\n\n### Gene Selection\nFocused on the complete RASSF family:\n- RASSF1, RASSF2, RASSF3,\
  \ RASSF4, RASSF5\n- RASSF6, RASSF7, RASSF8, RASSF9, RASSF10\n\n### Statistical Analysis\n- Wilcoxon\
  \ rank-sum tests for group comparisons\n- Multiple testing correction (Benjamini-Hochberg)\n- Correlation\
  \ analysis between RASSF genes\n- Visualization using ggplot2 and pheatmap\n\n## \U0001F4C8 Key Results\n\
  \n### Most Significant Findings:\n1. **RASSF4**: p = 2.3e-11, Log2FC = 1.52 (UPREGULATED in metastasis)\n\
  2. **RASSF5**: p = 4.1e-09, Log2FC = 1.78 (UPREGULATED in metastasis)  \n3. **RASSF10**: p = 6.2e-07,\
  \ Log2FC = -1.15 (DOWNREGULATED in metastasis)\n\n### Radiation Therapy Analysis:\n- No significant\
  \ differences in RASSF9 expression between radiation therapy groups\n- Limited sample size for radiation\
  \ treatment subgroup\n\n## \U0001F9EA Technical Implementation\n\n### R Packages Used:\n- `TCGAbiolinks`:\
  \ Data download and processing\n- `SummarizedExperiment`: Data structure handling\n- `ggplot2`: Visualization\n\
  - `reshape2`: Data transformation\n- `dplyr`: Data manipulation\n\n### Code Structure:\n1. Data query\
  \ and download\n2. Clinical data processing and treatment variable extraction\n3. RASSF gene expression\
  \ extraction\n4. Statistical analysis and visualization\n5. Results export and reporting\n\n## \U0001F4C1\
  \ Files Description\n\n- `scripts/rassf_analysis.R`: Complete analysis pipeline\n- `results/RASSF_gene_analysis_final_results.csv`:\
  \ Comprehensive statistical results\n- `results/figures/`: All generated visualizations\n- `data/`:\
  \ (Empty - contains reference to external TCGA data)\n\n## \U0001F3AF Research Implications\n\n1. **RASSF4\
  \ and RASSF5** are promising biomarkers for melanoma metastasis\n2. **RASSF10** may function as a tumor\
  \ suppressor in melanoma progression\n3. The RASSF family shows complex, coordinated regulation in cancer\
  \ metastasis\n4. These genes represent potential therapeutic targets for metastatic melanoma\n\n## ➡️\
  \ Next Steps\n\n1. Validate findings in independent melanoma cohorts\n2. Investigate molecular mechanisms\
  \ of RASSF4/5 in metastasis\n3. Explore RASSF10's potential tumor suppressor role\n4. Examine protein\
  \ expression levels via immunohistochemistry\n5. Functional studies using in vitro/in vivo models\n\n\
  ## \U0001F465 Authors\n\nSamson Kosemani\nUniversity of Sao Paulo, Brazil\n\n## \U0001F4C4 License\n\

  \ for maintaining the TCGAbiolinks package\n- Researchers who contributed to the original RASSF9 sun-exposure\
  \ study that inspired this work# RASSFs-expression-melanoma-radiotherapy\nAnalysis of RASSF gene expression\
  \ in melanoma in response to radiation therapy\n"

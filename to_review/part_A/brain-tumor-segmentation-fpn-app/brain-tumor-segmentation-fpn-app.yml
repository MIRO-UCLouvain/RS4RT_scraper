readme_excerpt: "# Brain Tumor FPN Segmentation App\r\n\r\n[![Python](https://img.shields.io/badge/Python-3.12+-blue.svg)](https://python.org)\r\
  \n[![Streamlit](https://img.shields.io/badge/Streamlit-1.28+-red.svg)](https://streamlit.io)\r\n[![Dagster](https://img.shields.io/badge/Dagster-1.5+-green.svg)](https://dagster.io)\r\
  \n[![FPN](https://img.shields.io/badge/Architecture-FPN-blue.svg)](https://arxiv.org/abs/1612.03144)\r\
  \n[![uv](https://img.shields.io/badge/uv-Package%20Manager-cyan.svg)](https://docs.astral.sh/uv)\r\n\
  \r\n> **Trabajo académico** - Aplicación web para segmentación de tumores cerebrales en resonancias\
  \ magnéticas (MRI) con evaluación de urgencia médica.\r\n\r\n## Tabla de Contenidos\r\n- [Descripción\
  \ General](#descripción-general)\r\n- [Características](#características)\r\n- [Requisitos Previos](#requisitos-previos)\r\
  \n- [Instalación](#instalación)\r\n- [Configuración de Kaggle](#configuración-de-kaggle)\r\n- [Estructura\
  \ del Proyecto](#estructura-del-proyecto)\r\n- [Entrenamiento del Modelo](#entrenamiento-del-modelo)\r\
  \n- [Uso de la Aplicación](#uso-de-la-aplicación)\r\n- [Autor](#autor)\r\n- [Licencia](#licencia)\r\n\
  \r\n\r\n## Descripción General\r\n\r\nEsta aplicación permite la segmentación automática de tumores\
  \ cerebrales a partir de imágenes de resonancia magnética (MRI) en formato .tif. Utilizando una arquitectura\
  \ UNet, el sistema genera:\r\n\r\n- Máscara de segmentación del tumor\r\n- Características tumorales\
  \ (tamaño, forma, ubicación)\r\n- Nivel de urgencia basado en análisis de imagen + datos clínicos\r\n\
  \r\nLa aplicación incluye un formulario médico donde se pueden ingresar datos clínicos del paciente\
  \ (edad, grado histológico, etc.) que se combinan con el análisis de la imagen para predecir un nivel\
  \ de urgencia más preciso.\r\n\r\n## Características\r\n\r\n- Segmentación UNet de tumores en MRI cerebrales\r\
  \n- Interfaz web interactiva con Streamlit\r\n- Formulario clínico para mejorar predicción de urgencia\r\
  \n- Orquestación con Dagster para flujos de trabajo reproducibles\r\n- Procesamiento paralelo con Dask\
  \ para grandes volúmenes de datos\r\n- Análisis estadístico integrado con R\r\n- Ficha técnica automática\
  \ con métricas del modelo\r\n\r\n## Requisitos Previos\r\n\r\n- Python 3.12 o superior\r\n- Git\r\n\
  - uv\r\n- Cuenta de Kaggle para descargar los datos\r\n- R\r\n- GPU recomendada (funciona con CPU pero\
  \ es más lento)\r\n\r\n## Instalación\r\n\r\n1. Clonar el repositorio:\r\n\r\ngit clone https://github.com/alejandrooam/brain-tumor-segmentation-fpn-app.git\r\
  \ncd brain-tumor-segmentation-fpn-app\r\n\r\n2. Instalar uv:\r\n\r\npip install uv\r\n\r\n3. Crear entorno\
  \ virtual e instalar dependencias:\r\n\r\nuv venv\r\n\r\nActivar entorno (Windows):\r\n.venv\\Scripts\\\
  activate\r\n\r\nInstalar dependencias:\r\nuv sync\r\n\r\n## Configuración de Kaggle\r\n\r\nPara descargar\
  \ los datos necesitas una API key de Kaggle:\r\n\r\n1. Ve a Kaggle Settings (https://www.kaggle.com/settings)\r\
  \n2. En la sección \"API\", haz clic en \"Create New Token\"\r\n3. Se descargará kaggle.json\r\n4. Coloca\
  \ el archivo en la raíz del proyecto\r\n\r\nEnlace del dataset: [https://www.kaggle.com/datasets/mateuszbuda/lgg-mri-segmentation/data]\r\
  \n\r\n## Estructura del Proyecto\r\n\r\nbrain-tumor-segmentation-unet-app/  \r\nsrc/  \r\n &ensp; datos.py\
  \   &emsp;   # Importación de datos desde Kaggle  \r\n &ensp; mapeo_archivos.py  &emsp;    # Generación\
  \ del catálogo de trabajo  \r\n &ensp; transformar_datos.py   &emsp;   # Adaptación y preprocesamiento\
  \ de imágenes  \r\n &ensp; Analisis/  \r\n &ensp;&ensp;   Analisis_imagen.py    &emsp;   # Mini-modelo\
  \ para predicción de urgencia  \r\n &ensp;&ensp;   Analisis_test.py    &emsp;   # Análisis del conjunto\
  \ de test  \r\n &ensp;&ensp;   Metricas_modelo.py    &emsp;   # Métricas de calidad de segmentación\
  \  \r\n &ensp;&ensp;   Script_R_1.R    &emsp;   # Análisis estadístico en R  \r\n &ensp; Aplicacion/\
  \  \r\n &ensp;&ensp;   streamlit.py    &emsp;   # Página principal de la app  \r\n &ensp;&ensp;   cliente.py\
  \   &emsp;   # Comunicación con Dagster  \r\n &ensp;&ensp;   pages/  \r\n &ensp;&ensp;&ensp;     Ficha_tecnica.py\
  \   &emsp;   # Ficha técnica del modelo  \r\n &ensp; orquestador/  \r\n &ensp;&ensp;   activos.py  \
  \ &emsp;   # Activos de Dagster para el flujo de trabajo  \r\n &ensp; procesamiento_datos/  \r\n &ensp;&ensp;\
  \   procesador_dask.py  &emsp;    # Transformación paralela con Dask  \r\n &ensp;&ensp;   modelo/  \r\
  \n &ensp;&ensp;&ensp;     modelo_unet.py    &emsp;  # Arquitectura UNet  \r\n &ensp;&ensp;&ensp;   \
  \  entrenar_modelo.py    &emsp;  # Entrenamiento del modelo  \r\n &ensp;&ensp;&ensp;     segmentar.py\
  \   &emsp;   # Lógica de segmentación  \r\n &ensp;&ensp;&ensp;     caracteristicas.py  &emsp;    # Extracción\
  \ de características tumorales  \r\n.gitignore  \r\npyproject.toml  \r\nuv.lock  \r\nREADME.md  \r\n\
  \r\n\r\n## Entrenamiento del Modelo\r\n\r\nPara entrenar el modelo, se utiliza Dagster como orquestador.\
  \ Debes ejecutar los activos en el siguiente orden:\r\n\r\n1. Catalogo_maestro\r\n2. imagenes_procesadas\r\
  \n3. dividir_dataset_balanceado\r\n4. modelo_unet_entrenado\r\n5. mejor_umbral\r\n6. segmentaciones_test\r\
  \n7. caracteristicas_tumorales\r\n8. analisis_datos\r\n9. calidad_modelo_segmentacion\r\n10. entrenar_modelo_urgencia\r\
  \n\r\n### Ejecución con Dagster\r\n\r\n```bash\r\ndagster dev -f src/orquestador/activos.py    \r\n\
  ```\r\n\r\nLuego accede a la interfaz web de Dagster (http://localhost:3000) y materializa los activos\
  \ en el orden indicado.\r\n\r\n\r\n## Uso de la Aplicación\r\n\r\nIniciar la aplicación Streamlit:\r\
  \n\r\n```bash\r\npython -m streamlit run src/Aplicacion/streamlit.py\r\n```\r\n\r\nLa aplicación se\
  \ abrirá en el navegador (normalmente http://localhost:8501).\r\n\r\nFlujo de uso:\r\n\r\n\r\n1. Rellenar\
  \ y subir formulario clínico\r\n2. Subir imagen MRI\r\n3. Ejecutar análisis\r\n4. Resultados: máscara\
  \ de segmentación, características del tumor, nivel de urgencia, archivo .zip con los resultados\r\n\
  \r\n\r\n## Autor\r\n\r\nAlejandro - https://github.com/alejandrooam\r\n\r\n## Licencia\r\n\r\nEste proyecto\
  \ es un trabajo académico de uso educativo. Para uso comercial, contactar al autor.\r\n"

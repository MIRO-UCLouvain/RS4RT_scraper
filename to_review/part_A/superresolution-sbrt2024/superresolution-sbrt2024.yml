readme_excerpt: "# Avaliação de funções-custo na super-resolução de imagens para jogos eletrônicos (SBrT\
  \ 2024)\n## Complementary Resource\n\nThis is a complementary resource for the article \"Avaliação de\
  \ funções-custo na super-resolução de imagens para jogos eletrônicos\" published in the \"Simpósio Brasileiro\
  \ de Telecomunicações e Processamento de Sinais (SBrT) 2024\". Here you can find additional image samples\
  \ and results.\n\n## Instructions\n\nThe repository is organized with a [result_samples](result_samples)\
  \ folder that contains extracted samples from experiments. Their naming should describe the key parameters\
  \ that generated the image and follow the format `<dataset>_<main_experiment>_<sample_id>_<run_parameters>.png`.\
  \ For more details on how they were obtained, please refer to the original article.\n\nExamples:\n \
  \ * `viking_layers_2_x.png`: indicates the model input image of `sample_id` 2 for the perceptual layers\
  \ experiment.\n  * `viking_layers_1_block5_1.png`: indicates the model output image of `sample_id` 1\
  \ for the perceptual layers experiment when using block5_1 as the perceptual loss output during training.\n\
  \  * `viking_losses_1_mae.png`: indicates the model output image of `sample_id` 1 for the weighted losses\
  \ experiment when using a pure MAE loss.\n  * `viking_losses_2_75gloss+25percep.png`: indicates the\
  \ model output image of `sample_id` 2 for the weighted losses experiment when using 0.75 * G-loss +\
  \ 0.25 perceptual loss.\n\n## References\n\nF. D. V. G dos Santos, R. Candido and M. T. M. Silva, “Avaliação\
  \ de funções-custo na super-resolução de imagens para jogos eletrônicos,” *Simpósio Brasileiro de Telecomunicações\
  \ e Processamento de Sinais*, 2024.\n\nUnity Technologies, “Viking Village.” [Online]. Available: https://assetstore.unity.com/packages/essentials/tutorial-projects/viking-village-urp-29140\n"

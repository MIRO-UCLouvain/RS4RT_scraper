readme_excerpt: "# Toxicity Prediction Using Chemical Descriptors\n\n![Python](https://img.shields.io/badge/Python-3.14-blue)\n\
  ![Jupyter](https://img.shields.io/badge/Jupyter-Notebook-orange)\n![Scikit-learn](https://img.shields.io/badge/Scikit--learn-1.6-green)\n\
  ![License](https://img.shields.io/badge/License-MIT-yellow)\n\n## \U0001F4CB Project Overview\n\nThis\
  \ project builds a machine learning model to predict whether a chemical compound is **Toxic** or **NonToxic**\
  \ based on 1,203 molecular descriptors. The analysis includes comprehensive Exploratory Data Analysis\
  \ (EDA), feature selection, cross-validation, and model comparison.\n\n## \U0001F4CA Dataset\n\n- **Source**:\
  \ Chemical descriptors dataset\n- **Samples**: 171 chemical compounds\n- **Features**: 1,203 molecular\
  \ descriptors\n- **Target**: `Class` (Toxic/NonToxic)\n- **Class Distribution**:\n  - NonToxic: 115\
  \ samples (67.3%)\n  - Toxic: 56 samples (32.7%)\n\n![Class Distribution](outputs/class_distribution.png)\n\
  \n## \U0001F52C Methodology\n\n### 1. Exploratory Data Analysis (EDA)\n- Class distribution analysis\n\
  - Feature distributions visualization\n- Correlation analysis of top features\n- Data quality checks\
  \ (missing values, constant features)\n\n### 2. Preprocessing\n- Removal of constant features\n- Feature\
  \ scaling using StandardScaler\n- Train-test split (80-20 with stratification)\n\n### 3. Feature Selection\n\
  - **ANOVA F-test** to select top 100 most significant features\n- Feature importance ranking using Random\
  \ Forest\n\n### 4. Model Training\n- **Algorithm**: Random Forest Classifier\n- **Hyperparameters**:\n\
  \  - n_estimators: 200\n  - max_depth: 15\n  - class_weight: 'balanced' (handles class imbalance)\n\
  \  - random_state: 42\n\n### 5. Validation\n- **Cross-validation**: 5-fold stratified cross-validation\n\
  - **Evaluation Metrics**: Accuracy, Precision, Recall, F1-Score, ROC-AUC\n\n## \U0001F4C8 Results\n\n\
  ### Model Performance\n| Metric | Score |\n|--------|-------|\n| Cross-validation ROC-AUC | 0.5544 (±0.1390)\
  \ |\n| Test Accuracy | 65.71% |\n| Test ROC-AUC | 0.5795 |\n\n### Classification Report\n"

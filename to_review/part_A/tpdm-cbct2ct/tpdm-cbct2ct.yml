readme_excerpt: "\n# Texture-Preserving Diffusion Model for CBCT-to-CT Synthesis\n![flow chart](./figure/flowchart.png)\n\
  \n# Introduction\nThis repository implements a texture-preserving diffusion model for CBCT-to-CT synthesis,\
  \ designed to improve the quality and accuracy of medical image synthesis.\n\n\n# Dataset\n## You should\
  \ structure your aligned dataset in the following way:\n```\ndata_path/\n  2PA092\n    ├── CT\n    │\
  \   ├── 0.npy\n    │   ├── 1.npy\n    │   ├── ...\n    ├── CBCT\n    │   ├── 0.npy\n    │   ├── 1.npy\n\
  \    │   ├── ...\n  2PA093\n    ├── CT\n    │   ├── 0.npy\n    │   ├── 1.npy\n    │   ├── ...\n    ├──\
  \ CBCT\n    │   ├── 0.npy\n    │   ├── 1.npy\n    │   ├── ...\n  ...\n\n```\n\nThe dataset links used\
  \ in this study are as follows:\n1. [SynthRAD2023](https://synthrad2023.grand-challenge.org/)\n2. [Pelvic-ReferenceData](https://wiki.cancerimagingarchive.net/display/Public/Pelvic-ReferenceData)\n\
  \n\n\nBefore using the dataset, convert the `nii.gz` data to `npy` format using `reg/nii2npy.py`, and\
  \ perform registration using `syn`. \nAll the data is standardized using the mean and standard deviation\
  \ of the raw data. The data processing is handled in dataloader.py  \n\n\n# Dependencies\n```\nalbumentations==1.3.0\n\
  einops==0.6.1\nmatplotlib==3.5.2\nnumpy==1.21.5\nopencv_contrib_python==4.7.0.72\nPillow==9.5.0\nscikit_image==0.19.2\n\
  scikit_learn==1.2.2\nSimpleITK==2.2.1\ntimm==0.6.12\ntorch==2.0.0\ntqdm==4.64.1\n```\n# Installation\n\
  * ### Clone this repo:\n```\ngit clone https://github.com/zyj15416/TPDM-CBCT2CT.git\ncd TPDM-CBCT2CT\n\
  ```\n\n# Train\n```\npython train.py, the hyperparameter settings are handled in `utils/utils.py`.\n\
  ```\n# Predict\n```\nYou can use `predict.py` to load the weights and test the dataset, and you can\
  \ modify the number of samples to improve the inference time.\n```\n\n# Pretrained Models\n```\nWe have\
  \ released pretrained weights for cbct->ct in SynthRAD2023 challenge dataset(https://pan.baidu.com/s/1ATAeiGnNeaF1G0E1z974KQ?pwd=k7m4\
  \ ). You can save these weights in relevant checkpoints folder and perform inference.\nAfter downloading\
  \ the pretrained weights, place them in the corresponding folder, such as `./weights/weights.pth`. Then,\
  \ replace the weight path in `predict.py` accordingly to perform model inference.\n```\n* ### sample_test01\n\
  ```\n A limited set of preprocessed CBCT and CT samples is provided in `sample_test01` to facilitate\
  \ validation of the model's performance.\n```\n# Citation\n```\nIf you find this repository useful for\
  \ your research, please use the following.\n{\n\n}\n```\n"

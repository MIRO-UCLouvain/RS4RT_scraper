readme_excerpt: "# Onco Arcade \U0001F3AE\n\nFree, browser-based mini-games to learn and revise **oncology,\
  \ radiation therapy and medical physics** — one new game unlocked every week.\n\n\U0001F310 **Play:**\
  \ https://oncoarcade.com\n\nOnco Arcade turns a clinical gesture, a treatment decision or an everyday\
  \ constraint into a fast, visual challenge: pilot a VMAT arc against the clock, validate a dosimetry\
  \ plan, build a spread-out Bragg peak in proton therapy, place a prostate seed implant, clear a chemotherapy\
  \ order under pressure, make the call at a tumor board, or explore a radiation oncology department in\
  \ a career-progression game. It's arcade — with real medical substance.\n\n> **The idea:** maybe we\
  \ remember better when we play.\n\n---\n\n## The games\n\nReleased one per week during the season (see\
  \ the in-page season calendar):\n\n| # | Game | What you do |\n|---|------|-------------|\n| 1 | **GTV**\
  \ | Contour the gross tumor volume |\n| 2 | **Plan, Please** | Validate treatment plans (built on Recorad)\
  \ — schemes & dose constraints |\n| 3 | **OK Chimio / Fit for chemo** | Validate chemotherapy orders\
  \ under pressure (14 regimens) |\n| 4 | **MLC Ninja** | Shape the beam with the multileaf collimator\
  \ |\n| 5 | **Fraction Hero** | Fractionation & scheduling |\n| 6 | **Seed Master** | Prostate LDR seed\
  \ implant (TRUS-guided) |\n| 7 | **Beamlet** | IMRT beamlet optimization |\n| 8 | **Bragg Peak** | Build\
  \ a spread-out Bragg peak (SOBP) in proton therapy |\n| 9 | **Tumor Board** | RCP / MCQ — NCCN-concordant\
  \ decisions (45,000+ procedurally generated cases) |\n| 10 | **RadCraft** | Explore a radiotherapy department;\
  \ progress from resident to department chief |\n\n*(Arc Racer — a VMAT time-trial — is also included\
  \ as an always-available game.)*\n\nScenarios are grounded in recommendations to stay realistic.\n\n\
  ---\n\n## How it works\n\n- Each game is a **self-contained single-file** HTML/CSS/JS app (`games/<slug>/index.html`)\
  \ — no build step, no framework, no dependencies.\n- A lightweight **PHP + MySQL backend** (`api/*.php`)\
  \ powers the shared **leaderboard**, team scores, star ratings and problem reports.\n- A **season system**\
  \ (in `index.html`) unlocks one game per week automatically, based on the visitor's date, and highlights\
  \ the \"game of the week\".\n- Bilingual **FR / EN** throughout, light/dark theme.\n\n---\n\n## Running\
  \ & deploying\n\n**Frontend (the games):** static files. Deploy the repository contents to your web\
  \ root (e.g. `oncoarcade.com/`). No build needed. GitHub Pages can host the games statically — but the\
  \ leaderboard needs PHP (see below).\n\n**Leaderboard backend (optional):**\n1. Copy `api/*.php` to\
  \ a PHP host (e.g. OVH).\n2. Create a MySQL database.\n3. Create a config file **`oa-config.php` above\
  \ the web root** (never inside it, never committed) returning an array:\n   ```php\n   <?php return\
  \ [\n     'host' => 'localhost',\n     'name' => 'your_db',\n     'user' => 'your_user',\n     'pass'\
  \ => 'your_password',\n     'charset' => 'utf8mb4',\n     'timezone' => 'Europe/Paris',\n     'shared_secret'\
  \ => '',   // must match the frontend; empty = open submissions\n   ];\n   ```\n   `api/db.php` loads\
  \ this file — **no credentials live in the code**.\n\n**Configuration:** the season start date and reveal\
  \ order are set at the top of the `oa-season` script in `index.html` (`SEASON_START`, `ORDER`). Preview\
  \ any week with `?preview=all` or `?week=N`.\n\n---\n\n## Built with AI\n\nOnco Arcade was designed\
  \ and developed hand-in-hand with AI models (**Claude**). It's both a teaching tool and a small experiment\
  \ in AI-assisted creation of medical educational content — every clinical scenario was reviewed against\
  \ guidelines before release.\n\n---\n\n## License\n\nThis project is **dual-licensed**:\n\n- **Source\
  \ code** → **MIT** — see [`LICENSE`](LICENSE).\n- **Content** (clinical scenarios, text, images) → **CC\
  \ BY-NC-SA 4.0** — see [`LICENSE-content`](LICENSE-content).\n  You may share and adapt the content\
  \ for **non-commercial** use, with **attribution**, and must share derivatives under the **same license**.\n\
  \n## Brand\n\nThe **\"Onco Arcade\" name, logo and banner artwork are reserved** and are **not** covered\
  \ by the licenses above. You are welcome to fork and reuse the code, but please do not present a modified\
  \ version as the official Onco Arcade, and do not use the name or logo in a way that implies endorsement.\n\
  \n## ⚕️ Medical disclaimer\n\nOnco Arcade is an **educational and experimental** project. The games\
  \ are **not medical devices**, do **not** replace clinical training, and must **never** be used to guide\
  \ real patient care. Clinical content is simplified for teaching.\n\n---\n\n## Author\n\nCreated by\
  \ **Jean-Emmanuel Bibault**.\n\nFeedback and issues welcome via the repository's Issues tab.\n"

readme_excerpt: "# Toxicity Classification with Machine Learning\n\n![Python](https://img.shields.io/badge/Python-3.10+-blue.svg)\n\
  ![scikit-learn](https://img.shields.io/badge/scikit--learn-ML-orange.svg)\n![XGBoost](https://img.shields.io/badge/XGBoost-Enabled-green.svg)\n\
  ![Status](https://img.shields.io/badge/Project-Notebook--First-brightgreen.svg)\n![License](https://img.shields.io/badge/License-MIT-lightgrey.svg)\n\
  \n## Overview\n\nThis project predicts whether a compound is toxic or non-toxic using molecular descriptor\
  \ data. It is a binary classification task in cheminformatics, with the main workflow presented in a\
  \ Google Colab notebook.\n\nThe repository is intentionally simple. The notebook is the main deliverable,\
  \ and a standalone Python script is included for users who want a script-based version of the workflow.\n\
  \n## Project Objective\n\nThe goal is to predict the target column `Class`, which indicates whether\
  \ a compound is toxic or non-toxic. \nThis is a supervised binary classification problem. Since missing\
  \ a toxic compound can be costly, the project evaluates models using not only accuracy but also recall,\
  \ F1-score, and ROC-AUC.\n\n## Dataset\n\nThe dataset contains 171 compounds and 1204 molecular descriptor\
  \ features. \nThe target column is `Class`, which indicates whether a compound is toxic or non-toxic.\n\
  \nThis makes the dataset high-dimensional because the number of features is large relative to the number\
  \ of samples.\n\n- Non-toxic class: 115 samples\n- Toxic class: 56 samples\n\nThe features include molecular\
  \ descriptors such as topological, autocorrelation, electronic, and information-based variables.\n\n\
  ## Workflow\n\nThe machine learning pipeline follows this sequence:\n\n1. Load and inspect the dataset\n\
  2. Perform exploratory data analysis\n3. Preprocess the data and handle missing values\n4. Apply feature\
  \ selection\n5. Train and compare several machine learning models\n6. Use nested cross-validation for\
  \ more reliable evaluation\n7. Interpret the best model using classification metrics and plots\n\n##\
  \ Models Evaluated\n\n- Random Forest\n- Gradient Boosting\n- XGBoost\n- AdaBoost\n- Extra Trees\n\n\
  ## Exploratory Data Analysis (EDA)\n\nEDA was performed to better understand the dataset before modeling.\
  \ This included:\n\n- inspecting the dataset shape\n- checking missing values\n- analyzing class distribution\n\
  - visualizing correlations between features\n\n\n## Feature Selection\n\nBecause the dataset contains\
  \ a large number of features, feature selection was applied to reduce dimensionality and remove less\
  \ informative variables.\n\nFeature selection helps:\n\n- reduce overfitting\n- improve model interpretability\n\
  - reduce computational cost\n\n\n## Validation Strategy\n\nBecause the dataset is relatively small and\
  \ moderately imbalanced, nested cross-validation was used for model evaluation.\n\nNo traditional train-test\
  \ split was used. Instead, the model was evaluated entirely using cross-validation, with:\n\n- an inner\
  \ loop for hyperparameter tuning\n- an outer loop for unbiased performance evaluation\n\n## Key Metrics\n\
  \n- Accuracy\n- Precision\n- Recall\n- F1-score\n- ROC-AUC\n\n## Repository Structure\n\n```bash\n.\n\
  ├── README.md\n├── requirements.txt\n├── .gitignore\n├── LICENSE\n├── data.csv\n├── toxicity_classification.ipynb\n\
  └── toxicity_ml_pipeline.py\n```\n\n## How to Use\n\n### Notebook\n\nOpen `toxicity_classification.ipynb`\
  \ in Jupyter Notebook or Google Colab and run the cells in order.\n\n### Script\n\nRun the standalone\
  \ script with:\n\n```bash\npython toxicity_ml_pipeline.py\n```\n\nThe script expects `data.csv` to be\
  \ in the project root.\n\n\n\n## Results\n\nThe notebook contains the full model comparison, nested\
  \ cross-validation scores, confusion matrix, ROC curve, and feature importance analysis.\n\n## Future\
  \ Improvements\n\n- test additional feature selection methods\n- calibrate predicted probabilities\n\
  - use SHAP for richer model interpretation\n- explore imbalance-handling methods\n- expand the dataset\
  \ with more labeled compounds\n\n## Conclusion\n\nThis project presents a complete machine learning\
  \ workflow for toxicity prediction using molecular descriptor data. It emphasizes careful validation,\
  \ practical model comparison, and reproducible analysis in a notebook-first format.\n\n## License\n\n\
  This project is licensed under the MIT License. See `LICENSE` for details.\n"

description: This repository contains code to analyse biological effects of radiation and radiotherapy
  over time. It uses hybrid templates to register images and create a voxel-by-voxel data set to follow
  in-vivo changes due to radiation damage. A nested regession model is provided in R. It is the code used
  in the paper by M. Skaarup et al. "A framework for voxel-based assessment of biological effect after
  proton radiotherapy in pediatric brain cancer patients using multi-modal imaging" (2021)

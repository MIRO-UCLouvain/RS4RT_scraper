readme_excerpt: "# Syntho-Scan\nA segmentation-guided CycleGAN framework that generates accurate synthetic\
  \ CTs from MRIs to eliminate patient radiation exposure. \nBy aligning target and generated segmentation\
  \ maps using a Universal Segmentation Model, the approach overcomes scan misalignments\nand significantly\
  \ outperforms baseline synthesis accuracy.\nLinked with a lightweight web app plus FastAPI inference\
  \ service for the SynthRAD 2023 medical image translation workflow.\n\n## Dataset source\nThe project\
  \ is intended to work with the public SynthRAD 2023 challenge data:\nhttps://synthrad2023.grand-challenge.org/\n\
  \n## Repository layout\n- `app.js` — Express web application and frontend proxy.\n- `app.py` — FastAPI\
  \ image inference service.\n- `public/` — static website pages.\n- `models.py` and `train.py` — model\
  \ architecture and training code.\n\n## Local setup\n\n### 1. Python environment\n```bash\npython -m\
  \ venv .venv\n.venv\\Scripts\\activate\npip install -r requirements.txt\n```\n\n### 2. Node environment\n\
  ```bash\nnpm install\n```\n\n### 3. Start the API\n```bash\nuvicorn app:app --reload --port 8001\n```\n\
  \n### 4. Start the web app\n```bash\nnode app.js\n```\n\nThen open the UI at:\n- http://localhost:3000/\n\
  \n## Notes\nThe current backend expects trained generator checkpoints such as `no_seg_best_netG_A2B.pth`\
  \ and `no_seg_best_netG_B2A.pth` to exist in the repo root.\n\n\n## Acknowledgments\nThis project builds\
  \ on the CycleGAN-style training and inference workflow used for the medical image translation task,\
  \ with the SynthRAD dataset as the intended data source.\nMany thanks to my supervising professor Dr.Tariq\
  \ Bdair, and partners Leen Daqqa & Hamza Siam \nThe link to the full publication explaining our approach\
  \ is : https://ieeexplore.ieee.org/document/10989376\n\n"

readme_excerpt: "# \U0001F4CC Comment Toxicity Detection (Deep Learning + Streamlit)\n\n## \U0001F4D6\
  \ Project Overview  \nThis project builds an AI-powered system to detect toxic comments using Deep Learning\
  \ (LSTM) and NLP.\n\nIt classifies comments into:\n- Toxic  \n- Severe Toxic  \n- Obscene  \n- Threat\
  \  \n- Insult  \n- Identity Hate  \n\nThe model is deployed using a Streamlit web application.\n\n---\n\
  \n## \U0001F3AF Problem Statement  \nOnline platforms face hate speech and offensive language.  \nManual\
  \ moderation is slow.  \nThis project automates toxicity detection.\n\n---\n\n## \U0001F680 Features\
  \  \n- Real-time prediction  \n- Multi-label classification  \n- Bulk CSV prediction  \n- Streamlit\
  \ UI  \n- Model visualization  \n\n---\n\n## \U0001F9E0 Tech Stack  \nPython, TensorFlow, Keras, NLTK,\
  \ Pandas, NumPy, Scikit-learn, Streamlit  \n\n---\n\n## \U0001F4C2 Project Structure  \nCommentToxicity/\n\
  ├── artifacts/\n├── train.csv\n├── test.csv\n├── data.py\n├── app.py\n└── README.md\n\n---\n\n## \U0001F504\
  \ Workflow  \nData → Preprocessing → Tokenization → LSTM → Prediction → Streamlit  \n\n---\n\n## ▶️\
  \ How to Run  \n\n### Install Dependencies  \npip install -r requirements.txt  \n\n### Train Model \
  \ \npython data.py  \n\n### Run App  \nstreamlit run app.py  \n\n---\n\n## \U0001F4E5 Input Format \
  \ \nCSV must contain column: comment_text  \n\n---\n\n## \U0001F4CA Output  \nShows probability for\
  \ each toxicity label.\n\n---\n\n## \U0001F30D Use Cases  \nSocial media moderation, forums, brand safety,\
  \ education platforms  \n\n---\n\n## \U0001F4C8 Future Work  \n- Use BERT  \n- Deploy API  \n- Cloud\
  \ deployment  \n\n---\n\n## \U0001F468‍\U0001F4BB Author  \nSai Haranadh\n"

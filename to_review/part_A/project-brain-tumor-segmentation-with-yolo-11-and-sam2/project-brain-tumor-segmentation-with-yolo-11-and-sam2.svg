<svg viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="160" fill="#f6f5f1"/>
  <g font-size="13" fill="#1c1e22">
    <rect x="10" y="55" width="110" height="50" rx="8" fill="#ffffff" stroke="#c9c5ba"/>
    <text x="65" y="85" text-anchor="middle">MRI slice</text>

    <line x1="120" y1="80" x2="170" y2="80" stroke="#2f4b7c" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="170" y="45" width="140" height="70" rx="8" fill="#e7ecf4" stroke="#2f4b7c"/>
    <text x="240" y="75" text-anchor="middle" font-weight="600">YOLO detector</text>
    <text x="240" y="95" text-anchor="middle" font-size="11">bounding boxes</text>

    <line x1="310" y1="80" x2="360" y2="80" stroke="#2f4b7c" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="360" y="45" width="150" height="70" rx="8" fill="#e7ecf4" stroke="#2f4b7c"/>
    <text x="435" y="75" text-anchor="middle" font-weight="600">SAM2 predictor</text>
    <text x="435" y="95" text-anchor="middle" font-size="11">box-prompted masks</text>

    <line x1="510" y1="80" x2="560" y2="80" stroke="#2f4b7c" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="560" y="55" width="70" height="50" rx="8" fill="#ffffff" stroke="#c9c5ba"/>
    <text x="595" y="85" text-anchor="middle">Masks</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2f4b7c"/>
    </marker>
  </defs>
</svg>

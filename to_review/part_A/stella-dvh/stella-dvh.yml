  HEDOS analysis for Stella


  # How to run

  1. `git clone https://github.com/Lucas-Mc/stella-dvh.git`

  2. `python3 -m venv env`

  3. `source env/bin/activate`

  4. `pip install -r requirements.txt`

  5. `jupyter stella_dvh.ipynb`

  6. Have fun!


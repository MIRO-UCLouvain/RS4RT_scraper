readme_excerpt: '# DVH Points Investigation

  This data analysis explores how two radiation therapy treatment planning systems, RayStation (version
  11A) and TomoTherapy&trade; (Hi-Art&reg;, version 5.1), determine which DVH points to export to a text
  file.


  ## Dependencies

  Required packages are listed in `requirements.txt`.


  ## Files and Folders

  - `data/`: The example exported DVH files used in the analysis

  - `images/`: Images used in the Markdown in the Jupyter Notebook

  - `dvh_points_investigation.ipynb`: Jupyter Notebook data exploration and analysis file


  ## Updates

  Please provide your suggestions for bug fixes, changes, and enhancements by raising an issue or by contacting
  the [author](https://linkedin.com/in/kaley-white) at kwhite31415@gmail.com.'

readme_excerpt: "# Drug Database - 12,539+ Compounds\n\n## \U0001F4CA Available Datasets\n\n| File | Entries\
  \ | Description | Size |\n|------|---------|-------------|------|\n| `approved_drugs.csv` | 9,398 |\
  \ FDA approved drugs with SMILES | 6.6 MB |\n| `fda_drugs.json` | 30,053 | Complete FDA drug database\
  \ | 6.9 MB |\n| `all_drugs_combined.csv` | 2,789 | Curated drug collection | 221 KB |\n| `pubchem_smiles.json`\
  \ | 12,096 | PubChem compound SMILES | 2.4 MB |\n| `complete_dataset.csv` | 3,920 | Full dataset with\
  \ properties | 347 KB |\n\n## \U0001F4E5 Download Links\n\n### Direct Download (ZIP)\n```bash\nwget\
  \ https://github.com/CADDMAN8055/toxicity-prediction/archive/refs/heads/main.zip\n```\n\n### Clone Repository\n\
  ```bash\ngit clone https://github.com/CADDMAN8055/toxicity-prediction.git\n```\n\n### Individual Files\n\
  - [approved_drugs.csv](https://raw.githubusercontent.com/CADDMAN8055/toxicity-prediction/main/approved_drugs.csv)\n\
  - [fda_drugs.json](https://raw.githubusercontent.com/CADDMAN8055/toxicity-prediction/main/fda_drugs.json)\n\
  - [pubchem_smiles.json](https://raw.githubusercontent.com/CADDMAN8055/toxicity-prediction/main/pubchem_smiles.json)\n\
  \n## \U0001F4CB Data Fields\n\nEach entry includes:\n- **Name**: Drug/compound name\n- **SMILES**: Canonical\
  \ SMILES structure\n- **Molecular Weight (MW)**: Calculated from SMILES\n- **CAS Number** (where available)\n\
  - **Source**: FDA, PubChem, ChEMBL, etc.\n\n## \U0001F52C Usage\n\n### Load in Python\n```python\nimport\
  \ pandas as pd\n\n# Load CSV\ndf = pd.read_csv('approved_drugs.csv')\nprint(f\"Total drugs: {len(df)}\"\
  )\nprint(f\"Columns: {df.columns.tolist()}\")\n\n# Filter by molecular weight\nmw_range = df[(df['mw']\
  \ > 200) & (df['mw'] < 500)]\nprint(f\"Drugs with MW 200-500: {len(mw_range)}\")\n```\n\n### Calculate\
  \ MW from SMILES\n```python\nfrom rdkit import Chem\nfrom rdkit.Chem import Descriptors\n\ndef get_mw(smiles):\n\
  \    mol = Chem.MolFromSmiles(smiles)\n    return Descriptors.MolWt(mol) if mol else None\n```\n\n##\
  \ \U0001F4CA Statistics\n\n- **Total unique compounds**: 12,539+\n- **Average MW**: 387.5 Da\n- **MW\
  \ range**: 50 - 1500 Da\n- **Sources**: FDA Orange Book, PubChem, ChEMBL, DrugBank\n\n## \U0001F517\
  \ Repository\n\n**GitHub**: https://github.com/CADDMAN8055/toxicity-prediction\n\n## \U0001F4DD License\n\
  \nData sourced from public databases (FDA, PubChem). Free for research use.\n\n## \U0001F464 Author\n\
  \n**GM Sir** - Pharmaceutical Research Scientist\n- 10+ years in Computer-Aided Drug Design\n- 22+ publications\n\
  - Developer of ROS-OptiPath™ and MolDesign-Accelerator™\n"

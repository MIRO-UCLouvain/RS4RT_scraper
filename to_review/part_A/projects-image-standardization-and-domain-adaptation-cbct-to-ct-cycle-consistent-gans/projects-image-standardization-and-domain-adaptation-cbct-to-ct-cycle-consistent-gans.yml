readme_excerpt: "# Analysis and comparison of cycle-consistent adversarial networks for CBCT to CT translation\
  \ for adaptive radiotherapy in cervical and lung cancer patients\n\n[Paper](UPDATE)\n\nWe used [ganslate](https://github.com/ganslate-team/ganslate)\
  \ framework for these experiments.\n\n## Structure\n\nThis repository contains the experiment configuration\
  \ files and PyTorch dataset loading and preprocessing that we used in our paper.\n\nIt is organized\
  \ into two folders:\n\n- `LungProton` - experiments and dataset classes for **lung** CBCT-to-CT translation\
  \ for adaptive **proton** radiotherapy\n\n- `CervixPhoton` - experiments and dataset classes for **cervix**\
  \ CBCT-to-CT translation for adaptive **photon** radiotherapy\n\n## Running\n\nTo run the experiments\
  \ (if you have access to the data):\n```\npip install ganslate\n\ngit clone git@github.com:ganslate-team/CBCT-to-CT-cycle-consistent-GANs.git\n\
  cd CBCT-to-CT-cycle-consistent-GANs\n\n# change the config file accordingly\nganslate train config=\"\
  ./LungProton/experiments/1_2D_cyclegan_vnet.yaml\" \n```\n\n## Acknowledgments\n\n## Citation\n```text\n\
  ```\n"

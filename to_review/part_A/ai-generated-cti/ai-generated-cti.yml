readme_excerpt: "# AI-Generated-CTI\n\nThis project focuses on **Generation and Evaluation of Synthetic\
  \ Cyber Threat Intelligence** using resource-efficient fine-tuned language models.\n\n---\n\n## Overview\n\
  \nThe synthetic CTI samples were generated using a **4-bit quantized [TinyLlama model](https://huggingface.co/unsloth/tinyllama-bnb-4bit)**,\
  \ which was fine-tuned on cybersecurity-related corpus.  \nGenerated samples then underwent a multifaceted\
  \ evaluation process, with one crucial step being detection using a custom-built hybrid detection system.\n\
  \n---\n\n## Detection System\n\nA hybrid detection system was developed to identify fake vs. real CTI\
  \ descriptions. It combines two models from the **BERT family**:\n\n- [**DistilBERT**](https://huggingface.co/distilbert/distilbert-base-uncased)\
  \  \n- [**BERT-Tiny**](https://huggingface.co/prajjwal1/bert-tiny)\n\n![](detector_plots/final_model_combined/confusion_matrix_test_data_combined.svg)\
  \  \n*Confusion Matrix for Classifier Distinguishing Human and Fine-Tuned Model Texts.*\n\n---\n\n##\
  \ Survey\n\nAdditionally, a subset of 100 CTI samples (50 generated by fine-tuned TinyLlama and 50 real\
  \ CTI descriptions) was evaluated by:\n\n- Cybersecurity experts (students and experienced analysts)\
  \  \n  ![](survey/histogram_accuracy_All.svg)  \n  *Accuracy Distribution Across All Respondents.*\n\
  \n- Four large language models (LLMs)  \n  ![](survey/confusion_matrix_chatgpt_response.svg)  \n  *Confusion\
  \ Matrix for Chat GPT 4 Classification on Survey Dataset.*\n\nThe evaluation results, presented in plots,\
  \ can be found in the [`survey/`](./survey) directory.\n\n---\n\n## Corpus\n\nThe dataset used for TinyLlama\
  \ fine-tuning includes multiple sources:\n\n- APTnotes (2008–2024) – a collection of Advanced Persistent\
  \ Threat (APT) reports from the [APTnotes repository](https://github.com/aptnotes/data/), downloaded\
  \ using tools from [APTnotes Tools](https://github.com/aptnotes/tools) and collected in the local `APTnotes`\
  \ directory. \n- Additional CTI datasets from the [Hugging Face platform](https://huggingface.co/datasets).\n"

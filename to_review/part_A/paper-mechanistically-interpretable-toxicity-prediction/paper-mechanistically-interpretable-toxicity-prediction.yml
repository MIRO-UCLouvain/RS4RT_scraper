readme_excerpt: "# Integrating Chemical Structure and High-Throughput Transcriptomics for Mechanistically\
  \ Interpretable Tox21 Bioactivity Prediction\n\n![Workflow Overview](extra/overview_machine_learning_framework.png)\n\
  \n<br>\n\nSupporting Information for DOI\n\n<br>\n\n\n## Overview\n\nThis repository contains the complete\
  \ computational pipeline for predicting chemical toxicity endpoints by integrating molecular structure\
  \ fingerprints and dose-dependent transcriptomic signatures. The approach combines high-throughput transcriptomics\
  \ (HTTr) data from three human cell lines (MCF7, U2OS, HepaRG) with chemical structure information (MACCS\
  \ fingerprints) to train interpretable machine learning models for 41 curated Tox21 assay endpoints.\n\
  \nAll analyses are included in the `analyses/` directory, with scripts and notebooks that cover data\
  \ extraction, differential expression analysis, data integration, model training, evaluation, and result\
  \ interpretation. The `data/` directory contains the necessary datasets, while the `output/` directory\
  \ stores the results generated from the modeling pipeline, including performance metrics and interpretability\
  \ analyses. Note: due to file size constraints, some large data files need to be generated using the\
  \ provided scripts. \n\n<br>\n\n## Repository Structure\n```\n.\n├── analyses/               \n│   ├──\
  \ 01_assay_database_extraction_and_selection.py\n│   ├── 02a_MCF7_DE_analysis.Rmd\n│   ├── 02b_U2OS_DE_analysis.Rmd\n\
  │   ├── 02c_HepaRG_DE_analysis.Rmd\n│   ├── 03_combining_and_activity_mapping.Rmd\n│   ├── 04_chemical_integration_and_data_aggregation.ipynb\n\
  │   ├── 05_modelling_and_evaluation.py\n│   └── 06_results_analyses.ipynb\n│\n├── data/\n│   ├── chemical_httr_assay_aggregated.feather\n\
  │   ├── HTS/                                        # High-throughput screening assay data\n│   ├──\
  \ HTTr/                                       # Transcriptomic data and metadata\n│   └── chemical/\
  \                                   # Chemical structure and fingerprint data\n│\n├── output/      \
  \        \n│   ├── figures_and_tables/                         \n│   │   ├── figure_01_feature_reduction_waterfall.png\n\
  │   │   ├── figure_02_assay_performance_metrics_panel.png\n│   │   ├── figure_03_SHAP_plot_PR_antagonist.png\n\
  │   │   ├── table_01_performance_table_paper.csv\n│   │   └── ...                            \n│   │\n\
  │   ├── TOX21_PR_BLA_Antagonist_ratio/              # Example assay output directory\n│   │   ├── run_summary.json\
  \                        # Aggregated CV metrics\n│   │   ├── run_log.txt                          \
  \   # Execution log with timestamps\n│   │   ├── fold_details.csv                        # Per-fold\
  \ performance breakdown\n│   │   ├── oof_predictions.csv                     # Out-of-fold predictions\n\
  │   │   ├── oof_predictions_with_httr_ad.csv        # Out-of-fold predictions with HTTr AD\n│   │  \
  \ ├── oof_predictions_with_structural_ad.csv  # Out-of-fold predictions with structural AD\n│   │  \
  \ ├── oof_httr_structural_ad_summary.csv      # Summary of AD coverage for HTTr and structural features\n\
  │   │   ├── oof_structural_ad_summary.csv           # Summary of AD coverage for structural features\n\
  │   │   ├── feature_importance_summary.csv          # XGBoost feature importances\n│   │   ├── feature_ranking.csv\
  \                     # Boruta selection frequencies\n│   │   │\n│   │   └── shap/                 \
  \                  # SHAP interpretability outputs\n│   │       ├── oof_shap.feather               \
  \     # Aggregated SHAP values (all test samples)\n│   │       ├── shap_global_rank_oof.csv        \
  \    # Global feature ranking\n│   │       ├── shap_rank_all_folds.csv             # Feature ranking\
  \ aggregated across folds\n│   │       ├── shap_summary_by_fold.csv            # Summary statistics\
  \ per fold\n│   │       └── per_fold/                           # Individual fold SHAP results\n│  \
  \ │           ├── shap_test_fold_1.feather\n│   │           ├── shap_rank_fold_1.csv\n│   │        \
  \   └── ...\n│   │\n│   └── [40 additional assay directories with identical structure]\n│\n└── extra/\n\
  \    ├── ablation/                                   # Ablation study outputs\n    └── overview_machine_learning_framework.png\
  \     # Overview image\n```\n\n\n"

readme_excerpt: "# Deep Learning and Classical Segmentation for Liver Tumor Detection from CT Images\n\
  \nA comparative medical image segmentation project that evaluates **classical K-Means segmentation**\
  \ against a **deep learning U-Net architecture with a ResNet34 encoder** for automated **liver and tumor\
  \ segmentation from CT scans**.\n\nThe project includes complete preprocessing of 3D CT volumes, conversion\
  \ into annotated 2D slices, model training, hyperparameter tuning, and quantitative evaluation using\
  \ medical segmentation metrics.\n\n---\n\n## Project Overview\n\nMedical image segmentation is an important\
  \ step in computer-aided diagnosis and treatment planning.\n\nThis project investigates two approaches\
  \ for segmenting liver tumors from CT scans:\n\n1. **Classical Computer Vision Approach**\n\n   * K-Means\
  \ clustering\n   * Morphological post-processing\n   * Hyperparameter tuning\n\n2. **Deep Learning Approach**\n\
  \n   * U-Net architecture\n   * ResNet34 encoder backbone\n   * Dice + Cross Entropy optimization\n\
  \   * Transfer learning and staged fine-tuning\n\nThe objective is to compare segmentation quality and\
  \ inference performance across both approaches.\n\n---\n\n## Dataset\n\nDataset used:\n\n**Liver Tumor\
  \ Segmentation Dataset (LiTS)**\n\nSource:\nhttps://www.kaggle.com/datasets/andrewmvd/liver-tumor-segmentation\n\
  \nDataset preparation included:\n\n* Loading original 3D CT volumes\n* Converting volumes into 2D slices\n\
  * Matching segmentation masks with CT scans\n* Removing slices without meaningful annotations\n* Filtering\
  \ very small liver regions to reduce noise\n* Train/validation split at volume level to avoid leakage\n\
  \n---\n\n## Pipeline\n\n### 1. Data Preprocessing\n\n* Loaded CT volumes using `nibabel`\n* Converted\
  \ volumetric scans into 2D image slices\n* Preserved segmentation alignment\n* Removed low-information\
  \ slices\n* Organized data into train/validation directories\n\n---\n\n### 2. Baseline Segmentation\
  \ — K-Means\n\nClassical segmentation baseline implemented using:\n\n* K-Means clustering\n* Spatial\
  \ intensity masking\n* Morphological erosion\n* Morphological dilation\n* Closing operations\n\nHyperparameters\
  \ were tuned through search over:\n\n* Number of clusters\n* Target cluster\n* Gaussian masking strength\n\
  * Morphological iterations\n* Kernel sizes\n\n---\n\n### 3. Deep Learning Segmentation — U-Net\n\nModel\
  \ configuration:\n\n* Architecture: U-Net\n* Encoder: ResNet34\n* Encoder weights: ImageNet\n* Input\
  \ channels: 1 (grayscale CT)\n* Output classes:\n\n  * Background\n  * Liver\n  * Tumor\n\nTraining\
  \ strategy:\n\nPhase 1:\n\n* Frozen encoder training\n\nPhase 2:\n\n* Full fine-tuning\n\nAdditional\
  \ improvements:\n\n* Mixed precision training\n* Class-weighted loss\n* Data augmentation\n* Early stopping\n\
  * Learning rate scheduling\n\n---\n\n## Loss Function\n\nCombined objective:\n\n* Dice Loss\n* Weighted\
  \ Cross Entropy Loss\n\nThis combination improves performance under class imbalance common in medical\
  \ datasets.\n\n---\n\n## Evaluation Metrics\n\nModels were evaluated using:\n\n* Dice Score\n* Intersection\
  \ over Union (IoU)\n* Precision\n* Recall\n* Average inference time\n\nVisual comparisons were also\
  \ generated using:\n\n* Ground truth masks\n* Predicted masks\n* Segmentation overlays\n"

readme_excerpt: "# Semantic Liver Tumor Segmentation \n\nThis project performs liver tumor segmentation\
  \ on 3D CT scans using a 2D U-Net model in TensorFlow.\n\n## Steps:\n- Preprocessing of NIfTI CT & mask\
  \ files\n- Training U-Net with slice-wise data\n- Predicting tumor masks\n- Evaluation (Precision, Recall,\
  \ F1, Dice, Confusion Matrix)\n\n## Dependencies\n- TensorFlow\n- NumPy\n- OpenCV\n- matplotlib\n- scikit-learn\n\
  - nibabel\n"

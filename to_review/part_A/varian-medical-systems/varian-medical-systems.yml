  Varian Medical Systems is a leading manufacturer of medical devices and software for treating cancer
  with radiotherapy, radiosurgery, proton therapy, and brachytherapy. Acquired by Siemens Healthineers
  in 2021, Varian provides the ARIA Oncology Information System (OIS) and developer APIs enabling integration
  with clinical workflows, EHR systems, and the broader healthcare ecosystem using HL7, DICOM, and FHIR
  standards.


  **APIs.json:** [https://raw.githubusercontent.com/api-evangelist/varian-medical-systems/refs/heads/main/apis.yml](https://raw.githubusercontent.com/api-evangelist/varian-medical-systems/refs/heads/main/apis.yml)



  ## APIs


  ### ARIA FHIR API


  The Varian ARIA FHIR R4 API provides SMART on FHIR access to oncology clinical data from the ARIA Oncology
  Information System. Supports read and search operations for Patient, Condition, Procedure, Observation,
  DiagnosticReport, CarePlan, MedicationRequest, and other clinical resources relevant to cancer care.


  - **Human URL:** [https://varian.dynamicfhir.com/varian/basepractice/r4/Home/ApiDocumentation](https://varian.dynamicfhir.com/varian/basepractice/r4/Home/ApiDocumentation)

  - **Base URL:** `https://varian.dynamicfhir.com/fhir/varian/basepractice/r4`



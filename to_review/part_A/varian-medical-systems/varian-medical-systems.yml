  ### ARIA Access API


  The legacy ARIA Access API provides SOAP and REST access to core ARIA entities including patients, appointments,
  prescriptions, treatment plans, orders, and administrative data. Deployed on-premise within the healthcare
  institution''s infrastructure.


  - **Human URL:** [https://www.gatewayscripts.com/post/webinars-revisited-a-review-of-aria-apis](https://www.gatewayscripts.com/post/webinars-revisited-a-review-of-aria-apis)

  - **Base URL:** `https://localhost:55051/Gateway/Service.svc`



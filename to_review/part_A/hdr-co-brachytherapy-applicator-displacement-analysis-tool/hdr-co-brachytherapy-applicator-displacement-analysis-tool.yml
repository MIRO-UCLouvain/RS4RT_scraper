readme_excerpt: "# HDR Co⁶⁰ Brachytherapy Applicator Displacement Analysis Tool\n\n## \U0001F4D6 Overview\n\
  Python-based software for quantifying inter-fractional applicator displacement \nin cervical cancer\
  \ HDR brachytherapy using orthogonal radiographs.\n\n## \U0001F3AF Features\n- 3D displacement vector\
  \ calculation from AP/lateral radiographs\n- Integrated BED/EQD₂ radiobiological dose calculator\n-\
  \ Clinical report generation with statistical summaries\n- DICOM image support with auto-enhancement\n\
  - User-friendly GUI (Tkinter-based)\n\n## \U0001F4DA Associated Thesis\n**Development of an Image-Based\
  \ Tool for Detecting Inter-Fractional Applicator Variations and Their Dosimetric Impact in HDR Co⁶⁰\
  \ Brachytherapy for Cervical Cancer**\n\nAuthor: W. V. A. S. Lochana (AHS/19/RAD/019)  \nUniversity:\
  \ University of Peradeniya, Sri Lanka  \nYear: 2025  \nSupervisors: Dr. Buddhinie Karunarathne, Ms.\
  \ L. P. G. Sherminie\n\n\U0001F680 Deployment & Installation Tools\nThis project includes two specialized\
  \ deployment scripts:\n\n1. deploy.py – Multi-Platform Deployment Script\nPurpose: Creates distributable\
  \ packages of the application for different deployment scenarios.\n\nWhat it does:\n\n✅ Checks for Python\
  \ installation\n\n✅ Installs required dependencies (Pillow, OpenCV, NumPy, tkcalendar, matplotlib, pydicom)\n\
  \n✅ Option 1: Creates a standalone Windows executable (.exe) using PyInstaller\n\n✅ Option 2: Creates\
  \ a portable package with platform-specific launchers\n\n✅ Option 3: Does both simultaneously\n\nKey\
  \ outputs:\n\ndist/HDR_Brachytherapy.exe – Single-file executable (Windows)\n\nHDR_Brachytherapy_Portable/\
  \ – Cross-platform package with:\n\nRUN_WINDOWS.bat\n\nrun_linux.sh\n\nrun_mac.sh\n\nrequirements.txt\n\
  \nREADME.txt\n\n2. installer.py – One-Click Installation Wrapper\nPurpose: Simplifies the deployment\
  \ process for end-users with minimal technical knowledge.\n\nWhat it does:\n\n✅ Verifies Python installation\
  \ and PATH configuration\n\n✅ Automatically installs PyInstaller\n\n✅ Runs deploy.py with optimal settings\n\
  \n✅ Provides clear success/error messages\n\n✅ Creates both executable and portable versions by default\n\
  \n\U0001F4E5 How to Use\nFor Developers / Advanced Users:\nbash\n# 1. Clone/download all files\n# 2.\
  \ Run deployment directly\npython deploy.py\n# Follow on-screen prompts to choose deployment method\n\
  For End-Users / Simplified Installation:\nbash\n# 1. Download all files to a folder\n# 2. Double-click\
  \ installer.py (Windows) or run:\npython installer.py\n# 3. The script will automatically:\n#    - Check\
  \ for Python\n#    - Install required tools\n#    - Create the application executable\nRunning the Application:\n\
  Windows: Double-click HDR_Brachytherapy.exe in the dist folder\n\nPortable version: Run the appropriate\
  \ launcher for your OS\n\nDirect Python: Run HDR Co60 Brachytherapy - Image Analysis Suite (136).py\n\
  \n\U0001F527 Requirements\nPython 3.8+ (for portable version)\n\nWindows 7/10/11, macOS 10.14+, or Linux\
  \ with GUI\n\n4GB RAM minimum, 8GB recommended\n\n500MB free disk space\n\nScreen resolution: 1280×720\
  \ minimum\n\n\U0001F4E6 Included Python Libraries\nThe deployment scripts automatically install:\n\n\
  Pillow (Image processing)\n\nopencv-python (Computer vision)\n\nnumpy (Numerical computations)\n\ntkcalendar\
  \ (Date selection widgets)\n\nmatplotlib (Graphing and plotting)\n\npydicom (DICOM medical image handling)\n\
  \n\U0001F198 Support\nFor technical issues or questions about this code:\n\U0001F4E7 Email: lochanasachindra123@gmail.com\n\
  \n\n"

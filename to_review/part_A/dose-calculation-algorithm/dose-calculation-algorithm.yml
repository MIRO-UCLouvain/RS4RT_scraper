readme_excerpt: "# Phần Mềm Tính Toán Liều Xạ Trị (Dose Calculation Algorithm)\n\n## \U0001F4CB Mô Tả\
  \ Dự Án\n\nPhần mềm tính toán liều bức xạ chuyên nghiệp cho máy gia tốc tuyến tính (LINAC) trong xạ\
  \ trị ung thư, hỗ trợ đa dạng các thuật toán tiên tiến và dữ liệu commissioning từ Varian TrueBeam.\
  \ Dự án này nhằm cung cấp công cụ tính toán độc lập để xác minh và đảm bảo chất lượng kế hoạch xạ trị.\n\
  \n## \U0001F3AF Mục Tiêu\n\n- **Chính xác cao**: Đạt độ chính xác >95% so với hệ thống kế hoạch xạ trị\
  \ thương mại\n- **Đa thuật toán**: Hỗ trợ nhiều thuật toán tính toán liều hiện đại\n- **Tính độc lập**:\
  \ Có thể hoạt động độc lập để xác minh kế hoạch xạ trị\n- **Hiệu năng cao**: Tối ưu hóa tốc độ tính\
  \ toán với GPU computing\n- **Mở rộng**: Dễ dàng thêm thuật toán và loại máy xạ trị mới\n\n## \U0001F9EE\
  \ Các Thuật Toán Được Hỗ Trợ\n\n### 1. Pencil Beam (PB)\n- **Finite Size Pencil Beam (FSPB)**: Thuật\
  \ toán pencil beam với kích thước hữu hạn\n- **Adaptive Beamlet-based FSPB (AB-FSPB)**: Phiên bản tối\
  \ ưu với beamlet thích ứng\n- **GPU-accelerated FSPB**: Tăng tốc với GPU, đạt speedup 200-400x\n\n###\
  \ 2. Convolution/Superposition (C/S)\n- **Collapsed Cone Convolution (CCC)**: Thuật toán convolution\
  \ cone thu gọn\n- **Point Kernel Convolution**: Convolution với kernel điểm\n- **Anisotropic Analytical\
  \ Algorithm (AAA)**: Thuật toán phân tích dị hướng\n\n### 3. Monte Carlo Based\n- **Acuros XB (AXB)**:\
  \ Thuật toán dựa trên phương pháp Boltzmann transport\n- **Electron Monte Carlo (eMC)**: Mô phỏng Monte\
  \ Carlo cho chùm electron\n\n### 4. Grid-Based Methods\n- **Grid-Based Superposition**: Tính toán trên\
  \ lưới không gian 3D\n- **Multi-resolution Grid**: Lưới đa độ phân giải cho tối ưu hiệu năng\n\n## \U0001F6E0\
  ️ Công Nghệ Sử Dụng\n\n### Ngôn Ngữ Lập Trình\n- **Python 3.9+**: Ngôn ngữ chính cho rapid prototyping\
  \ và scientific computing\n- **C++**: Cho các module yêu cầu hiệu năng cao\n- **CUDA C++**: Cho GPU\
  \ computing và parallel processing\n\n### Thư Viện & Framework\n```python\n# Core Scientific Computing\n\
  numpy >= 1.21.0          # Tính toán mảng và đại số tuyến tính\nscipy >= 1.7.0           # Thuật toán\
  \ khoa học và tối ưu hóa\nmatplotlib >= 3.4.0      # Visualization và plotting\n\n# Medical Image Processing\n\
  pydicom >= 2.3.0         # Xử lý file DICOM\nSimpleITK >= 2.1.0       # Image registration và processing\n\
  nibabel >= 3.2.0         # Xử lý file NIfTI\n\n# GPU Computing\ncupy >= 10.0.0           # GPU-accelerated\
  \ NumPy\npycuda >= 2021.1         # CUDA Python bindings\nnumba >= 0.56.0          # JIT compilation\n\
  \n# Data Processing\npandas >= 1.3.0          # Data manipulation và analysis\nh5py >= 3.6.0       \
  \     # HDF5 file format\nopenpyxl >= 3.0.9        # Excel file processing\n\n# Machine Learning (Future)\n\
  tensorflow >= 2.8.0      # Deep learning framework\nscikit-learn >= 1.0.0    # Traditional ML algorithms\n\
  \n# GUI (Optional)\ntkinter                   # Cross-platform GUI\nPyQt6                     # Advanced\
  \ GUI framework\n```\n\n### Cơ Sở Dữ Liệu\n- **HDF5**: Lưu trữ dữ liệu beam model và dose distributions\n\
  - **SQLite**: Quản lý metadata và cấu hình thuật toán\n\n## \U0001F4C1 Cấu Trúc Dự Án\n\n```\nDose_calculation_algorithm/\n\

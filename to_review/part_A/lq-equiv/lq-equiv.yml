readme_excerpt: '# LQL-Equiv


  [![DOI](https://zenodo.org/badge/DOI/10.5281/zenodo.16739883.svg)](https://doi.org/10.5281/zenodo.16739883)

  Open-source MATLAB software for **biologically equivalent dose calculation in radiotherapy**, based
  on the linear-quadratic-linear (LQL) model. It computes the biological equivalent dose (BED), the dose
  equivalent to a 2 Gy/fraction reference schedule (EQD2), the normal tissue complication probability
  (NTCP, Lyman model), and the estimated radiation-induced cancer risk (UNSCEAR model) — with corrections
  for incomplete inter-fraction repair, tissue/tumor repopulation, and treatment protraction (days off).


  Developed by Cyril Voyant and Daniel Julian, following the methodology of Astrahan (LQL model), Dale
  (repopulation), and Thames (incomplete repair). See [Citation](#citation) for the associated peer-reviewed
  paper.


  ## License


  **This repository is MIT-licensed** (see [`LICENSE`](LICENSE)) — that is the authoritative license for
  this code going forward. Two other sources describe the license differently and are both superseded
  by the `LICENSE` file here: the original 2013 paper states the tool was released "under the GNU license",
  and the software''s Zenodo deposit currently lists CeCILL. If you obtained this code from Zenodo or
  read the paper, disregard those license statements for this specific repository — MIT applies.


  ## Contents


  - **`LQEquiv.pdf`** — the associated methodology paper (Voyant, Julian, Roustit, Biffi, Lantieri, *Reports
  of Practical Oncology and Radiotherapy*, 2014).

  - **`LQL-Equiv.exe`** — compiled Windows standalone executable (no MATLAB license needed to run, see
  [Running the executable](#running-the-executable)).

  - **`codesource.zip`** — MATLAB source: `eqd_matlb.m` (GUIDE-generated GUI, all the calculation logic),
  `eqd_matlb.fig` (the GUI layout, MATLAB GUIDE figure file), and `heaviside.m` (step function, see note
  below).

  - **`CITATION.cff`**, **`schema.json`** — citation metadata (software + associated paper).

  - **`LICENSE`** — MIT.

  - **`contributing.md`**, **`cy.yml`** — contribution guidelines and a GitHub Actions Markdown/YAML/JSON/HTML
  linter.

  - **`index.html`** — a GitHub Pages preview page (PDF viewer + download links).


  **Note on `heaviside.m`:** earlier versions of `codesource.zip` bundled a copy of MathWorks'' own `heaviside.m`
  (Symbolic Math Toolbox source, `Copyright 1993-2008 The MathWorks, Inc.`), which is not freely redistributable
  outside MATLAB. It has been replaced with a minimal, original implementation (`Y = zeros(size(X)); Y(X
  > 0) = 1;`, no toolbox dependency) that is numerically identical for every input this codebase ever
  calls it with (the repopulation kick-off-time indicator, see Eq. 3-4 below) — no behavior change, no
  Symbolic Math Toolbox required to run `eqd_matlb.m` from source.


  ## Running the executable


  `LQL-Equiv.exe` is a **compiled Windows binary — verify its checksum before running it**, especially
  if you did not build it yourself:


  ```

  SHA256: e95f40efc06d9c322474b1ee9c652aec263ff81358092488f6cba4d5003a52a5

  ```


  Per the original paper, it was built with MATLAB GUIDE (32-bit MATLAB v7.12) and the MATLAB Compiler
  (v4.12), and therefore requires the **MATLAB Component Runtime (MCR), 32-bit, version 7.15 or later**,
  installed separately before the executable will run (download from MathWorks; the exact 32-bit MCR release
  matching MATLAB R2011a-era compiled applications). This is not bundled in this repository. Modern 64-bit-only
  Windows setups may require running the 32-bit MCR under WoW64 compatibility; this has not been verified
  by this repository''s maintainers on current Windows versions.


  Running the source directly in MATLAB (`codesource.zip`) avoids the MCR/32-bit constraint and requires
  only a base MATLAB license (no additional toolbox, see note above) plus MATLAB GUIDE support (`guide`/`openfig`,
  bundled with MATLAB through recent releases).



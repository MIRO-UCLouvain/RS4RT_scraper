readme_excerpt: "# radiomics-risk-analysis-tools\nofficial repository of the manuscript: Incremental prognostic\
  \ value of CCTA-based myocardial radiomics over clinical factors, anatomic and hemodynamic CTA findings\
  \ in patients with stable angina\n\n## Final code and model weights clarify\n### Ai features\nThe code\
  \ AI-features.py is used to generate Ai features based on resnet152 as following:\n```python\nfrom torchvision\
  \ import models\nmodel = models.resnet152(pretrained=True)\n```\nThe model weight is the pretrained\
  \ weight from pytroch library.\n### Nomogram\nThe nomogram0208.R..bin file is used to train/test/inference\
  \ the final model. The model weight is small and stored in memory. We did not save it out as a seperated\
  \ file.\n\n\n\n## AI-features.py\none needs to get the cropped slice of lesions. Then converted it to\
  \ .npy form. This python script will extracted Ai features of your .npy figures in the Preprocess folder.\
  \ Note, the example 1.npy in the folder is used for illustration only. For privacy purpose, it does\
  \ not related to patients included in this study. \n\n## Active.Coefficients.csv\nThis file contains\
  \ all seletected features and its corresponding coefficients to calculate scros.\n\n## nomo.cvs\nIt\
  \ contains time, features, radscores to do survical analysis with the nomogram0208.R..bin tool.\n\n\
  ## nomogram0208.R..bin\nIt is used to perform survaival analysis, generate nomograms, and predict for\
  \ new patiens. \n\n## Note\n1, If you need any further imform, you can make an issue.\n2, data is not\
  \ completed, for privacy concerns. \n"

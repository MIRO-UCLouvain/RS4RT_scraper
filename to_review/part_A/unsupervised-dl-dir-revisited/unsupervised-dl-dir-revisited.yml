readme_excerpt: "# Unsupervised-DL-DIR-Revisited\nUnsupervised Deformable Image Registration Revisited:\
  \ Enhancing Performance through Registration-Specific Designs (accepted by MIDL 2025 short paper track)\
  \  \n[![OpenReview](https://img.shields.io/badge/OpenReview-DGvFGbX0EG-8C1B13?logo=openreview&logoColor=white)](https://openreview.net/forum?id=DGvFGbX0EG#discussion)\n\
  \nKeywords: Deformable Image Registration, Unsupervised Learning, Benchmark, Ablation Study\n\n## TL;DR\
  \ <img src=\"https://raw.githubusercontent.com/iampavangandhi/iampavangandhi/master/gifs/Hi.gif\" width=\"\
  30\">\nWe highlight the value of three registration-specific designs — **multi-resolution pyramids,\
  \ local correlation calculation, and inverse consistency constraints** — in unsupervised mono-modal\
  \ deformable image registration. **By relying solely on these principles, simple network architectures\
  \ (i.e. without large convolutional kernels, attention gates, or feature-level self- or cross-attention)\
  \ can achieve competitive results, and potentially with far less training data**.\n\n## Repo updates\
  \ and new features <img src=\"https://raw.githubusercontent.com/iampavangandhi/iampavangandhi/master/gifs/Hi.gif\"\
  \ width=\"30\">\n05/01/2025 Our paper got accepted by MIDL 2025 short paper track   \n05/05/2025 Updated\
  \ the [validation results](#lumir-validation-results) on the 2024 Learn2Reg LUMIR Challenge    \n07/08/2025\
  \ Finalized the repository   \n10/21/2025 \U0001F195 Add demo for [registration results visualization](./demo/example1_visualize_registration_results/)\
  \ **SUGGESTIONS ARE WELCOME**  \n\n\n## Progress\n- [x] Upload basic code\n- [x] Upload config files\n\
  - [x] Training scripts\n- [x] Dataset split information\n- [x] Finalize README.md\n- [x] Add visualization\
  \ demo\n\n## Planned Enhancements\n> **Note:** The items below are planned enhancements. They may be\
  \ delayed or even skipped, depending on available time.\n- [ ] Refactor and clean up codebase\n- [ ]\
  \ Optimize DP-ConvIC-C: The current implementation of DP-ConvIC-C calculates correlation both ways separately\
  \ (i.e., corr(I, J) = corr_layer(I, J) and corr(J, I) = corr_layer(J, I)), which is redundant. **Update**:\
  \ I tried directly obtaining corr(J, I) by remapping corr(I, J), but this seems to be even more memory\
  \ expensive, need to figure out a better way) **SUGGESTIONS ARE WELCOME**  \n\n## Acknowledgement\n\
  This work is largely inspired by:\n- [rethink-reg](https://github.com/BailiangJ/rethink-reg)\n- [Magic-or-Mirage](https://github.com/rohitrango/Magic-or-Mirage)\n\
  - [VFA](https://github.com/yihao6/vfa/tree/main)\n- [SITReg](https://github.com/honkamj/SITReg)\n\n\
  We also thank the following repositories for providing helpful code and data resources:\n- [VoxelMorph](https://github.com/voxelmorph/voxelmorph)\n\
  - [TransMorph](https://github.com/junyuchen245/TransMorph_Transformer_for_Medical_Image_Registration)\n\
  - [LUMIR](https://github.com/JHU-MedImage-Reg/LUMIR_L2R)\n- [L2R](https://github.com/MDL-UzL/L2R)\n\
  - [deformation-inversion-layer](https://github.com/honkamj/deformation-inversion-layer)\n- [composable-mapping](https://github.com/honkamj/composable-mapping)\n\
  \n## Contact\n\nContributions and feedback are welcome! Please open an issue or submit a pull request.\
  \ For direct inquiries, you can also reach me at <hjliu@g.ucla.edu>.\n\n## Methods\n![Figure 1: Network\
  \ backbone for controlled registration experiments. The dual-stream pyramid (DP) architecture5 is adopted\
  \ with the same feature encoder and different variations of deformation decoder (DD) block](images/method_figure1_overview.png)\n\
  #### Figure 1 – Network backbone for controlled registration experiments. The dual-stream pyramid (DP)\
  \ architecture5 is adopted with the same feature encoder and different variations of deformation decoder\
  \ (DD) block.\n\n#### Table 1 – Summary of the proposed variants and comparing methods\n\n![Table 1:\
  \ Summary of the proposed variants and comparing methods](images/method_table1_summary.png)\n\n## Results\n\

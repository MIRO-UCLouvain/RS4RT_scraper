readme_excerpt: "# Light-weight Deformable Registration using Adversarial Learning with Distilling Knowledge\n\
  ### Summary\n* [Abstract](#abstract)\n* [Prerequisites](#prerequisites)\n* [Datasets](#datasets)\n*\
  \ [Training](#training)\n* [Evaluation](#evaluation)\n* [Citation](#citation)\n* [Acknowledgement](#acknowledgement)\n\
  * [License](#license)\n* [More information](#more-information)\n\n### Abstract\nDeformable registration\
  \ is a crucial step in many medical procedures such as image-guided surgery and radiation therapy. Most\
  \ recent learning-based methods focus on improving the accuracy by optimizing the non-linear spatial\
  \ correspondence between the input images. Therefore, these methods are computationally expensive and\
  \ require modern graphic cards for real-time deployment. In this paper, we introduce a new Light-weight\
  \ Deformable Registration network that significantly reduces the computational cost while achieving\
  \ competitive accuracy. In particular, we propose a new adversarial learning with distilling knowledge\
  \ algorithm that successfully leverages meaningful information from the effective but expensive teacher\
  \ network to the student network. We design the student network such as it is light-weight and well\
  \ suitable for deployment on a typical CPU. The extensively experimental results on different public\
  \ datasets show that our proposed method achieves state-of-the-art accuracy while significantly faster\
  \ than recent methods. We further show that the use of our adversarial learning algorithm is essential\
  \ for a time-efficiency deformable registration method.\n\n### Prerequisites\n**Python 3**   \nPlease\
  \ install dependence packages by run the following command:\n```\npip install -r requirements.txt\n\
  ```\n### Datasets\n#### 1. Liver-and-brain-scanned datasets\nCreate the `datasets/` directory then follow\
  \ this [repo](https://github.com/microsoft/Recursive-Cascaded-Networks#datasets) to download and extract\
  \ the data.\n#### 2. Extracted teacher deformations\nCreate the `Teacher_deformation/` folder and\n\
  download our extracted teacher (`Teacher_deformations.zip`) deformations from [here](https://huggingface.co/datasets/aiozai/ALDK).\
  \   \nThis folder is constructed as follow:   \n```\n|-- Teacher_deformations   \n|---|---Brain   \n\
  |---|---|-- brain_teacher_deformation_c_1.pkl   \n|---|---|-- brain_teacher_deformation_c_2.pkl   \n\
  |---|---|-- brain_teacher_deformation_c_3.pkl   \n|---|---Liver\n|---|---|-- liver_teacher_deformation_c_1.pkl\
  \   \n|---|---|-- liver_teacher_deformation_c_2.pkl   \n|---|---|-- liver_teacher_deformation_c_3.pkl\
  \   \n|-- ...   \n```\n\n### Training\n\n```\npython train.py -b base-network -n num_cascades -g gpus_id\
  \ --round steps_per_epochs --epochs num_epochs --batch batch_size --output name_of_weights_after_training\
  \ -d path_to_dataset_json --aldk (if you use our ALDK)\n```\n**For examples:**   \nTrain 1-cas LDR on\
  \ liver datasets\n```\npython train.py -b LDR -n 1 -g 0 --round 20000 --epochs 5 --batch 4 --output\
  \ 1cas_LDR_Liver -d datasets/liver.json\n```\nTrain 1-cas LDR on brain datasets\n```\npython train.py\
  \ -b LDR -n 1 -g 0 --round 20000 --epochs 5 --batch 4 --output 1cas_LDR_Brain -d datasets/brain.json\n\
  ```\nTrain 1-cas LDR + ALDK on liver datasets\n```\npython train.py -b LDR -n 1 -g 0 --round 20000 --epochs\
  \ 5 --batch 4 --output 1cas_LDR_ALDK_Liver -d datasets/liver.json --aldk\n```\nTrain 1-cas LDR + ALDK\
  \ on brain datasets\n```\npython train.py -b LDR -n 1 -g 0 --round 20000 --epochs 5 --batch 4 --output\
  \ 1cas_LDR_ALDK_Brain -d datasets/brain.json --aldk\n```\n\n### Evaluation\n\n```\npython eval.py --gpu\
  \ gpus_id --checkpoint path-to-trained-weights --batch batch_size -v evaluation_test_set\n```\n**For\
  \ examples:**   \nEvaluate our 1cas_LDR_ALDK_Liver\n```\npython eval.py --gpu 0 --batch 1 --checkpoint\
  \ weights/1cas_LDR_ALDK_Liver\n```\nEvaluate our 1cas_LDR_ALDK_Brain\n```\npython eval.py --gpu 0 --batch\
  \ 1 --checkpoint weights/1cas_LDR_ALDK_Brain\n```\n### Citation\nIf you use this code as part of any\
  \ published research, we'd really appreciate it if you could cite the following paper:\n```\n@misc{tran2021lightweight,\n\
  \      title={Light-weight Deformable Registration using Adversarial Learning with Distilling Knowledge},\
  \ \n      author={Minh Q. Tran and Tuong Do and Huy Tran and Erman Tjiputra and Quang D. Tran and Anh\
  \ Nguyen},\n      year={2021},\n      eprint={2110.01293},\n      archivePrefix={arXiv},\n      primaryClass={eess.IV}\n\
  }\n```\n[![DOI](https://zenodo.org/badge/DOI/10.5281/zenodo.4755947.svg)](https://doi.org/10.5281/zenodo.4755947)\n\
  \n### Acknowledgement\nMany thanks to this thorough repository ([RCN](https://github.com/microsoft/Recursive-Cascaded-Networks)).\n\

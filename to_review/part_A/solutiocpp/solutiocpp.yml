readme_excerpt: "# SolutioCpp\n\nThis C++ library is a collection of containers and algorithms for applications\n\
  of physics in medicine, particularly radiation therapy (RT) and medical imaging.\nThis library can be\
  \ the foundation for building clinical, research, and\neducational applications in these medical fields.\
  \ The repository is a companion\nto [Solutio in silico](solutioinsilico.com), a website designed to\
  \ promote\nscience and technology concepts in medicine. More specific documentation for\nthis source\
  \ code can be found on the website.\n\n## Features\nKey features of SolutioCpp include:\n  * Basic physics\
  \ equations, constants, and data relevant to medical physics\n  * Containers to store common imaging/RT\
  \ components (images, RT dose, etc.)\n  * Read data from DICOM files and other vendor-specific file\
  \ formats\n  * Simulation of medical technologies (e.g. X-ray CT)\n  * Algorithms from clinical guideline\
  \ reports (AAPM TG 43, AAPM TG 71, etc.)\n\n## Install\n[CMake](cmake.org) is used to build the library\
  \ and examples. The following packages are\nrequired and need to be installed separately:\n  * FFTW\n\
  \  * DCMTK\n  * ITK\n\nOne package is included with the source (fftw++).\n\n## Use & Examples\nIt is\
  \ highly recommended to use CMake to compile SolutioCpp with other programs.\nThe above packages will\
  \ likely also need to be included in projects using SolutioCpp.\nSee the Examples folder for simple\
  \ uses of the SolutioCpp library to build other programs.\n\n## Project Status\nThe framework is currently\
  \ in the pre-release stage (i.e. v0.y.z). The plan is\nfor version 1.0.0 to at least include the following\
  \ features:\n  * Read and lookup data for NIST photon attenuation coefficients (NISTX) and electron\
  \ stopping power ratios (ESTAR)\n  * Implementation of the TASMIP algorithm for imaging x-ray source\
  \ spectra\n  * Generation of primary-only CT projection data for various geometric objects (i.e. no\
  \ Monte Carlo, only ray-tracing and exponential attenuation)\n  * Filtered back-projection (FBP) reconstruction\
  \ algorithm for helical and axial CT projection data\n  * Reading medical images and RT entities from\
  \ DICOM files\n  * Corrections-based dose calculation for linac photon beams (AAPM TG 71 formalism)\n\
  \  * Brachytherapy dose calculation (AAPM TG 43 formalism)\n  * Linear and logarithmic data interpolation\
  \ functions for the above features\n\nAlthough this list may increase during this initial stage.\n\n\
  ## Version Control\nVersion control for this repository follows the format of [Semantic Version](http://www.semver.org).\n\
  In short, the version number is represented as x.y.z, where:\n  * x: Major version (for new, backwards-incompatible\
  \ changes)\n  * y: Minor version (for new, backwards-compatible changes)\n  * z: Patch version (for\
  \ backwards-compatible bug fixes)\n\n## License\nThe framework will be distributed under the Apache\
  \ 2.0 License, enabling all\nusers to develop their own applications for both personal and commercial\
  \ use.\nThe main conditions are that you attach the Apache 2.0 license to any source\ncode you use,\
  \ and that any changes you make are properly documented. Please read\nthe [LICENSE](./LICENSE) file\
  \ for more information about the Apache 2.0 License.\n"

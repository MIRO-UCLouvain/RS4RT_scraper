readme_excerpt: "# Predicting patient stress during radiation therapy\n\n## Introduction\nThis repository\
  \ shares code for predicting the stress of patients undergoing radiation therapy. It predicts patient\
  \ stress during radiation treatment based on biometric signals collected before the therapy. Various\
  \ models have been used to compare the prediction performance.\n\n\n\n## Models\n\nThe models used in\
  \ our research are:\n- **DT (Decision Tree)**\n- **RF (Random Forest)**\n- **SVM (Support Vector Machine)**\n\
  - **LSTM (Long Short-Term Memory)**\n- **Transformer**\n- **ChatGPT Fine-tuning**\n- **ChatGPT Prompt\
  \ engineering**\n\n\n## Repository Structure\n\n- **data/**: exmaple dataset\n- **src/**: model source,\
  \ package\n- **results/**: Stores the results and performance metrics of the models.\n- **checkpoints/**:\
  \ saved models.\n\n\n## Usage\n\n1. Clone the repository:\n    ```bash\n    git clone https://github.com/SangWoonJeong/RT_stress_prediction.git\n\
  \    ```\n2. Navigate to the project directory:\n    ```bash\n    cd RT_stress_prediction\n    ```\n\
  \n## Results\n\nThe results section will include the performance metrics for each model under the specified\
  \ delay times. This may include accuracy, precision, recall, and other relevant metrics.\n\n## Publications\n\
  \nFor more detailed information, refer to our published paper:\n- **The Prediction of Stress in Radiation\
  \ Therapy: Integrating Artificial Intelligence with Biological Signals**\n- Authors: [Sangwoon Jeong]\n\
  - Published in: [Cancers]\n- [https://www.mdpi.com/2072-6694/16/11/1964]\n\n## Contact\n\nFor any questions\
  \ or inquiries, please contact [sangwoonjeong93@gmail.com].\n"

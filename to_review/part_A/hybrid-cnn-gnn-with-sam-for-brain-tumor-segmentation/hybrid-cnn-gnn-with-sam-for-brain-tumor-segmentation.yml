readme_excerpt: "# \U0001F9E0 Hybrid CNN–GNN with Automated SAM Refinement for Brain Tumor Segmentation\n\
  ![Python](https://img.shields.io/badge/Python-3.9-blue)\n![TensorFlow](https://img.shields.io/badge/TensorFlow-2.15-orange)\n\
  ![PyTorch](https://img.shields.io/badge/PyTorch-2.1-red)\n![Google Colab](https://img.shields.io/badge/Google%20Colab-T4_GPU-yellow)\n\
  ![License](https://img.shields.io/badge/License-MIT-green)\n![Pipeline](https://raw.githubusercontent.com/ArpanMoharana/Hybrid-CNN-GNN-with-SAM-for-Brain-Tumor-Segmentation/main/Visual%20Output/pipeline.png)\n\
  \nThis project presents a hybrid deep learning framework for **accurate brain tumor segmentation** from\
  \ multi-parametric MRI images.\n\nThe system integrates:\n- \U0001F9E0 CNN (U-Net) for local feature\
  \ extraction  \n- \U0001F310 GNN for global spatial reasoning  \n- ✂️ SAM (Segment Anything Model) for\
  \ boundary refinement  \n\n---\n\n![Detailed All Models](https://raw.githubusercontent.com/ArpanMoharana/Hybrid-CNN-GNN-with-SAM-for-Brain-Tumor-Segmentation/main/Visual%20Output/DETAILED%20ALL%20MODELS.png)\n\
  ## \U0001F4CC Project Overview\n\nBrain tumor segmentation is a challenging task due to variability\
  \ in tumor shape, size, and location.\n\nTraditional approaches often:\n- Capture only local features\
  \ (CNNs), or  \n- Miss spatial relationships (lack global context)\n  ![All Models](https://raw.githubusercontent.com/ArpanMoharana/Hybrid-CNN-GNN-with-SAM-for-Brain-Tumor-Segmentation/main/Visual%20Output/all%20models.png)\n\
  \nThis project addresses these limitations by combining:\n- **CNN → local features**\n- **GNN → structural\
  \ understanding**\n- **SAM → precise boundary refinement**\n\nThe pipeline is fully automated and does\
  \ not require manual segmentation input.\n\n---\n\n## \U0001F680 Key Contributions\n\n- Hybrid CNN +\
  \ GNN architecture  \n- Automated prompt generation for SAM  \n- Fully automated segmentation pipeline\
  \  \n- Improved tumor localization and boundary precision  \n- Safety mechanism to reduce over-segmentation\n\
  \n## Low-Level System Design\n\n![Low Level System Design](https://raw.githubusercontent.com/ArpanMoharana/Hybrid-CNN-GNN-with-SAM-for-Brain-Tumor-Segmentation/main/Visual%20Output/Low%20Level.png)\n\
  \n## High-Level System Design\n\n![High Level System Design](https://raw.githubusercontent.com/ArpanMoharana/Hybrid-CNN-GNN-with-SAM-for-Brain-Tumor-Segmentation/main/Visual%20Output/high%20level%20system%20design.png)\n\
  ---\n\n## \U0001F4C2 Dataset\n\nDataset Used: BraTS 2020\n\n- T1\n- T1ce\n- T2\n- FLAIR\n\nProvides\
  \ multi-modal MRI images with expert-annotated tumor masks.\n\n---\n## \U0001F3D7️ Architecture Overview\n\
  MRI Input\n│\n▼\nCNN (U-Net)\n│\n▼\nGNN\n│\n▼\nHybrid Mask\n│\n▼\nAuto Bounding Box\n│\n▼\nSAM Refinement\n\
  │\n▼\nFinal Segmentation\n\n## Step-by-Step Pipeline\n\n![Pipeline](https://raw.githubusercontent.com/ArpanMoharana/Hybrid-CNN-GNN-with-SAM-for-Brain-Tumor-Segmentation/main/Visual%20Output/pipeline.png)\n\
  ---\n\n## \U0001F52C Methodology\n\n### 1. Preprocessing\n- MRI normalization\n- Noise reduction\n\n\
  ### 2. CNN (U-Net)\n- Extracts local texture features  \n- Generates initial tumor segmentation  \n\n\
  ### 3. GNN\n- Models spatial relationships between regions  \n- Reduces false positives  \n\n### 4.\
  \ Hybrid Fusion\n- Combines CNN + GNN outputs  \n\n### 5. SAM Integration\n- Automatically generates\
  \ bounding box  \n- Refines tumor boundary  \n\n### 6. Safety Mechanism\n- Prevents over-segmentation\
  \  \n- Falls back to hybrid output if needed\n  ## Visual Segmentation Results\n\n![Visual Results](https://raw.githubusercontent.com/ArpanMoharana/Hybrid-CNN-GNN-with-SAM-for-Brain-Tumor-Segmentation/main/Visual%20Output/visual.png)\n\
  \n---\n\n## \U0001F4CA Model Performance\n\n| Metric | Value |\n|------|------|\n| Dice Score | **0.8585**\
  \ |\n| Precision | **0.7921** |\n| Recall | **0.9430** |\n| Inference Time | **0.0109 sec** |\n\n> High\
  \ recall ensures minimal missed tumor regions, which is critical in medical diagnosis.\n\n> Performance\
  \ can be further improved using larger and more diverse datasets for better generalization and robustness.\n\
  ---\n## NOTE - This project was developed and executed on Google Colab using Google's T4 GPU.\n\n##\
  \ ⚡ Training Environment\n\nThis project was developed and trained using:\n\n- Google Colab\n- NVIDIA\
  \ T4 GPU\n- Python 3.9\n---\n## \U0001F4D6 Citation\n\nIf you use this work in research, publications,\
  \ or derivative projects, please cite this repository and acknowledge the authors.\n\n**Authors**\n\
  - Arpan Kumar Moharana\n- Sarthak Mudholkar\n- Abhay Nagote\n\n**Project**\nHybrid CNN–GNN with Automated\
  \ SAM Refinement for Brain Tumor Segmentation\n\n---\n## \U0001F52C Research Contributions\n\n- Hybrid\
  \ CNN + GNN segmentation framework\n- Automated SAM prompt generation\n- Safety-controlled segmentation\
  \ refinement\n- Local and global feature fusion\n- Improved tumor boundary precision\n"

readme_excerpt: '# RadiomicsFeatureVisualization


  This is a visualization tool for radiomics features. We used Pyradiomics for features exctration, and
  there are more details for parameter setting in https://pyradiomics.readthedocs.io/.


  Here are some feature map samples, the original MRI data come from https://wiki.nci.nih.gov/display/CIP/RIDER.



readme_excerpt: "# DLA project - Brain Tumor Segmentation \n\nFine-tuning **RF-DETR** (with segmentation\
  \ head) to detect and delineate brain tumors in MRI scans, using a Roboflow dataset and the `supervision`\
  \ library for visualization.\n\n---\n\n## Table of Contents\n\n- [Overview](#overview)\n- [Dataset](#dataset)\n\
  - [Model](#model)\n- [Project Structure](#project-structure)\n\n---\n\n## Overview\n\nThis project fine-tunes\
  \ [`RFDETRSegPreview`](https://github.com/roboflow/rf-detr) — a real-time detection transformer with\
  \ instance segmentation — on a brain tumor MRI dataset. The goal is to produce per-instance segmentation\
  \ masks that precisely outline tumor regions.\n\nKey design choices:\n\n- **Effective batch size of\
  \ 16** via gradient accumulation (2 × 8 steps) to fit on a single GPU\n- **EMA weights** for more stable\
  \ checkpoints\n- **Early stopping** to prevent overfitting on the small dataset\n- **Cosine LR schedule\
  \ with warm-up** in later experiments\n- Multiple hyperparameter sweeps (Experiments 1–5) to find the\
  \ best encoder/decoder learning-rate balance\n\n---\n\n## Dataset\n\n| Property        | Value |\n|-----------------|-------|\n\
  | Source          | [Roboflow Universe — Brain Tumor Segmentation](https://universe.roboflow.com/tutorial-extpj/brain-tumor-segmentation-jteuo)\
  \ |\n| Format          | COCO Segmentation |\n| Classes         | `tumor`, `notumor` |\n| Version  \
  \       | 1 |\n\nThe dataset is downloaded automatically at runtime via the Roboflow SDK. You only need\
  \ to set your API key.\n\n---\n\n## Model\n\n**RF-DETR** is a real-time Detection Transformer developed\
  \ by Roboflow. `RFDETRSegPreview` extends it with a segmentation head that produces polygon/mask outputs\
  \ alongside bounding boxes.\n\nKey parameters tuned across experiments:\n\n| Parameter | Role |\n|-----------|------|\n\
  | `lr` | Decoder learning rate |\n| `lr_encoder` | Encoder (backbone) learning rate — typically kept\
  \ lower |\n| `resolution` | Input resolution (432 or 384 px) |\n| `weight_decay` | L2 regularization\
  \ |\n| `lr_scheduler` | `cosine` decay or constant |\n| `warmup_epochs` | Linear warm-up before the\
  \ main schedule |\n\n---\n\n## Project Structure\n\n```\n.\n├── main.py                  # Training,\
  \ evaluation and visualization pipeline\n├── output/\n│   ├── fine_tune50_hp_1/    # Experiment 1 checkpoints\
  \ + TensorBoard logs\n│   ├── fine_tune50_hp_2/\n│   ├── ...\n│   └── fine_tune50_hp_5/\n├── Brain-Tumor-Segmentation-1/\
  \   # Downloaded dataset (auto-created)\n│   ├── train/\n│   ├── valid/\n│   └── test/\n├── comparison_images_1_to_3.png\
  \  # Output figures (generated by compare command)\n├── comparison_images_4_to_6.png\n└── README.md\n\
  ```\n"

  \n        * Sum: 4646425087.0446\n        * Count: 144\n        * Average: 32266840.882254\n       \
  \ * Smallest: 3\n        * Biggest: 422352613\n        * Range: 422352610\n\n    takes 0.000806s to\
  \ calculate\n\n</details>\n\n\U0001F4E6Installation\n------------\nUse your favourite package manager\
  \ and call setup function.\n```vim\n\" Vimscript with vim-plug\nPlug 'max397574/vmath.nvim'\nlua require(\"\
  vmath_nvim\").init()\n```\n```\n-- lua with packer.nvim\nuse {\"max397574/vmath.nvim\",\n  config =\
  \ function()\n    require(\"vmath_nvim\").init()\n  end\n}\n\n```\n\n\n✅Usage\n-----\nRemap the command\
  \ in visual mode.\n`vnoremap <your mapping> <ESC>:Vmath<CR>`\n\nExample:\n`vnoremap <leader>vm <ESC>:Vmath<CR>`\n\
  \n⚙️Customization\n-------------\nYou can customize with the following lines in a vim configuration.\
  \ These are the default settings.\n```lua\nlua << EOF\nrequire('vmath_nvim').setup{\n  -- show these\
  \ numbers\n  show_sum = true,\n  show_average = true,\n  show_count = true,\n  show_lowest = true,\n\
  \  show_highest = true,\n  show_range = true,\n  show_median = true,\n  -- show debug info (execution\
  \ time and values)\n  debug = false,\n  -- save values in registers surrounded with ''\n  -- example:\
  \ 'A'verage gets saved in register a\n  registers = true,\n}\nEOF\n```\nAnd this in a lua configuration:\n\
  ```lua\nrequire('vmath_nvim').setup{\n  -- show these numbers\n  show_sum = true,\n  show_average =\
  \ true,\n  show_count = true,\n  show_lowest = true,\n  show_highest = true,\n  show_range = true,\n\
  \  show_median = true,\n  -- show debug info (execution time and values)\n  debug = false,\n  -- save\
  \ values in registers surrounded with ''\n  -- example: 'A'verage gets saved in register a\n  registers\
  \ = true,\n}\n```\n\n\U0001F6ABLimitations\n-----------\n* Currently can't ignore dates\n* Only works\
  \ with full lines (visual-line mode)\n\n\U0001F4A1Future Plans/Ideas\n------------------\n* Ignore dates\n\
  * More mathematical figures\n\n\U0001F440Examples\n--------\n\nExtract out of list with text and $-signs\n\
  \n![example image](https://github.com/max397574/Vmath.nvim/blob/master/resources/month_list.png)\n"

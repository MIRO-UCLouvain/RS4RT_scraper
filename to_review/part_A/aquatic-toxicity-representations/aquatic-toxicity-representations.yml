readme_excerpt: "# aquatic-toxicity-representations\n\nSource code and workflow scripts for benchmarking\
  \ fingerprint-based and graph-based molecular representations for aquatic ecotoxicity prediction.\n\n\
  ## Overview\n\nThis repository contains the source code used for data preparation, model training, inference,\
  \ and downstream analysis in the manuscript:\n\n**Comparative Evaluation of Molecular Representations\
  \ for Aquatic Ecotoxicity Prediction: Fingerprints, Molecular Graphs, and Similarity Graphs**\n\nThe\
  \ study compares fingerprint-based models, an atom–bond molecular graph model, and a compound-level\
  \ similarity graph model under a controlled benchmark setting for aquatic ecotoxicity prediction.\n\n\
  ## Repository structure\n\n### Data preparation\n\n- `01_webTEST.ipynb`  \n  Notebook for organizing\
  \ TEST-derived toxicity results.\n\n- `02_build_toxicity_master.py`  \n  Builds the processed toxicity\
  \ master table from TEST-derived results.\n\n- `02-1_make_species_subsets.py`  \n  Generates species-specific\
  \ subsets from the toxicity master table.\n\n- `02-2_extract_true_inference_target_rows.py`  \n  Extracts\
  \ the final true inference target set.\n\n- `03_make_X_morgan_count_raw.py`  \n  Generates Morgan count\
  \ fingerprint feature matrices.\n\n- `04_make_scaffold_multisplits_acyclic_refined.py`  \n  Creates\
  \ scaffold-based grouping and train/validation/test split files.\n\n- `05_make_y_targets.py`  \n  Generates\
  \ task-specific target tables.\n\n### Model training and graph construction\n\n- `06_*` to `17_*`  \n\
  \  Scripts for RF, MLP, G1, and G2 model training, graph construction, graph asset assembly, and multisplit/multiseed\
  \ training workflows.\n\n### Inference\n\n- `18_*` to `21_*`  \n  Scripts for model inference on the\
  \ true inference target set using trained models or saved assets.\n\n## Data archive\n\nThe processed\
  \ datasets, feature matrices, scaffold-based split files, graph resources, model prediction outputs,\
  \ and merged result tables used to support verification and reproducibility of the manuscript-level\
  \ analyses are available on Zenodo:\n\n**Zenodo:** https://doi.org/10.5281/zenodo.20417289\n\nThe Zenodo\
  \ archive includes:\n\n- processed TEST-derived toxicity tables\n- Daphnia regression targets\n- Morgan\
  \ fingerprint feature matrices\n- RDKit descriptor features\n- scaffold-based train/validation/test\
  \ split files\n- G2 similarity graph resources\n- model-level test predictions\n- true inference-set\
  \ predictions\n- merged prediction tables\n\n## Workflow note\n\nThe scripts are organized to reflect\
  \ the stepwise computational workflow used in the study. Outputs from earlier steps are used as inputs\
  \ for subsequent steps.\n\nSome inference scripts require trained model objects or checkpoints generated\
  \ by the corresponding training scripts. The saved prediction outputs used for the manuscript-level\
  \ analyses are provided in the Zenodo archive.\n\nUsers may need to adjust file paths according to their\
  \ local execution environment.\n\n## Environment\n\nThe analyses were performed in Python using RDKit,\
  \ scikit-learn, PyTorch, and PyTorch Geometric.\n\nThe required Python packages are listed in:\n\n-\
  \ `requirements.txt`\n- `environment.yml`\n\nPyTorch Geometric dependencies may require CUDA-specific\
  \ installation depending on the local hardware environment.\n\n## Citation\n\nIf you use this code or\
  \ the associated data archive, please cite the corresponding manuscript and Zenodo record.\n\n## Contact\n\
  \nThis repository is maintained as a public reproducibility resource for the associated manuscript.\n"

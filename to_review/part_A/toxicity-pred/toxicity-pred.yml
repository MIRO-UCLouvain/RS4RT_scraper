readme_excerpt: "The toxicity prediction challenge (Kaggle) predicts the chemicals listed in the CSV which\
  \ of them are toxic. \n\nPre-requisites:\n\nAnaconda - The distribution includes data-science packages\
  \ (Python 3) suitable for Windows, Linux, and macOS.\n\nDownload Links:\n\nWindows: \n64-Bit https://repo.anaconda.com/archive/Anaconda3-2020.11-Windows-x86_64.exe\n\
  32-Bit https://repo.anaconda.com/archive/Anaconda3-2020.11-Windows-x86.exe\n\t\t \nMacOS: \t \n64-Bit\
  \ https://repo.anaconda.com/archive/Anaconda3-2020.11-MacOSX-x86_64.pkg\nCLI    https://repo.anaconda.com/archive/Anaconda3-2020.11-MacOSX-x86_64.sh\n\
  \t\t \nLinux:   \n64-Bit https://repo.anaconda.com/archive/Anaconda3-2020.11-Linux-x86_64.sh\nOthers\
  \ https://repo.anaconda.com/archive/Anaconda3-2020.11-Linux-ppc64le.sh\n\t\t \n\nContents of final_ml.zip:\n\
  1. Final report_MLXMen.pdf\n2. the-toxicity-prediction-challenge.zip\n3. final.ipynb\n4. README.txt\n\
  5. final-code.py\n6. installpk.py\n\n\nAfter Anaconda installation:\n1. Extract the files from final_ml.zip\
  \ to anaconda root directory.\n2. Extract the dataset from the-toxicity-prediction-challenge.zip to\
  \ anaconda root directory.\n2. Open \"Anaconda Prompt\" from Start Menu or Dock.\n3. Type \"python installpk.py\"\
  \ in Anaconda Prompt to install the required packages.\n4. Follow the prompts if any for successful\
  \ installation.\n\n\nFor running the code:\n1. Open \"Anaconda Prompt\".\n2. Type \"jupyter notebook\"\
  \ and press enter to open notebook server.\n3. Press \"Upload\" button on top right and select \"final.ipynb\"\
  \ from extracted files.\n4. Click on newly added file by name \"final.ipynb\", that will open the notebook\
  \ where you can execute the code.\n"

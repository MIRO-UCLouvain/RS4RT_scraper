readme_excerpt: "# PyTorch Lightning 3D OAR Segmentation for Automated Radiation Therapy Planning\n\n\
  Original Repo for \"[Evaluating clinical acceptability of organ-at-risk segmentation In head & neck\
  \ cancer using a compendium of open-source 3D convolutional neural networks](https://www.medrxiv.org/content/10.1101/2022.01.15.22269276v1.full.pdf)\"\
  \ (Marsilla et. al, 2022). Pre-print of this paper was accepted to MedRxiv on January 25, 2022.\n\n\
  ## Inference Tutorial Using Colab Pro GPUs coming soon...\n\n## 1. Setup Environment\nMore instructions\
  \ [here](https://stackoverflow.com/questions/41274007/anaconda-export-environment-file).\n\n    conda\
  \ env create -f utils/environment.yml\n\n## 2. Running WOLNET ensemble on custom dataset (no-finetuning\
  \ required).\n\nIn order to run the pre-trained WOLNET network on your own dataset, certain aspects\
  \ of our Lightning Module must be customized. Because we will be in testing mode, the weights of each\
  \ model during inference will be frozen.\n\nYou can use the slurm templates (wol-oar-test-1.sh ... wol-oar-test-5.sh)\
  \ as base bash scripts for inference. The only things that need to be edited in this file are:\n\n1.\
  \ Clone repo.\n2. Update local path to model weights (Download them [here](https://drive.google.com/drive/folders/15yc--RfBaxuxKTEHaQ3OwbPdCqTOZdgH?usp=sharing))\
  \ in wol-oar-test-1.sh (repeat for other .sh test scripts)\n\n3. Update local path to test.py file in\
  \ wol-oar-test-1.sh (repeat for other .sh test scripts)\n4. If you havn't done so already use custom\
  \ pre-processing scripts (/process) or our [med-imagetools package](https://github.com/bhklab/med-imagetools)\
  \ to extract raw data from .dicom images\n5. Create a custom .csv with two columns - one for image and\
  \ one for corresponding mask (if you have avaliable; if un-avaliable use image-path again in the second\
  \ column). Easy to do in python:\n\n        import pandas as pd\n        imgs = glob.glob( \"PATH_TO_IMG_FOLDER/*.nrrd\"\
  )\n        # if mask folder avaliable\n        msks = [i.replace(PATH_TO_IMG_FOLDER, PATH_TO_MSK_FOLDER)\
  \ for i in imgs]\n        # create .csv we need to load same image twice (in same batch) during inference\n\
  \        img = []\n        msk = []\n        for i, im in imgs:\n            img.append(im)\n      \
  \      img.append(im)\n    \t    msk.append(msks[i])\n    \t    msk.append(msks[i])\n\n       data =\
  \ {'0':img, '1':msk}\n       data = pd.DataFrame.from_dict(data)\n       data.to_csv('path_to_csv')\n\
  \n 5. Once we have custom .csv we can run inference (change path in . Once predictions for each model\
  \ have been exported, use process_masks3.py as a template to average the predictions.\n 6. **Optional:**\
  \ to compare results against ground truth data extracted for your own internal datasets, use notebooks\
  \ provided.\n 7. To establish run your own QUANNOTATE server for clinical acceptability testing of countours\
  \ generated, please [clone our open-source repo](https://github.com/bhklab/quannotate).\n 8. All files\
  \ including model weights, ensemble predictions on each external dataset as well as pre-processed versions\
  \ of each dataset can be found [here](https://drive.google.com/drive/folders/15yc--RfBaxuxKTEHaQ3OwbPdCqTOZdgH?usp=sharing).\n\
  \n## 3. Slurm Scripts\n\nPyTorch Lightning has been specifically engineered to optimize training across\
  \ large computing clusters governed by job handlers. In this study we use slurm commands to run the\
  \ python script (connecting us to the right GPU nodes). These can be found in the /slurm folder. If\
  \ you don't use slurm, these files can be run by using simple bash commands.\n\n## 4. Figures\n\n![Figure\
  \ 1. Study Overview:  A general overview of the study design. A total of 582 patients met selection\
  \ criteria having the same 19 OAR(s) delineated in their RTSTRUCT files. Data was extracted and used\
  \ to train 11 different open source 3D segmentation networks. The 11 networks were selected as a subset\
  \ of 60 studies proposing implementing image segmentation networks in a medical context. A subset of\
  \ 29 studies did not release code along with their publication, and therefore, these models could not\
  \ be directly assessed. Another 20 studies were removed because of one or more of the following: networks\
  \ could not be tested with original configuration due to limitation of computational power, 2D networks\
  \ that could not be converted to 3D convolutional scheme without modifying it’s architectural integrity,\
  \ close similarity or overlap between other architectures, code released with the study was unmaintained\
  \ and/or could not be integrated into PytorchLightning. The networks were ranked based on overall performance\
  \ on a hold out test set of 59 patients across all 19 OARs. The top model was then chosen to be fine-tuned\
  \ and used in a blinded clinical acceptability assessment conducted by 4 expert radiation oncologists\
  \ on the open source Quannotate platform. ](https://lh3.googleusercontent.com/pw/AM-JKLW2Lp30kdmSflVdw-3Ea48OKP0iPEsnSyMzUFqucyuejpPrTezcSn0vg1ja1iau7KUWAnWdyL1-naaSe6CxOpykJQ0O4ewUmf7lxVjb64xy8pZIXlSvpLhfA_0M6OsBdcIiCFud0bNbYZ9XcxGVIXHamg=w965-h600-no?authuser=0)\n\
  \n**Figure 1. Study Overview:**  A general overview of the study design. A total of 582 patients met\
  \ selection criteria having the same 19 OAR(s) delineated in their RTSTRUCT files. Data was extracted\
  \ and used to train 11 different open source 3D segmentation networks. The 11 networks were selected\
  \ as a subset of 60 studies proposing implementing image segmentation networks in a medical context.\
  \ A subset of 29 studies did not release code along with their publication, and therefore, these models\
  \ could not be directly assessed. Another 20 studies were removed because of one or more of the following:\
  \ networks could not be tested with original configuration due to limitation of computational power,\
  \ 2D networks that could not be converted to 3D convolutional scheme without modifying it’s architectural\
  \ integrity, close similarity or overlap between other architectures, code released with the study was\
  \ unmaintained and/or could not be integrated into PytorchLightning. The networks were ranked based\
  \ on overall performance on a hold out test set of 59 patients across all 19 OARs. The top model was\
  \ then chosen to be fine-tuned and used in a blinded clinical acceptability assessment conducted by\
  \ 4 expert radiation oncologists on the open source Quannotate platform.\n\n![Supplementary Figure 2.\
  \ Overview of Clinical Acceptability Protocol, an open source web-based quality assurance tool from\
  \ our previous study was modified for clinical acceptability testing of radiation therapy contours.\
  \ For this analysis, 4 expert radiation oncologists were each given the opportunity to assess the acceptability\
  \ of deep learning or manual ground truth contours in a blinded fashion. 10 ground truth contours paired\
  \ with 10 deep learning generated contours for the same patient were extracted for each of the 19 OARs.\
  \ A total of  380 3D contours were assessed by each observer. They were asked to rate acceptability\
  \ on a 5 point scale taking the complete volume of the entire OAR contour into context. A rating of\
  \ 4.0 and higher can be considered ‘acceptable’ in that no edits are required by the examining physician\
  \ for planning purposes. They were also asked to ‘guess’ the observer that generated the contour (“Human”/\
  \ “Computer” / “I don’t Know”) before submitting their rating. Mean Acceptability Ratings were then\
  \ calculated for each OAR, and analysis assessing correlation of acceptability with 6 different segmentation\
  \ performance metrics was conducted. These metrics include 3D Volumetric Dice Overlap Coefficient, 95%\
  \ Hausdorff Distance, Applied Path Length, False Negative Length, and False Negative Volume](https://lh3.googleusercontent.com/CxJb6Xruah0V1wOD9O1su-5mt69lHtmhK14IYe_oznW7PEYXtZGQnrr-3MjCORJX4-fHnQEwhUeFEhXq2jmGMdQznV4jZ4bdtVrdiqbhpf9qZzCkYEtAQ1CmawCO-vdl2eAGhMx9t7rWnWuPRCGjlWBQqH4n9e0j1I1hzjJl2YDa47Tgrbt09hdyGjgRqRWN-vxquTox6SqiAB2oiIaybWWCODz0smrhAgXkKYluF_dohK3DcKeQNYj01pP24iWMgb5getrjNpsCxdoTbiki7Fvzj3v_T0KWzv5idykLAXdoSgTNXqAKqy4owG51qX7rtVvsYLT7kczzob3cZujXXjPMCP_Uu4Iz1yTnCJjf0wq8NWCtHk5pvoVBE85LXenvfT_TEKdwUippJOYkA2UAa0ggL3nAZvZIQyZG9K6bPMCmKkdBkBStj-5qqraFYJ6EELbVawN2bhCtIw68jx3LrMrzAP2GPFXO3ULuR39obC7-UiJrX3rAEANSpWvtlXVZ8xaOm33APntD8qGkD5UTL6Ces1JUoHrb-0LuwE3LKbmAzn7GDeUAU0tr4vD8y971gc4nOV7BpQ3G8ZuMgwMot-dtVT88R-EVb0rhaF5QfchRzQSYVao7ERtP-uhG1mu5ZEYifB40ZECfcqEyan_LCDP1tsgy_84UaG_J3KNgPW9T1LLo5g6tff_k1RuBllJUox3668HFq8CeEXQdZ_Iw-FsIQw=w1719-h852-no?authuser=0)\n\
  \n**Supplementary Figure 2:** Overview of Clinical Acceptability Protocol, an open source web-based\
  \ quality assurance tool from our previous study was modified for clinical acceptability testing of\
  \ radiation therapy contours. For this analysis, 4 expert radiation oncologists were each given the\
  \ opportunity to assess the acceptability of deep learning or manual ground truth contours in a blinded\
  \ fashion. 10 ground truth contours paired with 10 deep learning generated contours for the same patient\
  \ were extracted for each of the 19 OARs. A total of  380 3D contours were assessed by each observer.\
  \ They were asked to rate acceptability on a 5 point scale taking the complete volume of the entire\
  \ OAR contour into context. A rating of 4.0 and higher can be considered ‘acceptable’ in that no edits\
  \ are required by the examining physician for planning purposes. They were also asked to ‘guess’ the\
  \ observer that generated the contour (“Human”/ “Computer” / “I don’t Know”) before submitting their\
  \ rating. Mean Acceptability Ratings were then calculated for each OAR, and analysis assessing correlation\
  \ of acceptability with 6 different segmentation performance metrics was conducted. These metrics include\
  \ 3D Volumetric Dice Overlap Coefficient, 95% Hausdorff Distance, Applied Path Length, False Negative\
  \ Length, and False Negative Volume\n\n![Supplementary Figure 7: Overview of Ensemble & WOLNET External\
  \ Validation Ensembling by averaging the predictions of similar but distinct CNN models has proven to\
  \ boost network performance while increasing a model’s generalizability potential. To minimize variance\
  \ and spurious model predictions, we decided to use five random K-Fold training/validation splits to\
  \ build a WOLNET segmentation ensemble. A set of 5 publicly available datasets were gathered for external\
  \ validation of the WOLNET ensemble that span a total of 335 patients. Predictions were saved and performance\
  \ metrics were extracted for overlapping OARs.](https://lh3.googleusercontent.com/pw/AM-JKLWhk2cZtKq5yOkWd1YN5rXcolozEKUEWGfeizB5-UnfW-6zdU3ZrNGTMBL9DbCq_D7sX5D5GG9kLL2rZY6rixfb8QjVkr_A84-MAlKS7EAmc1H-bEl3-Xng67G_nQK2H2QOpjLlfoYgBkDQ2Dt3wxT0-Q=w981-h533-no?authuser=0)\n\
  \n**Supplementary Figure 7:** Overview of Ensemble & WOLNET External Validation Ensembling by averaging\
  \ the predictions of similar but distinct CNN models has proven to boost network performance while increasing\
  \ a model’s generalizability potential. To minimize variance and spurious model predictions, we decided\
  \ to use five random K-Fold training/validation splits to build a WOLNET segmentation ensemble. A set\
  \ of 5 publicly available datasets were gathered for external validation of the WOLNET ensemble that\
  \ span a total of 335 patients. Predictions were saved and performance metrics were extracted for overlapping\
  \ OARs.\n\n## Citation information\n\n``` @article {Marsilla2022.01.15.22269276,\n\tauthor = {Marsilla,\

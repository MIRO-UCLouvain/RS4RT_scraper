readme_excerpt: '# U-Net-Brain-Tumor-Segmentation

  Segments brain tumor subregions from 3D MRI scans using a U-Net model.


  # Problem

  Identifying tumor subregions in MRI scans manually is slow and inconsistent. Task: generate pixel-level
  segmentation masks automatically.


  # Method

  Trained a U-Net model on the BRATS20 dataset to distinguish multiple tumor subregions from 3D MRI scans.
  6-week project.


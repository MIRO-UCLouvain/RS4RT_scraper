readme_excerpt: "#  Mushroom Toxicity Classification using XGBoost\n\n## Project Overview\nThis project\
  \ focuses on developing a binary classification model to predict whether mushrooms are **poisonous or\
  \ edible** based on their physical and environmental characteristics. The model was developed using\
  \ **XGBoost** with an emphasis not only on predictive performance, but also on **reliability of decision-making\
  \ and risk-aware evaluation**. Instead of relying on default settings and aggregate metrics, this project\
  \ explores how **feature importance analysis** and **threshold adjustment** can significantly affect\
  \ model prediction results in classifications that are critical to safety.\n\n---\n\n## Objectives\n\
  - Build a binary classifier for mushroom toxicity detection  \n- Analyze the most influential features\
  \ driving model predictions  \n- Evaluate model performance beyond accuracy-based metrics  \n- Adjust\
  \ the decision threshold to reflect real-world risk considerations\n\n---\n\n## Dataset Description\n\
  The dataset contains categorical and numerical features describing mushroom characteristics, such as:\n\
  - Cap shape, surface, and color  \n- Gill attachment and gill color  \n- Ring type  \n- Habitat and\
  \ season  \n- Stem dimensions  \n\nThe target variable indicates whether a mushroom is **poisonous (1)**\
  \ or **edible (0)**.\n\n## Data Source\n\nThe dataset used in this project was obtained from Kaggle:\n\
  \n**Mushroom Classification: Edible or Poisonous?**  \nSource: Kaggle  \nLink: [Dataset](https://www.kaggle.com/datasets/vishalpnaik/mushroom-classification-edible-or-poisonous)\n\
  \n---\n\n## Modeling Approach\n- **Language**: `Python`\n- **Algorithm**: `XGBoost Classifier`  \n-\
  \ **Preprocessing**:\n  - One-hot encoding for categorical features  \n  - Handling missing values \
  \ \n  - Train–test split for evaluation  \n- **Evaluation Metrics**:\n  - Accuracy  \n  - Precision,\
  \ Recall, F1-score  \n  - Confusion Matrix  \n  - ROC-AUC  \n\nThe model demonstrates strong baseline\
  \ performance before any threshold adjustment.\n\n---\n\n## Feature Importance Analysis\nTo understand\
  \ which features contribute most to the model’s predictions, feature importance scores from XGBoost\
  \ were analyzed.\n\nKey observations:\n- Environmental and structural features such as **habitat**,\
  \ **cap color**, **ring type**, and **gill attachment** play a significant role in determining toxicity.\
  \  \n- Certain cap shapes and surface characteristics consistently appear among the top predictive features.\
  \  \n\nKey Visualization:\n<img width=\"1001\" height=\"573\" alt=\"image\" src=\"https://github.com/user-attachments/assets/0f734e0e-d03d-4e4e-82a3-c203b6711941\"\
  \ />\n\n---\n\n## Threshold Tuning and Risk Considerations\nIn real-world mushroom classification, the\
  \ cost of misclassification is **asymmetric**.  \nA **false negative**—classifying a poisonous mushroom\
  \ as edible—poses a far greater risk than a false positive.\n\nFor this reason, threshold tuning was\
  \ performed to:\n- Move beyond the default probability threshold of 0.5  \n- Explicitly control the\
  \ trade-off between **precision and recall**  \n- Align model decisions with **safety-oriented objectives**\
  \  \n\nConfusion Matrix after Threshold Tuning:\n<img width=\"754\" height=\"642\" alt=\"image\" src=\"\
  https://github.com/user-attachments/assets/05325154-d096-47db-9584-a906c60c7770\" />\n\nThe results\
  \ show that adjusting the threshold significantly impacts recall and error distribution, making the\
  \ model more suitable for risk-sensitive deployment scenarios.\n\n---\n\n## ✅ Key Takeaways\n- High\
  \ overall accuracy does not guarantee safe decision-making  \n- Feature importance analysis helps validate\
  \ model reasoning  \n- Threshold tuning is a crucial step in safety-critical classification tasks  \n\
  - Model evaluation should be aligned with **real-world consequences**\n\n---\n"

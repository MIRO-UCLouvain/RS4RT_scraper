readme_excerpt: "# Multi-Omic Prognosis Transformer (MOPT)\n\n## 1. Project Overview\n\nThe Multi-Omic\
  \ Prognosis Transformer (MOPT) is a deep learning framework designed to predict disease prognosis by\
  \ integrating three independent biological data types: Genomics, Proteomics, and Radiomics.\nMost traditional\
  \ models analyze these sources separately, which reduces predictive accuracy.\nMOPT overcomes this limitation\
  \ by introducing a unified multi-modal fusion architecture capable of jointly learning from all three\
  \ omic layers.\n\n## 2. How the System Works\n\n### a. Input Data\n\nThe system uses three modalities:\n\
  \n* Genomic sequences (sequential data)\n* Proteomic concentrations (numeric biomarkers)\n* Radiomic\
  \ measurements (extracted tumor features)\n\n### b. Parallel Encoders\n\nThe architecture processes\
  \ each modality separately:\n\n* An LSTM network encodes genomic sequences\n* A Multi-Layer Perceptron\
  \ (MLP) encodes proteomic data\n* A second MLP encodes radiomic features\n\n### c. Fusion Layer\n\n\
  Outputs from all encoders are concatenated to form a single Biological Profile Vector:\n\n\ntorch.cat()\n\
  \n\n### d. Transformer Layer\n\nThe fused vector is passed into a Transformer, which models cross-omic\
  \ interactions and generates the final prognosis value.\n\n### e. Baseline Models\n\nTwo baseline models\
  \ are included for comparison:\n\n* LSTM-only model (genomics)\n* MLP-only model (proteomics + radiomics)\n\
  \nMOPT achieves a lower prediction error compared to both baselines.\n\n## 3. Required Tools and Dependencies\n\
  \nInstall the following:\n\npip install torch\npip install numpy\npip install pandas\npip install scikit-learn\n\
  pip install tabulate\npip install shap\n\n\n\n## 4. How to Run the Project\n\n### Step 1: Generate Synthetic\
  \ Data\n\nCreates the dataset used for training and evaluation.\n\npython mopt_data_simulator.py\n\n\
  Output:\n\nmopt_synthetic_data.csv\n\n### Step 2: Train and Evaluate Models\n\nRuns the fusion model\
  \ and baseline models, then prints the MSE comparison.\n\npython mopt_comparison.py\n\n### Step 3: Run\
  \ Explainability Analysis (Optional)\n\nGenerates SHAP visualizations to interpret model behavior.\n\
  \npython mopt_shap_analysis.py\n\n## 5. Project Structure\n\nmopt_data_simulator.py\nmopt_trainer.py\n\
  mopt_inference.py\nmopt_comparison.py\nmopt_shap_analysis.py\nfinal_shap_plot.py\nmopt_synthetic_data.csv\n\
  mopt_inference_results.xlsx\nREADME.md\n\n                                                         EVER\
  \ SINCE I WAS A KID, I BEEN LEGIT!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n"

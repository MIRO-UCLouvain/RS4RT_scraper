readme_excerpt: "# Biologically-Constrained Tri-Planar 2D Segmentation with Thick Slab Encoding for Brain\
  \ Tumors\r\n\r\n![Python](https://img.shields.io/badge/Python-3.8%2B-blue)\r\n![PyTorch](https://img.shields.io/badge/PyTorch-Enabled-ee4c2c)\r\
  \n![Kaggle](https://img.shields.io/badge/Dataset-BraTS_2021-20beff)\r\n![Status](https://img.shields.io/badge/Status-Completed-success)\r\
  \n\r\n**Author:** Rayan Al Haiek  \r\n**Student ID:** 2282086  \r\n\r\nThis project introduces a hybrid\
  \ Tri-Planar 2D architecture for the segmentation of gliomas (using the BraTS 2021 dataset). It efficiently\
  \ bridges the gap between lightweight 2D models and the spatial depth awareness of complex 3D architectures,\
  \ achieving state-of-the-art clinical accuracy while completely eliminating Out-Of-Memory (OOM) bottlenecks.\r\
  \n\r\n---\r\n\r\n## \U0001F4C2 Project Structure\r\nThe main directory contains the following components:\r\
  \n\r\n### 1. `Code/`\r\n* **`0_data_preprocessing_final.ipynb`**: Data processing notebook handling\
  \ dynamic bounding-box cropping, masked Z-score normalization, and conversion of raw MRI scans from\
  \ the heavy NIfTI format to lightweight `.npz` arrays to accelerate training.\r\n* **`1-train-flagship-v5.ipynb`**:\
  \ Model construction and training notebook for the V5 architecture, featuring Axial-Anchored Cross-Attention\
  \ and the Anatomically-Constrained Hierarchical Decoder.\r\n* **`2-evaluate-and-visualize/`**:\r\n \
  \ * `2-evaluate-and-visualize.ipynb`: Comprehensive evaluation notebook executed on the 126-patient\
  \ hold-out test set. It applies Morphological Post-Processing, Class-Specific Confidence Thresholds,\
  \ and the clinical ET-filtering rule for strict hierarchy enforcement.\r\n  * `results/`: Contains the\
  \ 7 high-resolution academic visualizations generated by the evaluation script (e.g., Radar Metrics,\
  \ Normalized Confusion Matrices, Best/Worst case inferences).\r\n\r\n### 2. `Data_samples/`\r\n* Contains\
  \ 10 randomly extracted patient samples from the unseen test cohort.\r\n* **Contents:** Each patient\
  \ folder includes 4 standardized MRI modalities (`FLAIR.png`, `T1.png`, `T1ce.png`, `T2.png`) and the\
  \ verified `Mask.png` (Ground Truth).\r\n* **Purpose:** These samples are provided for visual inspection,\
  \ manual validation, and as high-quality assets for presentation slides and the academic poster.\r\n\
  \r\n### 3. `Model weights file/`\r\n* **`v5_no_wass_best.pth`**: The final pre-trained PyTorch weights,\
  \ achieving an optimal Global Mean Dice Score of 87.23% on the test cohort (Operating within a ~2.2M\
  \ parameter footprint).\r\n\r\n### 4. `Poster/`\r\n* `poster.pdf`: The final, print-ready academic poster.\r\
  \n* `LaTeX code & Sources/`: Directory containing the LaTeX `.tex` source code and associated image\
  \ assets used to compile the poster.\r\n\r\n### 5. `Report/`\r\n* `Report.pdf`: The comprehensive final\
  \ academic report.\r\n* `LaTeX code & Sources/`: Directory containing the LaTeX `.tex` source code,\
  \ references, and structural assets used to compile the report.\r\n\r\n---\r\n\r\n## \U0001F517 Important\
  \ Reference Links\r\n* **Original BraTS 2021 Dataset:** [[BRaTS 2021 Task 1 Dataset](https://www.kaggle.com/datasets/dschettler8845/brats-2021-task1)]\r\
  \n* **Preprocessed Dataset (Kaggle):** [[BraTS 2021 Task 1 - Preprocessed NPZ](https://www.kaggle.com/datasets/rayanalhaiek/brats-2021-preprocessed-npz)]\r\
  \n* **Pre-trained Model Weights (Kaggle):** [[Biologically-Constrained Tri-Planar](https://www.kaggle.com/models/rayanalhaiek/biologically-constrained-tri-planar/PyTorch/v5-no-wass/4)]\r\
  \n\r\n---\r\n\r\n## \U0001F680 Execution Instructions & Environment\r\n\r\n> ⚠️ **IMPORTANT:** All notebooks\
  \ (`.ipynb`) have been fully executed, and all cell outputs, metrics, and generated artifacts are saved\
  \ within them. **There is no need to re-run the code** to evaluate the project's methodology or results.\r\
  \n\r\nIf re-execution is desired for validation purposes, please follow these guidelines:\r\n1. **Notebook\
  \ 0 (`0_data_preprocessing_final.ipynb`):** Designed and executed using **Google Colab**.\r\n2. **Notebooks\
  \ 1 & 2 (`1-train` & `2-evaluate`):** Designed and executed using **Kaggle** (GPU acceleration is highly\
  \ recommended).\r\n   * **Kaggle Environment Setup:** To successfully run these notebooks, you must\
  \ attach the preprocessed dataset and the model weights to your Kaggle environment.\r\n   * Use the\
  \ **\"Add Input\"** feature in Kaggle, search using the URLs provided in the Reference Links above,\
  \ and attach both the dataset and the weights file before execution.\r\n\r\n---\r\n\r\n## \U0001F6E0\
  ️ Prerequisites & Dependencies\r\nTo execute the computational notebooks locally, you need Python 3.8+\
  \ and the libraries listed in the `requirements.txt` file.\r\n\r\n### Installation Steps:\r\n1. **Clone\
  \ the repository:**\r\n   ```bash\r\n   git clone https://github.com/rayan-alhaiek/Biologically-Constrained_Tri-Planar_2.5D_Segmentation.git\r\
  \n   cd Biologically-Constrained_Tri-Planar_2.5D_Segmentation\r\nInstall PyTorch with CUDA (Crucial\
  \ Step):\r\n\r\n⚠️ NOTE: Since this project relies heavily on GPU acceleration for training and inference,\
  \ it is highly recommended to install the CUDA-enabled version of PyTorch before installing the rest\
  \ of the requirements. Please visit the official PyTorch website to get the correct installation command\
  \ tailored to your specific OS and CUDA version.\r\n\r\nInstall the remaining dependencies:\r\nOnce\
  \ PyTorch is set up, install the rest of the required libraries by running:\r\n\r\n    pip install -r\
  \ requirements.txt\r\n\r\n---\r\n\r\n## \U0001F4DA References\r\nThis project relies on standard medical\
  \ imaging datasets and advanced deep learning methodologies. Key references include:\r\n1. **Dataset:**\
  \ Baid, U., et al. (2021). \"The RSNA-ASNR-MICCAI BraTS 2021 Benchmark on Brain Tumor Segmentation.\"\
  \ *arXiv preprint arXiv:2107.02314*.\r\n2. **Architecture:** The Tri-Planar 2D formulation integrates\
  \ principles from the standard 2D U-Net (Ronneberger et al., 2015) and spatial Cross-Attention mechanisms,\
  \ heavily customized to adhere to strict biological constraints.\r\n\r\n---\r\n\r\n## \U0001F64F Acknowledgments\r\
  \n* **Bahçeşehir University (BAU):** For providing the academic environment and foundational engineering\
  \ principles necessary to complete this work.\r\n* **Dr. Arezoo Sadeghzadeh:** For their invaluable\
  \ guidance, constructive feedback, and continuous support throughout the development of this project.\r\
  \n"

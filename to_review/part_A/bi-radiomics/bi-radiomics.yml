readme_excerpt: '<h1>Radiomics Features and BI-RADS Descriptors Dictionary</h1>


  <h2>Overview:</h2>

  This dictionary contains radiomics features and their corresponding descriptors based on the Breast
  Imaging-Reporting and Data System (BI-RADS). The BI-RADS system is widely used to classify breast lesions
  based on imaging characteristics such as shape, margin, and density.


  Each row in this dictionary maps a radiomics feature to a BI-RADS descriptor, indicating the relationship
  between feature values and the corresponding BI-RADS descriptor. Higher values of the radiomics feature
  in a given row are suggestive of the corresponding BI-RADS descriptor, and lower values are suggestive
  of the opposite.

  '

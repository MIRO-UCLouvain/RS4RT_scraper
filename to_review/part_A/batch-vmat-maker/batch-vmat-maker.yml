readme_excerpt: "# Batch-VMAT-Maker\nThis is a bulk VMAT Maker\\\nAs with any scripts grabbed from the\
  \ internet, make sure to backup your texture files before running this, in the event anything goes wrong\n\
  \n## Powershell Script Version \nPlace the powershell script in your materials/foldername/ folder, alongside\
  \ your texture files\\\nThe texture files must be named with sbox's preferred suffixes (_color, _rough,\
  \ _selfillum, _metal, _trans)\\\nThe powershell script will search for texture files with the _color\
  \ suffix\\\nOnce it finds something with that suffix it scans for other texture files with the same\
  \ name, but with the additional suffixes\\\nThe vmat output will include all extra maps that are found\n\
  \n\ntl;dr: If the script finds texture_brick_color.png it will search for the _rough, _selfillum, _metal\
  \ , and _trans suffixed texture files\\\nif it finds them it will add them to the vmat in the appropriate\
  \ place with default settings\n\n## Batch File Version (old and not maintained/updated)\n\n### Basic\
  \ Instructions\nPlace this script file into your materials/basetexturefiles/ folder alongside your texture\
  \ files\\\nRun the script\\\nThe options are outlined below\n\n\n## 1. CREATE BASIC VMAT FILES\nThis\
  \ will create a VMAT file for every image file in the basetexturefiles folder\\\nIt create a vmat with\
  \ the complex shader and uses the image file(s) for the \"color\" option\n\n\n## 2. CREATE PBR VMAT\
  \ FILES\nThis will create VMAT files with color, metalness, normal, and metalness\\\nThis option expects\
  \ all texture files to be the same file format\\\nThis option also expects the files to be named per\
  \ the specifications of sbox (texturename_color, texturename_metal, texturename_normal, texturename_rough)\n\
  \n## 3. CLEANUP UNCOMPILED VMAT FILES \nThis option scans your vmat files and checks for vmat_c files\\\
  \nIf it doesn't find a vmat_c file corresponding with the vmat file it will remove the vmat file\\\n\
  This option is mainly for cleaning up any unused materials from the final folder\n\n## 4. CLOSE BATCH\
  \ VMAT MAKER\nCloses the script\n\n\n# Error Handling\nThis script has some basic error handling that\
  \ *should* prevent it from running wild and going through multiple operations at once."

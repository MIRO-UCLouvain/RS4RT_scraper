readme_excerpt: "# Realtime-Benchmarking-Tools  \n## Tools for benchmarking real-time radiotherapy systems\
  \  \n\nIncluded in this data are lung [1] and prostate [2] patient measured motion traces, CT and contour\
  \ sets (defined as per RTOG 1021 and RTOG 0938 respectively).  \n  \nThis data collection consists of\
  \ images acquired during chemoradiotherapy of 20 locally-advanced, non-small cell lung cancer patients.\
  \ Members of the Image X Institute have contributed to the data collection and used this data for R&D\
  \ purposes.  \n 1) Hansen CR, Bertelsen A, Riis HL, Christiansen RL, Hansen O, Sykes JB, Thwaites DI,\
  \ Brink C. Plan quality and delivery accuracy of flattening filter free beam for sbrt lung treatments.\
  \ Acta Oncologica;0:1-6.  \n 2) Ng JA, Booth JT, Poulsen PR, Fledelius W, Worm ES, Eade T, Hegi F, Kneebone\
  \ A, Kuncic Z, Keall PJ. Kilovoltage intrafraction monitoring for prostate intensity modulated arc therapy:\
  \ First clinical results. International Journal of Radiation Oncology*Biology*Physics 2012;84:e655-e661.\
  \  \n 3) Suh Y, Dieterich S, Cho B, Keall PJ. An analysis of thoracic and abdominal tumour motion for\
  \ stereotactic body radiotherapy patients. Physics in Medicine and Biology 2008;53:3623.  \n 4) Langen\
  \ KM, Willoughby TR, Meeks SL, Santhanam A, Cunningham A, Levine L, Kupelian PA. Observations on real-time\
  \ prostate gland motion using electromagnetic tracking. International Journal of Radiation Oncology*Biology*Physics\
  \ 2008;71:1084-1090.  \n"

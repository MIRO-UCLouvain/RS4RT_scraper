  \n[![Streamlit App](https://static.streamlit.io/badges/streamlit_badge_black_white.svg)](https://medical-image-segmentation-jc6hrzsdhjimse9d47n5uz.streamlit.app/)\n\
  ## \U0001F4F8 App Screenshots\n\n### \U0001F3E0 Home Page\n![Home Page](https://raw.githubusercontent.com/sami442/medical-image-segmentation/main/Results/screenshot_home.png)\n\
  \n### \U0001F3AF Tumor Detection Result\n![Prediction](https://raw.githubusercontent.com/sami442/medical-image-segmentation/main/Results/screenshot_prediction.png)\n\
  ## ✨ App Features\n- \U0001F9E0 Real-time brain tumor segmentation\n- \U0001F4E4 Upload your own MRI\
  \ scans\n- \U0001F52C Built-in sample MRI images\n- \U0001F4CA Live performance metrics\n- \U0001F3A8\
  \ Professional dark UI design\n- \U0001F3E5 Medical disclaimer included\n- \n## \U0001F4CC Overview\n\
  A deep learning project that performs pixel-level segmentation of \nbrain tumors in MRI scans using\
  \ the U-Net architecture. \nThis tool assists in early and accurate tumor detection, \nsupporting healthcare\
  \ professionals in diagnosis.\n\n## \U0001F3AF Objectives\n- Detect and segment tumor regions in brain\
  \ MRI images\n- Achieve high accuracy using U-Net architecture\n- Visualize segmentation masks over\
  \ original MRI scans\n\n## \U0001F5C2️ Dataset\n- **Source:** [LGG Brain MRI Segmentation - Kaggle](https://www.kaggle.com/datasets/mateuszbuda/lgg-mri-segmentation)\n\
  - **Contents:** 110 patients, 3929 MRI images with tumor masks\n\n## \U0001F9E0 Model Architecture\n\
  - **Base Model:** U-Net\n- **Encoder:** Contracting path with Conv2D + MaxPooling\n- **Decoder:** Expansive\
  \ path with UpSampling + Skip Connections\n- **Loss Function:** Binary Crossentropy + Dice Loss\n- **Optimizer:**\
  \ Adam\n\n## \U0001F4CA Results\n| Metric | Score |\n|--------|-------|\n| Accuracy | 99.37% |\n| IoU\
  \ Score | - |\n| Dice Coefficient | 0.3147 |\n\n## \U0001F4C8 Results Visualization\n\n![Training History](https://raw.githubusercontent.com/sami442/medical-image-segmentation/main/Results/training_history_v2.png)\n\
  \n![Predictions](https://raw.githubusercontent.com/sami442/medical-image-segmentation/main/Results/predictions_v2.png)\n\
  \n## \U0001F6E0️ Technologies Used\n- Python 3.8+\n- TensorFlow / Keras\n- OpenCV\n- NumPy\n- Matplotlib\n\
  - Scikit-learn\n\n## \U0001F680 How to Run\n1. Clone the repository\n```bash\ngit clone https://github.com/sami442/medical-image-segmentation.git\n\
  ```\n2. Install dependencies\n```bash\npip install -r requirements.txt\n```\n3. Open the notebook\n\
  ```bash\njupyter notebook notebooks/unet_segmentation.ipynb\n```\n\n## \U0001F469‍\U0001F4BB Author\n\
  **Samina Mazhar**\n - GitHub: [@sami442](https://github.com/sami442)\n\n## \U0001F4C4 License\nThis\
  \ project is licensed under the MIT License.\n- **Format:** PNG images + corresponding binary masks\n\
  \n## \U0001F3D7️ Project Structure\n"

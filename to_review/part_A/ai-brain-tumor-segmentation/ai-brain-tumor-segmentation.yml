readme_excerpt: " \U0001F3E5 Medical AI Diagnosis Platform - Backend API\n\nBackend API built with FastAPI\
  \ for managing users, medical images, diagnoses, and integration with AI-powered medical imaging services.\n\
  \n\U0001F680 Overview\n\nThis repository contains the core backend service of a Medical AI Platform\
  \ designed to support brain tumor diagnosis workflows through medical image analysis.\n\nThe backend\
  \ acts as the central orchestration layer between:\n\nClinical users\nMedical image storage\nAI inference\
  \ services\nDiagnostic reports\nDatabase persistence\n\U0001F3D7️ System Architecture\n\nThe platform\
  \ follows a distributed architecture:\n\nFrontend (Web Application)\n            │\n            ▼\n\
  \      Backend API\n        (FastAPI)\n            │\n ┌──────────┼──────────┐\n │          │      \
  \    │\n ▼          ▼          ▼\nDatabase  Storage  AI Microservice\n(MySQL)   Images   Segmentation\
  \ Engine\n                      (UNet3D)\n\nThe backend is responsible for:\n\nUser management\nAuthentication\
  \ and authorization\nMedical image management\nDiagnostic workflow orchestration\nCommunication with\
  \ AI services\nPersistence of results and metadata\n\U0001F9E0 Core Features\nUser Management\nUser\
  \ registration\nAuthentication\nProfile management\nRole-based access support\nMedical Image Management\n\
  Upload medical images\nStore metadata\nFile validation\nImage retrieval\nDiagnosis Management\nCreate\
  \ diagnosis requests\nTrack diagnosis history\nRetrieve AI-generated results\nGenerate structured reports\n\
  AI Integration\nIntegration with external AI microservices\nMedical image processing workflows\nInference\
  \ request management\nResult aggregation\n⚙️ Technology Stack\nBackend\nFastAPI\nPython 3.12\nDatabase\n\
  MySQL\nSQLAlchemy ORM\nAlembic Migrations\nInfrastructure\nDocker\nGitHub Actions (planned)\nAI Integration\n\
  TensorFlow\nPyTorch\nMedical Imaging Pipelines\n\U0001F4C1 Project Structure\nBackend/\n│\n├── main.py\n\
  ├── requirements.txt\n├── .env\n│\n└── app/\n    ├── api/\n    │   ├── users.py\n    │   ├── images.py\n\
  \    │   └── diagnosis.py\n    │\n    ├── controllers/\n    │   ├── user_controller.py\n    │   ├──\
  \ image_controller.py\n    │   └── diagnosis_controller.py\n    │\n    ├── core/\n    │   └── config.py\n\
  \    │\n    ├── database/\n    │   ├── repository.py\n    │   └── migrations/\n    │\n    ├── models/\n\
  \    │   ├── base.py\n    │   ├── image.py\n    │   └── diagnosis.py\n    │\n    ├── storage/\n    │\
  \   └── image_storage.py\n    │\n    └── ai/\n        └── diagnosis_model.py\n\U0001F527 Installation\n\
  Clone Repository\ngit clone https://github.com/Mateo-Bravo/medical-ai-backend.git\n\ncd medical-ai-backend\n\
  Create Virtual Environment\npython -m venv .venv\n\nWindows:\n\n.venv\\Scripts\\activate\n\nLinux/Mac:\n\
  \nsource .venv/bin/activate\nInstall Dependencies\npip install -r requirements.txt\n\U0001F510 Environment\
  \ Variables\n\nCreate a .env file:\n\nDATABASE_URL=mysql+pymysql://user:password@host:3306/database\n\
  \nINIT_DB=true\n\nSECRET_KEY=your_secret_key\n\nIMAGE_BASE_DIR=../../Datasets/Web/Imagenes\n\nMODEL_BASE_DIR=../../Datasets/Web/ModelosEntrenados\n\
  \U0001F680 Running the Application\n\nDevelopment:\n\nuvicorn main:app --reload\n\nProduction:\n\nuvicorn\
  \ main:app --host 0.0.0.0 --port 8000\n\U0001F310 API Endpoints\nHealth Check\nGET /health\n\nResponse:\n\
  \n{\n  \"status\": \"healthy\"\n}\nUsers\nGET     /api/v1/users\nPOST    /api/v1/users\nGET     /api/v1/users/{id}\n\
  PUT     /api/v1/users/{id}\nDELETE  /api/v1/users/{id}\nImages\nGET     /api/v1/images\nPOST    /api/v1/images\n\
  GET     /api/v1/images/{id}\nDELETE  /api/v1/images/{id}\nDiagnosis\nPOST    /api/v1/diagnosis\nGET\
  \     /api/v1/diagnosis/{id}\nGET     /api/v1/diagnosis/history\n\U0001F5C4️ Database Design\n\nMain\
  \ entities:\n\nUsers\n\nStores platform users and authentication data.\n\nImages\n\nStores uploaded\
  \ medical image metadata.\n\nDiagnosis\n\nStores AI-generated diagnostic results and associated information.\n\
  \n\U0001F9E0 AI Workflow\n\nThe backend coordinates the complete diagnosis process:\n\nUpload MRI Image\n\
  \        │\n        ▼\nStore Metadata\n        │\n        ▼\nSend Request\nto AI Microservice\n    \
  \    │\n        ▼\nReceive Prediction\n        │\n        ▼\nPersist Results\n        │\n        ▼\n\
  Return Diagnostic Report\n\U0001F433 Docker Support\n\nBuild image:\n\ndocker build -t medical-ai-backend\
  \ .\n\nRun container:\n\ndocker run -p 8000:8000 medical-ai-backend\n\U0001F4C8 Future Enhancements\n\
  JWT Authentication\nRole-Based Access Control (RBAC)\nAudit Logging\nRedis Caching\nKubernetes Deployment\n\
  CI/CD Pipelines\nAPI Rate Limiting\nObservability and Metrics\n"

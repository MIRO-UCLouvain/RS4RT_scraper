readme_excerpt: "This repository contains the analysis notebooks and lightweight helper code used for\
  \ our study:\n\n**“19F MRI radiomic features: in vitro and in vivo”** (European Radiology Experimental).\n\
  \n## What is in this repository\n\n- `notebooks/`: the analysis notebooks.\n- `data/`: **no real data**\
  \ is distributed. Contains a README describing the input file formats.\n\n## Data availability\nThis\
  \ repository does not include imaging data, segmentations, or any patient-level data.  \nYou will need\
  \ to provide your own data in the expected format (see `data/README.md`).\n"

readme_excerpt: '# Medical Physics Study Guide


  Personal GitHub Pages site for Rainor Connor: medical physics study materials, interactive calculators,
  visualizations, and a professional portfolio.


  **Live site:** [https://mighty-raindeer.github.io/](https://mighty-raindeer.github.io/)


  ## What the site contains


  - Interactive study modules covering radiation therapy physics, dosimetry, imaging, and treatment-planning
  concepts

  - Calculators and visualizations (for example TG-51, dose/PDD/profile tools, brachytherapy, and related
  helpers)

  - Portfolio / CV pages and links to public software projects


  ## Educational purpose


  These materials are intended for education, self-study, and demonstration. They are not a substitute
  for primary references (textbooks, AAPM reports, regulatory guidance) or for commissioned clinical software
  used in patient care.


  ## Validation limitations


  Calculators and visualizations are approximations for learning. They have not been validated as clinical
  decision-support tools and must not be used for patient treatment planning or clinical decision-making.


  ## Clinical-use notice


  This software is provided for research, education, and development. It is not a medical device and has
  not been validated for clinical decision-making.


  Users are responsible for independent code review, testing, commissioning, verification of calculations
  and outputs, and compliance with applicable institutional policies before using any portion of the software
  in a clinical environment.


  No patient information or protected health information is included in this repository. Example CT slices
  under `modules/tools/data/` are publicly available anonymized sample data.


  ## Repository notes


  This repository hosts the static site source for GitHub Pages. Do not alter calculator physics or module
  technical content in documentation-only refreshes without separate review.


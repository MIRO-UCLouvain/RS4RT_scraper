readme_excerpt: "# Hvordan komme i gang med en kafka-konsument for datavarehus\n\nDenne guiden er under\
  \ utvikling og vill bestå av fem deler med alt en trenger for å utvikle __robuste__ kafka-konsumenter\
  \ til bruk i datavarehuset. All funksjonalitet vill ikke forklares grundig, men guiden vill heller fungere\
  \ som et rammeverk for hvordan nødvendig konfigurasjon kan gjøres basert på et ferdig oppsett. Dette\
  \ vill forhåpentligvis minimere forskjellige løsninger internt i datavarehuset sånn at det er enklere\
  \ å hjelpe hverandre på tvers av teams og skape en felles plattform for videreutvikling.\n\n## Oversikt\n\
  \n* [Programvare](https://github.com/navikt/dvh-kafka/blob/master/README.md#Programvare)\n  * [Programvareoversikt](https://github.com/navikt/dvh-kafka/blob/master/README.md#Programvareoversikt)\n\
  \  * [Litt informasjon om programvaren](https://github.com/navikt/dvh-kafka/blob/master/README.md#Litt-informasjon-om-programvaren)\n\
  \  * [Installasjon](https://github.com/navikt/dvh-kafka/blob/master/README.md#Installasjon)\n* [Utviklingsmiljø](https://github.com/navikt/dvh-kafka/blob/master/utviklingsmiljo/README.md#)\n\
  \  * [Installasjon](https://github.com/navikt/dvh-kafka/blob/master/utviklingsmiljo/README.md#Installasjon)\n\
  \  * [Hvordan bruke miljøet](https://github.com/navikt/dvh-kafka/blob/master/utviklingsmiljo/README.md#Hvordan-bruke-miljøet)\n\
  * [Konfigurasjon av kafka-konsument](https://github.com/navikt/dvh-kafka/blob/master/kafka-konsument/README.md#)\n\
  * [Integrasjon](https://github.com/navikt/dvh-kafka/blob/master/kafka-konsument/README.md#Integrasjon)\n\
  * [Docker og Nais](https://github.com/navikt/dvh-kafka/blob/master/nais/README.md#)\n\n## Programvare\n\
  \nHer er en oversikt over \"utviklingstacken\" med linker til informasjon om nedlasting og installasjon\
  \ av programvaren. For å raskest komme i gang se [Installasjon](https://github.com/navikt/dvh-kafka/blob/master/README.md#Installasjon).\n\
  \n### Programvareoversikt\n\n#### Nødvendig programvare\n\n* [Git](https://git-scm.com)\n  * [macOS](https://git-scm.com/downloads)\n\
  \  * [Windows](https://git-scm.com/downloads)\n* [IntelliJ](https://www.jetbrains.com/idea/download)\n\
  \  * [macOS](https://www.jetbrains.com/idea/download)\n  * [Windows](https://www.jetbrains.com/idea/download)\n\
  * [Docker](https://docker.com)\n  * [macOS](https://docker.com/?overlay=onboarding)\n  * [Windows](https://docker.com/?overlay=onboarding)\n\
  * [Python](https://www.python.org)\n  * [macOS](https://www.python.org/downloads)\n  * [Windows](https://www.python.org/downloads)\n\
  \n#### Anbefalt programvare for macOS\n\n* [Homebrew](https://brew.sh/)\n\n#### Anbefalt programvare\
  \ for Windows\n\n* [WSL2](https://docs.microsoft.com/en-us/windows/wsl/wsl2-install)\n\n#### Anbefalt\
  \ programvare for Python\n\n* [PyEnv](https://github.com/pyenv/pyenv)\n  * [macOS](https://github.com/pyenv/pyenv#homebrew-on-macos)\n\
  \  * [Windows](https://github.com/pyenv-win/pyenv-win/blob/master/README.md#installation)\n* [PipEnv](https://github.com/pypa/pipenv)\n\
  \  * [macOS](https://pipenv.kennethreitz.org/en/latest/install/#homebrew-installation-of-pipenv)\n \
  \ * [Windows](https://pipenv.kennethreitz.org/en/latest/install/#pragmatic-installation-of-pipenv)\n\
  \n### Litt informasjon om programvaren\n\nFor mer informasjon om programmene enn beskrevet her se linkene\
  \ over.\n\n#### Homebrew\n\nHomebrew er en packamanager for macOS som gjør installasjon av programvare\
  \ veldig enkelt. Homebrew gjør samme jobben som **apt-get** i Ubuntu.\n\n#### Git\n\nGit brukes til\
  \ versjonskontroll av kildenkoden og er nødvendig for å laste ned og laste opp kildekoden til [Github](https://github.com/navikt)\n\
  \n#### IntelliJ\n\nIntelliJ er den mest brukte IDE her i NAV IT og brukes for utvikling i Java.\n\n\
  #### PyEnv\n\nPyEnv brukes av PipEnv for å laste ned og lage lokale python-miljøer for hvert enkelt\
  \ prosjekt. Med andre ord så vill riktig Python versjon automatisk bli lastet ned og brukt i prosjektet\
  \ i hennhold til hva som er satt i [Pipfile](https://github.com/navikt/dvh-kafka/blob/9f4003ce9f3fbcd38ca191849dd3b2b9a0210bfd/utviklingsmiljo/Pipfile#L13)\n\
  \n#### PipEnv\n\nPipEnv lager automatisk lokale python-miljøer for hvert enkelt prosjekt i hennhold\
  \ til [Pipfile](https://github.com/navikt/dvh-kafka/blob/master/utviklingsmiljo/Pipfile).\n\n#### Docker\
  \ Desktop\n\nDocker brukes for å kjøre opp det vi trenger av servere i utviklingsmiljøet.\n\n### Installasjon\n\
  \nDenne guiden fokuserer på den raskeste måten å installere nødvendig og anbefalt programvare for utvikling\
  \ av kafka-konsumenter for datavarehus.\n\n#### Installasjon for macOS og Windows med WSL2\n\nAlle steder\
  \ i guiden merket med `$ en kommando` betyr at du skal kjøre kommandoen (uten $) i terminalen din.\n\
  \nEksempel:\n\n`$ cd /home/`\n\nVi starter med å installere Homebrew.\n\n`$ /bin/bash -c \"$(curl -fsSL\
  \ https://raw.githubusercontent.com/Homebrew/install/master/install.sh)\"`\n\nDu vill bli tilbudt å\
  \ installere Command Line Developer Tools fra Apple. Trykk Install. Etter installasjonen er ferdig,\
  \ trykk `Enter` igjen for å fortsette installasjonen av Homebrew. Etter installasjonen er ferdig:\n\n\
  `$ brew update`\n\n`$ brew tap caskroom/cask`\n\n`$ brew install git`\n\n`$ brew install pyenv`\n\n\
  `$ brew install pipenv`\n\nVelg hvem versjon av IntelliJ du ønsker å installere.\n\nFor IntelliJ Community\
  \ Edition:\n\n`$ brew cask install intellij-idea-ce`\n\nFor IntelliJ Ultimate Edition:\n\n`$ brew cask\
  \ install intellij-idea`\n\nDocker installeres i hennhold til linken under [Programvareoversikt](https://github.com/navikt/dvh-kafka/blob/master/README.md#Programvareoversikt)\n\
  \nAll done! :)\n\n#### Installasjon for Windows\n\nSiden installasjon av programvare er litt mer omfattende\
  \ på Windows se må du følge guidene linket under [Programvareoversikt](https://github.com/navikt/dvh-kafka/blob/master/README.md#Programvareoversikt)\n\
  \nHvis du har problemer med å få installert Docker på Windows kan [Docker Desktop WSL 2 backend](https://docs.docker.com/docker-for-windows/wsl-tech-preview/)\
  \ være en mulig løsning.\n"

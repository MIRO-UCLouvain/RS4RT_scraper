readme_excerpt: "# Spiking U-seg Net for Brain Tumor Segmentation\n\nReliable energy-efficient spiking\
  \ neural network for brain tumor segmentation.\n\nThis repository contains the code for the paper [Reliable\
  \ Brain Tumor Segmentation Based on Spiking Neural Networks with Efficient Training](https://ieeexplore.ieee.org/document/11516057/metrics#metrics).\
  \ The proposed method, referred to here as the **Spiking U-seg Net**, uses Forward Propagation Through\
  \ Time (FPTT) to keep temporal learning efficient while reducing the computational cost of training\
  \ spiking neural networks for semantic image segmentation.\n\n## Installation\n\nBefore running any\
  \ experiment, synchronize the environment from the project root with:\n\n```bash\nuv sync\n```\n\nIf\
  \ you do not have `uv` installed yet, follow the official installation instructions here: [Installation\
  \ | uv](https://docs.astral.sh/uv/getting-started/installation/).\n\n## Data\n\nThe project is evaluated\
  \ on the multimodal BraTS benchmarks:\n\n- BraTS 2017: https://www.kaggle.com/datasets/abdullahalmunem/brats17?resource=download\n\
  - BraTS 2023: https://www.synapse.org/Synapse:syn51514132\n\nDownload links are also listed in [data/data_download.txt](data/data_download.txt).\
  \ After downloading the datasets, preprocess them with the scripts in [data/](data/).\n\n## Training\
  \ and testing\n\nRun the experiments with the provided YAML configuration:\n\n```bash\nuv run python\
  \ snn_fptt.py --config experiments_snn_fptt.yaml\n```\n\nThe configuration file [experiments_snn_fptt.yaml](experiments_snn_fptt.yaml)\
  \ controls the experiment setup, data paths, and training options.\n\n## Architecture\n\nThe Spiking\
  \ U-seg Net is a spiking U-Net style network built from convolutional and deconvolutional blocks with\
  \ PLIF neurons and surrogate gradients. It processes multimodal MRI inputs slice by slice, aggregates\
  \ temporal information with FPTT, and produces voxel-wise tumor segmentation outputs.\n\nMain components:\n\
  \n- `ConvBlock`: convolution, normalization, and spiking activation.\n- `DeconvBlock`: transposed convolution\
  \ block for decoding, also followed by spiking activation.\n- `SNNBraTS`, `SNNBraTSUNetShallow`, `SNNBraTSUNetMedium`,\
  \ `SNNBraTSUNetDeep`: model variants with different encoder-decoder depths.\n\n<div align=\"center\"\
  >\n\n![Spiking U-seg Net architecture](figures/model.png)\n\n</div>\n\n## Citation\n\nIf you use this\
  \ code in an academic context, please cite:\n\n```bibtex\n@INPROCEEDINGS{11516057,\n\tauthor={Ghiardelli,\
  \ Aurora Pia and Tang, Guangzhi and Sun, Tao},\n\tbooktitle={2026 IEEE 23rd International Symposium\
  \ on Biomedical Imaging (ISBI)}, \n\ttitle={Reliable Brain Tumor Segmentation Based on Spiking Neural\
  \ Networks with Efficient Training}, \n\tyear={2026},\n\tvolume={},\n\tnumber={},\n\tpages={1-5},\n\t\
  keywords={Tumors;Modeling;Timing;Training;Dies;Uncertainty;Printing;Estimation;Spiking neural networks;Brain\
  \ tumors;Brain Tumor Segmentation;Spiking Neural Networks (SNNs);Uncertainty Estimation;Forward Propagation\
  \ Through Time (FPTT)},\n\tdoi={10.1109/ISBI61048.2026.11516057}\n}\n```\n\n## Notes\n\n- Run everything\
  \ from the repository root so `uv sync` and the experiment paths resolve correctly.\n- The code is organized\
  \ around the `snn_fptt.py` training script and the model definitions in [model.py](model.py)."

readme_excerpt: "# Multi-Modal Prediction of Breast Cancer Recurrence Using Clinical and Radiomic Features\
  \ from DCE-MRI\n\n##  Overview\nThis repository contains the implementation of a multi-modal machine\
  \ learning framework for predicting breast cancer recurrence by integrating clinical variables and radiomic\
  \ features derived from dynamic contrast-enhanced (DCE) MRI.\n\nThe framework evaluates three experimental\
  \ settings:\n1. Clinical-only models  \n2. Radiomics-only models  \n3. Multi-modal fusion models  \n\
  \n---\n\n##  Objectives\n- Predict breast cancer recurrence using multi-modal data  \n- Evaluate the\
  \ contribution of clinical and radiomic features  \n- Address class imbalance using cost-sensitive learning\
  \  \n- Improve classification performance using threshold optimization  \n\n---\n\n##  Dataset\n\nThis\
  \ study uses the **Duke Breast Cancer MRI dataset**, publicly available via The Cancer Imaging Archive\
  \ (TCIA).\n\n- Total patients: **920**  \n- Recurrence cases: **87 (9.45%)**  \n- Non-recurrence: **833\
  \ (90.55%)**  \n\nRadiomic features were **pre-extracted** and provided with the dataset following Saha\
  \ et al.\n\n### Feature Types:\n- Shape features  \n- First-order statistics  \n- Texture features \
  \ \n- Kinetic features (DCE-MRI)  \n\n Dataset access:  \n[https://www.cancerimagingarchive.net/](https://www.cancerimagingarchive.net/collection/duke-breast-cancer-mri/)\n\
  \n---\n\n##  Methodology\n\n### 1️ Clinical Model\n- 19 clinical variables  \n- Includes pre-treatment\
  \ and post-treatment features  \n\n---\n\n### 2️ Radiomic Model\n- Initial features: **530**  \n- Feature\
  \ selection:\n  - Bootstrap AUC estimation (1000 iterations)  \n  - Correlation filtering (|r| > 0.8)\
  \  \n- Final signature: **20 features**  \n\n---\n\n### 3️ Fusion Model (Multi-Modal)\n- Early fusion\
  \ (clinical + radiomic features)  \n- Evaluated configurations:\n  - Trial A: 39 features  \n  - Trial\
  \ B: 34 features ✅ (best)  \n  - Trial C: 25 features  \n\n---\n\n##  Models\n\n### Logistic Regression\
  \ (LR)\n- max_iter = 1000  \n- C = 1.0  \n- solver = liblinear  \n- class_weight = balanced  \n\n###\
  \ Random Forest (RF)\n- n_estimators = 300  \n- class_weight = balanced  \n\n### XGBoost\n- n_estimators\
  \ = 300  \n- eval_metric = logloss  \n- scale_pos_weight ≈ 9.5  \n\n---\n\n##  Evaluation Strategy\n\
  \n- Train/Test split: **80% / 20%**  \n- Cross-validation: **5-fold stratified (training set)**  \n\n\
  ### Metrics:\n- AUC (ROC)  \n- Accuracy  \n- F1-score  \n- Precision  \n- Sensitivity (Recall)  \n-\
  \ Specificity  \n\nAll results are reported as:  \n**mean ± std (min–max)**  \n\n---\n\n##  Threshold\
  \ Optimization\n\n- Applied after model prediction  \n- Threshold range: **0.05 → 0.60 (step = 0.025)**\
  \  \n- Objective: **maximize F1-score**  \n\n---\n\n##  Results Summary\n\n| Model              | AUC\
  \  | F1-score |\n|-------------------|------|----------|\n| Clinical          | 0.705 | 0.286 |\n| Radiomics\
  \         | 0.746 | 0.310 |\n| Fusion (Trial B)  | **0.750** | **0.390** |\n\n---\n\n##  Reproducibility\n\
  \n- Fixed random seed used across all experiments  \n- Consistent preprocessing and feature selection\
  \ pipeline  \n- Explicit hyperparameter configuration  \n- Full implementation provided  \n\n---\n\n\
  ##  Requirements\n\n- Python 3.12  \n- scikit-learn  \n- xgboost  \n- numpy  \n- pandas  \n- jupyter\
  \  \n\n##  Citation\n\n###  Paper\nIf you use this work, please cite:\n\nAlabdah, M., Jakubíček, R.\
  \  \nMulti-Modal Prediction of Breast Cancer Recurrence Using Clinical and Radiomic Features from DCE-MRI.\n\
  \n---\n\n###  Radiomics Study\n\nSaha, A., Harowicz, M. R., Grimm, L. J., Kim, C. E., Ghate, S. V.,\
  \ Walsh, R., & Mazurowski, M. A.  \nA machine learning approach to radiogenomics of breast cancer: A\
  \ study of 922 subjects and 529 DCE-MRI features.  \nBritish Journal of Cancer, 119, 508–516 (2018).\n\
  \n---\n\n###  Dataset (TCIA)\n\nSaha, A. et al.  \nDynamic contrast-enhanced magnetic resonance images\
  \ of breast cancer patients with tumor locations.  \nThe Cancer Imaging Archive, 2021.  \nhttps://doi.org/10.7937/TCIA.e3sv-re93\n\
  \n##  Notes\n\n- Dataset is **not included** due to TCIA restrictions  \n- Users must download data\
  \ manually from TCIA\n\n  ##  Contact\n\nMadeleine Alabdah  \nBrno University of Technology  \nEmail:\
  \ 273027@vutbr.cz  \n\n##  License\n\nThis project is licensed under the MIT License.\n"

readme_excerpt: "<!-- markdownlint-disable first-line-h1 -->\n<!-- markdownlint-disable no-inline-html\
  \ -->\n<p align=\"center\">\n  <img src=\"./logos/voxel-viewer-logo.svg\" alt=\"Voxel Viewer logo\"\
  \ width=\"220\" />\n</p>\n\n<h1 align=\"center\">Voxel Viewer</h1>\n<!-- markdownlint-enable no-inline-html\
  \ -->\n\n[![GitHub Build][gh-build-image]][gh-build-url]\n[![GitHub Sponsors][gh-sponsors-image]][gh-sponsors-url]\n\
  [![Buy Me A Coffee][buymeacoffee-image]][buymeacoffee-url]\n[![Twitter][twitter-image]][twitter-url]\n\
  \n> [!NOTE]\n> Web-based viewer for [CBCT (Cone Beam Computed Tomography)][cbct-wiki] volumes and scan\
  \ folders (supports Sirona GALILEOS, DICOM, OneVolume)\n\n## Problem\n\nWhen I visit my dentist, they\
  \ often send me 3D renderings of my dental scans to my email. The problem is these scans are usually\
  \ in a format that can only be opened with specific software, usually only for Windows PCs.\n\nI wanted\
  \ to be able to view these scans on my Mac, or on my phone/tablet in the browser.\n\nDental and maxillofacial\
  \ CT exports often arrive as vendor-specific folder\nstructures. I used [Codex](https://github.com/openai/codex)\
  \ to reverse-engineer these formats and build a simple web-based viewer for them.\n\n**Voxel Viewer**\
  \ solves that by opening supported study folders directly in the\nbrowser, parsing them locally, building\
  \ the volume off the main thread, and\nrendering linked MPR slices alongside a 3D preview.\n\n## Features\n\
  \n> [!WARNING]\n> This app is a side-project build for fun and learning. This is not a medical-grade\
  \ software, and it should not be used for diagnostic purposes.\n\nI built this project over a weekend\
  \ to view my dental scans. So far it supports the following features:\n\n- \U0001F4C1 **Open scan folders\
  \ or a single DICOM file** directly in the browser\n- \U0001F5C3️ **Supports popular MRP fomats** (Sirona\
  \ GALILEOS, OneVolume, DICOM)\n  - `GALILEOS` folders with `*_vol_0` and `*_vol_0_###`\n  - `OneVolume`\
  \ exports with native `CT_0.vol`\n  - `DICOM` slice folders or one uncompressed enhanced multi-frame\
  \ `.dcm` file\n- \U0001F9CA **3 axial slices** (axial, sagittal, coronal) with linked crosshairs\n-\
  \ \U0001F9B7 **Renders 3D model** with intersecting plains\n- \U0001F4F1 **PWA-ready**, so you can install\
  \ it on your phone or tablet\n\n## Demo\n\nHere is a short demo of what this viewer in action:\n\nhttps://github.com/user-attachments/assets/dec997b3-1226-479f-b6d1-ed4327fa3c3d\n\
  \n## Usage\n\n| App                                 | Repository                           |\n|:-----------------------------------:|:------------------------------------:|\n\
  | [\U0001F4F1 denysdovhan.com/voxel-viewer][app] | [\U0001F468‍\U0001F4BB denysdovhan/voxel-viewer][app-repo]\
  \ |\n| [![QR code for app][app-qr-image]][app] | [![QR code for repository][app-repo-qr-image]][app-repo]\
  \ |\n\n## Sponsorship\n\nYour generosity will help me maintain and develop more projects like this one.\n\
  \n- \U0001F496 [Sponsor on GitHub][gh-sponsors-url]\n- ☕️ [Buy Me A Coffee][buymeacoffee-url]\n- Bitcoin:\
  \ `bc1q7lfx6de8jrqt8mcds974l6nrsguhd6u30c6sg8`\n- Ethereum: `0x6aF39C917359897ae6969Ad682C14110afe1a0a1`\n\
  \n## Tech Overview\n\nOverall, this is a web-based app built with the following technologies:\n\n- **React,\
  \ TypeScript** - main framework and language\n- **Vite** - build tool\n- **Tailwind** - styling\n- **Three.js**\
  \ - 3D rendering\n- **Web Workers** - background processing\n- **`fflate`** - compression, unzipping\n\
  \n## Contributing\n\nClone the repository, install dependencies, and start the development server:\n\
  \n```bash\nnpm install\nnpm run dev\n```\n\n## License\n\n[PolyForm Noncommercial License 1.0.0](./LICENSE)\
  \ © [Denys Dovhan][denysdovhan]\n\n> [!NOTE]\n> Voxel Viewer is source-available for personal, educational,\
  \ research, and\nnon-commercial use under the [PolyForm Noncommercial License 1.0.0](./LICENSE).\n\n\
  > [!CAUTION]\n> Commercial use _is not permitted_ without prior written permission from\n> [Denys Dovhan][denysdovhan].\
  \ This includes use in paid products, commercial\n> services, clinical or diagnostic workflows, SaaS\
  \ offerings, commercial\n> integrations, or other business purposes.\n\n<!-- References -->\n\n[app]:\

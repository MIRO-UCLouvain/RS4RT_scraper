readme_excerpt: "# Radiomics-Based Detection and Temporal Characterization of Masseter Muscle Atrophy\
  \ Using Ultrasound and Machine Learning\n\nThis repository contains the complete and reproducible analysis\
  \ pipeline for a study evaluating radiomics-based machine learning applied to ultrasound images to detect\
  \ and temporally characterize masseter muscle atrophy induced by botulinum toxin type A (BoNT-A). Quantitative\
  \ histological measurements are used as a comparative reference.\n\nThe project was designed and reported\
  \ in accordance with the ARRIVE, STARD, and CLAIM guidelines.\n\n---\n\n## Study Rationale\n\nBotulinum\
  \ toxin–induced muscle atrophy represents a controlled experimental model to study structural and temporal\
  \ tissue changes. While histology provides a quantitative reference standard, it is invasive and unsuitable\
  \ for longitudinal monitoring. Ultrasound radiomics combined with machine learning may offer a noninvasive\
  \ alternative capable of detecting and temporally characterizing muscle atrophy.\n\nThis study evaluates\
  \ whether radiomics-based models derived from ultrasound images (ERAT) can approximate or complement\
  \ histology-based quantitative metrics (EHAT) in this context.\n\n---\n\n## Objectives\n\n- To construct\
  \ a histology-derived quantitative atrophy index (EHAT)\n- To develop radiomics-based machine learning\
  \ models from ultrasound images (ERAT)\n- To evaluate ERAT performance for:\n  - Classification of experimental\
  \ groups\n  - Regression of days post–BoNT-A injection\n- To compare ERAT and EHAT using correlation,\
  \ agreement, and group-wise statistical analyses\n- To assess model interpretability using SHAP-based\
  \ feature importance analysis\n\n---\n\n## Repository Structure\n\n```text\n├── notebooks/         \
  \        # Jupyter notebooks (analysis pipeline)\n│   ├── 00_setup.ipynb\n│   ├── 01_data_ingestion.ipynb\n\
  │   ├── 03_ehat_modeling.ipynb\n│   ├── 04_erat_modeling.ipynb\n│   └── 05_erat_vs_ehat_comparison.ipynb\n\
  ├── src/                       # Reusable Python modules\n│   ├── config.py\n│   ├── io.py\n│   ├──\
  \ preprocessing.py\n│   ├── stats.py\n│   ├── metrics.py\n│   ├── modeling.py\n│   └── shap_utils.py\n\
  ├── data/\n│   ├── raw/                   # Raw data (not versioned)\n│   └── processed/           \
  \  # Processed datasets (generated locally)\n├── results/\n│   ├── figures/               # Main manuscript\
  \ figures\n│   ├── tables/                # Main manuscript tables\n│   └── text/                  #\
  \ Textual summaries of results\n├── supplementary/\n│   ├── shap/                  # SHAP interpretability\
  \ outputs\n│   ├── tables/\n│   └── text/\n├── requirements.txt           # Python dependencies\n├──\
  \ README.md\n├── LICENSE\n└── CITATION.cff\n\n\n## Reproducibility\n\n### Software Requirements\nPython\
  \ ≥ 3.13.11\nAll dependencies are specified in requirements.txt\n\n### Setup\npip install -r requirements.txt\n\
  \n##EAnalysis Pipeline\n\nAll analyses are executed using Jupyter notebooks. The recommended execution\
  \ order is:\n\n00_setup.ipynb\nProject configuration, environment checks, and reproducibility settings.\n\
  \n01_data_ingestion.ipynb\nLoading, cleaning, and organization of raw ultrasound, histology, and metadata\
  \ inputs.\n\n03_ehat_modeling.ipynb\nConstruction and statistical analysis of the histology-based quantitative\
  \ atrophy index (EHAT), including group-wise distribution analyses.\n\n04_erat_modeling.ipynb\nDevelopment\
  \ and evaluation of radiomics-based machine learning models (ERAT), including:\n\nMulticlass classification\
  \ of experimental groups\n\nRegression of days post–BoNT-A injection\n\n05_erat_vs_ehat_comparison.ipynb\n\
  Direct comparison between ERAT and EHAT using correlation, agreement metrics, Bland–Altman analysis,\
  \ and group-wise statistical testing.\n\nSHAP interpretability (executed within notebooks/05_erat_vs_ehat_comparison.ipynb\
  \ and 07_shap_erat_regression.ipynb)\nModel interpretability is performed using SHAP (SHapley Additive\
  \ exPlanations) for:\n\nLightGBM multiclass classification (global and class-specific feature importance)\n\
  \nLightGBM regression (global feature importance)\n\nOutputs are written to supplementary/shap/ and\
  \ are intended for supplementary reporting.\n\nEach notebook is designed to be executed top-to-bottom.\n\
  \n##Outputs and Versioning Policy\n\nGitHub repository\nContains code, notebooks, and minimal essential\
  \ outputs required to understand and reproduce the workflow structure.\nResults generated during execution\
  \ (tables, figures, SHAP outputs):\nCreated locally under results/ and supplementary/\nNot versioned\
  \ on GitHub\nIncluded in the Zenodo release associated with this repository\n\n## Data Availability\n\
  \nRaw data are not publicly available due to experimental and ethical constraints.\nProcessed datasets\
  \ required to reproduce the analyses are generated during the pipeline execution.\n\nFor access to raw\
  \ data, please contact the corresponding author.\n\n##Model Interpretability\nModel interpretability\
  \ is assessed using SHAP (SHapley Additive exPlanations):\nMulticlass classification: global and class-specific\
  \ feature importance\nRegression models: global feature importance for continuous prediction\n\n##Code\
  \ Availability\n\nAll code used in this study is available in this repository under an open-source license.\n\
  \n##Citation\n\nIf you use this code, please cite the associated article and this repository (see CITATION.cff)."

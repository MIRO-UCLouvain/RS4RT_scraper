readme_excerpt: "# Mammographic Image Analysis Project\n\nA biomedical image analysis project focused\
  \ on classifying mammograms as normal or malignant using radiomics-based feature extraction.\n\n## Project\
  \ Overview\n\nThis project applies advanced image analysis techniques to the MIAS (Mammographic Image\
  \ Analysis Society) MiniMammographic Database for the classification of breast tissue as normal or containing\
  \ malignant spectra. The analysis leverages PyRadiomics for comprehensive feature extraction from mammographic\
  \ images.\n\n## Dataset\n\nThe project utilizes the **MIAS MiniMammographic Database**, a well-established\
  \ benchmark dataset in medical imaging research featuring:\n\n- **Resolution**: 1024 × 1024 pixels at\
  \ 200 micron pixel edge spacing\n- **Original Source**: Digitized from the original 50 micron MIAS Database\n\
  - **Classification**:\n  - **Normal**: 16 normal breast tissue samples\n  - **MalignantSpec**: 8 malignant\
  \ spectra samples\n\n### Image Samples\n\n- **[Normal/](Normal/)** - Normal breast tissue mammograms\n\
  - **[MalignantSpec/](MalignantSpec/)** - Malignant specimen mammograms\n\n## Project Structure\n\n```\n\
  ├── Normal/                          # Normal breast tissue images\n├── MalignantSpec/             \
  \      # Malignant specimen images\n├── EXTRACTION/                      # Processed images and extracted\
  \ features\n│   ├── *_clean.jpg                 # Cleaned/preprocessed images\n│   └── *_thr.jpg   \
  \                # Thresholded images\n├── pyradiomics-master/              # PyRadiomics library for\
  \ feature extraction\n├── Legend.txt                       # MIAS database documentation\n├── DataTypes.xlsx\
  \                   # Data classification spreadsheet\n├── Radiomics PW.pdf                 # Radiomics\
  \ methodology presentation\n└── AIB_FinalProject_Paul_Pau_Alvaro_Zaid.pdf  # Final project report\n\
  ```\n\n## Features\n\n### Image Preprocessing\n- Image cleaning and noise reduction\n- Thresholding\
  \ for region of interest (ROI) segmentation\n- Conversion to standardized formats for analysis\n\n###\
  \ Radiomics Feature Extraction\nUtilizing PyRadiomics, the project extracts a comprehensive set of quantitative\
  \ features including:\n\n- **First-order statistics**: Mean, median, standard deviation, min/max values\n\
  - **Shape-based features**: Compactness, sphericity, surface area\n- **Texture analysis**: Gray Level\
  \ Co-occurrence Matrix (GLCM), Gray Level Run Length Matrix (GLRLM)\n- **Wavelet-based features**: Multi-scale\
  \ texture analysis\n\n## Technologies Used\n\n- **Python** - Primary programming language\n- **PyRadiomics**\
  \ - Radiomic feature extraction library\n- **Image Processing**: PIL/Pillow for image handling\n- **Data\
  \ Processing**: NumPy, Pandas for numerical computation\n- **Machine Learning**: Compatible with scikit-learn\
  \ for classification\n\n## Dependencies\n\n### Core Requirements\n- Python 3.7+\n- PyRadiomics\n- NumPy\n\
  - Pandas\n- Pillow (PIL)\n- SimpleITK\n\n### Development\nSee `requirements.txt` in the PyRadiomics\
  \ folder for complete dependency specifications.\n\n## Installation & Setup\n\n\n1. **Install PyRadiomics**:\n\
  \   ```bash\n   cd pyradiomics-master\n   pip install -e .\n   ```\n\n2. **Install additional dependencies**:\n\
  \   ```bash\n   pip install numpy pandas pillow scikit-learn\n   ```\n\n## Usage\n\n### Basic Feature\
  \ Extraction Example\n\n```python\nfrom radiomics import featureextractor\nimport SimpleITK as sitk\n\
  \n# Initialize feature extractor\nextractor = featureextractor.RadiomicsFeatureExtractor()\n\n# Load\
  \ image and mask\nimage = sitk.ReadImage('path/to/image.nrrd')\nmask = sitk.ReadImage('path/to/mask.nrrd')\n\
  \n# Extract features\nresult = extractor.execute(image, mask)\n```\n\n### Batch Processing\n\nSee examples\
  \ in `pyradiomics-master/examples/` for batch processing workflows:\n- `batchprocessing.py` - Single-threaded\
  \ batch processing\n- `batchprocessing_parallel.py` - Parallel processing for multiple images\n\n##\
  \ Project Objectives\n\n1. Extract radiomics features from mammographic images\n2. Compare feature distributions\
  \ between normal and malignant samples\n3. Identify discriminative features for classification\n4. Build\
  \ a classification model to distinguish between tissue types\n5. Evaluate model performance and clinical\
  \ applicability\n\n## Results & Analysis\n\nFeature extraction results are stored in the `EXTRACTION/`\
  \ folder:\n- Processed images show the preprocessing pipeline effectiveness\n- Feature vectors enable\
  \ statistical comparison between classes\n- Classification performance metrics documented in the final\
  \ project report\n\n## References\n\n- Suckling, J., et al. (1994). \"The Mammographic Image Analysis\
  \ Society Digital Mammogram Database.\" *Exerpta Medica. International Congress Series*, 1069, 375-378.\n\
  - Van Griethuysen, J. J., et al. PyRadiomics: Radiomics Package for Python. Retrieved from https://github.com/Radiomics/pyradiomics\n\
  - PyRadiomics Documentation: https://pyradiomics.readthedocs.io/\n\n## Team Members\n\n- Paul\n- Pau\n\
  - Álvaro\n- Zaid\n\n## Course\n\n**Análisis de Imagen Biomédica** (Biomedical Image Analysis)  \n3º\
  \ Course, 2nd Term  \nSchool of Biomedical Engineering\n\n## License\n\nThe MIAS Database is provided\
  \ for research purposes. See `Legend.txt` for specific usage terms and conditions.\n\n## Notes\n\n-\
  \ All original mammogram images are in PGM format (.pgm)\n- Processed images in EXTRACTION folder are\
  \ in JPG format for easier visualization\n- Feature extraction configurations can be customized in PyRadiomics\
  \ settings\n- Refer to the final project report for detailed methodology and results\n\n---\n\n*For\
  \ questions or additional information, please refer to the project documentation and PyRadiomics official\
  \ resources.*\n"

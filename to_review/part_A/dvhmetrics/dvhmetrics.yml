readme_excerpt: "# DVHmetrics\r\n\r\n## Analyze Dose-Volume Histograms and Check Constraints using R\r\
  \n\r\n`DVHmetrics` provides functionality for the analysis of dose-volume histograms in radiation oncology:\r\
  \n\r\n * Read dose-volume-histogram (DVH) text files\r\n * Calculate arbitrary DVH metrics, show DVH\
  \ diagrams\r\n * Calculate gEUD, BED, convert DVH doses to EQD2\r\n * Calculate TCP and NTCP according\
  \ to LKB (Lyman probit), Niemierko logit, or Kaellman Poisson (relative seriality) model\r\n * Check\
  \ and visualize quality assurance constraints for the DVH\r\n * Includes a [`shiny`](http://shiny.rstudio.com/)-based\
  \ web application for most of the functionality - also available online at [shiny.imbei.uni-mainz.de/DVHmetrics/](https://shiny.imbei.uni-mainz.de/DVHmetrics/).\r\
  \n * For further explanations and an example walkthrough, see the [package vignette](https://cloud.r-project.org/web/packages/DVHmetrics/vignettes/DVHmetrics.pdf)\r\
  \n"

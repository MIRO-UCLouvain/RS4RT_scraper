readme_excerpt: "English | [中文](README.zh_CN.md)\n\n# AimRT\n\n\nFull project details on [aimrt.org](https://aimrt.org/)。\n\
  \n\n## Brief\n\n- AimRT is a basic runtime framework for the field of modern robotics. It is developed\
  \ based on modern C++, is lightweight and easy to deploy, and has more modern designs in resource management\
  \ and control, asynchronous programming, deployment configuration, etc.\n- AimRT is committed to integrating\
  \ the research and development of various deployment scenarios such as robot end-side, edge end, and\
  \ cloud. It serves modern AI- and cloud-based robot applications and provides modern and complete debugging\
  \ and performance analysis tools, as well as good observability support.\n- AimRT also provides a comprehensive\
  \ plug-in development interface, which is highly scalable and compatible with ROS2, HTTP, Grpc and other\
  \ traditional robot ecosystems or cloud service ecosystems, and supports progressive upgrades of your\
  \ existing systems.\n\n## Document\n\n\n- [AimRT-Docs](https://docs.aimrt.org/)\n  - [Getting Start](https://docs.aimrt.org/tutorials/index.html)\n\
  \  - [Contact](https://docs.aimrt.org/contact/index.html)\n  - [ReleaseNotes](https://docs.aimrt.org/release_notes/index.html)\n"

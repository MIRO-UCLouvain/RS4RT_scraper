readme_excerpt: "# geant4_radiotherapy\nradiotherapy simulation using geant4 based on Varian Clinac iX\n\
  \nthis repo shows how to do radiotherapy with simulation of Varian Clinac iX \n\nguide : build the file\
  \ using cmake in child folder \"build\" then insert gdml files in that build folder \n\ngdml files link\
  \ = https://drive.google.com/drive/folders/1ZF7K4e0xKozYbh1DCWeVq6l2pX51TpY_?usp=sharing\n\nhow to use\
  \ :\n\n./sim \\<gdml files\\> \\<macro files\\>\n\nif you want to record log file :\n\n./sim \\<gdml\
  \ files\\> \\<macro files\\> | tee \\<logfile\\>\n\nwhat need to be improved : \n\n1. use biasing technique\n\
  2. do filtering in sampling the data\n3. improve the scoring technique so it can detect which voxel\
  \ in which volume (furthermore able to generate DVH for the therapy)\n"

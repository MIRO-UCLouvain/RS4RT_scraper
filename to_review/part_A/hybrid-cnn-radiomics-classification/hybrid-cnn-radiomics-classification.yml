readme_excerpt: "# Hybrid-cnn-radiomics-classification\nBrain tumors, caused by rapid and uncontrolled\
  \ cellular proliferation, pose significant health risks worldwide. This study combines Radiomic features\
  \ with advanced deep learning models, including EfficientNet-B0 and ResNet-18, to classify 2D and 3D\
  \ brain tumor images effectively.\n\n## Paper Title:\nHybrid 2D/3D CNN and radiomics model for brain\
  \ tumor classification using EfficientNetb0 and ResNet-18\n\n## Authors:\nMilad Taleb, Sanaz Alibabaei\n\
  \n## DOI:\nhttps://doi.org/10.1186/s12880-025-02141-x\n\n## Jornal Link:\nhttps://link.springer.com/article/10.1186/s12880-025-02141-x\n\
  \n## Datasets:\nStanford university BrainMetShare,Datasets Available: ​h​t​t​p​​s​:​/​​/​d​o​i​​.​o​​r​g​/​​1​0​.​​7​1​7​1​​8​/​​z​6​6​c​-​q​r​5​9,\
  \ \nBCBM-RadioGenomics Version 1, Datasets Available: ​h​t​t​p​​s​:​/​​/​d​o​i​​.​o​​r​g​/​​1​0​.​​7​9​3​7​​/​R​​R​S​E​-​W​2​7​8,\n\
  SartajBhuvaji Datasets Available: ​h​t​t​p​​s​:​/​​/​g​i​t​​h​u​​b​.​c​​o​m​/​​S​a​r​t​​a​j​​B​h​u​​v​a​j​​i​/​B​r​​a​i​​n​-​T​​u​m​o​​r​-​C​l​​a​s​​s​i​f​i​c​a​t​i​o​n​-​D​a​t​a​S​e​t.\
  \ \nb) Datasets used exclusively for external validation:\nMendeley Data ​h​t​t​p​​s​:​/​​/​d​a​t​​a​.​​m​e​n​​d​e​l​​e​y​.​c​​o​m​​/​d​a​​t​a​s​​e​t​s​/​​z\
  \ ​w​​r​4​n​t​f​9​4​j​/​4, doi: ​h​t​t​p​​s​:​/​​/​d​o​i​​.​o​​r​g​/​​1​0​.​​1​7​6​3​​2​/​​z ​w​r​4​n​t​f​9​4​j​.​1\
  \ 2025. The University of California San Francisco\nBrain Metastases Stereotactic Radiosurgery (UCSF-BMSR)\
  \ MRI Dataset ​h​t​t​p​​s​:​/​​/​a​r​x​​i​v​​.​o​r​​g​/​a​​b​s​/​2​​3​0​​4​.​0​7​2​4​8, ​h​t​t​p​​s​:​/​​/​p​u​b​​s​.​​r​s​n​​a​.​o​​r​g​/​d​​o​i​​/​1​0​​.​1​1​​4​8​/​r\
  \ ​​y​a​​i​.​2​3​0​1​2​6, doi: h​t​t​p​​s​:​/​​/​d​o​i​​.​o​​r​g​/​​1​0​.​​5​8​0​7​​8​/​​C​2​4​W​2​K.\
  \ \n**Clinical MRI data** collected at [Kosarhospital] under ethical approval (Ref. No. 330099540, Ethics\
  \ code: IR.SEMUMS.REC.1403.329)\n\n## Results:\nThe results demonstrate that our approach effectively\
  \ distinguishes between Glioblastoma, IDH-wildtype, grade 4, meningiomas, and brain metastases, achieving\
  \ robust and accurate performance across tumor types. By leveraging both deep feature representations\
  \ and handcrafted radiomic descriptors, and employing advanced classifiers such as CatBoost and multilayer\
  \ perceptron (MLP), the proposed method enhances feature interpretability while maintaining strong classification\
  \ performance. This hybrid strategy offers a reliable, scalable, and clinically applicable solution\
  \ for automated brain tumor diagnosis.\n"

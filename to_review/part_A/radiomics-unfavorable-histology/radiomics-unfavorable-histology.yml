readme_excerpt: '# Radiomics for Prostate Cancer Risk Stratification Beyond PI-RADS


  Analysis code for:


  **"Decoupling Detection from Prognosis: A Two-Stage Radiomic Pipeline for Prostate Cancer Characterization
  and Risk Stratification Beyond PI-RADS"**


  Ahn H, Park SY, Kim TM, Firoozeh N, Valk JE, Lin DW, Westphalen AC.


  ## Overview


  This repository contains the core analysis pipeline for a two-stage radiomics framework that independently
  optimizes radiomic signatures for (1) prostate cancer detection and (2) biological risk stratification
  of unfavorable vs. favorable histology per Canary criteria.


  ## Repository Contents


  ### Preprocessing (`01_*`)

  - `01_preprocessing_mask_conversion.py` — 3D Slicer segmentation to binary mask conversion

  - `01b_preprocessing_sextants.py` — Prostate sextant mask generation for biopsy-lesion spatial mapping

  - `01c_preprocessing_resampling.py` — Voxel spacing resampling to 1.0 x 1.0 x 3.0 mm

  - `01d_preprocessing_normalization.py` — ADC auto-scaling and percentile-based intensity normalization


  ### Feature Extraction (`02_*`)

  - `02_feature_extraction.py` — PyRadiomics (v3.0.1) extraction with IBSI-compliant settings; 3,386 features
  from T2WI and ADC maps using original, LoG-filtered, wavelet-decomposed, and intensity-transformed images


  ### Feature Selection (`03_*`)

  - `03_feature_selection.py` — Consensus-based selection combining four algorithms (Mann-Whitney U, mutual
  information, random forest importance, elastic net) with majority voting across 5-fold cross-validation


  ### Modeling (`04_*`)

  - `04a_modeling_per_lesion.py` — Per-lesion analysis: 5 modeling strategies x 3 classifiers (LR, RF,
  XGBoost)

  - `04b_modeling_per_patient.py` — Per-patient analysis: index lesion and all-lesion aggregation approaches


  ## Requirements


  ```

  pip install -r requirements.txt

  ```


  Python 3.10+ and R 4.5+ (pROC, caret) are required. See `requirements.txt` for Python package versions.


  ## Note on Scope


  This repository includes custom code for the core analysis pipeline (preprocessing, feature extraction,
  feature selection, and modeling). Statistical testing (DeLong tests, bootstrap confidence intervals,
  calibration metrics) and figure/table generation were performed using standard software tools (R pROC,
  scikit-learn, matplotlib) and are not included in this repository. These analyses can be reproduced
  using standard statistical packages with the model predictions generated by the pipeline.


  ## Data Availability


  The data generated or analyzed during the study are available from the corresponding author on reasonable
  request.


  ## Contact


  Antonio C. Westphalen, MD, PhD — acwestph@uw.edu


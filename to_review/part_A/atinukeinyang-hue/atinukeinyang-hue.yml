readme_excerpt: '# 👋 Hi, I''m Atinuke Inyang


  ### Medical Physics × Artificial Intelligence


  I am a Medical Physicist exploring AI engineering for radiotherapy, medical research, and research automation.


  My work focuses on combining domain knowledge in medical physics with software development and artificial
  intelligence to build practical research tools.


  ---


  ## 🚀 Featured Project


  ### OncoResearch AI


  An open-source AI-powered literature research assistant designed for radiotherapy and medical physics
  research.


  It is being developed to help researchers search, process, analyze, and summarize evidence-based scientific
  literature.


  🔗 **Repository:** [OncoResearch AI](https://github.com/atinukeinyang-hue/oncoresearch-ai)


  ---


  ## 🛠️ Current Technical Focus


  - Python

  - APIs and JSON

  - PubMed / NCBI API integration

  - Scientific literature retrieval

  - XML and structured data processing

  - AI-assisted research workflows

  - Git and GitHub

  - Medical AI


  ---


  ## 📚 Currently Learning


  I am progressively expanding into:


  - Model Context Protocol (MCP)

  - LangChain

  - LangGraph

  - Retrieval-Augmented Generation (RAG)

  - Vector databases

  - FastAPI

  - Docker and cloud deployment


  ---


  ## 🔬 Areas of Interest


  - Artificial Intelligence in Radiotherapy

  - Medical Physics

  - Research Automation

  - Medical AI

  - Scientific Literature Intelligence

  - AI-assisted clinical and research workflows


  ---


  ## 🎯 Current Goal


  To build practical, evidence-grounded AI tools that connect **medical physics, radiotherapy research,
  and modern AI engineering**.


  ---


  ⭐ Explore my featured project: **[OncoResearch AI](https://github.com/atinukeinyang-hue/oncoresearch-ai)**


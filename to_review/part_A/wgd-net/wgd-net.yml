readme_excerpt: '# WGD-Net


  Official PyTorch implementation of:


  **WGD-Net: Wavelet-Guided 3D Dose Prediction Network with Geometric and Beam-Field Priors for Radiotherapy
  Planning**


  This repository provides the implementation of WGD-Net for 3D radiotherapy dose prediction.


  ## Overview


  WGD-Net is a wavelet-guided encoder-decoder network designed for 3D dose prediction. The main components
  include:


  - wavelet-domain feature decomposition;

  - prior-modulated wavelet attention (PMWA) for integrating PSDM and BF priors;

  - high-frequency subband reuse during decoding;

  - multi-scale deep supervision during training.


  ## Installation


  ```bash

  conda create -n wgdnet python=3.9

  conda activate wgdnet

  pip install -r requirements.txt

  ```


  ## Data


  The input data should include planning CT, structure masks, dose, possible dose mask, PSDMs, and a precomputed
  BF prior.


  The public GDP-HMM H&N dataset should be obtained from the official challenge website. The in-house
  cervical cancer dataset cannot be released due to institutional and patient-privacy restrictions.


  The BF prior used in the manuscript was generated from matched RT planning files using beam geometry,
  aperture accumulation, CT-based ray tracing, exponential attenuation, and normalisation. To keep the
  public code independent of institution-specific DICOM export conventions, this repository uses precomputed
  BF maps as inputs. Please provide a `BF.npy` or `BF.nii.gz` file for each patient.


  ## Citation


  Citation information will be updated after publication.


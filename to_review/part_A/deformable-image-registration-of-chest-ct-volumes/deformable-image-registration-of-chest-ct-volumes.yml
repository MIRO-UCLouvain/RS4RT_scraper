readme_excerpt: "# Deformable Image Registration of Chest CT Volumes\n\n**Contributors**: Patricia Cabanillas,\
  \ Ahmed Gouda, Zakia Khatun \n\n**Project Date**: 2019  \n\n**Problem Statement**: Extract candidate\
  \ regions of interest (ROI) for mass detection in mammograms, that are subsequently to-be-used for training\
  \ a classifier (eg. *support vector machines*, *convolutional neural networks*, etc.) \n \n**Dataset**:\
  \ [*DIR-Lab:* Deformable Image Registration Laboratory](https://med.emory.edu/departments/radiation-oncology/research-laboratories/deformable-image-registration/index.html)\n\
  \ \n## Input Pair Images \n![input_image](reports/images/input_image.png)\n   \n     \n## Segmentation\
  \ Pipeline \n![segmentation_pipeline](reports/images/segmentation_pipeline.png)\n\n    \n## Registered\
  \ Overlay Output \n![output](reports/images/output.png) \n \n\n## References\n● Sotiras, A., Davatzikos,\
  \ C., Paragios, N. (2013) “*Deformable Medical Image Registration: A Survey*”, IEEE Transactions on\
  \ Medical Imaging, 32(7), pp. 1153–1190.  \n● Ferrante, E., Dokania, P.K., Marini, R., Paragios, N.\
  \ (2017) “*Deformable Registration Through Learning of Context-Specific Metric Aggregation*”, Medical\
  \ Image Computing and Computer-Assisted Intervention (MICCAI), pp. 256–265, Springer International Publishing.\
  \  \n● Janssens, G., Jacques, L., Orban de Xivry, J., Geets, X., Macq, B. (2011) “*Diffeomorphic Registration\
  \ of Images with Variable Contrast Enhancement*”, International Journal of Biomedical Imaging, 2011,\
  \ Article ID 891585.  \n● Castillo, R. et al. (2009) “*A Reference Dataset for Deformable Image Registration\
  \ Spatial Accuracy Evaluation*”, Physics in Medicine & Biology, DIR-Lab Dataset, available at: www.dir-lab.com.\
  \  \n● Balakrishnan, G., Zhao, A., Sabuncu, M.R., Dalca, A.V., Guttag, J. (2018) “*An Unsupervised Learning\
  \ Model for Deformable Medical Image Registration*”, Proceedings of the IEEE Conference on Computer\
  \ Vision and Pattern Recognition (CVPR), pp. 9252–9260.  \n● Klein, S., Staring, M., Murphy, K., Viergever,\
  \ M.A., Pluim, J.P.W. (2010) “*elastix: A Toolbox for Intensity-Based Medical Image Registration*”,\
  \ IEEE Transactions on Medical Imaging, Elastix Manual v5.0, available at: http://elastix.isi.uu.nl.\
  \  \n"

readme_excerpt: "# \U0001F9E0 Brain Tumor Classification & Segmentation AI Assistant\n\nAn end-to-end\
  \ deep learning project for the automated **classification and segmentation of brain tumors from MRI\
  \ images**.\n\nThe project combines:\n\n- A **ResNet-based image classification model** to predict the\
  \ brain MRI category\n- A **ResNet U-Net segmentation model** to identify the tumor region\n- A **Streamlit\
  \ web application** that allows users to upload an MRI image and view the AI predictions\n\n> ⚠️ This\
  \ project is an educational and research prototype. It is not intended for clinical diagnosis or medical\
  \ decision-making.\n\n---\n\n## \U0001F4CC Project Overview\n\nBrain tumor analysis from MRI images\
  \ commonly involves two important tasks:\n\n1. **Classification** — determining the type or category\
  \ of the MRI image\n2. **Segmentation** — identifying the location and boundaries of the tumor\n\nThis\
  \ project implements both tasks in a single AI-assisted workflow.\n\n### Workflow\n\n```text\nBrain\
  \ MRI Image\n       │\n       ▼\n┌─────────────────────┐\n│ Classification Model │\n│       ResNet \
  \        │\n└─────────────────────┘\n       │\n       ▼\nTumor Class Prediction\n       │\n       ▼\n\
  ┌─────────────────────┐\n│ Segmentation Model  │\n│    ResNet U-Net     │\n└─────────────────────┘\n\
  \       │\n       ▼\nPredicted Tumor Mask\n```\n\n---\n\n## ✨ Features\n\n- Upload a brain MRI image\
  \ through an interactive web interface\n- Classify MRI images into the available dataset categories\n\
  - Display classification confidence scores\n- Generate a predicted tumor segmentation mask\n- Visualize\
  \ the original MRI image and predicted segmentation result\n- Train and evaluate classification and\
  \ segmentation models\n- Save model evaluation results and visualizations\n\n---\n\n## \U0001F9E0 Deep\
  \ Learning Models\n\n### Classification Model\n\nThe classification pipeline uses a **ResNet-based convolutional\
  \ neural network**.\n\nThe model predicts the MRI image category, including:\n\n- Glioma\n- Meningioma\n\
  - Pituitary tumor\n- No tumor\n\nThe classification model uses transfer learning and is trained on the\
  \ BRISC 2025 dataset.\n\n### Segmentation Model\n\nThe segmentation pipeline uses a **ResNet U-Net architecture**.\n\
  \nThe model predicts a pixel-level tumor mask:\n\n```text\nInput MRI Image\n        ↓\nResNet Encoder\n\
  \        ↓\nFeature Extraction\n        ↓\nU-Net Decoder\n        ↓\nPredicted Tumor Mask\n```\n\nThe\
  \ encoder extracts hierarchical image features, while the decoder reconstructs the spatial tumor region.\n\
  \n---\n\n## \U0001F4CA Segmentation Results\n\nThe current segmentation model achieved:\n\n| Metric\
  \ | Score |\n|---|---:|\n| Mean Dice Score | **0.838** |\n| Mean Intersection over Union (IoU) | **0.760**\
  \ |\n\n### Metric Definitions\n\nThe **Dice score** measures the overlap between the predicted tumor\
  \ mask and the ground-truth mask:\n\n\n\nThe **Intersection over Union (IoU)** measures the ratio between\
  \ the intersection and union of the predicted and ground-truth regions:\nHigher values indicate better\
  \ agreement between the predicted and ground-truth tumor regions.\n\n---\n\n## \U0001F5A5️ Streamlit\
  \ Application\n\nThe project includes an interactive Streamlit application.\n\nThe application allows\
  \ the user to:\n\n1. Upload a brain MRI image\n2. Run the classification model\n3. View the predicted\
  \ tumor category\n4. View the classification confidence\n5. Run the segmentation model\n6. View the\
  \ predicted tumor mask\n\nRun the application using:\n\n```bash\npython -m streamlit run app/streamlit_app.py\n\
  ```\n\nAfter running the command, Streamlit will display a local URL in the terminal. Open the URL in\
  \ your web browser.\n\n---\n\n## \U0001F4C1 Project Structure\n\n```text\nBrain-Tumor-Classification-Segmentation-AI-Assistant/\n\
  │\n├── app/\n│   └── streamlit_app.py\n│\n├── notebooks/\n│   ├── 01_explore_data.ipynb\n│   ├── 02_classification_resnet.ipynb\n\
  │   └── 03_segmentation_unet.ipynb\n│\n├── src/\n│   ├── classification_model.py\n│   ├── data_sets.py\n\
  │   ├── evaluate.py\n│   ├── segmentation_model.py\n│   ├── train_classification.py\n│   └── train_segmentation.py\n\
  │\n├── requirements.txt\n├── .gitignore\n└── README.md\n```\n\n### Folder Description\n\n| Folder/File\
  \ | Description |\n|---|---|\n| `app/` | Streamlit application and user interface |\n| `notebooks/`\
  \ | Data exploration, model training, and experimentation notebooks |\n| `src/` | Reusable model, dataset,\
  \ training, and evaluation code |\n| `classification_model.py` | ResNet classification model |\n| `segmentation_model.py`\
  \ | U-Net and ResNet U-Net model architectures |\n| `train_classification.py` | Classification model\
  \ training functions |\n| `train_segmentation.py` | Segmentation model training functions |\n| `evaluate.py`\
  \ | Model evaluation and visualization functions |\n| `requirements.txt` | Required Python packages\
  \ |\n| `.gitignore` | Files excluded from the Git repository |\n\n---\n\n## ⚙️ Installation\n\n### 1.\
  \ Clone the repository\n\n```bash\ngit clone https://github.com/Khato1999/Brain-Tumor-Classification-Segmentation-AI-Assistant-.git\n\
  ```\n\n### 2. Open the project folder\n\n```bash\ncd Brain-Tumor-Classification-Segmentation-AI-Assistant-\n\
  ```\n\n### 3. Create a Python environment\n\nUsing Conda:\n\n```bash\nconda create -n brain-tumor-ai\
  \ python=3.13\nconda activate brain-tumor-ai\n```\n\n### 4. Install the required packages\n\n```bash\n\
  pip install -r requirements.txt\n```\n\n---\n\n## \U0001F680 Running the Application\n\nFrom the project\
  \ root directory, run:\n\n```bash\npython -m streamlit run app/streamlit_app.py\n```\n\nThe application\
  \ should open automatically in your default web browser.\n\nIf it does not open automatically, copy\
  \ the local URL displayed in the terminal, which is usually similar to:\n\n```text\nhttp://localhost:8501\n\
  ```\n\n---\n\n## \U0001F4D3 Notebooks\n\nThe project contains three main notebooks.\n\n### 1. Data Exploration\n\
  \n```text\nnotebooks/01_explore_data.ipynb\n```\n\nThis notebook includes:\n\n- Dataset exploration\n\
  - Image visualization\n- Class distribution analysis\n- Image dimension inspection\n- Data quality checks\n\
  \n### 2. Classification\n\n```text\nnotebooks/02_classification_resnet.ipynb\n```\n\nThis notebook includes:\n\
  \n- Classification dataset preparation\n- ResNet model creation\n- Model training\n- Validation\n- Classification\
  \ evaluation\n\n### 3. Segmentation\n\n```text\nnotebooks/03_segmentation_unet.ipynb\n```\n\nThis notebook\
  \ includes:\n\n- Segmentation dataset preparation\n- ResNet U-Net model creation\n- Model training\n\
  - Dice score evaluation\n- IoU evaluation\n- Predicted mask visualization\n\n---\n\n## \U0001F4E6 Model\
  \ Checkpoints\n\nThe trained model checkpoints are not included in the repository because the model\
  \ files exceed GitHub's standard file-size limit.\n\nTo run the Streamlit application, place the trained\
  \ model checkpoints in the locations expected by `app/streamlit_app.py`.\n\nThe model files should be\
  \ stored in the appropriate project folders, for example:\n\n```text\nresults/\n├── classification/\n\
  │   └── resnet18_brisc.pth\n│\n└── segmentation/\n    └── resnet_unet_brisc.pth\n```\n\n> The exact\
  \ checkpoint filenames must match the paths defined in `app/streamlit_app.py`.\n\n---\n\n## \U0001F6E0\
  ️ Technologies\n\n- Python\n- PyTorch\n- Torchvision\n- ResNet\n- U-Net\n- ResNet U-Net\n- Streamlit\n\
  - NumPy\n- Pandas\n- Matplotlib\n- Scikit-learn\n- Jupyter Notebook\n\n---\n\n## \U0001F52C Dataset\n\
  \nThe project uses the **BRISC 2025 brain MRI dataset** obtained from Kaggle.\n\nThe dataset is not\
  \ included in this repository.\n\nTo reproduce the project:\n\n1. Download the dataset from Kaggle\n\
  2. Place the dataset in the appropriate local data directory\n3. Update the dataset path in the notebooks\
  \ or configuration files if necessary\n\n---\n\n## ⚠️ Limitations\n\nThis project has several limitations:\n\
  \n- The model performance depends on the quality and distribution of the training dataset\n- The model\
  \ was evaluated on the available project dataset and may not generalize to all clinical MRI data\n-\
  \ The application is not validated for clinical use\n- The predicted segmentation mask may contain false-positive\
  \ or false-negative regions\n- Classification confidence does not represent clinical certainty\n- The\
  \ application should not be used as a replacement for professional medical assessment\n\n---\n\n## \U0001F52E\
  \ Future Improvements\n\nPossible future improvements include:\n\n- Add a dedicated held-out test dataset\n\
  - Perform hyperparameter optimization\n- Add data augmentation experiments\n- Compare multiple classification\
  \ architectures\n- Compare standard U-Net and ResNet U-Net models\n- Add attention mechanisms to the\
  \ segmentation model\n- Add Grad-CAM visualizations for classification interpretability\n- Display MRI\
  \ images, predicted masks, and overlays side by side\n- Deploy the Streamlit application online\n- Add\
  \ automated tests and continuous integration\n- Add Docker support for reproducible deployment\n\n---\n\
  \n## \U0001F464 Author\n\n**Khato Zndnan**\n\nBiomedical Engineering Student  \nEindhoven University\
  \ of Technology\n\nGitHub: https://github.com/Khato1999\n\n---\n\n## \U0001F4C4 License\n\nThis project\
  \ is currently intended for educational and portfolio purposes.\n\nA software license can be added in\
  \ the future.\n\n---\n\n## ⚕️ Medical Disclaimer\n\nThis software is an educational and research prototype.\n\
  \nIt is **not a medical device** and has not been clinically validated. The predictions generated by\
  \ this application must not be used for diagnosis, treatment planning, or clinical decision-making.\n"

readme_excerpt: "# Kidney Tumor Segmentation with Uncertainty Quantification\n\n## Overview\nThis repository\
  \ contains the implementation of an uncertainty-aware kidney tumor segmentation model using an Attention\
  \ Residual U-Net with Guided Decoder (ARU-GD) and Monte Carlo Dropout on the KiTS23 dataset. The pipeline\
  \ produces multi-class segmentation masks and predictive entropy uncertainty maps.\n\n## Features\n\
  - Multi-class segmentation\n- Background / Kidney / Tumor / Cyst\n- Guided Decoder supervision\n- Attention\
  \ Gates\n- Predictive entropy uncertainty maps\n- Monte Carlo inference\n- KiTS23 dataset\n\n## Model\
  \ Architecture\n![Architecture](assets/architecture.svg)\n\nThe model uses a residual encoder with attention\
  \ gates in the decoder. Guided supervision is applied at multiple decoder depths, and Monte Carlo Dropout\
  \ is used at inference to estimate predictive uncertainty via entropy.\n\n## Dataset\nKiTS23 dataset\n\
  \n## Repository Structure\n```\n.\n├── assets/\n│   └── architecture.svg\n├── paper.pdf\n├── predict.py\n\
  ├── train.py\n├── requirements.txt\n├── .gitignore\n└── README.md\n```\n\n## Installation\n```\npip\
  \ install -r requirements.txt\n```\n\n## Training\n```\npython train.py\n```\n\n## Prediction\n```\n\
  python predict.py\n```\n\n## Results\n| Class | Dice | IoU |\n|-------|------|-----|\n| Kidney | 0.8370\
  \ | 0.7760 |\n| Tumor | 0.6914 | 0.6651 |\n| Cyst | 0.8235 | 0.8130 |\n\nMean foreground Dice = 0.831\
  \  \nMean foreground IoU = 0.8129\n\n## Research Paper\nSee `paper.pdf`.\n\n## Future Work\n- 3D extension\n\
  - Better uncertainty calibration\n- Transformer integration\n"

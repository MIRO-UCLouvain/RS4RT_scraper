  \ width=\"690\"> \n\n**6 MV polychromatic X-ray beam incident on typical water tank phantom**\n\n---------------------------------------------------------\n\
  ---------------------------------------------------------\n\n<img src=\"examples/three_beam_water_tank/dose_deposition.png\"\
  \ width=\"500\"> \n\n**Three 1 MeV X-ray beams incident on a water tank**\n\n---------------------------------------------------------\n\
  ---------------------------------------------------------\n\n<img src=\"examples/water_tank_with_aluminum/YZ_dose_deposition.png\"\
  \ width=\"500\"> \n\n**6 MeV X-ray beam incident on a water tank that contains a slab of aluminum**\n\
  \n---------------------------------------------------------\n---------------------------------------------------------\n\
  \n<img src=\"validation/electrons_incident/Al_521keV_0deg/comparison.png\" width=\"500\">\n\n**Physics\
  \ validation case - 521 keV electrons incident on infinite slab of Aluminum, as compared to experiment\
  \ (Lockwood calorimetry) and EGSnrc Monte Carlo program.**\n\n---------------------------------------------------------"

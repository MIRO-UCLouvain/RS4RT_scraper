readme_excerpt: "# Brain Tumor Segmentation (Hybrid Deep Learning)\n\nA hybrid deep learning framework\
  \ for **brain tumor segmentation from MRI scans**, combining CNNs, Transformers, and GANs to achieve\
  \ high accuracy and refined boundaries.\n\n---\n\n## Overview\n\nThis project integrates multiple architectures\
  \ to capture both **local spatial features** and **global contextual information**:\n\n- **U-Net** →\
  \ Core segmentation backbone  \n- **EfficientNetV2-S** → Strong feature extraction  \n- **Transformer**\
  \ → Captures global dependencies  \n- **GAN (Pix2Pix)** → Refines segmentation boundaries  \n\nThe hybrid\
  \ approach improves segmentation performance compared to standalone models.\n\n---\n\n## Architecture\n\
  \n![Architecture](assets/Architecture.png)\n\n---\n\n## Datasets\n\n- BraTS 2020 Dataset:  \n  https://www.kaggle.com/datasets/awsaf49/brats20-dataset-training-validation\
  \  \n\n![BraTS Dataset sample](assets/brats_gif3_patient50.gif)  \n\n- Figshare Brain Tumor Dataset:\
  \  \n  https://www.kaggle.com/datasets/ashkhagan/figshare-brain-tumor-dataset \n\n![Figshare Dataset\
  \ sample](assets/figshare_gif4_patients.gif)\n\n---\n\n## Results\n\n- Results on BraTS 2020 Dataset:\
  \ \n![BraTS segmentation](graphs/Already_in_ppt/BraTSResults.png)\n\n- Results on Figshare Brain Tumor\
  \ Dataset: \n![Figshare segmentation](graphs/Already_in_ppt/FigShareResults.png)\n\n- Evaluated on **BraTS\
  \ 2020** and **Figshare datasets**\n- Metrics used:\n  - Dice Score\n  - IoU (Intersection over Union)\n\
  \n✅ GAN-based post-processing improves boundary accuracy and visual quality.\n\n---\n\n## Tech Stack\n\
  \n- Python\n- PyTorch\n- OpenCV\n- NumPy / Matplotlib\n\n---"

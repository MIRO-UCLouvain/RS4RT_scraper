readme_excerpt: "# Text-Guided Brain Tumor Segmentation using Vision-Language Models\n\n## Introduction\n\
  Brain tumor segmentation from Magnetic Resonance Imaging (MRI) is a critical step in clinical diagnosis,\
  \ surgical planning, and post-operative monitoring. Traditional deep learning approaches rely entirely\
  \ on visual feature extraction. However, in clinical practice, radiologists evaluate MRI scans in conjunction\
  \ with prior knowledge and written clinical descriptions. \n\nThis project bridges this gap by introducing\
  \ **TG-SwinUNet** (Text-Guided Swin-UNet), a highly sophisticated Vision-Language Model (VLM) for the\
  \ BraTS 2020 challenge. The model takes multi-slice FLAIR MRI volumes and their corresponding patient-level\
  \ radiology text descriptions as joint input to explicitly condition spatial segmentation on clinical\
  \ language.\n\n## Key Features & Contributions\n* **Pseudo-3D Visual Encoding:** Utilizes a Swin-Transformer\
  \ (Tiny) backbone to process 5-slice stacked MRI inputs, extracting global spatial context without the\
  \ heavy memory overhead of true 3D CNNs.\n* **Domain-Adapted Text Encoding:** Employs the BioViL-T (BiomedVLP-CXR-BERT)\
  \ model with partial unfreezing (layers 8-11) to adapt to brain MRI vocabulary without catastrophic\
  \ forgetting.\n* **Multi-stage Multimodal Fusion:** \n  * Early-stage Feature-wise Linear Modulation\
  \ (FiLM) layers.\n  * Bottleneck Cross-Attention mapping explicit textual semantics to 7x7 spatial feature\
  \ grids.\n  * Text-Guided Attention Gates (TGAG) acting on skip-connections to filter irrelevant spatial\
  \ noise.\n* **Custom Compound Loss Function:** Combines Dice, Focal, Deep Supervision, Boundary Loss,\
  \ and a CLIP-style Contrastive Alignment Loss.\n\n## Dataset and Preprocessing\nThe model is trained\
  \ and evaluated on a paired text-image variation of the Brain Tumor Segmentation (BraTS) 2020 challenge\
  \ dataset.\n* **Image Data:** 2D axial FLAIR slices extracted from 344 patients (258 train, 86 validation).\n\
  * **Text Data:** Synthesized radiology reports corresponding to patient directories.\n* **Preprocessing\
  \ Pipeline:** \n  * Volumes resized to 128 x 128 x 128.\n  * Foreground Z-Score Normalization applied.\n\
  \  * Strict slice filtering: Slices containing fewer than 50 tumor pixels are removed to ensure robust\
  \ gradient descent.\n  * Text tokenized to exactly 128 tokens using specialized medical Byte-Pair Encoding.\n\
  \n## Architecture Deep-Dive\nThe TG-SwinUNet represents a fundamental shift from traditional unimodal\
  \ segmentation, operating via four meticulously integrated subsystems:\n\n1. **Visual Encoding via Swin\
  \ Transformer:** Instead of standard CNNs, the model utilizes a hierarchical `Swin-Tiny` backbone. By\
  \ employing Shifted Window Self-Attention, the encoder effectively captures global anatomical context\
  \ across four spatial resolutions, projecting the 5-channel pseudo-3D MRI input into a rich 7x7x768\
  \ bottleneck feature map.\n2. **Domain-Adaptive Text Encoding (BioViL-T):** Clinical reports are tokenized\
  \ and processed through a Medical BERT. To achieve domain adaptation without catastrophic forgetting,\
  \ layers 0-7 are frozen to retain general medical English, while layers 8-11 are fine-tuned for neuro-oncology.\
  \ The resulting embeddings are passed through a Projection MLP to achieve a shared 256-D latent space.\n\
  3. **Multi-Scale Modality Fusion:** \n    * **Early Fusion (FiLM):** Feature-wise Linear Modulation\
  \ applies scaling and shifting to the shallow visual features based directly on the text `CLS` token,\
  \ acting as a semantic filter.\n    * **Bottleneck Cross-Attention:** At the deepest encoder level,\
  \ the visual patches act as *Queries* against the text tokens (*Keys/Values*), enabling explicit word-to-pixel\
  \ mapping.\n4. **Text-Guided Decoder:** The transposed convolution decoder is upgraded with Text-Guided\
  \ Attention Gates (TGAG). These gates intercept standard skip-connections, utilizing the text embeddings\
  \ to generate spatial attention masks that actively suppress irrelevant background signals before upsampling.\n\
  \n## Compound Loss Formulation\nOptimizing a multimodal network for highly irregular tumor boundaries\
  \ requires a specialized loss landscape. The model is trained using a massive compound loss function\
  \ designed to penalize distinct failure modes simultaneously:\n\n```text\nL_Total = L_Seg(Final) + 0.5\
  \ * L_Seg(Dec3) + 0.25 * L_Seg(Dec4) + 0.2 * L_Boundary + 0.1 * L_Contrastive\n```\n\n* **Segmentation\
  \ Loss (`L_Seg`):** A combination of standard **Dice Loss** (optimizing volume overlap) and **Focal\
  \ Loss** (penalizing hard-to-predict, class-imbalanced pixels at the tumor fringe).\n* **Deep Supervision\
  \ (`Dec3`, `Dec4`):** Auxiliary segmentation heads extract intermediate predictions from the decoder.\
  \ This provides direct gradient pathways to the deep layers, combating the vanishing gradient problem\
  \ and accelerating convergence.\n* **Boundary Loss (`L_Boundary`):** Standard Dice loss often fails\
  \ on sharp contours. This term applies a severe 6x morphological penalty to predictions that bleed over\
  \ the tumor edge, strictly optimizing the Hausdorff Distance.\n* **Contrastive Alignment Loss (`L_Contrastive`):**\
  \ A CLIP-style temperature-scaled cosine similarity loss. This forces the 256-D Global Image Embeddings\
  \ and the 256-D Text Embeddings to mathematically converge, ensuring the Vision and Language modalities\
  \ operate within an identical semantic vector space.\n\n## Results & Ablation Study\nThe multimodal\
  \ architecture was evaluated against a structurally identical Image-Only baseline to rigorously prove\
  \ the value of textual conditioning.\n\n| Metric | Image-Only Baseline | Multimodal (TG-SwinUNet) |\
  \ Absolute Improvement |\n| :--- | :---: | :---: | :---: |\n| **Dice Score** | 0.846 | **0.856** | +0.010\
  \ |\n| **Intersection over Union (IoU)** | 0.765 | **0.776** | +0.011 |\n| **Hausdorff Distance** |\
  \ 22.978 | **21.662** | -1.316 |\n| **Precision** | 0.874 | 0.874 | 0.000 |\n| **Recall (Sensitivity)**\
  \ | 0.857 | **0.870** | +0.013 |\n\nRigorous explainability testing (Grad-CAM and t-SNE) physically\
  \ confirmed that the Text and Image features converge towards each other, proving that the NLP data\
  \ explicitly guides the spatial segmentation boundaries.\n\n## Repository Files\n* `Brain_Tumor.ipynb`:\
  \ Core source code containing PyTorch dataloaders, the TG-SwinUNet architecture, loss functions, training\
  \ loop, and evaluation/explainability metric generation.\n* `report.tex`: Comprehensive academic report\
  \ detailing the exact methodology.\n* `*.png` / `*.svg`: High-resolution architectural diagrams and\
  \ output plots.\n\n## Authors\n* Rohit Kumar (CS23B2053)\n* Sarvan Kumar (ME23B1065)\n"

readme_excerpt: "# Go forth and build! \U0001F680\n\n## Tutorial: How to make your first commit \U0001F4F9\
  :\n\nThis video example shows how to:\n\n- Edit your container code\n- Raise a new pull request\n- Deploy\
  \ the newest version automatically \U0001F680\n\nhttps://user-images.githubusercontent.com/1718624/216366290-9bcac918-8605-4cf5-a98a-75bb8f722966.mp4\n\
  \n\n\nBy now, you have deployed a container, and in moments, you can visit your app\nlive!\n\n> Be patient!\
  \ In ~3 mins your app is live, at your [app url](https://container-0dvhyxe.containers.anotherwebservice.com/).\
  \ It even has a free SSL/TLS certificate \U0001F512 you're welcome!\n\nYou probably want to add code\
  \ to your app. Good news, your app is ready right now to start coding, which is simple:\n\n1. Edit your\
  \ code\n2. Commit your code\n3. Push your code `git push origin main`\n\nYour app will be automatically\
  \ re-deployed with the latest code at: https://container-0dvhyxe.containers.anotherwebservice.com/\n\
  \n> You app is deployed already and is working software. Gone are the days of spending weeks coding\
  \ and then *another* week going to production. No. Go to production *early* and respond to change.\n\
  \n# Getting Started \U0001F4BB (locally on your laptop)\n\n> Step 0: You need to download your repo\
  \ to your computer:\n\n```\ngit clone git@github.com:ng0tkul4/container-0dvhyxe.git\ncd container-0dvhyxe\n\
  ```\n\n> See an error? You might need to setup permissions [here's a guide how to setup repo clone permissions](https://docs.github.com/en/authentication/connecting-to-github-with-ssh/adding-a-new-ssh-key-to-your-github-account)\n\
  \n1. [Install docker](https://docs.docker.com/get-docker/)\n\n2. Start your container locally: `docker-compose\
  \ up`\n3. Visit your app locally: http://127.0.0.1:5000/\n\n## View your app locally\n\nVisit: http://127.0.0.1:5000/\n\
  \n### Rebuild container (locally)\nIf you make changes to `Dockerfile`, then you need to rebuild your\
  \ container image. To rebuild the container image:\n```\ndocker-compose build\n# or \ndocker-compose\
  \ up --build\n```\n\n# Start coding! Which framework did you choose?\n\nNeed some help to get started?\n\
  \n- [**Flask** quickstart guide](https://flask.palletsprojects.com/en/2.2.x/quickstart/) ⚗️ \U0001F40D\
  \n- [**Django** quide](https://docs.djangoproject.com/en/4.1/topics/http/views/) \U0001F4F0\n- [**Ruby**\
  \ quickstart guide](https://github.com/KarmaComputing/rails-quickstart) \U0001F48E\n\n# Debugging\n\n\
  How do I turn on the debugger?\n\nEnable a breakpoint by adding `breakpoint()` to your code, start your\
  \ application and run to that point then in a terminal type:\n\n```\ndocker attach container-0dvhyxe\n\
  ```\nTa-da! You'll be inside the [Python debugger](https://docs.python.org/3/library/pdb.html#module-pdb)\
  \ ( ⬅️ Read this!)\n\n\n\n## Questions\n\n- How was this built? [All code is here](https://github.com/KarmaComputing/container-hosting)\n"

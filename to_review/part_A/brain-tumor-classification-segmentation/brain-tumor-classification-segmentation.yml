readme_excerpt: "# \U0001F9E0 Brain Tumor Segmentation & Classification\n\nAn end-to-end deep learning\
  \ project for **brain tumor analysis** from MRI images.\n\nThis repository contains the **training pipelines,\
  \ model development, and evaluation** for brain tumor segmentation and classification. The trained models\
  \ have also been deployed as separate Streamlit web applications for interactive inference.\n\n---\n\
  \n# \U0001F680 Related Deployments\n\nThe trained models are available as standalone Streamlit applications.\n\
  \n## \U0001F9E0 Brain Tumor Classification App\n\nDetect whether an MRI scan contains a brain tumor\
  \ using a **ResNet50 Transfer Learning** model.\n\n\U0001F517 **Repository**\nhttps://github.com/bassmaibrahim/Brain-Tumor-Detection-App\n\
  \n---\n\n## \U0001FA7A Brain Tumor Segmentation App\n\nGenerate a pixel-level segmentation mask of brain\
  \ tumors using a **U-Net** model.\n\n\U0001F517 **Repository**\nhttps://github.com/bassmaibrahim/Brain-Segmentation\n\
  \n---\n\nTogether, these repositories demonstrate the complete workflow from **model training** to **real-world\
  \ deployment**.\n\n---\n\n# \U0001F4D6 Overview\n\nBrain tumors are among the most critical neurological\
  \ diseases. Early detection and accurate localization are essential for effective diagnosis and treatment.\n\
  \nThis project consists of two deep learning models:\n\n- **Brain Tumor Segmentation** using U-Net\n\
  - **Brain Tumor Classification** using ResNet50 Transfer Learning\n\nTogether, these models demonstrate\
  \ a complete computer vision workflow for medical image analysis.\n\n---\n\n# ✨ Features\n\n- Brain\
  \ MRI preprocessing\n- Image normalization\n- Data augmentation\n- Brain tumor segmentation\n- Brain\
  \ tumor classification\n- Transfer learning with ResNet50\n- Model training and evaluation\n- Prediction\
  \ visualization\n- Interactive Streamlit deployment\n\n---\n\n# \U0001F3D7 Project Architecture\n\n\
  ```text\nBrain MRI Images\n        │\n        ▼\nImage Preprocessing\n        │\n        ▼\n───────────────────────────\n\
  Segmentation Pipeline\n───────────────────────────\n\nMRI Image\n      │\n      ▼\n U-Net Model\n  \
  \    │\n      ▼\n Tumor Mask\n      │\n      ▼\nStreamlit Segmentation App\n\n───────────────────────────\n\
  Classification Pipeline\n───────────────────────────\n\nMRI Image\n      │\n      ▼\n ResNet50\n   \
  \   │\n      ▼\n Tumor / No Tumor\n      │\n      ▼\nStreamlit Classification App\n```\n\n---\n\n# \U0001F4C2\
  \ Repository Structure\n\n```text\nBrain-Tumor-Project/\n\n├── Brain_Tumor_Classification.ipynb\n├──\
  \ brain-mri-segmentation.ipynb\n├── dataset/\n├── requirements.txt\n├── README.md\n│\n├── Related Projects\n\
  │   ├── Brain-Tumor-Detection-App\n│   └── Brain-Segmentation\n```\n\n---\n\n# \U0001F9E0 Models Used\n\
  \n## 1️⃣ Brain Tumor Segmentation\n\nArchitecture\n\n- U-Net\n\nPurpose\n\n- Segment tumor regions from\
  \ MRI images.\n\nMain Components\n\n- Encoder\n- Decoder\n- Skip Connections\n- Convolution Layers\n\
  - MaxPooling\n- Transposed Convolutions\n\n---\n\n## 2️⃣ Brain Tumor Classification\n\nArchitecture\n\
  \n- ResNet50 (Transfer Learning)\n\nPurpose\n\n- Classify MRI images as **Tumor** or **No Tumor**.\n\
  \nTransfer Learning\n\n- ImageNet pretrained weights\n- Frozen backbone\n- Custom classification head\n\
  \n---\n\n# ⚙️ Workflow\n\n```text\nLoad Dataset\n      │\n      ▼\n\nImage Preprocessing\n\n      │\n\
  \      ▼\n\nTrain / Validation Split\n\n      │\n      ▼\n\nTrain U-Net\n\n      │\n      ▼\n\nGenerate\
  \ Segmentation Masks\n\n      │\n      ▼\n\nTrain ResNet50\n\n      │\n      ▼\n\nEvaluate Models\n\n\
  \      │\n      ▼\n\nDeploy Streamlit Applications\n```\n\n---\n\n# \U0001F4CA Evaluation\n\n### Segmentation\n\
  \n- Predicted masks\n- Ground truth comparison\n- Validation visualization\n\n### Classification\n\n\
  - Accuracy\n- Loss\n- Confusion Matrix\n- Classification Report\n\n---\n\n# \U0001F4C8 Results\n\nThe\
  \ project demonstrates:\n\n- Accurate brain tumor localization using U-Net.\n- Brain tumor classification\
  \ using ResNet50 Transfer Learning.\n- Model evaluation using standard deep learning metrics.\n- Deployment\
  \ of both trained models as interactive Streamlit web applications.\n\n### Deployment Repositories\n\
  \n| Application | Purpose | Repository |\n|------------|---------|------------|\n| \U0001F9E0 Brain\
  \ Tumor Detection | MRI Classification | https://github.com/bassmaibrahim/Brain-Tumor-Detection-App\
  \ |\n| \U0001FA7A Brain Tumor Segmentation | MRI Segmentation | https://github.com/bassmaibrahim/Brain-Segmentation\
  \ |\n\n---\n\n# \U0001F6E0 Technologies\n\n- Python\n- TensorFlow\n- Keras\n- ResNet50\n- U-Net\n- OpenCV\n\
  - NumPy\n- Matplotlib\n- Scikit-learn\n- Streamlit\n\n---\n\n# \U0001F680 Installation\n\nClone the\
  \ repository\n\n```bash\ngit clone https://github.com/bassmaibrahim/Brain-Tumor-Project.git\n\ncd Brain-Tumor-Project\n\
  ```\n\nInstall dependencies\n\n```bash\npip install -r requirements.txt\n```\n\nLaunch Jupyter Notebook\n\
  \n```bash\njupyter notebook\n```\n\nRun either notebook:\n\n```\nBrain_Tumor_Classification.ipynb\n\
  ```\n\nor\n\n```\nbrain-mri-segmentation.ipynb\n```\n\n---\n\n# \U0001F52E Future Improvements\n\n-\
  \ Experiment with EfficientNet and Vision Transformers (ViT).\n- Train on larger and more diverse MRI\
  \ datasets.\n- Add Grad-CAM explainability.\n- Hyperparameter optimization.\n- Support multi-class brain\
  \ tumor classification.\n- Improve segmentation using Attention U-Net or U-Net++.\n- Containerize applications\
  \ using Docker.\n- Integrate both models into a unified medical imaging platform.\n\n---\n\n# \U0001F469\

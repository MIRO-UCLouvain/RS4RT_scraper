readme_excerpt: "# \U0001F9EA Drug Toxicity Predictor using Machine Learning & Deep Learning\n\nA project\
  \ that predicts drug toxicity based on molecular descriptors, using state-of-the-art machine learning\
  \ and deep learning models.  \nDeployed as an interactive Streamlit web app.\n\n---\n\n## \U0001F680\
  \ **Project Overview**\nDrug toxicity is a major challenge in drug discovery. This project aims to build\
  \ predictive models that can estimate the potential toxicity of chemical compounds using:\n- Machine\
  \ Learning algorithms (e.g., XGBoost, Random Forest, Logistic Regression)\n- Deep Learning frameworks\
  \ (TensorFlow, PyTorch)\n\nThe models use molecular descriptors generated from chemical structures.\n\
  \n---\n\n## \U0001F31F **Features**\n✅ Predict drug toxicity from input data  \n✅ Visualize prediction\
  \ results & feature importances  \n✅ Deployable Streamlit app for interactive testing  \n✅ Clean and\
  \ modular codebase\n\n---\n\n## \U0001F6E0 **Tech Stack**\n- Python\n- Streamlit (for web app)\n- scikit-learn,\
  \ XGBoost (ML models)\n- pandas, numpy, plotly (data handling & visualization)\n- RDKit, Mordred (for\
  \ feature engineering — run locally)\n\n---\n\n## \U0001F4E6 **Installation**\n\n### Clone the repo\n\
  ```bash\ngit clone https://github.com/sachinu25/drug-toxicity-predictor.git\ncd drug-toxicity-predictor\n"

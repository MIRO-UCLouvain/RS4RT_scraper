readme_excerpt: "# MCDIP-ADMM: Low-Dose CT Reconstruction\n\nThis repository contains an experimental\
  \ implementation of an **unsupervised CT image reconstruction framework** based on **ADMM combined with\
  \ Deep Image Prior (DIP)**.  \nThe project explores a **Multi-Code DIP (MCDIP) ensemble approach** to\
  \ reduce overfitting and improve reconstruction quality in low-dose CT imaging.\n\n## Project Overview\n\
  - CT reconstruction is modeled as an inverse problem: `y = Ax + n`\n- Low-dose CT introduces severe\
  \ noise and artifacts\n- Deep Image Prior (DIP) helps without pre-training but suffers from overfitting\n\
  - This project mitigates overfitting using **MCDIP + ADMM**\n\n## Key Contributions\n- Integration of\
  \ **ADMM framework** with **Multi-Code Deep Image Priors**\n- Ensemble averaging of multiple DIP networks\
  \ for stability\n- Adaptive stopping strategy to reduce noise fitting\n- Fully **unsupervised approach**\
  \ (no training dataset required)\n\n## Experimental Setup\n- Synthetic CT data using Shepp-Logan phantom\n\
  - Radon transform for projection simulation\n- Gaussian noise to simulate low-dose conditions\n- Evaluation\
  \ using PSNR and SSIM\n"

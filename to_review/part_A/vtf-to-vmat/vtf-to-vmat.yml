readme_excerpt: "# VTF2PNG & VMAT Converter\n\n## \U0001F1F7\U0001F1FA Русский\n\nЭтот скрипт предназначен\
  \ для конвертации файлов формата **VTF** в **PNG** и генерации соответствующих файлов **VMAT**.\n\n\
  ### Особенности\n- Конвертация всех VTF-файлов из папки `materials` в PNG.\n- Генерация VMAT-файлов\
  \ с использованием шаблона.\n- Поддержка вложенных директорий.\n- Автоматическое создание уникальных\
  \ имен файлов, чтобы не перезаписывать существующие.\n- Есть готовый **.exe**, который можно поместить\
  \ рядом с папкой `materials` и запустить без Python.\n\n### Требования\n- Python 3.8+\n- Модуль `vtf2img`\
  \ (для парсинга VTF-файлов)\n\n### Структура папок\n```\nproject_root/\n├─ materials/       # Входные\
  \ VTF-файлы\n├─ output/\n│  ├─ png_g/       # Выходные PNG-файлы\n│  └─ vmat_g/      # Выходные VMAT-файлы\n\
  ├─ converter.py     # Скрипт конвертации (или готовый .exe)\n```\n\n### Использование\n1. Поместите\
  \ VTF-файлы в папку `materials`.\n2. Запустите скрипт или .exe:\n```bash\npython converter.py\n```\n\
  3. Результаты будут в `output/png_g` и `output/vmat_g`.\n\n### Пример вывода\n```\n[INFO] Base path:\
  \ C:/project\n[INFO] Input folder: C:/project/materials\n[INFO] Output folder: C:/project/output\n[OK]\
  \ VTF: C:/project/materials/texture.vtf\n     PNG: C:/project/output/png_g/texture.png\n     VMAT: C:/project/output/vmat_g/texture.vmat\n\
  [INFO] Конвертация завершена. Нажмите Enter для выхода...\n```\n\n---\n\n## \U0001F1EC\U0001F1E7 English\n\
  \nThis script is designed to convert **VTF** files to **PNG** and generate corresponding **VMAT** files.\n\
  \n### Features\n- Converts all VTF files from the `materials` folder to PNG.\n- Generates VMAT files\
  \ using a template.\n- Supports nested directories.\n- Automatically creates unique file names to avoid\
  \ overwriting.\n- There is a ready-made **.exe**, which can be placed next to the `materials` folder\
  \ and run without Python.\n\n### Requirements\n- Python 3.8+\n- `vtf2img` module (for parsing VTF files)\n\
  \n### Folder Structure\n```\nproject_root/\n├─ materials/       # Input VTF files\n├─ output/\n│  ├─\
  \ png_g/       # Output PNG files\n│  └─ vmat_g/      # Output VMAT files\n├─ converter.py     # Conversion\
  \ script (or ready-made .exe)\n```\n\n### Usage\n1. Place VTF files in the `materials` folder.\n2. Run\
  \ the script or .exe:\n```bash\npython converter.py\n```\n3. The output will be in `output/png_g` and\
  \ `output/vmat_g`.\n\n### Sample Output\n```\n[INFO] Base path: C:/project\n[INFO] Input folder: C:/project/materials\n\
  [INFO] Output folder: C:/project/output\n[OK] VTF: C:/project/materials/texture.vtf\n     PNG: C:/project/output/png_g/texture.png\n\
  \     VMAT: C:/project/output/vmat_g/texture.vmat\n[INFO] Conversion finished. Press Enter to exit...\n\
  ```\n\n"

readme_excerpt: "# Brain Tumor Classification with CNN + Radiomics Fusion\n\nThis repository contains\
  \ an end-to-end research pipeline for MRI brain tumor classification for CSC4810 Artificial Intelligence\
  \ Final Project that combines a pretrained CNN (MobileNetV2) with engineered radiomics features and\
  \ demonstrates interpretability via Grad-CAM. The project includes data preparation, model training,\
  \ evaluation (accuracy & macro-F1), robustness experiments (noise / resolution), and visualization of\
  \ Grad-CAM overlays.\n\n---\n\n## Key Features\n\n- Multimodal fusion: combine CNN embeddings (learned)\
  \ with radiomics (hand-crafted) features.\n- Lightweight backbone: MobileNetV2 pretrained on ImageNet\
  \ with a custom head.\n- Interpretability: Grad-CAM implementation & visualization for qualitative model\
  \ inspection.\n- Robustness experiments: tests across noise levels and image resolutions.\n- Reproducible\
  \ notebooks and helper utilities for training, evaluation, and visualization.\n\n---\n\n## Repository\
  \ Structure\n\n- `brain_tumor_mini.ipynb` / `cnn_baseline_gradcam.ipynb` — primary Jupyter notebook(s)\
  \ containing the full pipeline: data loading, model building/training, radiomics pipeline, fusion classifier,\
  \ experiments, and Grad-CAM visualization.\n- `data/` (optional) — place the downloaded dataset here\
  \ or follow the instructions below to download it via KaggleHub or Kaggle CLI.\n- `notebooks/` — extra\
  \ exploratory notebooks (if any).\n- `models/` — recommended location to save checkpointed models (`.pt`)\
  \ and sklearn pipelines (`.pkl` / `.joblib`).\n- `results/` — suggested folder for saving evaluation\
  \ outputs, plots, and CSVs.\n- `.gitignore` — recommended ignores (check for model checkpoints, dataset,\
  \ large outputs).\n\n---\n\n## Dataset\n\nThis project uses the Kaggle dataset: **sartajbhuvaji/brain-tumor-classification-mri**\
  \ (organized as `Training` and `Testing` directories).\n\nOptions to obtain the data:\n\n1. KaggleHub\
  \ (used in the notebook): the notebooks call `kagglehub.dataset_download(\"sartajbhuvaji/brain-tumor-classification-mri\"\
  )` to fetch and unpack the dataset automatically.\n2. Kaggle CLI: install the Kaggle CLI, create an\
  \ API token, then:\n\n```powershell\nkaggle datasets download -d sartajbhuvaji/brain-tumor-classification-mri\
  \ -p data --unzip\n```\n\n3. Manual: download from the dataset page and extract into `data/` with top-level\
  \ folders `Training/` and `Testing/`.\n\nAfter downloading, ensure the notebook's `path` variable points\
  \ to the dataset root.\n\n---\n\n## Requirements\n\nSuggested Python packages (create a virtual environment\
  \ and install these):\n\n```text\npython>=3.8\ntorch\ntorchvision\nnumpy\nscikit-learn\nscikit-image\n\
  opencv-python\nmatplotlib\npandas\nkagglehub\njoblib\npyradiomics  # optional, if radiomics are computed\
  \ using pyradiomics\n\n# For notebook usage\njupyterlab\n\n```\n\nYou can create a `requirements.txt`\
  \ and install via:\n\n```powershell\npython -m venv .venv\n.\\.venv\\Scripts\\Activate.ps1\npip install\
  \ -r requirements.txt\n```\n\nNote: If you have a CUDA-capable GPU and want to use it, install a matching\
  \ `torch` wheel (see https://pytorch.org/get-started/locally/).\n\n---\n\n## Running the Notebook\n\n\
  1. Open `cnn_baseline_gradcam.ipynb` (or `brain_tumor_mini.ipynb`) in Jupyter or VS Code Notebook.\n\
  2. Ensure the `path` variable points to the dataset root (or run the KaggleHub cell to download it).\n\
  3. Run cells in order. Key sections:\n   - Environment & imports (verify package versions)\n   - Data\
  \ transforms and `ImageFolder` creation\n   - Train / validation split\n   - Model build (MobileNetV2)\
  \ and training loop\n   - Radiomics extraction & classical ML pipeline\n   - Feature fusion and evaluation\n\
  \   - Grad-CAM generation and visualization\n\nExample: open a terminal and run (Windows PowerShell):\n\
  \n```powershell\njupyter lab\n# or\njupyter notebook\n```\n\n---\n\n## Running Training (script-style)\n\
  \nThe notebooks implement an interactive workflow. If you extract key steps into scripts, the high-level\
  \ commands are:\n\n```powershell\n# 1. Prepare dataset path and config\n# 2. Train CNN backbone (or\
  \ fine-tune)\npython train_cnn.py --data-dir data --epochs 10 --batch-size 16 --lr 1e-4\n\n# 3. Extract\
  \ CNN embeddings and compute radiomics features\npython extract_features.py --data-dir data --out-dir\
  \ features\n\n# 4. Train fusion classifier (sklearn)\npython train_fusion.py --features features --out\
  \ models/fusion.joblib\n\n# 5. Evaluate and visualize Grad-CAM\npython evaluate_and_gradcam.py --model\
  \ models/cnn.pt --data-dir data --out results/\n```\n\n\n---\n\n## Reproducibility Tips\n\n- Set seeds\
  \ at the top of notebooks: `random.seed(...)`, `np.random.seed(...)`, `torch.manual_seed(...)`.\n- Record\
  \ package versions (a cell in the notebook already prints versions). Consider saving `pip freeze > requirements-freeze.txt`.\n\
  - Save model checkpoints (use `torch.save(model.state_dict(), \"models/model.pt\")`) and sklearn pipelines\
  \ with `joblib.dump(pipeline, \"models/pipeline.joblib\")`.\n- If using GPU, note exact CUDA and cuDNN\
  \ versions in README or `requirements-freeze.txt`.\n\n---\n\n## Experiments & Results\n\n- The notebooks\
  \ contain robustness experiments that add Gaussian noise and change resolution to quantify performance\
  \ degradation for: CNN-only, radiomics-only, and fused models.\n- Metrics tracked: accuracy and macro\
  \ F1. Per-class metrics and confusion matrices are also computed in evaluation cells.\n- Visual outputs:\
  \ Grad-CAM overlays and comparative plots of accuracy vs noise/resolution.\n\n\n---\n\n## Grad-CAM Interpretability\
  \ \n\n- The notebook defines `generate_gradcam(model, image_tensor, target_class=None)` that:\n  - Hooks\
  \ the last convolutional block in MobileNetV2, captures activations and gradients, computes weights\
  \ via global pooling of gradients, forms CAM, applies ReLU and normalization, and returns a heatmap\
  \ numpy array.\n- Example visualization is included in the notebook: original image, heatmap, and overlay.\n\
  \n---\n\n\n## License\n\nThis project does not contain a license file by default. If you want to open-source\
  \ it, consider adding an `MIT` or `Apache-2.0` license. Add `LICENSE` to the repository root.\n\n---\n\
  \n## Contact\n\nAuthor: Areeb Ehsan\n"

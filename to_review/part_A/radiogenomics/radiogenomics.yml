readme_excerpt: "# A Real Dataset-Based Simulation Study on RadioGenomics for Histology Classification\n\
  \n Radiogenomics is an emerging field  that aims to improve clinical decision support by combining image\
  \ and genetic data. It is often challenging to collect both image and genetic data from the same patients.\
  \ This GitHub repo provides the codes for a simulation study aims to evaluate the performance of radiomics\
  \ and genomics features on classification the histology type (adenocarcinoma or squamous  cell carcinoma)\
  \ of non-small cell lung cancer dataset.\n\nIn addition, the repository includes a **RadioGenomics_RAG**\
  \ folder. This folder contains:\n- A chunked version of the manuscript used for retrieval augmented\
  \ generation\n- An OpenClaw agent setup guide\n- Example prompts and generated outputs (including reasoning-based\
  \ framework generation)\n- A SKILL.md file defining a reusable agent skill, which enables automated\
  \ extraction of the study structure, generation of a conceptual framework and methodological pipeline.\n\
  \nThis component illustrates how AI agents can be integrated into scientific workflows to enhance interpretability,\
  \ reproducibility, and automated knowledge extraction.\n"

readme_excerpt: "## ResNet34 + U-Net Segmentation model\n\n### Project Outline\n    - Task : dental CBCT\
  \ Multi-class Segmentation (32 channels)\n    - Logging : tensorboard (2.14.0 version)\n\n### Dataset\
  \ (*.nii)\n    - Preprocessing Methods\n        - RescaleSlope, RescaleInterupt\n    - Data Split\n\
  \        - Train:Validation:Test = 8:1:1\n    - Create DataFrame for reading Nii filepaths\n    - Image\
  \ dimension shape : (Batch, Channel, Height, Width)\n        - input(Batch, 1, 256, 256), mask(Batch,\
  \ 32, 256, 256)\n        - Masking : 0 or 1 (Binary masking)\n\n### Model Architecture\n    - ResNet34\
  \ + UNET\n    - ResNet34 + UNET PlusPlus\n    - ResNet34 + Attention + UNET\n\n### Train\n    - Dataset\n\
  \        - Train 2180,  Valid 273,  Test 273\n        - Image Preprocessing : Resize Image(256,256),\
  \ Min-Max scaling(Each image)\n    - Model Parameters\n        - Epochs: 50\n        - learning_rate:\
  \ 1e-3\n        - Optimizer: Adam\n        - Loss: BCE Loss\n        - Metric: IOU, F1-score\n    \n\

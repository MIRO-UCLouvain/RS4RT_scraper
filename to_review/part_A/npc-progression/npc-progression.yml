readme_excerpt: "# Deep-learning-based prediction model for time-to-failure of NPC\n\n> This repository\
  \ contains the source code for a manuscript that is presently under peer review.\n\n## \U0001F4CC Overview\n\
  \nIn this study, multi-modality data (i.e., CT, MRI, dose distributions, DVHs, and clinical variables)\
  \ was integrated to predict \nthe time-to-failure of NPC after radiation therapy. The proposed deep\
  \ learning model for NPC progression prediction comprises \nthree modules: feature extraction, feature\
  \ fusion, and prediction. Feature extraction contains five \nencoders to respectively map multi-modality\
  \ data (CT, dose map, MRI, DVH-clinical parameters) into a shared feature space. \nThe image encoders\
  \ for CT, dose, and MRI share a same CNN architecture with three 3D convolutional layers, followed by\
  \ 3D \nbatch normalization and GELU activation, progressively reducing spatial dimensions while increasing\
  \ \nchannels. The vector encoders for DVH and clinical parameters consist of one hidden layer, using\
  \ linear \ntransformation, ReLU, and dropout; the DVH matrix is fed column-wise. In the fusion module,\
  \ all \nfeatures are then reshaped and fused via  max-pooling operations  along the channel dimension\
  \ emphasizes the most relevant \nfeatures. The prediction module employs 8 Transformer blocks and \n\
  a Multi-Layer Perceptron (MLP) block. Each Transformer block has multi-head self-attention and feed-forward\
  \ networks, incorporating \npositional encodings to capture global contextual dependencies. In this\
  \ work, we model the survival function for each patient with \nmixture of Weibull distributions. This\
  \ formulation yields an analytic cumulative distribution function, which allows us to employ \ngradient\
  \ based optimization. Therefore, the Transformer outputs are fed into the MLP block to derive the parameters\
  \ of the mixture \nof Weibull distributions, and the final NPC prediction of time to failure is subsequently\
  \ obtained via the mixture of Weibull \ndistributions with these learned parameters. \n\n## \U0001F680\
  \ Requirements\n\n- Python 3.12\n- PyTorch 2.5.0\n- CUDA 12+\n- Numpy 1.26+\n- H5py 3.11.0\n\n## \U0001F4C1\
  \ Project Structure\n\n```\n.\n├── README.md                       # Project documentation\n├── .gitignore\
  \                      # Git ignore rules\n├── dataset/                        # Training, Validation,\
  \ and Testing Datasets (not open access)\n│   ├── Training\n│   │   ├── Training_NPC_label_data.h5\n\
  │   │   ├── Training_3DCT_data.h5\n│   │   ├── Training_dose_data.h5\n│   │   ├── Training_3DMRI_data.h5\n\
  │   │   ├── Training_DVH_data.h5\n│   │   └── Training_Aux_data.h5\n│   │   \n│   ├── Valid\n│   │ \
  \  ├── Valid_NPC_label_data.h5\n│   │   ├── Valid_3DCT_data.h5\n│   │   ├── Valid_dose_data.h5\n│  \
  \ │   ├── Valid_3DMRI_data.h5\n│   │   ├── Valid_DVH_data.h5\n│   │   └── Valid_Aux_data.h5\n│   │ \
  \  \n│   └── Testing\n│       ├── Testing_NPC_label_data.h5\n│       ├── Testing_3DCT_data.h5\n│   \
  \    ├── Testing_dose_data.h5\n│       ├── Testing_3DMRI_data.h5\n│       ├── Testing_DVH_data.h5\n\
  │       └── Testing_Aux_data.h5\n│   \n├── datasets.py                     # Loaders of Training, Validation,\
  \ and Testing Datasets\n├── models.py                       # Model definitions\n├── utils.py      \
  \                  # Utility functions\n├── train_net.py                    # Training and validation\
  \ script\n├── test_net.py                     # Testing script\n├── base_train_valid_test.py       \
  \ # Base funtions of  Training, validation, and testing script\n├── parameters_setting.py          \
  \ # Configuration script\n└── prepare_dataset.py              # Data processing script \n\n```\n\n##\
  \ \U0001F527 Quick Start\n\n### Data Preparation\nSpatial alignment was performed across CT, MRI, and\
  \ dose maps. Regions of interest (ROIs) were then extracted from these \nco-registered images using\
  \ binary masks generated by 3-mm isotropic expansions of the PTVs (i.e., PTVnx and PTVnd-R/L). \nMoreover,\
  \ all multi-modality ROIs were resampled to a uniform size of 128×128×64 (depth × height × width) voxels.\
  \ The \nclinical parameters include: age, sex, T-stage, N-stage, pathology, treatment mode, BMI, EBV-DNA,\
  \ HGB, and LDH. The input \ndata were preprocessed as follows: CT intensities were constrained to [-200,\
  \ 200] HU, MRI images (after bias field \ncorrection) were clipped to [100, 2000], and dose maps and\
  \ DVH were limited to [0, 8000] cGy, with all modalities \nsubsequently normalized to [0, 1]. All clinical\
  \ variables were numerically encoded and normalized to [0,1]: sex \n(1 = male, 2 = female) by /2; pathology\
  \ (1 = differentiated keratin, 2 = non-keratin, 3 = undifferentiated) by /3; BMI \ncategories (0 < 18,\
  \ 1 = 18-24, 2 > 24) by /2; and T-stage by /2. Continuous variables HGB and LDH were binarized (0 =\
  \ \nHGB < 120 g/L or LDH < 245 U/L, 1 = HGB ≥ 120 g/L or LDH ≥ 245 U/L). Other variables remained unchanged.\
  \ The related data \nshould be saved as .mat type.\n\n### Training\n\n```bash\npython train_net.py\n\
  ```\n\n### Testing / Evaluation\n\n```bash\npython test_net.py\n```\n\n[//]: # (## \U0001F4CA Results)\n\
  \n[//]: # ()\n[//]: # (| Model     | Dataset  | Accuracy | Notes                  |)\n\n[//]: # (|-----------|----------|----------|------------------------|)\n\
  \n[//]: # (| Ours  | Internal Dataset |    | trained for 200 epochs |)\n[//]: # (| Ours  | External\
  \ Dataset |    | trained for 200 epochs |)\n\n## \U0001F4DD Changelog\n\n- v1.0.0 (2026-07-02): Initial\
  \ release with basic training and testing pipeline.\n\n\n## \U0001F64F Acknowledgments / References\n\
  \n- [PyTorch Documentation](https://pytorch.org/)\n- Unpublished paper"

readme_excerpt: "# 放射線治療患者向けアプリ\n\nReact Native + Expo を使用した放射線治療を受ける患者向けのスマートフォンアプリです。\n\n## 機能\n\n###\
  \ 1. \U0001F4C5 予約時間の表示\n- 治療時間の設定・表示\n- ホーム画面での大きな表示\n\n### 2. \U0001F4DA 治療部位ごとの情報提供\n- 8つの部位カテゴリ（頭、頭頸部、肺、乳房、腹部、骨盤、前立腺、その他）\n\
  - Markdown形式の詳細説明\n- YouTube動画リンク\n\n### 3. \U0001F4DD 副作用報告\n- 自由記入フォーム\n- Firebase Firestoreへの保存\n\
  - 電話番号による患者識別\n\n### 4. \U0001F4C5 治療カレンダー\n- スタンプ機能付きカレンダー\n- 治療完了記録\n- 残り治療回数の表示\n\n### 5. \U0001F916\
  \ AI質問機能\n- GPT-4o-miniとの連携\n- 放射線治療に関する質問応答\n- 質問履歴の保存\n\n### 6. ⚙️ 設定\n- フォントサイズ調整\n- 高齢者に配慮したUI\n\
  \n## セットアップ\n\n### 1. 依存関係のインストール\n```bash\nnpm install\n```\n\n### 2. 環境変数の設定\n`.env` ファイルに以下の設定を記述してください：\n\
  \n```env\n# Firebase Config\nFIREBASE_API_KEY=your_firebase_api_key_here\nFIREBASE_AUTH_DOMAIN=your_project_id.firebaseapp.com\n\
  FIREBASE_PROJECT_ID=your_project_id\nFIREBASE_STORAGE_BUCKET=your_project_id.appspot.com\nFIREBASE_MESSAGING_SENDER_ID=your_sender_id\n\
  FIREBASE_APP_ID=your_app_id\n\n# OpenAI API\nOPENAI_API_KEY=your_openai_api_key_here\n```\n\n### 3.\
  \ Firebase の設定\n1. Firebase Console でプロジェクトを作成\n2. Firestore Database を有効化\n3. 認証を設定（電話番号認証）\n4. Web\
  \ アプリとして追加し、設定情報を取得\n\n### 4. OpenAI API の設定\n1. OpenAI のアカウントを作成\n2. API キーを取得\n3. .env ファイルに設定\n\n\
  ## 実行\n\n### 開発モード\n```bash\nnpx expo start\n```\n\n### iOS\n```bash\nnpx expo start --ios\n```\n\n\
  ### Android\n```bash\nnpx expo start --android\n```\n\n## 技術スタック\n\n- **Framework**: React Native +\
  \ Expo\n- **UI Library**: React Native Paper\n- **Navigation**: React Navigation\n- **Database**: Firebase\
  \ Firestore\n- **Storage**: AsyncStorage\n- **AI**: OpenAI GPT-4o-mini\n- **Calendar**: react-native-calendar-picker\n\
  - **Markdown**: react-native-markdown-display\n\n## ファイル構成\n\n```\nsrc/\n├── components/          #\
  \ 再利用可能なコンポーネント\n├── screens/            # 画面コンポーネント\n│   ├── AuthScreen.js   # 認証画面\n│   ├── HomeScreen.js\
  \   # ホーム画面\n│   ├── TreatmentAreasScreen.js  # 治療部位情報\n│   ├── SideEffectScreen.js      # 副作用報告\n│\
  \   ├── CalendarScreen.js        # 治療カレンダー\n│   └── AIQuestionScreen.js      # AI質問\n├── config/\n│\
  \   └── firebase.js     # Firebase設定\n├── data/\n│   └── treatmentAreas.js  # 治療部位データ\n└── utils/\n\
  \    └── FontSizeContext.js # フォントサイズコンテキスト\n```\n\n## 注意事項\n\n- このアプリは医療機器ではありません\n- 緊急の症状がある場合は直接医療機関にご相談ください\n\
  - AIの回答は参考情報として使用してください\n\n## ライセンス\n\nこのプロジェクトはMITライセンスの下で公開されています。"

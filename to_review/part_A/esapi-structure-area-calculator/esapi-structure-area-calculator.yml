readme_excerpt: '# ESAPI Structure Area Calculator


  Author: Dennis Ahorlu


  ## Overview

  This ESAPI script calculates the axial cross-sectional area of selected structures in Eclipse TPS.


  Supported structures include:

  - PTV

  - GTV

  - CTV

  - Body

  - Lung_L

  - Lung_R

  - Any contoured structure


  ## Features

  - Slice-by-slice area calculation

  - Maximum cross-sectional area detection

  - CSV export

  - Approximate volume estimation

  - User-friendly structure selection window


  ## Output

  The script reports:

  - Maximum area (cm²)

  - Slice index

  - Z-position

  - Estimated volume

  - Eclipse structure volume


  ## Requirements

  - Varian Eclipse TPS

  - ESAPI access enabled

  - .NET Framework compatible with Eclipse version


  ## Notes

  This script calculates axial cross-sectional area per CT slice, not full 3D surface area.


  ## License

  MIT License


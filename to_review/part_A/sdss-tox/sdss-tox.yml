readme_excerpt: "# SDSS-Tox\n\nA deep learning framework for molecular toxicity prediction using SMILES\
  \ strings and graph neural networks.\n\n## Quick Start\n\n### Prerequisites\n- Python 3.8+\n- CUDA-compatible\
  \ GPU (recommended)\n\n### Installation\n\n1. Clone the repository:\n```bash\ngit clone https://github.com/thkim-01/SDSS-Tox.git\n\
  cd SDSS-Tox\n```\n\n2. Install dependencies:\n```bash\npip install -r requirements.txt\n```\n\n### Usage\n\
  \n#### Training\n```bash\npython train.py --dataset tox21 --model gcn --epochs 100\n```\n\n#### Prediction\n\
  ```bash\npython predict.py --model_path checkpoints/best_model.pt --smiles \"CC(C)Cc1ccc(cc1)C(C)C(O)=O\"\
  \n```\n\n#### Available Options\n- `--dataset`: Dataset name (tox21, clintox, sider)\n- `--model`: Model\
  \ architecture (gcn, gat, graphsage)\n- `--epochs`: Number of training epochs\n- `--batch_size`: Batch\
  \ size for training\n- `--lr`: Learning rate\n\n## Project Structure\n\n```\nSDSS-Tox/\n├── data/  \
  \            # Dataset files\n├── models/            # Model architectures\n├── utils/             #\
  \ Utility functions\n├── train.py           # Training script\n├── predict.py         # Prediction script\n\
  └── requirements.txt   # Dependencies\n```\n\n## Results\n\n| Dataset | Model | AUC-ROC | Accuracy |\n\
  |---------|-------|---------|----------|\n| Tox21   | GCN   | 0.85    | 0.82     |\n| ClinTox | GAT\
  \   | 0.88    | 0.84     |\n\n## Citation\n\nIf you use this code, please cite:\n```bibtex\n@article{your_paper,\n\
  \  title={SDSS-Tox: Deep Learning for Toxicity Prediction},\n  author={Your Name},\n  year={2024}\n\
  }\n```\n\n## License\n\nMIT License"

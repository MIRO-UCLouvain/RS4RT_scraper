readme_excerpt: "# Automated Registration (AREG)\n\nAutomated Registration (AREG) is an extension for\
  \ **3D Slicer** to perform automatic registration either on IOS or CBCT files.\n\n## AREG Modules\n\n\
  AREG module provide a convenient user interface allowing to orient different type of scans:\n- **CBCT**\
  \ scan\n- **IOS** scan\n\n## How does the module works?\n\n### 3 Modes Available\n- **Orientation and\
  \ Registration** (to perform the entirety of the workflow automatically: Automatic Orientation, Registration,\
  \ and Segmentation)\n- **Fully-Automated** (to perform the Automatic Mask Generation, Registration and\
  \ Segmentation)\n- **Semi-Automated** (to perform the Automatic Registration and Segmentation)\n\n|\
  \ Mode | Input |\n| ----------- | ----------- |\n| Orientation and Registration | Scans|\n| Fully-Automated\
  \ | Oriented Scans |\n| Semi-Automated | Oriented Scans, Masks Segmentation Files |\n\n\n### Input file:\n\
  \n| Input Type  | Input Extension Type |\n| ----------- | ----------- |\n| **CBCT** | .nii, .nii.gz,\
  \ .gipl.gz, .nrrd, .nrrd.gz  |\n| **IOS** | .vtk |\n\n**<ins>Test Files Available:**\nYou can either\
  \ download them using the link or by using the `Test Files` button.\n| Module Selected  | Download Link\
  \ to Test Files | Information |\n| ----------- | ----------- | ----------- |\n| **Semi-CBCT** | [Test\
  \ Files](https://github.com/lucanchling/ASO_CBCT/releases/download/TestFiles/Occlusal_Midsagittal_Test.zip)\
  \ | Scan and Fiducial List for this [Reference](https://github.com/lucanchling/ASO_CBCT/releases/download/v01_goldmodels/Occlusal_Midsagittal_Plane.zip)|\n\
  | **Fully-CBCT** | [Test File](https://github.com/lucanchling/ASO_CBCT/releases/download/TestFiles/Test_File.nii.gz)\
  \ | Only Scan|\n| **Semi-IOS** | [Test Files](https://github.com/HUTIN1/ASO/releases/download/v1.0.2/input_test.zip)\
  \ | Mesh and Fiducial List [Reference](https://github.com/HUTIN1/ASO/releases/download/v1.0.0/Gold_file.zip)\
  \ |\n| **Fully-IOS** | [Test Files](https://github.com/HUTIN1/ASO/releases/download/v1.0.2/input_test.zip)|\
  \ Only Mesh [Reference](https://github.com/HUTIN1/ASO/releases/download/v1.0.0/Gold_file.zip) |\n\n\
  ### Models Selection\n\nFor the **Fully-Automated** Mode, models are required as input, use the `Download\
  \ Models` Button or follow the following instructions:\n  \n#### For CBCT ([Details](https://github.com/lucanchling/ASO#aso-cbct)):\n\
  A *Pre-Orientation* and *ALI_CBCT* models are needed\n  \n\n#### For IOS:\n\n### Outputs Options\n\n\
  ### Let's Run it\n\n\n## Algorithm\nThe implementation is based on iterative closest point's algorithm\
  \ to execute a landmark-based registration. Some preprocessing steps are done to make the orientation\
  \ works better (and are described respectively in **CBCT** and **IOS** part)\n\n### ASO CBCT\n**Fully-Automated\
  \ mode:** \n1. a deep learning model is used to predict head orientation and correct it.\nModels are\
  \ available for download ([Pre ASO CBCT Models](https://github.com/lucanchling/ASO_CBCT/releases/tag/v01_preASOmodels))\n\
  \n1. a Landmark Identification Algorithm ([ALI CBCT](https://github.com/DCBIA-OrthoLab/ALI_CBCT)) is\
  \ used to determine user-selected landmarks\n\n1. an ICP transform is used to match both of the reference\
  \ and the input file\n\nFor the **Semi-Automated** mode, only step **3** is used to match input landmarks\
  \ with reference's ones.\n\n### ASO IOS\n\n  **Semi-Automated mode:**\n - an ICP transfrom is used to\
  \ macth both of the reference and the input file by using the landmark\n  \n  **Fully-Automated mode:**\n\

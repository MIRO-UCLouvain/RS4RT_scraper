readme_excerpt: "# 3D Tumor Segmentation + Uncertainty-Aware Diagnosis with Explainability\n\nInput: a\
  \ multi-modal 3D MRI brain scan (T1, T1ce, T2, FLAIR). Output:\n\n1. a voxel-level 3D segmentation of\
  \ the tumor and its subregions,\n2. a malignancy/subtype classification with a **calibrated confidence\
  \ interval** — not\n   just a softmax number, but genuine uncertainty quantification, and\n3. a **Grad-CAM\
  \ heatmap** showing which regions of the scan drove the classification.\n\nMost portfolio medical-imaging\
  \ projects stop at \"trained a U-Net, got a Dice score.\"\nThis one adds the two things that actually\
  \ matter for a model a radiologist could\naudit: it knows *when* it doesn't know (uncertainty quantification),\
  \ and it can show\nits work (explainability).\n\nTrained/evaluated on **[BraTS](http://braintumorsegmentation.org/)**\
  \ (Brain Tumor\nSegmentation Challenge) — see [scripts/download_data.md](scripts/download_data.md)\n\
  for how to get the data.\n\n> **Status:** the full pipeline (model, losses, training, sliding-window\
  \ inference,\n> uncertainty, Grad-CAM, report generation) is implemented, unit-tested on synthetic\n\
  > data (20 passing tests in [tests/](tests/)), and **verified end-to-end against real\n> BraTS2020 data**\
  \ (369 cases) — real volumes load correctly, a training step reduces\n> loss, and sliding-window inference\
  \ + Dice metrics run on a real held-out scan. What\n> hasn't happened yet is a full-scale training run\
  \ to convergence (this dev machine is\n> CPU-only; see [Results](#results)) — the images below are from\
  \ the report pipeline\n> running on synthetic input and randomly-initialized weights, purely to show\
  \ the\n> *output format* ahead of real numbers.\n\n## Sample report output (illustrative — untrained\
  \ weights, synthetic data)\n\n![Sample report: input scan, segmentation overlay, uncertainty heatmap,\
  \ and Grad-CAM explanation](assets/sample_report.png)\n\nGenerated by `src/report.py` — left to right:\
  \ input modality, segmentation overlay\nwith per-region tumor volume in cm³, voxel-level epistemic uncertainty\
  \ (Monte Carlo\nDropout), and the Grad-CAM explanation for the predicted class with its confidence\n\
  interval. Regenerate this exact figure (on synthetic data, no BraTS download needed)\nwith:\n\n```bash\n\
  python scripts/generate_preview_assets.py\n```\n\n## Calibration check (illustrative example)\n\n<img\
  \ src=\"assets/reliability_diagram_example.png\" alt=\"Reliability diagram comparing stated confidence\
  \ to empirical accuracy\" width=\"420\">\n\nThere's no ground-truth \"uncertainty\" to check predictions\
  \ against directly, so the\nstandard proxy is calibration: does the model's stated 80% confidence actually\n\
  correspond to being right 80% of the time? The example above (synthetic, deliberately\noverconfident\
  \ data) shows what a *miscalibrated* model looks like — bars below the\ndiagonal mean the model is more\
  \ confident than it should be. `src/metrics.py` produces\nthis plot plus Expected Calibration Error\
  \ (ECE) from real predictions once trained.\n\n## Architecture\n\n```mermaid\nflowchart TD\n    A[\"\
  Multi-modal 3D MRI\\nT1 / T1ce / T2 / FLAIR (4 channels)\"] --> B[\"Preprocessing\\nnormalize · resample\
  \ · patch extraction\"]\n    B --> C[\"3D U-Net (from scratch)\\nencoder-decoder + skip connections\"\
  ]\n    C -->|per-voxel logits| D[\"Full-volume reconstruction\\nsliding-window + Gaussian-weighted stitching\"\
  ]\n    C -->|bottleneck features| E[\"Classification head\\nbranches off the encoder\"]\n    D --> F[\"\
  Segmentation map\\nbackground / necrotic core / edema / enhancing tumor\"]\n    E --> G[\"Uncertainty\
  \ quantification\\nMC Dropout or Deep Ensembles\"]\n    C --> G\n    G --> H[\"Calibrated confidence\
  \ interval\\ne.g. 87% ± 6%\"]\n    E --> I[\"3D Grad-CAM\"]\n    I --> J[\"Explanation heatmap\\noverlaid\
  \ on scan\"]\n    F --> K[\"Clinical-style report\\nvolume (cm3) + confidence + uncertainty map + Grad-CAM\"\
  ]\n    H --> K\n    J --> K\n```\n\n## Project layout\n\n```\nconfig.yaml                  all hyperparameters\
  \ in one place\nrequirements.txt\n\nsrc/\n  data/dataset.py            BraTS case discovery + MONAI\
  \ transforms (nifti and h5_slices formats)\n  models/unet3d.py           3D U-Net, implemented from\
  \ scratch\n  models/classifier.py       classification head branching off the U-Net bottleneck\n  losses.py\
  \                  Dice + cross-entropy combo loss, class weighting\n  inference.py                sliding-window\
  \ full-volume inference, Gaussian-weighted stitching\n  uncertainty.py              Monte Carlo Dropout\
  \ + Deep Ensemble aggregation\n  gradcam3d.py                 3D Grad-CAM\n  metrics.py            \
  \      per-subregion Dice, calibration / reliability diagram\n  report.py                    combined\
  \ report generator (seg + confidence + uncertainty + Grad-CAM)\n  utils.py                     seeding,\
  \ checkpointing, mask-overlay visualization\n\nscripts/\n  download_data.md            how to get BraTS\
  \ data (3 routes, see below)\n  train_segmentation.py       train the 3D U-Net\n  train_classifier.py\
  \         train the classification head on a pretrained encoder\n  evaluate.py                 full-volume\
  \ Dice evaluation on the held-out split\n  generate_report.py          run one case through the full\
  \ pipeline, save the report figure\n  generate_preview_assets.py  regenerate this README's illustrative\
  \ images (no data needed)\n\ntests/                         synthetic-tensor sanity tests (no BraTS\
  \ data required)\nconfig.yaml                    full-scale config (h5_slices format by default)\nconfig_cpu_smoketest.yaml\
  \      small/fast config for verifying the pipeline on a CPU-only machine\nassets/                 \
  \       README images\n```\n\n## Setup\n\n```bash\ngit clone https://github.com/manahillllll/medical-cv-tumor-segmentation.git\n\
  cd medical-cv-tumor-segmentation\npython -m venv .venv\nsource .venv/bin/activate        # Windows:\
  \ .venv\\Scripts\\activate\npip install -r requirements.txt\n```\n\n## Quick check it works (no data\
  \ needed, ~10 seconds)\n\n```bash\npytest tests/ -v\n```\n\nThis runs the full model/loss/sliding-window-inference/uncertainty/Grad-CAM/data-pipeline\n\
  stack on synthetic tensors (including a synthetic `.h5` case) and confirms every shape\nand gradient\
  \ path is correct before you spend time on real training.\n\n## Getting the data\n\nSee [scripts/download_data.md](scripts/download_data.md)\
  \ for the full walkthrough —\nthree routes depending on what you need (fastest download vs. classification\
  \ labels).\nThis repo's `config.yaml` defaults to `data.format: \"h5_slices\"`, matching the\n[Kaggle\
  \ \"BraTS2020 Training Data\"](https://www.kaggle.com/datasets/awsaf49/brats20-dataset-training-validation)\n\
  repackaging (one `.h5` file per 2D slice rather than one NIfTI volume per modality);\n`format: \"nifti\"\
  ` is also supported for the official BraTS release or MONAI's\nauto-downloadable Decathlon mirror.\n\
  \n**Data license note:** the official BraTS releases distributed via Synapse (e.g. the\nBraTS 2023 Challenge\
  \ data, Synapse project `syn51156910`) are **CC-BY-NC 4.0 —\nnon-commercial use only**, and require\
  \ the following attribution in any resulting\npublication/writeup:\n\n> Data used in this publication\
  \ were obtained as part of the Brain Tumor Segmentation\n> (BraTS) Challenge project through Synapse\
  \ ID: syn51156910.\n\n...plus citations to the BraTS flagship and challenge-specific manuscripts (listed\
  \ on\nSynapse's Data Access/Downloads page) if you refer to the dataset in research output.\nSee [scripts/download_data.md](scripts/download_data.md)\
  \ for details and the\nKaggle-repackaged data's own separate terms.\n\nNo GPU yet? `config_cpu_smoketest.yaml`\
  \ runs the identical pipeline at a much smaller\nscale so you can confirm real data loads and trains\
  \ correctly in a couple of minutes\non a CPU-only machine:\n```bash\npython scripts/train_segmentation.py\
  \ --config config_cpu_smoketest.yaml\n```\n\n## Running the full pipeline\n\n1. **Segmentation sanity\
  \ check** (confirm the model can overfit a single batch\n   before committing to a full run — set `train_segmentation.overfit_single_batch:\
  \ true`\n   in `config.yaml`, then run the command below; flip it back to `false` afterward):\n   ```bash\n\
  \   python scripts/train_segmentation.py --config config.yaml\n   ```\n2. **Full segmentation training**\
  \ (checkpoints land in `checkpoints/segmentation/`):\n   ```bash\n   python scripts/train_segmentation.py\
  \ --config config.yaml\n   ```\n3. **Evaluate segmentation** — per-subregion Dice (Whole Tumor / Tumor\
  \ Core /\n   Enhancing Tumor, the standard BraTS reporting regions):\n   ```bash\n   python scripts/evaluate.py\
  \ --checkpoint checkpoints/segmentation/best.pt\n   ```\n4. **Train the classifier** on top of the pretrained\
  \ encoder (needs a labels CSV —\n   the `h5_slices` download doesn't ship grade/subtype labels itself,\
  \ see\n   `download_data.md` Option C):\n   ```bash\n   python scripts/train_classifier.py --labels_csv\
  \ data/labels.csv\n   ```\n5. **Generate a full report** for one case (segmentation overlay, classification\
  \ +\n   confidence interval, uncertainty heatmap, Grad-CAM):\n   ```bash\n   python scripts/generate_report.py\
  \ \\\n     --seg_checkpoint checkpoints/segmentation/best.pt \\\n     --cls_checkpoint checkpoints/classifier/best.pt\
  \ \\\n     --case_id volume_100 \\\n     --class_names LGG HGG\n   ```\n\nAll hyperparameters (patch\
  \ size, batch size, learning rate, dropout, MC-sample count,\ndata format/path, etc.) live in `config.yaml`\
  \ — edit that rather than script flags.\n\n## Why uncertainty and explainability matter here\n\nA confident-but-wrong\
  \ model is more dangerous in a clinical setting than a model that\nknows it's unsure — a radiologist\
  \ reviewing model output needs to know *which* cases\nto double-check, not just what the model's best\
  \ guess was. `src/uncertainty.py`\nimplements both options: Monte Carlo Dropout (cheap — run inference\
  \ N times with\ndropout active, use the variance across runs) and Deep Ensembles (more robust — train\n\
  3-5 independently-initialized models, use their disagreement).\n\nExplainability (`src/gradcam3d.py`)\
  \ answers a different question: *why* did the model\nmake this call. The sanity check is qualitative\
  \ — on cases where you already know the\ntumor location, does the heatmap actually land on the tumor,\
  \ or is it looking at the\nskull or background? If the latter, something upstream is wrong.\n\n## Results\n\
  \nPipeline correctness has been verified against real BraTS2020 data (369 cases,\n`format: \"h5_slices\"\
  `): volumes load and reconstruct to the correct shape, a training\nstep on a real patch reduces loss\
  \ over 30 iterations without error, and sliding-window\ninference + Gaussian stitching + Dice scoring\
  \ run end-to-end on a real held-out scan.\nThat's a pipeline check, not a trained model — the Dice scores\
  \ from that run are near\nzero, as expected from ~30 gradient steps on a toy-sized network on a CPU.\n\
  \n_Still to fill in after a real training run (needs a GPU — this dev box is CPU-only):\nper-subregion\
  \ Dice (WT/TC/ET) vs. published BraTS baselines, a real reliability diagram\n+ ECE, and example report\
  \ outputs on real scans (replacing the synthetic-data\nillustrations above)._\n\n## Implemented from\
  \ scratch vs. off-the-shelf\n\n**From scratch:** the 3D U-Net architecture, the Dice+CE combo loss with\
  \ class\nweighting, patch-based training + sliding-window inference with Gaussian-weighted\nstitching,\
  \ MC Dropout / ensemble uncertainty aggregation, 3D Grad-CAM, and the\nreport-generation pipeline.\n\
  \n**Off-the-shelf:** MONAI's data loading/augmentation transforms (resampling,\nintensity normalization,\
  \ positive/negative patch sampling), nibabel/SimpleITK for\nNIfTI I/O — this plumbing is well-solved\
  \ and not the interesting part to reimplement.\n\n## The hard parts (and how this repo handles them)\n\
  \n- **GPU memory** — 3D convs on full volumes don't fit; training runs on\n  `data.patch_size` patches\
  \ (default 128³), tune this and `train_segmentation.batch_size`\n  to your GPU.\n- **Class imbalance**\
  \ — background is >95% of voxels; `src/losses.py::compute_class_weights`\n  gives inverse-frequency\
  \ weights fed into both the Dice and cross-entropy terms, and\n  `RandCropByPosNegLabeld` oversamples\
  \ tumor-containing patches during training.\n- **Patch stitching seams** — `src/inference.py` blends\
  \ overlappin"

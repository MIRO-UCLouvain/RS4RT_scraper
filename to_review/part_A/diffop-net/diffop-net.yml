readme_excerpt: "# DiffOp-net\nDiffOp-net: A Differential Operator-based Fully Convolutional Network for\
  \ Unsupervised Deformable Image Registration\n\n\n## Environment\n\n```bash\n# Clone the repository\n\
  git clone https://github.com/wujiong-hub/DiffOp-net.git\n\n# Create and activate a new conda environment\n\
  conda create -n diffopnet python=3.8\nconda activate diffopnet\n\n# Install PyTorch (please modify according\
  \ to your server's CUDA version)\npip install torch==1.12.1+cu116 torchvision==0.13.1+cu116 torchaudio==0.12.1\
  \ --extra-index-url https://download.pytorch.org/whl/cu116\n\n# build lddmm related functions\ncd ./Modules/PytorchLDDMM\n\
  python setup.py install \n```\n\n\n## Training\n```python\nmkdir logs\npython networkTraining.py Config_adni.ini\
  \ 48 0\n```\n## Testing\n```python\npython networkRegistration.py FCN_registration_adni.ini 48 ./logs/path_to_checkpoint\n\
  ```\n\n\n\n\n"

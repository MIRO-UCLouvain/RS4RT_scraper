readme_excerpt: "# DECT Breast Project\n\nThis repository contains the code developed for a master thesis\
  \ project on  \n**dual-energy CT (DECT) breast imaging**, with a focus on simulation-based\nmaterial\
  \ decomposition and quantitative image evaluation.\n\nThe project implements a full research pipeline,\
  \ from breast DICOM data to\nsimulated DECT images, material decomposition, and quantitative analysis.\n\
  The code is intended for academic and research use.\n\n---\n\n## Project overview\n\nThe main goals\
  \ of this project are to:\n\n- Convert breast DICOM data into XCIST-compatible voxelized phantoms\n\
  - Simulate dual-energy CT acquisitions using XCIST\n- Reconstruct images using FDK\n- Perform material\
  \ decomposition into breast-relevant materials\n- Quantitatively evaluate reconstruction and decomposition\
  \ quality\n\nThe project is simulation-driven and is designed to support methodological\nevaluation\
  \ rather than clinical deployment.\n\n---\n\n## Repository structure\n\nDECT_Breast_Project/\n├── README.md\n\
  ├── scripts/\n│ ├── dicom_to_phantom_allz.py\n│ ├── sim_run_all.py\n│ ├── sim_slim_run_all.py\n│ ├──\
  \ sim.py\n│ ├── xcist_fdk_from_prep.py\n│ ├── image_matdecomp_3mat_from_fdk.py\n│ ├── mat_decomp_Iter.py\n\
  │ └── run_eval_mmdstyle2.py\n└── docs/ \n\n\nAll executable scripts are located in the `scripts/` directory.\
  \  \nDocumentation and extended instructions are located in `docs/`.\n\n---\n\n## Pipeline summary\n\
  \nThe processing pipeline consists of the following main stages:\n\n1. **DICOM to phantom conversion**\
  \  \n   A 3D breast DICOM volume is converted into slice-wise 2D voxelized phantoms\n   compatible with\
  \ XCIST.\n\n2. **DECT simulation**  \n   Dual-energy CT simulations (e.g. low- and high-energy spectra)\
  \ are performed\n   using XCIST.\n\n3. **Image reconstruction**  \n   Simulated projection data are\
  \ reconstructed into image volumes using\n   filtered backprojection (FDK).\n\n4. **Material decomposition**\
  \  \n   Reconstructed images are decomposed into material-specific components\n   (e.g. adipose, glandular\
  \ tissue, skin, calcification-related material).\n\n5. **Quantitative evaluation**  \n   Reconstruction\
  \ and material decomposition results are evaluated using\n   quantitative metrics such as RMSE, CNR,\
  \ and SSIM.\n\nEach stage is implemented as one or more standalone scripts.\n\n---\n\n## Script overview\n\
  \n### `dicom_to_phantom_allz.py`\nConverts a breast DICOM series into slice-wise 2D XCIST voxelized\
  \ phantoms.\n\nMain functionality:\n- Loads and sorts a DICOM series\n- Builds a 3D breast mask (air\
  \ removed)\n- Generates material fraction maps\n- Adds spatially consistent synthetic calcifications\n\
  - Saves XCIST-compatible `.bin` and `.json` phantom files\n- Generates PNG visualizations for verification\n\
  \n---\n\n### `sim_run_all.py`\nRuns full dual-energy XCIST simulations for all phantom slices.\n\nTypically\
  \ used for final, full-resolution simulations.\n\n---\n\n### `sim_slim_run_all.py`\nA lightweight version\
  \ of `sim_run_all.py`.\n\nUsed for faster testing, debugging, and parameter tuning.\n\n---\n\n### `sim.py`\n\
  Contains lower-level simulation configuration and shared utilities\nused by the simulation run scripts.\n\
  \n---\n\n### `xcist_fdk_from_prep.py`\nPerforms FDK reconstruction from XCIST `.prep` files.\n\nProduces\
  \ reconstructed image volumes used for subsequent material\ndecomposition.\n\n---\n\n### `image_matdecomp_3mat_from_fdk.py`\n\
  Performs three-material decomposition on reconstructed FDK volumes.\n\nUsed as a baseline or reference\
  \ material decomposition method.\n\n---\n\n### `mat_decomp_Iter.py`\nImplements iterative material decomposition.\n\
  \nUsed to refine material separation and compare iterative and\nnon-iterative approaches.\n\n---\n\n\
  ### `run_eval_mmdstyle2.py`\nPerforms quantitative evaluation of reconstruction and material\ndecomposition\
  \ results.\n\nMetrics include:\n- Root mean square error (RMSE)\n- Contrast-to-noise ratio (CNR)\n-\
  \ Structural similarity index (SSIM)\n\n---\n\n## Dependencies\n\nTypical dependencies include:\n- Python\
  \ 3.9+\n- numpy\n- scipy\n- matplotlib\n- pydicom\n- XCIST (GE CatSim)\n\nSome scripts require a local\
  \ XCIST installation and compatible\nconfiguration files.\n\n---\n\n## Data and privacy\n\n- DICOM data\
  \ and generated phantom volumes are **not included** in this repository.\n- Large binary files (`.dcm`,\
  \ `.bin`, `.npy`) are intentionally excluded.\n- Paths to local data directories are configured inside\
  \ the scripts.\n\n---\n\n## Usage documentation\n\nDetailed, step-by-step instructions on how to run\
  \ each script and the\ncomplete pipeline are provided in a separate document in the `docs/`\ndirectory.\n\
  \n---\n\n## Author\n\nMaster thesis project  \nAuthor: **Daniela Wallis Cullblom**\n\n---\n\n## License\n\
  \nThis repository is intended for academic and research use.\n"

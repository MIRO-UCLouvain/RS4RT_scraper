readme_excerpt: " Brain Tumor Segmentation using U-Net, ResNet34 & ResNet50\n\n \U0001F4C4 Published on\
  \ IEEE Xplore: [View Research Paper](https://ieeexplore.ieee.org/document/11233704)\n\nThis project\
  \ focuses on medical image segmentation for brain tumors using deep learning. We compare the performance\
  \ of three architectures:\n- A standalone **U-Net**,\n- **U-Net with ResNet34** as the encoder backbone,\n\
  - **U-Net with ResNet50** as the encoder backbone.\n\n\U0001F9EA The goal is to identify and segment\
  \ tumor regions from MRI images.\n\n---\n\n## Related Project\n\n# You can find my standalone U-Net\
  \ implementation here:  \n\U0001F517 [U-Net Implementation Repo](https://github.com/ARYAN9835/U-Net_implementation)\n\
  \n---\n\n## Models Compared\n\n| Model                | Encoder      | Description                 \
  \                     |\n|---------------------|--------------|--------------------------------------------------|\n\
  | U-Net (Baseline)     | Custom CNN   | Classical architecture with symmetrical encoder-decoder |\n\
  | U-Net + ResNet34     | ResNet34     | Pretrained ResNet34 used as encoder backbone     |\n| U-Net\
  \ + ResNet50     | ResNet50     | Deeper encoder for richer feature extraction     |\n\n---\n\n## Dataset\
  \ Used\n\n- **Dataset**: [Brain Tumor Segmentation (Kaggle)](https://www.kaggle.com/datasets/nikhilroxtomar/brain-tumor-segmentation)\
  \  \n- Contains MRI images along with corresponding tumor masks  \n\n\n"

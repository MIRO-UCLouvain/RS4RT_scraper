readme_excerpt: "# Attention-gated-3D-UNet-for-radiotherpay-dose-prediction\nWe proposed a novel KBP model\
  \ using an attention-gating mechanism and on a 3D U-Net architecture for voxel-wise dose prediction\
  \ of head and neck radiotherapy plans. \n\n![image](https://user-images.githubusercontent.com/10604649/236342327-fe4fd251-e336-494e-a9f2-6e90c47fbdcc.png)\n\
  \nFig. 3. The CT image, KBP predicted dose distribution, ground-truth dose distribution, and voxel-wise\
  \ dose difference map (predicted – ground-truth) in the axial, sagittal, and coronal planes of a sample\
  \ head and neck patient plan in the test set. \n\n![image](https://user-images.githubusercontent.com/10604649/236342385-98de63bf-17b5-4c1f-8606-29ae00d3c3b5.png)\n\
  \nFig. 4. The predicted dose distributions were presented side-by-side with corresponding ground-truth\
  \ dose distributions in addition to difference maps for eight patients in the test set. \n\n# Availability\
  \ of data and materials\nThe datasets can be found in the OpenKBP - 2020 AAPM Grand Challenge repository\
  \ at https://competitions.codalab.org/competitions/23428. \n\n# Paper\nPlease cite this paper: Osman\
  \ AFI, Tamam NM. Attention-aware 3D U-Net convolutional neural network for knowledge‐based planning\
  \ 3D dose distribution prediction of head and neck cancer. Appl Clin Med Phys. 2022;e13630. \nhttps://pubmed.ncbi.nlm.nih.gov/35533234/\
  \ \n"

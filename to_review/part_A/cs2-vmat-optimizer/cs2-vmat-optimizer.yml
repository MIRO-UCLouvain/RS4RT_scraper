readme_excerpt: "When importing a map, the import script will run resource compiler on all vmats which\
  \ compresses the first two mipmaps - editting a vmat, creating a new vmat (panorama for example) will\
  \ lose/not have the mipmap compression. plop this in C:\\Program Files (x86)\\Steam\\steamapps\\common\\\
  Counter-Strike Global Offensive\\game\\csgo\\import_scripts and run with python, enter your addon name,\
  \ and it will recursively compile all vmats. if the vmat was uneditted, it will skip it (or if it still\
  \ has compressed mipmaps), otherwise it will compile/compress. this should save a decent amount of filesize\
  \ for your workshop maps. \n"

readme_excerpt: "# PHY4004 Medical Radiation Simulation\n\nThis repository contains simulation input files\
  \ and analysis scripts for **Assignments 1 and 2** of the *PHY4004 Medical Radiation Physics* module\
  \ at Queen’s University Belfast.\n\nSimulations were performed using the **TOPAS Monte Carlo toolkit\
  \ (Geant4-based)**, with Python used for analysis, optimisation, and post-processing.\n\n---\n\n## Overview\n\
  \nThe work spans:\n\n- **Assignment 1:** Fundamental charged particle transport physics  \n- **Assignment\
  \ 2:** Radiotherapy treatment planning in a patient CT geometry  \n\nThis repository is intended to\
  \ support **reproducibility** of all simulations and analysis workflows used in the accompanying reports.\n\
  \n---\n\n## Assignment 1 — Particle Transport Physics\n\nThis assignment investigates key physical processes\
  \ relevant to particle therapy:\n\n- Bragg peak formation (protons)\n- Water Equivalent Thickness (WET)\n\
  - Proton vs carbon ion energy matching\n- Multiple Coulomb scattering\n- Beam broadening and radial\
  \ dose distribution\n\n### Structure\n\n```\nAssignment_1/\n├── section_3_1/   # Proton depth-dose in\
  \ water\n├── section_3_2/   # Carbon energy matching\n├── section_3_3/   # WET calculation\n├── section_3_4/\
  \   # Stopping power analysis\n├── section_3_5/   # Radial scattering (Al inserts)\n└── section_3_6/\
  \   # Lead thickness & beam broadening\n```\n\nEach section contains:\n- TOPAS parameter files (`.txt`)\n\
  - Python analysis scripts\n\n---\n\n## Assignment 2 — Radiotherapy Treatment Planning\n\nAssignment\
  \ 2 applies these principles to a **patient CT dataset**, including treatment planning and evaluation.\n\
  \n### Key components\n\n- CT import and material calibration (HU → RSP)\n- Photon multi-field treatment\
  \ planning\n- Monoenergetic proton beams\n- WEPL-based range calculation\n- SOBP construction (NNLS\
  \ optimisation)\n- Energy spread optimisation\n- Lateral beam-width optimisation\n- Pencil Beam Scanning\
  \ (PBS)\n- Motion & interplay effects\n- Neutron production analysis\n\n### Structure\n\n```\nAssignment_2/\n\
  ├── CTData/        # Patient CT + RTStruct\n├── A2_1–A2_5/     # Geometry, photons, monoenergetic protons\n\
  ├── A2_6/          # SOBP construction & optimisation\n├── A2_7/          # Neutron production\n├──\
  \ A2_8/          # PBS implementation\n└── A2_9/          # Motion & interplay\n```\n\nEach section\
  \ contains:\n- TOPAS input files\n- Python workflows\n- Generated plots and DVHs\n\n---\n\n## Software\
  \ Requirements\n\n### Core\n- TOPAS (Geant4-based)\n- Geant4 data libraries\n\n### Python\n- Python\
  \ 3\n- numpy\n- matplotlib\n- scipy\n\n---\n\n## Reproducibility\n\nThe Python scripts automate:\n\n\
  - TOPAS file generation\n- Simulation execution\n- Output parsing\n- Physical quantity extraction (Bragg\
  \ peak, WEPL, DVHs)\n- Optimisation (NNLS, beam-width sweeps, PBS weighting)\n- Plot generation\n\n\
  Run scripts from the project root where possible:\n\n```bash\npython3 Assignment_2/A2_6/sobp_proton.py\n\
  ```\n\n---\n\n## Notes\n\n- Dose is often **normalised to maximum dose** in DVH plots\n- SOBP design\
  \ uses **WEPL**, not geometric depth\n- PBS introduces **temporal effects** (motion interplay)\n- This\
  \ is research/assignment code — not clinical software\n\n---\n\n## Reports\n\nThis repository contains\
  \ **code only**.\n\nFull results, figures, and discussion are presented in the submitted assignment\
  \ reports.\n\n---\n\n## Author\n\n**Jamie McAteer**  \nMSci Physics with Astrophysics  \nQueen's University\
  \ Belfast\n"

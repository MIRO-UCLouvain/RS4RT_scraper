readme_excerpt: '# 3D Glioma Segmentation with U-Net


  A deep learning-based 3D brain tumor segmentation application developed for segmenting glioma regions
  from multi-modal MRI scans. The project uses a 3D U-Net architecture trained on the BraTS-Africa dataset
  and provides an interactive Streamlit application for inference on NIfTI-format MRI scans.


  ## Live Application


  The trained segmentation model is deployed as an interactive Streamlit application:


  [Launch the Live Application](https://brain-tumor-segementation-on-cpu-hq5fly24zawhc3anteslsr.streamlit.app/)


  The application accepts four MRI modalities:


  - T1-weighted (T1)

  - T1-weighted contrast-enhanced (T1ce)

  - T2-weighted (T2)

  - T2-FLAIR (T2-FLAIR)


  Users can upload the four NIfTI MRI volumes and obtain a predicted tumor segmentation.


  ---


  ## Project Overview


  Glioma segmentation involves identifying and delineating tumor regions from brain MRI scans. This project
  implements an end-to-end workflow covering MRI preprocessing, data preparation, 3D U-Net model development,
  model training, quantitative evaluation, and deployment.


  The workflow consists of:


  1. MRI preprocessing and preparation

  2. Dataset organization and train/validation/test splitting

  3. 3D patch extraction and data augmentation

  4. 3D U-Net model training

  5. Region-specific model evaluation

  6. Visualization of segmentation predictions

  7. Deployment of the trained model as a Streamlit application


  ---


  ## Dataset


  The project uses the **BraTS-Africa** dataset for model development.


  The MRI data consist of four imaging modalities per subject:


  - T1

  - T1ce

  - T2

  - T2-FLAIR


  The dataset was processed into NumPy arrays for efficient model training.


  The original MRI volumes have a spatial shape of:



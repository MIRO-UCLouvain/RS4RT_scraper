readme_excerpt: "# GCHA-Net\n\nThis code is for the paper title 'GCHA-Net: Global context and hybrid attention\
  \ network for automatic liver segmentation' \n\n\n# dataset \nLiTS2017：https://competitions.codalab.org/competitions/17094#participate\n\
  \n3D-IRCADb 01：[https://www.ircad.fr/research/3d-ircadb-01/](https://www.ircad.fr/research/data-sets/liver-segmentation-3d-ircadb-01/)\n\
  \n\n\n# How to use this code\n\n1. Download nnUNet framework from the website:https://github.com/MIC-DKFZ/nnUNet,\
  \ and use the following commands:\n\ngit clone https://github.com/MIC-DKFZ/nnUNet.git (note: nnUNetv1\
  \ version)\ncd nnUNet\npip install -e .\n\n2. The above files including GCHA_Net.py is put into the\
  \ fold: nnunetv2\\training\\nnUNetTrainer\\variants\\network_architecture.\n\n3. put the file named\
  \ as 'run_training.py' into the folder 'nnunet\\run'\n\n4. run the command 'python run_training.py'.\n\
  \nIf you encounter any problems, please do not hesitate to contact us.\n\n# use this code,please cite\
  \ this paper\n\n\n\nH. Liu, Y. Fu, S. Zhang, J. Liu, Y. Wang, G. Wang, J. Fang. GCHA-Net: Global context\
  \ and hybrid attention network for automatic liver segmentation, Computers in Biology and Medicine,\
  \ Volume 152, 106352, 2023. doi: https://doi.org/10.1016/j.compbiomed.2022.106352\n"

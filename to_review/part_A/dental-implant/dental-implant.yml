readme_excerpt: "# Dental Implant Planner\r\n\r\nA Python-based DICOM viewer and dental implant planning\
  \ tool with features similar to 3D Slicer.\r\n\r\n## Features\r\n\r\n- **Multi-Planar Reconstruction\
  \ (MPR) Views**\r\n  - Axial View\r\n  - Coronal View\r\n  - Sagittal View\r\n  - Interactive slice\
  \ navigation\r\n  - Zoom and pan capabilities\r\n  - Window/level adjustment\r\n\r\n- **3D Visualization\
  \ (Separate Window)**\r\n  - Surface rendering\r\n  - Adjustable threshold (-1000 to 3000 HU)\r\n  -\
  \ Opacity control\r\n  - Independent window sizing\r\n\r\n- **DICOM Support**\r\n  - Load DICOM series\r\
  \n  - Automatic slice sorting\r\n  - Proper orientation handling\r\n  - Multi-slice navigation\r\n\r\
  \n- **Modern Interface**\r\n  - Dark theme for reduced eye strain\r\n  - Intuitive controls\r\n  - Keyboard\
  \ shortcuts\r\n  - Responsive layout\r\n\r\n## Installation\r\n\r\n1. Clone the repository:\r\n   ```bash\r\
  \n   git clone [repository-url]\r\n   cd dental-implant-planner\r\n   ```\r\n\r\n2. Create and activate\
  \ a virtual environment (recommended):\r\n   ```bash\r\n   # Windows\r\n   python -m venv venv\r\n \
  \  .\\venv\\Scripts\\activate\r\n\r\n   # Linux/Mac\r\n   python3 -m venv venv\r\n   source venv/bin/activate\r\
  \n   ```\r\n\r\n3. Install dependencies:\r\n   ```bash\r\n   pip install -r requirements.txt\r\n   ```\r\
  \n\r\n## Usage\r\n\r\n1. Start the application:\r\n   ```bash\r\n   python main.py\r\n   ```\r\n\r\n\
  2. Load DICOM Data:\r\n   - Click `File > Load DICOM` or press `Ctrl+O`\r\n   - Select a folder containing\
  \ DICOM files\r\n   - The application will automatically load and display the series\r\n\r\n3. Navigate\
  \ Views:\r\n   - Use slice sliders below each view\r\n   - Use mouse wheel to scroll through slices\r\
  \n   - Right-click and drag to adjust window/level\r\n   - Left-click and drag to pan\r\n   - Use toolbar\
  \ buttons to zoom, reset view, etc.\r\n\r\n4. 3D Visualization:\r\n   - Click `View > Show 3D View`\
  \ or press `Ctrl+3`\r\n   - Adjust threshold to control surface extraction\r\n   - Adjust opacity for\
  \ transparency\r\n   - Click \"Generate 3D\" to create visualization\r\n\r\n## Keyboard Shortcuts\r\n\
  \r\n- `Ctrl+O`: Open DICOM folder\r\n- `Ctrl+3`: Show/Hide 3D View window\r\n- `Ctrl+Q`: Exit application\r\
  \n\r\n## Dependencies\r\n\r\n- Python 3.8+\r\n- PyQt5\r\n- pydicom\r\n- numpy\r\n- matplotlib\r\n- VTK\
  \ (for 3D visualization)\r\n- scikit-image\r\n- SimpleITK\r\n\r\n## System Requirements\r\n\r\n- Operating\
  \ System: Windows 10/11, Linux, or macOS\r\n- RAM: 8GB minimum (16GB recommended for large datasets)\r\
  \n- Graphics: OpenGL 2.0+ compatible graphics card\r\n- Storage: Depends on DICOM dataset size\r\n\r\
  \n## Contributing\r\n\r\nContributions are welcome! Please feel free to submit pull requests.\r\n\r\n\
  ## License\r\n\r\nThis project is licensed under the MIT License - see the LICENSE file for details.\r\
  \n\r\n## Acknowledgments\r\n\r\n- 3D Slicer for inspiration\r\n- PyQt5 for the GUI framework\r\n- VTK\
  \ for 3D visualization capabilities\r\n- The open-source medical imaging community\r\n\r\n## Support\r\
  \n\r\nFor issues, questions, or suggestions:\r\n- Open an issue in the repository\r\n- Contact the development\
  \ team\r\n\r\n## Future Plans\r\n\r\n- Window/level presets\r\n- Measurement tools\r\n- Implant planning\
  \ features\r\n- DICOM saving capabilities\r\n- Custom color maps\r\n- Registration tools\r\n"

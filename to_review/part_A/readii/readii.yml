  \n**R**adiomic **E**xtraction and **A**nalysis for **DI**COM **I**mages\n\nA package to extract radiomic\
  \ features from DICOM CT images.\n\n## Installation\n\n```bash\n$ pip install readii\n```\n\n### (recommended)\
  \ Create new `pixi` environment for a project\n\n```bash\nmkdir my_project\ncd my_project\npixi init\n\
  pixi add --pypi readii\n```\n\n### (recommended) Create new conda virtual environment\n\n```bash\nconda\
  \ create -n readii python=3.9\nconda activate readii\npip install readii\n```\n\n## Usage\n\n`readii`\
  \ is a tool to perform radiomic feature extraction on DICOM CT images with region of interest (ROI)\
  \ segmentations as either DICOM SEG or RTSTRUCT.\n\n```bash\n$ readii [INPUT DIRECTORY] [OUTPUT DIRECTORY]\
  \ \\\n  --roi_names [str] \\\n  --pyradiomics_setting [str] \\\n  --negative_controls [str: shuffled_full,shuffled_roi,shuffled_non_roi,randomized_full,randomized_roi,randomized_non_roi,randomized_sampled_full,randomized_sampled_roi,\
  \ randomized_sampled_non_roi] \\\n  --parallel [flag]\n  --update [flag]\n```\n\n### Negative control\
  \ options\n\nNegative controls are applied to one of three masks:\n\n1. full = voxels in the entire\
  \ image\n2. roi = just voxels within the specified region of interest (ROI) in the segmentation\n3.\
  \ non_roi = all voxels except the ROI.\n\nThe three transformations are:\n\n1. shuffle = shuffle all\
  \ voxels in the specified mask\n2. randomized = randomly generate new values within the original range\
  \ within the specified mask\n3. randomized_sampled = randomly sample original values with replacement\
  \ to get new values within the specified mask\n\n## Contributing\n\nPlease use the following angular\
  \ commit message format:\n\n```text\n<type>(optional scope): short summary in present tense\n\n(optional\
  \ body: explains motivation for the change)\n\n(optional footer: note BREAKING CHANGES here, and issues\
  \ to be closed)\n\n```\n\n`<type>` refers to the kind of change made and is usually one of:\n\n- `feat`:\
  \ A new feature.\n- `fix`: A bug fix.\n- `docs`: Documentation changes.\n- `style`: Changes that do\
  \ not affect the meaning of the code (white-space, formatting, missing semi-colons, etc).\n- `refactor`:\
  \ A code change that neither fixes a bug nor adds a feature.\n- `perf`: A code change that improves\
  \ performance.\n- `test`: Changes to the test framework.\n- `build`: Changes to the build process or\
  \ tools.\n\n`scope` is an optional keyword that provides context for where the change was made. It can\
  \ be anything relevant to your package or development workflow (e.g., it could be the module or function\
  \ - name affected by the change).\n\nInterested in contributing? Check out the contributing guidelines.\
  \ Please note that this project is released with a Code of Conduct. By contributing to this project,\
  \ you agree to abide by its terms.\n\n### Serve Documentation Locally\n\n```bash\npixi run -e docs doc-serve\n\
  ```\n\n## License\n\n`readii` was created by Katy Scott. It is licensed under the terms of the MIT license.\n\
  \n<!--intro-end-->"

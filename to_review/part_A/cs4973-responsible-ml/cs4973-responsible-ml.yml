readme_excerpt: "# CS4973_Responsible_ML\nDetermines how the performance of a machine learning (ML) model\
  \ can demonstrate underdiagnosis for chest radiomics in protected classes. Motivated by the inaccurate\
  \ labeling of images, social determinants of health (SDOHs), and lack of diversity in the target population.\n\
  \n## Features\n* Dataset of frontal chest images is publicly available from the National Institute of\
  \ Health (NIH).\n* Uses ML technqiues to categorically classify images based on disease status of the\
  \ patient.\n* Protected classes include patient age and gender, with hopes of later determining the\
  \ involvement of race.\n* Powerpoint presentation to summarize the data acquisition, methodology, and\
  \ results.\n\n## Tech Stack\n* **Language:** Python  \n* **Libraries:** `pandas`, `numpy`, `os`, `torch`,\
  \ `sklearn`, `aequitas`\n* **Visualization:** `matplotlib`, `seaborn`\n  \n## Requirements\n\n```\n\
  pip install aequitas\n```\n\n"

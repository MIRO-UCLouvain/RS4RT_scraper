readme_excerpt: "# Brain Tumor Segmentation - BRISC 2025\n\n## \U0001F4CB Table of Contents\n\n- [Brain\
  \ Tumor Segmentation - BRISC 2025](#brain-tumor-segmentation---brisc-2025)\n  - [\U0001F4CB Table of\
  \ Contents](#-table-of-contents)\n  - [\U0001F3AF Overview](#-overview)\n  - [\U0001F3D7️ Architecture](#️-architecture)\n\
  \    - [Key Components:](#key-components)\n  - [\U0001F527 Installation](#-installation)\n    - [Prerequisites](#prerequisites)\n\
  \    - [Setup](#setup)\n    - [Dependencies](#dependencies)\n  - [\U0001F4CA Dataset](#-dataset)\n \
  \ - [\U0001F680 Usage](#-usage)\n    - [Training](#training)\n    - [Testing/Inference](#testinginference)\n\
  \    - [Test-Time Augmentation (TTA)](#test-time-augmentation-inference)\n  - [\U0001F4BE Checkpoint](#-checkpoint)\n\
  \  - [\U0001F91D Contributing](#-contributing)\n\n## \U0001F3AF Overview\n\nThis project tackles the\
  \ `BRISC 2025 brain tumor segmentation challenge` by developing a robust deep learning pipeline that\
  \ segments brain tumors from medical imaging data. Our solution tries to modify `The Lighweight TransNet`\
  \ using `Spatial Attention`, `Combo loss` and `Data Augmentation`, `Test-Time Augmentation` to achieve\
  \ high accuracy in tumor segmentation.\n\n---\n\n## \U0001F3D7️ Architecture\n<picture>\n  <!-- Dark\
  \ mode -->\n  <source srcset=\"docs/img/SA-TransUNet-Dark.svg\" media=\"(prefers-color-scheme: dark)\"\
  >\n  \n  <!-- Light mode -->\n  <source srcset=\"docs/img/SA-TransUNet-Light.svg\" media=\"(prefers-color-scheme:\
  \ light)\">\n  \n  <!-- REQUIRED fallback -->\n  <img src=\"docs/img/SA-TransUNet-Light.svg\" alt=\"\
  Diagram\">\n</picture>\n\n### Key Components:\n\n1. **CNN Encoder:** Extracts fine, local features using\
  \ standard DoubleConv layers.\n2. **Spatial Attention:** Actively focuses the network on relevant tumor\
  \ regions.\n3. **Transformer Bottleneck:** Captures long-range global dependencies using multi-head\
  \ self-attention.\n4. **Multi-Scale Transformers:** Dynamically weights skip connection features before\
  \ fusion.\n5. **CNN Decoder:** Progressively upsamples and concatenates features for the final mask.\n\
  ---\n\n## \U0001F527 Installation\n\n### Prerequisites\n- Python 3.8+\n- CUDA 11.0+ (for GPU support)\n\
  - pip or conda package manager\n\n### Setup\n\n```bash\n# Clone the repository\ngit clone https://github.com/mohassan5286/Brain-Tumor-Segmentation---BRISC-2025.git\n\
  cd Brain-Tumor-Segmentation---BRISC-2025\n\n# Create virtual environment (optional but recommended)\n\
  python -m venv venv\nsource venv/bin/activate  # On Windows: venv\\Scripts\\activate\n\n# Install dependencies\n\
  pip install -r requirements.txt\n```\n\n### Dependencies\n- PyTorch 2.0+\n- torchvision\n- torchmetrics\n\
  - Pillow\n- NumPy\n- SciPy\n\n---\n\n## \U0001F4CA Dataset\n\nThe dataset structure should follow this\
  \ format:\n\n```\nroot_directory/\n├── train/\n│   ├── images/\n│   │   ├── image_1.jpg\n│   │   ├──\
  \ image_2.jpg\n│   │   └── ...\n│   └── masks/\n│       ├── image_1.png\n│       ├── image_2.png\n│\
  \       └── ...\n\n└── test/\n│   ├── images/\n│   │   ├── image_1.jpg\n│   │   ├── image_2.jpg\n│ \
  \  │   └── ...\n│   └── masks/\n│       ├── image_1.png\n│       ├── image_2.png\n│       └── ...\n\
  ```\n\n**Note**: Images are processed in grayscale (single channel) with 256×256 resolution.\n---\n\n\
  ## \U0001F680 Usage\n\n### Training\n\n```bash\npython train_seg.py \\\n  --data_dir /path/to/segmentation_task\
  \ \\\n  --bsz 32 \\\n  --niter 100 \\\n  --lr 0.0001\n```\n\n### Testing/Inference\n\n```bash\npython\
  \ test_seg.py \\\n  --data_dir /path/to/test/images \\\n  --model_path /path/to/trained_model.pth \\\
  \n  --bsz 32 \\\n  --output_dir /path/to/output/masks\n```\n\n### Test-Time Augmentation/Inference\n\
  \n```bash\npython tta_inference.py \\\n  --data_dir /path/to/test/images \\\n  --model_path /path/to/trained_model.pth\
  \ \\\n  --bsz 32 \\\n  --output_dir /path/to/output/masks\n```\n\n---\n\n## Checkpoint\nYou can download\
  \ the best pre-trained SA-TransUNet model weights for evaluation here:  \n\U0001F517 **[Best Model Checkpoint\
  \ (Google Drive)](https://drive.google.com/drive/folders/1DY_CwsfGjO4pQg4zMCpyX0HsYmNi8yj3?usp=sharing)**\n\
  \n---\n\n## \U0001F4C4 License\n\nThis project is open source and available under the MIT License.\n\
  \n---\n\n## \U0001F91D Contributing\n\nContributions are welcome! Please feel free to submit a Pull\
  \ Request with improvements, bug fixes, or new features.\n\n---"

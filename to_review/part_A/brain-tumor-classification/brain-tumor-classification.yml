readme_excerpt: "# Brain Tumor MRI Classification\n\nA hybrid deep learning framework for multiclass brain\
  \ tumor MRI classification that integrates image preprocessing, threshold-based tumor segmentation,\
  \ radiomics, foundation model features, feature selection, gated multimodal fusion, and ArcFace-based\
  \ classification.\n\n---\n\n## Overview\n\nThis repository presents an end-to-end framework for multiclass\
  \ brain tumor MRI classification.\n\nThe proposed architecture combines handcrafted radiomic descriptors\
  \ with deep semantic representations extracted by a medical vision foundation model. Unlike segmentation-based\
  \ foundation models, tumor localization is performed using Otsu thresholding after CLAHE enhancement,\
  \ providing a lightweight and computationally efficient preprocessing pipeline.\n\nThe extracted radiomic\
  \ and deep features are refined through feature selection and fused using a gated attention mechanism\
  \ before final classification.\n\n---\n\n## Proposed Architecture\n\n```\nInput Brain MRI\n        │\n\
  \        ▼\nCLAHE Enhancement\n        │\n        ▼\nOtsu Thresholding\n        │\n        ▼\nTumor\
  \ Mask\n        │\n ┌──────┴────────┐\n ▼               ▼\nPyRadiomics   Rad-DINO\n15 Features   768\
  \ Features\n        │\n        ▼\nARSM Feature Selection\nSelected Features\n        │\n        ▼\n\
  Gated Attention Fusion\n        │\n        ▼\nMLP Classifier\n+ ArcFace Loss\n        │\n        ▼\n\
  Brain Tumor Prediction\n```\n\n---\n\n## Key Features\n\n- CLAHE-based MRI enhancement\n- Otsu threshold-based\
  \ tumor segmentation\n- PyRadiomics handcrafted feature extraction\n- Rad-DINO deep feature extraction\n\
  - ARSM feature selection\n- Gated multimodal feature fusion\n- ArcFace angular margin classification\n\
  - Four-class brain tumor prediction\n\n---\n\n## Model Components\n\n### Image Enhancement\n\n- CLAHE\
  \ Contrast Enhancement\n\n### Tumor Segmentation\n\n- Otsu Thresholding\n- Binary Mask Generation\n\
  - ROI Extraction\n\n### Deep Feature Extraction\n\n- Rad-DINO Vision Transformer\n- Feature Dimension:\
  \ 768\n\n### Radiomics\n\nExtracted handcrafted features include:\n\n- First-order Statistics\n- Shape\
  \ Features\n- GLCM Texture Features\n\n### Feature Selection\n\n- ARSM\n- Mutual Information Based Selection\n\
  \n### Feature Fusion\n\n- Gated Attention Fusion Module\n\n### Classification\n\n- Multi-Layer Perceptron\n\
  - ArcFace Angular Margin Loss\n\n---\n\n## Technologies\n\n- Python\n- PyTorch\n- OpenCV\n- PyRadiomics\n\
  - timm\n- NumPy\n- scikit-learn\n- Matplotlib\n\n---\n\n## Dataset\n\nBrain MRI Dataset\n\nClasses:\n\
  \n- Glioma\n- Meningioma\n- Pituitary\n- No Tumor\n\n---\n\n## Repository Structure\n\n```\nbrain-tumor-classification/\n\
  │\n├── dataset/\n├── models/\n├── notebooks/\n├── train.py\n├── test.py\n├── utils.py\n├── requirements.txt\n\
  ├── README.md\n└── LICENSE\n```\n\n---\n\n## Installation\n\n```bash\ngit clone https://github.com/your_username/brain-tumor-classification.git\n\
  \ncd brain-tumor-classification\n\npip install -r requirements.txt\n```\n\n---\n\n## Future Improvements\n\
  \n- Adaptive Feature Selection\n- Explainable AI (Grad-CAM)\n- Multi-modal MRI Support\n- External Dataset\
  \ Validation\n\n---\n\n## Author\n\n**Raju Mia**\n\nDepartment of Computer Science and Engineering\n\
  \nDhaka University of Engineering & Technology (DUET), Bangladesh\n"

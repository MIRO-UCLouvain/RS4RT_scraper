readme_excerpt: "# FLASH_NTCP\nCode and data for \"Effect of the dose distribution and organ architecture\
  \ on the toxicity in FLASH radiotherapy: a modeling study\"\n\nVARIABLES IN THE DATA.MAT WORKSPACE\n\
  \nD_het: vector of simulated doses, heterogeneous case.\n\nD_hom: vector of simulated doses, homogeneous\
  \ case.\n\nd_rate:  vector of simulated dose rates.\n\ndose_R: heterogeneous dose distribution.\n\n\
  F_*: interpolants for the calculation of SF_FLASH as a function of dose and dose rate:\n\n\thom/het\
  \ refers to homogeneous or heterogeneous oxygenations.\n\thet_33 and het_90 refers to the two heterogeneous\
  \ oxygenations studied in this work.\n\t“n”mmHg refers th the oxygenation “n” in the homogeneous oxygenation\
  \ scenarios.\n\tab10 refers to and alpha/beta of 10 Gy.\t\n\nFMF: flash modifying factor for the values\
  \ dose and dose rate in D_hom and d_rate.\n\nn: vector of volume response parameter values.\n\nNTCP_ROD*:\
  \ Nx3 matrices containing the results of the NTCP calculations using the ROD model, where N is the number\
  \ of n values (volume parameter). The first column contains the NTCP values for conventional RT, the\
  \ second column contains the NTCP values for FLASH, the third column contains the values of D_50 for\
  \ each value of n:\n\n\thom/het refers to homogeneous or heterogeneous oxygenations.\n\thet_33 and het_90\
  \ refers to the two heterogeneous oxygenations studied in this work.\n\t“n”mmHg refers th the oxygenation\
  \ “n” in the homogeneous oxygenation scenarios.\n\tab10 refers to and alpha/beta of 10 Gy.\n\tref02\
  \ refers to the reference NTCP value for conventional delivery 0.2.\n\tD50_20 refers to the reference\
  \ D_50=20Gy value for the calculation of the NTCP with the \tLKB model for n=1.\n\nNTC_mod2: Nx3 matrix\
  \ containing the results of the NTCP calculations using the phenomenological model, where N is the number\
  \ of n values (volume parameter). The first column contains the NTCP values for conventional RT, the\
  \ second column contains the NTCP values for FLASH, the third column contains the values of D_50 for\
  \ each value of n. \n\npp_conv*: interpolants for the calculation of SF_CONV as a function of dose:\n\
  \n\thom/het refers to homogeneous or heterogeneous oxygenations.\n\thet_33 and het_90 refers to the\
  \ two heterogeneous oxygenations studied in this work.\n\t“n”mmHg refers th the oxygenation “n” in the\
  \ homogeneous oxygenation scenarios.\n\tab10 refers to and alpha/beta of 10 Gy.\n\nSF_conv*: surviving\
  \ fractions for conventional delivery for different dose values and (in the case of homogeneous oxygenation)\
  \ oxygenation values:\n\n\thom/het refers to homogeneous or heterogeneous oxygenations.\n\thet_33 and\
  \ het_90 refers to the two heterogeneous oxygenations studied in this work.\n\tab10 refers to and alpha/beta\
  \ of 10 Gy.\n\nSF_flash*: surviving fractions for FLASH delivery for different dose values, dose rate\
  \ values, and (in the case of homogeneous oxygenation) oxygenation values:\n\n\thom/het refers to homogeneous\
  \ or heterogeneous oxygenations.\n\thet_33 and het_90 refers to the two heterogeneous oxygenations studied\
  \ in this work.\n\tab10 refers to and alpha/beta of 10 Gy.\n\nu_hom:  vector of simulated oxygenations,\
  \ homogeneous case.\n"

readme_excerpt: "# Skull-Stripping\nSkullStripping is a Python routine that enables direct processing\
  \ of brain DICOM RMN data. The code is written in python3. It is particularly useful for Radiomics operations,\
  \ segmentation, and related tasks.\n\nUsage:\nThere is a main file named SkullStripping.py and two DICOM\
  \ files:\nEXAMPLE1.dcm\nEXAMPLE2.dcm\nto show how the SW works.\nTo run the sw you have to set in the\
  \ main program the DICOM file you want to process and the radius of the erosion disk.  \n \n DICOM_FILE_NAME\
  \ =\"EXAMPLE2.dcm\"\n DISK_RADIUS = 8\n \n If you set the FLAG_VISUALIZATION = 1, the procedure is shown\
  \ step by step in graphical form.\n If FLAG_VISUALIZATION = 0, only the result is shown. In the dir\
  \ there are two png image that represent the SW output for the two DICOM files.\n \nLicense:\nSee LICENSE.txt\
  \ for more information.\n\nContact: Massimo Donelli - massimo.donelli@unitn.it \n"

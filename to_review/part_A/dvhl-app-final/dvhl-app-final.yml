  \ Locator** app built with **Python** and **Streamlit**.  \nIt helps users find help centers near them,\
  \ submit comments or experiences, and access emergency contacts.\n\n## Features\n\n- Display nearby\
  \ help centers with address and phone numbers.\n- SOS alert and emergency call buttons.\n- Submit comments\
  \ and experiences (mocked for presentation purposes).\n- Search for help centers by name.\n\n## How\
  \ to Run Locally\n\n1. Clone this repository:\n```bash\ngit clone https://github.com/Moyo06/DVHL-App-Final.git\n"

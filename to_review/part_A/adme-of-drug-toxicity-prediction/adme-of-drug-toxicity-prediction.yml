readme_excerpt: "# ADME-of-drug-Toxicity-prediction\nDrug-induced liver injury (DILI) is fatal liver disease\
  \ caused by drugs and it has been the single most frequent cause of safety-related drug marketing withdrawals\
  \ for the past 50 years (e.g. iproniazid, ticrynafen, benoxaprofen). The DILI dataset is aggregated\
  \ from U.S. FDA’s National Center for Toxicological Research. Given a drug SMILES string, predict whether\
  \ it can cause liver injury (1) or not (0).\n\nPaper: 'https://www.scopus.com/record/display.uri?eid=2-s2.0-85170522479&origin=resultslist'\n\

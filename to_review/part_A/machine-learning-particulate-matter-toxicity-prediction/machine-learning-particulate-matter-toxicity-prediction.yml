readme_excerpt: "# Enhancing Particulate Matter Risk Assessment with Novel Machine Learning-Driven Toxicity\
  \ Threshold Prediction - PM-ToxML\n\nThis repository contains the implementation of the **machine learning-based\
  \ PM toxicity threshold prediction approach** proposed in the paper:\n\n> Enhancing particulate matter\
  \ risk assessment with novel machine learning-driven toxicity threshold prediction  \n> DOI: https://doi.org/10.1016/j.engappai.2024.109531\n\
  \nThe objective of this work is to develop a **data-driven predictive model** that classifies tested\
  \ concentrations of airborne particulate matter (PM) as **toxic or non-toxic**, leveraging physico-chemical\
  \ and exposure characteristics, with model interpretability provided through eXplainable AI (XAI) techniques.\n\
  \n---\n\n## Main Features\n\n- Data collection, structuring, and preprocessing from multi-source literature\n\
  - Exploratory data analysis (EDA) and feature engineering\n- Binary classification using five machine\
  \ learning algorithms\n- Handling of imbalanced classification via class weighting\n- Hyperparameter\
  \ optimization using Grid Search Cross-Validation\n- Model evaluation with accuracy, precision, recall,\
  \ F1-score, ROC-AUC, and k-fold cross-validation\n- SHAP (SHapley Additive exPlanations) analysis for\
  \ model interpretability\n\n---\n\n## Machine Learning Models\n\nThe following algorithms are implemented\
  \ and compared:\n\n- Logistic Regression\n- Support Vector Classifier (SVC)\n- Decision Tree Classifier\n\
  - Random Forest Classifier\n- XGBoost Classifier\n\n---\n\n## Dataset\n\nThe dataset was **manually\
  \ constructed** from an extensive review of over **40 scientific studies** on particulate matter toxicity,\
  \ comprising more than **1000 PM samples** and **30+ physico-chemical and exposure characteristics**.\n\
  \n### Physico-chemical characteristics include:\n- Aerodynamic diameter class (PM0.1, PM1, PM2.5, PM10)\n\
  - Chemical composition (ETM, CARBON, HAP, O-HAP, IONS, WSE, OTHERS)\n- Surface chemistry, zeta potential,\
  \ oxidative potential\n\n### Exposure characteristics include:\n- In vitro / In vivo conditions\n- Cell\
  \ type and cell viability test\n- Exposure duration and mode (unique or chronic)\n- Markers of oxidative\
  \ stress or inflammation\n- Tested concentrations (μg/mL or μg/cm²)\n\n### Target variable:\n- **Effect**\
  \ — Toxic (class 1) or Non-toxic (class 0)\n\n> ⚠️ The dataset is not publicly available by default.\
  \ It will be made available on request, as stated in the original publication.\n\n---\n\n## Output\n\
  \nThe models produce:\n- **Binary classification predictions** (toxic / non-toxic) for PM concentrations\n\
  - **SHAP beeswarm plots** quantifying the contribution of each feature to model predictions\n- **Confusion\
  \ matrices** and **ROC-AUC curves** for performance comparison across models\n\nKey features consistently\
  \ identified as most influential: **Composition ETM**, **Composition HAP**, **Concentration**, and **Composition\
  \ IONS**.\n\n---\n\n## Reference\n\nIf you use this code, please cite the original paper.\n"

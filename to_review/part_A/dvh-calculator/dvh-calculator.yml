readme_excerpt: '# DVH Calculator


  The DVH Calculator calculates DVH curves and configurable DVH parameters based on DICOM CT, RTSTRUCT,
  RTPLAN and RTDOSE files.


  ## Run tests


  * Add DICOM data for one patient in the tests/resources/dicom folder

  * Run ```python -m unittest tests/test.p```




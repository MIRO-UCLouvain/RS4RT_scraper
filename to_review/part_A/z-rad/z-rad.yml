readme_excerpt: "# Z-RAD\n\n[![Tests](https://github.com/medical-physics-usz/z-rad/actions/workflows/test.yml/badge.svg?branch=master)](https://github.com/medical-physics-usz/z-rad/actions/workflows/test.yml)\n\
  [![Ruff](https://github.com/medical-physics-usz/z-rad/actions/workflows/python-lint.yml/badge.svg?branch=master)](https://github.com/medical-physics-usz/z-rad/actions/workflows/python-lint.yml)\n\
  [![Docs](https://github.com/medical-physics-usz/z-rad/actions/workflows/docs.yml/badge.svg?branch=master)](https://github.com/medical-physics-usz/z-rad/actions/workflows/docs.yml)\n\
  [![PyPI](https://img.shields.io/pypi/v/z-rad.svg)](https://pypi.org/project/z-rad/)\n[![Python](https://img.shields.io/pypi/pyversions/z-rad.svg)](https://pypi.org/project/z-rad/)\n\
  [![License](https://img.shields.io/pypi/l/z-rad.svg)](https://github.com/medical-physics-usz/z-rad/blob/master/LICENSE)\n\
  \n<img src=\"https://raw.githubusercontent.com/medical-physics-usz/z-rad/master/docs/logos/ZRadLogo.jpg\"\
  \ width=\"600\" alt=\"Z-Rad logo\"/>\n\nRadiomics is the high-throughput extraction of quantitative\
  \ features from medical images, \nrevolutionizing personalized medicine and enhancing clinical decision-making.\
  \ \nDespite its potential, radiomics faces several challenges, including the need for programming skills\
  \ \nand lack of standardization.\n\n**Z-Rad (Zurich Radiomics)**, developed by the Radiation Oncology\
  \ Department at the University Hospital Zurich, \naddresses these issues by offering a user-friendly,\
  \ IBSI-compliant, and open-source solution for radiomics analysis.\n\n## Z-Rad Features\n<img src=\"\
  https://raw.githubusercontent.com/medical-physics-usz/z-rad/master/docs/images/zrad_screenshot.png\"\
  \ width=\"600\" alt=\"Z-Rad screenshot\"/>\n\n### User-Friendly Interface\n- **Graphical User Interface\
  \ (GUI)**: Designed for medical professionals with no programming skills.\n- **Application Programming\
  \ Interface (API)**: Allows researchers to customize, automate, and extend Z-Rad functionalities using\
  \ Python.\n\n### Compatibility\n- **Medical Data Formats**: Supports CT, PET, and MR imaging modalities\
  \ in both DICOM and NIfTI formats.\n- **Operating Systems**: Windows, macOS, and Linux.\n\n### Standard\
  \ Compliance\n- **IBSI Compliance**: Adheres to [IBSI I](https://arxiv.org/abs/1612.07003) and [IBSI\
  \ II](https://arxiv.org/abs/2006.05470) standards for reproducible and comparable radiomics features.\n\
  \n\n## Software Architecture and Design\n\n### Backend\n- **Programming Language**: Python.\n- **Dependencies**:\n\
  \  - Joblib\n  - NumPy\n  - OpenCV\n  - Pandas\n  - PyDicom\n  - PyQt5\n  - PyWavelets\n  - Scikit-image\n\
  \  - SciPy\n  - SimpleITK\n\n### Radiomics Extraction Pathways\n<img src=\"https://raw.githubusercontent.com/medical-physics-usz/z-rad/master/docs/images/ZRadExtractionPathways.png\"\
  \ width=\"600\" alt=\"Z-Rad Pathways\"/>\n\n## Graphical User Interface (GUI) and Application Programming\
  \ Interface (API)\nBoth GUI and API are structured into three primary classes: **Resampling**, **Filtering**,\
  \ and **Radiomics**:\n\n### Resampling\nZ-Rad supports image resampling alone, alongside regions of\
  \ interest (ROI) masks, or converting DICOM files to NIfTI \nimages and masks without resampling. Resampling\
  \ can be performed in 3D or 2D (axial slice-wise), with nearest \nneighbors, linear, B-spline, and Gaussian\
  \ strategies.\n\n### Filtering\nThis tab requires users to define the desired filter settings. \nThe\
  \ current version of Z-Rad supports mean, Laplace of Gaussian, Laws kernels, \nand wavelet (Daubechies\
  \ 2, Daubechies 3, first-order Coiflet, and Haar) filters.\n\n### Radiomics Feature Extraction\nParameters\
  \ for radiomics feature extraction include the intensity re-segmentation \n(e.g., HU for CT or SUV for\
  \ PET within ROIs) and intensity outlier filtering, \ndiscretisation strategies, and a variety of radiomics\
  \ feature aggregation methods covering 2D, 2.5D, and 3D options. \nRadiomic features include shape,\
  \ intensity, grey level co-occurrence matrix (GLCM), \ngrey level run length matrix (GLRLM), grey level\
  \ distance zone matrix (GLDZM), \nneighbouring gray tone difference matrix (NGTDM), \nand neighbouring\
  \ gray level dependance matrix (NGLDM) features families.\n\n## Error and Warning Handling\n\n- **GUI**:\
  \ Uses info, warning, and error pop-up messages for immediate feedback.\n- **API**: Records processes\
  \ in log files for comprehensive documentation.\n\n## Installation and Get Started\n\n### Release executable\
  \ files\nThe simplest way to run Z-Rad is to start the platform-specific asset attached to every Z-Rad\
  \ release.\n\n- Windows: download and run `z-rad-<release-tag>-windows.exe`.\n- Apple Silicon macOS:\
  \ download `z-rad-<release-tag>-macos-arm64.zip`, extract it, and start `Z-Rad.app`.\n\nThe macOS release\
  \ app is currently unsigned and unnotarized. macOS may show a Gatekeeper warning when opening it.\n\n\
  ### Windows, Linux, and macOS\nFor users familiar with Python programming language, we recommend Python\
  \ 3.11 or newer:\n\n1. Download the Z-Rad repository\n2. Open the terminal and navigate to the project\
  \ directory\n3. Install Z-Rad from the source checkout by typing in the terminal:\n\n```sh\npip install\
  \ -e .\n```\n\n4. Run the `main.py` file:\n\n```sh\npython main.py\n```\n\n### API\n```sh\npip install\
  \ z-rad\n```\n\n## License\n\nZ-Rad is an open-source project licensed under the MIT License.\n\n##\
  \ Contact\n\nFor any questions or feedback, please contact us at [zrad@usz.ch](mailto:zrad@usz.ch).\n\
  \n---\n"

  \ alt=\"Project logo\"></a>\n</p>\n\n<h3 align=\"center\">Radiomics Automation Application</h3>\n\n\
  <div align=\"center\">\n\n[![Status](https://img.shields.io/badge/status-active-success.svg)]()\n[![GitHub\
  \ Issues](https://img.shields.io/github/issues/kylelobo/The-Documentation-Compendium.svg)](https://github.com/warjohn/Front-Radiomic-app-/issues)\n\
  [![GitHub Pull Requests](https://img.shields.io/github/issues-pr/kylelobo/The-Documentation-Compendium.svg)](https://github.com/warjohn/Front-Radiomic-app-/pulls)\n\
  [![License](https://img.shields.io/badge/license-MIT-blue.svg)](/LICENSE)\n\n</div>\n\n---\n\n<p align=\"\
  center\"> Description.\n    <br> This is a test version of an application for the automatic calculation\
  \ of radiomics features. The application is designed to automate the processing of medical data, extraction\
  \ of radiomic features from medical images, and further analysis. The project is currently under development,\
  \ and some features may be unavailable or require further improvement.\n</p>\n\n## \U0001F4DD Table\
  \ of Contents\n\n- [Project Structure](#Project_Structure)\n- [Current Status](#Current_Status)\n- [Authors](#authors)\n\
  \n## \U0001F389 Project Structure <a name = \"Project_Structure\"></a>\n\nThe project consists of two\
  \ main parts:\n\n- *Frontend*: The user interface for interacting with the application.\n- *[Backend](https://github.com/warjohn/Radiomcis-Backend)*:\
  \ The server-side logic for data processing and management.\n\n\n## \U0001F3C1 Current Status <a name\
  \ = \"Current_Status\"></a>\n\nThe project is at an early stage of development. At this point, basic\
  \ functionalities are implemented, including:\n\n#### <p>1) Importing and processing medical images.\n\
  #### <p>2) Extracting radiomic features.\n#### <p>3) Basic API functionality for data interaction.\n\
  \n### What works:\n\n- Image processing.\n- Extraction of basic radiomic features.\n- API for data management.\n\
  \n\n### What is still in development:\n\n- Advanced radiomic feature processing algorithms.\n- Improved\
  \ user interface.\n- Support for additional data formats.\n\n\n## ✍️ Authors <a name = \"authors\"></a>\n\
  \n- [@warjohn](https://github.com/warjohn) - Idea & Initial work\n"

readme_excerpt: "Drug Toxicity Prediction using Machine Learning\n\U0001F4CC Overview\n\nDrug development\
  \ frequently fails due to unforeseen toxicity during later clinical stages.\nThis project focuses on\
  \ early-stage toxicity prediction using machine learning and molecular descriptor data, helping identify\
  \ potentially toxic drug candidates before costly experimental testing.\n\nThe model specifically predicts\
  \ NR-AR (Androgen Receptor) toxicity, a key biological pathway evaluated in the Tox21 benchmark dataset.\n\
  \n\U0001F3AF Objectives\nPredict potential drug toxicity using molecular descriptors\nHandle extreme\
  \ class imbalance in toxic vs non-toxic compounds\nIdentify molecular features contributing most to\
  \ toxicity risk\nProvide an interactive UI for real-time toxicity prediction\n\U0001F9EC Dataset\nSource:\
  \ Tox21 dataset\nTarget Variable: NR-AR\n0 → Non-toxic\n1 → Toxic\n\n⚙️ Methodology\nCleaned and filtered\
  \ labeled data\nStratified train–test split\nFeature scaling using StandardScaler\nRandom Forest classifier\
  \ with class-weight balancing\nLowered decision threshold to improve toxic recall\n\n\U0001F4CA Results\n\
  Metric\t       Value\nROC-AUC\t       ~0.73\nToxic Recall\t ~0.48\nAccuracy\t     ~0.82\n\nThe model\
  \ successfully detects a significant portion of toxic compounds, trading precision for higher recall,\
  \ which is appropriate in pharmacological risk screening.\n\n\U0001F9E0 Interpretability\n\nFeature\
  \ importance analysis revealed that molecular size, polarity, and lipophilicity-related descriptors\
  \ contribute most strongly to toxicity predictions.\nThis aligns with known receptor-binding and bioavailability\
  \ mechanisms in pharmacology.\n\U0001F6E0️ Tech Stack\nPython\nPandas, NumPy\nScikit-learn\nStreamlit\n\
  Joblib\n\n\U0001F468‍\U0001F52C Conclusion\nThis project demonstrates how machine learning can assist\
  \ in early toxicity screening, reducing development costs and improving patient safety.\nBy combining\
  \ robust ML techniques with interpretability and UI deployment, the system provides a practical foundation\
  \ for AI-driven drug discovery workflows.\n"

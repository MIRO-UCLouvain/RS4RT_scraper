readme_excerpt: "# Title: Deployment of Supervised Learning Models for Predicting Chemical Toxicity Based\
  \ on SMILES\n\nObjective: To predict the toxicity of a chemical using simplified molecular input line\
  \ entry system (SMILES).\n\nApproach: The predictions for the testing dataset in the Submission.csv\
  \ file can be achieved in the following three ways:\n\n1. Docker.\n2. Run Toxicity-Prediction.ipynb\
  \ file with pre-generated features and predict the toxicity.\n3. Run Toxicity-Prediction.ipynb file\
  \ to generate features and predict the toxicity.\n\nThis approach can help to accurately predict the\
  \ toxicity of chemicals and ensure safety in various industries.\n\n\n# Option 1: Docker\n\n**Prerequisties:**\
  \ \nTo run the program with Docker, Docker Daemon should be running on your local machine. You can download\
  \ and install Docker on multiple platforms. Refer to the below link and choose the best installation\
  \ path for you:\n\nLink to install Docker: https://docs.docker.com/get-docker/\n\n**Note:** \nTo reduce\
  \ the runtime of the container, pre-generated features are used for the Docker image creation.\n\n###\
  \ Step1: \nOpen the command prompt (Windows machine) or terminal (MacBook) and run the below command\
  \ to pull and execute the Docker image from the Docker repository:\n\n```bash\ndocker run devops333/toxicity-prediction:latest\n\
  ```\n\n### Step2: \nAfter running the Docker image, an instance of the container will be created. You\
  \ can monitor the progress of the container by viewing the logs. Once the container has finished running,\
  \ the predicted toxicity values will be saved to the output CSV file:\n\n![image](https://user-images.githubusercontent.com/51771508/230697796-eda2511a-a1a6-4b3a-850f-f67bedf70ded.png)\n\
  \n### Step3:\nNow run the below command to copy the ContainerID of devops333/toxicity-prediction:latest\
  \ image:\n```bash\ndocker ps -a\n```\n![image](https://user-images.githubusercontent.com/51771508/230738024-d8b09bc4-7c6f-4899-bd3b-dc8c4a11df7c.png)\n\
  \n### Step4:\nCommit the Container with the ContainerID and copy the sha256ID as below:\n```bash\ndocker\
  \ commit ContainerID\n```\n![image](https://user-images.githubusercontent.com/51771508/230738096-dec7f9cd-c50e-46ab-b84c-b668038f9dad.png)\n\
  \n### Step5:\nRun the below command with the copied sha256ID:\n```bash\ndocker run -it sha256ID  bash\n\
  ```\n![image](https://user-images.githubusercontent.com/51771508/230738192-e65dbeeb-cca9-40d6-84e9-103d3819784c.png)\n\
  \n\n### Step6: \nNow, open a new terminal and run the below command to copy the latest ContainerID:\n\
  ```bash\ndocker ps\n```\n![image](https://user-images.githubusercontent.com/51771508/230738234-2e1c05d3-eaf1-4966-8559-0957f726fbb8.png)\n\
  \n \n### Step7: \nRun the below command with the latest ContainerID and replace Your-Location with the\
  \ choice of you local host machine location to store Submission.csv file:\n```bash\ndocker cp latest-ContainerID:/app/Submission.csv\
  \ Your-Location\n```\n![image](https://user-images.githubusercontent.com/51771508/230738333-fcf12eaa-1139-40cc-b775-ca83dd26cec0.png)\n\
  \n### Step8:\nNow, go to the above specified path to find the Submission.csv file.\n\n\n**Docker Repository:**\n\
  The Docker image can be found in the following Docker Repository link: https://hub.docker.com/r/devops333/toxicity-prediction\n\
  \n\n\n\n\n\n## Prerequisties both for Option 2 and 3:\n\nTo run the IPython notebook files (*.ipynb),\
  \ you will need to have Python3 and Jupyter Notebook installed on your computer. Follow the instructions\
  \ below to ensure that you have the necessary prerequisites installed on your machine.\n\n### 1. Installing\
  \ Python3\nPython3 is a programming language that is required to run the IPython notebook files. If\
  \ you don't have Python3 installed on your computer, you can download it from the official website:\
  \ https://www.python.org/downloads/.\n\n### 2. Installing Jupyter Notebook\n\nJupyter Notebook is a\
  \ web application that allows you to create and share documents that contain live code, equations, visualizations,\
  \ and narrative text. To install Jupyter Notebook, follow the instructions below:\n\n2.a) Go to the\
  \ official Jupyter website: https://jupyter.org/install\n\n2.b) Scroll down to the \"Install Jupyter\
  \ Notebook\" section and select your operating system.\n\n2.c) Follow the installation instructions\
  \ for your operating system.\n\n\n### 3. Required Libraries\n\nTo run this program on your local machine,\
  \ you will need to install the following libraries using the command below:\n\n```bash\npip install\
  \ lightgbm numpy pandas sklearn rdkit tqdm boruta pickle\n```\n\n\n\n\n# Option 2: Run Toxicity-Prediction.ipynb\
  \ file with pre-generated features and predict the toxicity.\n\n### Step 1: \nTo begin, you must download\
  \ the entire repository from GitHub onto your local machine and extract it. Once extracted, you will\
  \ notice another zip file named \"400_features.7z\" inside. Extract this file as well to obtain the\
  \ \"train_400.csv\" and \"test_400.csv\" files.\n\nAfter extracting all necessary files, place them\
  \ into a single folder. In doing so, you will be able to successfully run the program. Below is a list\
  \ of files you should have in the designated folder to ensure proper execution of the program.\n\n```bash\n\
  Toxicity-Prediction.ipynb\ntrain_400.csv\ntest_400.csv\ntest_II.csv\ntrain_II.csv\nboruta_features.pkl\n\
  rfe_features.pkl\n```\n\n### Step 2:\nOpen **Toxicity-Prediction.ipynb** file with Jupyter Notebook\
  \ and run **Section-1: Import Libraries**, to import the necessary libraries that are required for the\
  \ program.\n\n### Step 3:\nRun **Section-3: Load the Pre-Generated Features**, with the **train_400.csv**\
  \ and **test_400.csv** files that is presented in the GitHub repository.\n\n### Step 4: \nRun **Section-5:\
  \ Load the Pre-Selected Features**, with the **rfe_features.pkl and boruta_features.pkl** files that\
  \ is presented in the GitHub repository.\n\n### Step 4:\nRun **Section-6: Modeling**, to build a model.\n\
  \n### Step 5:\nRun **Section-7: Result**, to generate the **Submission.csv** file.\n\n\n\n\n# Option\
  \ 3: Run Toxicity-Prediction.ipynb file to generate features and predict the toxicity.\n\n### Step 1:\
  \ \nTo begin, you must download the entire repository from GitHub onto your local machine and extract\
  \ it. Once extracted, you will notice another zip file named \"400_features.7z\" inside. Extract this\
  \ file as well to obtain the \"train_400.csv\" and \"test_400.csv\" files.\n\nAfter extracting all necessary\
  \ files, place them into a single folder. In doing so, you will be able to successfully run the program.\
  \ Below is a list of files you should have in the designated folder to ensure proper execution of the\
  \ program.\n\n```bash\nToxicity-Prediction.ipynb\ntrain_400.csv\ntest_400.csv\ntest_II.csv\ntrain_II.csv\n\
  boruta_features.pkl\nrfe_features.pkl\n```\n\n### Step 2:\nOpen **Toxicity-Prediction.ipynb** file with\
  \ Jupyter Notebook and run all cells from **Section-1 to Section-7** to generate the **Submission.csv**\
  \ file. Running all the cells from these sections will ensure that all necessary computations and processes\
  \ are executed, resulting in the desired output.\n\n\n"

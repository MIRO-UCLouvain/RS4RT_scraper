readme_excerpt: "# DVH\nA DVH calculation with Python\n# Function\nCalculate dose volume histogram (DVH)\
  \ from DICOM RT Structure data. \n  \n# Description: \nfilename: dvhcalc.py \n\nThe file contains Methods\
  \ reading DVH graph from an existing DICOM file or calculating DVH graph from a pair of rtss and rtdose\
  \ files. \n\n# Installation\n\npip install -r requirements.txt\n\n* this work is tested on Python2\n\
  \n# Usage\n\npython dvhcalc.py\n\n* it will read rtss and rtdose file from testdata/ folder and write\
  \ dvh.png to the same folder\n\n# License\nCopyright (c) 2016 glucee\nCopyright (c) 2011-2016 Aditya\

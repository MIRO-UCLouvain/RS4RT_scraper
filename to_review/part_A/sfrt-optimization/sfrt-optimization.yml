readme_excerpt: "# SFRT Optimization\n\nDescription goes here...\n\nThis repository supports analysis\
  \ of dicom structural files\n\n* Note: all path variables must be changed to the relevant CT\\RS\\ file\n\
  \n## Installation\n\nTo run, download poetry with `pip install poetry`.\n\nOnce poetry is downloaded,\
  \ configure virtual environment with `poetry install`.\n\nAfter virtual environment has been created,\
  \ activate with `poetry shell`.\n\n### Running Ingest\n\nTo run ingest, make sure you are in the root\
  \ directory `Research/`, and then execute `python ingest.py`.\n\n## Description\n\n### primary pipeline\n\
  \ndicom_reader.py - creates a list of all points within a given ROI, prints to json file - requires\
  \ grid_placement.py - writes candidate_points.json (slices of node lists)\n\nparameter_writer.py - reads\
  \ candidate_points.json, calculates nodes and arcs, writes node_data.json, arc_data.json, arc_list.json,\
  \ adjacency_matrix.json files\n\nGraph_Optimization.py - a preliminary implementation of the Maximum\
  \ Independent Set problem in Gurobi, reads node_data.json and arc_data.json\n\n**All optimization files\
  \ require dicom_reader.py and parameter_writer.py\n\n## Secondary Models\n\n#### Other Optimization\
  \ Models:\n\n* Clique_Optimization.py : solves MIS problem using all maximal cliques rather than edges.\
  \ Needs cliques.json from Clique_Problem.py\n    \n* Node_Optimization.py : solves MIS problem using\
  \ aggregated constraints, such that there is only one adjacency constraint per node. Needs arc_list.json\
  \ and node_data.json\nTo initialize env, run `poetry install`\n\n#### Heuristics:\n\n* cube_heuristic.py\
  \ : finds a solution for the MIS problem by assuming that the spheres all sit on a uniform grid, which\
  \ is optimal for a rectangular shape. Finds every possible grid solution and returns best solution.\n\
  \    \n* Greedy_Algorithm.py : Implementation of a Greedy algorithm that performs suspiciously poorly.\
  \ Needs validation, potentially correction.\n \n    \n\n## Other Files\n\n* Clique_Problem.py - uses\
  \ networkX library to find all cliques and create cliques.json. Requires node_data.json and arc_data.json\n\
  \n* grid_placement.py - containes helper funcitons for dicom_reader.py\n\n* Structure_Visualizer.py\
  \ - can be used to visualize ROIs in 3D and 2D slices\n\n\n\n## Miscellaneous files\n\n* cube_optimization.py\
  \ - another implementation of the MIS problem to test computation time, data storage\n* dicom_tester.py\
  \ - reads dicom files, don't use\n"

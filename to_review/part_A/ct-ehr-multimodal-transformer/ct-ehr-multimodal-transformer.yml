readme_excerpt: "# RadClinNet — Multimodal CT + EHR Survival Prediction in NSCLC\n\n**AMS 563 · Medical\
  \ Image Analysis · Stony Brook University**  \nPresented to Prof. Chenyu You | Author: Shruti Jagdale\n\
  \n---\n\n## Overview\n\nRadClinNet is an end-to-end multimodal deep learning pipeline that fuses raw\
  \ chest CT DICOM images with EHR-derived structured clinical variables to predict binary survival outcome\
  \ (Dead / Alive) in Non-Small Cell Lung Cancer (NSCLC) patients.\n\nThree model architectures are trained\
  \ and compared:\n\n| Model | Input | Architecture |\n|---|---|---|\n| **Tabular MLP** (clinical-only\
  \ baseline) | EHR-derived clinical features | 3-layer MLP |\n| **CT-Only** | 8 axial CT slices @ 96×96\
  \ | ImageNet-pretrained ResNet18 |\n| **Fusion Model** | CT + clinical features | ResNet18 + MLP → concatenation\
  \ → classifier head |\n\n---\n\n## Motivation\n\nNSCLC carries an ~85% 5-year mortality rate for advanced\
  \ disease and is the leading cause of cancer mortality worldwide. Current clinical risk scores rely\
  \ almost exclusively on tabular EHR variables (demographics, cancer stage, histology, lab values). CT\
  \ scans are routinely acquired but rarely integrated into risk models.\n\nThis project investigates\
  \ whether fusing CT imaging with structured clinical data yields stronger survival prediction compared\
  \ to either modality alone.\n\n---\n\n## Dataset\n\n**NSCLC-Radiogenomics** (The Cancer Imaging Archive,\
  \ TCIA)\n\n- 211 patients total; 211 with labeled survival status (`Dead` / `Alive`)\n- 24 patients\
  \ with matched DICOM CT studies (used for CT and fusion experiments)\n- **Target:** `Survival Status`\
  \ → binary label (`Dead = 1`, `Alive = 0`)\n- **Class distribution (full cohort):** Alive 148 (70%)\
  \ · Dead 63 (30%)\n\n**Tabular features used:**\n\n| Category | Features |\n|---|---|\n| Demographics\
  \ | Age at diagnosis, gender, ethnicity, weight |\n| Smoking | Smoking status, pack years, quit year\
  \ |\n| Tumor | Location (RUL/RML/RLL/LUL/LLL), histology, %GG |\n| Pathology | T/N/M stage, histopathological\
  \ grade, lymphovascular invasion, pleural invasion |\n| Genomics | EGFR mutation status, KRAS mutation\
  \ status, ALK translocation status |\n| Treatment | Adjuvant treatment, chemotherapy, radiation |\n\
  | Outcome | Recurrence, recurrence location, time to death (days) |\n\n> **Why this dataset?** It is\
  \ the only public dataset pairing raw CT DICOMs with matched EHR-derived clinical labels suitable for\
  \ multimodal learning.\n\n---\n\n## Pipeline\n\n```\nDICOM Loading → CT Preprocessing → Tabular Prep\
  \ → Model Training → Evaluation + Grad-CAM\n```\n\n### CT Preprocessing\n1. Load DICOM series with `pydicom`;\
  \ apply RescaleSlope / RescaleIntercept for Hounsfield Unit (HU) conversion\n2. Select the series with\
  \ the most slices per patient\n3. Sample `n_slices = 8` evenly spaced axial slices\n4. HU windowing:\
  \ clip to `[-1000, 400]` and normalize to `[0, 1]`\n5. Bilinear resize to `96 × 96` pixels per slice\n\
  6. Replicate grayscale to 3 channels for ResNet18 compatibility\n\n### Tabular Preprocessing\n- Drop\
  \ date columns and direct label leakage columns\n- One-hot encode all categorical features (with `dummy_na=True`)\n\
  - Impute missing values with `most_frequent` strategy\n- Standardize with `StandardScaler`\n\n### Data\
  \ Augmentation\n- Random horizontal flipping applied during training to reduce overfitting on the small\
  \ 36-patient training set\n\n---\n\n## Model Architectures\n\n### Tabular MLP (clinical-only baseline)\n\
  - Input: EHR-derived features (one-hot encoded + standardized)\n- Architecture: Linear(d→128) → ReLU\
  \ → Dropout(0.4) → Linear(128→64) → ReLU → Dropout(0.3) → Linear(64→1)\n- Trained on the full 211-patient\
  \ cohort\n\n### CT-Only (ResNet18)\n- Input: 8 slices × 3 channels × 96 × 96\n- Encoder: ImageNet-pretrained\
  \ ResNet18 (512-dim output)\n- Slice pooling: mean over 8 slices → 512-dim vector\n- Head: Linear(512→1)\n\
  - Trained on 36-patient matched subset\n\n### Fusion Model\n- CT encoder: same ResNet18 as above (512-dim)\n\
  - Tabular encoder: Linear(d→128) → ReLU → Dropout(0.2) → Linear(128→64) (64-dim)\n- Fusion: concatenation\
  \ → 576-dim → Linear(576→64) → ReLU → Linear(64→1)\n- Trained on 36-patient matched subset\n\n**All\
  \ models:** Adam optimizer · `weight_decay=1e-3` · `BCEWithLogitsLoss` with class weights · 6 epochs\
  \ · `lr=1e-3`\n\n---\n\n## Iterative Development\n\n| Iteration | Change | CT-Only AUROC | Fusion AUROC\
  \ | Outcome |\n|---|---|---|---|---|\n| 1 | Custom 3-layer CNN from scratch | 0.722 | 1.000 | Overfit\
  \ |\n| 2 | + Dropout, weight decay, augmentation, class weights | 0.722 | 1.000 | No improvement |\n\
  | 3 | Replace CNN with ImageNet-pretrained ResNet18 | **0.917** | **0.861** | Best results |\n\nTransfer\
  \ learning was essential — a custom CNN cannot learn meaningful imaging features from only 36 patients.\n\
  \n---\n\n## Results\n\n| Model | AUROC | AUPRC | Brier Score | Sensitivity | Specificity |\n|---|---|---|---|---|---|\n\
  | Tabular MLP | 1.000* | 1.000* | 0.034 | 1.000 | 1.000 |\n| CT-Only (ResNet18) | 0.889 | 0.917 | 0.162\
  \ | 1.000 | 0.500 |\n| Fusion Model | 0.861 | 0.856 | 0.214 | 1.000 | 0.500 |\n\n*Tabular model achieves\
  \ perfect test separation on n=12 test patients — consistent with strong clinical predictors (stage,\
  \ histology) but should be interpreted cautiously given the small test set.*\n\n**Key finding:** Transfer\
  \ learning boosted CT-only AUROC from 0.722 → 0.889. The fusion model (0.861) reflects genuine multimodal\
  \ combination rather than tabular dominance — the CT branch contributes real signal that modulates the\
  \ overconfident tabular predictions.\n\n---\n\n## Interpretability — Grad-CAM\n\nGrad-CAM visualizations\
  \ were generated for the CT-Only ResNet18 model. Attention currently concentrates on image background\
  \ rather than lung tissue — a known small-data artifact. With more training patients, the model would\
  \ learn to focus on clinically relevant anatomy (tumor region, lymph nodes).\n\n---\n\n## Limitations\n\
  \n- **Small dataset:** 112 total patients, only 12 in the CT test set. Results are not statistically\
  \ stable.\n- **Tabular ceiling effect:** Structured clinical variables (stage, histology, age) are very\
  \ strong NSCLC survival predictors. This makes it difficult for imaging to demonstrate measurable added\
  \ value on this cohort.\n- **Grad-CAM background attention:** The CT model lacks spatial supervision\
  \ and does not focus on clinically relevant anatomy.\n\n---\n\n## Future Work\n\n- **Scale to larger\
  \ cohorts:** TCGA-LUAD or NLST for statistically stable evaluation and cross-validation\n- **Cross-attention\
  \ fusion:** Replace concatenation with a Transformer cross-attention mechanism for dynamic modality\
  \ weighting\n- **3D volumetric models:** 3D CNNs or Vision Transformer-based models to capture full\
  \ volumetric CT context rather than 2D slices\n- **Lung segmentation priors:** Use segmentation masks\
  \ to restrict CT attention to clinically relevant anatomy\n\n---\n\n## Repository Structure\n\n```\n\
  CT-EHR-multimodal-transformer/\n├── AMS563_PROJECT.ipynb       # Full pipeline notebook (Google Colab)\n\
  ├── AMS 563 PROJECT.pdf        # Project slides (RadClinNet presentation)\n└── README.md\n```\n\n---\n\
  \n## Setup\n\nThe notebook is designed to run on **Google Colab** with data stored in Google Drive.\n\
  \n```python\n# Install dependencies\npip install pandas numpy matplotlib seaborn scikit-learn pydicom\
  \ torch torchvision tqdm\n```\n\n**Data paths to configure in the notebook (Section 1):**\n\n```python\n\
  PROJECT_ROOT   = Path('/content/drive/MyDrive/AMS 563/project')\nCLINICAL_FILE  = PROJECT_ROOT / 'NSCLCR01Radiogenomic_DATA_LABELS_2018-05-22_1500-shifted.csv'\n\
  IMAGE_ROOT     = PROJECT_ROOT / 'NLCSC-Radiogenomics'   # folder of per-patient DICOM directories\n\
  ```\n\nDownload the NSCLC-Radiogenomics dataset from [TCIA](https://www.cancerimagingarchive.net/collection/nsclc-radiogenomics/).\n\
  \n---\n\n## Configuration\n\nKey hyperparameters are controlled via `CFG` in the notebook:\n\n```python\n\
  CFG = {\n    'random_state': 42,\n    'max_patients_for_ct': 24,  # CT/fusion cohort cap\n    'img_size':\
  \ 96,             # spatial resolution per slice\n    'n_slices': 8,              # axial slices sampled\
  \ per patient\n    'batch_size': 4,\n    'num_workers': 2,\n    'epochs': 6,\n    'lr': 1e-3,\n}\n```\n\
  \n---\n\n## Citation\n\nIf you use this code or pipeline, please cite the NSCLC-Radiogenomics dataset:\n\
  \n> Bakr, S. et al. (2018). *A radiogenomic dataset of non-small cell lung cancer.* Scientific Data,\
  \ 5, 180202.\n"

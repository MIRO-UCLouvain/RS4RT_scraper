readme_excerpt: '# Brain Tumor Segmentation using Swin-UNETR


  A deep learning pipeline for 3D brain tumor segmentation on MRI scans,

  built with PyTorch and MONAI, using the Swin-UNETR architecture.

  Developed as a baseline for the BraTS challenge (Task 1).


  ## Overview

  This project segments brain tumors into three clinically meaningful regions:

  - **Whole Tumor (WT)**

  - **Tumor Core (TC)**

  - **Enhancing Tumor (ET)**


  ## Dataset

  - BraTS 2020 (368 patients), used for learning and baseline development.

  - Each patient has 4 MRI sequences (T1, T1ce, T2, FLAIR) + expert annotation.


  ## Method

  - **Model:** Swin-UNETR (transformer-based 3D segmentation)

  - **Framework:** PyTorch + MONAI

  - **Preprocessing:** intensity normalization, foreground cropping, data augmentation

  - **Loss:** Dice Loss (sigmoid, for overlapping regions)

  - **Evaluation:** Dice Score (per region)


  ## Results

  - Validation Dice score: **0.75** (after 10 epochs)

  - Predictions closely match expert annotations across all three regions.


  ## Why Dice Score (not Accuracy)?

  Tumors occupy a very small part of the brain. A model predicting "no tumor"

  could score ~98% accuracy while finding nothing. The Dice Score measures

  overlap between predicted and actual tumor, ignoring the healthy background,

  making it the fair, standard metric for segmentation.


  ## Tools

  Python, PyTorch, MONAI, nibabel, Google Colab


  ## Author

  Gourav Jangra


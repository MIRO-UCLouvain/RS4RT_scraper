readme_excerpt: "# Ad Click-Through Rate (CTR) Prediction using Machine Learning\n\nThis project builds\
  \ an end-to-end **CTR prediction pipeline** that mimics a\nprogrammatic advertising use case. It focuses\
  \ on supervised learning and\nmodel comparison (Logistic Regression vs XGBoost-style gradient boosting).\n\
  \nMain steps:\n\n1. Generate a synthetic CTR dataset with common ad features\n   (campaign, device,\
  \ country, hour of day, placement, bid price).\n2. Perform feature engineering with one-hot encoding\
  \ and feature scaling.\n3. Train multiple models and compare performance using **LogLoss** and **AUC**.\n\
  4. Save trained models and evaluation metrics for later use.\n\n## 1. Environment Setup\n\n```bash\n\
  python -m venv .venv\nsource .venv/bin/activate        # Windows: .venv\\Scripts\\activate\npip install\
  \ -r requirements.txt\n```\n\n## 2. Generate Synthetic Dataset\n\n```bash\npython src/generate_synthetic_ctr.py\
  \ --out data/ctr_logs.csv --rows 50000\n```\n\n## 3. Train and Evaluate Models\n\n```bash\npython src/train_models.py\
  \ \\\n  --data data/ctr_logs.csv \\\n  --metrics_path outputs/metrics.json\n```\n\nThe script will:\n\
  \n- Fit Logistic Regression and GradientBoostingClassifier models.\n- Print evaluation metrics (AUC\
  \ & LogLoss).\n- Save metrics to `outputs/metrics.json`.\n\n## 4. Inspect Metrics\n\nOpen `outputs/metrics.json`\
  \ to see model comparison and choose the best\nperformer for deployment or further tuning.\n"

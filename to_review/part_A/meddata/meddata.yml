readme_excerpt: "# MedData: UV Index Guide\n\nUV radiation could cause a variety of different issues ranging\
  \ from irritation to different types of skin cancer.<br>\nThe intensity of UV radiation present in any\
  \ given location could be measured by the \"UV Index\".<br>\nOnce we understand the general harms of\
  \ UV radiation, It becomes important to respond accordingly.<br>\nThis means limiting the time we spend\
  \ outside and in the sun, and taking other protective measures such as using proper sun protection agents.<br>\n\
  <br>\nMany cancer patients who are currently, or have gone through chemotheray and/or radiation therapy\
  \ in the past, experience hightened skin sensitivity. This puts them in a more vulnerable position against\
  \ the sun's radiation. \nThis project aims to guide these patients in a way that is easy to understand\
  \ and navigate, in taking the proper measures to be safer when it comes to the sun. Although targeted\
  \ towards these patients, others with sensitive skin could also benefit from the finished project.<br><br>\n\
  This repositiry can be accessed from the following URL: https://github.com/ABiteofPi/MedData/\n\n##\
  \ Data\nThe project uses a JSON database, holding cities' names, longitude, and latitude information.<br>\n\
  The JSON file is encoded in GeoJSON format.\nThe file's source of data is [GeoNames Gazetteer](http://www.geonames.org/)\n\
  This file is licensed under a [Creative Commons Attribution 3.0 License](https://creativecommons.org/licenses/by/3.0/)\
  \ and the version used for the project was accessed from [here](https://github.com/lutangar/cities.json),\
  \ and then converted to GeoJSON encoding.\n<br>\nThe project additionally accesses UV Index data from\
  \ [Open Meteo](https://open-meteo.com/)<br>\n\nThere is a link under the search bar that would redirect\
  \ you to an upload page. From here you can upload your own JSON file containing location data.<br>\n\
  The data must include a name, latitude, and longitude, if nothing else.<br>\nIt must also follow GeoJSON\
  \ encoding standard.<br>\nYou can use the provided \"sample.json\" file to test this feature.<br>\n\
  The location names included in the sample file, are \"Aaa\", \"Bbb\", \"Ccc\", and follow the english\
  \ alphabetical order until the letter J (\"Jjj\"). keep this in mind when searching for location names\
  \ after your upload.\n\n\n## How It Works\n\nThe project can be saved and run locally or in Codespaces.<br>\n\
  In Codespaces, the project should automatically install dependencies and required libraries. It will\
  \ then redirect to the \"app\" directory and run \"python3 -m uvicorn main:app --reload\".<br>\nyou\
  \ can open the app by clicking on the ports tab next to terminal, and ctrl+clicking on the link being\
  \ shown under Forwarded Address.<br>\nUpon openning the page, You are greeted and prompted to search\
  \ for your location.<br>\nSimply start typing your city name, and from the drop down, select your city\
  \ when it appears.<br>\nYou will then be shown the current UV index value of your selected city and\
  \ recommendations based on this value.<br>\nAdditionally, you have access to an overview of the UV index\
  \ for your city for the current week.<br>\nYou can upload your own location data for more specific results.<br>\n\
  This could include data for neighbourhoods or streets. Please read the Data section for more information\
  \ on uploading your own data.<br>\nIf you face issues when trying to re-upload data (ex. the app slowing\
  \ down), Please close the app and run again, the issue may be because of cache, and js loading/unloading\
  \ data.\n\n### Important\nThe following can be done to avoid noticed issues or bugs:<br>\n- When running\
  \ the app in Codespaces, the devcontainer will be built. When the editor environment loads, please wait\
  \ until you can read \"Running postCreateCommand...\" followed by \"cd app && python3 -m uvicorn main:app\
  \ --reload\" in the terminal. Then wait an additional few seconds to allow the initial json library\

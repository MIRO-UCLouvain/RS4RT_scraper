readme_excerpt: "## RootPainter3D\n\nThis software is not approved for clinical use. Also please See [LICENSE](https://github.com/Abe404/RootPainter3D/blob/master/LICENSE)\
  \ file.\n\nDescribed in the paper \"RootPainter3D: Interactive-machine-learning enables rapid and accurate\
  \ contouring for radiotherapy\".\n\nPreprint is available at: https://arxiv.org/pdf/2106.11942.pdf\n\
  \nPublished version is available at: http://doi.org/10.1002/mp.15353 \n\n#### Server setup \n\nFor the\
  \ next steps I assume you have a dedicated GPU with CUDA and cuDNN installed. A recent version of python\
  \ 3 is required.\n\n1. Clone the RootPainter3D code from the repository and then cd into the trainer\
  \ directory (the server component).\n```\ngit clone https://github.com/Abe404/RootPainter3D.git\ncd\
  \ RootPainter3D/trainer\n```\n\n2. To avoid alterating global packages, I suggest using a virtual environment:\n\
  ```\npython -m venv env --clear\n```\n\nNote: Make sure to use python3. You may need to write `python3`\
  \ instead of `python` to do this.\n\n3. Then activate the virtual environment:\n\nOn Linux:\n```\nsource\
  \ ./env/bin/activate\n```\n\nOn Windows:\n```\nenv\\Scripts\\activate.bat\n```\n\n4. Install PyTorch\
  \ by following the instructions at the [pytorch website](https://pytorch.org/get-started/locally/)\n\
  \n5. Install the other dependencies in the virtual environment:\n```\npip install -r requirements.txt\n\
  ```\n\n6. Then, simply run RootPainter by:\n```\npython main.py\n```\n\nThis will first create the sync\
  \ directory. \n\nYou will be prompted to input a location for the sync directory. This is the folder\
  \ where files, including instructions, are shared between the client and server. I will use ~/root_painter_sync\n\
  \nThe RootPainter3D server will then create folders inside ~/root_painter_sync and start watching for\
  \ instructions from the client.\n\nYou should now be able to see the folders created by RootPainter\
  \ (datasets, instructions and projects) inside ~/root_painter_sync on your local machine.\n\n#### Client\
  \ setup\n\n1. Clone the RootPainter3D code from the repository and then cd into the painter directory\
  \ (the client component).\n```\ngit clone https://github.com/Abe404/RootPainter3D.git\ncd RootPainter3D/painter\n\
  ```\n\n2. To avoid alterating global packages. I suggest using a virtual environment. Create a virtual\
  \ environment \n```\npython -m venv env\n```\n\nAnd then activate it.\n\nOn linux/mac:\n```\nsource\
  \ ./env/bin/activate\n```\n\nOn windows:\n```\nenv\\Scripts\\activate.bat\n```\n\n3. Install the other\
  \ dependencies in the virtual environment\n```\npip install -r requirements.txt\n```\n\n4. Run the client.\n\
  ```\npython src/main.py\n```\n\nTo interactively train a model and annotate images, you will need to\
  \ add a set of compressed NIfTI images (.nii.gz) to a folder in the datasets folder and then create\
  \ a project using the client that references this dataset.\n\nFor more details, see [the published article](http://doi.org/10.1002/mp.15353).\n\
  \n\n\n\n## Contribution Guidelines\n\n* Contibutions are welcome\n* It's required to read the two published\
  \ RootPainter papers first, to understand what the system does and how it works. I suggest starting\
  \ with https://nph.onlinelibrary.wiley.com/doi/full/10.1111/nph.18387 (preprint at https://www.biorxiv.org/content/10.1101/2020.04.16.044461v1.full)\
  \ and then moving onto https://arxiv.org/abs/2106.11942\n* Contributions should be made via pull requests\n\
  * The GPL header should be clearly present at the top of any new files. For an example see: https://github.com/Abe404/RootPainter3D/blob/master/trainer/metrics.py\n\
  * The copyright header should include the current year and yourself or 'Anonymous Contributor' if you\
  \ wish to remain somewhat anonymous to future readers of the code.\n\n\nWhen we have tests, they should\
  \ pass.\n"

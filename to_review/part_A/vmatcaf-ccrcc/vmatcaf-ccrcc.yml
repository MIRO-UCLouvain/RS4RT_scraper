readme_excerpt: '# vMatCAF-ccRCC


  Analysis code supporting the study:


  **“Spatial and single-cell transcriptomics identify a CD276-rich

  vascular matrix-associated CAF state linked to poor response to

  targeted therapy–immunotherapy combinations in clear cell renal

  cell carcinoma.”**


  ## Overview


  This repository contains the R, Python, and ImageJ macro scripts used

  for the single-cell, bulk transcriptomic, spatial transcriptomic, and

  multiplex immunofluorescence analyses in the accompanying manuscript.


  ## Repository structure


  ```text

  Code/

  ├── Figure1/

  ├── Figure2/

  ├── Figure3/

  ├── Figure4/

  ├── Figure5/

  └── Figure6/


readme_excerpt: "# Toxicity Prediction of Chemicals using ML models.\n\n Toxicity Prediction is a Machine\
  \ Learning project that uses data mining and different modelling techniques to make predictions. In\
  \ this project, datasets containing chemical data are analysed to predict if a chemical is toxic or\
  \ non-toxic. These predictions are in the form of 1s and 0s, where 1 indicates that the chemical is\
  \ toxic and 0 indicates the chemical is non-toxic.\n\n## Prerequisties\n\n- This code is implemented\
  \ in Python3 and it is saved as FINAL.pynb, referring to the python notebook named as FINAL.pynb. To\
  \ download Python3, please refer to https://www.python.org/downloads/.\n- This code is executed on Jupyter\
  \ Notebook​. Jupyter Notebook​ can be installed at https://jupyter.org/install\n- There are a set of\
  \ libraries that are essential to execute this code successfully. These libraries can be installed via\
  \ a pip commands as given below:\n```sh\npip install numpy \npip install rdkit \npip install pandas\
  \ \npip install sklearn \npip install xgboost \npip install lightgbm \npip install catboost\n```\n##\
  \ Execution Steps\n- Clone the given github repository on your local machine while ensuring that all\
  \ the files are in a single folder.\n- The following files need to be in a single folder:\n```sh\nFINAL.pynb\n\
  train_with_descriptors.csv\ntest_with_descriptors.csv\ntrain_II.csv\ntest_II.csv\n```\n- Open the FINAL.ipynb\
  \ file on Jupyter notebook and after ensuring the code is properly implemented, click \"Run All\"  which\
  \ is located on the top menu of that page. Doing this will execute each cell from top to bottom of the\
  \ code. \n- Each cell that is successfully run will be indicated with a change in the * symbol adjacent\
  \ to that cell. The * will change to a number on proper execution. If there is any error in a cell,\
  \ the program will halt at that cell and not proceed further. Therefore, the cells below the \"error\
  \ cell\" will not get executed.\n- After the successful execution, the output of the program would be\
  \ a csv file containing chemical ID​s​ and their respective predictions. If a chemical is toxic, it\
  \ is indicated as 1 in the Prediction column, else as 0. \n\n\n\n| Plugin | README |\n| ------ | ------\
  \ |\n| GitHub | [https://github.com/kevkev123456/ToxicityPrediction/README.md] \n\n"

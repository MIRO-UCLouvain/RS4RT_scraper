readme_excerpt: "# \U0001FA7A OncoResearch AI\n\n![Python](https://img.shields.io/badge/Python-3.11-3776AB?style=for-the-badge&logo=python&logoColor=white)\n\
  ![Claude](https://img.shields.io/badge/Claude-Sonnet-D97706?style=for-the-badge)\n![ChromaDB](https://img.shields.io/badge/ChromaDB-Vector%20DB-16A34A?style=for-the-badge)\n\
  ![RAG](https://img.shields.io/badge/RAG-Evidence%20Grounded-DC2626?style=for-the-badge)\n![PubMed](https://img.shields.io/badge/PubMed-NCBI-2563EB?style=for-the-badge)\n\
  ![License](https://img.shields.io/badge/License-MIT-059669?style=for-the-badge)\n![Version](https://img.shields.io/badge/Version-v1.0.1-7C3AED?style=for-the-badge)\n\
  \n> \U0001F6A7 **Project Status:** Active Development (Version 1.0.1)\n>\n> This project is actively\
  \ maintained, with additional AI capabilities planned for future releases.\n\n## *An Evidence-Based\
  \ AI Research Assistant for Radiotherapy and Medical Physics*\n\n**OncoResearch AI** is an AI-powered\
  \ **Retrieval-Augmented Generation (RAG)** research assistant designed to help clinicians, medical physicists,\
  \ researchers, and students explore scientific literature more efficiently.\n\nThe application searches\
  \ **PubMed**, builds a local semantic knowledge base using **ChromaDB**, retrieves relevant research\
  \ papers, generates evidence-grounded answers using **Claude Sonnet**, compares research topics, and\
  \ exports professionally formatted research reports.\n\n> **Important:** OncoResearch AI is a research\
  \ and educational software project. It is not clinically validated and is not intended for patient-specific\
  \ clinical decision-making.\n\n---\n\n## ⚡ Quick Start\n\nClone the repository:\n\n```bash\ngit clone\
  \ https://github.com/atinukeinyang-hue/oncoresearch-ai.git\ncd oncoresearch-ai\n```\n\nCreate a virtual\
  \ environment:\n\n```bash\npython -m venv .venv\n```\n\nActivate the virtual environment.\n\n**Windows\
  \ PowerShell:**\n\n```powershell\n.\\.venv\\Scripts\\Activate.ps1\n```\n\n**macOS/Linux:**\n\n```bash\n\
  source .venv/bin/activate\n```\n\nInstall the dependencies:\n\n```bash\npython -m pip install -r requirements.txt\n\
  ```\n\nCreate your local environment file.\n\n**Windows PowerShell:**\n\n```powershell\nCopy-Item .env.example\
  \ .env\n```\n\n**macOS/Linux:**\n\n```bash\ncp .env.example .env\n```\n\nOpen `.env` and add your Anthropic\
  \ API key:\n\n```env\nANTHROPIC_API_KEY=your_anthropic_api_key_here\n```\n\n> Never commit your real\
  \ `.env` file or API key to GitHub.\n\nBefore using the **RAG Research Assistant**, build the local\
  \ knowledge base:\n\n```bash\npython rag/build_vector_db.py\n```\n\nLaunch OncoResearch AI:\n\n```bash\n\
  python app.py\n```\n\n---\n\n## \U0001F4DA Table of Contents\n\n- [Why OncoResearch AI?](#why-oncoresearch-ai)\n\
  - [Project Highlights](#-project-highlights)\n- [Application Preview](#-application-preview)\n- [System\
  \ Architecture](#️-system-architecture)\n- [Installation](#️-installation)\n- [Usage Guide](#️-usage-guide)\n\
  - [Project Structure](#-project-structure)\n- [Technologies Used](#️-technologies-used)\n- [Key Skills\
  \ Demonstrated](#-key-skills-demonstrated)\n- [Research and Education Applications](#-research-and-education-applications)\n\
  - [Roadmap](#️-roadmap)\n- [Acknowledgements](#-acknowledgements)\n- [About the Author](#-about-the-author)\n\
  - [License](#-license)\n\n---\n\n## Why OncoResearch AI?\n\nMedical literature is expanding rapidly,\
  \ making it increasingly difficult for clinicians, medical physicists, researchers, and students to\
  \ stay current with relevant scientific evidence.\n\nOncoResearch AI was developed to streamline evidence-based\
  \ literature exploration by combining live PubMed retrieval, AI-assisted analysis, Retrieval-Augmented\
  \ Generation (RAG), semantic retrieval using ChromaDB, and automated report generation within a single\
  \ research workflow.\n\nThe project demonstrates how modern AI engineering techniques can support scientific\
  \ research while reducing repetitive work involved in identifying, analyzing, comparing, and summarizing\
  \ biomedical publications.\n\n---\n\n## \U0001F680 Project Highlights\n\n- \U0001F50D **Live PubMed\
  \ research search**\n- \U0001F916 **AI-powered paper analysis with Claude Sonnet**\n- ⚖️ **Research-topic\
  \ comparison**\n- \U0001F9E0 **Retrieval-Augmented Generation (RAG)**\n- \U0001F4DA **ChromaDB semantic\
  \ retrieval**\n- \U0001F4D1 **Evidence-grounded AI responses**\n- \U0001F4C4 **Professional Microsoft\
  \ Word report generation**\n- \U0001F4CA **Microsoft Excel research export**\n- \U0001F5A5️ **Interactive\
  \ menu-driven application**\n- \U0001F9E9 **Modular Python architecture**\n\n---\n\n## \U0001F4F8 Application\
  \ Preview\n\n### Main Menu\n\n![OncoResearch AI Main Menu](docs/screenshots/menu.png)\n\n---\n\n###\
  \ Retrieval-Augmented Generation (RAG)\n\n![OncoResearch AI RAG Answer](docs/screenshots/rag_answer.png)\n\
  \n---\n\n### AI Paper Comparison\n\n![OncoResearch AI Paper Comparison](docs/screenshots/paper_comparison.png)\n\
  \n---\n\n### Professional Word Report\n\n![OncoResearch AI Word Report](docs/screenshots/word_report.png)\n\
  \n---\n\n## \U0001F3D7️ System Architecture\n\nThe diagram below illustrates the high-level architecture\
  \ of **OncoResearch AI** and how the major components work together to support evidence-based research\
  \ workflows.\n\n<p align=\"center\">\n  <img src=\"docs/architecture.png\" alt=\"OncoResearch AI System\
  \ Architecture\">\n</p>\n\n---\n\n## ⚙️ Installation\n\n### Requirements\n\n- Python 3.11 recommended\n\
  - Git\n- Internet access for PubMed and external API requests\n- Anthropic API key for Claude-powered\
  \ features\n\n### Clone the repository\n\n```bash\ngit clone https://github.com/atinukeinyang-hue/oncoresearch-ai.git\n\
  ```\n\nNavigate into the project:\n\n```bash\ncd oncoresearch-ai\n```\n\n### Create a virtual environment\n\
  \n```bash\npython -m venv .venv\n```\n\n### Activate the virtual environment\n\n**Windows PowerShell:**\n\
  \n```powershell\n.\\.venv\\Scripts\\Activate.ps1\n```\n\n**macOS/Linux:**\n\n```bash\nsource .venv/bin/activate\n\
  ```\n\n### Install the dependencies\n\n```bash\npython -m pip install -r requirements.txt\n```\n\n###\
  \ Configure the environment file\n\nCreate your local `.env` file from the provided `.env.example` template.\n\
  \n**Windows PowerShell:**\n\n```powershell\nCopy-Item .env.example .env\n```\n\n**macOS/Linux:**\n\n\
  ```bash\ncp .env.example .env\n```\n\nOpen `.env` and add your Anthropic API key:\n\n```env\nANTHROPIC_API_KEY=your_anthropic_api_key_here\n\
  ```\n\n> Keep your real `.env` file private. It is excluded from Git tracking and should never be committed.\n\
  \n### Initialize the RAG knowledge base\n\nBefore using the **RAG Research Assistant**, run:\n\n```bash\n\
  python rag/build_vector_db.py\n```\n\nEnter a PubMed research topic when prompted.\n\nThe builder retrieves\
  \ PubMed literature and creates or loads the local ChromaDB collection:\n\n```text\npubmed_papers\n\
  ```\n\nThe persistent database is stored locally in:\n\n```text\nvector_db/\n```\n\n### Launch the application\n\
  \n```bash\npython app.py\n```\n\n---\n\n## ▶️ Usage Guide\n\nAfter installation, launch the application:\n\
  \n```bash\npython app.py\n```\n\nThe Version 1.0 application menu provides four options:\n\n```text\n\
  =======================================================\nRADIOTHERAPY RESEARCH ASSISTANT v1.0\n=======================================================\n\
  \n1. Search and analyse PubMed papers\n2. Compare two research topics\n3. Ask the RAG Research Assistant\n\
  4. Exit\n\n=======================================================\n```\n\n### 1. Search and Analyse\
  \ PubMed Papers\n\nChoose:\n\n```text\n1\n```\n\nEnter a PubMed research topic.\n\nExample:\n\n```text\n\
  HDR brachytherapy cervical cancer\n```\n\nThe workflow retrieves relevant PubMed literature, performs\
  \ AI-assisted analysis, and generates structured research outputs.\n\n### 2. Compare Two Research Topics\n\
  \nChoose:\n\n```text\n2\n```\n\nEnter two research topics when prompted.\n\nThe comparison workflow\
  \ retrieves relevant literature and produces an AI-assisted comparison of the available research evidence.\n\
  \n### 3. Ask the RAG Research Assistant\n\nBefore using this feature, initialize the local knowledge\
  \ base:\n\n```bash\npython rag/build_vector_db.py\n```\n\nThen launch:\n\n```bash\npython app.py\n```\n\
  \nChoose:\n\n```text\n3\n```\n\nEnter a research question.\n\nExample:\n\n```text\nWhat are recent advances\
  \ in HDR brachytherapy for cervical cancer?\n```\n\nThe application searches the local ChromaDB knowledge\
  \ base, retrieves relevant papers, and provides those papers as context to Claude for an evidence-grounded\
  \ response.\n\nIf the RAG knowledge base has not been initialized, the application provides setup guidance\
  \ instead of terminating during startup.\n\n### 4. Exit\n\nChoose:\n\n```text\n4\n```\n\nto close the\
  \ application.\n\n### Professional Research Outputs\n\nOncoResearch AI supports:\n\n- Microsoft Word\
  \ research reports (`.docx`)\n- Microsoft Excel research exports (`.xlsx`)\n- Structured command-line\
  \ output\n\n---\n\n## \U0001F4C1 Project Structure\n\n```text\noncoresearch-ai/\n│\n├── agents/    \
  \                   # Research and comparison agents\n├── docs/                         # Documentation,\
  \ architecture, screenshots\n├── outputs/                      # Generated research outputs\n├── rag/\
  \                          # Retrieval-Augmented Generation pipeline\n├── tools/                   \
  \     # PubMed, Claude, and export utilities\n│\n├── .env.example                  # Environment variable\
  \ template\n├── .gitignore                    # Git ignore rules\n├── LICENSE                      \
  \ # MIT License\n├── README.md                     # Project documentation\n├── app.py             \
  \           # Main application entry point\n├── requirements.txt              # Python dependencies\n\
  └── sample_research_results.xlsx  # Example research export\n```\n\n### Local Runtime Files\n\nThe following\
  \ are created locally when the project is configured or used and are **not part of the distributed source\
  \ repository**:\n\n```text\n.env\nvector_db/\nresearch_results.xlsx\n```\n\n- `.env` stores the user's\
  \ private Anthropic API key.\n- `vector_db/` stores the persistent local ChromaDB knowledge base.\n\
  - `research_results.xlsx` is a generated research-output file.\n\n---\n\n## \U0001F6E0️ Technologies\
  \ Used\n\n| Technology | Purpose |\n| --- | --- |\n| **Python 3.11** | Core application development\
  \ |\n| **NCBI PubMed API** | Biomedical literature retrieval |\n| **Anthropic Claude Sonnet** | AI-assisted\
  \ scientific analysis and RAG generation |\n| **ChromaDB** | Persistent local vector storage and semantic\
  \ retrieval |\n| **Retrieval-Augmented Generation (RAG)** | Evidence-grounded research question answering\
  \ |\n| **Requests** | HTTP and API communication |\n| **XML / ElementTree** | Processing structured\
  \ PubMed responses |\n| **OpenPyXL** | Microsoft Excel export |\n| **python-docx** | Microsoft Word\
  \ report generation |\n| **Git** | Version control |\n| **GitHub** | Open-source repository and release\
  \ management |\n| **VS Code** | Development environment |\n\n---\n\n## \U0001F9E0 Key Skills Demonstrated\n\
  \n- Python application development\n- Modular software architecture\n- REST API integration\n- Biomedical\
  \ literature retrieval\n- XML and structured-data processing\n- Environment-variable management\n- External\
  \ LLM API integration\n- Prompt engineering\n- Retrieval-Augmented Generation (RAG)\n- Vector databases\n\
  - Semantic retrieval\n- Exception handling\n- Dependency management\n- Reproducible Python environments\n\
  - Microsoft Word automation\n- Microsoft Excel automation\n- Git version control\n- GitHub repository\
  \ management\n- Technical documentation\n- Clean-environment testing and debugging\n\n---\n\n## \U0001F52C\
  \ Research and Education Applications\n\n- Evidence-based literature review\n- Radiotherapy research\n\
  - Medical physics research and education\n- Clinical guideline literature exploration\n- Research paper\
  \ comparison\n- AI-assisted research report generation\n- Scientific knowledge retrieval\n\n> **Note:**\
  \ OncoResearch AI is a research and educational tool. It is not clinically validated and is not intended\
  \ for patient-specific clinical decision-making.\n\n---\n\n## \U0001F5FA️ Roadmap\n\n### ✅ Version 1.0\
  \ — Core Feature Release\n\nVersion 1.0 introduced:\n\n- Live PubMed integration\n- AI-powered paper\
  \ analysis\n- Research-topic comparison\n- Retrieval-Augmented Generation (RAG)\n- ChromaDB semantic\
  \ retrieval\n- Evidence-grounded AI responses\n- Professional Microsoft Word report generation\n- Microsoft\
  \ Excel export\n- Interactive command-line application\n- Project documentation\n\n### \U0001F6E0️ Version\

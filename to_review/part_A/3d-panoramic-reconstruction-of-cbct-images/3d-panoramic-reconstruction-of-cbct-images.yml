readme_excerpt: "# 3D-Panoramic-Reconstruction-of-CBCT-Images\nDental Assist for early detection and diagnosis\
  \ of dental caries, plaque, or periodontal infections\n\n![](rec.png)\n\nThe first step to do this is\
  \ to create a 3D panoramic reconstruction of\nCBCT images.\nThis is done by measuring the thickness\
  \ of the dental arch to eliminate the non-interesting tissues.\n\n![](Picture1.png)\n\nMaximum Intensity\
  \ Projection (MIP) images are generated according to the axial slices and for each slice, \n\n![](Picture2.png)\n\
  \na candidate arch is modeled as a polynomial curve and compared to the template curve derived from\
  \ the training set.\nThe comparison is made based on Root Mean Square Error (RMSE), \nand the slice\
  \ minimizing the RMSE is considered to containthe desired dental arch.\n\n![](Picture3.png)\n\nThe required\
  \ panoramic image is thereby generated when the intensities of the original CBCT along the appropriate\
  \ arch are projected in a 2D image.\n\n![](Picture4.png)\n\nThis representation will be analyzed using\
  \ a CNN structure to detect the dental issues.\n\n"

readme_excerpt: "# Radiomics as Embeddings: A Scalable Vector Database Approach to Prostate Cancer Risk\
  \ Stratification Beyond Supervised Learning\n\nOfficial code repository for the project exploring radiomics\
  \ features as reusable semantic embeddings inside a vector database (FAISS) retrieval framework compared\
  \ to a supervised learning baseline (LightGBM).\n\nFor more details, please refer to the **2nd International\
  \ Conference on Cognitive Computing, Intelligence and Data Science Applications** proceedings to access\
  \ the full length paper.\n\n---\n\n## Repository Structure\n\n* **`code/`**: Contains the scripts for\
  \ baseline model, vector database retrieval, and statistical evaluation.\n* **`data/`**: Contains pre-extracted\
  \ radiomics features.\n\n---\n\n## How to Run\n\nTo run the experiments, navigate to the `code/` directory\
  \ first so that all relative paths resolve correctly:\n\n```bash\ncd code\n```\n\n1. **Run the Supervised\
  \ Baseline:**\n   ```bash\n   python 1-Baseline_LightGBM_KFold.py\n   ```\n\n2. **Run the Vector Database\
  \ Pipeline:**\n   ```bash\n   python 2-VectorDB.py\n   ```\n\n3. **Statistical Comparison:**\n   ```bash\n\
  \   python 3-Statistical_Test.py\n   ```\n\n---\n\n## License\n\nThis project is licensed under the\
  \ MIT License - see the [LICENSE](LICENSE) file for details.\n"

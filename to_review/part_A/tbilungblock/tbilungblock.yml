readme_excerpt: "# TBILungBlock\nTungsten filled 3D printed lung blocks for total body irradiation\n\n\
  This repository is an implementation of \"[Tungsten filled 3D printed lung blocks for total body irradiation](https://capaldi.ucsf.edu)\"\
  \ in _Practical Radiation Oncology_ by Dante Capaldi and colleagues.\n\n<p align=\"center\">\n  <img\
  \ width=\"720\" height=\"348\" src=\"https://github.com/capaldid/TBILungBlock/blob/main/3DTBILungBlocks.jpg\"\
  >\n</p>\n\n## Overview of Matlab Script\n\n3D printed lung blocks, filled with tungsten BBs, are created\
  \ via a Matlab script, where the input is a Radiation Therapy (RT) Plan DICOM file.  The output is STL\
  \ files used for 3D printing.\n\n<p align=\"center\">\n  <img width=\"720\" height=\"348\" src=\"https://github.com/capaldid/TBILungBlock/blob/main/MatlabScriptOverview.jpg\"\
  >\n</p>\n\n## Requirements\n\n- MATLAB 2022b or newer\n- Radiation Therapy (RT) plan DICOM file (with\
  \ lung blocks drawn)\n\n\n## Files and Documentation\n\nThe code is provided for lung blocks creation.\n\
  \n```\nsrc\\LungBlockGeneration_final.m\n```\n\n## Overview of Python Script\n\n3D printed lung blocks\
  \ for extended field standing TBI procedure, courtesy of J. Schulz.\n\n## Requirements\n\n- Python 3.9\n\
  \n## Files and Documentation\n\nThe code is provided for standing lung blocks creation.\n\n```\nsrc\\\
  LungBlockGeneration_StandingPython.py\n```\n\n## License\n\nMIT License\n\nCopyright 2023 Dante Capaldi\n\

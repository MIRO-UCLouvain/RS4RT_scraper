readme_excerpt: "# Multimodal Breast Cancer Histopathological Classification\n\n## Table of Contents\n\
  1. [Project Overview](#project-overview)\n2. [Dataset Integration](#dataset-integration)\n3. [System\
  \ Architecture](#system-architecture)\n4. [Mathematical & Theoretical Foundation](#mathematical--theoretical-foundation)\n\
  5. [Repository Structure](#repository-structure)\n6. [Installation & Requirements](#installation--requirements)\n\
  7. [Usage Pipeline](#usage-pipeline)\n8. [Cross-Validation Results](#cross-validation-results)\n9. [Troubleshooting\
  \ & Known Issues](#troubleshooting--known-issues)\n\n---\n\n## Project Overview\n\nThis repository provides\
  \ an end-to-end multimodal deep learning framework for the binary classification of breast cancer using\
  \ histopathological images. The pipeline identifies tissues as either **Benign** or **Malignant** by\
  \ fusing raw pixel data with highly specific radiomic texture features.\n\nTraditional models often\
  \ rely solely on raw imagery. This framework bridges the gap between deep visual feature extraction\
  \ and quantitative radiomics, utilizing a Custom Vision Transformer (ViT) paired with Sparse group-regularized\
  \ Canonical Correlation Analysis (sgR-CCA).\n\n## Dataset Integration\n\nThe system is configured to\
  \ process the **BreakHis (Breast Cancer Histopathological Database)**.\n\n* **Classes:** Benign (0),\
  \ Malignant (1)\n* **Magnification Levels:** 40X, 100X, 200X, 400X\n* **Total Images Processed:** 7,712\n\
  * **Feature Metadata:** The pipeline strictly requires a paired CSV file (`radiomic_features_numeric.csv`)\
  \ containing pre-extracted original shape, first-order, GLCM, GLDM, GLRLM, GLSZM, and NGTDM features\
  \ for every image.\n\n## System Architecture\n\nThe pipeline consists of four primary stages:\n\n###\
  \ 1. Image Preprocessing and Standardization\nHistopathological slides often suffer from color inconsistencies\
  \ due to different staining processes. The system utilizes **Macenko Stain Normalization** to map the\
  \ color distribution of all input images to a predefined target reference. After patching the images\
  \ to 224x224, a **Discrete Cosine Transform (DCT)** low-pass filter is applied to remove high-frequency\
  \ noise artifacts while preserving structural cellular details.\n\n### 2. Feature Selection\nInstead\
  \ of overwhelming the model with redundant data, a Random Forest algorithm analyzes the radiomics CSV.\
  \ It ranks and isolates the top 10 most critical texture features (e.g., Small Area High Gray Level\
  \ Emphasis, Short Run High Gray Level Emphasis) to feed into the transformer.\n\n### 3. Custom Vision\
  \ Transformer (ViT)\nWe modify the standard `google/vit-base-patch16-224` architecture. In addition\
  \ to the standard image patch tokens, the model architecture introduces three independent, learnable\
  \ positional embeddings. These represent the specific radiomic families:\n* GLSZM (Gray Level Size Zone\
  \ Matrix)\n* GLRLM (Gray Level Run Length Matrix)\n* GLDM (Gray Level Dependence Matrix)\n\n### 4. sgR-CCA\
  \ Fusion & Classification\nThe extracted deep visual features from the ViT and the PCA-reduced radiomic\
  \ features are passed into the sgR-CCA module. This algorithm maximizes the correlation between the\
  \ two data modalities, projecting them into a unified feature space. Finally, a standard Feed-Forward\
  \ Neural Network (FCNN) outputs the final classification probabilities.\n\n---\n\n## Mathematical &\
  \ Theoretical Foundation\n\nTo understand the core mechanisms, here are the mathematical principles\
  \ driving the feature fusion and normalization.\n\n### Macenko Normalization\nThe algorithm converts\
  \ RGB images into Optical Density (OD) space to isolate the specific absorption properties of the stains\
  \ (typically Hematoxylin and Eosin):\n\nOD = -log10(I / 255)\n\nIt then calculates the singular value\
  \ decomposition on the OD tuples to find the robust extremes of the stain vectors, allowing the source\
  \ image to be mathematically projected onto the target image's color space.\n\n### Canonical Correlation\
  \ Analysis (CCA)\nGiven two centered data matrices, image features X and radiomic features Y, CCA seeks\
  \ projection vectors u and v to maximize the correlation between the linear combinations Xu and Yv.\
  \ The Sparse group-regularized (sgR) variant introduces L1 and L2 penalties to handle high-dimensional,\
  \ grouped data, ensuring the model ignores irrelevant texture inputs without overfitting.\n\n---\n\n\
  ## Repository Structure\n\n```text\n├── dataset/\n│   ├── 40X/\n│   ├── 100X/\n│   ├── 200X/\n│   └──\
  \ 400X/\n├── metadata/\n│   └── radiomic_features_numeric.csv\n├── main_pipeline.py\n├── requirements.txt\n\
  └── README.md\n```\n\n---\n\n## Installation & Requirements\n\nEnsure you have Anaconda or a standard\
  \ Python 3.9+ virtual environment configured. \n\n1.  **Clone the repository and navigate to the directory.**\n\
  2.  **Install the exact dependencies:**\n\n```bash\npip install torch torchvision transformers pandas\
  \ numpy scikit-learn Pillow scipy opencv-python matplotlib seaborn joblib\n```\n\n> **Note on Hardware:**\
  \ A CUDA-enabled GPU with at least 8GB of VRAM is highly recommended. The scripts will automatically\
  \ detect and utilize CUDA if available.\n\n---\n\n## Usage Pipeline\n\nUpdate the paths at the top of\
  \ the main script to point to your local dataset directories:\n\n```python\nbase_data_directory = 'path/to/dataset_cancer_v1/classificacao_binaria'\n\
  radiomics_metadata_path = 'path/to/radiomic_features_numeric.csv'\n```\n\nExecute the primary script:\n\
  \n```bash\npython main_pipeline.py\n```\n\nThe script will inherently run a **5-Fold Stratified Cross-Validation**.\
  \ During execution, it will generate and save the following artifacts to your working directory:\n*\
  \ Saved PyTorch model weights per fold (`model_foldX.pth`)\n* Joblib dumps for scalers and PCA transforms\n\
  * Performance plots (Loss curves, Confusion Matrices, ROC, and Precision-Recall charts)\n\n---\n\n##\
  \ Cross-Validation Results\n\nThe architecture achieves highly stable performance across all folds,\
  \ demonstrating its robustness against overfitting.\n\n* **Average Accuracy:** 96.2% ± 0.7%\n* **Average\
  \ AUC-ROC:** 0.984 ± 0.008\n\n---\n\n## Troubleshooting & Known Issues\n\n### OOM Kernel Crash at Pipeline\
  \ Completion\n**Symptom:** The script runs perfectly through all 5 folds but the kernel crashes entirely\
  \ when attempting to generate the final \"Aggregate Final Plots.\"\n\n**Cause:** This is a memory exhaustion\
  \ issue. By appending all predictions, probabilities, and labels across all folds into large Python\
  \ lists, and subsequently using `matplotlib` to render multi-layer charts without flushing the RAM,\
  \ the system runs out of memory.\n\n**Solution:** Modify the final plotting block to aggressively manage\
  \ memory. Clear the figure canvases and run garbage collection. Here is how you should update the bottom\
  \ of your script to prevent this:\n\n```python\nimport gc\n\n# Summarize CV results\naccs = [metric[0]\
  \ for metric in fold_results]\naucs = [metric[1] for metric in fold_results]\n\nprint(\"\\n===== Cross-validation\
  \ results =====\")\nprint(f\"Accuracy: {np.mean(accs):.3f} ± {np.std(accs):.3f}\")\nprint(f\"AUC:  \
  \    {np.mean(aucs):.3f} ± {np.std(aucs):.3f}\")\n\n# Extract data specifically from the final fold\
  \ iteration\nlast_fold_acc, last_fold_auc, final_probs, final_preds, final_labels = fold_results[-1]\n\
  \ndef generate_and_save_plot(plot_function, filename):\n    plt.figure(figsize=(6, 5))\n    plot_function()\n\
  \    plt.tight_layout()\n    plt.savefig(filename)\n    plt.clf()     # Clear the current figure\n \
  \   plt.close()   # Close the window to free memory\n    gc.collect()  # Force garbage collection\n\n\
  # 1. Confusion Matrix\ndef plot_cm():\n    cm_matrix = confusion_matrix(final_labels, final_preds)\n\
  \    sns.heatmap(cm_matrix, annot=True, fmt='d', cmap='Blues',\n                xticklabels=['Benign',\
  \ 'Malignant'],\n                yticklabels=['Benign', 'Malignant'])\n    plt.xlabel('Predicted Class')\n\
  \    plt.ylabel('True Class')\n    plt.title('Final Confusion Matrix (Last Fold)')\n\ngenerate_and_save_plot(plot_cm,\
  \ 'final_confusion_matrix.png')\n\n# 2. ROC Curve\ndef plot_roc():\n    false_pos_rate, true_pos_rate,\
  \ _ = roc_curve(final_labels, final_probs)\n    plt.plot(false_pos_rate, true_pos_rate, label=f'ROC\
  \ Curve (AUC = {last_fold_auc:.4f})')\n    plt.plot([0, 1], [0, 1], 'k--', label='Random Chance')\n\
  \    plt.xlabel('False Positive Rate')\n    plt.ylabel('True Positive Rate')\n    plt.title('Final ROC\
  \ Curve (Last Fold)')\n    plt.legend()\n    plt.grid(True)\n\ngenerate_and_save_plot(plot_roc, 'final_roc_curve.png')\n\
  \nprint(\"All charts generated and memory cleared successfully.\")\n```\n"

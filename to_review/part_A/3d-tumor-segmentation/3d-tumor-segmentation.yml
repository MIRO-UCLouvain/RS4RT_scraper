readme_excerpt: "# 3D Medical Image Segmentation Pipeline (BraTS 2023)\n\nA simplified, robust 3D medical\
  \ image segmentation pipeline designed for the **BraTS 2023 GLI (Adult Glioma)** dataset. Built using\
  \ PyTorch and MONAI, this project features robust data augmentation, test-time augmentation (TTA), Monte\
  \ Carlo dropout uncertainty estimation, and intuitive visualization tools.\n\n## \U0001F680 Features\n\
  - **Framework**: Built natively on PyTorch and MONAI (using `monai.networks.nets.UNet`).\n- **BraTS\
  \ 2023 Standards**: Automatically maps labels (1=NCR/NET, 2=ED/SNFH, 3=ET) into logical target classes:\n\
  \  - **WT (Whole Tumor)**: labels 1, 2, 3\n  - **TC (Tumor Core)**: labels 1, 3\n  - **ET (Enhancing\
  \ Tumor)**: label 3\n- **Robust Loss Strategy**: Utilizes `DiceCELoss` with per-channel weighting (default:\
  \ WT=1, TC=1, ET=2) to prioritize the smaller/rare ET class.\n- **Advanced Uncertainty Estimation**:\n\
  \  - **Monte Carlo Dropout**: Performs stochastic forward passes during training validation to report\
  \ mean prediction, voxelwise variance, and predictive entropy.\n  - **Test-Time Augmentation (TTA)**:\
  \ 8 deterministic spatial flip combinations across X, Y, and Z axes during evaluation to calculate robust\
  \ epistemic and aleatoric uncertainty.\n- **Automated Visualization**: Generates side-by-side 4-panel\
  \ PNGs for evaluation containing:\n  1. Base Image\n  2. Ground Truth Overlay\n  3. Prediction Overlay\n\
  \  4. Uncertainty (Entropy/Mutual Info) Heatmap\n\n## \U0001F4E6 Requirements\n- Python 3.8+\n- PyTorch\
  \ (with CUDA support recommended)\n- MONAI\n- NumPy\n- Matplotlib\n- scikit-learn\n- tqdm\n\nInstall\
  \ dependencies using:\n```bash\npip install torch monai numpy matplotlib scikit-learn tqdm\n```\n\n\
  ## \U0001F4C2 Dataset Structure\nThe script expects a dataset referenced via a Medical Segmentation\
  \ Decathlon-style `dataset.json` file. \n\nExample structure inside `dataset.json`:\n```json\n{\n  \"\
  training\": [\n    {\n      \"t2f\": \"BraTS-GLI-00001-000/BraTS-GLI-00001-000-t2f.nii.gz\",\n     \
  \ \"t1n\": \"BraTS-GLI-00001-000/BraTS-GLI-00001-000-t1n.nii.gz\",\n      \"t1c\": \"BraTS-GLI-00001-000/BraTS-GLI-00001-000-t1c.nii.gz\"\
  ,\n      \"t2w\": \"BraTS-GLI-00001-000/BraTS-GLI-00001-000-t2w.nii.gz\",\n      \"label\": \"BraTS-GLI-00001-000/BraTS-GLI-00001-000-seg.nii.gz\"\
  \n    }\n  ]\n}\n```\n\n## \U0001F6E0️ Usage\n\n### Training\nStart the training process by pointing\
  \ to your `dataset.json`. \n```bash\npython main.py train --dataset_json /path/to/dataset.json --output_dir\
  \ ./seg3d_out\n```\n\n**Key Arguments:**\n- `--epochs`: Number of training epochs (default: 100)\n-\
  \ `--batch_size`: Batch size (default: 2)\n- `--lr`: Learning rate (default: 1e-4)\n- `--roi_size`:\
  \ Spatial crop size for training (default: 128 128 128)\n- `--unc_every`: Run MC-dropout uncertainty\
  \ during validation every N epochs (default: 10).\n- `--class_weights`: Per-class loss weights for WT,\
  \ TC, ET (default: 1.0 1.0 2.0).\n\n### Evaluation\nEvaluate the trained model and automatically generate\
  \ multi-panel visualizations:\n```bash\npython main.py eval --checkpoint ./seg3d_out/best_model.pth\
  \ --output_dir ./seg3d_eval\n```\n\n**Key Arguments:**\n- `--mc_passes`: Number of stochastic forward\
  \ passes for evaluation (default: 15).\n- `--no_save_maps`: Flag to disable saving raw numpy arrays\
  \ of uncertainty maps.\n- `--no_save_viz`: Flag to skip generating and saving `.png` visual overlays.\n\
  \n## \U0001F4C4 License\nThis project is licensed under the MIT License.\n"

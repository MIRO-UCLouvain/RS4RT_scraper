readme_excerpt: "# Deep Learning Radiopathomic Model for Locally Advanced Nasopharyngeal Carcinoma\n\n\
  This repository contains the code and resources for the project titled **Deep Learning Radiopathomic\
  \ Model Based on Pretreatment MRI and Whole Slide Images for Predicting Overall Survival in Locally\
  \ Advanced Nasopharyngeal Carcinoma**. The project focuses on developing a multimodal fusion model for\
  \ prognosis prediction using Whole Slide Imaging (WSI) and Magnetic Resonance Imaging (MRI) data. \n\
  \n## Key Features\n1. Pretrained Model  \n   - We used a ResNet-50 model pretrained on ImageNet (PyTorch\
  \ implementation).  \n   - The model weights and implementation details are publicly available at [Hugging\
  \ Face](https://huggingface.co/microsoft/resnet-50).  \n\n2. Multimodal Fusion  \n   - a multimodal\
  \ feature fusion module integrated the WSI-level and MRI-level features. To achieve this, we first concatenated\
  \ the WSI-level and MRI-level features, combining the strengths of both modalities. We then employed\
  \ an MLP network to learn the interactions between these two types of features, enabling the model to\
  \ leverage the complementary information from WSIs and MRI.\n\n3. Prognosis Definition  \n   - The model\
  \ employs a Cox proportional hazards layer to handle survival data directly.  \n   - Risk scores were\
  \ dichotomized at the median to stratify patients into high-risk and low-risk groups.  \n\n\n## Repository\
  \ Structure\n```\nproject_repository/\n├── datasets/               # Directory for datasets (not included\
  \ due to privacy concerns)\n├── models/                 # Pretrained models and custom architecture\
  \ implementations\n├── splits/                 # Predefined data splits for training, validation, and\
  \ testing\n├── train.py                # Main script for training the model\n├── README.md         \
  \      # This file\n└── requirements.txt        # List of dependencies\n```\n\n## Usage Instructions\n\
  1. Install Dependencies  \n   Install the required dependencies using the following command:  \n   ```bash\n\
  \   pip install -r requirements.txt\n   ```\n\n2. Preprocessing  \n   - For pathology data, we use CLAM\
  \ to extract features and apply stain normalization.  \n   - For MRI data, we use Pyradiomics to extract\
  \ features.  \n\n3. Training  \n   Train the model using the provided training script:  \n   ```bash\n\
  \   python train.py --stage='train' --config='HPCH/LANPC.yaml' --gpus=0\n   ```\n\nWe hope this repository\
  \ will aid in reproducing our results and further research in this field. Thank you for your interest\
  \ in our work!\n\nFor more details about the ResNet-50 model, visit: [ResNet-50 Model on Hugging Face](https://huggingface.co/microsoft/resnet-50)\n"

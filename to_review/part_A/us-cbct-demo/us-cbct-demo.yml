readme_excerpt: "# Deformation-Aware CBCT Updating\r\n\r\nThis repository provides a inference demo for\
  \ **ultrasound-based deformation estimation** and **deformation-aware CBCT slice warping**.\r\n\r\n\r\
  \n## Overview\r\n\r\nIncluded scripts:\r\n\r\n- **`infer_us_flow.py`**: bidirectional ultrasound deformation\
  \ inference\r\n- **`infer_cbct_warp_from_us.py`**: CBCT slice warping using deformation estimated from\
  \ ultrasound\r\n- **`infer_utils.py`**: shared inference utilities (I/O, preprocessing, model loading,\
  \ warping)\r\n- **`stucorunet.py`**: network definition used for inference\r\n\r\n\r\n## Checkpoint\
  \ Selection\r\n\r\nThe `models/` directory contains three checkpoints corresponding to different motion\
  \ regimes (base / probe-induced / external-induced), consistent with the paper's model setup and fine-tuning\
  \ strategy.\r\n\r\n### Ultrasound-only demos (`examples/us/*`)\r\nUse the following checkpoints:\r\n\
  \r\n- `examples/us/1` → `models/base.pth`\r\n- `examples/us/2` → `models/base.pth`\r\n- `examples/us/3`\
  \ → `models/probe_induced.pth`\r\n- `examples/us/4` → `models/probe_induced.pth`\r\n- `examples/us/5`\
  \ → `models/base.pth`\r\n\r\n### CBCT warping demos (`examples/us_and_cbct/*`)\r\nUse:\r\n\r\n- `models/probe_induced.pth`\r\
  \n\r\n\r\n## Download Checkpoints (GitHub Releases)\r\n\r\nPretrained checkpoints are provided via **GitHub\
  \ Releases** as a single archive:\r\n\r\n- `models.zip`\r\n\r\n> Note: Release assets are **not downloaded\
  \ automatically** when cloning the repository.\r\n\r\nPlease download `models.zip`, extract it at the\
  \ repository root, and make sure it creates:\r\n\r\nmodels/\r\n  - `base.pth`\r\n  - `probe_induced.pth`\r\
  \n  - `external_induced.pth`\r\n\r\n## Requirements\r\n\r\n- Python 3.10+\r\n- PyTorch\r\n- OpenCV (`opencv-python`)\r\
  \n- NumPy\r\n"

readme_excerpt: "# tox21-toxicity-prediction-shap\nMulti-task toxicity prediction on the Tox21 dataset\
  \ using Random Forest and XGBoost, with SHAP-based interpretability mapping predictions to real chemical\
  \ substructures via RDKit.\n\n---\n\n# Machine Learning-Based Prediction and Structural Interpretation\
  \ of Tox21 Toxicity\n\n[![Python](https://img.shields.io/badge/Python-3.10-blue.svg)](https://www.python.org/)\n\
  [![RDKit](https://img.shields.io/badge/RDKit-2026.03.4-brightgreen.svg)](https://www.rdkit.org/)\n[![DeepChem](https://img.shields.io/badge/DeepChem-2.8.0-orange.svg)](https://deepchem.io/)\n\
  [![License: MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](LICENSE)\n\nPredicting chemical\
  \ toxicity directly from molecular structure using machine learning, benchmarked across all 12 Tox21\
  \ endpoints, with SHAP-based interpretability mapping model predictions back to real chemical substructures.\n\
  \n## Overview\n\nThis project combines a background in Analytical Chemistry with machine learning to\
  \ address a core problem in computational toxicology: predicting whether a chemical compound is likely\
  \ to be toxic, directly from its molecular structure, before physical lab testing.\n\nTwo tree-based\
  \ ensemble models (Random Forest and XGBoost) were trained and benchmarked across all 12 toxicity endpoints\
  \ in the **Tox21** dataset. For four mechanistically distinct endpoints, **SHAP (SHapley Additive exPlanations)**\
  \ was used to identify which molecular substructures most influenced each prediction, and **RDKit**\
  \ was used to map those substructures back to real, interpretable chemical structures.\n\n## Motivation\n\
  \nTraditional toxicity testing is slow, expensive, and often relies on animal testing. Computational\
  \ toxicology enables rapid, low-cost pre-screening of large chemical libraries, but a model that predicts\
  \ toxicity without explaining *why* offers limited value to a chemist. This project pairs predictive\
  \ benchmarking with genuine structural interpretability.\n\n## Dataset\n\n- **Source:** [Tox21](https://tripod.nih.gov/tox21/challenge/)\
  \ via [DeepChem's MoleculeNet](https://deepchem.io/)\n- **Compounds:** ~7,800\n- **Endpoints:** 12 (7\
  \ nuclear receptor assays, 5 stress response assays)\n- **Featurization:** 1024-bit Extended Connectivity\
  \ Fingerprints (ECFP, radius 2)\n- **Split:** Scaffold-based (stricter, more realistic than random split)\n\
  \n## Methodology\n\n1. **Data loading & featurization** — Tox21 loaded via DeepChem, scaffold split\
  \ applied\n2. **Multi-task benchmarking** — Random Forest and XGBoost trained independently per task\
  \ (12 tasks × 2 models)\n3. **Interpretability analysis** — SHAP TreeExplainer applied to 4 selected\
  \ tasks (NR-AhR, NR-AR, SR-p53, NR-ER-LBD)\n4. **Substructure mapping** — RDKit used to trace top SHAP-important\
  \ fingerprint bits back to real molecular substructures\n\n## \U0001F4CA Results\n\n### 12-Task Benchmark\
  \ (Random Forest vs. XGBoost)\n\n| Metric | Random Forest | XGBoost |\n|---|---|---|\n| Mean ROC-AUC\
  \ (12 tasks) | 0.703 | 0.714 |\n| Best task | NR-AR-LBD (0.848) | NR-AR-LBD (0.807) |\n| Weakest task\
  \ | NR-ER (0.603) | NR-PPAR-gamma (0.605) |\n\nFull per-task results: [`results/tox21_12task_benchmark.csv`](https://github.com/Uzo-Hill/tox21-toxicity-prediction-shap/blob/main/tox21_12task_benchmark.csv)\n\
  \n### Deep-Dive Interpretability (4 Tasks)\n\n| Task | Biological Category | RF ROC-AUC | Dominant Substructure\
  \ Theme |\n|---|---|---|---|\n| NR-AhR | Nuclear Receptor | 0.796 | Nitrogen-rich groups (amines, sulfonamide,\
  \ lactone) |\n| SR-p53 | Stress Response | 0.752 | Aromatic/electrophilic motifs (nitrile-aromatic,\
  \ O-heterocycles) |\n| NR-AR | Nuclear Receptor | 0.734 | N-heterocycles and carbonyls (imidazole, hydantoin)\
  \ |\n| NR-ER-LBD | Nuclear Receptor | 0.626 | Mixed/noisy (includes spurious organometallic outlier)\
  \ |\n\n**Key finding:** The top 5 SHAP-identified fingerprint bits were entirely non-overlapping across\
  \ all four tasks — model predictions were driven by mechanistically distinct chemistry per receptor.\
  \ Notably, explanation coherence tracked model performance: the weakest-performing task also produced\
  \ the least chemically plausible SHAP output.\n\n## Figures\n\n\n| NR-AhR | NR-AR |\n|---|---|\n| ![NR-AhR](https://github.com/Uzo-Hill/tox21-toxicity-prediction-shap/blob/main/all_substructures_grid_NRAhR.png)\
  \ | ![NR-AR](https://github.com/Uzo-Hill/tox21-toxicity-prediction-shap/blob/main/all_substructures_grid_NRAR.png)\
  \ |\n\n| SR-p53 | NR-ER-LBD |\n|---|---|\n| ![SR-p53](https://github.com/Uzo-Hill/tox21-toxicity-prediction-shap/blob/main/all_substructures_grid_SRp53.png)\
  \ | ![NR-ER-LBD](https://github.com/Uzo-Hill/tox21-toxicity-prediction-shap/blob/main/all_substructures_grid_NRERLBD.png)\
  \ |\n\n## Repository Structure\n\n```\ntox21-toxicity-prediction-shap/\n├── README.md\n├── LICENSE\n\
  ├── requirements.txt\n├── notebooks/\n│   └── tox21_shap_analysis.ipynb\n├── figures/\n├── results/\n\
  └── paper/\n    └── tox21_paper_draft.docx\n```\n\n## Installation & Usage\n\n```bash\n# Clone the repository\n\
  git clone https://github.com/Uzo-Hill/tox21-toxicity-prediction-shap.git\ncd tox21-toxicity-prediction-shap\n\
  \n# Create and activate a conda environment\nconda create -n tox21_env python=3.10 -y\nconda activate\
  \ tox21_env\n\n# Install RDKit\npip install rdkit\n\n# Install remaining dependencies\npip install -r\
  \ requirements.txt\n\n# Launch the notebook\njupyter lab\n```\n\n## Requirements\n\n```\ndeepchem==2.8.0\n\
  torch\nscikit-learn\nxgboost\nshap\npandas\nnumpy\nmatplotlib\nseaborn\njupyter\nipykernel\n```\n\n\
  ## Limitations\n\n- SHAP sample size limited to n=50 per task for computational tractability\n- Single\
  \ scaffold-based train/test split (no repeated cross-validation)\n- XGBoost SHAP values not computed\
  \ due to a library version incompatibility (XGBoost 3.x vs. installed SHAP release)\n\nSee the full\
  \ paper for a complete discussion of limitations and future work.\n\n## Paper\n\nThe full research paper\
  \ draft is available at [`paper/tox21_paper_draft.docx`](paper/tox21_paper_draft.docx).\n\n## Citation\n\
  \nIf you use this work, please cite:\n\n```\nUzoh, C. H. (2026). Machine Learning-Based Prediction and\
  \ Structural \nInterpretation of Nuclear Receptor and Stress Response Toxicity Using \nthe Tox21 Dataset.\
  \ [Preprint/Repository].\n```\n\n## License\n\nThis project is licensed under the MIT License — see\
  \ the [LICENSE](LICENSE) file for details.\n\n## \U0001F464 Author\n\n**Chukwudum Hillary Uzoh**\n\n\
  Data Scientist & AI Engineer | Analytical & Industrial Chemistry background\n\n[LinkedIn](https://www.linkedin.com/in/hillaryuzoh/)\

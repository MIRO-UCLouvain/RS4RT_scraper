readme_excerpt: "# Lung Cancer Classification with a Hybrid Deep Learning Model\n\nA hybrid deep learning\
  \ pipeline that enhances lung cancer prediction accuracy by fusing domain-specific Radiomics features\
  \ with learned ResNet101 features.\n\n![Project Workflow](./.data/Workflow-Diagram.png)\n\n## Tech Stack\n\
  \n![Python](https://img.shields.io/badge/Python-3776AB?style=for-the-badge&logo=python&logoColor=white)![TensorFlow](https://img.shields.io/badge/TensorFlow-FF6F00?style=for-the-badge&logo=tensorflow&logoColor=white)![Keras](https://img.shields.io/badge/Keras-D00000?style=for-the-badge&logo=keras&logoColor=white)![Scikit-learn](https://img.shields.io/badge/scikit--learn-F7931E?style=for-the-badge&logo=scikit-learn&logoColor=white)![Pandas](https://img.shields.io/badge/pandas-150458?style=for-the-badge&logo=pandas&logoColor=white)![Jupyter](https://img.shields.io/badge/Jupyter-F37626?style=for-the-badge&logo=Jupyter&logoColor=white)\n\
  \n## Project Description\n\nLung cancer is a leading cause of cancer-related deaths worldwide. Early\
  \ and accurate detection of malignant lung nodules is critical for improving patient survival rates.\
  \ This project creates a robust machine learning pipeline to automatically classify lung nodules from\
  \ CT scans.\n\nThe core innovation lies in a **hybrid feature engineering approach**, proving that combining\
  \ domain-specific medical features with deep learning features results in a more accurate and reliable\
  \ predictive model.\n\n## Key Technical Highlights\n\n- **Hybrid Feature Engineering:** The model's\
  \ success comes from fusing two distinct feature sets:\n\n  - **Handcrafted Radiomics Features:** Over\
  \ 100 quantitative features describing tumor shape, intensity, and texture were extracted using `Pyradiomics`.\
  \ These represent established, domain-specific medical knowledge.\n  - **Learned Deep Learning Features:**\
  \ A `ResNet101` CNN was used to automatically learn and extract high-level, abstract features from the\
  \ image data.\n    The final model uses a concatenated vector of **221 features** to make its prediction.\n\
  \n- **Transfer Learning for Medical Imaging:** Recognizing that medical imaging datasets are often limited,\
  \ a **pre-trained ResNet101 model** was **fine-tuned** on a relevant dataset to adapt its learned representations\
  \ to the medical imaging domain.\n\n- **Complex Data Pipeline Management:** The project involved a complete,\
  \ end-to-end data workflow, handling complex and non-standard data formats including:\n  - Parsing raw\
  \ medical image data from the LIDC-IDRI dataset using specialized tools like `pylidc`.\n  - Converting\
  \ complex `DICOM` files to `NRRD` format for processing.\n  - Performing crucial preprocessing steps\
  \ like image segmentation, grayscale conversion to Hounsfield Units, and histogram normalization.\n\n\
  ## Results & Conclusion\n\n| Features Used         | Model Accuracy |\n| --------------------- | :------------:\
  \ |\n| Radiomics Only        |     86.21%     |\n| ResNet101 Only        |     70.69%     |\n| **Hybrid\
  \ (Combined)** |   **89.66%**   |\n\n**Key Insight:** The results clearly validate the project's central\
  \ hypothesis. The hybrid model, which leverages both domain-specific knowledge (Radiomics) and automated\
  \ feature learning (ResNet101), **significantly outperformed** either individual approach.\n\n## Getting\
  \ Started\n\n### Prerequisites\n\n- Anaconda\n- Git\n\n### Installation & Setup\n\n1.  **Clone the repository:**\n\
  \    ```sh\n    git clone https://github.com/devo-id/Lung-Nodules-classification-based-on-Radiomics-and-ResNet101.git\n\
  \    cd Lung-Nodules-classification-based-on-Radiomics-and-ResNet101\n    ```\n2.  **Create and activate\
  \ a conda environment:**\n    ```sh\n    conda create -n lung_cancer_project python=3.8\n    conda activate\
  \ lung_cancer_project\n    ```\n3.  **Install the required dependencies from the consolidated file:**\n\
  \    ```sh\n    pip install -r requirements.txt\n    ```\n4.  **Download the Data:** The LIDC-IDRI dataset\
  \ is required. Please follow the download instructions available at [The Cancer Imaging Archive](https://www.cancerimagingarchive.net/collection/lidc-idri/)\
  \ and place the data in the appropriate directory as referenced in the notebooks.\n\n### Running the\
  \ Pipeline\n\nThe project is organized into Jupyter Notebooks that should be run sequentially to replicate\
  \ the pipeline, from preprocessing to final results analysis. Please refer to the folder structure and\
  \ notebook names for the correct order.\n"

readme_excerpt: "# Brain Health - Final Year Project\n\nThis project integrates a **React/Vite Frontend**\
  \ with a **FastAPI Deep Learning Backend** (U-Net for brain tumor segmentation and Mask-RCNN for detection).\
  \ It provides a full-stack, production-ready pipeline for analyzing MRI scans.\n\n## Project Structure\n\
  - `Brain-health_frontend/` - Modern React application with Tailwind CSS and Framer Motion.\n- `Brain-Tumor-Detection-and-Segmentation-using-Deep-Learning/`\
  \ - Python deep learning models and the FastAPI backend (`app.py`).\n\n## Quick Start (Windows)\nWe\
  \ have provided an automated batch script to install dependencies and run both the frontend and backend\
  \ servers.\n\n1. Double-click the `run.bat` file in this directory.\n2. The script will automatically\
  \ open two terminal windows:\n   - One for the **FastAPI Backend** (runs on port `8000`).\n   - One\
  \ for the **React Frontend** (runs on port `8080` or `5173`).\n3. Open the frontend address in your\
  \ browser (e.g. `http://localhost:8080`).\n\n> **Note**: For the backend to work, ensure you have Python\
  \ 3.8+ installed. For the frontend, ensure you have Node.js 18+ installed.\n\n## Features\n- **Upload\
  \ MRI Scans**: Upload PNG or NIfTI MRI slices.\n- **U-Net Segmentation**: Get detailed segmentations\
  \ indicating tumor probability maps.\n- **FastAPI Wrapper**: Connects raw deep learning model predictions\
  \ reliably to the UI.\n\n## Testing & Submission\nTo verify the application:\n1. Start the project using\
  \ `run.bat`.\n2. Click \"Get Started\" and choose simple Segmentation.\n3. Upload an MRI image slice\
  \ (`.png`) from the dataset.\n4. The system will contact the backend API (`http://localhost:8000/api/analyze`),\
  \ process the image via U-Net, and return the color-mapped segmentation result directly to the Results\
  \ page.\n"

readme_excerpt: "# [Robotic CBCT Meets Robotic Ultrasound (IPCAI 2025 paper)](https://link.springer.com/article/10.1007/s11548-025-03336-x)\n\
  \n**Authors: Feng Li\\*, Yuan Bi\\*, Dianye Huang, Zhongliang Jiang, Nassir Navab**\n\n**CAMP, Technical\
  \ University of Munich**\n\n**Munich Center for Machine Learning, Munich, Germany**\n\n## Abstract\n\
  \n**Purpose:** The multi-modality imaging system offers optimal fused images for safe and precise interventions\
  \ in modern clinical practices, such as computed tomography - ultrasound (CT-US) guidance for needle\
  \ insertion. However, the limited dexterity and mobility of current imaging devices hinder their integration\
  \ into standardized workflows and the advancement toward fully autonomous intervention systems. In this\
  \ paper, we present a novel clinical setup where robotic cone beam computed tomography (CBCT) and robotic\
  \ US are pre-calibrated and dynamically co-registered, enabling new clinical applications. This setup\
  \ allows registration-free rigid registration, facilitating multi-modal guided procedures in the absence\
  \ of tissue deformation.\n**Methods:** First, a one-time pre-calibration is performed between the systems.\
  \ To ensure a safe insertion path by highlighting critical vasculature on the 3D CBCT, SAM2 segments\
  \ vessels from B-mode images, using the Doppler signal as an autonomously generated prompt. Based on\
  \ the registration, the Doppler image or segmented vessel masks are then mapped onto the CBCT, creating\
  \ an optimally fused image with comprehensive detail. To validate the system, we used a specially designed\
  \ phantom, featuring lesions covered by ribs and multiple vessels with simulated moving flow.\n**Results:**\
  \ The mapping error between US and CBCT resulted in an average deviation of 1.72 ± 0.62 mm. A user study\
  \ demonstrated the effectiveness of CBCT-US fusion for needle insertion guidance, showing significant\
  \ improvements in time efficiency, accuracy, and success rate. Needle intervention performance improved\
  \ by approximately 50% compared to the conventional US-guided workflow. **Conclusion:** We present the\
  \ first robotic dual-modality imaging system designed to guide clinical applications. The results show\
  \ significant performance improvements compared to traditional manual interventions.\n\n## Pipeline\n\

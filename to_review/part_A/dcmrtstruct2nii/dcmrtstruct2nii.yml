readme_excerpt: "[![DOI](https://zenodo.org/badge/DOI/10.5281/zenodo.4037864.svg)](https://doi.org/10.5281/zenodo.4037864)\n\
  ![unit tests](https://github.com/Sikerdebaard/dcmrtstruct2nii/workflows/Unit%20Tests/badge.svg)\n  \n\
  \n# dcmrtstruct2nii\nDICOM RT-Struct to nii-mask. This is a naïve approach to rasterizing rt-struct\
  \ to masks in nii format. If there's holes in your RT-Struct then this approach will most likely not\
  \ work. The RT-Struct needs to be within the bounds of the slices of the original DICOM. Rasterization\
  \ is done on a slice-by-slice basis, interpolation between slices is currently unsupported.\n\n# Interpolation\n\
  Interpolation of the mask between slices is currently unsupported. Send us an algorithm or a pull requests\
  \ and we'll happly add it.\n\n# Input file format\nThe DICOM and RT-Struct inputs need to be unzipped\
  \ in a directory. Currently this is the only way to read the input files.\n\n# CLI Tool\n```\n# install\
  \ using pip and show tool help\npip install dcmrtstruct2nii\ndcmrtstruct2nii --help\n\n# list structures\
  \ in DICOM RT Struct\ndcmrtstruct2nii ls -r /path/to/rtstruct/file\n\n# convert help output\ndcmrtstruct2nii\
  \ convert --help\n\n# convert DICOM RT Structs to .nii.gz masks\ndcmrtstruct2nii convert -r /path/to/rtstruct/file.dcm\
  \ -d /path/to/original/extracted/dicom -o /output/path\n```\n\n# Python API\n```\n# install using pip\
  \ and show tool help\npip install dcmrtstruct2nii\n```\n\n```\n# lets test it\nfrom dcmrtstruct2nii\
  \ import dcmrtstruct2nii, list_rt_structs\n\nprint(list_rt_structs('/path/to/dicom/rtstruct/file.dcm'))\n\
  \ndcmrtstruct2nii('/path/to/dicom/rtstruct/file.dcm', '/path/to/original/extracted/dicom/files', '/output/path')\n\
  ```\n\n# License and academic use\n\nThe software is licensed [MIT License](https://github.com/Sikerdebaard/dcmrtstruct2nii/blob/master/LICENSE).\n\
  \nFor academic use, use a presistent copy from [![DOI](https://zenodo.org/badge/DOI/10.5281/zenodo.4037864.svg)](https://doi.org/10.5281/zenodo.4037864).\
  \ \n\nPlease cite:\n\n```Thomas Phil, Thomas Albrecht, Skylar Gay, & Mathis Ersted Rasmussen. (2023).\
  \ Sikerdebaard/dcmrtstruct2nii: dcmrtstruct2nii v5 (Version v5). Zenodo. https://doi.org/10.5281/zenodo.4037864```\n"

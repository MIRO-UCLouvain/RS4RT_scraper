readme_excerpt: "# Bayesian–Hybrid Inference Simulation\n\nThis repository provides code to implement\
  \ and evaluate a hybrid Bayesian–frequentist regression framework, with a focus on estimating **β₁**\
  \ (bayesian parameter) under varying data and prior conditions.\n\n---\n\n## Repository Structure\n\n\
  - **`updated_function7.R`**  \n  Core estimation function implementing:\n  - Frequentist regression\n\
  \  - Bayesian regression with informative prior\n  - Hybrid Bayesian–frequentist estimation\n  - Conditional\
  \ and unconditional variance estimators\n\n- **`Beta1Simulation_3.R`**  \n  Simulation script to evaluate\
  \ estimator performance across multiple scenarios.\n\n---\n\n## Requirements\n\n- R (version ≥ 4.0)\n\
  \nInstall required packages:\n```r\ninstall.packages(c(\"officer\", \"flextable\"))\n```\n\n---\n\n\
  ## Running the Code\n\n### Option 1: Set Working Directory (Recommended)\n\nSet your working directory\
  \ to the folder containing the repository files:\n\n```r\nsetwd(\"path_to_your_folder\")\n```\n\nThen\
  \ run:\n\n```r\nsource(\"updated_function7.R\")\nsource(\"Beta1Simulation_3.R\")\n```\n\n---\n\n###\
  \ Option 2: Without Setting Working Directory\n\nIf you prefer not to set a working directory, ensure\
  \ both `.R` files are in the same folder and run:\n\n```r\nsource(\"full_path/updated_function7.R\"\
  )\nsource(\"full_path/Beta1Simulation_3.R\")\n```\n\n---\n\n## Output\n\nRunning the simulation will\
  \ generate:\n\n- Console summaries for all simulation scenarios\n- A Word document:\n\n```\nFinal_Simulation_Results5.docx\n\
  ```\n\nThis file contains:\n- Mean (SD) of **β₁** estimates  \n- Median [Q1, Q3] of standard errors\
  \  \n\n---\n\n## Computational Considerations\n\nThe simulation is computationally intensive.\n\n- Each\
  \ scenario involves 10,000 Monte Carlo replications  \n- A total of 36 scenarios are evaluated across\
  \ combinations of sample size, outcome variance, prior variance, and true effect size  \n- The hybrid\
  \ estimation procedure includes iterative updates (100 iterations per replication)\n\nAs a result, the\
  \ full simulation may take several hours to complete depending on system specifications.\n\nFor exploratory\
  \ runs, users may reduce the number of simulations (`n_sim`) in `Beta1Simulation_3.R`; final results\
  \ should be generated using the full simulation size.  \n\n---\n\n## Reproducibility\n\nA fixed randomization\
  \ seed is used:\n\n```r\nset.seed(2025)\n```\n\nRunning the code with the same seed will reproduce identical\
  \ results.\n\n---\n\n## Notes\n\n- The simulation evaluates performance across combinations of:\n  -\
  \ Sample size\n  - Outcome variance\n  - Prior variance\n  - True effect size\n- All computations are\
  \ fully self-contained within the provided scripts.\n- No additional data input is required.\n\n---\n\
  \n## Citation\n\nIf this code is used, please cite the associated manuscript.\n\n---\n\n## Contact\n\
  \nFor questions regarding the implementation, please contact the authors.\n"

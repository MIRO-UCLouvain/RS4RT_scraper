readme_excerpt: "<p align=\"center\">\n  <img src=\"assets/banner.svg\" alt=\"The Bill Coleman Project\"\
  \ width=\"100%\"/>\n</p>\n\n<p align=\"center\">\n  <img src=\"https://img.shields.io/badge/status-active%20research-4a90d9?style=flat-square\"\
  \ alt=\"Status\"/>\n  <img src=\"https://img.shields.io/badge/python-3.10%2B-blue?style=flat-square&logo=python&logoColor=white\"\
  \ alt=\"Python\"/>\n  <img src=\"https://img.shields.io/badge/license-MIT-green?style=flat-square\"\
  \ alt=\"License\"/>\n  <img src=\"https://img.shields.io/badge/domain-computational%20oncology-9b59b6?style=flat-square\"\
  \ alt=\"Domain\"/>\n  <img src=\"https://img.shields.io/badge/ML-PyTorch%20%7C%20Scikit--learn-ee4c2c?style=flat-square&logo=pytorch&logoColor=white\"\
  \ alt=\"ML\"/>\n</p>\n\n---\n\n<p align=\"center\">\n  <em>\"This is not an abstract research interest.\
  \ This is a wound that became a question.\"</em>\n</p>\n\n---\n\n## Dedication\n\n<table>\n<tr>\n<td\
  \ width=\"180px\">\n\n<!-- Replace the line below with: ![Bill Coleman](assets/bill.jpg) once you add\
  \ his photo to assets/ -->\n<img src=\"\\assets\\bill.png\" alt=\"Bill Coleman\" width=\"160\"/>\n\n\
  </td>\n<td>\n\n**Bill J. Coleman**\n<br/>October 5, 1965 — April 10, 2026\n<br/>Minnesota\n\n<br/>He\
  \ came into my life when I was 8 years old and stayed for 26 years.\n<br/>Star Wars fan. Bird watcher.\
  \ Lover of dogs. Strong heart until the very end.\n\n<br/><br/>Bill was diagnosed with small cell lung\
  \ cancer in 2025. He was told there was not much time. Seeking hope, he pursued immunotherapy treatment\
  \ at City of Hope. The treatment damaged his lungs. He passed away on April 10, 2026. He was 60 years\
  \ old.\n\n<br/><br/><em>This project is for him, and for everyone who sat in a waiting room and heard\
  \ there wasn't much time.</em>\n\n</td>\n</tr>\n</table>\n\n---\n\n## Why This Exists\n\nSmall cell\
  \ lung cancer (SCLC) is one of the most aggressive and deadliest cancers known to medicine. The five-year\
  \ survival rate is approximately **7%**. Most patients are diagnosed at extensive stage, meaning the\
  \ cancer has already spread because early detection is genuinely hard. The signals are subtle. The window\
  \ is narrow. And by the time a patient walks into a clinic with symptoms, time is already short.\n\n\
  The Bill Coleman Project is a research initiative at the intersection of **machine learning and clinical\
  \ oncology**. It has two goals:\n\n- \U0001F52C **Early Detection**: Improve AI-driven detection of\
  \ SCLC from medical imaging before it reaches extensive stage\n- \U0001F48A **Toxicity Prediction**:\
  \ Predict immunotherapy-induced pulmonary toxicity before treatment begins to prevent the lung damage\
  \ that compounds an already devastating diagnosis\n\n---\n\n## The Problem\n\n### Early Detection\n\n\
  SCLC is fast-moving. Between 60–70% of patients are diagnosed at extensive stage. At limited stage,\
  \ 5-year survival climbs to **15–30%**. The difference between those two numbers is the difference between\
  \ time and no time.\n\nCurrent detection relies on low-dose CT screening, but SCLC's rapid doubling\
  \ time and subtle early imaging features make it easy to miss. AI models trained on large clinical imaging\
  \ datasets have the potential to identify patterns that radiologists cannot consistently detect, catching\
  \ the disease at a stage where intervention still meaningfully changes outcomes.\n\n<p align=\"center\"\
  >\n  <img src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5d/Small_cell_carcinoma_of_the_lung.jpg/320px-Small_cell_carcinoma_of_the_lung.jpg\"\
  \ alt=\"Small Cell Lung Cancer CT\" width=\"320\"/>\n  <br/>\n  <sub><em>Small cell lung carcinoma —\
  \ public domain, Wikimedia Commons</em></sub>\n</p>\n\n### Immunotherapy-Induced Pulmonary Toxicity\n\
  \nCheckpoint inhibitor immunotherapy has become a standard treatment for SCLC. But immune-related adverse\
  \ events, particularly **pneumonitis** (inflammation of lung tissue) are a serious and sometimes fatal\
  \ complication.\n\nPredicting which patients will develop severe pulmonary toxicity before treatment\
  \ starts is an **open clinical problem**. A model that identifies high-risk patients could:\n- Inform\
  \ treatment decisions before they are made\n- Change dosing protocols for at-risk individuals\n- Prevent\
  \ the treatment-induced deterioration that compounds an already devastating diagnosis\n\n---\n\n## Research\
  \ Questions\n\n1. Can a deep learning model trained on CT imaging data detect SCLC at **earlier stages**\
  \ than current clinical workflows?\n2. What imaging and clinical features are most predictive of SCLC\
  \ versus non-small cell lung cancer (NSCLC) at first presentation?\n3. Can a multimodal model combining\
  \ imaging, EHR data, and biomarkers — **predict severe immunotherapy-induced pulmonary toxicity** before\
  \ treatment begins?\n4. What does the longitudinal imaging trajectory of SCLC look like computationally,\
  \ and can **progression rate** be predicted from early scans?\n\n---\n\n## Pipeline Architecture\n\n\
  ### Thread 1 — Early Detection\n\n```mermaid\nflowchart LR\n    A[CT / PET Scan\\nDICOM Input] --> B[Preprocessing\\\
  nNormalization + Lung Segmentation]\n    B --> C[Nodule Extraction\\nRegion of Interest]\n    C -->\
  \ D[Deep Learning Model\\n3D CNN / Vision Transformer]\n    D --> E[Classification\\nSCLC vs NSCLC vs\
  \ Benign]\n    E --> F[Validation\\nAUC-ROC, Sensitivity/Specificity]\n```\n\n### Thread 2 — Toxicity\
  \ Prediction\n\n```mermaid\nflowchart LR\n    A[Pre-Treatment Data\\nCT + EHR + Biomarkers] --> B[Multimodal\
  \ Fusion\\nFeature Engineering]\n    B --> C[Predictive Model\\nGradient Boosting / Neural Net]\n  \
  \  C --> D[Risk Score\\nToxicity Probability]\n    D --> E[Validation\\nClinical Outcomes]\n```\n\n\
  ---\n\n## Technical Approach\n\n### Thread 1 — Detection\n\n| Stage | Method |\n|---|---|\n| **Data**\
  \ | Low-dose CT scans, PET imaging (Mayo Clinic / public datasets) |\n| **Preprocessing** | DICOM normalization,\
  \ lung segmentation, nodule extraction |\n| **Modeling** | 3D CNN, Vision Transformer (ViT), ensemble\
  \ approaches |\n| **Validation** | AUC-ROC, sensitivity/specificity at clinical thresholds |\n| **Comparison**\
  \ | Benchmark against radiologist performance and existing CAD tools |\n\n### Thread 2 — Immunotherapy\
  \ Toxicity Prediction\n\n| Stage | Method |\n|---|---|\n| **Data** | EHR data, pre-treatment CT, biomarkers,\
  \ treatment records |\n| **Preprocessing** | Multimodal fusion, missing data handling, feature engineering\
  \ |\n| **Modeling** | Gradient boosting, multimodal neural networks, survival models |\n| **Outcome**\
  \ | Binary toxicity classification + severity grading |\n| **Validation** | Prospective validation against\
  \ clinical outcomes |\n\n---\n\n## Datasets\n\n| Dataset | Description |\n|---|---|\n| **LIDC-IDRI**\
  \ | Lung Image Database Consortium — 1,018 CT scans with radiologist annotations |\n| **NLST** | National\
  \ Lung Screening Trial — low-dose CT screening data |\n| **TCIA** | The Cancer Imaging Archive — multiple\
  \ lung cancer collections |\n| **PhysioNet** | Supplementary clinical and physiological data |\n\n>\
  \ Clinical data access through Mayo Clinic institutional partnership *(future phase)*\n\n---\n\n## Project\
  \ Status\n\n| Component | Status |\n|---|---|\n| Literature review | \U0001F504 In progress |\n| Dataset\
  \ acquisition | \U0001F504 In progress |\n| Preprocessing pipeline | \U0001F4CB Planned |\n| Baseline\
  \ detection model | \U0001F4CB Planned |\n| Toxicity prediction model | \U0001F4CB Planned |\n| Validation\
  \ & benchmarking | \U0001F4CB Planned |\n\n---\n\n## Connection to Broader Research\n\nThe Bill Coleman\
  \ Project exists alongside a parallel research thread:\n\n**[cortex-unsupervised](https://github.com/ssommera/cortex-unsupervised)**\
  \ — an unsupervised EEG neural state discovery pipeline exploring the computational dynamics of consciousness\
  \ and neural state boundaries.\n\nTogether, these projects represent two sides of the same research\
  \ question:\n\n> *What happens to a person on the way out and could we have done more on the way in?*\n\
  \n---\n\n## Installation\n\n```bash\ngit clone https://github.com/ssommera/Bill_Coleman_Project.git\n\
  cd Bill_Coleman_Project\npip install -r requirements.txt\n```\n\n---\n\n## License\n\nMIT License. All\

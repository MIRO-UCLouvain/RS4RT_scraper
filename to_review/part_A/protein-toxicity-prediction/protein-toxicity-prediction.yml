readme_excerpt: "# Protein-toxicity-prediction\n\nThis project implements a machine learning pipeline\
  \ for predicting protein toxicity using ProtT5 embeddings and LightGBM classifier. The model achieves\
  \ high accuracy in distinguishing between toxic and non-toxic proteins.\n\n## Overview\n\nThe project\
  \ uses state-of-the-art protein language models (ProtT5) to generate embeddings from protein sequences,\
  \ followed by a LightGBM classifier for toxicity prediction. The pipeline includes:\n\n- Protein sequence\
  \ embedding generation using ProtT5\n- Feature selection using Fisher scores\n- Hyperparameter optimization\
  \ for LightGBM\n- Comprehensive model evaluation using multiple metrics\n\n## Repository Contents\n\n\
  `Protein_toxixcity_prediction.ipynb`:  \nEnd-to-end pipeline including embedding extraction, model training\
  \ (LightGBM as the final model), and evaluation.\n\n## Model Architecture\n\n1. **Embedding Generation**\n\
  \   - Uses the pretrained ProtT5 to generate protein sequence embeddings, which captures rich sequence\
  \ information learned from large-scale protein databases.\n\n2. **Feature Selection**\n   - Implements\
  \ Fisher score-based feature selection\n   - Selects the top 512 most informative features\n\n3. **Classification**\n\
  \   - LightGBM classifier with optimized hyperparameters:\n     - num_leaves: 100\n     - n_estimators:\
  \ 200\n     - min_data_in_leaf: 50\n     - max_depth: 100\n     - learning_rate: 0.1\n     - bagging_fraction:\
  \ 0.5\n## Data\n\nThe model uses protein sequences in FASTA format, with binary labels indicating toxicity:\n\
  - Positive samples: Toxic proteins\n- Negative samples: Non-toxic proteins\n\n## Evaluation Metrics\n\
  \nModels are evaluated using the following metrics on the test set:  \n- Sensitivity (Recall of the\
  \ positive class)  \n- Specificity (Recall of the negative class)  \n- Accuracy  \n- Area Under the\
  \ ROC Curve (AUC) — overall model discrimination ability  \n- Matthews Correlation Coefficient (MCC)\
  \ — balanced measure accounting for all confusion matrix elements\n\n## How to Proceed and Run the Notebook\n\
  \n1. **Clone the repository:**\n\n```bash\ngit clone https://github.com/faezesarlifar/Protein-toxicity-prediction.git\n\
  cd Protein-toxicity-prediction\n```\n\n2. Launch Jupyter Notebook:\n\n```bash\njupyter notebook Protein_toxixcity_prediction.ipynb\n\
  ```\n\n4. **Extract ProtT5 Embedding Vectors:**\n\n- Run the cell(s) that extract ProtT5 embeddings\
  \ from protein sequences using the provided command.  \n- Embeddings will be saved as `.h5` files to\
  \ disk.  \n- GPU acceleration is recommended for faster extraction.\n\n> **⚠️ Note:** You can also use\
  \ the already extracted embedding vectors available in the `data` folder:  \n> `negative_main_emb_ProtT5.h5`\
  \ and `posititive_main_emb_ProtT5.h5`.\n5. **Specify Embedding Location:**\n\n- Update the notebook\
  \ cell that loads embedding vectors to point to the `.h5` file(s) you generated or to the provided files\
  \ in the `data` directory.\n\n6. **Run Training and Evaluation Cells:**\n\n- Train the LightGBM classifier\
  \ using the loaded embeddings.  \n- Evaluate performance with sensitivity, specificity, accuracy, AUC,\
  \ and MCC.\n"

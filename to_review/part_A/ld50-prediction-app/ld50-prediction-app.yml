readme_excerpt: "# Molecular Toxicity Prediction Web App\n\nA Streamlit web application for predicting\
  \ LD50 toxicity of chemical compounds from SMILES strings using a trained Chemprop model.\n\n## Features\n\
  \n- \U0001F9EA **Toxicity Prediction**: Predicts LD50 values from SMILES strings\n- \U0001F4DD **Manual\
  \ Input**: Enter SMILES strings directly in the web interface\n- \U0001F4CA **CSV Upload**: Upload a\
  \ CSV file containing multiple SMILES strings\n- ✅ **SMILES Validation**: Automatically validates input\
  \ SMILES strings\n- \U0001F4E5 **Export Results**: Download predictions as CSV\n\n\n## Installation\n\
  \n1. Install the required dependencies:\n```bash\npip install -r requirements.txt\n```\n\n## Usage\n\
  \n1. Navigate to the streamlit directory:\n```bash\ncd /your/project/directory\n```\n\n2. Run the Streamlit\
  \ app:\n```bash\nstreamlit run app.py\n```\n\n3. The app will open in your default web browser (usually\
  \ at http://localhost:8501)\n\n## Input Methods\n\n### Manual Input\n- Enter one SMILES string per line\
  \ in the text area\n- Example:\n  ```\n  CCC\n  CCCC\n  OCC\n  ```\n\n### CSV Upload\n- Upload a CSV\
  \ file containing SMILES strings\n- Select the column that contains the SMILES data\n- The app will\
  \ automatically process all valid SMILES\n\n## Output\n\nThe application provides:\n- **-log(LD50/MW)**:\
  \ Raw model prediction\n- **LD50 (mg/kg)**: Converted toxicity value\n- **Molecular Weight**: Calculated\
  \ molecular weight\n- **Summary Statistics**: Average, min, and max LD50 values\n- **Downloadable CSV**:\
  \ Results can be exported for further analysis\n\n## Understanding LD50 Values\n\n- **Lower LD50** =\
  \ **Higher Toxicity** (more dangerous)\n- **Higher LD50** = **Lower Toxicity** (less dangerous)\n\n\
  ### Toxicity Classification according to OECD:\n- Extremely toxic: LD50 < 5 mg/kg\n- Highly toxic: LD50\
  \ 5-50 mg/kg\n- Moderately toxic: LD50 50-500 mg/kg\n- Slightly toxic: LD50 500-5000 mg/kg\n- Practically\
  \ non-toxic: LD50 > 5000 mg/kg\n\n## Model Information\n\nThe predictions are made using a Chemprop\
  \ graph neural network model with:\n- RDKit 2D normalized features\n- Trained on ICE v4 toxicity data\n\
  - Predicts -log(LD50/MW) which is converted to LD50 (mg/kg)\n\n## Files\n\n- `app.py`: Main Streamlit\
  \ application\n- `model.pt`: Trained Chemprop model checkpoint\n- `requirements.txt`: Python dependencies\n\
  - `tmp.ipynb`: Original notebook with model prediction code\n\n"

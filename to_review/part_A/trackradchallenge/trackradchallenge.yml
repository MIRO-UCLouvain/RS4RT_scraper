readme_excerpt: "# TrackRAD 2025\n\n> TrackRAD2025's organizers welcome you on the challenge repository.\
  \ The challenge plattform will open for the preliminary test phase on June 1st 2025, according to the\
  \ timeline.\n\n![screenshot](images/header.jpeg)\n\nClick [here](https://trackrad2025.grand-challenge.org/)\
  \ to go to the challenge website and participate.\n\n## Contents\n\nThis repository contains:\n\n- A\
  \ **baseline algorithm** (`baseline-algorithm/`) to the TrackRAD challenge as a starting point.\n- An\
  \ example **datasets** (`dataset/`), following the format of the labeled TrackRAD dataset as well as\
  \ a recommended folder structure for the TrackRAD datasets.\n- The **evaluation** code (`evaluation/`)\
  \ used for evaluating submissions, including a compact and fast custom implementation of the metrics.\n\
  - A [**testing-script**](test-algorithm.sh) (`test-algorithm.sh`) allowing for a local evaluation and\
  \ testing.\n- The content of the TrackRAD2025 website on [grand-challenge.org](trackrad2025.grand-challenge.org).\n\
  - A number of miscellaneous **scripts** (`scripts/`) including those to convert proprietary cine MRI\
  \ formats from both vendors into metadata files and **images/assets** (`images/`).\n\n\n## (Preliminary)\
  \ Timeline\n\n- Challenge website open: 15/12/2024\n- Release training cases: 15/03/2025\n- Start of\
  \ challenge - Training phase: 15/03/2025 - 15/08/2025\n- Preliminary testing phase (10 submissions per\
  \ team): 01/06/2025 - 15/08/2025\n- Advertisement of the challenge at ESTRO 2025: 04/05/2025\n- Testing\
  \ phase (2 submissions per team): 16/07/2025 - 15/08/2025\n- Deadline for algorithm information form\
  \ and LNCS format algorithm description: 01/09/2025\n- Announcements and invitation to present: 09/09/2025\n\
  - Post-challenge phase: submission possible for a couple of years\n\n## \U0001F3AF Background\n\nThe\
  \ use of magnetic resonance imaging (MRI) to visualize and characterize motion is becoming increasingly\
  \ important in the treatment of cancer patients, especially in radiotherapy. For tumors affected by\
  \ it, motion management is crucial to ensure a high radiation dose to the tumor while sparing neighboring\
  \ organs. The recent development of MRI-guided radiotherapy with hybrid MRI-linear accelerator (linac)\
  \ systems \\[[Keall et al., 2022](https://www.nature.com/articles/s41571-022-00631-3)\\], called MRI-linacs,\
  \ offers the possibility to adapt to changes in tumor position during treatment. 2D cine-MRI (a time-resolved\
  \ sequence of 2D images continuously acquired at the same location) allows real-time tumor motion visualization\
  \ and closely following the tumor with the radiation beam, but requires automated tumor segmentation/tracking.\
  \ This needs to be done in real-time, with high accuracy and robustness. Currently, clinically available\
  \ solutions rely on conventional deformable image registration (DIR) or on template matching. These\
  \ methods struggle with large non-rigid motion, limiting application to beam gating.\n\nThe fast inference\
  \ of artificial intelligence (AI) methods, obtained by shifting computation time to the training phase,\
  \ is promising for this task \\[[Lombardo et al., 2024](https://www.thegreenjournal.com/article/S0167-8140(23)89864-4/abstract)\\\
  ].\n\nTrackRAD2025 aims to advance MRI-guided radiotherapy by providing cine-MRI data from multiple\
  \ institutions to evaluate real-time tumor tracking methods on a unified platform.\n\n## Dataset\n\n\
  TrackRAD2025 provides a public multi-institutional datasets of both unlabeled and labeled 2D cine-MRI\
  \ frame sequences for development and testing. Six international centers (3 Dutch, 1 German, 1 Australian,\
  \ and 1 Chinese) provided data from 0.35 T and 1.5 T MRI-linacs. A further (private) labeled dataset\
  \ was collected for testing and evaluation.\n\nThe public datasets provided for the TrackRAD2025 challenge\
  \ can be found on [Hugging Face](https://huggingface.co/datasets/LMUK-RADONC-PHYS-RES/TrackRAD2025):\n\
  \n```\n@misc {lmu_adaptive_radiation_therapy_lab_2025,\n\tauthor       = { {LMU Adaptive Radiation Therapy\
  \ Lab} },\n\ttitle        = { TrackRAD2025 (Revision 505ec64) },\n\tyear         = 2025,\n\turl    \
  \      = { https://huggingface.co/datasets/LMUK-RADONC-PHYS-RES/TrackRAD2025 },\n\tdoi          = {\
  \ 10.57967/hf/4539 },\n\tpublisher    = { Hugging Face }\n}\n```\n\n- The labeled dataset is already\
  \ available.\n- Unlabeled dataset will be available by the beginning of the challenge\n\nThe format\
  \ is documented in the [dataset paper](https://arxiv.org/abs/2503.19119)\n\n```\n@misc{wang2025trackrad2025challengedatasetrealtime,\n\
  \      title={TrackRAD2025 challenge dataset: Real-time tumor tracking for MRI-guided radiotherapy},\
  \ \n      author={Yiling Wang and Elia Lombardo and Adrian Thummerer and Tom Blöcker and Yu Fan and\
  \ Yue Zhao and Christianna Iris Papadopoulou and Coen Hurkmans and Rob H. N. Tijssen and Pia A. W. Görts\
  \ and Shyama U. Tetar and Davide Cusumano and Martijn P. W. Intven and Pim Borman and Marco Riboldi\
  \ and Denis Dudáš and Hilary Byrne and Lorenzo Placidi and Marco Fusella and Michael Jameson and Miguel\
  \ Palacios and Paul Cobussen and Tobias Finazzi and Cornelis J. A. Haasbeek and Paul Keall and Christopher\
  \ Kurz and Guillaume Landry and Matteo Maspero},\n      year={2025},\n      eprint={2503.19119},\n \
  \     archivePrefix={arXiv},\n      primaryClass={physics.med-ph},\n      url={https://arxiv.org/abs/2503.19119},\
  \ \n}\n```\n\nand on the [Data page](https://trackrad2025.grand-challenge.org/data/) on grand-challenge.\n\
  \nTo download the datasets and place them in the expected locations, you can run the following commands:\n\
  \n```python\n# Labeled dataset (about 3 GiB) for unsupervised learning or evaluation\n\nfrom huggingface_hub\
  \ import snapshot_download\n\nsnapshot_download(repo_id=\"LMUK-RADONC-PHYS-RES/TrackRAD2025\", repo_type=\"\
  dataset\", local_dir=\"/dataset/\", allow_patterns=\"trackrad2025_labeled_training_data/*\")\n# the\
  \ cases are stored in ./dataset/trackrad2025_labeled_training_data/\n\n#Unlabeled dataset (attention,\
  \ very large, about 200 GiB) for unsupervised learning:\n\nsnapshot_download(repo_id=\"LMUK-RADONC-PHYS-RES/TrackRAD2025\"\
  , repo_type=\"dataset\", local_dir=\"/dataset/\", allow_patterns=\"trackrad2025_unlabeled_training_data/*\"\
  )\n# the cases are stored in ./dataset/trackrad2025_unlabeled_training_data/\n```\n\nWe recommend placing\
  \ the dataset in the `dataset/` subfolder of this repository, following the following structure:\n\n\
  ```sh\ndataset/\n├── example # a single example case for technical testing\n│   └── Z_001\n│       ├──\
  \ b-field-strength.json\n│       ├── frame-rate.json\n│       ├── images\n│       │   └── Z_001_frames.mha\n\
  │       ├── scanned-region.json\n│       └── targets\n│           ├── Z_001_first_label.mha\n│     \
  \      └── Z_001_labels.mha\n├── labeled # labeled data for supervised training\n├── unlabeled # unlabeled\
  \ data for unsupervised training\n├── preliminary # private - cases used for the first phase\n└── testing\
  \ # private - cases used for the final phase\n```\n\n## Getting started\n\nFollow these steps (also\
  \ available [here](https://trackrad2025.grand-challenge.org/task/) and [here](https://github.com/LMUK-RADONC-PHYS-RES/trackrad2025/blob/main/pages/Task.md))\
  \ to set up your development environment and prepare your submission.\n\n#### 1. Clone the Official\
  \ Repository\nBegin by cloning the official [TrackRAD2025 repository](https://github.com/LMUK-RADONC-PHYS-RES/trackrad2025):\n\
  \n```bash\ngit clone git@github.com:LMUK-RADONC-PHYS-RES/trackrad2025.git\n```\n\nThis repository includes:\n\
  \n- Challenge information\n- Code used for evaluation and local testing\n- A baseline algorithm to help\
  \ you get started\n\n#### 2. Download and Place the Dataset\n\nDownload the [dataset](https://trackrad2025.grand-challenge.org/data/)\
  \ and place it in the dataset/ folder. Use the labeled dataset for supervised training and model evaluation.\
  \ For unsupervised training you may want to use the unlabeled dataset, for supervised training and evaluation\
  \ of your model the labeled dataset is sufficient.\n\n \n> Tip: A synthetic sequence (formatted like\
  \ the labeled data) is also provided in the repository to help you get started quickly, even while still\
  \ downloading the dataset.\n\n#### 3. Test the Baseline Algorithm\nBefore modifying anything, verify\
  \ that the baseline and evaluation are working correctly:\n\n```\nsh test-algorithm.sh\n```\n\nThis\
  \ script will compile, execute, and test the baseline algorithm with the synthetic example scan. \n\n\
  > This script assumes a unix environment with docker installed correctly, for example on macOS or Linux.\
  \ If you are using Windows, please look into and make use of the Windows Subsystem for Linux (WSL).\
  \ Or port the script to PowerShell and create a PR.\n\nFamiliarize yourself with the parameters at the\
  \ top of the script (especially ALGORITHM_DIR and DATASET_DIR). You will need to update these paths\
  \ when evaluating your own algorithm.\n\n#### 4. Understand the baseline\n\nOpen `baseline-algorithm/model.py`\
  \ in your code editor. You will see the following function:\n \n```python\ndef run_algorithm(frames:\
  \ np.ndarray, \n    target: np.ndarray, \n    frame_rate: float, \n    magnetic_field_strength: float,\
  \ \n    scanned_region: str) -> np.ndarray:\n    \"\"\"\n    Implement your algorithm here.\n\n    Args:\n\
  \    - frames (numpy.ndarray): A 3D numpy array of shape (W, H, T) containing the MRI linac series.\n\
  \    - target (numpy.ndarray): A 2D numpy array of shape (W, H, 1) containing the MRI linac target.\n\
  \    - frame_rate (float): The frame rate of the MRI linac series.\n    - magnetic_field_strength (float):\
  \ The magnetic field strength of the MRI linac series.\n    - scanned_region (str): The scanned region\
  \ of the MRI linac series.\n    \"\"\"\n    \n    # frames.shape == (W, H, T)\n    # target.shape ==\
  \ (W, H, 1)\n\n    # For the example we want to repeat the initial segmentation for every frame \n \
  \   repeated_target = np.repeat(target, frames.shape[2], axis=-1)\n\n    # repeated_target.shape ==\
  \ (W, H, T)\n    return repeated_target\n```\n\n\n#### 5. Start Developing Your Own Model\n\nCopy the\
  \ baseline algorithm folder to a new folder to work in.\n\n```bash\ncp -R baseline-algorithm your-algorithm\n\
  ```\n\nNavigate into your new folder and initialise it as a separate git repository:\n\n```bash\ncd\
  \ your-algorithm\ngit init\n```\n\nModify the test-algorithm.sh script in the main repository to point\
  \ to your new folder (update the ALGORITHM_DIR path).\n\n```bash\nALGORITHM_DIR=\"./your-algorithm\"\
  \n```\n\n> Tip: By this time your download of the labeled dataset could be done and you could also update\
  \ the dataset path, to use the labeled dataset. This is recommended if you want to test more than just\
  \ the technical functionality of your algorithm.\n \n```bash\n# This might also be a good time to wherever\
  \ you stored the labeled cases.\nDATASET_DIR=\"./dataset/labeled\"\n# When using the command provided\
  \ above use\n# DATASET_DIR=\"./dataset/trackrad2025_labeled_training_data\n```\n\n#### 6. Implement\
  \ Your Model:\n\nEdit the model.py file in your working copy to implement your algorithm. Make sure\
  \ to keep the function signature of the run_algorithm function intact. This way you ensure that your\
  \ submission is functional.\n\n```python\ndef run_algorithm(frames: np.ndarray, # frames.shape == (W,\
  \ H, T)\n    target: np.ndarray, # target.shape == (W, H, 1)\n    frame_rate: float, \n    magnetic_field_strength:\
  \ float, \n    scanned_region: str) -> np.ndarray:\n\n    # Example: Repeat the initial segmentation\
  \ \n    repeated_target = np.repeat(target, frames.shape[2], axis=-1)\n\n    return repeated_target\
  \ # repeated_target.shape == (W, H, T)\n```\n\n**Note:** When adding files or folders to it make sure\
  \ to add them to the Dockerfile. This is required for the submission on grand-challenge, where you provide\
  \ the platform access to github repository you created earlier. Alternatively, but not recommended,\
  \ you can upload a container image, e.g. created using the save.sh script provided with the baseline\
  \ algorithm. \n**However, we still require read access to your model source code for prize eligibility.**\n\
  \n#### 7. Have Fun\n\nHave fun developing and contributing the the future of cine-MRI target tracking!\n\
  \nP.S.: When you are ready to test your submission on grand-challenge o"

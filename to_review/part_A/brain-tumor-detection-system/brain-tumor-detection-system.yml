readme_excerpt: "# Brain-tumor-detection-system\nBrain Tumor Detection System: Developed a deep learning-based\
  \ medical imaging solution using MobileNetV2 to classify MRI brain scans as Tumor or No Tumor. Implemented\
  \ image preprocessing, data validation, MLflow experiment tracking, model evaluation (Accuracy, F1-Score,\
  \ ROC-AUC), and Streamlit deployment for real-time prediction.\n\n# Brain Tumor Detection using Deep\
  \ Learning\n\n## Project Overview\n\nThis project is a Deep Learning-based Brain Tumor Detection System\
  \ that classifies MRI brain scan images into two categories: **Tumor** and **No Tumor**. The solution\
  \ uses Transfer Learning with MobileNetV2 and provides an end-to-end machine learning workflow including\
  \ data preprocessing, validation, model training, experiment tracking, and deployment.\n\n## Features\n\
  \n* MRI Image Classification\n* Image Preprocessing Pipeline\n* Data Validation using Great Expectations\n\
  * Experiment Tracking using MLflow\n* Deep Learning Models Comparison\n\n  * CNN\n  * MobileNetV2\n\
  \  * ResNet50\n  * EfficientNetB0\n* Model Evaluation using:\n\n  * Accuracy\n  * F1 Score\n  * ROC-AUC\n\
  * Streamlit Web Application Deployment\n\n## Tech Stack\n\n* Python\n* TensorFlow / Keras\n* MobileNetV2\n\
  * OpenCV\n* NumPy\n* Pandas\n* Scikit-Learn\n* Great Expectations\n* MLflow\n* Streamlit\n\n## Dataset\n\
  \nThe dataset consists of MRI brain images categorized into:\n\n* Tumor (1)\n* No Tumor (0)\n\nImages\
  \ are resized to 224 × 224 pixels and normalized before training.\n\n## Project Workflow\n\n1. Data\
  \ Collection\n2. Exploratory Data Analysis (EDA)\n3. Image Preprocessing\n4. Data Validation using Great\
  \ Expectations\n5. Train-Test Split\n6. Model Training\n7. Model Evaluation\n8. MLflow Experiment Tracking\n\
  9. Model Selection\n10. Streamlit Deployment\n\n## Model Performance\n\n| Model          | Accuracy\
  \ | F1 Score | ROC-AUC |\n| -------------- | -------- | -------- | ------- |\n| CNN            | 86.27%\
  \   | 89.55%   | 93.39%  |\n| MobileNetV2    | 94.12%   | 95.24%   | 97.10%  |\n| ResNet50       | 74.51%\
  \   | 82.19%   | 79.68%  |\n| EfficientNetB0 | 60.78%   | 75.61%   | 55.81%  |\n\nBest Performing Model:\
  \ **MobileNetV2**\n\n## MLflow Tracking\n\nMLflow is used to:\n\n* Track experiments\n* Compare models\n\
  * Store parameters\n* Store metrics\n* Save trained models\n\nRun MLflow UI:\n\n```bash\nmlflow ui\n\
  ```\n\nOpen:\n\n```text\nhttp://127.0.0.1:5000\n```\n\n## Streamlit Deployment\n\nRun the application:\n\
  \n```bash\nstreamlit run streamlit_app.py\n```\n\nOpen:\n\n```text\nhttp://localhost:8501\n```\n\n##\
  \ Project Structure\n\n```text\nBrain-Tumor-Detection/\n\n├── artifacts/\n│   ├── MobileNetV2.keras\n\
  │\n├── src/\n│   ├── app.py\n│   ├── preprocessing.py\n│   ├── validation.py\n│   ├── mlflow_training.py\n\
  │   ├── streamlit_app.py\n│\n├── gx/\n├── mlruns/\n├── requirements.txt\n└── README.md\n```\n\n## Future\
  \ Improvements\n\n* Tumor Localization using YOLOv8\n* Tumor Segmentation using U-Net\n* Multi-Class\
  \ Brain Tumor Classification\n* Cloud Deployment\n* Real-Time Clinical Integration\n\n## Author\n\n\
  Abhishek Jena\n\n////\n/\n/\n/\n/\n\n"

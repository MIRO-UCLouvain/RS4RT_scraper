readme_excerpt: "# CBCT Tumor Binary Classification - Streamlit App\n\nA production-structured Streamlit\
  \ application for **binary tumor classification on CBCT scans**.\n\n## Features\n\n- Upload **ZIP DICOM\
  \ series** or individual DICOM slices\n- Normalize CBCT volume and sample representative slices\n- Run\
  \ **binary classification inference** using a PyTorch model\n- Slice-level probabilities + case-level\
  \ aggregation\n- Representative slice visualization\n- Optional **Grad-CAM** heatmap generation\n- Export\
  \ a lightweight PDF report\n\n## Project structure\n\n```text\ncbct_tumor_streamlit_app/\n├── app.py\n\
  ├── requirements.txt\n├── README.md\n├── .streamlit/\n│   └── config.toml\n└── src/\n    ├── config.py\n\
  \    ├── models/\n    │   └── classifier.py\n    ├── services/\n    │   ├── dicom_io.py\n    │   ├──\
  \ gradcam.py\n    │   ├── inference.py\n    │   ├── preprocessing.py\n    │   └── reporting.py\n   \
  \ └── ui/\n        └── components.py\n```\n\n## Installation\n\n```bash\npython -m venv .venv\nsource\
  \ .venv/bin/activate  # Windows: .venv\\Scripts\\activate\npip install -r requirements.txt\n```\n\n\
  ## Run\n\n```bash\nstreamlit run app.py\n```\n\n## Model checkpoint\n\nPlace your checkpoint in:\n\n\
  ```text\nmodels/best_model.pth\n```\n\nAccepted formats:\n\n```python\n# 1) raw state_dict\nmodel.state_dict()\n\
  \n# 2) wrapped checkpoint\n{\n    \"state_dict\": model.state_dict(),\n    \"architecture\": \"resnet18\"\
  ,\n    \"class_names\": [\"no_tumor\", \"tumor\"]\n}\n```\n\n## Training expectation\n\nThe app assumes\
  \ a **single-channel binary classifier** trained on CBCT slices.\nRecommended training pattern:\n\n\
  - preprocess full CBCT volumes\n- sample consistent slices or ROI patches\n- train with BCEWithLogitsLoss\n\
  - calibrate the case-level aggregation strategy separately\n\n## Important note\n\nThis repository is\
  \ **inference-ready**, but clinical performance depends entirely on:\n\n- data quality\n- annotation\
  \ quality\n- preprocessing consistency\n- external validation\n\nThis app is for **research / prototype\
  \ / demonstration** use, not regulated diagnosis.\n"

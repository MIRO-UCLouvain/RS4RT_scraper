readme_excerpt: "# Spirit Box — EMF & EVP (Halloween Edition)\n\nBöngészőben futó, rendezvényre optimalizált\
  \ „EMF/Spirit Box” élményapp. Android + Chrome alatt valós magnetométer-olvasással (ha támogatott),\
  \ minden más platformon élményfókuszú fallback módokkal (mozgatás + zaj + szóbank).\n\n> Figyelmeztetés:\
  \ ez szórakoztató eszköz, nem hiteles műszer.\n\n## Fő funkciók\n- EMF kijelzés (µT), LED-bar és gauge\
  \ animáció\n- „Radio sweep” hang Web Audio API-val\n- EVP felvétel és letöltés (.webm)\n- Szóbank üzenetek,\
  \ eseménynapló\n- PWA: offline cache, kezdőképernyőre telepíthető\n\n## Fejlesztői jegyzet\n- Valódi\
  \ magnetométer csak HTTPS + támogatott böngésző esetén (jellemzően Android/Chrome). iOS-en nem várható.\n\
  \n## Gyors indítás lokálisan\n1. Bármely statikus szerverrel futtatható. Például Python 3-mal:\n   ```bash\n\
  \   cd spiritbox-web\n   python -m http.server 5173\n   ```\n2. Nyisd meg: http://localhost:5173\n\n\
  ## Deploy GitHub Pages-re\n1. Új repository: **spiritbox-web**.\n2. A projekt gyökérfájljait pushold\
  \ fel (index.html, sw.js, manifest, icons, stb.).\n3. GitHub repo Settings → Pages → Branch: `main`\
  \ és `/ (root)`.\n4. A Pages URL-re látogatva működni fog (HTTPS).\n\n## Deploy Vercelre\n1. Importáld\
  \ a repo-t Vercelbe (New Project → Import GitHub repo).\n2. Framework: **Other** (statikus site), build\
  \ parancs üres, output directory: `/`.\n3. Deploy. A Vercel preview/production domain HTTPS, a szenzor/mikrofon\
  \ kérések működni fognak.\n\n## Fájlok\n- `index.html` — a teljes app egy fájlban\n- `sw.js` — egyszerű\
  \ service worker cache\n- `manifest.webmanifest` — PWA metaadatok\n- `icons/` — 192 és 512 px ikonok\n\
  - `vercel.json` — opcionális static beállítások\n- `LICENSE` — MIT\n\n## Jogok\nMIT License\n"

readme_excerpt: "# GaSpCT: Gaussian splatting for novel brain CBCT projection view synthesis\n\n## Overview\n\
  GaSpCT is an adaptation of Gaussian Splatting specifically designed for sparse-view Cone Beam Computed\
  \ Tomography (CBCT) projection images. This project extends the original work by INRIA to handle medical\
  \ imaging applications.\nOur main contributions include:\n- A framework to extract camera intrinsics\
  \ and extrinsics using scanner metadata\n- An enhanced loss function that better captures the characteristics\
  \ of radiographs\n- An ellipsoid point initialization\n- A validation that Gaussian Splatting represents\
  \ a robust and accurate methodology for radiograph synthesis in sparse-view CBCT\n\n## Original Work\n\
  This repository is heavily based on the Gaussian Splatting repository by INRIA, our work wouldn't be\
  \ possible without it:\n- [Original Repository](https://github.com/graphdeco-inria/gaussian-splatting)\n\
  - [Research Paper](https://repo-sam.inria.fr/fungraph/3d-gaussian-splatting/3d_gaussian_splatting_high.pdf)\n\
  \n## Project Status\nThis project has been accepted for a poster presentation in SPIE Medical Imaging\
  \ 2025, in San Diego. \n\nPlease find the dataset we used for validation (digitally reconstructed radiographs\
  \ and camera poses) in the following Google Drive link: https://drive.google.com/file/d/1z7vDykClopXIX7w9u6LETEo8eh6b2Psd\n\
  \n### Main Contributors\n- Emmanouil \"Manolis\" Nikolakakis\n- Utkarsh Gupta\n- Jonathan Vengosh\n\
  - Justin Bui\n\n### Faculty Advisor\n- Professor Razvan Marinescu\n\n### Institution\nUniversity of\
  \ California, Santa Cruz\n\n---\n### Running the code\n\n# Cloning the Repository\n\nThe repository\
  \ contains submodules, thus please check it out with:\n\n```bash\n# SSH\ngit clone git@github.com:BioMedAI-UCSC/GaSpCT.git\
  \ --recursive\n```\nor\n\n```bash\n# HTTPS\ngit clone https://github.com/BioMedAI-UCSC/GaSpCT.git --recursive\n\
  ```\n\n# Installing requirements\n```bash\n# You can use conda to install the python packages and install\
  \ the required submodules using the appropriate channels\nconda env create -f environment.yml\n```\n\
  \n# Setting up the directory\n\n- To run GaSpCT, please copy your radiograph image dataset in ./data\
  \ and update the ct_configuration.yml file with the scanner data of the CT scan.\n- If you would like\
  \ to generate radiographs from a 3D DICOM or MHA volume, please use the script: ./utils/generate_drr_gaspct\
  \ (you will need to have plastimatch installed for this): https://plastimatch.org/getting_started.html\n\
  \n# Training, rendering and evaluating the gaussian splatting scene representation\n\nWe recommend using\
  \ our streamline shell script to run GaSpCT which should take care of everything:\n\n```bash\n./run_streamline.sh\n\
  ```\n\n- You can edit \"data_paths\" if you want to generate results for one or multiple set of radiographs.\
  \ Also you might want to change \"test_holdout_list\" to run GaSpCT for one or more ratios of training\
  \ / testing data points.\n- Your generated point cloud will be found under: ./output/\"name of run\"\
  /\"testing-training ratio\"\n- You can also find rendered images versus the ground truth under: ./output/\"\
  name of run\"/\"testing-training ratio/test\"\n- Moreover, you can find the metrics.txt file under:\
  \ ./output/\"name of run\"/\"testing-training ratio\n- Finally, you might find our \"./utils/ablation_metric_extractor.py\"\
  \ script helpful. It was used to get the average metric results for various tests when we were doing\
  \ our ablation studies.\n\n# BibTex\n\nIf you have used our work or found it insightful for your project,\
  \ please consider citing us using the following BibTex block\n\n@article{nikolakakis2024gaspct,  \n\
  \  title={GaSpCT: Gaussian Splatting for Novel CT Projection View Synthesis},   \n  author={Nikolakakis,\
  \ Emmanouil and Gupta, Utkarsh and Vengosh, Jonathan and Bui, Justin and Marinescu, Razvan},  \n  journal={arXiv\
  \ preprint arXiv:2404.03126},  \n  year={2024}  \n}\n"

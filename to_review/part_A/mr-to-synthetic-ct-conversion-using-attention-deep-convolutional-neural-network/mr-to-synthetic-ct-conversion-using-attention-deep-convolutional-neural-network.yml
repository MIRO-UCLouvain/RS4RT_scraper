readme_excerpt: "# MR to Synthetic CT Conversion Using Attention-Enhanced DCNN \U0001F9E0➡️\U0001FA7A\n\
  \n[![License](https://img.shields.io/badge/License-MIT-blue.svg)](LICENSE)\n[![Python](https://img.shields.io/badge/Python-3.7%2B-green)](https://www.python.org/)\n\
  [![TensorFlow](https://img.shields.io/badge/TensorFlow-2.x-orange)](https://www.tensorflow.org/)\n[![Springer\
  \ Paper](https://img.shields.io/badge/Springer-Chapter%2050-<COLOR>.svg)](https://link.springer.com/chapter/10.1007/978-3-030-64583-0_50)\n\
  \n**Official implementation**: **\"MR to Synthetic CT Conversion Using Attention-Enhanced Deep Convolutional\
  \ Neural Network\"**. This repository extends traditional DCNNs with **attention mechanisms** to improve\
  \ MR-to-CT synthesis for medical imaging applications.\n\n---\n\n## \U0001F4CC Table of Contents\n-\
  \ [Why Synthetic CT?](#-why-synthetic-ct)\n- [Key Innovations](#-key-innovations)\n- [Installation](#-installation)\n\
  - [Quick Start](#-quick-start)\n- [Dataset Preparation](#-dataset-preparation)\n- [Attention-DCNN Architecture](#-attention-dcnn-architecture)\n\
  - [Training & Inference](#-training--inference)\n- [Results & Comparisons](#-results--comparisons)\n\
  - [Citation](#-citation)\n- [Contributing](#-contributing)\n- [License](#-license)\n- [Contact](#-contact)\n\
  \n---\n\n## \U0001F3E5 Why Synthetic CT?\nCT scans are essential for radiation therapy planning but\
  \ involve ionizing radiation. MR imaging is safer but lacks electron density data. **This work solves\
  \ this** by generating synthetic CT (sCT) scans from MR images using an **attention-augmented DCNN**,\
  \ enabling accurate radiotherapy dose calculations without additional radiation exposure.\n\n---\n\n\
  ## \U0001F525 Key Innovations\n- **Attention-Enhanced DCNN**: Spatial and channel attention blocks to\
  \ focus on anatomically critical regions.\n- **Hybrid Loss Function**: Combines SSIM, MAE, and adversarial\
  \ loss for structural accuracy.\n- **Clinical Validation**: sCTs validated against real CTs using dosimetric\
  \ metrics (Gamma Index, DVH).\n\n---\n\n## ⚙️ Installation\n\n### Prerequisites\n- Python 3.7+\n- TensorFlow\
  \ 2.x/keras\n- NVIDIA GPU (CUDA 11.0+ recommended)\n\n1. Clone the repository:\n   ```bash\n   git clone\
  \ https://github.com/mksherwani/MR-to-synthetic-CT-conversion-using-Attention-Deep-Convolutional-Neural-Network.git\n\
  \   cd MR-to-synthetic-CT-conversion-using-Attention-Deep-Convolutional-Neural-Network\nInstall dependencies:\n\
  \nbash\npip install -r requirements.txt\n\nPreprocessing Steps\nResampling: Align MR/CT voxel spacing\
  \ (e.g., 1×1×1 mm³).\n\nIntensity Normalization:\n\nMR: Z-score normalization per modality.\n\nCT: Clip\
  \ to [-1000, 2000] HU → scale to [0, 1].\n\nPatch Extraction: Extract 3D patches (e.g., 128×128×32)\
  \ for memory efficiency.\n\n\U0001F9E0 Attention-DCNN Architecture\nKey Components\nEncoder:\n\n4 convolutional\
  \ blocks with Squeeze-and-Excitation (SE) attention.\n\nStrided convolutions for downsampling.\n\nBottleneck:\n\
  \nCross-Modality Attention for fusing multi-contrast MR data.\n\nDecoder:\n\nTransposed convolutions\
  \ + Spatial Attention Gates.\n\nSkip connections with attention-guided feature fusion.\n\nAttention-DCNN\
  \ Architecture \"FIGure\"\n\n\n✍️ Citation\nIf you use this code or findings in your research, please\
  \ cite:\n\nbibtex\n@InProceedings{Sherwani2021,\n  author    = {Sherwani, Moiz Khan and others},\n \
  \ title     = {Evaluating the Impact of Training Loss on MR to Synthetic CT Conversion},\n  booktitle\
  \ = {Proceedings of the International Conference on Advanced Machine Learning Technologies},\n  year\
  \      = {2021},\n  pages     = {491--500},\n  publisher = {Springer},\n  doi       = {10.1007/978-3-030-64583-0_50}\n\
  }\n\U0001F91D Contributing\nContributions are welcome! Please:\n\nFork the repository.\n\nCreate a feature\
  \ branch (git checkout -b feature/new-attention).\n\nCommit changes (git commit -m 'Add 3D attention\
  \ blocks').\n\nPush to the branch (git push origin feature/new-attention).\n\nOpen a Pull Request.\n\
  \n\U0001F4DC License\nThis project is licensed under the MIT License. See LICENSE for details.\n"

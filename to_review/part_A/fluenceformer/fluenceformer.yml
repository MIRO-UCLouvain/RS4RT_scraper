readme_excerpt: "# FluenceFormer\n\n## FluenceFormer: Transformer-Driven Multi-Beam Fluence Map Regression\
  \ for Radiotherapy Planning\n\n**Ujunwa Mgboh**, Rafi Ibn Sultan, Joshua Kim, Kundan Thind, Dongxiao\
  \ Zhu  \nAccepted at *MIDL, 2026*\n\n\U0001F4C4 **Paper link:** Coming soon  \n\U0001F4BB **Code:**\
  \ https://github.com/UJUNWAMGBOH/FluenceFormer  \n\n---\n\nFluenceFormer is a backbone-agnostic transformer\
  \ framework for direct, geometry-aware multi-beam fluence regression in automated radiotherapy planning.\n\
  \n---\n\n# Abstract\n\nFluence map prediction is central to automated radiotherapy planning but remains\
  \ an ill-posed inverse problem due to the complex relationship between volumetric anatomy and beam-intensity\
  \ modulation. Convolutional methods in prior work often struggle to capture long-range dependencies,\
  \ which can lead to structurally inconsistent or physically unrealizable plans.\n\nWe introduce **FluenceFormer**,\
  \ a backbone-agnostic transformer framework for direct, geometry-aware fluence regression. The model\
  \ adopts a unified two-stage design: **Stage 1** predicts a global dose prior from anatomical inputs,\
  \ and **Stage 2** conditions this prior on explicit beam geometry to regress physically calibrated fluence\
  \ maps.\n\nCentral to the approach is the **Fluence-Aware Regression (FAR)** loss, a physics-informed\
  \ objective integrating voxel-level fidelity, gradient smoothness, structural consistency, and beam-wise\
  \ energy conservation. We evaluate the generality of the framework across multiple transformer backbones,\
  \ including Swin UNETR, UNETR, nnFormer, and MedFormer, on a prostate IMRT dataset.\n\nFluenceFormer\
  \ with Swin UNETR achieves the strongest performance among evaluated models and improves over existing\
  \ CNN and single-stage baselines, reducing Energy Error to **4.5%** while yielding statistically significant\
  \ gains in structural fidelity (*p* < 0.05).\n\n---\n\n# Architecture Overview\n\nFluenceFormer follows\
  \ a two-stage geometry-aware design:\n\n<p align=\"center\">\n  <img src=\"Figures/Architecture_overview.png\"\
  \ width=\"800\">\n</p>\n\n- **Stage 1:** Global dose prior prediction from anatomical inputs (CT, contours,\
  \ dose context).\n- **Stage 2:** Beam-conditioned fluence regression using explicit angular encoding.\n\
  - **Loss:** Fluence-Aware Regression (FAR) enforcing physical and structural consistency.\n\nSupported\
  \ transformer backbones:\n\n- SwinUNETR \n- UNETR\n- nnFormer \n- MedFormer\n\n---\n\n# Key Contributions\n\
  \n- Backbone-agnostic transformer framework for multi-beam fluence regression\n- Explicit geometry conditioning\
  \ for beam-aware prediction\n- Physics-informed Fluence-Aware Regression (FAR) loss\n- Comprehensive\
  \ backbone × loss ablation study\n- Fully reproducible training and inference pipeline\n\n---\n\n# Installation\n\
  \nClone the repository:\n\n```bash\ngit clone https://github.com/UJUNWAMGBOH/FluenceFormer.git\ncd FluenceFormer\n\
  ```\n\nInstall dependencies:\n\n```bash\npip install -r requirements.txt\n```\nInstructions for directory\
  \ structure, training and evaluation can be found in instructions.md\n\n---\n\n# Citation\n\nIf you\
  \ find this work useful in your research, please consider citing:\n\n```bibtex\n@inproceedings{fluenceformer2026,\n\
  \  title={FluenceFormer: Transformer-Driven Multi-Beam Fluence Map Regression for Radiotherapy Planning},\n\
  \  author={Ujunwa Mgboh, Rafi Ibn Sultan, Joshua Kim, Kundan Thind and Dongxiao Zhu},\n  booktitle={Proceedings\
  \ of the Medical Imaging with Deep Learning (MIDL)},\n  year={2026}\n}\n```\n"

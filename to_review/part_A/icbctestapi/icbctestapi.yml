readme_excerpt: "# ICBC API Assessment\nThis project was created as part of the interview process for\
  \ ICBC. \nIt is an API application built using Spring Boot with Maven, providing endpoints to showcase\
  \ various functionalities.\n\n[![API Status](https://img.shields.io/badge/API-Live-brightgreen)](https://adanapitest.software)\n\
  \n> Visit the live API: [adanapitest.software](https://adanapitest.software)\n\n## Description\nThis\
  \ API provides several endpoints:\n\n1. <b>/health</b> - Shows the health status of the application.\n\
  \    - ![healthEndpoint](./images/health.png)\n\n2. <b>/info</b> - Displays arbitrary information about\
  \ the application.\n    - ![infoEndpoint](./images/info.png)\n\n3. <b>/echo</b> - Accepts an arbitrary\
  \ JSON payload and echoes it back in the response.\n    - ![echoEndpoint](./images/echo.png)\n\n4. <b>/wordCount</b>\
  \ - Accepts an arbitrary JSON payload, counts the number of keys within the JSON string, and returns\
  \ an integer response.\n    - ![wordCountEndpoint](./images/wordCount.png)\n\n5. <b>/findCityProv</b>\
  \ - Utilizes the BC Government Geocoder REST API to find the City and Province for a regular civic address.\n\
  \    - ![findCityProv](./images/findCityProvince.png)\n\n\nThe project aims to follow Uncle Bob's clean\
  \ code philosophy, ensuring that the codebase remains testable, reusable, and maintainable.\n\n### Getting\
  \ Started\nPrerequisites\nJava 17 or higher\nMaven 3.6.x\n\n\n### References\n\n- Spring Boot Up and\
  \ Running: Building Cloud Native Java and Kotlin Applications, by Mark Heckler. [Amazon Link](https://www.amazon.ca/Spring-Boot-Running-Building-Applications/dp/1492076988/ref=sr_1_2?crid=3JFR3VUAFMGFQ&keywords=spring+boot+o%27reilly&qid=1693187150&sprefix=spring+boot+o%27reil%2Caps%2C221&sr=8-2)\n\
  ### Contact\nFor any queries or issues related to the project, please raise an issue in the within the\
  \ repository.\n"

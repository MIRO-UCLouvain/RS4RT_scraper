  ## \U0001F9EC The Problem\n\n<table>\n<tr>\n<td width=\"55%\">\n\nPancreatic cancer is among the **most\
  \ lethal malignancies in oncology** — not because it is inherently untreatable, but because it is almost\
  \ never caught early.\n\nBy the time symptoms appear, **~80% of patients are already at Stage III or\
  \ IV**, where curative surgery is no longer possible. The 5-year survival rate sits at a devastating\
  \ **< 12%**.\n\nThe core radiological challenge: pancreatic tumors appear **nearly iso-dense** against\
  \ surrounding abdominal soft tissue in CT scans. They sit deep within complex anatomy, making manual\
  \ 3D CT segmentation:\n\n- \U0001F550 Extremely time-consuming (hours per patient)\n- ❌ Prone to high\
  \ inter-observer variability\n- \U0001F4C9 Clinically infeasible at population scale\n\n</td>\n<td width=\"\
  45%\" align=\"center\">\n\n<br/>\n\n| Statistic | Value |\n|-----------|:-----:|\n| 5-Year Survival\
  \ Rate | **< 12%** |\n| Cases Diagnosed Stage III–IV | **~80%** |\n| Pancreas volume in CT | **0.5 –\
  \ 1%** |\n| Smallest detectable tumor | **~5 mm** |\n| Tumor voxel fraction | **~0.2%** |\n| CT volumes\
  \ in our dataset | **281** |\n\n</td>\n</tr>\n</table>\n\n---\n\n## \U0001F4A1 Our Solution — PancrAI\n\
  \n**PancrAI** is a fully automated, end-to-end **Clinical Decision Support (CAD)** system that segments\
  \ pancreatic tumors directly from raw 3D CT scans — no manual slice analysis required.\n\n<table>\n\
  <tr>\n<td align=\"center\" width=\"25%\">\n\n### \U0001F9E0\n**3D Segmentation**\n\nSimultaneous pancreas\
  \ + tumor delineation from full CT volumes using Swin-UNETR\n\n</td>\n<td align=\"center\" width=\"\
  25%\">\n\n### \U0001F4D0\n**Quantitative Metrics**\n\nTumor volume (mL), RECIST longest-axis diameter,\
  \ anatomical region: Head / Body / Tail\n\n</td>\n<td align=\"center\" width=\"25%\">\n\n### \U0001F310\
  \n**Flask Web App**\n\nMulti-planar viewer (axial · sagittal · coronal) with synchronized AI heatmap\
  \ overlays\n\n</td>\n<td align=\"center\" width=\"25%\">\n\n### \U0001F4C4\n**PDF Reports**\n\nAuto-generated\
  \ structured radiology reports ready for clinical review and MDT\n\n</td>\n</tr>\n</table>\n\n---\n\n\
  ## \U0001F3C6 Results vs Published Baselines\n\nBenchmarked on **Medical Segmentation Decathlon — Task07\
  \ Pancreas** (MICCAI 2018 · 281 annotated 3D CT volumes):\n\n<div align=\"center\">\n\n| Model / Method\
  \ | Year | Pancreas Dice | Tumor Dice | Mean Dice | Notes |\n|----------------|:----:|:---:|:---:|:---:|-------|\n\
  | 3D U-Net &nbsp;*(Çiçek)* | 2016 | 0.612 | — | — | Baseline volumetric seg. |\n| Attention U-Net &nbsp;*(Oktay)*\
  \ | 2018 | 0.641 | — | — | Attention gates |\n| UNETR &nbsp;*(Hatamizadeh)* | 2022 | 0.680 | 0.361 |\
  \ 0.521 | ViT-based encoder |\n| Swin UNETR &nbsp;*(Tang)* | 2022 | 0.700 | 0.380 | 0.540 | Pretrained\
  \ Swin-T |\n| **PancrAI — Ours** | **2025** | **0.732 ✅** | **0.422 ✅** | **0.577 ✅** | **TTA + 4× tumor\
  \ wt.** |\n\n</div>\n\n```\nPerformance Gain over Swin UNETR Baseline\n══════════════════════════════════════════════════════════════════\n\
  \n  Pancreas Dice  ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓░  +0.032  (+4.6%)   ▲ NEW SOTA\n  Tumor Dice     ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓░\
  \  +0.042  (+11.1%)  ▲ NEW SOTA\n  Mean Dice      ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓░  +0.037  (+6.9%)   ▲ NEW\
  \ SOTA\n\n══════════════════════════════════════════════════════════════════\n  Key: 8-flip TTA  + \
  \ DiceCE class weights [0.1, 1.0, 4.0]\n```\n\n### \U0001F4F8 Best Validation Results — Epoch 115\n\n\
  ![Best Results at Epoch 115](screenshots/best_results.jpg)\n\n### \U0001F4F8 Literature Comparison Table\n\
  \n![Comparison with Literature](screenshots/comparison_table.jpg)\n\n---\n\n## \U0001F3D7️ System Architecture\
  \ — 4-Stage Pipeline\n\n### \U0001F4F8 Full Architecture Diagram\n\n![System Architecture Diagram](screenshots/System%20Architecture%20Diagram.png)\n\
  <br/>\n\n```\n╔══════════════════════════════════════════════════════════════════════════════════╗\n\
  ║                         PancrAI — End-to-End Pipeline                          ║\n╠══════════════╦══════════════════╦═══════════════════╦══════════════════════════╣\n\
  ║   STAGE 1    ║    STAGE 2       ║     STAGE 3        ║       STAGE 4            ║\n║ DATA & PREP \
  \ ║ TRAINING & OPT   ║ EVALUATION         ║ DEPLOYMENT               ║\n╠══════════════╬══════════════════╬═══════════════════╬══════════════════════════╣\n\
  ║              ║                  ║                   ║                          ║\n║ MSD Task07   ║\
  \  Swin-UNETR      ║  Pancreas Dice    ║  Flask Web Server        ║\n║ 281 CT scans ║  62.2M params\
  \    ║  0.732  ✅         ║  app.py  (REST API)      ║\n║              ║  SSL pretrained  ║         \
  \          ║                          ║\n║ HU Window    ║  AdamW + AMP     ║  Tumor Dice       ║  Multi-Planar\
  \ Viewer     ║\n║ -175 → +250  ║  Cosine LR       ║  0.422  ✅         ║  Axial/Sagittal/Coronal  ║\n\
  ║              ║  Deep Sup ×5     ║                   ║                          ║\n║ Resample     ║\
  \  DiceCE Loss     ║  Mean Dice        ║  PDF Report Generator    ║\n║ 1.5×1.5×2mm  ║  wt [.1,1,4] \
  \   ║  0.577  ✅         ║  Auto radiology report   ║\n║              ║                  ║          \
  \         ║                          ║\n║ 10× MONAI    ║  127 Epochs      ║  Best Epoch: 115  ║  Heatmap\
  \ Overlay         ║\n║ Augmentations║  P100 GPU (16GB) ║  74% loss drop    ║  Confidence maps      \
  \   ║\n║              ║                  ║                   ║                          ║\n╚══════════════╩══════════════════╩═══════════════════╩══════════════════════════╝\n\
  ```\n\n### Detailed Flow\n\n```\n  Input: CT Scan (.nii.gz)\n         │\n         ▼\n┌──────────────────────────────────────────┐\n\
  │           PREPROCESSING PIPELINE         │\n│                                          │\n│  1  HU\
  \ Windowing    −175 to +250 HU      │  Soft tissue enhancement\n│  2  Voxel Resample  1.5 × 1.5 × 2.0\
  \ mm  │  Isotropic normalization\n│  3  Intensity Norm  Zero mean / unit var  │\n│  4  MONAI Augs ×10\
  \  Spatial + Intensity  │  3D flips · noise · contrast\n│  5  Patch Cache     PersistentDataset    │\
  \  ~7 GB · ~10 min/epoch\n└──────────────────────┬───────────────────┘\n                       │\n \
  \                      ▼\n┌──────────────────────────────────────────┐\n│       SWIN-UNETR   (62.2M\
  \ Parameters)    │\n│                                          │\n│  ┌──────────────────────────────────┐\
  \    │\n│  │     Swin Transformer Encoder     │    │  SSL pretrained on medical imgs\n│  │  · Hierarchical\
  \ patch embedding  │    │\n│  │  · Shifted window attention      │    │\n│  │  · 4-stage feature pyramid\
  \       │    │\n│  └────────────────┬─────────────────┘    │\n│       skip connections (×4)        \
  \      │\n│  ┌─────────────"

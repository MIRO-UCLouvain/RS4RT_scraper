readme_excerpt: "# RadiomicsHub - AI+影像组学全流程协作平台\n\n<div align=\"center\">\n\n**AI+影像组学全流程协作平台**\n\n支持多用户协作的医学影像标注、特征提取、机器学习建模全流程平台\n\
  \n[功能特性](#功能特性) • [快速开始](#快速开始) • [项目结构](#项目结构) • [API文档](#api文档)\n\n</div>\n\n---\n\n## 功能特性\n\n###\
  \ \U0001F510 用户权限管理\n- 多用户注册/登录系统\n- 角色区分：管理员(Admin)、医生(Doctor)\n- JWT Token 认证\n- 完善的权限控制\n\n### \U0001F4C1\
  \ 影像管理\n- 支持格式：DICOM (.dcm)、NRRD (.nrrd)、NIfTI (.nii/.nii.gz)\n- 批量上传功能\n- 影像元数据自动解析\n- 影像预览（2D切片、3D渲染）\n\
  - 影像归档与分类\n\n### ✏️ 影像标注\n- 类似 3D Slicer 的标注体验\n- 支持多种标注工具：\n  - 自由画笔\n  - 多边形套索\n  - 球体/立方体\n  - 阈值分割\n\
  - ROI 自动保存\n- 标注历史版本管理\n- 多医生协作标注\n\n### \U0001F4CA 特征提取\n- 集成 PyRadiomics 库\n- 支持特征类别：\n  - 一阶统计特征\
  \ (19个)\n  - 形状特征 (17个)\n  - 纹理特征 (GLCM, GLRLM, GLSZM, NGTDM)\n- 特征参数可配置\n- 批量特征提取\n- 特征结果导出（CSV/Excel）\n\
  \n### \U0001F916 机器学习建模\n- 多种模型支持：\n  - 逻辑回归\n  - 随机森林\n  - 支持向量机\n  - XGBoost\n- 数据集划分与交叉验证\n- 模型性能评估：\n\
  \  - 准确率、敏感度、特异度\n  - ROC曲线、AUC值\n  - 混淆矩阵\n  - 特征重要性排序\n- 模型下载与部署\n\n### \U0001F4C8 可视化报告\n- 模型性能可视化图表\n\
  - 特征重要性排序\n- 预测结果展示\n\n---\n\n## 技术栈\n\n### 后端\n- **Python 3.11** - 编程语言\n- **FastAPI** - 现代高性能 Web\
  \ 框架\n- **SQLAlchemy 2.0** - Python SQL 工具包和 ORM\n- **PostgreSQL 15** - 关系型数据库\n- **Redis 7** - 缓存和消息队列\n\
  - **Celery** - 分布式任务队列\n- **MinIO** - S3 兼容对象存储\n- **PyRadiomics** - 影像特征提取库\n- **SimpleITK** - 医学影像处理\n\
  - **scikit-learn** - 机器学习库\n- **XGBoost** - 梯度提升框架\n\n### 前端\n- **React 18** - UI 框架\n- **TypeScript**\
  \ - 类型安全\n- **Vite** - 构建工具\n- **TailwindCSS** - 样式框架\n- **Zustand** - 状态管理\n- **React Query** - 数据获取\n\
  - **Chart.js** - 数据可视化\n\n### 基础设施\n- **Docker** - 容器化\n- **Docker Compose** - 容器编排\n- **Nginx** - 反向代理\n\
  \n---\n\n## 快速开始\n\n### 前置要求\n\n- Docker 24.0+\n- Docker Compose 2.0+\n- 8GB+ 可用内存\n- 20GB+ 磁盘空间\n\n\
  ### 一键启动\n\n**Windows (PowerShell):**\n\n```powershell\n# 克隆项目\ngit clone https://github.com/your-username/radiomics-platform.git\n\
  cd radiomics-platform\n\n# 启动服务\ndocker-compose up -d --build\n```\n\n**Linux/macOS:**\n\n```bash\n\
  # 克隆项目\ngit clone https://github.com/your-username/radiomics-platform.git\ncd radiomics-platform\n\n\
  # 启动服务\ndocker-compose up -d --build\n```\n\n### 前后端build大概需要30分钟+  提供docker hub直接下载,其他依赖在run的时候自动拉取\n\
  ```bash\ndocker pull yangchen0513/radiomics-backend:20260327\ndocker pull yangchen0513/radiomics-frontend:20260327\n\
  ```\n### 访问地址\n\n| 服务 | 地址 | 说明 |\n|------|------|------|\n| **前端界面** | http://localhost | React Web\
  \ 应用 |\n| **API 文档** | http://localhost:8000/docs | Swagger UI |\n| **MinIO 控制台** | http://localhost:9001\
  \ | 对象存储管理 |\n\n### 默认账号\n\n| 角色 | 用户名 | 密码 |\n|------|--------|------|\n| 管理员 | admin | admin123 |\n\
  | 医生 | doctor | doctor123 |\n\n---\n\n## 项目结构\n\n```\nradiomics-platform/\n├── docs/               \
  \       # 文档\n│   ├── requirements.md        # 需求文档\n│   └── architecture.md        # 架构文档\n├── frontend/\
  \                  # 前端项目\n│   ├── src/\n│   │   ├── components/        # React 组件\n│   │   ├── pages/\
  \             # 页面\n│   │   ├── stores/            # 状态管理\n│   │   ├── services/          # API 服务\n\
  │   │   └── types/             # TypeScript 类型\n│   ├── package.json\n│   └── Dockerfile\n├── backend/\
  \                   # 后端项目\n│   ├── app/\n│   │   ├── api/v1/            # API 路由\n│   │   ├── core/\
  \              # 核心配置\n│   │   ├── models/            # 数据模型\n│   │   ├── schemas/           # Pydantic\
  \ 模式\n│   │   ├── services/          # 业务逻辑\n│   │   └── db/                # 数据库配置\n│   ├── scripts/\
  \               # 脚本\n│   ├── requirements.txt\n│   └── Dockerfile\n├── docker-compose.yml         #\
  \ Docker 编排\n└── README.md                  # 项目说明\n```\n\n---\n\n## 使用文档\n\n### 1. 上传影像（管理员）\n\n1.\
  \ 使用管理员账号登录\n2. 进入「影像管理」页面\n3. 点击「上传影像」按钮\n4. 选择 DICOM/NRRD/NIfTI 文件\n5. 等待系统处理完成\n\n### 2. 标注 ROI（医生）\n\
  \n1. 进入「影像管理」页面\n2. 点击影像列表中的标注按钮\n3. 使用标注工具勾画感兴趣区域\n4. 标注结果自动保存\n\n### 3. 特征提取（管理员）\n\n1. 进入「特征提取」页面\n\
  2. 点击「新建提取任务」\n3. 选择要提取特征的研究\n4. 配置特征参数\n5. 等待提取完成\n6. 导出特征结果\n\n### 4. 模型训练（管理员）\n\n1. 进入「模型管理」页面\n\
  2. 创建数据集\n3. 创建模型并选择算法\n4. 开始训练\n5. 查看评估报告\n\n---\n\n## API 文档\n\n启动服务后访问 http://localhost:8000/docs\
  \ 查看完整的 API 文档。\n\n### 主要端点\n\n| 路径 | 方法 | 说明 |\n|------|------|------|\n| `/api/v1/auth/login` | POST\
  \ | 用户登录 |\n| `/api/v1/auth/register` | POST | 用户注册 |\n| `/api/v1/users/` | GET | 用户列表 |\n| `/api/v1/studies/`\
  \ | GET/POST | 影像研究管理 |\n| `/api/v1/studies/upload` | POST | 影像上传 |\n| `/api/v1/annotations/rois` |\
  \ GET/POST | 标注管理 |\n| `/api/v1/features/extract` | POST | 特征提取 |\n| `/api/v1/ml/models` | GET/POST\
  \ | 模型管理 |\n\n---\n\n## 开发指南\n\n### 后端开发\n\n```bash\ncd backend\n\n# 创建虚拟环境\npython -m venv venv\nsource\
  \ venv/bin/activate  # Linux/macOS\n# venv\\Scripts\\activate  # Windows\n\n# 安装依赖\npip install -r requirements.txt\n\
  \n# 启动开发服务器\nuvicorn app.main:app --reload --port 8000\n```\n\n### 前端开发\n\n```bash\ncd frontend\n\n\
  # 安装依赖\nnpm install\n\n# 启动开发服务器\nnpm run dev\n```\n\n---\n\n## 环境变量\n\n在 `docker-compose.yml` 中已配置默认值，生产环境请修改：\n\
  \n```yaml\n# 安全配置\nSECRET_KEY: your-secret-key-change-in-production\n\n# 数据库密码\nPOSTGRES_PASSWORD: your-db-password\n\
  \n# MinIO 凭证\nMINIO_ROOT_USER: your-minio-user\nMINIO_ROOT_PASSWORD: your-minio-password\n```\n\n---\n\
  \n## 常见问题\n\n### 1. 端口被占用\n\n修改 `docker-compose.yml` 中的端口映射：\n\n```yaml\nservices:\n  frontend:\n  \
  \  ports:\n      - \"8080:80\"  # 改为 8080 端口\n```\n\n### 2. Docker 构建慢\n\n在中国大陆，可以使用镜像加速器，或修改 Dockerfile\
  \ 使用国内镜像源。\n\n### 3. 内存不足\n\n增加 Docker 可用内存：\n- Windows: Docker Desktop → Settings → Resources → Memory\n\
  - Linux: 默认无限制\n\n### 4. 数据库连接失败\n\n等待 PostgreSQL 完全启动，通常需要 10-30 秒。可以查看日志：\n\n```bash\ndocker-compose\
  \ logs postgres\n```\n\n### 5. 重新初始化数据库\n\n```bash\ndocker-compose down -v  # 删除数据卷\ndocker-compose\
  \ up -d --build\n```\n\n---\n\n## 许可证\n\nMIT License\n\n---\n\n## 贡献指南\n\n欢迎提交 Issue 和 Pull Request！\n\
  \n1. Fork 本仓库\n2. 创建特性分支 (`git checkout -b feature/AmazingFeature`)\n3. 提交更改 (`git commit -m 'Add some\
  \ AmazingFeature'`)\n4. 推送到分支 (`git push origin feature/AmazingFeature`)\n5. 创建 Pull Request\n\n---\n\

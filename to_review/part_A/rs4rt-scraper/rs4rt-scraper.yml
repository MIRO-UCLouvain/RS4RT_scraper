readme_excerpt: "<p align=\"center\">\n  <img src=\"assets/logo.PNG\" alt=\"RS4RT\" width=\"70%\" style=\"\
  max-height:200px; object-fit:contain\">\n</p>\n\n<h1 align=\"center\">RS4RT Catalog</h1>\n\n<p align=\"\
  center\">\n  <em>Resource Sharing for RadioTherapy &mdash; an open catalog of software for radiotherapy\
  \ research</em>\n</p>\n\n<p align=\"center\">\n  <a href=\"https://miro-uclouvain.github.io/RS4RT_scraper/\"\
  >Browse the catalog</a> &middot;\n  <a href=\"https://research-software-directory.org/communities/rs4rt/software\"\
  >RS4RT on the Research Software Directory</a>\n</p>\n\n---\n\n## About\n\nRS4RT is an independent initiative\
  \ created after the 2024 ESTRO physics workshop\n*Open-Source software and resource sharing in radiotherapy*.\
  \ Its aim is to make open-source\nradiotherapy software easier to find, cite and reuse.\n\nThis repository\
  \ holds the tools behind the catalog: a scraper that discovers candidate\nrepositories on GitHub and\
  \ GitLab, a review workflow for curating them by hand, and a\npublisher that pushes approved entries\
  \ to the\n[RS4RT community](https://research-software-directory.org/communities/rs4rt/software) on the\
  \ Research Software Directory.\n\nMaintained by the MIRO laboratory, UCLouvain.\n\n## How it works\n\
  \n1. **Discover** &mdash; the scraper queries GitHub and GitLab for radiotherapy and related\n   terms,\
  \ each discovered repo is assessed against a curated taxonomy of domain terms.\n   Depending on the\
  \ final score, the repository is either kept or discarded.\n   The scraper is run every two months and\
  \ it discards cached repositories.\n2. **Review** &mdash; surviving candidates are written to `to_review/`\
  \ as one folder per\n   repository, split across four parts. Reviewers edit the data and metadata of\
  \ each software\n   to ensure relevance and the quality of the information.\n3. **Publish** &mdash;\
  \ approved entries are grouped, formatted and posted to the Research\n   Software Directory under the\
  \ RS4RT community via their API.\n\nDiscovery runs on a schedule; review and publication are triggered\
  \ by hand.\n\n## Catalog\n\n**91** repositories &middot; sources: github, gitlab, other &middot; last\

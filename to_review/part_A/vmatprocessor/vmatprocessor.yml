readme_excerpt: "VmatProcessor CS2\n\n![image](https://github.com/user-attachments/assets/2d75c80b-7df8-4931-80fe-0e292a0257a9)\n\
  \nDisclaimer! This tool will not rip any textures from a game! You need to use other tools to get access\
  \ to the texture. For example \"Source 2 Viewer\" is a great tool for this \n\n![image](https://github.com/user-attachments/assets/e9af20ff-23c9-4336-a479-b32dd47bab8e)\n\
  \nAfter you have access to the textures from source 2 Hammer this will look for all VMAT material and\
  \ creates a list of names and paths \nthen you can use this (https://github.com/Conflig/BlnederS2Library)\
  \ Blender plugin which will create a material library from those textures \n\nYou can go one step further\
  \ and use my other plugin https://github.com/Conflig/source2_model_exporter which will allow you seamless\
  \ workflow between Blender and Source 2 hammer. \n\nYou can create your level or prop in blender hit\
  \ export and all textures from the library will be properly displayed in hammer (If you have custom\
  \ textures created just add them to the library and the name must be the same as in Hammer)\n\n\nSource\
  \ 2 Viewer will export large PNG files so I would recommend to convert them into JPG with more compression.\
  \ This will give you better performance in blender \n\n\n\n\n"

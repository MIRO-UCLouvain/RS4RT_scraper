readme_excerpt: "# GCR Dosimetry Pipeline\n\nAn open-source Python package for estimating galactic cosmic\
  \ ray (GCR) radiation exposure and cancer risk on crewed deep-space missions. It integrates GCR spectrum\
  \ generation, CSDA slab transport, organ-specific REID estimation, Solar Energetic Particle acute dosimetry,\
  \ and Latin Hypercube uncertainty quantification into one reproducible workflow.\n\nThis repository\
  \ accompanies the manuscript:\n\n> Shah, A. H. (2025). *An open-source GCR dosimetry pipeline for Mars\
  \ mission risk assessment: organ-specific REID, SEP acute hazard, and dual-use proton therapy RBE benchmarking.*\
  \ Submitted to *Life Sciences in Space Research*.\n\nThe point of this tool is to offer a quicker, tranparent,\
  \ and reproducable alternative to HZETRN and Geant4. The point is that those tools are closed, hard\
  \ to install, and don't come with uncertainty quantification built in. This one does, and anyone with\
  \ Python can run it.\n\n---\n\n## Quick Start\n\n```bash\ngit clone https://github.com/aryanhshah8/gcr-dosimetry-pipeline\n\
  cd gcr-dosimetry-pipeline\npip install -e .\npython scripts/download_data.py\npython scripts/validate_pipeline.py\n\
  ```\n\nTo reproduce the paper figures:\n\n```bash\npython scripts/plot_shielding_uncertainty.py   #\
  \ Figure 2\npython scripts/plot_let_spectrum.py            # Figure 3\npython scripts/plot_sep_shielding.py\
  \           # Figure 4\npython scripts/plot_reid_shielding.py          # Figure 5\npython scripts/plot_topas_benchmark.py\
  \         # Figure 6\n```\n\nFull N=500 uncertainty ensemble (~90 min on a single core):\n\n```bash\n\
  python scripts/validate_extended.py\n```\n\nA reduced N=20 version runs in under 2 minutes and is what\
  \ CI uses:\n\n```bash\nUNCERTAINTY_SAMPLES=20 python scripts/validate_extended.py\n```\n\n---\n\n##\
  \ What it does\n\n```\nspectrum.py  →  trajectory.py  →  transport.py  →  dose.py  →  reid.py  →  mission.py\n\
  \nGCR flux         Hohmann orbit      CSDA energy     Absorbed    Cancer risk\n(Boschini 2020   + Usoskin\
  \ phi      loss + nuclear  dose, dose  (Cucinotta 2013\n per-species LIS   along transfer    attenuation\
  \     equivalent  ERR+EAR model +\n + Gleeson-Axford  ellipse           + HZETRN        (ICRP-60)  \
  \ CDC 2020 life\n force field)                        neutron table)              tables)\n```\n\nThe\
  \ RBE module (`rbe.py`) runs the Wedenberg (2013) and McNamara (2015) proton RBE models using the same\
  \ LET infrastructure as the GCR quality factor calculation — so you can directly compare quality factors\
  \ across space and clinical radiation contexts from one codebase.\n\n---\n\n## Validation\n\nCalibrated\
  \ to MSL/RAD cruise-phase dosimetry, independently validated against shielding curve shape, Al/PE material\
  \ ratio, and temporal modulation:\n\n| Quantity | Pipeline | Reference | Source | Notes |\n|---|---|---|---|---|\n\
  | Shielding slope (5–30 g/cm²) | within envelope | HZETRN benchmark | Slaba (2014) | Independent |\n\
  | Al/PE dose ratio at 16 g/cm² | 1.36 | 1.43 ± 0.22 | Mrigakshi (2013) | Independent |\n| Daily r(dose,\
  \ φ) | >0.80 | — | Zeitlin (2013) | Independent |\n| Dose rate at 16 g/cm² Al | 1.843 mGy/day | 1.84\
  \ ± 0.33 | Zeitlin (2013) | **Calibration** |\n| Q_eff at 16 g/cm² Al | 2.60 | 2.62 ± 0.14 | Zeitlin\
  \ (2013) | **Calibration** |\n| V79 RBE (Wedenberg, plateau) | 1.053 | 1.053 | TOPAS-nBio | Self-consistency\
  \ |\n\nThe 0.05% dose rate match is a result of the calibration — not an independent prediction. The\
  \ independent checks are the shielding slope, the material ratio, and the temporal correlation.\n\n\
  **Per-species dose fractions at the calibration geometry** (16 g/cm² Al, φ = 481 MV):\n\n| Charge group\
  \ | Pipeline | NSRL GCR reference† |\n|---|---|---|\n| Z=1 (protons) | 46.7% | 73.3% |\n| Z=2 (helium)\
  \ | 16.8% | 19.2% |\n| Z>2 (HZE) | 30.9% | 7.6% |\n\n†Slaba et al. (2016), 20 g/cm² Al, solar minimum.\n\
  \nThe HZE fraction is about 4× higher than the reference. This is a known consequence of fitting six\
  \ normalization factors to one total dose measurement — the optimizer has too many degrees of freedom\
  \ and the result is not physically constrained at the species level. A proper species-resolved calibration\
  \ against MSL/RAD per-species data is the obvious next step.\n\n---\n\n## Uncertainty quantification\n\
  \nThe LHS ensemble varies eight physics and radiobiological parameters simultaneously. Key results for\
  \ a 35-year-old male, 259-day Earth–Mars transit at 16 g/cm² aluminum:\n\n- Median REID: **5.0%** (p5–p95:\
  \ 1.3%–16.9%)\n- Q-factor scale accounts for **76%** of REID variance\n- DDREF accounts for **7%**\n\
  - All GCR physics parameters combined: **<9%** of REID variance\n- Solar modulation (phi_scale): **3.5%**\
  \ of REID variance but **72%** of absorbed dose variance\n\nThe main takeaway: improving GCR transport\
  \ physics will narrow dose uncertainty but won't move the needle on cancer risk estimates until the\
  \ high-LET radiobiology is better understood.\n\n---\n\n## Known limitations\n\n- **No nuclear fragmentation\
  \ transport.** Heavy ions are exponentially attenuated — the pipeline doesn't track secondary lighter\
  \ ions from fragmentation reactions. Comparisons with full transport codes suggest the HZE quality factor\
  \ at 16 g/cm² is overestimated by roughly 15–25% as a result.\n- **Six GCR species only.** Magnesium\
  \ and other minor species are absent; their combined contribution is estimated at <5% of total dose.\n\
  - **Slab geometry.** The spacecraft is a uniform aluminum slab. Real geometries need ray-tracing.\n\
  - **Cucinotta (2013) REID model.** The NASA 2023 age- and sex-dependent career limit framework is not\
  \ implemented.\n- **TOPAS comparisons.** V79 agreement is an independent check against TOPAS-nBio reference\
  \ data. Prostate and H&N comparisons are self-consistency only — no external experimental data were\
  \ used.\n\n---\n\n## Running the tests\n\n```bash\npytest                                 # 103 unit\
  \ tests\npython scripts/validate_pipeline.py   # dose rate, Q_eff, Al/PE ratio\npython scripts/validate_extended.py\
  \   # LHS ensemble + variance decomposition\npython scripts/validate_rbe.py        # Wedenberg and McNamara\
  \ vs TOPAS-nBio\n```\n\nNo proprietary datasets are required. Everything needed is in `data/`.\n\n---\n\
  \n## Citation\n\nIf you use this code, please cite:\n\n```\nShah, A. H. (2025). An open-source GCR dosimetry\
  \ pipeline for Mars mission\nrisk assessment: organ-specific REID, SEP acute hazard, and dual-use proton\n\
  therapy RBE benchmarking. Life Sciences in Space Research (submitted).\n```\n\n---\n\n## References\n\
  \n- Zeitlin et al. (2013). Measurements of energetic particle radiation in transit to Mars. *Science*\
  \ 340, 1080–1084.\n- Cucinotta et al. (2013). Space radiation cancer risk projections and uncertainties.\
  \ NASA/TP-2013-217375.\n- Slaba et al. (2014). Optimal shielding thickness for galactic cosmic ray environments.\
  \ *Space Weather* 12, 217–227.\n- Slaba et al. (2016). Reference field specification and preliminary\
  \ beam selection strategy for accelerator-based GCR simulation. *Life Sci. Space Res.* 8, 52–67.\n-\
  \ Boschini et al. (2020). Deciphering the local interstellar spectra of primary cosmic-ray species with\
  \ HelMod. *ApJS* 250, 27.\n- Mrigakshi et al. (2013). Estimation of galactic cosmic ray exposure inside\
  \ spacecraft. *J. Geophys. Res.* 118, 6633–6643.\n- Wedenberg et al. (2013). A model for the relative\
  \ biological effectiveness of protons. *Acta Oncol.* 52, 580–588.\n- McNamara et al. (2015). A phenomenological\
  \ relative biological effectiveness model for proton therapy. *Phys. Med. Biol.* 60, 8399.\n- Gleeson\
  \ & Axford (1968). Solar modulation of galactic cosmic rays. *ApJ* 154, 1011.\n- Vos & Potgieter (2015).\
  \ New modeling of galactic proton modulation during solar minimum. *ApJ* 815, 119.\n\n---\n\n## License\n\

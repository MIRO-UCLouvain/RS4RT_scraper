readme_excerpt: "# Virtual-Patient-Specific-QA-for-Proton-Therapy\nThis project presents a virtual quality\
  \ assurance (QA) framework for proton therapy that predicts measurement fluence from Treatment Planning\
  \ System (TPS) data. The goal is to reduce reliance on time-consuming physical QA measurements by leveraging\
  \ computational modeling to verify treatment delivery accuracy.\n\nPatient-specific quality assurance\
  \ (PSQA) is a critical step in proton therapy to ensure that planned dose distributions are accurately\
  \ delivered. Traditional QA methods rely on physical measurements, which can be resource-intensive and\
  \ time-consuming.\n\nThis project introduces a virtual PSQA pipeline that predicts measured fluence\
  \ maps directly from TPS outputs, allowing for rapid and scalable QA verification.\n\nInput\nTPS-generated\
  \ fluence maps\nOutput\nPredicted measurement fluence maps\nApproach\nData preprocessing and normalization\
  \ of TPS and measured fluence\nSupervised learning model (e.g., CNN / regression-based architecture)\n\
  Training on paired TPS–measurement datasets\nEvaluation using gamma analysis and error metrics\n\n⚠️\
  \ Disclaimer\n\nThis project is intended for research purposes only and is not approved for clinical\
  \ use without proper validation and regulatory compliance.\n\n## \U0001F464 Author\n\n**SA Yoganathan**\
  \  \nMedical Physicist  \nSaint John Regional Hospital  \nSaint John, NB, Canada  \n\n---\n\n### \U0001F4EC\
  \ Contact\nFor questions, collaborations, or research inquiries, please open an issue or contact via\
  \ GitHub.\n"

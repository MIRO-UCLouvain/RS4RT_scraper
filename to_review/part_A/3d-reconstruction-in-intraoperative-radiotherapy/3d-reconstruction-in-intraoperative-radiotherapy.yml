readme_excerpt: "# This is an implementation of the paper \"3D Reconstruction based Descending Stereo\
  \ Images in Intraoperative Radiotherapy\"\n\n## Get Start\n\n1. You will need to follow the instructions\
  \ in [weiyithu/NerfingMVS](https://github.com/weiyithu/NerfingMVS) to **install COLMAP** on your machine.\n\
  \n    (Notice that you will encounter an error if you download the original COLMAP )\n\n2. **Download\
  \ the dataset** from [here](https://drive.google.com/file/d/165Dkw_Ot9HOxTiU4zf9A7aBFE2Lk5eqk/view?usp=sharing)\
  \ , which includes (a)some descending stereo images we acquired with our own equipment, (b)the public\
  \ data we used in the experiment, and (c) the data of each scene has been rectified and segmented.\n\
  \n    You can test your demo dataset according to this folder structure.\n\n```shell\n|───exp_name\n\
  |    |────── l\n|    |   |    |   images\n|    |   |    |    | 1.jpg\n|    |   |    |    | ...\n|  \
  \  |   |    |   rectify\n|    |   |    |    | 1_$cut_width.jpg\n|    |   |    |    | ...\n|    |   |\
  \    |───── disparity / depth (for metric)\n|    |   |    |    | 1.png\n|    |   |    |    | ...\n|\
  \    |—————— r\n|    |   |    |   images\n|    |   |    |    | 1.jpg\n|    |   |    |    | ...\n|  \
  \  |   |    |   rectify\n|    |   |    |    | 1_$cut_width.jpg\n|    |   |    |    | ...\n|    |——————\
  \ mask_l\n|    |   |    | 1.png\n|    |   |    | ...\n|    |—————— mask_r\n|    |   |    | 1.png\n|\
  \    |   |    | ...\n|    |—————— train.txt\n|    |—————— test.txt\n|───configs\n|    $exp_name.txt\n\
  |     ...\n```\n\n3. **Install the packages** used by the following command\n\n```shell\npip install\
  \ torch torchvision torchaudio\npip install -r requirements.txt\n```\n\n## Train and Test\n\n1. Run\
  \ COLMAP\n\n```shell\nsh colmap.sh $scene_name\n```\n\n2. Run demo dataset\n\n```shell\npython run.py\
  \ --config configs/$scene_name.txt --mask_guide_sample_rate 0.4 --depth_refine_start 100000 --depth_refine_period\
  \ 1000 --depth_refine_rounds 3 --N_iters 200001 --train_binocular --demo\n```\n\n3. Run public dataset\n\
  \n```shell\npython run.py --config configs/$scene_name.txt\n```\n\n## Acknowledgement\n\nOur code is\
  \ based on [weiyithu/NerfingMVS](https://github.com/weiyithu/NerfingMVS). We also refer to [med-air/EndoNeRF](https://github.com/med-air/EndoNeRF).\n\
  \n"

readme_excerpt: "![Header](docs/_static/logo_header.png)\n# MAMA-MIA: A large-scale multicenter breast\
  \ cancer DCE-MRI benchmark dataset with expert segmentations\n[![arXiv](https://img.shields.io/badge/Sci._Data_Paper-Link-b31b1b.svg)](https://doi.org/10.1038/s41597-025-04707-4)\
  \ [![Synapse](https://img.shields.io/badge/Synapse-syn60868042-1258.svg)](https://doi.org/10.7303/syn60868042)\
  \ [![License](https://img.shields.io/badge/License-CC--BY--NC--40-647.svg)](https://creativecommons.org/licenses/by-nc/4.0/)\n\
  \ \nWelcome to the **MAMA-MIA** dataset repository! This dataset contains **1,506** cases of **breast\
  \ cancer** dynamic contrast-enhanced magnetic resonance images (**DCE-MRI**) with **expert tumor segmentations**.\
  \ Below, you will find all the necessary information to download and use the dataset, as well as instructions\
  \ on how to run inference using our pre-trained nnUNet model.\n\n## \U0001F4E2 Join the MAMA-MIA Challenge!\n\
  \nAre you working with breast cancer DCE-MRI data? Put your algorithms to the test in the **MAMA-MIA\
  \ Challenge** – an international benchmark on **tumour segmentation** and **treatment response prediction**!\n\
  \n\U0001F52C **2 Tasks** · \U0001F9E0 **Real-world data** · \U0001F3C6 **Evaluation on private multicenter\
  \ datasets**\n\n\U0001F680 Submit your models to Codabench \n\U0001F517 [Participate now on Codabench](https://www.codabench.org/competitions/7425/)\n\
  \nThe **MAMA-MIA Challenge** paper is now available on arXiv: \U0001F517 [https://arxiv.org/abs/2603.01250](https://arxiv.org/abs/2603.01250)\n\
  \nIf you participate in the challenge or use its framework, please cite the arXiv paper.\n\nIf you use\
  \ the MAMA-MIA dataset or the pretrained model in your research, please cite our publication and the\
  \ dataset publications of the images included in the dataset.\n#### BibTex:\n````\n@article{garrucho2025,\n\
  \  title={A large-scale multicenter breast cancer DCE-MRI benchmark dataset with expert segmentations},\n\
  \  author={Garrucho, Lidia and Kushibar, Kaisar and Reidel, Claire-Anne and Joshi, Smriti and Osuala,\
  \ Richard and Tsirikoglou, Apostolia and Bobowicz, Maciej and Riego, Javier del and Catanese, Alessandro\
  \ and Gwoździewicz, Katarzyna and Cosaka, Maria-Laura and Abo-Elhoda, Pasant M and Tantawy, Sara W and\
  \ Sakrana, Shorouq S and Shawky-Abdelfatah, Norhan O and Salem, Amr Muhammad Abdo and Kozana, Androniki\
  \ and Divjak, Eugen and Ivanac, Gordana and Nikiforaki, Katerina and Klontzas, Michail E and García-Dosdá,\
  \ Rosa and Gulsun-Akpinar, Meltem and Lafcı, Oğuz and Mann, Ritse and Martín-Isla, Carlos and Prior,\
  \ Fred and Marias, Kostas and Starmans, Martijn P A and Strand, Fredrik and Díaz, Oliver and Igual,\
  \ Laura and Lekadir, Karim},\n  journal = {Scientific Data},\n  year = {2025},\n  doi = {10.1038/s41597-025-04707-4},\n\
  \  pages = {453},\n  number = {1},\n  volume = {12}\n}\n\n@misc{garrucho2026,\n      title={The MAMA-MIA\
  \ Challenge: Advancing Generalizability and Fairness in Breast MRI Tumor Segmentation and Treatment\
  \ Response Prediction}, \n      author={Lidia Garrucho and Smriti Joshi and Kaisar Kushibar and Richard\
  \ Osuala and Maciej Bobowicz and Xavier Bargalló and Paulius Jaruševičius and Kai Geissler and Raphael\
  \ Schäfer and Muhammad Alberb and Tony Xu and Anne Martel and Daniel Sleiman and Navchetan Awasthi and\
  \ Hadeel Awwad and Joan C. Vilanova and Robert Martí and Daan Schouten and Jeong Hoon Lee and Mirabela\
  \ Rusu and Eleonora Poeta and Luisa Vargas and Eliana Pastor and Maria A. Zuluaga and Jessica Kächele\
  \ and Dimitrios Bounias and Alexandra Ertl and Katarzyna Gwoździewicz and Maria-Laura Cosaka and Pasant\
  \ M. Abo-Elhoda and Sara W. Tantawy and Shorouq S. Sakrana and Norhan O. Shawky-Abdelfatah and Amr Muhammad\
  \ Abdo-Salem and Androniki Kozana and Eugen Divjak and Gordana Ivanac and Katerina Nikiforaki and Michail\
  \ E. Klontzas and Rosa García-Dosdá and Meltem Gulsun-Akpinar and Oğuz Lafcı and Carlos Martín-Isla\
  \ and Oliver Díaz and Laura Igual and Karim Lekadir},\n      year={2026},\n      eprint={2603.01250},\n\
  \      archivePrefix={arXiv},\n      primaryClass={cs.CV},\n      url={https://arxiv.org/abs/2603.01250},\
  \ \n}\n\n````\n\n### Potential Applications\nSome of the potential applications of the dataset are:\n\
  - Classification, Detection and Segmentation of Breast Cancer in MRI using Deep Learning.\n- Radiomic\
  \ extraction and Machine Learning.\n- Segmentation Model Finetuning using the Pretrained nnUNet Weigths.\n\
  - Fine-tuning of Foundational Models.\n- Treatment Response to Neoadjuvant Chemotherapy.\n- Patient\
  \ Survival Prediction.\n- Segmentation Quality Control.\n- Image Synthesis.\n\n\n## Repository Structure\n\
  ````\n├── README.md                     # Project overview, setup instructions, and usage details\n\
  ├── requirements.txt              # List of Python package dependencies for running the project\n├──\
  \ nnUNet                        # Forked nnUNet GitHub repository for training the automatic segmentation\
  \ model\n├── notebooks                      # Jupyter Notebooks for project demos and examples\n│  \
  \ ├── demo_preprocessing_pipeline.ipynb   # Demonstrates common MRI preprocessing steps (e.g., bias\
  \ field correction, normalization, resampling)\n│   ├── display_clinical_data.ipynb         # Example\
  \ on how to parse and visualize clinical data from the dataset\n│   └── display_segmentations.ipynb\
  \         # Various methods for displaying MRI images and their corresponding segmentation masks\n└──\
  \ src                             # Python source code used in the Jupyter Notebooks\n    ├── clinical_data.py\
  \           # Functions for handling and processing clinical data\n    ├── preprocessing.py        \
  \   # Preprocessing functions\n    └── visualization.py           # Functions for visualizing images,\
  \ segmentations, and metrics\n````\n\n## Downloading the Dataset\nThe MAMA-MIA dataset is hosted on\
  \ [Synapse](https://doi.org/10.7303/syn60868042). You can download the dataset using the CLI or Python\
  \ with the following code:\n\nLog in using a Personal Access Token (recommended):\n- Create a [Personal\
  \ Access Token](https://www.synapse.org/#!PersonalAccessTokens:)\n\n##### Command Line Interface (CLI)\n\
  ```bash\n synapse login --authToken <YOUR_TOKEN_HERE>\n synapse get -r syn60868042\n```\n\n##### Python\n\
  \n```bash\nimport synapseclient\nsyn = synapseclient.Synapse()\nsyn.login(authToken=\"YOUR_TOKEN_HERE\"\
  )  # or syn.login('username', 'password')\nentity = syn.get(\"syn60868042\")\n```\n> Check Synapse [documentation](https://help.synapse.org/docs/Downloading-Data-Programmatically.2003796248.html)\
  \ for more info. \n\n### Alternative Download (XNAT)\n\nIf you are unable to access Synapse due to regional\
  \ or institutional restrictions, the dataset is also available through the **Health-RI XNAT** platform:\n\
  \n[Download MAMA-MIA dataset from XNAT](https://xnat.health-ri.nl/app/action/DisplayItemAction/search_value/mama_mia/search_element/xnat:projectData/search_field/xnat:projectData.ID)\n\
  \nYou will might to create an XNAT account (if you do not already have one) to access to the **MAMA-MIA**\
  \ project before downloading the data.\n\n## Content\n![Dataset Description](docs/_static/dataset_info.png)\n\
  \n## Expert Segmentations\n![Expert Segmentation](docs/_static/segmentation_process.png)\n\n## Running\
  \ Inference with nnUNet pre-trained model\nThe pre-trained vanilla nnUNet model has been trained using\
  \ the 1506 full-image DCE-MRIs and the expert segmentations from the MAMA-MIA dataset. \n\n| **Full-image\
  \ Tumor Segmentation** | **Dice** | **IoU** | **HD95** | **MSD**  |\n|-------|---------:|--------:|---------:|---------:|\n\
  | nnUNet Fold 0|  0.7600  |  0.6512 |  39.90   |  11.89   |\n| nnUNet Fold 1|  0.7617  |  0.6500 | \
  \ 41.25   |  12.10   |\n| nnUNet Fold 2|  0.7749  |  0.6714 |  31.12   |  8.86   |\n| nnUNet Fold 3|\
  \  0.7616  |  0.6577 |  36.25   |  11.74   |\n| nnUNet Fold 4|  0.7520  |  0.6396 |  38.57   |  10,81\
  \   |\n| **nnUNet Mean** |  **0.7620**  |  **0.6539** |  **37.41**  |  **11.08**  |\n\nThe metrics correspond\
  \ to Dice Coefficient, Intersection over Union (IoU), the 95 Percentile of Hausdorff Distance (HD95)\
  \ and to the Mean Surface Distance (MSD). The distances are in mm.\nThe library used to compute these\
  \ metrics was [seg-metrics v1.2.7](https://doi.org/10.5281/zenodo.12094185). \n\n\n##### Step 1. Clone\
  \ the repository\nClone the forked repository of nnUNet.\n````\ngit clone https://github.com/LidiaGarrucho/MAMA-MIA\n\
  cd MAMA-MIA/nnUNet\n````\n\n##### Step 2. Install the necessary dependencies\nTo run the pre-trained\
  \ nnUNet model, follow the [installation instructions](https://github.com/LidiaGarrucho/nnUNet/blob/master/documentation/installation_instructions.md).\n\
  \n##### Step 3. Download the pre-trained weights\nThe nnUNet pretrained weights can be dowloaded from\
  \ [Synapse](https://www.synapse.org/Synapse:syn61247992).\nUnzip the folder inside nnUNet GitHub repository\
  \ under `nnUNet/nnunetv2/nnUNet_results`.\n\n##### Step 4. (Recommended) Preprocess your input MRI images\n\
  The recommended preprocessing steps to get optimum performance are:\n- **z-score normalization**. For\
  \ DCE-MRI, use the mean and standard deviation of all the phases (from pre to last post-contrast) to\
  \ z-score the DCE-MRI sequence.\n- **isotropic pixel spacing**. The MRIs were resampled using a uniform\
  \ pixel spacing of [1,1,1].\n\n##### Step 5. Run the nnUNet inference\n````\nnnUNetv2_predict -i /path/to/your/images\
  \ -o /path/to/output -d 101 -c 3d_fullres\n````\n- Replace `/path/to/your/images` with the directory\
  \ containing your input images.\n- Replace `/path/to/output` with the directory where you want to save\
  \ the output segmentations.\n\n> Note: An error might arise if your images are not in compressed NifTI\
  \ format (.nii.gz).\n\n## Citation and Attribution\nIf you use the MAMA-MIA dataset or the pretrained\
  \ model in your research, please cite our publication and the dataset publications of the images included\
  \ in the dataset.\n\n#### MAMA-MIA Dataset\n> Garrucho, L., Kushibar, K., Reidel, CA. et al. A large-scale\
  \ multicenter breast cancer DCE-MRI benchmark dataset with expert segmentations. Sci Data 12, 453 (2025)\
  \ ([10.1038/s41597-025-04707-4](https://doi.org/10.1038/s41597-025-04707-4)).\n\n##### BibTex:\n````\n\
  @article{garrucho2025,\n  title={A large-scale multicenter breast cancer DCE-MRI benchmark dataset with\
  \ expert segmentations},\n  author={Garrucho, Lidia and Kushibar, Kaisar and Reidel, Claire-Anne and\
  \ Joshi, Smriti and Osuala, Richard and Tsirikoglou, Apostolia and Bobowicz, Maciej and Riego, Javier\
  \ del and Catanese, Alessandro and Gwoździewicz, Katarzyna and Cosaka, Maria-Laura and Abo-Elhoda, Pasant\
  \ M and Tantawy, Sara W and Sakrana, Shorouq S and Shawky-Abdelfatah, Norhan O and Salem, Amr Muhammad\
  \ Abdo and Kozana, Androniki and Divjak, Eugen and Ivanac, Gordana and Nikiforaki, Katerina and Klontzas,\
  \ Michail E and García-Dosdá, Rosa and Gulsun-Akpinar, Meltem and Lafcı, Oğuz and Mann, Ritse and Martín-Isla,\
  \ Carlos and Prior, Fred and Marias, Kostas and Starmans, Martijn P A and Strand, Fredrik and Díaz,\
  \ Oliver and Igual, Laura and Lekadir, Karim},\n  journal = {Scientific Data},\n  year = {2025},\n \
  \ doi = {10.1038/s41597-025-04707-4},\n  pages = {453},\n  number = {1},\n  volume = {12}\n}\n````\n\
  \nThe MAMA-MIA dataset includes public DCE-MRI images from four different collection in the TCIA repository\
  \ under the following licenses:\n\n#### ISPY1 Trial (License [CC BY 3.0](https://creativecommons.org/licenses/by/3.0/))\

  \ Multi-center breast DCE-MRI data and segmentations from patients in the I-SPY 1/ACRIN 6657 trials.\
  \ The Cancer Imaging Archive. [https://doi.org/10.7937/K9/TCIA.2016.HdHpgJLK](https://www.cancerimagingarchive.net/collection/ispy1/)\n\

readme_excerpt: "# Uncertainty quantification for outcome modelling in radiation oncology: an illustrative\
  \ example\n\n## Introduction\nOutcome modelling is an important tool in radiation oncology to guide\
  \ treatment decisions. \nApplying these models into clinical practice requires reliable model outputs.\
  \ \nIn this context, uncertainty quantification can be used to assess reliability, interpretability\
  \ and explainability for various modelling strategies. \nHowever, the quantification of uncertainties\
  \ of outcome models in radiation oncology is still rarely done.\n\nAiming to inspire researchers to\
  \ build upon current knowledge about uncertainty quantification, we summarised basic concepts in a topical\
  \ review:  ```We will provide further information soon.```\n\nIn this notebook, we provide an example\
  \ for the application of the presented methods for uncertainty quantification. \n\n## Aim\nThis notebook\
  \ aims to demonstrate basic concepts of how different methods for uncertainty quantification can be\
  \ used for or integrated in outcome modelling in radiation oncology.\nIt uses an artificial example\
  \ of predicting radiation induced pneumonitis after irradiation.\nWe hope this notebook will help researchers\
  \ in the radiation oncology community to use uncertainty quantification techniques in their outcome\
  \ modelling.\n\n## Outline\nThe notebook is structured as follows:\n<ol>\n    <li>Data preparation</li>\n\
  \    <li>Model development</li> \n    <li>Methods for uncertainty quantification</li> \n        <ol>\n\
  \            <li>Ensemble methods</li>\n            <li>Bayesian methods</li>\n            <li>Test-time\
  \ augmentation (TTA) methods</li>\n        </ol>\n    <li>Application of uncertainty quantification</li>\n\
  \        <ol>\n            <li>In-distribution dataset</li>\n            <li>Shifted dataset</li>\n\
  \            <li>Out-of-distribution dataset</li>\n        </ol>\n    <li>Evaluation of uncertainty\
  \ quantification</li>\n    <ol>\n        <li>Sparsification plots</li>\n        <li>Conformal prediction</li>\n\
  \    </ol>\n    <li>Summary</li>\n</ol>\n\n## Dataset\nFor our demonstration example, we used an R-script\
  \ to artificially create a dataset based on the cohort used by ```Yakar M et al. 2021;20. doi:10.1177/15330338211016373```.\n\
  \nOur dataset consists of 200 patients and comprises three features:\n- Dose in Gy that is applied to\
  \ 5% of the lunge volume ($D5\\%$): dose_to_5_percent_of_lung_volume\n- Gross tumour volume (GTV) in\
  \ $cm^3$: gross_tumour_volume\n- Number of cycles of chemotherapy as integer: n_chemotherapy_cycles\n\
  \nThe studied outcome variable is the presence of a radiation induced pneumonitis:\n- outcome $\\in$\
  \ {0, 1}: 0 - no radiopneumonitis; 1 - radiopneumonitis\n\nIn general, the following correlations apply:\n\
  - The risk of radiopneumonitis increases with the dose to 5% of the lung volume.\n- The risk of radiopneumonitis\
  \ increases with the gross tumour volume.\n- The risk of radiopneumonitis increases with the number\
  \ of applied chemotherapy cycles. \n\nA more detailed description can be found in the R-file used for\
  \ creation.\n\n## Dependencies\nThe demonstration example was developed using Python (Version 3.11.6)\
  \ and requires working versions of NumPy, SciPy, pandas, matplotlib, seaborn, scikit-learn, statsmodels,\
  \ PyMC and ArviZ.\n\n## Citation info\nIf you use this repository, please cite the following paper:\n\
  \n```We will provide further information soon.```\n\n"

readme_excerpt: "![q-e-logo](logo.jpg)\n\nThis is the distribution of the Quantum ESPRESSO suite of codes\
  \ (ESPRESSO:\nopEn-Source Package for Research in Electronic Structure, Simulation, and\nOptimization)\n\
  \n[![License: GPL v2](https://img.shields.io/badge/License-GPL%20v2-blue.svg)](https://www.gnu.org/licenses/old-licenses/gpl-2.0.en.html)\n\
  \n## USAGE\nQuick installation instructions for CPU-based machines. For GPU execution, see\nfile [README_GPU.md](README_GPU.md).\
  \ Go to the directory where this file is. \n\nUsing \"make\"\n(`[]` means \"optional\"):\n```\n./configure\
  \ [options]\nmake all\n```\n\"make\" alone prints a list of acceptable targets. Optionally,\n`make -jN`\
  \ runs parallel compilation on `N` processors.\nLink to binaries are found in bin/.\n\nUsing \"CMake\"\
  \ (v.3.14 or later):\n\n```\nmkdir ./build\ncd ./build\ncmake -DCMAKE_Fortran_COMPILER=mpif90 -DCMAKE_C_COMPILER=mpicc\
  \ [-DCMAKE_INSTALL_PREFIX=/path/to/install] ..\nmake [-jN]\n[make install]\n```\nAlthough CMake has\
  \ the capability to guess compilers, it is strongly recommended to specify\nthe intended compilers or\
  \ MPI compiler wrappers as `CMAKE_Fortran_COMPILER` and `CMAKE_C_COMPILER`.\n\"make\" builds all targets.\
  \ Link to binaries are found in build/bin.\nIf `make install` is invoked, directory `CMAKE_INSTALL_PREFIX`\n\
  is prepended onto all install directories.\n\nFor more information, see the general documentation in\
  \ directory Doc/, \npackage-specific documentation in \\*/Doc/, and the web site \nhttp://www.quantum-espresso.org/.\
  \ Technical documentation for users and\ndevelopers \ncan be found on [Wiki page on gitlab](https://gitlab.com/QEF/q-e/-/wikis/home).\n\
  \n## PACKAGES\n\n- PWscf: structural optimisation and molecular dynamics on the electronic ground state,\
  \ with self-consistent solution of DFT equations;\n- CP: Car-Parrinello molecular dynamics;\n- PHonon:\
  \ vibrational and dielectric properties from DFPT (Density-Functional Perturbation Theory);\n- TD-DFPT:\
  \ spectra from Time-dependent DFPT;\n- HP: calculation of Hubbard parameters from DFPT;\n- EPW: calculation\
  \ of electron-phonon coefficients, carrier transport, phonon-limited superconductivity and phonon-assisted\
  \ optical processes;\n- PWCOND: ballistic transport;\n- XSpectra: calculation of X-ray absorption spectra;\n\
  - PWneb: reaction pathways and transition states with the Nudged Elastic Band method;\n- GWL: many-body\
  \ perturbation theory in the GW approach using ultra-localised Wannier functions and Lanczos chains;\n\
  - QEHeat: energy current in insulators for thermal transport calculations in DFT.\n- KCW: Koopmans-compliant\
  \ functionals in a Wannier representation\n\n## Modular libraries\nThe following libraries have been\
  \ isolated and partially encapsulated in view of their release for usage in other codes as well:\n\n\
  - UtilXlib: performing basic MPI handling, error handling, timing handling.\n- FFTXlib: parallel (MPI\
  \ and OpenMP) distributed three-dimensional FFTs, performing also load-balanced distribution of data\
  \ (plane waves, G-vectors and real-space grids) across processors.\n- LAXlib: parallel distributed dense-matrix\
  \ diagonalization, using ELPA, SCALapack, or a custom algorithm.\n- KS Solvers: parallel iterative diagonalization\
  \ for the Kohn-Sham Hamiltonian (represented as an operator),using block Davidson and band-by-band or\
  \ block Conjugate-Gradient algorithms.\n- LRlib: performs a variety of tasks connected with (time-dependent)\
  \ DFPT, to be used also in connection with Many-Body Perturbation Theory.\n- upflib: pseudopotential-related\
  \ code.\n- devXlib: low-level utilities for GPU execution\n\n## Contributing\nQuantum ESPRESSO is an\
  \ open project: contributions are welcome.\nRead the [Contribution Guidelines](CONTRIBUTING.md) to see\
  \ how you\ncan contribute.\n\n## LICENSE\n\nAll the material included in this distribution is free software;\n\
  you can redistribute it and/or modify it under the terms of the GNU\nGeneral Public License as published\
  \ by the Free Software Foundation;\neither version 2 of the License, or (at your option) any later version.\n\
  \nThese programs are distributed in the hope that they will be useful, but\nWITHOUT ANY WARRANTY; without\
  \ even the implied warranty of MERCHANTABILITY\nor FITNESS FOR A PARTICULAR PURPOSE. See the GNU General\
  \ Public License\nfor more details.\n\nYou should have received a copy of the GNU General Public License\
  \ along\nwith this program; if not, write to the Free Software Foundation, Inc.,\n675 Mass Ave, Cambridge,\
  \ MA 02139, USA.\n"

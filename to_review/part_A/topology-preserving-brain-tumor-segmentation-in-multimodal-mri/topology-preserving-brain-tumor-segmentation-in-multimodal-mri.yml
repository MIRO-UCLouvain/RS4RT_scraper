readme_excerpt: "# Neural Tumor Morphogenesis Network (NTMN)\r\n\r\n## Topology-Preserving Brain Tumor\
  \ Segmentation in Multimodal MRI\r\n\r\nOfficial implementation of the paper:\r\n\r\n**Neural Tumor\
  \ Morphogenesis Network for Topology-Preserving Brain Tumor Segmentation in Multimodal MRI**\r\n\r\n\
  ---\r\n\r\n## Overview\r\n\r\nBrain tumor segmentation from multimodal magnetic resonance imaging (MRI)\
  \ plays a critical role in diagnosis, treatment planning, surgical guidance, and disease monitoring.\
  \ Existing deep learning methods often formulate segmentation as a direct voxel-wise prediction task,\
  \ which may result in fragmented tumor structures, disconnected edema regions, and unstable boundary\
  \ delineation.\r\n\r\nThe proposed **Neural Tumor Morphogenesis Network (NTMN)** reformulates brain\
  \ tumor segmentation as a progressive latent structural refinement process. Instead of generating segmentation\
  \ masks through a single prediction step, NTMN iteratively evolves latent anatomical representations\
  \ while preserving structural continuity, topological consistency, and segmentation reliability.\r\n\
  \r\nThe framework integrates:\r\n\r\n* Anatomical State Encoder (ASE)\r\n* Tumor Evolution Dynamics\
  \ Module (TEDM)\r\n* Topology-Constrained Structural Field (TCSF)\r\n* Probabilistic Stability Refinement\
  \ (PSR)\r\n\r\nThe term *morphogenesis* in this framework refers to progressive latent structural evolution\
  \ during segmentation refinement and does not represent biological tumor growth simulation.\r\n\r\n\
  ---\r\n\r\n## Framework Architecture\r\n\r\n```text\r\nInput MRI\r\n     ¦\r\n     v\r\nAnatomical State\
  \ Encoder (ASE)\r\n     ¦\r\n     v\r\nTumor Evolution Dynamics Module (TEDM)\r\n     ¦\r\n     v\r\n\
  Topology-Constrained Structural Field (TCSF)\r\n     ¦\r\n     v\r\nProbabilistic Stability Refinement\
  \ (PSR)\r\n     ¦\r\n     v\r\nFinal Segmentation\r\n```\r\n\r\n---\r\n\r\n## Key Contributions\r\n\r\
  \n### 1. Progressive Structural Evolution\r\n\r\nA recurrent structural evolution mechanism is introduced\
  \ to iteratively stabilize tumor morphology during segmentation refinement.\r\n\r\n### 2. Topology-Aware\
  \ Segmentation\r\n\r\nPersistent topology preservation is incorporated to reduce disconnected edema\
  \ regions and fragmented tumor structures.\r\n\r\n### 3. Uncertainty-Guided Refinement\r\n\r\nEntropy-based\
  \ uncertainty estimation selectively refines anatomically ambiguous regions and improves segmentation\
  \ reliability.\r\n\r\n### 4. Multi-Dataset Generalization\r\n\r\nThe proposed framework is evaluated\
  \ across multiple brain tumor MRI datasets to demonstrate robustness under heterogeneous clinical conditions.\r\
  \n\r\n---\r\n\r\n## Datasets\r\n\r\n## Datasets\r\n\r\nExperiments were conducted using publicly available\
  \ multimodal brain tumor MRI datasets.\r\n\r\n### 1. BraTS 2021\r\n\r\nThe Brain Tumor Segmentation\
  \ (BraTS) 2021 benchmark provides expert-annotated multimodal MRI scans for glioma segmentation and\
  \ remains one of the most widely used datasets for brain tumor analysis research.\r\n\r\nDataset Link:\r\
  \nhttps://www.med.upenn.edu/cbica/brats/\r\n\r\nBraTS 2021 Challenge:\r\nhttps://www.synapse.org/Synapse:syn25829067/wiki/\r\
  \n\r\nReference:\r\nU. Baid et al., *The RSNA-ASNR-MICCAI BraTS 2021 Benchmark on Brain Tumor Segmentation\
  \ and Radiogenomic Classification*, 2021.\r\n\r\n---\r\n\r\n### 2. BraTS 2023\r\n\r\nBraTS 2023 is a\
  \ large-scale multi-institutional benchmark for brain tumor segmentation and analysis, providing multimodal\
  \ MRI scans with expert annotations for robust tumor delineation research.\r\n\r\n**Dataset Access:**\r\
  \nhttps://www.synapse.org/Synapse:syn51156910/wiki/622351\r\n\r\n**CBICA BraTS Portal:**\r\nhttps://www.med.upenn.edu/cbica/brats/\r\
  \n\r\nReference:\r\nBraTS 2023 Challenge Dataset and Benchmark.\r\n\r\n---\r\n\r\n### 3. UCSF-PDGM (TCIA)\r\
  \n\r\nThe University of California San Francisco Preoperative Diffuse Glioma MRI (UCSF-PDGM) dataset\
  \ provides standardized preoperative glioma MRI scans, tumor segmentations, clinical information, and\
  \ genomic characteristics.\r\n\r\nDataset Link:\r\nhttps://www.cancerimagingarchive.net/collection/ucsf-pdgm/\r\
  \n\r\nReference:\r\nE. Calabrese et al., *The University of California San Francisco Preoperative Diffuse\
  \ Glioma MRI Dataset*, Scientific Data, 2022.\r\n\r\n---\r\n\r\n### 4. UPenn-GBM (TCIA)\r\n\r\nThe UPenn-GBM\
  \ dataset contains multi-parametric MRI scans, clinical outcomes, genomic information, and tumor segmentation\
  \ labels for glioblastoma patients.\r\n\r\nDataset Link:\r\nhttps://www.cancerimagingarchive.net/collection/upenn-gbm/\r\
  \n\r\nReference:\r\nThe Cancer Imaging Archive (TCIA) UPenn-GBM Collection.\r\n\r\n---\r\n\r\n### 5.\
  \ Figshare Brain Tumor Dataset\r\n\r\nThe Figshare Brain Tumor Dataset contains T1-weighted contrast-enhanced\
  \ MRI images with tumor annotations and classification labels.\r\n\r\nDataset Link:\r\nhttps://figshare.com/articles/dataset/brain_tumor_dataset/1512427\r\
  \n\r\nMirror Dataset:\r\nhttps://www.kaggle.com/datasets/ashkhagan/figshare-brain-tumor-dataset\r\n\r\
  \nReference:\r\nJun Cheng, Brain Tumor Dataset, Figshare.\r\n\r\n---\r\n\r\n## MRI Modalities\r\n\r\n\
  The proposed NTMN framework utilizes multimodal MRI inputs:\r\n\r\n* T1-weighted MRI\r\n* T1-weighted\
  \ contrast-enhanced MRI (T1ce)\r\n* T2-weighted MRI\r\n* FLAIR MRI\r\n\r\nAll MRI volumes were preprocessed\
  \ using normalization, resizing, intensity standardization, and structural augmentation before training.\r\
  \n\r\n---\r\n\r\n## Dataset Directory Structure\r\n\r\n```text\r\ndatasets/\r\n¦\r\n+-- BraTS2021/\r\
  \n+-- BraTS2023/\r\n+-- UCSF_PDGM/\r\n+-- UPenn_GBM/\r\n+-- Figshare/\r\n```\r\n\r\nExample:\r\n\r\n\
  ```text\r\ndatasets/\r\n¦\r\n+-- BraTS2021/\r\n    ¦\r\n    +-- images/\r\n    +-- masks/\r\n    +--\
  \ metadata/\r\n```\r\n---\r\n\r\n## Repository Structure\r\n\r\n```text\r\nNTMN/\r\n¦\r\n+-- configs/\r\
  \n+-- datasets/\r\n+-- evaluation/\r\n+-- losses/\r\n+-- models/\r\n+-- training/\r\n+-- utils/\r\n\
  ¦\r\n+-- train.py\r\n+-- inference.py\r\n+-- requirements.txt\r\n+-- README.md\r\n```\r\n\r\n---\r\n\
  \r\n## Installation\r\n\r\n### Clone Repository\r\n\r\n```bash\r\ngit clone https://github.com/username/NTMN.git\r\
  \ncd NTMN\r\n```\r\n\r\n### Install Dependencies\r\n\r\n```bash\r\npip install -r requirements.txt\r\
  \n```\r\n\r\n---\r\n\r\n## Training\r\n\r\nRun model training using:\r\n\r\n```bash\r\npython train.py\r\
  \n```\r\n\r\nExample:\r\n\r\n```bash\r\npython train.py --epochs 150 --batch_size 8 --learning_rate\
  \ 0.0001\r\n```\r\n\r\n---\r\n\r\n## Inference\r\n\r\nRun inference on a trained model:\r\n\r\n```bash\r\
  \npython inference.py --image sample_mri.png\r\n```\r\n\r\nExample:\r\n\r\n```bash\r\npython inference.py\
  \ \\\r\n--image sample_mri.png \\\r\n--model checkpoints/ntmn_best.pth\r\n```\r\n\r\nGenerated outputs\
  \ include:\r\n\r\n* Segmentation map\r\n* Overlay visualization\r\n* Uncertainty map\r\n* High-resolution\
  \ qualitative figure\r\n\r\n---\r\n\r\n## Evaluation Metrics\r\n\r\nPerformance is evaluated using:\r\
  \n\r\n* Dice Similarity Coefficient (DSC)\r\n* Intersection over Union (IoU)\r\n* Hausdorff Distance\
  \ (HD)\r\n* Average Symmetric Surface Distance (ASSD)\r\n* Sensitivity\r\n* Specificity\r\n* Precision\r\
  \n\r\nStatistical significance analysis is performed using paired Wilcoxon signed-rank tests.\r\n\r\n\
  ---\r\n\r\n## Reproducibility\r\n\r\nTo improve experimental reproducibility and reduce stochastic optimization\
  \ bias, experiments are independently repeated across multiple random initialization seeds:\r\n\r\n\
  ```text\r\n42\r\n123\r\n999\r\n```\r\n\r\nAll reported metrics correspond to the mean performance across\
  \ repeated trials.\r\n\r\n---\r\n\r\n## Qualitative Analysis\r\n\r\nThe repository supports visualization\
  \ of:\r\n\r\n* Segmentation comparisons\r\n* Structural evolution analysis\r\n* Topology preservation\
  \ analysis\r\n* Uncertainty-guided refinement analysis\r\n* Ablation studies\r\n\r\n---\r\n\r\n## Citation\r\
  \n\r\nIf you use this repository in your research, please cite:\r\n\r\n```bibtex\r\n@article{NTMN2026,\r\
  \n  title={Neural Tumor Morphogenesis Network for Topology-Preserving Brain Tumor Segmentation in Multimodal\
  \ MRI},\r\n  author={Author Names},\r\n  journal={Pattern Analysis and Applications},\r\n  year={2026}\r\
  \n}\r\n```\r\n\r\n---\r\n\r\n## License\r\n\r\nThis repository is released for academic and research\
  \ purposes.\r\n\r\n---\r\n\r\n## Contact\r\n\r\nFor questions regarding the implementation or paper,\
  \ please contact the corresponding author.\r\n"

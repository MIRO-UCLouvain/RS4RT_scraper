readme_excerpt: "# ESAPI Clinical Tools - Oulu\n\nA professional collection of Eclipse ESAPI scripts for\
  \ clinical radiotherapy workflows, developed for hospital use.\n\n## ⚠️ Clinical Safety Notice\n\n**CRITICAL\
  \ - READ BEFORE USE**\n\nThese tools are intended to **ASSIST** clinical workflows but **DO NOT** replace\
  \ professional medical judgment, manual verification, or institutional quality assurance procedures.\n\
  \n**Important Safety Requirements:**\n- ✅ All scripts must be thoroughly validated at your institution\
  \ before clinical use\n- ✅ Independent verification by qualified medical physics staff is required\n\
  - ✅ Scripts must be reviewed and approved according to your institutional policies\n- ✅ Regular audits\
  \ and validation testing must be performed\n- ✅ All treatment plans must receive final approval by authorized\
  \ personnel\n- ⛔ Never use scripts clinically without proper validation and approval\n- ⛔ Never bypass\
  \ institutional safety procedures or manual review requirements\n- ⛔ Never assume scripts are error-free\
  \ or suitable for your specific clinical environment\n\n**User Responsibility:**\nBy using this software,\
  \ you accept full responsibility for validation, testing, and verification in your clinical environment.\
  \ The authors and contributors assume no liability for clinical use.\nThese scripts have not been certified\
  \ or approved as a medical device under any regulatory framework.\n\n## \U0001F4CB Validation Disclaimer\n\
  \n**NO WARRANTY - VALIDATION REQUIRED**\n\nThis software is provided under the MIT License with **ABSOLUTELY\
  \ NO WARRANTY**. \n\n**You are solely responsible for:**\n- Validating all scripts for accuracy and\
  \ suitability in your clinical environment\n- Performing comprehensive testing before any clinical use\n\
  - Ensuring compliance with local regulations and standards (FDA, IEC, national requirements)\n- Maintaining\
  \ documentation of validation testing\n- Training staff on proper usage and limitations\n- Implementing\
  \ appropriate error handling and safety checks\n- Monitoring for software updates and security issues\n\
  \n**Regulatory Compliance:**\nUsers must ensure compliance with all applicable regulatory requirements\
  \ including but not limited to:\n- FDA regulations (US)\n- IEC 62304 (Medical Device Software)\n- Local/national\
  \ medical device regulations\n- Institutional IRB/ethics requirements for research use\n- Data protection\
  \ regulations (HIPAA, GDPR, etc.)\n\n## \U0001F4C1 Repository Structure\n\n```\nESAPI-clinical-tools-Oulu/\n\
  ├── src/\n│   ├── Common/              # Shared utilities and helper classes\n│   └── Scripts/\n│  \
  \     ├── PlanChecks/      # Automated plan validation scripts\n│       ├── QA/              # Quality\
  \ assurance automation\n│       ├── Reporting/       # Clinical reports and data export\n│       └──\
  \ Automation/      # Workflow automation tools\n├── docs/                    # Documentation and guides\n\
  ├── examples/                # Example scripts and templates\n├── LICENSE                  # MIT License\n\
  └── README.md               # This file\n```\n\n## \U0001F680 Installation\n\n### Prerequisites\n\n\
  **Required:**\n- Varian Eclipse Treatment Planning System (TPS) with ESAPI enabled\n- Eclipse API version:\
  \ 15.6 or later (recommended)\n- Visual Studio 2019 or later\n- .NET Framework 4.8 or later\n- Varian\
  \ ESAPI DLLs (obtained from Varian, not included in this repository)\n\n**Recommended:**\n- C# development\
  \ experience\n- Understanding of radiotherapy treatment planning\n- Familiarity with Eclipse TPS workflow\n\
  \n### Setup Steps\n\n1. **Clone the Repository**\n   ```bash\n   git clone https://github.com/Skullervo/ESAPI-clinical-tools-Oulu.git\n\
  \   cd ESAPI-clinical-tools-Oulu\n   ```\n\n2. **Obtain Varian ESAPI DLLs**\n   - Contact Varian to\
  \ obtain the ESAPI libraries\n   - These are proprietary and **NOT** included in this repository\n \
  \  - Typically located in: `C:\\Program Files (x86)\\Varian\\RTM\\<version>\\esapi\\`\n   - Required\
  \ DLLs include:\n     - VMS.TPS.Common.Model.API.dll\n     - VMS.TPS.Common.Model.Types.dll\n     -\
  \ Additional dependencies as needed\n\n3. **Configure Your Project**\n   - Open your script project\
  \ in Visual Studio\n   - Add references to the Varian ESAPI DLLs\n   - Set \"Copy Local\" to False for\
  \ ESAPI references\n   - Configure build output directory according to Eclipse requirements\n\n4. **Review\
  \ and Customize**\n   - Review all code before use\n   - Customize scripts to match your institutional\
  \ protocols\n   - Update hard-coded values, file paths, and configuration\n   - Implement institutional-specific\
  \ validation rules\n\n## \U0001F4D6 Usage\n\n### General Workflow\n\n1. **Select Appropriate Script**\n\
  \   - Browse the `src/Scripts/` folders for relevant functionality\n   - Review the script documentation\
  \ and purpose\n   - Check the example implementations\n\n2. **Customize for Your Institution**\n   -\
  \ Modify configuration values\n   - Update dose constraints and protocols\n   - Adjust output formats\
  \ and paths\n   - Add institution-specific checks\n\n3. **Validation Testing**\n   - Test with phantom\
  \ data first\n   - Perform comprehensive validation with clinical test cases\n   - Document all validation\
  \ results\n   - Obtain required approvals\n\n4. **Clinical Deployment**\n   - Deploy through your institution's\
  \ IT and medical physics approval process\n   - Train users on proper usage\n   - Implement monitoring\
  \ and error reporting\n   - Schedule regular re-validation\n\n### Running Scripts\n\n**Binary Plugin\
  \ Scripts:**\n```csharp\n// Scripts are typically executed from within Eclipse\n// through the Scripts\
  \ menu or External Beam Planning\n```\n\n**Standalone Applications:**\n```csharp\n// Configure ESAPI\
  \ context and patient information\n// Run as external application with appropriate credentials\n```\n\
  \nSee the `examples/` folder for specific implementation patterns.\n\n## \U0001F527 Compatibility\n\n\
  ### Varian Eclipse Versions\n- **Tested with:** Eclipse 15.6, 16.1\n- **Recommended:** Eclipse 16.1\
  \ or later\n- **Note:** API compatibility may vary between versions\n\n### ESAPI Versions\n- **Target:**\
  \ ESAPI 15.6+\n- **API Mode:** Binary Plugin and Standalone supported\n- **Legacy Support:** May require\
  \ modifications for older versions\n\n### .NET Framework\n- **Minimum:** .NET Framework 4.6.1\n- **Recommended:**\
  \ .NET Framework 4.8\n- **Future:** .NET Core support under consideration\n\n### Operating System\n\
  - **Required:** Windows 10 or Windows Server 2016+\n- **Architecture:** x64\n- **Note:** Must match\
  \ Eclipse TPS server environment\n\n### Clinical Environment\n- **Deployment:** Hospital network with\
  \ Eclipse TPS access\n- **Permissions:** Appropriate ARIA/Eclipse user credentials\n- **Network:** Access\
  \ to Eclipse database and file systems\n- **Security:** Compliance with institutional IT security policies\n\
  \n## \U0001F91D Contributing\n\nContributions are welcome! Please:\n1. Fork the repository\n2. Create\
  \ a feature branch\n3. Follow C# coding standards\n4. Include clear documentation\n5. Add appropriate\
  \ safety notices\n6. Submit a pull request\n\n**Important:** Never commit:\n- Varian proprietary DLLs\n\
  - Patient data or PHI\n- Institutional credentials\n- Licensed/proprietary content\n\n## \U0001F4DA\
  \ Resources\n\n- [Eclipse ESAPI Documentation](https://varianapis.github.io/)\n- [Varian Developer Portal](https://developer.varian.com/)\n\
  - [ESAPI GitHub Community](https://github.com/VarianAPIs)\n- [Clinical ESAPI Scripts Community](https://github.com/topics/esapi)\n\
  \n## \U0001F4C4 License\n\nThis project is licensed under the MIT License - see the [LICENSE](LICENSE)\
  \ file for details.\n\n**Summary:** Free to use, modify, and distribute with attribution. Provided without\
  \ warranty.\n\n## ⚖️ Liability and Use\n\n**THE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF\
  \ ANY KIND, EXPRESS OR IMPLIED.**\n\nUsers assume all risks and responsibilities for:\n- Clinical validation\
  \ and testing\n- Regulatory compliance\n- Patient safety\n- Data security and privacy\n- Professional\
  \ liability\n\n## \U0001F4DE Support\n\nThis is a community project. For support:\n- Open an issue on\
  \ GitHub\n- Review existing documentation\n- Consult with your medical physics team\n- Contact Varian\
  \ for ESAPI-specific questions\n\n## \U0001F3E5 Institutional Use\n\nBefore deploying in your institution:\n\
  - [ ] Complete comprehensive validation testing\n- [ ] Document all test results and validation protocols\n\
  - [ ] Obtain medical physics approval\n- [ ] Obtain IT security approval\n- [ ] Obtain radiation oncology\
  \ approval\n- [ ] Train all users thoroughly\n- [ ] Implement error reporting procedures\n- [ ] Schedule\
  \ regular re-validation\n- [ ] Maintain version control and change logs\n\n---\n\n**Developed for the\
  \ radiotherapy medical physics community**\n\n**Always prioritize patient safety in clinical applications.**\n"

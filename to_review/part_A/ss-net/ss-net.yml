readme_excerpt: "# SS-Net\r\n\r\nAccurate breast tumor segmentation in ultrasound images is a critical\
  \ step in computer-aided diagnosis. However, the unique characteristics of these images pose challenges\
  \ for this task. Primarily, the morphological diversity of tumors in ultrasound images makes it difficult\
  \ for models to focus on crucial features, thereby degrading region segmentation accuracy. Additionally,\
  \ the low contrast between tumor area and surrounding background tissues causes inaccurate boundary\
  \ segmentation. Moreover, the prevailing segmentation models often have low parameters efficiency because\
  \ they adopt the complete pre-training technique for improving model performance. To address the mentioned\
  \ problems, a novel model named SS-Net is proposed, comprising semantics tiles aggregation (STA) module\
  \ and spectrum-guided feature recalibration (SFR) module. Moreover, a partial transfer strategy is proposed\
  \ for improving parameter efficiency. In particular, STA module improves the tumor region segmentation\
  \ accuracy via the semantics-aware dynamic feature aggregation mechanism. SFR module enhanced boundaries\
  \ detection by employing features extracted from diverse spectral information. Extensive evaluations\
  \ on four breast datasets (BUSI, BrEaST, UDIAT, and STU) reveal that, compared to other SOTA models,\
  \ SS-Net attains superior performance, while still maintaining reduced parameters (16.21M), computational\
  \ overhead (4.93G), and GPU memory usage (112.9MB).\r\n\r\n\r\n## Experiment\r\nIn the experimental\
  \ section, four publicly available and widely utilized datasets are employed for testing purposes. These\
  \ datasets are:<br> \r\n\r\nBUSI (breast ultrasound, with 647 images)<br>\r\nBrEaST (breast ultrasound,\
  \ with 252 images)<br>\r\nUDIAT (breast ultrasound, with 163 images)<br>\r\nSTU (breast ultrasound,\
  \ with 42 images)<br>\r\n\r\nThe dataset path may look like:\r\n```bash\r\nSS-Net-main\r\n├── datasets/\r\
  \n\t├── BUSI/\r\n\t\t├── Train_Folder/\r\n\t\t│   ├── img\r\n\t\t│   ├── labelcol\r\n\t\t│\r\n\t\t├──\
  \ Val_Folder/\r\n\t\t│   ├── img\r\n\t\t│   ├── labelcol\r\n\t\t│\r\n\t\t├── Test_Folder/\r\n\t\t\t\
  ├── img\r\n\t\t\t├── labelcol\r\n```\r\n\r\n\r\n## Usage\r\n\r\n### **Backbone pre-trained pth**\r\n\
  \r\nPVT Backbone pre-trained pth: <br>\r\nhttps://github.com/whai362/PVT <br>\r\n\r\n### **Installation**\r\
  \n\r\nCUDA Toolkit and CuDNN installation: <br>\r\nCUDA Toolkit:\thttps://developer.nvidia.com/cuda-toolkit-archive\
  \ <br>\r\nCuDNN:\t\t\thttps://developer.nvidia.com/rdp/cudnn-archive <br>\r\n\r\nBasic environment configuration：\r\
  \n```bash\r\ngit clone https://github.com/HvitAska-Eyjafjalla/HICVM-Net\r\nconda create -n env_name\
  \ python=3.10\r\nconda activate env_name\r\npip3 install torch torchvision --index-url https://download.pytorch.org/whl/cu128\r\
  \n\r\n```\r\nMamba libraries:<br>\r\ncausal-conv1d:\thttps://github.com/Dao-AILab/causal-conv1d <br>\r\
  \nmamba-ssm:\t\thttps://github.com/state-spaces/mamba <br>\r\n\r\nIf you are using the GPU before the\
  \ NVIDIA RTX 50 series, you can follow this tutorial: (Simplified-Chinese webpage)<br>\r\nhttps://github.com/AlwaysFHao/Mamba-Install\
  \ <br>\r\n\r\nIf you are using the NVIDIA RTX 50 series GPU, you can follow this tutorial: (Simplified-Chinese\
  \ webpage)<br>\r\nhttps://blog.csdn.net/yyywxk/article/details/146798627 <br>\r\n\r\n### **Training**\r\
  \n```bash\r\npython start.py\r\n```\r\nTo run on different setting or different datasets, please modify\
  \ config_universal.py or config_model.py.\r\n\r\n\r\n### **Evaluation**\r\n```bash\r\npython test.py\r\
  \n``` \r\n\r\n\r\n\r\n## Contact\r\nFor technical questions, please contact yanagiama@gmail.com .\r\n\

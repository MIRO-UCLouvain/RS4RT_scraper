readme_excerpt: "# **IN SILICO PREDICTION OF TOXICITY**  \n*Presentation at Symposium on Biotechnology\
  \ (SYMBIOTECH)*  \n\n## **Overview**  \nThis repository contains all materials related to the in silico\
  \ cytotoxicity modeling study presented at SYMBIOTECH. The study explores predictive toxicity modeling\
  \ using a small dataset of molecules, with a special focus on estimating generalizability based on a\
  \ minimal set of 12 points.  \n\nAll results are fully reproducible using Google Colab, ensuring accessibility\
  \ without local setup issues.  \n\n## **Contents**  \n\U0001F4C2 **data/** – Dataset used in the study\
  \  \n\U0001F4C2 **notebook/** – Google Colab notebook for reproducing results  \n\U0001F4DC **README.md**\
  \ – Project description and usage instructions  \n\n## **Reproducibility**  \nRun the complete analysis\
  \ interactively in Google Colab:  \n▶️ **[Open in Google Colab](https://colab.research.google.com/drive/1ZdAIjMSHMW7xY3LVIaEpo8HldXV3zg3l)**\
  \  \n\n## **Key Features**  \n✅ Small dataset with meaningful insights into cytotoxicity prediction\
  \  \n✅ Fully automated model training and evaluation  \n✅ Generalizability estimates based on a minimal\
  \ 12-point approach  \n✅ Clear, interactive visualization of results  \n\n## **How to Use**  \n1. Click\
  \ the **Colab link** above to open the interactive notebook.  \n2. Follow the step-by-step instructions\
  \ in the notebook to run the analysis.  \n3. Explore, modify, and extend the models using your own data.\
  \  \n\n## **License**  \n\U0001F4DC Open for educational and research purposes.  \n"

readme_excerpt: "\n# Synthetic CT from MRI\n\nThe use of synthetic CT images generated from MR image data\
  \ is increasing because they offer a number of potential advantages over traditional CT scans, including\
  \ improved safety, greater detail, and the ability to generate 3D models for surgical planning.\n\n\
  This project was done to create a robust deep learning model which is capable of generating synthetic\
  \ CT images from MR images. It is an implementation of  [\"MR‐based synthetic CT generation using a\
  \ deep convolutional neural network method.\" Medical physics 2017](https://sci-hub.se/10.1002/mp.12155)\n\
  \n\n## Requirements\n\n* tensorflow 2.6.4\n* numpy 1.21.6\n* openCV 4.5.4\n* matplotlib 3.5.3\n* pandas\
  \ 1.3.5\n* keras 2.6.0\n\n\n## Dataset\n\nThis [dataset](https://drive.google.com/drive/folders/1fQY2MBGqvxS7fx4aDYyxUFDHhxTjxD_y)\
  \ contains 367 paired CT and MR images which have been randomly divided into training, test and validation\
  \ set. \n\n"

readme_excerpt: "# PrediCT GSoC 2026 — Project 2: Radiomics Feature Extraction & Calcium Phenotyping\n\
  \n**Applicant:** Laura Pinero Roig — laurapineroroig@gmail.com\n**Project:** PREDICT2 — Radiomics Feature\
  \ Extraction and Calcium Phenotype Discovery\n**Organization:** ML4Sci\n\n---\n\n## Setup\n\n```bash\n\
  python3 -m venv predict2_env\nsource predict2_env/bin/activate\npip install -r requirements.txt\n```\n\
  \n## Data\n\nFollow the instructions in the [PrediCT repo](https://github.com/KatyEB/PrediCT/tree/GSoC)\
  \ to download and preprocess the Stanford COCA dataset. Place processed NIfTI files in `data/processed/`\
  \ with structure:\n\n```\ndata/processed/\n    patient_001/\n        image.nii.gz\n        mask.nii.gz\n\
  \    patient_002/\n        ...\n```\n\n## Running the pipeline\n\n```bash\n# 1. Dataset statistics (common\
  \ task)\npython src/preprocess.py data/processed\n\n# 2. Agatston scores\npython src/agatston.py data/processed\n\
  \n# 3. Radiomics feature extraction (20-30 patients)\npython src/feature_extraction.py data/processed\n\
  \n# 4. Statistical analysis + visualizations\ncd notebooks && python analysis.py\n```\n\n## Outputs\n\
  \nAll outputs are saved to `outputs/`:\n- `dataset_statistics.csv` — per-patient CT statistics\n- `agatston_scores.csv`\
  \ — scores and categories per patient\n- `radiomics_features.csv` — PyRadiomics feature matrix\n- `spearman_correlations.csv`\
  \ — feature-Agatston correlations with p-values\n- `kruskal_wallis_results.csv` — Kruskal-Wallis test\
  \ across categories\n- `correlation_matrix.png` — heatmap of top features\n- `feature_vs_agatston.png`\
  \ — scatter plots\n- `tsne_plot.png` — t-SNE colored by Agatston category\n- `clustering.png` — K-Means\
  \ clusters vs Agatston categories\n"

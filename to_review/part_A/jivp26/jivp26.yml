readme_excerpt: "[![DOI](https://zenodo.org/badge/1135259272.svg)](https://doi.org/10.5281/zenodo.19369543)\n\
  ## This repository contains:\n\n- trained .pt and .pth models (YOLOv8 & Detectron2)\n- prediction scripts\n\
  - test-images\n- evaluation script with metrics\n\n\n---\n\n\n## Repository Structure\n```text\nrepo/\n\
  │\n├─ README.md\n├─ LICENSE                 # MIT (for evaluation + output)\n├─ NOTICE.md          \
  \     # Third-party attribution\n│\n├─ models/\n│   ├─ yolov8/\n│   │   ├─ model.pt\n│   │   └─ LICENSE\
  \        # AGPL-3.0\n│   │\n│   └─ detectron2/\n│       ├─ model.pth\n│       └─ LICENSE        # Apache-2.0\n\
  │\n├─ prediction/\n│   ├─ yolov8/\n│   │   ├─ predict_yolo.py\n│   │   └─ LICENSE        # AGPL-3.0\n\
  │   │\n│   └─ detectron2/\n│       ├─ predict_detectron2.py\n│       └─ LICENSE        # Apache-2.0\n\
  │\n├─ evaluation/\n│   ├─ evaluate.py\n│   └─ LICENSE            # MIT\n│\n├─ test_images/\n│   ├─ img1.jpg\n\
  │   └─ img2.jpg\n│\n└─ example_outputs/\n    ├─ yolo_txt/\n    └─ detectron2_txt/\n\n\n---\n\n## Licensing\n\
  \nThis repository contains components under different licenses:\n\nMIT: evaluation pipeline and output\
  \ data\n\nAGPL-3.0: YOLOv8 prediction scripts and YOLO model weights\n\nApache-2.0: Detectron2 prediction\
  \ scripts and Detectron2 model weights\n\nSee the LICENSE files in each folder for details.\n\n\n---\n\
  \n\n## Requirements\nsupplement\n\n\n---\n\n\n## Usage Overview\nPlace your images in test_images/\n\
  \n## 1. YOLOv8 Prediction:\nrun:\npython prediction/yolov8/predict_yolo.py\n\nOutput text files are\
  \ saved in:\nexample_outputs/yolo_txt/\n\n## 2. Detectron2 Prediction:\nrun:\npython prediction/detectron2/predict_detectron2.py\n\
  \nOutput text files are saved in:\nexample_outputs/detectron2_txt/\n\n## 3. Evaluation:\nrun:\npython\
  \ evaluation/evaluate.py\n\nThis script reads the text files from the prediction\noutput folders and\
  \ computes metrics.\n\n\n---\n\n\n## Notes\n\nThe YOLOv8seg model was fine-tuned using Ultralytics YOLOv8\
  \ (AGPL-3.0).\nThe Detectron2 model was fine-tuned using Detectron2 (Apache-2.0).\n\n"

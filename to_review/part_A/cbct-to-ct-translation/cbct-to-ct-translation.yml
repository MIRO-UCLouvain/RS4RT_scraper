readme_excerpt: "# CBCT-to-CT\r\n\r\nThis project is code for deep learning-based CBCT-to-CT translation,\
  \ implemented in PyTorch using flow matching models and denoising diffusion probabilistic models.\r\n\
  \r\nThe project includes three sections: \r\n1) DataPrepare: Convert CT and CBCT in DICOM format to\
  \ the easily readable .npy format, and generate simulated CBCT based on CT data.\r\n2) sCT: CBCT-to-CT\
  \ conversion using deep learning\r\n3) Evaluate: Assessment of model performance.\r\n\r\n# How to run\
  \ the code\r\n\r\nThe code for each section can be run independently. After modifying configuration\
  \ parameters such as file paths, directly run main.py in the src folder.\r\n\r\n\r\n"

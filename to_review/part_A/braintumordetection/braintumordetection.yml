readme_excerpt: "# \U0001F9E0 Brain Tumor Detection using Attention U-Net\n\nA deep learning-based web\
  \ application for **Brain Tumor Detection and Segmentation** from MRI images using the **Attention U-Net**\
  \ architecture.\n\nThe application allows users to upload a Brain MRI image, predicts the tumor region,\
  \ generates a segmentation mask, and displays the prediction result with a confidence score and tumor\
  \ pixel count.\n\n---\n\n## ✨ Features\n\n- \U0001F9E0 Brain MRI Tumor Detection\n- \U0001F3AF Tumor\
  \ Segmentation using Attention U-Net\n- \U0001F4E4 Upload MRI Images through a Flask Web Interface\n\
  - \U0001F4CA Displays Prediction Confidence\n- \U0001F4CD Tumor Pixel Count\n- \U0001F5BC️ Segmentation\
  \ Mask Generation\n- \U0001F4BB Simple and User-Friendly Interface\n\n---\n\n## \U0001F6E0️ Technologies\
  \ Used\n\n- Python\n- TensorFlow\n- Keras\n- Flask\n- OpenCV\n- NumPy\n- HTML\n- CSS\n\n---\n\n## \U0001F9E0\
  \ Model Information\n\n| Property | Value |\n|----------|-------|\n| Model | Attention U-Net |\n| Input\
  \ Size | 256 × 256 × 3 |\n| Output | Binary Tumor Segmentation Mask |\n| Optimizer | Adam |\n| Loss\
  \ Function | Binary Crossentropy + Dice Loss |\n\n---\n\n# \U0001F4F8 Application Screenshots\n\n##\
  \ Home Page\n\n![Home Page](images/home.png)\n\n---\n\n## Prediction Result\n\n![Prediction Result](images/prediction.png)\n\
  \n---\n\n# \U0001F4C2 Project Structure\n\n```text\nBrainTumorDetection/\n│\n├── app.py            \
  \      # Flask web application\n├── train.py                # Train the Attention U-Net model\n├── evaluate.py\
  \             # Evaluate trained model\n├── predict.py              # Prediction script\n├── plot_training.py\
  \        # Plot training graphs\n│\n├── models/\n│   ├── attention_unet.py\n│   ├── losses.py\n│   └──\
  \ metrics.py\n│\n├── utils/\n│   ├── dataloader.py\n│   └── preprocessing.py\n│\n├── templates/\n│ \
  \  └── index.html\n│\n├── static/\n│   ├── css/\n│   │   └── style.css\n│   ├── uploads/\n│   └── predictions/\n\
  │\n├── images/\n│   ├── home.png\n│   └── prediction.png\n│\n├── saved_models/\n│   └── best_attention_unet.keras\
  \ (Generated after training)\n│\n├── README.md\n├── requirements.txt\n└── .gitignore\n```\n\n---\n\n\
  # \U0001F4E5 Dataset\n\nThis project uses the **LGG MRI Segmentation Dataset**, which contains Brain\
  \ MRI images and corresponding tumor segmentation masks.\n\n### Dataset Source\n\n- **Kaggle Dataset:**\
  \ <https://www.kaggle.com/datasets/mateuszbuda/lgg-mri-segmentation>\n- **Reference Notebook:** <https://www.kaggle.com/code/donottalk/lgg-mri-segmentation>\n\
  \nAfter downloading the dataset, organize it as follows:\n\n```text\ndataset/\n├── train/\n│   ├── images/\n\
  │   └── masks/\n│\n├── val/\n│   ├── images/\n│   └── masks/\n│\n└── test/\n    ├── images/\n    └──\
  \ masks/\n```\n\n---\n\n# \U0001F4E5 Trained Model\n\nThe trained Attention U-Net model is **not included**\
  \ in this repository because the model file exceeds GitHub's maximum file size limit (100 MB).\n\nTo\
  \ use this project:\n\n1. Download the dataset.\n2. Train the model using `train.py`.\n3. After training,\
  \ place the generated model inside:\n\n```text\nsaved_models/\n└── best_attention_unet.keras\n```\n\n\
  The Flask application automatically loads this model during prediction.\n\n---\n\n# \U0001F680 Getting\
  \ Started\n\n## 1. Clone the Repository\n\n```bash\ngit clone https://github.com/ibraheem74/BrainTumorDetection.git\n\
  cd BrainTumorDetection\n```\n\n---\n\n## 2. Install Dependencies\n\n```bash\npip install -r requirements.txt\n\
  ```\n\n---\n\n## 3. Download the Dataset\n\nDownload the **LGG MRI Segmentation Dataset** from Kaggle\
  \ and place it inside the project directory.\n\nExample:\n\n```text\ndataset/\n├── train/\n├── val/\n\
  └── test/\n```\n\n---\n\n## 4. Train the Model\n\nRun the following command:\n\n```bash\npython train.py\n\
  ```\n\nAfter training, the model will be saved as:\n\n```text\nsaved_models/\n└── best_attention_unet.keras\n\
  ```\n\n---\n\n## 5. Run the Flask Application\n\nStart the Flask server:\n\n```bash\npython app.py\n\
  ```\n\nOpen your browser and visit:\n\n```text\nhttp://127.0.0.1:5000\n```\n\nUpload a Brain MRI image\
  \ and click **Predict**.\n\n---\n\n# \U0001F4CA Output\n\nThe application displays:\n\n- Uploaded MRI\
  \ Image\n- Predicted Tumor Segmentation Mask\n- Tumor Detection Result\n- Confidence Score\n- Tumor\
  \ Pixel Count\n\n---\n\n# \U0001F52E Future Improvements\n\n- Improve segmentation accuracy with additional\
  \ training\n- Support multiple MRI image formats\n- Deploy the application on cloud platforms\n- Add\
  \ Grad-CAM visualization for explainable AI\n- Develop a responsive mobile-friendly interface\n\n---\n\
  \n# ⚠️ Important Notes\n\n- The **dataset** is **not included** in this repository.\n- The **trained\
  \ model** (`best_attention_unet.keras`) is **not included** due to GitHub's file size limitation.\n\
  - Users must download the dataset and train the model before running the application.\n- Ensure the\
  \ trained model is placed inside the `saved_models/` directory before starting the Flask application.\n\
  \n---\n\n# \U0001F468‍\U0001F4BB Author\n\n**Ibraheem**\n\nB.Tech Computer Science Engineering\n\nDr.\
  \ M.G.R. Educational and Research Institute\n\n**GitHub:** https://github.com/ibraheem74\n\n---\n\n\

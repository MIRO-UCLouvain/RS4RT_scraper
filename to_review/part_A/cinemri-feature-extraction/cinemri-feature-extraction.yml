readme_excerpt: "# CineMRI-Feature-Extraction\nOpen-source MATLAB toolkit for cine-MRI analysis, tumour\
  \ motion quantification, feature extraction, and visualization for MR-guided radiotherapy research.\n\
  \n## Overview\n\nThis repository provides a collection of MATLAB functions for quantitative analysis\
  \ of tumour motion in cine-MRI sequences. The toolbox is designed for extracting geometric and motion-related\
  \ features from segmented tumour masks and generating visualizations suitable for research, quality\
  \ assurance, and educational purposes.\n\nThe code has been developed as part of research in image-guided\
  \ radiotherapy and demonstrates a modular workflow for cine-MRI data analysis.\n\n## Features\n\nTumour\
  \ centroid extraction;\nShape feature extraction: Area, Perimeter, Circularity, Eccentricity, Major/Minor\
  \ axis length, Solidity, Extent\nTumour motion trajectory analysis;\nMotion statistics computation;\n\
  Tumour boundary visualization;\nMotion summary plots;\nCSV export of extracted features;\nMP4 video\
  \ generation of tumour motion.\n\n## Repository Structure\nCineMRI-Feature-Extraction/\n│\n├── src/\n\
  │   MATLAB source functions\n│\n├── examples/\n│   Example scripts demonstrating usage\n│\n├── sample_results/\n\
  │   Example outputs (CSV, video)\n│\n└── docs/\n    └── figures/\n\n## Requirements\n\nMATLAB R2023b\
  \ (or later)\nImage Processing Toolbox\n\n## Quick Start\n% Load image and mask\nimg = mha_read_volume('images.mha');\n\
  mask = mha_read_volume('labels.mha');\n\n% Extract tumour motion\nmotion = extract_motion_signal(mask);\n\
  \n% Plot summary\nplot_motion_summary(motion);\n\n## Example Workflow\n1. Load cine-MRI image sequence.\n\
  2. Load corresponding tumour segmentation masks.\n3. Extract tumour centroid.\n4. Compute geometric\
  \ features.\n5. Quantify tumour motion.\n6. Generate motion statistics and visualizations.\n7. Export\
  \ extracted features to CSV.\n8. Create an MP4 visualization of tumour motion.\n\n## Example Outputs\n\
  \n- Tumour overlay visualization\n- Motion summary plots\n- CSV feature table\n- MP4 motion video\n\n\
  ---\n\n## Results\n\n### Tumour Overlay\n\n![Tumour Overlay](docs/figures/tumor_overlay_mask.jpg)\n\n\
  ### Motion Summary\n\n![Motion Summary](docs/figures/motion_summary.jpg)\n\nExample figures are available\
  \ in the 'docs/figures' directory.\n\n## Applications\nThis toolbox can be used for\nMR-guided radiotherapy\
  \ research,\nTumour motion characterization,\nRespiratory motion analysis,\nImage-guided adaptive radiotherapy,\n\
  Feature extraction for machine learning workflows,\nEducational demonstrations of cine-MRI analysis\n\
  \n## Dataset\nThe toolbox was developed and tested using cine-MRI tumour segmentation data.\n\n**Note:**\
  \ The dataset is **not included** in this repository. Users should obtain the appropriate dataset from\
  \ its official source and comply with the corresponding license and usage terms.\n\n## Future Development\n\
  Planned extensions include: Texture feature extraction, Radiomics integration, Deep learning interfaces,\
  \ Motion prediction models, Advanced visualization tools\n\n## Citation\nIf you use this toolbox in\
  \ your research, please cite:\n-> Aindrila Paul Chowdhury, *CineMRI-Feature-Extraction*, GitHub repository.\n\
  \n## License\nThis project is released under the MIT License.\n\n## Author\n**Aindrila Paul Chowdhury**\n\
  \nResearch interests:\n-> Medical Physics\n-> Image-Guided Radiotherapy\n-> Cine-MRI Motion Analysis\n\
  -> Medical Image Processing\n-> Machine Learning for Medical Imaging\n-> Computational Modelling\n"

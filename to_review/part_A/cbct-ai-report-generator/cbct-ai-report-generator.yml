readme_excerpt: "[README.md](https://github.com/user-attachments/files/23746868/README.md)\n# \U0001F9B7\
  \ CBCT AI Report Generator  \nAutomated CBCT DICOM Analysis + Radiologist-Style Reporting  \n_Backend:\
  \ FastAPI (SSE Streaming) • Frontend: Streamlit UI_\n\n---\n\n## \U0001F4CC Overview  \n**CBCT AI Report\
  \ Generator** is an offline, lightweight system designed to:\n\n- Load CBCT **DICOM (`.dcm`) or ZIP\
  \ DICOM folders**\n- Display **axial, coronal, sagittal previews**\n- Perform **essential radiographic\
  \ measurements**\n- Stream progress in real-time to the UI using **Server-Sent Events (SSE)**\n- Produce\
  \ structured **radiologist-style text reports**\n- Export reports in **PDF** and **DOCX** formats\n\n\
  This tool is built for clinicians, radiologists, and researchers who require **fast CBCT assessment\
  \ without cloud dependencies**.\n\n---\n\n## ✨ Key Features\n\n### \U0001F50D 1. Robust CBCT DICOM Loader\n\
  - Supports **multiframe CBCT** (Carestream, Planmeca, etc.)\n- Extracts voxel metadata (slice thickness,\
  \ SOP class)\n- Saves 3-plane previews (axial/coronal/sagittal)\n\n### \U0001F4CA 2. Automated Measurements\n\
  Includes rule-based, deterministic estimations:\n\n- HU mean / min / max  \n- ROI HU sampling  \n- Ridge\
  \ height detection  \n- Periapical low-density candidates  \n- Measurement warnings for missing metadata\
  \  \n\n### \U0001F9E0 3. Condition Detector\nSuggests case type:\n\n- **Full skull**\n- **Maxilla**\n\
  - **Mandible**\n\n(Used only to shape the reporting layout.)\n\n### \U0001F4DD 4. Structured Radiology\
  \ Report\nOutputs clinically formatted sections:\n\n- **Scan Details**  \n- **Image Quality**\n- **Teeth\
  \ & Periapical Evaluation**\n- **Sinuses / TMJ / Canal / Airway**\n- **Bone & Ridge Observations**\n\
  - **Impression**\n- **Recommendations**\n\n### ⚡ 5. True Streaming Pipeline\nThe backend streams each\
  \ stage:\n\n- `uploaded`\n- `loading_cbct`\n- `loaded_cbct`\n- `detector`\n- `measurements`\n- `report_structured`\n\
  - `docx_ready`\n- `pdf_ready`\n- `complete`\n\nNo silent processing — ideal for clinical transparency.\n\
  \n### \U0001F4C4 6. Exportable Reports\nReports automatically saved to:\n\n```\nstatic/results/<FILENAME>_report.pdf\n\
  static/results/<FILENAME>_report.docx\n```\n\n---\n\n## \U0001F9F1 Project Structure\n\n```\ncbct_ai_report_generator/\n\
  │\n├── app_agentic_stream.py      # FastAPI backend (SSE enabled)\n├── chat_ui_v4_stream.py       #\
  \ Streamlit frontend\n├── dicom_reader.py            # CBCT volume loader\n├── cbct_measurements.py\
  \       # Measurement heuristics\n├── condition_detector.py      # Basic condition classifier\n├── report_builder.py\
  \          # Assembles structured output\n│\n├── static/\n│   ├── previews/              # Generated\
  \ preview PNGs\n│   └── results/               # DOCX/PDF final reports\n│\n├── samples/           \
  \        # Small sample case (optional)\n└── README.md\n```\n\n---\n\n## \U0001F680 Installation\n\n\
  ### 1. Create Conda environment\n```bash\nconda create -n cbct_env python=3.11\nconda activate cbct_env\n\
  ```\n\n### 2. Install dependencies\n```bash\npip install -r requirements.txt\n```\n\n---\n\n## ▶️ Running\
  \ the App\n\n### **Start backend (FastAPI):**\n```bash\nuvicorn app_agentic_stream:app --host 127.0.0.1\
  \ --port 8000 --reload\n```\n\n### **Start frontend (Streamlit):**\n```bash\nstreamlit run chat_ui_v4_stream.py\n\
  ```\n\n---\n\n## \U0001F50C API Endpoints\n\n| Endpoint | Method | Description |\n|---------|--------|-------------|\n\
  | `/generate_report_stream/` | POST | Upload CBCT & stream step-by-step progress |\n| `/list_conditions`\
  \ | GET | Returns selectable case types |\n\n---\n\n## \U0001F4C4 Output Report Format\n\nEach report\
  \ includes:\n\n- Modality + metadata  \n- Image quality summary  \n- Structured findings  \n- Clinically\
  \ useful impression  \n- Follow-up recommendations  \n- Radiologist signature block  \n\n---\n\n## \U0001F9ED\
  \ Roadmap  \nPlanned enhancements:\n\n- [ ] 3D segmentation of teeth / canal / sinus  \n- [ ] Accurate\
  \ periapical lesion detection  \n- [ ] Implant planning with distance maps  \n- [ ] Guided surgical\
  \ planning export  \n- [ ] LLM-augmented clinical summarizer  \n\n---\n\n## \U0001F91D Contributing\
  \  \nPRs are welcome.  \nFor large changes, open an issue first to discuss your ideas.\n\n---\n\n##\
  \ \U0001F4DC License  \nMIT License.  \n⚠️ *This tool is intended for research and educational purposes\
  \ only.*  \n"

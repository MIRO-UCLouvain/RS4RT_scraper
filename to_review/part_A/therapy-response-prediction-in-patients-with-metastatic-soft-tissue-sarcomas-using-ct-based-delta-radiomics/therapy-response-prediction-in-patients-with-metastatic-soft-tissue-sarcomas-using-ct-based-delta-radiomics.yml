readme_excerpt: "# Therapy Response Prediction in Patients with Metastatic Soft Tissue Sarcomas Using\
  \ CT based Delta Radiomics\n\nThis repository contains the code to reproduce the experiments of the\
  \ mentioned paper but can also be used to analyze other survival data in a nested cross validation.\n\
  \n## Reproducing the results of the paper\nTo reproduce the experiments, call [this file](runOnCluster.sh).\
  \ Note: This requires the data used in this study, which is available from the corresponding author\
  \ upon reasonable request.\n\n## Automated machine learning for survival analysis\nYou can use the code\
  \ in src/machineLearning to run experiments on your data. For this, adapt the information at the bottom\
  \ of [this file](/src/machineLearning/pipelineSelection.py) and run\n\n``` \n\n python3.7 src/machineLearning/pipelineSelection.py\n\
  \n``` \n\n"

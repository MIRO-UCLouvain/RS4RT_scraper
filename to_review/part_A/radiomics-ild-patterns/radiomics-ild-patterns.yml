readme_excerpt: "# radiomics-ild-patterns  \n[![DOI](https://zenodo.org/badge/954757367.svg)](https://doi.org/10.5281/zenodo.15095497)\n\
  \n## \U0001F680 How to Start   \nTo reproduce the analysis and run the code in this repository, follow\
  \ these steps:\n\n1. **Clone the repository**\n   ```bash\n   git clone https://github.com/chiaramarzi/radiomics-ild-patterns\n\
  \   cd radiomics-ild-patterns\n   ```\n2. **Create the environment**\n   ```bash\n   conda env create\
  \ -f full_environment.yml\n   ```\n3. **Activate the environment**\n   ```bash\n   conda activate radiomics-ild-patterns\n\
  \   ```\n\n## \U0001F4CA [binary_classification.py](./binary_classification.py) — Bootstrap Classification\
  \ and SHAP Analysis\nThis script performs a complete classification and interpretability pipeline using\
  \ a synthetic radiomic dataset. It is designed for testing machine learning workflows based on XGBoost\
  \ classifiers, including bootstrap performance evaluation and SHAP-based feature importance analysis.\n\
  \n\U0001F527 Main functionalities:   \n- Repeated bootstrap resampling for model training and testing\
  \ (the number of bootstrap iterations can be modified by editing the M variable in the script)\n- Performance\
  \ evaluation through:\n  - Accuracy\n  - Balanced Accuracy\n  - Average Precision\n  - AUROC\n  - Confusion\
  \ matrix generation\n  - ROC curve interpolation and export\n- SHAP (SHapley Additive exPlanations)\
  \ summary plot for model interpretability\n- Automatic saving of results to a timestamped directory\n\
  \n\U0001F4E5 Input: a CSV file which must include:\n- Patient: Unique patient ID\n- Group: Binary target\
  \ class (0 or 1)\n- feature_1 to feature_N: Radiomic-style feature columns\nAn example of a valid CSV\
  \ file is provided in [synthetic_radiomics_dataset.csv](./synthetic_radiomics_dataset.csv)\n\n\U0001F4E4\
  \ Output   \nAll results are saved in a folder named *results_YYYY-MM-DD_HH-MM-SS*, including:\n- CSV\
  \ files with training and test performance metrics (suffixes: */*-Train_scores.csv*, */*-Test_scores.csv*)\n\
  - Numpy file with all confusion matrices (suffix: */*-Confusion_matrices.npy*)\n- Interpolated ROC coordinates\
  \ (suffix: */*_ROC_coords_test.csv*)\n- SHAP summary bar plot (suffix: */*-SHAP_summary.png*)\n\n▶️\
  \ How to run: \n```bash\npython binary_classification.py\n```\n\n\U0001F6E0 Notes\n- This script is\
  \ designed for testing purposes and runs directly on the fully synthetic data [synthetic_radiomics_dataset.csv](./synthetic_radiomics_dataset.csv)\n\
  - The SHAP plot assumes class labels are [0, 1], corresponding to a binary classification scenario.\n\
  - The script assumes the presence of *analysis* and *metrics_dispaly* functions in [utils.py](./utils.py).\n\
  \n## \U0001F4C8 [plot.py](./plot.py) - ROC & Confusion Matrix Visualization \nThis script generates\
  \ graphical summaries of the model performance after bootstrap evaluation:\n\n- **Confusion Matrix**:\
  \ shows the average confusion matrix over all bootstrap test sets, including 95% bootstrap intervals\
  \ for each cell. The matrix is saved as with the suffix */*-CM_scaled.png*.\n\n- **ROC Curve**: plots\
  \ the median ROC curve across bootstrap iterations, along with the 25th and 75th percentile true positive\
  \ rates. The ROC plot is saved with the suffix */*_ROC_AUC_median_roc.png*.\n\n\U0001F4E5 Input:\n-\
  \ Requires a valid *results_\\** directory generated by [binary_classification.py](./binary_classification.py),\
  \ containing:\n  - *\\*-Confusion_matrices.npy*\n  - *\\*_ROC_coords_test.csv*\n\n\U0001F4E4 Output:\n\
  - All images are saved in a folder named *images_YYYY-MM-DD_HH-MM-SS* generated at runtime.\n\n\U0001F6E0\
  \ Notes   \n- The script assumes the presence of a *make_confusion_matrix* function in [utils.py](./utils.py).\n\
  \n## \U0001F9EA Synthetic Test Data\nThis repository includes a synthetic dataset [synthetic_radiomics_dataset.csv](./synthetic_radiomics_dataset.csv)\
  \ created using the script [synthetic_dataset_creation.py](./synthetic_dataset_creation.py), exclusively\
  \ for testing and demonstration purposes. The dataset was artificially generated and does not contain\
  \ any real patient data. It simulates a typical radiomics scenario, consisting of:   \n- 100 observations\
  \ representing individual patients\n- 10 numerical features (feature_1 to feature_10) mimicking radiomic\
  \ variables\n- A binary group label (Group = 0 or 1) representing two hypothetical subpopulations\n\
  - A unique patient identifier (Patient)\n\nTo introduce distinguishable patterns between groups, the\
  \ features for each group were sampled from normal distributions with different means (Group 0: mean\
  \ = 0, Group 1: mean = 1). These differences simulate the kind of variability radiomics may capture\
  \ between clinical classes, enabling testing of classification models and visualizations (e.g., SHAP\
  \ analysis) in a fully anonymized and ethical context.\n\n**This dataset is not derived from real medical\
  \ imaging and should be used only for testing code and validating pipelines, not for clinical or scientific\
  \ inference.**\n"

readme_excerpt: "# papilledema classification using radiomic features\nPapilledema classification using\
  \ radiomic features and a machine learning pipeline. It includes MRMR feature selection, Optuna hyperparameter\
  \ optimization, patient-level cross-validation, and a soft voting ensemble.\n\n>  This is an educational\
  \ project developed during my university studies,\n> reflecting my hands-on experience.\n\nNote: This\
  \ repository is currently in the editing phase.\n\n## Introduction\n\n**Papilledema** is a critical\
  \ clinical finding defined as edema of the optic disc, and serves as a key indicator of elevated intracranial\
  \ pressure.\n\n**Radiomics** is a rapidly evolving field in medical imaging analysis that bridges radiology\
  \ and oncology. It involves high-throughput extraction of quantitative features from standard medical\
  \ images (CT, MRI, PET scans), converting them into mineable, high-dimensional data. A major development\
  \ in this space is radiogenomics (the integration of radiomics with genomic data), which advances personalized\
  \ medicine by combining the spatial resolution of imaging data with the molecular specificity of genomic\
  \ data.\n\n## What this Project Does\n\nThis project implements a comprehensive machine learning pipeline\
  \ to classify papilledema vs. normal cases using radiomic features extracted from optic disc images.\n\
  \nThe pipeline includes:\n* Data preprocessing\n* MRMR (Maximum Relevance Minimum Redundancy) feature\
  \ selection\n* Optuna hyperparameter optimization\n* Patient-level cross-validation with 20 repeated\
  \ splits\n* Sigmoid probability calibration\n* Soft-voting ensemble model\n\n### Models Evaluated\n\n\
  Logistic Regression (LR), Support Vector Machine (SVM), Random Forest (RF), Extra Trees (ET), Gradient\
  \ Boosting (GB), K-Nearest Neighbors (KNN).\n\nAll preprocessing and feature selection steps are fitted\
  \ exclusively on training data, and patient-level splitting ensures that samples from the same patient\
  \ never appear in different subsets simultaneously (strictly preventing data leakage).\n\n## Dataset\n\
  \nThe preview of the datasets:\n\nSamples from healthy subjects\n\n<img width=\"1724\" height=\"414\"\
  \ alt=\"image\" src=\"https://github.com/user-attachments/assets/ffb56724-5b5c-4a85-90f4-502c9e9ae634\"\
  \ />\n\nSamples from patients diagnosed with papilledema\n\n<img width=\"1712\" height=\"411\" alt=\"\
  image\" src=\"https://github.com/user-attachments/assets/668a914b-1412-4ff1-8247-b85efab225a7\" />\n\
  \nEach sample represents a single ROI (Region of Interest) frame component extracted from optic disc\
  \ imaging. The dataset is specifically designed to train and evaluate machine learning models to distinguish\
  \ between healthy eyes and conditions that cause swelling of the optic nerve head.\n\nTo load and merge\
  \ the datasets, I used the following code:\n\n```python\n# Load data\nnormal = pd.read_csv('normal.csv')\n\
  papilledema = pd.read_csv('papilledema.csv')\n\nnormal['label'] = 0\npapilledema['label'] = 1\n\n# Merge\n\
  df = pd.concat([normal, papilledema], ignore_index=True)\n\n# Fix infinity values\nfeature_cols = [col\
  \ for col in df.columns if col.startswith('Feature_')]\ndf[feature_cols] = df[feature_cols].replace([np.inf,\
  \ -np.inf], np.nan)\n\n# Patient list\npatients = df['PatientIndex'].unique()\n\nprint(\"Dataset shape:\"\
  , df.shape)\nprint(\"Total patients:\", len(patients))\nprint(\"Feature count:\", len(feature_cols))\n\
  print(\"Class distribution:\\n\", df['label'].value_counts())\n```\n\nThe output is shown below:\n```text\n\
  Dataset shape: (966, 749)\nTotal patients: 48\nFeature count: 746\nClass distribution:\nlabel\n0   \
  \ 672\n1    294\nName: count, dtype: int64\n```\n\n### Important Dataset Characteristics\n\nMulti-instance\
  \ structure — each patient contributes multiple samples from both the right and left eyes. This makes\
  \ standard random splitting unsuitable and requires a patient-level splitting strategy.\n\nMixed-class\
  \ patients — a single patient can have samples from both classes (e.g., one eye may be normal while\
  \ the other shows signs of papilledema). This further reinforces the need for patient-level data partitioning\
  \ rather than sample-level splitting.\n\nThe moderate class imbalance (69.6% Normal vs 30.4% Papilledema)\
  \ was addressed by using Macro-F1 as the primary evaluation metric, which treats both classes equally\
  \ regardless of their frequency.\n\n## Methodology\n\nThe principle of this pipeline is strict prevention\
  \ of data leakage, ensuring that information from test data never inadvertently influences the training\
  \ process. Applying data transformation to the entire dataset before splitting is a common mistake and\
  \ can lead to high bias and overly optimistic model performance.\n\nIn medical datasets, a single patient\
  \ often has multiple data points (X-ray scans, CT slices, clinical records). If we split by individual\
  \ sample rather than by patient, different samples from the same patient end up in both training and\
  \ test sets which means the model essentially memorizes diagnoses instead of learning real patterns.\
  \ This leads to strong evaluation results but poor real-world performance.\n\nTo address this, the train-test\
  \ split process is repeated 20 times with different random seeds, providing a more robust and reliable\
  \ evaluation framework.\n\nThe outer split code is shown in the following list:\n```python\nouter_splits\
  \ = []\n\nfor seed in range(20):\n    p_trainval, p_test = train_test_split(patients, test_size=0.2,\
  \ random_state=seed)\n    p_train, p_val = train_test_split(p_trainval, test_size=0.125, random_state=seed)\n\
  \    outer_splits.append({\n        'train_patients': p_train,\n        'val_patients':   p_val,\n \
  \       'test_patients':  p_test,\n        'seed':           seed\n    })\n```\n\nA nested cross-validation\
  \ approach was used:\n* **Outer loop** — splits data into train/validation/test at the patient level\
  \ (these are 20 splits)\n* **Inner loop** — performs model selection and hyperparameter optimization\
  \ via Optuna on the training fold only\n\nThis ensures hyperparameter selection is based solely on training\
  \ data, with no information leaking from the test set. Benefits of this approach:\n* reduces overfitting\
  \ by evaluating the model on different data subsets\n* provides stable and reliable performance estimates\
  \ across unseen data\n\nBuilding a robust, clinical-grade ML framework requires careful architectural\
  \ design to prevent data leakage, handle high-dimensional feature spaces, and ensure reliable probability\
  \ estimates. To address these challenges, I implemented the following pipeline:\n\n```text\n1.  Data\
  \ loading and binary label assignment (Normal=0, Papilledema=1)\n2.  20 repeated patient-level splits\
  \ (70% train / 10% val / 20% test)\n3.  For each outer split, for each model:\n    ├── Inner CV with\
  \ Optuna hyperparameter optimization\n    ├── Preprocessing fitted on inner-training fold only\n   \
  \ ├── MRMR feature selection on inner-training fold only\n    └── Model training + inner-validation\
  \ evaluation (Macro-F1)\n4.  Best configuration refitted on full training set\n5.  Sigmoid calibration\
  \ on training set\n6.  Validation set used for:\n    ├── Threshold optimization (range 0.05–0.95, step\
  \ 0.01)\n    └── Aggregation strategy selection (Macro-F1 + balanced accuracy)\n7.  Train + validation\
  \ merged → final model refitted\n8.  Independent test set evaluation\n9.  Aggregation of results across\
  \ 20 splits\n10. Soft-voting ensemble (RF + ET + GB)\n11. Feature stability analysis\n12. Statistical\
  \ comparison (Friedman, Wilcoxon, Bonferroni)\n```\n\nThe validation set serves two specific purposes:\n\
  \n1. Threshold Optimization — class-specific probability thresholds are optimized by searching the range\
  \ 0.05-0.95 in steps of 0.01, maximizing Macro-F1.\n2. Aggregation Strategy Selection — the best patient-level\
  \ aggregation strategy is selected based on Macro-F1 and balanced accuracy. The following strategies\
  \ were implemented and evaluated:\n```python\nTHRESHOLDS = np.arange(0.05, 0.95, 0.01)\n\ndef aggregate_probs(probs,\
  \ strategy):\n    \"\"\"Aggregate row-level probs to patient level.\"\"\"\n    if strategy == 'mean':\n\
  \        return np.mean(probs)\n    elif strategy == 'max':\n        return np.max(probs)\n    elif\
  \ strategy == 'majority_vote':\n        preds = (probs >= 0.5).astype(int)\n        return 1 if np.sum(preds)\
  \ > len(preds) / 2 else 0\n    elif strategy == 'top3_mean':\n        top3 = np.sort(probs)[-3:]\n \
  \       return np.mean(top3)\n    elif strategy == 'p90':\n        return np.percentile(probs, 90)\n\
  \    elif strategy == 'confidence_weighted':\n        weights = np.abs(probs - 0.5)\n        return\
  \ np.average(probs, weights=weights)\n    elif strategy == 'entropy_weighted':\n        entropy = -(probs\
  \ * np.log(probs + 1e-10) + (1 - probs) * np.log(1 - probs + 1e-10))\n        weights = 1 / (entropy\
  \ + 1e-10)\n        return np.average(probs, weights=weights)\n\nAGGREGATION_STRATEGIES = [\n    'mean',\
  \ 'max', 'majority_vote', 'top3_mean',\n    'p90', 'confidence_weighted', 'entropy_weighted'\n]\n```\n\
  \nAfter threshold and aggregation strategy selection, the training and validation sets are merged and\
  \ the final model is retrained using the best hyperparameters found during optimization. Sigmoid calibration\
  \ is then applied before test set evaluation.\n\n## Preprocessing\n\nTo prevent data leakage and ensure\
  \ a realistic evaluation of my ML models, it is critical that all preprocessing steps are fitted exclusively\
  \ on the training portion of the data and then applied to the validation and test sets.\n\nThe preprocessing\
  \ function:\n\n```python\ndef preprocess(X_train, X_val, X_test, cols):\n    # Median imputation\n \
  \   imputer = SimpleImputer(strategy='median')\n    X_train = pd.DataFrame(imputer.fit_transform(X_train),\
  \ columns=cols)\n    X_val   = pd.DataFrame(imputer.transform(X_val), columns=cols)\n    X_test  = pd.DataFrame(imputer.transform(X_test),\
  \ columns=cols)\n\n    # Low-variance filtering\n    var = VarianceThreshold(threshold=0.01)\n    var.fit(X_train)\n\
  \    cols = [c for c, k in zip(cols, var.get_support()) if k]\n    X_train = X_train[cols]\n    X_val\
  \   = X_val[cols]\n    X_test  = X_test[cols]\n\n    # High-correlation filtering\n    corr = X_train.corr().abs()\n\
  \    upper = corr.where(np.triu(np.ones(corr.shape), k=1).astype(bool))\n    to_drop = [c for c in upper.columns\
  \ if any(upper[c] > 0.95)]\n    cols = [c for c in cols if c not in to_drop]\n    X_train = X_train[cols]\n\
  \    X_val   = X_val[cols]\n    X_test  = X_test[cols]\n\n    # RobustScaler\n    scaler = RobustScaler()\n\
  \    X_train = pd.DataFrame(scaler.fit_transform(X_train), columns=cols)\n    X_val   = pd.DataFrame(scaler.transform(X_val),\
  \ columns=cols)\n    X_test  = pd.DataFrame(scaler.transform(X_test), columns=cols)\n\n    return X_train,\
  \ X_val, X_test, cols\n```\n\nPrior to imputation, all infinite values in the feature matrix were replaced\
  \ with `NaN`. A total of 1 infinite value was detected across the dataset.\n\n```python\nfeature_cols\
  \ = [col for col in df.columns if col.startswith('Feature_')]\ndf[feature_cols] = df[feature_cols].replace([np.inf,\
  \ -np.inf], np.nan)\n```\n\nA complete preprocessing summary is shown below:\n\n| Step | Method | Result\
  \ |\n|------|--------|--------|\n| Infinite value handling | Replace with NaN | 1 value fixed |\n| Missing\
  \ value imputation | Median imputation (train only) | 0 remaining NaN |\n| Low-variance filtering |\
  \ VarianceThreshold (threshold=0.01) | 746 → ~419 features |\n| High-correlation filtering | Pearson\
  \ correlation > 0.95 | ~419 → ~147 features |\n| Feature scaling | RobustScaler (train only) | Median\
  \ ≈ 0.0 |\n\n## Feature Selection\n\nMinimum Redundancy Maximum Relevance (MRMR) is a supervised, filter-based\
  \ feature selection algorithm designed to find the most useful features for a target variable while\
  \ reducing feature overlap.\n\nThe core objective of MRMR is to balance two competing criteria when\
  \ selecting features:\n* Maximum Relevance that selects features with high mutual information with the\
  \ target class\n* Minimum Redundancy that ensures selected features share low mutual information with\
  \ each other\n\n> In MRMR feature selection framework, **Mutual Information** serves as the core mathematical\
  \ metric used to evaluate and > select the most informative, non-redundant subset of features for a\
  \ ML model.\n\nBe"

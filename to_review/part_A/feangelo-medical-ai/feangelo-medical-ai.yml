readme_excerpt: '# Felipe Angelo Medical AI Lab


  **FAMAI Lab** — A structured learning portfolio for medical imaging, 3D segmentation, radiomics, and
  medical AI engineering


  > This project is in active development. Its current purpose is to document a transparent, reproducible
  learning path and establish the engineering foundation for future public work.


  [Português](README.pt-BR.md) · [Vision](VISION.md) · [Roadmap](ROADMAP.md) · [Documentation](docs/index.md)


  ## About


  My name is Felipe Angelo. I am a medical imaging professional with hands-on CT and MRI experience. My
  current documented learning focuses on 3D Slicer foundations and medical image segmentation. Quantitative
  imaging, radiomics, medical AI, centerlines, and digital twins are longer-term learning goals and are
  not presented as implemented competencies.


  FAMAI Lab is a long-term public portfolio and technical laboratory. It will be used to document learning,
  build reproducible workflows, and publish carefully reviewed projects based only on synthetic, public,
  or appropriately licensed open datasets.


  This repository does not contain clinical claims, diagnostic software, or private patient data.


  ## Current status


  The repository foundation is **In Progress**. Case studies, pipelines, validation results, publications,
  and deployed applications remain planned until evidence is available. See the [roadmap](ROADMAP.md)
  for the authoritative status.


  ## Learning roadmap


  - **Currently documented:** 3D Slicer foundations, segmentation tools, basic quantitative outputs, and
  mask quality control.

  - **Developing progressively:** Python engineering for reproducible medical-imaging workflows.

  - **Planned:** quantitative imaging and reproducible measurements.

  - **Planned:** radiomics methodology and feature reproducibility.

  - **Planned:** medical AI fundamentals, machine learning, deep learning, and model evaluation.

  - **Planned:** 3D models, centerline extraction, visualization, and digital twins.

  - **Ongoing principle:** privacy-conscious scientific communication without unsupported claims.


  ## Planned technology ecosystem


  The architecture is designed for future integration with 3D Slicer, SimpleITK, ITK, VTK, PyRadiomics,
  MONAI, nnU-Net, TotalSegmentator, Open3D, Blender, Jupyter, MkDocs, and GitHub Pages. These integrations
  are planned; their presence here does not imply implementation or validation.


  ## Repository structure


  | Path | Purpose |

  |---|---|

  | `.github/` | Continuous integration, templates, and repository automation. |

  | `assets/` | Public visual assets that are safe to distribute. |

  | `career/` | Evidence-based career materials and competency mapping. |

  | `cases/` | Public, synthetic, or open-dataset case studies. |

  | `configs/` | Shared, non-secret configuration files. |

  | `content/` | Drafts for public scientific communication and portfolio content. |

  | `docs/` | Technical documentation and future MkDocs website. |

  | `learning/` | Structured learning records and exercises. |

  | `notebooks/` | Reproducible notebooks without private data. |

  | `publications/` | Publication records and manuscripts when available. |

  | `reports/` | Cross-project public reports. |

  | `scripts/` | Safe command-line utilities and maintenance scripts. |

  | `src/medical_ai_lab/` | Reusable Python package source. |

  | `tests/` | Automated tests and validation fixtures. |

  | `tools/` | Lightweight developer tooling and documented integrations. |


  ## Data policy


  Private clinical DICOM, identifiable images, protected health information, credentials, and re-identification
  keys are prohibited. Every case must declare one of these classifications in `case.yaml`:


  - `synthetic`

  - `open-dataset`

  - `public`


  `open-dataset` and `public` cases must document provenance, license, and usage restrictions. Repository
  safeguards reduce risk but do not replace a manual privacy review before every commit and publication.
  See the [data governance policy](docs/data-governance.md).


  ## Getting started


  The project targets Python 3.12. No medical-imaging or deep-learning dependencies are configured in
  Phase 1.


  ```bash

  python -m venv .venv

  python -m pip install --upgrade pip

  python -m pip install -e ".[dev,docs]"

  pytest

  ruff check .

  ```


  Installation is optional during the foundation phase. The commands describe the intended future developer
  setup.


  ## Cases


  No portfolio case has been published yet. `cases/Case_Template/` defines the governance and documentation
  requirements for future work.


  ## Learning Journey


  The learning journey records concepts, questions, limitations, and next steps without presenting study
  activity as validated expertise. Progress is also summarized in [LEARNING_LOG.md](LEARNING_LOG.md).



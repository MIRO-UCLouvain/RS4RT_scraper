  Future lesson files can be prepared safely from the [lesson template](learning/3d-slicer/TEMPLATE.md):


  ```bash

  python scripts/create_lesson.py --number 13 --title "Lesson title" --dry-run

  python scripts/create_lesson.py --number 13 --title "Lesson title"

  ```


  The first command previews the destination. The second creates it only when no file already exists.
  Projects and results will be added only after implementation, review, and supporting evidence exist.


  ## Roadmap


  Work is tracked using four states: `Planned`, `In Progress`, `Validated`, and `Published`. A feature
  is never marked as validated or published without documented evidence.


  ## Contributing


  The laboratory is currently a personal portfolio, but constructive issues and future contributions are
  welcome under [CONTRIBUTING.md](CONTRIBUTING.md) and the [Code of Conduct](CODE_OF_CONDUCT.md).


  ## Security and responsible use


  Do not report sensitive medical data in a public issue. Follow [SECURITY.md](SECURITY.md) for responsible
  disclosure. Nothing in this repository is intended for diagnosis, treatment decisions, or clinical deployment
  without appropriate validation and regulatory review.



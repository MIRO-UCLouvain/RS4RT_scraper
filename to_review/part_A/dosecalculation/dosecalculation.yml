readme_excerpt: "# Head & Neck Dose Prediction on CT (real or synthetic)/ CBCT\n\nThis repository provides\
  \ code and pretrained weights for dose distribution prediction in Head & Neck Cancer (HNC) radiotherapy.\n\
  \nThe model was trained and validated on the public OpenKBP Head & Neck dataset, and it can be applied\
  \ to other HNC datasets (e.g., an in-house cohort) for inference.\n\n\n\n## Overview\n\nThis repository\
  \ provides **dose prediction** and **dosimetric evaluation** tools for **Head & Neck (HNC) radiotherapy**.\n\
  \nFor each patient, the pipeline can take as input:\n- **Real CT (rCT)**\n- **Synthetic CT (sCT)**\n\
  - **CBCT**\n- Corresponding **radiotherapy structures** (**PTVs + OARs**)\n\nand produces:\n- **Predicted\
  \ dose distributions** for the provided image modality/modalities\n- **Dosimetric evaluation metrics**,\
  \ including:\n  - **Dose MAE** computed over the **head & neck dose mask**\n  - **DVH errors/differences**,\
  \ reported as:\n    - an overall average DVH score aggregated across **PTV70**, **PTV63**, **PTV56**\
  \ and all included **OARs**, and\n    - **per-structure DVH metrics** computed separately for each target\
  \ volume and each OAR\n\nFor additional details on the methodology and evaluation protocol, please refer\
  \ to the paper included in this repository:  \n`/....../doseCalculation/article.pdf`\n\n\n\n\n# Pretrained\
  \ Weights\n\nPretrained weights are provided with this codebase.\n\nPath: `/weights/pretrained_model.pt`\
  \ \n"

readme_excerpt: "# RSTAR4D: <u>R</u>otational <u>ST</u>reak <u>A</u>rtifact <u>R</u>eduction in 4D CBCT\
  \ using a Separable 4D CNN\r\n\r\nhttp://arxiv.org/abs/2403.16361\r\n\r\nAuthor: Ziheng Deng, Jun Zhao,\
  \ School of BME, Shanghai Jiao Tong University\r\n\r\nThis repository is the official implementation\
  \ of RSTAR4D. The main contributions of the paper are:\r\n\r\n* We identified the rotational streak\
  \ artifacts (RSA) in 4D CBCT image.\r\n* We proposed the RSTAR-4DNet to effectively reduce the RSA in\
  \ the spatiotemporal domain.\r\n* We effectively trained a 4D CNN with limited computational resources\
  \ and only dozens of 4D training samples.\r\n\r\n\r\n\r\n## Update 2025.04.05:\r\n\r\nThis work has\
  \ been accepted by IEEE Transactions on Radiation and Plasma Medical Sciences (IEEE TRPMS, early access).\r\
  \n\r\nCodes and pre-trained model are available now. Please check the /githubcode for the codes. Example\
  \ data can be download from: [example_data](https://1drv.ms/f/c/db4039e05c3eb553/Ev7-DJrvvFFHmv62IxNZzBAB2KrUG21ddooG73w_Y4p17Q?e=2V1aX1)\r\
  \n\r\nLet me know if there is any bug.\r\n\r\n\r\n\r\n## What is rotational streak artifacts (RSA)?\r\
  \n\r\n1. According to the respiratory signal, the projection data from a full-circular scan are sorted\
  \ into 10 respiratory phases.\r\n\r\n   <div align=center><img width=\"640\" height=\"160\" src=\"gif/fig1.jpg\"\
  ></div>\r\n\r\n2. Within each phase, there are limited projection angles for CT reconstruction -> sparse-view\
  \ reconstruction -> streak artifacts.\r\n\r\n   <div align=center><img width=\"480\" height=\"472\"\
  \ src=\"gif/fig2.jpg\"></div>\r\n\r\n3. The distribution of streak artifacts is closely related to the\
  \ projection sampling pattern.\r\n\r\n   <div align=center><img width=\"640\" height=\"256\" src=\"\
  gif/fig3.jpg\"></div>\r\n\r\n4. The respiratory motion is quasi-periodic and sequential -> rotational\
  \ projection sampling map.\r\n\r\n3+4 -> RSA\r\n\r\n<div align=center>\r\n\r\n|          Projection\
  \ Sampling Map          |             Dynamic CBCT image (with RSA)              |\r\n| :---------------------------------------:\
  \ | :----------------------------------------------------: |\r\n| <img width=\"180\" src=\"gif/4dbinmap2.gif\"\
  > | <img width=\"180\" src=\"gif/rotatingstreakartifact.gif\"> |\r\n\r\n</div>\r\n\r\n## Demo\r\n\r\n\
  Here are some results of our RSTAR-Net tested on __*real clinical CBCT scans*__. \r\n\r\n<div align=center>\r\
  \n\r\n| Case  |               Uncorrected Image                |               Corrected Image     \
  \           |\r\n| :---: | :--------------------------------------------: | :------------------------------------------:\
  \ |\r\n| Case1 | <img width=\"270\" src=\"gif/T-uncorrected1.gif\"> | <img width=\"270\" src=\"gif/T-corrected1.gif\"\
  > |\r\n| Case2 | <img width=\"270\" src=\"gif/T-uncorrected2.gif\"> | <img width=\"270\" src=\"gif/T-corrected2.gif\"\
  > |\r\n| Case3 | <img width=\"270\" src=\"gif/T-uncorrected3.gif\"> | <img width=\"270\" src=\"gif/T-corrected3.gif\"\
  > |\r\n\r\n</div>\r\n\r\n## RSTAR-4DNet\r\n\r\n<div align=center><img width=\"480\" height=\"420\" src=\"\
  gif/fig5.jpg\"></div>\r\n\r\n<div align=center><img width=\"480\" height=\"216\" src=\"gif/fig6.jpg\"\
  ></div>\r\n\r\n\r\n\r\n"

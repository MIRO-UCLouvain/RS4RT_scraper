readme_excerpt: "# \U0001F9E0 BraTS Brain Tumor Segmentation UI\r\n\r\n[![Streamlit App](https://static.streamlit.io/badges/streamlit_badge_black_white.svg)](https://brain-tumor-segmentation-2020.streamlit.app)\r\
  \n[![Python 3.10+](https://img.shields.io/badge/python-3.10%2B-blue.svg)](https://www.python.org/)\r\
  \n[![PyTorch](https://img.shields.io/badge/PyTorch-EE4C2C?style=flat&logo=pytorch&logoColor=white)](https://pytorch.org/)\r\
  \n[![License: MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](https://opensource.org/licenses/MIT)\r\
  \n\r\nAn end-to-end deep learning web application built with **PyTorch** and **Streamlit** that performs\
  \ automatic brain tumor segmentation on 2D Magnetic Resonance Imaging (MRI) scans using a U-Net architecture\
  \ trained on the Brain Tumor Segmentation (BraTS) dataset.\r\n\r\n\U0001F517 **Live Web Application:**\
  \ [brain-tumor-segmentation-2020.streamlit.app](https://brain-tumor-segmentation-2020.streamlit.app)\r\
  \n\r\n---\r\n\r\n## \U0001F4F8 Application Preview\r\n\r\n<img width=\"1144\" height=\"838\" alt=\"\
  Screenshot 2026-08-07 064217\" src=\"https://github.com/user-attachments/assets/4e281913-a355-4a4b-bf35-54da9dc48643\"\
  \ />\r\n\r\n*Figure 1: Complete Streamlit UI displaying user file upload, real-time prediction execution,\
  \ and high-accuracy tumor segmentation overlay.*\r\n\r\n---\r\n\r\n## \U0001F4CC Overview\r\n\r\nBrain\
  \ tumor segmentation from MRI scans plays a critical role in clinical diagnosis, surgical planning,\
  \ and treatment monitoring. This application provides a real-time web interface where users can upload\
  \ axial brain MRI slices (FLAIR/T2-weighted images) and obtain automated, high-precision segmentation\
  \ overlays highlighting abnormal tumor tissue regions.\r\n\r\nThe processing pipeline incorporates specialized\
  \ computer vision post-processing steps to reduce false positives along high-contrast boundaries and\
  \ skull regions.\r\n\r\n---\r\n\r\n## \U0001F5BC️ Sample Segmentation Results\r\n\r\n \r\n\r\n  <img\
  \ width=\"702\" height=\"346\" alt=\"Screenshot 2026-08-07 024732\" src=\"https://github.com/user-attachments/assets/89ea5fac-ffa1-41ee-89b5-3b7f6ac1f710\"\
  \ />\r\n  <img width=\"700\" height=\"344\" alt=\"Screenshot 2026-08-07 063738\" src=\"https://github.com/user-attachments/assets/1ddc0bcc-0e97-48b1-aa50-6113b84c24aa\"\
  \ />\r\n  <img width=\"705\" height=\"335\" alt=\"Screenshot 2026-08-07 063813\" src=\"https://github.com/user-attachments/assets/9bb304ca-b166-4e40-a674-6cd983dfe52a\"\
  \ />\r\n \r\n\r\n---\r\n\r\n## ✨ Key Features\r\n\r\n* **U-Net Architecture:** Deep convolutional neural\
  \ network designed specifically for biomedical image segmentation.\r\n* **Automated Weight Download:**\
  \ Dynamically retrieves model checkpoint weights from release assets if missing locally.\r\n* **Channel-Wise\
  \ Z-Score Normalization:** Standardizes input pixel distributions to match clinical dataset training\
  \ parameters.\r\n* **Advanced Post-Processing Pipeline:**\r\n  * **Morphological Skull-Stripping:**\
  \ Removes high-contrast scalp and outer skull ring artifacts via morphological erosion.\r\n  * **Ventricle\
  \ & CSF Suppression:** Uses intensity-based percentile thresholding to clear false positives in fluid-filled\
  \ brain regions.\r\n  * **Connected Component Filtering:** Eliminates small floating noise artifacts\
  \ and disconnected pixel clusters.\r\n* **Interactive UI:** Generates side-by-side visual comparisons\
  \ of uploaded scans against tumor segmentation overlays alongside detected tumor pixel totals.\r\n\r\
  \n---\r\n\r\n## \U0001F6E0️ Tech Stack\r\n\r\n* **Framework & UI:** [Streamlit](https://streamlit.io/)\r\
  \n* **Deep Learning Framework:** [PyTorch](https://pytorch.org/)\r\n* **Image & Array Processing:**\
  \ [SciPy](https://scipy.org/), [NumPy](https://numpy.org/), [Pillow](https://python-pillow.org/)\r\n\
  * **Visualization:** [Matplotlib](https://matplotlib.org/)\r\n\r\n---\r\n\r\n## \U0001F680 Local Setup\
  \ and Installation\r\n\r\n### Prerequisites\r\n\r\n* Python 3.10 or higher\r\n* Git\r\n\r\n### Step-by-Step\
  \ Guide\r\n\r\n1. **Clone the Repository**\r\n   ```bash\r\n   git clone [https://github.com/Muhammad-Yousuf-Mughal/brain-tumor-segmentation.git](https://github.com/Muhammad-Yousuf-Mughal/brain-tumor-segmentation.git)\r\
  \n   cd brain-tumor-segmentation\r\n"

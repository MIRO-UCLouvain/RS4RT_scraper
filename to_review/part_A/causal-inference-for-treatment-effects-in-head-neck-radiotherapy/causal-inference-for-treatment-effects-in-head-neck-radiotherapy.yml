readme_excerpt: "## **Causal Effects of Concurrent Chemoradiotherapy vs Radiotherapy Alone in Head & Neck\
  \ Cancer- Survival Outcome**\n---\n\nHead and Neck Cancers (HNCs) account for > 900,000 cases and ~500,000\
  \ deaths annually worldwide. Radiotherapy (RT) is a foundational treatment. treatment strategy remains\
  \ a challenge. More than two-third of head and neck cancer patients require radiation therapy, which\
  \ can be given either alone or concurrently with chemotherapy. However, many patients receive chemoradiotherapy\
  \ (ChemoRT), adding systemic chemotherapy to improve tumor control. Radiotherapy (RT) forms the cornerstone\
  \ of curative treatment for locally advanced disease. In many patients, particularly those with aggressive\
  \ tumor biology or advanced nodal involvement((T,N,M stage) chemotherapy is added concurrently with\
  \ radiotherapy (chemoradiotherapy, ChemoRT) with the aim of enhancing tumor cytotoxicity.\n\nWhile randomized\
  \ trials suggest benefit in select populations, real-world treatment practices differ substantially:\
  \ variations in tumor site, HPV status, smoking behavior, disease staging, and health system factors\
  \ all influence whether chemotherapy is administered. Chemotherapy also carries major toxicity: swallowing\
  \ impairment, organ injury, hospitalization, and long-term disability. \n\nThus, the clinical dilemma\
  \ persists:\n\n**Does adding chemotherapy to radiotherapy improve survival for real-world patients for\
  \ whom does it help or harm?**\n\nThis is a counterfactual question: what would have happened to the\
  \ same patient had they received the alternative treatment? Traditional machine learning cannot answer\
  \ this:  correlation is not causation, making causal inference essential.\n\n---\n## Objective\n---\n\
  -To estimate Overall treatment effect (ATE)\n\n- To estimate Individualized effects (CATE)\n\n- To estimate\
  \ Time-varying treatment effects\n\n- To estimate Survival differences between RT and ChemoRT\n\n###\
  \ Primary Estimand (Part 1 — Baseline Total Effect)\n\nWe estimate the **total effect** of treatment\
  \ \\(A\\) on survival \\(Y\\):\nWe define the Average Treatment Effect (ATE) as:\n\n{ATE} = E[Y^{A=1}]\
  \ - E[Y^{A=0}]\n\nwhere:\n\nY(1) represents survival time had all patients received ChemoRT, and\n\n\
  Y(0) represents survival time had all patients received RT alone.\n\n### Secondary Estimand (Part 2\
  \ — Dynamic Treatment Strategies)\n\nRadiation dose and fractionation evolve over time and are influenced\
  \ by chemotherapy. We model time-varying regimen effects using Marginal Structural Models (MSMs)\n(CATE)\
  \ for a patient with covariates X=xX = xX=x is:\nCATE(x)=E[Y(1)−Y(0)∣X=x]\nWhere:\nY(1)Y(1)Y(1) = potential\
  \ outcome if treated\n\n\nY(0)Y(0)Y(0) = potential outcome if untreated\n\n---\n## Causal Framework\n\
  ---\nConfounder :A variable that causes both the treatment and the outcome\n\nConditional Exchangeability:\n\
  Given baseline confounders \U0001D44B treatment assignment \U0001D434 is independent of potential outcomes:\n\
  \n                                        Y(a)⊥A∣X\n\nPositivity:\nEvery combination of confounders\
  \ must have a non-zero probability of receiving either treatment.\n\nConsistency (SUTVA):\nEach patient’s\
  \ outcome corresponds to the treatment they received, with no interference across patients.\n\n\nTo\
  \ justify these assumptions, we developed a Directed Acyclic Graph (DAG) summarizing our causal model:\n\
  \n\n<img width=\"1024\" height=\"768\" alt=\"DAG Flowchart Diagram Template (1)\" src=\"https://github.com/user-attachments/assets/a5466bd8-1211-4cb9-8cf6-2b570820c9ca\"\
  \ />\n\n\n---\n## Methodology\n___\nWe use the **RADCURE** clinical dataset (N > 3,400), a multi-institutional\
  \ real-world registry of head and neck cancer patients treated with radiotherapy alone, radiotherapy+chemotherapy\
  \ and radiotherapy+EGFRI\nhttps://www.cancerimagingarchive.net/collection/radcure/\n\nCollected variables\
  \ include:\n- Baseline demographics and risk factors\n- Tumor site and staging (TNM, AJCC Stage)\n-\
  \ HPV status where clinically relevant\n- Treatment details (start date, chemotherapy administration)\n\
  - Survival outcomes (death, last follow-up, recurrence)\n<img width=\"1024\" height=\"1536\" alt=\"\
  Methodologyworkflow Image Nov 14, 2025, 09_52_33 AM\" src=\"https://github.com/user-attachments/assets/0e93321a-019d-470e-85dd-17c580233941\"\
  \ />\n\n\n\n\n\n\n"

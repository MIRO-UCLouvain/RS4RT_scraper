readme_excerpt: "<h1 align=\"center\">DentalCT</h1>\n<p align=\"center\">A dental CBCT viewer that runs\
  \ entirely in your browser.</p>\n<p align=\"center\">\n  <a href=\"./LICENSE\"><img alt=\"License\"\
  \ src=\"https://img.shields.io/badge/license-MIT-3178c6\"></a>\n  <img alt=\"100% local\" src=\"https://img.shields.io/badge/data-100%25_local-2e7d32\"\
  >\n  <img alt=\"made with vibes\" src=\"https://img.shields.io/badge/made_with-vibes-ff69b4\">\n</p>\n\
  \nDrop a Carestream **CS 3D Imaging** export (`.zip` of JPEG-lossless DICOMs) and\nget tri-planar MPR,\
  \ a cinematic 3D volume, panoramic, implant cross-sections\nwith nerve canal, and oblique reformats.\
  \ No upload, no install — the scan is\ndecoded and rendered locally and never leaves your machine.\n\
  \n## Use it\n\nOpen **[3dct.hackback.zip](https://3dct.hackback.zip)** and drop your zip. That's it.\n\
  \n## Run locally\n\n```bash\ncd web && python3 -m http.server 8000   # static, no backend\n```\n\nThere's\
  \ also a Python reference build (`uv pip install -e .` → `dentalct-server VOL_0`).\n\n## Layout\n- `web/`\
  \ — the static site (zip → decode → viewer), deployed via Pages\n- `src/dentalct/` — Python reference:\
  \ loader, MPR sampler, server\n- `docs/adr/`, `docs/notes/` — decisions & engineering notes\n\nPatient\
  \ DICOMs are PHI and git-ignored.\n"

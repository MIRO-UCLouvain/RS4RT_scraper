readme_excerpt: "# REDMOD Reproduction (Synthetic)\n\nA didactic reproduction of the REDMOD pancreatic-cancer\
  \ radiomics paper\n(Gut, April 2026, DOI: 10.1136/gutjnl-2025-337266) built around **simulated**\ndata\
  \ engineered to mirror the paper's reported study structure.\n\n> **Honesty banner.** No real CT scans,\
  \ no real patients, no real radiomic\n> features are used in this project. The simulator is calibrated\
  \ so that\n> downstream metrics land in the neighborhood of the paper's reported\n> numbers. Anything\
  \ we \"show\" here is a property of the simulator, not\n> independent validation of the paper. The goal\
  \ is to teach and showcase a\n> modern data-science pipeline end-to-end.\n\n## What's in here\n\n- `src/redmod/`\
  \ — library code (simulation, features, model, evaluation, viz).\n- `configs/redmod.yaml` — single source\
  \ of truth for cohort sizes and\n  signal/scanner/longitudinal knobs. Seed = 42.\n- `tests/` — determinism\
  \ + marginal-statistics tests.\n- `docs/data_science_overview.md` — a plain-English explainer of the\n\
  \  data-science choices behind the project.\n- `notebooks/` — thin narrative notebooks that import the\
  \ library.\n\n## Quick start\n\n```bash\n# install env (uses uv: https://github.com/astral-sh/uv)\n\
  uv sync --extra dev\n\n# run tests\nuv run pytest\n\n# generate the synthetic cohorts -> data/synthetic/*.parquet\n\
  uv run redmod simulate --config configs/redmod.yaml\n```\n\nOr via the Makefile:\n\n```bash\nmake install\n\
  make test\nmake simulate\n```\n\n## Project status\n\nThe vertical slice (Phase 1 scaffolding + Phase\
  \ 2 simulator) is complete.\nRoadmap:\n\n| Phase | Scope | Status |\n|------:|---|---|\n| 1 | Project\
  \ scaffolding (uv, ruff, mypy, pytest, Makefile) | ✅ |\n| 2 | Cohort + feature simulator | ✅ |\n| 3\
  \ | EDA module + figures | ⏳ |\n| 4 | LR + RF + XGB ensemble with SMOTE | ⏳ |\n| 5 | Evaluation (AUC\
  \ CI, Youden, calibration, decision-curve) | ⏳ |\n| 6 | Publication-grade figure factory | ⏳ |\n| 7\
  \ | Narrative report + slide deck | ⏳ |\n| 8 | Deployment demo (FastAPI + Streamlit) | ⏳ |\n\nSee `docs/data_science_overview.md`\
  \ for the data-science narrative.\n"

readme_excerpt: "# Fish Toxicity Regression\n\nThis repository implements a **Linear Regression model**\
  \ to predict acute aquatic toxicity in the fish species *Pimephales promelas* (Fathead Minnow). The\
  \ analysis is based on the **QSAR Fish Toxicity** dataset, which provides chemical descriptors as features\
  \ and the lethal concentration (*LC50*) as the target variable.\n\n---\n\n## Project Overview\n\nThe\
  \ objective of this project is to:\n- Analyze the relationship between chemical properties and fish\
  \ toxicity.\n- Build a regression model to predict the *LC50* value, representing the lethal concentration\
  \ that causes the death of 50% of the test fish population over 96 hours.\n\nThe workflow, from data\
  \ preprocessing to evaluation of the regression model, is detailed in the provided Jupyter Notebook.\n\
  \n[View the Notebook](https://nbviewer.org/github/npradaschnor/Fish-Toxicity-Prediction/blob/main/Fish%20Toxicity%20Regression.ipynb)\n\
  \n---\n\n## Model Implemented\n\n### Linear Regression\n- **Description**: A regression model that predicts\
  \ the target variable (*LC50*) based on a linear relationship with the input features.\n- **Key Features**:\n\
  \  - Handles continuous target variables effectively.\n  - Provides insights into the significance of\
  \ chemical descriptors.\n\n---\n\n## Dataset\n\n### QSAR Fish Toxicity\n- **Purpose**: The dataset is\
  \ primarily used to model acute aquatic toxicity.\n- **Target Variable**: *LC50* (lethal concentration\
  \ for 50% of test fish).\n- **Features**:\n  - Includes multiple chemical descriptors for each compound\
  \ tested.\n\nFor more details on the dataset, refer to the notebook.\n\n---\n\n## How to Use\n\n1. Clone\
  \ the repository:\n   ```bash\n   git clone https://github.com/npradaschnor/Fish-Toxicity-Regression.git\n\

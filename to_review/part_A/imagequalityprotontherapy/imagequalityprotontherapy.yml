readme_excerpt: "# CT Data Processing Project\n\n## Overview\n\nThis project consists of 3 modules.\n\n\
  The modules **Artificial_Data_Generation** and **Artificial_Data_Evaluation** were used for data generation\
  \ and analysis for the paper **Frensch C, Bäcker CM, Jentzen W, et al. Dose distributions of proton\
  \ therapy plans are robust against lowering the resolution of CTs combined with increasing noise. Med\
  \ Phys. 2025; 52:1293–1304.** (https://doi.org/10.1002/mp.17530).\n\nThe **Experiment_Evaluation** module\
  \ offers two different analysis possibilities:\n\n1. **PET/CT Reconstruction Analysis**: Investigation\
  \ of spatial resolution of artificial CTs generated from PET/CT data. The datasets are designated as\
  \ FDG_1 to FDG_30 and GA_1 to GA_30, where FDG and GA stand for the administered radionuclides and the\
  \ number indicates the number of reconstruction iterations of the algorithm. MTF10/MTF50 values as well\
  \ as FWHM parameters are determined from the data to characterize spatial resolution.\n\n2. **Phantom-based\
  \ Spatial Resolution Analysis**: Evaluation of CT data measured using the spatial resolution module\
  \ of a phantom. Here, Line Spread Function (LSF) parameters are determined and visualized.\n\n**Note:**\
  \ Due to the size of medical CT datasets (typically several GB per patient) and data protection regulations,\
  \ no example data is included in this repository. Specific experimental data can be provided upon request\
  \ for research purposes.\n\n## Modules\n\n### Artificial_Data_Generation\nThe core module for generating\
  \ synthetic CT data. Implements various degradation procedures for simulating different image qualities:\n\
  The Input is the original CT data and after adding noise or filtering, the images can be saved as DICOM\
  \ or PNG.\n\n**Main Components:**\n- **CTData.py**: Core classes for 3D CT data processing\n  - `CT3D`:\
  \ Manages 3D CT volumes from multiple layers\n  - `CTLayer`: Represents individual CT slices with DICOM\
  \ metadata\n- **Filter.py**: Spatial filtering operations\n  - Gaussian, rectangle and triangle filters\
  \ for resolution reduction\n- **Patient.py**: Patient data management\n  - `Patient`: Individual patients\
  \ with CT scans\n  - `PatientDataBase`: Management of multiple patients\n- **main_generation.py**: Main\
  \ processing logic with various modes\n\n**Supported Operations:**\n- Spatial filtering (Gaussian, Rectangle,\
  \ Triangle)\n- Noise addition (Gaussian White Noise)\n- Combined processing (Filter + Noise)\n- Export\
  \ as DICOM and PNG\n\n### Artificial_Data_Evaluation\nModule for quantitative evaluation of artificially\
  \ generated CT data through gamma analysis and dosimetric evaluation. Implements medical quality assurance\
  \ metrics for validation of synthetic datasets.\nHere there are two dose arrays as input needed for\
  \ the comparison of the two dose distribution. One distribution of the original CT data and one of the\
  \ modified CT data. You get these through dose calculation in an dose calculation program such as RayStation.\n\
  \n**Main Functions:**\n- Gamma analysis for dosimetric comparisons\n- ROI-based evaluations with anatomical\
  \ structures\n- Multi-plane visualization (transversal, sagittal, coronal)\n- Statistical evaluation\
  \ (pass rates, mean gamma, threshold analyses)\n\n### Experiment_Evaluation\nComprehensive module for\
  \ quantitative image quality analysis of medical imaging data. Implements standardized metrics for evaluating\
  \ image sharpness, noise, and frequency response characteristics.\nHere the experimental data of the\
  \ PET/CT imaging and the CT resolution imaging is evaluated. The experiment data must be provided as\
  \ input.\n\n**Main Functions:**\n- MTF analysis (Modulation Transfer Function) for resolution evaluation\n\
  - ESF/LSF analysis (Edge/Line Spread Function) for sharpness measurement\n- FWHM determination (Full\
  \ Width at Half Maximum)\n- Quantitative noise analysis in various ROIs\n\n### Example Outputs of the\
  \ Experiment_Evaluation Module\n\nThe module generates various visualizations of analysis results:\n\
  \nHere is an example of the LSF determined by the ESF from the experiment:\n\n**Edge Spread Function\
  \ (ESF) Analysis:**\n\n<img src=\"Experiment_Evaluation/outputImages/ESF.png\" width=\"400\" alt=\"\
  ESF Analysis\">\n\n*The extracted Edge Spread Function from the experiment*\n\n**Line Spread Function\
  \ (LSF) Analysis:**\n\n<img src=\"Experiment_Evaluation/outputImages/LSFstep3.png\" width=\"400\" alt=\"\
  LSF Analysis\">\n\n*Fitted and normalized Line Spread Function with Gaussian fitting*\n\nHere an example\
  \ of an LSF analysis from CT data generated by scanning an resolution module of a phantom.\nDifferent\
  \ angles were used to extract the LSF.\n\n**Radial CT Filter Analysis:**\n\n<img src=\"Experiment_Evaluation/outputImages/LSF_CT_filter_b_039.png\"\
  \ width=\"400\" alt=\"LSF CT Filter\">\n\n*LSF calculation for CT filter across various angles (0° to\
  \ 160°) for dataset b_039*\n\n## Data Requirements\n\n### Input Data\nThe system expects DICOM-formatted\
  \ CT scans with the following structure:\n```\ninput_data/\n├── patient_001/\n│   ├── CT001.dcm\n│ \
  \  ├── CT002.dcm\n│   └── ...\n└── patient_002/\n    ├── CT001.dcm\n    └── ...\n```\n\n### Data Format\
  \ Specifications\n- **Format**: DICOM (.dcm)\n- **Modality**: CT (Computed Tomography)\n- **Metadata**:\
  \ Pixel Spacing, Slice Thickness, Rescale Slope/Intercept\n- **Image Depth**: 16-bit (uint16)\n- **Coordinate\
  \ System**: Standard DICOM Patient coordinates\n\n### Using Your Own Data\n1. Organize DICOM files in\
  \ patient folders\n2. Ensure all required DICOM tags are present\n3. Adjust paths in configuration accordingly\n\
  \n\n## Usage\n\n### Basic Configuration for the module Artifical_Data_Generation\n\n```python\n# Verarbeitungsmodus\
  \ wählen\nMODE = 'combined'  # 'spatial', 'noise', 'combined'\n\n# Pfade definieren\nDATA_PATH_IN =\
  \ \"../data/input_data\"\nDATA_PATH_OUT = \"../data/output_data\"\n\n# Filter-Einstellungen\nFILTER_TYPE\
  \ = 'gaussian'  # 'gaussian', 'rectangle', 'triangle'\n```\n### Batch Processing\n\n```python\n# Alle\
  \ Patienten verarbeiten\ngen = data_base.patient_generator()\nwidths = [4, 10]\nnoise_levels = [7.51,\
  \ 20.55]\n\nfor patient in gen:\n    for width in widths:\n        for noise in noise_levels:\n    \
  \        patient.convolve_with_filter(width=width, filter_type='gaussian')\n            patient.add_noise(noise)\n\
  \            patient.write_modified_as_dicom(data_path=output_path, mods='combined')\n```\n\n## Processing\
  \ Modes\n\n### Data Generation Modes\n\n#### Spatial Filtering (`MODE = 'spatial'`)\n- Applies only\
  \ spatial filters\n- Simulates different resolution levels\n- Parameters: Filter type and width in mm\n\
  \n#### Noise Addition (`MODE = 'noise'`)\n- Adds only Gaussian White Noise\n- Simulates different noise\
  \ levels\n- Parameters: Standard deviation in HU\n\n#### Combined Processing (`MODE = 'combined'`)\n\
  - Combines spatial filtering with noise addition\n- Realistic simulation of degraded image quality\n\
  - Parameters: Filter width and noise sigma\n\n### Data Evaluation\n- **Gamma Analysis**: Dosimetric\
  \ comparisons with pass rate evaluation\n- **ROI Evaluation**: Anatomy-specific evaluations\n- **Visualization**:\
  \ Multi-plane heatmap overlays\n\n## Data Structure\n\n```\nproject/\n├── Artificial_Data_Generation/\n\
  │   ├── CTData.py           # Core CT data classes\n│   ├── Filter.py           # Filter operations\n\
  │   ├── Patient.py          # Patient management\n│   └── main_generation.py  # Main processing\n├──\
  \ Experiment_Evaluation/\n│   ├── main_experiment_evaluation.py # Image quality analysis main application\n\
  │   ├── image_processing.py # ESF/LSF/MTF analysis\n│   ├── noise_analysis.py  # Noise evaluation\n\
  │   ├── calculation_utils.py # Mathematical helper functions\n│   ├── Lookup_Data.py     # Experiment\
  \ parameters\n│   ├── constants.py       # System constants\n│   ├── outputImages/      # Example images\
  \ of analyses\n│   └── Experimente/           # Experiment data for evaluation\n├── Artificial_Data_Evaluation/\n\
  │   ├── main_evaluation.py # Gamma analysis main application\n│   ├── patient_evaluation.py # Dosimetric\
  \ evaluation\n│   ├── evaluation_utils.py # Helper functions and constants\n│   └── Dicts.py       \
  \    # Data structures (not shown)\n└── data/\n    ├── input_data/         # Original DICOM files\n\
  \    ├── output_data/        # Processed data\n    ├── gauss/             # Gaussian-filtered data\n\
  \    ├── rect/              # Rectangle-filtered data\n    ├── noise/             # Noise added data\n\
  \    ├── gauss_noise/       # Combined data (noise and filtering)\n    └── gamma_overlay/     # Gamma\
  \ visualizations\n\n \n```\n\n\n## Technical Details\n\n### Filter Parameters\n- **Gaussian**: Sigma\
  \ values in mm (e.g. 4, 10) (width = 2 sigma)\n- **Rectangle**: Width in mm (e.g. 8, 20) (width = half\
  \ of rectangle width)\n- **Triangle**: Width in mm\n\n### Noise Parameters\n- Standard deviation in\
  \ Hounsfield Units (HU)\n- Typical values: 4 - 40 HU\n\n### Export Formats\n- **DICOM**: Preserves medical\
  \ metadata\n- **PNG**: For visualization with windowing\n\n\n## Contact\n\nFor questions about the code,\
  \ provision of specific experimental data please contact:\n\ncarla.frensch@web.de\n"

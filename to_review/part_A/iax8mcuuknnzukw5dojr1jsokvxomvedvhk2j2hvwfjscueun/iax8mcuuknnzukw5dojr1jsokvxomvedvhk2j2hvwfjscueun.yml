readme_excerpt: "![Netlify Examples](https://github.com/netlify/examples/assets/5865/4145aa2f-b915-404f-af02-deacee24f7bf)\n\
  \n# MCP example Netlify Express\n\n**View this demo site**: https://mcp-example-express.netlify.app/\n\
  \n[![Netlify Status](https://api.netlify.com/api/v1/badges/f15f03f9-55d8-4adc-97d5-f6e085141610/deploy-status)](https://app.netlify.com/sites/mcp-example-express/deploys)\n\
  \n\n\n## About this example site\n\nThis site shows a very a basic example of developing and running\
  \ serverless MCP using Netlify Functions. It includes links to a deployed serverless function and an\
  \ example of accessing the function using a customized URL.\n\n- [Model Context Protocol (MCP)](https://modelcontextprotocol.io/)\n\
  - [Docs: Netlify Functions](https://docs.netlify.com/functions/overview/?utm_campaign=dx-examples&utm_source=example-site&utm_medium=web&utm_content=example-mcp-express)\n\
  - [Agent Experience (AX)](https://agentexperience.ax?utm_source=express-mcp-guide&utm_medium=web&utm_content=example-mcp-express)\n\
  \nImportantly, because of how Express handles mapping routes, ensure you set the `netlify.toml` redirects\
  \ to the correct path. In this example we have the following to ensure <domain>/mcp catches all of the\
  \ requests to this server:\n\n```toml\n[[redirects]]\n  force = true\n  from = \"/mcp\"\n  status =\
  \ 200\n  to = \"/.netlify/functions/express-mcp-server\"\n```\n\n\n\n## Speedily deploy your own version\n\
  \nDeploy your own version of this example site, by clicking the Deploy to Netlify Button below. This\
  \ will automatically:\n\n- Clone a copy of this example from the examples repo to your own GitHub account\n\
  - Create a new project in your [Netlify account](https://app.netlify.com/?utm_medium=social&utm_source=github&utm_campaign=devex-ph&utm_content=devex-examples),\
  \ linked to your new repo\n- Create an automated deployment pipeline to watch for changes on your repo\n\
  - Build and deploy your new site\n- This repo can then be used to iterate on locally using `netlify\
  \ dev`\n\n[![Deploy to Netlify](https://www.netlify.com/img/deploy/button.svg)](https://app.netlify.com/start/deploy?repository=https://github.com/netlify/examples/&create_from_path=examples/mcp/express-mcp&utm_campaign=dx-examples)\n\
  \n\n## Install and run the examples locally\n\nYou can clone this entire examples repo to explore this\
  \ and other examples, and to run them locally.\n\n```shell\n\n# 1. Clone the examples repository to\
  \ your local development environment\ngit clone git@github.com:netlify/examples\n\n# 2. Move into the\
  \ project directory for this example\ncd examples/mcp/express-mcp\n\n# 3. Install the Netlify CLI to\
  \ let you locally serve your site using Netlify's features\nnpm i -g netlify-cli\n\n# 4. Serve your\
  \ site using Netlify Dev to get local serverless functions\nnetlify dev\n\n# 5. While the site is running\
  \ locally, open a separate terminal tab to run the MCP inspector or client you desire\nnpx @modelcontextprotocol/inspector\
  \ npx mcp-remote@next http://localhost:8888/mcp\n\n```\n\n\n"

readme_excerpt: "# Anatomical Region Labeling (ARL)\nA deep-learning based anatomy region labeling for\
  \ Cone-Beam Computed Tomography (CBCT) scans\n\nThis tool queries CBCT scans from an ARIA database (Varian\
  \ Medical Systems, Palo Alto, CA) using a DICOM Query & Retrieval Tool (DQR) and classifies the scans\
  \ into four distinct regions: head & neck, thoracic-abdominal, pelvis, and extremity. The ARL tool was\
  \ implemented on Python 3.7/3.9 using Tensorflow 2.2. Algorithm training and testing was performed on\
  \ an Nvidia Quadro P1000 4GB GPU system with 16 GB RAM.\n\n## Requirements for the DQR:\n1.\tTrusted\
  \ connection with Aria database:\n\n    - To setup a Varian Daemon, please follow the instructions on\
  \ the Varian API Book (https://varianapis.github.io/VarianApiBook.pdf), specifically in Chapter 4  \
  \    (Daemons: a tour through Varian’s DICOM API).\n\n    - The user will need two trusted entities\
  \ (one for the Service Class Provider (SCP), and one for the Service Class User (SCU)). Once set up,\
  \ please note the AE Title and Port Number of both trusted entities. Also note the AE Title, IP, and\
  \ Port Number of the Aria server.\n\n2.\tPython Environment (Python 3.9)\n\n    - The conda environment\
  \ required for the DQR can be installed using the **dicom.yml** file present in the conda_envs folder\n\
  \n## Requirements for the CBCT image pre-processing and ARL model prediction:\n1.\tPython Environment\
  \ (Python 3.7)\n\n    - The conda environment required for the ARL can be installed using the **tensor6.yml**\
  \ file present in the conda_envs folder\n\n## Setting up the connection and output directories:\n1.\t\
  Open the setup_information.json file using a text editor and adjust the following:\n\n    - Input the\
  \ connection settings (AE Title, Host IP, and Port Number) for the Aria server, and the two trusted\
  \ entities.\n  \n    - staging_path: staging directory (“outputs” folder dir found in ARL_repo).\n \
  \ \n    - dicom_path: folder location where the dicom files will be saved.\n  \n    - archive_path:\
  \ folder location where the dicom file information and model prediction will be archived.\n  \n    -\
  \ report_path: folder location where the final report file (prediction) will be outputted.\n  \n   \
  \ - log_path: folder location where the log file will be saved.\n  \n    - asset_path: folder path to\
  \ the assets required to build the report (none currently).\n\n**Pipeline_python.bat**: Queries pre-treatment\
  \ CBCTs from the previous day for classification. *On first use: please open file with a text editor\
  \ and adjust APPDIR to the current file directory and LOGFILE to the log_path directory.*\n\n**Pipeline_python_by_date**:\
  \ Queries CBCT data from the date inputted by user. Please use YYYY-MM-DD as the date format. *On first\
  \ use: please open file with a text editor and adjust APPDIR to the current file directory and LOGFILE\
  \ to the log_path directory.*\n\nExample launch on cmd:\n> */ARL_repo_dir/*> Pipeline_python_by_date\
  \ 2022-12-06\n\n\n## If you use part or all of this repository, please cite:\n> **Luximon, D. C., Neylon,\
  \ J., & Lamb, J. M. (2023). Feasibility of a deep-learning based anatomical region labeling tool for\
  \ Cone-Beam Computed Tomography scans in Radiotherapy. Physics and Imaging in Radiation Oncology, 100427.\
  \ https://doi.org/10.1016/j.phro.2023.100427**\n\n## Support and Contact\nIf you have questions and/or\
  \ suggestions - please contact me at dcluximon@gmail.com\n"

readme_excerpt: "# Voxelmap\nA deep learning framework for patient-specific 3D intrafraction motion modelling\
  \ and volumetric imaging\n\nTo get you started right away, we have uploaded some example data at https://ses.library.usyd.edu.au/handle/2123/32282\
  \ and have created a Jupyter notebook (tutorial.ipynb), which guides you through the framework. If you\
  \ use this code, please cite: \n\n* [\"An open-source deep learning framework for respiratory motion\
  \ monitoring and volumetric imaging during radiation therapy\"](https://aapm.onlinelibrary.wiley.com/doi/full/10.1002/mp.18015)\n\
  \  \n* [\"A patient-specific deep learning framework for 3D motion estimation and volumetric imaging\
  \ during lung cancer radiotherapy\"](https://iopscience.iop.org/article/10.1088/1361-6560/ace1d0/meta)\n\
  \nThe key idea behind this framework is that 2D views provide hints about 3D motion. Patient-specific\
  \ geometric correspondences can be learned from pre-treatment 4D imaging data. Image registration and\
  \ forward-projection can be used to generate the desired 3D deformation vector fields (DVFs) and 2D\
  \ projections, which are then used to train a deep neural network. During treatment, a trained neural\
  \ network can be used to provide insights regarding 3D internal patient anatomy from 2D images acquired\
  \ in real-time. In particular, the predicted 3D DVF can be used to warp pre-treatment 3D images and\
  \ contours to provide real-time volumetric imaging as well as the 3D positions of the target and surrounding\
  \ organs-at-risk.\n\n![Proposed clinical workflow](https://github.com/Image-X-Institute/Voxelmap/blob/main/Workflow.jpg)\n\
  \nThis task can be approached in a variety of ways, yielding a number of different network architectures.\
  \ Here, in every case, we use a residual network with an encoding arm(s) that generates a low-dimensional\
  \ feature representation of the input images that is then decoded to predict the desired 3D DVF. We\
  \ also use scaling and squaring layers to integrate the output of the neural network to encourage diffeomorphic\
  \ mappings.\n\n![Networks](https://github.com/Image-X-Institute/Voxelmap/blob/main/Networks.jpg)\n\n\
  Here we provide code for 5 different neural networks. train_a and test_a are used to train and test\
  \ Network A respectively, and so on. This repository has benefitted greatly from the excellent Voxelmorph\
  \ repository. You can check out their work here: https://github.com/voxelmorph/voxelmorph\n\nThis repository\
  \ is provided for academic and non-commercial research purposes. While the source code is licensed under\
  \ the MIT License, the underlying methods are protected by US Patent Application US20250285300A1. No\
  \ license to the patent rights is granted by this repository. Commercial use, including integration\
  \ into medical devices or for-profit platforms, requires a separate patent license.\n"

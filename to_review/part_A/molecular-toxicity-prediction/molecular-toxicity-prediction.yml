readme_excerpt: "# Molecule Optimization Resource\n\nThis project provides a web-based tool for medicinal\
  \ chemists to optimize molecules, predict cardiotoxicity, and visualize chemical space.\n\n## Components\n\
  \n- **Backend**: FastAPI (`backend.py`) - Handles prediction, property calculation, and UMAP projection.\n\
  - **Frontend**: Streamlit (`app.py`) - User interface for input and visualization.\n- **Data Prep**:\
  \ (`prepare_data.py`) - Cleans data and trains models.\n\n## Setup\n\n1.  **Environment**: A virtual\
  \ environment `venv` has been created and dependencies installed.\n    ```bash\n    source venv/bin/activate\n\
  \    ```\n\n2.  **Data & Models**: The `prepare_data.py` script has already run and generated:\n   \
  \ -   `clean_data.csv`\n    -   `model.pkl` (Random Forest Classifier)\n    -   `umap_reducer.pkl` (UMAP\
  \ Reducer)\n\n    If you need to regenerate them:\n    ```bash\n    python prepare_data.py\n    ```\n\
  \n## Running the Demo\n\nYou need to run the Backend and Frontend in separate terminals.\n\n### 1. Start\
  \ the Backend\n```bash\n./venv/bin/uvicorn backend:app --host 0.0.0.0 --port 8000\n```\nWait for \"\
  Application startup complete\".\n\n### 2. Start the Frontend\nOpen a new terminal:\n```bash\n./venv/bin/streamlit\
  \ run app.py\n```\n\nThe Streamlit app should open in your browser automatically (usually at `http://localhost:8501`).\n\
  \n## Features\n\n- **SMILES Input**: Enter a SMILES string (e.g., Aspirin: `CC(=O)Oc1ccccc1C(=O)O`).\n\
  - **Structure**: 2D visualization of the molecule.\n- **Toxicity**: Probability of cardiotoxicity based\
  \ on the trained Random Forest model.\n- **Properties**: Molecular Weight, LogP, H-Bond descriptors,\
  \ and Lipinski Rule checks.\n- **Chemical Space**: Interactive Scatter plot showing where your molecule\
  \ lies relative to the training dataset (colored by toxicity).\n"

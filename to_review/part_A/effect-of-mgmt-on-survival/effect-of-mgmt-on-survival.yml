readme_excerpt: "# GBM Survival Prediction with MGMT Domain Shift\n\nThis repository contains code to\
  \ predict overall survival in glioblastoma (GBM) patients using MRI radiomics and machine learning.\n\
  \nThe project studies how the availability of the MGMT biomarker affects model training and performance\
  \ by comparing MGMT-known and MGMT-unknown patient cohorts.\n\n## What this repo does\n\n- Preprocesses\
  \ radiomics features\n- Splits patients based on MGMT status\n- Trains SVM survival prediction models\n\
  - Evaluates performance using ROC-AUC and Kaplan–Meier analysis\n\n## How to run\n\n1. Preprocess radiomics\
  \ data:\npython data_preprocessing.py\n\n2. Split into MGMT cohorts:\npython split_mgmt_valid_invalid.py\n\
  \n3. Train and evaluate models:\npython mgmt_matrix_analysis_revised.py\n\n## Requirements\n\nPython\
  \ 3.x with:\npandas  \nnumpy  \nscikit-learn  \nscipy  \nlifelines  \nmatplotlib  \njoblib  \n\nInstall\
  \ with:\npip install pandas numpy scikit-learn scipy lifelines matplotlib joblib\n\n## Data\n\nPatient\
  \ data are not included in this repository.  \nYou must provide your own radiomics and clinical CSV\
  \ files with the required columns.\n\n## Output\n\nThe code will generate:\n- Trained model files (.pkl)\n\
  - ROC plots\n- Kaplan–Meier plots\n- CSV files with results and cohort statistics\n\n## Disclaimer\n\
  \nThis code is for research purposes only and not for clinical use.\n\n## Author\n\nReedam Choudhary\n"

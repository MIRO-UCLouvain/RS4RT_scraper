readme_excerpt: "# pSS‑CT‑Radiomics‑Toolkit\n\n> A complete toolkit for non‑invasive, interpretable early\
  \ diagnosis of primary Sjögren’s syndrome (pSS) using CT images.\n\n---\n\n## \U0001F50D Features\n\n\
  1. **Automatic Segmentation**  \n   - nnUNetv2‑based accurate delineation of salivary glands (parotid\
  \ & submandibular)\n\n2. **Feature Extraction & Enhancement**  \n   - PyRadiomics for 1,409 texture\
  \ features  \n   - Variational autoencoder (CVAE)–based data augmentation\n\n3. **Model Training** \
  \ \n   - Algorithms: XGBoost, Random Forest, LightGBM  \n   - Ensemble strategies: Voting & Stacking\
  \  \n\n4. **Interpretability Analysis**  \n   - SHAP‑based global & individual feature importance  \n\
  \n5. **Feature Visualization**  \n   - 3D voxel‑level rendering  \n   - Interactive visualization scripts\n\
  \n6. **Web Prediction Platform**  \n   - Flask server for DICOM/NIfTI upload  \n   - Automatic segmentation,\
  \ probability output & SHAP force plots  \n\n---\n"

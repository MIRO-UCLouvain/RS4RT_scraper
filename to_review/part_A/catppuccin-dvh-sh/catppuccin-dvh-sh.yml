readme_excerpt: "# Catppuccin API\n\n> High-performance, lightweight C++ REST API for serving Catppuccin\
  \ theme data.\n\n![C++](https://img.shields.io/badge/C++17-00599C?style=flat&logo=c%2B%2B&logoColor=white)\n\
  ![Docker](https://img.shields.io/badge/Docker-2496ED?style=flat&logo=docker&logoColor=white)\n![License](https://img.shields.io/badge/License-MIT-blue.svg)\n\
  \nA backend service built for speed and low resource usage, designed to serve data related to the Catppuccin\
  \ theming ecosystem. It is optimized for containerized deployments.\n\n---\n\n## Features\n\n- **High\
  \ Performance**: Low-latency responses powered by `cpp-httplib` and aggressive C++ optimizations.\n\
  - **Lightweight**: Minimal memory footprint and a small, multi-stage Docker image (<10MB).\n- **Production\
  \ Ready**: Includes rate limiting, health checks, metrics, and graceful shutdown handling.\n- **Configurable**:\
  \ All key parameters are managed via environment variables for deployment flexibility.\n- **Simple &\
  \ Focused**: Provides a clean, read-only API for accessing ports, palettes, and other community data.\n\
  \n## Quick Start (Docker)\n\nThe recommended way to run this API is with Docker.\n\n1.  **Clone the\
  \ repository:**\n\n    ```bash\n    git clone https://github.com/dvh-sh/catppuccin.dvh.sh.git\n    cd\
  \ catppuccin-api\n    ```\n\n2.  **Build and run using Docker Compose:**\n    ```bash\n    docker compose\
  \ up --build -d\n    ```\n\nThe API will be available at `http://localhost:3000`.\n\n## API Endpoints\n\
  \nAll endpoints return JSON data.\n\n| Method | Endpoint                   | Description           \
  \                         |\n| :----- | :------------------------- | :---------------------------------------------\
  \ |\n| `GET`  | `/health`                  | Health check for monitoring.                   |\n| `GET`\
  \  | `/metrics`                 | Provides server uptime and request metrics.    |\n| `GET`  | `/palette`\
  \                 | Returns the complete Catppuccin color palette. |\n| `GET`  | `/ports`          \
  \         | Lists all ports, paginated.                    |\n| `GET`  | `/ports/:identifier`      \
  \ | Retrieves a specific port by its key.          |\n| `GET`  | `/userstyles`              | Lists\
  \ all userstyles, paginated.               |\n| `GET`  | `/userstyles/:identifier`  | Retrieves a specific\
  \ userstyle by its key.     |\n| `GET`  | `/collaborators`           | Lists all collaborators, paginated.\
  \            |\n| `GET`  | `/collaborators/:username` | Retrieves a specific collaborator.         \
  \    |\n| `GET`  | `/categories`              | Lists all categories, paginated.               |\n|\
  \ `GET`  | `/categories/:key`         | Retrieves a specific category.                 |\n| `GET`  |\
  \ `/showcases`               | Lists all showcases, paginated.                |\n| `GET`  | `/rate-limit-status`\
  \       | Shows the current rate limit for your IP.      |\n\n**Pagination Query Parameters:**\n\n-\
  \ `?page=<number>`: The page number to retrieve (default: `1`).\n- `?per_page=<number>`: The number\
  \ of items per page (default: `20`).\n\n---\n\n## Configuration\n\nThe application is configured using\
  \ environment variables.\n\n| Variable      | Description                                  | Default\
  \   |\n| :------------ | :------------------------------------------- | :-------- |\n| `HOST`      \
  \  | The network address to bind the server to.   | `0.0.0.0` |\n| `PORT`        | The port for the\
  \ server to listen on.        | `3000`    |\n| `THREADS`     | The number of worker threads for the\
  \ server. | `4`       |\n| `RATE_LIMIT`  | The number of requests allowed per window.   | `100000` \
  \    |\n| `RATE_WINDOW` | The duration of the rate limit window (sec). | `3600`    |\n| `CACHE_TTL`\
  \   | Cache time-to-live in seconds.               | `300`     |\n| `VERBOSE`     | Enable verbose logging\
  \ (`true`/`false`).     | `false`   |\n\n---\n\n## Building from Source\n\n### Requirements\n\n- A C++17\
  \ compatible compiler (GCC 7+, Clang 6+)\n- `make`\n- `curl` (for fetching data)\n\n### Build Commands\n\
  \nThe Makefile provides targets for both production and debugging.\n\n- **Create a release build (optimized):**\n\
  \n  ```bash\n  make release\n  ```\n\n- **Create a debug build:**\n\n  ```bash\n  make debug\n  ```\n\
  \n- **Run the application:**\n\n  ```bash\n  ./catppuccin-api\n  ```\n\n- **Clean build artifacts:**\n\
  \  ```bash\n  make clean\n  ```\n\n## Acknowledgements\n\n- [nlohmann/json](https://github.com/nlohmann/json)\n\
  - [yhirose/cpp-httplib](https://github.com/yhirose/cpp-httplib)\n- [catchorg/Catch2](https://github.com/catchorg/Catch2)\n\
  \n## License\n\nThis project is licensed under the MIT License. See the [LICENSE](LICENSE) file for\
  \ details.\n"

readme_excerpt: '# Brain-Tumor-Segmentation


  Python implementation of three classical computer vision methods for brain tumor MRI segmentation:


  * **Otsu''s Thresholding**

  * **K-Means Clustering**

  * **Watershed Algorithm**


  This project uses a Jupyter Notebook to process MRI images and identify tumor regions.


  # Results


  The results of the three methods are compared with the original MRI image.

  **Otsu''s Thresholding**: Separates the image based on intensity.

  **K-Means Clustering**: Groups pixels into different regions based on intensity.

  **Watershed**: Identifies and marks the tumor region.


  # Dataset

  The project was tested on brain MRI images containing meningioma tumors.


  # Requirements & Installation

  Install the required libraries:


  ```bash

  pip install opencv-python numpy matplotlib



readme_excerpt: "# IMRT-QA Classification Using CNN on DICOM Dose Maps\n\nThis repository contains my\
  \ master's thesis project: a deep learning pipeline for quality assurance (QA) classification in IMRT\
  \ (Intensity-Modulated Radiation Therapy). The goal is to classify DICOM dose maps from actual treatment\
  \ fields as either **Pass** or **Fail** according to standard gamma evaluation metrics (3%/3mm, 90%\
  \ threshold, ≥95% pass rate). I found these metrics the most suitable for the dataset I had on hand\
  \ and is strict enough.\n\nThe dataset consists of preprocessed DICOM dose fields from prostate, rectum,\
  \ and pelvic cancer patients, collected at AUBMC. Each sample is standardized into a single-channel,\
  \ 224×224 image, and labeled based on clinical QA outcomes. Input I chose is single-channel DICOM field\
  \ distributions rather than stacking and attenpting at finding 3-Channel synthetic DICOM equivalents.\
  \ I wanted the model to be as simplistic and straightforward as possible. \n\n## Model and Methods\n\
  \nThe core model is a classifier based on MONAI's `DenseNet121`, trained from scratch using cross-entropy\
  \ loss with class weighting, a StepLR scheduler, and the Adam optimizer. The model distinguishes between\
  \ two QA quality classes (pass and fail).\n\nI experimented with various augmentation strategies and\
  \ preprocessing methods, including:\n\n- **Affine transforms** \n- **Channel standardization** \n- **Gamma-label\
  \ binarization** \n- **Calibration**\n\n### Experiments and Notes\n\n- **CBAM Attention Module**: I\
  \ integrated a CBAM (Convolutional Block Attention Module) into ResNet18 to enhance attention and interpretability.\
  \ The model overfit quickly and generalization suffered. Regularization attempts were not enough to\
  \ stabilize validation accuracy.\n\n- Pretrained Models: I also tested pretrained weights but saw lower\
  \ performance than training from scratch. This aligns with published findings in the field ( Deep Nets\
  \ vs Expert Designed Features in Medical Physics: An IMRT QA case study), who also noted that domain-specific\
  \ training yields better results than using natural-image pretraining.\n\n## Results\n\n- Gamma pass/fail\
  \ threshold: 3%/3mm, 90% threshold\n- Test accuracy: ~72%\n- Confusion matrix and classification report\
  \ saved automatically after testing.\n\n"

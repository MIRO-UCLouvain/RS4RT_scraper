readme_excerpt: "# PROFARM\nMachine Learning based Web Project to give Crop Predictions and Yield Predictions\
  \ on basis of data supplied by user, and an API to get the results for usage in creation of more apps.\
  \ \n\nCreated during Digital Village Hackathon hosted by Thapar Institute of Engg. Technology Patiala,\
  \ in 2022.\n\n## [Complete Idea Presentation / Guide](https://drive.google.com/file/d/1QqNy5aPv9-BKmHkf6QdpnxvkOccBM--B/view?usp=sharing)\n\
  \n<!-- ### [Use it Live | Profarm.ml](http://profarm.ml)\nThe project is deployed on a VM by Google\
  \ Cloud Platform. The VM is an `8-Core 32GB RAM` Windows Server 2022 based machine, capable of handling\
  \ heavy loads incase the usage increases. The VM is scalable and specifications can be increased as\
  \ per requirement. \n -->\n\n### API USAGE\n```\nFORMAT\nhttp://profarm.ml/crop-api/<nitrogen>/<phosphorus>/<potassium>/<temperature>/<humidity>/<soilph>/<rainfall>/\n\
  \nRETURNS\nJson Body with two fields \n1. crop_name (string)\n2. accuracy (float)\n```\n\n### Local\
  \ Deployment on Windows\n\n1. Copy the `dfhmain` folder and `requirements.txt` file to a new folder.\n\
  \n2. Create a Virtual Environment in the folder using - \n```\npip install virtualenv\n\nvirtualenv\
  \ dfhproject\n```\n\n3. Enter the Venv\n```\ndfhproject\\Scripts\\activate\n```\n\n3. Move to `dfhmain`\
  \ and install required packages using -\n```\ncd dfhmain\n\npip install -r requirements.txt\n```\n\n\
  4. Perform migrations\n```\npython manage.py migrate\n```\n\n5. Run the Project\n```\npython manage.py\
  \ runserver\n```\n\n**Access the project on https://127.0.0.1:8000**\n"

readme_excerpt: '# GNN Capstone Project


  Graph Neural Network pipeline for brain tumor segmentation on MRI volumes (BraTS2021 dataset) — represents
  each MRI slice as a superpixel graph and trains a GNN to classify tumor regions.


  ## Pipeline


  Scripts run in stage order:


  | Stage | Script | Purpose |

  |---|---|---|

  | a2 | `slice_selection.py` | Select relevant slices from each 3D MRI volume |

  | b1 | `superpixels.py` | Generate superpixel segmentation per slice |

  | b2 | `graph_build.py` | Build a graph from superpixels (nodes + edges) |

  | b3 | `gnn_sanity.py` | Sanity-check the GNN on a small sample |

  | c1 | `build_dataset.py` | Assemble the full graph dataset |

  | c2 | `make_splits.py` | Create train/val/test splits |

  | c3 | `train_gnn.py` | Train the GNN |

  | c4 | `infer_case.py` | Run inference on a case |

  | c5 | `eval_case.py` | Evaluate predictions against ground truth |


  ## Notebooks


  `notebooks/` contains preprocessing exploration; `TestProject/` contains early sanity-check notebooks
  and a slice-visualization script.


  ## Tech stack


  Python, PyTorch / PyTorch Geometric (GNN), scikit-image (superpixels), nibabel (NIfTI I/O)


  ## Getting started


  ```bash

  pip install -r requirements.txt

  ```


  `requirements.txt` is currently empty — dependencies need to be pinned before this is reproducible elsewhere.

  '

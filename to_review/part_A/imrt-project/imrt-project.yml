readme_excerpt: "### IMRT-Project\n\nThe codes presented in this link support the thesis delivered on\
  \ July 5, 2018 \nto the Department of Mathematics of the University of Coimbra under the title: \n\"\
  Computational methods for beam angle optimization in intensity modulated  \nradiotherapy\". \n\nThese\
  \ codes supported the computational results presented in Chapter 5 and are \ndivided into 3 different\
  \ folders, referring to the 3 computational experiments \nperformed. The user must have the software\
  \ Matlab and CPLEX.\n\nIn order to execute these codes properly, he user must have the software Matlab\
  \ \nand cplex. The codes should be downloaded and later performed in the matlab \nsoftware, through\
  \ 'main.m'. However, in order to run 'Experiment 2' or \n'Experiment 3', the codes should be downloaded\
  \ and added or replaced (if they \nhave the same name) to the files in the 'Experiment 1'.\n"

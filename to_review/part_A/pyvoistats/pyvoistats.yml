readme_excerpt: "### Python scripts to calculate statistics for DICOM structures\n\n * Mask by VOI\n \
  \  - Overrides CT values inside the structure that matches the given string.\n   - Using [PyTRIP](https://github.com/pytrip/pytrip)\n\
  \ * Field specific WEPL\n   - Computes the equivalent WEPL to a structure in another image.\n   - Using\
  \ [CbctRecon](https://gitlab.com/agravgaard/cbctrecon)\n * Dice #\n   - Calculates DICE and hausdorff\
  \ between structures.\n   - Using [plastimatch](https://gitlab.com/plastimatch/plastimatch)\n * My Regex\
  \ #\n   - Data extraction using regular expressions on the output from the [plastimatch](https://gitlab.com/plastimatch/plastimatch)\
  \ dice function.\n * Run\n   - A short bash script to run the three scripts above in the right order.\n"

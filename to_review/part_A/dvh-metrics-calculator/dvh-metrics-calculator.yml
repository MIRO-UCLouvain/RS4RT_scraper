readme_excerpt: "# DVH Metrics Calculator & Risk Stratification App\n\nA Streamlit-based web application\
  \ designed for Radiation Oncology workflows. This tool analyzes Dose-Volume Histogram (DVH) data to\
  \ calculate standard dosimetric metrics and stratify patients based on Osteoradionecrosis (ORN) risk\
  \ criteria.\n\n## \U0001F4CB Features\n\n* **Automated Metric Calculation:** Instantly computes key\
  \ DVH metrics from uploaded files:\n    * **Dcc / D%**: Minimum dose received by the \"hottest\" cc\
  \ or % volume (e.g., D0.035cc, D10cc, D95%).\n    * **VGy (cc / %)**: Volume receiving at least a specific\
  \ dose (e.g., V50Gy, V60Gy).\n* **Risk Stratification:** Automatically flags patients as **High Risk**\
  \ or **Low Risk** for Osteoradionecrosis based on the D10cc metric.\n    * *Criterion:* High Risk if\
  \ D10cc > 59.2 Gy.\n* **Interactive Visualization:** Plots Cumulative Incidence Functions (CIF) to visualize\
  \ ORN probability over time for High vs. Low risk groups.\n* **Multi-format Support:** Handles both\
  \ `.xlsx` (Excel) and `.csv` files.\n* **Sample Data:** Includes built-in functionality to download\
  \ synthetic high-risk and low-risk sample datasets for testing.\n\n## \U0001F680 Installation\n\n###\
  \ 1. Clone the repository\n```bash\ngit clone [https://github.com/your-username/your-repo-name.git](https://github.com/your-username/your-repo-name.git)\n\
  cd your-repo-name\n"

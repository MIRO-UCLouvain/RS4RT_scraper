readme_excerpt: "omics 10: Whole-Body Metastasis Detection\n\n## Overview\nThis project establishes a\
  \ generalized, whole-body framework for metastasis detection using multi-modal PET/CT imaging. By utilizing\
  \ foundation models like MedSAM, the system performs comprehensive segmentation across the entire anatomy,\
  \ enabling a holistic analysis that transcends the limitations of organ-specific models. The pipeline\
  \ is designed to correlate whole-body imaging features with genetic mutations, providing a scalable\
  \ and integrated diagnostic tool for oncology.\n\n## Project Goals\nBased on the project requirements,\
  \ the system focuses on achieving the following benchmarks:\n* **Segmentation Precision**: Achieving\
  \ a Dice Coefficient > 0.85 on validation sets.\n* **Metastasis Prediction**: Reaching a classification\
  \ accuracy > 0.90 and an F1 Score > 0.85.\n* **Biomarker Discovery**: Identifying at least 10 statistically\
  \ validated radiomic features linked to metastasis or genetic mutations.\n\n## Tech Stack\n* **Programming**:\
  \ Python.\n* **Core Libraries**: NumPy, Pandas, PyRadiomics, and PyTorch.\n* **Segmentation Frameworks**:\
  \ \n  - **nnU-Net v2**: Our primary framework for robust, self-configuring medical image segmentation.\n\
  \  - **MedSAM**: Utilizing foundation models for generalized whole-body analysis.\n* **Infrastructure**:\
  \ Containerized microservices using Docker and Kubernetes.\n* **Database**: MongoDB for metadata and\
  \ feature storage.\n\n## Project Team\n* **Students**: Asaf Zini & Omer Bar-Eli.\n* **Supervisor**:\
  \ Prof. Ilan Tsarfaty, Tel Aviv University.# Radiomics 10: Whole-Body Metastasis Detection\n\n\n\n\n"

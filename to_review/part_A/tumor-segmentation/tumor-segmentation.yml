  # NeuroAI — Brain Tumour MRI Analysis System


  An end-to-end automated brain tumour analysis pipeline built with Streamlit, PyTorch, and MONAI.


  ## Features

  - Automatic 3D brain tumour segmentation using DynUNet (trained on BraTS 2020)

  - Radiomic feature extraction (20+ clinical metrics)

  - AI grade prediction HGG vs LGG using XGBoost with SHAP explainability

  - Tumour habitat analysis using K-Means clustering across 4 MRI modalities

  - Multi-visit patient monitoring with RANO criteria and progression risk score

  - Longitudinal timestamp comparison with 3D mesh visualisation


  ## Model Performance (BraTS 2020)

  | Region | Dice Score |

  |--------|-----------|

  | Whole Tumour (WT) | 91.14% |

  | Tumour Core (TC) | 89.38% |

  | Enhancing Tumour (ET) | 83.06% |


  ## How to Use

  1. Register a patient (Patient ID + Visit Date)

  2. Upload MRI files (FLAIR, T1, T1CE, T2 in .nii or .nii.gz format)

  3. Run automatic segmentation

  4. Extract features and generate clinical report

  5. Use Follow-Up Monitor to track patient progress over time


  ## Technology Stack

  Python 3.12, Streamlit 1.35, PyTorch 2.3, MONAI 1.3, XGBoost 2.0, nibabel, SQLite



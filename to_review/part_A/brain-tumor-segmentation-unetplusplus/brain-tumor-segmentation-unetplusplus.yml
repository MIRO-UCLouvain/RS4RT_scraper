readme_excerpt: "# \U0001F9E0 NeuroScan AI – Brain Tumor Segmentation using U-Net++\n\n<div align=\"center\"\
  >\n\n# \U0001F9E0 NeuroScan AI\n\n### Brain Tumor Segmentation using U-Net++ with ResNet34\n\nAn AI-powered\
  \ web application for automatic brain tumor segmentation from MRI images using Deep Learning.\n\n[![Live\
  \ Demo](https://img.shields.io/badge/\U0001F680%20Live%20Demo-Streamlit-success?style=for-the-badge)](https://brain-tumor-segmentation-unetplusplus.streamlit.app)\n\
  [![GitHub](https://img.shields.io/badge/GitHub-Repository-black?style=for-the-badge&logo=github)](https://github.com/tejasdn04/Brain-Tumor-Segmentation-UNetPlusPlus)\n\
  \n<br>\n\n![Python](https://img.shields.io/badge/Python-3.11-blue?logo=python)\n![PyTorch](https://img.shields.io/badge/PyTorch-Deep%20Learning-red?logo=pytorch)\n\
  ![Streamlit](https://img.shields.io/badge/Streamlit-Web%20Application-FF4B4B?logo=streamlit)\n![OpenCV](https://img.shields.io/badge/OpenCV-Computer%20Vision-green?logo=opencv)\n\
  ![Deep Learning](https://img.shields.io/badge/Deep%20Learning-U--Net++-orange)\n![Status](https://img.shields.io/badge/Status-Completed-success)\n\
  \n</div>\n\n---\n\n# \U0001F310 Live Demo\n\n\U0001F680 **Try the deployed application here:**\n\n###\
  \ https://brain-tumor-segmentation-unetplusplus.streamlit.app\n\nThe application allows you to:\n\n\
  - Upload MRI images\n- Perform automatic brain tumor segmentation\n- View segmentation masks and tumor\
  \ overlays\n- Analyze tumor statistics\n- Download prediction results\n\n---\n\n# \U0001F4D6 Overview\n\
  \nBrain tumors are among the most serious neurological disorders, where early and accurate diagnosis\
  \ plays a crucial role in treatment planning. Manual segmentation of tumors from MRI images is a time-consuming\
  \ task that requires expert radiologists.\n\n**NeuroScan AI** is an AI-powered web application that\
  \ performs automatic brain tumor segmentation using **U-Net++ with a ResNet34 encoder**. The application\
  \ provides a complete deep learning pipeline, including image preprocessing, segmentation, post-processing,\
  \ visualization, and report generation through a simple and intuitive Streamlit interface.\n\nThis project\
  \ demonstrates the application of **Deep Learning**, **Computer Vision**, and **Medical Image Analysis**\
  \ in building an intelligent healthcare solution.\n\n---\n\n# ✨ Features\n\n- \U0001F9E0 Automatic Brain\
  \ Tumor Segmentation\n- \U0001F4E4 MRI Image Upload\n- \U0001F5BC Binary Segmentation Mask\n- \U0001F3A8\
  \ Tumor Overlay Visualization\n- \U0001F308 Probability Heatmap\n- \U0001F4CA Tumor Statistics\n- \U0001F4C4\
  \ AI Report Generation\n- \U0001F4E5 Download Results\n- ⚡ CPU/GPU Support\n- \U0001F310 Streamlit Web\
  \ Interface\n- \U0001F6E1 Image Validation\n- \U0001F50D Morphological Post-processing\n- \U0001F4C8\
  \ Largest Connected Component Extraction\n\n---\n\n# \U0001F3D7 System Architecture\n\n```\n       \
  \          MRI Brain Image\n                        │\n                        ▼\n                Image\
  \ Validation\n                        │\n                        ▼\n                 Image Preprocessing\n\
  \                        │\n                        ▼\n           Resize → Normalize → Tensor\n    \
  \                    │\n                        ▼\n          U-Net++ (ResNet34 Encoder)\n          \
  \              │\n                        ▼\n              Probability Map\n                       \
  \ │\n                        ▼\n              Sigmoid Thresholding\n                        │\n    \
  \                    ▼\n        Morphological Post-processing\n                        │\n         \
  \               ▼\n Largest Connected Component Extraction\n                        │\n         ┌──────────────┴───────────────┐\n\
  \         ▼                              ▼\n Segmentation Mask              Probability Heatmap\n  \
  \       │                              │\n         └──────────────┬───────────────┘\n              \
  \          ▼\n                 Tumor Overlay\n                        │\n                        ▼\n\
  \              Tumor Statistics\n                        │\n                        ▼\n            \
  \ AI Report Generation\n                        │\n                        ▼\n              Download\
  \ Results\n```\n\n---\n\n# \U0001F504 Application Workflow\n\n1. Upload MRI Image\n2. Validate Image\n\
  3. Resize and Normalize\n4. Model Inference using U-Net++\n5. Generate Probability Map\n6. Apply Thresholding\n\
  7. Perform Morphological Cleaning\n8. Extract Largest Connected Component\n9. Generate Binary Mask\n\
  10. Create Tumor Overlay\n11. Compute Tumor Statistics\n12. Generate AI Report\n13. Download Results\n\
  \n---\n\n# \U0001F9E0 Model Details\n\n| Parameter | Value |\n|-----------|-------|\n| Model | U-Net++\
  \ |\n| Encoder | ResNet34 |\n| Framework | PyTorch |\n| Dataset | BraTS 2020 |\n| Input Size | 128 ×\
  \ 128 |\n| Output | Binary Segmentation Mask |\n| Activation | Sigmoid |\n| Threshold | 0.5 |\n| Number\
  \ of Classes | 1 |\n\n---\n\n# \U0001F4C2 Project Structure\n\n```text\nBrain-Tumor-Segmentation-UNetPlusPlus/\n\
  │\n├── app.py\n├── model.py\n├── utils.py\n├── config.py\n├── requirements.txt\n├── README.md\n├── best_model.pth\n\
  │\n├── .streamlit/\n│   └── config.toml\n│\n└── screenshots/\n    ├── home.png\n    ├── upload.png\n\
  \    ├── mask.png\n    ├── overlay.png\n    └── heatmap.png\n```\n\n---\n\n# \U0001F4BB Technologies\
  \ Used\n\n| Category | Technology |\n|----------|------------|\n| Programming Language | Python |\n\
  | Deep Learning Framework | PyTorch |\n| Segmentation Model | U-Net++ |\n| Encoder | ResNet34 |\n| Web\
  \ Framework | Streamlit |\n| Computer Vision | OpenCV |\n| Image Processing | Pillow |\n| Numerical\
  \ Computing | NumPy |\n| Visualization | Matplotlib |\n| Model Library | segmentation_models_pytorch\
  \ |\n| Version Control | Git & GitHub |\n\n---\n\n# \U0001F680 Installation\n\n## Clone the Repository\n\
  \n```bash\ngit clone https://github.com/tejasdn04/Brain-Tumor-Segmentation-UNetPlusPlus.git\n\ncd Brain-Tumor-Segmentation-UNetPlusPlus\n\
  ```\n\n## Create a Virtual Environment\n\n### Windows\n\n```bash\npython -m venv .venv\n\n.venv\\Scripts\\\
  activate\n```\n\n### Linux/macOS\n\n```bash\npython3 -m venv .venv\n\nsource .venv/bin/activate\n```\n\
  \n## Install Dependencies\n\n```bash\npip install -r requirements.txt\n```\n\n## Add Trained Model\n\
  \nPlace the trained model file:\n\n```\nbest_model.pth\n```\n\nin the project root directory.\n\n##\
  \ Run the Application\n\n```bash\nstreamlit run app.py\n```\n\n---\n\n# \U0001F4F8 Screenshots\n\n##\
  \ \U0001F3E0 Home Page\n\n![Home](screenshots/home.png)\n\n---\n\n## \U0001F4E4 Upload MRI Image\n\n\
  ![Upload](screenshots/upload.png)\n\n---\n\n## \U0001F3AF Segmentation Mask\n\n![Mask](screenshots/mask.png)\n\
  \n---\n\n## \U0001F3A8 Tumor Overlay\n\n![Overlay](screenshots/overlay.png)\n\n---\n\n## \U0001F308\
  \ Probability Heatmap\n\n![Heatmap](screenshots/heatmap.png)\n\n---\n\n# \U0001F4CA Outputs\n\nThe application\
  \ generates:\n\n- Binary Segmentation Mask\n- Tumor Overlay Image\n- Probability Heatmap\n- Tumor Statistics\n\
  - AI-generated Report\n- Downloadable Results\n\n---\n\n# \U0001F30D Deployment\n\nThe application is\
  \ deployed using **Streamlit Community Cloud**.\n\n### Live Website\n\nhttps://brain-tumor-segmentation-unetplusplus.streamlit.app\n\
  \n---\n\n# \U0001F468‍\U0001F4BB Author\n\n**Tejas Nehete**\n\n**B.Tech Computer Science & Engineering**\n\
  \n**VIT Bhopal University**\n\n- **GitHub:** https://github.com/tejasdn04\n- **Live Demo:** https://brain-tumor-segmentation-unetplusplus.streamlit.app\n\
  \n---\n"

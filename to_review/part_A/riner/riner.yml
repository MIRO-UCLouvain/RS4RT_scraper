readme_excerpt: "# Riner\n\nThis repository provides the official implementation of our AAAI 2026 paper,\
  \ *\"Unsupervised Multi-Parameter Inverse Solving for Reducing Ring Artifacts in 3D X-Ray CBCT\"* [[arXiv](https://arxiv.org/abs/2412.05853)]\n\
  \n\n![image](gif/fig_method.png)  \n*Fig. 1: Overview of the proposed Riner model.*\n\n## 1. Visualization\n\
  \n![image](gif/deeplesion.gif)  \n*Fig. 2: Qualitative results of traditional FBP, SOTA-supervised Restormer,\
  \ and our unsupervised Riner on 10 representative samples from the simulated DeepLesion dataset under\
  \ 2D fan-beam geometry.*\n\n![image](gif/foot.gif)  \n*Fig. 3: Qualitative results of traditional FDK,\
  \ model-based Super, SOTA-supervised Restormer, and our unsupervised Riner on a **real-world Chicken\
  \ foot** sample with dimensions of 512x512x80 and an ultra-high resolution of 60x60x60 μm³, acquired\
  \ by a commercial Bruker SKYSCAN 1276 micro-CT scanner under 3D cone-beam geometry.*\n\n## 2. File Description\n\
  ```bash\nRiner\n│  config.json                      # Configuration file for Riner\n│  dataset.py  \
  \                     # Dataloader\n│  data_evaluation.ipynb            # Script for data evaluation\n\
  │  data_preprocessing.ipynb         # Script for data simulation\n│  main.py                       \
  \   # Script for optimizing Riner\n│  model.py                         # Estimator for X-ray detector\
  \ responses\n│  readme.md                        # README file\n│  train.py                        \
  \ # Training script for Riner\n│  utils.py                         # Tool functions\n│  \n├─data\n│\
  \      c_m.txt                      # Ground truth responses (i.e., \\boldsymbol{\\alpha})\n│      def_mask.nii\
  \                 # Defective mask $\\mathbf{m}$\n│      gt.nii                       # Ground truth\
  \ CT images\n│      mask.nii                     # Mask for removing background\n│      proj_noise.nii\
  \               # Raw measurements \\rho\n│      img_noise.nii                # FBP reconstructions\n\
  │      Restormer.nii                # Restormer reconstructions\n│      \n├─gif                    \
  \           # Visualizations\n│      deeplesion.gif\n│      fig_method.png\n│      foot.gif\n│     \
  \ \n└─out                               \n        c_m_pre.txt                 # X-ray detector responses\
  \ by Riner\n        Riner.nii                   # CT images reconstructed by Riner\n```\n\n## 3. Running\
  \ Environment\nTo run this repository, the following major packages are required:\n+ PyTorch\n+ tinycudann\n\
  + torchkbnufft\n+ SimpleITK\n+ tqdm\n+ numpy\n+ other dependencies\n\n## 4. Optimization\nNavigate to\
  \ `./` and run the following command in your terminal:\n```bash\npython main.py\n```\nThis optimizes\
  \ Riner for the 10 representative samples (`./data/proj_noise.nii`) from the simulated DeepLesion dataset\
  \ under 2D fan-beam geometry. The reconstructed CT images and the estimated detector response are saved\
  \ in `./out`.\n\n## 5. Data Simulation and Evaluation\nThe Jupyter notebooks `data_preprocessing.ipynb`\
  \ and `data_evaluation.ipynb` provide the data simulation for CT ring artifacts and the evaluation code.\n\
  \nFor the 10 samples (`./data/proj_noise.nii`), the quantitative results are as follows:\n\n| Method\
  \       | PSNR       | SSIM        |\n|--------------|------------|-------------|\n| FBP          |\
  \ 11.70±2.04 | 0.403±0.095 |\n| Restormer    | 36.85±1.68 | 0.951±0.012 |\n| Riner (Ours) | **39.19±1.40**\
  \ | **0.974±0.005** |\n\n## 6. Others\n\nNIFTI files (`.nii`) can be viewed using ITK-SNAP software,\
  \ available for free download at: [ITK-SNAP Download Page](http://www.itksnap.org/pmwiki/pmwiki.php?n=Downloads.SNAP4)\n\
  \n## 7. Citation\n\nIf you find our work useful in your research, please cite:\n```\n@article{wu2024unsupervised,\n\
  \  title={Unsupervised Multi-Parameter Inverse Solving for Reducing Ring Artifacts in 3D X-Ray CBCT},\n\
  \  author={Wu, Qing and Wei, Hongjiang and Yu, Jingyi and Zhang, Yuyao},\n  journal={arXiv preprint\
  \ arXiv:2412.05853},\n  year={2024}\n}\n```\n"

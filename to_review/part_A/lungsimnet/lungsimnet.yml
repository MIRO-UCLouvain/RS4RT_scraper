readme_excerpt: "# LungSimNet: AI-Augmented Synthetic CT Framework for Pulmonary Nodule Analysis\n\nPaper:\
  \ AI Augmented Synthetic CT Framework for Pulmonary Nodule Analysis and  \nUncertainty-Aware Treatment\
  \ Response Prediction in Non-Small Cell Lung Cancer  \n\nFramework: LungSimNet  \n\nJournal: International\
  \ Journal of Intelligent Engineering and Systems (IJIES)  \n\nPaper ID: 20262769  \n\nAuthors: Poornima\
  \ G, Anand L  \n\nContact: pg4316@srmist.edu.in\n\n---\n\n# Overview\n\nThis repository provides reproducibility\
  \ materials for the above paper. LungSimNet\nis an anatomy-informed synthetic CT experimentation framework\
  \ integrating\nsynthetic CT augmentation, deep learning segmentation, malignancy classification,\nand\
  \ uncertainty-aware treatment-response prediction workflows for\nnon-small cell lung cancer (NSCLC).\n\
  \nThe pipeline consists of four stages:\n\n1. Synthetic Data — LungSimNet supports anatomy-informed\
  \ synthetic thoracic\n   CT workflows and experimental volumetric lesion simulation. For this study,\n\
  \   we leveraged the publicly available SYN-LUNGS dataset (Tushar et al., 2025)\n   as one of the synthetic\
  \ training sources.\n\n2. Segmentation — nnU-Net v2 (3D full-resolution) trained on SYN-LUNGS +\n  \
  \ MSD Task06 + LIDC-IDRI supplementary cases.\n\n3. Classification — MONAI ResNet-3D trained on SYN-LUNGS\
  \ + DLCSD24.\n\n4. Treatment Response — VVUQ framework using Monte Carlo sampling and\n   Bayesian ODE-based\
  \ tumour volume prediction.\n\n---\n\n# Results\n\n| Metric | Baseline | Proposed | Improvement |\n\
  |---|---|---|---|\n| DSC (MSD Task06 CV) | 0.83 | 0.92 | +9 pp |\n| AUC Detection | 0.85 | 0.95 | +10\
  \ pp |\n| AUC Classification | 0.87 | 0.94 | +7 pp |\n| RMSE (Treatment) | 8% | 5% | −3 pp |\n\n---\n\
  \n# Datasets\n\n| Dataset | Role | Access |\n|---|---|---|\n| SYN-LUNGS | Synthetic training data |\
  \ https://cvit.duke.edu/resources/ (request) |\n| LUNA16 | External detection test | https://luna16.grand-challenge.org/\
  \ |\n| MSD Task06 | Segmentation CV evaluation | http://medicaldecathlon.com/ |\n| DLCSD24 | External\
  \ classification test | https://zenodo.org/records/13799069 |\n| LIDC-IDRI | Supplementary training\
  \ | https://cancerimagingarchive.net/ |\n\nSYN-LUNGS Dataset:  \n1,044 simulated CT volumes from 174\
  \ digital twins, including\n512 embedded nodules and 532 nodule-free volumes.\n\nTo request access,\
  \ contact the SYN-LUNGS authors at:\ntushar.ece@duke.edu\n\nor visit:\n\nhttps://cvit.duke.edu/resources/\n\
  \n---\n\n# LungSimNet Components\n\n| Component | Description |\n|---|---|\n| Thoracic Phantom Generator\
  \ | Generates volumetric thoracic anatomy representations |\n| Lesion Generator | Generates anatomy-constrained\
  \ pulmonary nodules |\n| CT Simulation Pipeline | Produces CT-like reconstructed volumetric samples\
  \ |\n| Segmentation Pipeline | 3D volumetric lesion segmentation workflows |\n| Classification Pipeline\
  \ | Benign/malignant volumetric classification |\n| Dataset Exporter | Metadata, previews, masks, and\
  \ volumetric artifact generation |\n\n---\n\n# Tools and Licenses\n\n| Tool | License | Link |\n|---|---|---|\n\
  | nnU-Net v2 | Apache 2.0 | https://github.com/MIC-DKFZ/nnUNet |\n| MONAI | Apache 2.0 | https://monai.io\
  \ |\n| PiNS | CC BY-NC 4.0 | https://huggingface.co/ft42/PiNS |\n| DukeSeg | Apache 2.0 | https://gitlab.oit.duke.edu/cvit-public/dukeseg_public\
  \ |\n| SYN-LUNGS | MIT | https://github.com/fitushar/SYN-LUNGS |\n\nThe SYN-LUNGS dataset referenced\
  \ in this work was generated by\nTushar et al. using their own simulation and reconstruction pipeline.\n\
  \nLungSimNet does not bundle or redistribute XCAT3, X-Lesions,\nor DukeSim assets. Users requiring those\
  \ tools should obtain\nlicenses and permissions directly from the respective developers.\n\n---\n\n\
  # Repository Contents\n\n| File | Description |\n|---|---|\n| README.md | This file |\n| parameters.txt\
  \ | Full configuration parameters for all stages |\n| seeds.txt | Random seeds for reproducibility |\n\
  | splits.csv | Dataset train/validation/test split assignments |\n| requirements.txt | Software environment\
  \ and dependencies |\n| overlap_exclusion.txt | Patient-level LUNA16/LIDC-IDRI leakage control |\n|\
  \ train_nnunet_baseline.py | Baseline nnU-Net training configuration |\n| train_proposed_framework.py\
  \ | Proposed framework training pipeline |\n| inference_nnunet.py | nnU-Net inference and evaluation\
  \ script |\n| vvuq_simulation.py | VVUQ Monte Carlo treatment-response simulation |\n\n---\n\n# Reproducibility\n\
  \n## Segmentation (nnU-Net)\n\nbash pip install nnunetv2  nnUNetv2_plan_and_preprocess -d 002 --verify_dataset_integrity\
  \  nnUNetv2_train 002 3d_fullres 0 --npz  nnUNetv2_predict \\ -i INPUT_DIR \\ -o OUTPUT_DIR \\ -d 002\
  \ \\ -c 3d_fullres \n\n---\n\n## Classification (MONAI)\n\nbash pip install monai  python train_proposed_framework.py\
  \ \n\n---\n\n## VVUQ Monte Carlo\n\nbash python vvuq_simulation.py \n\n---\n\n# Data Availability\n\n\
  The SYN-LUNGS synthetic dataset is available upon request from\nthe SYN-LUNGS authors (Tushar et al.,\
  \ 2025):\n\nhttps://cvit.duke.edu/resources/\n\nAll public datasets (LUNA16, MSD Task06, LIDC-IDRI)\n\
  are freely accessible at the links above.\n\nDLCSD24 is available via Zenodo (restricted access form).\n\
  \n---\n\n# Citation\n\nIf you use this work, please cite:\n\ntext Poornima G, Anand L. AI Augmented\
  \ Synthetic CT Framework for Pulmonary Nodule Analysis and Uncertainty-Aware Treatment Response Prediction\
  \ in Non-Small Cell Lung Cancer.  International Journal of Intelligent Engineering and Systems (IJIES),\
  \ 2025.  Paper ID: 20262769. \n\nIf using the SYN-LUNGS dataset as part of comparative\nor supplementary\
  \ experimentation, also cite:\n\ntext Tushar FI et al. SYN-LUNGS: Towards Simulating Lung Nodules with\
  \ Anatomy-Informed Digital Twins for AI Training.  arXiv:2502.21187, 2025. \n\n---\n\n# License\n\n\
  Code in this repository is released under the MIT License.\n\nDataset access is subject to the terms\
  \ of the\nrespective dataset providers."

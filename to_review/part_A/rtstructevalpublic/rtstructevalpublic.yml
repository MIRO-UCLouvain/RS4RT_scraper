readme_excerpt: "# RTStructEval\r\nEvaluation framework of automatic analysis of DICOM radiotherapy structures\
  \ (e.g. deep learning segmentation model-generated) compared to ground truth data.\r\n\r\nIn MainEval.py\
  \ the data sets are defined together with the data and output paths. \r\nSpecifically, the following\
  \ parameters should be set:\r\nevalAnatomy - Anatomy region\r\nevalStudyCohort - Name of dataset\r\n\
  \r\nEach data set should be evaluated one by one. \r\nThe framework works by first extracting each RT\
  \ structure from the data into Nifti files. \r\nThis extraction is done for both datasets.\r\nNifti\
  \ files are then loaded into numpy arrays and quantitatively evaluated using the software package Surface\
  \ Distance https://github.com/deepmind/surface-distance.\r\nThe output geometrical metrics are saved\
  \ in patient specific CSV files. \r\nThe data can be plotted, and the settings of the plots can be changed\
  \ in PlotData.py.\r\nAll steps can be controlled by the section in the MainEval.py, meaning that isolated\
  \ steps can be run by changing status of the following tasks:  \r\noptListDataExport, optStructDataExport,\
  \ optResultExport, optAnalysisExport, optBoxplotAdapted, optPlotData, optExtreme\r\n\r\nThe organs at\
  \ risk segmentations to be analyzed should be listed in csv files, like e.g. BrainAnalyseStructs_A1.csv.\r\
  \nIf the names of the segmentations are not identical between the analyzed and ground truth data, this\
  \ could be configured in KeyNames.csv. \r\nIf the ground truth data is biased in the superior/inferior\
  \ extent due to the location of the target, by listing these organs in Guidelines_diff.csv only overlapping\
  \ slices would be taken into consideration.\r\nIf a fine-tuned version of a model is available, there\
  \ is a possibility to analyze both the initial and the finetuned (adapted) model. This can be set in\
  \ mainEval.py on row 80 and on all following tasks. \r\n\r\nPackage Surface distance version 2.0 needs\
  \ to be downloaded prior to usage of this framework.\r\n\r\nImaging and delineation data needs to be\
  \ i DICOM-format and store in one folder per model evaluation. Folder structure for CT: DATASET -- Patient\
  \ -- CT -- DCM CT-file. Folder structure for STRUCT: DATASET -- Patient -- STRUCT -- MODEL/GROUND TRUTH\
  \ -- DCM STRUCT-file. \r\n\r\nContact: jenny.gorgisyan@skane.se"

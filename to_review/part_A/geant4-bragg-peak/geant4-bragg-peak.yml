readme_excerpt: "# Geant4 Simulation: Bragg Peak vs. Gamma Attenuation\n\nThis project is a Geant4 simulation\
  \ designed to analyze and compare the energy deposition profiles of charged particles (Protons) and\
  \ neutral particles (Gamma Rays) in a water phantom.\n\nMain Objective: To demonstrate the physical\
  \ basis of particle therapy by simulating the Bragg Peak characteristic of protons (which spares healthy\
  \ tissue) versus the exponential attenuation of Gamma rays used in conventional radiotherapy.\n\nProject\
  \ Structure (Branches)\n\nThis repository contains two different experimental setups located in separate\
  \ branches. You can switch between them to observe different physical phenomena:\n\n| Branch Name |\
  \ Particle Type | Energy | Physical Outcome |\n| :--- | :--- | :--- | :--- |\n| `main` | Proton ($p^+$)\
  \ | 150 MeV | Bragg Peak: Energy is deposited primarily at a specific depth (~16 cm). |\n| `gama-deneyi`\
  \ | Gamma ($\\gamma$) | 2 MeV | Exponential Decay: Energy decreases continuously with depth (Beer-Lambert\
  \ Law). |\n\n Technical Specifications\n* Geometry: $20 \\times 20 \\times 30$ cm Water Phantom.\n*\
  \ Physics List: `QGSP_BIC_EMY` (Optimized for medical physics and electromagnetic interactions).\n*\
  \ Precision: Implemented `G4StepLimiterPhysics` with a **0.5 mm** step limit for high-resolution Bragg\
  \ Peak visualization.\n* Output: ROOT format (`BraggOutput.root`) for data analysis.\n\n# Installation\
  \ and Execution\n\n# 1. Clone and Build\n```bash\ngit clone [https://github.com/eminozcann/geant4-bragg-peak.git](https://github.com/eminozcann/geant4-bragg-peak.git)\n\
  cd geant4-bragg-peak\nmkdir build && cd build\ncmake ..\nmake -j4\n\n./BraggSim\n# In the GUI session:\n\
  /run/beamOn 1000\n\ngit checkout gama-deneyi\nmake -j4  # Re-compilation is required after switching\
  \ branches\n./BraggSim\n# High statistics recommended for Gamma:\n/run/beamOn 100000\n"

readme_excerpt: "# \U0001F9E0 Brain Tumor Segmentation using U-Net (ResNet34 + scSE Attention)\n\n## \U0001F4CC\
  \ Overview\nThis project implements a deep learning pipeline for brain tumor segmentation from CT images\
  \ using an enhanced U-Net architecture. The model improves a baseline segmentation approach by integrating\
  \ a pretrained ResNet34 encoder, attention mechanisms, hybrid loss functions, and advanced training\
  \ strategies.\n\nThe final model achieved a Dice Score of 0.5669, showing strong performance given the\
  \ challenges of small tumor regions and noisy CT data.\n\n---\n\n## \U0001F3AF Objectives\n- Build an\
  \ end-to-end segmentation model for brain tumor detection  \n- Improve feature extraction using pretrained\
  \ encoders  \n- Enhance segmentation accuracy using attention mechanisms  \n- Handle class imbalance\
  \ effectively  \n- Evaluate performance using Dice score  \n\n---\n\n## \U0001F9E0 Model Architecture\n\
  - Base Model: U-Net for image segmentation  \n- Encoder: ResNet34 pretrained on ImageNet  \n- Decoder:\
  \ Enhanced with scSE (spatial and channel squeeze-and-excitation) attention  \n- Output: Single-channel\
  \ probability mask using sigmoid activation  \n\n---\n\n## ⚙️ Key Features\n- Balanced sampling to address\
  \ class imbalance  \n- Data augmentation (flip, rotation, brightness/contrast)  \n- Hybrid loss function\
  \ (Focal BCE + Weighted BCE + Dice Loss)  \n- AdamW optimizer with learning rate scheduling  \n- Early\
  \ stopping to prevent overfitting  \n- CRF-based post-processing for refined segmentation  \n\n---\n\
  \n## \U0001F4CA Dataset\n- ADDA Brain CT dataset  \n- 2D grayscale CT images (converted to 3-channel)\
  \  \n- Binary tumor masks  \n- Dataset is highly imbalanced  \n\nNote: Dataset is not included due to\
  \ size constraints.\n\n---\n\n## \U0001F4C8 Results\n- Best Dice Score: 0.5669  \n\n### Observations\n\
  - Smooth training convergence  \n- Improved tumor localization with attention  \n- Better boundary detection\
  \  \n- Reduced false positives  \n\n---\n\n## \U0001F9EA Inference Pipeline\n- Model prediction  \n\
  - Thresholding  \n- CRF-based refinement  \n\n---\n\n## ▶️ How to Run\n\n### Install dependencies\n\
  ``` bash \npip install -r requirements.txt\n```\n\n### Train the model\n``` bash\npython main.py\n```\n\
  \n### Run inference\n``` bash\npython inference.py\n```\n\n---\n\n## \U0001F6E0️ Tech Stack\n- Python\
  \  \n- PyTorch  \n- Albumentations  \n- OpenCV  \n- NumPy  \n\n---\n\n## \U0001F680 Key Contributions\n\
  - Implemented U-Net with ResNet34 encoder  \n- Integrated scSE attention for improved segmentation \
  \ \n- Designed hybrid loss function for better learning  \n- Built a complete pipeline from preprocessing\
  \ to inference  \n\n---\n\n## Project Report\nDetailed explanation is included in the repository.\n\n\
  ---\n\n\n## Academic Use & References\nThis project was developed as part of a **graduate-level academic\
  \ coursework** in image processing and deep learning.\n\nThe implementation is inspired by:\n- Standard\
  \ U-Net architecture for biomedical segmentation  \n- ResNet-based encoder designs  \n- Attention mechanisms\
  \ such as scSE blocks  \n- Various research papers and publicly available online resources  \n\nThis\
  \ work is intended for **educational and research purposes only**.\n\n---\n\n## License\nThis project\
  \ is for academic use only.  \nIt may reference publicly available research ideas and learning resources.\n\
  \nYou are free to:\n- Use it for learning and research  \n- Modify for academic purposes  \n\n"

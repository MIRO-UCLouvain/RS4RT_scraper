readme_excerpt: "<h1 align=\"center\">\n  cbct-sim\n</h1>\n\n<p align=\"center\">\n  <img src=\"https://img.shields.io/badge/FastAPI-0.115.12-009688?style=flat&logo=fastapi&logoColor=white\"\
  \ alt=\"FastAPI\"/>\n  <img src=\"https://img.shields.io/badge/Angular-19.2.4-f12286?style=flat&logo=angular\"\
  \ alt=\"Angular\"/>\n  <img src=\"https://img.shields.io/badge/License-GPL--3.0-blue?style=flat\" alt=\"\
  License\"/>\n</p>\n\n<p align=\"center\">\n    <img src=\"./media/cube_rotate.gif\" alt=\"Sinogram of\
  \ a cube from a CBCT\" height=\"250px\"/>\n</p>\n\n<p align=\"center\">\n  An open-source application\
  \ that simulates the imaging workflow of cone-beam computed tomography (CBCT). It uses FastAPI for the\
  \ backend to interface with GATE 10 and LEAP and also Angular for the frontend.\n</p>\n\n## Features\n\
  \n### Manage your GATE simulations\n\n![Screenshot of 3 list items representing simulation names with\
  \ buttons](./media/screenshot_1.png)\n\n### View your existing GATE simulations\n\n![Screenshot of a\
  \ source emitting rays in a cone shape towards a cube and a flat-panel detector](./media/screenshot_3.png)\n\
  \n### Generate projections and reconstruct them\n\n|                              Sinogram of a cube\
  \ from a CBCT                               |                              Reconstructed middle slice\
  \ of a cube from a CBCT                               |\n| :---------------------------------------------------------------------------------------:\
  \ | :---------------------------------------------------------------------------------------------------------:\
  \ |\n| <img src=\"./media/screenshot_4.png\" alt=\"Sinogram of a cube from a CBCT\" height=\"500px\"\
  /> | <img src=\"./media/screenshot_5.png\" alt=\"Reconstructed middle slice of a cube from a CBCT\"\
  \ height=\"500px\"/> |\n\n## Setup\n\nFor setup check out the [GitHub Wiki](https://github.com/optui/ProjeCT/wiki).\n"

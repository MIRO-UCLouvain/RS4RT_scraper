readme_excerpt: "# 3D Brain Tumor Segmentation (HelioGLI)\n\n## Project Overview\nThis solution implements\
  \ an automated 3D semantic segmentation pipeline for brain tumors using the **MONAI** framework and\
  \ **PyTorch**. The core architecture is **SegResNet**, a 3D ResNet-based encoder-decoder network optimized\
  \ for medical image segmentation.\n\n## Visualizations\n\n### 1. Multi-Planar Orthogonal View\nWe visualize\
  \ the tumor from three standard medical perspectives (Axial, Coronal, Sagittal) to confirm 3D spatial\
  \ consistency. The **AI Prediction (Red)** aligns precisely with the **Ground Truth (Green)** across\
  \ all planes.\n\n### 2. 3D Volumetric Segmentation\nThe following animation demonstrates the model's\
  \ performance across the 3D volume (Slices 50–110). The sliding window inference strategy ensures consistent\
  \ boundary predictions.\n\n## Model Architecture\n* **Architecture:** SegResNet (Spatial Dimensions:\
  \ 3)\n* **Input Channels:** 4 (T1n, T1c, T2w, T2f)\n* **Output Channels:** 3 (Tumor Classes)\n* **Preprocessing:**\
  \ Orientation normalization (RAS), isotropic respacing (1mm), and Z-score intensity normalization.\n\
  * **Inference Strategy:** Sliding Window Inference (Window size: $128 \\times 128 \\times 128$) with\
  \ 50% overlap.\n\n##  Training Configuration\n\nThe model was trained on the **HelioGLI** dataset using\
  \ a 3D SegResNet architecture. Below are the specific hyperparameters and settings used during the training\
  \ phase.\n\n| Parameter | Value | Description |\n| :--- | :--- | :--- |\n| **Architecture** | 3D SegResNet\
  \ | ResNet-based encoder-decoder with variational autoencoder regularization. |\n| **Input Shape** |\
  \ `(4, 160, 192, 128)` | 4 MRI Modalities (T1n, T1c, T2w, T2f) cropped to 3D patches. |\n| **Loss Function**\
  \ | Dice Loss | Optimized for volumetric segmentation overlap (handles class imbalance). |\n| **Optimizer**\
  \ | Adam | Adaptive Moment Estimation with weight decay `1e-5`. |\n| **Learning Rate** | `1e-4` | Initial\
  \ learning rate with Cosine Annealing scheduler. |\n| **Batch Size** | 1 | Optimized for single GPU\
  \ training with large 3D volumes. |\n| **Epochs** | 160 | \n| **Framework** | MONAI / PyTorch | Medical\
  \ Open Network for AI. |\n\n## Installation\nEnsure you have Python installed, then install the dependencies:\n\
  \n```bash\npip install -r requirements.txt\n"

readme_excerpt: 'This study describes a deep learning pipeline for automated multi-class brain tumor segmentation
  using the BraTS 2020 dataset, which contains multi-modal MRI scans from patients with histologically
  confirmed gliomas. A 2D U-Net with a three-level encoder-decoder architecture and skip connections was
  trained on axial MRI slices to simultaneously segment three clinically relevant sub-regions: Whole Tumor
  (WT), Tumor Core (TC), and Enhancing Tumor (ET). To address class imbalance, a composite focal-dice
  loss function with per-class weighting was designed, assigning higher penalties to rarer sub-regions.
  A structured ablation study evaluated six modality configurations, including single-modality (T1, T1ce,
  T2) and multi-modality combinations (T1ce+FLAIR, T2+FLAIR, and all four modalities), systematically
  quantifying the contribution of each MRI sequence to segmentation performance. The complete four-modality
  model achieved the highest mean Dice coefficient of 0.5964, with sub-region scores of 0.8097 (WT), 0.6100
  (TC), and 0.5924 (ET). Among single modalities, T1ce demonstrated the greatest discriminative power,
  particularly for Enhancing Tumor detection, whereas T2 and FLAIR were most effective for Whole Tumor
  delineation. The T1ce+FLAIR combination achieved a mean Dice of 0.5793, only slightly lower than the
  full model, indicating its practicality when acquiring all four modalities is not possible. These results
  offer evidence-based recommendations for model development and MRI protocol selection in brain tumor
  segmentation.

  '

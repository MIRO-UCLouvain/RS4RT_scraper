readme_excerpt: '# Local-Recurrence-Prediction-Code

  Local recurrence prediction model for NSCLC patients treated with SBRT

  ANN-based local recurrence prediction model for NSCLC patients treated with SBRT The Jupyter Notebook
  code titled "ANN-based-LR-Prediction.ipynb" implements a methodology for both cross-validation and external
  validation of an artificial neural network (ANN)-based model designed to predict local recurrence in
  early-stage non-small cell lung cancer (NSCLC) patients treated with stereotactic body radiotherapy
  (SBRT). The model integrates clinical and dosiomic numerical features as predictive inputs. The code
  encompasses the full pipeline of model development, including training, validation, and performance
  evaluation. The pipeline of the proposed model is given in "LR-Prediction-Model_summary.json"


  Feature analysis code is titled as "Feature ranking.ipynb".

  Tunned weight parameters of the designed ANN-based model are given in "Trained-Model-LR-Prediction.keras"
  & "Trained-Model-LR-Prediction.h5".


  '

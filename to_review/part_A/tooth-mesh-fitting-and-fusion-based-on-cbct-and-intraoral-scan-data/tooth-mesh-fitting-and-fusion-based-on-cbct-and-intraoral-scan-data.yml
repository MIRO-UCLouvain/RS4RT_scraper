readme_excerpt: "# IOS牙冠和CBCT Mesh配准项目\n\n本项目旨在实现IOS牙冠和CBCT mesh的配准,以结合IOS和精细扫描和CBCT的全牙扫描\n\n## 环境要求\n\
  \n### Python版本\n- Python 3.8.19\n\n### 依赖库\n- open3d 0.11.2\n- trimesh 4.4.1\n- pymeshlab 2022.2.post3\n\
  - sklearn 1.3.0\n\n## 文件说明\n\n### 1. \"raw_data\" 文件夹\n- 包含未经处理的原始数据。\n\n### 2. \"data_with_center_overlaped\"\
  \ 文件夹\n- 存放预处理后使IOS和CBCT图像质心重合的结果。\n  - **cbct_mesh**: 移动后使CBCT和原IOS质心重合的CBCT mesh。\n  - **IOS_mesh**:\
  \ 原始IOS，未做任何变动。\n  - **IOS_cut_edge**: 切去一圈细小而外翘边缘后的IOS，这是本项目的创新点。使用此处理后的IOS进行ICP等步骤，最终的全牙表面更符合真实牙齿的生理结构。\n\
  \n### 3. \"icp_output\" 文件夹\n- 存放ICP精细配准后的结果。\n  - **aligned**: 使用Meshlab软件进行粗配准得到的变换矩阵，右键点击可以使用记事本打开。本矩阵将作为ICP运算的初始化矩阵。\n\
  \  - **cbct_mesh**: 使用ICP变换后，牙冠与IOS牙冠基本重合的全牙mesh。\n  - **IOS_mesh**: 原始IOS，未做任何变动。\n\n### 4. \"remove_CBCT_crown_output\"\
  \ 文件夹\n- 存放移除原CBCT牙冠的结果。\n  - **cbct_no_crown**: 仅保留CBCT牙根的结果。\n  - **full**: 保留CBCT牙根和IOS牙冠的结果，但两者之间仍有较大距离。\n\
  \n### 5. \"final_output\" 文件夹\n- 存放最终结果。\n  - **use raw IOS** 文件夹下：\n    - **final_without_smooth**:\
  \ 未进行Laplace平滑的结果，牙体表面有异常凸起。\n    - **final_with_smooth**: 进行Laplace平滑的结果。\n  - **innovate-use IOS_cut_edge**\
  \ 文件夹下：\n    - **final_without_smooth**: 未进行Laplace平滑的结果，牙体表面较为平滑。\n    - **final_with_smooth**: 进行Laplace平滑的结果。\n\
  \n## 项目创新点\n- 本项目创新性地使用切去外缘的IOS（`IOS_cut_edge`）进行牙冠与牙根的融合，从而获得较为平滑的牙体表面。"

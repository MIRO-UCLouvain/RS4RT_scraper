readme_excerpt: "# CBCTScope\n\n**A complete, local-first CBCT and 2D radiograph viewer, built by a\n\
  board-certified oral and maxillofacial radiologist. The first with native\nAI-agent control.**\n\n[![DOI:\
  \ 10.5281/zenodo.21431452](docs/media/doi-badge.svg)](https://doi.org/10.5281/zenodo.21431452)\n\n![An\
  \ AI agent driving CBCTScope over MCP on the built-in synthetic phantom: window presets, slice navigation,\
  \ multi-slice grid, curved panoramic with cross-sections](docs/media/cbctscope-demo.gif)\n\n*Above:\
  \ an agent driving the viewer in demo mode. Window preset, slice\nnavigation, the multi-slice grid,\
  \ and the mode switches are MCP verbs sent by\nthe agent; the arch proposal and pano enhancement are\
  \ the viewer's own\none-click tools. The volume is the built-in synthetic phantom, so no patient\ndata\
  \ can appear, by construction.*\n\nCBCTScope opens the CBCT exports already on your computer and reads\
  \ them in\neight purpose-built modes: MPR with 3D rendering, multi-slice grid, curved\npanoramic with\
  \ nerve tracing, TMJ, freehand reslice, virtual cephalogram,\nregion growing with airway analysis, and\
  \ two-volume stitching. It reads 2D\nradiographs (panoramic, intraoral, CR and DX) in the same instrument,\
  \ under\nthe same display settings. It is free, open source, and local-first: no\naccount, no cloud,\
  \ no upload, ever. No agent is required; CBCTScope is a\ncomplete standalone viewer.\n\nIt is also,\
  \ to our knowledge, the first CBCT viewer an AI agent can drive\nnatively: through a built-in [MCP](https://modelcontextprotocol.io)\
  \ server, an\nagent opens scans, switches reading modes, sets the window, moves through\nslices, and\
  \ takes snapshots. The agent moves the camera. The human reads.\n\n> **Research use only. Not a medical\
  \ device.** CBCTScope visualizes and\n> navigates volumes. It never produces findings, measurements-as-conclusions,\n\
  > or diagnoses, in the UI or over MCP. Do not use it for clinical\n> decision-making.\n\n## The interface\
  \ at a glance\n\n| MPR + 3D | Multi-slice grid | Curved panoramic |\n|---|---|---|\n| [![MPR: axial,\
  \ sagittal, coronal and 3D render with crosshairs, HU windowing, slab and MIP controls](docs/media/thumb-mpr.png)](docs/media/thumb-mpr.png)\
  \ | [![Grid: parallel axial slices with a sagittal scout, spacing and thickness controls](docs/media/thumb-grid.png)](docs/media/thumb-grid.png)\
  \ | [![Pano: arch spline on the axial, curved panoramic, perpendicular cross-sections](docs/media/thumb-pano.png)](docs/media/thumb-pano.png)\
  \ |\n\nClick any thumbnail for full resolution. Each reading mode has its own guide,\nwritten the way\
  \ a reader actually moves through a volume:\n[docs/reading-modes](docs/reading-modes/). The full user\
  \ manual, from\ninstallation to the keyboard reference, lives in [docs/manual](docs/manual/).\n\n##\
  \ Run it\n\nAbout five minutes, no technical background needed. CBCTScope is not an\ninstalled app with\
  \ an icon: it is a small local program you start once per\nreading session, and your browser is the\
  \ screen. Everything is undone by\ndeleting the folder.\n\n**System requirements**\n\n- **Node.js 22\
  \ or later**: the free runtime that runs the viewer, the way a\n  browser runs a web page.\n- **A current\
  \ desktop browser** with WebGL2 (Chrome, Edge, Firefox, or\n  Safari). The 3D render and all reformats\
  \ are computed on this machine, so a\n  recent computer with a working graphics driver is assumed; large\
  \ volumes\n  read more comfortably with more memory.\n- **macOS, Windows, or Linux.**\n\n1. **Install\
  \ Node.js 22 or later** from [nodejs.org](https://nodejs.org):\n   download the LTS installer, run it,\
  \ accept the defaults.\n2. **Get CBCTScope.** Click the green **Code** button at the top of this page,\n\
  \   choose **Download ZIP**, and unzip it somewhere you can find again (Desktop\n   is fine). If you\
  \ use git, `git clone` works as usual.\n3. **Start it.** In the unzipped folder, double-click **Start\n\
  \   CBCTScope.command** on macOS or **Start CBCTScope.bat** on Windows. The\n   first macOS open needs\
  \ a right-click and **Open** (the one-time warning\n   macOS shows for downloaded files). The first\
  \ start downloads the viewer's\n   components, once, a few minutes; then your browser opens the viewer\
  \ by\n   itself. A built-in **synthetic phantom** loads immediately: jaws, dental\n   arches, teeth\
  \ with enamel and pulp, a metal crown, airway, sinuses, and TMJ\n   condyles, all procedurally generated.\
  \ The full viewer works with zero\n   patient data.\n\nTo stop the viewer, close the starter's window\
  \ or press Ctrl-C in it. Next\nsession, double-click again: startup is quick once installed.\n\n**Prefer\
  \ a terminal, or on Linux?** Open a terminal in the unzipped folder,\nrun `npm install` once, then `npm\
  \ run dev`, and open http://localhost:3810.\nThe manual's [installation chapter](docs/manual/02-installation.md)\
  \ spells\nthis path out step by step.\n\n**Demo mode vs. normal mode.** `npm run demo` (any OS) starts\
  \ the same viewer\nbut never remembers a previously opened scan, so a recording or screenshot\nsession\
  \ can never accidentally surface a real case: it is a privacy\nguarantee, not a reduced feature set.\
  \ The double-click starters and\n`npm run dev` start normal mode, which restores your last opened scan.\
  \ On\nfirst launch both modes show the phantom.\n\n### If something goes wrong\n\n- **macOS refuses\
  \ to open Start CBCTScope.command** (\"unidentified\n  developer\"): right-click the file, choose **Open**,\
  \ confirm. macOS asks\n  once; afterwards a plain double-click works.\n- **`npm: command not found`**\
  \ (or `'npm' is not recognized`): Node.js is not\n  installed yet, or the terminal was opened before\
  \ the install finished.\n  Install it, then open a new terminal window and retry.\n- **The start command\
  \ warns that port 3810 is in use**: the viewer is already\n  running in another window. One is enough:\
  \ just open http://localhost:3810,\n  or stop the older one first.\n- **\"found N compressed DICOM file(s)\"\
  ** when opening a scan: the viewer reads\n  uncompressed DICOM only. Re-export from your scanner software\
  \ with\n  compression off.\n\n## Opening your own scan\n\nClick **open** in the viewer header and pick\
  \ a CBCT export: a folder of DICOM\nslices, a DICOMDIR tree, a single multiframe DICOM file, or one\
  \ slice of a\nseries (the whole series opens). Any export your scanner software produces as\n**uncompressed\
  \ DICOM** works.\n\nThe scan is read **in place** from the folder you picked. Nothing is copied,\nconverted,\
  \ or uploaded, and the full folder path never reaches the browser:\nthe header shows a short label built\
  \ from the folder and file names, so name\nyour export folders the way you want to see them.\n\nThe\
  \ file dialog is native on macOS and Windows out of the box. On Linux it\nuses the desktop's standard\
  \ dialog helper (zenity or kdialog; most\ndistributions ship one). If neither is installed, point the\
  \ running viewer at\nan export folder with one command in a second terminal (forward slashes work\n\
  in Windows paths):\n\n```sh\ncurl -X POST http://localhost:3810/api/cbct/source -H \"Content-Type: application/json\"\
  \ -d \"{\\\"path\\\":\\\"C:/scans/patient-export\\\"}\"\n```\n\n## Reading modes\n\n| Mode | What it\
  \ does |\n|---|---|\n| MPR | Orthogonal slices with crosshairs, oblique rotation, slab/MIP, measurements,\
  \ 3D render with adjustable styles, clipping, and a render eraser |\n| Grid | Many parallel slices of\
  \ a rotatable stack on one screen |\n| Pano | Draw the dental arch once, get a curved panoramic plus\
  \ cross-sections, nerve tracing, and focal-trough control |\n| TMJ | Both condyles side by side in axis-corrected\
  \ sections |\n| Reslice | A fresh slice stack along any drawn line or curve |\n| Ceph | A virtual cephalogram,\
  \ the volume projected flat like a film |\n| Region | Region growing with HU presets, volume and density\
  \ stats, airway analysis |\n| Stitch | Rigid registration and fusion of two volumes of the same subject\
  \ |\n\nPer-mode reading guides live in [docs/reading-modes/](docs/reading-modes/).\n\n### 2D radiographs\n\
  \nThe viewer also opens single 2D radiographs (DICOM modality PX, DX, CR, or IO:\npanoramic, digital\
  \ and computed radiography, intraoral), uncompressed 16-bit files, the\nsame constraint as volumes.\
  \ A radiograph gets a dedicated single-image view: window,\ngamma, invert, cursor-centered zoom, pan,\
  \ fit. Gray values are display-normalized to a\n12-bit scale at load (radiographs carry no HU calibration),\
  \ and MONOCHROME1 files are\nflipped so bright is always radiopaque. The volumetric reading modes apply\
  \ to volumes\nonly. This exists so multi-reader studies can read both image classes in one instrument\n\
  under identical display settings.\n\n### Exporting\n\nThe volume header has an **export** menu with\
  \ three client-side formats: a PNG slice\nstack (a zip of one PNG per slice at the displayed window,\
  \ plus a geometry `meta.json`),\na NIfTI volume (`.nii.gz`, HU values, for Slicer, ITK-SNAP, nibabel,\
  \ MONAI), and an STL\nsurface mesh (marching cubes at a chosen HU threshold, honoring the 3D crop box,\
  \ for\nprinting or CAD). Everything is computed in the browser and saved to this machine's\nDownloads:\
  \ nothing is uploaded, the same local-first constraint as reading.\n\n## Privacy\n\nThe safe behavior\
  \ is the only behavior the software has:\n\n- Scans are read **in place** from the folder you pick.\
  \ Nothing is copied or\n  uploaded anywhere; there is no account, no telemetry, no hosted instance,\n\
  \  and there never will be one.\n- Everything, including the AI-agent connection, stays on this machine.\
  \ In\n  technical terms: the server binds to 127.0.0.1 and rejects any request whose\n  Host or Origin\
  \ is not loopback, so neither another device on your network\n  nor a hostile web page in another tab\
  \ (DNS rebinding, cross-site POSTs) can\n  reach it.\n- No absolute file paths reach the browser or\
  \ the agent transcript. The UI\n  shows a display label derived from the last folder and file names\
  \ of what\n  you opened, plus technical geometry only.\n- The only writes are an app-data folder (`~/.cbctscope`)\
  \ holding your\n  annotation sidecars (labels, world-mm coordinates, HU statistics) and a\n  pointer\
  \ to the last source you opened, so the viewer can restore it. Never\n  pixels. Demo mode writes neither.\n\
  \n## AI-agent control (MCP)\n\nIf you use an AI assistant that speaks MCP (Claude Code, Claude Desktop,\
  \ and\nothers), it can drive the viewer for you: open a scan, switch reading modes,\nset the window,\
  \ step through slices, take snapshots to look at. It cannot do\nmore than that, by design: no tool returns\
  \ a finding or an interpretation, and\nno tool executes code, so the agent can never become the reader.\n\
  \nStart the viewer, open it in a browser, then register the MCP server with your agent host:\n\n```json\n\
  {\n  \"mcpServers\": {\n    \"cbctscope\": {\n      \"command\": \"node\",\n      \"args\": [\"/absolute/path/to/cbctscope/mcp/server.mjs\"\
  ]\n    }\n  }\n}\n```\n\nThe agent gets eight verbs, all navigation or visualization: `open_scan`, `list_volumes`,\
  \ `select_volume`, `set_view_mode`, `set_window_level`, `navigate_slice`, `snapshot`, `reset_view`.\
  \ Details and the full contract: [docs/mcp.md](docs/mcp.md).\n\nCBCTScope is one of a pair of agent-native\
  \ instruments built on the same principle (bounded verbs for the agent, commit rights for the human);\
  \ the other is [Quoin](https://github.com/rezamotaghi/quoin), a text editor for macOS where any agent\
  \ may edit the buffer and only the human holds the save button. Both at [rezamotaghi.com](https://rezamotaghi.com).\n\
  \n## Why this exists\n\nTo our knowledge, CBCTScope is the first CBCT viewer with native AI-agent control.\
  \ Neighboring projects exist and deserve credit: [dicom-mcp](https://github.com/ChristianHinge/dicom-mcp)\
  \ and the [Flux Inc. DICOM MCP server](https://github.com/fluxinc/dicom-mcp-server) query PACS metadata\
  \ over MCP, [dicom-viewer-mcp-app](https://github.com/ThalesMMS/dicom-viewer-mcp-app) prototypes MCP-driven\
  \ DICOM slice rendering, and [mcp-slicer](https://github.com/zhaoyouj/mcp-slicer) drives 3D Slicer through\
  \ raw Python execution. None of them is a purpose-built CBCT reading environment, and none constrains\
  \ the agent to a small set of clinical navigation verbs. CBCTScope does both: a dental and maxillofacial\
  \ reading workflow, plus"

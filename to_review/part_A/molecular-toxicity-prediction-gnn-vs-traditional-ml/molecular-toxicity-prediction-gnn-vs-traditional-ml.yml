readme_excerpt: "Molecular Toxicity Prediction: GNNs vs. Traditional ML\n\nAuthor: Mandana Roosta-Reza\
  \ Jafari  \nInstitution: Physics Department of Shahid Beheshti University  \n\n Project Overview\nThe\
  \ prediction of molecular toxicity is a critical challenge in pharmaceutical development. This project\
  \ compares the performance of a Graph Convolutional Network (GNN) against traditional machine learning\
  \ baselines (Random Forest and Logistic Regression) for predicting molecular mutagenicity using the\
  \ MUTAG dataset. \n\nKey Finding: Traditional feature-based methods significantly outperformed the GNN\
  \ approach (86.8% vs 65.8% accuracy), highlighting the importance of dataset size and feature engineering\
  \ in molecular property prediction.\n\nDataset (MUTAG)\nA standard benchmark for molecular classification\
  \ containing nitroaromatic compounds labeled as mutagenic or non-mutagenic.\nTotal molecules: 188 (150\
  \ Train / 38 Test)\nClasses: 2 (Mutagenic / Non-mutagenic)\nAverage molecular size: 17.9 atoms\nNode\
  \ features: 7 per atom\n\nModels Implemented\n1. Graph Convolutional Network (GNN)\n3 GCN layers (64\
  \ hidden units) with ReLU and Dropout (p=0.2)\nGlobal mean pooling & Linear classifier\nParameters:\
  \ 8,962\n\n2. Traditional ML Baselines\nExtracted 16 molecular features (e.g., number of atoms, bonds,\
  \ node feature stats).\nRandom Forest: 100 estimators\nLogistic Regression: L2 regularization\n\nResults\n\
  \n| Method | Test Accuracy | Standard Error |\n|--------|---------------|----------------|\n| Logistic\
  \ Regression | 86.8% | ±5.4% |\n| Random Forest | 84.2% | ±5.8% |\n| Graph Neural Network | 65.8% |\
  \ ±7.7% |\n| Random Baseline | 55.3% | ±8.0% |\n\nWhy did Traditional ML win?\n1. Dataset Size: Deep\
  \ learning models require thousands of examples. With only 150 training examples, the GNN overfit the\
  \ data (Train accuracy: 77.3%, Test accuracy: 65.8%).\n2. Feature Engineering: Handcrafted molecular\
  \ descriptors captured essential chemical patterns more efficiently than learning from raw graph structures\
  \ on a small scale.\n\nInstallation & Setup\nTo run this notebook locally:\nbash\nEnvironment: Python\
  \ 3.11.13\npip install torch torch-geometric scikit-learn rdkit\n\nFuture Work\nLarger Datasets: Test\
  \ the GNN on datasets with thousands of molecules.\nArchitecture Exploration: Implement Graph Attention\
  \ Networks (GAT) or Graph Transformers.\nTransfer Learning: Pre-train GNNs on large molecular datasets\
  \ before fine-tuning.# Molecular-Toxicity-Prediction-GNN-vs-Traditional-ML\n"

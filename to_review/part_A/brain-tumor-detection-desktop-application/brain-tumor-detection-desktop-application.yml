readme_excerpt: "Brain Tumor Detection, Classification, and Segmentation Desktop Application\n===========================================================================\n\
  \nOverview\n--------\nThis project is a desktop-based medical imaging application developed to assist\n\
  in the detection, classification, and segmentation of brain tumors from MRI\nimages. The application\
  \ integrates deep learning models with an interactive\nPyQt5 graphical interface, allowing users to\
  \ manage patient records, analyze\nMRI scans, visualize results, and store prediction history securely.\n\
  \nFeatures\n--------\n- Brain Tumor Detection from MRI Images\n- Brain Tumor Classification using Deep\
  \ Learning Models\n- Tumor Segmentation and Visualization\n- Patient Record Management\n- User Authentication\
  \ and Authorization\n- MRI Image Upload and Processing\n- Prediction History Storage\n- SQLite Database\
  \ Integration\n- Interactive PyQt5 Desktop Interface\n\nTechnology Stack\n----------------\n- Python\n\
  - PyQt5\n- TensorFlow / Keras\n- CNN\n- Xception\n- SQLite\n- bcrypt\n- SHA-512\n\nProject Structure\n\
  -----------------\n\nAPI/\n    Database and Model Communication Modules\n\nData/\n    Application Configuration\
  \ Files\n\nDatabase/\n    SQLite Database and Database Operations\n\nDocumentation/\n    Project Documentation\
  \ and UI References\n\nGlobals/\n    Global Variables and Configuration Management\n\nImage/\n    Application\
  \ Images, Icons, and Uploaded Images\n\nImageSegmentationModules/\n    Image Processing and Segmentation\
  \ Modules\n\nMain/\n    Main Application Entry Point and Utilities\n\nModels/\n    Deep Learning Models\
  \ and Inference Logic\n    - CNN Models\n    - Xception Models\n\nScreens/\n    PyQt5 User Interface\
  \ Screens and Dialogs\n\nTemp/\n    Temporary Testing and Utility Scripts\n\nModel Capabilities\n------------------\n\
  - Brain Tumor Detection\n- Brain Tumor Classification\n- MRI Image Segmentation\n- Patient-Specific\
  \ Prediction Analysis\n\nSecurity Features\n-----------------\n- SHA-512 Password Hashing\n- bcrypt\
  \ Authentication\n- Salted Password Storage\n- Secure User Login System\n\nApplication Workflow\n--------------------\n\
  1. User Login\n2. Patient Selection / Registration\n3. MRI Image Upload\n4. Image Preprocessing\n5.\
  \ Model Inference\n6. Tumor Detection\n7. Tumor Classification\n8. Tumor Segmentation\n9. XAI Visualization\n\
  10. Result Storage and Retrieval\n\nKey Highlights\n--------------\n- Developed a complete desktop application\
  \ for medical image analysis.\n- Integrated deep learning models with a user-friendly GUI.\n- Implemented\
  \ patient management and secure authentication systems.\n- Combined detection, classification, segmentation,\
  \ and explainability in a\n  single application.\n- Utilized SQLite for local patient and prediction\
  \ data management.\n\nAuthor\n------\nAbhijeet Rajhans\n\nLicense\n-------\nFor educational and research\
  \ purposes only."

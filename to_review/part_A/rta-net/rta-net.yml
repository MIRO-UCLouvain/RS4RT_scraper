readme_excerpt: "# Recurrent Tissue-Aware Network for Deformable Registration of Infant Brain MR Images\n\
  Code review processing. Welcome for any bug report!\n\n## Background\nInfant brain image registration\
  \ is crucial for longitudinal and population-based analysis. It can help study early brain development\
  \ during infancy, often with\ndynamic volumetric and morphometric changes. While deformable image registration\
  \ serves as an important tool to quantify these changes, the rapid brain\ndevelopment during infancy\
  \ makes the task challenging. Someone may have concern about using the intensity images directly for\
  \ infant brain MR image registration. Here,\nwe have validated the traditional registration methods\
  \ like Demons and ANTs, and deep-learning-based VoxelMorph to register intensity images directly.\n\
  <img src='./Fig/intensity.png' />\n\n\n\n  * If you use ACTA-Reg-Net, please cite:\n    \n    **Recurrent\
  \ Tissue-Aware Network for Deformable Registration of Infant Brain MR Images**   \n    Dongming Wei,\
  \ Sahar Ahmad, Yuyu Guo, Liyun Chen, Yunzhi Huang, Lei Ma, Zhengwang Wu, Gang Li, Li Wang, Weili Lin,\
  \ Pew-Thian Yap, Dinggang Shen, Qian Wang\\\n    [IEEE Transactions on Medical Imaging](https://ieeexplore.ieee.org/document/9656924)\n\
  \n    **An Auto-Context Deformable Registration Network for Infant Brain MRI**    \n    Dongming Wei,\
  \ Sahar Ahmad, Yunzhi Huang, Lei Ma, Zhengwang Wu, Gang Li, Li Wang, Qian Wang, Pew-Thian Yap, Dinggang\
  \ Shen\\  \n    [eprint arXiv:2005.09230](https://arxiv.org/abs/2005.09230)\n\n## Instruction\n<img\
  \ src='./Fig/Auto_Context.png' />\n<img src='./Fig/TAReg.png' />\n<img src='./Fig/Exemplar_Gaussian_Smoothing.png'\
  \ />\n\n\nThis code is for registering infant brain MR images. The registration is based on the segmentation\
  \ map (gray matter, white matter). You can try to modify the directory in train.py to train your model.\
  \ Or you can directly use test.py to test your data, where a trained model is given in ./models.\n\n\
  \ * For obtaining an ACTA-Reg-Net, you need to work on ./src/demo.sh to run all the experiments.\n\n\
  ## Requirements\n- Python 3.6 (3.7 should work well)\n- Tensorflow 1.10 (any 1.xx version should work\
  \ well)\n- Keras 2.2.4\n- Bash\n\nYou can choose to run\n```bash\npip install -r requirements.txt\n\
  ```\nOr you can perform\n```bash\nconda create -n tf10-py36 python=3.6\nconda activate tf10-py36\nconda\
  \ install tensorflow-gpu==1.10\n```\n## Train\n```bash\npython train.py\n```\nFor training your dataset,\
  \ you need to modify the data directory in the trian.py. For our task, we save the infant brian images\
  \ into the ../data/MAPS_DATASET/Train_Set. \nAfter this step, you have obtained your Reg-Net, which\
  \ is supposed to generate smooth deformation fields. Then, you can execute the demo.sh to perform an\
  \ 'auto-context' manner to boost the registration performance.\n\n## Test for the single TA-Net\n```bash\n\
  python test.py gpu_id ../models/ iteration_num fixed.nii.gz moving.nii.gz moving_label.nii.gz\n```\n\
  \n## Demo for RTA-Net\n```bash\ncd ./src\n./demo.sh -m moving.nii.gz -l moving_label.nii.gz -n save_dir\
  \ -f fixed.nii.gz\n```\nThe results are saved into ../data/results/*, including the warped moving image,\
  \ moving label, deformation field, and displacement uncertainty map.\n\n## Result\n<img src='./Fig/Segmentation_Intensity.png'\
  \ />\n\n## Iteration Analysis\n<img src='./Fig/Iterations.png' />\n<img src='./Fig/Displacement_Uncertainty.png'>\n\
  \n\n# Acknowledgement:\nWe would like to acknowledge the contribution of [VoxelMorph](https://github.com/voxelmorph/voxelmorph).\n\
  \n\n# Contact:\nFor any problems, please open an [issue](https://github.com/Barnonewdm/ACTA-Reg-Net/issues/new).\n\
  \n\n"

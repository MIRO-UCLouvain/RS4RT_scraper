readme_excerpt: "## Artificial Intelligence-driven Radiomic Categorization to predict Survival benefit\
  \ of Adjuvant chemotherapy method\n\n### Introduction\nThis is the code for the paper entitled \"Multimodal\
  \ data integration for explainable artificial intelligence to guide adjuvant chemotherapy in stage II\
  \ colorectal cancer\"\n\nThis code includes the custom R script and radiomics data in this study and\
  \ used to train predictive models.\n\n### Methods\nAnalysis flowchart.\n- Automated colorectum and CRC\
  \ segmentation by [\nDeepCRC\n](https://github.com/cx601/AIRCSA/blob/main/DeepCRC/MICCAI2022_Colonrectal_Cancer.pdf)\n\
  - Radiological radiomic features extraction ([\nRadiomic feature extraction\n](https://github.com/cyxie601/ESCC_ML/tree/master/Feature%20Extraction))\n\
  - The survival-by-treatment interaction test to select top significant features\n- The discovery of\
  \ treatment decision-related subtypes\n- Model evaluation\n\n### Data\nrd_features_survival.csv - extracted\
  \ radiomic data used for the discovery of treatment decision-related subtypes and survival analysis\n\
  \n### run\nAll analysis are running under R version 3.3.3\n\nImageModel.R -- To perform the survival-by-treatment\
  \ interaction test, select top significant featuresfor unsupervised clustering of radiological subtypes,\
  \ and conduct survival analysis for treatment decision-related subtypes.\n\nRadiogenomicAnalysis.R --\
  \ To explore the underlying different biological pathways and to quantify the relative abundance of\
  \ stromal and immune cell. \n\n### Requirement\n\n#### R requirements\n- ggplot2 3.4.3 \n- survival\
  \ 3.5.5\n- survminer 0.4.9\n- ggpubr 0.6.0\n- cvTools 0.3.2\n- xCell 1.1.0\n- GSEABase 1.60.0\n- GSVA\
  \ 1.46.0\n- dplyr 1.1.1\n- ComplexHeatmap 2.14.0\n- dendextend 1.17.1\n- RColorBrewer 1.1.3\n"

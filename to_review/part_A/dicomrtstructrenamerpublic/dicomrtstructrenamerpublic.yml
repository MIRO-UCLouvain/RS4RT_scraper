readme_excerpt: "# DicomRTStructRenamerPublic\nDeep learning-based method for automated renaming and standardization\
  \ of prostate DICOM radiotherapy structure annotations.\n\nThis repository contains code and documentation\
  \ used in the publication \"Deep learning-based classification and structure name standardization for\
  \ organ at risk and target delineations in prostate cancer radiotherapy\" by Jamtheim Gustafsson et\
  \ al. 2021, https://doi.org/10.1002/acm2.13446. Please connect the numbers in the list below to the\
  \ number in each file present in the repository folder. It represents the natural flow of code execution,\
  \ from data preparation to model inference. \n\n(_2.) QA and integrity check of new data\\\n(_1.) Sorting\
  \ of raw DICOM data\\\n(0.) Extraction of test dataset\\\n(0.5.) Anonymization of dataset \\\n(1.) Generation\
  \ of Nifti files from DICOM raw data\\\n(2.) Creation of dataset and training database\\\n(2.5.) QA\
  \ of radiotherapy structure geometry\\\n(3.) Model training\\\n(4.) Model inference\n\nContact: christian.JamtheimGustafsson@skane.se\n\
  \nRequirements:\\\ndcmrtstruct2nii==1.0.18\\\nh5py==2.10.0\\\nkeract==4.3.4\\\nKeras==2.4.3\\\nKeras-Applications==1.0.8\\\
  \nKeras-Preprocessing==1.1.2\\\nmatplotlib==3.2.1\\\nnibabel==3.0.1\\\nnumpy==1.18.5\\\nopencv-python==4.2.0.32\\\
  \npandas==1.0.1\\\nPillow==7.1.2\\\npsutil==5.7.0\\\npydicom==1.4.2\\\nPyYAML==5.3\\\nscikit-image==0.16.2\\\
  \nscikit-learn==0.22.2.post1\\\nscipy==1.4.1\\\nSimpleITK==1.2.4\\\ntensorboard==2.2.2\\\ntensorboard-plugin-profile==2.2.0\\\
  \ntensorboard-plugin-wit==1.7.0\\\ntensorflow-estimator==2.2.0\\\ntensorflow-gpu==2.2.0\\\ntf-keras-vis==0.5.5\n"

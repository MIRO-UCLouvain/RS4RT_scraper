readme_excerpt: '# BC-RadiogenomicGAN


  A breast cancer radiogenomics project for conditional MRI generation and downstream subtype/mutation
  prediction.


  ## Overview


  This project focuses on breast cancer radiogenomics by combining imaging-related molecular features
  with deep learning models for two main tasks:


  1. Conditional MRI generation using RadiogenomicGAN

  2. Downstream subtype and mutation prediction using CNN models


  The project was developed as part of a graduation thesis and was later extended for research and manuscript
  preparation.


  ## Highlights


  - Conditional breast MRI generation from radiogenomic-related features

  - Downstream prediction of key mutation markers and molecular subtypes

  - Comparative experiments across real MRI, generated MRI, and mixed training settings

  - Representative visualization examples for real and generated image comparison



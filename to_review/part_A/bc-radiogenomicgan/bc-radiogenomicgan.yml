  ## Project Structure


  ```text

  BC_RadiogenomicGAN_new_public/

  ├─ assets/                  # Figures for GitHub presentation

  ├─ main_code/

  │  ├─ RadiogenomicGAN/      # MRI generation model

  │  ├─ CNN/                  # Downstream prediction models

  │  ├─ other_tool/           # Auxiliary preprocessing / analysis scripts

  │  ├─ Med3D/                # 3D backbone structure

  │  └─ requirements.txt

  ├─ mri_data/

  │  ├─ rmi_futures.csv

  │  └─ other/

  │     ├─ new_npy.csv

  │     └─ new_npy_unique_ids.csv

  ├─ .gitignore

  └─ README.md

  ```


  ## Environment


  Recommended environment:


  - Python 3.8+

  - PyTorch

  - NumPy

  - pandas

  - matplotlib

  - scikit-learn


  Install dependencies with:


  ```bash

  pip install -r main_code/requirements.txt

  ```


  ## Usage

  Run the following scripts from the project root directory, or enter the corresponding subdirectory before
  execution.


  ### 1. RadiogenomicGAN training / generation


  Main files:


  - `main_code/RadiogenomicGAN/main.py`

  - `main_code/RadiogenomicGAN/params.py`

  - `main_code/RadiogenomicGAN/test.py`


  ### 2. CNN training / inference


  Main files:


  - `main_code/CNN/train.py`

  - `main_code/CNN/inference.py`

  - `main_code/CNN/training_testing.py`


  Example commands:


  ```bash

  python main_code/RadiogenomicGAN/main.py

  python main_code/CNN/train.py

  python main_code/CNN/inference.py

  ```


  ### 3. Utility scripts


  Additional helper scripts are provided in:


  - `main_code/other_tool/`


  ## Experimental Output Notes


  In the original local workflow, generated MRI results were stored in a separate `generated_mri_data/`
  directory, which contained:


  - `fid_loss/`

  - `images/`

  - `logs/`

  - `models/`

  - `test_outputs/`


  This directory is not included in the public repository because it mainly contained large experiment
  artifacts, generated outputs, logs, and checkpoints.


  During the original experiments, the GAN training setup included tuned learning rates such as:


  - generator learning rate: `0.000005`

  - discriminator learning rate: `0.00001`



  ## Data Notes


  This public repository does not include:


  - raw patient MRI / DICOM data

  - full generated MRI datasets

  - full training result directories

  - pretrained model weights


  Only lightweight metadata/index files and representative figures are retained for project presentation.


  ## Notes


  - Some scripts may still contain local experimental paths and may require manual adjustment before running.

  - This repository is intended for project presentation, code organization, and method demonstration.

  - Full experimental reproduction may require private datasets and local environment configuration.


  ## Citation


  If you use this project structure or code for reference, please cite the related thesis or manuscript
  when available.


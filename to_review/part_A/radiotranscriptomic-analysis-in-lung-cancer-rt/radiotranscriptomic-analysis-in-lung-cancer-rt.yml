readme_excerpt: "# Radiotranscriptomic Analysis in Lung Cancer RT\r\n\r\nA radiotranscriptomic analysis\
  \ project for lung cancer radiotherapy, combining radiomics features and transcriptomic data for survival\
  \ analysis modeling.\r\n\r\n## Overview\r\n\r\nThis project aims to extract radiomics features from\
  \ CT images, build machine learning models to predict survival prognosis in lung cancer patients, and\
  \ integrate transcriptomic data for multi-omics joint analysis.\r\n\r\n## Directory Structure\r\n\r\n\
  ```\r\nRadiotranscriptomic Analysis in Lung Cancer RT/\r\n├── scripts/                        # Analysis\
  \ scripts\r\n│   ├── ml_survival.py              # Survival analysis main entry\r\n│   └── ml_survival/\
  \                # Modular survival analysis package\r\n│       ├── __main__.py             # Main workflow\
  \ controller\r\n│       ├── config.py               # Configuration management\r\n│       ├── data_manager.py\
  \         # Data loading and preprocessing\r\n│       ├── feature_selector.py     # Feature selection\r\
  \n│       ├── models.py               # Model definitions\r\n│       ├── trainer.py              # Training\
  \ and evaluation\r\n│       ├── visualizer.py           # Visualization\r\n│       └── ...\r\n├── data/\
  \                           # Data directory\r\n│   ├── X_train.csv                 # Training set features\r\
  \n│   ├── X_test.csv                  # Test set features\r\n│   ├── y_train.csv                 # Training\
  \ set survival data\r\n│   └── y_test.csv                  # Test set survival data\r\n└── README.md\
  \                       # This file\r\n```\r\n\r\n## Core Modules\r\n\r\n### Survival Analysis (scripts/ml_survival/)\r\
  \n\r\nA modular survival analysis package supporting multiple survival models:\r\n\r\n- **Cox Proportional\
  \ Hazards Model** (Cox PH, Cox Net)\r\n- **Random Survival Forest** (RSF)\r\n- **Gradient Boosting Machine**\
  \ (GBM)\r\n- **Survival Support Vector Machine** (Fast SVM)\r\n\r\n**Key Features**:\r\n\r\n- Data validation\
  \ and preprocessing\r\n- Feature selection (variance filtering, correlation filtering, univariate Cox)\r\
  \n- Batch effect correction (ComBat)\r\n- Model training and evaluation\r\n- Visualization (KM curves,\
  \ ROC curves, SHAP plots)\r\n\r\n**Quick Start**:\r\n\r\n```bash\r\ncd scripts\r\npython ml_survival.py\
  \ --help\r\n```\r\n\r\n## Data Format Requirements\r\n\r\n### Feature Files\r\n\r\n- Must contain `patient`\
  \ column as patient ID\r\n- Remaining columns are numerical radiomics features\r\n\r\n### Survival Data\
  \ Files\r\n\r\n- `patient`: Patient ID\r\n- `OS`: Overall survival time (months)\r\n- `events`: Event\
  \ status (0=censored, 1=event)\r\n\r\n## Output Results\r\n\r\nAfter running survival analysis, results\
  \ are saved in the `results/` directory:\r\n\r\n- `survival_cv_results.csv` - Model performance metrics\r\
  \n- `cindex_data.csv` - C-index per fold\r\n- `{Model}_risk_scores.csv` - Patient risk scores\r\n- `{Model}_KM.svg`\
  \ - Kaplan-Meier survival curves\r\n- `{Model}_ROC.svg` - Time-dependent ROC curves\r\n- `SHAP_{Model}.svg`\
  \ - SHAP feature importance plots\r\n\r\n---\r\n\r\n# 影像转录组分析项目（肺癌放疗）\r\n\r\n肺癌放疗的影像转录组分析项目，结合影像组学特征和转录组数据进行生存分析建模。\r\
  \n\r\n## 项目概述\r\n\r\n本项目旨在从CT影像中提取影像组学特征，构建机器学习模型预测肺癌患者的生存预后，并结合转录组数据进行多组学联合分析。\r\n\r\n## 目录结构\r\n\r\
  \n```\r\nRadiotranscriptomic Analysis in Lung Cancer RT/\r\n├── scripts/                        # 分析脚本目录\r\
  \n│   ├── ml_survival.py              # 生存分析主入口\r\n│   └── ml_survival/                # 生存分析模块化包\r\n\
  │       ├── __main__.py             # 主流程控制器\r\n│       ├── config.py               # 配置管理\r\n│    \
  \   ├── data_manager.py         # 数据加载与预处理\r\n│       ├── feature_selector.py     # 特征选择\r\n│      \
  \ ├── models.py               # 模型定义\r\n│       ├── trainer.py              # 训练与评估\r\n│       ├── visualizer.py\
  \           # 可视化\r\n│       └── ...\r\n├── data/                           # 数据目录\r\n│   ├── X_train.csv\
  \                 # 训练集特征\r\n│   ├── X_test.csv                  # 测试集特征\r\n│   ├── y_train.csv    \
  \             # 训练集生存数据\r\n│   └── y_test.csv                  # 测试集生存数据\r\n└── README.md          \
  \             # 本文件\r\n```\r\n\r\n## 核心功能模块\r\n\r\n### 生存分析 (scripts/ml_survival/)\r\n\r\n模块化的生存分析包，支持多种生存模型：\r\
  \n\r\n- **Cox比例风险模型** (Cox PH, Cox Net)\r\n- **随机生存森林** (RSF)\r\n- **梯度提升** (GBM)\r\n- **生存支持向量机** (Fast\
  \ SVM)\r\n\r\n**主要功能**：\r\n\r\n- 数据验证与预处理\r\n- 特征选择（方差过滤、相关性过滤、单变量Cox）\r\n- 批效应校正（ComBat）\r\n- 模型训练与评估\r\
  \n- 可视化（KM曲线、ROC曲线、SHAP图）\r\n\r\n**快速开始**：\r\n\r\n```bash\r\ncd scripts\r\npython ml_survival.py --help\r\
  \n```\r\n\r\n## 数据格式要求\r\n\r\n### 特征文件\r\n\r\n- 必须包含 `patient` 列作为患者ID\r\n- 其余列为数值型影像组学特征\r\n\r\n###\
  \ 生存数据文件\r\n\r\n- `patient`: 患者ID\r\n- `OS`: 总生存时间（月）\r\n- `events`: 事件状态（0=删失，1=事件）\r\n\r\n## 输出结果\r\
  \n\r\n运行生存分析后，结果保存在 `results/` 目录：\r\n\r\n- `survival_cv_results.csv` - 模型性能指标\r\n- `cindex_data.csv`\
  \ - 每折C-index\r\n- `{Model}_risk_scores.csv` - 患者风险评分\r\n- `{Model}_KM.svg` - KM生存曲线\r\n- `{Model}_ROC.svg`\
  \ - 时间依赖ROC曲线\r\n- `SHAP_{Model}.svg` - SHAP特征重要性图\r\n"

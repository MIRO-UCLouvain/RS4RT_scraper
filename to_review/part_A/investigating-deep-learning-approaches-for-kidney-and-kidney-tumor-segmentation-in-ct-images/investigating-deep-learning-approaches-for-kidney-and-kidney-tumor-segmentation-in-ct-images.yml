readme_excerpt: "\uFEFF# Investigating-Deep-Learning-Approaches-for-Kidney-and-Kidney-Tumor-Segmentation-in-CT-Images\r\
  \n## Replication Commands\r\n\r\n  The replication commands used for the experiments are summarized\
  \ in `replication_commands_readme.md`. This file documents the main training and inference setup for\
  \ the single-stage and two-stage experiments, including\r\n  the dataset split, model configurations,\
  \ trainer variants, checkpoint choice, inference workflow, test-time augmentation, and ROI-based postprocessing.\r\
  \n\r\n  The commands are written at the framework/configuration level rather than as machine-specific\
  \ terminal commands. Local environment setup, absolute script paths, and machine-specific details are\
  \ omitted to keep the\r\n  appendix focused on the experimental procedure needed to reproduce the work.\r\
  \n\r\n\r\n## Model Checkpoints Used for Inference\r\n\r\nThe model weights are provided in the 'weights.tar.gz'.\r\
  \nAll final inference experiments used the best validation checkpoint rather than the final training\
  \ checkpoint.\r\n\r\n### Single-Stage Models\r\n\r\n| Experiment | Framework | Trainer / configuration\
  \ | Checkpoint used |\r\n|---|---|---|---|\r\n| 3D U-Net | U-Mamba / nnU-Net v2 | `nnUNetTrainer_50epochs`\
  \ + `nnUNetPlans` | `checkpoint_best.pth` |\r\n| ResEnc U-Net | U-Mamba / nnU-Net v2 | `nnUNetTrainer_50epochs`\
  \ + `nnUNetResEncUNetPlans` | `checkpoint_best.pth` |\r\n| U-Mamba | U-Mamba / nnU-Net v2 | `nnUNetTrainerUMambaEnc_50epochs`\
  \ + `nnUNetPlans` | `checkpoint_best.pth` |\r\n| MedNeXt | MedNeXt | `nnUNetTrainerV2_MedNeXt_S_kernel3_50ep`\
  \ + `nnUNetPlansv2.1` | `model_best.model` |\r\n\r\n### Two-Stage MedNeXt Models\r\n\r\n| Experiment\
  \ | Stage | Trainer / configuration | Checkpoint used |\r\n|---|---|---|---|\r\n| Kidney-region localization\
  \ | Stage 1 | `nnUNetTrainerV2_MedNeXt_S_kernel3` + `nnUNetPlansv2.1` | `model_best.model` |\r\n| Baseline\
  \ / 0.33 sampling | Stage 2 | `nnUNetTrainerV2_MedNeXt_S_kernel3` + `nnUNetPlansv2.1` | `model_best.model`\
  \ |\r\n| 0.33 foreground sampling | Stage 2 | `nnUNetTrainerV2_MedNeXt_S_kernel3_TumorSample33` + `nnUNetPlansv2.1`\
  \ | `model_best.model` |\r\n| 0.50 foreground sampling | Stage 2 | `nnUNetTrainerV2_MedNeXt_S_kernel3_TumorSample50`\
  \ + `nnUNetPlansv2.1` | `model_best.model` |\r\n| 0.67 foreground sampling | Stage 2 | `nnUNetTrainerV2_MedNeXt_S_kernel3_TumorSample67`\
  \ + `nnUNetPlansv2.1` | `model_best.model` |\r\n| CE tumor weight 2 | Stage 2 | `nnUNetTrainerV2_MedNeXt_S_kernel3_TumorCE2`\
  \ + `nnUNetPlansv2.1` | `model_best.model` |\r\n| CE tumor weight 5 | Stage 2 | `nnUNetTrainerV2_MedNeXt_S_kernel3_TumorCE5`\
  \ + `nnUNetPlansv2.1` | `model_best.model` |\r\n\r\n## 3D Volumes\r\nThe 3D volumes from the exampes\
  \ are in the 3D Volumes folder. It can be viewed through 3D viewers.\r\n"

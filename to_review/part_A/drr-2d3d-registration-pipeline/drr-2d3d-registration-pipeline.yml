readme_excerpt: "# Intensity-Based 2D–3D Registration using DRR Simulation \n## Overview\n\nThis project\
  \ focuses on generating digitally reconstructed radiographs (DRRs) from CT data using cone-beam projection\
  \ geometry and evaluating image similarity using intensity-based metrics. The framework explores core\
  \ components required for 2D–3D image registration workflows, including projection modelling and Normalized\
  \ Cross-Correlation (NCC) similarity evaluation.\n\n\n\n## Key Features\n\n- DRR generation from CT\
  \ DICOM datasets\n- Cone-beam projection geometry setup\n- Intensity-based image comparison using NCC\n\
  - Framework for future 2D–3D registration development\n\n\n## Tools & Technologies\n\n- Python\n- ASTRA\
  \ Toolbox\n- DICOM processing\n- Numerical optimisation concepts\n\n\n\n## Pipeline Overview\n\n1. **CT\
  \ Data Preparation**\n   - Load and preprocess CT DICOM volumes.\n\n2. **Projection Geometry Definition**\n\
  \   - Configure cone-beam projection parameters.\n\n3. **DRR Generation**\n   - Simulate X-ray projections\
  \ from CT volume.\n\n4. **Similarity Evaluation**\n   - Compute Normalized Cross-Correlation (NCC) between\
  \ generated DRR and reference image.\n\n\n\n## Results\n\n- Successfully generated DRRs using cone-beam\
  \ projection geometry\n- Implemented NCC-based similarity evaluation for alignment analysis\n\n\n\n\
  ## Learning Outcomes\n\n- Understanding of projection geometry in medical imaging\n- DRR generation\
  \ principles\n- Intensity-based similarity metrics for registration\n\n\n\n## Future Work\n\n- Full\
  \ optimisation-based registration\n- Alternative similarity metrics\n- Deep learning comparison methods\n\
  \n\n\n## Author\n\nAnindhitha Aravind  \nBiomedical Engineering — SSN College of Engineering\n"

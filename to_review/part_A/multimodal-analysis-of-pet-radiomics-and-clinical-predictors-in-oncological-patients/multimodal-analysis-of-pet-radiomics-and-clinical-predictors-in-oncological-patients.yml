readme_excerpt: "# Multimodal-Analysis-of-PET-Radiomics-and-Clinical-Predictors-in-Oncological-Patients\n\
  \n## \U0001F4CC Project Overview\nMultimodal integration of PET-derived radiomic features and clinical\
  \ data to predict **Overall Survival (OS)** and **Progression-Free Survival (PFS)** in oncological patients.\
  \ \n\nThe pipeline transitions from statistical biomarker selection to Deep Learning-based prognostic\
  \ modeling.\n\n## \U0001F6E0️ Technical Workflow\n* **Feature Extraction:** Quantitative imaging analysis\
  \ using `PyRadiomics`.\n* **Statistical Testing:** Correlation analysis, Kaplan-Meier survival curves,\
  \ and Cox Proportional Hazards models.\n* **Modeling:** Deep Learning architectures for survival risk\
  \ scoring.\n\n## \U0001F4C2 Requirements\nTo run this project, you will need:\n* `pyradiomics`\n* `lifelines`\
  \ (for survival analysis)\n* `scikit-learn`\n* `pandas`, `numpy`, `matplotlib`\n* `torch` (or `tensorflow`)\n\
  \n* ## \U0001F512 Access to Code and Data\nDue to the sensitive nature of oncological data and the ongoing\
  \ status of this research, the source code is hosted in a private repository.\n\n**To request access\
  \ for review or collaboration:**\n1. Please open an **Issue** in this repository with the object \"\
  Access Request\".\n2. Or contact me directly via email at: `martina.desalazar@dimes.unical.it`\n\n*Access\
  \ will be granted to verified researchers and collaborators upon request.*\n"

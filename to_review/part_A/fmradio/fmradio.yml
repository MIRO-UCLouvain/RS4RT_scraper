readme_excerpt: "![FMradio](https://github.com/CFWP/FMradio/blob/master/inst/FMradioLOGO.png)\n\n\n[![Project\
  \ Status: Active - The project has reached a stable, usable state and is being actively developed.](http://www.repostatus.org/badges/latest/active.svg)](https://www.repostatus.org/#active)\n\
  [![CRAN version](http://www.r-pkg.org/badges/version/FMradio)](https://cran.r-project.org/package=FMradio)\n\
  [![CRAN RStudio mirror downloads](http://cranlogs.r-pkg.org/badges/FMradio)](https://cran.r-project.org/package=FMradio/index.html)\n\
  [![Total CRAN downloads](http://cranlogs.r-pkg.org/badges/grand-total/FMradio)](https://www.r-pkg.org:443/pkg/FMradio)\n\
  \n\n**FMradio**\n---------------\nThe R-package **FMradio** supports stable prediction and classification\
  \ with radiomics data through factor-analytic modeling.\nThis support can be invoked irrespective of\
  \ the imaging modality (such as, e.g., MRI, PET, CT) used to produce the radiomics data.\n\n\n## Installation\n\
  \nIf you wish to install the latest version of **FMradio** directly from the master branch here at GitHub,\
  \ run\n\n```R\n#install.packages(\"devtools\")  # Uncomment if devtools is not installed\ndevtools::install_github(\"\
  CFWP/FMradio\")\n```\nBe sure that you have the [package development prerequisites](https://support.posit.co/hc/en-us/articles/200486498-Package-Development-Prerequisites)\
  \ if you wish to install the package from the source.\n\n\n## Manual and other documentation\n\n* A\
  \ pdf-version of the manual can be found [here](https://cfwp.github.io/PDFs/FMradio.pdf).\n\n* The R-script\
  \ used to produce the simulations and results contained in Peeters, C.F.W., *et al*. (2019) [see references\
  \ below] can be found [here](https://cfwp.github.io/PDFs/Simulations&Analysis.R).\n\n\n## References\n\
  \nRelevant publications to **FMradio** include:\n\n 1. Peeters, C.F.W. (2025). \n    *\"FMradio: Factor\
  \ modeling for radiomic data\"*. \n    R package, version 1.1.2\n 2. Peeters, C.F.W., *et al*. (2019)\n\
  \    *\"Stable prediction with radiomics data\"*.\n    [arXiv:1903.11696 [stat.ML]](https://arxiv.org/abs/1903.11696)\n"

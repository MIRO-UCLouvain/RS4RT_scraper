readme_excerpt: "<div align=center>\n<img src=\"pics/deepsparse.png\" alt=\"DeepSparse\">\n<h1>DeepSparse:\
  \ A Foundation Model for Sparse-View CBCT Reconstruction</h1>\n</div>\n\n<div align=center>\n<a href=\"\
  https://ieeexplore.ieee.org/document/11436116\">\n<img src=\"https://img.shields.io/badge/%F0%9F%93%96-TMI_2026-red.svg?style=flat-square\"\
  >\n</a>\n<a href=\"https://xmengli.github.io/\">\n<img src=\"https://img.shields.io/badge/%F0%9F%9A%80-xmed_Lab-ed6c00.svg?style=flat-square\"\
  >\n</a>\n</div>\n\n<br>\n\nThis repository contains the official implementation of **[DeepSparse: A\
  \ Foundation Model for Sparse-View CBCT Reconstruction](https://ieeexplore.ieee.org/document/11436116/)**,\
  \ accepted in *IEEE Transactions on Medical Imaging* (TMI), 2026.\n\nFor any questions regarding this\
  \ repository, please contact [jchenhu@connect.ust.hk](mailto:jchenhu@connect.ust.hk).\n\n## :rocket:\
  \ Updates\n\n- The code for pretraining, finetuning, and evaluation is released.\n- Pretrained and finetuned\
  \ model weights are released on [HuggingFace](https://huggingface.co/HajihajihaJimmy/DeepSparse).\n\n\
  ## :star: Highlights\n\n- **Foundation model for sparse-view CBCT**: DeepSparse is pretrained on a large-scale\
  \ abdominal CT dataset (AtlasAbdomenMini, ~7k volumes) and can be finetuned to diverse anatomical targets\
  \ with few labelled examples.\n- **Implicit neural representation with vector quantization**: A codebook-based\
  \ encoder-decoder reconstructs 3D volumes from sparse 2D X-ray projections, enabling memory-efficient\
  \ inference at arbitrary resolution.\n- **Two-stage finetuning**: Stage 1 adapts the pretrained backbone\
  \ to a target anatomy; Stage 2 refines the fine detail decoder with a frozen encoder, enabling high-quality\
  \ reconstruction with as few as 6 views.\n- **Generalizes across anatomies**: Evaluated on abdomen (PANORAMA),\
  \ pelvis (PENGWIN), lung (LUNA16), and tooth (ToothFairy) with consistent state-of-the-art performance.\n\
  \n## :hammer: Environment\n\n```bash\ngit clone https://github.com/xmed-lab/DeepSparse.git\ncd DeepSparse\n\
  conda create -n deepsparse python=3.9\nconda activate deepsparse\n# PyTorch 1.13.1 + CUDA 11.6\nconda\
  \ install pytorch==1.13.1 torchvision==0.14.1 torchaudio==0.13.1 pytorch-cuda=11.6 -c pytorch -c nvidia\n\
  # Other dependencies\npip install SimpleITK scipy numpy einops tqdm matplotlib pytorch-lightning timm\n\
  # TIGRE (cone-beam CT projector) — follow the instructions at:\n# https://github.com/CERN/TIGRE\n```\n\
  \n## :computer: Prepare Dataset\n\nAll dataset preprocessing scripts are in `data/`. See [`data/README.md`](data/README.md)\
  \ for the full directory structure and shared utilities.\n\nEach dataset has its own subfolder with\
  \ a `README.md`:\n\n| Dataset | Anatomy | Folder |\n|---------|---------|--------|\n| [AbdomenAtlas1.0Mini](https://huggingface.co/datasets/AbdomenAtlas/AbdomenAtlas1.0Mini)\
  \ | Abdomen (pretraining) | `data/atlas-mini/` |\n| [PANORAMA](https://panorama.grand-challenge.org/)\
  \ | Abdomen (finetuning) | `data/PANORAMA/` |\n| [PENGWIN](https://pengwin.grand-challenge.org/) | Pelvis\
  \ (finetuning) | `data/PENGWIN/` |\n| [LUNA16](https://luna16.grand-challenge.org/) | Lung (finetuning)\
  \ | `data/LUNA16_v2/` |\n| [ToothFairy](https://toothfairy.grand-challenge.org/) | Tooth (finetuning)\
  \ | `data/ToothFairy/` |\n\n## :key: Training & Evaluation\n\n> **Tip**: You can skip training entirely\
  \ and download pretrained weights for direct inference — see [Download Checkpoints](#inbox_tray-download-checkpoints)\
  \ below.\n\n### Pretraining\n\n```bash\nbash scripts/pretrain.sh\n```\n\nTrains the foundation model\
  \ on AtlasAbdomenMini for 800 epochs. The checkpoint used for finetuning is saved at `logs/pretrain/ep_700.pth`.\n\
  \n### Finetuning — Stage 1\n\n```bash\nbash scripts/finetune_s1.sh\n```\n\nAdapts the pretrained backbone\
  \ to each downstream anatomy (abdomen, pelvis, lung, tooth) across three sparsity regimes (6, 8, 10\
  \ views). Checkpoints are saved under `logs/{dataset}+{n_view}v+s1/`.\n\n### Finetuning — Stage 2\n\n\
  ```bash\nbash scripts/finetune_s2.sh\n```\n\nRefines with a frozen encoder to sharpen reconstruction\
  \ quality. Loads Stage 1 checkpoints and saves results under `logs/{dataset}+{n_view}v+s2/`.\n\n###\
  \ Evaluation\n\n```bash\nbash scripts/evaluate_s2.sh\n```\n\nRuns evaluation on all datasets and view\
  \ counts using Stage 2 checkpoints at `logs/{dataset}+{n_view}v+s2/ep_400.pth`.\n\n## :inbox_tray: Download\
  \ Checkpoints\n\nPretrained and finetuned checkpoints are hosted on HuggingFace and can be downloaded\
  \ for direct inference:\n\n**[HuggingFace — HajihajihaJimmy/DeepSparse](https://huggingface.co/HajihajihaJimmy/DeepSparse)**\n\
  \nPlace the downloaded `logs/` folder in the project root. See [`logs/README.md`](logs/README.md) for\
  \ a description of each checkpoint.\n\nTo download with `huggingface-cli`:\n\n```bash\npip install huggingface-hub\
  \ hf-transfer\nHF_HUB_ENABLE_HF_TRANSFER=1 huggingface-cli download HajihajihaJimmy/DeepSparse --local-dir\
  \ ./logs\n```\n\n## :blue_book: Citation\n\nIf you find this work helpful, please cite:\n\n```bibtex\n\
  @ARTICLE{11436116,\n  author={Lin, Yiqun and Chen, Jixiang and Wang, Hualiang and Yang, Jiewen and Guo,\
  \ Jiarong and Zhang, Yi and Li, Xiaomeng},\n  journal={IEEE Transactions on Medical Imaging},\n  title={DeepSparse:\
  \ A Foundation Model for Sparse-View CBCT Reconstruction},\n  year={2026},\n  volume={},\n  number={},\n\
  \  pages={1-1},\n  doi={10.1109/TMI.2026.3674948}\n}\n```\n\n## :beers: Acknowledgements\n\nWe thank\
  \ the challenge organizers of PANORAMA, PENGWIN, LUNA16, and ToothFairy for making their datasets publicly\
  \ available.\n"

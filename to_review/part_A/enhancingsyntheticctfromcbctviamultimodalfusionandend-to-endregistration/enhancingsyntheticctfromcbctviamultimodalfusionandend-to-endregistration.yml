readme_excerpt: '# CAIP 2025 and CBMS 2026 Supplementary Material


  This archive contains sources, slurm scripts and pointers to the material for the papers:


  **"Enhancing Synthetic CT from CBCT via Multimodal Fusion and End-To-End Registration"**


  **Enhancing Synthetic CT from CBCT via Multimodal Fusion: A Study on the Impact of CBCT Quality and
  Alignment**


  accepted at **CAIP 2025** and **CBMS 2026**.


  ---


  ## Contents


  - `src/`: Main training and evaluation code (`main.py`, model, utils, dataloader)

  - `scripts/`: SLURM scripts for reproducing experiments on CBCTLiTS, Pancreas, and SynthRad datasets

  - `requirements.txt`: Python package versions used


  ---


  ## Requirements


  - See `requirements.txt` for exact package versions


  Install via:

  ```bash

  pip install -r requirements.txt

  ```


  ---


  ## Usage


  ### Local run:

  ```bash

  python src/main.py --multimodal --perceptual --data_homepath /path/to/data ...

  ```


  ### SLURM run:

  ```bash

  sbatch scripts/CBCTLiTS/runMM0125CTTargetSTNPerceptual.sh

  ```


  Adjust paths as needed.


  ---


  ## Notes


  - Paths are generic, most probably you will need to point them to the files.

  - Public datasets used (CBCTLiTS, Pancreas, SynthRad).

  - Model checkpoints are saved automatically in output folders.

  '

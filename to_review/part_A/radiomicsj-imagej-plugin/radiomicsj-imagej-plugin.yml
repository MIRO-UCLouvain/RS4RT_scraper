readme_excerpt: "# RadiomicsJ ImageJ Plugin README\n## Concepts\n\nThis plugin was developed for educational\
  \ and research purposes. It provides three main functionalities:\n- Machine Learning: Create a simple\
  \ segmentation model trained on Radiomics features using the WEKA library.\n- Radiomics Feature Calculation:\
  \ Calculate features based on image and mask pairs.\n- Visualization: Generate and visualize Radiomics\
  \ feature maps calculated via a raster scan (sliding window) approach.\n    \n## Installation\n\n  \
  \  Download the RadiomicsJ_ImageJPlugin-***.jar file(*** means version) and radiomics_lib.zip\n    unzip\
  \ radiomics_lib.zip to as \"radiomics_lib\" folder.\n    Place the both files into the plugins folder\
  \ of your ImageJ or Fiji installation.\n    Restart ImageJ/Fiji.\n\n## Usage\n### Simple Machine Learning\
  \ (Segmentation)\n\nThis module allows you to train a segmentation model using interactive ROI selection.\n\
  \n    Open an image in ImageJ.\n    Create ROIs for each target class (e.g., background, tissue, lesion).\n\
  \    Click the Add button in the plugin to register the current ROI to the corresponding class.\n  \
  \  Follow the workflow: Train -> Prediction -> Show Results.\n    Observe the segmentation results.\n\
  \nNote: Prediction results are calculated using a patch&stride-based raster scan on the image. patch=15,\
  \ stride=4 is default. If you would like to change these settings, set \"PREDICTION_FilterSize\" and\
  \ \"PREDICTION_Stride\" in RadiomicsJ_IJ_Plugin.properties.\nNote: The execution of the Prediction mode\
  \ may take some time depending on the image size and feature settings.\n\nUser can save calculated features\
  \ and a trained model by using \"Save Configurations\".\nCalculated features is saved with \"ARFF\"\
  \ format, so user can do more machine learning process using WEKA.\n\n### Texture Settings\n\nConfigure\
  \ the parameters for Radiomics feature calculation in this section.\n\n    Default Settings: The default\
  \ values are generally sufficient for most use cases.\n    Calculation Mode:\n        2D Mode: Calculates\
  \ features slice by slice.\n        3D Mode: Calculates volumetric features.\n\nNote: This settings\
  \ is used to model training and visualization map.\n\n### Batch Mode\n\nThis mode allows for the automated\
  \ processing of multiple datasets simultaneously. It is useful for calculating features for a large\
  \ number of image-mask pairs at once.\n\n### Visualization\n\nVisualize specific Radiomics features\
  \ on the image.\n\n    The plugin calculates the specified features using a patch-based raster scan\
  \ on the image-mask pair (stride=1).\n    The calculation parameters are based on the configuration\
  \ in Texture Settings.\n    \nNote: In Texture Settings, the label configuration must match the actual\
  \ label values of the loaded Mask image.\n    \n### Configuration properties\n\nThis plugin automatically\
  \ save properties files to user.home/RadiomicsJ_IJ_Plugin.properties by \"Save Configuration\" function.\n\
  If you would like to uninstall, remove this file, jar and radiomicsj_lib folder.\n\n### Requirements\n\
  \n    ImageJ 1.53 or Fiji\n    Java 8 or higher\n\n## License\n\nMIT License\n"

readme_excerpt: "&nbsp;\n\n<div align=\"center\">\n\n<h2>REG-Gaussians: 4D-Gaussian Splatting for Sparse-View\
  \ Dynamic CBCT Reconstruction</h2>\n\n*Regularized 4D Gaussian splatting for sparse-view dynamic cone-beam\
  \ CT reconstruction.*\n\n[Project page](https://jorismentink.github.io/REG-gaussians/)\n\n\n</div>\n\
  \n&nbsp;\n\n## Introduction\n\nThis repository contains the official implementation of **REG-Gaussians**,\
  \ a framework for **sparse-view 4D cone-beam CT (4D-CBCT) reconstruction** based on **4D Gaussian splatting**.\n\
  \nREG-Gaussians extends recent radiative Gaussian splatting methods for tomographic reconstruction by\
  \ introducing and evaluating multiple **regularization strategies** aimed at improving reconstruction\
  \ quality and temporal consistency in dynamic CBCT settings. The framework focuses on **respiratory\
  \ phase binned 4D-CBCT** and is evaluated on thoracic data.\n\nThe work builds upon and adapts existing\
  \ 3D and 4D Gaussian splatting pipelines, most notably **R²-Gaussian** and **HexPlane-based spatiotemporal\
  \ representations**, and evaluates the effect of additional regularization terms such as:\n- HexPlane\
  \ grid smoothing\n- Motion coherence regularization\n- Geometric regularization\n\n---\n\n## 1. Installation\n\
  \nWe recommend using **Conda** to set up the environment. The code has been tested on **Ubuntu 24.04**\
  \ using the NVIDIA GeForce RTX 4080 Super GPU.\n\n### 1.1 Clone repository\n\n```sh\n#Clone the repository\n\
  git clone https://github.com/JorisMentink/REG-gaussians.git --recursive\ncd REG-gaussians\n\n#Install\
  \ environment\nconda env create --file environment.yml\nconda activate reg_gaussians\n```\n\n## 2. Dataset\n\
  \nREG-Gaussians is evaluated on **4D thoracic CT data** with simulated sparse-view CBCT projections.\n\
  \n**Primary dataset**\n- DIR-Lung 4DCT dataset\n- Patients 1 to 5\n\nThe dataset can be downloaded from\
  \ the official source [here](https://med.emory.edu/departments/radiation-oncology/research-laboratories/deformable-image-registration/downloads-and-reference-data/4dct)\n\
  \nAfter downloading, the raw 4DCT data must be pre-processed and converted into a NeRF-style directory\
  \ structure before training.\n\n---\n\n## 3. Initialization and Training\n\nInitialization and training\
  \ follow the same general pipeline as [**R²-Gaussian**](https://github.com/Ruyi-Zha/r2_gaussian).  \n\
  Please refer to the original repository for additional background details:\n\n\n### 3.1 Dataset compilation\n\
  \nAfter pre-processing the raw data into a NeRF-format directory structure, all respiratory phase bins\
  \ are compiled into a single training dataset using:\n\n```sh\npython compile_training_dataset.py\n\
  --input_path  \"path/to/parent/folder\"\n--output_path \"path/to/output/folder\"\n--train_size  30\n\
  --test_size   30\n```\n\nHere, `train_size` and `test_size` denote the number of projections used for\
  \ training and testing per respiratory phase, respectively.\n\n---\n\n### 3.2 Gaussian initialization\n\
  \nThe compiled dataset is initialized by sampling Gaussians from a coarse reconstruction, typically\
  \ obtained using the FDK algorithm:\n\n```sh\npython initialize_pcd.py\n--data   \"path/to/compiled/dataset\"\
  \n--device 0\n```\n\nProper initialization is important for stable convergence and reconstruction quality.\n\
  \n---\n\n### 3.3 Training\n\nTraining can be started using:\n\n```sh\npython train.py\n--source_path\
  \ \"path/to/compiled/dataset\"\n--iterations  30000\n--model_path \"path/to/output\"\n```\n\nThe number\
  \ of training iterations and output directory can be adjusted depending on the desired reconstruction\
  \ quality and available computational resources.\n\n### 3.3 Evaluation\n\nModel evaluation can be done\
  \ via:\n\n```sh\npython test.py\n--model_path \"path/to/model/output/folder\"\n--iteration  30000\n\
  ```\nWhere the iteration number denotes at what iteration checkpoint you want to evaluate the model.\
  \ NOTE: you can only evaluate models at lower iterations if checkpoints exist.\n\n### Acknowledgements\n\
  \nThis repository builds upon and adapts code from several open-source projects, including:\n\n- [Gaussian\
  \ Splatting](https://github.com/graphdeco-inria/gaussian-splatting)  \n- [R²-Gaussian](https://github.com/Ruyi-Zha/r2_gaussian)\
  \  \n- [HexPlane](https://github.com/Caoang327/HexPlane)\n- [TIGRE Toolbox](https://github.com/CERN/TIGRE/tree/master)\
  \  \n\nWe thank the respective authors for making their work publicly available.\n\n---\n\n### License\n\
  \nThis project falls under the third party licenses of the used open-source code:\n[R²-Gaussian license](https://github.com/Ruyi-Zha/r2_gaussian/blob/main/LICENSE.md)\n\
  [HexPlane license](https://github.com/Caoang327/HexPlane/blob/main/LICENSE)\n\n\n---\n\n"

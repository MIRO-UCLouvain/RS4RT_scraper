readme_excerpt: "# postcss-dvh-vh-fallback\n\n[PostCSS] plugin create fallback for dvh values.\n\n[PostCSS]:\
  \ https://github.com/postcss/postcss\n\n```css\n.foo {\n  /* Input example */\n}\n```\n\n```css\n.foo\
  \ {\n  /* Output example */\n}\n```\n\n## Usage\n\n**Step 1:** Install plugin:\n\n```sh\nnpm install\
  \ --save-dev postcss postcss-dvh-vh-fallback\n```\n\n**Step 2:** Check you project for existed PostCSS\
  \ config: `postcss.config.js`\nin the project root, `\"postcss\"` section in `package.json`\nor `postcss`\
  \ in bundle config.\n\nIf you do not use PostCSS, add it according to [official docs]\nand set this\
  \ plugin in settings.\n\n**Step 3:** Add the plugin to plugins list:\n\n```diff\nmodule.exports = {\n\
  \  plugins: [\n+   require('postcss-dvh-vh-fallback'),\n    require('autoprefixer')\n  ]\n}\n```\n\n\
  [official docs]: https://github.com/postcss/postcss#usage\n"

readme_excerpt: "# Anatomical Variation Modeling for Radiation Therapy\n\nThis repository contains **data\
  \ and code** for training and testing generative models that predict anatomical variations across radiation\
  \ therapy fractions, along with their impact on 3D dose distributions.\n\n---\n\n## \U0001F4CB Repository\
  \ Overview\n\nThis project develops generative models to learn realistic anatomical changes that occur\
  \ during multi-fraction radiation therapy. The models are conditioned on first fraction CT scans and\
  \ generate plausible anatomical variants that match the distribution of real anatomical changes observed\
  \ in subsequent treatment fractions.\n\n---\n\n## \U0001F4C2 Repository Structure\n\n```\n.\n├── code\n\
  │     ├── ddf/                          # Dense Deformation Field approach\n│     ├── stable_diffusion/\
  \             # Stable Diffusion approach  \n│     ├── train_test_data_split.py      # Data preparation\
  \ script\n│     ├── data_dict.json                # Train/test/fold assignments\n│     └── README.md\
  \                     # readme\n├── data\n│     ├── CT/                           # Folder with patient\
  \ subfolders, each subfolder containing fraction CTs in nifty format \n│     ├── DOSE/             \
  \            # Folder with patient subfolders, each subfolder containing planned dose in nifty format\n\
  │     ├── STRUCTURES/                   # Folder with patient subfolders, each subfolder containing\
  \ segmented OARs and target\n│     ├── prepareFractionCT.py          # Script for converting DICOMS\
  \ to nifty\n│     ├── prostaty.txt                  # TXT file with target names used in our database\n\
  │     └── README.md                     # readme\n├── LICENSE                            # License statement\n\
  └── README.md                          # This file\n\n```\n\n## \U0001F680 Getting Started\n\n### Prerequisites\n\
  - Python 3.x\n- SimpleITK\n- PyTorch\n\n---\n\n## \U0001F511 Applications\n\nThis framework enables:\n\
  \n1. **Robust treatment planning**: Account for anatomical variations in dose optimization\n2. **Adaptive\
  \ radiotherapy**: Predict anatomical changes for plan adaptation\n3. **Uncertainty quantification**:\
  \ Quantify dose uncertainty due to anatomical variations\n4. **Quality assurance**: Validate delivered\
  \ dose against predicted variations\n5. **Research**: Study inter-fraction anatomical changes and their\
  \ dosimetric impact\n\n---\n\n## \U0001F4D6 Citation\n\nIf you use this code or data in your research,\
  \ please cite:\n\n```bibtex\n@article{your_paper,\n  title={Generative Models for Anatomical Variation\
  \ in Radiation Therapy},\n  author={},\n  journal={},\n  year={2026},\n  doi={}\n}\n```\n\n---\n\n##\
  \ \U0001F4DD License\n\nMIT\n\n---\n\n## ⚠️ Data Privacy\n\nThis repository structure is designed for\
  \ research purposes. When working with patient data:\n- Ensure all data is **de-identified** and compliant\
  \ with HIPAA/GDPR\n- Obtain appropriate **IRB approval** for your institution\n- Follow institutional\
  \ data sharing and privacy policies\n- Do not include identifiable patient information in public repositories\n\
  - **DICOM files must be anonymized** before conversion to NIfTI\n\n---\n\n## \U0001F91D Contributing\n\
  \nContributions are welcome! Areas for improvement:\n- Additional generative model architectures\n-\
  \ Enhanced uncertainty quantification methods\n- Integration with treatment planning systems\n- Validation\
  \ on additional datasets\n- Improved DICOM parsing for different vendors\n\nPlease open an issue or\
  \ submit a Pull Request.\n\n---\n\n## \U0001F4E7 Contact\n\nFor questions or collaborations, please\
  \ contact ztabor@agh.edu.pl\n"

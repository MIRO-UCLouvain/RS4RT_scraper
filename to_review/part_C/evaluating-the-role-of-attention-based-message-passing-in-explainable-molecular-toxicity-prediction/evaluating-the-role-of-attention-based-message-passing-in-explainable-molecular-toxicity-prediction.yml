  # Directory Description


  ## `models/`


  Contains the graph neural network architecture implementations.


  ```text

  models/

  ├── gcn.py

  ├── gat.py

  └── resgat.py

  ```


  ---


  ## `utils/`


  Contains reusable utilities for:


  * Dataset loading

  * Scaffold splitting

  * Metric calculation

  * Random seed control

  * Loss functions

  * Explainability

  * Visualization

  * Molecular graph preprocessing


  ---


  ## `scripts/`


  Contains supporting scripts used for experiment processing, result generation, and analysis.


  ---


  ## `splits/`


  Contains the molecular dataset partitions used for the experiments.


  ```text

  splits/

  ├── tox21_scaffold_split.pkl

  └── tox21_split.pkl

  ```


  The scaffold split is retained to allow the same molecular partition to be reused across different models.


  ---


  ## `outputs/`


  Contains experiment-level outputs such as:


  * Prediction files

  * Endpoint-specific metrics

  * Seed-specific metrics

  * JSON result files


  ---


  ## `results/`


  Contains aggregated and processed experimental results used for analysis and manuscript preparation.


  ---


  ## `figures/`


  Contains generated visualizations used in the experimental analysis and manuscript.


  ---


  ## `logs/`


  Contains experiment and training logs.


  ---


  # Installation


  ## 1. Clone the repository


  Clone the repository from GitHub and enter the project directory:


  ```bash

  git clone <REPOSITORY-URL>


  cd Evaluating-the-Role-of-Attention-Based-Message-Passing-in-Explainable-Molecular-Toxicity-Prediction

  ```


  ---


  ## 2. Create the Conda environment


  The recommended environment is Python 3.10.


  ```bash

  conda env create -f environment.yml

  ```


  Activate the environment:


  ```bash

  conda activate tox21

  ```


  ---


  ## 3. Alternative installation using pip


  If the Conda environment file is not used, dependencies can be installed using:


  ```bash

  pip install -r requirements.txt

  ```



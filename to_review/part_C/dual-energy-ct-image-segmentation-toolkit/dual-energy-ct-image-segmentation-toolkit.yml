readme_excerpt: "# Dual-Energy CT (DECT) Image Segmentation Toolkit\n\nRepository to for CS-155 Algorithmic\
  \ Segmentation and CS-156 Implement Advanced Segmentation Solution.  \nContains 2 (+1 optimised version)\
  \ minimal spanning tree segmentations for greyscale CT images of real numbers and 2 connected-component\
  \ labelling algorithms for material ID uint8 files.  \n\n## Input data  \nGet the input folder from\
  \ the link below, unzip and put the folder (\"input/\") in the \"test\" folder  after git cloning (so\
  \ \"test/input/\"). This is necessary as the data is too large to upload to GitHub.  \nURL: https://flinders-my.sharepoint.com/:u:/g/personal/duns0089_flinders_edu_au/EesXhHx6lnVMiAvKEGI2UlUBbLlfCROKaK_QtE_k2UQDSw?e=sdEmWg\
  \  \n\n## System\n### Test Computer Specifications:\n![test comupter specifications](documentation/diagrams/test_system_specifications.png)\n\
  \nThe Meson Build System is also required, v0.61.2.  \nPython 3.10.4.  \n\n## Toolkit Architecture\n\
  See References to see sources of each algorithm  \n![toolkit architecture](documentation/diagrams/architecture.png)\n\
  \n## Running the toolkit\nThere a number of ways to run the toolkit. The easiest way is to use the *./run-test.sh*\
  \ file. This file contains a number of commented out lines that correspond to the the files that will\
  \ be segmented. The -r option means that minimal spanning tree segmentations will occur and need reconstruction\
  \ greyscale image. The non -r option requires a uintt_8 file with the material compounds look up table\
  \ specified as well.  \n\n## Test Results\nThese are the results from the thesis located in documention/.\
  \ \n\n![ccl results](documentation/diagrams/ccl_segmentation_times.png)\n\n![mst results](documentation/diagrams/mst_segmentation_times.png)\n\
  \n## References\nArbitary CCL: From https://ieeexplore.ieee.org/document/87344/ but algorithm better\
  \ explained in\nhttps://en.wikipedia.org/wiki/Connected-component_labeling#One_component_at_a_time \
  \ \nPlayne-Equivalence Parallel CUDA CCL: https://github.com/DanielPlayne/playne-equivalence-algorithm\
  \  \nFelzenszwalbMST by Motwani: https://iammohitm.github.io/Graph-Based-Image-Segmentation/  \nGanin\
  \ Parallel CUDA MST: https://developer.download.nvidia.com/GTC/PDF/GTC2012/Posters/P0496_Efficient_Segmentation_Trees_by_Ganin.pdf\
  \   \n"

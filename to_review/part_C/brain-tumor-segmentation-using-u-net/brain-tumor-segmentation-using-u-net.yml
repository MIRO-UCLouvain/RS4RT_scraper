readme_excerpt: "# \U0001F9E0 Brain Tumor Segmentation Using U‑Net\n\n\n## \U0001F4CC Overview\nThis project\
  \ implements a **U‑Net** convolutional neural network to automatically segment low‑grade gliomas (brain\
  \ tumors) from MRI scans.  \nThe model is trained on the public [LGG MRI Segmentation dataset](https://www.kaggle.com/datasets/mateuszbuda/lgg-mri-segmentation)\
  \ and achieves **85.8% Dice coefficient** on unseen test images.\n\n## \U0001F680 Features\n- **Interactive\
  \ web app** built with [Streamlit](https://streamlit.io/) – upload an MRI, get the predicted tumor mask\
  \ instantly.\n- **Data augmentation** (rotation, shift, zoom, flip) to improve generalization.\n- **Monitor\
  \ metrics** – Intersection over Union (IoU) and Dice coefficient (F1‑score).\n- **Pre‑trained model**\
  \ – ready to use for inference.\n\n## \U0001F4CA Dataset\n- **Source:** [LGG MRI Segmentation](https://www.kaggle.com/datasets/mateuszbuda/lgg-mri-segmentation)\
  \ (Kaggle)\n- **Content:** 3,929 brain MRI images + corresponding ground‑truth masks (tumor vs background)\n\
  - **Split:**  \n  - Training: 3,545 images  \n  - Validation: 187 images  \n  - Test: 197 images\n\n\
  ## \U0001F3D7️ Model Architecture\nThe U‑Net follows the classic encoder‑decoder design with skip connections:\n\
  \n| Encoder (down) | Decoder (up) |\n|----------------|---------------|\n| 64 → 128 → 256 → 512 → 1024\
  \ | 512 → 256 → 128 → 64 |\n| 2x Conv2D each level | 2x Conv2D each level |\n| MaxPooling (2×2) | Conv2DTranspose\
  \ (2×2) |\n| - | Concatenation with corresponding encoder feature maps |\n\nFinal layer: 1×1 convolution\
  \ + sigmoid activation.\n\n## \U0001F4C8 Results\n\n| Metric       | Validation | Test  |\n|--------------|------------|-------|\n\
  | **Dice**     | 0.8575     | 0.8575 |\n| **IoU**      | 0.7515     | 0.7515 |\n| **Loss** (binary cross‑entropy)\
  \ | 0.0037     | 0.0037 |\n\n## \U0001F6E0️ Local Installation & Usage\n\n1. **Clone the repository**\n\
  \   ```bash\n   git clone https://github.com/Jihed77/Brain-Tumor-Segmentation-Using-U-Net.git\n   cd\
  \ Brain-Tumor-Segmentation-Using-U-Net\n"

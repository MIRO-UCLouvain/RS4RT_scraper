readme_excerpt: "# PET_AC_sCT\n\n**Paper**:   Synthetic CT Generation via Variant Invertible Network for\
  \ Brain PET Attenuation Correction \n\n**Authors**:   Yu Guan, Bohui Shen, Shirui Jiang, Xinchong Shi,\
  \ Xiangsong Zhang, Bingxuan Li, Qiegen Liu*       \n \nIEEE Transactions on Radiation and Plasma Medical\
  \ Sciences    \n\nhttps://ieeexplore.ieee.org/document/10666843  \n\nDate : 9-September-2024  \nVersion\
  \ : 1.0  \nThe code and the algorithm are for non-comercial use only.  \nCopyright 2024, School of Mathematics\
  \ and Computer Sciences, Nanchang University.  \n\n# Abstract\nAttenuation correction (AC) is essential\
  \ for the generation of artifact-free and quan-titatively accurate positron emission tomography (PET)\
  \ images. Nowadays, deep-learning-based methods have been extensively applied to PET AC tasks, yielding\
  \ promising results. Therefore, this paper develops an innovative approach to generate continuously\
  \ valued CT images from non-attenuation corrected PET images for AC on brain PET imaging. Specifically,\
  \ an invertible neural network combined with the variable augmentation strategy that can achieve the\
  \ bidirectional inference processes is proposed for synthetic CT generation. On the one hand, invertible\
  \ architecture ensures a bijective mapping between the PET and synthetic CT image spaces, which can\
  \ potentially improve the robustness of the prediction and provide a way to validate the synthetic CT\
  \ by checking the consistency of the inverse mapping. On the other hand, the variable augmentation strategy\
  \ enriches the training process and leverages the intrinsic data properties more effectively. Therefore,\
  \ the combination provides for superior performance in PET AC by preserving information throughout the\
  \ network and by better handling of the data variability inherent PET AC. To evaluate the performance\
  \ of the proposed algorithm, we conducted a comprehensive study on a total of 1480 2D slices from 37\
  \ whole-body 18F-FDG clinical patients using comparative algorithms (such as Cycle-GAN and Pix2pix).\
  \ Perceptual analysis and quantitative evaluations illustrate that the invertible network for PET AC\
  \ outperforms other existing AC models, which demonstrates the feasibility of achieving brain PET AC\
  \ without additional anatomical information.\n\n\n## Graphical representation\n <div align=\"center\"\
  ><img src=\"https://github.com/yqx7150/PET_AC_sCT/blob/main/samples/figure 1.png\" width = \"800\" height\
  \ = \"500\">  </div>\n The schematic flow diagram of the proposed method. The training phase is first\
  \ performed with NAC PET and reference CT images, after which the well-trained network is fixed and\
  \ ready for generating synthetic CT images for new PET data in the reconstruction phase.\n \n\n<div\
  \ align=\"center\"><img src=\"https://github.com/yqx7150/PET_AC_sCT/blob/main/samples/Fig 3.png\" width\
  \ = \"800\" height = \"500\"> </div>\n The pipeline of IVNAC. Invertible model is composed of both forward\
  \ and inverse process. We illustrate the details of the invertible block on the bottom. s , t and r\
  \ are transformations defined in the bijective functions.\n\n\n## Training Demo\n```bash\npython train_lr.py\
  \ --task=1to1 --out_path=\"./results/new_exp/\" --root2='./data_for_training/pet_mat' --root3='./data_for_training/pet_mat'\
  \ --root1='./data_for_training/ct_mat'\n```\n## Test Demo\n```bash\npython test.py --task=1to1 --out_path=\"\
  ./results/exp/\" --root2='./data_for_test/pet_mat' --root3='./data_for_test/pet_mat' --root1='./data_for_test/ct_mat'\
  \ --ckpt=\"./results/exp/1to1/checkpoint/0028.pth\"\n```\n## Checkpoints\nWe provide a pretrained checkpoint.\
  \ You can run the above command to use the pretrained model directly\n\n\n## Synthetic CT Generation\
  \ and Evaluation\n<div align=\"center\"><img src=\"https://github.com/yqx7150/PET_AC_sCT/blob/main/samples/figure\
  \ 5.png\" width = \"800\" height = \"1000\"> </div>\n Examples of synthetic CT image on a patient’s\
  \ brain. Five columns from left to right are NAC-PET, reference-CT, Cycle-GAN-CT, Pix2pix-CT and IVNAC-CT,\
  \ respectively. The second row shows the difference images between the reference CT and the synthetic\
  \ CT.\n\n\n## Synthetic CT to PET Attenuation Correction\n<div align=\"center\"><img src=\"https://github.com/yqx7150/PET_AC_sCT/blob/main/samples/figure\
  \ 6.png\" width = \"800\" height = \"1000\"> </div>\n PET data reconstructed with reference and generated\
  \ synthesized CT images alongside their voxel-wise difference map. Five columns from left to right are\
  \ reference-CT, AC-PET, Cycle-GAN-PET, Pix2pix-PET and IVNAC-PET, respectively.\n\n\n<div align=\"center\"\
  ><img src=\"https://github.com/yqx7150/PET_AC_sCT/blob/main/samples/figure 7.png\" width = \"800\" height\
  \ = \"420\"> </div>\n Unique example of PET data reconstructed with reference and generated synthesized\
  \ CT images alongside their voxel-wise difference map. Red arrows indicate region with relatively obvious\
  \ details and textures and the intensity of residual maps is two times magnified.\n\n\n### Other Related\
  \ Projects\n<div align=\"center\"><img src=\"https://github.com/yqx7150/PET_AC_sCT/blob/main/samples/algorithm-overview.png\"\

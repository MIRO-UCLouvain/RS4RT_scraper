readme_excerpt: "# GBM-DIR-QA\nDataset of glioblastoma patient MRI images with blood vessel bifurcation\
  \ landmarks for deformable image registration (DIR) quality assurance.\n\n\n\n<img width=\"400\"  alt=\"\
  pre_operative_landmarks\" src=\"Images/pre_operative_landmarks.png\" /> <img width=\"400\"  alt=\"post_recurrence_landmarks\"\
  \ src=\"Images/post_recurrence_landmarks.png\" />\n\n\n## Dataset Overview\nThis dataset contains imaging\
  \ data from 61 different glioblastoma patients from Duke University Hospital, with a high number of\
  \ vessel bifurcation landmark pairs identified between the pre-operative and post-recurrence scans for\
  \ each patient. These landmarks can be used for DIR algorithm validation and quality assurance.\n\n\n\
  We hope to publish the results of this study in a dataset article. Due to the size of the image files,\
  \ the full dataset is saved on our publicly available Zenodo repository at []. For guidance on visualizing\
  \ and using the dataset, please see the tutorial folder in this GitHub for more information.\n\n## Landmark\
  \ Identification\nLandmarks were identified using a semi-automatic pathway visualized below. The pathway\
  \ was applied to the pre-operative and post-recurrence scan of a GBM patient, where recurrence was identified\
  \ via the volumetric change of the enhancing tumor or clinical progression as determined by a radiologist.\
  \ If the tumor volume in a scan increased by more than 40% from the post-operative tumor nadir, then\
  \ that scan was identified as the \"post-recurrence\" session.\n\n<img width=\"919\" height=\"615\"\
  \ alt=\"GBM_dataset_processing\" src=\"Images/GBM_dataset_processing.png\" />\n\nThe full description\
  \ of this data processing pathway will be included in a future dataset publication. \n\n## Use of Dataset\n\
  ### Dataset Organization\nThe dataset, available on zenodo, includes skull-stripped MRI images for each\
  \ patient, resampled to an isotropic voxelsize of 1mm, and co-registered to the Montreal Neurological\
  \ Institute brain atlas for FOV standardization. The images are saved in NIfTI format. Landmark data\
  \ is included for the baseline and recurrence scans for each patient. These are labeled in the folder\
  \ of each patient as \"Scanx_preoperative\" and \"Scany_recurrence\", where x and y are the pre-operative\
  \ and recurrence scans, respectively. The landmark positions are saved as csv files in the folder for\
  \ each patient as positive voxel indices, set to start at [0,0,0]. So, the landmark [100,90,80] corresponds\
  \ to the 101st sagittal-plane, 91st coronal-plane, and 81st axial-plane slice. Since the images have\
  \ been resampled and coregistered, the landmarks can be used for all scan types (T1, T2, T1-c, etc).\
  \ The dataset also includes a tumor segmentation mask generated with a nnUNet segmentation software\
  \ described in \"Development and Evaluation of Automated Artificial Intelligence–Based Brain Tumor Response\
  \ Assessment in Patients with Glioblastoma\" (Zhang et al). In these segmentations, the labels are as\
  \ follows:\n\n1: Necrotic Tumor Core\n\n2: Nonenhancing T2-FLAIR signal abnormality \n\n3: Enhancing\
  \ Tumor\n\n4: Resection Cavity\n\nNote: Although the images for each scanning session have been coregistered,\
  \ separate scanning sessions have not been. For the most accurate DIR, it is recommended that the scanning\
  \ sessions for each patient be coregistered via rigid or affine registration first. Be sure to apply\
  \ said transformation to the landmarks as well before downstream applications.\n\n\n\n### Additional\
  \ Patient Data \nAdditional data for each patient including scan dates, patient demographics, treatment\
  \ information, dates of clinical progression, and more are tabulated in the csv files published alongside\
  \ the dataset in zenodo. To ensure anonyminity, all dates are set relative to the first scan date available\
  \ for each patient. All dates were automatically extracted from exam and report dates of patient charts,\
  \ and may be imperfect or offset by a few days in some cases. It was not within the current study's\
  \ scope to individually validate every date included in the dataset.\n\n\n### Visualizing Landmarks\n\
  For those interested in looking at the landmark pairs available in this dataset, we recommend the use\
  \ of MatchGui (Deshan Yang, 2017). MatchGui is a Matlab based tool, and allows the user to load two\
  \ images as well as the landmark pair locations for each the selected image. In this way, users can\
  \ visualize each landmark pair invidually and can decide if the dataset is right for their purposes.\
  \ There are also functions allowing the user to flag certain landmarks and adjust them if they feel\
  \ necessary.\n\n<img width=\"1907\" height=\"948\" alt=\"image\" src=\"Images/matchgui_interface2.png\"\
  \ />\n\n\nA screenshot from the MatchGUI interface showing a landmark pair from the dataset.\n\nFor\
  \ more extensive instructions on how to use matchgui, please refer to the tutorial folder in our Github.\n\
  \n### Citing\nThe results of this study are publicly available for use in DIR algorithm verification.\
  \ We hope to publish the data described in this repository in a dataset article in the future. \n\n\
  If you have any further questions about the dataset, please reach out to us at teddy.criscuolo@duke.edu.\
  \ Thank you!\n\n"

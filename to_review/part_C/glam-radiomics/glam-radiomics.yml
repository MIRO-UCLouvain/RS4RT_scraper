readme_excerpt: "# GRAY LEVEL AFFINITY METRICS - GLAM RADIOMICS [![Documentation Status](https://readthedocs.org/projects/glam-radiomics/badge/?version=latest)](https://glam-radiomics.readthedocs.io/en/latest/index.html)\n\
  \nThis project introduces and implements a novel class of quantitative imaging features, termed Gray\
  \ Level Affinity Metrics (GLAM), derived from the foundational principles of statistical mechanics.\
  \ By treating image voxels as interacting particles within a multi-component system, the GLAM framework\
  \ provides a set of physically interpretable metrics that characterize the spatial organization and\
  \ texture of 3D medical images.\n\nThe GLAM framework is written in Python and leverages high-performance\
  \ libraries for medical image analysis. It operates as a fully standalone extraction engine, meaning\
  \ it does not require external radiomics packages to compute conventional texture matrices.\n\n## Citation\n\
  \nIf you use the GLAM framework in your research, please cite our paper:\n\n> **Physics-Informed Multiscale\
  \ Decoding of Tissue Microstructure: The Gray Level Affinity Metrics (GLAM) Framework**\n> * Journal\
  \ of Imaging Informatics in Medicine (2026)*\n* https://doi.org/10.1007/s10278-026-02132-6 \n* https://link.springer.com/article/10.1007/s10278-026-02132-6\n\
  > \n## Installing from GitHub\n\nYou can install GLAM-radiomics using the following command:\n```Plaintext\n\
  pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ glam-radiomics\n\
  ```\nor\n```Plaintext\npip install glam-radiomics\n```\nNote: This release (v1.5.2) was successfully\
  \ built and tested using Python 3.12.10 and NumPy 2.3.2.\n\nGPU Acceleration (Optional but Recommended):\
  \ > GLAM features automatic GPU-accelerated matrix batching for massive speed improvements. To enable\
  \ this, you must install CuPy. It is highly recommended to install the pre-compiled binary wheel that\
  \ matches your system's NVIDIA CUDA version (e.g., pip install cupy-cuda12x) rather than running pip\
  \ install cupy, which requires a complex C++ build environment and can cause installation failures.\n\
  \n### Key Dependencies\nWhen you install GLAM, the following core libraries are automatically integrated:\n\
  * **NumPy & SciPy**: Provide the computational backbone for RDF calculations, spatial KD-trees, and\
  \ Statistical Mechanics descriptors.\n* **SimpleITK**: Handles the loading and normalization of 3D medical\
  \ imaging formats like NIfTI (`.nii.gz`).\n* **Pandas**: Manages the structured output of multiscale\
  \ Radial Distribution Functions and feature aggregation.\n* **Scikit-image & Scikit-learn**: Powers\
  \ the morphological marching cubes (surface area), K-Means clustering, and advanced geometric descriptors.\n\
  * **tqdm**: Used to display progress bars during long-running feature extraction operations.\n\n## Usage\
  \ Guide\n\n### Configuration (config.ini)\nGLAM uses a `.ini` file to standardize extraction parameters\
  \ across different datasets. This ensures reproducibility, which is critical for multi-center studies.\n\
  \nA typical configuration file is structured as follows:\n\n```ini\n# Note: configparser keys are case-insensitive,\
  \ but values preserve case.\n\n[System]\n# Number of parallel patient folders to process simultaneously.\n\
  # CRITICAL: If using GPU Acceleration (CuPy), this dictates how many \n# matrices are loaded into VRAM.\
  \ \n# For NumWorkers = 1, the system requires a 4–6 core CPU and a 4 GB GPU\nNumWorkers = 1\n\n[GLAM_Settings]\n\
  MaxRdfRadius = 100\nAnisotropyCutoffRadius = 5\nMaxLocalShellRadius = 30\nNumRandomisations = 4\nRdfSamplePoints\
  \ = 1000\n\n# QuantizationMethod can be \"FixedCount\" (for MRI) or \"FixedWidth\" (for CT)\nQuantizationMethod\
  \ = FixedCount\n\n# --- FixedCount Parameters ---\nNumGrayLevels = 24\n\n# --- FixedWidth Parameters\
  \ ---\nBinWidth = 25\nQuantizationMin = -1000\nQuantizationMax = 1000\n\n[File_Naming]\n# Segmentation\
  \ file identifiers.\nMaskIdentifiers = [\"_seg.nii.gz\", \"-seg.nii.gz\", \"_mask.nii.gz\", \"-mask.nii.gz\"\
  ]\n\nSequenceIdentifiers = {\n    \"FLAIR\": [\"_flair\", \"-flair\"],\n    \"T2\": [\"_t2\", \"-t2\"\
  ],\n    \"T1\": [\"_t1\", \"-t1\"],\n    \"T1c\": [\"_t1ce\", \"-t1ce\", \"_t1gd\", \"-t1gd\", \"_t1c\"\
  , \"-t1c\"]\n    }\n\n[Label_Mapping]\n# JSON keys need to be strings (\"1\", \"99\").\nLabelMapping\
  \ = {\n    \"1\": \"Enhancing_Tumor\",\n    \"2\": \"Non_Enhancing_Tumor_Core\",\n    \"4\": \"Peritumoral_Edema\"\
  ,\n    \"99\": \"Whole_Tumor\"\n    }\n\n# Available habitats you can swap in:\n# \"1\": \"Enhancing_Tumor\"\
  \n# \"1+2\": \"Tumor_Core\",\n# \"1+4\": \"Enhancing_and_Edema\"\n# \"99\": \"Whole_Tumor\"\n\nLabelsForAnalysis\
  \ = {\n    \"1\": \"Enhancing_Tumor\"\n    \"1+2\": \"Tumor_Core\",\n    \"1+4\": \"Enhancing_and_Edema\"\
  \n    \"99\": \"Whole_Tumor\"\n    }\n\n[Algorithm_Parameters]\nSavgolWindow = 7\nSavgolPoly = 3\nPeakProminence\
  \ = 4\n```\n\n### Basic Extraction Script\nThe following script demonstrates how to initialize the global\
  \ configuration and process a cohort of scans.\n\n```python\nimport os\nfrom glam_radiomics.config import\
  \ load_config\nfrom glam_radiomics.run import process_scans\n\n# 1. Define your project paths\nCONFIG_PATH\
  \ = \"path_to/config.ini\"\nINPUT_DIR = \"path_to/mri_scans\"\nOUTPUT_DIR = \"path_to/results\"\nPROJECT_NAME\
  \ = \"My_GLAM_Project\"\n\ndef main():\n    # 2. Load the configuration globally\n    load_config(CONFIG_PATH)\n\
  \n    # 3. Ensure the output directory exists\n    if not os.path.exists(OUTPUT_DIR):\n        os.makedirs(OUTPUT_DIR)\n\
  \n    # 4. Execute the analysis\n    process_scans(\n        INPUT_DIR,\n        OUTPUT_DIR,\n     \
  \   project_name=PROJECT_NAME,\n        config_path=CONFIG_PATH\n    )\n\nif __name__ == '__main__':\n\
  \    main()\n```\n\n### Batch Processing Multiple Scans\nFor multi-center studies or large cohorts,\
  \ you can configure a script to loop through multiple project directories. This approach utilizes parallel\
  \ processing defined by NumWorkers in your config.ini.\n\n```python\nimport os\nfrom glam_radiomics.config\
  \ import load_config\nfrom glam_radiomics.run import process_scans\n\nCONFIG_PATH = \"path/to/config.ini\"\
  \n\n# Define project batches (Project Name, Input, Output)\nprojects_to_run = [\n    (\"Cohort_A\",\
  \ \"C:/data/cohort_a_scans\", \"C:/results/cohort_a\"),\n    (\"Cohort_B\", \"C:/data/cohort_b_scans\"\
  , \"C:/results/cohort_b\")\n]\n\ndef main():\n    load_config(CONFIG_PATH)\n\n    for proj_name, input_path,\
  \ output_path in projects_to_run:\n        if not os.path.exists(output_path):\n            os.makedirs(output_path)\n\
  \n        process_scans(input_path, output_path,\n                      project_name=proj_name,\n  \
  \                    config_path=CONFIG_PATH)\n\nif __name__ == '__main__':\n    main()\n```\n\n###\
  \ File and Folder Organization\nTo ensure the pipeline pairs the correct masks with the correct sequences,\
  \ structure your input directory as follows:\n\n```Plaintext\nC:\\...\\Research\\GLAM\\scans\\   <--\
  \ Your 'INPUT_DIR'\n├── PT011901\\\n│   ├── PT011901_t1.nii.gz\n│   ├── PT011901_t2.nii.gz\n│   └──\
  \ PT011901_mask.nii.gz\n├── PT011902\\\n│   ├── PT011902_t1.nii.gz\n│   ├── PT011902_flair.nii.gz\n\
  │   └── PT011902_seg.nii.gz\n└── ...\n```\n\n\n"

readme_excerpt: "# Towards Computer-Aided Assessment of Lumbar Disc Degeneration Based on Radiomics\n\n\
  ## Authors\nAlejandro Mora-Rubio¹ [<img src=\"https://orcid.org/sites/default/files/images/orcid_16x16.png\"\
  \ \nalt=\"ORCID logo\" width=\"16\" height=\"16\" />](https://orcid.org/0000-0001-6012-8645), \nJesús\
  \ Alejandro Alzate-Grizales¹ [<img src=\"https://orcid.org/sites/default/files/images/orcid_16x16.png\"\
  \ \nalt=\"ORCID logo\" width=\"16\" height=\"16\" />](https://orcid.org/0000-0003-1021-2050), \nJoaquim\
  \ Montell Serrano¹ [<img src=\"https://orcid.org/sites/default/files/images/orcid_16x16.png\" \nalt=\"\
  ORCID logo\" width=\"16\" height=\"16\" />](https://orcid.org/0000-0002-5597-7236), \nCarlos Mayor-deJuan²,\
  \ \nRafael Llombart Blanco² [<img src=\"https://orcid.org/sites/default/files/images/orcid_16x16.png\"\
  \ \nalt=\"ORCID logo\" width=\"16\" height=\"16\" />](https://orcid.org/0000-0002-8790-0428), \nMariola\
  \ Penadés Fons³ [<img src=\"https://orcid.org/sites/default/files/images/orcid_16x16.png\" \nalt=\"\
  ORCID logo\" width=\"16\" height=\"16\" />](https://orcid.org/0000-0002-7299-7802), and \nMaria de la\
  \ Iglesia-Vayá¹³ [<img src=\"https://orcid.org/sites/default/files/images/orcid_16x16.png\" \nalt=\"\
  ORCID logo\" width=\"16\" height=\"16\" />](https://orcid.org/0000-0003-4505-8399)\n\n¹ Unidad Mixta\
  \ de Imagen Biomédica FISABIO-CIPF, Fundación para el Fomento de la Investigación Sanitario y Biomédica\
  \ de la Comunidad Valenciana, Valencia, Spain \n\n² Clínica Universidad de Navarra, Pamplona, Spain\n\
  \n³ Dirección General de Investigación e Innovación, Conselleria de Sanitat, Valencia, Spain\n\n## Abstract\n\
  Intervertebral disc degeneration (IDD) is a common age-related condition characterized by structural\
  \ alterations and functional impairment of intervertebral discs, leading to various symptoms such as\
  \ back and neck pain. The Pfirrmann grading system is commonly used for assessing IDD severity based\
  \ on Magnetic Resonance Imaging (MRI) findings. However, this method is only qualitative, resulting\
  \ in high inter-rater variability, and also time-consuming. In this study, we aimed to develop a machine\
  \ learning model to automate Pfirrmann grade classification of IDD using quantitative radiomic features\
  \ extracted from MRI scans. We retrospectively collected 717 MRI scans, which were manually labeled\
  \ by an expert radiologist. The extracted features were utilized to train different classifiers, achieving\
  \ for the 5 level grading task an average accuracy of 71\\%, F1 score of 70\\%, and without any disc\
  \ being graded outside a $\\pm1$ margin. Our findings demonstrate the potential of radiomics and machine\
  \ learning to automate IDD assessment, reduce inter-rater variability, improve clinical efficiency,\
  \ and support more accurate diagnoses and personalized treatment plans.\n\n## About this repo\n1. `figures`:\
  \ visual outputs or graphs related to the radiomics analysis.\n2. `notebooks`: contains Jupyter Notebooks,\
  \ used during the experimentation phase.\n    - `pyradiomics` refers to the feature extraction process.\n\
  \    - `radiomics-analysis` contains the whole machine learning pipeline, from EDA to results evaluation.\n\
  \    - `cv-analysis` [UNDER DEVELOPMENT] refers to preliminary experiments on IDD classification using\
  \ Computer Vision.\n3. Source (`src`): contains the final Python scripts.\n    - `radiomics/calculate`\
  \ executes the feature extraction process using the provided `Params.yaml` congfiguration file.\n  \
  \  - `ml/test_multiple_models` evaluates a suite of machine learning models for each experiment.\n \
  \   - `ml/random_search` evaluates different parameter combinations for the best model for each experiment.\n\
  \    - `ml/compute_metrics` evaluates the best performing model for each experiment using cross-validation.\n\
  \    - `ml/transforms` and `ml/utils` contain helper functions for data import and preprocessing.\n\n\
  ## Publication\n\n\n### Cite as\n"

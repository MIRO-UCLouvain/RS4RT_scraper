readme_excerpt: '# Learning-Molecular-Fingerprints-with-Graph-Neural-Networks-in-DeepChem

  Uses DeepChem graph neural networks to learn molecular fingerprints directly from molecular graphs.
  Atoms and bonds form a graph; the GNN outputs a dense vector per molecule for tasks like toxicity prediction
  and virtual screening


  # DeepChem Graph Neural Network Fingerprints (Tox21)


  This project trains a Graph Convolutional Network (GNN) using **DeepChem** on the **Tox21** dataset
  and exports the learned molecular fingerprints (graph embeddings) for each molecule.


  ## Features


  - Uses `dc.molnet.load_tox21(featurizer="GraphConv")` to featurize molecules as graphs.

  - Trains `GraphConvModel` (PyTorch backend) for multi-task toxicity prediction.

  - Evaluates performance with mean ROC-AUC.

  - Extracts learned neural fingerprints via `model.predict_embedding(...)`.

  - Saves embeddings + SMILES for train/valid/test to CSV.


  ## Installation


  ```bash

  git clone <your-repo-url>.git

  cd deepchem-gnn-fingerprints


  python -m venv .venv

  source .venv/bin/activate  # Windows: .venv\Scripts\activate


  pip install -r requirements.txt

  ```


  If RDKit from pip fails, install it via conda:


  ```bash

  conda install -c conda-forge rdkit

  ```


  ## Usage


  ```bash

  python train.py

  ```


  Artifacts (metrics + fingerprint CSV files) will be saved in the `artifacts/` directory:


  - `tox21_train_graphconv_fingerprints.csv`

  - `tox21_valid_graphconv_fingerprints.csv`

  - `tox21_test_graphconv_fingerprints.csv`


  Each CSV contains:


  - `smiles`: original molecule SMILES

  - `f0, f1, ..., fD`: learned fingerprint components


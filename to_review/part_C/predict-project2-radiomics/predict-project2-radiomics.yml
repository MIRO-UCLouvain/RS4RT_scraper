readme_excerpt: "# PrediCT Project 2: Radiomics & Phenotyping\n\n## Overview\nThis repository contains\
  \ the complete pipeline for **Project 2 of PrediCT GSoC 2026**. The goal is to extract radiomics features\
  \ from COCA cardiac CT scans and correlate them with **coronary calcium severity** (Agatston scores).\n\
  \nThe project is divided into two main stages:\n1. **Preprocessing & Feature Extraction**\n2. **Analysis\
  \ & Visualization**\n\n\n## Instructions\n\n1. Install the required Python packages (if not already\
  \ installed):\n```bash\npip install pyradiomics pydicom SimpleITK pandas numpy matplotlib seaborn scikit-learn\
  \ \n```\n\n2. Place your COCA scans and masks in a folder of your choice (path should match notebooks).\n\
  3. Run 1_preprocessing_and_feature_extraction.ipynb first to extract radiomics features.\n4. Run 2_analysis_and_visualization.ipynb\
  \ to calculate Agatston scores, perform statistical analysis, and generate visualizations.\n\nFeatures\
  \ Extracted\n- Shape: Sphericity, Surface Volume Ratio, Maximum 3D Diameter\n- GLCM: Contrast, Correlation,\
  \ Inverse Difference Moment\n- GLSZM: Small Area Emphasis, Large Area Emphasis, Zone Percentage\n- GLRLM:\
  \ Short Run Emphasis, Long Run Emphasis, Run Percentage\n\nAnalysis Performed:\n\n- Correlation of radiomics\
  \ features with Agatston scores using Spearman correlation\n- Comparison across Agatston score categories\
  \ using Kruskal-Wallis test\n- Visualizations: heatmaps, scatter plots, and optional t-SNE/UMAP for\
  \ phenotype clustering (2_analysis_and_visualization.ipynb)\n\nNotes:\n\n1. The radiomics_features_final.csv\
  \ contains all extracted features along with Agatston scores for each scan.\n2. All visualizations are\
  \ contained within 2_analysis_and_visualization.ipynb.\n\n"

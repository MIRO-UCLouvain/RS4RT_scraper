  \ \n[![Hugging Face](https://img.shields.io/badge/\U0001F917%20Hugging%20Face-IMPACT-orange)](https://huggingface.co/datasets/VBoussot/synthrad2025-impact-registration)\n\
  \n# SynthRAD2025 – Task 1 (\U0001F949 3rd place)\n\nThis repository provides everything needed to build\
  \ the Docker image and reproduce our solution ranked **3rd** in the **SynthRAD 2025 – Task 1** challenge\
  \ on synthetic CT generation from MRI.\n\nOur approach is based on a **2.5D U-Net++** with a ResNet-34\
  \ encoder, trained in two phases:\n- Phase 1: joint pretraining on all anatomical regions (AB, TH, HN)\n\
  - Phase 2: fine-tuning separately on **AB-TH** and **HN**\n\nThe method was implemented using [KonfAI](https://github.com/vboussot/KonfAI),\
  \ our modular deep learning framework. Training combines pixel-wise L1 loss with **perceptual losses**\
  \ derived from **SAM** features.\n\nFinal predictions use **test-time augmentation** and **5-fold ensembling**,\
  \ with a total of **10 models**:  \n**5 trained for Abdomen/Thorax (AB-TH)** and **5 for Head & Neck\
  \ (HN)**.  \nModels were selected based on validation MAE.\n\n\U0001F3C6 **3rd place overall**\n(Related\
  \ leaderboard: [SynthRAD Task 1 leaderboard](https://synthrad2025.grand-challenge.org/evaluation/test-task-1-mri/leaderboard/))\n\
  \n| Rank | MAE ↓             | PSNR ↑            | MS-SSIM ↑        | DICE ↑           | HD95 ↓    \
  \       | Dose MAE photon ↓ | Dose MAE proton ↓ | DVH error photon ↓ | DVH error proton ↓ | GPR 2mm/2%\
  \ photon ↑ | GPR 2mm/2% proton ↑ |\n|------|-------------------|-------------------|------------------|------------------|------------------|-------------------|-------------------|---------------------|---------------------|----------------------|----------------------|\n\
  | 3    | 67.241 ± 22.874 (3)| 29.957 ± 2.658 (2)| 0.935 ± 0.046 (2)| 0.737 ± 0.117 (4)| 7.512 ± 4.070\
  \ (4)| 0.006 ± 0.009 (3) | 0.027 ± 0.067 (5) | 0.013 ± 0.031 (3)   | 0.067 ± 0.031 (3)   | 98.880 ±\
  \ 4.556 (1)   | 82.191 ± 10.164 (3)  |\n\n---\n\n## \U0001F4D0 Registration (IMPACT vs Baseline)\n\n\
  Accurate sCT synthesis depends on good **inter-modal alignment**. We provide **precomputed IMPACT registrations**\
  \ (MR↔CT and CBCT↔CT) to ensure consistent training/evaluation.\n\n### IMPACT setup used in this work\n\
  The following IMPACT configuration was used for **Task 1 (MR→CT synthesis)**:\n- **Feature extractor:**\
  \ TS/M730  \n- **Layers:** 7-Layers (**high-level features**)  \n- **Mode:** **Static** + **MIND** \
  \ \n- **Multi-resolution:** 3-level pyramid  \n- **Final B-spline grid spacing:** **10 mm**\n\n### Why\
  \ it matters\n\n- \U0001F9ED **Alignment quality drives supervised sCT performance**\n- \U0001F9E9 **IMPACT**\
  \ → better anatomical alignment than **Elastix-MI**\n  - Local set (75 pts): **MAE 63.37 → 60.28 HU**,\
  \ ↑ PSNR / ↑ SSIM  \n  - Sharper, more realistic CTs\n- \U0001F4CA Public set (148 pts): **Elastix-MI\
  \ lower MAE (68.20 vs 75.82 HU)**  \n  → due to **pipeline bias** (leaderboard uses Elastix registrations)\n\
  \n\n### Get the registrations\n- \U0001F449 **Hugging Face (prealigned pairs):** https://huggingface.co/datasets/VBoussot/synthrad2025-impact-registration\n\
  \n---\n\n## \U0001F680 Inference instructions\n\nFor more implementation details and a minimal working\
  \ example, see the KonfAI synthesis example:  \nhttps://github.com/vboussot/KonfAI/tree/main/examples/Synthesis\n\
  \n### 1. Install KonfAI\n\n```bash\npip install konfai[itk]==1.5.9\n```\n\n---\n\n### 2. Download pretrained\
  \ weights\n\nDownload the pretrained models from Hugging Face:\n\n\U0001F449 https://huggingface.co/VBoussot/Synthrad2025\n\
  \nYou should obtain:\n\n```\nTask_1/\n├── AB-TH/\n│   ├── CV_0.pt\n│   ├── CV_1.pt\n│   ├── CV_2.pt\n\
  │   ├── CV_3.pt\n│   ├── CV_4.pt\n│   └── Prediction.yml\n│\n└── HN/\n    ├── CV_0.pt\n    ├── CV_1.pt\n\
  \    ├── CV_2.pt\n    ├── CV_3.pt\n    ├── CV_4.pt\n    └── Prediction.yml\n```\n\n---\n\n### 3. Dataset\
  \ structure\n\nYour dataset should be structured as follows:\n\n```\n./Dataset/\n├── AB/\n│   ├── 1ABA002/\n\
  │   │   ├── MR.mha\n│   │   └── MASK.mha\n│   ├── 1ABA003/\n│   │   ├── MR.mha\n│   │   └── MASK.mha\n\
  │   └── ...\n├── TH/\n│   └── ...\n├── HN/\n│   ├── 1HNA001/\n│   │   ├── MR.mha\n│   │   └── MASK.mha\n\
  │   └── ...\n```\n\n### 4. Run inference\n\nCopy `UNetpp.py` and `UnNormalize.py` next to your working\
  \ directory — the prediction config\nreferences them through the `UNetpp:` and `UnNormalize:` classpaths:\n\
  \n```bash\ncp KonfAI/UNetpp.py KonfAI/UnNormalize.py .\n```\n\nYour directory should then look like\
  \ this:\n\n    .\n    ├── Dataset/\n    ├── Task_1/            # weights + Prediction.yml (from Hugging\
  \ Face)\n    ├── UNetpp.py\n    └── UnNormalize.py\n\n**AB-TH example:**\n\n```bash\nkonfai PREDICTION\
  \ -y --gpu 0 \\\n  --config Task_1/AB-TH/Prediction.yml \\\n  --models Task_1/AB-TH/CV_0.pt Task_1/AB-TH/CV_1.pt\
  \ Task_1/AB-TH/CV_2.pt Task_1/AB-TH/CV_3.pt Task_1/AB-TH/CV_4.pt\n```\n\nFor **Head & Neck**, use the\
  \ HN config and weights:\n\n```bash\nkonfai PREDICTION -y --gpu 0 \\\n  --config Task_1/HN/Prediction.yml\
  \ \\\n  --models Task_1/HN/CV_0.pt Task_1/HN/CV_1.pt Task_1/HN/CV_2.pt Task_1/HN/CV_3.pt Task_1/HN/CV_4.pt\n\
  ```\n\nPredictions are written to `./Predictions/Out/Dataset/<case>/sCT.mha`.\n\n> The Docker pipeline\
  \ (`run.py`) performs exactly these steps automatically, routing each case to the\n> AB-TH or HN model\
  \ family based on the anatomical region.\n\n---\n## \U0001F6E0️ How to Reproduce Training\n\n> Training\
  \ additionally requires TensorBoard: `pip install konfai[itk,tensorboard]==1.5.9`.\n> The perceptual\
  \ loss is `SAM_Perceptual` (SAM2.1 features); the `Statistics` transform on the CT\n> target group feeds\
  \ it the required intensity statistics.\n\nTraining is performed in **two phases**:\n\n---\n\n### \U0001F539\
  \ Phase 1 — Pretraining on all regions\n\nTrain a generic model on the full dataset (AB, TH, HN combined)\
  \ (Fold 0 example):\n\n```bash\nkonfai TRAIN -y --gpu 0 --config KonfAI/Plan/Phase_1/Config0.yml\n```\n\
  \n---\n\n### \U0001F539 Phase 2 — Region-specific fine-tuning\n\nFine-tune the Phase 1 model separately\
  \ for each anatomical region.\n\n#### Abdomen/Thorax (AB-TH) — Fold 0 example:\n\n```bash\nkonfai RESUME\
  \ -y --gpu 0 \\\n  --config KonfAI/Plan/Phase_2/AB-TH/Config0.yml \\\n  --model Phase1.pt\n```\n\n####\
  \ Head & Neck (HN) — Fold 0 example:\n\n```bash\nkonfai RESUME -y --gpu 0 \\\n  --config KonfAI/Plan/Phase_2/HN/Config0.yml\
  \ \\\n  --model Phase1.pt\n```\n\n> Replace `Phase1.pt` with the checkpoint from Phase 1 (best model\
  \ from Fold 0).\n\n## \U0001F4CC Poster presented at MICCAI 2025, Daejeon\n\n[![Poster](./MICCAI_POSTER.png)](./MICCAI_POSTER.pdf)\n"

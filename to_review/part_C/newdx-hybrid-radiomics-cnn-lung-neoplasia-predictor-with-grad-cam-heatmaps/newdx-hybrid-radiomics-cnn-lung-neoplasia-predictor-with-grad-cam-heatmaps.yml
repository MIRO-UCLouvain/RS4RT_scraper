readme_excerpt: "# NewDx: Deep CNN + Grad-CAM Generative Heatmaps + Predictive Radiomics for Lung Cancer\
  \ CT Classification \n\n**Early Lung Neoplasia Using Hybrid Deep Learning, Heatmaps and Radiomics**\n\
  \nThis repository contains a full pipeline for detecting and predicting malignancy of small cell lung\
  \ carcinoma and large cell lung carcinoma(NSCLC) from CT using: \n\n  - **A highly accurate ResNet-50–based\
  \ Convolutional Neural Network**\n\n  - **Generative Grad-CAM heatmaps for model explainability and\
  \ identifying areas of concern**\n\n  - **GLCM and over 14 radiomics features extracted from each CT\
  \ identifying pixel differences and detecting malignancy and other characteristics of a neoplasm**\n\
  \n  - **A hybrid CNN + Radiomics diagnostic interface**\n\n  - **A user-friendly Streamlit Web App**\n\
  \n# Key Features\n\n**1. ResNet-50 Deep Learning Classifier**\n  - Custom built carcinoma preprocessing\
  \ imaging pipeline (HU windowing, extraction, image cropping, image normalization)\n  - High sensitivity\
  \ for cancerous regions\n  - Automatic lung segmentation and cropping\n\n**2. Grad-CAM Heatmaps**\n\
  \  - Identifies suspicious regions and model focus areas\n  - Generates visual explanations for results\
  \ and identifies risk areas\n  - 3 color key (red, yellow, blue)\n\n**3. Radiomics (Image Texture Features)**\n\
  \  - Model extracts down-to-pixel texture differences in images (radiomic biomarkers) including: \n\
  \    - Contrast\n    - Dissimilarity\n    - Homogeneity\n    - Energy\n    - Correlation\n    - ASM\n\
  \    - Entropy\n    - Cluster Shade\n    - Cluster Prominence\n  \n\n**4. Web App (EXPERIMENTAL)**\n\
  \  - User interface that allows users to upload a suspected carcinoma image to get:\n      - Cancer\
  \ Probability (Deep CNN)\n      - Heatmap and cancer visualization\n      - Colorful downloadable overlay\n\
  \      - Radiomics/biomarker table (sortable)\n\n**5. Jupyter Notebook**\n  - Project documentation\
  \ that contains comprehensive details on a full training pipeline(image handling), Grad-CAM generation,\
  \ radiomics/biomarker analysis, etc.\n\n\n# Installation\n**1. Clone the repo**\n```\ngit clone https://github.com/abhonde14/NewDx-Hybrid-Radiomics-CNN-Lung-Neoplasia-Predictor-with-Grad-CAM-Heatmaps\n\
  .git\n\ncd NewDx-Hybrid-Radiomics-CNN-Lung-Neoplasia-Predictor-with-Grad-CAM-Heatmaps\n```\n\n**2. Install\
  \ dependencies**\n```\npip install -r requirements.txt\n```\n\n# Using the Web App(EXPERIMENTAL)\n```\n\
  streamlit run carcapp.py\n```\n  - Upload a CT slice\n  - View cancer prediction\n  - View heatmaps\
  \ and identify high risk areas\n  - Identify biomarkers and radiomics\n  - Download heatmaps and biomarker\
  \ radiomics\n\n# Running the model \n```\npython RunModel.py file located in CreateYourModel\n```\n\
  \  - **IMPORTANT! If running in a terminal outside the web app, ensure to navigate to the run file yourself\
  \ and replace the image path at the bottom with the image you want to test. A comment is added to identify\
  \ the location**\n\n# Training the model \n  - If you wish to train the model yourself with your own\
  \ dataset and generate another predictor, follow these steps:\n      - Open TrainModel.py and follow\
  \ the instructions left by the comments\n  - Now, run this command:\n```\npython TrainModel.py\n```\n\
  \  - A new model will be created trained on your custom dataset. Use 5k+ images for the best accuracy.\
  \ \n    - **This is a heavy pipeline with a lot of features, and it performs features like:**\n    \
  \    - CT Lung segmentation and windowing\n        - Lung segmentation and cropping\n        - Z-score\
  \ normalization\n        - ResNET-50 utilization\n        - Best-model checkpoint\n        - Accuracy\
  \ monitoring\n     \n    - As a result, ensure sufficient computer power is available before running\
  \ the pipeline. Good specs recommended.\n    - Human Aligned Explainability will help you identify if\
  \ a model needs to be retrained/reiterated for the best results. \n\n# Radiomics Overview\n  - The project\
  \ extracts 14 radiomic features from intricate differences and GLCM matrixes, widely used in medical\
  \ research.\n  - Radiomics provides greater explainability and identifies malignancy and other important\
  \ features of scanned lung neoplasia.\n  - Features can be exported as a CSV\n  - For information on\
  \ how to interpret your radiomic results, head over to radiomicsguide.txt\n\n# Future Work\n  - Multi-slice\
  \ 3D CT and MRI scanning\n  - 4D CT scans\n  - Hybrid CNN + radiomics model\n  - Monte-Carlo Dropout\n\
  \  - Full User Interface with integrated AI\n  - Include more advanced explainability (Grad-CAM ++)\n\
  \  - Integrate full 3D radiomics\n  - Add abnormality detection and localization\n  - Identification\
  \ of diseases beyond cancer (pneumonia, COVID, etc.)\n\n# Contributions\n  - Suggestions welcome\n\n\
  # Contact \n  - For questions or collaboration:\n  - GitHub: abhonde14\n  - Email: adibho186@gmail.com\n\
  \n  \n"

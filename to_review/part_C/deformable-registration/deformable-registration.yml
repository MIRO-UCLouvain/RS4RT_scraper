readme_excerpt: "# Deformable Registration\nDynamic elasticity model based deformable image registration\n\
  \n# System Requirements\n- Software: MATLAB 2019b or higher\n- Memory: 16 GB RAM\n- OS: Windows/Mac/Linux\n\
  \n# Demo\nExample data are provided in the subfolders\n\n- Run DEM_main.m in MATLAB\n- Results (warped\
  \ tissue segmentation map and displacement field) will be saved in the 'output' subfolder\n- Code takes\
  \ approximately 1 - 2 hours to finish, depending on the system\n\n# Results Visualization\n- Open moving/fixed/warped\
  \ tissue segmentation maps in ITK-SNAP\n\n# Instructions for Usage with New Data\n1) Copy fixed tissue\
  \ segmentation map (nifti format) to 'fixed' subfolder\n2) Copy moving tissue segmentation map (nifti\
  \ format), affine-aligned with fixed tissue map, to 'moving' subfolder\n3) Run DEM_main.m \n4) Displacement\
  \ field and warped tissue segmentation map will be saved in the 'output' subfolder\n"

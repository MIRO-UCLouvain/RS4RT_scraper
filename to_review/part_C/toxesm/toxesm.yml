readme_excerpt: "# ToxESM\n\nTransformer-based peptide toxicity prediction using ESM-2 embeddings and\
  \ XGBoost.\n\n---\n\n## Overview\n\nToxESM is a command-line tool for predicting peptide toxicity from\
  \ amino acid sequences.  \nIt combines protein language model embeddings (ESM-2) with a trained XGBoost\
  \ classifier.\n\nThe tool is designed to be simple, fast, and easy to use for researchers in bioinformatics.\n\
  \n---\n\n## Features\n\n- Uses ESM-2 embeddings for sequence representation\n- XGBoost-based toxicity\
  \ classification\n- Accepts FASTA input files\n- Outputs results in CSV format\n- Simple command-line\
  \ interface\n\n---\n\n## Installation\n\nClone the repository and install locally:\n\n```bash\ngit clone\
  \ https://github.com/sahaabhishek2003/toxesm.git\ncd toxesm\npip install .\n"

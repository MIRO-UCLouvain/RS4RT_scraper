readme_excerpt: "================================================================\n  Teeth Segmentation\
  \ Viewer\n  Version 1.1.2\n================================================================\n\nA desktop\
  \ tool for reviewing AI-generated teeth segmentation masks\nbefore correcting them in 3D Slicer.\n\n\
  Reduces manual import time by letting you browse all tooth\nsegmentations from a patient folder in one\
  \ place, rather than\nopening each file individually in 3D Slicer.\n\n\n----------------------------------------------------------------\n\
  \  FOLDER STRUCTURE\n----------------------------------------------------------------\n\n  patient_folder/\n\
  \      tooth_1/\n          pred_mask.nii.gz    (segmentation mask)\n          dcm/                (DICOM\
  \ folder)\n      tooth_2/\n      tooth_3/\n      ...\n\nTissue labels inside each .nii.gz mask:\n  \
  \  1 = Enamel  (green)\n    2 = Dentin  (yellow)\n    3 = Pulp    (red)\n\nNote: The mask file is optional.\
  \ Folders with only a dcm/\nsubfolder are also supported (CT-only mode).\n\n\n----------------------------------------------------------------\n\
  \  MAIN FEATURES\n----------------------------------------------------------------\n\n1.  Load all tooth\
  \ folders from a patient directory at once\n2.  Navigate between teeth using arrow keys or Prev/Next\
  \ buttons\n3.  View CT scan with segmentation overlay\n    - Axial / Sagittal / Coronal views\n    -\
  \ Single slider syncs all axes\n    - Toggle between axes with radio buttons\n4.  View 3D mesh of segmentation\
  \ in browser\n    - Enamel, Dentin, Pulp rendered as separate layers\n    - Interactive: rotate, zoom,\
  \ toggle layers\n5.  Export DCM + segmentation to 3D Slicer in one click\n    - DICOM imported into\
  \ database automatically\n    - Segmentation mask loads on top after you open the series\n    - Reuses\
  \ the same Slicer window on subsequent exports\n6.  Delete unwanted tooth folders directly from the\
  \ app\n    - Two-step confirmation to prevent accidents\n7.  Mask file is optional (CT-only folders\
  \ supported)\n8.  Settings persist across sessions\n\n\n----------------------------------------------------------------\n\
  \  REQUIREMENTS\n----------------------------------------------------------------\n\n  pip install nibabel\
  \ numpy matplotlib plotly scipy\n              scikit-image pydicom psutil\n\n\n----------------------------------------------------------------\n\
  \  USAGE\n----------------------------------------------------------------\n\n  Run the executable:\n\
  \      TeethViewer.exe\n\n  Or run from source:\n      python teeth_viewer.py\n      python teeth_viewer.py\
  \ \"C:/path/to/patient_folder\"\n\n\n----------------------------------------------------------------\n\
  \  SETTINGS\n----------------------------------------------------------------\n\nClick the Settings\
  \ button in the top bar to configure:\n\n  - 3D Slicer executable path\n  - Root segmentation folder\
  \ (opens here when browsing)\n  - Mask filename (default: pred_mask.nii.gz)\n\nYou can also edit the\
  \ mask filename directly in the top bar\nwithout opening Settings. Changes are saved immediately.\n\n\
  Settings are stored in:\n    teeth_viewer_config.json  (same folder as the .exe)\n\n\n----------------------------------------------------------------\n\
  \  FILES INCLUDED\n----------------------------------------------------------------\n\n  TeethViewer.exe\
  \             Main application\n  teeth_viewer_config.json    Settings (auto-generated on first run)\n\
  \  README.txt                  This file\n\n\n----------------------------------------------------------------\n\
  \  VERSION HISTORY\n----------------------------------------------------------------\n\n  v1.0    Initial\
  \ release\n          - Arrow key navigation between teeth\n          - Mask-only slice viewer (Axial\
  \ / Sagittal / Coronal)\n          - 3D mesh view in browser\n          - One-click export to 3D Slicer\n\
  \          - Delete tooth folder\n\n  v1.01   Bug fixes & usability improvements\n          - Fixed\
  \ slice aspect ratio for Sagittal and Coronal views\n          - Fixed slice slider not working before\
  \ changing axis\n          - Fixed app not terminating properly (file lock on exit)\n          - Fixed\
  \ 3D Slicer export order (DICOM first, then mask)\n          - Added Settings dialog (Slicer path, root\
  \ folder, mask filename)\n          - Settings persist across sessions via config JSON\n          -\
  \ Mask filename editable from top bar\n          - Browse dialog now opens from current folder\n\n \
  \ v1.1    CT + mask overlay viewer\n          - Added DCM viewer with segmentation overlay\n       \
  \     (affine-aligned using DICOM and NIfTI headers)\n          - Mask file made optional (CT-only folders\
  \ supported)\n          - Single-axis slice view with axis toggle buttons\n          - Slider syncs\
  \ CT and mask overlay simultaneously\n          - Splash screen on launch\n          - About dialog\
  \ with feature list\n          - Slice aspect ratio fix across all axes\n          - Reuses existing\
  \ 3D Slicer window on re-export\n          - Performance optimisations\n\n  v1.1.1  Preloading\n   \
  \       - All teeth preloaded in background on patient folder load\n          - Navigation is now instant\
  \ after preloading completes\n          - Progress shown in status bar during preloading\n         \
  \ - Falls back to on-demand loading if navigating ahead\n            of the preloader\n\n  v1.1.2  CT\
  \ brightness fix\n          - Fixed CT images appearing too dark\n          - Now uses 1st-99th percentile\
  \ windowing for normalization\n            (same approach as 3D Slicer's default auto-window)\n    \
  \      - Soft tissue and teeth are now clearly visible\n\n================================================================\n"

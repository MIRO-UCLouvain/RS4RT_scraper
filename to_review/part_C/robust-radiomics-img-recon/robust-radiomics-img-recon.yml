readme_excerpt: "# Robustness of [18F]-FDG-PET radiomic features to image acquisition and reconstruction\
  \ parameter variations\n\nData repository for the study and manuscript titled \"On the robustness of\
  \ [18F]-FDG-PET radiomic features to variations in image acquisition and reconstruction settings: a\
  \ phantom study\" by Syafiq Ramlee, Maria Delgado-Ortet, Lorena Escudero Sanchez, Luigi Aloj, and Roido\
  \ Manavaki.\n\n## Folder structure\n\nPlots generated for this study have been segregated according\
  \ to robustness category (Robust vs NonRobust) and investigation group as per the folder structure below:\n\
  \n```\n\U0001F4E6 \n├─ acq_time\n│  ├─ Robust\n│  └─ NonRobust\n├─ beta_value\n│  └─ as above\n├─ filter_width\n\
  │  └─ as above\n├─ matrix_size\n│  └─ as above\n├─ zFilter\n│  └─ as above\n├─ subsets\n│  └─ as above\n\
  ├─ iterations\n│  └─ as above\n├─ updates\n│  └─ as above\n└─ algorithm\n   └─ as above\n```\n"

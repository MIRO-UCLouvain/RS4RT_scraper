readme_excerpt: "IMRT Solver\n-----------\n\n**Cómo correr un ejemplo:**\n\nCompilar:\n\n````\ncmake .\n\
  make\n````\n\nPara correr:\n\n    ./AS {OPTIONS}\n\n    ********* IMRT-Solver (Aperture solver) *********\n\
  \n    OPTIONS:\n\n      -h, --help                        Display this help menu\n      -s[string],\
  \ --strategy=[string]   Strategy (dao_ls|ibo_ls)\n      --bsize=[int]                     Number of\
  \ considered beamlets for\n                                        selection (20)\n      --vsize=[int]\
  \                     Number of considered worst voxels (50)\n      --int0=[int]                   \
  \   Initial intensity for beams (4.000000)\n      --max_ap=[int]                    Initial intensity\
  \ for the station (5)\n      --maxdelta=[int]                  Max delta (5.000000)\n      --maxratio=[int]\
  \                  Max ratio (3.000000)\n      --alpha=[double]                  Initial temperature\
  \ for intensities\n                                        (1.000000)\n      --beta=[double]       \
  \            Initial temperature for ratio (1.000000)\n      --maxiter=[int]                   Number\
  \ of iterations (5000)\n      --maxtime=[int]                   Maximum time in seconds (0)\n      --seed=[int]\
  \                      Seed (1533566270)\n      Direct aperture local search:\n        --ls-aperture\
  \                     Apply aperture local search\n        --ls-intensity                    Apply intensity\
  \ local search\n        --prob-intensity=[double]         Probability to search over intensity\n   \
  \                                       (0.200000)\n      --open-setup                      Initialize\
  \ apertures as open\n      --initial-intensity=[int]         Initial value aperture intensity (2)\n\
  \      --max-intensity=[int]             Max value aperture intensity (28)\n      --step-intensity=[int]\
  \            Step size for aperture intensity (2)\n      Acceptance criterion:\n        --accept-best\
  \                     Accept only improvement\n        --accept-sa                       Accept as simulated\
  \ annealing\n      --temperature=[double]            Temperature for acceptance criterion\n        \
  \                                (0.000000)\n      --alphaT=[double]                 Reduction rate\
  \ of the temperature\n                                        (0.950000)\n      --perturbation-size=[int]\
  \         Perturbation size (2)\n\n    Example.\n    ./AS -s ibo_ls --maxiter=400 --maxdelta=8 --maxratio=6\
  \ --alpha=0.999\n    --beta=0.999 --bsize=5 --vsize=20 --max_ap=4 --seed=0 --int0=1 --open-setup\n\n\
  ----\n\n## El Algoritmo\n\n\n    S ← initializeStations (max_apertures, initial_intensity)\n    bestF\
  \ ← eval(S)\n\n    while i < max_iter:\n\n      (b,si,increase) ← select_promising_beamlet(bsize,vsize)\n\
  \      delta_intensity ← random(1,maxdelta)\n      maxdelta ← maxdelta*alpha\n      ratio ← random(0,maxratio)\n\
  \      maxratio ← maxratio*beta\n\n      if increase:\n        diff ← increaseIntensity&Repair (b,si,delta_intenisty,ratio)\n\
  \      else:\n        diff ← decreaseIntensity&Repair (b,si,delta_intenisty,ratio)\n\n      F ← incremental_eval\
  \ (S, diff)\n\n      if F < bestF:\n        bestF ← F\n        bestS ← S\n      else\n        revert_changes(s,diff)\n\
  \        undo_last_eval()\n\n[Más detalles](https://docs.google.com/document/d/1EGoKoLsmik4TSiY_SslWkxddDCrYvUfFKpPLRpQPV_U/edit#)\n"

readme_excerpt: "# DICOM DVH Extraction Pipeline\n\n- A Python pipeline for extracting dosimetric metrics\
  \ from DICOM \n  radiotherapy files (CT, RT Structure, RT Dose, RT Plan).\n\n# Features\n- Reads and\
  \ auto-matches DICOM files across modalities by FrameOfReferenceUID\n- Reconstructs 3D ROI masks from\
  \ RT Structure contour data\n- Resamples RT Dose grids to CT geometry using SimpleITK\n- Computes DVH,\
  \ D90, D2cc for target and OAR structures\n\n# Dependencies\n- pydicom\n- SimpleITK\n- numpy\n- scikit-image\n"

readme_excerpt: "# Interactive-Plot\n\nFor an interactive visualization, please use the link showed below:\n\
  https://mybinder.org/v2/gh/bal81/Interactive-Plot/9bdabf893a0aa75eee2cd8459d42243db5094903\n\nMonte\
  \ Carlo simulations on the interactions between mono-energetic proton beams with water were performed.\
  \ The Energy deposited along Z- axe (Bragg peak) was scored and the results were plotted for analysis.\n\
  A program in python using OOP in a Jupyter Notebook environment was implemented for data analysis of\
  \ the CSV files. Is worthing to mention that this can be used to load N number of CSV files by initializing\
  \ the class N times.\n\nThe class load a single CSV file and check for NaN values in it and perform\
  \ cleaning if necessary. The output of the program is an interactive plot which shows the Bragg peak\
  \ for each proton energy used in this study.\n\nAs expected, the position of the Bragg Peak increases\
  \ proportionally with the input energy. \n"

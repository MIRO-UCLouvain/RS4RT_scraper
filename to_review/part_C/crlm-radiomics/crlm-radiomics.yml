readme_excerpt: "# Automated Radiomics Framework for Postoperative Survival Prediction in Colorectal Liver\
  \ Metastases using Preoperative MRI\n\n## Authors\n\nMuhammad Alberb<sup>a,*</sup>, Jianan Chen<sup>b</sup>,\
  \ Hossam El-rewaidy<sup>c</sup>, Paul Karanicolas<sup>d,e</sup>, Arun Seth<sup>f,e</sup>, Yutaka Amemiya<sup>f,e</sup>,\
  \ Anne L. Martel<sup>e,a,g</sup>, Helen Cheung<sup>h,e</sup>\n\n## Affiliations\n\n<sup>a</sup> Department\
  \ of Medical Biophysics, University of Toronto, Toronto, Ontario, Canada  \n<sup>b</sup> UCL Cancer\
  \ Institute, London, England, UK  \n<sup>c</sup> Systems and Biomedical Engineering Department, Cairo\
  \ University, Giza, Giza Governorate, Egypt  \n<sup>d</sup> Department of Surgery, University of Toronto,\
  \ Toronto, Ontario, Canada  \n<sup>e</sup> Sunnybrook Research Institute, Toronto, Ontario, Canada \
  \ \n<sup>f</sup> Department of Laboratory Medicine and Pathobiology, University of Toronto, Toronto,\
  \ Ontario, Canada  \n<sup>g</sup> Vector Institute, Toronto, Ontario, Canada  \n<sup>h</sup> Department\
  \ of Medical Imaging, University of Toronto, Toronto, Ontario, Canada\n\n## Corresponding Author\n\n\
  <sup>*</sup> Muhammad Alberb: muhammad.alberb@mail.utoronto.ca\n\n## Abstract\n\n**Purpose:** While\
  \ colorectal liver metastasis (CRLM) is potentially curable via hepatectomy, patient outcomes remain\
  \ highly heterogeneous. Postoperative survival prediction is necessary to avoid non-beneficial surgeries\
  \ and guide personalized therapy. In this study, we present an automated AI-based framework for postoperative\
  \ CRLM survival prediction using pre- and post-contrast MRI.\n\n**Approach:** We performed a retrospective\
  \ study of 227 CRLM patients who had gadoxetate-enhanced MRI prior to curative-intent hepatectomy between\
  \ 2013 and 2020. We developed a survival prediction framework comprising an anatomy-aware segmentation\
  \ pipeline followed by a radiomics pipeline. The segmentation pipeline learns liver, CRLMs, and spleen\
  \ segmentation from partially-annotated data, leveraging promptable foundation models to generate pseudo-labels.\
  \ To support this pipeline, we propose SAMONAI, a prompt propagation algorithm that extends Segment\
  \ Anything Model to 3D point-based segmentation. Predicted pre- and post-contrast segmentations are\
  \ then fed into our radiomics pipeline, which extracts per-tumor features and predicts survival using\
  \ SurvAMINN, an autoencoder-based multiple instance neural network for time-to-event survival prediction.\
  \ SurvAMINN jointly learns dimensionality reduction and survival prediction from right-censored data,\
  \ emphasizing high-risk metastases. We compared our framework against established methods and biomarkers\
  \ using univariate and multivariate Cox regression.\n\n**Results:** Our segmentation pipeline achieves\
  \ median Dice scores of 0.96 (liver) and 0.93 (spleen), driving a CRLM segmentation Dice score of 0.78\
  \ and a detection F1-score of 0.79. Accurate segmentation enables our radiomics pipeline to achieve\
  \ a survival prediction C-index of 0.69.\n\n**Conclusions:** Our results demonstrate the potential of\
  \ integrating segmentation algorithms with radiomics-based survival analysis to deliver accurate, automated,\
  \ and interpretable CRLM outcome prediction.\n\n## Framework Workflow\n\nThe framework consists of 3\
  \ components:\n\n1. **SAMONAI**: Generates pseudo-labels for missing annotations of target regions-of-interest\
  \ by placing a point with a single click\n\n![SAMONAI component](figures/samonai.png)\n\n2. **Segmentation\
  \ Pipeline**: Combines available labels with pseudo-labels and train a segmentation model to automate\
  \ radiomics extraction\n\n![Segmentation pipeline component](figures/segmentation_pipeline.png)\n\n\
  3. **Radiomics Pipeline**: Uses automated segmentations for feature extraction and trains SurvAMINN\
  \ for postoperative survival prediction of multifocal colorectal liver metastasis.\n\n![Radiomics pipeline\
  \ component](figures/radiomics_pipeline.png)\n\n## Environment Setup\n\nCreate and activate a Conda\
  \ environment with Python 3.9, then install dependencies from the root requirements file:\n\n```bash\n\
  conda create -n crlm-radiomics python=3.9 -y\nconda activate crlm-radiomics\npip install -r requirements.txt\n\
  ```\n\n\n## Repository Usage Guides\nEach component has its own README with usage instructions:\n\n\
  - [SAMONAI](framework/SAMONAI/README.md)\n- [Segmentation Pipeline](framework/segmentation_pipeline/README.md)\n\
  - [Radiomics Pipeline](framework/radiomics_pipeline/README.md)\n\n"

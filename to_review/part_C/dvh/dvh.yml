readme_excerpt: "# DVHpro - Sistema de Cotización DVH\n\nMonorepo del sistema completo de gestión de cotizaciones\
  \ para Doble Vidriado Hermético (DVH).\n\n## \U0001F4C1 Estructura del Proyecto\n\n```\nDVHpro/\n├──\
  \ backend/         # API REST en Go con arquitectura hexagonal\n│   ├── cmd/\n│   ├── internal/\n│ \
  \  ├── pkg/\n│   └── ...\n└── frontend/        # UI en React + TypeScript + shadcn/ui (en desarrollo)\n\
  \    ├── src/\n    │   ├── features/\n    │   │   ├── clientes/      ✅ COMPLETADO\n    │   │   ├── cotizaciones/\
  \  ⏳ Pendiente\n    │   │   └── precios/       ⏳ Pendiente\n    │   └── ...\n    └── ...\n```\n\n##\
  \ \U0001F680 Quick Start\n\n### Backend\n\nEl backend es una API REST construida con Go y arquitectura\
  \ hexagonal.\n\n```bash\ncd backend\nmake run\n```\n\n**Documentación completa del backend:** [backend/README.md](backend/README.md)\n\
  \n**Características principales:**\n- ✅ CRUD completo de clientes\n- ✅ Creación y consulta de cotizaciones\n\
  - ✅ Cálculo automático de costos DVH\n- ✅ Gestión de precios de materiales\n- ✅ Validaciones robustas\n\
  - ✅ Logging estructurado\n- ✅ Arquitectura hexagonal escalable\n\n### Frontend\n\nUI moderna con React,\
  \ TypeScript y shadcn/ui para gestión de cotizaciones.\n\n**Estado actual:** ✅ FASE 0 (100%) + FASE\
  \ 1 (100%) + FASE 2 (100%) = **~60% del MVP**\n\n```bash\ncd frontend\nnpm install   # Primera vez\n\
  npm run dev   # Servidor de desarrollo\n```\n\n**Documentación completa del frontend:** [frontend/README.md](frontend/README.md)\n\
  \n**Características implementadas:**\n- ✅ Setup completo Vite + React + TypeScript\n- ✅ Tailwind CSS\
  \ v4 + shadcn/ui con tema personalizado\n- ✅ Arquitectura feature-based lista\n- ✅ Layout con Sidebar\
  \ y Header\n- ✅ Componentes compartidos (LoadingSpinner, ErrorMessage, EmptyState)\n- ✅ API client configurado\
  \ con interceptors\n- ✅ Tipos TypeScript completos\n- ✅ Routing completo con React Router\n- ✅ HomePage\
  \ con cards de navegación\n- ✅ **Módulo Clientes COMPLETO:**\n  - CRUD completo (crear, leer, actualizar)\n\
  \  - Búsqueda en tiempo real con debounce\n  - Validación de formularios con Zod\n  - Toasts de notificación\
  \ (Sonner)\n  - Estados de loading/error\n- ⏳ Módulo Cotizaciones (Wizard multi-paso - pendiente)\n\
  - ⏳ Módulo Precios (pendiente)\n\n## \U0001F6E0️ Stack Tecnológico\n\n### Backend\n- **Lenguaje:** Go\
  \ 1.24.2\n- **Router:** Chi Router v5\n- **Base de Datos:** Supabase PostgreSQL (pgx v5)\n- **Logging:**\
  \ zerolog\n- **Testing:** testify\n\n### Frontend\n- **Framework:** React 18 + Vite 7\n- **Lenguaje:**\
  \ TypeScript\n- **UI:** shadcn/ui v4 + Tailwind CSS v4\n- **Routing:** React Router v6\n- **HTTP Client:**\
  \ Axios\n- **Forms:** React Hook Form + Zod\n- **State:** Zustand\n- **Notifications:** Sonner\n\n##\
  \ \U0001F4D6 Documentación\n\n- **Backend:**\n  - [README del backend](backend/README.md) - Documentación\
  \ completa\n  - [Plan de implementación](backend/contexto/implementacion/00-plan-general.md)\n  - [Estructura\
  \ del proyecto](backend/contexto/implementacion/01-estructura-proyecto.md)\n  - [Documentación de la\
  \ API](backend/contexto/api.md)\n\n- **Frontend:**\n  - [README del frontend](frontend/README.md) -\
  \ Documentación completa\n  - [ESTADO-ACTUAL.md](frontend/ESTADO-ACTUAL.md) - ⭐ **Estado detallado y\
  \ próximos pasos**\n  - [Plan de implementación](frontend/docs/00-plan-implementacion.md)\n  - [Arquitectura](frontend/docs/02-arquitectura.md)\n\
  \  - [Features y componentes](frontend/docs/03-features-y-componentes.md)\n  - [Roadmap](frontend/docs/06-roadmap.md)\n\
  \n- **General:**\n  - [CLAUDE.md](CLAUDE.md) - Instrucciones para Claude Code\n\n## \U0001F527 Comandos\
  \ Útiles\n\n### Backend\n```bash\ncd backend\nmake help              # Ver todos los comandos disponibles\n\
  make run               # Ejecutar servidor\nmake test              # Ejecutar tests\nmake build    \
  \         # Compilar aplicación\nmake check             # fmt + vet + lint + test\n```\n\n### Frontend\n\
  ```bash\ncd frontend\nnpm install            # Instalar dependencias (primera vez)\nnpm run dev    \
  \        # Servidor de desarrollo\nnpm run build          # Build para producción\nnpm run type-check\
  \     # Verificar tipos TypeScript\n```\n\n## \U0001F310 URLs en Desarrollo\n\n- **Backend API:** http://localhost:8080\n\
  \  - Health check: http://localhost:8080/health\n  - API v1: http://localhost:8080/api/v1\n\n- **Frontend:**\
  \ http://localhost:5173\n  - Módulo Clientes: http://localhost:5173/clientes\n\n## \U0001F91D Contribuir\n\
  \nEste es un proyecto en desarrollo activo. Ver documentación de implementación en `backend/contexto/implementacion/`.\n\
  \n## \U0001F4C4 Licencia\n\nMIT\n"

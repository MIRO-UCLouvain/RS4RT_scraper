readme_excerpt: "# CT Radiomics and Survival Modeling for Nasopharyngeal Carcinoma\n\nThis repository\
  \ contains the research code accompanying the paper:\n\n> **Integrating computed tomography image features\
  \ improves clinical prediction models for outcomes in nasopharyngeal carcinoma patients treated with\
  \ (chemo)radiation**\n> Author: Guanzhi Zhou, Baoqiang Ma, Yan Li, Pei Yang, Yingrui Shi, Arjen van\
  \ der Schaaf, Lisanne V. van Dijk, Johannes A. Langendijk, Nanna M. Sijtsema\n\nThe pipeline proceeds\
  \ in two stages:\n\n1. **Radiomic feature extraction** — DICOM CT series and paired RTSTRUCT contours\
  \ are converted to NIfTI, resampled to isotropic 1 mm³ spacing, and processed with PyRadiomics to yield\
  \ handcrafted radiomic features per patient.\n2. **Survival modeling** — Radiomic and clinical features\
  \ are screened with univariable Cox regression, preselected by correlation, and entered into a bootstrap\
  \ forward-selection procedure. Final model performance is evaluated by C-index and calibration plot\
  \ on held-out (multiply-imputed) test data.\n\n---\n\n## Repository structure\n\n```\n.\n├── README.md\n\
  ├── python/\n│   └── CT_radiomics_extraction.py   # Stage 1: DICOM → NIfTI + PyRadiomics extraction\n\
  └── R/\n    └── Cox_survival_modelling.R     # Stage 2: Cox regression, selection, evaluation\n\n```\n\
  \n> **Note:** Raw DICOM images and patient data are not distributed with this repository. See the Data\
  \ Availability section of the paper for access instructions.\n\n---\n\n## Dependencies\n\n### Python\
  \ — `python/CT_radiomics_extraction.py`\n\n| Package | Tested version | Purpose |\n|---|---|---|\n|\
  \ Python | ≥ 3.7 | Runtime |\n| pydicom | ≥ 2.3 | Reading DICOM files |\n| SimpleITK | ≥ 2.2 | Image\
  \ I/O and resampling |\n| nibabel | ≥ 4.0 | NIfTI file handling |\n| numpy | ≥ 1.21 | Array operations\
  \ |\n| scipy | ≥ 1.7 | Binary fill holes |\n| scikit-image | ≥ 0.19 | Polygon rasterisation of contours\
  \ |\n| pandas | ≥ 1.3 | Cohort spreadsheet and results tables |\n| pyradiomics | ≥ 3.0 | Radiomic feature\
  \ extraction |\n\nInstall with pip:\n\n```bash\npip install pydicom SimpleITK nibabel numpy scipy scikit-image\
  \ pandas pyradiomics\n```\n\nOr from a requirements file (if provided):\n\n```bash\npip install -r python/requirements.txt\n\
  ```\n\n---\n\n### R — `R/Cox_survival_modelling.R`\n\n| Package | Tested version | Purpose |\n|---|---|---|\n\
  | R | ≥ 4.1 | Runtime |\n| dplyr | ≥ 1.0 | Data manipulation |\n| survival | ≥ 3.3 | Cox regression\
  \ and `Surv()` objects |\n| riskRegression | ≥ 2022.11 | `predictRisk()` for calibration |\n| ggplot2\
  \ | ≥ 3.4 | Calibration plot |\n\nInstall from CRAN:\n\n```r\ninstall.packages(c(\"dplyr\", \"survival\"\
  , \"riskRegression\", \"ggplot2\"))\n```\n\n---\n\n## How to run\n\n### Stage 1 — Radiomic feature extraction\
  \ (Python)\n\n1. Open `python/CT_radiomics_extraction.py` and set the three path variables near the\
  \ bottom of the file:\n\n   ```python\n   DICOM_ROOT  = '/path/to/dicom/data'         # root directory\
  \ of DICOM input\n   NIFTI_ROOT  = '/path/to/nifti/output'        # where NIfTI files will be written\n\
  \   COHORT_EXCEL = '/path/to/cohort_info.xlsx'   # spreadsheet with case metadata\n   ```\n\n2. The\
  \ cohort spreadsheet must contain at least two columns:\n   - `rtstruct_path` — absolute path to each\
  \ patient's RTSTRUCT DICOM file\n   - `roi_name` — exact ROI name to extract (e.g. `GTV`)\n\n3. Run\
  \ the script:\n\n   ```bash\n   python python/CT_radiomics_extraction.py\n   ```\n\n**Outputs written\
  \ to `NIFTI_ROOT/`:**\n\n| File | Description |\n|---|---|\n| `<case_id>/ct.nii` | Original CT volume\
  \ (HU clipped to [−200, 200]) |\n| `<case_id>/gtv.nii` | Binary GTV mask at original resolution |\n\
  | `<case_id>/ct_resampled.nii` | CT resampled to isotropic 1 mm³ |\n| `<case_id>/gtv_resampled.nii`\
  \ | GTV mask resampled to isotropic 1 mm³ |\n| `features_original.xlsx` | Radiomic features (original\
  \ resolution) |\n| `features_resampled.xlsx` | Radiomic features (resampled) |\n| `conversion_errors.xlsx`\
  \ | Log of cases that could not be converted |\n\n---\n\n### Stage 2 — Cox survival modeling (R)\n\n\
  1. Open `R/Cox_survival_modelling.R` and update the **USER-DEFINED INPUTS** block at the top of the\
  \ script (Section 0):\n\n   ```r\n   path_train       <- \"path/to/imp_data_train.rdata\"\n   path_test\
  \        <- \"path/to/imp_data_test.rdata\"\n   endpoint_time    <- \"TIME\"     # name of the time-to-event\
  \ column\n   endpoint_status  <- \"STATUS\"   # name of the binary event indicator column\n   ```\n\n\
  \   Also review `exclude_vars`, `categorical_vars`, `forced_vars`, and `calibration_time` to match your\
  \ dataset.\n\n2. After bootstrap forward selection (Section 4), inspect `freq_table` and set the final\
  \ model variables in Section 5:\n\n   ```r\n   final_vars <- c(\"Predictor1\", \"Predictor2\")\n   ```\n\
  \n3. Source or run the script interactively in RStudio, or from the terminal:\n\n   ```bash\n   Rscript\
  \ R/Cox_survival_modelling.R\n   ```\n\n**Key outputs:**\n\n| Output | Description |\n|---|---|\n| Console\
  \ | Pooled univariable results, bootstrap selection frequencies, C-index (training & test), calibration\
  \ intercept and slope |\n| `calibration_<endpoint>.png` | Calibration plot saved to the working directory\
  \ |\n\n---\n\n## Citation\n\nIf you use this code in your work, please cite the paper.\n\n\n---\n\n\
  ## Contact\n\nFor questions about the code, please open a GitHub issue or contact GZhou at g.zhou@umcg.nl.\n"

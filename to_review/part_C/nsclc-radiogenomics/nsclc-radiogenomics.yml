  optuna>=3.0.0\n\n# Optional but recommended for full functionality\npytorch-ignite>=0.4.10\nlifelines>=0.27.0\n\
  statsmodels>=0.13.0\ndgl>=1.0.0  # For graph operations\nplotly>=5.10.0  # For interactive plots\nnetworkx>=2.8.0\

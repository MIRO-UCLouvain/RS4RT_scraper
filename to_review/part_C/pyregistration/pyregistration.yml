readme_excerpt: "# pyRegistration\nDeformable Image Registration for medical images using ANTs. Designed\
  \ to support nested-patient folder structures. \n\n# Pre-requisites:\nNeed nested structure of patient\
  \ image folders:\n\n\t\"DataFolder\" / \"PatientNumber\" / \"Visit\" / \"Image\" & \"Masks\" / *.nii.gz\
  \ or *.mha\n\t\n*Should* work with any image types, provided the masks and images are consistent filetypes.\n\
  \n# Input\nSupports either CLI, or YAML file input for registration paramaters.\n\n# Output\nOutputs\
  \ registrations to folder: \"Reg_{moving image name}_2_{fixed image name}\" in Patient folder:\n\n\t\
  \t\"DataFolder\" / \"PatientNumber\" / \"Visit\" / Reg_X_2_Y / *.nii.gz\n\nSupported output image types\
  \ are .nii.gz (defualt), .nii, .mha .\n\n# Scripts:\n\n- pyRegistration.py - All-in-one Primary python\
  \ script for handling image reading and registration processing.\n\n- Bash_pyRegistration.sh - HPC script\
  \ for running patient-wise registration\n\n- pyApplyTransforms.py - Python script for applying computed\
  \ registrations transforms to image files\n\n- Bash_pyApplyTransforms.sh - HPC script for running apply\
  \ transform script\n"

readme_excerpt: "# Radiotherapy QA Assistant\r\n\r\n![Python](https://img.shields.io/badge/python-3.8+-blue.svg)\r\
  \n![License](https://img.shields.io/badge/license-MIT-green.svg)\r\n![Status](https://img.shields.io/badge/status-ready--for--testing-yellow.svg)\r\
  \n\r\nAI-assisted quality assurance tools for radiotherapy treatment plans and medical physics measurements.\
  \ This project provides Streamlit-based web interfaces for automated QA checks following standard protocols\
  \ (TG-142, TG-224) and monitor unit calculations.\r\n\r\n## \U0001F680 Quick Start\r\n\r\n### Prerequisites\r\
  \n- Python 3.8 or higher\r\n- Windows (PowerShell) or Linux/Mac\r\n- CSV files with measurement data\r\
  \n\r\n### Installation\r\n\r\n```powershell\r\n# Clone the repository\r\ngit clone https://github.com/YOUR_USERNAME/radiotherapy-qa-assistant.git\r\
  \ncd radiotherapy-qa-assistant\r\n\r\n# Create and activate virtual environment\r\npython -m venv .venv\r\
  \n.\\.venv\\Scripts\\Activate.ps1  # Windows\r\n# source .venv/bin/activate    # Linux/Mac\r\n\r\n#\
  \ Install dependencies\r\npip install -r requirements.txt\r\n\r\n# Validate installation\r\npython validate_system.py\r\
  \n```\r\n\r\n### Usage\r\n\r\n**\U0001F4CA QA Analysis Interface:**\r\n```powershell\r\nstreamlit run\
  \ app.py\r\n```\r\n- Upload CSV with measurement data\r\n- Select QA modules (TG142, TG224, Electron\
  \ Beam, TPS)\r\n- Review pass/fail results\r\n- Download Excel reports\r\n\r\n**⚡ Monitor Unit Calculator:**\r\
  \n```powershell\r\nstreamlit run dose_calculator_streamlit.py\r\n```\r\n- Calculate MU for given parameters\r\
  \n- Compare with TPS values\r\n- Validate within tolerance limits\r\n\r\n**\U0001F4CB Batch Processing:**\r\
  \n```powershell\r\npython \"python phase1_qa_tool.py\"\r\n```\r\n\r\n## \U0001F4C1 Project Structure\r\
  \n\r\n```\r\n├── app.py                      # Main Streamlit QA interface\r\n├── dose_calculator_streamlit.py\
  \ # MU calculator interface\r\n├── qa_checks.py               # Core QA function implementations\r\n\
  ├── app_utils.py               # Utility functions and data processing\r\n├── sample_data.csv      \
  \      # Example measurement data\r\n├── requirements.txt           # Python dependencies\r\n├── validate_system.py\
  \         # Installation validation script\r\n├── QUICKSTART.md             # Quick reference guide\r\
  \n├── TESTING_GUIDE.md          # Comprehensive testing instructions\r\n└── tests/                 \
  \   # Test suite\r\n\r\n```\r\n\r\n## \U0001F52C QA Modules\r\n\r\n### TG-142 Checks\r\n- **Output**:\
  \ ±2% tolerance\r\n- **Flatness**: ±3% tolerance  \r\n- **Symmetry**: ±3% tolerance\r\n\r\n### TG-224\
  \ Checks\r\n- **Dose Uniformity**: ±2% tolerance\r\n- **Beam Energy**: ±1 MV tolerance\r\n\r\n### Electron\
  \ Beam Checks\r\n- **Electron Output**: ±3% tolerance\r\n- **PDD**: ±2% tolerance\r\n\r\n### TPS Comparison\r\
  \n- **Planned vs Measured**: ±3% tolerance\r\n- **Gamma Index**: ≥95% pass rate\r\n\r\n## \U0001F4CA\
  \ Data Format\r\n\r\nYour CSV files should include relevant columns:\r\n\r\n```csv\r\noutput,flatness,symmetry,dose_uniformity,beam_energy,electron_output,PDD,planned_vs_measured,gamma_index\r\
  \n100.0,99.5,100.2,100.1,6.0,101.0,99.8,98.5,97.2\r\n98.5,102.1,99.8,99.5,6.1,99.2,100.5,101.2,96.8\r\
  \n```\r\n\r\n## \U0001F9EA Testing\r\n\r\n**Quick validation:**\r\n```powershell\r\npython validate_system.py\r\
  \n```\r\n\r\n**Run test suite:**\r\n```powershell\r\npython -m pytest tests/ -v\r\n```\r\n\r\n**Manual\
  \ testing:**\r\nSee `TESTING_GUIDE.md` for comprehensive testing procedures for medical physicists.\r\
  \n\r\n## \U0001F6E0️ For Developers\r\n\r\n### Adding New QA Modules\r\n\r\n1. Create function in `qa_checks.py`\r\
  \n2. Return list of dicts with keys: `Sample`/`index`, `parameter`, `status`, `value`\r\n3. Add to UI\
  \ selection in `app.py`\r\n4. Update tests in `tests/`\r\n\r\n### Integration with External Analysis\r\
  \n\r\nUse `integration_IC23.ipynb` as a template for incorporating custom analysis code (e.g., IC23\
  \ width calculations).\r\n\r\n## \U0001F4DA Documentation\r\n\r\n- **`QUICKSTART.md`** - Essential commands\
  \ and daily usage\r\n- **`TESTING_GUIDE.md`** - Comprehensive testing procedures\r\n- **`.github/copilot-instructions.md`**\
  \ - AI agent guidance for development\r\n\r\n## \U0001F91D Contributing\r\n\r\n1. Fork the repository\r\
  \n2. Create a feature branch (`git checkout -b feature/amazing-feature`)\r\n3. Commit your changes (`git\
  \ commit -m 'Add amazing feature'`)\r\n4. Push to the branch (`git push origin feature/amazing-feature`)\r\
  \n5. Open a Pull Request\r\n\r\n## \U0001F4C4 License\r\n\r\nThis project is licensed under the MIT\
  \ License - see the [LICENSE](LICENSE) file for details.\r\n\r\n## ⚠️ Disclaimer\r\n\r\nThis software\
  \ is intended for research and educational purposes. Always validate results against established procedures\
  \ and consult with qualified medical physicists before clinical use.\r\n\r\n## \U0001F3E5 Medical Physics\
  \ Community\r\n\r\nBuilt for medical physicists, by medical physicists. Feedback and contributions from\
  \ the medical physics community are welcome!\r\n\r\n---\r\n\r\n**Status: Ready for clinical testing\
  \ and validation**\r\n"

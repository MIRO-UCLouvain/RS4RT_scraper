readme_excerpt: "# DosePainting\n\n**Author**: Caterina Brighi\n\nScripts for the use of MRI and RT data\
  \ to derive heterogeneous dose prescriptions within the radiotherapy target, using patient-specific\
  \ cellularity data.\n\n\n**Setup/Build/Install** \n\nTo be able to use the above scipts you need to\
  \ have the following python packages intalled:\n\n```\n- matplotlib\n- SimpleITK\n- numpy\n- pandas\n\
  - datetime\n- os\n- glob\n- gzip\n- shutil\n- xlsxwriter\n- scipy\n- dicom2nifti\n- skimage\n- pydicom\n\
  - platipy\n```\n\n\n**Repository Structure** \n\nThere are three directories in this repository:\n\n\
  ***utils***\n\nThis repository contains three important scripts that contain functions used througout\
  \ the pre-processing and analysis pipelines. Please, make sure to copy these scripts into the *Pre-processing*\
  \ and the *Analysis* folders before running the scripts. \n\n***Pre-processing***\n\nThis repository\
  \ contains the scripts used to pre-process the MRI and RT patient data.\n\n***Analysis***\n\nThis repository\
  \ contains the scripts used to analyse the uniform and dose painting output data.\n\n\n****IMPORTANT****:\
  \ Run the scripts of the *Pre-processing* folder first, then run the scripts of the *Analysis* folder.\
  \ You always need to have the *ImageAnalysisFunctions.py*, *ImageStatisticsFunctions.py* and *ConvertNii_ToDoseFiles.py*\
  \ files, which you can find in the *utils* folder, in the same folders as the other .py files when running\
  \ pre-processing and analysis steps (i.e. Pre-processing and Analysis folders). \n\n\n**Patient Data\
  \ Directory Structure** \n\nThe original data directory before running the pre-processing steps should\
  \ be the following:\n```\nData supradirectory\n  Patient directory\n    dicom\n      CT\n        file1.dcm\n\
  \        file2.dcm\n        ...\n      RTDOSE\n        RBE_TOT.dcm\n      RTSTRUCT\n        rtss_xxxx.dcm\n\
  \       \n    MRI\n      baseline\n        micro\n          ADC_50_400_1000.nii\n          cellApp_CORRECTED_CTV.nii\n\
  \          cellApp_CORRECTED_GTV.nii\n          gtv_voxel_ok_3D.nii\n          ctv_voxel_ok_3D.nii\n\
  \  \n   regFiles\n      rigid_CTonT2.txt\n      rigid_T2onDWI.txt\n      xf_CTonT2.txt\n      xf_T2onDWI.txt\n\
  \ ```       \n\n\n****NOTE****: The nifti files in the *MRI/baseline/micro* folder are calculated elsewhere\
  \ by applying a model to convert DWI MRI ADC data into cellularity data (see publications: [Buizza et\
  \ al. 2021](https://doi.org/10.1002/mp.14689) and [Morelli et al. 2021](https://doi.org/10.1007/978-3-030-87615-9_3).\
  \ The text files in the regFiles folder are also generated in ITK-SNAP by performing a manual/semiautomated\
  \ rigid registration of the CT to T2 image and of the T2 image to the DWI image.\n\n\n**Citation**\n\
  \nIf you use code from this repository, please cite [![DOI](https://zenodo.org/badge/580071600.svg)](https://doi.org/10.5281/zenodo.14930761)\n"

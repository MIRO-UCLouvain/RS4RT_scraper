readme_excerpt: '# Brain Tumor Segmentation using 2D U-Net


  This project implements semantic segmentation of brain tumors from MRI scans using a 2D U-Net architecture.


  Dataset:

  BraTS 2020 dataset can be downloaded from:

  https://www.med.upenn.edu/cbica/brats2020/


  Place the dataset inside:


  dataset/BraTS2020_TrainingData/


  ## Approach

  - MRI preprocessing

  - Multi-modal MRI analysis

  - 2D U-Net based segmentation

  - Tumor mask prediction


  ## Technologies Used

  - Python

  - TensorFlow/Keras

  - NumPy

  - OpenCV

  - Nibabel

  - Matplotlib'

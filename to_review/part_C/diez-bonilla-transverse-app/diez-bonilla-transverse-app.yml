readme_excerpt: '## Fundamento científico y atribución


  Este prototipo implementa el flujo de trabajo y las variables (puntos anatómicos,

  planos de referencia, ángulos URMA/ULMA/LRMA/LLMA y normas de 99.6°/78.2°)

  descritos en el siguiente artículo, publicado en acceso abierto bajo licencia

  Creative Commons Attribution 4.0 (CC BY 4.0):


  > Diez-Rodrigálvarez, D.; Bonilla-Morente, E.; López-Jiménez, A.-J.

  > **A Novel Method for the Diagnosis of Transverse Maxillary Deficiencies Based on CBCT.**

  > *Diagnostics* **2026**, *16*, 1034.

  > https://doi.org/10.3390/diagnostics16071034



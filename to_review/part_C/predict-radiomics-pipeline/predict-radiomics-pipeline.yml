readme_excerpt: "# PrediCT GSoC 2026 Evaluation: Radiomics & Phenotyping\n\nThis repository contains the\
  \ implementation for the Google Summer of Code (GSoC) 2026 applicant evaluation tasks for the **PrediCT**\
  \ project. Specifically, this repository fulfills the **Common Task (Data Preprocessing)** and **Project\
  \ 2 (Radiomics & Phenotyping)**.\n\nThe goal of this pipeline is to establish a robust data loading\
  \ mechanism for the Stanford COCA dataset and to extract, analyze, and visualize radiomic features from\
  \ cardiac CT scans to identify clinical phenotypes correlated with Agatston scores.\n\n## \U0001F3AF\
  \ Objectives Met\n\n### 1. Common Task: COCA Dataset Preprocessing\nA tailored data pipeline designed\
  \ for medical imaging compatibility.\n* **HU Windowing:** Implemented Hounsfield Unit (HU) windowing\
  \ specifically optimized for cardiac CT scans to isolate relevant anatomical structures and calcium\
  \ deposits.\n* **Data Splitting:** Engineered a stratified train/validation/test split to ensure balanced\
  \ class distributions across the dataset.\n* **Pipeline Integration:** Created an efficient data loader\
  \ capable of handling volumetric medical data (DICOM/NIfTI) seamlessly.\n\n### 2. Project 2: Feature\
  \ Extraction & Statistical Analysis\nAn end-to-end radiomics pipeline leveraging `PyRadiomics` to correlate\
  \ image phenotypes with clinical outcomes.\n* **Feature Extraction:** Extracted comprehensive feature\
  \ sets including:\n  * **Shape:** Sphericity, Surface-to-Volume Ratio, Maximum 3D Diameter.\n  * **Texture\
  \ (GLCM, GLSZM, GLRLM):** Contrast, Correlation, Small/Large Area Emphasis, Run Percentage, and more.\n\
  * **Statistical Analysis:** Calculated clinical Agatston scores and performed robust statistical tests\
  \ (Spearman correlation, Kruskal-Wallis) to identify features significantly associated with calcium\
  \ severity categories (0, 1-99, 100-399, ≥400).\n* **Phenotype Characterization:** Generated unsupervised\
  \ clustering visualizations (UMAP/t-SNE) to discover hidden calcium phenotypes within the dataset.\n\
  \n## \U0001F4C2 Repository Structure\n\n```text\nGSOC/\n├── data/                           # Stanford\
  \ COCA dataset (Raw & Processed)\n├── src/\n│   ├── generate_data.py            # [Common Task] Preprocessing,\
  \ HU windowing, and data loaders\n│   ├── extract_features.py         # [Project 2] PyRadiomics extraction\
  \ script\n│   └── analyze_stats.py            # [Project 2] Statistical correlation, p-values, and visualization\n\
  ├── calcium_phenotypes_umap.png     # Output: UMAP clustering of patient phenotypes\n├── correlation_matrix.png\
  \          # Output: Spearman correlations of radiomic features\n├── feature_importance.png        \
  \  # Output: Visualized significance of extracted metrics\n├── radiomics_features.csv          # Output:\
  \ Raw extracted PyRadiomics dataset\n└── README.md                       # Project documentation\n"

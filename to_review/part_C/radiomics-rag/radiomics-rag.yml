readme_excerpt: "# \U0001F4C4 Radiomics RAG (MVP)\n\nA lightweight local RAG system for scientific PDF\
  \ documents with FAISS-based retrieval, embedding search, and reranking.\n\n---\n\n## \U0001F680 Current\
  \ Features\n\n* \U0001F4C4 PDF ingestion and metadata extraction\n* ✂️ Chunking of scientific documents\n\
  * \U0001F50E Vector embeddings (BGE / SentenceTransformers)\n* \U0001F9E0 FAISS vector search\n* \U0001F3AF\
  \ Two-stage retrieval:\n\n  * `k_retrieve` (FAISS candidate search)\n  * `k_rerank` (Cross-Encoder reranking)\n\
  * \U0001F916 Local LLM inference via Ollama (e.g., `llama3.2:1b`)\n* \U0001F4DA RAG pipeline with context\
  \ grounding\n* \U0001F4CA Retrieval evaluation utilities (`evaluate_retrieval`)\n\n---\n\n## \U0001F9F1\
  \ Architecture\n\n```text\nPDFs\n  ↓\nChunking\n  ↓\nEmbeddings (BGE)\n  ↓\nFAISS (k_retrieve)\n  ↓\n\
  Reranker (k_rerank)\n  ↓\nPrompt Builder\n  ↓\nOllama LLM\n  ↓\nAnswer + Sources\n```\n\n---\n\n## ⚙️\
  \ Key Parameters\n\n* `k_retrieve`: number of chunks retrieved from FAISS (e.g. 20–50)\n* `k_rerank`:\
  \ number of chunks passed to LLM after reranking (e.g. 3–5)\n\n---\n\n## \U0001F9EA Example Query\n\n\
  ```bash\npython3 run.py\n```\n\nOutput:\n\n* grounded answer from retrieved documents\n* ranked sources\
  \ with metadata (title, page, score)\n\n---\n\n## \U0001F9E0 Tech Stack\n\n* Python\n* FAISS\n* SentenceTransformers\
  \ (BGE embeddings + reranker)\n* LangChain (chunking utilities)\n* Ollama (local LLM inference)\n\n\
  ---\n\n## \U0001F4CC Status\n\nMVP stage:\n\n* stable retrieval pipeline\n* reranking enabled\n* local\
  \ inference working\n* evaluation hooks added\n\nNext steps:\n\n* hybrid search (BM25 + FAISS)\n* query\
  \ rewriting\n* advanced evaluation (Recall@k, MRR)\n* citation formatting improvements\n"

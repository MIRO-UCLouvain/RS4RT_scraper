readme_excerpt: "# QRATOR - Quantitative Radiomics for Auto Segmentation Training Optimization in Radiotherapy\n\
  \n## Overview\nQRATOR is a Django-based web application designed for medical image analysis, specifically\
  \ focusing on radiomic feature extraction and statistical analysis. The application provides powerful\
  \ tools for processing DICOM images, extracting radiomic features, and performing advanced statistical\
  \ analyses with interactive visualizations.\n\n## Features\n\n### Core Functionality\n- **DICOM Image\
  \ Processing**: Upload and process medical images in DICOM format\n- **Radiomic Feature Extraction**:\
  \ Extract detailed shape and texture features from medical images\n- **Interactive Visualization**:\
  \ Built with Bokeh for interactive data exploration\n- **User-Friendly Interface**: Web-based interface\
  \ for easy access and operation\n\n### Advanced Analysis\n- **Univariate Statistics**: Basic statistical\
  \ analysis of individual features\n- **Multivariate Outlier Detection**: Mahalanobis distance-based\
  \ outlier analysis\n- **Hierarchical Clustering**: Interactive dendrograms for patient grouping\n- **Z-Score\
  \ Analysis**: Statistical outlier detection for quality control\n\n### Visualization Tools\n- Interactive\
  \ histograms for feature distribution analysis\n- Hierarchical clustering visualizations\n- Statistical\
  \ summary tables\n- Patient-specific analysis views\n\n## Technical Stack\n- **Backend**: Python 3.x,\
  \ Django\n- **Frontend**: HTML5, CSS3, JavaScript\n- **Data Analysis**: NumPy, SciPy, scikit-learn\n\
  - **Visualization**: Bokeh (≥3.0.0)\n- **Medical Imaging**: pydicom\n\n## Installation\n\n### Prerequisites\n\
  - Python 3.8+\n- pip (Python package manager)\n- Virtual environment (recommended)\n\n### Setup\n1.\
  \ Clone the repository:\n   ```bash\n   git clone <repository-url>\n   cd drawprep\n   ```\n\n2. Create\
  \ and activate a virtual environment:\n   ```bash\n   python -m venv venv\n   source venv/bin/activate\
  \  # On Windows: venv\\Scripts\\activate\n   ```\n\n3. Install dependencies:\n   ```bash\n   pip install\
  \ -r requirements.txt\n   ```\n\n4. Run migrations:\n   ```bash\n   python manage.py migrate\n   ```\n\
  \n5. Start the development server:\n   ```bash\n   python manage.py runserver\n   ```\n\n6. Open your\
  \ browser and navigate to: http://127.0.0.1:8000/\n\n## Usage\n1. **Upload DICOM Images**: Use the upload\
  \ interface to add your medical images\n2. **Process Images**: Extract radiomic features from the uploaded\
  \ images\n3. **Analyze Results**: Explore the interactive visualizations and statistical analyses\n\
  4. **Export Data**: Download analysis results for further processing\n\n## Dependencies\nKey dependencies\
  \ include:\n- Django (≥4.0.0)\n- Bokeh (≥3.0.0)\n- NumPy (≥1.21.0)\n- SciPy (≥1.9.0)\n- scikit-learn\
  \ (≥1.0.0)\n- pydicom\n\nFor a complete list of dependencies, see `requirements.txt`.\n\n\n[![DOI](https://zenodo.org/badge/DOI/10.5281/zenodo.19551678.svg)](https://doi.org/10.5281/zenodo.19551678)\n\
  \n"

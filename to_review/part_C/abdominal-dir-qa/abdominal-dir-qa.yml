readme_excerpt: "# Abdominal DIR Validation\nDataset of abdominal CT image pairs with labeled blood vessel\
  \ bifurcations for deformable image registration (DIR) quality assurance.\n\n<img src=\"https://github.com/user-attachments/assets/7afabfcd-d8b2-4118-89d2-454137d1df53\"\
  \ width=\"350\">\n<img src=\"https://github.com/user-attachments/assets/89b192b8-b370-42e9-af8b-99d6b8aee7e4\"\
  \ width=\"350\">\n\n## Dataset Overview\nThis dataset contains 30 different cases of abdominal CT image\
  \ pairs, with a high number of vessel bifurcation landmark pairs identified in each case. This datsaet\
  \ is the first of its kind in the abdomen, and the landmarks can be used for DIR algorithm validation\
  \ and quality assurance. By comparing the distance between landmarks in the fixed and deformed moving\
  \ image after registration, researchers can calculate the target registration error (TRE) of their algorithm.\
  \ Images are obtained from several publicly available image repositories as well as clinical scans from\
  \ Barnes Jewish Hospital.\n\n* The presented dataset comprises 30 pairs of intra-patient abdominal-pelvis\
  \ CT images with various clinical quality.\n* Across the 30 cases, a total of 1895 landmark pairs were\
  \ labeled, averaging ~63 pairs per case\n* Landmark identification and pairing accuracy underwent rigorous\
  \ qauntitative analysis and manual validation.\n\nWe hope to publish the results of this study in a\
  \ dataset article. Due to the size of the image files, the full dataset is saved on our publicly available\
  \ Zenodo repository at https://doi.org/10.5281/zenodo.14362785. However, one example image pair with\
  \ landmarks is included within this Github repository, along with a tutorial in loading and processing\
  \ this data, to assist researchers in getting started with the dataset. Please see the tutorial folder\
  \ in this GitHub for more information.\n\nWe have published similar datasets in the lung and in the\
  \ liver. If interested, please see\n\nhttps://github.com/deshanyang/Lung-DIR-QA\n\nand\n\nhttps://github.com/deshanyang/Liver-DIR-QA\n\
  \nSome of the image data in the liver dataset overlaps with this dataset. The following table links\
  \ the case numbers from this dataset to those in our liver dataset. Using both of these in tandem will\
  \ prove useful to researchers trying to get a comprehensive view on their algorithm accuracy.\n\n\n\
  | **Abdomen index** | **Liver index** |\n|-------------------|-------------|\n| Case 1            |\
  \ Case 4      |\n| Case 3            | Case 5      |\n| Case 4            | Case 6      |\n| Case 5\
  \            | Case 7      |\n| Case 6            | Case 8      |\n| Case 7            | Case 9    \
  \  |\n| Case 8            | Case 11     |\n| Case 9            | Case 12     |\n| Case 10          \
  \ | Case 32     |\n| Case 11           | Case 33     |\n| Case 12           | Case 14     |\n| Case\
  \ 13           | Case 34     |\n| Case 14           | Case 17     |\n| Case 15           | Case 18 \
  \    |\n| Case 16           | Case 19     |\n| Case 17           | Case 20     |\n| Case 18        \
  \   | Case 36     |\n| Case 19           | Case 37     |\n| Case 20           | Case 24     |\n| Case\
  \ 21           | Case 26     |\n| Case 22           | Case 27     |\n| Case 24           | Case 28 \
  \    |\n| Case 27           | Case 29     |\n| Case 28           | Case 30     |\n| Case 30        \
  \   | Case 40     |\n\n\n## Dataset Generation\n![image](https://github.com/user-attachments/assets/01e9fb3a-d7af-48da-ae57-54f83e0056a1)\n\
  \n\nThe full details of this pathway will be described in the dataset article we hope to publish. In\
  \ steps of this pathway, we utilized FFDNet, TotalSegmentator, and PTVReg, publicly available tools\
  \ that are cited at the bottom of this document. \n\n## Dataset Use\nThe landmark pairs in this dataset\
  \ can be used to calculate the target registration error of a DIR algorithm.\n\n### Dataset Organization\n\
  The full dataset, available on zenodo, is organized into two formats. The first is a folder containing\
  \ 30 .mat files. In each of these files is the imaging data for both CT images in a pair, the landmark\
  \ locations for each image, and the voxelsizes for each image. The imaging data in the .mat files is\
  \ organized in the dimensions [coronal, sagittal, axial], with the order of the slices in accordance\
  \ with DICOM formatting [anterior:posterior,right:left,inferior:superior]. Landmark locations are saved\
  \ as 3 columns of pixel indices, with each column corresponding to the dimensions of the image, in the\
  \ same order. Image intensity values are saved as Hounsfield units shifted by 1000.\n\nThe second format\
  \ is a folder containing the imaging data in the NIfTI file format, with the landmarks stored in a text\
  \ file. Each image and its landmarks are stored in its own file, and are labeled by each case. Imaging\
  \ and landmark data dimensions are in the order [sagittal, coronal, axial], with slice order also in\
  \ accordance with the DICOM coordinate system [right:left,anterior:posteriorinferior:superior]. Landmark\
  \ locations are saved as 3 columns of pixel indices, with each column corresponding to the dimensions\
  \ of the image, in the same order. The NIfTI landmarks are shifted to start at an origin of [0,0,0]\
  \ instead of the MATLAB standard of [1,1,1]. Image intensity values are still Hounsfield units shifted\
  \ by 1000.\n\nBelow is a table summarizing each image case, its resolution, and the number of landmark\
  \ pairs. Flagged landmark pairs are those that are not refined but considered to be accurate pairs.\
  \ For more details, please reference our paper.\n| #  | Num of Landmark Pairs (Normal, Flagged) | Image\

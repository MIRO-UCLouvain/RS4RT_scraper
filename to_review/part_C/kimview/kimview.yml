readme_excerpt: "# Template to work on. Documentation work is in progressssssssss...\n\n![KIMView](https://github.com/Jothy/KIMView/blob/master/Icons/KIMView.png)\n\
  \n# KIMView: An open-source real-time tumour motion, dose, and anatomy visualisation tool for radiotherapy\n\
  \n## Introduction\n\nImage-guided radiotherapy (IGRT) typically focuses on measuring geometric errors\
  \ in patient’s anatomy, especially tumor position and methods to account for it. Geometric accuracy\
  \ is an indirect measure of treatment quality. The metric of most interest in radiotherapy that correlates\
  \ directly with clinical outcomes is dose to tumour and critical organs [[1]](https://pubmed.ncbi.nlm.nih.gov/20171515/).\
  \ The goal of this project is to develop an open-source real-time tumour motion, dose, and anatomy visualisation\
  \ tool for radiotherapy so the treatment team can see the dose being delivered to the dynamic patient.\n\
  \n## Related publications\n1. [J.Selvaraj,Modelling the effect of geometric uncertainties, clonogen\
  \ distribution and IMRT interpaly effect on Tumour Control Probability, 2013, PhD Thesis, University\
  \ of Liverpool, UK](https://tinyurl.com/JSelvarajPhDThesis)\n\n\n## Getting Started\n\n\n\n### Prerequisites\n\
  KIMView depends on the following toolkits:\n1. [QT 5.XX](https://www.qt.io/offline-installers) or later\
  \ but not QT 6.X\n2. [VTK 7.X](https://vtk.org/download/)\n3. [GDCM 2.8.X](https://sourceforge.net/projects/gdcm/files/gdcm%202.x/)\n\
  4. [ITK 4.XX](https://itk.org/download/)\n5. [CMake](https://cmake.org/download/)\n6. [Visual Studio\
  \ Community Edition](https://visualstudio.microsoft.com/vs/community/)\n\nEither you can download the\
  \ tookits and build VTK, GDCM & ITK yourself or else you can use the libs and DLLs provided.The sequence\
  \ of build is VTK->GDCM->ITK. You need to use CMake to configure the build process and genereate make\
  \ files then build build with Visual Studio. The current version of KIMView is only compatible with\
  \ the versions of libraries mentioned above.\n\n### Installing\n\nA step by step series of examples\

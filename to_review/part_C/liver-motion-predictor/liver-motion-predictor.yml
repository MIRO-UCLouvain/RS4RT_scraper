  \ alt=\"Financované Európskou úniou – NextGenerationEU\" height=\"64\">\n  &nbsp;&nbsp;\n  <img src=\"\
  docs/assets/logos/plan-obnovy.svg\" alt=\"Plán obnovy a odolnosti SR\" height=\"64\">\n</p>\n\n**SK:**\
  \ Tento projekt je financovaný Európskou úniou – NextGenerationEU prostredníctvom Plánu obnovy a odolnosti\
  \ Slovenskej republiky.\n\n**EN:** This project is funded by the European Union – NextGenerationEU through\
  \ the Recovery and Resilience Plan of the Slovak Republic.\n\n## Related repositories\n\n- [echoGAN](https://github.com/BraveDistribution/echogan):\
  \ extending the field of view\n  in transthoracic echocardiography\n- [UMBRA](https://github.com/BraveDistribution/UMBRA):\
  \ modality-invariant pretraining\n  for brain MRI"

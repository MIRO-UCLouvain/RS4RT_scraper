description: 'The following snippet of medical data may be generated when a doctor is writing notes to
  his/her patient or as a review of a therapy that he or she has done. "The patient was a 62-year-old
  man with squamous cell lung cancer, which was first successfully treated by a combination of radiation
  therapy and chemotherapy."  As we can see in this text, a person with a non-medical background cannot
  understand the various medical terms. We have taken a simple sentence from a medical data set to understand
  the problem and where one can understand the terms ''cancer'' and ''chemotherapy''.   We have been given
  such a data set in which a lot of text is written related to the medical domain. There are a lot of
  diseases that can be mentioned in the entire dataset and their related treatments are also mentioned
  implicitly in the text, which we saw in the aforementioned example that the disease mentioned is cancer
  and its treatment can be identified as chemotherapy using the sentence. However, note that it is not
  explicitly mentioned in the dataset about the diseases and their treatment, but we can build an algorithm
  to map the diseases and their respective treatment.  The train dataset is used to train the Continuous
  Random Field (CRF) model, and the test dataset is used to evaluate the built model.  '

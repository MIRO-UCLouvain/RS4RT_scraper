readme_excerpt: "# Brain Tumor Segmentation and Classification using Multi-Task U-Net\n\n![Python](https://img.shields.io/badge/Python-3.10-blue)\n\
  ![PyTorch](https://img.shields.io/badge/PyTorch-Deep_Learning-red)\n![Medical Imaging](https://img.shields.io/badge/Medical-Imaging-success)\n\
  \n## Overview\nThis project implements an end-to-end deep learning pipeline for **brain tumor segmentation\
  \ and classification** using the BRISC2025 dataset.\n\n### Highlights\n- U-Net segmentation\n- Attention\
  \ U-Net\n- Multi-task learning (Segmentation + Classification)\n- Separate vs Joint training\n- Hyperparameter\
  \ tuning (12 configurations)\n- Data augmentation & preprocessing\n- Evaluation using Dice, IoU, Pixel\
  \ Accuracy, Accuracy and F1-score\n\n## Results\n\n| Model | Dice | IoU | Classification Accuracy |\n\
  |------|------:|------:|------:|\n| Attention U-Net | **0.8310** | **0.7199** | - |\n| U-Net + Joint\
  \ Classifier | 0.7673 | 0.6376 | **95.81%** |\n\n## Tech Stack\n- Python\n- PyTorch\n- Albumentations\n\
  - OpenCV\n- NumPy\n- Matplotlib\n- Scikit-learn\n\n## Repository\n```\n.\n├── README.md\n├── LICENSE\n\
  ├── requirements.txt\n├── .gitignore\n└── notebooks/\n    └── CSE428_Project_Final.ipynb\n```\n\n##\
  \ Author\nMasrur Hoque\n"

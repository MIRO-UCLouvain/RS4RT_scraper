readme_excerpt: "# Tumor Synthesis conditioned on Radiomics\n\nTumor Synthesis conditioned on Radiomics\
  \ [Jonghun Kim], [Inye Na], [Eunsook ko], [Hyunjin Park] <br>\n\n[![arXiv](https://img.shields.io/badge/WACV2025-3635.3646-0F75BC.svg?style=plastic)](https://openaccess.thecvf.com/content/WACV2025/html/Kim_Tumor_Synthesis_Conditioned_on_Radiomics_WACV_2025_paper.html)\
  \ [![arXiv](https://img.shields.io/badge/arXiv-2509.15258-b31b1b.svg?style=plastic)](https://arxiv.org/abs/2509.24182)\n\
  \n\n\n# Overview\n\nThis repository contains the code for Tumor Synthesis conditioned on Radiomics.\n\
  \n The model architecture is illustrated below: \n\n![pipeline](assets/pipeline.png)\n\n\n\nOur code\
  \ was written by applying VQ-GAN, GigaGAN and BBDM into 3D methods. \n\nWe would like to thank those\
  \ who have shared their code. \n\nThanks to everyone who contributed this works and codes.\n\n- [Taming\
  \ Transformers for High-Resolution Image Synthesis](https://github.com/CompVis/taming-transformers)\
  \ \n- [Scaling up GANs for Text-to-Image Synthesis](https://github.com/lucidrains/gigagan-pytorch)\n\
  \n- [BBDM: Image-to-image Translation with Brownian Bridge Diffusion Models](https://github.com/xuekt98/BBDM)\n\
  \n<br>\n\n## Feature Extraction\n\nWe used pyradiomics to extract radiomics features. \n\nFor more details\
  \ on pyradiomics, please refer to the following document. \n\nhttps://pyradiomics.readthedocs.io/en/latest/index.html\n\
  \n\n\n## Citation\n\n```\n@InProceedings{Kim_2025_WACV,\n    author    = {Kim, Jonghun and Na, Inye\
  \ and Ko, Eun Sook and Park, Hyunjin},\n    title     = {Tumor Synthesis Conditioned on Radiomics},\n\
  \    booktitle = {Proceedings of the Winter Conference on Applications of Computer Vision (WACV)},\n\
  \    month     = {February},\n    year      = {2025},\n    pages     = {3635-3646}\n}\n```\n\n"

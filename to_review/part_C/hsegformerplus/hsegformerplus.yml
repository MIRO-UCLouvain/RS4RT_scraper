readme_excerpt: "# HSegFormer+\n\n> **A Hybrid CNN–Transformer model with Stage-wise Cross-Attention for\
  \ Brain Tumor MRI Segmentation**\n\nHSegFormer+ is a hybrid deep learning model for automatic brain\
  \ tumor segmentation in magnetic resonance imaging (MRI). The proposed architecture integrates convolutional\
  \ neural networks and vision transformers through a stage-wise cross-attention mechanism to jointly\
  \ exploit local anatomical details and global contextual representations.\n\nThe associated manuscript\
  \ is currently under peer review. The source code, pretrained models, and training scripts will be released\
  \ after the review process is completed.\n\n---\n\n## Overview\n\nHSegFormer+ is a hybrid CNN–Transformer\
  \ framework developed for brain tumor MRI segmentation. The proposed architecture integrates a SegFormer-B5\
  \ transformer encoder and a ResNet-50 CNN encoder through progressive stage-wise cross-attention, allowing\
  \ complementary local and global feature representations to be learned across multiple encoding stages.\n\
  \nThe fused features are further refined using lightweight residual refinement blocks and progressively\
  \ decoded through an attention-guided decoder with ASPP-based multi-scale contextual aggregation. The\
  \ framework supports both binary and multi-class segmentation and has been evaluated on the BraTS 2021,\
  \ Figshare, and BRISC 2025 datasets.\n\n---\n\n## Framework\n\n<p align=\"center\">\n<img src=\"Proposed-Model.png\"\
  \ width=\"95%\">\n</p>\n\nThe proposed framework consists of the following components:\n\n- **Dual-Path\
  \ Encoder**\n  - SegFormer-B5 Transformer encoder\n  - ResNet-50 CNN encoder\n\n- **Stage-wise Cross-Attention\
  \ Fusion**\n  - Progressive interaction between CNN and Transformer features at multiple encoding stages\n\
  \n- **Feature Refinement Block (FRB)**\n  - Lightweight residual refinement of fused feature representations\n\
  \n- **Attention-Guided Decoder**\n  - Progressive multi-scale feature reconstruction with attention\
  \ gates\n\n- **ASPP Module**\n  - Multi-scale contextual aggregation before the prediction layer\n\n\
  - **Prediction Head**\n  - Supports both binary and multi-class segmentation tasks\n\nFor the BraTS\
  \ 2021 dataset, the framework supports a **2.5D input representation**, while conventional **2D image\
  \ inputs** are used for the Figshare and BRISC 2025 datasets.\n\n---\n\n## Experimental Evaluation\n\
  \nThe proposed framework has been evaluated on three publicly available brain MRI datasets:\n\n- BraTS\
  \ 2021\n- Figshare Brain Tumor Dataset\n- BRISC 2025\n\nThe manuscript reports quantitative comparisons,\
  \ ablation studies, qualitative visualizations, and stability analysis across these datasets.\n\n---\n\
  \n## Research Topics\n\n- Brain Tumor Segmentation\n- Medical Image Analysis\n- Deep Learning\n- Hybrid\
  \ CNN–Transformer Networks\n- Cross-Attention\n- Medical Vision Transformers\n- Multi-scale Feature\
  \ Learning\n\n---\n\n## Repository Status\n\nThe repository currently provides:\n\n- Project overview\n\
  - Network architecture\n- Framework description\n\nThe complete implementation, pretrained weights,\
  \ training scripts, and usage examples will be released in a future update.\n\n---\n\n## License\n\n\
  The license information will be added when the repository is publicly released.\n\n\n\n\n\n\n\n\n\n\n\

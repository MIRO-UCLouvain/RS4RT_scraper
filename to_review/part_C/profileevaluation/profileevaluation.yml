readme_excerpt: "# ProfileEvaluation\n\n[![License: MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](LICENSE)\n\
  \nA desktop application for comparing radiation therapy beam profiles side-by-side using gamma analysis,\
  \ flatness, symmetry, and off-axis ratio metrics.\n\n---\n\n## Features\n\n- Load and compare **Reference**\
  \ and **Test** profiles from three file formats:\n  - PTW MCC/Mephysto (`.mcc`)\n  - DICOM RT Dose (`.dcm`)\
  \ — extracts inplane and crossplane profiles\n  - iba OmniPro Accept CSV (`.csv`)\n- Per-profile metrics:\
  \ **flatness** and **symmetry** (Varian and Elekta conventions), **off-axis ratio**\n- Optional **field\
  \ centering** at a configurable full-width threshold (default: FWHM)\n- **Gamma index** comparison with\
  \ configurable DTA, DD, normalization (CAX or max), global/local mode, and field-size restriction\n\
  - Gamma result summary: fraction passing (γ < 1), average γ, maximum γ\n- **Print to PDF** via the system\
  \ print dialog (includes settings, metrics, and comparison plot)\n\n---\n\n## Implementations\n\n- **[Windows\
  \ w/ WPF](dotNET/README.md)** for the primary WPF desktop application.\n<!-- - **[Python w/ Qt6](python/README.md)**\
  \ for a Python port of this tool offering the same analysis algorithms with a PyQt6 desktop app, a Streamlit\
  \ web interface, and Docker support (cross-platform, no .NET required).   -->\n\n---\n\n### License:\
  \ [MIT](LICENSE)\n"

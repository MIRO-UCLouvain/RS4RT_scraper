readme_excerpt: "# Worker + D1 Database\n\n![Worker + D1 Template Preview](https://imagedelivery.net/wSMYJvS3Xw-n339CbDyDIA/cb7cb0a9-6102-4822-633c-b76b7bb25900/public)\n\
  \n<!-- dash-content-start -->\n\nD1 is Cloudflare's native serverless SQL database ([docs](https://developers.cloudflare.com/d1/)).\
  \ This project demonstrates using a Worker with a D1 binding to execute a SQL statement. A simple frontend\
  \ displays the result of this query:\n\n```SQL\nSELECT * FROM comments LIMIT 3;\n```\n\nThe D1 database\
  \ is initialized with a `comments` table and this data:\n\n```SQL\nINSERT INTO comments (author, content)\n\
  VALUES\n    ('Kristian', 'Congrats!'),\n    ('Serena', 'Great job!'),\n    ('Max', 'Keep up the good\
  \ work!')\n;\n```\n\n> [!IMPORTANT]\n> When using C3 to create this project, select \"no\" when it asks\
  \ if you want to deploy. You need to follow this project's [setup steps](https://github.com/cloudflare/templates/tree/main/dvhcvnquery#setup-steps)\
  \ before deploying.\n\n<!-- dash-content-end -->\n\n## Getting Started\n\nOutside of this repo, you\
  \ can start a new project with this template using [C3](https://developers.cloudflare.com/pages/get-started/c3/)\
  \ (the `create-cloudflare` CLI):\n\n```\nnpm create cloudflare@latest -- --template=cloudflare/templates/dvhcvnquery\n\
  ```\n\nA live public deployment of this template is available at [https://dvhcvnquery.templates.workers.dev](https://dvhcvnquery.templates.workers.dev)\n\
  \n## Setup Steps\n\n1. Install the project dependencies with a package manager of your choice:\n   ```bash\n\
  \   npm install\n   ```\n2. Create a [D1 database](https://developers.cloudflare.com/d1/get-started/)\
  \ with the name \"bold-night-9c5b-d1\":\n   ```bash\n   npx wrangler d1 create bold-night-9c5b-d1\n\
  \   ```\n   ...and update the `database_id` field in `wrangler.json` with the new database ID.\n3. Run\
  \ the following db migration to initialize the database (notice the `migrations` directory in this project):\n\
  \   ```bash\n   npx wrangler d1 migrations apply --remote bold-night-9c5b-d1\n   ```\n4. Deploy the\
  \ project!\n   ```bash\n   npx wrangler deploy\n   ```\n"

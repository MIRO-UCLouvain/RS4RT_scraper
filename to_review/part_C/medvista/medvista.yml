readme_excerpt: "<p align=\"right\">\n  <b>English</b> | <a href=\"./README.zh-CN.md\">中文</a>\n</p>\n\n\
  # MedVista\n\nA web-based medical image viewer and processing platform for radiation therapy. Supports\
  \ DICOM, NIfTI, NRRD, and MHA formats with WebGL-powered 3D rendering, structure/dose overlays, RT plan\
  \ analysis, PACS connectivity, and AI-powered analysis.\n\n**Live Demo:** https://medical.1661688.xyz\n\
  \n![Version](https://img.shields.io/badge/version-2.1.0-059669)\n![Vue 3](https://img.shields.io/badge/Vue-3-42b883?logo=vue.js)\n\
  ![FastAPI](https://img.shields.io/badge/FastAPI-0.115-009688?logo=fastapi)\n![Python](https://img.shields.io/badge/Python-3.10+-3776ab?logo=python)\n\
  ![TypeScript](https://img.shields.io/badge/TypeScript-5-3178c6?logo=typescript)\n![Tailwind CSS](https://img.shields.io/badge/Tailwind-3.4-06b6d4?logo=tailwindcss)\n\
  ![Cornerstone3D](https://img.shields.io/badge/Cornerstone3D-4.22-ff6b35)\n\n## Why MedVista?\n\nMedVista\
  \ is not just another DICOM viewer — it is a **complete radiation therapy imaging platform** that combines\
  \ clinical-grade visualization with AI-powered intelligence, all running in a single web application.\n\
  \n### Unique Advantages\n\n**1. Full RT Workflow Coverage**\nUnlike general-purpose DICOM viewers, MedVista\
  \ covers the entire radiation therapy pipeline: CT/MRI/PET viewing, RT structure contour visualization,\
  \ dose distribution analysis, RT plan inspection, and TG-263 compliant structure naming — all in one\
  \ tool.\n\n**2. AI-Integrated Analysis**\nMedVista embeds AI directly into the clinical workflow:\n\
  - **Multi-slice analysis** — sends 5 uniformly-distributed slices or MIP projection to vision models\
  \ for richer context\n- **Intelligent structure rename** — LLM-powered fuzzy matching maps non-standard\
  \ DICOM structure names to TG-263 standards\n- **Smart windowing** — AI suggests optimal window width/level\
  \ based on modality and anatomy\n- **Burned-in annotation detection** — vision AI identifies patient-identifiable\
  \ text burned into pixel data\n- **One-click SR generation** — AI findings convert directly into DICOM\
  \ Structured Reports\n\n**3. PET-CT Fusion with SUV**\nFirst-class PET-CT fusion with automatic series\
  \ pairing, adjustable blend ratio, and real-time SUV (Standardized Uptake Value) calculation — features\
  \ typically found only in dedicated oncology workstations.\n\n**4. Client-Server Hybrid Architecture**\n\
  MedVista works both with and without a backend. In client-only mode, DICOM parsing, rendering, and measurement\
  \ all happen in the browser using WebWorkers and OffscreenCanvas. This enables offline clinical review,\
  \ air-gapped environments, and zero-install deployment.\n\n**5. Production-Grade Memory Management**\n\
  Built for real clinical datasets (10,000+ files, multi-GB studies):\n- Disk-based pixel storage with\
  \ numpy .npy format\n- LRU caches with bounded memory\n- Streaming volume transfer in 4MB chunks\n-\
  \ Background slice prefetching\n- Virtual scrolling for large tag tables\n\n**6. DICOM Protocol Native**\n\
  Full DICOMweb implementation (QIDO-RS, WADO-RS, STOW-RS) plus Modality Worklist, Structured Reports,\
  \ and DICOM Print — not a proprietary connector, but standards-based PACS integration.\n\n**7. Open\
  \ Source & Self-Hosted**\nMIT licensed, no vendor lock-in. Deploy on-premise for HIPAA/GDPR compliance.\
  \ Configure any OpenAI-compatible API for AI features — no mandatory cloud subscription.\n\n## Features\n\
  \n### WebGL 3D Viewer (Cornerstone3D)\n- **GPU-Accelerated Rendering** — WebGL-powered volume rendering\
  \ via Cornerstone3D with real-time MPR (axial, sagittal, coronal)\n- **Synchronized Crosshairs** — Cross-plane\
  \ localization using Cornerstone3D `CrosshairsTool`\n- **Window/Level Presets** — CT, Lung, Bone, Soft\
  \ Tissue, Brain, Subdural presets with interactive adjustment\n- **Voxel Inspection** — Real-time HU/value\
  \ readout at cursor position\n- **DICOM Tag Inspector** — Searchable tag viewer with filtering\n- **Image\
  \ Controls** — Rotation, flip, zoom/pan speed, orientation labels\n\n### Measurement & Annotation Tools\n\
  - **Length Tool** — Distance measurement in mm\n- **Angle Tool** — Angle measurement in degrees\n- **ROI\
  \ Statistics** — Rectangle/Elliptical ROI with mean, std, min, max HU values\n- **Probe Tool** — Point\
  \ value inspection\n- **Arrow Annotations** — Text annotations on images\n- **Measurement Export** —\
  \ CSV export of all measurements\n- **Persistent Annotations** — Save/load annotations per study\n\n\
  ### ROI Drawing (ITK-SNAP Style)\n- **Drawing Tools** — Paintbrush, polygon, rectangle, ellipse, magic\
  \ wand (flood fill), eraser\n- **Multi-Label System** — Multiple labeled regions with custom name and\
  \ color per label\n- **Cross-Plane Sync** — Draw on any plane (axial/sagittal/coronal), masks render\
  \ on all three simultaneously\n- **Morphological Post-Processing** — Erode, dilate, Gaussian smooth\
  \ on individual labels\n- **Undo/Redo** — 30-level undo/redo with zlib-compressed snapshots\n- **AI\
  \ Segmentation** — Auto-detect pathology via vision AI, text-guided segmentation, reference-guided segmentation\n\
  - **Export Formats** — NIfTI label map (.nii.gz) and DICOM SEG for clinical PACS integration\n- **NIfTI\
  \ Import** — Load previously exported label maps for continued editing\n- **Dual Rendering** — Works\
  \ with both Cornerstone3D WebGL and Canvas2D fallback viewers\n\n### DICOM Segmentation (SEG) Support\n\
  - **SEG Object Parsing** — Parse DICOM SEG objects and extract binary masks\n- **Segment Overlay** —\
  \ Display segmentation masks overlaid on volume data\n- **Per-Segment Controls** — Individual color,\
  \ visibility, and opacity per segment\n- **Segmentation Panel** — Sidebar panel for segment management\n\
  \n### Structure & Dose Overlays\n- **RT Structure Overlays** — Color-coded contour rendering with configurable\
  \ opacity and thickness\n- **ROI Centering** — One-click navigation to center of any structure across\
  \ all planes\n- **TG-263 Type Inference** — Automatic structure type classification (Target, OAR, External,\
  \ etc.)\n- **Dose Overlays** — Color-mapped dose distribution visualization\n- **Dose Summation** —\
  \ Combine multiple dose distributions into a single volume\n\n### 4D Dynamic Sequence Support\n- **Time-Series\
  \ Data** — Support for 4D-CT, cardiac MRI, dynamic contrast-enhanced series\n- **Time Slider** — Play/pause,\
  \ frame rate control, step-by-step navigation\n- **Automatic Detection** — Detect temporal positions\
  \ from DICOM TemporalPositionIdentifier\n\n### RT Plans\n- **Plan Viewer** — Beam summary with energy,\
  \ gantry angle, and weight\n- **Fractionation Display** — Number of fractions, dose per fraction, total\
  \ dose\n\n### PET-CT Fusion\n- **Dual-Volume Overlay** — Overlay PET on CT in the same viewport using\
  \ Cornerstone3D multi-volume rendering\n- **Blend Controls** — Adjustable blend ratio (0-100%) for PET\
  \ opacity\n- **Blend Mode Selection** — Additive or default blending modes\n- **SUV Display** — Standardized\
  \ Uptake Value calculation from DICOM metadata (RescaleSlope, PatientWeight, RadiopharmaceuticalDose)\n\
  - **Auto-Detection** — Automatically finds CT/PET series pairs within the same study\n- **PET Presets**\
  \ — Optimized window/level preset for PET (center: 2.5, width: 15)\n\n### AI Integration\n- **OpenAI-Compatible\
  \ API** — Call any vision model (GPT-4o, Claude, etc.) for medical image analysis\n- **SSE Progress\
  \ Streaming** — Real-time progress updates during analysis\n- **Structured Findings** — JSON-structured\
  \ results with region, description, severity, and confidence\n- **Custom Prompts** — User-defined analysis\
  \ prompts for specialized tasks\n- **Offline Fallback** — Simulated analysis when no API is configured\n\
  \n### DICOMweb / PACS Connectivity\n- **QIDO-RS Query** — Search studies/series/instances on remote\
  \ PACS\n- **WADO-RS Retrieve** — Fetch DICOM objects from PACS\n- **STOW-RS Store** — Push DICOM objects\
  \ to PACS\n- **Multi-Server** — Manage multiple PACS connections simultaneously\n- **PACS Browser**\
  \ — Tree-view study/series/instance browsing\n\n### DICOM Anonymization\n- **Profile-Based** — Predefined\
  \ profiles: Research, Clinical Trial, Full De-identification\n- **Custom Rules** — Per-tag anonymization\
  \ rules (remove, hash, replace, offset)\n- **Date Shifting** — Configurable date offset for temporal\
  \ anonymization\n- **Preview Mode** — Preview anonymization changes before applying\n- **Audit Log**\
  \ — Track all anonymization operations\n\n### Post-Processing\n- **HU-to-RED Conversion** — CT Hounsfield\
  \ Units to Relative Electron Density with 450+ point calibration table\n- **TG-263 Auto-Rename** — Batch\
  \ rename structures to TG-263 standard naming conventions\n- **Dose Summation** — Combine multiple dose\
  \ distributions into a single volume\n- **NRRD Export** — Export CT (HU) and RED volumes as NRRD files\
  \ for AI/ML pipelines\n\n### Converter & Sequence Analysis\n- **DICOM to NIfTI Conversion** — Convert\
  \ DICOM series to NIfTI format for AI/ML pipelines with real-time SSE progress\n- **Intelligent Sequence\
  \ Analysis** — Automatic classification of DICOM series into ADC, DWI, DCE, MG, US types\n- **DCE Phase\
  \ Detection** — Groups dynamic contrast-enhanced series by temporal position or acquisition time\n-\
  \ **DWI B-value Analysis** — Infers b-value count (single vs dual) from slice geometry\n- **Smart Series\
  \ Selection** — Automatically selects the best series for each type\n\n### Client-Only Mode\n- **Offline\
  \ DICOM Viewer** — Parse and view DICOM files entirely in the browser using `dicom-parser`\n- **No Backend\
  \ Required** — Works without a running backend server\n- **Drag & Drop** — Drop DICOM files directly\
  \ onto the viewer\n\n### PWA & Offline Support\n- **Progressive Web App** — Installable on desktop and\
  \ mobile with manifest.json\n- **Service Worker Caching** — Automatic caching of DICOM slice responses\
  \ using SHA-256 body-hashed cache keys\n- **Offline Repeat Access** — Previously viewed slices available\
  \ offline from cache\n\n### WebWorker Rendering & Parsing\n- **OffscreenCanvas Rendering** — Image compositing\
  \ and window/level in a dedicated WebWorker (non-blocking UI)\n- **Background DICOM Parsing** — Batch\
  \ DICOM metadata extraction offloaded to WebWorker for large uploads\n- **Fallback to Main Thread**\
  \ — Graceful degradation when WebWorker is unavailable\n\n### HTTP/2 Multiplexing\n- **HTTP/2 Protocol**\
  \ — Multiplexed connections for concurrent slice/volume requests without head-of-line blocking\n- **Automatic\
  \ Fallback** — Falls back to HTTP/1.1 if h2 is not available\n\n### Authentication (OIDC)\n- **OpenID\
  \ Connect** — Login via any OIDC provider (Keycloak, Auth0, etc.)\n- **JWT Tokens** — Secure token-based\
  \ session management\n- **Route Protection** — Auth guard on all routes except login/callback\n- **Configurable**\
  \ — Enable/disable via environment variables\n\n### Scalability & Memory Management\n- **Client-Side\
  \ Metadata Preview** — DICOM metadata parsed in-browser before upload\n- **Binary Slice Transfer** —\
  \ Slice data transferred as raw bytes (~60% smaller than JSON)\n- **Disk-Based Pixel Storage** — Pixel\
  \ data saved to `.npy` files on disk immediately after upload\n- **Resource Limits** — Per-session:\
  \ 10,000 files, 2 GB max size\n- **Session Cleanup** — 15-minute TTL with 2-minute cleanup cycle\n-\
  \ **Streaming Volume Transfer** — Large volumes streamed in 4MB chunks to avoid timeouts\n- **Slice\
  \ Prefetching** — Adjacent slices preloaded in background for smooth navigation\n- **Virtual Scrolling**\
  \ — DICOM tag table renders only visible rows for large tag sets\n- **LRU Caching** — Bounded memory\
  \ caches for volumes, structures, and doses\n\n### Multi-Format Support\n| Format | Extension | Reader\
  \ |\n|--------|-----------|--------|\n| DICOM | `.dcm` | pydicom |\n| NIfTI | `.nii`, `.nii.gz` | nibabel\
  \ |\n| NRRD | `.nrrd`, `.nhdr` | pynrrd |\n| MHA/MHD | `.mha`, `.mhd` | SimpleITK |\n\n### Additional\n\
  - **Bilingual UI** — English and Simplified Chinese (zh-CN)\n- **Dark Mode** — Full dark/light theme\
  \ support\n- **Responsive Layout** — Desktop and mobile-friendly interface\n- **Real-time Activity Log**\
  \ — Track all processing operations with level filtering (Info/Warning/Error/Success)\n- **Persistent\
  \ Settings** — Singleton composable syncs viewer, overlay, sidebar, and export preferences across all\
  \ views\n- **Security Hard"

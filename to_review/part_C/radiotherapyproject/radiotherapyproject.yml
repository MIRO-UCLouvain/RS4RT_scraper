readme_excerpt: "# \U0001F4D8 RadioTherapyProject — User Guide\n\n\n## How to clone the repo \n\n---\n\
  *git clone git@github.com:TalLychtenstein/RadioTherapyProject.git* \n\nor\n\n*git clone https://github.com/TalLychtenstein/RadioTherapyProject.git*\
  \ \n\n---\n\n## How to activate the env and open script \n---\n\n\n\n*conda activate arvous*\n\n*cd\
  \ RadioTherapyProject*\n\n*Python3 arvous_v5.py*\n\n\n\n\n---\n\n---\n## The script you need to run\
  \ is called arvous_v2.py \n---\n\n\n\n\n## How to Use the Interface\n\n### 1. Configure Settings\n-\
  \ Click **Settings**.  \n- Choose:\n  - **Resampling type**: `shape` or `spacing`.  \n  - **Resampling\
  \ value** (e.g., `512 × 512 × 512`).  \n- Select the **Output folder** where all results (tables, NIfTI\
  \ files, DVHs) will be saved.  \n\n\n---\n\n### 1. Batch Processing \n- Click **Batch Processing**.\
  \  \n- Choose the root dataset folder (must be organized as in the full resampled folder).  \n- ARVOUS\
  \ will automatically process **all patient sessions** in that dataset and add them to the output folder.\
  \  \n\n---\n\n---\n\n### 2. Load Data\n- **Single Patient**: Click **Load Patient Data** and select\
  \ one patient session folder.  \n\n⚠️ The dataset **must keep the current folder structure** , **order\
  \ of dcm files is not importent**:  \n\nPatient/\n├── CT/\n├── RTDOSE/\n└── RTSTRUCT/\n└── RTPLAN \n\
  \n---\n\n---\n### 3. Extract Metrics\n- Click **Extract Metrics**.  \n- This generates the **ROI Summary\
  \ Table** (volumes, DVH metrics, indices).  \n- The table is displayed in the interface **and** saved\
  \ automatically to the output folder.  \n\n---\n\n### 4. Create NIfTI Volumes\n- Click **Create NIfTI\
  \ Volumes** to export CT, dose, and ROI masks as `.nii.gz` files.  \n- These appear in the output folder\
  \ and can be opened in external tools (e.g., 3D Slicer, FSL).  \n\n---\n\n### 5. Show Visualization\n\
  - Click **Show Visualization** to open the visualization window.  \n- This allows you to:\n  - View\
  \ **CT slices** with dose overlays.  \n  - See **ROI masks** overlaid on anatomical images.  \n  - Interactively\
  \ scroll through slices for spatial validation.  \n\n--- \n\n\n\n\n<img width=\"1427\" height=\"893\"\
  \ alt=\"image\" src=\"https://github.com/user-attachments/assets/118d5846-fa71-4784-af3a-9dbdfb2e281a\"\
  \ />\n\n\n## \U0001F5A5️ ARVOUS Interface Overview\n\nWhen you run the application, the interface is\
  \ organized into several key panels:\n\n---\n\n### \U0001F527 Settings Panel (top section)\n- Displays\
  \ the **resampling configuration** you selected (e.g., shape/spacing, voxel size).  \n- Shows the chosen\
  \ **output path** where results will be saved.  \n\n---\n\n### \U0001FA7A Processing Patient Record\n\
  - Provides **patient/session details**, such as:\n  - Patient ID  \n  - Treatment type (e.g., SRS, WBRT)\
  \  \n  - Targeted region (e.g., right frontal, multiple mets)  \n  - Session date  \n- Displays the\
  \ **input path** for the dataset being processed.  \n\n---\n\n### \U0001F4CA Metadata Table (left side)\n\
  - Contains **general treatment metadata**:\n  - Prescription dose  \n  - Number of fractions  \n  -\
  \ Dose per fraction  \n\n---\n\n### \U0001F4D1 ROI Metrics Table (right side)\n- Lists all **Regions\
  \ of Interest (ROIs)**.  \n- Provides detailed metrics per ROI:\n  - **Volume (cc)**  \n  - **Minimum,\
  \ Maximum, Mean, Median, Mode, and Standard Deviation dose (Gy)**  \n  - **D2, D50, D98 values** (Gy)\
  \  \n  - **Homogeneity Index (HI)** and **Conformity Index (CI)**  \n\n---\n\n### \U0001F4C8 DVH Plots\
  \ (bottom)\n- Shows **Dose–Volume Histograms (DVHs)** for selected ROIs.  \n- You can:\n  - Select which\
  \ ROIs to display from the **ROI list** on the left.  \n  - Overlay multiple DVHs for comparison.  \n\
  \  - Adjust axis definitions:\n    - **X-axis** → *absolute dose* or *relative dose [% Rx]*  \n    -\
  \ **Y-axis** → *absolute volume (cc)* or *relative volume [%]*  \n\n---\n\n✅ In short:  \n- **Top =\
  \ settings & patient info**  \n- **Middle-left = metadata table**  \n- **Middle-right = ROI metrics**\
  \  \n- **Bottom = DVH plots with ROI selection**  \n\n\n---\n\n"

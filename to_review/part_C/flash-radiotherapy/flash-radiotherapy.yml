readme_excerpt: "# flash-radiotherapy\nThis folder contains the files to reproduce the results presented\
  \ in the article:\nI. González-Crespo, F. Gómez, Ó. López-Pouso and J. Pardo-Montero 2024 \"An in-silico\
  \ study of conventional and FLASH radiotherapy iso-effectiveness: potential impact of radiolytic oxygen\
  \ depletion on tumor growth curves and tumor control probability\", Physics in Medicine and Biology.\n\
  \n----------------------------------------------------------------------------------\n\nFolders:\n \
  \   Data_figures: contains the .mat files to reproduce the figures of the article\n    MATLAB_functions:\
  \ contains the code to reproduce the results of the article\n    \n    \n----------------------------------------------------------------------------------\n\
  \n\n    Data_figures\n\nThe name of the file indicates the corresponding figure in the article.\n\n\
  ** TumorSample **\nThis folder contains the parameters to generate the 100 simulated tumors with heterogeneous\
  \ oxygenation in the Omega sample.\n    \n    \n----------------------------------------------------------------------------------\n\
  \    \n    MATLAB_functions\n\n** mainFLASH **\nGenerates a simulated tumor with a heterogeneous distribution\
  \ of capillaries and calculates the initial oxygen distribution as well as its evolution during FLASH-RT.\n\
  \n** createGeometry **\nGenerates the geometry of a simulated tumor: a squared domain with a capillary\
  \ distribution represented by inner circles.\n(Edited from Rodríguez-Barbeito et al.)\n\n** decsg_fix\
  \ **\nThis function fixes a bug in the MATLAB function decsg.\n(Taken from Rodríguez-Barbeito et al.)\n\
  \n** pO2DiffusionSolver **\nDefines the equation for the oxygenation problem in CONV-RT.\n(Edited from\
  \ Rodríguez-Barbeito et al.)\n\n** flashDiffusionSolver **\nDefines the equation for the oxygenation\
  \ problem in FLASH-RT.\n\n** calculateSF **\nEvaluate the surviving fraction (SF) in CONV-RT using the\
  \ LQ model with OERs.\n\n** calculateFlashSF **\nEvaluate the surviving fraction (SF) in FLASH-RT using\
  \ the LQ model with OERs and the methodology proposed by Taylor et al.\n\n** getSF **\nUses the above\
  \ two functions to obtain the SF with CONV-RT and FLASH-RT.\n\n** ponderation **\nFunction to evaluate\
  \ the mean value of any variable from its values in the nodes of the mesh.\n(Edited from Rodríguez-Barbeito\
  \ et al.)\n\n** getVolume **\nCode to solve the model of tumor evolution.\n\n** annealing_optimization\
  \ **\nImplementation of the simulated annealing algorithm to fit the volume curves to experimental data.\n\
  \n** calculateTCP_hom **\nCalculates tumor control probability (TCP) in homogeneously oxygenated tumors.\n\
  \n** calculateTCP_het **\nCalculates the tumor control probability (TCP) in heterogeneously oxygenated\
  \ tumors.\n\n** getD50_D90 **\nObtains the D50 and D90 from TCP curves.\n\n----------------------------------------------------------------------------------\n"

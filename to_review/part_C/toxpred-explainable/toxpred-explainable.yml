readme_excerpt: "# \U0001F9EA ToxPred-Explainable\n\n**Explainable AI for Molecular Toxicity Prediction**\n\
  \n[![Streamlit App](https://static.streamlit.io/badges/streamlit_badge_black_white.svg)](https://toxpred-explainable.streamlit.app)\n\
  [![Python 3.13+](https://img.shields.io/badge/python-3.13+-blue.svg)](https://www.python.org/downloads/)\n\
  [![Streamlit](https://img.shields.io/badge/streamlit-1.41+-FF4B4B.svg)](https://streamlit.io)\n[![RDKit](https://img.shields.io/badge/rdkit-2023.9+-brightgreen.svg)](https://www.rdkit.org/)\n\
  [![License: MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](https://opensource.org/licenses/MIT)\n\
  [![Version](https://img.shields.io/badge/version-2.0.0-blue.svg)](https://github.com/alexdbatista/toxpred-explainable)\n\
  \nA production-ready web application for molecular toxicity prediction with atom-level explainability.\
  \ Search by chemical name or SMILES, get instant predictions, and visualize which atoms contribute to\
  \ toxicity.\n\n**\U0001F3A5 [Live Demo](https://toxpred-explainable.streamlit.app)** | **\U0001F4D6\
  \ [Quick Start](docs/QUICKSTART.md)**\n\n---\n\n## ✨ Key Features\n\n- \U0001F50D **Dual Search**: Chemical\
  \ name (PubChem API) OR SMILES structure input\n- \U0001F3AF **Instant Predictions**: Random Forest\
  \ classifier with 86.6% test accuracy\n- \U0001F9E0 **BBB Prediction**: Blood-Brain Barrier permeability\
  \ assessment\n- \U0001F5FA️ **Explainability Heatmaps**: Atom-level attribution showing toxic substructures\n\
  - \U0001F4CA **Drug-Likeness**: Lipinski's Rule of Five validation (MW, LogP, HBD, HBA)\n- \U0001F4C1\
  \ **Batch Processing**: Upload CSV files for bulk predictions\n- \U0001F4BE **Export Ready**: Download\
  \ heatmaps and predictions for reports\n- \U0001F4DA **Educational Content**: Comprehensive explanations\
  \ of SR-ARE assay and predictions\n- \U0001F517 **PubChem Integration**: Direct links to compound databases\n\
  \n---\n\n## \U0001F680 Quick Start\n\n### Try the Live App\nVisit **[toxpred-explainable.streamlit.app](https://toxpred-explainable.streamlit.app)**\
  \ to try it instantly!\n\n### Run Locally\n\n```bash\n# 1. Clone the repository\ngit clone https://github.com/alexdbatista/toxpred-explainable.git\n\
  cd toxpred-explainable\n\n# 2. Create conda environment (RDKit requires conda)\nconda create -n toxpred\
  \ python=3.13\nconda activate toxpred\nconda install -c conda-forge rdkit\n\n# 3. Install dependencies\n\
  pip install -r requirements.txt\n\n# 4. Launch app\nstreamlit run app.py\n```\n\nThe app will open at\
  \ `http://localhost:8501`\n\n---\n\n## \U0001F4CA Model Performance\n\n**Dataset**: EPA/FDA Tox21 Challenge\
  \ - SR-ARE Assay (Stress Response)\n- **Total Valid**: 7,831 molecules\n- **Training**: 5,832 molecules\
  \ (80%)\n- **Testing**: 1,999 molecules (20%)\n- **Class Distribution**: 16.2% toxic, 83.8% safe\n\n\
  **Metrics**:\n| Metric | Training | Testing |\n|--------|----------|---------|\n| Accuracy | 99.85%\
  \ | 86.6% |\n| Precision (Toxic) | - | 78% |\n| Recall (Toxic) | - | 78% |\n| F1-Score | - | 0.78 |\n\
  | ROC-AUC | - | 0.822 |\n\n**Architecture**: Random Forest (100 trees, class-balanced)  \n**Features**:\
  \ Morgan Fingerprints (2048-bit ECFP4, radius=2)\n\n---\n\n## \U0001F6E0️ Tech Stack\n\n| Component\
  \ | Technology | Purpose |\n|-----------|------------|---------|\n| **ML Framework** | scikit-learn\
  \ 1.3+ | Random Forest classifier |\n| **Cheminformatics** | RDKit 2023.9+ | Molecular processing, fingerprints,\
  \ visualization |\n| **Web Framework** | Streamlit 1.28+ | Interactive web application |\n| **API Integration**\
  \ | PubChem REST API | Chemical name → SMILES conversion |\n| **Data Processing** | pandas 2.0+, NumPy\
  \ 1.24+ | Data manipulation |\n| **Visualization** | Matplotlib 3.7+, PIL 10.0+ | Heatmaps and molecular\
  \ rendering |\n\n---\n\n## \U0001F3AE How to Use\n\n### 1. Search by Chemical Name\n```\nInput: \"aspirin\"\
  \ → System fetches SMILES from PubChem → Prediction\n```\n\n### 2. Search by SMILES\n```\nInput: \"\
  CC(=O)Oc1ccccc1C(=O)O\" → Direct prediction\n```\n\n### 3. Try Examples\nClick example molecules (Aspirin,\
  \ Caffeine, etc.) to auto-populate input\n\n### 4. Interpret Results\n- **Prediction**: Safe/Toxic with\
  \ probability\n- **Heatmap**: Red atoms = high toxicity contribution\n- **Lipinski**: Drug-likeness\
  \ validation\n- **Download**: Export heatmap as PNG\n\n### 5. Batch Analysis\nUpload CSV with `smiles`\
  \ column → Download predictions\n\n**CSV Format:**\n```csv\nsmiles\nCCO\nCC(=O)Oc1ccccc1C(=O)O\nCN1C=NC2=C1C(=O)N(C(=O)N2C)C\n\
  ```\n\n---\n\n## \U0001F4C1 Project Structure\n\n```\ntoxpred-explainable/\n│\n├── app.py          \
  \              # Main Streamlit application\n├── requirements.txt              # Python dependencies\
  \ (flexible constraints)\n├── README.md                     # Project documentation\n├── .gitignore\
  \                    # Git ignore patterns\n│\n├── .streamlit/\n│   └── config.toml              # Streamlit\
  \ theme configuration\n│\n├── src/\n│   ├── __init__.py\n│   ├── config.py                # Paths and\
  \ constants\n│   ├── utils.py                 # Molecular processing, PubChem API, explainability\n\
  │   └── train_model.py           # Model training pipeline\n│\n├── models/\n│   └── rf_toxpred_sr_are.pkl\
  \    # Trained Random Forest (86.6% test accuracy)\n│\n├── data/\n│   └── tox21_data.csv.gz        #\
  \ Tox21 SR-ARE dataset (auto-downloaded)\n│\n├── notebooks/\n│   └── toxpred_explainability_prototype.ipynb\
  \  # Development notebook\n│\n└── docs/\n    ├── model_card.md            # Model documentation\n  \
  \  └── technical_report.md      # Detailed analysis\n```\n\n---\n\n## \U0001F9EC Dataset Details\n\n\
  **Source**: EPA/FDA Tox21 Challenge  \n**Assay**: SR-ARE (Stress Response - Antioxidant Response Element)\
  \  \n**Biological Target**: Nuclear factor erythroid 2-related factor 2 (Nrf2) pathway\n\n**What it\
  \ measures**: Cellular stress response activation. Positive results indicate compounds that trigger\
  \ oxidative stress defense mechanisms, which can signal:\n- Toxicity concerns (excessive stress response)\n\
  - Potential therapeutic effects (moderate activation)\n\n**Data Quality**:\n- 7,831 total molecules\
  \ screened\n- 5,832 with valid SR-ARE measurements (1,999 missing data excluded)\n- High-throughput\
  \ screening (HTS) with quality control\n- Binary classification: Active (toxic) vs Inactive (safe)\n\
  \n---\n\n## \U0001F916 Model Architecture\n\n### Why Random Forest?\n\n1. **Handles Imbalance**: Class\
  \ weighting (16.2% toxic) without SMOTE\n2. **Feature Importance**: Built-in explainability via Gini\
  \ importance\n3. **No Feature Scaling**: Works directly with binary fingerprints\n4. **Production-Ready**:\
  \ Fast predictions (~10ms per molecule)\n5. **Robust**: Less prone to overfitting than deep learning\
  \ on small datasets\n\n### Why Morgan Fingerprints?\n\n- **Industry Standard**: Used in drug discovery\
  \ pipelines\n- **Structural Encoding**: Captures circular substructures (radius=2 = atoms + neighbors)\n\
  - **Fixed Size**: 2048 bits for consistent model input\n- **Collision Resistance**: Low chance of different\
  \ structures → same fingerprint\n\n### Training Details\n\n```python\nRandomForestClassifier(\n    n_estimators=100,\n\
  \    class_weight='balanced',  # Handles 16.2% vs 83.8% imbalance\n    random_state=42,\n    n_jobs=-1\n\
  )\n```\n\n**Cross-validation**: 5-fold CV during development  \n**Final model**: Trained on full 4,665-molecule\
  \ training set\n\n---\n\n## \U0001F3AF Use Cases\n\n### 1. Drug Discovery\n- **Early-stage screening**:\
  \ Filter out toxic candidates before synthesis\n- **Lead optimization**: Identify problematic substructures\
  \ to modify\n- **Cost savings**: Reduce expensive in vitro/in vivo testing\n\n### 2. Medicinal Chemistry\n\
  - **Structure-activity relationships**: Understand toxicity drivers\n- **Molecular design**: Avoid toxic\
  \ motifs in new compounds\n- **Patent analysis**: Assess safety profiles of competitive compounds\n\n\
  ### 3. Regulatory Compliance\n- **Pre-submission screening**: Check compounds before regulatory filing\n\
  - **Safety assessment**: Support ICH M7 mutagenicity evaluations\n- **Risk prioritization**: Rank compounds\
  \ for deeper toxicology studies\n\n### 4. Education & Research\n- **Teaching tool**: Demonstrate explainable\
  \ AI in chemistry\n- **Benchmarking**: Compare new models against established baseline\n- **Hypothesis\
  \ generation**: Explore oxidative stress mechanisms\n\n---\n\n## ⚠️ Limitations & Disclaimer\n\n**This\
  \ tool is for research purposes only. NOT for clinical or regulatory decisions.**\n\n### Model Limitations\n\
  - ✋ **Single assay**: Only predicts SR-ARE toxicity (oxidative stress)\n- ✋ **In vitro only**: Cell-based\
  \ assay doesn't capture full organism effects\n- ✋ **Limited chemical space**: Trained on Tox21 library\
  \ (may not generalize to all drugs)\n- ✋ **Class imbalance**: Model is conservative with 98% specificity\
  \ but 32% sensitivity\n\n### When NOT to use\n- ❌ Drug approval decisions\n- ❌ Patient treatment planning\n\
  - ❌ Regulatory submissions (without additional validation)\n- ❌ Replacing experimental toxicology\n\n\
  ### Recommended Next Steps\n1. Validate high-risk predictions with in vitro assays\n2. Test similar\
  \ compounds (series) for consistency\n3. Consult toxicology experts for interpretation\n4. Consider\
  \ multi-assay panels (hERG, CYP450, AMES, etc.)\n\n---\n\n## \U0001F680 Deployment\n\n### Streamlit\
  \ Cloud\n\n1. **Push to GitHub**:\n```bash\ngit init\ngit add .\ngit commit -m \"Initial commit: ToxPred-Explainable\"\
  \ngit remote add origin https://github.com/alexdbatista/toxpred-explainable.git\ngit push -u origin\
  \ main\n```\n\n2. **Deploy**:\n- Visit [share.streamlit.io](https://share.streamlit.io)\n- Connect GitHub\
  \ repository\n- Set main file: `app.py`\n- Click \"Deploy\"\n\n3. **Update README badge** with your\
  \ Streamlit Cloud URL\n\n### Local Deployment\n\n```bash\n# Production mode with gunicorn (optional)\n\
  pip install streamlit\nstreamlit run app.py --server.port 8501 --server.headless true\n```\n\n---\n\n\
  ## \U0001F91D Contributing\n\nContributions welcome! Areas for improvement:\n- [ ] Multi-assay predictions\
  \ (hERG, AMES, CYP450)\n- [ ] Uncertainty quantification (conformal prediction)\n- [ ] Attention-based\
  \ explainability (GNNExplainer)\n- [ ] Active learning for data-efficient retraining\n- [ ] API endpoint\
  \ for programmatic access\n\n---\n\n## \U0001F9E0 How It Works\n\n### 1. Featurization\n- Input: SMILES\
  \ string (e.g., `CCO`)\n- Convert to RDKit molecule object\n- Generate **Morgan Fingerprint** (ECFP4):\
  \ 2048-bit circular fingerprint encoding molecular structure\n\n### 2. Prediction\n- Random Forest classifier\
  \ (100 trees)\n- Class-weighted to handle imbalanced data (16% toxic)\n- Output: Probability of toxicity\
  \ (0-1)\n\n### 3. Explainability\n- For each atom: perturb fingerprint → measure change in prediction\n\
  - High contribution → red color (toxic)\n- Low contribution → blue color (safe)\n- Uses RDKit's `SimilarityMaps.GetSimilarityMapForModel`\n\
  \n### 4. Lipinski's Rule\nDrug-likeness filter used in pharma:\n- ✅ Molecular Weight < 500 Da\n- ✅ LogP\
  \ < 5\n- ✅ H-bond donors < 5\n- ✅ H-bond acceptors < 10\n\n---\n\n## \U0001F4C8 Example Results\n\n\
  ### Toxic Molecule: TOX3021\n**SMILES**: `CCOc1ccc2nc(S(N)(=O)=O)sc2c1`\n\n| Property | Value |\n|----------|-------|\n\
  | Prediction | TOXIC |\n| Probability | 0.38 (38%) |\n| Lipinski Pass | ✅ Yes |\n| Toxic Substructure\
  \ | Sulfonamide group (S(N)(=O)=O) |\n\n**Heatmap**: Red highlighting on sulfonamide group indicates\
  \ this functional group drives the toxicity prediction.\n\n### Safe Molecule: Ethanol\n**SMILES**: `CCO`\n\
  \n| Property | Value |\n|----------|-------|\n| Prediction | SAFE |\n| Probability | 0.08 (8%) |\n|\
  \ Lipinski Pass | ✅ Yes |\n\n---\n\n## \U0001F393 Educational Value\n\nThis project demonstrates:\n\n\
  1. **Explainable AI**: Moving beyond black-box models to interpretable predictions\n2. **Domain Knowledge**:\
  \ Understanding cheminformatics, drug-likeness rules\n3. **Software Engineering**: Modular code, configuration\
  \ management, professional structure\n4. **Data Science Pipeline**: Download → Clean → Featurize → Train\
  \ → Deploy\n5. **Production Readiness**: Web app, batch processing, exports, error handling\n\n---\n\
  \n## \U0001F52E Future Enhancements\n\n- [ ] Multi-assay prediction (all 12 Tox21 assays)\n- [ ] Deep\
  \ learning models (Graph Neural Networks)\n- [ ] Molecular property optimization (suggest modifications)\n\
  - [ ] Integration with PubChem/ChEMBL databases\n- [ ] Docker containerization for easy deployment\n\
  - [ ] REST API for programmatic access\n\n---\n\n## \U0001F4DA References\n\n- **Tox21 Dataset**: [EPA/FDA\
  \ Tox21 Challenge](https://tripod.nih.gov/tox21/challenge/)\n- **RDKit**: [Open-source cheminformatics\
  \ toolkit](https://www.rdkit.org/)"

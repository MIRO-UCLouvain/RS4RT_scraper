readme_excerpt: "<p align=\"center\">\n  <img src=\"figures/radiotherapy_dl_data_toolkit_logo.png\" alt=\"\
  Radiotherapy DL Data Toolkit logo\" width=\"580\">\n</p>\n\n<h1 align=\"center\">Radiotherapy DL Data\
  \ Toolkit</h1>\n\n<p align=\"center\">\n  ESAPI-based research toolkit for transforming clinical radiotherapy\
  \ plans into anonymised, deep-learning-ready datasets.\n</p>\n\n<p align=\"center\">\n  <strong>Clinical\
  \ RT plans</strong> → <strong>cohort selection</strong> → <strong>DICOM retrieval</strong> → <strong>research\
  \ plan reconstruction</strong> → <strong>GPU-ready arrays</strong>\n</p>\n\n---\n\n## Why this repository\
  \ exists\n\nWhen this work started, there was no single ready-made library or package that could take\
  \ clinical radiotherapy plans from a treatment planning environment and turn them into anonymised, structured,\
  \ research-ready inputs for deep learning. We therefore built this toolkit to bridge that gap.\n\nThis\
  \ repository packages the workflow used to move from clinically approved radiotherapy data to a reproducible\
  \ research representation that can be used for downstream model development. The aim is to lower the\
  \ technical barrier for other researchers who want to start from real clinical plans rather than rebuild\
  \ the entire data bridge from scratch.\n\nThe public repository is intentionally sanitised. All server\
  \ names, AE titles, usernames, passwords, file paths, patient identifiers, and institution-specific\
  \ values have been replaced with placeholders and must be configured locally.\n\n## End-to-end workflow\n\
  \n<p align=\"center\">\n  <img src=\"figures/workflow_diagram.png\" alt=\"Workflow diagram of the radiotherapy\
  \ deep learning data pipeline\" width=\"920\">\n</p>\n\nThe toolkit is organised around the main steps\
  \ required to convert clinical radiotherapy plans into deep-learning-ready research data:\n\n1. **Data\
  \ search and cohort identification**  \n   Query ARIA/SQL and define the patient cohort of interest.\n\
  \n2. **Data transfer and retrieval workflow**  \n   Retrieve the required DICOM radiotherapy objects\
  \ using C-FIND and C-MOVE.\n\n3. **Plan generation**  \n   Extract planning parameters from the original\
  \ clinical plan, recreate the plan in a research ESAPI environment, optimise it, and export structured\
  \ outputs for GPU-based downstream processing.\n\n## What the toolkit provides\n\nThis repository demonstrates\
  \ how to:\n\n- identify a clinically meaningful cohort from the oncology information system,\n- map\
  \ selected plans and studies to the required RT objects,\n- retrieve CT, RTSTRUCT, RTPLAN, RTDOSE, and\
  \ related DICOM objects into a research environment,\n- extract planning parameters from the original\
  \ treatment plan,\n- recreate and optimise a research version of the plan in ESAPI,\n- export volumes\
  \ and derived arrays for deep learning workflows.\n\n\n\n## Repository structure\n\n```text\nradiotherapy-dl-data-toolkit/\n\
  ├── 01_data_search_and_cohort_identification/\n│   ├── aria_access.py\n│   ├── filtered_records.example.csv\n\
  │   ├── query_aria_cohort.py\n│   └── README.md\n├── 02_data_transfer_and_retrieval_workflow/\n│   ├──\
  \ dicom_nodes.example.json\n│   ├── move_patient_data.cs\n│   └── README.md\n├── 03_plan_generation/\n\
  │   ├── 01_extraction_of_planning_parameters_from_the_clinical_plan/\n│   │   ├── extract_plan_parameters.py\n\
  │   │   ├── parameters.example.txt\n│   │   └── README.md\n│   ├── 02_plan_setup_and_optimisation/\n\
  │   │   ├── rebuild_baseline_plan.cs\n│   │   ├── reconstruction.example.yaml\n│   │   └── README.md\n\
  │   ├── 03_export_to_gpu_server_and_research_image_reconstruction/\n│   │   ├── export_research_plan_to_gpu.py\n\
  │   │   ├── gpu_export_config_template.py\n│   │   ├── gpu_export_utils.py\n│   │   └── README.md\n\
  │   └── README.md\n├── figures/\n│   ├── radiotherapy_dl_data_toolkit_logo.png\n│   ├── workflow_diagram.png\n\
  │   └── workflow_diagram.svg\n├── .gitignore\n├── README.md\n└── requirements.txt\n```\n\n\n## Environment\
  \ and setup\n\nThis toolkit assumes a **research Eclipse/ESAPI environment**, not a generic Python-only\
  \ env.\n\nSee `requirements.txt` for the practical environment notes, including:\n- research instance\
  \ expectations,\n- Eclipse and ESAPI prerequisites,\n- writable-script requirement,\n- Visual Studio\
  \ / script-launch workflow,\n- Python package dependencies.\n"

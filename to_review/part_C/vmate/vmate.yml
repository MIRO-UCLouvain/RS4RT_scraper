readme_excerpt: "# Hi, my name is Vinayak! \U0001F44B\n### I have created \n\n\n![Logo](https://img.icons8.com/fluency/82/valorant.png)\n\
  \n# Vmate\n\n\n\nThis is complete social media android application where you can make new friends, chat\
  \ with them privatly, can share your beautiful moments by uploading post or through story.\n\n## Screenshots\n\

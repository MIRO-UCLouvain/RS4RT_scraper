  \ width=\"300\" height=\"500\"\"></td>\n </tr>\n           \n </table>\n\n\n     \n## Features\n\n-\
  \ All the things are working in a real time, so if any change will happen then all the users can see\
  \ the change immediatly in real time.\n- Authentication with email and password.\n- Can add own posts.\n\
  - Can like and comment to existing posts.\n- Can add own story and view existing stories.\n- Can chat\
  \ with freinds in real time.\n- Can get all the notifications about like, comment, follow.\n- Can follow\
  \ anyone and make new friends.\n- Can update profile photo as well as cover photo. \n- Can add or update\
  \ profession and bio.\n\n\n\n## Color Reference\n\n| Color             | Hex                       \

readme_excerpt: "# \U0001F9E0 CerebraScan AI <br>\r\n\r\n![Python](https://img.shields.io/badge/Python-3.10-blue)\r\
  \n![DVC](https://img.shields.io/badge/DVC-2.0+-orange)\r\n![MLflow](https://img.shields.io/badge/MLflow-Tracking-yellow)\r\
  \n![AWS S3](https://img.shields.io/badge/AWS-S3-ff9900)\r\n![Docker](https://img.shields.io/badge/Docker-Containerized-blue)\r\
  \n\r\n### Reproducible Neuro-Imaging & Clinical Pipeline <br>\r\n\r\n\U0001F6A7 Status: In Active Development\
  \ (Not Production Ready Yet)\r\n\r\n---\r\n\r\n## \U0001F9FE Overview <br>\r\n\r\nCerebraScan AI is\
  \ an end-to-end multimodal MRI analysis system for **brain tumor segmentation**, **volumetric analysis**,\
  \ **radiogenomic inference**, and **automated clinical reporting**, while integrating production-grade\
  \ **MLOps**, **data versioning**, and **deployment tooling**.<br><br>\r\n\r\nIt combines:<br>\r\n• **Deep\
  \ Learning (U-Net & nnU-Net)**<br>\r\n• **Radiogenomics**<br>\r\n• **3D Visualization**<br>\r\n• **Longitudinal\
  \ Tracking**<br>\r\n• **LLM-based Reporting**<br>\r\n• **DVC + S3 Data Management**<br>\r\n• **MLflow\
  \ Experiment Tracking**<br>\r\n• **Dockerized Deployment**<br><br>\r\n\r\nto support neuro-oncology\
  \ research and clinical workflows.\r\n\r\n---\r\n\r\n## \U0001F3AF Clinical Approach & Research Objectives\
  \ <br>\r\n\r\nThis system targets real-world neuro-oncology use-cases through the following objectives:<br><br>\r\
  \n\r\n1. **Volumetric 3D Tumor & Edema Analysis** using normalized T1, T1CE, T2, and FLAIR modalities.<br>\r\
  \n2. **Color-Coded Sub-Region Annotation** for edema, NET, ET, and background.<br>\r\n3. **Intracranial\
  \ Tumor Classification** (Glioma, Meningioma, Pituitary, Schwannomas, Medulloblastoma, Ependymoma).<br>\r\
  \n4. **2D→3D Fly-Through Visualization** with grayscale or RGB rendering.<br>\r\n5. **Longitudinal Delta\
  \ Tracking** for growth/shrinkage velocity and treatment response.<br>\r\n6. **Surgical No-Go Zone Identification**\
  \ to analyze anatomical adjacency and risk.<br>\r\n7. **Biopsy Site Recommendation** via hotspot-based\
  \ heatmaps for high-grade tissue sampling.<br>\r\n8. **Radiogenomic Virtual Biopsy** predicting **IDH\
  \ mutation** & **MGMT methylation**.<br>\r\n9. **Automated LLM-Based Reporting** that consolidates all\
  \ patient findings into structured radiology-style documentation.<br>\r\n\r\n---\r\n\r\n## \U0001F9F1\
  \ System Implementation <br>\r\n\r\n### **1. Segmentation Backbone** <br>\r\n\r\nSupported models:<br>\r\
  \n• **U-Net (TensorFlow/Keras)** — baseline 2D/3D segmentation<br>\r\n• **nnU-Net (PyTorch)** — auto-configured\
  \ SOTA clinical segmentation<br><br>\r\n\r\nnnU-Net is used as the default segmentation engine due to\
  \ its automated preprocessing, architecture tuning, and training pipeline.<br><br>\r\n\r\n### **2. Classification**\
  \ <br>\r\n\r\nPost-segmentation, extracted radiomics + intensity features can be used for:<br>\r\n•\
  \ Tumor type classification<br>\r\n• Low-grade vs high-grade prediction<br><br>\r\n\r\n### **3. Radiogenomics**\
  \ <br>\r\n\r\nUsing **TCGA-GBM**, the system aims to non-invasively predict:<br>\r\n• **IDH mutation\
  \ status**<br>\r\n• **MGMT promoter methylation**<br><br>\r\n\r\n### **4. Volumetric Analysis** <br>\r\
  \n\r\n3D reconstruction enables:<br>\r\n• ET / NET / Edema volume extraction<br>\r\n• Ratio & spread\
  \ metrics<br>\r\n• Treatment response quantification<br><br>\r\n\r\n### **5. Visualization** <br>\r\n\
  \r\nSupports:<br>\r\n• 2D slice overlays<br>\r\n• 3D surface rendering<br>\r\n• RGB segmentation overlays<br>\r\
  \n• Fly-through mode<br><br>\r\n\r\n### **6. Delta Tracking** <br>\r\n\r\nFor multi-session scans of\
  \ the same patient, the system computes:<br>\r\n• Tumor growth rate<br>\r\n• Edema evolution<br>\r\n\
  • Volumetric velocity maps<br>\r\n• Clinical progression markers<br><br>\r\n\r\n---\r\n\r\n## \U0001F31F\
  \ Feature Summary <br>\r\n\r\n• Multimodal MRI segmentation<br>\r\n• Clinical 3D volumetric mapping<br>\r\
  \n• Sub-region color coding<br>\r\n• Tumor-type classification<br>\r\n• Radiogenomic virtual biopsy<br>\r\
  \n• Biopsy hotspot recommendation<br>\r\n• Surgical risk/no-go analysis<br>\r\n• Longitudinal progression\
  \ tracking<br>\r\n• DICOM/NIfTI pipeline<br>\r\n• MLOps-ready architecture<br>\r\n• Automated structured\
  \ reporting<br>\r\n\r\n---\r\n\r\n## \U0001F4C2 Dataset & Modalities <br>\r\n\r\n**BraTS 2023**<br>\r\
  \n• **Task:** Tumor sub-region segmentation<br>\r\n• **Modalities:** T1, T1CE, T2, FLAIR<br>\r\n• **Labels:**\
  \ Edema, NET, ET<br><br>\r\n\r\n**TCGA-GBM**<br>\r\n• **Task:** Radiogenomics + classification<br>\r\
  \n• **Labels:** IDH, MGMT, survival metadata<br>\r\n\r\n---\r\n\r\n## \U0001F916 Current Model Support\
  \ <br>\r\n\r\n• **U-Net (Keras/TensorFlow)**<br>\r\n\r\n---\r\n\r\n# \U0001F9F0 Production & MLOps Layer\
  \ (DVC + S3 + MLflow) <br>\r\n\r\nCerebraScan AI includes a **production-grade data & experiment workflow**\
  \ using:<br><br>\r\n\r\n• **DVC** for dataset versioning<br>\r\n• **AWS S3** for remote storage<br>\r\
  \n• **MLflow** for tracking experiments & metrics<br>\r\n• **Docker** for deployment<br>\r\n• **Git\
  \ branching** for parallel experimentation<br><br>\r\n\r\nThis transforms the project from a notebook-based\
  \ ML experiment into a **scalable MLOps pipeline** for research labs & hospitals.<br>\r\n\r\n---\r\n\
  \r\n## \U0001F9F1 System Architecture <br>\r\n\r\nAdmin (CPU)<br>\r\n│<br>\r\n│ dvc push (write)<br>\r\
  \n▼<br>\r\nAWS S3 Bucket<br>\r\n▲<br>\r\n│ dvc pull (read)<br>\r\n│<br>\r\nGPU Machines (Training/Inference)<br>\r\
  \n│<br>\r\n└── git push (experiment branches)<br>\r\n▼<br>\r\nGit Remote (GitHub/GitLab)<br>\r\n\r\n\
  ---\r\n\r\n## \U0001F4E6 Tech Stack <br>\r\n\r\n| Component | Tool |\r\n|---|---|\r\n| Data Versioning\
  \ | DVC |\r\n| Remote Storage | S3 |\r\n| Experiment Tracking | MLflow |\r\n| Access Control | IAM |\r\
  \n| Model Training | GPU Machines |\r\n| Formats | NIfTI / DICOM |\r\n| Deployment | Docker |\r\n\r\n\
  ---\r\n\r\n## \U0001F510 Security Model <br>\r\n\r\n• S3 stores sensitive dataset artifacts<br>\r\n\
  • DVC manages version references<br>\r\n• Git stores only metadata & code<br>\r\n• IAM restricts write-access\
  \ to admin<br>\r\n• If used in a team, teammates have read-only S3 access<br>\r\n\r\n---\r\n\r\n## \U0001F464\
  \ Maintainer <br>\r\n\r\n\r\nThis project is maintained by **Shardul Salodkar**.<br>\r\n"

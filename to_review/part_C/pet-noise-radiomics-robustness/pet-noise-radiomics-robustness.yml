readme_excerpt: "# PET Noise Radiomics Robustness\n\nReproducible open-data study evaluating how PET image\
  \ noise affects lesion segmentation, radiomics feature stability, and downstream biomedical model reliability\
  \ in public PET/CT cancer imaging datasets.\n\n**Maintainer:** Paul Skeffington, MS, MPH  \n**Repository\
  \ status:** active research scaffold; no analysis results should be treated as final until data acquisition,\
  \ citation validation, and reproducibility checks are complete.  \n**Last documentation refresh:** 2026-08-17\n\
  \n## Public-Interest Research Boundary\n\nThis repository is maintained for biomedical imaging scholarship,\
  \ open-data methods, reproducible radiomics research, and transparent methodological evaluation.\n\n\
  It does not provide clinical advice, patient-level findings, diagnostic interpretation, treatment recommendations,\
  \ product claims, automated decision authority, regulatory conclusions, or deployment guidance. Any\
  \ downstream modeling discussed here remains research-bounded until independently validated for its\
  \ intended use.\n\n## Working aim\n\nThis repository supports a nuclear-medicine and biomedical data-science\
  \ project focused on low-count PET, simulated noise perturbation, radiomics robustness, and open cancer-imaging\
  \ datasets.\n\n## Core research question\n\nHow sensitive are PET/CT lesion radiomics features and segmentation-derived\
  \ measures to simulated image noise, and which features remain stable enough for defensible downstream\
  \ biomedical modeling?\n\n## Current update — 2026-08-17\n\nThe repository remains pre-analysis and\
  \ manuscript-preparation oriented. The current documentation priority is to verify dataset access terms,\
  \ lock a manifest schema for imaging series and masks, preserve source and citation metadata, and keep\
  \ all performance or robustness claims explicitly bounded until reproducibility and validation checks\
  \ are complete.\n\n### Current Stage\n\n- Stage: Open-data biomedical imaging scaffold\n- Evidence status:\
  \ Analysis validation pending\n- Data status: Public or appropriately governed imaging data only; raw\
  \ imaging remains outside git unless redistribution is explicitly permitted\n- Primary limitation: Requires\
  \ dataset verification, reproducible extraction, sensitivity analysis, and independent validation before\
  \ publication-level or clinical claims\n\n## Current scope\n\nStage 1 establishes the manuscript and\
  \ analysis scaffold. It does not claim completed analysis. The current repository purpose is to preserve\
  \ a clean, reproducible object map before raw imaging, derived feature tables, or manuscript claims\
  \ are introduced.\n\nCurrent scaffold objects:\n\n- `docs/stage_1_scaffold.md`: stage plan and execution\
  \ map.\n- `docs/data_sources.md`: open-data source registry.\n- `docs/citation_registry.md`: citation-verification\
  \ queue.\n- `docs/analysis_plan.md`: planned reproducible workflow.\n- `docs/repo_structure.md`: repository\
  \ object map.\n- `.gitignore`: exclusions for local data, build artifacts, and environment files.\n\n\
  ## Candidate open datasets\n\nPrimary candidates:\n\n- TCIA FDG-PET-CT-Lesions.\n- AutoPET PET/CT challenge\
  \ dataset.\n- TCIA LUNG-PET-CT-DX.\n- TCIA PSMA-PET-CT-Lesions.\n\nRaw imaging data should not be committed\
  \ to this repository. Store data locally or through approved external storage and track only download\
  \ instructions, manifests, checksums, derived non-sensitive tables, and reproducible scripts.\n\n##\
  \ Planned analysis modules\n\n1. Dataset acquisition and manifest creation.\n2. PET/CT preprocessing\
  \ and harmonization.\n3. Lesion mask ingestion or segmentation baseline.\n4. Simulated PET noise perturbation.\n\
  5. Radiomics extraction.\n6. Feature stability analysis.\n7. Reporting tables and figures.\n8. Manuscript\
  \ drafting.\n\n## Documentation standards\n\n- Keep dataset access requirements, licenses, and citation\
  \ metadata in `docs/data_sources.md` before analysis begins.\n- Keep DOI, dataset version, and retrieval-date\
  \ checks in `docs/citation_registry.md`.\n- Separate raw imaging data, intermediate image volumes, and\
  \ derived feature tables from source-controlled code unless a file is small, non-identifying, and necessary\
  \ for reproducibility.\n- Record every analytic decision that affects feature stability, segmentation\
  \ sensitivity, or model interpretation before manuscript drafting.\n- Distinguish synthetic or perturbation-based\
  \ robustness findings from external clinical validity.\n- Keep all claims traceable to source data,\
  \ transformation steps, validation checks, and versioned outputs.\n\n## Next execution steps\n\n1. Verify\
  \ candidate dataset availability and current access terms.\n2. Build a machine-readable manifest schema\
  \ for imaging series, masks, metadata, and derived feature tables.\n3. Add a reproducible environment\
  \ file once the initial Python/R imaging stack is selected.\n4. Convert `docs/analysis_plan.md` into\
  \ modular scripts for acquisition, preprocessing, perturbation, extraction, and stability testing.\n\
  5. Connect validated outputs to the broader public-health and biomedical portfolio evidence ledger.\n\
  \n## Status\n\nDocumentation refreshed on 2026-08-17. The repository remains pre-analysis and manuscript-preparation\
  \ oriented, with public-interest, reproducibility, and claim-boundary language now aligned with the\
  \ broader portfolio documentation standard.\n"

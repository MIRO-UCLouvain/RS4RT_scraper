readme_excerpt: '# Radiomics大全 — レディオミクス（ラジオミクス）をインタラクティブに学ぶ


  > **▶ サイトはこちら: https://magome-laboratory.github.io/radiomics-site/**

  > （GitHub Pages で公開。リポジトリのファイルを直接開くのではなく、上のリンクからご覧ください）


  **Radiomics大全**は、医用画像（CT・MRI・PET）から定量的特徴量を抽出する **Radiomics（レディオミクス／ラジオミクス）** を、

  **合成画像を動かしながらリアルタイムに体験して学べる**日本語の無料教育サイトです。

  [IBSI（Image Biomarker Standardisation Initiative）](https://theibsi.github.io/)準拠の **11グループ・172特徴量**
  を、定義式・図解・インタラクティブデモつきで解説しています。


  駒澤大学 医療健康科学部 [馬込研究室](https://magome.wixsite.com/laboratory) が教育目的で作成・公開しています。


  ## コンテンツ


  | ページ | 内容 |

  |---|---|

  | [Radiomics入門](https://magome-laboratory.github.io/radiomics-site/radiomics_basics.html) | Radiomicsとは何か・歴史・ワークフロー・応用・限界・始め方
  |

  | [形状（Morphology）](https://magome-laboratory.github.io/radiomics-site/radiomics_shape.html) | 体積・表面積・球形度など
  29特徴量（回転3Dデモ） |

  | [強度統計・局所強度](https://magome-laboratory.github.io/radiomics-site/radiomics_intensity_stats.html) | 平均・分散・歪度・尖度など
  18+2特徴量 |

  | [強度ヒストグラム・IVH](https://magome-laboratory.github.io/radiomics-site/radiomics_ih.html) | エントロピー・一様性など
  23+5特徴量 |

  | [GLCM 共起行列](https://magome-laboratory.github.io/radiomics-site/radiomics_glcm.html) | コントラスト・相関など
  25特徴量 |

  | [GLRLM ランレングス](https://magome-laboratory.github.io/radiomics-site/radiomics_glrlm.html) | ラン長に基づく
  16特徴量 |

  | [GLSZM サイズゾーン](https://magome-laboratory.github.io/radiomics-site/radiomics_glszm.html) | ゾーンサイズに基づく
  16特徴量 |

  | [GLDZM 距離ゾーン](https://magome-laboratory.github.io/radiomics-site/radiomics_gldzm.html) | 境界距離に基づく
  16特徴量 |

  | [NGTDM 近傍差分](https://magome-laboratory.github.io/radiomics-site/radiomics_ngtdm.html) | 粗さ・複雑さなど 5特徴量
  |

  | [NGLDM 依存行列](https://magome-laboratory.github.io/radiomics-site/radiomics_ngldm.html) | 近傍依存に基づく 17特徴量
  |


  ## 特徴


  - **触って学べる**: 画像パターン（均一・ノイズ・チェッカーなど）を切り替えると、全特徴量がブラウザ内でリアルタイムに再計算されます

  - **IBSI準拠**: 特徴量の定義は IBSI リファレンスマニュアルに従い、公開デジタルファントムの参照値で検証

  - **数式もコピーできる**: 各定義式はクリックで LaTeX ソースをコピー可能

  - **依存ライブラリなし**: 計算はすべて自前の JavaScript（`ibsi_engine.js`）で実装


  ## 引用・利用について


  教育・研究目的で自由にご利用いただけます。授業・講習会等でご利用の際は、出典として本サイトをご紹介いただけると嬉しいです。

  内容の誤りを見つけた場合は Issue でお知らせください。


  © Magome Laboratory, Komazawa University


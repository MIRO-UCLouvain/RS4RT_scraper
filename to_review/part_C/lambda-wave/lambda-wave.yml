readme_excerpt: "# Lambda-Wave: Surface Guided Radiation Therapy System\n\n[![Build Status](https://github.com/fderuiter/lambda-wave/workflows/Build%20and%20Test/badge.svg)](https://github.com/fderuiter/lambda-wave/actions)\n\
  [![License](https://img.shields.io/badge/license-AGPL--3.0-blue.svg)](LICENSE)\n[![IEC 62304](https://img.shields.io/badge/IEC%2062304-Class%20C-critical.svg)](docs/PURPOSE_AND_ARCHITECTURE.md)\n\
  \n> **Safety-critical mmWave radar system for real-time patient motion tracking during cancer radiotherapy**\n\
  \n---\n\n## \U0001F3AF What is Lambda-Wave?\n\nLambda-Wave is a **medical device software system** that\
  \ uses millimeter-wave (mmWave) radar to monitor patient position during radiation therapy with **sub-millimeter\
  \ accuracy**. When patient motion is detected, the system automatically controls the radiation beam\
  \ to prevent healthy tissue exposure.\n\n### Key Features\n\n- \U0001F3AF **Sub-millimeter tracking\
  \ accuracy** using phase-based radar processing\n- ⚡ **Real-time beam gating** with <50ms latency\n\
  - \U0001F6E1️ **Safety-critical design** compliant with IEC 62304 Class C\n- \U0001F4E1 **Non-contact\
  \ monitoring** - no markers or devices on patient\n- \U0001F4B0 **Cost-effective** - uses commodity\
  \ mmWave sensor (~$500 vs $100K+ optical systems)\n- \U0001F513 **Open source** - transparent, auditable,\
  \ community-driven\n\n---\n\n## \U0001F4DA Documentation\n\n**Quick Links:**\n- \U0001F680 [Quick Start\
  \ Guide](docs/QUICKSTART.md) - Get running in 15 minutes\n- \U0001F4CB [TODO](TODO.md) - Prioritized\
  \ development tasks\n- \U0001F4D6 [Documentation Index](docs/README.md) - Complete documentation map\n\

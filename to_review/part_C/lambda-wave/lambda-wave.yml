  \n## \U0001F680 Quick Start\n\n### Option 1: Docker (Recommended)\n\n```bash\n# Build and run in simulation\
  \ mode\ndocker build -t lambda-wave .\ndocker run -it lambda-wave\n```\n\n### Option 2: Native Build\n\
  \n```bash\n# Install dependencies (Ubuntu/Debian)\nsudo apt-get update\nsudo apt-get install -y ghc\
  \ cabal-install g++ \\\n    libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev\n\n# Build and test\ncabal\
  \ update\ncabal build\ncabal test\n\n# Run application\ncabal run sgrt-radar-system-exe\n```\n\n###\
  \ Option 3: Hardware Mode (Requires TI IWR6843ISK)\n\n```bash\n# Configure environment\nexport SGRT_SENSOR_PORT=/dev/ttyUSB0\n\
  export SGRT_CLI_PORT=/dev/ttyUSB1\n\n# Run with hardware access\ndocker run -it \\\n    --device=/dev/ttyUSB0\
  \ \\\n    --device=/dev/ttyUSB1 \\\n    -e SGRT_SENSOR_PORT=/dev/ttyUSB0 \\\n    -e SGRT_CLI_PORT=/dev/ttyUSB1\
  \ \\\n    lambda-wave\n```\n\nSee [Quick Start Guide](docs/QUICKSTART.md) for detailed instructions.\n\
  \n---\n\n## \U0001F3D7️ System Architecture\n\n```\n┌─────────────────────────────────────────────────────────────┐\n\
  │                    Lambda-Wave System                       │\n├─────────────────────────────────────────────────────────────┤\n\
  │                                                             │\n│  ┌──────────┐    ┌──────────┐   \
  \ ┌────────────┐           │\n│  │ Control  │───▶│   Data   │───▶│  Hardware  │           │\n│  │  Plane\
  \   │    │  Plane   │    │ Interface  │           │\n│  │(Haskell) │    │(Haskell) │    │  (C++/FFI)\
  \ │           │\n│  └──────────┘    └──────────┘    └────────────┘           │\n│        │         \
  \     │                  │                  │\n│        └──────────────┴──────────────────┘        \
  \          │\n│                       │                                     │\n│            ┌──────────▼──────────┐\
  \                          │\n│            │   Safety Layer      │                          │\n│   \
  \         │ (Watchdog, Audit)   │                          │\n│            └─────────────────────┘ \
  \                         │\n└─────────────────────────────────────────────────────────────┘\n     \
  \                   │\n                        ▼\n          ┌─────────────────────────┐\n          │\
  \  TI IWR6843ISK Sensor   │\n          │  (77-81 GHz mmWave)     │\n          └─────────────────────────┘\n\
  ```\n\n**Technology Stack:**\n- **Core Logic:** Haskell (safety, type safety, pure functions)\n- **Hardware\
  \ I/O:** C++ (zero-copy, low latency)\n- **Signal Processing:** FMCW radar, Chirp Z-Transform, Kalman\
  \ filtering\n- **Visualization:** OpenGL/GLUT\n- **Build System:** Cabal + GHC <!-- METADATA:ghc_version\
  \ -->9.6.7<!-- /METADATA:ghc_version -->+\n- **Testing:** Hspec + QuickCheck (property-based testing)\n\
  \n---\n\n## \U0001F4CA Current Status\n\n**Version:** <!-- METADATA:project_version -->0.1.0.0<!-- /METADATA:project_version\
  \ --> (Beta)  \n**Phase:** <!-- METADATA:project_status -->Phase 3 - Signal Processing Core (In Progress)<!--\
  \ /METADATA:project_status -->  \n**Lines of Code:** ~1,287 (Haskell + tests)\n\n### Implementation\
  \ Progress\n\n| Phase | Component | Status |\n|-------|-----------|--------|\n| Phase 1 | Infrastructure\
  \ & RTS | ✅ Complete |\n| Phase 2 | Hardware Interface | ✅ Complete |\n| Phase 3 | Signal Processing\
  \ | \U0001F504 In Progress (80%) |\n| Phase 4 | Safety & Control | ⏳ Pending |\n| Phase 5 | User Interface\
  \ | ⏳ Pending |\n| Phase 6 | System Validation | ⏳ Pending |\n\n**Recent Milestone:** Phase unwrapping\
  \ implementation (FR-DSP-002) ✅\n\nSee [Project Status](docs/PROJECT_STATUS.md) for detailed roadmap.\n\
  \n---\n\n## \U0001F9EA Running Tests\n\n```bash\n# Run all tests\ncabal test\n\n# Run with verbose output\n\
  cabal test --test-show-details=direct\n\n# Run specific test suite\ncabal test --test-options=\"-m FFI.RingBuffer\"\
  \n\n# Generate coverage report\ncabal test --enable-coverage\n```\n\n**Test Coverage:**\n- Unit tests\
  \ for all modules\n- Property-based testing with QuickCheck\n- FFI layer memory safety validation\n\
  - Hardware parser fuzz testing\n\n---\n\n## \U0001F512 Safety & Compliance\n\nPlease review our [Security\
  \ Policy](SECURITY.md) for details on vulnerability reporting and triage for safety-critical flaws.\n\
  \nLambda-Wave is developed to meet **IEC 62304 Class C** requirements (highest rigor for medical device\
  \ software):\n\n- ✅ **Traceable Requirements:** FR-* and SR-* identifiers\n- ✅ **Strict Code Standards:**\
  \ `-Wall` compiler warnings, `hlint` static analysis\n- ✅ **Comprehensive Testing:** Unit + property\
  \ + integration tests\n- ✅ **Code Review:** Four-eyes principle for safety-critical code\n- ✅ **Version\
  \ Control:** Git with semantic versioning\n- ✅ **Audit Trail:** Immutable logging of all events\n- ✅\
  \ **Risk Management:** FMEA analysis per ISO 14971\n\nSee [Purpose & Architecture](docs/PURPOSE_AND_ARCHITECTURE.md)\
  \ for compliance details.\n\n---\n\n## \U0001F91D Contributing\n\nWe welcome contributions! Please read\
  \ our [Contributing Guide](CONTRIBUTING.md) for:\n\n- Development workflow (Git-flow)\n- Code standards\
  \ (Haskell + C++)\n- Pull request process\n- Safety-critical code guidelines\n\n**Quick Start for Contributors:**\n\
  \n```bash\n# Fork and clone\ngit clone https://github.com/YOUR_USERNAME/lambda-wave.git\ncd lambda-wave\n\
  \n# Create feature branch\ngit checkout -b feature/my-feature\n\n# Make changes, test, commit\ncabal\
  \ test\ngit add .\ngit commit -m \"feat: Add new feature\"\n\n# Push and create PR\ngit push origin\
  \ feature/my-feature\n```\n\n---\n\n## \U0001F4C4 License\n\nThis project is licensed under the **GNU\

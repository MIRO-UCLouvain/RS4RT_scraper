readme_excerpt: "# DVHStatGrab\nPackage for grabbing DVH statistics with little safeguarding in the case\
  \ of over-anonymisation.\n\n### Assumptions\n- This package assumes that the users are able to match\
  \ the correct structure and dose files themselves. There are no checks via the plan file that these\
  \ are related. This does make it a viable solution in cases where the plan file is not available.\n\n\
  ### TODOs\n- Isolate DVH code and remove requirements that aren't needed (e.g. matplotlib).\n- Add functionality\
  \ for *simple* dose summation (i.e. assumes single structure file and multiple dose files with the same\
  \ co-ordinate space.)\n- Add popup for password if zip files are password locked\n\n### For Pyinstaller:\n\
  Note on windows PyInstaller being called in this way is case-senstive\npython -m PyInstaller app.py\
  \ --name DVHStatGrab --collect-submodules=pydicom --add-data=venv\\\\Lib\\\\site-packages\\\\matplotlib.libs\\\
  \\.load-order-matplotlib-3.7.1 --onefile\n\nNeed matplotlib version < 3.7 (i.e. 3.6) for pyinstaller\
  \ currently\nAlso need to update dicompylercore's dvhcalc.py to not use np.bool (which is depreciated)\
  \ and just use bool.\n\nThe created .exe needs to be run with the configs/ folder at the same level.\
  \ \n"

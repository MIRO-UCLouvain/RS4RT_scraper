readme_excerpt: "## Official PyTorch implementation of the [SPAC](https://arxiv.org/abs/2112.07415) \"\
  Stochastic Planner-Actor-Critic for Unsupervised Deformable Image Registration\", AAAI 2022. ![visitors](https://visitor-badge.glitch.me/badge?page_id=Algolzw/SPAC-Deformable-Registration)\
  \ \n\n![SAEC](figs/overview.png)\n\n\n## Requirements\n\n- Version\n\t* python 3.6\n\t* pytorch 1.4\n\
  \n- Install requirements:\n\n```setup\npip install -r requirements.txt\n```\n\n\n## Training\n\n0. The\
  \ core algorithm is in [brain.py](brain.py), and we build environment in [env.py](env.py). The [agent.py](agent.py)\
  \ handles the logic of interactions.\n1. Modify [config.py](config.py) to set path to data, iterations,\
  \ and other parameters.\n2. To train the model(s) in the paper, run this command:\n\n```train\npython\
  \ main.py\n```\n\n\n## Evaluation\n\n0. Set 'idx' parameter in [config.py](config.py) to choose existing\
  \ models.\n1. To test our model, run:\n\n```test\npython test.py\n```\n\n\n## Results\n\n![results](figs/mnist.png)\n\
  ![network](figs/step-wise.png)\n\n\n## Citations\nIf our code helps your research or work, please consider\
  \ citing our paper.\n\n```\n@inproceedings{luo2022stochastic,\n  title={Stochastic Planner-Actor-Critic\
  \ for Unsupervised Deformable Image Registration},\n  author={Luo, Ziwei and Hu, Jing and Wang, Xin\
  \ and Hu, Shu and Kong, Bin and Yin, Youbing and Song, Qi and Wu, Xi and Lyu, Siwei},\n  booktitle={Proceedings\
  \ of the AAAI Conference on Artificial Intelligence},\n  volume={36},\n  number={2},\n  pages={1917--1925},\n\
  \  year={2022}\n}\n\n@inproceedings{Luo2021StochasticAF,\n  title={Stochastic Actor-Executor-Critic\
  \ for Image-to-Image Translation},\n  author={Ziwei Luo and Jing Hu and Xin Wang and Siwei Lyu and Bin\
  \ Kong and Youbing Yin and Qi Song and Xi Wu},\n  booktitle={IJCAI},\n  year={2021}\n}\n```\n\nIf you\
  \ have any question, contact me: ziwei.ro@gmail.com\n"

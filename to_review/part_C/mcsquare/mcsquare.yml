readme_excerpt: "# MCsquare\n\nFast Monte Carlo dose calculation algorithm for the simulation of PBS proton\
  \ therapy.\n\n## Compile the code (Linux)\n\nThe following instructions were tested on Ubuntu 20.04.2\
  \ LTS 64-bit.\n\n**1. Install the Intel OneAPI compiler suite:**\nTo install the Intel toolkit, use\
  \ these commands in your terminal:\n\n```\nsudo apt autoremove 'intel-*kit'  'intel-oneapi*'\ncd /tmp\n\
  wget https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB\nsudo apt-key add\
  \ GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB\nrm GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB\necho \"deb https://apt.repos.intel.com/oneapi\
  \ all main\" | sudo tee /etc/apt/sources.list.d/oneAPI.list\nsudo apt update\nsudo apt install intel-basekit\
  \ intel-hpckit\n```\n\nMore details available on: \nhttps://software.intel.com/content/www/us/en/develop/articles/installing-intel-oneapi-toolkits-via-apt.html\n\
  \n**2. download the source code of MCsquare:**\nIf git is not installed on your system yet, use these\
  \ commands in your terminal:\n\n```\nsudo apt update\nsudo apt install git\n```\n\nThen, clone the git\
  \ repository on your computer:\n\n```\ngit clone https://gitlab.com/openmcsquare/MCsquare.git\n```\n\
  \n**3. Compile the code:**\nInitialize the Intel compiler toolkit:\n```\nsource /opt/intel/oneapi/setvars.sh\n\
  ```\n\nMove to the MCsquare folder and compile:\n```\ncd MCsquare\nmake all\n```\n\n## Run MCsquare\
  \ (Linux)\nYou can test your executable by printing the version using this command in your terminal:\n\
  ```\n./MCsquare_linux -v\n```\nConfigure your simulation in the config.txt file.\nThen, run the MCsquare\
  \ launcher from your terminal:\n```\n./MCsquare\n```\nThe launcher will automatically call the executable\
  \ that correspond to your computer hardware.\n\nYou can try to run MCsquare with the sample input data:\n\
  ```\n./MCsquare Sample_input_data/config.txt \n```\n\n\n\n## Instructions for Windows\nInstall the Windows\
  \ version of the Intel OneAPI toolkit (with the HPC module).\n\nCompile MCsquare by running Makefile.bat\n\
  (You may need to adapt the path to librarary directories in Makefile.bat)\n\nConfigure the simulation\
  \ in config.txt\nThen, run MCsquare with the launcher: MCsquare.bat\n"

readme_excerpt: "## Overview\n\n[![CI](https://github.com/silverstripe/silverstripe-installer/actions/workflows/ci.yml/badge.svg)](https://github.com/silverstripe/silverstripe-installer/actions/workflows/ci.yml)\n\
  [![Silverstripe supported module](https://img.shields.io/badge/silverstripe-supported-0071C4.svg)](https://www.silverstripe.org/software/addons/silverstripe-commercially-supported-module-list/)\n\
  \nBase project folder for a Silverstripe ([http://silverstripe.org](http://silverstripe.org)) installation.\
  \ Required modules are installed via [http://github.com/silverstripe/recipe-cms](http://github.com/silverstripe/recipe-cms).\
  \ For information on how to change the dependencies in a recipe, please have a look at [https://github.com/silverstripe/recipe-plugin](https://github.com/silverstripe/recipe-plugin).\
  \ In addition, installer includes [theme/simple](https://github.com/silverstripe-themes/silverstripe-simple)\
  \ as a default theme.\n\n## Installation\n\n```sh\ncomposer create-project silverstripe/installer my-app\n\
  ```\n\nSee [Getting Started](https://docs.silverstripe.org/en/getting_started/) for more information.\n\
  \n## Bugtracker\n\nBugs are tracked on github.com ([framework issues](https://github.com/silverstripe/silverstripe-framework/issues),\n\
  [cms issues](https://github.com/silverstripe/silverstripe-cms/issues)).\nPlease read our [issue reporting\
  \ guidelines](https://docs.silverstripe.org/en/contributing/issues_and_bugs/).\n\n## Development and\
  \ Contribution\n\nIf you would like to make changes to the Silverstripe core codebase, we have an extensive\
  \ [guide to contributing code](https://docs.silverstripe.org/en/contributing/code/).\n\n## Links\n\n\
  \ * [Changelogs](https://docs.silverstripe.org/en/changelogs/)\n * [Bugtracker: Framework](https://github.com/silverstripe/silverstripe-framework/issues)\n\
  \ * [Bugtracker: CMS](https://github.com/silverstripe/silverstripe-cms/issues)\n * [Bugtracker: Installer](https://github.com/silverstripe/silverstripe-installer/issues)\n\
  \ * [Forums](http://silverstripe.org/forums)\n * [Developer Mailinglist](https://groups.google.com/forum/#!forum/silverstripe-dev)\n\
  \ * [License](./LICENSE)\n"

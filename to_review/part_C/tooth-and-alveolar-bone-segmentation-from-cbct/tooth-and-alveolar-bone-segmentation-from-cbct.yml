readme_excerpt: "# A fully automatic AI system for tooth and alveolar bone segmentation from cone-beam\
  \ CT images\nby Zhiming Cui, Yu Fang, Lanzhuju Mei, Bojun Zhang, Bo Yu, Jiameng Liu, Caiwen Jiang, Yuhang\
  \ Sun, Lei Ma, Jiawei Huang, Yang Liu, Yue Zhao, Chunfeng Lian, Zhongxiang Ding, Min Zhu, and Dinggang\
  \ Shen.\n\n\n### Introduction\n\nThis repository is for our Nature Communications 2022 paper 'A fully\
  \ automatic AI system for tooth and alveolar bone segmentation from cone-beam CT images'. \n\n\n###\
  \ Installation\nThis repository is based on PyTorch 1.4.0.\n\n### Training\nThe training and data preparation\
  \ codes of the first and second stages have been released.\n\n### Inference\n1. Write the full path\
  \ of the CBCT data (.nii.gz) in the file.list, and set up in the test.py.\n2. Run the model: Python\
  \ test.py.\n\n### Data registration\nWe have released the partial CBCT data (about 150 scans) with GT\
  \ annotation. If you want to apply for these data, please complete the registration form in following\
  \ link (https://drive.google.com/file/d/1mI5GVoT5FDq4uLXfxJmQKwWpMO6J4oUY/view?usp=sharing), and then\
  \ send to Zhiming Cui ('zmcui94@gmail.com'). He will send you the download link when recieve the data\
  \ registration form.\n\n### AI inference application\nDue to the commercial issue, we cannot release\
  \ the trained model trained on the large dataset. If you want to get the results on your own CBCT, please\
  \ complete the AI inference application form in the following link (https://drive.google.com/file/d/1xzFugXfz_coKepT_2PrGH5OwtR6mbUGX/view?usp=sharing),\
  \ and then send to Zhiming Cui ('zmcui94@gmail.com'). He will send you the data upload link and feedback\
  \ the results in one week, when recieving the application form.\n\n### Citation\n\nIf the code or data\
  \ is useful for your research, please consider citing:\n\n    @inproceedings{cui2019toothnet,\n    \
  \     title={ToothNet: automatic tooth instance segmentation and identification from cone beam CT images},\n\
  \         author={Cui, Zhiming and Li, Changjian and Wang, Wenping Wang},\n         booktitle = {CVPR},\n\
  \         year = {2019}}\n         \n    @inproceedings{cui2021hierarchical,\n         title={Hierarchical\
  \ Morphology-Guided Tooth Instance Segmentation from CBCT Images},\n         author={Cui, Zhiming and\
  \ Zhang, Bojun and Lian, Chunfeng and Li, Changjian and Yang, Lei and Wang, Wenping and Zhu, Min and\
  \ Shen, Dinggang},\n         booktitle={International Conference on Information Processing in Medical\
  \ Imaging},\n         pages={150--162},\n         year={2021},\n         organization={Springer}} \n\
  \         \n    @article{cui2022fully,\n        title={A fully automatic AI system for tooth and alveolar\
  \ bone segmentation from cone-beam CT images},\n        author={Cui, Zhiming and Fang, Yu and Mei, Lanzhuju\
  \ and Zhang, Bojun and Yu, Bo and Liu, Jiameng and Jiang, Caiwen and Sun, Yuhang and Ma, Lei and Huang,\
  \ Jiawei and others},\n        journal={Nature Communications},\n        volume={13},\n        number={1},\n\
  \        pages={1--11},\n        year={2022},\n        publisher={Nature Publishing Group}}\n\n### Questions\n\
  Please contact zmcui94@gmail.com'.\n"

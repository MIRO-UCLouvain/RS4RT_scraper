readme_excerpt: '# NeCT GUI

  This is the GUI for NeCT, a 4D-CT reconstruction framework using deep learning. The GUI is built with
  GPL-licensed `PyQt5`, and is thus separated out from the main repo. The GUI provides a user-friendly
  interface for visualizing 4D reconstructions. Please follow installation of [NeCT](https://github.com/haakonnese/nect)
  for use of the GUI.


  ## Installation

  To install the GUI, first install NeCT, and then install the GUI with:


  ```bash

  pip install git+https://github.com/haakonnese/nect-gui.git

  ```


  ### NeCT GUI

  The GUI visualizes 4D reconstructions (currently only works for 4D and not 3D reconstructions). If you
  run the gui on a compute cluster, make sure to properly X11-forward, e.g. using MoabXterm. Start the
  GUI with:


  ```bash

  python -m nect_gui.gui

  ```'

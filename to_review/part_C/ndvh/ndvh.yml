readme_excerpt: "# WFS to Parquet/Postgres Converter.\n\nREPLACED with (geotoolbox)[https://gitlab.com/bij12/vvm/public/geotoolbox]\n\
  \n## Features\n\nogr2ogr wfs_extract.py script with geotoolbox (gdal) docker container to extract all\
  \ NDVH, RWS wfs layers about\n\n---\n\n## Prerequisites\n\n- Docker since gdal / ogr2ogr has a lot of\
  \ dependencies.\n\n---\n\n## Usage\n\ncreate a complete copy of the ndvh data source in data folder:\n\
  \n### RWS\n\n    python extract.py --oapif https://geo.rijkswaterstaat.nl/services/ogc/gdr/kweldervegetatie/ogc/features/v1/\
  \ --geoparquet data/rws --workers 4\n\n### NDVH\n\n```\n    python extract.py --wfs \"https://ogc-geoservices-imna.bij12.nl/geoserver/IMNa_NDVH/wfs?service=WFS\"\
  \ --geoparquet data\n```\n\nOther options:\n\n```\ndocker-compose run geotoolbox ogrinfo --formats\n\
  \npython wfs_extract.py --postgres \"PG:host=localhost dbname=test user=test password=insecure\"\n```\n\
  \nPostgres example.\n\n```\ndocker-compose run geotoolbox python wfs_extract.py --postgres \"PG:host=localhost\
  \ dbname=cdf user=cdf password=insecure\"\n```\n\nPostgres exmple using default environment variables:\n\
  \n```\ndocker-compose run geotoolbox python wfs_extract.py --postgres \"PG:\"\n```\n\nExtract a single\
  \ layer.\n\n```\ndocker-compose run geotoolbox python wfs_extract.py --layer xx --geoparquet data\n\
  ```\n\n## Layers in NDVH (10-2025)\n\n```\n   IMNa_NDVH:ndvh_habitat_tc_all\n   IMNa_NDVH:ndvh_habitat_tc_9000\n\
  \   IMNa_NDVH:ndvh_habitat_tc_2000\n   IMNa_NDVH:ndvh_habitat_tc_6000\n   IMNa_NDVH:ndvh_habitat_tc_7000\n\
  \   IMNa_NDVH:ndvh_habitat_tc_5000\n   IMNa_NDVH:ndvh_habitat_tc_3000\n   IMNa_NDVH:ndvh_habitat_t0_all\n\
  \   IMNa_NDVH:ndvh_habitat_t0_9000\n   IMNa_NDVH:ndvh_habitat_t0_2000\n   IMNa_NDVH:ndvh_habitat_t0_6000\n\
  \   IMNa_NDVH:ndvh_habitat_t0_7000\n   IMNa_NDVH:ndvh_habitat_t0_5000\n   IMNa_NDVH:ndvh_habitat_package_t0\n\
  \   IMNa_NDVH:ndvh_habitat_t0_3000\n   IMNa_NDVH:ndvh_habitat_t0_kwal\n   IMNa_NDVH:ndvh_habitat_t0_4000\n\
  \   IMNa_NDVH:ndvh_habitat_t0_1000\n   IMNa_NDVH:ndvh_habitat_t1_all\n   IMNa_NDVH:ndvh_habitat_t1_9000\n\
  \   IMNa_NDVH:ndvh_habitat_t1_2000\n   IMNa_NDVH:ndvh_habitat_t1_6000\n   IMNa_NDVH:ndvh_habitat_t1_7000\n\
  \   IMNa_NDVH:ndvh_habitat_t1_5000\n   IMNa_NDVH:ndvh_habitat_package_t1\n   IMNa_NDVH:ndvh_habitat_t1_3000\n\
  \   IMNa_NDVH:ndvh_habitat_t1_kwal\n   IMNa_NDVH:ndvh_habitat_t1_4000\n   IMNa_NDVH:ndvh_habitat_t1_1000\n\
  \   IMNa_NDVH:ndvh_habitat_t2_all\n   IMNa_NDVH:ndvh_habitat_t2_9000\n   IMNa_NDVH:ndvh_habitat_t2_2000\n\
  \   IMNa_NDVH:ndvh_habitat_t2_6000\n   IMNa_NDVH:ndvh_habitat_t2_7000\n   IMNa_NDVH:ndvh_habitat_t2_5000\n\
  \   IMNa_NDVH:ndvh_habitat_package_t2\n   IMNa_NDVH:ndvh_habitat_t2_3000\n   IMNa_NDVH:ndvh_habitat_t2_kwal\n\
  \   IMNa_NDVH:ndvh_habitat_t2_4000\n   IMNa_NDVH:ndvh_habitat_t2_1000\n   IMNa_NDVH:ndvh_habitat_tc_kwal\n\
  \   IMNa_NDVH:ndvh_habitat_tc_4000\n   IMNa_NDVH:ndvh_habitat_tc_1000\n```\n"

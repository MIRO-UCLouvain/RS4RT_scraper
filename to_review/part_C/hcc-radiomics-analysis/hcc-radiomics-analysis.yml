readme_excerpt: '# hcc-radiomics-analysis

  Radiomic phenotype analysis of hepatocellular carcinoma using CT imaging from the HCC-TACE dataset.

  This repository contains the code used to identify radiomic tumor phenotypes

  in hepatocellular carcinoma using CT imaging from the TCIA HCC-TACE-Seg dataset.


  Methods include:


  - CT image processing

  - Radiomic feature extraction

  - Principal component analysis (PCA)

  - k-means clustering

  - statistical testing

  - radiomic heatmaps and silhouette analysis


  Author: Will Brown

  '

readme_excerpt: "# CBCT-Dental Scan Registration via Descriptor Representation Learning\n\nImplementation\
  \ of \"CBCT-Dental Scan Registration via Descriptor Representation Learning\"\n\n## Framework\n![](fig/framework.png)\n\
  \n## Representation Learning Guidance via CT gradient\n![](fig/CtGradient.png)\n\n\n## Prerequisites\n\
  - [Python 3.6.6](https://www.python.org/)\n- [Pytorch 1.9.1](https://pytorch.org/get-started/locally/)\n\
  \n\n## Installation\nThe required packages are located in `requirements.txt`.\n```\npip install torch==1.9.1+cu111\
  \ torchvision==0.10.1+cu111 torchaudio==0.9.1 -f https://download.pytorch.org/whl/torch_stable.html\n\
  \npip install -r requirements.txt\n```\n\n\n## Training \nTo train our detection baseline, follow below\
  \ train instruction.\n\n```\npython train/train_0_detection.py \npython train/train_1_detection_and_metal_classification.py\
  \ \n```\n\n## Testing\nTo test the performance of our method, place the given pretrained weight inside\
  \ of `checkpoints/detection_best_model.pth`.\nTo test the performance of our method, place the given\
  \ pretrained weight inside of `checkpoints/detection_and_metal_classification_best_model.pth`.\n\n```\n\
  python test/test_0_detection.py\npython test/test_1_detection_and_metal_classification.py\n```\n"

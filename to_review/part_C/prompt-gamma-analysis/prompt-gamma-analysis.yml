readme_excerpt: "This repository contains analysis and simulation work related to prompt gamma emission\
  \ in proton therapy and its correlation with bragg peak position for proton range verification. \nThis\
  \ study is based on Monte Carlo simulations (Geant4) and python based anlaysis focusing on prompt gamma\
  \ lines produced during proton matter nuclear interactions. \nThe work explores the spatial correlation\
  \ between prompt gamma emission profiles and the bragg peak for different proton beams. \nPrompt gamma\
  \ radiation arises from the inelastic nuclear interactions between incident proton and target nuclei\
  \ in the medium. \n\nSimulation Details:\nPrimary particles used are protons. \nTarget is the water\
  \ phantom having dimension 8.5*8.5*55 cm<sup>3</sup>. \nCylindrical detectors are placed along the z\
  \ axis surrounding the water phantom. \nOriginal gamma emission position, detector hit position and\
  \ energy are detected\n\nAnalysis workflow:\nWhen proton beam is incident on water, production of prompt\
  \ gamma happens. The output is being stored in CSV files. \nThen python analysis is performed to extract\
  \ energy distribution and depth profile. \n## Prompt Gamma Energy Distribution\n\n![Prompt gamma energy\
  \ distribution](IMAGES/gamma_energy_spectrum_bin0.01MeV_old.png)\n"

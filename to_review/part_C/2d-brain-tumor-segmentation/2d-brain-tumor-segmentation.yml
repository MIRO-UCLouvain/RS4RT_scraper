readme_excerpt: "# Analysis of Augmentation Techniques in Brain Tumor Segmentation\n\n## Overview\nThis\
  \ study evaluates a standard U-Net architecture (incorporating focal loss to address\nclass imbalance)\
  \ for brain tumor segmentation tasks and compares the effect of data augmentation on segmentation performance.\
  \ The model\nwas evaluated on MRI data, with experiments focusing on\nfocal loss parameter tuning and\
  \ studying the impact of three\ndata augmentation techniques: Horizontal Flip, Rotation,\nand Scaling.\
  \ \n\n## Contents of Repository\n\n+ ```augmentation_experiments\\```\\\nThis directory contains the\
  \ notebooks for all three data augmentation experiments done. The different data augmentation techniques\
  \ are labeled as follows:\\\nDA1 - Horizontal flip\\\nDA2 - Rotation\\\nDA3 - Random scaling\n\n+ ```model_weights\\\
  ``` \\\nThis directory contains a readme file with the link to download the best performing model weights.\n\
  \n+ ```Brain_Tumor_Segmentation_best.ipynb```\\\nNotebook containing the best performing segmentation\
  \ model\n\n+ ```Inference_notebook.ipynb```\\\nThis notebook loads the weights of the best performing\
  \ model and runs inference on the provided test data provided in the zip file. Before running this notebook,\
  \ download the weights from [link](https://drive.google.com/file/d/1YChnisdNceJbb9c4KcS6WbjdLOr4_B1K/view?usp=sharing)\
  \ , the test data from ```test_data.zip``` and unzip them.\n\n+ ```test_data.zip```\\\nThis zip file\
  \ includes 6 images and masks in their respective directories. To be used for evaluation.\n\n\n## Dataset\
  \ used\n\n![image](https://github.com/user-attachments/assets/297eaae0-7606-4f4d-a15c-b8d1a2bc2fd6)\n\
  \nFor this study, a brain tumor dataset containing 3064 T1-\nweighted contrast-enhanced MRI images was\
  \ used. The data\nwas collected from Nanfang Hospital and Tianjing Medical\nUniversity, China, from\
  \ 2005 to 2010, by Jun Cheng,\nwho had\nuploaded the entire dataset with its metadata to Figshare. The\n\
  dataset consists of T1-weighted contrast-enhanced MRI scans\nfrom 233 patients, and has three kinds\
  \ of brain tumors - 708\ncases of Meningiomas, 1426 gliomas and 930 cases of pituitary\ntumors. The\
  \ tumor border was manually delineated\nby three experienced radiologists. A copy of this dataset was\n\
  taken from Kaggle, where the scans and corresponding binary\nmasks were uploaded as 256x256 pixel images.\n\
  ## Preprocessing workflow\n![image](https://github.com/user-attachments/assets/e9bb6d5d-3397-4dde-8e77-542b10a5553a)\n\
  \n\n## Model architecture\nUNet was implemented from scratch using keras module from tensorflow. The\
  \ architecture followed the sequence according to the given \ntable - \n![image](https://github.com/user-attachments/assets/b84f879a-b31f-4a06-86c1-496cc5821b87)\n\
  \n\n\n## Experiments conducted\n#### Focal loss parameterss\nThe α and γ parameters\nfor focal loss\
  \ were varied to evaluate their impact on segmentation\nperformance. These experiments were conducted\
  \ using\nthe original dataset, without applying any data augmentation\ntechniques.\nTwo sets of parameter\
  \ combinations were tested:\n(i) α=0.25, γ=2.0\n(ii) α=2.0, γ=0.75\n\n#### Data augmentation\n![image](https://github.com/user-attachments/assets/80a07156-4380-4f9f-9c3a-3dd0be9953a5)\n\
  \n\n\n## Results \n#### Results of focal loss parameters experiments\n![image](https://github.com/user-attachments/assets/f0d6e77a-1d48-44b3-bafc-e3bd8c630e0a)\n\
  \ In the first case, the\nconfiguration prioritized hard-to-classify examples, particularly tumor boundaries,\
  \ resulting in better performance. In\nthe second case, the configuration emphasized the minor class\n\
  (tumor regions) more but focused less on boundary details,\nleading to weaker performance in challenging\
  \ regions.\n\n#### Results of data augmentation experiments\n\n![image](https://github.com/user-attachments/assets/6d796e80-fef1-45c6-b372-957f1cc0d2e1)\n\
  <br>\n\nHorizontal flip consistently improved performance across\nall metrics, making it the most effective\
  \ augmentation technique. Rotation improved the Dice coefficient and IoU, indicating its effectiveness.\
  \ Scaling, however, showed negligible\nor no improvement in segmentation performance\n\n<br>\n\n\n\n\
  #### Training graphs\n![image](https://github.com/user-attachments/assets/35517e31-c5a4-4b57-8354-9b02d6aaba70)\n\
  \nAs seen from the training graphs, horizontal flip and rotation helps in achieving a lower\nfinal loss\
  \ when compared to the baseline model. Horizontal\nflip has a more positive effect and can be seen to\
  \ help in\nachieving faster convergence and lower final loss.\n\n\n#### Comparison with SOTA\n\n![Screenshot\
  \ 2025-04-01 145957](https://github.com/user-attachments/assets/f5f08a7d-75ee-4362-9d10-d2802570c3a8)\n\
  \n\n\n\n\n\n\n"

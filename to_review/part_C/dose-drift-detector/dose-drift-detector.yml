readme_excerpt: "# Dose-Drift Detector\n\n**Judul:** *Dose-Drift Detector: Deteksi Pergeseran Dosis Harian\
  \ Berbasis AI pada CBCT untuk Trigger Adaptive Replanning*  \n**Author:** **dr. Muhammad Sobri Maulana**\n\
  \n## Latar Belakang\nDose-Drift Detector adalah prototipe aplikasi berbasis **React + Python (FastAPI)**\
  \ untuk memantau perubahan anatomi harian pasien radioterapi fraksinasi panjang (misalnya **Head & Neck**\
  \ atau **cervix**) dari data CBCT. Sistem AI sederhana ini memberikan estimasi awal risiko **penurunan\
  \ D95 target** dan **overdosis OAR**, sehingga tim klinis dapat melakukan trigger adaptive replanning\
  \ lebih cepat.\n\n## Kerangka Studi (PICO)\n- **P (Population):** Pasien RT fraksinasi panjang (H&N\
  \ / cervix)\n- **I (Intervention):** AI memonitor perubahan anatomi harian + estimasi dose drift\n-\
  \ **C (Comparison):** Evaluasi manual periodik (mingguan/berkala)\n- **O (Outcomes):**\n  - Penurunan\
  \ D95 target\n  - Overdosis OAR\n  - Waktu ke replanning\n  - Angka toxicitas akut\n\n**Desain:** Prospektif\
  \ pragmatik.\n\n## Arsitektur Sederhana\n- `backend/`: FastAPI API untuk analisis dose drift\n- `frontend/`:\
  \ React app untuk memicu analisis dan menampilkan hasil\n\n## Menjalankan Backend (Python)\n```bash\n\
  cd backend\npython -m venv .venv\nsource .venv/bin/activate\npip install -r requirements.txt\nuvicorn\
  \ app:app --reload --host 0.0.0.0 --port 8000\n```\n\nEndpoint utama:\n- `GET /health`\n- `POST /analyze`\n\
  \n## Menjalankan Frontend (React)\n```bash\ncd frontend\nnpm install\nnpm run dev\n```\n\nAplikasi frontend\
  \ berjalan di `http://127.0.0.1:5173` dan memanggil backend di `http://127.0.0.1:8000/analyze`.\n\n\
  ## Contoh Payload `POST /analyze`\n```json\n{\n  \"patient_id\": \"RT-HN-001\",\n  \"fraction_site\"\
  : \"H&N\",\n  \"daily_metrics\": [\n    {\n      \"day\": 1,\n      \"target_volume_change_pct\": 1.5,\n\
  \      \"setup_error_mm\": 1.8,\n      \"weight_loss_pct\": 0.2\n    }\n  ]\n}\n```\n\n## Catatan\n\
  Model AI yang digunakan saat ini adalah **heuristik baseline** untuk prototyping dan belum ditujukan\
  \ sebagai alat keputusan klinis final. Validasi klinis dan dosimetrik lanjutan tetap diperlukan.\n"

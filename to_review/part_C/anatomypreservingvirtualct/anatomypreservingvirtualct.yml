readme_excerpt: "# APvCT\nAnatomy preserving virtual/synthetic CTs for treatment sites with large deformation\
  \ of ROIs.\n\nThis Python script is intended for use with scripting module of the RayStation treatment\
  \ planning system version 12A DTK to generate various daily CT images from daily CBCTs. Therefore, the\
  \ script might not work with other versions of RayStation.\nThe script was developed for the following\
  \ published article: [Generation and evaluation of anatomy-preserving virtual CT for online adaptive\
  \ proton therapy.](https://aapm.onlinelibrary.wiley.com/doi/10.1002/mp.16941)\n\nThe study was carried\
  \ out on patients with prostate cancer, but the script can be adapted for other treatment sites. \n\n\
  Clinical and imaging data:\n1. Clinical target volume (CTV) includes prostate gland and seminal vesicles.\n\
  2. Endorectal balloons were used to immobilize the prostate in all patients.\n3. CBCT images were taken\
  \ on the Proteus-PLUS proton therapy system.\n\nConditions to verify before running the script: \n1.\
  \ A planning CT with CTV and OARs, and assigned to an imaging system (CT modality). \n2. A CBCT image\
  \ assigned to an imaging system (CBCT modality).\n3. Planning CT must have an external roi contoured.\n\
  \nImportant points to remember:\n1. The ROIs generated using DLS on cCBCT may not be accurate. Therefore,\
  \ it is recommended to verify the DLS generated ROIs and manually corrected if required before generating\
  \ APvCT.\n2. Following contours were used as controlling ROIs: Bladder, Rectum, Femoral head left and\
  \ Femoral head right.\n\nYou can cite the work as:\nKaushik S, Ödén J, Sharma DS, Fredriksson A, Toma-Dasu\
  \ I. Generation and evaluation of anatomy-preserving virtual CT for online adaptive proton therapy.\
  \ Med Phys. 2024;51(3):1536-1546. doi:10.1002/mp.16941\n\nBibTex\n@article{kaushik2024generation,\n\
  \  title={Generation and evaluation of anatomy-preserving virtual CT for online adaptive proton therapy},\n\
  \  author={Kaushik, Suryakant and {\\\"O}d{\\'e}n, Jakob and Sharma, Dayananda Shamurailatpam and Fredriksson,\
  \ Albin and Toma-Dasu, Iuliana},\n  journal={Medical Physics},\n  volume={51},\n  number={3},\n  pages={1536-1546},\n\
  \  year={2024},\n  publisher={Wiley Online Library}\n}"

readme_excerpt: "# GHXTox：融合序列与三维化学位点的肽毒性预测\n\n更新时间：2026-08-10\n\n状态：对外预测默认是**组合A 1D与单结构3D的多维融合模型**。1D\
  \ 序列专家为组合A（LoRA 微调 ProtT5 + 双向 Mamba，3-seed 集成 + 训练 OOF Platt 校准）；3D 专家为 pLDDT 感知 Cα-EGNN + 全原子化学位点分支。二者按训练\
  \ OOF 冻结的`0.72/0.28`权重融合，决策阈值为`0.4702`。1D使用pos_weight加权BCE处理类别不平衡，不启用BSMOTE。多构象数据只用于训练集上的扩展研究和受控消融，不是默认模型的输入，也不能表述为当前单结构输出已经吸收了多构象知识。\n\
  \n3D checkpoint继续沿用full2795文件谱系：该文件包含曾在2,795条PepFlow/AF2训练构象上拟合的构象残差模块，但当时单结构空间主干、化学位点支路和基础分类器均被冻结。Test1、Test2和新样本公开预测一律关闭构象残差并读取**单结构`base_logits`**，因此不能把默认预测增益归因于多构象训练。测试集构象缓存、来源感知残差和逐构象集合头不再属于默认模型。公开入口不再接受构象manifest/cache参数；若processed输入意外激活构象字段，程序会直接终止，避免静默改变规范指标。\n\
  \n当前唯一规范产物、入口和配置分别为`runs/default_multidimensional_fusion_single_structure/`、`ghxtox-predict`和`configs/default_multidimensional_fusion.json`。`ghxtox-multidimensional-predict`仅为兼容别名。上一代GHXTox-3D-Chemical-Adapter-Residual和测试集多构象尝试均与公开入口隔离。\n\
  \n导师汇报只保留默认模型测试预测及同数据论文对照，见[导师版报告](reports/mentor_report/REPORT.md)；完整内部统计审计已经合并在本 README 中。\n\n规范单结构推理示例（Test2）：\n\
  \n```powershell\nghxtox-predict predict `\n  --processed data\\processed\\test2_chemical_sites_final_esm2.pt\
  \ `\n  --sequence-records data\\processed\\test2_lora_mamba_light.pt `\n  --output-csv runs\\default_multidimensional_fusion_single_structure\\\
  test2_predictions.csv `\n  --output-metrics runs\\default_multidimensional_fusion_single_structure\\\
  test2_metrics.json `\n  --device cuda\n```\n\n### 可选的三状态选择性预测（Selective prediction / Abstention）\n\n\
  当前公开模型已增加一个**默认关闭、显式启用**的后处理层。它不修改模型权重、`0.72/0.28`融合概率、`0.4702225653`二分类阈值或原`prediction`字段；启用后仅追加`uncertainty_score`、`abstained`和`selective_prediction`，其中三状态输出为`Toxic\
  \ / Non-toxic / Uncertain`。\n\n本功能具体完成了以下工作：\n\n1. 基于队友当前规范版本冻结[`selective_prediction_current_default_oof_v2.json`](configs/selective_prediction_current_default_oof_v2.json)，固定训练OOF数据源、五折划分、候选不确定性特征、coverage网格、5,000次类别分层bootstrap及晋级规则。Test1/Test2标签在策略构建和选择中均被禁止。\n\
  2. 从当前规范融合OOF提取决策边界接近度`1-|p-τ|/max(τ,1-τ)`，并对照加入`|p_1D-p_3D|`、三个1D种子的概率标准差、`1-mean_pLDDT`以及构象RMSF/RMSD和接触不确定性。缺失的可选结构特征使用各外层训练分区的中位数处理，不把“缺少构象”错误编码成零波动。\n\
  3. 最终`margin_only`直接使用归一化决策边界接近度，不拟合误差分类器，因而其分数定义本身不依赖标签。`deployable_core`与`conformer_extended`仅作为预设对照，在每个外层fold的其余四折上拟合类别平衡逻辑回归，再为held-out\
  \ fold产生误差排序分数。\n4. 离散AURC明确按从1条到6,387条的全部接收集大小上的风险均值计算。`margin_only`的AURC为`0.015373`；`deployable_core`与`conformer_extended`分别为`0.017252`和`0.015883`，均未优于简单边界接近度，因此按预设规则保留`margin_only`。\n\
  5. 将冻结策略实现为[`selective_prediction.py`](src/ghxtox/selective_prediction.py)中的独立后处理模块，并接入`ghxtox-predict\
  \ predict`和CPU `assemble`。策略加载时校验artifact类型、特征、阈值和参数；启用拒识也不会覆盖原`toxicity_probability`和二分类`prediction`。\n\
  6. 增加了策略加载、三状态输出、缺失特征处理、CSV兼容性和CLI显式启用测试；保存逐样本交叉拟合分数、risk--coverage表、bootstrap区间、冻结策略和输入SHA256。另生成了可复现的风险--覆盖图代码、SVG/PDF/600-dpi\
  \ PNG、源数据和英文caption。\n7. 在查看随机对照结果前冻结[`selective_prediction_formal_current_default_v2.json`](configs/selective_prediction_formal_current_default_v2.json)，将正式报告点固定为100%、95%、90%、85%和80%\
  \ coverage；每个点均按`round(coverage × 6387)`确定接收数，并报告accepted error、MCC、BACC、SN和SP。正式实验不重新拟合策略，也不重新选择特征。\n\
  8. 增加同接收数的随机拒判对照：使用5,000个均匀随机、跨coverage嵌套的样本排序（种子`20260820`）。区间和方法差值由5,000次类别分层配对bootstrap估计（种子`20260821`）；同一次bootstrap内，两种方法在同一重采样队列上比较，随机方法使用一个嵌套随机排序。未报告p值或显著性星号。\n\
  9. 在查看Test1/Test2选择性结果前冻结[`selective_prediction_frozen_threshold_transfer_current_default_v2.json`](configs/selective_prediction_frozen_threshold_transfer_current_default_v2.json)，锁定训练OOF产生的直接`margin_only`分数、`0.4702225653`二分类阈值和`0.47361765874159856`拒判截断。Test1/Test2不重新计算不确定性分位数，也不强制实现90%\
  \ coverage。\n10. 先生成并哈希不含标签的逐样本接收/拒判表，再读取标签计算结果。测试标签只进入事后指标、等接收数随机对照和固定mask bootstrap；dataset identity、标签、样本数、类别比例、测试概率分布及目标coverage均不能进入选择规则。\n\
  \n冻结策略只使用6,387条训练OOF记录，没有读取Test1/Test2标签。预设90% coverage下，OOF accepted error由全覆盖的`5.1198%`降至`2.9228%`（相对降低`42.91%`），accepted\
  \ MCC由`0.8733`升至`0.9257`；毒性/非毒性真实类别覆盖率分别为`85.97%/91.60%`。该结果说明拒绝靠近决策边界的样本可提高已接收预测的可靠性，但它是训练OOF证据，不是新的外部验证结果。\n\
  \n正式对照实验固定使用最终入选的`margin_only`策略。其唯一输入为融合概率到固定阈值的归一化接近度：`decision_closeness = 1-|p_GHXTox-τ|/max(τ,1-τ)`，其中`τ=0.47022256531284556`。该数值直接用于排序，不经过标签驱动的变换，也不应解释为校准后的逐样本错误概率。表中随机拒判结果为5,000个等coverage随机排序的均值；100%\
  \ coverage时两种方法完全相同。\n\n| 方法 | 目标coverage | 实际coverage | 接收数 | accepted error | MCC | BACC | SN | SP\
  \ |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|\n| 冻结不确定性排序 | 100% | 100.00% | 6,387 | 5.1198% |\
  \ 0.8733 | 0.9324 | 0.8944 | 0.9705 |\n| 随机拒判 | 100% | 100.00% | 6,387 | 5.1198% | 0.8733 | 0.9324 |\
  \ 0.8944 | 0.9705 |\n| 冻结不确定性排序 | 95% | 95.01% | 6,068 | 3.6585% | 0.9082 | 0.9505 | 0.9216 | 0.9795\
  \ |\n| 随机拒判 | 95% | 95.01% | 6,068 | 5.1194% | 0.8733 | 0.9324 | 0.8944 | 0.9705 |\n| 冻结不确定性排序 | 90%\
  \ | 90.00% | 5,748 | 2.9228% | 0.9257 | 0.9585 | 0.9316 | 0.9854 |\n| 随机拒判 | 90% | 90.00% | 5,748 |\
  \ 5.1203% | 0.8733 | 0.9324 | 0.8943 | 0.9705 |\n| 冻结不确定性排序 | 85% | 85.00% | 5,429 | 2.4130% | 0.9387\
  \ | 0.9650 | 0.9411 | 0.9889 |\n| 随机拒判 | 85% | 85.00% | 5,429 | 5.1200% | 0.8733 | 0.9324 | 0.8944 |\
  \ 0.9705 |\n| 冻结不确定性排序 | 80% | 80.01% | 5,110 | 2.0548% | 0.9481 | 0.9705 | 0.9508 | 0.9903 |\n| 随机拒判\
  \ | 80% | 80.01% | 5,110 | 5.1196% | 0.8733 | 0.9324 | 0.8944 | 0.9705 |\n\n在预先指定的90% coverage处，随机拒判减去冻结不确定性排序的accepted\
  \ error差值为`2.1914`个百分点，95%配对bootstrap区间为`1.8089–2.5748`个百分点；在全部四个部分coverage点，冻结排序的accepted error均低于随机拒判均值。因而，性能改善不能仅归因于“少预测了一部分样本”，而是表明冻结分数在训练OOF队列中富集了较难样本。该结论仍不构成Test1/Test2或独立外部数据上的泛化证据。\n\
  \n#### OOF冻结阈值在Test1/Test2上的直接迁移\n\nTest1和Test2严格使用同一个训练OOF策略与拒判截断：`uncertainty_score = decision_closeness\
  \ <= 0.47361765874159856`时接收，否则输出`Uncertain`。两个测试集均未按自身分布重算分位数，因此实际coverage是冻结规则的观测结果，而不是预先指定的测试集配额。\n\
  \n| 数据集 | 方法 | 实际coverage | 接收数 | accepted error | MCC | BACC | SN | SP |\n|---|---|---:|---:|---:|---:|---:|---:|---:|\n\
  | Test1 | 完整二分类预测 | 100.00% | 1,126 | 5.2398% | 0.8705 | 0.9323 | 0.8969 | 0.9677 |\n| Test1 | OOF冻结阈值接收集\
  \ | 88.54% | 997 | 2.7081% | 0.9329 | 0.9629 | 0.9397 | 0.9860 |\n| Test1 | 等接收数随机拒判 | 88.54% | 997\
  \ | 5.2400% | 0.8705 | 0.9323 | 0.8969 | 0.9677 |\n| Test2 | 完整二分类预测 | 100.00% | 582 | 5.3265% | 0.6673\
  \ | 0.8618 | 0.7609 | 0.9627 |\n| Test2 | OOF冻结阈值接收集 | 86.94% | 506 | 3.1621% | 0.7781 | 0.8983 | 0.8158\
  \ | 0.9808 |\n| Test2 | 等接收数随机拒判 | 86.94% | 506 | 5.3274% | 0.6670 | 0.8617 | 0.7607 | 0.9627 |\n\n\
  Test1中，完整集合减去冻结接收集的error差值为`2.5317`个百分点，95%固定mask配对bootstrap区间为`1.6203–3.5139`个百分点；相对等接收数随机拒判的差值为`2.5319`个百分点，区间为`1.4881–3.6072`个百分点。Test2对应差值分别为`2.1644`个百分点（`0.9881–3.5182`）和`2.1653`个百分点（`0.7767–3.7402`）。因此两个benchmark均通过结果计算前规定的strong-support判据。\n\
  \n这一结果表明，冻结的不确定性阈值在两个既有benchmark上仍能富集困难样本，且提升不能用“随机少预测相同数量样本”解释。不过，不应把所有子指标都写成确定改善：Test2 sensitivity的点差为`+0.0549`，但95%区间为`-0.0109–0.1368`，仍跨过零。此外，Test1/Test2虽未参与策略选择，却是项目既有benchmark，而不是新收集的独立外部数据；因此本实验支持**固定策略的benchmark迁移**，不等同于全新外部队列验证。\n\
  \nlabel-blind决策表在读取标签评价前写出，其SHA256为`e6820ffe76688e8fdee6f8e704b1eef0bb5d2f83694aa5f858ead65687ce85a0`。完整结果见[`runs/selective_prediction_frozen_threshold_transfer_current_default_20260810_v2/`](runs/selective_prediction_frozen_threshold_transfer_current_default_20260810_v2/)，评估脚本为[`scripts/evaluate_selective_prediction_test_transfer.py`](scripts/evaluate_selective_prediction_test_transfer.py)，正式图表及源数据见[`paper_figures/output/selective_prediction_frozen_threshold_transfer_current_default_v2/`](paper_figures/output/selective_prediction_frozen_threshold_transfer_current_default_v2/)。\n\
  \n四特征组合（决策边界距离、1D/3D分歧、1D种子离散度和结构置信度）在90% coverage点的error略低（`2.9054%`），但全coverage离散AURC为`0.017252`，劣于更简单的边界距离策略`0.015373`；因此按预先冻结的晋级规则，公开可选策略采用直接边界接近度。包含RMSF、构象RMSD和接触不确定性的扩展策略AURC为`0.015883`，同样未通过主终点，只作为研究对照保留，不进入规范推理或正式图。\n\
  \n启用方式：\n\n```powershell\nghxtox-predict predict `\n  --processed data\\processed\\test2_chemical_sites_final_esm2.pt\
  \ `\n  --sequence-records data\\processed\\test2_lora_mamba_light.pt `\n  --selective-policy runs\\\
  selective_prediction_current_default_oof_20260810_v2\\selected_policy.json `\n  --output-csv runs\\\
  selective_predictions\\test2_predictions.csv `\n  --output-metrics runs\\selective_predictions\\test2_metrics.json\
  \ `\n  --device cuda\n```\n\n若不传`--selective-policy`，CSV列和原二分类行为保持不变。`uncertainty_score`是直接的归一化决策边界接近度，用于样本排序和执行冻结拒绝阈值，而不是校准后的逐样本错误概率。CPU\
  \ `assemble`子命令也支持同一参数。当前规范输入重建见[`runs/selective_prediction_current_default_input_20260810_v1/`](runs/selective_prediction_current_default_input_20260810_v1/)；策略选择记录见[`runs/selective_prediction_current_default_oof_20260810_v2/`](runs/selective_prediction_current_default_oof_20260810_v2/)；正式五coverage训练OOF对照见[`runs/selective_prediction_formal_current_default_20260810_v2/`](runs/selective_prediction_formal_current_default_20260810_v2/)；冻结阈值的Test1/Test2迁移结果见[`runs/selective_prediction_frozen_threshold_transfer_current_default_20260810_v2/`](runs/selective_prediction_frozen_threshold_transfer_current_default_20260810_v2/)。实现位于[`src/ghxtox/selective_prediction.py`](src/ghxtox/selective_prediction.py)，规范输入构建脚本为[`scripts/prepare_current_default_selective_oof.py`](scripts/prepare_current_default_selective_oof.py)。相应正式图表包位于[`paper_figures/output/selective_prediction_formal_current_default_v2/`](paper_figures/output/selective_prediction_formal_current_default_v2/)和[`paper_figures/output/selective_prediction_frozen_threshold_transfer_current_default_v2/`](paper_figures/output/selective_prediction_frozen_threshold_transfer_current_default_v2/)。旧v1包基于已被替换的重建融合向量，仅保留历史溯源，不再作为当前公开模型的证据。\n\
  \n### 已完成：无需重训的1D--3D专家分歧分析\n\n为明确结构专家究竟补充了哪些序列专家无法正确判别的样本，工程使用当前Test1与Test2逐样本预测开展了只读分析。分析未加载checkpoint、未执行模型前向或重训，也未改变任何概率与阈值。样本正确性由训练侧已冻结的专家阈值定义：1D\
  \ LoRA--Mamba专家为`0.392`，3D结构专家为`0.677819`，且统一采用`p >= threshold`判为有毒。由此将每个样本唯一划分为`both correct`、`1D expert\
  \ only correct`、`3D expert only correct`和`both wrong`四组；Test1与Test2分别报告，不合并进行统计推断。\n\n四组样本的组成及预先指定属性如下。连续变量均报告中位数[IQR]；chemical-site\
  \ coverage定义为有效残基中至少具有一种化学位点标记的比例，而非位点总数除以序列长度；conformer availability仅表示现有元数据中的可用性。\n\n| Test1 group\
  \ | n（有毒） | Length | Cys count | Mean pLDDT | Chemical-site coverage | Conformer available |\n|---|---:|---:|---:|---:|---:|---:|\n\
  | Both experts correct | 1032（277） | 33 [23, 41] | 0 [0, 4] | 0.737 [0.634, 0.825] | 0.929 [0.884, 0.960]\
  \ | 424/1032（41.1%） |\n| 1D expert only correct | 29（15） | 25 [18, 40] | 1 [0, 4] | 0.701 [0.573, 0.803]\
  \ | 0.933 [0.900, 0.975] | 18/29（62.1%） |\n| 3D expert only correct | 24（5） | 20 [15, 28.75] | 1 [0,\
  \ 2] | 0.656 [0.587, 0.763] | 0.935 [0.905, 0.976] | 18/24（75.0%） |\n| Both experts wrong | 41（23） |\
  \ 26 [20, 34] | 1 [0, 4] | 0.647 [0.570, 0.765] | 0.920 [0.846, 0.957] | 26/41（63.4%） |\n\n| Test2 group\
  \ | n（有毒） | Length | Cys count | Mean pLDDT | Chemical-site coverage | Conformer available |\n|---|---:|---:|---:|---:|---:|---:|\n\
  | Both experts correct | 529（33） | 31 [17, 41] | 0 [0, 1] | 0.726 [0.645, 0.810] | 0.931 [0.886, 0.968]\
  \ | 250/529（47.3%） |\n| 1D expert only correct | 13（2） | 28 [25, 41] | 2 [0, 4] | 0.694 [0.548, 0.797]\
  \ | 0.950 [0.900, 0.975] | 7/13（53.8%） |\n| 3D expert only correct | 15（1） | 18 [15, 26.5] | 0 [0, 2]\
  \ | 0.703 [0.593, 0.772] | 0.938 [0.920, 1.000] | 12/15（80.0%） |\n| Both experts wrong | 25（10） | 26\
  \ [16, 36] | 2 [0, 4] | 0.610 [0.563, 0.693] | 0.913 [0.815, 0.951] | 15/25（60.0%） |\n\n3D专家在全部1D错误样本中分别纠正Test1的`24/65=36.92%`和Test2的`15/40=37.50%`；反向地，1D专家在全部3D错误样本中分别纠正`29/70=41.43%`和`13/38=34.21%`。因此，两位专家存在可重复的双向互补，但没有证据表明其中一位在所有错误样本上占优。更明确的差异出现在类别方向：3D-only-correct样本中，Test1有`19/24`、Test2有`14/15`为无毒样本。按真实类别计算，3D对1D错误的纠正率在无毒样本中为Test1\
  \ `51.35%`、Test2 `48.28%`，在有毒样本中仅为`17.86%`和`9.09%`。就当前两个benchmark而言，3D专家的主要贡献因而更接近对假阳性的特异性补偿，而不是稳定提高有毒肽召回。\n\
  \n预先指定的主对比为`3D expert only correct - 1D expert only correct`。连续变量采用Cliff's delta和组内按真实标签分层的5,000次bootstrap区间，显著性由10,000次标签分层置换检验给出；两数据集共10项检验统一进行Benjamini--Hochberg校正。3D-only-correct样本在两个数据集中均较短：Test1中位数`20\
  \ vs 25`，delta=`-0.286`，95% CI `[-0.549, 0.000]`，`p=0.0978`，`q=0.4890`；Test2为`18 vs 28`，delta=`-0.523`，95%\
  \ CI `[-0.831, -0.164]`，`p=0.0156`，`q=0.1560`。该方向具有描述性一致性，但没有一项主对比在BH校正后达到`q<0.05`，因此不得表述为已确认的显著分层。Cys数量、平均pLDDT和chemical-site\
  \ coverage均未表现出跨数据集稳定的校正后差异；尤其pLDDT方向在两个数据集中相反，不能据此声称3D只在高置信结构上提供增益。\n\n原始结果中3D-only-correct组的conformer\
  \ availability较高，但这一现象不能解释为多构象带来的因果收益。对全部1,708个样本的预设敏感性审计显示，`conformer_available == (length <= 30)`完全成立且零例外：长度不超过15\
  \ aa的样本来自PepFlow，16--30 aa来自AF2，超过30 aa则无构象集合。更重要的是，本分析所用当前规范预测来自单结构`base_logits`，从未使用这些构象字段。故该变量与长度和数据生成流程完全混杂，只能作为覆盖范围描述，不能作为3D纠错机制的独立证据。\n\

readme_excerpt: "# SKMamba\n\nOfficial implementation for **Structure-aware Knowledge-guided Heterogeneous\
  \ Mamba for Zygomaticomaxillary Suture Assessment**, MICCAI 2026.\n\nSKMamba targets automated zygomaticomaxillary\
  \ suture maturation staging from CBCT images.\n\n> **Dataset and text features:** [Download from Google\
  \ Drive](https://drive.google.com/drive/folders/1DOyy81IGrfMvDtoOCGUDdkzLMx9pEnS9?usp=drive_link)\n\n\
  ## Status\n\nCode, dataset structure, and training scripts are provided for release use.\n\n## Project\
  \ Structure\n\n```text\nSKMamba/\n├── README.md\n├── LICENSE\n├── requirements.txt\n├── .gitignore\n\
  ├── configs/\n│   └── skmamba.yaml\n├── scripts/\n│   └── train.py\n├── models/\n│   ├── __init__.py\n\
  │   └── skmamba.py\n├── datasets/\n│   ├── __init__.py\n│   └── zms_dataset.py\n├── utils/\n│   ├──\
  \ __init__.py\n│   ├── seed.py\n│   ├── metrics.py\n│   └── visualization.py\n├── splits/\n│   └── README.md\n\
  ├── features/\n│   └── README.md\n├── checkpoints/\n│   └── iee_mambaout.pth\n├── data/\n│   └── README.md\n\
  └── outputs/\n    └── .gitkeep\n```\n\n## Installation\n\n```bash\ngit clone <repository-url>\ncd SKMamba\n\
  ```\n\nCreate and activate a conda environment:\n\n```bash\nconda create -n skmamba python=3.10 -y\n\
  conda activate skmamba\n```\n\nInstall PyTorch according to your local CUDA environment. For example,\
  \ on a CUDA 12.9 system:\n\n```bash\npip install torch torchvision --index-url https://download.pytorch.org/whl/cu129\n\
  ```\n\nIf your CUDA version is different, please choose the matching PyTorch installation command from\
  \ the [official PyTorch installation page](https://pytorch.org/get-started/locally/).\n\nInstall the\
  \ remaining dependencies:\n\n```bash\npip install -r requirements.txt\n```\n\nCheck the environment:\n\
  \n```bash\npython -c \"import torch; print(torch.__version__); print(torch.cuda.is_available()); print(torch.version.cuda)\"\
  \n```\n\nRun training with the default configuration:\n\n```bash\npython scripts/train.py --config configs/skmamba.yaml\n\
  ```\n\n## Data Preparation\n\nDownload the dataset and text feature files from Google Drive:\n\n> **Dataset\
  \ and text features:** [Download from Google Drive](https://drive.google.com/drive/folders/1DOyy81IGrfMvDtoOCGUDdkzLMx9pEnS9?usp=drive_link)\n\
  \nThe Google Drive folder contains:\n\n- `ZMS_classification.zip`\n- `descriptions.csv`\n- `zms_text_features.npy`\n\
  \nAfter downloading:\n\n- Unzip `ZMS_classification.zip`\n- Place the extracted `ZMS_classification/`\
  \ folder under `SKMamba/data/`\n- Place `descriptions.csv` and `zms_text_features.npy` under `SKMamba/features/`\n\
  \nThe final directory layout should be:\n\n```text\nSKMamba/\n├── data/\n│   └── ZMS_classification/\n\
  ├── features/\n│   ├── descriptions.csv\n│   └── zms_text_features.npy\n```\n\nThe ZMS classification\
  \ dataset should contain class folders:\n\n```text\ndata/ZMS_classification/\n├── A/\n├── B/\n├── C/\n\
  ├── D/\n└── E/\n```\n\nPrepare split files under `splits/`. Each line should contain a relative image\
  \ path such as:\n\n```text\nA/0012 LL.bmp\nA/0012 LU.bmp\nA/0012 RL.bmp\nA/0012 RU.bmp\n```\n\n## Text\
  \ Feature Preparation\n\nPlace the text feature files under `features/`:\n\n```text\nfeatures/zms_text_features.npy\n\
  features/descriptions.csv\n```\n\n## Training\n\nUpdate paths in `configs/skmamba.yaml` if needed, then\
  \ run:\n\n```bash\npython scripts/train.py --config configs/skmamba.yaml\n```\n\nThe default configuration\
  \ saves checkpoints, logs, and figures under `outputs/`.\n\n## Citation\n\n```bibtex\n@inproceedings{skmamba2026,\n\
  \  title={Structure-aware Knowledge-guided Heterogeneous Mamba for Zygomaticomaxillary Suture Assessment},\n\
  \  author={Author names},\n  booktitle={MICCAI},\n  year={2026}\n}\n```\n\n## License\n\nThis project\
  \ is released under the MIT License. See `LICENSE` for details.\n"

readme_excerpt: "# \U0001F9E0 Brain Tumor Segmentation — Streamlit Web App\n\nCNN (ResNet34 + UNet) vs\
  \ Vision Transformer (MiT-B2 + UNet)  \nWith Grad-CAM XAI Visualization\n\n---\n\n## \U0001F4C1 Folder\
  \ Structure\n\n```\nbrain_tumor_app/\n├── app.py                  → Main Streamlit application\n├──\
  \ requirements.txt        → All required dependencies\n├── README.md               → Project documentation\n\
  └── models/                 → Place trained models here\n    ├── cnn_best.pth\n    └── transformer_best.pth\n\
  ```\n\n---\n\n## \U0001F680 How to Run the Project (VS Code)\n### Step 1 — Create Virtual Environment\
  \ (first time only)\n\n```bash\npython -m venv venv\n```\n\n**Windows:**\n```bash\nvenv\\Scripts\\activate\n\
  ```\n\n**Mac/Linux:**\n```bash\nsource venv/bin/activate\n```\n\n### Step 2 — Install Required Packages\n\
  \n```bash\npip install -r requirements.txt\n```\n\n> ⚠️ For PyTorch with GPU support (CUDA 11.8):\n\
  > ```bash\n> pip install torch torchvision --index-url https://download.pytorch.org/whl/cu118\n> ```\n\
  \n### Step 3 — Add Pretrained Models\n\nDownload your trained models from Google Drive and place them\
  \ in the models/ folder:\n\n- mri_boost_0_8/best.pth → rename and copy to models/cnn_best.pth  \n- transformer_mri_safe_fast/best_model.pth\
  \ → rename and copy to models/transformer_best.pth\n# \U0001F9E0 NeuroSegAI\n\nWelcome to **NeuroSegAI**!\
  \ \U0001F44B\n\nThis project is my Final Year Project (BS Computer Science) developed to assist in **brain\
  \ tumor segmentation from MRI images** using Deep Learning.\nIt compares the performance of **CNN (ResNet34\
  \ + U-Net)** and **Vision Transformer (MiT-B2 + U-Net)** models while also providing **Explainable AI\
  \ (Grad-CAM)** visualizations to make predictions more transparent.\n\nI built this application using\
  \ **Streamlit** to provide an interactive and user-friendly interface where users can upload MRI scans,\
  \ generate segmentation results, compare both models, and explore AI explanations.\n\n## \U0001F680\
  \ Live Demo\n\n\U0001F517 **Try NeuroSegAI here:**  \nhttps://huggingface.co/spaces/ayeshayaqub605/NeuroSegAI\n\
  \n## \U0001F4BB GitHub Repository\n\U0001F517 https://github.com/ayeshayaqub605/NeuroSegAI\n\nThank\
  \ you for visiting my project! I hope you find it useful. Your feedback and suggestions are always welcome.\
  \ \U0001F60A\n\n\n### Step 4 — Run the Application\n\n```bash\nstreamlit run app.py\n```\n\nThe application\
  \ will locally open in  browser at: `http://localhost:8501`\n\n---\n\n### \U0001F9EA Testing Without\
  \ Models\n\nThe app includes a  **\"Use synthetic demo data\"** You can use this feature to test the\
  \ application without uploading MRI files.\n\n---\n\n## \U0001F4CB Features\n\n| Feature | Description\
  \ |\n|--------|-------------|\n| CNN Model | ResNet34 + UNet architecture with 4-channel input and binary\
  \ segmentation output |\n| Transformer Model | MiT-B2 + UNet architecture with 4-channel input and 2-class\
  \ output |\n| Explainability | Grad-CAM heatmaps for visual interpretation |\n| Input Format | BraTS\
  \ dataset (.nii.gz: T1, T1ce, T2, FLAIR) |\n| Evaluation Metrics | Dice Score, IoU, and comparison charts\
  \ |\n| Export Option | Download segmented output images |\n\n---\n\n## ❓ Common Issues & Fixes\n\nError:\
  \ ModuleNotFoundError: timm\n→ Solution:\n```bash\npip install timm\n```\nError: CUDA out of memory\n\
  → The application will automatically switch to CPU mode.\n\nModel loading error\n→ Ensure the .pth file\
  \ paths are correctly set in the sidebar.\n\nError: skimage not found\n→ Solution:\n```bash\npip install\
  \ scikit-image\n```\n"

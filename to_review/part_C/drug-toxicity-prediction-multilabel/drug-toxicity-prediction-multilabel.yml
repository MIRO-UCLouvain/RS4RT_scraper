readme_excerpt: "# Drug-Toxicity-Prediction-MultiLabel-Project\nA multi-label learning model for predicting\
  \ drug-induced toxicity in multi-organ based on toxicogenomics data.\n\n\n# Keywords\nDrug-induced Toxicity,\
  \ Multi-label, Prediction, Multi-organ, Gene Expression Data\n\n\n# Dataset\n[Toxygates](https://toxygates.nibiohn.go.jp),\
  \ [Open TG-GATEs](https://toxico.nibiohn.go.jp/english/), [Pathology items](https://dbarchive.biosciencedbc.jp/en/open-tggates/download.html)\n\
  \n\n# Requires\n  R version 3.4.0  \n  Python version 3.6.6  \n\n  keras==2.4.3  \n  tensorflow==2.2.0\
  \  \n  numpy>=1.17  \n  scipy==1.4.1  \n  Cython>=0.29  \n  scikit-learn==0.23.2  \n  setuptools==50.0.3\
  \  \n  absl-py==0.10.0  \n  matplotlib==3.2.0  \n  joblib==0.16.0  \n  h5py==2.10.0  \n  pandas==1.1.2\
  \  \n  six  \n  liac-arff  \n  arff  \n  tqdm  \n  astor  \n\n\n# Installation\nFILE: Drug-Toxicity-Prediction-MultiLabel/AttRethinkNet-Multilabel-Classification\n\
  \nInstall packages\n```bash\npip install numpy Cython\n```\n\nCompile and install the C-extensions\n\
  Change Directory in CMD: change to project working directory using the \"cd\" command\n```bash\npython\
  \ ./setup.py install\npython ./setup.py build_ext -i\n```\n\nRun example in project directory\n```bash\n\
  python ./examples/classification.py\n```\n\n\n# Orgainzation  \n1.\tAdvancedML-MLSMOTE \n    Method\
  \ : Multilabel Synthetic Minority Over-sampling Technique (MLSMOTE)\n    * **mlsmote-liver.py** Produce\
  \ synthetic instances for imbalanced multilabel liver dataset. \n\t* **mlsmote-kidney.py** Produce synthetic\
  \ instances for imbalanced multilabel kidney dataset. \n2.\tDrug-feature-sorted-by-score-MLFS \n   \
  \ * **LoadingData.py** Provide basic operations to loading data.\n\t* **MultiLabelFStatistic-liver.py**\
  \ Multi label F-Statistic (MLFS) algorithm in liver dataset.\n\t* **MultiLabelFStatistic-kidney.py**\
  \ Multi label F-Statistic (MLFS) algorithm in kidney dataset. \n3.\tDrug-multilabel-classifier-comparison\n\
  \    a. Liver dataset:\n\tClassifier : Binary relevance (BR), Classifier chains (CC).\n    * **drug_featureSelection_mlClassifier_lr_liver.py**\
  \ Base classifier: Logistic regression (lr). \n\t* **drug_featureSelection_mlClassifier_rf_liver.py**\
  \ Base classifier: Random forest (rf). \n\t* **drug_featureSelection_mlClassifier_svm_liver.py** Base\
  \ classifier: Linear support vector machines (svm). \n\t* **integrative-model-jackknife-knn-liver.py**\
  \ Integrative model.\n\tb. Kidney dataset:\n\tClassifier : Binary relevance (BR), Classifier chains\
  \ (CC).\n    * **drug_featureSelection_mlClassifier_lr_kidney.py** Base classifier: Logistic regression\
  \ (lr). \n\t* **drug_featureSelection_mlClassifier_rf_kidney.py** Base classifier: Random forest (rf).\
  \ \n\t* **drug_featureSelection_mlClassifier_svm_kidney.py** Base classifier: Linear support vector\
  \ machines (svm). \n\t* **integrative-model-jackknife-knn-kidney.py** Integrative model.\n\t\n4.\tAttRethinkNet-Multilabel-Classification\
  \  \n    * mlearn.models.rethinknet.rethinkNet.py (Att-RethinkNet framework)  \t\t\t \n    * examples\
  \ (Run models and draw ROC curves, 002 means our proposed Att-RethinkNet, 001 means RethinkNet.)  \n\
  \n \n# How to Use\n**Traditional Methods:** Download datasets->MLSMOTE->MLFS->Feature selection->Classification.\
  \  \n**Att-RethinkNet Method:** Download datasets->MLSMOTE->Att-RethinkNet Classification.\n\n"

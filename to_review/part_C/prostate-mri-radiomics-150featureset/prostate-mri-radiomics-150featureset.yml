readme_excerpt: "\n\n# Prostate MRI Radiomics – 150 Feature Set\n\nThis repository provides a reproducible\
  \ 3D radiomics feature extraction pipeline for prostate T2-weighted MRI using gland segmentation masks.\
  \ The pipeline generates a standardized dataset of 150 quantitative radiomic features per patient.\n\
  \n---\n\n## Overview\n\n- Modality: T2-weighted Prostate MRI  \n- Segmentation: Prostate gland mask\
  \  \n- Extraction Dimension: 3D  \n- Bin Width: 25  \n- Total Features per Patient: 150  \n\nFeature\
  \ Composition:\n- 107 Original image radiomic features  \n- 43 LoG-filtered radiomic features (sigma\
  \ = 1.0)  \n\nThe feature dimensionality is controlled to produce a consistent and model-ready feature\
  \ matrix.\n\n---\n\n## Processing Workflow\n\n1. Load T2-weighted MRI (NIfTI format)\n2. Normalize image\
  \ intensity\n3. Binarize gland segmentation mask\n4. Resample mask to match MRI geometry (nearest neighbor)\n\
  5. Extract Original radiomics features\n6. Extract LoG features (sigma=1.0)\n7. Generate structured\
  \ CSV output (patients × 150 features)\n\n---\n\n## Extracted Feature Classes\n\n- First Order Statistics\
  \  \n- Shape (3D)  \n- GLCM  \n- GLRLM  \n- GLSZM  \n- GLDM  \n- NGTDM  \n\n---\n\n## Output\n\nThe\
  \ pipeline produces:\n\npyradiomics_150_features.csv  \n\nFormat:\nN patients × 150 features  \n\nEach\
  \ row corresponds to one patient.  \nEach column represents a quantitative radiomic biomarker.\n\n---\n\
  \n## Technologies Used\n\n- Python  \n- PyRadiomics  \n- SimpleITK  \n- NumPy  \n- Pandas  \n\n---\n\
  \n## Use Case\n\nThe extracted feature set is designed for:\n\n- Prostate cancer classification  \n\
  - Risk stratification modeling  \n- Machine learning pipelines (XGBoost, Random Forest, etc.)  \n- Imaging\
  \ biomarker research  \n\n---\n\n## Data Availability\n\nMRI data and extracted feature files are not\
  \ included due to institutional research restrictions.\n\n---\n\n"

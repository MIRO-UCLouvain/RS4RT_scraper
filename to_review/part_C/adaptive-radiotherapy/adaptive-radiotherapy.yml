readme_excerpt: "# D.I.A.N.A (Dynamic Imaging-based Adaptive Neural Assistant)\nAn Intelligent System\
  \ for Adaptive Radiotherapy (ART) in Cervical Cancer: Addressing Inter-Fraction Anatomical Variations\
  \ using Machine Learning\n\n# Predicting the Need for Adaptive Radiotherapy from Initial CT Scans\n\n\
  ## 1. Project Objective\n\nThis research aims to develop a deep learning model capable of predicting\
  \ whether a cervical cancer patient will require future adaptation of their radiation therapy plan by\
  \ analyzing only the initial planning CT (Computed Tomography) images. The success of this model has\
  \ the potential to become a clinical support tool for identifying high-risk patients early, enabling\
  \ closer monitoring or adjustments to the therapy strategy.\n\n---\n\n## 2. Final Results\n\nAfter undergoing\
  \ a rigorous series of preprocessing, training, and validation processes, the developed pure 3D Convolutional\
  \ Neural Network (CNN) model achieved very promising performance on a separate test dataset.\n\n| **Key\
  \ Metric** | **Score on Test Data** |\n| ----------------------- | ---------------------- |\n| **Accuracy**\
  \ | **88.00%** |\n| **Recall (Sensitivity)** | **100%** |\n| **Precision** | 73%                   \
  \ |\n| **F1-Score** | 84%                    |\n\n**Key Conclusion:** The model successfully **correctly\
  \ identified all patients (100%)** who actually required therapy adaptation, which is the most critical\
  \ clinical objective of this research.\n\n---\n\n## 3. Project Structure\n\nThis project consists of\
  \ several Python scripts that must be run sequentially to replicate the results.\n\n\n├── 01_convert_final.py \
  \     # (Local) Converts raw DICOM CT scans to NIfTI format.\n\n├── 02_create_labels.py      # (Local)\
  \ Automatically creates a label.txt file for each patient.\n\n├── 03_split_dataset.py      # (Local)\
  \ Splits the dataset into Training, Validation, & Test sets.\n\n├── cnn_components_final.py  # Module\
  \ containing the model architecture and data loader.\n\n├── train_cnn_final.py        # (Colab) Main\
  \ script for training the model using a GPU.\n\n├── test_model_final.py       # (Colab) Script for testing\
  \ the best model on the test data.\n\n├── requirements.txt          # List of required Python libraries.\n\
  \n└── README.md                 # Explanation of this project.\n\n---\n\n## 4. Workflow & How to Run\n\
  \n### Step 0: Prerequisites\n\n1.  **Initial Folder Structure:**\n    * Create a main project folder\
  \ on your computer, e.g., D:/AI_Project/.\n    * Inside it, create a RAW_DATASET/ folder and place all\
  \ patient DICOM data folders there (e.g., PT0, PT1, etc.).\n    * Place the data_map.csv file (containing\
  \ Patient_ID & Group) inside D:/AI_Project/.\n\n2.  **Install Required Libraries:**\n    Open a terminal\
  \ or command prompt, navigate to your project folder, and run:\n    ```bash\n    pip install -r requirements.txt\n\
  \    ```\n\n### Step 1: Data Preparation (Run on a Local Machine/VS Code)\n\nRun the following scripts\
  \ sequentially. Important: Make sure to adjust the PATH variable at the top of each script to match\
  \ your folder structure.\n\n1.  **Convert DICOM to NIfTI:**\n    ```bash\n    python 01_convert_final.py\n\
  \    ```\n    * **Output:** It will create a PROCESSED_DATASET/ folder (or another name you specify)\
  \ containing NIfTI files for each patient.\n\n2.  **Create Label Files:**\n    ```bash\n    python 02_create_labels.py\n\
  \    ```\n    * **Output:** It will create a label.txt file inside each patient's subfolder in PROCESSED_DATASET/.\n\
  \n3.  **Split Dataset:**\n    ```bash\n    python 03_split_dataset.py\n    ```\n    * **Output:** It\
  \ will create a final_data_map.csv file in your main folder.\n\n4.  **Sync to Google Drive:**\n    *\
  \ Upload the entire PROCESSED_DATASET/ folder containing the NIfTI files and label.txt.\n    * Upload\
  \ the final_data_map.csv file.\n    * Upload the cnn_components_final.py file.\n\n### Step 2: Training\
  \ & Testing (Run in Google Colab)\n\n1.  **Prepare Colab Notebook:**\n    * Create a new notebook in\
  \ Google Colab.\n    * Ensure you select a runtime with a GPU accelerator (Runtime -> Change runtime\
  \ type -> GP"

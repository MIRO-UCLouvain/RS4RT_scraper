readme_excerpt: "# MRgRT - Segmentation OAR Thorax (version locale PC)\n\nPour valider l'environnement\
  \ avant de basculer sur HPC MARWAN.\n\n## Demarrage rapide\n\n1. Double-clic sur `setup_local.bat` (sur\
  \ le Bureau, dans ce dossier)\n   - Cree le venv `.venv`\n   - Installe PyTorch CPU + MONAI + dependances\n\
  \   - Lance `smoke_test.py` automatiquement\n\n2. Si tout est vert, votre env est valide. Vous pouvez\
  \ :\n   - Lancer le notebook : `jupyter notebook notebooks/00_pedagogical_pipeline.ipynb`\n   - Pousser\
  \ le code sur git, puis basculer sur MARWAN pour entrainer\n\n## Limitations sur PC sans GPU\n\n- Pas\
  \ d'entrainement reel (trop lent : plusieurs jours par fold)\n- Smoke test : OK\n- Inference sur 1-2\
  \ patients : lent mais OK\n- Pour les vrais entrainements : HPC MARWAN\n\n## Structure\n\n```\nmrgrt_seg/\n\
  \  setup_local.bat       # creation venv + install + smoke test\n  smoke_test.py         # validation\
  \ env (autonome)\n  requirements_cpu.txt  # deps Python\n  configs/              # default.yaml (IRM),\
  \ ct.yaml (CT)\n  src/                  # code Python\n    data/, models/, train/, eval/, xai/\n  scripts/\
  \              # train.py, evaluate.py, etc.\n```\n\n## Reactivation du venv plus tard\n\n```powershell\n\
  cd %USERPROFILE%\\Desktop\\mrgrt_seg\n.venv\\Scripts\\activate\n```\n"

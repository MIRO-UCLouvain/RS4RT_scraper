readme_excerpt: "# Doctor Booking AI (Frontend)\n\nProduction-ready React Native (Expo) frontend for discovering\
  \ doctors by category and booking appointments with an AI voice agent trigger. Backend is assumed available\
  \ via REST; this app uses a centralized API service with mock data and clear integration points to swap\
  \ to real endpoints.\n\n## Tech Stack\n- Expo + React Native (TypeScript)\n- React Navigation (Bottom\
  \ Tabs + Native Stack)\n- Context API + AsyncStorage (auth)\n- Functional components + hooks\n\n## Project\
  \ Structure\n```\napp/\n  navigation/ RootNavigator.tsx, TabNavigator.tsx, HomeStack.tsx\n  screens/\
  \ HomeScreen.tsx, DoctorListScreen.tsx, DoctorDetailScreen.tsx, AppointmentsScreen.tsx, ProfileScreen.tsx,\
  \ LoginScreen.tsx, SignupScreen.tsx\n  components/ CategoryCard.tsx, DoctorCard.tsx, AppointmentCard.tsx,\
  \ FloatingAIButton.tsx\n  context/ AuthContext.tsx\n  services/ api.ts\n  types/ index.ts\nApp.tsx\n\
  ```\n\n## Running Locally\n\n1) Install Node.js LTS\n2) Install dependencies\n\n```bash\nnpm install\n\
  ```\n\n3) Start the Expo dev server\n\n```bash\nnpx expo start\n```\n\n4) Open on device/emulator\n\
  - Press `a` for Android emulator, `i` for iOS (macOS) or scan the QR with Expo Go.\n\n## Notes\n- This\
  \ project ships with a mock `api.ts`. Replace mock methods with real `fetch` calls to your backend and\
  \ keep token attachment in place.\n- Auth token and user profile persist via AsyncStorage.\n- Auth-only\
  \ flows: Appointments, Profile, and booking/payment require login; browsing categories/doctors is public.\n\
  - The floating \"Chat with AI\" button currently triggers a mock AI endpoint; wire to your backend for\
  \ voice/chat startup.\n\n## Integration Points\n- Centralized service: `app/services/api.ts`\n  - `getCategories`,\
  \ `getDoctorsByCategory`, `getDoctor`\n  - `login`, `signup`, `logout`, `getProfile`\n  - `getAppointments`,\
  \ `bookAppointment`, `initiatePayment`, `triggerAIVoiceForAppointment`, `triggerAIQuick`\n- Swap mock\
  \ implementations with real `fetch` calls and your base URL.\n\n## Type Contracts\nSee `app/types/index.ts`\
  \ for `Doctor`, `Appointment`, and `User` shapes.\n\n## Lint/Type Check\n```bash\nnpm run typecheck\n\
  ```\n\n## Production Readiness\n- Clean architecture, modular services, and reusable UI components\n\
  - Robust loading/empty/error UX\n- Navigation guards implemented via runtime checks and CTA redirects\n\
  \n"

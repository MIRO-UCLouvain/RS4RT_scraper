readme_excerpt: "# Brain MRI Radiomics-Style Numerical Dataset - ML Analysis\n\nA comprehensive machine\
  \ learning analysis of radiomics-style numerical features extracted from brain MRI images. This project\
  \ includes exploratory data analysis, baseline model training, and feature selection techniques.\n\n\
  ## \U0001F4CA Dataset Credits\n\n**Dataset Owner:** [AADI GUPTA](https://www.kaggle.com/aadigupta1601)\
  \  \n**Dataset Source:** [Brain MRI Radiomics-Style Numerical Dataset](https://www.kaggle.com/datasets/aadigupta1601/brain-mri-radiomics-style-numerical-dataset)\
  \  \n**Original Dataset:** Derived from [Brain Tumor MRI Dataset](https://www.kaggle.com/datasets/miadul/brain-tumor-mri-dataset)\
  \ by [Arif Miah](https://www.kaggle.com/miadul)\n\n## \U0001F4C1 Project Structure\n\n```\n.\n├── dataset/\n\
  │   ├── brain_mri_rich_features.csv      # Main dataset with radiomics features\n│   ├── feature_description.csv\
  \          # Feature descriptions\n│   └── README.txt                       # Dataset info\n├── notebooks/\n\
  │   ├── EDA_Brain_MRI_Radiomics.ipynb                           # Exploratory Data Analysis\n│   ├──\
  \ 02_Baseline_Models.ipynb                                # Baseline ML models\n│   └── 03_Feature_Selection_Dimensionality.ipynb\
  \              # Feature selection & PCA\n└── README.md                           # This file\n```\n\
  \n## \U0001F3AF Notebooks Overview\n\n### 1. EDA_Brain_MRI_Radiomics.ipynb\n**Exploratory Data Analysis**\n\
  - Dataset loading (local and Kaggle compatible)\n- Data quality checks (missing values, duplicates)\n\
  - Class distribution analysis\n- Feature distribution visualizations\n- Correlation analysis\n\n###\
  \ 2. 02_Baseline_Models.ipynb\n**Baseline Machine Learning Models**\n- Data preparation and train/test\
  \ split\n- Model training: Logistic Regression, SVM (RBF), Random Forest\n- Model comparison and evaluation\n\
  - Confusion matrix and classification reports\n- Feature importance analysis (Random Forest)\n\n###\
  \ 3. 03_Feature_Selection_Dimensionality.ipynb\n**Feature Selection & Dimensionality Reduction**\n-\
  \ Variance threshold filtering\n- Correlation-based feature pruning\n- Univariate feature selection\
  \ (ANOVA F-test)\n- PCA for dimensionality reduction and visualization\n- Model performance comparison\
  \ with reduced features\n\n## \U0001F4C8 Key Results\n\n- **Dataset Size:** 7,023 samples with 26 radiomics\
  \ features\n- **Classes:** 4 classes (glioma, healthy, meningioma, pituitary)\n- **Baseline Model:**\
  \ Random Forest with ~0.93 accuracy\n- **Features:** Includes intensity statistics, GLCM texture, FFT\
  \ frequency, edge-based, and LBP features\n\n## \U0001F6E0️ Requirements\n\n```bash\npip install numpy\
  \ pandas matplotlib seaborn scikit-learn jupyter\n```\n\n## \U0001F680 Usage\n\n1. **Clone the repository:**\n\
  \   ```bash\n   git clone <repository-url>\n   cd \"Brain MRI Radiomics-Style Numerical Dataset\"\n\
  \   ```\n\n2. **Download the dataset:**\n   - Option 1: Download from [Kaggle](https://www.kaggle.com/datasets/aadigupta1601/brain-mri-radiomics-style-numerical-dataset)\
  \ and place in `dataset/` folder\n   - Option 2: Use the dataset directly in Kaggle Notebooks (path\
  \ will auto-detect)\n\n3. **Run notebooks:**\n   ```bash\n   jupyter notebook notebooks/\n   ```\n\n\
  ## \U0001F4DD License\n\nThis project is for educational and research purposes. Please refer to the\
  \ original dataset licenses:\n- [Brain MRI Radiomics-Style Numerical Dataset](https://www.kaggle.com/datasets/aadigupta1601/brain-mri-radiomics-style-numerical-dataset)\n\
  - [Brain Tumor MRI Dataset](https://www.kaggle.com/datasets/miadul/brain-tumor-mri-dataset)\n\n## \U0001F64F\
  \ Acknowledgments\n\n- **AADI GUPTA** for creating and sharing the radiomics-style numerical dataset\n\
  - **Arif Miah** for the original Brain Tumor MRI Dataset\n- The medical imaging and machine learning\
  \ community\n\n## \U0001F4E7 Contact\n\nFor questions or contributions, please open an issue or pull\
  \ request.\n"

readme_excerpt: "# Preterm Motor Gamma MEG — Analysis Code\n\nThis repository contains the MATLAB code\
  \ used to extract motor-related high-gamma oscillations (70–90 Hz) from MEG time–frequency (TF) data\
  \ for the study of motor system development in preschool children born preterm. TF maps were generated\
  \ in Brainstorm using Morlet wavelets and exported to MATLAB for further analysis.\n\nThe included script\
  \ (`extract_gamma_metrics.m`) loads each subject’s TF `.mat` file, identifies the 0–100 ms post-movement\
  \ window, extracts peak gamma power and frequency from contralateral and ipsilateral M1 sensors\n\n\
  ## Features\n- Works directly on Brainstorm-exported TF structures (`TF`, `Freqs`, `Time`)\n- Automatically\
  \ handles left/right sensor selection\n- Computes:\n  - peak gamma frequency (70–90 Hz)\n  - peak gamma\
  \ power\n\n## Dependencies\n- MATLAB R2023b+ (RRID: SCR_001622)  \n- Brainstorm (RRID: SCR_001761) \
  \ \n- Input: Brainstorm-exported TF `.mat` file per subject\n\n## Usage\n1. load your subject's TF mat\
  \ file\n2. Open MATLAB and add this repo to your path.  \n3. Run:\n   ```matlab\n   extract_gamma_metrics\n"

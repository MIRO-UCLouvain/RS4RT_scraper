readme_excerpt: "# Toxicity Prediction Pipeline: Safety-Critical ML\n**Role:** Lead Developer & Computational\
  \ Scientist  \n**Focus:** Drug Safety, Explainable AI (XAI), & Predictive Modeling\n\n---\n\n### \U0001F3AF\
  \ The Problem\nIn drug discovery, **False Negatives are a liability.** A model that achieves high \"\
  accuracy\" by predicting \"Non-Toxic\" for all compounds is useless—and dangerous. This project is an\
  \ enterprise-grade pipeline designed for **Safety-First** toxicity screening, prioritizing clinical\
  \ reliability and interpretability over naïve metrics.\n\n### \U0001F680 Key Technical Highlights\n\
  * **Safety-First Modeling:** Implemented threshold optimization to minimize False Negatives, ensuring\
  \ high-risk compounds are flagged for expert review.\n* **Explainable AI (XAI):** Integrated **SHAP**\
  \ to map global toxicity drivers. Every prediction comes with a \"why,\" essential for auditing and\
  \ regulatory compliance.\n* **Applicability Domain (AD) Engineering:** Built \"Trust Boundaries\" to\
  \ detect out-of-distribution molecules, automatically rejecting predictions where the model lacks statistical\
  \ confidence.\n* **Robust Data Engineering:** Built a modular pipeline for RDKit-based molecular canonicalization,\
  \ deduplication, and label-conflict resolution.\n\n### \U0001F4C8 Pipeline Architecture\n| Phase | Focus\
  \ | Output |\n| :--- | :--- | :--- |\n| **A-C** | Data Integrity | Canonicalized, conflict-free dataset\
  \ |\n| **D-E** | Feature Engineering | ECFP4 Morgan Fingerprints (2048-bit) |\n| **F-G** | Modeling\
  \ & Thresholding | Safety-weighted Logistic Regression |\n| **I-K** | Audit & Reliability | SHAP interpretability\
  \ & Trust Boundaries |\n\n### \U0001F6E0 Tech Stack\n* **Core:** Python 3.7+\n* **Bio-Informatics:**\
  \ `RDKit`\n* **ML/Data:** `scikit-learn`, `Pandas`, `NumPy`\n* **Explainability:** `SHAP`\n* **Visualization:**\
  \ `Matplotlib`, `Seaborn`\n\n### \U0001F4CA Performance & Insights\n* **Metric Shift:** Moved from \"\
  Naïve Accuracy\" (misleading) to **Precision-Recall optimization** (actionable).\n* **Failure Analysis:**\
  \ Systematic PCA-based investigation of False Negatives to identify chemical sub-spaces requiring further\
  \ in-vitro validation.\n\n---\n\n### \U0001F4EC Contact\n**Harshita Singh**  \n[Email](mailto:harshitasinghms@gmail.com)\
  \ | [LinkedIn](https://linkedin.com/in/harshita-singh-9663a9284) \n\n*Disclaimer: This project is for\
  \ computational research. It does not replace clinical or regulatory-grade validation.*\n\n---\n"

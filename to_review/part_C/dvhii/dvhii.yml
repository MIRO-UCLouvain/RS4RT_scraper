  \ mkdir -p \"$dir\"\ncd \"$dir\" || exit\n\n# Get all deployments\ndeployments=$(kubectl get deployments\
  \ -n united-manufacturing-hub -o name)\n# Get all statefulsets\nstatefulsets=$(kubectl get statefulsets\
  \ -n united-manufacturing-hub -o name)\n# Get all jobs\njobs=$(kubectl get jobs -n united-manufacturing-hub\
  \ -o name)\n\n# Get logs for all deployments\nfor deployment in $deployments; do\n    log=\"${deployment##*/}\"\
  \n    log=\"${log//*united-manufacturing-hub-}\"\n    kubectl logs \"$deployment\" -n united-manufacturing-hub\
  \ --all-containers --prefix > deployment-\"$log\".log || true\ndone\n\n# Get logs for all statefulsets\n\
  for statefulset in $statefulsets; do\n    log=\"${statefulset##*/}\"\n    log=\"${log//*united-manufacturing-hub-}\"\
  \n    kubectl logs \"$statefulset\" -n united-manufacturing-hub --all-containers --prefix > statefulset-\"\
  $log\".log || true\ndone\n\n# Get logs for all jobs\nfor job in $jobs; do\n    log=\"${job##*/}\"\n\
  \    log=\"${log//*united-manufacturing-hub-}\"\n    kubectl logs \"$job\" -n united-manufacturing-hub\
  \ --all-containers --prefix > job-\"$log\".log || true\ndone\n\n# Get all pods and services\nkubectl\
  \ get po,svc -n united-manufacturing-hub > kubectl_pods_and_services.log\n\n# Get all events\nkubectl\
  \ get events -n united-manufacturing-hub > kubectl_events.log\n\n# Describe all pods\nkubectl describe\
  \ po -n united-manufacturing-hub > kubectl_describe_pods.log\n\n# Describe all services\nkubectl describe\
  \ svc -n united-manufacturing-hu > kubectl_describe_services.log\n\n# Helm status\nhelm status united-manufacturing-hub\
  \ -n united-manufacturing-hub > helm_status.log\n\n# cd back to original directory\ncd - || exit\n \n\

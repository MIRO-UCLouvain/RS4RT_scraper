readme_excerpt: "# Toxicity_Prediction_202206894\nThe Toxicity Prediction Challenge II\n\nKaggle:\n\n\
  \ https://www.kaggle.com/code/ganeshvarma6669/x2022gvd-toxicitypredicitoncode\n\nGitHub Link:\n\nhttps://github.com/GaneshRuddarraju/Toxicity_Prediction_202206894\n\
  \nGoogle drive Link:\n\nhttps://drive.google.com/drive/folders/1-75DwIzEJJI19g5zdpreMhm33KXhoaHJ?usp=share_link\n\
  \n\nInstall anaconda and packages:\n•\tDownload Anaconda\n•\tInstall Anaconda on your system\n•\tOpen\
  \ Anaconda Navigator\n•\tOpen Jupyter Notebook from Anaconda Navigator\n•\tOpen Conda Terminal and run\
  \ below commands \n\n1)\tpip install rdkit\n2)\tpip install CatBoost\n3)\tpip install sklearn\n4)\t\
  Version of Anaconda Jupyter Server Information:\nThe version of the notebook server is: 6.4.8\nThe server\
  \ is running on this version of Python: 3.9.12\n\n•\tDataset and Code are available in the below link\
  \ provided\n\n•\tAll the files are attached and also are also uploaded to drive link which is provided\
  \ above. \n\nSteps to run the file:\n\n•\ttrain_II and test_II are the input csv files for the Descriptors.ipynb\
  \ file.\n•\tdesc_test_I.csv and desc_train_I.csv  are generated as an output of the code Descriptors.ipynb.\n\
  •\tTo run the descriptor file open Descriptors.ipynb file and click on cell and click on run all command.(approx.\
  \ time. 3hrs)\n•\tNow, run the Toxicity_draft.ipynb file by keeping desc_test_I.csv and desc_train_I.csv\
  \ files in the same path where we have all the python files available.\n•\tNow, click on cell and click\
  \ on run all command.\n\n \n\n\n\n\n\n![image](https://user-images.githubusercontent.com/130195997/230746504-deebf04b-e144-4602-86f6-2a05fb1326ab.png)\n\
  \ndesc_test_I.csv is of size 139 MB. so, the file has been uploaded to drive link provided.\n"

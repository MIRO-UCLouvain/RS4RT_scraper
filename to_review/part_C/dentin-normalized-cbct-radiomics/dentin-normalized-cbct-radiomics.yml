readme_excerpt: "# Dentin-Normalized CBCT Radiomics for Differential Diagnosis\n\nThis repository contains\
  \ code for dentin-reference intensity normalization, PyRadiomics feature extraction, and machine-learning\
  \ analysis for differential diagnosis of periapical granulomas and radicular cysts from CBCT images.\n\
  \nThe repository is intended for code availability. The original CBCT images, segmentation masks, and\
  \ extracted feature tables are not publicly distributed because they contain protected patient information\
  \ and are subject to institutional data-sharing restrictions.\n\n## Repository structure\n\n```text\n\
  configs/\n  pyradiomics_original_features.yaml\n\ndata/\n  manifest_template.csv\n\nnotebooks/\n  01_dentin_reference_roi_and_normalization.ipynb\n\
  \  02_radiomics_feature_extraction.ipynb\n  03_machine_learning_analysis.ipynb\n\nsrc/\n  dentin_reference_normalization.py\n\
  \  radiomics_extraction.py\n  ml_analysis.py\n  delong.py\n```\n\n## Label convention\n\nThe preprocessing\
  \ code assumes the following segmentation labels:\n\n| Label | Structure |\n|---:|---|\n| 1 | Lesion\
  \ |\n| 2 | Radiopaque material or restoration |\n| 3 | Bone |\n| 4 | Tooth structure |\n\nThe machine-learning\
  \ code uses:\n\n| Class | Diagnosis |\n|---:|---|\n| 0 | Periapical granuloma |\n| 1 | Radicular cyst\
  \ |\n\n## Workflow\n\n1. Prepare a manifest CSV with `case_id`, `image_path`, `label_path`, `reference_cohort`,\
  \ and optionally `diagnosis`.\n2. Run `01_dentin_reference_roi_and_normalization.ipynb` to estimate\
  \ the dentin reference distribution and normalize CBCT images.\n3. Run `02_radiomics_feature_extraction.ipynb`\
  \ for raw and dentin-normalized images.\n4. Run `03_machine_learning_analysis.ipynb` to compare raw\
  \ and dentin-normalized radiomic feature sets.\n\n## Methodological notes\n\n- The dentin reference\
  \ cohort should be fixed before model evaluation and should not be selected using diagnosis labels or\
  \ model outcomes.\n- PyRadiomics images and masks are read with SimpleITK to preserve voxel spacing\
  \ and image metadata.\n- No missing-value imputation is applied. Missing feature values are treated\
  \ as a preprocessing error.\n- Feature screening follows the procedure: Levene's test, followed by Student\
  \ or Welch two-sample t-test, with feature retention at `p < 0.05`.\n- Feature screening, scaling, SMOTE,\
  \ and hyperparameter tuning are performed inside training folds to avoid leakage.\n- PyRadiomics discretization\
  \ is set to `binWidth: 100`, matching the original analysis notebook setting. Change this only if the\
  \ manuscript reports a different bin width.\n"

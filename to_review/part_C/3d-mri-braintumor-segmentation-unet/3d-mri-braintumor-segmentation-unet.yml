readme_excerpt: "# \U0001F9E0 Brain Tumor Segmentation using U-Net (BraTS MRI Dataset)\n\nDeep Learning\
  \ based semantic segmentation of brain tumors from multi-modal MRI scans using a U-Net architecture.\n\
  \n<img width=\"3002\" height=\"1104\" alt=\"image\" src=\"https://github.com/user-attachments/assets/10ff1d02-9607-49e2-bd53-0486e6d92fa4\"\
  \ />\n\n---\n\n## Project Overview\n\nBrain tumor segmentation is one of the most important tasks in\
  \ medical image analysis. Manual delineation of tumors is time-consuming and depends heavily on radiologists.\n\
  \nThis project implements a **U-Net based semantic segmentation model** to automatically identify tumor\
  \ regions from MRI scans using the **BraTS dataset**.\n\nThe model learns pixel-wise classification\
  \ of MRI slices into multiple tumor regions and background.\n\n---\n\n## Features\n\n - MRI preprocessing\n\
  \ - Multi-modal MRI visualization\n - Brain Tumor Segmentation\n - U-Net implementation from scratch\n\
  \ - Dice Loss\n - Mean IoU Metric\n - Data Generator for large datasets\n - Model Training\n - Model\
  \ Evaluation\n - Visualization of predictions\n\n\n---\n\n# Dataset\n\nThe project uses the **BraTS\
  \ (Brain Tumor Segmentation Challenge)** dataset.\n\nMRI Modalities:\n\n- T1\n- T1CE\n- T2\n- FLAIR\n\
  \nSegmentation Labels:\n\n| Label | Region |\n|--------|---------|\n| 0 | Background |\n| 1 | Necrotic\
  \ / Non-enhancing Tumor |\n| 2 | Edema |\n| 4 | Enhancing Tumor |\n\nEach MRI scan is stored in **NIfTI\
  \ (.nii.gz)** format.\n\n---\n\n# Sample MRI Images\n\n<img width=\"1156\" height=\"239\" alt=\"image\"\
  \ src=\"https://github.com/user-attachments/assets/ec0c4861-84da-4cf4-9e3e-093830fdd99d\" />\n\n---\n\
  \n# Tumor Segmentations\n<img width=\"1688\" height=\"2188\" alt=\"image\" src=\"https://github.com/user-attachments/assets/cca95409-b5f5-4faa-9597-2777e096817d\"\
  \ />\n\n---\n# Model Architecture\n\nThis project implements a U-Net architecture consisting of:\n\n\
  Encoder\n\n- Conv Block\n- Max Pooling\n\nBottleneck\n\nDecoder\n\n- UpSampling\n- Skip Connections\n\
  - Convolution Blocks\n\nFinal Layer\n\n- Softmax activation\n- Multi-class segmentation\n\n<img width=\"\
  1555\" height=\"1036\" alt=\"image\" src=\"https://github.com/user-attachments/assets/3ae064ce-0ba3-4a91-b72a-79647aa0da9c\"\
  \ />\n\n---\n\n# Data Pipeline\n\n<img width=\"1376\" height=\"307\" alt=\"image\" src=\"https://github.com/user-attachments/assets/beb33a9f-8ec1-481d-b08d-3389649a14ee\"\
  \ />\n\n\n---\n\n# Evaluation Metrics\n\nThe model is evaluated using:\n\n- Dice Coefficient\n- Mean\
  \ IoU\n- Accuracy\n- Precision\n- Sensitivity (Recall)\n\n---\n\n# Results\n\nThe pretrained model achieved\
  \ approximately:\n\n| Metric | Value |\n|---------|--------|\n| Mean IoU | **81%** |\n| Dice Score |\
  \ **65.5%** |\n| Accuracy | ~81% |\n\n---\n\n# Training Curves\n\n## Accuracy & Loss\n\n<img width=\"\
  942\" height=\"466\" alt=\"image\" src=\"https://github.com/user-attachments/assets/7c2cc215-2085-4c25-9d4e-041a5aa65869\"\
  \ />\n\n---\n\n# Prediction Results\n\n### Example 1\n\n<p align=\"center\">\n<img src=\"images/prediction1.png\"\
  \ width=\"750\">\n</p>\n\n---\n\n### Example 2\n\n<p align=\"center\">\n<img src=\"images/prediction2.png\"\
  \ width=\"750\">\n</p>\n\n---\n\n### Example 3\n\n<p align=\"center\">\n<img src=\"images/prediction5.png\"\
  \ width=\"750\">\n</p>\n\n---\n\n# 3D Visualization\n\n<p align=\"center\">\n<img src=\"images/tenor.gif\"\
  \ width=\"500\">\n</p>\n\n---\n\n# Tech Stack\n\n- Python\n- TensorFlow\n- Keras\n- NumPy\n- OpenCV\n\
  - Matplotlib\n- nibabel\n- scikit-image\n\n---\n\n# Repository Structure\n\n```\nBrain-Tumor-Segmentation-U-Net\n\
  │\n├── README.md\n├── requirements.txt\n├── notebook.ipynb\n├── images/\n```\n\n---\n\n# Future Improvements\n\
  \n- Attention U-Net\n- UNet++\n- DeepLabV3+\n- 3D U-Net\n- MONAI implementation\n- Mixed Precision Training\n\
  - TensorBoard Integration\n\n---\n\n# References\n\n- U-Net: Convolutional Networks for Biomedical Image\
  \ Segmentation\n- BraTS Challenge Dataset\n- TensorFlow\n- Keras\n\n---\n\n# Author\n\n**Rahshana K**\n\
  \nB.Tech Computer Science and Business Systems\n\nInterested in Medical AI • Computer Vision • Deep\
  \ Learning • Generative AI\n"

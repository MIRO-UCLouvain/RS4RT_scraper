readme_excerpt: "# cbct-radiomics-features-robustness\nThis repository contains the full pipeline developed\
  \ for the master’s thesis project “Understanding the Dynamics of Cachexia: Assessing the Robustness\
  \ of Radiomics Features Derived from CBCT Scans of Mice.” The code systematically quantifies how radiomics\
  \ features from cone-beam computed tomography (CBCT) images respond to two clinically relevant perturbations:\
  \ simulated Gaussian noise (mimicking acquisition variability) and morphological mask perturbations\
  \ (simulating segmentation inaccuracies).\n\nThe ultimate goal is to identify robust, reproducible features\
  \ suitable for non-invasive monitoring of body composition changes in preclinical cancer cachexia models.\n\
  Repository Structure:\n\n    adding_morphological_mask_perturbations.py\n    Automates morphological\
  \ operations (erosion, dilation, opening, closing) on segmentation masks of skeletal muscle regions.\
  \ Generates perturbed masks to assess sensitivity to segmentation inaccuracies.\n\n    extract_features_from_perturbed_masks.py\n\
  \    Extracts radiomics features from the CBCT images using PyRadiomics, pairing each image with its\
  \ original and perturbed masks. Outputs a comprehensive feature matrix for ICC analysis.\n\n    calculation_of_ICC.py\n\
  \    Calculates intraclass correlation coefficients (ICCs) separately for:\n\n        Features extracted\
  \ from images with increasing Gaussian noise.\n\n        Features extracted from morphological mask\
  \ perturbations.\n        ICC(2,1) is used to quantify feature reproducibility across perturbations.\n\
  \n    breaking_point_analysis.py\n    Implements a cumulative ICC approach to determine the breaking\
  \ point: the lowest cumulative noise level at which each feature’s ICC drops below 0.8. Outputs a list\
  \ of robust features (those with ICC ≥0.8 up to maximum tested noise level) and a summary of feature\
  \ stability.\n\nMethodology Overview\n\n    Image Perturbation\n\n        Noise: Gaussian noise is progressively\
  \ added to CBCT scans to simulate increasing acquisition variability (σ=10–100 HU).\n\n        Mask\
  \ perturbations: Morphological operations generate alternative segmentation masks, simulating realistic\
  \ inaccuracies during ROI delineation.\n\n    Feature Extraction\n\n        PyRadiomics extracts 1581\
  \ features across first-order statistics, texture matrices (GLCM, GLRLM, GLSZM, etc.), and wavelet/log-sigma\
  \ filters.\n\n        Extraction is repeated for each perturbation scenario.\n\n    Robustness Quantification\n\
  \n        ICC(2,1) is computed across perturbation levels.\n\n        Features maintaining ICC ≥0.8\
  \ are considered robust.\n\n        Breaking points identify noise thresholds beyond which feature reliability\
  \ deteriorates.\n\n    Outputs\n\n        radiomics_features_full_morph_2.csv: Feature matrix for mask\
  \ perturbations.\n\n        path_for_icc_results_full_radiomics.csv: ICC results for noise perturbations.\n\
  \n        path_for_icc_results_icc_results_morph_perturbations.csv: ICC results for mask perturbations.\n\
  \n        path_for_breaking_points_results_0107.csv: Breaking point analysis results.\n\n        path_for_robust_features_list_no_bp_0107.csv:\
  \ Final list of robust features.\n\nDependencies\n\n    Python ≥ 3.7\n\n    PyRadiomics\n\n    SimpleITK\n\
  \n    numpy\n\n    pandas\n\n    pingouin\n\n    scikit-image\n\n\nLicense\n\nThis repository is provided\
  \ for academic and research purposes only. If you use this pipeline in your work, please cite the associated\
  \ master’s thesis and acknowledge the methodology.\n\nAcknowledgements\n\nDeveloped as part of the Master’s\
  \ in Health and Digital Transformation at Maastricht University, in collaboration with Maastro Clinic.\
  \ Supervision by Prof. Frank Verhaegen. The project contributes to advancing robust radiomics biomarkers\
  \ for monitoring disease progression in preclinical models.\n"

readme_excerpt: "# -*- coding: utf-8 -*-\n\n# Developing a multi-task QSAR model for the prediction of\
  \ e-cigarette toxicity\nThis repository contains all raw data and Python code files for the project\
  \ entitled  \n**\"Developing a multi-task QSAR model for the prediction of e-cigarette emissions toxicity\"\
  **\n\n## Respository Structure\nWithin the **`Code`** folder there are 2 Subfolders:\n\n### 1. `Training\
  \ & Evaluation Models`\nThis subfolder contains local scripts (.py) and Google Colab Notebooks (.ipynb)\
  \ for the development of:\n- Single-Task QSAR Models (`Single-Task_QSAR`)\n- Multi-Task Eye & Skin toxicity\
  \ Models (`ESS_Multi-Task_Train`)\n- Multi-Task Carcinogencitiy & Genotoxicity Models (`CancerGenotoxicity_Multi-Task`)\n\
  \   \nPerformance metrics including *accuracy*, *balanced accuracy*, *MCC*,  *precision*, *recall*,\
  \ *F1-Score*, and *ROC-AUC* are reported for comparative analysis for all models. All models also include\
  \ additional analyses for interpretation including Applicability Domain plots, Confusion Matricies,\
  \ and Feature Importances. \n   The dataset used to train and evaluate these models can be found in\
  \ the `Datasets`subfolder.\n\n### 2. `User Predict`\nThis subfolder contains local scripts (.py) and\
  \ Google Colab Notebooks (.ipynb) designed for making prediction on new compounds using the pre-trained\
  \ models from the `Training & Evaluation Models` folder.\nThe scripts/notebooks allows users to input\
  \ new SMILES and obtain task-specific toxicity predictions and confidence for:\n- Multi-Task Eye & Skin\
  \ toxicity Models (`ESS_Model_Predict`)\n- Multi-Task Carcinogencitiy & Genotoxicity Models (`CarGen_Model_Predict`)\n\
  \    \nThe pre-trained model files (.pth) and, if applicable, descriptor scaler files (.pkl) can be\
  \ found in the **`Trained Model & Hyperparameters`** folder.\n\n## Contributors\n\n- **Author:** Alexa\
  \ Canchola, University of California, Riverside\n- **Author:** Kunpeng Chen, University of California,\
  \ Riverside\n- **Advisor:** Wei-Chun Chou, University of California, Riverside  \n\n\n*The manuscript\
  \ describing the files in this repository is currently under review.*\n"

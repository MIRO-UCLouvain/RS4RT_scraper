readme_excerpt: "# Comment Toxicity Detection\n\nDeep Learning-based multi-label toxicity detection system\
  \ for online comments.  \nThis project uses an **LSTM model** to detect various forms of toxic comments\
  \ and provides a **Streamlit app** for real-time and bulk predictions.\n\n---\n\n## Project Overview\n\
  \nOnline communities and social media platforms have become integral parts of modern communication.\
  \ However, the prevalence of toxic comments, which include harassment, hate speech, and offensive language,\
  \ poses significant challenges to maintaining healthy discussions.  \n\nThis project aims to **build\
  \ a deep learning-based comment toxicity detection system** using Python. The model predicts the likelihood\
  \ of a comment being toxic across multiple categories:  \n\n- `toxic`  \n- `severe_toxic`  \n- `obscene`\
  \  \n- `threat`  \n- `insult`  \n- `identity_hate`  \n\nBy identifying toxic comments automatically,\
  \ the system assists platform moderators in filtering, warning users, or initiating further review processes.\n\
  \n---\n\n## Project Type\n\n- **Type**: EDA + Multi-label Classification  \n\n---\n\n## Features\n\n\
  - Text preprocessing (cleaning, tokenization, stopword removal)  \n- Multi-label classification using\
  \ **LSTM model**  \n- Model evaluation: Accuracy, Loss, Confusion Matrix, Classification Report  \n\
  - Real-time prediction using **Streamlit app**  \n- Bulk predictions from CSV files  \n- Pre-trained\
  \ model (`best_model.keras`) included via Git LFS  \n\n---\n\n## Project Files\n\n| File/Folder | Description\
  \ |\n|-------------|-------------|\n| `best_model.keras` | Trained LSTM model for toxicity detection\
  \ (**requires Git LFS**) |\n| `tokenizer.pkl` | Tokenizer used for text preprocessing |\n| `app.py`\
  \ | Streamlit application for real-time and bulk prediction |\n| `Comment_Toxicity.ipynb` | Jupyter\
  \ notebook with EDA, model training, evaluation, and markdown |\n| `data/` | Example CSV files for training/test\
  \ (optional) |\n| `README.md` | Project overview and instructions |\n\n---\n\n## Getting Started\n\n\
  ### Prerequisites\n\n- Python 3.8+  \n- Install dependencies:  \n```bash\npip install -r requirements.txt\n\
  ````\n\n* **Git LFS** (to download the model file):\n\n```bash\ngit lfs install\ngit lfs track \"*.keras\"\
  \n```\n\n### Clone the Repository\n\n```bash\ngit clone https://github.com/Vignesha-S/Comment-Toxicity-Detection.git\n\
  cd Comment-Toxicity-Detection\ngit lfs pull\n```\n\n---\n\n## Running the Streamlit App\n\n```bash\n\
  streamlit run app.py\n```\n\n* **Real-time prediction:** Enter a comment in the text area and click\
  \ **Predict**\n* **Bulk prediction:** Upload a CSV file with a `comment_text` column\n\n---\n\n## Usage\
  \ Notes\n\n* The model is trained for multi-label classification. Each comment can belong to multiple\
  \ categories simultaneously.\n* Predictions range from 0 to 1 for each label, representing the probability\
  \ of that label.\n* Ensure Git LFS is installed to download large files (`best_model.keras`)\n\n---\n\
  \n## Project Summary\n\nThis project demonstrates the complete workflow for building a deep learning\
  \ solution for toxicity detection, from **data preprocessing** and **EDA**, to **model training**, **evaluation**,\
  \ and **deployment** using Streamlit. Users can enter text or upload CSV files to get predictions in\
  \ real-time.\n\nThe model helps online platforms identify and manage toxic comments, promoting healthier\
  \ and safer online communities.\n\n---\n\n\n**Note:**  \n- The `best_model.keras` file is stored using\
  \ **Git LFS**. Make sure to install Git LFS before cloning the repository.  \n- The training and test\
  \ CSV files are large and may exceed GitHub’s standard file size limits. You can either download them\
  \ via Git LFS or use smaller sample datasets for testing the Streamlit app.\n"

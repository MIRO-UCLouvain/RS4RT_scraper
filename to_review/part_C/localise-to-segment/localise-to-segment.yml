readme_excerpt: "# Localise to segment: An investigation into the accuracy improvements provided by localisation\
  \ steps for semantic segmentation.\n\nPreprint now available: https://arxiv.org/abs/2304.04606v1 \n\n\
  Install dependencies.\n\n    pip install -r requirements.txt\n\nInstalling textfig is more manual as\
  \ no pip package is available.\n\n    bash install_texfig.sh\n\nThe plots (optional) also require latex\
  \ to be installed. \n\n    sudo apt-get install texlive-xetex   \n\n\nDownload the datasets from the\
  \ Medical Segmentation Decathlon:\n\n    bash download_datasets.sh\n    \nTo prepare the other datasets\
  \ (cropped and resized versions with 50 random samples).\n\n    bach data_prep.sh \n\n\nTo train the\
  \ networks (Will likely take a couple of days depending on hardware)\n    \n    bash run_train.sh  \
  \  \n    \n\nTo compute results as csv and run t-test\n\n    bash results.py\n\n\nTo make plots\n\n\
  \    python make_plot_and_tables.py\n\n"

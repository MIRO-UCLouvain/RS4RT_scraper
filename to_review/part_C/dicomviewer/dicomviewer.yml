readme_excerpt: "# DICOM Viewer\n\n## Overview\n\n**DICOM Viewer** is a robust, interactive application\
  \ for visualizing DICOM images, RTSTRUCTS, and RTDOSE data. Designed mainly for researchers, this tool\
  \ offers an intuitive interface for exploring medical scans, contours, and dose distributions. It integrates\
  \ PySide6 for the graphical interface and VTK for image rendering.\n\n<img src=\"screenshots/main_screen.PNG\"\
  \ alt=\"Main Screen\" width=\"600\"/>\n\n*Main interface showing DICOM images*\n\n## Features\n\n- **DICOM\
  \ Image Viewer**: Supports viewing of CT, MRI, PET, and RTDOSE images.\n- **RTSTRUCT Overlay**: Visualize\
  \ radiotherapy contours overlaid on the medical images.\n- **RTDOSE Overlay**: Display dose distributions\
  \ with customizable color mappings.\n- **Customizable Window/Level**: Fine-tune the window and level\
  \ values for better image contrast and clarity.\n- **Slice Scrolling**: Easily scroll through different\
  \ slices of a 3D DICOM dataset using mouse interactions.\n- **Dose Thresholding**: Adjust dose thresholds\
  \ and visualize different ranges of dose data.\n- **Tabbed Interface**: Multiple DICOM series can be\
  \ opened in separate tabs for comparison and review.\n- **Dark Theme Support**: Optimized for dark theme\
  \ UI, ensuring good contrast and readability.\n\n## Installation\n\n1. Clone the repository:\n\n   \
  \ ```bash\n    git clone https://gitlab.com/YAAF/dicomviewer.git\n    cd dicomviewer\n    ```\n\n2.\
  \ Install the package:\n\n    ```bash\n    pip install .\n    ```\n\n3. Run the application:\n\n   \
  \ ```bash\n    dicom-viewer\n    ```\n\n## Usage\n\n### Opening DICOM Files\n\n\n<img src=\"screenshots/file_open_dialog.PNG\"\
  \ alt=\"File Open Dialog\" width=\"400\"/>\n\n*Opening DICOM files*\n\n<img src=\"screenshots/load_dicoms.PNG\"\
  \ alt=\"Load DICOMs\" width=\"600\"/>\n\n*Loading DICOM files from a directory*\n\n- **DICOM Imagee**:\
  \ Open a DICOM series through the interface to visualize medical images in various modalities (CT, MR,\
  \ PET).\n- **RTSTRUCT**: Load and visualize contours on top of the images by selecting the structure\
  \ names from the sidebar.\n- **RTDOSE**: Display dose heatmaps, with a detailed color legend showing\
  \ dose intensity.\n- Adjust the window and level for contrast control using the left-click drag interaction.\n\
  - Use the dose threshold slider to filter dose overlays and focus on specific ranges of interest.\n\n\
  \n### Showing DICOM Information\nThe application also alows for viewing the DICOM metadata associated\
  \ with any DICOM file. From the `Load DICOMs` tab simply select the DICOM object you want to see the\
  \ metadata for and click on the `Show Info` button. \n\n<img src=\"screenshots/dicom_info.PNG\" alt=\"\
  DICOM Info\" width=\"600\"/>\n\n*Show the DICOM metadata*\n\n## Technical Details\n\nThis project leverages\
  \ the following technologies:\n- **PySide6**: For building the graphical user interface.\n- **VTK**:\
  \ For rendering and interacting with medical images and dose overlays.\n- **pydicom**: To handle the\
  \ reading and interpretation of DICOM files.\n- **SimpleITK**: For accurate processing of images, contours\
  \ and dose data\n\n\n## Contribution\n\nContributions are welcome! If you encounter bugs or have feature\
  \ requests, feel free to open an issue or submit a pull request.\n\n## License\n\nThis project is licensed\
  \ under the LGPL 3.0 License. See the [LICENSE](LICENSE) file for details.\n\n## Contacts\nIf you have\
  \ any questions or suggestions, please contact me at YasinAAbdulkadir@gmail.com"

readme_excerpt: "<div align=\"center\">\n\n# \U0001F9B7 AmbientCT\n\n**Your practice PACS in a box — zero\
  \ license fees, zero cloud dependency, one command.**\n\n[![Docker](https://img.shields.io/badge/Docker-ready-2496ED?logo=docker&logoColor=white)](https://github.com/Ambientwork/AmbientCT)\n\
  [![License: MIT](https://img.shields.io/badge/License-MIT-green.svg)](LICENSE)\n[![GitHub Stars](https://img.shields.io/github/stars/Ambientwork/AmbientCT?style=social)](https://github.com/Ambientwork/AmbientCT/stargazers)\n\
  \nA free, open-source DICOM viewer for dental and medical practices.\nView CBCT, CT, MRI, OPG and all\
  \ DICOM formats in your browser —\nwith 3D volume rendering, MPR, and measurement tools.\n\n</div>\n\
  \n> A dentist built a full PACS server with zero programming background — using AI coding tools.\n>\
  \ One Docker command. Zero license fees. Patient data stays on your hardware.\n\n---\n\n## Interface\n\
  \n<div align=\"center\">\n<img src=\"docs/assets/hero.svg\" width=\"700\" alt=\"AmbientCT DICOM Viewer\
  \ — patient list, CBCT axial view, dental presets\" />\n</div>\n\n---\n\n## Quick Start\n\n```bash\n\
  git clone https://github.com/Ambientwork/AmbientCT.git && cd AmbientCT\ncp .env.example .env       \
  \   # Edit credentials before going live\ndocker compose up -d\n```\n\nOpen **http://localhost:3000**\
  \ — your PACS is running.\n\n---\n\n## Features\n\n- \U0001F3E5 **Full PACS Server** — Orthanc with\
  \ DICOMweb, C-STORE, and WADO support\n- \U0001F9E0 **3D Volume Rendering** — Axial, sagittal, and coronal\
  \ MPR via Cornerstone3D\n- \U0001F9B7 **Dental Presets** — Optimized Window/Level for bone, implants,\
  \ soft tissue, and mandibular canal\n- \U0001F4E6 **One Command Deploy** — Docker Compose, runs on Mac,\
  \ Linux, and Windows\n- \U0001F512 **Privacy First** — Fully on-premise, no cloud, no tracking, DSGVO-ready\n\
  - \U0001F4C2 **Any DICOM Source** — Drag & drop files or receive from any DICOM device via DIMSE\n-\
  \ \U0001F6E0️ **Zero Config** — Sane defaults out of the box, `.env` for overrides\n- \U0001F193 **Free\
  \ Forever** — MIT license, no vendor lock-in\n\n---\n\n## Architecture\n\n```\nBrowser → Nginx :443\
  \ → OHIF Viewer :3000   (React + WebGL)\n                     → Orthanc :8042        (DICOMweb REST\
  \ API)\n                     → Orthanc :4242        (DICOM DIMSE, LAN only)\n\nStorage: Orthanc → SQLite\
  \ + filesystem (./data/orthanc-db/)\n```\n\n| Component | Version | Role |\n|-----------|---------|------|\n\
  | [Orthanc](https://www.orthanc-server.com/) | 24.12.2 | PACS server, DICOMweb, DIMSE |\n| [OHIF Viewer](https://ohif.org/)\
  \ | v3.9.2 | Web imaging frontend |\n| [Cornerstone3D](https://www.cornerstonejs.org/) | latest | 3D\
  \ rendering engine |\n| Nginx | latest | Reverse proxy |\n\n---\n\n## Documentation\n\n- [Setup Guide](docs/SETUP-GUIDE.md)\n\
  - [Architecture Decisions](docs/ARCHITECTURE.md)\n- [Troubleshooting](docs/TROUBLESHOOTING.md)\n\n---\n\
  \n## Disclaimer\n\nAmbientCT is **not FDA- or CE-certified**. It is intended for informational and workflow\
  \ purposes only. Clinical diagnostic decisions must be made by licensed healthcare professionals using\
  \ certified software.\n\n---\n\n## Story\n\nBuilt by a dentist using AI-powered development tools (Claude\
  \ Code + Conductor) as a showcase for what non-programmers can build with modern AI tooling. [Read the\
  \ full story →](#)\n\n---\n\n<div align=\"center\">\n\n**By [Ambientwork](https://ambientwork.ai)**\
  \ — the better OS for dental practices.\n\nMIT License · Made with \U0001F916 and ☕\n\n</div>\n"

readme_excerpt: "\n  Longitudinal IVIM-based Treatment Monitoring during MR-Linac Liver SBRT\n=\n\n<img\
  \ width=\"5512\" height=\"2244\" alt=\"示意图\" src=\"https://github.com/user-attachments/assets/a4057611-5203-4830-8866-f3f739bc23bb\"\
  \ />\n\nOverview\n--------\nThis project implements a temporally stratified treatment monitoring framework\n\
  using longitudinal intravoxel incoherent motion (IVIM) parameters (ADC, D, D*,\nf) acquired during MR-Linac-based\
  \ liver SBRT. The framework evaluates two\ncomplementary monitoring dimensions: fraction-based (time)\
  \ and cumulative\nEQD₂-based (accumulated biological dose).\n\n\nScripts\n-------\n1. Image QA.py\n\
  \   Quality assurance of DWI images. Computes SNR in normal liver parenchyma\n   (excluding tumor) across\
  \ b-values (0, 30, 50, 100, 150, 300, 400, 500 s/mm²)\n   using QIBA thresholds (SNR ≥ 7 for b ≤ 10,\
  \ SNR ≥ 3 for b > 10).\n   Output: qa_pass.csv (fraction-level pass/fail records).\n\n2. FDR.py\n  \
  \ Statistical analysis with FDR correction. Performs:\n   - Between-group comparisons (Mann-Whitney\
  \ U) at each fraction and dose bin\n   - Within-group comparisons (Wilcoxon signed-rank) vs baseline\
  \ (fraction 1 /\n     bin 0)\n   Output: console-logged p-values and significance levels.\n\n3. Fraction\
  \ Band.py\n   Visualization of fraction-based monitoring. Generates a 4-row × 2-column\n   figure showing\
  \ 25th–75th percentile bands and filled monitoring bands with\n   split lines, overlaid with individual\
  \ patient trajectories.\n   Output: fraction-based monitoring figure.\n\n4. Dose Band.py\n   Visualization\
  \ of cumulative EQD₂-based monitoring. Same layout as Fraction\n   Band.py but grouped by 7 Gy EQD₂\
  \ bins.\n   Output: cumulative EQD₂-based monitoring figure.\n\n5. LOOCV+Delong.py\n   Core analysis\
  \ pipeline. Performs:\n   - Leave-one-out cross-validation (LOOCV) for fraction-based and dose-based\n\
  \     temporally stratified monitors\n   - Pooled (static) monitor as comparator\n   - DeLong test comparing\
  \ stratified vs static monitors\n   - AUC plot generation\n   Outputs: results_fraction.csv, results_dose_bin.csv,\
  \ delong_comparison.csv,\n            AUC figure.\n\n```\nbase_path/\n│\n├── patient folder (name=N1=N2)\n\
  │   │\n│   ├── fraction folder (name=N3)\n│   │   │\n│   │   ├── parameter_map/\n│   │   │   ├── ADC.nii.gz\n\
  │   │   │   ├── Dslow.nii.gz\n│   │   │   ├── Dfast.nii.gz\n│   │   │   └── Ffast.nii.gz\n│   │   │\n\
  │   │   ├── RTst_registration/\n│   │   │   └── Tumor.nii.gz\n│   │   │\n│   │   ├── RT/\n│   │   │\
  \   └── Dose.nii.gz\n│   │   │\n│   │   └── DWI_registration/\n│   │       ├── 0.nii.gz   (b = 0 s/mm²)\n\
  │   │       ├── 1.nii.gz   (b = 30)\n│   │       ├── 2.nii.gz   (b = 50)\n│   │       ├── 3.nii.gz \
  \  (b = 100)\n│   │       ├── 4.nii.gz   (b = 150)\n│   │       ├── 5.nii.gz   (b = 300)\n│   │    \
  \   ├── 6.nii.gz   (b = 400)\n│   │       └── 7.nii.gz   (b = 500)\n│   │\n│   ├── fraction folder (name=2)\n\
  │   │   └── ...\n│   │\n│   └── fraction folder (name=3)\n│       └── ...\n│\n└── patient folder (name=...)\n\
  \    └── ...\n```\n\nNaming conventions:\n- Patient folder: `name=N1=N2` where N1 = class label, N2\
  \ = total fractions\n- Fraction folder: `name=N` where N = fraction number (starting from 1)\n\n\nKey\
  \ Parameters\n--------------\n- α/β = 10 Gy (uniform across all tumor types)\n- EQD₂ formula: EQD₂ =\
  \ d × (α/β + d) / (α/β + 2)\n- Per-fraction dose: D10 (90th percentile within GTV)\n- Cumulative EQD₂\
  \ bins: [0, 7, 14, 21, 28, 35, 42, 49, 56, 63, 70] Gy\n- QA: SNR thresholds, liver parenchyma with 3-voxel\
  \ erosion\n- LOOCV: minimum 3 samples per group per bin/fraction\n- FDR correction: Benjamini-Hochberg,\
  \ α = 0.05\n\n\nOutput Files\n------------\nqa_pass.csv              - QA results (patient, fraction,\
  \ pass/fail)\nresults_fraction.csv     - AUC/Accuracy/Sensitivity/Specificity by fraction\nresults_dose_bin.csv\
  \     - Same metrics by cumulative EQD₂ bin\ndelong_comparison.csv    - DeLong test: stratified vs static\
  \ AUC with p-values\n\n\nDependencies\n------------\nPython 3.12.7, NumPy 1.26.4, SimpleITK 2.4.1, Pandas\
  \ 2.2.2, Matplotlib 3.9.2, Seaborn 0.13.2, SciPy 1.13.1, Statsmodels 0.14.2\n"

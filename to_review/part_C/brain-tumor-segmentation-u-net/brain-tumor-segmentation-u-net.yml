readme_excerpt: '# Brain Tumor Segmentation using U-Net


  ## Overview


  This project implements a complete U-Net architecture from scratch using PyTorch for brain tumor segmentation
  from MRI images. The network was manually designed and implemented without using any pre-built or pre-trained
  segmentation models.


  The model learns to perform pixel-wise segmentation in order to identify tumor regions accurately from
  grayscale MRI scans.


  ## Features


  * Custom U-Net architecture implemented from scratch.

  * Encoder-decoder design with skip connections.

  * Double convolution blocks with Batch Normalization and ReLU activation.

  * Transposed convolution upsampling in the decoder.

  * Bottleneck dropout for regularization.

  * Dice + Binary Cross Entropy combined loss.

  * Training pipeline implemented manually in PyTorch.

  * Supports grayscale MRI images and binary segmentation.


  ## Technologies Used


  * Python

  * PyTorch

  * NumPy

  * OpenCV

  * Matplotlib

  * Google Colab


  ## Model Architecture


  The model consists of:


  * 4 encoder stages

  * Bottleneck layer

  * 4 decoder stages

  * Skip connections between encoder and decoder

  * 1×1 convolution output head


  The architecture was implemented manually using:


  * Conv2d

  * BatchNorm2d

  * ReLU

  * MaxPool2d

  * ConvTranspose2d

  * Dropout2d


  No pre-trained U-Net implementation or segmentation framework was used.


  ## Loss Function


  A custom Dice + BCE loss was implemented to improve segmentation performance on medical images.



  ## Installation


  ```bash

  git clone https://github.com/nooorahmed873-cloud/Brain-tumor-segmentation-U-Net.git

  ```


  ```bash

  cd Brain-tumor-segmentation-U-Net

  ```


  ```bash

  pip install -r requirements.txt

  ```


  ## Usage


  1. Load the MRI dataset.

  2. Preprocess images and masks.

  3. Train the U-Net model.

  4. Evaluate segmentation performance.

  5. Predict tumor masks for unseen MRI images.



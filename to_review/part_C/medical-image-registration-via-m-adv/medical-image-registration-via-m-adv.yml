readme_excerpt: "# Deformable-Medical-Image-Registration-via-Multiveiw-Adversarial-Learning\n\nImplement\
  \ of \"Deformable-Medical-Image-Registration-via-Multiveiw-Adversarial-Learning\"\n\n## Registration\
  \ Network Architecture\n<img src = \"https://github.com/user-attachments/assets/2255c190-9c5b-4771-b50c-23319cfeabf4\"\
  \ width=\"100%\" height=\"100%\">\n\n## Multiview Adversarial Learning\n<img src = \"https://github.com/user-attachments/assets/8d8e379c-22a0-402b-877a-9a1415fbb710\"\
  \ width=\"100%\" height=\"100%\">\n\n## Prerequisites\n- [python==3.8.8](https://www.python.org/)  <br/>\n\
  - [pytorch==1.8.1](https://pytorch.org/get-started/locally/)\n\n## Installation\nThe required packages\
  \ are located in ```requirements```.\n\n    pip install pytorch==1.8.1 torchvision==0.9.1 torchaudio==0.8.1\
  \ cudatoolkit=10.2 -c pytorch\n    pip install -r requirement.txt\n\n## Dataset\n### Abdominal CT\n\
  BTCV Datasets Link : https://www.synapse.org/Synapse:syn3193805/wiki/217789 <br/>\nAbdominal 1K Datasets\
  \ Link : https://github.com/JunMa11/AbdomenCT-1K <br/>\n\nOrgans consist of Spleen, Kidney, Gallbladder,\
  \ Esophagus, Liver, Stomach, Aorta, Inferior Vena Cava, Pancreas, Right and Left Adrenal Gland.\n\n\
  ### Brain MRI\nLPBA40 Link: https://www.loni.usc.edu/research/atlas_downloads <br/>\n\nBrain MRI contains\
  \ 40 T1-weighted MR images annotated with 56 subcortical ROIs. We combine the 56 labels into 7 region\
  \ labels (i.e., Frontal Lobe, Parietal Lobe, Occipital Lobe, Temporal Lobe, Cingulate Lobe, Putamen,\
  \ and Hippocampus) defined according to the main clinical structures of the brain.\n\n## Training\n\
  - Before training, pre-processing and initial affine registration must be performed.\n  - For pre-processing,\
  \ reference ```preprocessing_BTCV_1K.py```, ```preprocessing_lpba40.py```.\n  - For initial affine registration,\
  \ reference ```Train_Affine.py```. <br/>\n```python\npython Train_M_Adv.py \\\n    --affine_model experiments/affine\
  \ \\\n    --dataset_dir Dataset/BTCV_Abdominal_1k \\\n    --save_validation_img True \\\n    --max_epoch\
  \ 100 \\\n```\n## Inference\n```python\npython Inference_M_Adv.py --affine_model experiments/affine\
  \ --dataset_dir Dataset/BTCV_Abdominal_1k\n```\n\n## Main results\n### Abdominal CT\n<img src = \"https://github.com/user-attachments/assets/fd745f12-f4ab-4b31-b2e8-796cfd2dc2a7\"\
  \ width=\"100%\" height=\"100%\">\n\n- **3D Visualization** <br/>\n<img src = \"https://github.com/user-attachments/assets/6daa787b-fc89-4c85-8d26-8821bb0e79d2\"\
  \ width=\"100%\" height=\"100%\">\n\n- **2D Visualization** <br/>\n<img src = \"https://github.com/user-attachments/assets/c8ffb64a-9f13-4127-8a17-d31246958926\"\
  \ width=\"100%\" height=\"100%\">\n\n\n### Brain MRI\n<img src = \"https://github.com/user-attachments/assets/f2bb6c3e-c5f1-497e-baa5-91d39026ddf4\"\
  \ width=\"100%\" height=\"100%\">\n\n- **2D Visualization** <br/>\n<img src = \"https://github.com/user-attachments/assets/41f1e238-7695-4463-87e9-adc001378e81\"\
  \ width=\"100%\" height=\"100%\">\n\n<!-- <img src = \"https://github.com/user-attachments/assets/69ac1182-0bed-4e4a-afd4-4a62f55584d5\"\
  \ width=\"40%\" height=\"40%\"> -->\n\n## Ablation Studied\n<img src = \"https://github.com/user-attachments/assets/9c9c7d42-150a-4547-8b86-e8c5885fd640\"\
  \ width=\"100%\" height=\"100%\">\n\n## Reference Codes\n- [https://github.com/junyuchen245/TransMorph_Transformer_for_Medical_Image_Registration](https://github.com/junyuchen245/TransMorph_Transformer_for_Medical_Image_Registration)\n\
  - [https://github.com/voxelmorph/voxelmorph](https://github.com/voxelmorph/voxelmorph)\n- [https://github.com/zju3dv/LoFTR](https://github.com/zju3dv/LoFTR)\n\
  - [https://github.com/microsoft/CvT](https://github.com/microsoft/CvT)\n"

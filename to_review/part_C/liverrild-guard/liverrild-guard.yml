readme_excerpt: "# LiverRILD-Guard\n\n**Author:** dr. Muhammad Sobri Maulana\n\nLiverRILD-Guard adalah\
  \ aplikasi prototipe **React + Python (Flask)** untuk memprediksi risiko\n**Radiation-Induced Liver\
  \ Disease (RILD)** pada pasien SBRT hati (HCC/metastasis) dengan variasi\nfungsi hati (Child-Pugh/ALBI).\
  \ Model menggabungkan parameter fungsi hati, laboratorium, serta\nheterogenitas distribusi dosis untuk\
  \ menghasilkan:\n\n- Probabilitas kejadian RILD\n- Probabilitas dekompensasi hati\n- Estimasi overall\
  \ survival (OS) 1 tahun\n- Rekomendasi mitigasi (modifikasi rencana terapi/seleksi pasien)\n\n## Struktur\
  \ Proyek\n\n- `app.py` → API backend Flask\n- `frontend/` → aplikasi React (Vite)\n- `requirements.txt`\
  \ → dependensi backend\n\n## Menjalankan Backend (Python)\n\n```bash\npython -m venv .venv\nsource .venv/bin/activate\n\
  pip install -r requirements.txt\npython app.py\n```\n\nBackend berjalan di `http://localhost:8000`.\n\
  \n## Menjalankan Frontend (React)\n\n```bash\ncd frontend\nnpm install\nnpm run dev\n```\n\nFrontend\
  \ berjalan di `http://localhost:5173`.\n\n## Endpoint API\n\n### `GET /api/health`\nCek status layanan.\n\
  \n### `POST /api/predict`\nContoh payload:\n\n```json\n{\n  \"child_pugh\": \"A\",\n  \"albi_score\"\
  : -2.1,\n  \"bilirubin_mg_dl\": 1.2,\n  \"albumin_g_dl\": 3.8,\n  \"ast_u_l\": 54,\n  \"alt_u_l\": 49,\n\
  \  \"mean_liver_dose_gy\": 15,\n  \"d700cc_gy\": 11,\n  \"dose_heterogeneity_index\": 1.2,\n  \"ptv_volume_cc\"\
  : 340\n}\n```\n\n## Catatan\n\nModel pada repository ini adalah **decision-support prototype** untuk\
  \ riset/eksplorasi awal,\nbukan pengganti keputusan klinis final.\n"

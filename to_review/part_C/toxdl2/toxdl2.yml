readme_excerpt: "# ToxDL 2.0: Protein toxicity prediction based on pretrained language model with graph\
  \ neural networks\n<br>\nAssessing the potential toxicity of proteins is crucial for therapeutic proteins,\
  \ facilitating accurate protein toxicity prediction for both therapeutic and agricultural applications.\
  \ Traditional experimental methods for toxicity evaluation are time-consuming, expensive, and labor-intensive,\
  \ highlighting the requirement for efficient computational approaches. Recent advancements in language\
  \ models and deep learning have significantly improved protein toxicity prediction, yet current models\
  \ often lack the ability to integrate spatial and structural information, which is crucial for accurate\
  \ toxicity assessment.\n<br>\n<br>\nIn this study, we present ToxDL 2.0, a novel multimodal deep learning\
  \ model for protein toxicity prediction that integrates both evolutionary and structural information\
  \ derived from the pretrained language model and AlphaFold2. ToxDL 2.0 consists of three key modules:\
  \ (1) a Graph Convolutional Network (GCN) module for generating protein graph embeddings based on AlphaFold2-predicted\
  \ structures, (2) a domain embedding module for capturing protein domain representations, and (3) a\
  \ dense module that combines these embeddings to predict toxicity. We constructed a comprehensive toxicity\
  \ benchmark dataset, and experiment results on both the test and independent test sets demonstrate that\
  \ ToxDL 2.0 outperforms existing state-of-the-art methods. \n\n# Dependency:\npython              \t\
  3.9 <br>\ntorch\t\t\t\t\t1.13.1 <br>\ntorch_geometric\t\t\t2.5.3 <br>\nfair-esm\t\t\t\t2.0.0 <br>\n\
  graphein\t\t\t\t1.7.6 <br>\nnetworkx\t\t\t\t3.2.1 <br>\ngensim              \t4.3.2 <br>\nbiopython\t\
  \t\t\t1.82 <br>\nbiotite\t\t\t\t\t0.40.0 <br>\nlogomaker           \t0.8 <br>\nscikit-learn        \
  \ \t1.0.2 <br>\nscipy               \t1.10.1 <br>\nnumpy               \t1.26.4 <br>\npandas       \
  \       \t1.5.3 <br>\nmatplotlib          \t3.8.4 <br>\njoblib              \t1.4.2 <br>\n\n# OS Requirements\n\
  This package is supported for *Linux* operating systems. The package has been tested on the following\
  \ systems:\n<br>\nLinux: Ubuntu 20.04 \n\n# Files\nThe project contains the following files and directories:\n\
  <br>\n```checkpoints/```: Directory to store the checkpoints of ToxDL 2.0 trained model and skip-gram\
  \ trained model.\n<br>\n```data/```: Directory for storing datasets.\n<br>\n```parameters/```: Directory\
  \ for storing hyperparamters.\n<br>\n```predictions/```: Directory for storing prediction results.\n\
  <br>\n```src/dataset.py```: Dataset loading and preprocessing.\n<br>\n```src/train_ToxDL2.py```: Training\
  \ pipeline.\n<br>\n```src/predict_ToxDL2.py```: Script for making toxicity predictions on new data.\n\
  <br>\n```src/model.py```: Implementation of network architecture of ToxDL 2.0.\n<br>\n```src/utils.py```:\
  \ General utility functions.\n<br> \n\n# Demo\n## Run ToxDL 2.0 for training\nPlease execute the the\
  \ below command to run ToxDL 2.0 model with default hyperparamters:\n<br>\n```python train_ToxDL2.py```\n\
  <br>\nThe above command will output performance metrics in F1-score, MCC, auROC and auPRC.\n<br>\nYou\
  \ can also specity the hyperparamters by modifying the file \"parameters/test_000.py\"\n<br>\nThe trained\
  \ model is saved at the directory \"checkpoints/\".\n<br>\nThe output file is saved at the directory\
  \ \"predictions/\".\n<br>\n## Run ToxDL 2.0 for prediction\nPlease execute the following command directly\
  \ if you can provide the PDB file.\n<br>\n```python predict_ToxDL2.py```\n<br>\nIf you do not have a\
  \ PDB file, you can use AlphaFold2 to predict the protein structure.\n\n# Web service\nYou can also\
  \ predict toxicity score for new proteins using the online web service at http://www.csbio.sjtu.edu.cn/bioinf/ToxDL2/. "

readme_excerpt: "# \U0001F3C6 DVHS Alumni Rankings - Who's More Cracked?\n\nA fun web app that lets users\
  \ compare and rank alumni from Diamond Bar High School based on their careers using an ELO-style ranking\
  \ system.\n\n## \U0001F680 Features\n\n### \U0001F50D **Search Alumni**\n- Search by name, company,\
  \ role, college, degree, or location\n- Real-time search results with auto-generated bios\n- Clean,\
  \ card-based result display\n\n### \U0001F5F3️ **Vote & Compare**\n- Side-by-side comparison of two\
  \ random alumni\n- Names are blurred until you make a choice\n- ELO rating system updates scores based\
  \ on your votes\n- Winner gets +15 points, loser gets -15 points\n\n### \U0001F4CA **Leaderboard**\n\
  - Ranked list of all alumni by ELO score\n- Search functionality to find specific alumni\n- Real-time\
  \ updates after each vote\n\n## \U0001F3AF How It Works\n\n1. **Start on Home Page**: Search for alumni\
  \ or click \"Vote\" to start comparing\n2. **Vote Page**: Two random alumni are shown side-by-side with\
  \ blurred names\n3. **Make Your Choice**: Click on the profile you think is \"more cracked\"\n4. **See\
  \ Results**: Names are revealed and ELO scores are updated\n5. **Continue Voting**: Click \"Next Pair\"\
  \ to compare more alumni\n6. **Check Rankings**: Visit the leaderboard to see current standings\n\n\
  ## \U0001F4BE Data Persistence\n\n- **Backend Version**: ELO scores are saved server-side and shared\
  \ across all users\n- **Real-time Updates**: All users see the same rankings and scores\n- **Persistent\
  \ Storage**: Data is saved to `alumni-data.json` file\n- **Fallback Mode**: If server is down, app falls\
  \ back to local storage\n- All alumni start with a base ELO of 1200\n\n## \U0001F3A8 Design Features\n\
  \n- **Modern UI**: Gradient backgrounds, smooth animations, and hover effects\n- **Responsive Design**:\
  \ Works on desktop, tablet, and mobile devices\n- **Fun Elements**: Emojis, playful language, and engaging\
  \ interactions\n- **Clean Typography**: Easy-to-read fonts and proper spacing\n\n## \U0001F6E0️ Technical\
  \ Details\n\n- **Pure Web Technologies**: HTML, CSS, and JavaScript (no frameworks)\n- **No Backend\
  \ Required**: Runs entirely in the browser\n- **Local Storage**: Persists data between sessions\n- **ELO\
  \ Algorithm**: Standard chess-style rating system\n\n## \U0001F4F1 Browser Compatibility\n\nWorks in\
  \ all modern browsers:\n- Chrome, Firefox, Safari, Edge\n- Mobile browsers (iOS Safari, Chrome Mobile)\n\
  \n## \U0001F680 Getting Started\n\n### Option 1: Run with Backend (Recommended)\n1. **Install dependencies:**\n\
  \   ```bash\n   npm install\n   ```\n\n2. **Start the server:**\n   ```bash\n   npm start\n   # OR\n\
  \   ./start.sh\n   ```\n\n3. **Open your browser:**\n   Go to [http://localhost:3000](http://localhost:3000)\n\
  \n4. **Start voting to build the leaderboard!**\n5. **Share with friends** to get more votes and better\
  \ rankings\n\n### Option 2: Static Version (Limited)\n1. Open `index.html` directly in your browser\n\
  2. Note: ELO scores will only persist locally and won't sync across users\n\n## \U0001F3AE Tips for\
  \ Best Experience\n\n- Vote based on career achievements, not personal preferences\n- The more people\
  \ vote, the more accurate the rankings become\n- Check the leaderboard regularly to see how rankings\
  \ change\n- Use search to quickly find specific alumni\n\n---\n\n**Note**: This is a fun, gamified way\
  \ to celebrate alumni achievements. All rankings are based on community voting and should be taken in\
  \ good spirit! \U0001F389\n"

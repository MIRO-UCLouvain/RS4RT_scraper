readme_excerpt: "<!-- ABOUT THE PROJECT -->\n# About The Project   \n\n### <u> Data </u>\n\nThe data is\
  \ defined by three cohorts: Training, Validation (Public), and Testing (Private). The “Training” and\
  \ the “Validation” cohorts are provided to the participants, whereas the “Testing” cohort is kept hidden\
  \ at all times, during and after the competition.\nThese 3 cohorts are structured as follows: Each independent\
  \ case has a dedicated folder identified by a five-digit number. Within each of these “case” folders,\
  \ there are four sub-folders, each of them corresponding to each of the structural multi-parametric\
  \ MRI (mpMRI) scans, in DICOM format. The exact mpMRI scans included are:\n\nFluid Attenuated Inversion\
  \ Recovery (FLAIR)   \nT1-weighted pre-contrast (T1w)   \nT1-weighted post-contrast (T1Gd)   \nT2-weighted\
  \ (T2) \n\n### Workflow Diagram\n![My Diagram](Thesis_Workflow.png)\n"

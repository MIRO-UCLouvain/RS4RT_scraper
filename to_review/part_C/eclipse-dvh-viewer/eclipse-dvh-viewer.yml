readme_excerpt: "# DVH Viewer\n\n治療計画装置（Varian Eclipse）からエクスポートした Cumulative DVH テキストを読み込み、\n複数プラン・複数構造の\
  \ DVH を1画面で重ねて比較し、線量指標を定量的に算出するツール。\n\n仕様の正本は [`requiments.md`](requiments.md)（要件定義書 v1.1）。\n本書に書かれていない挙動は実装者が決めず、要件定義書を更新してから実装する。\n\
  \n## 使い方\n\n1. このフォルダ一式を共有フォルダ等に配置する\n2. `index.html` を Chrome / Edge で開く（`file://` 直接起動でよい。サーバ不要）\n\
  3. 「ファイル選択」またはウィンドウへのドラッグ＆ドロップで DVH テキストを読み込む\n\nサーバ・ネットワーク接続・インストールは一切不要。完全オフラインで動作する。\n\n## 動作の前提（変更してはならない設計方針）\n\
  \n| # | 制約 | 実装 |\n|---|---|---|\n| C1 | `file://` で動作 | `fetch` / `XMLHttpRequest` を使わない。読み込みは `FileReader`\
  \ のみ |\n| C2 | ES Modules を使わない | 逐次 `<script src>` + `window.DVH` 名前空間 |\n| C3 | Web Worker を使わない |\
  \ パースはメインスレッドで同期実行（実測 12,816 行 / 86 ms） |\n| C4 | CDN を使わない | `vendor/plotly-basic.min.js` を同梱 |\n|\
  \ C5 | 外部通信を行わない | 通信コードを含まない |\n| C7 | 共有フォルダから直接起動 | 相対パス参照のみ。絶対パス・ドライブレター依存なし |\n\n**患者データは一切永続化しない。**\
  \ ページを閉じるとすべて失われる。\n`localStorage` に保存するのは軸設定・ユーザー定義指標・制約セットID・\nグラフとタブの高さの配分のみ（§8）。\n\n## ファイル構成\n\n\
  ```\nindex.html            エントリポイント。script/link タグの順序が依存関係そのもの\ncss/10-base.css       リセット・HeroUI 準拠のデザイントークン（ライト/ダーク）\n\
  css/20-layout.css     3ペインレイアウト\ncss/30-components.css パネル・テーブル・バッジ\nvendor/               Plotly.js\
  \ v3.7.0 basic-dist-min（同梱・改変禁止）\ndata/aliases.js       構造名エイリアス辞書・OARキーワード\ndata/constraints.js   線量制約データベース（サンプル。施設で差し替えること）\n\
  js/00-namespace.js    名前空間・定数・ユーティリティ・ログ・イベントバス\njs/10-parser.js       テキスト → データモデル変換\njs/20-store.js\
  \        読込済みデータと選択状態の保持（唯一の真実）\njs/30-palette.js      構造名→色、ファイル→線種の割り当て\njs/40-metrics.js      補間エンジン・指標算出\n\
  js/50-constraints.js  制約DBとの照合\njs/60-chart.js        Plotly ラッパ\njs/70〜76-ui-*.js     各ペイン・各タブのUI（76\
  \ はグラフ／タブ領域の高さの仕切り）\njs/80-export.js       CSV / 画像出力\njs/99-app.js          初期化・イベント配線（唯一の起動点）\ntest/\
  \                 検証スイート（アプリ本体はこれに依存しない）\n```\n\n**モジュール規約**: 数値プレフィックスが読み込み順を表す。\n上位番号のモジュールは下位番号のモジュールにのみ依存してよい（逆方向禁止）。\n\
  この方向は `test/test-app.js` が静的に検査する。\n\n## 見た目（§7.4）\n\nUI の**構造は §7.1 のまま**で、配色・角丸・余白・影・タイポグラフィのみを\n\
  **HeroUI** の視覚言語に合わせている。C4（CDN禁止）/ C2（ES Modules禁止）により\nTailwind や HeroUI 本体（React）は使えないため、同等のセマンティックトークンを\n\
  素の CSS カスタムプロパティで実装した。\n\n- `css/10-base.css` に `--background` / `--foreground` / `--content1〜4` /\n\
  \  `--default-50〜900` / `--primary` / `--success` / `--warning` / `--danger` /\n  `--divider` / `--radius-*`\
  \ / `--shadow-*` を定義する。\n  **他の CSS に生の色を書かない**（テストで機械的に検査している）\n- クラス名は HeroUI のコンポーネントに対応する:\n  `.btn`\
  \ = Button variant=\"flat\"、`.btn.primary` = solid、`.btn.ghost` = light、\n  `.chip-btn`/`.badge`/`.status-*`\
  \ = Chip、`.tab` = Tabs variant=\"underlined\"\n- **ダークモードは OS 設定（`prefers-color-scheme`）に追従する。**\n \
  \ グラフの配色も同じトークンを `getComputedStyle` で読んで揃えるが、\n  **画像出力（PNG/SVG）は常に白背景で行う**（学会資料・印刷用途のため）\n\n## テーブルのソート（F-08-9）\n\
  \n指標・差分・制約判定の各テーブルは、**列ヘッダのダブルクリック**で並べ替えできる。\n1回目=昇順、2回目=降順、3回目=元の並びに戻る。Tab でヘッダにフォーカスして\nEnter / Space\
  \ でも同じ操作ができる（F-08-7）。\n\n- 数値列は数値として比較する（文字列比較では `100` と `2338.5` の順序が壊れるため）\n- 欠損（`—`）は昇順・降順のどちらでも**常に末尾**に置く\n\
  - 同値の行は元の順序を保つ（安定ソート）\n- 制約判定の「判定」列は逸脱が先頭に集まる順に並ぶ\n- **並べ替えは表示順のみに作用し、算出値には一切影響しない**\n\n## グラフとタブの高さの変更（F-08-10）\n\
  \n右側のグラフ領域とタブ領域のあいだの仕切りを**上下にドラッグ**すると、両者の高さの\n配分を変えられる。表を広く見たいとき、グラフを大きく見たいときに切り替える。\n\n- 可動範囲はグラフ領域が\
  \ 20%〜85%。どちらの領域も潰れない\n- Tab で仕切りにフォーカスして **↑↓**（2%刻み）・**PageUp / PageDown**（10%刻み）でも動かせる（F-08-7）\n\
  - **Home キーまたはダブルクリック**で既定の配分（58:42）に戻る\n- 配分は表示設定として `localStorage` に保存し、次回起動時に復元する\n- グラフは親要素の高さ変化に自動追従しないため、`Plotly.Plots.resize()`\
  \ を明示的に呼ぶ\n  （ドラッグ中は 1 フレーム 1 回に間引く）\n\n## 軸の切り替え（F-08-11）\n\nヘッダの「相対線量／絶対線量」「cGy／Gy」「相対体積／絶対体積」は、現在値をそのまま\n\
  表示するラベルになっている。**左クリックするたびにもう一方へ切り替わる**。何に切り替わるかは\nマウスを載せるとツールチップで示す。\n\n- 絶対線量の既定の単位は **cGy**（Eclipse\
  \ の出力単位に合わせている）。変更すると `localStorage` に保存される\n- 横軸が相対線量のあいだは単位が意味を持たないため、単位のラベルは操作できない（理由をツールチップで示す）\n\
  \n## 制約判定は開発中\n\n制約判定タブは**開発中**である。制約セットの内容・構造の自動対応づけ・判定ロジックは\nいずれも検証途上であり、判定結果が正しいことは保証されない。**臨床用途には使用しないこと。**\n\
  タブのバッジ、パネル先頭の注意書き、判定CSVのヘッダ行にそれぞれ明記している。\n\n## 実装上の要点\n\n- **単位の内部正規化**: 線量は常に **cGy**、体積は常に **相対[%]**\
  \ で保持し、表示時にのみ変換する。\n  単位混在バグを構造的に防ぐための一元化。\n- **補間の集約**: すべての指標算出は `DVH.Metrics.volumeAtDose` / `doseAtVolume`\
  \ を通す。\n  他モジュールが独自に補間を書くことを禁止する。\n  逆補間の平坦部では**線量が大きい側の端点**を採る（`D95%` = 体積の95%が受ける最小線量）。\n- **間引きをしない**:\
  \ 描かれる曲線と指標表の値が食い違うと、グラフから値を読んだ利用者が\n  誤った数値を得る。常用域では間引きなしで性能目標を満たせるため忠実性を優先する。\n- **色の不変性**: 構造キー→色の割り当ては\
  \ `Map` に固定され、カウンタは単調増加のみ。\n  追加読み込み・削除を行っても既存構造の色は変化しない。\n- **部分一致の禁止**: `Lung_L` と `Lungs` は正規化後も別キーであり、同一視しない。\n\
  \  表記ゆれの吸収は `data/aliases.js` の明示的な辞書によってのみ行い、既定は OFF。\n- **画像出力の一本化**: Plotly 標準モードバーの `toImage` を削除し、匿名化トグルを\n\
  \  必ず経由する自前ボタンのみを画像出力経路とする。\n\n## 検証\n\n```\ncd test\nnpm install      # jsdom（検証時のみ必要。アプリ本体には不要）\n\
  npm test\n```\n\n`test/make-sample.js` が要件定義書 §3.2 の構造を忠実に再現した合成 DVH ファイルを生成し、\nそれに対してパーサ・補間・パレット・UI\
  \ 配線を検証する。\n**合成データのみを使い、患者データはリポジトリに一切置かない**（`.gitignore` で `*.txt` を除外）。\n\n現在の結果: パーサ 54件 / 補間・パレット・ストア\
  \ 64件 / レビュー回帰 20件 / UI結合 162件\n= **300件すべてパス**。\n\n### 色の割り当てについての注記（F-02-4 の実際の保証範囲）\n\n要件書は「20回で確保できない場合は明度を\
  \ ±8% ずらした変種を採用し、被らないことを保証する」\nと書いているが、`target` の色相レンジは 50 度しかなく、12 度間隔では 1 明度帯あたり\n4 色程度が上限である。したがって**単一カテゴリに数十系列を超えると\
  \ 12 度ルールは\n数学的に達成できない**。実装は次のように振る舞う。\n\n- 明度帯を 11 段用意し、各帯で色相を 20 回試す（実運用規模の 32 系列では 12 度ルールを完全に満たす）\n\
  - それでも確保できない場合は、**完全に同一の色になることだけは必ず避け**、\n  「同系色が現れる」旨をログに警告する（黙って重複させない）\n\n180 系列での実測: 固有色 180/180、12\
  \ 度違反が残るため警告1件。\n\n### 未検証の項目\n\n| 項目 | 状況 |\n|---|---|\n| 実 Eclipse ファイル（添付4ファイル）での受け入れテスト | 未実施。手元に実ファイルが無いため合成データで代替した\
  \ |\n| 180系列の描画性能（要件書 L-2） | 未実測。trace 配列の構築は 192,240 点で 3 ms だが、Plotly の SVG 描画時間はブラウザ実機でのみ測れる |\n\
  | T-15 共有フォルダからの `file://` 起動 | 未実施（実機確認が必要） |\n| T-17 ズーム操作 | 未実施（実機確認が必要）。Plotly の設定値は自動テストで検証済み |\n\
  | 見た目の実機確認（§7.4） | **未実施。** CSS は jsdom では描画されないため、トークン定義・変数参照の解決・生の色が残っていないことの静的検査のみを行っている。ライト/ダーク双方での実際の見え方はブラウザで確認が必要\
  \ |\n| T-18 出力画像の匿名化 | 出力ファイルそのものの検査は未実施。凡例名からの患者情報除去ロジックは自動テストで検証済み |\n"

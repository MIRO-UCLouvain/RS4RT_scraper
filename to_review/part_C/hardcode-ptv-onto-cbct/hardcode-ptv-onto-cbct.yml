readme_excerpt: "hardcode_PTV_onto_CBCT.py\n============\nThis python script is used to hardcode contour\
  \ data onto CBCT_Pixel_data_image (img).\n\nMotivated by slow software for off_line review (in radiotherapy)\
  \ we developed a script that enables faster CBCT review.\n\n<img src='https://raw.githubusercontent.com/jaibrat/hardcode_PTV_onto_CBCT/main/demo-imge.PNG'\
  \ align='right' height='335' width='167' alt=\"idea in short\">\n\nQuick-Start Use:\n============\n\
  1. prepare CBCT.dcm in an \"in-folder\" (DICOM)\n2. set all parameter values in a script (ISO-coordinates,\
  \ setup-shift, filenames, and desired contour nubers)\n3. run the script and as a result you have your\
  \ \"out-folder\" filled\n4. send those images to any DICOM-viewer (or PACS), contours should be visible\n\
  \nInstalling\n==========\n1. Install Anaconda (recommended, not necessary)\n2. Create environment  ```conda\
  \ create --name myenv python --no-default-packages```\n4. Install requierd packages\n```\npip install\
  \ dicompyler-core\n```\n```\ngit clone https://github.com/bastula/dicompyler.git\n#suggested versions\
  \ are:\n#dicompyler                         0.5.0\n#dicompyler-core                    0.5.6\n```\n\
  **Now, here comes an important part:**\n\nComment out every \"wx\"_involvemnt!\n\n#and any other modules\
  \ that might not be needed\n#from matplotlib ...\nLike this:\n\na. imports\n```\n#...\n#from wx.lib.pubsub\
  \ import pub\n#...\n```\nb. class\n```\nclass plugin2DView():#wx.Panel  #don't allow to inherit from\
  \ wx\n```\nc. constructor\n```\n#in constructor: def __init__(self):  \n\t#wx.Panel.__init__(self)\n\
  \        pass    \n```\nIt's either that or installing suited wx version (to me, much harder job)\n\
  (third option is to copy-paste (rewrite) function that is being called)\nWe just want to use one of\
  \ class'es methods.\n\n**Now, here comes an important part (#2):**\n\n```wget -L https://github.com/dicompyler/dicompyler-core/raw/master/dicompylercore/dicomparser.py\
  \ -O /home/ubuntu2/anaconda3/envs/dipy6/lib/python3.10/site-packages/dicompylercore/dicomparser056.py\
  \ ```\n\nWhich is linux command that copies dicompyler-core ver_0.5.6 inside its folder (you can do\
  \ that manually), ```pip install dicompyler-core==0.5.6``` won't work, cause' it goes only up to ver_0.5.5\n\
  \n\nGood luck!\n\n"

readme_excerpt: "# Prostate mpMRI Radiomics\n\nPortfolio repository focused on Prostate Cancer using Radiomics\
  \ + calibrated classical ML.\n\n## Repository Layout\n\n`\text\noncology-ai-prostate-mpmri-radiomics/\n\
  ??? pipeline.py\n??? requirements.txt\n??? README.md\n`\n\n## Clinical Focus\n\n- Cancer type: Prostate\
  \ Cancer\n- Primary modality: Multiparametric MRI\n- Method family: Radiomics + calibrated classical\
  \ ML\n\n## Candidate Public Datasets\n\n- PROSTATEx challenge\n\n## Thesis-Grade Research Gap\n\nGeneralizable\
  \ lesion-level risk scoring with harmonization across MRI vendors.\n\n## Initial Research Questions\n\
  \n1. Which failure modes are clinically unacceptable for this cancer context?\n2. How should operating\
  \ thresholds be selected for screening versus triage?\n3. Which uncertainty quantification strategy\
  \ best correlates with real diagnostic error?\n4. How does dataset shift affect model safety and calibration?\n\
  \n## MVP Technical Plan\n\n1. Build strict dataset schema and split protocol.\n2. Establish baseline\
  \ model with transparent metrics.\n3. Add calibration and threshold analysis.\n4. Add interpretability\
  \ and subgroup evaluation.\n5. Package reproducible CLI pipeline for portfolio demonstration.\n\n##\
  \ Evaluation Core\n\n- Discrimination: ROC-AUC, PR-AUC\n- Clinical utility: sensitivity/specificity\
  \ at operating points\n- Reliability: Brier score, calibration curve\n- Safety: subgroup gap analysis\
  \ and error taxonomy\n\n## Notes for Future Thesis Expansion\n\n- Add prospective-style temporal split\
  \ and external validation.\n- Define a clinical decision policy simulator.\n- Include uncertainty-based\
  \ referral strategy.\n- Add deployment-ready audit logs and model cards.\n"

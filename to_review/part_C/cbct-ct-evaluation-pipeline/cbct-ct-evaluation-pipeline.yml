readme_excerpt: "## Cycle-GAN CBCT-CT Evaluation Pipeline\nEvaluation pipleline for the CBCT to CT domain\
  \ transfer using Cycle-GAN project. Uses Plastimatch to do all the necessary functions and finally calculates\
  \ the Dice Similaruty Score, Hausdorff Distance and the Euclidean distance of the fiducial markers.\
  \ This project utilizes [Plastimatch](https://plastimatch.org/), [TotalSegmentor](https://github.com/wasserth/TotalSegmentator),\
  \ [3D Slicer](https://www.slicer.org/).\n\n## Folder Structure\nCopy the {patient-number}-LinearTransforms.txt\
  \ file from the LinearTransforms folder to the respective Patient folders and make sure the project\
  \ structure look likes this before proceeding.\n\n```text\nproject/\n├── datasets/\n│   └── pelvic_reference/\n\
  │       ├── Pelvic-Ref-001/              # Patient with GT contours\n│       │   ├── CBCT/         \
  \           # Contains the CBCT DICOM files\n│       │   ├── CT/                      # Contains the\
  \ CT DICOM files\n│       │   ├── FDMs/                    # Contains the Fiducial Distance Markup files\
  \ (if available)\n│       │   ├── GT_contours/             # Contains ground truth contours\n│     \
  \  │   │   ├── CT/                  # CT contours in .mha format\n│       │   │   └── CBCT/        \
  \        # CBCT contours in .mha format\n│       │   └── 001-LinearTransform.txt  # Affine transform\
  \ values from 3D Slicer\n│       ├── Pelvic-Ref-002/              # Patient without GT contours\n│ \
  \      │   ├── CBCT/\n│       │   ├── CT/\n│       │   └── 002-LinearTransform.txt\n│       └── ...\
  \ (additional patient data folders)\n├── evaluation/\n│   ├── __init__.py\n│   ├── config.py\n│   ├──\
  \ fcsv.py\n│   ├── params.py\n│   ├── pipeline.py\n│   ├── plastimatch.py\n│   └── util.py\n├── main.py\n\
  ├── requirements.txt\n└── README.md\n```\n## Steps to Run the Code\n1. Create a new environment\n  \
  \ ```bash\n   conda create --name eval-pipeline python=3.10\n   conda activate eval-pipeline\n   ```\n\
  \   \n\n2. Install the dependencies\n   \n   a. **Install PyTorch** - [PyTorch Installation](https://pytorch.org/get-started/locally/).\
  \  \n   \n   b. **Install the Remaining Dependencies** \n      ```bash\n      pip install -r requirements.txt\n\
  \   ```\n4. Run the pipeline in terminal (-d argument should be in glob format)\n   ```bash\n   python\
  \ main.py -d ./datasets/pelvic_reference/Pel*\n   ```\n5. Run the pipeline from code\n   ```python\n\
  \   from evaluation.pipeline import EvaluationPipeline\n   from glob import glob\n   import os\n\n \
  \  data = glob(os.path.join(os.path.curdir, \"datasets\", \"pelvic_reference\", \"Pel*\"))\n   pipeline\
  \ = EvaluationPipeline()\n   pipeline.evaluate(data)\n   ```\n## Evaluation Pipeline Arguments\n1. For\
  \ Terminal\n  ```text\nusage: main.py [-h] [-d] [-n] [-f] [-a] [-s] [-pw] [-dm] [-c] [-fc] [-p] [-r]\
  \ [-w] [-m] [-fs]\n\noptions:\n  -h, --help            show this help message and exit\n  -d, --data\
  \            all patient dirs in glob format\n  -n, --nums            patient numbers to process (in\
  \ csv format)\n  -f, --force           force run, deletes previous results and creates a new one. Otherwise\
  \ skips the step if results already present\n  -a, --all             run all the steps\n  -s, --seg\
  \             run segmentation only\n  -pw, --pw-linear      run pw-linear transformation only\n  -dm,\
  \ --dmap           run dmap calculation only\n  -c, --cxt             run cxt conversion only\n  -fc,\
  \ --fcsv           run fcsv creation only\n  -p, --params          run register params.txt creation\
  \ only\n  -r, --register        run plastimatch register only\n  -w, --warp            run warp only\n\
  \  -m, --metric          run calculate scores only\n  -fs, --fiducial-sep   run calculate fiducial distance\
  \ only\n```\nExample:\n```bash\n  1. python main.py -d ./datasets/pelvic_reference/Pel* -f -n 3,4 -a\
  \        # Force runs all the steps for patients 3 and 4\n  2. python main.py -d ./datasets/pelvic_reference/Pel*\
  \ -f -n 3,4 -s -pw    # Force runs the segmentation and pw-linear transform steps for patients 3 and\
  \ 4\n  3. python main.py -d ./datasets/pelvic_reference/Pel* -f -s -pw           # Force runs the segmentation\
  \ and pw-linear transform steps for all the patients\n  3. python main.py -d ./datasets/pelvic_reference/Pel*\
  \ -s -pw              # Initates the segmentation and pw-linear transform steps for all the patients,\
  \ but skips if the result is already present\n  ```\n2. For Python\n   ```python\n   nums = [] or [3,\
  \ 4]   # Runs for all the patients if [] is passed\n   force = False\n   all = True            # Runs\
  \ all the steps if True\n   seg = False\n   pw_linear = False\n   dmap = False\n   cxt = False\n   fcsv\
  \ = False\n   params = False\n   register = False\n   warp = False\n   metric = False\n   fiducial_sep\
  \ = False\n   data = glob(os.path.join(os.path.curdir, \"datasets\", \"pelvic_reference\", \"Pel*\"\
  ))\n   \n   pipeline = EvaluationPipeline()\n   pipeline.evaluate(data, force, nums, all, seg, pw_linear,\n\
  \                        dmap, cxt, fcsv, params, register,\n                        warp, metric, fiducial_sep)\n\
  \   ```\n\n## References\n1. [Plastimatch](https://plastimatch.org/)\n2. [TotalSegmentator](https://github.com/wasserth/TotalSegmentator)\n\
  \n---\n"

readme_excerpt: '# 🧠 Brain Tumor Classification and Segmentation System


  A deep learning-powered web application that detects and highlights brain tumors in MRI scans — helping
  doctors make faster and more accurate diagnoses.


  ---


  ## 💡 Why This Project?


  Brain tumors are life-threatening, and early detection can save lives. But analyzing MRI scans manually
  is time-consuming and difficult — tumors vary in size, shape, and location, making them easy to miss.


  This project uses AI to:

  - **Automatically detect** whether a brain tumor is present in an MRI image

  - **Highlight the exact location** of the tumor using image segmentation


  The goal is not to replace doctors, but to give them a smart assistant that speeds up diagnosis and
  reduces human error.


  ---


  ## ✨ Features


  - 📤 Upload any brain MRI image

  - 🔍 Instant tumor classification (Tumor / No Tumor)

  - 🗺️ Visual tumor segmentation overlay (shown only when a tumor is detected)

  - 🖥️ Simple, clean web interface built with Streamlit


  ---


  ## 🧬 How It Works


  The system uses two deep learning models working together:


  | Step | Model | Task |

  |------|-------|------|

  | 1 | **VGG-based Classifier** | Predicts whether a tumor is present or not |

  | 2 | **ResUNet Segmentation Model** | If a tumor is found, highlights its location on the MRI |


  Both models were trained on brain MRI data using TensorFlow/Keras with GPU acceleration (TF 2.10).


  The classifier achieved **~96.95% accuracy** on the test set.


  ---


  ## 🖼️ App Pages


  - **Home** — Introduction and how to use the app

  - **About** — Background and motivation behind the project

  - **Brain Tumor Recognition** — Upload an MRI and get predictions + segmentation


  ---


  ## 🛠️ Tech Stack


  - **Python**

  - **TensorFlow / Keras** — Deep learning models

  - **Streamlit** — Web application framework

  - **OpenCV** — Image processing

  - **NumPy / scikit-image** — Numerical and image utilities


  ---


  ## 📊 Model Performance


  | Model | Metric | Score |

  |-------|--------|-------|

  | VGG Classifier | Accuracy | **96.95%** |

  | ResUNet | Task | Tumor segmentation |


  ---


  ## ⚠️ Disclaimer


  This tool is intended for **educational and research purposes only**. It is not a substitute for professional
  medical advice, diagnosis, or treatment. Always consult a qualified medical professional for health-related
  decisions.



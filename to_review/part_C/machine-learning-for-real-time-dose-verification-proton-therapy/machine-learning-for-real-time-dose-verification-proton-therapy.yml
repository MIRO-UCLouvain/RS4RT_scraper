  \n---\n\n## \U0001F4A1 Why This Problem Matters\n\nProton therapy treats cancer by delivering a tightly\
  \ focused beam of protons that deposits **most of its energy at a precise depth** — the Bragg peak —\
  \ then stops. This makes it far more tissue-sparing than X-ray radiotherapy, particularly for paediatric\
  \ tumours and brain cancers near critical structures.\n\nBut this precision is also its vulnerability.\n\
  \n> **A dose deviation of just 2% or 2 mm can mean the difference between tumour control and treatment\
  \ failure — or between sparing an optic nerve and causing blindness.**\n\nCurrent clinical practice\
  \ verifies dose *offline*, after the patient has left the treatment room. This creates a 24-hour delay\
  \ before errors are caught. For adaptive re-irradiation or FLASH proton therapy (ultra-high dose rates),\
  \ this is clinically unacceptable.\n\nThis project builds the ML backbone for a **real-time verification\
  \ system** that:\n- Reads raw 2D scintillator detector signals frame-by-frame during beam delivery\n\
  - Predicts the dose error in **<50 ms** per delivery window\n- Quantifies its own uncertainty and flags\
  \ clinically significant deviations\n\n---\n\n## \U0001F52C The Science Behind It\n\n### The Bragg Peak\n\
  \nWhen a proton beam enters tissue, it loses energy gradually, then releases a sharp energy burst —\
  \ the Bragg peak — at a depth determined by the initial beam energy. The depth-dose relationship is\
  \ modelled by the Bortfeld (1997) approximation:\n\n```\nR [cm] = 0.0022 × E^1.77          (range in\
  \ water, E in MeV)\n\nDose(z) = plateau(z) × [1 - Φ((z-R)/σ)] + peak × exp[-(z-R)²/2σ²]\n```\n\nWhere\
  \ `σ` captures both energy straggling and detector blur.\n\n### What the Detector Sees\n\nA 2D scintillator\
  \ array (e.g., IBA MatriXX PT) records the lateral beam profile frame-by-frame as the pencil beam scans\
  \ across the target volume. Each frame is a 128×128 grid of ADC counts. The challenge: extract a dose\
  \ accuracy signal from noisy, drifting, partially-dead detector arrays — in real time.\n\n### The Clinical\
  \ Standard\n\nAAPM TG-218 defines the gold standard: **gamma index** analysis with a 3%/3mm criterion.\
  \ A treatment passes QA if ≥95% of evaluated voxels have `γ ≤ 1.0`. This project's ML output is benchmarked\
  \ against this standard.\n\n---\n\n## \U0001F3D7️ What I Built\n\n```\nBeam Delivery               \
  \   Detector Array\n(70–230 MeV protons)    →      (128 × 128 scintillator pixels)\n               \
  \                         │\n                          ┌─────────────▼──────────────────┐\n        \
  \                  │      SIGNAL PRE-PROCESSING     │\n                          │  • Robust hot-channel\
  \ detection │\n                          │    (median ± 4.0 MAD z-score)  │\n                      \
  \    │  • Gaussian dead-ch correction  │\n                          │  • Savitzky-Golay smoothing  \
  \   │\n                          │  • Butterworth drift filtering  │\n                          └─────────────┬──────────────────┘\n\
  \                                        │\n                          ┌─────────────▼──────────────────┐\n\
  \                          │      FEATURE EXTRACTION        │\n                          │  Spatial:\
  \ integral, CoM, FWHM  │\n                          │  Moment: skew, kurtosis        │\n           \
  \               │  Temporal: gradient, SNR       │\n                          │  Spectral: STFT entropy\
  \        │\n                          │  Radial: 19-bin profile        │\n                         \
  \ └─────────────┬──────────────────┘\n                                        │  x ∈ ℝ^460\n       \
  \                   ┌─────────────▼──────────────────┐\n                          │         ML ENSEMBLE\
  \            │\n                          │                                │\n                     \
  \     │  ╔══════════════╗              │\n                          │  ║ Residual MLP ║  ← primary \
  \ │\n                          │  ║ (MC-Dropout) ║             │\n                          │  ╚══════════════╝\
  \              │\n                          │  ╔══════╗  ╔══════════╗        │\n                   \
  \       │  ║ GBR  ║  ║ Stacking ║        │\n                          │  ╚══════╝  ╚══════════╝    \
  \    │\n                          └─────────────┬──────────────────┘\n                             \
  \           │\n                          ┌─────────────▼──────────────────┐\n                      \
  \    │   UNCERTAINTY + CALIBRATION    │\n                          │  MC-Dropout: 50 forward passes\
  \ │\n                          │  Conformal PI: 90% coverage    │\n                          │  Temperature\
  \ scaling: ECE↓     │\n                          └─────────────┬──────────────────┘\n              \
  \                          │\n                               Δdose = +1.2% ± 0.11%\n               \
  \                CI₉₀  = [+0.9%, +1.5%]\n                                        │\n               \
  \           ┌─────────────▼──────────────────┐\n                          │      CLINICAL VERDICT  \
  \        │\n                          │  ✅ PASS   |Δ| ≤ 2%           │\n                          │\
  \  ⚠️ WARN   2% < |Δ| ≤ 4%      │\n                          │  ❌ FAIL   |Δ| > 4%  → STOP   │\n    \
  \                      └────────────────────────────────┘\n```\n\n---\n\n## \U0001F4E1 Data Pipeline\n\
  \nNo real patient data was used. I designed a **physics-faithful synthetic data generator** in `src/data/simulator.py`\
  \ that produces statistically realistic training data.\n\n### Simulation Layers\n\n**Layer 1 — Beam\
  \ Physics**\n```python\n# Bragg range from Bortfeld (1997)\nR = 0.0022 * (energy_mev ** 1.77)\n\n# Add\
  \ nuclear fragmentation tail beyond Bragg peak\ntail = 0.02 * exp(-(depth - R) / 2.0) * (depth > R)\n\
  ```\n\n**Layer 2 — Detector Realism**\n\n| Effect | Implementation |\n|--------|---------------|\n|\
  \ Electronic noise | Gaussian noise ∝ signal mean |\n| Linear drift | Multiplicative `(1 + drift_rate\
  \ × t)` |\n| Dead channels | Random permanent mask (0–4% of pixels) |\n| Hot-channel spikes | Poisson-rate\
  \ sporadic amplification (3–8×) |\n| Beam spot shape | 2D Gaussian with energy-dependent sigma |\n\n\
  **Layer 3 — Feature Engineering**\n\nFrom each time-series of detector frames, I extract 4 aggregate\
  \ statistics (mean/std/min/max) over 115 per-frame features = **460-dimensional feature vector** per\
  \ treatment fraction.\n\n---\n\n## \U0001F9E0 Model Design Decisions\n\n### Why a Residual MLP instead\
  \ of a plain network?\n\nPlain MLPs suffer from degradation as depth increases. Residual connections\
  \ allow gradient flow through deep architectures without vanishing — critical for learning subtle dose-error\
  \ patterns across 460 features.\n\n```python\nclass ResidualBlock(nn.Module):\n    def forward(self,\
  \ x):\n        return x + self.block(x)   # identity skip connection\n```\n\nThe model uses **4 residual\
  \ blocks × 256 hidden units** with GELU activations (smoother gradients than ReLU for regression).\n\
  \n### Why MC-Dropout for uncertainty?\n\nVariational inference is expensive. MC-Dropout (Gal & Ghahramani,\
  \ 2016) gives a **free approximation to Bayesian inference** — simply keep dropout active at test time\
  \ and run 50 forward passes. The standard deviation across passes estimates epistemic (model) uncertainty.\n\
  \n```python\nmodel.train()   # keeps dropout ON — the key insight\nfor _ in range(50):\n    preds.append(model(X))\n\
  epistemic_std = np.stack(preds).std(axis=0)\n```\n\n### Why conformal prediction on top of MC-Dropout?\n\
  \nMC-Dropout gives *relative* uncertainty. Conformal prediction gives a **distribution-free coverage\
  \ guarantee**: the 90% interval contains the true value ≥90% of the time — provably, regardless of model\
  \ calibration or data distribution.\n\n```python\n# Calibration phase (using held-out val set)\nresiduals\
  \ = |y_val - y_pred_val|\nq̂ = quantile(residuals, ⌈(n+1)(1−α)⌉/n)\n\n# Test phase: guaranteed 90% coverage\n\
  interval = [ŷ − q̂,  ŷ + q̂]\n```\n\n### Sklearn models — why keep them?\n\n1. **Speed** — GBR inference\
  \ is <2 ms vs ~5 ms for MLP. Critical for beam-interlock latency budgets.\n2. **Interpretability** —\
  \ permutation importance reveals which physical features drive predictions. Regulators and physicists\
  \ require explainability.\n3. **Fallback** — if PyTorch model degrades (distribution shift), the GBR\
  \ ensemble provides a robust fallback.\n\n---\n\n## \U0001F4CA Uncertainty Quantification\n\nThis section\
  \ shows why uncertainty matters clinically. Two predictions with the same point estimate deserve different\
  \ clinical responses:\n\n```\nFraction A:  Δdose = +1.8%  ± 0.05%   CI₉₀ = [+1.7%, +1.9%]  → PASS with\
  \ high confidence\nFraction B:  Δdose = +1.8%  ± 0.82%   CI₉₀ = [+1.0%, +2.6%]  → FLAG for physicist\
  \ review\n```\n\nBoth are below the 2% threshold, but Fraction B's interval crosses it. The system correctly\
  \ escalates B while clearing A — impossible with point-estimate-only models.\n\n### Calibration curve\n\
  \nA well-calibrated model should have ECE (Expected Calibration Error) close to zero. Temperature scaling\
  \ post-training reduces ECE from ~0.08 → **0.021**, meaning predicted confidence intervals closely match\
  \ empirical hit rates.\n\n---\n\n## \U0001F4C8 Results & Benchmarks\n\n> Evaluated on 300 held-out treatment\
  \ fractions (15% of 2,000 total). All CI via bootstrap with 1,000 resamples.\n\n### Regression — Dose\
  \ Error Prediction\n\n| Model | MAE (%) ↓ | RMSE (%) ↓ | R² ↑ | 95% CI (MAE) |\n|-------|:---------:|:----------:|:----:|:------------:|\n\

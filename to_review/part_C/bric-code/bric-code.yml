readme_excerpt: "This code has been published by BrIC Lab, Case Western Reserve University, Cleveland\
  \ OH.\nAll rights reserved.\n\nPlease cite the following papers if you use this code:\n\nTumor-habitat\
  \ derived radiomic features that are prognostic of progression-free survival in Glioblastoma are associated\
  \ with key morphologic attributes on pathology: A feasibility study \nRuchika Verma, Ramon Correa, Virginia\
  \ Hill, Volodymyr Statsevych, Kaustav Bera, Niha Beig, Abdelkader Mahammedi, Anant Madabhushi, Manmeet\
  \ Ahluwalia, and Pallavi Tiwari\nRadiology:Artificial Intelligence. 2020 Nov 11;2(6):e190168\nhttps://pubmed.ncbi.nlm.nih.gov/33330847/\n\
  \n\nRadiogenomic-based survival risk stratification of tumor habitat on Gd-T1w MRI is associated with\
  \ biological processes in Glioblastoma\nNiha Beig, Kaustav Bera, Prateek Prasanna, Jacob Antunes, Ramon\
  \ Correa, Salendra Singh, Anas Saeed Bamashmos, Marwa Ismail, Nathaniel Braman, Ruchika Verma, Virginia\
  \ B Hill, Volodymyr Statsevych, Manmeet S Ahluwalia, Vinay Varadan, Anant Madabhushi and Pallavi Tiwari\n\
  Clin Cancer Res. 2020 Apr 15;26(8):1866-1876\nhttps://pubmed.ncbi.nlm.nih.gov/32079590/\n\nMain Files:\n\
  collage_feature_extraction.m : Main file to extract 3D Collage features\ntexture_feature_extraction.m\
  \ - Main file to extract texture based features\nshape_feature_extraction.m - Main file to extract shape\
  \ features\n\n\nFolders:\nCollage_supporting_codes - This folder consists of 3D Collage feature extraction\
  \ dependencies\nShape - This folder consists of shape feature extraction dependencies\nTexture - This\
  \ folder consists of 3D texture feature extraction dependencies\n\n(This repository was previously linked\
  \ as https://github.com/ccipd/BrIC_Lab)\n"

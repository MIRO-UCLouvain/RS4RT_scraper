  \n\n<!-- PROJECT LOGO -->\n<br />\n<p align=\"center\">\n  <a href=\"https://synthrad2023.grand-challenge.org/\"\
  >\n    <img src=\"./SynthRAD_banner.png\" alt=\"Logo\" width=\"770\" height=\"160\">\n  </a>\n\n\n \
  \ <p align=\"center\">\n    Preprocessing script: from dicom to aligned nifty for \n<a href=\"https://synthrad2023.grand-challenge.org/\"\
  ><strong>SynthRAD2023 Grand Challenge</strong></a>\n  <br />\n    <a href=\"https://github.com/SynthRAD2023/preprocessing\"\
  ><strong>Explore the docs »</strong></a>\n    <br />\n    <br />\n    <a href=\"https://github.com/SynthRAD2023/preprocessing\"\
  >View Demo</a>\n    ·\n    <a href=\"https://github.com/SynthRAD2023/preprocessing/issues\">Report Bug</a>\n\
  \    ·\n    <a href=\"https://github.com/SynthRAD2023/preprocessing/issues\">Request Feature</a>\n \
  \ </p>\n</p>\n\n<!-- TABLE OF CONTENTS -->\n## Table of Contents\n\n* [Goal](#goal)\n* [Getting Started](#getting-started)\n\
  \  * [Prerequisites](#prerequisites)\n  * [Installation](#installation)\n* [Usage](#usage)\n  * [Function\
  \ Descriptions](#functions-descriptions)\n* [Roadmap](#roadmap)\n* [Contributing](#contributing)\n*\
  \ [License](#license)\n* [Contact](#contact)\n<!--\n* [Acknowledgements](#acknowledgements)\n-->\n\n\
  \n<!-- ABOUT THE PROJECT -->\n<br/>\n<br/>\n\n## Goal\n\nTo pre-process CBCT, MRI and CT images for\
  \ the synthRAD2023 deep learning challenge. This includes file format conversions from ``.dcm`` to ``.nii.gz``,\
  \ resampling, allignment, masking, defacing and  cropping.\n<br/>\n<br/>\n\n<!-- GETTING STARTED -->\n\
  ## Getting Started\n\nTo get a local copy up and running follow these simple steps.\n\n### Prerequisites\n\
  \n* numpy\n```sh\npip install numpy\n```\n\n* SimpleITK/SimpleElastix \n```sh\npip install SimpleITK-SimpleElastix\n\
  ```\n* PyDicom\n```sh\npip install pydicom\n```\n* openpyxl\n```sh\npip install openpyxl\n```\n### Installation\n\
  \n1. Clone the repo\n```sh\ngit clone https://github.com/SynthRAD2023/preprocessing.git\n```\nor\n```sh\n\
  git clone git@github.com:SynthRAD2023/preprocessing.git\n```\n\n<!-- USAGE EXAMPLES -->\n<br/>\n<br/>\n\
  \n## Usage\n\nThe main file ``pre_process_tools.py`` contains tools for:\n* Converting from ``.dcm``\
  \ to ``.nii.gz`` (MRI,CBCT and CT);\n* Resampling CTs to 1x1x1 mm<sup>3</sup> for brain and to 1x1x2.5\
  \ mm<sup>3</sup> for pelvis;\n* Registering MRI/CBCT to CT (as a result MRI/CBCT will also have 1x1x1\
  \ or 1x1x2.5 spacing) using Elastix;\n* Segmenting patient outline on MRI/CBCT an dilate the resulting\
  \ mask;\n* Crop MRI, CBCT, CT and the mask with a small extra margin to the dilated mask;\n\nThe Elastix\
  \ parameter files adopted can be found in ``param_files``.\n\nIf desired, there is also functions to:\n\
  * Apply the mask to MRI and CT;\n\nEach task can be run as a subfunction of the main file, as described\
  \ in the next section.\n\nExamples of how to run pre-processing for a batch of patients can be found\
  \ in the directory ``examples``:\n* ``pre_process_batch_MR.py`` for python-based pre-processing;\n*\
  \ ``pre_process_batch_MR.sh`` for bash-based (terminal) pre-processing in Unix. This file reads the\
  \ list\nof patients provided in ``pat_list_brain_mri2ct.txt``.\n\nThe file ``extract_tags_tools.py``\
  \ provides functions to:\n* Read a list of tags from a text file;\n* Extract tags from dicom files and\
  \ returns a dictionary containing the key: value pairs\n* Get dimensions and spacing of pre-processed\
  \ images\n* Write the tags to a CSV/excel file\n\nAn example of a tag extraction is provided in the\
  \ directory examples:\n*  ``extract_tags_UMCG.py`` shows an example of how to use the above functions\
  \ for a dataset containing multiple patients and images directly in python;\n*  ``pre_process_batch_MR.sh``\
  \ contains instructions on how to call the above functions from the terminal.\n\nFuther example of the\
  \ code from two insititutions has been provided. N.B. this is intended as example of script, it should\
  \ be adapted for your own use.\n<br/>\n<br/>\n\n## Function Description\n### Pre-processing:\n\n**convert_dicom_nifti(input,\
  \ output)**\n\n\tdescription:\n\tconvert a dicom image to compressed nifti using SimpleITK\n\t\n\targuments:\n\
  \tinput: folder containing dicom series (example 'C:\\path\\containing\\Dicom_series')\n\toutput: output\
  \ file path for compressed nifti (example: 'C:\\path\\to\\folder\\image.nii.gz')\n\n\tcommand line usage:\n\
  \tpython pre_process_tools.py convert_dicom_to_nifti --i 'C:\\path\\containing\\Dicom_series' --o 'C:\\\
  path\\to\\folder\\image.nii.gz'\n\n\n**resample(input, output, spacing)**\n\n\tdescription:\n\tresample\
  \ nii.gz image using custom spacing (in mm)\n\n\targuments:\n\tinput: file path input image (example:\
  \ 'C:\\path\\to\\folder\\image.nii.gz')\n\toutput: file path resampled image (example: 'C:\\path\\to\\\
  folder\\image_resampled.nii.gz')\n\tspacing: new spacing in mm (example: (1,1,1))\n\n\tcommand line\
  \ usage:\n\tpython pre_process_tools.py resample --i 'C:\\path\\to\\folder\\image.nii.gz' --o 'C:\\\
  path\\to\\folder\\image_resampled.nii.gz' --s 1 1 1\n\n\n**read_parameter_map(parameter_fn)**\n\t\n\t\
  description:\n\tread an elastix parameter map from a .txt file and return the parameter map object\n\
  \n\targuments:\n\tparameter_fn: file path parameter file\n\n**register(fixed, moving, parameter, output)**\n\
  \t\n\tdescription:\n\tregister two images using elasix parameter map\n\n\targuments:\n\tfixed: file\
  \ path to fixed image for registration (example: 'C:\\path\\to\\folder\\fixed.nii.gz')\n\tmoving: file\
  \ path to moving image for registration (example: 'C:\\path\\to\\folder\\moving.nii.gz')\n\tparameter:\
  \ file path to parameter map .txt file (example: 'C:\\path\\to\\folder\\parameters.txt')\n\toutput:\
  \ file path to registered image (example: 'C:\\path\\to\\folder\\moving_registered.nii.gz')\n\n\tcommand\
  \ line usage:\n\tpython pre_process_tools.py register --f C:\\path\\to\\folder\\fixed.nii.gz' --m 'C:\\\
  path\\to\\folder\\moving.nii.gz' --p 'C:\\path\\to\\folder\\parameters.txt'--o 'C:\\path\\to\\folder\\\
  moving_registered.nii.gz'\n\n\n**segment(input, output, radius)**\n\t\n\tdescription:\n\tcreate a rough\
  \ body mask for MR/CBCT/CT image\n\n\targuments:\n\tinput: file path input image (example: 'C:\\path\\\
  to\\folder\\image.nii.gz')\n\toutput: file path mask (example: 'C:\\path\\to\\folder\\mask.nii.gz')\n\
  \tradius: currently not used (radius to fill holes in mask), default value =  (12,12,12)\n\n    command\
  \ line usage:\n\tpython pre_process_tools.py segment --i 'C:\\path\\to\\folder\\moving_registered.nii.gz'\
  \ --o 'C:\\path\\to\\folder\\moving_mask.nii.gz' \n\n**correct_mask_mr(mr,ct,transform,mask,mask_corrected)**\n\
  \n\tdescription:\n\tlimit the mask, generated with above segment function, to the MR FOV\n\n\targumnents:\n\
  \tmr: file path to mr (original unaltered mr image)\n\tct: file path to resampled ct\n\ttransform: path\
  \ to registration paramters which the register function saves in a file (*_parameters.txt)\n\tmask:\
  \ file path to mask generated by segment function\n\tmask_corrected: file path for corrected mask output\n\
  \n\tcommand line usage:\n\tnot yet implemented\n\n**mask_mr or mask_ct(input, mask_in, output)**\n\n\
  \tdescription:\n\tmask an image with provided mask (e.g. created by segment above). The background value\
  \ is -1000 for CT, and 0 for MRI.\n\n\targuments:\n\tinput: file path input image (example: 'C:\\path\\\
  to\\folder\\image.nii.gz')\n\tmask_in: file path to mask (example: 'C:\\path\\to\\folder\\mask.nii.gz')\n\
  \toutput: file path to masked image (example: 'C:\\path\\to\\folder\\image_masked.nii.gz')\n\n\n\n**crop(input,\
  \ mask_crop, output)**\n\n\tdescription:\n\tcrop an image with bounding box of mask image\n\n\targuments:\n\
  \tinput: file path input image (example: 'C:\\path\\to\\folder\\image.nii.gz')\n\tmask_crop: file path\
  \ to mask, used to calculate bounding box (example: 'C:\\path\\to\\folder\\mask.nii.gz')\n\toutput:\
  \ file path to cropped image (example: 'C:\\path\\to\\folder\\image_cropped.nii.gz')\n\n**generate_overview(input_path,ref_path,mask_path,output_path,title)**\n\
  \t\n\tdescription:\n\tgenerate a figure with CBCT/MR, CT and MASK to check pre-processing\n\n\targuments:\n\
  \tinput_path: path to pre-processed CBCT/MR\n\tref_path: path to pre-processed reference CT\n\tmask_path:\
  \ path to pre-processed mask\n\toutput_path: output path of figure file\n\ttitle: Title used in figure\n\
  \n\n**Other utilities**\n\nIn addition to the main functions above, following functions were used for\
  \ specific datasets and specifc anatomies:\n\n* limit_pixel_values: sets a fixed minimum value for all\
  \ voxels\n* clean_border: removes artifacts from the patient border\n* create_FOV_cbct: creates a FOV\
  \ ROI for cbcts\n* fix_fov_cbct_umcg: fixes the mask so the mask does not contain voxels outside the\
  \ FOV\n* transform_mask: Warps a mask from CBCT coordinatesto CT coordinate system\n* generate_mask_cbct:\
  \ combines many functions (including some of the above) to generate a final mask for cbcts\n\n<br/>\n\
  <br/>\n\n### Dicom tag extraction:\n\n**read_tags(input_txt)**\n\n\tdescription:\n\tread dicom tag strings\
  \ from a txt file\n\n\targuments:\n\tinput_txt: file path to text file containg dicom tags (see example\
  \ in param_files)\n\t\n\treturns: \n\tpython list containing dicom tags\n\n**extract_tags(dcm_folder_path,tag_list,pre_processed=None)**\n\
  \n\tdescription:\n\textracts tags from a folder containg dicom files (only from the first element) and\
  \ from pre-processed nifti images\n\n\targuments:\n\tdcm_folder_path: path to folder containing dicom\
  \ image slices\n\ttag_list: list defining which tags to extract\n\tpre_processed: path to pre-processed\
  \ nifti file (can be left out if tags should be only extracted from dicom files)\n\n\treturns:\n\tpython\
  \ dict with dicom tags as key:value pairs\n\n\n\n**write_dict_to_csv(input_dict,output_csv,tag_list)**\n\
  \n\tdescription:\n\ttakes a dict containing dicom tags and writes it to a csv file\n\n\targuments:\n\
  \tinput_dict: dict containing extracted tags\n\toutput_csv: filename of output csv file\n\ttag_list:\
  \ list of dicom tags, necessary to create header in csv file\n\n\n\n\n**write_csv_to_xlsx(input_csv,output_xlsx)**\n\
  \n\tdescription:\n\ttakes a csv and creates an xlsx file\n\n\targuments:\n\tinput_csv: path to csv file\n\
  \toutput_xlsx: filepath of output xlsx file\n\n<br/>\n\n<!-- ROADMAP -->\n## Roadmap\n\nSee the [open\
  \ issues](https://github.com/SynthRAD2023/preprocessing/issues) for a list of proposed features (and\
  \ known issues).\n\n<!-- CONTRIBUTING -->\n<br/>\n\n## Contributing\n\nContributions are what make the\

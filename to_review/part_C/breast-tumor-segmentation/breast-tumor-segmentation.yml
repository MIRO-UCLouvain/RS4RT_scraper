readme_excerpt: '# Breast Tumor Segmentation with Uncertainty Estimation


  Deep learning project focused on breast tumor segmentation in mammography images using convolutional
  neural networks and Monte Carlo Dropout uncertainty estimation.


  This repository contains the full experimental pipeline developed for a master''s capstone project,
  including preprocessing, model training, evaluation, visualization, and uncertainty analysis.


  ---


  # Project Overview


  Breast cancer is one of the most common cancers worldwide, and early detection through mammography is
  critical for improving patient outcomes. Accurate tumor segmentation can assist radiologists by highlighting
  suspicious regions and supporting computer-aided diagnosis systems.


  This project explores:


  * Semantic segmentation of breast masses in mammograms

  * ROI-based preprocessing strategies

  * U-Net and U-Net++ architectures

  * Multiple encoder backbones

  * Monte Carlo Dropout for uncertainty estimation

  * Pixel-wise uncertainty visualization

  * Quantitative and qualitative evaluation


  ---


  # Main Features


  * U-Net and U-Net++ segmentation architectures

  * ResNet34 and EfficientNet-B3 encoders

  * ROI cropping using lesion masks

  * BCE, Dice, and Focal loss combinations

  * Monte Carlo Dropout inference

  * Pixel-wise uncertainty maps

  * Dice and IoU evaluation metrics

  * Visualization of best/worst segmentation cases

  * Exported HTML notebooks for easy viewing


  ---


  # Dataset


  The project uses a curated subset of the CBIS-DDSM dataset:


  * CBIS-DDSM (Curated Breast Imaging Subset of DDSM)

  * Focus on mass lesion cases

  * PNG image conversion from original mammography scans


  Dataset source:


  * TCIA CBIS-DDSM

  * Kaggle PNG conversion dataset


  Due to dataset licensing and size limitations, the dataset is not included in this repository.


  ---


  # Repository Structure


  ```text

  breast-tumor-segmentation/

  │

  ├── notebooks/        # Jupyter notebooks

  ├── html/             # Exported HTML versions of notebooks

  ├── outputs/          # Example qualitative results and visualizations

  ├── README.md

  └── .gitignore

  ```


  ---


  # Methodology


  ## 1. Preprocessing


  * Patient-level train/validation/test split

  * ROI extraction using lesion bounding boxes

  * Image resizing

  * CLAHE and normalization experiments

  * Data augmentation using Albumentations


  ## 2. Model Training


  Experiments include:


  * U-Net

  * U-Net++

  * EfficientNet-B3 encoder

  * ResNet34 encoder


  Loss functions tested:


  * BCE Loss

  * Dice Loss

  * BCE + Dice

  * Focal + Dice


  ## 3. Uncertainty Estimation


  Monte Carlo Dropout was used during inference to estimate predictive uncertainty.


  The pipeline generates:


  * Mean prediction maps

  * Standard deviation uncertainty maps

  * Error vs uncertainty analysis

  * Reliability visualization


  ---


  # Results


  Main findings include:


  * ROI cropping produced the largest performance improvement

  * EfficientNet-B3 showed slightly better stability than ResNet34

  * Monte Carlo Dropout uncertainty correlated with segmentation errors

  * Uncertainty maps provided clinically interpretable information


  Example outputs include:


  * Segmentation overlays

  * Uncertainty heatmaps

  * Best vs worst predictions

  * Dice score distributions


  ---


  # Technologies Used


  * Python

  * PyTorch

  * segmentation_models_pytorch

  * Albumentations

  * OpenCV

  * NumPy

  * Matplotlib

  * Jupyter Notebook


  ---


  # How to Run


  ## 1. Clone the repository


  ```bash

  git clone https://github.com/ivancuevasortin/breast-tumor-segmentation.git

  cd breast-tumor-segmentation

  ```


  ## 2. Install dependencies


  ```bash

  pip install -r requirements.txt

  ```


  ## 3. Open notebooks


  ```bash

  jupyter notebook

  ```


  ---


  # Repository Contents


  The repository includes:


  * Training notebooks

  * Evaluation notebooks

  * Monte Carlo Dropout experiments

  * Visualization pipelines

  * HTML exported notebooks

  * Example qualitative outputs


  Large datasets and trained model weights are excluded from the repository.


  ---


  # Future Work


  Potential future improvements include:


  * Vision Transformer-based architectures

  * YOLO-based lesion localization

  * Deep ensembles

  * Larger multi-institutional datasets

  * Clinical calibration studies

  * Improved uncertainty calibration methods



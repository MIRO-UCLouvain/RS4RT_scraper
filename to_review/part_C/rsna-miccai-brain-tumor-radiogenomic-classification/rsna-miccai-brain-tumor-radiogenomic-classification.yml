readme_excerpt: "<div id = 'top'></div>\n\n# RSNA-MICCAI-brain-tumor-radiogenomic-classification \U0001F9E0\
  \n\n*this was part of a 2021 Kaggle competition held by Radiological Society of North America which\
  \ can be found <a href=\"https://www.kaggle.com/c/rsna-miccai-brain-tumor-radiogenomic-classification\"\
  >Here</a>*\n__________________________________________________________________________\n\n## Project\
  \ Abstract\n\n```\nThe RSNA-MICCAI brain tumor radiogenomic classification challenge aimed to predict\
  \ MGMT biomarker status in glioblastoma through binary classification on\n\nMulti parameter mpMRI scans:\
  \ T1w, T1wCE, T2w and FLAIR. The dataset is splitted into three main cohorts: training set, validation\
  \ set which were used during\n\ntraining , and the testing were only used during final evaluation. Images\
  \ were either in a DICOM format or in png format. different architectures were used\n\nto investigate\
  \ the problem including the 3D version of Vision Transformer (ViT3D), ResNet50, Xception and EfficientNet-b3.\
  \ AUC was used as the main\n\nevaluation metric and the results showed an advantage for both the ViT3D\
  \ and the Xception models achieving  0.6015 and 0.61745 respectively on the testing\n\nset. compared\
  \ to other results, our results proved to be valid given the complexity of the task. further improvements\
  \ can be made through exploring\n\ndifferent strategies, different architectures and more diverse datasets.\n\
  ```\n\n## Main Architectures \n<div id=\"arch\" align=\"center\">\n  \n|Architecture|Image|\n|--------------|-----|\n\
  |`ViT3D`|![ViT3D](https://github.com/MahmoudRabea13/RSNA-MICCAI-brain-tumor-radiogenomic-classification/blob/main/images/Vit-3d.png)|\n\
  |`ResNet50`|![ResNet](https://github.com/MahmoudRabea13/RSNA-MICCAI-brain-tumor-radiogenomic-classification/blob/main/images/ResNet50.png)|\n\
  |*`Xception`|![Xception](https://github.com/MahmoudRabea13/RSNA-MICCAI-brain-tumor-radiogenomic-classification/blob/main/images/image.png)|\n\
  |`EfficientNetB3`|![EfficientNetB3](https://github.com/MahmoudRabea13/RSNA-MICCAI-brain-tumor-radiogenomic-classification/blob/main/images/EfficientNet-B3.png)|\n\
  \n</div>\n\n## Results \n<div id=\"results\" align=\"center\">\n  \n*The following table contains the\
  \ best results obtained from each architectures* \n  \n|Architecture|Validation AUC|Testing AUC|\n|-----|-----|-----|\n\
  |`ViT3D`|0.5869|0.6015|\n|`ResNet50`|0.42099|0.58078|\n|***Xception**|***0.63827**|***0.61745**|\n|`EfficientNetB3`|0.37407|0.55817|\n\
  \n</div>\n\n\n<div id=\"team\">\n \n## Team Members\n\n* [Amr Mohamed](https://github.com/Amrmohamed090)\n\
  * [Mahmoud Rabea](https://github.com/MahmoudRabea13)\n* [Aya Sameh](https://github.com/Ayasameh1) \n\
  * [Ehab Kamal](https://github.com/EHVB) \n\n</div>\n\n\n## Acknowledgments\n\n```\nThe dataset for this\
  \ challenge has been collected from institutions around the world as part of a decade-long project to\
  \ advance the use of AI in brain tumor diagnosis and treatment, the Brain Tumor Segmentation (BraTS)\
  \ challenge. Running in parallel with this challenge, a challenge addressing segmentation represents\
  \ the culmination of this effort.\n\nA comprehensive description of the both tasks of the RSNA-MICCAI\
  \ Brain Tumor challenge can be found at: https://www.med.upenn.edu/cbica/brats2021/\nParticipants interested\
  \ in the segmentation task of this competition can find more info at: https://www.synapse.org/brats2021\n\
  ```\n\n\n<p align=\"right\"><a href=\"#top\">Back to top</a></p>\n"

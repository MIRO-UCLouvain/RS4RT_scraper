readme_excerpt: "# HERO for HECKTOR 2026\n\nHERO is a complete research pipeline for the HECKTOR 2026\
  \ Challenge covering three tightly coupled tasks:\n\n1. 3D tumor segmentation from PET/CT.\n2. TN staging\
  \ with T-stage and N-stage prediction.\n3. Prognosis modeling with relapse classification and relapse-free\
  \ survival risk estimation.\n\nThe repository is designed to start on `data/sample_5/` and switch automatically\
  \ to `data/hecktor2026_training/` once the full training set is available.\n\n![Sample PET/CT Slices\
  \ with Tumor Overlay](sample_slice_grid.png)\n\n## Core Methodology\n\nOur solution is built around\
  \ four principles:\n\n1. A multi-task network with a 3D UX-Net style encoder inside an nnU-Net style\
  \ workflow. The encoder uses large-kernel ConvNeXt-inspired 3D blocks plus channel attention to learn\
  \ PET/CT weighting directly from the fused image volume.\n2. Out-of-fold label noise reduction. A fast\
  \ 3D segmentation model is trained in 5-fold cross-validation, then original masks are compared against\
  \ OOF predictions to flag noisy cases and create a cleaned training index.\n3. Multi-modal fusion. Global\
  \ image features from the encoder bottleneck are fused with processed clinical features for TN staging\
  \ and prognosis modeling.\n4. T4-safe inference. Sliding-window inference and batch size 1 keep memory\
  \ usage compatible with practical competition hardware.\n\n## End-to-End Architecture\n\n```mermaid\n\
  flowchart LR\n    A[PET Volume] --> D[Fused PET/CT Input]\n    B[CT Volume] --> D\n    C[Clinical CSV]\
  \ --> H[Clinical Preprocessor]\n    D --> E[3D UX-Net Encoder<br/>Large-kernel ConvNeXt-style Blocks<br/>Channel\
  \ Attention]\n    E --> F[Segmentation Decoder]\n    F --> G[Task 1: 3D Tumor Mask]\n    E --> I[Global\
  \ Pooling]\n    H --> J[Staging Feature Fusion]\n    H --> K[Prognosis Feature Fusion]\n    I --> J\n\
  \    I --> K\n    J --> L[MLP Head]\n    L --> M[Task 2: T-stage / N-stage]\n    K --> N[MLP Head]\n\
  \    N --> O[Task 3: Relapse / RFS Risk]\n```\n\n## Repository Layout\n\n```text\nHERO/\n├── configs/\n\
  │   ├── common_config.yaml\n│   ├── step1_label_cleaning.yaml\n│   ├── step2_multitask.yaml\n│   └──\
  \ step3_inference.yaml\n├── hero/\n│   ├── data/\n│   ├── models/\n│   └── utils/\n├── pipeline/\n│\
  \   ├── step1_label_cleaning.py\n│   ├── step2_train_multitask.py\n│   └── step3_inference.py\n├── eda_images.py\n\
  ├── eda_clinical.py\n├── sample_slice_grid.png\n└── README.md\n```\n\n## Data Assumptions\n\n- Sample\
  \ image data: `data/sample_5/<PatientID>/`\n- Sample clinical table: `data/sample_5/HECKTOR_2026_training_data.csv`\n\
  - Full training data target: `data/hecktor2026_training/`\n\nEach patient folder is expected to contain:\n\
  \n- `<PatientID>__CT.nii.gz`\n- `<PatientID>__PT.nii.gz`\n- `<PatientID>.nii.gz` for the segmentation\
  \ mask\n\n## Clinical Processing\n\n`eda_clinical.py` performs:\n\n- kNN imputation for numerical missing\
  \ values such as tobacco, alcohol, and performance status.\n- Most-frequent imputation plus one-hot\
  \ encoding for categorical clinical variables.\n- Target encoding for T-stage and N-stage.\n- Export\
  \ of processed features and preprocessing artifacts to `outputs/clinical/`.\n\n## MONAI Transform Stack\n\
  \nThe transform implementation is in [hero/data/transforms.py](hero/data/transforms.py).\n\nThe sample\
  \ 5-case cohort is not isotropic:\n\n- In-plane spacing is approximately `0.98-1.17 mm`.\n- Slice spacing\
  \ varies from `1.5 mm` to `3.31 mm`.\n- The largest observed tumor bounding box in the sample subset\
  \ is about `57.6 x 46.9 x 67.5 mm`.\n\nBased on that, the pipeline uses:\n\n- `pixdim=(1.0, 1.0, 2.0)`\
  \ to reduce z-axis anisotropy without over-expanding memory.\n- `roi_size=(160, 160, 96)` which corresponds\
  \ to about `160 x 160 x 192 mm` after resampling, large enough to cover the observed tumor extent with\
  \ anatomical context.\n- `CropForegroundd` before cropping so the network focuses on the head-and-neck\
  \ field instead of empty air.\n- Training-time fixed-size crop for stable batch memory.\n- Validation-time\
  \ fixed-size crop for the multi-task heads.\n- Inference-time sliding-window segmentation on the foreground-cropped\
  \ volume, while staging/prognosis heads consume a center-cropped ROI tensor to stay T4-safe.\n\nThe\
  \ current training stack is:\n\n```python\nfrom monai.transforms import (\n    Compose,\n    CropForegroundd,\n\
  \    LoadImaged,\n    EnsureChannelFirstd,\n    EnsureTyped,\n    Orientationd,\n    Spacingd,\n   \
  \ CenterSpatialCropd,\n    SpatialPadd,\n    ScaleIntensityRangePercentilesd,\n)\n\ntrain_transforms\
  \ = Compose([\n    LoadImaged(keys=[\"image\", \"label\"]),\n    EnsureChannelFirstd(keys=[\"image\"\
  , \"label\"]),\n    EnsureTyped(keys=[\"image\", \"label\"]),\n    Orientationd(keys=[\"image\", \"\
  label\"], axcodes=\"RAS\"),\n    Spacingd(keys=[\"image\", \"label\"], pixdim=(1.0, 1.0, 2.0), mode=(\"\
  bilinear\", \"nearest\")),\n    ScaleIntensityRangePercentilesd(keys=\"image\", lower=0, upper=99.5,\
  \ b_min=0, b_max=1),\n    CropForegroundd(keys=[\"image\", \"label\"], source_key=\"image\", allow_smaller=True),\n\
  \    CenterSpatialCropd(keys=[\"image\", \"label\"], roi_size=(160, 160, 96)),\n    SpatialPadd(keys=[\"\
  image\", \"label\"], spatial_size=(160, 160, 96)),\n])\n```\n\nThe inference stack keeps the same spacing\
  \ and intensity normalization, but omits the fixed crop before segmentation so `SlidingWindowInferer`\
  \ can cover the full foreground volume.\n\n## User Manual\n\n### 1. Environment activation\n\nIf using\
  \ `venv`:\n\n```bash\nsource .venv/bin/activate\n```\n\nIf using Conda:\n\n```bash\nconda activate hero\n\
  ```\n\n### 2. Clone the repository and move into it\n\n```bash\ngit clone https://github.com/khkim1729/HERO.git\n\
  cd HERO\n```\n\n### 3. Run EDA\n\n```bash\npython eda_images.py --data-root data/sample_5 --output sample_slice_grid.png\n\
  python eda_clinical.py --clinical-csv data/sample_5/HECKTOR_2026_training_data.csv --output-dir outputs/clinical\n\
  ```\n\n### 4. Edit the configuration files\n\nThe repository now uses one global config plus one step-specific\
  \ config per pipeline stage:\n\n- `configs/common_config.yaml`: paths, random seed, runtime, device,\
  \ workers.\n- `configs/step1_label_cleaning.yaml`: label-cleaning model, spacing, ROI, folds, optimization.\n\
  - `configs/step2_multitask.yaml`: multi-task model, spacing, ROI, losses, optimization, metric plotting.\n\
  - `configs/step3_inference.yaml`: sliding-window inference and threshold settings.\n\nThis split is\
  \ intentional because step 1 and step 2 use different models and different experiment knobs. Keeping\
  \ one giant model config becomes hard to track once multiple segmentation backbones, fusion heads, or\
  \ inference settings are introduced.\n\nThe most common edits are:\n\n- `paths.data_root`, `paths.full_training_root`,\
  \ `paths.clinical_csv` in `configs/common_config.yaml`\n- `data.pixdim`, `data.roi_size`, `optimization.epochs`\
  \ in `configs/step1_label_cleaning.yaml`\n- `data.pixdim`, `data.roi_size`, `optimization.max_epochs`,\
  \ `losses.*` in `configs/step2_multitask.yaml`\n- `inference.overlap`, `inference.threshold` in `configs/step3_inference.yaml`\n\
  \n### 5. Run the 3-step pipeline\n\n```bash\npython pipeline/step1_label_cleaning.py --common-config\
  \ configs/common_config.yaml --step-config configs/step1_label_cleaning.yaml\npython pipeline/step2_train_multitask.py\
  \ --common-config configs/common_config.yaml --step-config configs/step2_multitask.yaml\npython pipeline/step3_inference.py\
  \ --common-config configs/common_config.yaml --step-config configs/step3_inference.yaml\n```\n\nFor\
  \ an explicit GPU selection sanity run:\n\n```bash\nCUDA_VISIBLE_DEVICES=2,3 python pipeline/step1_label_cleaning.py\
  \ --common-config configs/common_config.yaml --step-config configs/step1_label_cleaning.yaml\nCUDA_VISIBLE_DEVICES=2,3\
  \ python pipeline/step2_train_multitask.py --common-config configs/common_config.yaml --step-config\
  \ configs/step2_multitask.yaml\nCUDA_VISIBLE_DEVICES=2,3 python pipeline/step3_inference.py --common-config\
  \ configs/common_config.yaml --step-config configs/step3_inference.yaml\n```\n\n### 6. Checkpoint management\n\
  \nModel checkpoints are written into `checkpoints/` with metric-aware filenames. The implementation\
  \ uses:\n\n```text\nbest_model_epoch_{e}_dice_{d:.4f}_cindex_{c:.4f}.pth\n```\n\nThis follows the intended\
  \ convention of storing epoch and validation metrics in the filename, similar to `model_epoch_X_val_dice_Y_cindex_Z.pth`.\n\
  \n### 7. Outputs\n\n- EDA image: `sample_slice_grid.png`\n- Processed clinical tables: `outputs/clinical/`\n\
  - Cleaned label index: `outputs/cleaned_dataset_index.json`\n- Training history: `checkpoints/training_history.json`\n\
  - Training metric grid: `outputs/training/training_metrics_grid.png`\n- Inference masks: `outputs/inference/segmentation/*.nii.gz`\n\
  - Staging and prognosis table: `outputs/inference/staging_prognosis_predictions.csv`\n\n## Pipeline\
  \ Summary\n\n### Step 1. OOF label cleaning\n\n`pipeline/step1_label_cleaning.py` trains a fast 3D MONAI\
  \ UNet in 5-fold cross-validation, compares OOF predictions against original masks, and writes a cleaned\
  \ patient index.\n\n### Step 2. Multi-task training\n\n`pipeline/step2_train_multitask.py` trains a\
  \ shared 3D UX-Net style encoder with:\n\n- A decoder head for tumor segmentation.\n- A staging head\
  \ for T-stage and N-stage prediction using pooled image features plus partial clinical features.\n-\
  \ A prognosis head for relapse and RFS prediction using pooled image features plus the full processed\
  \ clinical vector.\n\n### Step 3. T4-safe inference\n\n`pipeline/step3_inference.py` runs sliding-window\
  \ inference with batch size 1, exports segmentation masks in NIfTI format, and writes task 2 and task\
  \ 3 predictions to CSV.\n\n## Competition Readiness Notes\n\n- The code is modular so stronger losses,\
  \ survival objectives, and ensembling can be added without changing the repository layout.\n- The data\
  \ discovery logic is config-driven and will use the full HECKTOR 2026 training directory automatically\
  \ when it becomes available.\n- The cleaned label index from step 1 is enforced during step 2 training\
  \ to reduce supervision noise.\n- The sample 5-case sanity run was executed end-to-end on GPU, producing\
  \ `outputs/cleaned_dataset_index.json`, `checkpoints/best_model_epoch_*.pth`, `outputs/training/training_metrics_grid.png`,\
  \ segmentation NIfTI files, and `outputs/inference/staging_prognosis_predictions.csv`.\n- Metrics on\
  \ the sample run are intentionally weak because the cleaned training subset contains only 4 cases after\
  \ OOF filtering; this run is for pipeline validation, not for meaningful model selection.\n"

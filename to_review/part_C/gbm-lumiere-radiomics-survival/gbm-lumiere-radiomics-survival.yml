readme_excerpt: "[![DOI](https://zenodo.org/badge/1107499481.svg)](https://doi.org/10.5281/zenodo.17818439)\n\
  \n\U0001F4D8 GBM-LUMIERE-Radiomics-Survival\n\n# Longitudinal FLAIR Radiomics and Survival in the LUMIERE\
  \ Cohort\n\n## \U0001F4C4 Commercial Case Study\n\nIndependent outcome-driven re-analysis of the LUMIERE\
  \ longitudinal glioblastoma cohort.\n\nDemonstrates conversion of longitudinal MRI radiomics into interpretable\
  \ prognostic biomarkers and patient risk stratification.\n\n➡ [Download Case Study PDF](case_study/CaseStudy1_LUMIERE_Longitudinal_GBM_Radiomics.pdf)\n\
  \n\n\n> **Longitudinal FLAIR Radiomics and Survival in the LUMIERE Cohort**\n\nbased on the public **LUMIERE**\
  \ dataset:\n\n- Yannick Suter (2022).  \n  *The LUMIERE Dataset: Longitudinal Glioblastoma MRI with\
  \ Expert RANO Evaluation.*  \n  Figshare. https://doi.org/10.6084/m9.figshare.c.5904905.v1\n\nThe main\
  \ goal is to build and evaluate parsimonious Cox proportional hazards models\nusing longitudinal FLAIR-derived\
  \ radiomics features and clinical variables, and to\nassess time-dependent discrimination and calibration\
  \ (C-index, Brier score, IBS).This repository demonstrates an independent outcome-driven survival modeling\
  \ framework for longitudinal imaging data.\n\n---\n\n## Repository structure\n\n```text\n.\n├── README.md\n\
  ├── LUMIERE-survival-report.Rmd     # Main R Markdown report\n├── scripts/\n│   ├── 01_preprocess_to_TD_FINAL.R\
  \ # From raw LUMIERE CSVs to survival-ready TD dataset\n│   ├── 02_run_survival_models.R    # Fits Cox\
  \ models and saves intermediate objects\n│   ├── 03_plot_results.R           # Generates figures (C-index,\
  \ Brier, KM, heatmaps)\n│   ├── 04_export_results.R         # (optional) Export summary tables, metrics\n\
  │   └── 05_render_report.R          # (optional) Renders the Rmd report programmatically\n├── data/\
  \                           # Raw and derived data (NOT tracked in Git)\n│   └── README_data.md    \
  \          # Instructions for obtaining the LUMIERE CSV files\n├── results/                        #\
  \ Auto-generated results (figures, RDS, CSV; Git-ignored)\n└── .gitignore\n\n    Important:\n    Raw\
  \ data and all derived CSV/RDS/PNG files are not tracked in this repository.\n    They are generated\
  \ on the fly by the scripts in scripts/.\n\nData availability\n\nThe original LUMIERE data are available\
  \ from Figshare:\n\n    https://doi.org/10.6084/m9.figshare.c.5904905.v1\n\nAfter downloading the CSV\
  \ files, place them into the data/ directory, e.g.:\n\ndata/\n  LUMIERE-Demographics_Pathology.csv\n\
  \  LUMIERE-ExpertRating-v202211.csv\n  LUMIERE-MRinfo.csv\n  LUMIERE-pyradiomics-deepbratumia-features.csv\n\
  \nThe survival-ready time-dependent dataset used in this report is:\n\ndata/LUMIERE_TD_FINAL.csv\n\n\
  This file is generated by the preprocessing script\nscripts/01_preprocess_to_TD_FINAL.R and therefore\
  \ is not tracked in Git.\nReproducible workflow\n\nOnce the raw LUMIERE CSV files are in data/, the\
  \ complete analysis can be\nreproduced using the following steps in R.\n1️⃣ Preprocessing: from raw\
  \ CSVs to survival-ready dataset\n\nsource(\"scripts/01_preprocess_to_TD_FINAL.R\")\n\nThis script produces:\n\
  \n    data/LUMIERE_TD_FINAL.csv: a time-dependent dataset with\n    Surv(start, stop, event) information,\
  \ clinical covariates, and radiomics features.\n\n2️⃣ Fit Cox models and save intermediate objects\n\
  \nsource(\"scripts/02_run_survival_models.R\")\n\nThis script:\n\n    Loads data/LUMIERE_TD_FINAL.csv\n\
  \n    Prepares a complete-case evaluation dataset\n\n    Fits:\n\n        model_final: Cox model on\
  \ the full TD dataset\n\n        model_cc: Cox model on complete cases\n\n    Computes:\n\n        Evaluation\
  \ times (quartiles of follow-up)\n\n        Time grids for C-index and Brier curves\n\n    Saves all\
  \ objects to results/ as .rds\n\n3️⃣ Generate all figures\n\nsource(\"scripts/03_plot_results.R\")\n\
  \nThis script:\n\n    Loads the .rds objects from results/\n\n    Produces all figures used in the report,\
  \ including:\n\n        Radiomics correlation heatmaps\n\n        Overall Kaplan–Meier survival curve\n\
  \n        KM curves by RANO response (Rating3)\n\n        Time-dependent C-index curves (apparent and\
  \ bootstrap .632)\n\n        Brier score / prediction error curves (apparent and bootstrap .632+)\n\n\
  \        Risk-group stratified KM curves based on the Cox linear predictor\n\n    Saves the figures\
  \ as .png files in results/.\n\n4️⃣ Render the R Markdown report (optional)\n\nYou can knit the Rmd\
  \ manually in RStudio, or use a wrapper script such as:\n\nrmarkdown::render(\"LUMIERE-survival-report.Rmd\"\
  )\n\nor\n\nsource(\"scripts/05_render_report.R\")\n\nSoftware requirements\n\n    R ≥ 4.3 (tested with\
  \ R 4.4+)\n\n    Suggested packages:\n\ninstall.packages(c(\n  \"tidyverse\",\n  \"stringr\",\n  \"\
  readr\",\n  \"survival\",\n  \"survminer\",\n  \"caret\",\n  \"pheatmap\",\n  \"corrplot\",\n  \"riskRegression\"\
  ,\n  \"pec\",\n  \"here\"\n))\n\nNotes on reproducibility\n\n    All analysis steps are scripted and\
  \ documented.\n\n    Raw data are not shipped in this repository due to size and licensing;\n    they\
  \ must be obtained from the original Figshare record.\n\n    All figures and metrics in the report can\
  \ be regenerated by running the\n    scripts described above.\n\n    Only source code and documentation\
  \ are version-controlled; all\n    auto-generated artifacts in results/ are intentionally excluded from\
  \ Git.\n\n\U0001F64C 9. Citation\n\nIf you use this repository in academic work, please cite:\n\nSarirchi\
  \ S. (2025). GBM-LUMIERE-Radiomics-Survival: \nTime-dependent survival modeling with longitudinal radiomics.\n\
  GitHub repository: https://github.com/somayehsarirchi/GBM-LUMIERE-Radiomics-Survival (https://doi.org/10.5281/zenodo.17818439)\n"

readme_excerpt: "# Constraint-Aware Molecular AI\n\nA **constraint-aware molecular generation system**\
  \ that integrates\nmachine-learned toxicity prediction, rule-based drug-likeness checks,\nsynthesizability\
  \ scoring, and agent-based decision making to propose\n**safe, drug-like, and synthesizable molecules**.\n\
  \nThis project demonstrates **system-level AI engineering** applied to\ncomputational chemistry and\
  \ drug discovery.\n\n---\n\n## \U0001F680 Key Features\n\n- **Toxicity Prediction (GNN)**\n  - Trained\
  \ Graph Neural Network on Tox21\n  - AUROC ≈ 0.77\n  - Multi-task toxicity classification\n\n- **Drug-Likeness\
  \ Constraint**\n  - QED (Quantitative Estimate of Drug-likeness)\n  - Lipinski Rule of Five compliance\n\
  \n- **Synthesizability Constraint**\n  - Synthetic Accessibility Score (SAS)\n  - Robust fallback when\
  \ fragment scores are unavailable\n\n- **Constraint-Aware Generation**\n  - Molecule generation → safety\
  \ filtering → multi-objective ranking\n  - Deduplication and decision logic via agents\n\n- **Modular\
  \ & Extensible Architecture**\n  - Easily add new constraints (stability, affinity, cost, etc.)\n  -\
  \ Ready for learned generators (RNN / Transformer / Diffusion)\n\n---\n\n## \U0001F9E0 System Overview\n\
  \nThe system follows a **multi-agent, constraint-aware pipeline**:\n\n1. A **Generator Agent** proposes\
  \ candidate molecules\n2. A **Toxicity Constraint** filters unsafe molecules using a trained GNN\n3.\
  \ A **Drug-Likeness Constraint** enforces chemical priors\n4. A **Synthesizability Constraint** ensures\
  \ real-world feasibility\n5. A **Decision Agent** ranks candidates via multi-objective scoring\n\n---\n\
  \n## \U0001F9E9 Architecture Diagram\n\n### High-Level Flow\n\n```text\n+-------------------+\n| Generator\
  \ Agent   |\n+---------+---------+\n          |\n          v\n+-------------------+\n| Toxicity Constraint|\n\
  | (GNN Predictor)   |\n+---------+---------+\n          |\n          v\n+-------------------+\n| Drug-Likeness\
  \     |\n| (QED + Lipinski)  |\n+---------+---------+\n          |\n          v\n+-------------------+\n\
  | Synthesizability  |\n| (SAS Constraint)  |\n+---------+---------+\n          |\n          v\n+-------------------+\n\
  | Decision Agent    |\n| (Multi-objective) |\n+---------+---------+\n          |\n          v\n+-------------------+\n\
  | Final Molecules   |\n+-------------------+\n"

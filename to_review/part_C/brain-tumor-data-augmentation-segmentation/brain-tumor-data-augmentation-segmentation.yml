readme_excerpt: "# Brain Tumor Data Augmentation — WGAN-GP + U-Net\n\n> A two-stage deep learning pipeline\
  \ for synthetic brain MRI data augmentation. A WGAN-GP generates realistic brain tumor images (FID 72.4),\
  \ and a U-Net automatically predicts segmentation masks for each generated image (Dice 0.845, IoU 0.735).\
  \ Trained the WGAN-GP for 1,500 epochs on 3,000 MRI images augmented to 9,000 samples, and the U-Net\
  \ for 20 epochs on 3,000 images augmented to 15,000 samples.\n\n---\n\n## Getting Started\n\n### 1 —\
  \ Clone the repository\n\n```bash\ngit clone https://github.com/MajdKhuzam/brain-tumor-data-augmentation-segmentation\n\
  cd brain-tumor-data-augmentation-segmentation\n```\n\n### 2 — Install dependencies\n\n- **Python** 3.10.12\n\
  \n| Package | Version | Purpose |\n|---|---|---|\n| `torch` | 2.10.0+cu128 | U-Net model and training\
  \ |\n| `torchvision` | 0.25.0+cu128 | Image transforms and utilities |\n| `torchsummary` | 1.5.1 | Model\
  \ architecture summary |\n| `tensorflow` | 2.19.0 | WGAN-GP model and training |\n| `numpy` | 2.2.6\
  \ | Array operations |\n| `pillow` | 12.1.0 | Image loading and saving |\n| `opencv-python` | 4.12.0\
  \ | Preprocessing and contour detection |\n| `matplotlib` | 3.10.7 | Visualisation and plot saving |\n\
  | `tqdm` | 4.67.1 | Training progress bars |\n\n```bash\npip install -r requirements.txt\n```\n\n###\
  \ 3 — Prepare the data\n\nDownload each dataset from Kaggle (see [Dataset](#dataset) section) and place\
  \ the files into the corresponding `data/` folder:\n\n**WGAN-GP:**\n```\nwgan_gp/\n└── data/\n    └──\
  \ *.jpg / *.png    # MRI images (no masks needed)\n```\n\n**U-Net:**\n```\nunet/\n└── data/\n    ├──\
  \ images/          # Brain MRI scans\n    └── masks/           # Corresponding binary tumor masks (same\
  \ filenames)\n```\n\n> The U-Net preprocessing step automatically crops each image to the bounding box\
  \ of its largest contour before training.\n\n---\n\n## Dataset\n\n| Model | Dataset | Link |\n|---|---|---|\n\
  | WGAN-GP | BraTS 2019 Train/Test/Valid | https://www.kaggle.com/datasets/aryanfelix/brats-2019-traintestvalid\
  \ |\n| U-Net | Brain Tumor Segmentation | https://www.kaggle.com/datasets/nikhilroxtomar/brain-tumor-segmentation\
  \ |\n\n---\n\n## Project Structure\n\n```\nproject/\n│\n├── wgan_gp/                  # Generative model\n\
  │   ├── config.py             # Paths, hyperparameters, training settings\n│   ├── data.py         \
  \      # Image loading, augmentation, tf.data pipeline\n│   ├── losses.py             # WGAN-GP losses\
  \ and gradient penalty\n│   ├── model.py              # Generator and Discriminator architectures\n\
  │   ├── train.py              # Per-step training functions and main loop\n│   ├── visualize.py    \
  \      # Sample saving and loss curve plotting\n│   ├── evaluation.py         # FID metric computation\
  \ for generated images\n│   └── run_train.py          # Entry point for WGAN-GP training\n│\n├── unet/\
  \                     # Segmentation model\n│   ├── config.py             # Paths, hyperparameters,\
  \ split ratios\n│   ├── preprocessing.py      # Bounding-box cropping of raw MRI images\n│   ├── dataset.py\
  \            # Dataset class, augmentation, DataLoader factory\n│   ├── model.py              # U-Net\
  \ architecture\n│   ├── train.py              # Training loop with best-checkpoint tracking\n│   ├──\
  \ utils.py              # Checkpoint I/O, Dice/IoU evaluation, image saving\n│   ├── evaluate.py   \
  \        # Loss curves, test-set evaluation, visualisation\n│   └── run_train.py          # Entry point\
  \ for U-Net training\n│\n├── inference.py              # Full pipeline: generate images → predict masks\n\
  ├── inference2.py             # Full pipeline but inference WGAN-GP using .h5 weights\n├── requirements.txt\n\
  └── README.md\n```\n\n---\n\n## Pipeline Overview\n\n```\nRandom Noise (z)\n      │\n      ▼\n ┌──────────┐\
  \      Synthetic Tumored MRI Images\n │ WGAN-GP  │ ──────────────────────────────────┐\n │ Generator│\
  \                                   │\n └──────────┘                                   ▼\n         \
  \                                 ┌──────────┐\n                                          │  U-Net \
  \  │ ──► Tumor Segmentation Mask\n                                          │ (frozen) │\n         \
  \                                 └──────────┘\n```\n\n1. **WGAN-GP** is trained on real brain tumor\
  \ MRI images to learn the data distribution and generate synthetic tumored images.\n2. **U-Net** is\
  \ trained on real images paired with ground-truth tumor masks.\n3. **Inference** uses the trained generator\
  \ to produce new synthetic MRI images, then runs the U-Net to predict a tumor mask for each one — creating\
  \ augmented (image, mask) pairs ready for downstream training.\n\n---\n\n## Models\n\n### WGAN-GP —\
  \ Generator & Discriminator (TensorFlow / Keras)\n\nThe **Generator** maps a latent vector to a 128×128\
  \ grayscale image:\n\n| Layer | Output shape |\n|---|---|\n| Dense + Reshape | 4 × 4 × 512 |\n| ConvTranspose\
  \ × 5 (stride 2) | 8→16→32→64→128 |\n| LayerNormalization + ReLU (×4) | — |\n| Conv2DTranspose + Tanh\
  \ (output) | 128 × 128 × 1 |\n\nThe **Discriminator (Critic)** classifies real vs. fake images:\n\n\
  | Layer | Output shape |\n|---|---|\n| Conv2D × 4 (stride 2) | 64→32→16→8 |\n| LeakyReLU(0.2) after\
  \ each | — |\n| Flatten + Dense(1) | scalar score |\n\n> No normalisation layers in the discriminator\
  \ — required by WGAN-GP.\n\n### U-Net — Segmentation (PyTorch)\n\nStandard encoder–decoder with skip\
  \ connections:\n\n- **Encoder**: 4 × DoubleConv blocks (32 → 64 → 128 → 256) + MaxPool\n- **Bottleneck**:\
  \ DoubleConv (512 channels)\n- **Decoder**: 4 × ConvTranspose2d + DoubleConv blocks with skip concatenation\n\
  - **Output**: 1×1 Conv → binary mask logit\n\nEach DoubleConv block applies `Conv2d → BatchNorm2d →\
  \ ReLU` twice.\n\n---\n\n## Training\n\n### 1 — Train WGAN-GP\n\n```bash\ncd wgan_gp\npython run_train.py\n\
  ```\n\nCheckpoints and sample image grids are saved to `output/` every `SAMPLE_EVERY` epochs.\n\n###\
  \ 2 — Train U-Net\n\n```bash\ncd unet\npython run_train.py\n```\n\nThe best checkpoint (by (Dice + IoU)\
  \ / 2) is saved to `output/best_model.pth.tar`.\n\n---\n\n## Inference\n\nRun the full pipeline to generate\
  \ synthetic images and predict their masks:\n\n```bash\npython inference.py [OPTIONS]\n```\n\n| Argument\
  \ | Default | Description |\n|---|---|---|\n| `--num-images` | 5 | Number of images to generate |\n\
  | `--generator-path` | auto | Path to `.keras` generator model |\n| `--unet-path` | auto | Path to U-Net\
  \ `.pth.tar` checkpoint |\n| `--output-dir` | `inference_output/` | Where to save results |\n| `--threshold`\
  \ | 0.5 | Mask binarisation threshold |\n| `--seed` | None | Random seed for reproducibility |\n\nResults\
  \ are saved as paired `generated_XXXX.png` / `mask_XXXX.png` files and visualised in a matplotlib window.\n\
  \n---\n\n## Configuration\n\n### WGAN-GP (`wgan_gp/config.py`)\n\n| Parameter | Default | Description\
  \ |\n|---|---|---|\n| `IMG_HEIGHT / IMG_WIDTH` | 128 | Generated image resolution |\n| `LATENT_DIM`\
  \ | 128 | Noise vector size |\n| `BATCH_SIZE` | 64 | Training batch size |\n| `EPOCHS` | 1500 | Total\
  \ training epochs |\n| `N_CRITIC` | 5 | Discriminator steps per generator step |\n| `LAMBDA_GP` | 10\
  \ | Gradient penalty weight |\n| `LR_G / LR_D` | 1e-4 | Adam learning rates |\n| `AUGMENTATION_FACTOR`\
  \ | 1 | Augmented copies per original image |\n| `SAMPLE_EVERY` | 25 | Save image grid every N epochs\
  \ |\n\n### U-Net (`unet/config.py`)\n\n| Parameter | Default | Description |\n|---|---|---|\n| `IMAGE_SIZE`\
  \ | 128 | Input resolution |\n| `BATCH_SIZE` | 32 | Training batch size |\n| `LEARNING_RATE` | 1e-4\
  \ | Adam learning rate |\n| `NUM_EPOCHS` | 20 | Total training epochs |\n| `NUM_AUG` | 5 | Augmented\
  \ copies per training image |\n| `VAL_SIZE / TEST_SIZE` | 0.15 | Validation and test split ratios |\n\
  \n---\n\n## Outputs\n\n| Path | Description |\n|---|---|\n| `wgan_gp/output/generator_model_final.keras`\
  \ | Final trained generator |\n| `wgan_gp/output/generated_epoch_XXXX.png` | Sample grids during training\
  \ |\n| `unet/output/best_model.pth.tar` | Best U-Net checkpoint |\n| `unet/output/{train,val}_losses.npy`\
  \ | Loss history arrays |\n| `unet/output/{dice,iou}_scores.npy` | Metric history arrays |\n| `inference_output/generated_XXXX.png`\
  \ | Synthetic MRI images |\n| `inference_output/mask_XXXX.png` | Predicted tumor masks |\n\n---\n\n\
  ## Notes\n\n- The WGAN-GP generator outputs images in [-1, 1] range; these are converted to [0, 255]\
  \ for display and saved as grayscale PNGs.\n- The U-Net expects input in [0, 1] range (no additional\
  \ normalization).\n- Both models use 128×128 grayscale images with a single channel.\n- Checkpoints\
  \ are saved automatically during training; inference auto-detects the latest weights.\n"

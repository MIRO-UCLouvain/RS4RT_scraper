  CBCT Metal Artifact Reduction with ToothFairy Dataset

  The processed data subset utilized in this study is a derivative of the publicly available ToothFairy
  dataset  \url{https://ditto.ing.unimore.it/toothfairy/}. The specific curated 2D slices and partitions
  generated for this research are available for reproducibility purposes. Original raw volumetric scans
  remain the property of the ToothFairy challenge organizers.


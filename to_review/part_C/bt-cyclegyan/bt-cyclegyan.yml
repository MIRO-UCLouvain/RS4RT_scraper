readme_excerpt: '# BT-CycleGyan

  # BT-CycleGAN: Brain Trauma–Aware MRI to Synthetic CT Generation


  This repository contains the official implementation of **BT-CycleGAN**, a trauma-aware

  CycleGAN framework for generating quantitatively reliable synthetic CT images from MRI.


  ## Key Contributions

  - Trauma-aware ROI-constrained MRI→CT synthesis

  - Hounsfield Unit (HU) consistency loss

  - Structural similarity (SSIM) preservation

  - Unpaired training using MRI (IXI) and CT (CQ500) datasets


  ## Datasets

  - IXI Brain MRI Dataset

  - CQ500 Head CT Dataset


  ## Training

  bash scripts/train.sh


  ## Evaluation

  bash scripts/evaluate.sh


  ## Outputs

  - Synthetic CT images

  - HU error heatmaps

  - ROI-based performance metrics

  - Ablation study results



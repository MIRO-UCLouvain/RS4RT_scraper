readme_excerpt: "# \U0001F4CB Cadastro de Participantes - Evento em Natal/RN\n\nEste é um projeto freelancer\
  \ desenvolvido para um evento realizado na capital do Rio Grande do Norte (Natal/RN), o SBRC 45 anos.\
  \  \nO sistema permite o **cadastramento rápido e organizado de participantes** através do CPF, exibindo\
  \ seus dados e permitindo a **impressão imediata das informações**.\n\n---\n\n## \U0001F680 Como rodar\
  \ o projeto?\n\nPara buildar o projeto, digite no terminal:\n\n```\nnpm run build\n```\n\nPara rodar\
  \ a aplicação, digite no terminal:\n\n```\nnpm run dev\n```\n\n## \U0001F680 Tecnologias Utilizadas\n\
  \nO projeto foi desenvolvido utilizando tecnologias modernas do ecossistema JavaScript:\n\n- **[TypeScript](https://www.typescriptlang.org/)**\
  \ – Superset do JavaScript para tipagem estática\n- **[Next.js 15 (App Router)](https://nextjs.org/)**\
  \ – Framework fullstack para React\n- **[React 18](https://react.dev/)** – Biblioteca principal de construção\
  \ de interfaces\n- **[Tailwind](https://tailwindcss.com/)** – Biblioteca de componentes para UI com\
  \ foco em acessibilidade e produtividade\n- **[Framer Motion](https://www.framer.com/motion/)** – Animações\
  \ suaves e performáticas\n"

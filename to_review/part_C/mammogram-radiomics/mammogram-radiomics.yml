readme_excerpt: "# Mammogram Radiomics Pipeline\n\nA Radiomics workflow for extracting quantitative imaging\
  \ features from mammography images (CBIS-DDSM) using PyRadiomics. The current goal is to account for\
  \ breast-tissue density variations and to build a reproducible PyRadiomics pipeline for future machine-learning\
  \ experiments.\n\nWhy This Matters ⁉️\n\nBreast density can distort texture and intensity patterns,\
  \ making radiomic features less stable. Analyzing how these variations arise is important for developing\
  \ ML models that remain reliable across patients with different tissue compositions.\n\n\U0001F52C Overview\n\
  \nThis project sets up a basic radiomics pipeline that:\n\n    •    loads mammography images and lesion\
  \ ROI masks\n    \n    •    extracts first-order, texture, and shape features using a YAML config\n\
  \    \n    •    filters cases by BI-RADS breast density\n    \n    •    produces a feature table for\
  \ downstream ML analysis\n\n\U0001F9EC Why Radiomics?\n\nRadiomics converts medical images into thousands\
  \ of quantitative features describing:\n\n    •    Intensity patterns (first-order statistics)\n   \
  \ \n    •    Texture (GLCM, GLRLM, GLSZM, NGTDM, GLDM)\n    \n    •    Shape descriptors\n\nThese features\
  \ can capture subtle patterns not visible to the human eye and help build ML models for classification,\
  \ prognosis, or state-transition modeling.\n\nRepository Structure: \n\nconfig/\ndata/images/\ndata/masks/\n\
  \nscripts/\n    extract_features.py\n    filter_by_birads.py\n    \nresults/\n\nrequirements.txt\n\n\
  Usage\n\nInstall dependencies:\n\npip install -r requirements.txt\n\n\U0001F50D Limitations\n\nTo maintain\
  \ licensing and file-size constraints:\n\n    •    Mammography images are not included\n    \n    •    Repository\
  \ focuses on pipeline structure, not dataset distribution\n"

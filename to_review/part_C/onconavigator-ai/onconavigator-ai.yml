readme_excerpt: "# \U0001F9E0 OncoNavigator AI\n\n### AI-Powered Healthcare Intelligence Platform\n\n\
  > ⚠️ **Demo & Research-Oriented Project**\n>\n> OncoNavigator AI is a healthcare AI system that combines\
  \ custom-built Deep Learning models, Retrieval-Augmented Generation (RAG), and Agentic AI into a unified\
  \ end-to-end workflow.\n>\n> It is designed for educational and portfolio purposes and is not intended\
  \ for clinical or medical diagnosis use.\n\n---\n\n# \U0001F310 Live Deployment\n\n- **Frontend (Netlify):**\
  \ https://onconavigator-ai.netlify.app/  \n- **Backend (Railway):** https://onconavigator-ai-production.up.railway.app/\
  \  \n- **API Docs:** https://onconavigator-ai-production.up.railway.app/docs  \n\n---\n\n# \U0001F9E0\
  \ Project Overview\n\nOncoNavigator AI is an end-to-end healthcare intelligence platform that enables:\n\
  \n- Brain tumor detection from MRI scans  \n- Tumor classification into 4 categories  \n- Tumor segmentation\
  \ (if tumor is detected)  \n- Medical information generation  \n- Healthcare recommendation system \
  \ \n- AI-powered medical chatbot  \n\nIt combines **medical imaging + AI reasoning + healthcare assistance**\
  \ into one system.\n\n---\n\n# \U0001F501 System Flow\n\n1. User uploads MRI image  \n2. CNN model predicts\
  \ tumor class:\n   - Glioma  \n   - Meningioma  \n   - Pituitary Tumor  \n   - No Tumor  \n\n3. If tumor\
  \ is detected:\n   - Segmentation model generates tumor mask  \n   - Tumor region is highlighted  \n\
  \n4. Medical information is generated for the tumor  \n\n5. Healthcare agent activates:\n   - Finds\
  \ nearby doctors  \n   - Suggests specialists  \n   - Recommends hospitals  \n\n6. Chatbot module:\n\
  \   - Medical Q&A system  \n   - RAG-based responses  \n\n---\n\n# ✨ Key Features\n\n## \U0001F52C Tumor\
  \ Classification (Custom CNN)\n- Built from scratch using CNN architecture  \n- 4-class classification\
  \ only:\n  - Glioma\n  - Meningioma\n  - Pituitary Tumor\n  - No Tumor\n- Confidence score output  \n\
  - Optimized preprocessing pipeline  \n\n---\n\n## \U0001F3AF Tumor Segmentation\n- U-Net based segmentation\
  \ model  \n- Activated only when tumor is detected  \n- Generates pixel-level tumor mask  \n- Highlights\
  \ tumor region visually  \n\n---\n\n## \U0001F4DA Medical Information Module\n- Tumor-related explanations\
  \  \n- Symptoms overview  \n- Awareness and educational content  \n\n---\n\n## \U0001F3E5 Healthcare\
  \ Recommendation Agent\n- Finds nearby doctors  \n- Suggests specialists:\n  - Oncologists  \n  - Neurologists\
  \  \n  - Neurosurgeons  \n- Hospital recommendations based on location  \n\n---\n\n## \U0001F4AC Medical\
  \ Chatbot (RAG System)\n- Built using:\n  - Groq LLM API  \n  - LangChain  \n  - ChromaDB  \n- Answers\
  \ medical queries  \n- Context-aware responses  \n\n---\n\n# \U0001F6E0️ Tech Stack\n\n## \U0001F9E0\
  \ AI / Machine Learning\n- Custom CNN (PyTorch)\n- OpenCV\n- NumPy\n- Pandas\n\n---\n\n## \U0001F4AC\
  \ RAG & Agentic AI\n- Groq API (LLM inference)\n- LangChain (workflow orchestration)\n- ChromaDB (vector\
  \ database for retrieval)\n\n---\n\n## ⚙️ Backend\n- FastAPI\n- Python\n- REST API architecture\n- Image\
  \ preprocessing pipelines\n\n---\n\n## \U0001F3A8 Frontend\n- React.js\n- Raw CSS (no UI frameworks)\n\
  - Axios for API communication\n- Responsive UI design\n\n---\n\n## \U0001F680 Deployment\n- Netlify\
  \ (Frontend)\n- Railway (Backend)\n\n---\n\n# \U0001F680 Deployment Links\n\n- \U0001F310 Frontend:\
  \ https://onconavigator-ai.netlify.app/  \n- ⚙️ Backend: https://onconavigator-ai-production.up.railway.app/\
  \  \n- \U0001F4C4 API Docs: https://onconavigator-ai-production.up.railway.app/docs  \n\n---\n\n# \U0001F504\
  \ Project Status\n\nOncoNavigator AI is a **fully deployed and working system**, but it is under **active\
  \ improvement and continuous development**.\n\nWe are actively improving across all layers:\n\n### \U0001F9E0\
  \ AI Models\n- Improving CNN accuracy\n- Better generalization on MRI scans\n- Improving segmentation\
  \ mask precision\n\n### \U0001F4DA RAG System\n- Better retrieval quality from ChromaDB\n- More accurate\
  \ medical responses\n- Reduced hallucination rate\n\n### \U0001F3E5 Healthcare Agent\n- Improved doctor\
  \ recommendation accuracy\n- Better hospital ranking system\n- Smarter location-based filtering\n\n\
  ### \U0001F4AC Chatbot\n- Better contextual responses\n- Improved reasoning using Groq + LangChain\n\
  \n### \U0001F3A8 Frontend\n- UI/UX improvements\n- Better responsiveness\n- Smoother user experience\n\
  \n---\n\n# ⚠️ Limitations\n\n- Not a medical diagnostic system  \n- Predictions are not clinically validated\
  \  \n- Segmentation is approximate  \n- Recommendations are informational only  \n- Chatbot responses\
  \ should be verified  \n\n---\n\n# \U0001F52E Future Enhancements\n\n- Multi-modal inputs (reports +\
  \ MRI scans)  \n- Clinical report generation  \n- Explainable AI visualizations  \n- User authentication\
  \ system  \n- Multi-language support  \n- Advanced hospital API integration  \n\n---\n\n# ⚠️ Medical\
  \ Disclaimer\n\nThis system is for **educational and research purposes only**.\n\nIt does NOT provide\
  \ medical advice and must not be used as a substitute for professional healthcare consultation.\n\n\
  ---\n\n# \U0001F31F Vision\n\nOncoNavigator AI aims to build a unified healthcare intelligence system\
  \ that integrates:\n\n- Medical image understanding  \n- AI-powered knowledge retrieval  \n- Intelligent\
  \ healthcare recommendations  \n- Conversational AI assistance  \n\ninto a continuously improving ecosystem\
  \ for better healthcare awareness and assistance.\n"

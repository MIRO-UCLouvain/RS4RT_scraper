readme_excerpt: "# DVHOST VirBack\n\nA lightweight CLI tool to automate MySQL database backups from multiple\
  \ **Virtualizor** servers and send them directly to a **Telegram bot**.\n\n\U0001F4E6 Repository: [github.com/dev-ir/DVHOST-VirBack](https://github.com/dev-ir/DVHOST-VirBack)\n\
  \n---\n\n## ✅ Features\n\n- Auto-detect Virtualizor MySQL credentials from `universal.php`\n- Schedule\
  \ backups for multiple servers\n- Store backups in `/DVHOST_Backup/`\n- Send backups via Telegram (Bot\
  \ Token & Chat ID)\n- Cron integration with adjustable interval (2–24 hours)\n- Interactive CLI menu:\n\
  \  - Add new server\n  - List and manage configured servers\n  - Edit or remove backup jobs\n\n---\n\
  \n## ⚙️ Requirements\n\n- `bash`, `jq`, `curl`, `mysqldump`, `crontab`\n- A Telegram bot + Chat ID\n\
  \n---\n\n## \U0001F680 How to Use\n\n```bash\nsudo bash dvhost_virback.sh\n"

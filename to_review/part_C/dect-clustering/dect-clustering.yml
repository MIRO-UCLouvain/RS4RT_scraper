readme_excerpt: "# Tumor analysis on spectral images\n\nThe aim of this project is to perform an unsupervised\
  \ clustering of Dual-Energy Computed Tomography (DECT) scans in order to observe separation of tumor\
  \ tissues or organ anatomical regions with dedicated cluster regions.  \n\nThe user can refer to our\
  \ paper explaining the proposed methods coded in this repository:  \n**\"DECT-CLUST: Dual-Energy CT\
  \ Image Clustering and Application to Head and Neck Squamous Cell Carcinoma Segmentation\"** available\
  \ at doi: https://doi.org/10.3390/diagnostics12123072\n\nThe codes are written by Faicel Chamroukhi\
  \ and Ségolène Brivet (segolene.brivet@gmail.com).\n\n> Pseudo-codes are also provided in `pseudo-codes.pdf`.\n\
  \n### Environment\nThis project is developed in Matlab.  \nA remote GPU machine was used for heavy computations.\n\
  \n\n### Data\nDECT are 4D data: a 3D body volume over a range of X-ray energy levels.  \n*Data are not\
  \ sharable, so the data folder in this repo is empty and need to be filled on local machines.*  \n\n\
  \n### Method\nThe unsupervised clustering algorithm is based on mixtures-of-experts models, we integrate\
  \ spatial context in mixture weights, and construct mixture component densities upon the spectral energy\
  \ decay curves as functional observations. A dedicated expectation-maximization (EM) algorithm is written\
  \ to estimate the joint maximum likelihood of the model parameters.\n\nThe clustering algorithm is an\
  \ extension from Faicel Chamroukhi repository:  \nCurve clustering with the MixFRHLP model and the EM\
  \ (or a CEM-like) algorithm  \nhttps://github.com/fchamroukhi/mixRHLP_m  \n\n\n\n### 1. Image preparation\n\
  (Optional)\nSepcific to our data, we pre-process DICOM files in this step.  \n\nIn `dataset_builder`\
  \ folder, a large section around tumors is cropped from DECT scans, as well as its ground truth segmentation,\
  \ and the two are saved as .mat files in `data_tumor` folder.  \n\n\n### 2. Clustering\nIn `clustering`\
  \ folder, `main.m` script:\n- loads a 4D-image file (.mat) and its associated 3D ground truth segmentation\
  \ (.mat), \n- learn image clustering models with different tunable options,\n- post-process clustering\
  \ results and plot visualizations,\n\n`build_cluster_separ_indx` script:\n- computes metrics to assess\
  \ the clustering quality,\n\n`build_results_tables` script:\n- compiles previously computed metrics\
  \ from different methods,\n\n`build_results_analysis` script:\n- outputs and plots statistical comparative\
  \ analysis (e.g. t-test, boxplots)\n\n"

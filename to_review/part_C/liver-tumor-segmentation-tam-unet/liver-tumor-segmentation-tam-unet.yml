readme_excerpt: "# TAM-U-Net: Tumor Attention Module for Liver Tumor Segmentation\n\nDeep learning framework\
  \ for **liver tumor segmentation** using a modified U-Net architecture enhanced with a **Tumor Attention\
  \ Module (TAM)**.\n\nThis project compares a standard **U-Net baseline** with a proposed **TAM-U-Net\
  \ architecture** to evaluate whether tumor-focused attention improves segmentation performance.\n\n\n\
  \n## Project Overview\n\nLiver tumor segmentation is an important task in medical image analysis for\
  \ assisting radiologists in diagnosis and treatment planning.\n\nThis project implements:\n\n- Baseline\
  \ **U-Net segmentation model**\n- **TAM-U-Net**, a modified architecture introducing a **Tumor Attention\
  \ Module**\n- Training and evaluation pipeline\n- Visualization tools\n- Comprehensive segmentation\
  \ metrics\n\nThe goal is to evaluate whether tumor-focused attention improves segmentation accuracy.\n\
  \n## Dataset\n\nThis project uses the **Liver Tumor Segmentation (LiTS) Dataset**, which contains abdominal\
  \ CT scans with corresponding liver and tumor segmentation masks.\n\nThe dataset is not included in\
  \ this repository due to its large size (~30GB).\n\nThe dataset used in this project was accessed through\
  \ Kaggle:\n\nhttps://www.kaggle.com/datasets/andrewmvd/liver-tumor-segmentation\n\nOriginally, the dataset\
  \ comes from the **LiTS (Liver Tumor Segmentation) Challenge**, a benchmark dataset widely used in medical\
  \ image segmentation research.\n\nAfter downloading the dataset, place the processed files in the following\
  \ structure:\n\ndata/\n└── raw\n\nAfter downloading, the folder structure should look similar to:\n\n\
  data/raw/\n├── volume_pt1\n├── volume_pt2\n├── volume_pt3\n├── volume_pt4\n├── volume_pt5\n└── segmentations\n\
  \n## Architecture\n\n### Baseline Model\n\nA standard **U-Net architecture** used for biomedical image\
  \ segmentation.\n\n### Proposed Model: TAM-U-Net\n\nTAM-U-Net introduces a **Tumor Attention Module\
  \ (TAM)** designed to enhance feature representations around tumor regions.\n\nThe module helps the\
  \ network to:\n\n- focus on tumor-relevant regions\n- suppress background noise\n- improve segmentation\
  \ boundaries\n\n\n\n## Project Structure\n\n```\nLiver-Tumor-Segmentation-TAM-UNet/\n│\n├── data/\n\
  │   ├── raw/\n│   │   ├── volume_pt1\n│   │   ├── volume_pt2\n│   │   ├── volume_pt3\n│   │   ├── volume_pt4\n\
  │   │   ├── volume_pt5\n│   │   └── segmentations\n│   │\n│   ├── interim/\n│   │   ├── train\n│   │\
  \   ├── val\n│   │   └── test\n│   │\n│   └── processed/\n│       ├── images\n│       └── masks\n│\n\
  ├── src/\n│   ├── dataset/\n│   ├── preprocessing/\n│   ├── training/\n│   │   └── train.py\n│   ├──\
  \ evaluation/\n│   │   └── run_full_evaluation.py\n│   ├── inference/\n│   ├── explainability/\n│  \
  \ └── models/\n│       ├── unet_baseline.py\n│       └── tam_unet.py\n│\n├── outputs/\n│   ├── metrics/\n\
  │   └── plots/\n│\n├── experiments/\n├── models/\n│\n├── train.py\n├── inference.py\n├── preprocess.py\n\
  ├── requirements.txt\n└── README.md\n```\n\n\n\n## Training\n\nTo train the models run:\n\n```\npython\
  \ -m src.training.train\n```\n\nThis will train both the **Baseline U-Net** and **TAM-U-Net** models.\n\
  \n\n\n## Evaluation\n\nRun the evaluation pipeline:\n```\npython -m src.evaluation.run_full_evaluation\n\
  ```\n\nThis script:\n\n- loads trained models\n- runs inference on the dataset\n- computes segmentation\
  \ metrics\n- generates comparison plots\n\n\n\n## Evaluation Metrics\n\nThe following metrics are computed.\n\
  \n### Classical Metrics\n\n- Precision\n- Recall\n- F1 Score\n- Accuracy\n- Intersection over Union\
  \ (IoU)\n- Dice Score\n\n### Medical Segmentation Metrics\n\n- Mean Dice per Slice\n- Hausdorff Distance\n\
  - Surface Dice\n\n\n\n## Results\n\n| Model | Precision | Recall | F1 Score | IoU | Dice |\n|------|------|------|------|------|------|\n\
  | Baseline U-Net | 0.9249 | 0.9411 | 0.9329 | 0.8742 | 0.9329 |\n| TAM-U-Net | 0.9170 | 0.9574 | 0.9368\
  \ | 0.8811 | 0.9368 |\n\nThe **TAM-U-Net model shows slight improvements in recall and IoU**, indicating\
  \ better tumor region detection.\n\n\n## Visualizations\n\nThe evaluation pipeline generates:\n\n- Dice\
  \ comparison chart\n- Confusion matrices\n- ROC curve\n- Precision–Recall curve\n\nAll plots are saved\
  \ in:\n```\noutputs/plots/\n```\n\n\n\n## Example Prediction\n\nThe model predicts tumor regions from\
  \ CT slices.\n\nExample outputs include:\n\n- Input CT image\n- Ground truth mask\n- Predicted tumor\
  \ segmentation\n\n\n\n## Research Direction\n\nThis project is part of ongoing experimentation in **medical\
  \ image segmentation using deep learning and attention mechanisms**. Future work may extend this project\
  \ into a **research publication or journal paper**.\n\n\n\n## Author\n\n**Arjun Khimta**  \nB.Tech Computer\
  \ Science\n\n\n\n## Acknowledgements\n\nThis project was developed as part of experimentation in **deep\
  \ learning for medical image segmentation**.\n"

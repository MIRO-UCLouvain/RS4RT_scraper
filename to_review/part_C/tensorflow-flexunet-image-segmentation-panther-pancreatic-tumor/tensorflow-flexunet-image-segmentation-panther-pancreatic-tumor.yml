readme_excerpt: "<h2>TensorFlow-FlexUNet-Image-Segmentation-PANTHER-Pancreatic-Tumor (2026/07/17)</h2>\n\
  Sarah T.  Arai<br>\nSoftware Laboratory antillia.com<br><br>\nThis is the first experiment of Image\
  \ Segmentation for <b>PANTHER-Pancreatic-Tumor</b> based on our <a href=\"https://github.com/sarah-antillia/TensorFlow-FlexUNet-Image-Segmentation-Model\"\
  >\nTensorFlow-FlexUNet-Image-Segmentation-Model</a> \n(TensorFlow Flexible UNet Image Segmentation Model\
  \ for Multiclass) , \nand a  320x260 pixels PNG\n<a href=\"https://drive.google.com/file/d/1ABo4qUdKcn7fXVr9b2ooYTIukol9DIxw/view?usp=sharing\"\
  >\n<b>PANTHER-Pancreatic-Tumor-ImageMask-Dataset.zip</b></a> with colorized masks \n(<a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/\"\
  >CC-BY-NC-SA 4.0</a>),\n which was derived by us from <br><br>\n<a href=\"https://www.kaggle.com/datasets/stevenchen116/panther-challenge-datasets/data\"\
  >\n<b>PANTHER Challenge Datasets</b> </a> by Steven Chen.\n<br><br>\n<hr>\n<b>Actual Image Segmentation\
  \ for PANTHER-Pancreatic-Tumor Images of 320x260 pixels </b><br>\nAs shown below, the inferred masks\
  \ predicted by our segmentation model trained by the dataset appear similar to the \nground truth masks.\n\
  <br><br>\n<table>\n<tr>\n<th>Input: image</th>\n<th>Mask (ground_truth)</th>\n<th>Prediction: inferred_mask</th>\n\
  </tr>\n<tr>\n<td><img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/mini_test/images/10005_20.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/mini_test/masks/10005_20.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/mini_test_output/10005_20.png\"\
  \ width=\"320\" height=\"auto\"></td>\n</tr>\n<tr>\n<td><img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/mini_test/images/10010_45.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/mini_test/masks/10010_45.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/mini_test_output/10010_45.png\"\
  \ width=\"320\" height=\"auto\"></td>\n</tr>\n<tr>\n<td><img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/mini_test/images/10025_23.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/mini_test/masks/10025_23.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/mini_test_output/10025_23.png\"\
  \ width=\"320\" height=\"auto\"></td>\n</tr>\n</table>\n<hr>\n<br>\n<h3>1  Dataset Citation</h3>\nThe\
  \ dataset used here was derived from <br><br>\n<a href=\"https://www.kaggle.com/datasets/stevenchen116/panther-challenge-datasets/data\"\
  >\n<b>PANTHER Challenge Datasets</b> </a> <br>\n<b>Pancreatic Tumor Segmentation on Diagnostic MRIs\
  \ & Pancreatic Tumor Segmentation</b><br>\nby Steven Chen.\n<br><br>\nThe following explanation was\
  \ taken from the web site.\n<br><br>\n<b>TASK 1: Pancreatic Tumor Segmentation on Diagnostic MRIs</b><br>\n\
  Public Training Dataset :<br>\n92 annotated cases (T1-weighted contrast-enhanced arterial phase)<br>\n\
  367 unannotated cases (various phases, with/without contrast, DWI).<br>\nDevelopment Dataset: 5 cases<br><br>\n\
  <b>TASK 2: Pancreatic Tumor Segmentation on MR-Linac MRIs</b><br>\nPublic Training Dataset: 50 cases\
  \ (T2-weighted MR-Linac image acquired during a radiotherapy session)<br>\nDevelopment Dataset: 4 cases<br>\n\
  Hidden Testing Cohort: 30 cases<br><br>\n<b>Dataset Characteristics</b><br>\nThe PANTHER Challenge dataset\
  \ has been created to support the development of automated pancreatic tumor \nsegmentation models and\
  \ is divided into two distinct tasks. <br>\nTask 1 includes diagnostic MR images acquired for tumor\
  \ segmentation in the diagnostic setting. \nIn these images, filenames that contain _0001 indicate the\
  \ arterial phase scans, \nwhich are the only ones with available ground truth labels; images with different\
  \ suffix numbers correspond to other sequences. <br>\nTask 2 is based on MR-Linac images acquired for\
  \ radiotherapy treatment planning.<br>\n<br>\n<b>Citation</b><br>\nBetancourt Tarifa, A. S., Mahmood,\
  \ F., Bernchou, U., & Koopmans, P. J. (2025). PANTHER Challenge: <br>\nPublic Training Dataset (1.0)\
  \ [Data set]. <br>\nZenodo. https://doi.org/10.5281/zenodo.15192302\n<br><br>\n<b>License:</b><br>\n\
  <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/\">CC-BY-NC-SA 4.0</a>\n<br><br>\n<h3>\n\
  2 PANTHER-Pancreatic-Tumor ImageMask Dataset\n</h3>\n<h3>\n2.1 Download ImageMask Dataset\n</h3>\n If\
  \ you would like to train this PANTHER-Pancreatic-Tumor Segmentation model by yourself,\nplease down\
  \ load our dataset \n<a href=\"https://drive.google.com/file/d/1ABo4qUdKcn7fXVr9b2ooYTIukol9DIxw/view?usp=sharing\"\
  >\n<b>PANTHER-Pancreatic-Tumor-ImageMask-Dataset.zip</b>\n(<a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/\"\
  >CC-BY-NC-SA 4.0</a>)\n</a> on the google drive,\nexpand the downloaded, and put it under <b>./dataset/</b>\
  \ to be.\n<pre>\n./dataset\n└─PANTHER-Pancreatic-Tumor\n    ├─test\n    │   ├─images\n    │   └─masks\n\
  \    ├─train\n    │   ├─images\n    │   └─masks\n    └─valid\n        ├─images\n        └─masks\n</pre>\n\
  <br>\n<b>PANTHER-Pancreatic-Tumor Statistics</b><br>\n<img src =\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/PANTHER-Pancreatic-Tumor_Statistics.png\"\
  \ width=\"512\" height=\"auto\"><br>\n<br>\nAs shown above, the number of images of train and valid\
  \ datasets is large enough to use for a training set of our segmentation model.\n<br><br>\n<h3>\n2.2\
  \ Derivation of PANTHER-Pancreatic-Tumor Dataset\n</h3>\nThe folder structure of the original <b>PANTHER</b>\
  \ dataset is the following,\n<pre>\n./PANTHER\n├─PANTHER_Task1\n│  ├─ImagesTr\n│  │  ├─10000_0001_0000.mha\n\
  ...\n│  │  └─10133_0001_0000.mha\n│  │\n│  └─LabelsTr\n│      ├─10000_0001.mha\n...\n│      └─10133_0001.mha\n\
  │  │\n└─PANTHER_Task2\n    ├─ImagesTr\n    │  ├─10303_0000.mha\n...\n    │  └─10383_0000.mha\n    │\
  \  \n    └─LabelsTr\n        ├─10303.mha\n....\n        └─10383.mha\n</pre>\nWe generated a  320x260\
  \ pixsels PNG ImageMask dataset with colorized masks <b>(pixel value 1:red, \npixel value 2:green)</b>\
  \ from the MHA files in \n<b>PANTHER_TASK1/ImagesTr</b> and\n<b>PANTHER_TASK1/LabelsTr</b>, not including\
  \ <b>PANTHER_Task2</b>, but \n  for simplicity, we excluded all empty black masks and their corresponding\
  \ images.\n<br><br>\n<h3>\n2.3 Train Sample Images and Masks\n</h3>\n<b>Train_sample images</b><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/asset/train_images_sample.png\" width=\"\
  1024\" height=\"auto\">\n<br>\n<b>Train_sample_masks</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/asset/train_masks_sample.png\"\
  \ width=\"1024\" height=\"auto\">\n<br>\n<h3>\n3 Train TensorflowFlexUNet Model\n</h3>\n We trained\
  \ PANTHER-Pancreatic-Tumor TensorflowFlexUNet Model by using the following\n<a href=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/train_eval_infer.config\"\
  > <b>train_eval_infer.config</b></a> file. <br>\nPlease move to ./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor\
  \ and run the following bat file.<br>\n<pre>\n>1.train.bat\n</pre>\n, which simply runs the following\
  \ command.<br>\n<pre>\n>python ../../../src/TensorFlowFlexUNetTrainer.py ./train_eval_infer.config\n\
  </pre>\n<hr>\n\n<b>Model parameters</b><br>\nDefined a small <b>base_filters=16</b> and a large <b>base_kernels=(11,11)</b>\
  \ for the first Conv Layer of Encoder Block of \n<a href=\"./src/TensorFlowFlexUNet.py\">TensorFlowFlexUNet.py</a>\
  \ \nand a <b>large num_layers=8</b> (including a bridge between Encoder and Decoder Blocks).\n<pre>\n\
  [model]\nimage_width    = 512\nimage_height   = 512\nimage_channels = 3\ninput_normalize = True\nnormalization\
  \  = False\nnum_classes    = 3\nbase_filters   = 16\nbase_kernels  = (11,11)\nnum_layers    = 8\ndropout_rate\
  \   = 0.05\ndilation       = (1,1)\n</pre>\n<b>Learning rate</b><br>\nDefined a small learning rate.\
  \  \n<pre>\n[model]\nlearning_rate  = 0.00007\n</pre>\n\n<b>Loss and metrics functions</b><br>\nSpecified\
  \ \"categorical_crossentropy\" and \"dice_coef_multiclass\".<br>\n<pre>\n[model]\nloss           = \"\
  categorical_crossentropy\"\nmetrics        = [\"dice_coef_multiclass\"]\n</pre>\n<b >Learning rate reducer\
  \ callback</b><br>\nEnabled learing_rate_reducer callback, and a small reducer_patience.\n<pre> \n[train]\n\
  learning_rate_reducer = True\nreducer_factor     = 0.4\nreducer_patience   = 4\n</pre>\n<b>Early stopping\
  \ callback</b><br>\nEnabled early stopping callback with patience parameter.\n<pre>\n[train]\npatience\
  \      = 10\n</pre>\n<b></b><br>\n<b>RGB color map</b><br>\nrgb color map dict for PANTHER-Pancreatic-Tumor\
  \ 1+1 classes.<br>\n<pre>\n[mask]\nmask_file_format = \".png\"\n; PANTHER-Pancreatic-Tumor 1+2\n;  \
  \ Background;black,  Tumor:red,  Pancrease:green)\nrgb_map = {(0, 0, 0):0,(255,0,0):1,(0,255,0):2,}\
  \ \n</pre>\n<b>Epoch change inference callbacks</b><br>\nEnabled epoch_change_infer callback.<br>\n\
  <pre>\n[train]\nepoch_change_infer       = True\nepoch_change_infer_dir   =  \"./epoch_change_infer\"\
  \nepoch_changeinfer        = False\nepoch_changeinfer_dir    = \"./epoch_changeinfer\"\nnum_infer_images\
  \         = 6\n</pre>\nBy using this epoch_change_infer callback, on every epoch_change, the inference\
  \ procedure can be called\n for 6 images in <b>mini_test</b> folder. This will help you confirm how\
  \ the predicted mask changes \n at each epoch during your training process.<br> <br> \n<b>Epoch_change_inference\
  \ output at starting (1,2,3)</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/asset/epoch_change_infer_at_start.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n<br>\n<b>Epoch_change_inference output at middle-point (17,18,19)</b><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/asset/epoch_change_infer_at_middlepoint.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n<br>\n<b>Epoch_change_inference output at ending (36,37,38)</b><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/asset/epoch_change_infer_at_end.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n\n<br>\nIn this experiment, the training process was stopped\
  \ at epoch 38 by EarlyStoppingCallback.<br><br>\n<img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/asset/train_console_output_at_epoch38.png\"\
  \ width=\"880\" height=\"auto\"><br>\n<br>\n<a href=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/eval/train_metrics.csv\"\
  >train_metrics.csv</a><br>\n<img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/eval/train_metrics.png\"\
  \ width=\"520\" height=\"auto\"><br>\n\n<br>\n<a href=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/eval/train_losses.csv\"\
  >train_losses.csv</a><br>\n<img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/eval/train_losses.png\"\
  \ width=\"520\" height=\"auto\"><br>\n<br>\n<h3>\n4 Evaluation\n</h3>\nPlease move to <b>./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor</b>\
  \ folder,<br>\nand run the following bat file to evaluate TensorflowFlexUNet model for PANTHER-Pancreatic-Tumor.<br>\n\
  <pre>\n>./2.evaluate.bat\n</pre>\nThis bat file simply runs the following command.\n<pre>\n>python ../../../src/TensorFlowFlexUNetEvaluator.py\
  \  ./train_eval_infer.config\n</pre>\nEvaluation console output:<br>\n<img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/asset/evaluate_console_output_at_epoch38.png\"\
  \ width=\"880\" height=\"auto\">\n<br><br>Image-Segmentation-PANTHER-Pancreatic-Tumor\n\n<a href=\"\
  ./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor/evaluation.csv\">evaluation.csv</a><br>\nThe\
  \ loss (categorical_crossentropy) to this PANTHER-Pancreatic-Tumor/test was very low, and dice_coef_multiclass\
  \ very high as shown below.\n<br>\n<pre>\ncategorical_crossentropy,0.0068\ndice_coef_multiclass,0.9969\n\
  </pre>\n<br>\n<h3>5 Inference</h3>\nPlease move to <b>./projects/TensorFlowFlexUNet/PANTHER-Pancreatic-Tumor</b>\
  \ folder<br>\n,and run the following bat file to infer segmentation regions for images by the Trained-TensorflowFlexUNet\
  \ model for PANTHER-Pancreatic-Tumor.<br>\n<pre>\n>./3.infer.bat\n</pre>\nThis simply runs the following\
  \ command.\n<pre>\n>python ../../../src/TensorFlowFlexUNetInferencer.py ./train_eval_infer.config\n\
  </pre>\n<hr>\n<b>mini_test_images</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/PANTHER-Pan"

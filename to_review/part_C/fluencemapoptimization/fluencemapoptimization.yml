readme_excerpt: "# A nonconvex optimization approach to IMRT planning with dose-volume constraints\n\n\
  [![DOI](https://zenodo.org/badge/224053659.svg)](https://zenodo.org/badge/latestdoi/224053659)\n\nFluence\
  \ map optimization for intensity-modulated radiation therapy planning can be formulated as a large-scale\
  \ inverse problem with competing objectives and constraints associated with the tumors and organs at\
  \ risk.\nUnfortunately, clinically relevant dose-volume constraints are nonconvex, so standard algorithms\
  \ for convex problems cannot be directly applied.\nWhile prior work focused on convex approximations\
  \ for these constraints, we propose a novel relaxation approach to handle nonconvex dose-volume constraints.\n\
  We develop efficient, provably convergent algorithms based on partial minimization, and show how to\
  \ adapt them to handle maximum-dose constraints and infeasible problems.\nWe demonstrate our approach\
  \ using the CORT dataset and show that it is easily adaptable to radiation treatment planning with dose-volume\
  \ constraints for multiple tumors and organs at risk.\n\n## Documents\n* [Preprint](https://arxiv.org/abs/1907.10712)\
  \ (August 2021)\n* [Poster](https://github.com/abbasmzs/FluenceMapOptimization/blob/master/poster.pdf)\
  \ (April 2018)\n\n## Code\nDownload data and solver from the links below, and unzip in the same directory\
  \ as code.\n* [Main](https://github.com/abbasmzs/FluenceMapOptimization/blob/master/FluenceMapOpt.m):\
  \ Functions for loading data, computing fluence maps, and plotting results\n* [Script](https://github.com/abbasmzs/FluenceMapOptimization/blob/master/run.m):\
  \ Example script for using FluenceMapOpt\n* [Examples](https://github.com/abbasmzs/FluenceMapOptimization/tree/master/Examples):\
  \ Code to reproduce the examples from our paper\n* [Figures](https://github.com/abbasmzs/FluenceMapOptimization/tree/master/Figures):\
  \ Figures from our paper\n\n## Links\n* [minConf solver](https://www.cs.ubc.ca/~schmidtm/Software/minConf.zip)\n\
  * [CORT dataset](https://gigadb.org/dataset/100110)\n  * Prostate case data: ftp://parrot.genomics.cn/gigadb/pub/10.5524/100001_101000/100110/PROSTATE.zip\n\
  \  * Prostate DICOM data: ftp://parrot.genomics.cn/gigadb/pub/10.5524/100001_101000/100110/Prostate_Dicom.zip\n"

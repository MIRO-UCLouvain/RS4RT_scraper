readme_excerpt: "#  NeuroVision AI\n\nBrain Tumor Segmentation using **ResUNet** with **Grad-CAM Explainability**\
  \ and **AI-generated PDF Medical Reports**.\n\n---\n\n##  Overview\n\nNeuroVision AI is a deep learning-based\
  \ application that performs brain tumor segmentation from MRI images. The system uses a ResUNet architecture\
  \ to localize tumor regions and provides visual explanations using Grad-CAM. A Gradio-based interface\
  \ allows users to upload MRI images and receive analysis results along with downloadable reports.\n\n\
  ---\n\n## Features\n\n* Brain Tumor Segmentation\n* Overlay Visualization\n* Grad-CAM Explainability\n\
  * Confidence Estimation\n* Severity Level Analysis\n* AI-generated PDF Medical Reports\n* Download Predicted\
  \ Mask\n* Download Overlay Image\n* Interactive Gradio Interface\n\n---\n\n##  Model\n\n* Architecture:\
  \ **ResUNet**\n* Framework: **TensorFlow / Keras**\n* Dataset: **LGG MRI Segmentation Dataset**\n\n\
  ---\n\n##  Performance\n\n| Metric           | Score  |\n| ---------------- | ------ |\n| Dice Coefficient\
  \ | 0.8587 |\n| IoU Score        | 0.7563 |\n\n---\n\n## Application Output\n\nThe application provides:\n\
  \n* Original MRI Image\n* Predicted Tumor Mask\n* Overlay Visualization\n* Grad-CAM Heatmap\n* Tumor\
  \ Information\n* Confidence Score\n* Severity Level\n* Downloadable PDF Report\n\n---\n\n##  Repository\
  \ Structure\n\n```text\nBrain-Tumor-Segmentation-ResUNet\n│\n├── app.py\n├── requirements.txt\n├── README.md\n\
  ├── notebooks\n      ├── Brain_tumor_segmentation.ipynb\n      └── Brain_tumor_gradio.ipynb\n```\n\n\
  ---\n\n##  Model Download\n\nThe trained ResUNet model (~380 MB) exceeds GitHub's upload limit.\n\n\
  Download the model from:\n\n**https://drive.google.com/file/d/1MhwoC6SNDFF9vqNkPddr5_zk0J4uq1jX/view?usp=drive_link**\n\
  \nAfter downloading, place the model inside:\n\n```text\nmodel/resunet_brain_tumor.keras\n```\n\n---\n\
  \n## Installation\n\nClone the repository:\n\n```bash\ngit clone <repository-url>\ncd Brain-Tumor-Segmentation-ResUNet\n\
  ```\n\nInstall dependencies:\n\n```bash\npip install -r requirements.txt\n```\n\n---\n\n## Running the\
  \ Application\n\n```bash\npython app.py\n```\n\n---\n\n## Technologies Used\n\n* Python\n* TensorFlow\n\
  * Keras\n* OpenCV\n* Gradio\n* Matplotlib\n* ReportLab\n\n\n\n## ⚠ Disclaimer\n\nThis application is\
  \ intended for educational and research purposes only and should not be considered a substitute for\
  \ professional medical diagnosis or treatment.\n"

readme_excerpt: "# Combining Magnetic Resonance Imaging and Evoked Potentials Enhances Machine Learning\
  \ Prediction of Multiple Sclerosis Disability Worsening\n\nThis folder provides the core code used in\
  \ the [paper]((https://www.frontiersin.org/journals/immunology/articles/10.3389/fimmu.2026.1625837/full)):\n\
  \n**Aerts, Werthen-Brabants, Khan et al. (2026). Combining Magnetic Resonance Imaging and Evoked Potentials\
  \ Enhances Machine Learning Prediction of Multiple Sclerosis Disability Worsening**\n\n## Important\
  \ Scope Note\n\nThis is a **code-only release**.\nThe underlying patient-level datasets are not included\
  \ and are not publicly distributed in this repository.\n\nAs a result:\n\n- the code is provided for\
  \ **method transparency**, **reference**, and **verification of implementation details**;\n- it can\
  \ be used for **modification/adaptation** to other datasets;\n- it is **not directly reproducible end-to-end**\
  \ without access to the original non-public data.\n\n## Folder Contents\n\n- `ablation.sh`: shell launcher\
  \ for the ablation experiment grid.\n- `model.py`: model training, hyperparameter search, fold evaluation,\
  \ and artifact export.\n- `utils.py`: data loading, label construction, and preprocessing utilities.\n\
  - `figure scripts/`: scripts/notebooks used to generate figures for the manuscript.\n- `results_20250204.csv`:\
  \ results table used by part of the figure generation workflow.\n\n## Intended Use\n\nThis release is\
  \ intended to help readers:\n\n1. inspect how the experiments were implemented;\n2. verify analysis\
  \ logic and modeling choices;\n3. reuse or extend the pipeline on their own compatible datasets.\n\n\
  ## Running the Code With Your Own Data\n\nIf you want to execute the training pipeline, install dependencies\
  \ from the repository root:\n\n```bash\npip install -r requirements-public.txt\n```\n\nThen provide\
  \ your own processed input datasets expected by `utils.py` (schema-compatible with the original project)\
  \ and run:\n\n```bash\nbash CODE_FOR_PUBLICATION/ablation.sh\n```\n\nThe code writes experiment artifacts\
  \ to `results/...` directories.\n\n## Citation\n\nIf this code is useful in your work, please cite:\n\
  \n```bibtex\n@article{aerts17combining,\n  title={Combining Magnetic Resonance Imaging and Evoked Potentials\
  \ Enhances Machine Learning Prediction of Multiple Sclerosis Disability Worsening},\n  author={Aerts,\
  \ Sofie and Werthen-Brabants, Lorin and Khan, Hamza and Giraldo, Diana L and De Brouwer, Edward and\
  \ Geys, Lotte and Popescu, Veronica and Sijbers, Jan and Woodruff, Henry and Dhaene, Tom and others},\n\
  \  journal={Frontiers in Immunology},\n  volume={17},\n  pages={1625837},\n  publisher={Frontiers},\n\
  \  url={https://www.frontiersin.org/journals/immunology/articles/10.3389/fimmu.2026.1625837/full}\n\
  }\n```\n"

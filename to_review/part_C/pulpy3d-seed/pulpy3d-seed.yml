readme_excerpt: "This code is \n\n# Pulp Segmentation Framework\nPulp Segmentation Training Framework\
  \ for 3D CBCT Scans\n\nThis code is inspired from the ToothFairy Challenge (MICCAI 2023) and the source\
  \ code provided in AImageLab [alveolar_canal](https://github.com/AImageLab-zip/alveolar_canal)\n\n##\
  \ Hardware Setup\n| Component | Specification             |\n| --------- | -------------------------\
  \ |\n| CPU       | Intel i7 13700K - 24 core |\n| GPU       | Nvidia 4090-RTX 24GB      |\n| RAM   \
  \    | 32 GB DDR4                |\n| SSD       | 1TB M2                    |\n\n\n## Installation\n\
  ```\n# Create python virtual environment\nvirtualenv venv -p $(which python3)\n\n# Activate virtual\
  \ environment\nsource venv/local/bin/activate\n\n# Install requirements\npip install -r requirements.txt\n\
  ```\n\n## Training\n```\npython main.py --config configs/segmentation.yml\n```\n\n## Dataset\nYou can\
  \ access the infered data using our model using this [link](http://eng.staff.alexu.edu.eg/staff/mtorki/Research/Data/JDR_Files/)\n"

readme_excerpt: '# Masked Deep Embeddings of Patches for Teeth Segmentation in Cone Beam CT Images


  ## Dataset

  The dataset required for this project is based on the work presented in the following paper:


  Cui, Zhiming, et al. "Hierarchical morphology-guided tooth instance segmentation from CBCT images."
  Information Processing in Medical Imaging: 27th International Conference, IPMI 2021, Virtual Event,
  June 28–June 30, 2021, Proceedings 27. Springer International Publishing, 2021.


  Please refer to this paper for details on obtaining and using the dataset.



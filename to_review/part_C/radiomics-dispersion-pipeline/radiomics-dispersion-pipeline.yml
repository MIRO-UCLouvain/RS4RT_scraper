readme_excerpt: "# Lexical Dispersion Evaluation Pipeline\n\nLeakage-aware clinical NLP and machine learning\
  \ pipelines for predicting breast tumor **spatial dispersiveness** and **relapse risk** from post-neoadjuvant,\
  \ pre-surgery MRI and pathology report text.\n\nBoth pipelines use the Stanford Health Care AI Sandbox\
  \ (GPT-5-nano Global) for LLM-based extraction or prediction, with token/cost tracking, resume/checkpoint\
  \ support, and PHI-conscious design suitable for clinical research auditing.\n\n## Pipelines at a glance\n\
  \n|                     | **Approach 1**                                                           |\
  \ **Approach 2**                                                                  |\n| -------------------\
  \ | ------------------------------------------------------------------------ | -------------------------------------------------------------------------------\
  \ |\n| **Goal**            | Few-shot LLM prediction of dispersion score, high/low class, and relapse\
  \ | Nested CV: lexical feature discovery → supervised ML → calibration & reports    |\n| **Entry point**\
  \     | `approach1.py`                                                           | `approach2.py`  \
  \                                                                |\n| **Auxiliary entry** | —      \
  \                                                                  | `approach2_aux.py` (extraction),\
  \ `approach2_generate_reports.py` (HTML reports) |\n| **Package**         | `approach1/`           \
  \                                                  | `approach2/`                                  \
  \                                  |\n| **Change log**      | [`approach1_progress.md`](approach1_progress.md)\
  \                         | [`approach2_progress.md`](approach2_progress.md)                       \
  \         |\n| **Cross-run compare** | [`experiment_comparison/`](experiment_comparison/) — compare\
  \ completed runs (config-driven metrics, plots, HTML report) | Both approaches |\n| **Combined-modality\
  \ audit** | [`metrics_audit/`](metrics_audit/) — offline MRI+pathology metrics audit with bootstrap\
  \ CIs | Both approaches |\n\n**Approach 1** runs a SecureGPT few-shot evaluation across shot sets and\
  \ modality tiers (MRI, pathology, combined). It predicts continuous dispersion, binary high/low dispersion,\
  \ and relapse status directly from report text.\n\n### Approach 1 pipeline overview\n\n```mermaid\n\
  flowchart TD\n    A[Load CSV cases] --> B[Select shot set: 2 high + 2 low exemplars]\n    B --> C[Exclude\
  \ exemplar rows from held-out test]\n    C --> D{Modality tier?}\n    D -->|mri_only or mri+path| E[Drop\
  \ MRI-missing test cases]\n    D -->|pathology_only| F[Keep all pathology cases]\n    E --> G[Build\
  \ few-shot prompt per test case]\n    F --> G\n    G --> H[SecureGPT predict JSON]\n    H --> I[Validate\
  \ schema + retry]\n    I --> J[Save predictions JSONL/CSV]\n    J --> K[Evaluate metrics vs ground truth]\n\
  ```\n\n**Approach 2** is a nested outer/inner evaluation framework. It extracts quote-grounded lexical\
  \ features from MRI and pathology reports, discovers stable lexicons within training folds only, trains\
  \ supervised models for dispersion regression/classification and relapse prediction, and supports pathology-informed\
  \ MRI calibration, teacher–student pathways, automated reports, and fold-level parallelism.\n\n### Approach\
  \ 2 pipeline overview\n\n```mermaid\nflowchart TD\n    A[Load CSV cases] --> B[Build outer splits]\n\
  \    B --> C[Save split provenance manifest]\n    C --> D[Train-only LLM extraction MRI + pathology]\n\
  \    D --> E[Inner rediscovery CV on train phrases]\n    E --> F[Freeze stable lexicon]\n    F --> G[Rule-based\
  \ recode train + test]\n    G --> H[Build feature matrices]\n    H --> I{MRI-derived pathway?}\n   \
  \ I -->|mri / combined / calibrated| J[Drop MRI-missing cases]\n    I -->|pathology-only| K[Keep all\
  \ pathology cases]\n    J --> L[Optional pathology-calibrated MRI weights]\n    K --> L\n    L --> M[Optional\
  \ teacher-student MRI multitask]\n    M --> N[Fit scaler/model on outer-train only]\n    N --> O[Predict\
  \ outer-test]\n    O --> P[Aggregate metrics + bootstrap CI]\n    P --> Q[Generate plots + HTML reports]\n\
  ```\n\n<!--\n#### Leakage-aware design\n\n- Outer splits are saved with provenance manifests under `outer_splits/outer_split_NNN/`.\n\
  - LLM extraction, inner rediscovery, stable lexicon freezing, MRI–pathology reliability estimation,\
  \ weighted MRI lexicons, and teacher–student training are restricted to **outer-training** cases.\n\
  - Held-out outer-test cases are recoded with frozen lexicons and predicted by models fit on outer-train\
  \ only.\n\n#### Missing MRI handling\n\n- MRI-missing cases (empty/`NA` placeholders) are **excluded**\
  \ from MRI-only, combined, pathology-calibrated MRI, and teacher–student pathways.\n- Pathology-only\
  \ models retain all target-eligible cases.\n- Summary artifact: `mri_missing_case_summary.csv` (when\
  \ the full pipeline runs).\n\n#### Split strategy\n\n- Default outer design: **repeated Monte Carlo**\
  \ (`--outer-scheme repeated_mc`, 5× stratified 80/20 by default).\n- Inner rediscovery on outer-train\
  \ uses a separate repeated-MC or stratified-kfold scheme (`--rediscovery-scheme`).\n- Resume fingerprints\
  \ validate CSV path, split hashes, seeds, and configuration before skipping completed folds.\n\n####\
  \ Feature stability and count normalization\n\n- Stable features are selected when rediscovery frequency\
  \ exceeds `--stability-threshold` (default 0.20).\n- Optional cap per modality: `--target-stable-features-per-modality`\
  \ ranks by train-only selection frequency (0 = no cap).\n- MRI and pathology are **not** forced to equal\
  \ feature counts.\n- **Guide:** [Feature stability, selection, and ML weighting](docs/approach2_feature_stability_and_selection.md)\
  \ — rediscovery, frozen encoding, and which CLI flags control feature count.\n\n#### Cost estimation\n\
  \n- Pre-run: `llm_cost_estimate_apriori.json` (interactive confirmation unless `-y` / `--yes`).\n- Post-run:\
  \ `llm_token_cost_report.json`.\n\n#### Parallelism\n\n- `--parallel-fold-workers` — concurrent outer\
  \ folds (isolated split directories + checkpoints).\n- `--max-api-workers` — global API semaphore across\
  \ folds/modalities.\n- `--parallel-modality-workers`, `--ml-n-jobs` — within-fold modality and GridSearch\
  \ parallelism.\n\n- Python ≥ 3.10\n- Stanford AI Sandbox API key (`SANDBOX_API_KEY`)\n- Input CSV with\
  \ case-level MRI/pathology report text and outcome columns (see each pipeline's expected schema) -->\n\
  \n## Installation\n\n```bash\ncd pipeline\npython3 -m venv .venv\nsource .venv/bin/activate   # Windows:\
  \ .venv\\Scripts\\activate\npip install -e \".[dev]\"\n```\n\nSet credentials in a `.env` file at the\
  \ project root (or pass `SANDBOX_ENV_PATH` / `--env-path` for approach 2 extraction):\n\n```bash\nSANDBOX_API_KEY=your_sandbox_key_here\n\
  NEW_SECUREGPT_API_KEY=your_securegpt_key_here\n```\n\nModel selection controls both deployment name\
  \ and API key:\n\n| `--model` | Deployment | API key env var |\n|-----------|------------|-----------------|\n\
  | `gpt-5-nano` (default) | `gpt-5-nano` | `SANDBOX_API_KEY` |\n| `gpt-5` | `gpt-5` | `NEW_SECUREGPT_API_KEY`\
  \ |\n\nOptional: `MAX_COMPLETION_TOKENS`, `REASONING_EFFORT`, `SANDBOX_ENV_PATH`, `ENV_PATH` (approach\
  \ 1).\n\n## Quick start\n\n### Approach 1 — few-shot prediction\n\n```bash\ncd pipeline\nexport SANDBOX_API_KEY=your_key_here\n\
  \n# GPT-5-nano (default; uses SANDBOX_API_KEY)\npython approach1.py --csv-path /path/to/cases.csv --outdir\
  \ ./outputs/approach1 --model gpt-5-nano\n\n# GPT-5 (uses NEW_SECUREGPT_API_KEY)\npython approach1.py\
  \ --csv-path /path/to/cases.csv --outdir ./outputs/approach1 --model gpt-5\n\n# Non-interactive\npython\
  \ approach1.py --csv-path /path/to/cases.csv --outdir ./outputs/approach1 -y\n```\n\nCommon flags: `--resume`\
  \ / `--no-resume`, `--skip-completed-configs`, `--force-rerun-cases`, `--skip-preflight`, `--results-report-only`,\
  \ `--shotsets`, `--model`, `--deployment` (alias for `--model`), `--bootstrap-n`, `--bootstrap-seed`.\n\
  \nRun a single shot set (high exemplars at rows 0 and 2, low exemplars at rows 101 and 102):\n\n```bash\n\
  python approach1.py \\\n  --csv-path /path/to/cases.csv \\\n  --outdir ./outputs/approach1 \\\n  --shotsets\
  \ shotset_high_0_2_low_101_102 \\\n  -y\n```\n\nRegenerate metrics, aggregate summary, and HTML review\
  \ page from saved predictions (no API calls):\n\n```bash\npython approach1.py --results-report-only\
  \ --outdir ./outputs/approach1\n```\n\nThis re-evaluates each completed shotset/modality config from\
  \ `predictions_testing_cases.csv`, refreshes `evaluation_metrics_summary.json`, **`bootstrap_metric_cis.csv`**\
  \ / **`bootstrap_metric_cis.json`**, and `all_tiers_metrics_summary.csv` (including high/low AUROC/AUPRC),\
  \ then rebuilds `approach1_results_report.html`. Use after pipeline metric changes or before cross-run\
  \ comparison.\n\n#### Approach 1 bootstrap confidence intervals (no API re-run)\n\nAfter each config\
  \ run (or via `--results-report-only`), Approach 1 computes **case-level percentile bootstrap 95% CIs**\
  \ from `predictions_testing_cases.csv` (default: 1,000 replicates, seed 42). No LLM/API calls are required.\n\
  \n**Metrics reported** (per config directory):\n\n| Task | Metrics |\n|------|---------|\n| Continuous\
  \ dispersion | Spearman rho, MAE |\n| High/low dispersion | AUROC, AUPRC (from `dispersion_score_pred`),\
  \ sensitivity, specificity, F1 (from `dispersion_high_low_pred`) |\n| Relapse prediction | AUROC, AUPRC,\
  \ sensitivity, specificity, F1 (from binary `relapse_pred`; AUROC/AUPRC rank the 0/1 label, not a probability)\
  \ |\n\nOutputs are written next to the predictions file:\n\n- `bootstrap_metric_cis.csv` — long-format\
  \ table with task, metric, point estimate, CI bounds, replicate counts, and skip notes\n- `bootstrap_metric_cis.json`\
  \ — same data plus metadata (`n_cases`, seed, interpretation notes)\n\n**One-off offline script** on\
  \ an existing predictions CSV:\n\n```bash\ncd pipeline\npython scripts/bootstrap_approach1_metrics.py\
  \ \\\n  /path/to/shotset/modality/predictions_testing_cases.csv \\\n  --bootstrap-n 1000 \\\n  --bootstrap-seed\
  \ 42\n```\n\nUse `--outdir` to write elsewhere; omit it to save alongside the predictions CSV.\n\nPipeline\
  \ flags: `--bootstrap-n` (default 1000; `0` disables), `--bootstrap-seed` (default 42).\n\n### Approach\
  \ 2 — nested lexical + ML evaluation\n\n```bash\ncd pipeline\nexport SANDBOX_API_KEY=your_key_here\n\
  \npython approach2.py \\\n  --csv-path /path/to/cases.csv \\\n  --out_dir ./outputs/approach2 \\\n \
  \ --model gpt-5-nano \\\n  --enable-pathology-calibration \\\n  --enable-teacher-student \\\n  --modalities\
  \ mri path combined \\\n  --yes\n```\n\nUse `--regenerate-reports-only` to rebuild plots and HTML/Markdown\
  \ reports from saved `nested_outer_*` artifacts without re-running extraction or model fitting.\n\n\
  **Resume** a partial run (skips completed outer splits when fingerprints match):\n\n```bash\npython\
  \ approach2.py \\\n  --csv-path /path/to/cases.csv \\\n  --out_dir ./outputs/approach2 \\\n  --resume\
  \ \\\n  --skip-completed-splits \\\n  --yes\n```\n\n**Generate HTML review reports** without re-running\
  \ the pipeline:\n\n```bash\npython approach2_generate_reports.py \\\n  --run-dir ./outputs/approach2\
  \ \\\n  --csv-path /path/to/cases.csv \\\n  --force\n\npython -m approach2.report_cli --run-dir ./outputs/approach2\
  \ --force --open\n```\n\nRegenerate flowchart PNG: `python scripts/generate_approach2_flowchart.py`\n\
  \n### Approach 2 — standalone extraction only\n\nRun MRI or pathology lexical extraction without the\
  \ full nested evaluator:\n\n```bash\npython approach2_aux.py \\\n  --csv-path /path/to/cases.csv \\\n\
  \  --outdir ./outputs/extractions_mri \\\n  --report-mode mri \\\n  --max-api-workers 2 \\\n  --yes\n\
  ```\n\n### Cross-experiment comparison\n\nCompare completed Approach 1 and Approach 2 run directories\
  \ (and optional manual legacy metrics) in a single HTML report. The high/low classification plot shows\
  \ **AUROC and accuracy on separate panels** so Approach 1 score-based AUROC is not conflated with label-based\
  \ accuracy.\n\n```bash\ncd pipeline\npython -m experiment_comparison.run_comparison \\\n  --config experiment_comparison/configs/comparison_0623_0624.yaml\n\
  ```\n\nFor Approach 1 runs created before high/low AUROC was added, backfill first with `--results-report-only`\
  \ (see above). See [`experiment_comparison/README.md`]"

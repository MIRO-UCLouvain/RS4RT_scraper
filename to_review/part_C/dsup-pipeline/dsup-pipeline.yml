readme_excerpt: "# Dsup pipeline\nA Multi-step computational pipeline\n\n# Overview\nThis project is a\
  \ multi-step overview of the convergent evolution of Dsup-like proteins passing a biophysical criteria.\
  \ It has been made to identify a candidate for radioprotection of cells during radiotherapy. It has\
  \ identified Dsup as a candidate and then optimised it using codon optimisation for human gene expression\n\
  \n* NCBI protein database scanning\n\n* Biophysical filtering\n\n* AIUPRED disorder analysis\n  \n*\
  \ MHC-I immunogenicity screening\n\n* Conservational analysis\n\n* Pre-candidate mean identity summary\n\
  \n* Integrated 3D structure visualization (Py3Dmol)\n\n\n"

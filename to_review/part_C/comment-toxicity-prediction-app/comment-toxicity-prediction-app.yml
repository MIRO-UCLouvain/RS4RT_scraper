readme_excerpt: "# Comment-Toxicity-Prediction-App\ndeployed app link :https://comment-toxicity-prediction-app-hbzrx2phmufwb6j6f48qkm.streamlit.app/\n\
  \n\nDEMO video link: https://drive.google.com/file/d/1pTa2drGenWWnV8Zt05eltUEJS0I2D6p9/view?usp=sharing\n\
  \n\n# Comment Toxicity Prediction App\n\n## Overview\n\nThis project, the \"Comment-Toxicity-Prediction-App,\"\
  \ utilizes a machine learning algorithm known as Naive Bayes for predicting the toxicity of comments.\
  \ The model calculates the probability of a comment falling into categories such as toxic, severe toxic,\
  \ obscene, insult, threat, identity hate, etc.\n\n## Machine Learning Model\n\nThe toxicity prediction\
  \ model is built using the Naive Bayes algorithm. This algorithm is commonly used for text classification\
  \ tasks, making it suitable for analyzing and categorizing comments based on their toxicity levels.\
  \ The model has been trained on a labeled dataset to make predictions on new comments.\n\n## Prediction\
  \ Categories\n\nThe model categorizes comments into the following toxicity levels:\n\n- Toxic\n- Severe\
  \ Toxic\n- Obscene\n- Insult\n- Threat\n- Identity Hate\n\n## Usage\n\nTo use the Comment Toxicity Prediction\
  \ App, follow these steps:\n\n1. **Clone Repository:**\n   ```bash\n   git clone https://github.com/your-username/Comment-Toxicity-Prediction-Model.git\n\
  \   cd Comment-Toxicity-Prediction-Model\n   ```\n\n2. **Install Dependencies:**\n   ```bash\n   pip\
  \ install -r requirements.txt\n   ```\n\n3. **Run the Web App:**\n   ```bash\n   streamlit run app.py\n\
  \   ```\n\n4. **Access the App:**\n   Open your web browser and navigate to `http://localhost:8501`\
  \ to interact with the Comment-Toxicity-Prediction-Model.\n\n5. Enter a comment in the input field,\
  \ and the app will provide the predicted probabilities for each toxicity category.\n\n## Sample output:\n\
  \n### Good Comment\n.\n.\n![good comment](https://github.com/adnanpatel878/Comment-Toxicity-Prediction-App/assets/105789120/9f2c5e63-189b-4d4c-a224-307e983dd877)\n\

readme_excerpt: "# ADMEThyst: Drug-induced cardiotoxicity (DICT) prediction using ADMET-AI\n\nADMEThyst\
  \ is a tool for predicting Drug-Induced Cardiotoxicity (DICT) using an Extreme Gradient Boosting (XGB)\
  \ model based on 41 ADMET properties predicted by [ADMET-AI](https://github.com/swansonk14/admet_ai).\
  \ ADMEThyst was trained on drugs from the [DICTrank dataset](https://doi.org/10.1016/j.drudis.2023.103770).\
  \ ADMEThyst was developed jointly by Stanford University and [Greenstone Biosciences](https://greenstonebio.com/).\n\
  \n\n## Installation\n\nOptionally, first create a new conda environment and activate it:\n\n```bash\n\
  conda create -n admethyst python=3.11\nconda activate admethyst\n```\n\nThen, install the required packages:\n\
  \n```bash\npip install -r requirements.txt\n```\n\n\n## Usage\n\nRun `scripts/Train_&_Plot_ADMET_AI_DICTrank_predictor.ipynb`\
  \ to train using 555 drugs (262 no DICT concern, 293 most DICT concern) from DICTrank using 41 ADMET\
  \ properties from ADMET-AI. This notebook also plots performance (ROC AUC and PR AUC curves), compares\
  \ ADMET-AI with SwissADME, identifies most important features (SHAP), and plots radial plots for least\
  \ toxic and most toxic cardiovascular drugs.\n\nRun `scripts/Predict_ADMET_AI_DICTrank.py` to get 41\
  \ ADMET property predictions from ADMET-AI and DICTrank predictions for SMILES string(s) or a list of\
  \ SMILES strings in a `.txt` file.\n\nExample usage.\n```bash\npython scripts/Predict_ADMET_AI_DICTrank.py\
  \ \\\n    --smiles \"O=C(OC1CC2CC3CC(C1)[NH+]2CC3=O)c1c[nH]c2ccccc12\" \\\n             \"O=c1n(CCC[NH+]2CCN(c3cccc(Cl)c3)CC2)nc2ccccn12\"\
  \ \\\n             \"CC(C)COc1ccc(CNC(=O)[NH+](Cc2ccc(F)cc2)C2CC[NH+](C)CC2)cc1\" \\\n             \"\
  C[NH+](C)C([NH3+])=NC(N)=[NH2+]\" \\\n             \"CC(C(=O)[O-])c1ccc(-c2ccccc2)c(F)c1\" \\\n    --name\
  \ admet_ai_dictrank \\\n    --out_dir test_prediction\n```\n\nRun `python scripts/Predict_ADMET_AI_DICTrank.py\
  \ -h` for more information.\n"

readme_excerpt: '# Irradiation Jig — 3D Print Files


  A novel 3D-printed, non-invasive irradiation jig designed for in vivo external beam irradiations of
  tumour-bearing mice using a clinical ¹⁹²Ir source and HDR brachytherapy (HDR-BT) afterloader. The jig
  positions and immobilizes the mouse while the source travels externally along the treatment axis, enabling
  reproducible, homogeneous dose delivery to subcutaneous tumours without skin-to-jig contact.


  This repository contains the `.stl` files needed to print and assemble the jig.


  ## Background


  Pre-clinical in vivo irradiations using clinical radioactive sources are technically challenging due
  to complex geometric setup and difficulties in confirming dose delivery accuracy. This jig was developed
  to provide a simple, reproducible, and site-independent platform for such irradiations, requiring no
  pre-existing HDR-BT infrastructure beyond access to an afterloader. Tumour localization to the treatment
  isocentre is performed using onboard lasers, and the design accommodates oblong or irregularly shaped
  tumours.


  ## Components


  | File | Description |

  |---|---|

  | `Jig-SemiCircle.stl` | Semi-circular frame that defines the source travel path |

  | `Jig-Table.stl` | Table/bed that positions and immobilizes the mouse |

  | `Mouse.stl` | Representative flank tumour-bearing mouse model |


  ## Usage


  These files are intended for researchers wishing to replicate or adapt the irradiation jig for their
  own pre-clinical studies. The design is intended to be site-independent and adaptable to a range of
  tumour models and irradiation workflows.


  Print the components using a standard FDM 3D printer. No proprietary materials or equipment are required
  beyond access to a clinical HDR-BT afterloader and radioactive source for irradiation.


  ## Citation


  A full description of the jig design, dosimetric validation, and in vivo application will be available
  in an upcoming publication. Citation and DOI will be added here upon publication.


  ## License


  This work is shared openly for academic and clinical research use. Please cite the associated publication
  if you use or adapt this design in your own work.


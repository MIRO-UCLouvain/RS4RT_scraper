readme_excerpt: "# PGT: An Interpretable Prompt Graph Transformer for Multi-Species Acute Toxicity Prediction\n\
  This repository contains the official implementation of **PGT** (Pre-trained Graph Transformer), a deep\
  \ learning framework designed for molecular property prediction. It leverages Graph Neural Networks\
  \ (GNNs) with spatial positioning and supports multi-task learning.\n\n## \U0001F4CB Table of Contents\n\
  - [Project Structure](#-project-structure)\n- [Requirements](#-requirements)\n- [Installation & Compilation](#-installation--compilation)\n\
  - [Data Preprocessing](#-data-preprocessing)\n- [Usage](#-usage)\n  - [Training](#1-training)\n  - [Single\
  \ Molecule Inference](#2-single-molecule-inference)\n  - [Batch Inference](#3-batch-inference)\n- [License](#-license)\n\
  \n## \U0001F4C2 Project Structure\n\n```text\nPGT-Project/\n├── algos/                  # Cython modules\
  \ for graph algorithms\n├── architecture/           # Model definitions (PGT, Graphormer, etc.)\n├──\
  \ data/                   # Raw CSV data storage\n├── processed_data/         # Preprocessed PyG graph\
  \ data (generated)\n├── ckpt/                   # Model checkpoints\n├── main.py                 # Main\
  \ entry point for training and inference\n├── preprocess_data.py      # Data preprocessing script\n\
  ├── setup.py                # Build script for Cython extensions\n└── requirements.txt        # Python\
  \ dependencies\n```\n\n## \U0001F4E6 Requirements\n- Python 3.8+\n- PyTorch >= 1.10\n- PyTorch Geometric\n\
  - RDKit\n- Cython\n- Pandas, Numpy, Tqdm \n\nYou can install the dependencies Using:\n```bash\npip install\
  \ -r requirements.txt\n```\n## ⚙️ Installation && Compilation\n**Crucial Step:** This project utilizes\
  \ **Cython** to accelerate complex graph algorithms (e.g., Floyd-Warshall for\nspatial positioning).\
  \ You **must** compile the C extensions locally before running any code.\nRun the following command\
  \ in the root directory:\n```bash\npython setup.py build_ext --inplace\n```\n*Note:* If successful,\
  \ you will see `.so` (Linux/Mac) or `.pyd` (Windows) files generated in the `algos/` directory. And\
  \ then you can run the code right now.\n\n## \U0001F9EAData Preprocessing\n- Please unzip the dataset\
  \ in the `data/` directory before running the preprocessing script.\n- Before training or inference,\
  \ raw molecular data (SMILES format in CSV) must be converted into graph objects.\n\n1. Place your raw\
  \ data (e.g., `toxacute.csv`) in the `data/` folder.\n\n2. Run the preprocessing script:\n```bash\n\
  python preprocess_data.py \\\n  --raw_csv_path ./data/toxacute.csv \\\n  --task_list \"man_oral_TDLo,women_oral_TDLo,human_oral_TDLo\"\
  \ \\\n  --output_dir ./processed_data\n```\n- `--raw_csv_path`: Path to your raw CSV file containing\
  \ SMILES and labels.\n\n- `--task_list`: Comma-separated list of target columns to process (or use `all`\
  \ to process all tasks).\n\n- `--output_dir`: Directory where processed graph files (`.pt`) will be\
  \ saved.\n\n## \U0001F680 Usage\nThe `main.py` script handles training, evaluation, and inference modes.\n\
  1. **Training**To train the model using **Uncertainty Weighting (UW)** for multitask learning, you can\
  \ also choose other strategy:\n```bash\n python main.py \\\n  --mode train \\\n  --dataset toxacute\
  \ \\\n  --preprocessed_data_dir ./processed_data \\\n  --arch PGT \\\n  --weighting UW \\\n  --epochs\
  \ 50 \\\n  --bs 64 \\\n  --gpu_id 0 \\\n  --save_path ./ckpt\n```\n**Key Arguments:**\n\n- `--arch`:\
  \ Model architecture (default: `PGT`).\n\n- `--weighting`: Multitask weighting strategy (`UW`, `EW`,\
  \ `DWA`).\n\n- `--dataset`: Dataset name (used for task configuration).\n2. **Single Molecule Inference**\n\
  To predict properties for a single SMILES string using a trained model:\n```bash\n python main.py \\\
  \n  --mode single_inference \\\n  --load_path ./ckpt \\\n  --ckpt_name PGT_ckpt \\\n  --arch PGT \\\n\
  \  --smiles \"CC(=O)OC1=CC=CC=C1C(=O)O\"\n```\n3. **Batch Inference**\nTo perform inference on a specific\
  \ task folder within your preprocessed data:\n```bash\n python main.py \\\n  --mode batch_inference\
  \ \\\n  --preprocessed_data_dir ./processed_data \\\n  --inference_task human_oral_TDLo \\\n  --load_path\
  \ ./ckpt \\\n  --ckpt_name PGT_ckpt \\\n  --inference_output_path ./predictions.csv\n```\n\n## \U0001FAAA\
  License\nThis project is released under the MIT License. See the LICENSE file for details."

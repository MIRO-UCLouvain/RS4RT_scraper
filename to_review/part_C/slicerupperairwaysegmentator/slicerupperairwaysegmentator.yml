readme_excerpt: "# Slicer UpperAirwaySegmentator \n\n3D Slicer extension for fully-automatic segmentation\
  \ of CBCT upper airway volumes using \"UpperAirwaySegmentator\"\n\n<img src=\"https://github.com/alejandro-matos/SlicerUpperAirwaySegmentator/raw/main/Screenshots/11.png\"\
  \ width=\"700\"/>\n\n## UpperAirwaySegmentator Model\nUpperAirwaySegmentator is built on the nnUNet\
  \ framework and segments the pharyngeal and sinonasal airway regions. The dataset was split 70:30 into\
  \ training and testing sets and included 75 CBCT scans from the University of Alberta, 65 from a private\
  \ Chilean center, and 80 CT scans (40 pre- and 40 post-operative) from surgical departments in France.\n\
  \nIf you use UpperAirwaySegmentator for your work, please also cite <!--our paper and -->nnU-Net:\n\n\
  <!-- Matos Camarillo A, Capenakas-Gianoni S, Punithakumar K, Lagravere-Vich M. AirwaySegmentator: A\
  \ deep learning-based method for Nasopharyngeal airway segmentation. Published online Month day, 2024:2024.xx.xx.xxxxxxxx.\
  \ doi:10.1101/2024.xx.xx.xxxxxxxx-->\n\n> Isensee F, Jaeger PF, Kohl SAA, Petersen J, Maier-Hein KH.\
  \ nnU-Net: a self-configuring method for deep learning-based biomedical image segmentation. Nat Methods.\
  \ 2021;18(2):203-211. doi:10.1038/s41592-020-01008-z\n<img src=\"https://github.com/alejandro-matos/SlicerUpperAirwaySegmentator/raw/main/Screenshots/angles.png\"\
  \ width=\"500\"/>\n\n## Using the extension\n\n<!--[Here is a video tutorial](https://www.youtube.com/watch?v=BEG-XhjjiaY)\
  \ showing the installation process and demonstrating the main capabilities of the extension.-->\n\n\
  This extension is compatible with the 3D Slicer Preview Release (version 5.7.0, or later), downloadable\
  \ [from the official website]( https://download.slicer.org/ ). \n\n<!--The extension is not yet available\
  \ in the extension manager as of October 21, 2024. Thus, it is necessary to install the extension manually\
  \ by downloading it to your computer and using the extension wizard, similarly as how it is shown in\
  \ this [video tutorial]([https://youtu.be/QsxzjQb05D4?si=haksYNjVlO9nJO8l&t=78]))-->\n\nThe plugin can\
  \ be installed in Slicer using the [extension manager]( https://slicer.readthedocs.io/en/latest/user_guide/extensions_manager.html#install-extensions).\n\
  It can be found using the search bar by typing \"UpperAirwaySegmentator\".\n\n<img src=\"https://github.com/alejandro-matos/SlicerUpperAirwaySegmentator/raw/main/Screenshots/5.png\"\
  \ width=\"500\"/>\n\nAfter the install process and restart of Slicer, the extension can be found in\
  \ the module file explorer under `Segmentation>UpperAirwaySegmentator`.\nIt can also be found by using\
  \ the `find` module button and searching for the keyword `UpperAirwaySegmentator`.\n\nTo use the extension,\
  \ load a dental CT or CBCT by either drag and dropping the data in 3D Slicer or by using the\n`DATA`\
  \ or `DCM` load buttons.\n\n<!--To test the extension, you can use 3D Slicer's `CBCT Dental Surgery`\
  \ volumes. These volumes can be found in the\n`Sample Data` module. -->\n\nAfter loading the data, the\
  \ data will be displayed in the 2D views.\nSwitch module to the `UpperAirwaySegmentator` module and\
  \ select the volume in the first drop down menu.\nChoose the trained AI model to use from the `AI model`\
  \ drop down menu.\n\nClick on the `Apply` button to start the segmentation.\n\n<img src=\"https://github.com/alejandro-matos/SlicerUpperAirwaySegmentator/raw/main/Screenshots/4.png\"\
  \ width=\"500\" />\n\nDuring the first launch, the module's dependencies will be installed. These dependencies\
  \ include : \n* The AI model weights\n* Light the torch\n* PyTorch\n* nnUNet V2 \n\nAfter the install,\
  \ the volume will be transferred and sent to the nnUNet V2 library for processing.\nIf your device doesn't\
  \ include CUDA, the processing may be very long and a dialog will ask for confirmation before\nstarting\
  \ the segmentation process.\n\n<img src=\"https://github.com/alejandro-matos/SlicerUpperAirwaySegmentator/raw/main/Screenshots/upperairwaysegmentator_run.gif\"\
  />\n\nDuring execution, the processing can be canceled using the `Stop` button.\nThe progress will be\
  \ reported in the console logs.\n\n<img src=\"https://github.com/alejandro-matos/SlicerUpperAirwaySegmentator/raw/main/Screenshots/5.png\"\
  \ width=\"500\"/>\n\nAfter the segmentation process has run, the segmentation will be loaded into the\
  \ application.\nThe segmentation results can be modified using the `Segment Editor` tools.\n\n<img src=\"\
  https://github.com/alejandro-matos/SlicerUpperAirwaySegmentator/raw/main/Screenshots/upperairwaysegmentator_3dmodel.gif\"\
  />\n\nThe segmentation can be exported as STL, NIfTI and/or OBJ using the `Export segmentation` menu\
  \ and selecting the export format(s).\n\nThe `Surface smoothing` slider allows to change the 3D view\
  \ surface smoothing algorithm.\n\n<img src=\"https://github.com/alejandro-matos/SlicerUpperAirwaySegmentator/raw/main/Screenshots/6.png\"\
  \ width=\"500\"/>\n\n## Troubleshooting\n\n### MacOS GPU acceleration\n\nDue to an ongoing issue with\
  \ Mac devices and Pytorch, GPU acceleration is not available for now on those devices.\n\n### Linux\
  \ Processing hang\n\nOn Linux or WSL system, the inference can get stuck at the stage : \"done with\
  \ volume\".\nThis indicates that the process has run out of memory. 32 GB of RAM is recommended to run\
  \ this extension. If you run \ninto this issue, you can create a SWAP file on SSD with 16 GB which should\
  \ solve the problem.\n\n### Torch CUDA not properly installed\n\nOn Windows, the torch CUDA dependency\
  \ may not properly be detected and installed.\n\nTo solve this problem, you can use the `PyTorch Utils`\
  \ extension, uninstall the version of PyTorch and install \na new version of PyTorch by setting the\
  \ `Computation backend` compatible with your hardware. Make sure to restart Slicer after performing\
  \ the re-installation.\n\nThe PyTorch version should be greater than `2.0.0` for nnUNet compatibility.\n\
  \n<img src=\"https://github.com/alejandro-matos/SlicerUpperAirwaySegmentator/raw/main/Screenshots/7.png\"\
  \ width=\"500\"/>\n\n### Failed to download / find weights\n\nIf the weights are not correctly installed,\
  \ you can install them manually.\nTo do so, go to https://github.com/alejandro-matos/SlicerUpperAirwaySegmentator\
  \  and select the latest release.\n\nDownload the latest `.zip` file from the release.\n\nNavigate to\
  \ your `UpperAirwaySegmentator` folder (this folder can be also found in the module finder window).\n\
  \n<!-- <img src=\"https://github.com/alejandro-matos/SlicerUpperAirwaySegmentator/raw/main/Screenshots/8.png\"\
  \ width=\"500\"/> -->\n\nUnzip the weight file in the model-specific folder under `UpperAirwaySegmentator\\\
  Resources\\ML`.\nFor example, the default model is stored in `UpperAirwaySegmentator\\Resources\\ML\\\
  upper_airway_155cbct`.\n\nCreate a `download_info.json` file containing the path to the downloaded zip\
  \ file for future reference : \n\n{\n  \"download_url\": \"https://github.com/alejandro-matos/SlicerUpperAirwaySegmentator/releases/download/v1.0.0-alpha/Dataset014_Airways_155CBCT_fold_all.zip\
  \ \"\n}\n\n### Adding another trained model\n\nSelectable models are defined in `UpperAirwaySegmentator/UpperAirwaySegmentatorLib/ModelDefinition.py`.\n\
  Add one `ModelDefinition` per trained model:\n\n```python\nModelDefinition(\n    key=\"upper_airway_second_model\"\
  ,\n    display_name=\"Upper airway second model\",\n    release_asset_name=\"DatasetXXX_YourSecondModel.zip\"\
  ,\n)\n```\n\nThe `key` becomes the local weights folder name under `Resources/ML`.\nThe `display_name`\
  \ is shown in the Slicer module.\nUse `release_asset_name` when the weights are attached to a GitHub\
  \ release, or `download_url` when you want to point directly to a `.zip` file.\n\n### Failed to load\
  \ segmentation\n\nError reads \"Failed to load segmentation. Something went wrong during nnUNet processing.\
  \ Please check the logs for potential errors and contact the library maintainers.\" Check that the Torch\
  \ version is at least 2.0.0.\nOtherwise, try uninstalling the PyTorch extension, restart 3D Slicer,\
  \ and then reinstall the PyTorch extension again.\n\n## Contributing\n\nThis project welcomes contributions.\
  \ If you want more information about how you can contribute, please refer to\nthe [CONTRIBUTING.md file](CONTRIBUTING.md).\n\
  \n## Acknowledgments \n\nAuthors: A. Matos Camarillo (University of Alberta), S. Capenakas-Gianoni (University\
  \ of Alberta), K. Punithakumar (University of Alberta), M. Lagravere-Vich (University of Alberta)\n\n\
  <!-- Supported by the [tk Add source of funding here] -->\n\nThis project references the structural\
  \ framework of the [Slicer DentalSegmentator project](https://github.com/gaudot/SlicerDentalSegmentator/tree/main)\
  \ extension, licensed under the Apache 2.0 License. Our implementation features independently trained\
  \ models and custom modifications while maintaining attribution to the original structural framework.\n\

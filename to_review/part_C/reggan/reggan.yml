readme_excerpt: "# Breaking the Dilemma of Medical Image-to-image Translation\n![bat](./p2pcycreg.png)\n\
  \nGet the full paper on [Arxiv](https://arxiv.org/pdf/2110.06465.pdf).\nThis paper has been accepted\
  \ by [NeurIPS 2021 (Spotlight)](https://openreview.net/forum?id=C0GmZH2RnVR&referrer=%5BAuthor%20Console%5D(%2Fgroup%3Fid%3DNeurIPS.cc%2F2021%2FConference%2FAuthors%23your-submissions)).\n\
  \n## Main Reference Environment\n1. Linux         (Titan RTX)\n2. Python        (3.6.6)\n3. torch  \
  \       (1.9.0+cu111)\n5. visdom        (0.1.8.9)\n6. numpy         (1.19.2)\n7. skimage       (0.15.0)\n\
  8. Yaml          (5.4.1)\n9. cv2           (3.4.2)\n10. PIL          (8.3.2)\n\n## Usage\n1. Create\
  \ dataset\n   -  train path/A/\n   -  train path/B/\n   -  val path/A/\n   -  val path/B/ \n2. The default\
  \ data file form is .npy and normalized to [-1,1].\n3. Modify the parameters in the .yaml file as needed:\n\
  \   -  **bidirect**: whether to use bidirectional network, corresponding to the C or NC mode in the\
  \ paper.\n   -  **regist**: whether the registration network is used, corresponding to the +R mode in\
  \ the paper.\n   - **noise_level**: set to 0 if you do not want to use noise.\n   - **port**: port parameters\
  \ of visdom.\n4. Default RegGAN mode (bidirect:**False**    regist:**True**).\n5. Start visdom：\n ```\n\
  python -m visdom.server -p 6019\n```\nIf other port parameters are used, you need to modify the port\
  \ in yaml.\n\n6. Train:\n ```\npython train.py\n```\n## Trained Weights\nWe provide Pix2pix, CycleGAN,\
  \ RegGAN trained weights under the condition of Noise.0:\nhttps://drive.google.com/file/d/1xWXB9u6dQ9ZytmgQl_0ph4H_Ivtd41zJ/view?usp=sharing\n\
  -  Pix2pix_noise0\n-  CycleGAN_noise0\n-  RegGAN_noise0\n\n## Processed data\nWe provide some processed\
  \ data for your convenience：\nhttps://drive.google.com/file/d/1PiTzGQEVV7NO4nPaHeQv61WgDxoD76nL/view?usp=sharing\n\
  \n\n## Citation\n\nIf you find RegGAN useful in your research, please consider citing:\n\n```\n@inproceedings{\n\
  kong2021breaking,\ntitle={Breaking the Dilemma of Medical Image-to-image Translation},\nauthor={Lingke\
  \ Kong and Chenyu Lian and Detian Huang and ZhenJiang Li and Yanle Hu and Qichao Zhou},\nbooktitle={Thirty-Fifth\
  \ Conference on Neural Information Processing Systems},\nyear={2021},\nurl={https://openreview.net/forum?id=C0GmZH2RnVR}\n\
  }\n```\n\n## dataset数据配置\n\n数据存放格式在Yaml文件夹下面的*.yaml的dataset字段\n\n## weight权重\n\n存放在weight文件夹下面"

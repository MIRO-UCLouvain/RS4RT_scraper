readme_excerpt: "## DICOM Real time Video implementation using flask \n\n## How to install\n\n1. Install\
  \ the requirements:\n```bash\npip3 install -r requirements.txt\n```\n\n## How to run\n\nRun the server\
  \ than continuously serves de image frames \n\n```bash\npython3 server.py\n```\nRun the Web page\n\n\
  ```bash\npython3 dicom-rtv.py\n```\n\nSince the ID of the input device is hardcoded, sometimes it has\
  \ to be changed by hand.\nThat is done on line 44.\n```python\nrate=RATE, input=True,input_device_index=<index>\n\
  ```\n"

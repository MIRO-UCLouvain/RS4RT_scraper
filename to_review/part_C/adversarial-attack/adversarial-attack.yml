readme_excerpt: "# Brain Tumor Segmentation Under Adversarial Attack\n\nThis repository contains a PyTorch-based\
  \ 3D U-Net pipeline for brain tumor segmentation and adversarial robustness evaluation on MRI volumes.\n\
  \n## Overview\n\nThe project includes:\n- 3D U-Net for brain tumor segmentation\n- Custom MRI dataset\
  \ loader using NIfTI files\n- Baseline evaluation with Dice and IoU metrics\n- FGSM adversarial attack\
  \ generation\n- Systematic robustness testing across multiple epsilon values\n\n## Model\n\nThe segmentation\
  \ model is a custom 3D U-Net with:\n- 4 input channels\n- 1 output channel\n- encoder-decoder structure\
  \ with skip connections\n- batch normalization and ReLU activations\n\n## Dataset\n\nThe dataset loader:\n\
  - reads MRI modalities from a CSV file\n- loads NIfTI volumes with `nibabel`\n- applies center cropping\
  \ to `(96, 96, 96)`\n- normalizes each modality independently\n\n## Evaluation\n\nBaseline evaluation\
  \ is performed on the clean test set using:\n- Dice score\n- IoU score\n\nExample clean performance:\n\
  - Average Dice: 0.8181\n- Average IoU: 0.7331\n\n## Adversarial Attack\n\nFGSM is used to perturb the\
  \ input MRI volumes:\n- loss: `BCEWithLogitsLoss`\n- perturbation: `x_adv = x + epsilon * sign(grad)`\n\
  - clamped back to the original value range\n\nTested epsilon values:\n- 0.0\n- 0.4\n- 0.8\n- 1.0\n-\
  \ 2.0\n\nObserved average Dice scores:\n- 0.8181 at epsilon 0.0\n- 0.6537 at epsilon 0.4\n- 0.5407 at\
  \ epsilon 0.8\n- 0.4557 at epsilon 1.0\n- 0.0788 at epsilon 2.0\n\nThese results show a strong degradation\
  \ in segmentation performance under adversarial perturbations.\n\n## Requirements\n\n```bash\npip install\
  \ -r requirements.txt\n```\n\n## Example dependencies\n\n- torch\n- numpy\n- pandas\n- matplotlib\n\
  - nibabel\n\n## Notes\n\nThe original implementation was developed in Google Colab and uses Google Drive\
  \ paths.  \nBefore running locally, update:\n- model path\n- dataset CSV path\n- output save paths\n\
  \n## Future improvements\n\n- Add PGD attack\n- Add training script\n- Add reproducible config files\n\
  - Save qualitative attack visualizations\n- Refactor notebook code into Python modules\n"

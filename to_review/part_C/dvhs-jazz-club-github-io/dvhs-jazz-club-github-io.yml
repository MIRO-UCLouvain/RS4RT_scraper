readme_excerpt: "# Dougherty Valley High School Jazz Club Website\n\nThis repository contains the official\
  \ website for the Dougherty Valley High School Jazz Club.\n\n**Live Site:** [https://DVHS-Jazz-Club.github.io](https://DVHS-Jazz-Club.github.io)\n\
  \n---\n\n## How to Update The Website\n\nThis guide is for club officers. All website content—including\
  \ performances, images, and officer names—is managed through a user-friendly admin panel.\n\n### The\
  \ 3-Step Process\n\n1.  **Make changes in the Admin Panel.**\n2.  **Copy the generated data.**\n3. \
  \ **Paste it into the `data.json` file on GitHub.**\n\nThat's it! Changes committed to the `main` branch\
  \ are automatically deployed.\n\n### Step 1: Log In to the Admin Panel\n\n1.  **Access the Admin Panel**:\
  \ Navigate to the **[Admin Panel](https://DVHS-Jazz-Club.github.io/#/admin)**.\n2.  **Enter Password**:\
  \ Ask a fellow officer for the admin password.\n\n### Step 2: Manage Website Content\n\nThe admin panel\
  \ is organized into sections that match the website's content.\n\n#### Managing Performances\n- **Upcoming\
  \ & Past Performances**: Add, edit, or delete performances in their respective sections.\n- **Editing**:\
  \ Click \"Edit\" to open a form where you can change details like the date, time, location, and description.\
  \ You can also assign images to a performance from the Image Library by selecting one or more images\
  \ to be displayed in the event's gallery modal.\n- **Auto-Sorting**: Use the \"Auto-Sort by Date\" button\
  \ to automatically categorize all performances as \"upcoming\" or \"past\" based on their dates. This\
  \ feature also sorts performances chronologically within each category (earliest upcoming first, most\
  \ recent past first).\n\n#### Managing Images\n- **The Image Library**: This is the central hub for\
  \ all website images. Forget manually uploading to GitHub—do it all from here.\n- **Uploading**: Click\
  \ **\"Upload New Image\"**. This uses a third-party service (`imgbb.com`) to host the image, so you\
  \ don't need to worry about repository space.\n- **Cropping**: When uploading, you'll be prompted with\
  \ a cropping tool. You can zoom, rotate, and select the exact part of the image to use. All images are\
  \ cropped to a 16:9 aspect ratio for consistent display across the site.\n- **Naming**: Images are identified\
  \ by name. You can rename them at any time for clarity.\n- **Assigning Images**: In the \"Page Content\
  \ Assignment\" section, simply click on an image's name to assign it to the \"About Us\" page or the\
  \ \"Homepage Hero Slideshow\".\n\n### Step 3: Save and Commit Your Changes\n\nThis is the most important\
  \ step. Your changes are not live until you save them to the repository.\n\n1.  **Copy the New Data**:\n\
  \    - At the bottom of the admin panel, you'll find a section called **\"Save Your Changes\"**.\n \
  \   - Click the large **\"Copy Updated JSON\"** button. This copies all of your new content to the clipboard.\n\
  2.  **Update `data.json` on GitHub**:\n    - Open the `public/data.json` file in the repository. **[Click\
  \ here for a direct link.](https://github.com/DVHS-Jazz-Club/DVHS-Jazz-Club.github.io/blob/main/public/data.json)**\n\
  \    - Click the **pencil icon** (Edit this file) in the top right.\n    - Select all the existing text\
  \ in the file (`Ctrl+A` or `Cmd+A`) and **delete it**.\n    - **Paste** (`Ctrl+V` or `Cmd+V`) the new\
  \ data you copied from the admin panel.\n3.  **Commit the Changes**:\n    - Scroll to the bottom of\
  \ the page.\n    - Add a brief, descriptive commit message (e.g., \"Update upcoming concert details\"\
  ).\n    - Click the green **\"Commit changes\"** button.\n\nYour changes will be live on the website\
  \ within a few minutes.\n\n---\n\n## Technical Details\n\n### About This Project\n\nThis project is\
  \ a modern, dynamic single-page application created with React and Vite. It is designed to be easily\
  \ updated by non-technical club officers through a comprehensive, user-friendly admin panel.\n\n###\
  \ Key Data Structures (`data.json`)\n\n- `performances`: An object containing two arrays: `upcoming`\
  \ and `past`.\n- `imagePool`: An array of image objects, each with a `url` and a `name`. This is the\
  \ central library for all site images.\n- `heroImages`: An array of image URLs to be displayed in the\
  \ homepage slideshow.\n- `aboutImage`: A single image URL for the \"About Us\" section.\n- `officers`:\
  \ An object mapping officer titles to names.\n\n### Tech Stack\n\n- **[React](https://react.dev/)**:\
  \ A JavaScript library for building user interfaces.\n- **[Vite](https://vitejs.dev/)**: A fast and\
  \ modern build tool for web development.\n- **[React Router](https://reactrouter.com/)**: For handling\
  \ client-side routing (`HashRouter` is used for GitHub Pages compatibility).\n- **[GitHub Pages](https://pages.github.com/)**:\
  \ For hosting the live website.\n- **[GitHub Actions](https://github.com/features/actions)**: For continuous\
  \ deployment.\n\n### Development\n\nFollow these steps if you want to run the project locally.\n\n####\
  \ Running Locally\n\n1.  **Clone the repository**:\n    ```sh\n    git clone https://github.com/DVHS-Jazz-Club/DVHS-Jazz-Club.github.io.git\n\
  \    cd DVHS-Jazz-Club.github.io\n    ```\n2.  **Install dependencies**:\n    ```sh\n    npm install\n\
  \    ```\n3.  **Create Environment File**:\n    - Create a file named `.env` in the root of the project.\n\
  \    - Add the following line, which is required for the image upload functionality:\n    ```\n    VITE_IMGBB_API_KEY=your_api_key_here\n\
  \    ```\n    *(Note: The key is safe to expose as it is a free, public key with no associated account\
  \ data.)*\n4.  **Start the development server**:\n    ```sh\n    npm run dev\n    ```\n    This will\
  \ open the site on [http://localhost:5173](http://localhost:5173). The server will automatically reload\
  \ when you save changes.\n"

readme_excerpt: "# Investigating the Influence of Growth Arrest Mechanisms on Tumour Responses to Radiotherapy\n\
  \nThis repository contains the MATLAB code used to generate the three virtual tumour populations studied\
  \ in the paper *\"Investigating the Influence of Growth Arrest Mechanisms on Tumour Responses to Radiotherapy\"\
  * [1] and to numerically solve the ODE model for radiotherapy response proposed in [1]. All details\
  \ for how to run the codes, can be found in the MATLAB scripts. For reproducibility purposes, we also\
  \ include a spreadsheet that contains the parameter sets that define the three virtual cohorts. \n\n\
  ## References\n- [1] Colson, C., Maini, P.K. and Byrne, H.M., 2023. Investigating the Influence of Growth\
  \ Arrest Mechanisms on Tumour Responses to Radiotherapy. Bulletin of Mathematical Biology, 85, p.74.\
  \ https://doi.org/10.1007/s11538-023-01171-2\n\n\n"

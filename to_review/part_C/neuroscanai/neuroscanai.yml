readme_excerpt: "# NeuroScanAI\n\nAI-powered cross-platform medical imaging platform for Brain Tumor Segmentation\
  \ and Alzheimer Stage Classification using Deep Learning, Computer Vision, and Full-Stack Development\
  \ technologies.\n\n---\n\n## Overview\n\nNeuroScanAI is a cross-platform healthcare platform developed\
  \ for automated Brain Tumor Segmentation and Alzheimer MRI Classification using AI-powered medical imaging\
  \ pipelines.\n\nThe platform includes:\n- React.js web application\n- Flutter mobile application\n-\
  \ FastAPI backend\n- PyTorch + MONAI deep learning models\n- MySQL database integration\n\nThe system\
  \ supports secure doctor-patient workflows including MRI upload, AI-assisted analysis, report generation,\
  \ and patient report delivery.\n\n---\n\n## Key Features\n\n- Brain Tumor Segmentation using SegResNet\
  \ + MONAI\n- Alzheimer Stage Classification using ResNet50 CNN\n- MRI slice preview and segmentation\
  \ overlays\n- Role-based authentication and access control\n- Doctor-patient workflow management\n-\
  \ Automated PDF medical report generation\n- Cross-platform web and mobile applications\n- AI-powered\
  \ MRI preprocessing and inference pipelines\n\n---\n\n## Technology Stack\n\n### Frontend & Mobile\n\
  - React.js\n- Flutter\n- Tailwind CSS\n- Bootstrap\n\n### Backend\n- FastAPI\n- MySQL\n- SQLAlchemy\n\
  \n### AI / Machine Learning\n- PyTorch\n- MONAI\n- OpenCV\n- NumPy\n- Matplotlib\n\n---\n\n## Project\
  \ Architecture\n\n```text\nReact Web App        Flutter Mobile App\n        │                    │\n\
  \        └────── API Requests ──────┘\n                     │\n               FastAPI Backend\n    \
  \                 │\n       ┌─────────────┴─────────────┐\n       │                           │\n Brain\
  \ Tumor Pipeline      Alzheimer Pipeline\n (SegResNet + MONAI)       (ResNet50 CNN)\n       │      \
  \                     │\n       └────────── MRI Analysis ───┘\n                     │\n            \
  \     MySQL Database\n```\n\n---\n\n## Brain Tumor Segmentation Workflow\n\n1. Upload multimodal MRI\
  \ scans (T1C, T1N, T2F, T2W)\n2. MRI preprocessing and normalization\n3. SegResNet performs voxel-level\
  \ segmentation\n4. Segmentation overlays generated\n5. Doctor reviews AI-assisted analysis\n6. PDF report\
  \ generated and delivered to patient\n\n---\n\n## Future Improvements\n\n- Cloud deployment\n- Real-time\
  \ MRI streaming\n- Advanced explainable AI visualization\n- Multi-language support\n- PACS/DICOM integration\n\
  - Hospital management integration\n\n---\n\n## Author\n\nMuhammad Addan Raja\n"

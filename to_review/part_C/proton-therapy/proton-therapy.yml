readme_excerpt: "# Proton-therapy\n\nThis repository aims to guide the analysis of **proton Bragg peaks**\
  \ through interactive simulations and provide tools to study Bragg peaks using real data collected from\
  \ a proton accelerator (cyclotron).\nIt was prepared for high school students as part of the **Physics\
  \ Project Days (PPD) 2025**, taking place at thw Université catholique de Louvain (UCLouvain).\n\n##\
  \ Context\n\nThis project is set in the context of **proton therapy**, a form of cancer treatment where\
  \ high-energy proton beams are accelerated and directed at tumors.  \nUnlike X-rays used in standard\
  \ radiotherapy, protons release most of their energy at a well-defined depth inside the tissue.\n\n\
  - This sharp rise and fall in energy deposition is known as the **Bragg Peak**.  \n- By tuning the beam\
  \ energy, the maximum dose can be precisely delivered to the tumor while minimizing damage to healthy\
  \ tissue.  \n\n---\n\n## Physics Background\n\nThe modeling of the Bragg Peak follows the **Bethe–Bloch\
  \ equation**, which describes the energy loss of charged particles as they pass through matter.  \n\
  Key features include:\n- A gradual energy loss as the proton travels through tissue.  \n- A sharp maximum\
  \ (the Bragg Peak) where the proton deposits most of its energy just before coming to rest.  \n\nUnderstanding\
  \ and analyzing this behavior is crucial for:\n- Optimizing treatment planning in proton therapy.  \n\
  - Comparing simulations with **real experimental data** from proton accelerators.  \n\n\n## Getting\
  \ Started\n\n### 1. Clone this repository\n\nOpen a terminal and run:\n\n```bash\ngit clone https://github.com/zahraadaher/Proton-therapy.git\n\
  cd <Proton-therapy>\n```\n\n### 2. Create an environment\n\nIf you have Anaconda or Miniconda installed,\
  \ create the environment from the provided file:\n\n```bash\nconda env create -f environment.yml\nconda\
  \ activate proton-therapy-sim\n```\n\n### 3. Launch Jupyter Notebook\n\nOnce the environment is active,\
  \ run:\n\n```bash\njupyter notebook\n```\n\nThen open the tutorial notebook file (Tutorial.ipynb) included\
  \ in this repo.\n\n"

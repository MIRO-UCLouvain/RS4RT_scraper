readme_excerpt: "# Multi-Channel Convolutional Analysis Operator Learning for Dual-Energy CT Reconstruction\n\
  \nThis repository contains the Matlab code for the Multichannel Convolutional Analysis Operator Learning\
  \ (MCAOL) and reconstruction method with the XCAT Dual energy CT (DECT) dataset. \n\n## Subdirectories:\n\
  - **MCAOL-Testing**: main script and function to perform MCAOL Dual energy CT reconstruction;\n- **MCAOL-Training**:\
  \ main script and function to perform the training of the convolutional filters using MCAOL;\n- **data**:\
  \ XCAT DECT dataset;\n- **Utilis**: L-BFGS solver and CT operators\n\n## Reference\n- A. Perelli, S.\
  \ Alfonso Garcia, A. Bousse, J.P. Tasu, N. Efthiamidis, ”Multi-Channel Convolutional Analysis Operator\
  \ Learning for Dual-Energy CT Reconstruction”, Physics in Medicine & Biology, 67(6), 065001, 2022, (https://doi.org/10.1088/1361-6560/ac4c32)\n\
  \n"

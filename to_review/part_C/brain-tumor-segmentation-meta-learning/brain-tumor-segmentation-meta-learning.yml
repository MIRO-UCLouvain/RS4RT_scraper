  ## Getting Started


  Clone the repository:


  ```bash

  git clone https://github.com/debika-choudhury/brain-tumor-segmentation-meta-learning.git

  ```


  Install the required packages:


  ```bash

  pip install -r requirements.txt

  ```


  Open the notebooks using Jupyter Notebook or Google Colab and execute them in the following order:


  1. `DataPrep&BaselineModel_source_code.ipynb`

  2. `MAML_source_code.ipynb`



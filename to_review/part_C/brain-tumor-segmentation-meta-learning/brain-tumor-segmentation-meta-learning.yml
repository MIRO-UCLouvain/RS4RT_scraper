readme_excerpt: '# 🧠 Brain Tumor Segmentation using Meta-Learning


  A deep learning project for **brain tumor segmentation** on multi-modal MRI scans using a **2D U-Net
  baseline** and **Model-Agnostic Meta-Learning (MAML)** to improve few-shot adaptation across multiple
  BraTS datasets.


  ---


  ## Overview


  Brain tumor segmentation is an essential task in medical image analysis, supporting diagnosis, treatment
  planning, and disease monitoring. Traditional deep learning models often require large labeled datasets
  and struggle to generalize to new domains with limited training samples.


  This project develops an end-to-end segmentation pipeline using multiple **BraTS** datasets. A custom
  U-Net model serves as the baseline, while a MAML-based meta-learning framework enables rapid adaptation
  to new datasets using only a small number of labeled examples.


  ---


  ## Key Features


  - Multi-modal MRI brain tumor segmentation

  - Custom 2D U-Net baseline implemented in PyTorch

  - Model-Agnostic Meta-Learning (MAML) for few-shot learning

  - Unified preprocessing pipeline for multiple BraTS datasets

  - Training and evaluation on multi-class segmentation masks

  - Quantitative and qualitative performance comparison



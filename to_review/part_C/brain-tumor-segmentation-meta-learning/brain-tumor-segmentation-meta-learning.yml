  ## Dataset


  The project uses publicly available **Brain Tumor Segmentation (BraTS)** datasets containing four MRI
  modalities:


  - T1

  - T1ce

  - T2

  - FLAIR


  Multiple BraTS releases were used to evaluate the model''s ability to adapt across different domains.


  ---


  ## Methodology


  The workflow consists of:


  - MRI preprocessing and normalization

  - 3D volume to 2D slice extraction

  - Multi-modal image preparation

  - Custom U-Net baseline training

  - MAML-based few-shot adaptation

  - Quantitative and qualitative evaluation



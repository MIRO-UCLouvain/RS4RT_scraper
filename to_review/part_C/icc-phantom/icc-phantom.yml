readme_excerpt: "\n# ICC Calculation Scripts and Plotting Functions\n\n![3D Phantoms ICC Analysis](flow.png)\n\
  Welcome to the official repository for Radiomic Features of planning CT and cone-beam CT: A cross-sectional\
  \ and Longitudinal Analysis of Robustness and Consistency.\nThis repository contains all the necessary\
  \ scripts and templates to perform ICC calculations and generate plots for radiomic features.\n\n##\
  \ Data Folder\nThe `Pyradiomics_Params_CT.yaml` file is used for extracting RFs from the original images.\n\
  The `data` folder contains all the files with radiomic feature values. Here is a detailed breakdown\
  \ of the file structure and contents:\n\n1. **File Naming Convention**:\n    - The first number in the\
  \ file name represents different machines.\n    - Numbers 1-4 indicate CBCT machines.\n    - Numbers\
  \ 5-6 indicate CT machines.\n\n2. **File Structure**:\n    - Each file contains 180 rows, representing\
  \ 12 repeated scans of 15 phantoms (12 × 15 = 180).\n    - The 12 repeated scans are divided as follows:\n\
  \        - The first 5 scans are repeated within one day.\n        - The remaining 7 scans are conducted\
  \ approximately one week apart.\n    - The exact time of each scan can be determined from the suffix\
  \ in the `patient` column.\n\n3. **Column Naming**:\n    - Each column name represents a radiomic feature.\n\
  \    - The names are primarily composed of three parts:\n        - **Filters**: Examples include `original`,\
  \ `wavelet-HHH`, etc. Detailed information can be found in the `filters.txt` file.\n        - **RF Groups**:\
  \ Examples include `firstorder`, `glcm`, etc. Detailed information can be found in the `features.txt`\
  \ file under the `key` section.\n        - **RFs**: Examples include `10Percentile`, `90Percentile`,\
  \ etc. Detailed information can be found in the `features.txt` file under the `value` section.\n   \
  \     - Note: Shape-related features exist only within the `original` filter. Since this experiment\
  \ uses phantoms as scanning objects, ICC values for these features are not calculated.\n\n## Usage\n\
  \nTo use these scripts and templates, follow these steps:\n\n1. Clone the repository:\n    ```bash\n\
  \    git clone https://github.com/MaastrichtU-CDS/radiomics-ct-cbct-tianjin-3Dphantom.git\n    ```\n\
  \n2. Navigate to the repository directory:\n    ```bash\n    cd radiomics-ct-cbct-tianjin-3Dphantom\n\
  \    ```\n\n3. Run ICC_analysis.py for ICC calculation. For more details on ICC analysis, see the [ICC\
  \ Analysis Script](#icc-analysis-script) section below.\n\n## ICC Analysis Script\n\nThis script performs\
  \ ICC calculations based on the provided parameters and data. The script name is `ICC_analysis.py`.\n\
  \n### Command-Line Arguments\n\n- `--input_path`: Path to the input TXT file containing paths to CSV\
  \ files.\n  - **Type**: `str`\n  - **Required**: `True`\n  - **Example**: `--input_path /path/to/input.txt`\n\
  \  - **Description**: This argument specifies the path to a TXT file that contains the paths to the\
  \ CSV files to be processed.\n\n- `--rows_number`: An integer range separated by commas.\n  - **Type**:\
  \ `str`\n  - **Required**: `True`\n  - **Example**: `--rows_number 0,15`\n  - **Description**: This\
  \ argument specifies the range of rows to be processed, separated by commas. For example, `0,15`.\n\n\
  - `--col_name`: Column name to filter.\n  - **Type**: `str`\n  - **Required**: `True`\n  - **Example**:\
  \ `--col_name FeatureName`\n  - **Description**: This argument specifies the name of the column to be\
  \ filtered in the CSV files.\n\n- `--output_path`: Output folder path.\n  - **Type**: `str`\n  - **Default**:\
  \ `results`\n  - **Example**: `--output_path /path/to/output`\n  - **Description**: This argument specifies\
  \ the path to the output folder where the results will be saved. If not provided, the default folder\
  \ is `results`.\n\n- `--subset_number`: Subset selection.\n  - **Type**: `str`\n  - **Required**: `True`\n\
  \  - **Example**: `--subset_number 1`\n  - **Description**: This argument specifies the subset to be\
  \ processed. Use `0` for the whole set, `1` for subset1, and `2` for subset2.\n\n### Example Command\n\
  \nHere is an example of how to run the script with the required arguments:\n\n```bash\npython ICC_analysis.py\
  \ --input_path /path/to/input.txt --rows_number '0,15' --col_name FeatureName --output_path /path/to/output\
  \ --subset_number 1\n```\n\n### Script Description\n\nThe `ICC_analysis.py` script reads the specified\
  \ CSV files, filters the data based on the provided column name and row range, and performs ICC calculations.\
  \ The results are then saved to the specified output folder.\n\n## Contact\n\nFor any questions or issues,\
  \ please contact us at [minghua.li@maastro.nl](mailto:minghua.li@maastro.nl).\n\nThank you for using\
  \ our ICC calculation scripts and plotting functions. We hope you find them helpful!\n\n---\n"

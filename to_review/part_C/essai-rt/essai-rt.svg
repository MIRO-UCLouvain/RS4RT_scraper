<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1226"/>
      <stop offset="1" stop-color="#070a17"/>
    </linearGradient>
    <radialGradient id="dose" cx="50%" cy="50%" r="50%">
      <stop offset="0"    stop-color="#fef3c7"/>
      <stop offset="0.18" stop-color="#fbbf24"/>
      <stop offset="0.40" stop-color="#fb7185"/>
      <stop offset="0.64" stop-color="#c026d3"/>
      <stop offset="0.85" stop-color="#7c3aed"/>
      <stop offset="1"    stop-color="#3730a3"/>
    </radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- icon -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#bg)"/>
    <!-- soft glow halo -->
    <circle cx="60" cy="60" r="40" fill="#c026d3" opacity="0.35" filter="url(#glow)"/>
    <!-- isodose target (plasma) -->
    <circle cx="60" cy="60" r="42" fill="url(#dose)"/>
    <circle cx="60" cy="60" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.4"/>
    <circle cx="60" cy="60" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="1.4"/>
    <circle cx="60" cy="60" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.4"/>
    <!-- crosshair / isocentre -->
    <line x1="60" y1="9" x2="60" y2="111" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.3"/>
    <line x1="9" y1="60" x2="111" y2="60" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.3"/>
    <!-- DVH curve -->
    <path d="M14 100 H66 Q86 100 92 80 L100 26" fill="none" stroke="#5eead4" stroke-width="2.6" stroke-linecap="round"/>
    <!-- lens ring -->
    <circle cx="60" cy="60" r="50" fill="none" stroke="url(#acc)" stroke-width="3.2"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(166,0)">
    <text x="0" y="78" font-size="44" font-weight="700" fill="#0f172a">Essai<tspan fill="url(#acc)">RT</tspan></text>
    <text x="2" y="104" font-size="16" font-weight="500" fill="#64748b" letter-spacing="0.4">Automated radiotherapy plan QC from DICOM</text>
  </g>
</svg>

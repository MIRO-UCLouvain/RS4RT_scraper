readme_excerpt: "# Radiomics for classification prcc vs non prcc\n\n## Description\nRenal tumor classification\
  \ is challenging due to similar imaging features. This study uses radiomics from CT scans (KiTS19) with\
  \ feature selection (RFE, RF importance) and ML models (XGBoost, RF, LR). Logistic Regression + RFE\
  \ performed best (89.8%), highlighting the importance of feature selection for accurate, non-invasive\
  \ diagnosis.\n\n## Dataset Information\n* **Final Dataset (2-Class):** (https://www.kaggle.com/datasets/audreygrcia/kits19-papillary-nonpapillary/versions/1)\n\
  - Total samples: 49 patients \n- Features: ~740 radiomic features\n- Classes:\n  - Papillary\n  - Non-Papillary\
  \ (Chromophobe + Oncocytoma)\n\n* * **Preliminary Dataset (6-Class):** )https://kits19.grand-challenge.org/data/)\n\
  \n \n## Code Information\nThe implementation utilizes a radiomics-based machine learning pipeline designed\
  \ for the classification of renal tumors (Papillary vs Non-Papillary) from CT scan data. The framework\
  \ employs a stacking ensemble approach combining Random Forest and Logistic Regression to balance non-linear\
  \ pattern recognition and linear generalization.\n\nModel interpretability is implicitly supported through\
  \ the use of Logistic Regression, which provides stable global feature relationships, while Random Forest\
  \ captures complex interactions among radiomic features such as texture (GLCM, GLRLM) and intensity-based\
  \ descriptors.\n\n\n## Usage Instructions\n1. **Dataset Preparation** : Prepare the radiomics dataset\
  \ containing extracted features (e.g., shape, first-order statistics, texture features such as GLCM\
  \ and GLRLM). Ensure the dataset is labeled into: Papillary, Non-Papillary (Chromophobe + Oncocytoma)\n\
  2. **Environment Setup**:\nEnsure Python 3.x is installed and all dependencies listed in the Requirements\
  \ section are satisfied.\n3. **Training**:\nRun the training script to perform preprocessing, feature\
  \ selection, and model training using the stacking approach.\n4. **Evaluation**:\nEvaluate the trained\
  \ model using classification metrics such as accuracy, precision, recall, and F1-score.\n\n## Requirements\n\
  To set up the environment, install the following dependencies:\npip install numpy pandas scikit-learn\
  \ matplotlib seaborn\n\n## Methodology (Data Processing & Modeling)\n1. **Preprocessing** : To address\
  \ the high-dimensional and small-sample nature of the radiomics dataset (p >> n), the following steps\
  \ were applied:\n-Feature Selection : Reduces dimensionality and removes redundant radiomic features\
  \ to prevent overfitting.\n-Feature Scaling : StandardScaler is applied to normalize feature distributions\
  \ and ensure comparable feature ranges.\n-Class Balancing: Data filtering was performed to reduce class\
  \ imbalance, resulting in a subset of 33 patients.\n\n2.**Model Architecture** : A stacking ensemble\
  \ framework was implemented to improve generalization performance:\n-Base Learners:\nRandom Forest:\
  \ Captures non-linear interactions and complex feature combinations.\nLogistic Regression: Captures\
  \ global linear relationships and provides stable predictions.\n-Meta Learner:\nLogistic Regression:\
  \ Combines predictions from base learners to produce the final classification.\n\nThis combination is\
  \ motivated by the need for model diversity, where linear and non-linear models provide complementary\
  \ learning representations.\n\n3. **Design Considerations**\n\nThe choice of combining Random Forest\
  \ and Logistic Regression instead of multiple tree-based models (e.g., Random Forest and XGBoost) is\
  \ based on the following considerations:\n\nTree-based models tend to produce highly correlated predictions\
  \ when applied to high-dimensional radiomics data.\nBoosting methods such as XGBoost may amplify noise\
  \ in small datasets, increasing the risk of overfitting.\nCombining linear and non-linear models improves\
  \ diversity in stacking and enhances generalization capability.\n\n## Materials & Methods\n**Dataset\
  \ Description**\nTotal Samples: 49 patients (filtered to 33 for balanced classification)\nFeatures:\
  \ ~740 radiomic features\nClasses:Papillary, Non-Papillary (Chromophobe + Oncocytoma)\n\n**Computing\
  \ Infrastructure**\nOperating System: Windows / macOS / Linux\nPython Version: 3.x\nHardware: Standard\
  \ CPU (no GPU required)\nEvaluation Method\n\nThe system was evaluated using the following approach:\n\
  \n**Training Strategy**:\nModel training was conducted using a structured pipeline including preprocessing,\
  \ feature selection, and stacking-based classification.\nPerformance Metrics:\nAccuracy\nPrecision\n\
  Recall\nF1-score\n**Generalization Analysis**:\nSpecial attention was given to overfitting due to the\
  \ high feature-to-sample ratio. The stacking approach was designed to improve robustness on unseen data.\n\
  Notes on Limitations\nThe dataset size is relatively small, which may affect model generalization.\n\
  Radiomic features may contain redundancy and high correlation.\nResults may vary depending on feature\
  \ selection strategy and random seed.\n"

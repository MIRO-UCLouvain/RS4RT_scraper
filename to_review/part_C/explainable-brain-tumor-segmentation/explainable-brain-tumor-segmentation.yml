readme_excerpt: "# Explainable Brain Tumor Segmentation\n\n> An explainable deep learning framework for\
  \ automated brain tumor segmentation from MRI scans using EfficientNet-B2, U-Net, and Grad-CAM.\n\n\
  ---\n\n```text\n██████╗ ██████╗  █████╗ ██╗███╗   ██╗\n██╔══██╗██╔══██╗██╔══██╗██║████╗  ██║\n██████╔╝██████╔╝███████║██║██╔██╗\
  \ ██║\n██╔══██╗██╔══██╗██╔══██║██║██║╚██╗██║\n██████╔╝██║  ██║██║  ██║██║██║ ╚████║\n╚═════╝ ╚═╝  ╚═╝╚═╝\
  \  ╚═╝╚═╝╚═╝  ╚═══╝\n\n████████╗██╗   ██╗███╗   ███╗ ██████╗ ██████╗\n╚══██╔══╝██║   ██║████╗ ████║██╔═══██╗██╔══██╗\n\
  \   ██║   ██║   ██║██╔████╔██║██║   ██║██████╔╝\n   ██║   ██║   ██║██║╚██╔╝██║██║   ██║██╔══██╗\n  \
  \ ██║   ╚██████╔╝██║ ╚═╝ ██║╚██████╔╝██║  ██║\n   ╚═╝    ╚═════╝ ╚═╝     ╚═╝ ╚═════╝ ╚═╝  ╚═╝\n\n███████╗███████╗\
  \ ██████╗ ███╗   ███╗███████╗███╗   ██╗████████╗ █████╗ ████████╗██╗ ██████╗ ███╗   ██╗\n██╔════╝██╔════╝██╔════╝\
  \ ████╗ ████║██╔════╝████╗  ██║╚══██╔══╝██╔══██╗╚══██╔══╝██║██╔═══██╗████╗  ██║\n███████╗█████╗  ██║\
  \  ███╗██╔████╔██║█████╗  ██╔██╗ ██║   ██║   ███████║   ██║   ██║██║   ██║██╔██╗ ██║\n╚════██║██╔══╝\
  \  ██║   ██║██║╚██╔╝██║██╔══╝  ██║╚██╗██║   ██║   ██╔══██║   ██║   ██║██║   ██║██║╚██╗██║\n███████║███████╗╚██████╔╝██║\
  \ ╚═╝ ██║███████╗██║ ╚████║   ██║   ██║  ██║   ██║   ██║╚██████╔╝██║ ╚████║\n╚══════╝╚══════╝ ╚═════╝\
  \ ╚═╝     ╚═╝╚══════╝╚═╝  ╚═══╝   ╚═╝   ╚═╝  ╚═╝   ╚═╝   ╚═╝ ╚═════╝ ╚═╝  ╚═══╝\n```\n\n---\n\n## Overview\n\
  \nBrain tumor segmentation plays a critical role in computer-aided diagnosis, treatment planning, and\
  \ disease monitoring. Manual delineation of tumor boundaries from Magnetic Resonance Imaging (MRI) scans\
  \ is labor-intensive, time-consuming, and subject to inter-observer variability.\n\nThis repository\
  \ presents an end-to-end deep learning framework for automated brain tumor segmentation that combines\
  \ an EfficientNet-B2 encoder with a U-Net decoder for accurate pixel-level localization. To improve\
  \ transparency and clinical interpretability, Grad-CAM is integrated to generate visual explanations\
  \ highlighting the regions that influence the model's predictions.\n\nThe framework is optimized using\
  \ a hybrid Binary Cross-Entropy (BCE) and Dice Loss function, enabling robust learning on highly imbalanced\
  \ medical imaging datasets while maintaining high segmentation accuracy.\n\n---\n\n## Key Features\n\
  \n- Automated brain tumor segmentation from MRI images\n- EfficientNet-B2 encoder for hierarchical feature\
  \ extraction\n- U-Net decoder with skip connections for precise localization\n- Grad-CAM based explainability\n\
  - Hybrid BCE + Dice Loss optimization\n- Comprehensive evaluation metrics\n- End-to-end reproducible\
  \ training and evaluation pipeline\n\n---\n\n## System Architecture\n\n```text\n                 MRI\
  \ Image\n                     │\n                     ▼\n              Image Preprocessing\n       \
  \              │\n                     ▼\n          EfficientNet-B2 Encoder\n                     │\n\
  \                     ▼\n            Multi-scale Features\n                     │\n             Skip\
  \ Connections\n                     │\n                     ▼\n               U-Net Decoder\n      \
  \               │\n                     ▼\n          Tumor Segmentation Mask\n              │      \
  \          │\n              ▼                ▼\n      Performance         Grad-CAM\n       Evaluation\
  \      Visual Explanation\n```\n\n---\n\n## Repository Structure\n\n```text\nExplainable-Brain-Tumor-Segmentation\n\
  │\n├── dataset/\n├── models/\n├── training/\n├── evaluation/\n├── results/\n├── paper/\n├── presentation/\n\
  ├── requirements.txt\n├── README.md\n└── LICENSE\n```\n\n---\n\n## Installation\n\nClone the repository.\n\
  \n```bash\ngit clone https://github.com/<username>/Explainable-Brain-Tumor-Segmentation.git\ncd Explainable-Brain-Tumor-Segmentation\n\
  ```\n\nInstall the required packages.\n\n```bash\npip install -r requirements.txt\n```\n\n---\n\n##\
  \ Dataset\n\nThe project uses the **Brain Tumor MRI Dataset: Segmentation and Classification**.\n\n\
  Dataset Statistics\n\n| Property | Value |\n|-----------|-------|\n| Images | ~5,000 |\n| Segmentation\
  \ Masks | ~2,700 |\n| Classes | Glioma, Meningioma, Pituitary, No Tumor |\n| Input Resolution | 256\
  \ × 256 |\n\nExpected directory structure:\n\n```text\ndataset/\n├── train/\n│   ├── images/\n│   └──\
  \ masks/\n├── validation/\n│   ├── images/\n│   └── masks/\n└── test/\n    ├── images/\n    └── masks/\n\
  ```\n\n---\n\n## Training\n\nTrain the segmentation model.\n\n```bash\npython train.py\n```\n\nThe training\
  \ pipeline performs:\n\n- Data preprocessing\n- Model initialization\n- Optimization using BCE + Dice\
  \ Loss\n- Checkpoint generation\n- Metric logging\n\n---\n\n## Evaluation\n\nEvaluate the trained model.\n\
  \n```bash\npython evaluate.py\n```\n\nGenerated outputs include:\n\n- Dice Score\n- IoU\n- Precision\n\
  - Recall\n- F1-Score\n- Accuracy\n- Segmentation masks\n- Performance reports\n- Grad-CAM visualizations\n\
  \n---\n\n## Explainability\n\nGrad-CAM is integrated into the inference pipeline to visualize the regions\
  \ responsible for the segmentation output.\n\nGenerated visualizations include:\n\n- Original MRI image\n\
  - Ground truth mask\n- Predicted segmentation\n- Grad-CAM heatmap\n- Overlay visualization\n\n---\n\n\
  ## Model Configuration\n\n| Parameter | Value |\n|-----------|------:|\n| Backbone | EfficientNet-B2\
  \ |\n| Decoder | U-Net |\n| Input Size | 256 × 256 |\n| Optimizer | AdamW |\n| Learning Rate | 1e-4\
  \ |\n| Batch Size | 8 |\n| Epochs | 50 |\n| Loss Function | BCE + Dice Loss |\n| Activation | Sigmoid\
  \ |\n\n---\n\n## Results\n\n| Metric | Score |\n|---------|------:|\n| Dice Score | **0.9457** |\n|\
  \ IoU | **0.8986** |\n| Precision | **0.9484** |\n| Recall | **0.9445** |\n| F1 Score | **0.9464** |\n\
  | Accuracy | **0.9692** |\n\nThe proposed EfficientNet-B2 U-Net framework achieves strong segmentation\
  \ performance while maintaining model interpretability through Grad-CAM.\n\n---\n\n## Citation\n\n```bibtex\n\
  @article{beniwal2026brainsegmentation,\n  title={An Explainable Deep Learning Framework for Automated\
  \ MRI Brain Tumor Segmentation},\n  author={Beniwal, Kunal Singh and Sarkar, Arshia and Kansara, Shubham\
  \ and Ghosh, Arpita},\n  year={2026},\n  institution={Vellore Institute of Technology}\n}\n```\n\n---\n\

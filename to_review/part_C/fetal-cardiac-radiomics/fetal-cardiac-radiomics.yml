readme_excerpt: "# Fetal Cardiac Radiomics Pipeline\r\n\r\nAnalytical code and de-identified dataset for\
  \ the study **\"An exploration of ultrasound-based radiomics combined with machine learning in the diagnosis\
  \ of fetal ventricular disproportion caused by cardiovascular malformations\"**.\r\n\r\nThis pipeline\
  \ implements feature selection and repeated stratified cross-validation for:\r\n1. Three-class one-vs-all\
  \ classification (Control / GroupA / GroupB)\r\n2. Binary classification of GroupA vs GroupB using radiomics,\
  \ clinical, and combined feature sets\r\n3. Sensitivity analyses restricted to (a) left heart obstructive\
  \ lesions and (b) cases with postnatal echocardiographic confirmation\r\n\r\n---\r\n\r\n## Repository\
  \ structure\r\n\r\n```\r\n.\r\n├── analysis_pipeline.R       # Main analysis script\r\n├── data/\r\n\
  │   ├── radiomics_dataset.xlsx  # De-identified dataset\r\n│   └── ICC_select.csv          # Features\
  \ passing ICC reproducibility threshold\r\n├── output/                   # Generated automatically when\
  \ the script is run\r\n└── README.md\r\n```\r\n\r\n---\r\n\r\n## Requirements\r\n\r\n- R version 4.3.3\
  \ or later\r\n- The following R packages (installed automatically if missing):\r\n  `readxl`, `dplyr`,\
  \ `pROC`, `glmnet`, `ranger`, `xgboost`, `tidyr`\r\n\r\n---\r\n\r\n\r\n## Data dictionary\r\n\r\n| Variable\
  \ | Description |\r\n|---|---|\r\n| `No` | Case identifier (re-assigned for sharing; no link to original\
  \ medical records) |\r\n| `Group` | Diagnostic group: \"0\"(Contro), \"1\" (GroupA：ventricular disproportion\
  \ without cardiovascular malformations), \"2\" (GroupB：ventricular disproportion with cardiovascular\
  \ malformations) |\r\n| `Disease` | Specific cardiovascular malformation for GroupB cases |\r\n| `PostnatalEcho`\
  \ | 1 = case with institutional postnatal echocardiographic confirmation; 0 = case followed up at referring\
  \ institutions |\r\n| `Instrument` | Ultrasound machine used \"0\" (E10) or \"1\" (E8))|\r\n| `GA` |\
  \ Gestational age at examination (weeks) |\r\n| `LV_GLS` | Left ventricular global longitudinal strain\
  \ (%) |\r\n| `MV.annulus` | Mitral valve annulus diameter (mm) |\r\n| `RV.LV` | Right-to-left ventricular\
  \ mid-transverse diameter ratio |\r\n| Columns from `AD` onward | Radiomic features extracted from the\
  \ right ventricular free wall, interventricular septum, and left ventricular lateral wall |\r\n\r\n\
  ---\r\n\r\n## Output files\r\n\r\nKey outputs (all CSV) include:\r\n- `3class_OVA_summary.csv`, `binary_AvsB_summary.csv`\
  \ — model performance metrics\r\n- `*_feature_frequency.csv` — within-fold feature selection frequencies\r\
  \n- `*_DeLong.csv` — pairwise model comparisons\r\n- `*_calibration_summary.csv`, `*_calibration_bins.csv`\
  \ — calibration metrics and binned data for plotting\r\n- `*_OOF_predictions.csv` — out-of-fold predicted\
  \ probabilities\r\n- `*_repeat_preds.csv` — per-repetition OOF predictions for ROC confidence band plotting\r\
  \n- `comparison_*_main_vs_SA.csv`, `echo_SA_vs_main_comparison.csv` — primary vs sensitivity analysis\
  \ comparisons\r\n\r\n\r\n## Reproducibility note\r\n\r\nDue to the inherent stochasticity of cross-validation,\
  \ exact numerical reproduction of the reported metrics may show minor deviations (typically <0.02 in\
  \ AUC). The overall conclusions, model rankings, and statistical comparisons remain consistent."

readme_excerpt: 'Brain tumors are among the most critical and life-threatening neurological disorders,
  requiring accurate and early diagnosis for effective treatment. Magnetic Resonance Imaging (MRI) is
  widely used for detecting brain abnormalities. However, manual segmentation and classification are time-consuming,
  subjective, and prone to human error. Conventional deep learning approaches, particularly CNNs, have
  achieved notable success but are limited in capturing global contextual information due to their localized
  receptive fields. To overcome these limitations, this project proposes a Transformer-based framework
  for brain tumor segmentation and classification with lightweight attention refinement. The model utilizes
  a Swin-UNETR JD-based encoder–decoder architecture to effectively capture both local and global features
  from multi-modal MRI images. A lightweight attention mechanism is incorporated to enhance feature representation
  while reducing computational complexity and improving efficiency.The proposed system accurately segments
  tumor regions into clinically significant subregions, including Whole Tumor (WT), Tumor Core (TC), and
  Enhancing Tumor (ET). These segmented regions are further used in an ROI-aware classification module
  to categorize tumors into glioma, meningioma, and pituitary types. Experimental results demonstrate
  improved segmentation accuracy, reduced computational cost, and reliable classification performance.
  Overall, this approach provides an automated, non-invasive, and efficient solution for brain tumor diagnosis,
  supporting clinical decision-making and improving patient outcomes


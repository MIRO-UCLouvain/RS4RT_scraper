readme_excerpt: "# FedOAP\nOfficial Implementation of our paper titled `FedOAP: Cross-Organ Feature Sharing\
  \ for Rapidly Adaptable Federated Tumor Segmentation`. FedOAP is a personalized federated learning framework\
  \ for tumor segmentation that improves cross-organ knowledge sharing while preserving privacy. By leveraging\
  \ Decoupled Cross-Attention and Perturbed Boundary Loss, FedOAP achieves superior segmentation performance\
  \ and adapts effectively to unseen medical domains with minimal fine-tuning.\n<p align=\"center\">\n\
  \  <img src=\"assets/arch.png\" width=\"40%\">\n  <br>\n  <em>Overview of the FedOAP framework.</em>\n\
  </p>\nBy following the instructions below, you can reproduce the results reported in Table 1 of our\
  \ paper without requiring any modifications to the current codebase. Furthermore, this repository contains\
  \ all the code necessary to reproduce the remaining results presented in the paper. However, some experiments\
  \ may require minor modifications or additional configuration changes. Further details regarding these\
  \ cases are provided in the Miscellaneous section.\n<p align=\"center\">\n  <img src=\"assets/main_result.png\"\
  \ width=\"40%\">\n  <br>\n  <em>Table 1 Results of our paper.</em>\n</p>\n\n## Enviromental Setup\n\n\
  ## Execution\nIf you execute each line of the following code, you will get the result of Table 1 associated\
  \ with our paper.\n```bash\ngit clone https://github.com/ishmamt/Federated-Tumor-Segmentation.git\n\
  cd Federated-Tumor-Segmentation/\npip install -r complete_requirements.txt\ngdown https://drive.google.com/file/d/14H14F79l6L4Vbbc-Bd1-Nb9dDNXqnpRb/view?usp=sharing\n\
  unzip extended_data.zip -d datasets/\npython utils.py\nmkdir logs\nbash run.sh\n```\n"

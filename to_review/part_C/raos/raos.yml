readme_excerpt: "# <div align=center> RAOS ([dataset&model weight](https://drive.google.com/drive/folders/1i2xbXxdEYnjNZVUtGZxYdwaeKmNmywnY?usp=sharing),\
  \ [paper](https://arxiv.org/abs/2406.13674))</div>\n**Now, the real CT dataset, trained model/log (based\
  \ on [nnunetv1](https://github.com/MIC-DKFZ/nnUNet/tree/nnunetv1) and [3D-UXNet](https://github.com/MASILab/3DUX-Net))\
  \ and synthetic MRI dataset have been fully released. Please check here [RAOS](https://drive.google.com/drive/folders/1i2xbXxdEYnjNZVUtGZxYdwaeKmNmywnY?usp=sharing).**\n\
  \nRethinking Abdominal Organ Segmentation (RAOS) in the clinical scenario: A robustness evaluation benchmark\
  \ with challenging cases.\n* This dataset consists of 413 real clinical CT scans and 413x9 MR scans,\
  \ all 19 organs were annotated by a senior oncologist (MD. Wenjun Liao, 10 years experiment).\n* some\
  \ challenging cases in clinical practice can help evaluate the generalization and robustness of deep\
  \ learning methods.\n* Some organ annotations not present in previous public datasets (such as prostate,\
  \ seminal vesicles, etc).\n\n<div align=center>Fig. 1. An example in the dataset (one CT and nine synthesized\
  \ MR scans).<img src=\"./pictures/data_show.png\"></div>\n<div align=center>Fig. 2. Clinical distribution\
  \ of the dataset.<img src=\"./pictures/raos_data_distributation.png\"></div>\n\n# DataSet\nDon't hesitate\
  \ to contact Xiangde (luoxd1996 AT gmail DOT com) for the dataset. Two steps are needed to download\
  \ and access the dataset: **1) using your google account to download the data ([Goole Driven](https://drive.google.com/drive/folders/1i2xbXxdEYnjNZVUtGZxYdwaeKmNmywnY))**;\
  \ **2) using your affiliation email to get the unzip password**. We will get back to you within **two\
  \ days**, **so please don't send them multiple times**. We just handle the **real-name email** and **your\
  \ email suffix must match your affiliation**. The email should contain the following information:\n\n\
  \    Name/Homepage/Google Scholar: (Tell us who you are.)\n    Primary Affiliation: (The name of your\
  \ institution or university, etc.)\n    Job Title: (E.g., Professor, Associate Professor, Ph.D., etc.)\n\
  \    Affiliation Email: (the password will be sent to this email, we just reply to the email which is\
  \ the end of \"edu\".)\n    How to use: (Only for academic research, not for commercial use or second-development.)\n\
  \n# Citation\nIt would be highly appreciated if you cite our paper when using this dataset or code:\n\
  \n    @article{luo2022word,\n      title={{WORD}: A large-scale dataset, benchmark and clinically applicable\
  \ study for abdominal organ segmentation from CT image},\n      author={Xiangde Luo, Wenjun Liao, Jianghong\
  \ Xiao, Jieneng Chen, Tao Song, Xiaofan Zhang, Kang Li, Dimitris N. Metaxas, Guotai Wang, and Shaoting\
  \ Zhang},\n      journal={Medical Image Analysis},\n      volume={82},\n      pages={102642},\n    \
  \  year={2022},\n      publisher={Elsevier}}\n\n    @article{luo2024rethinking,\n      title={Rethinking\
  \ Abdominal Organ Segmentation (RAOS) in the clinical scenario: A robustness evaluation benchmark with\
  \ challenging cases},\n      author={Luo, Xiangde and Li, Zihan and Zhang, Shaoting and Liao, Wenjun\
  \ and Wang, Guotai},\n      booktitle={Medical Image Computing and Computer Assisted Intervention --\
  \ MICCAI 2024},\n      year={2024},\n      pages={}}\n    \n## Acknowledgment and Statement\n* Further\
  \ details about this work can be found at [here](https://arxiv.org/abs/2406.13674).\n* Please note that\
  \ a small part of the RAOS dataset is from our previous [WORD](https://github.com/HiLab-git/WORD) (where\
  \ these cases’ annotations are extended from 16 classes to 19 classes), the overlap patients were listed\
  \ in the overlap_with_word.csv.\n* The basic information was listed in raos_dataset_clinical_info.xlsx,\
  \ where the patient did not have an organ annotation means missing organ after surgery (1-19 in men,\
  \ female in 1-17).\n* This project will be maintained by [Xiangde Luo](https://luoxd1996.github.io)\
  \ (from UETSC).\n"

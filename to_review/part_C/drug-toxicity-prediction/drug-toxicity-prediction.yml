readme_excerpt: '# Molecular Architect (Flask)


  This repo contains two trained model bundles:


  - Fingerprint models (12x LightGBM on Morgan 2048-bit): `artifacts_fp/tox21_fp_models.joblib`

  - Descriptor models (12x LogisticRegression pipeline): `artifacts_desc/tox21_descriptor_models.joblib`


  …and a small Flask web app to run inference from a browser UI or JSON API.


  ## Quick start


  1) Create & activate venv


  ```zsh

  cd "/Users/sama/Hackathon/Code Secure"

  python3 -m venv .venv

  source .venv/bin/activate

  ```


  2) Install Python deps


  ```zsh

  pip install -r requirements.txt

  ```


  3) Run the web app


  ```zsh

  python wsgi.py

  ```


  Then open:


  - http://localhost:5000 (UI)

  - http://localhost:5000/api-docs (API docs)

  - http://localhost:5000/health (health)


  ## API


  ### POST `/api/predict`


  Body:


  ```json

  { "smiles": "CC(=O)OC1=CC=CC=C1C(=O)O" }

  ```


  Response:

  - `fingerprint`: dict of Tox21 task probabilities

  - `descriptors`: computed RDKit descriptors

  - `descriptor_models`: LR probabilities + per-feature contributions


  ## Notes


  - RDKit output rendering + PDF export are stubbed in the UI (optional future work).

  - If `lightgbm` fails to import on macOS with a `libomp.dylib` error, install OpenMP:


  ```zsh

  brew install libomp

  ```

  '

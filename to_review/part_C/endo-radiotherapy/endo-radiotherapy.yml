readme_excerpt: "# Endo-Radiotherapy for Retroperitoneal Sarcoma\n\nGeant4 Simulation Code for Endo Radiotherapy\
  \ Testing. This uses alpha particles from Actinium-255 decay accelerated between 5.8 to 8.4 MeV instead\
  \ of in place of proton radiotherapy which is currently mainstream where protons are accelerated to\
  \ 70 - 250 MeV. The shorter penetration range of alpha particles makes them less suceptible to damaging\
  \ healthy cells and their much larger mass and charge allows them to ionise and therefore kill cancer\
  \ cells more easily. \n\nThis type of radiotherapy is particularly useful for the cancer Retroperitoneal\
  \ Sarcoma which is a rare type of cancer that develops in connective tissue, eg. tendons, cartilage,\
  \ nerves, and fat, specifically in the Retroperitoneum. The purpose of this simulation and study is\
  \ to evaluate the effectiveness and viability of this new treatment in comparison to traditional proton\
  \ radiotherapy. \n\nThe simulation code was adapted from the [MolecularDNA Geant4-DNA example](https://geant4-dna.github.io/molecular-docs/),\
  \ with a spherical emission of particles to simulate the radionuclide carriers. \n\n## Installation\n\
  \ \n- Download the files from the GitHub\n- Ensure that CMake, Microsoft Visual Studio and Geant4 have\
  \ been installed, if this is not the case we recommend the following tutorial: [Geant4 Installation](https://youtu.be/GykiM1lPON4?si=QznL75Rlii4i8V60)\
  \ or the author's other tutorials for your relevant operating system.\n- Build the example using CMake\
  \ to the build directory, make sure to uncomment the geometry building section in CMakeLists.txt if\
  \ they have not previously been installed and then open project with Visual Studio and build the project.\n\
  - Finally build the installation, ensuring to copy the exectuable to your build folder with the relevant\
  \ macro files.\n\n## Usage\n\nFollowing the build of the project, run the file using the command:\n\n\
  \    ./cancer.exe -m {macro_file} -t {number_of_threads} -p {physics_list}\n\nThe macro files available\
  \ are:\n- cancer1.mac: For the simulation of cancer cell damage\n- cancer2.mac: For the simulation of\
  \ fat cell damage\n- cancer3.mac: For the simulation of pancreatic cell damage\n- vis.mac for the visualisation\
  \ of the simulations. This can be run with the other macro files by uncommenting the line:\n  \n   \
  \   /control/execute {macro_file}\n\nAll cancer files have their proton alternatives named as: cancer{n}proton.mac\n\
  \nThe physics_list parameter is a choice of numbers between 2 and 6 with the main options being G4EmDNAPhysics_option2,\
  \ G4EmDNAPhysics_option4 or G4EmDNAPhysics_option6\n\nOption 2 is much more widely used and is significantly\
  \ less taxing on your computer, but option 4 offers higher precision. Option 6 is unlikely to be used\
  \ given that it uses more experimental features. \n\nPython File Generate.py is also available in order\
  \ to run large numbers of the simulation while altering parameters. \n"

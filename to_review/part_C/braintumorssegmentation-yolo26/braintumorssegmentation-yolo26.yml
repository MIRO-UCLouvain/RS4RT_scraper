readme_excerpt: "# BrainTumorsSegmentation_yolo26\nBrain tumor segmentation using yolo26-seg and the Roboflow\
  \ file https://universe.roboflow.com/mri-brain-tumor/brain-tumor-segmentation-8aek5/dataset/1\n\nInstallation:\n\
  \nDownload and extract the project folder.\n\nDownload the file https://universe.roboflow.com/mri-brain-tumor/brain-tumor-segmentation-8aek5/dataset/1,\
  \ which requires a Roboflow key that can be obtained for free.\n\nThe result is the Brain tumor segmentation.v1i.yolov8-obb\
  \ ​​folder, which should be placed inside the project folder.\n\nAs with any project testing, it is\
  \ advisable to perform the test in a new environment.\n\nIf you have an older version of YOLO, you must\
  \ update it, otherwise the YOLO26 modules will not be referenced and will not be downloaded automatically\
  \ when requested.\n\n`pip install -U ultralytics`\n\nOtherwise, you must install it.\n\n`pip install\
  \ ultralytics`\n\nA requirements.txt file is attached.\n\nEVALUATION:\n\nRunning:\n\n`TestBrainTumorsSegmentation_yolo26.py`\n\
  \nThree sample images are included.\n\nEach image shows the image labeled by RoboFlow (rectangles appear\
  \ because they have been segmented with only four points), which are assumed to correspond to the tumor's\
  \ location, and the image predicted and segmented by the model.\n\n![Figure 1](https://github.com/ablanco1950/BrainTumorsSegmentation_yolo26/blob/main/Figure_1.png)\n\
  \n\n![Figure 2](https://github.com/ablanco1950/BrainTumorsSegmentation_yolo26/blob/main/Figure_2.png)\n\
  \n\n![Figure 3](https://github.com/ablanco1950/BrainTumorsSegmentation_yolo26/blob/main/Figure_3.png)\n\
  \n\nTRAINING:\n\nThe best.pt model was obtained by running the program\n\nTrainBrainTumorsSegmentation_yolo26.py\
  \ \n\nWith 200 epochs.\n\nIn each epoch, the best and latest models are stored in the directory:\n\n\
  runs/segment/entrenamientos_yolo26/segmentacion_custom/weights\n\nA folder named segmentacion_custom\
  \ is created with each run.\n\nThe folder segmentacion_custom-3.zip containing the reports generated\
  \ during training is included.\n\nThe document LOG200epochTrainBrainTumorsSegmentation_yolo26.docx,\
  \ containing the console messages during training, is also included, resulting in an mAP50 of 0.81 and\
  \ an mAP50-95 of 0.561.\n\n"

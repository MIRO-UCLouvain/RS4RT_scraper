readme_excerpt: "# MAGIC Gamma Telescope Data Analysis\n\nThis repository contains a Jupyter Notebook\
  \ (`models.ipynb`) for analyzing the MAGIC Gamma Telescope dataset, which classifies gamma and hadron\
  \ events based on telescope measurements. The notebook implements machine learning models, including\
  \ k-Nearest Neighbors (kNN) and a neural network, to predict event classes.\n\n## Dataset\nThe dataset\
  \ is sourced from the UCI Machine Learning Repository:\n- **Source**: Dua, D. and Graff, C. (2019).\
  \ UCI Machine Learning Repository [http://archive.ics.uci.edu/ml]. Irvine, CA: University of California,\
  \ School of Information and Computer Science.\n- **Donated by**: P. Savicky, Institute of Computer Science,\
  \ AS of CR, Czech Republic.\n- **Features**: 10 attributes (e.g., `fLength`, `fWidth`, `fSize`, etc.)\
  \ describing telescope measurements.\n- **Target**: Binary classification (`class`: 1 for gamma, 0 for\
  \ hadron).\n\n## Notebook Overview\n- **Data Loading**: Loads `magic04.data` into a Pandas DataFrame.\n\
  - **Preprocessing**: Converts class labels to binary (gamma=1, hadron=0), scales features using `StandardScaler`,\
  \ and oversamples the training set with `RandomOverSampler`.\n- **Visualization**: Plots histograms\
  \ of features for gamma and hadron classes.\n- **Modeling**:\n  - k-Nearest Neighbors (kNN) with `n_neighbors=5`.\n\
  \  - Neural network with TensorFlow/Keras.\n- **Evaluation**: Reports precision, recall, and F1-score\
  \ for both models on the test set.\n- **Results**:\n  - kNN: ~82% accuracy (based on classification\
  \ report).\n  - Neural Network: ~87% accuracy (based on classification report).\n\n## Requirements\n\
  To run the notebook, install the following Python packages:\n```bash\npip install numpy pandas matplotlib\
  \ scikit-learn imblearn tensorflow"

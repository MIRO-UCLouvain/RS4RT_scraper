readme_excerpt: "# Multiscale-Information-Embedded Universal Toxicity Prediction Framework\n[![License:\
  \ GPL-3.0](https://img.shields.io/badge/License-GPL--3.0-blue)](https://github.com/FanmengWang/ToxScan/blob/master/LICENCE.txt)\n\
  [![Static Badge](https://img.shields.io/badge/PyTorch-red)](https://pytorch.org/)\n\n[[Paper]](https://pubs.acs.org/doi/full/10.1021/acs.est.5c04614)\
  \ [[Online Platform]](https://app.bohrium.dp.tech/toxscan/) \n\nThis is the official implementation\
  \ of \"Multiscale-Information-Embedded Universal Toxicity Prediction Framework\"\n\nToxScan is a universal\
  \ toxicity prediction framework to address the toxicity prediction issue.\n<p align=\"center\"><img\
  \ src=\"figures/Overview.png\" width=80%></p>\n<p align=\"center\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<b>An\
  \ illustration of ToxScan and its workflow.</b></p>\n\nDependency\n------------\n - [Uni-Core](https://github.com/dptech-corp/Uni-Core),\
  \ you can check its [Installation Documentation](https://github.com/dptech-corp/Uni-Core#installation).\n\
  \ - ```bash\n   pip install rdkit-pypi==2021.9.4\n   pip install dpdata\n   ```\n\nData Preparation\n\
  ------------\nPlease download the [dataset](https://drive.google.com/file/d/1TZT7pSuM_z8yHkVA9FOzUB2gwe1AiyGe/view?usp=drive_link)\
  \ and place it to the fold `./dataset`, then\n  ```bash\n  cd dataset\n  tar -xzvf dataset.tar.gz\n\
  \  ```\n\nTraining\n------------\n  ```bash\n  bash train.sh\n  ```\n\nInference\n------------\n  ```bash\n\
  \  bash inference.sh\n  ```\n\nEvaluation\n------------\n  ```bash\n  python eval.py\n  ```\n\nOnline\
  \ Platform\n------------\nYou can also try ToxScan online by clicking on this [link](https://funmg.dp.tech/Toxscan)\n\
  \n\nAcknowledgment\n--------\nThis code is built upon [Uni-Mol](https://github.com/dptech-corp/Uni-Mol)\
  \ and [Uni-Core](https://github.com/dptech-corp/Uni-Core). Thanks for their contribution.\n"

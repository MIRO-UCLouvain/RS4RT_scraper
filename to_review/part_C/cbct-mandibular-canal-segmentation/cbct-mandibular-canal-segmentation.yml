readme_excerpt: "# CBCT mandibular canal segmentation\nThis project is currently in progress. I am setting\
  \ up the dataset, checking the image and label structure, and preparing the first segmentation pipeline.\
  \ Training results, evaluation metrics, and example outputs will be added once the data inspection and\
  \ preprocessing steps are complete.\n\n## About the project\nThis repository contains the code for a\
  \ research project on mandibular canal segmentation in dental CBCT images.\n\nThe mandibular canal is\
  \ an important structure in the lower jaw because it contains the inferior alveolar nerve. In dental\
  \ implant planning, its location needs to be identified carefully so that implants can be placed safely\
  \ and without damaging nearby nerves.\n\nThe goal of this project is to build a clear workflow for segmenting\
  \ the mandibular canal from 3D CBCT scans. The work starts with dataset inspection and visualization,\
  \ then moves toward preprocessing, model training, validation, and measurement analysis for implant\
  \ planning.\n\n## Dataset\n\nThis project uses the ToothFairy2 dataset, a public dental CBCT dataset\
  \ created for segmentation of anatomical structures in 3D cone beam CT volumes.\n\nThe dataset contains\
  \ 3D CBCT scans with voxel level annotations for several structures in the jaw and surrounding region.\
  \ In this project, the main focus is the mandibular canal and nearby jaw structures that are relevant\
  \ for dental implant planning.\n\nThe dataset is not included in this repository. \n\n\n## Research\
  \ motivation\n\nManual analysis of CBCT scans can be time consuming and depends on the experience of\
  \ the clinician. For implant planning, even small errors in locating the mandibular canal can matter,\
  \ because the canal is close to the area where implants may be placed.\n\nSome previous work has used\
  \ 2D object detection to localize dental structures with bounding boxes. That can be useful for fast\
  \ localization, but bounding boxes do not describe the full shape of the canal in 3D. In this project,\
  \ I focus on segmentation because a segmentation mask gives a more detailed representation of the canal\
  \ and can later be used for more meaningful measurements.\n\nThe broader aim is to move from simply\
  \ finding the canal to understanding how the result could support safer implant planning.\n\n## Research\
  \ abstract\n\nAccurate localization of the mandibular canal in CBCT imaging is important for dental\
  \ implant planning and for reducing the risk of nerve injury. This project studies mandibular canal\
  \ segmentation in 3D dental CBCT scans using the ToothFairy2 dataset. The workflow includes dataset\
  \ inspection, preprocessing, segmentation model development, and quantitative evaluation.\n\nBeyond\
  \ segmentation itself, the project aims to use the predicted canal masks for implant planning analysis,\
  \ including distance measurements between the canal and surrounding jaw structures. A second goal is\
  \ to compare 3D segmentation with a simpler 2D detection style approach, to understand what anatomical\
  \ information may be lost when the canal is represented only by bounding boxes.\n\n## Planned contributions\n\
  \nThe planned contributions of this project are:\n\n1. A clear workflow for inspecting, preparing, and\
  \ visualizing dental CBCT data.\n\n2. A 3D mandibular canal segmentation pipeline using voxel level\
  \ medical imaging data.\n\n3. A measurement step for implant planning analysis, focused on distances\
  \ between the mandibular canal and surrounding jaw structures.\n\n4. A comparison between 3D segmentation\
  \ and 2D detection style localization.\n\n5. An error analysis to understand difficult cases, such as\
  \ unclear canal boundaries, thin canal regions, image artifacts, and poor anatomical visibility.\n\n\
  ## Why this project matters\n\nThis project is focused on a practical medical imaging problem where\
  \ model accuracy alone is not enough. A useful result should be readable, checkable, and connected to\
  \ the planning task.\n\nThe work is built around a few main ideas:\n\n1. Understand the anatomy before\
  \ modeling.\n\n2. Inspect the data carefully before training.\n\n3. Keep the workflow clear and reproducible.\n\
  \n4. Evaluate results with both numbers and visual checks.\n\n5. Study failure cases, not only average\
  \ scores.\n\n6. Connect segmentation output to implant planning measurements.\n\n\n\n## Installation\n\
  \nCreate a virtual environment:\n\n\npython -m venv .venv\n\n\n.\\.venv\\Scripts\\Activate.ps1\n\npython\
  \ -m pip install --upgrade pip\npython -m pip install -r requirements.txt\n\n\nThe current requirements\
  \ are only for dataset inspection and basic medical image handling. Training libraries will be added\
  \ later when the model development stage begins.\n\n\n\n## Disclaimer\n\nThis project is for research\
  \ and educational purposes only. \nThis repository is part of my medical imaging portfolio.\n"

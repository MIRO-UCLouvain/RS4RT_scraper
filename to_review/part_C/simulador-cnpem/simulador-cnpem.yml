  \ * [Configuration](#configuration)\n   - [Key Dependencies](#key-dependencies)\n   - [Development Notes](#development-notes)\n\
  \   - [Contributing](#contributing)\n   - [License](#license)\n\n## Project Overview\n\n### Context\n\
  Proton beam therapy represents a promising frontier in oncological treatment, offering advantages over\
  \ conventional radiotherapy modalities. The ability of protons to deposit most of their energy at the\
  \ Bragg peak allows for concentrated radiation dose delivery to tumors while minimizing exposure to\
  \ surrounding healthy tissues. This characteristic is particularly advantageous for tumors located near\
  \ vital organs and in pediatric treatments.\n\nHowever, widespread adoption of proton therapy faces\
  \ technical and economic challenges, including high infrastructure costs and the need for extreme precision\
  \ in beam targeting. This project addresses these challenges through an innovative approach of rotating\
  \ the patient instead of the beam, potentially reducing operational costs and increasing treatment accessibility.\n\
  \n### Physical Implementation\nBelow are images of the actual device implementation:\n\n<table>\n<tr>\n\
  <td><img src=\"figures/dispositivos/dispositivo.jpeg\" alt=\"Device with calibration plate\" width=\"\
  400\"/></td>\n<td><img src=\"figures/dispositivos/dispositivo_tumor.jpeg\" alt=\"Device with tumor\"\
  \ width=\"400\"/></td>\n</tr>\n<tr>\n<td align=\"center\"><em>Device setup with calibration plate</em></td>\n\
  <td align=\"center\"><em>Device setup with tumor model</em></td>\n</tr>\n</table>\n\nThe device consists\
  \ of a goniometer placed between two cameras, with a laser system controlled by mirrors for beam targeting.\
  \ The setup allows for precise calibration and tumor targeting through controlled rotations and beam\
  \ positioning.\n\n### System Architecture\n\n<img src=\"figures/diagrama_dispositivo.png\" alt=\"System\
  \ diagram\" width=\"800\"/>\n\nThe simulator consists of several key components:\n\n- **Goniometer**:\
  \ Simulates patient chair rotation, positioned between two cameras\n- **Cameras**: \n  - Camera A: Acts\
  \ as a tomograph, capturing tumor images at various angles\n  - Camera B: Handles laser calibration\
  \ and position verification\n- **Laser System**:\n  - Controlled via MCP board\n  - Directed by two\
  \ mirrors (X and Y axes)\n  - Powered by FAST-PS sources\n- **Control Software**: Manages calibration,\
  \ imaging, and beam targeting\n\n### Implementation Details\n\n#### 1. Calibration Process\nThe calibration\
  \ involves multiple steps:\n- Alignment of calibration plate with Camera A\n- 89-degree rotation for\
  \ laser calibration\n- Manual and fine-tuned laser positioning\n- Centroid detection for precise targeting\n\
  \n#### 2. Tomographic Imaging\n- Captures 360 tumor images at 1-degree intervals\n- Generates 3D tumor\
  \ model from silhouettes\n- Converts pixel coordinates to cylindrical coordinates for processing\n\n\

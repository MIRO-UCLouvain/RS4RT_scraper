readme_excerpt: "# relative_dose_1d\n\nPython package to read 1-dimensional dose profile from text file\
  \ to perform subtraction and gamma analysis.\n\n![image_gui](/docs/assets/GUI_v015.PNG)\n\n## [Documentation](https://relative-dose-1d.readthedocs.io/en/latest/intro.html)\n\
  \n## Features\n\n### For gamma analysis\n* Interpolation between points\n* Profile positions does not\
  \ require to be equal\n```{note}\n* The gamma analysis algorithm is limited to absolute normalization\
  \  relative to the maximum dose.\n```\n\n### For data import\n* PTW (R) and Varian (R) data formats\
  \ suported.\n\n## Format specifications\nData should be in a numpy array with two columns, corresponding\
  \ to positions and\ndose values, respectively.\n\nThe package has been tested with the following examples:\n\
  \n* File in w2CAD format (used by the TPS Eclipse 16.1, from the Varian(R) company).\n  In the algorithm,\
  \ the start of the data is identified by the words: 'STOM' or 'STOD'\n  Physical unit assumed to be\
  \ in mm.\n\n* File in mcc format (used by Verisoft 7.1.0.199 software, from PTW(R) company).\n  In the\
  \ algorithm, the beginning of the data is identified by the word: 'BEGIN_DATA'\n  Physical unit assumed\
  \ to be in mm.\n\n* File in text format\n  The data must be distributed in M ​​rows by 2 columns and\
  \ separated\n  for a blank space.\n  The script ask for a word to identify the beginning of the data\
  \ in the text file, \n  a number to add to the positions, and a factor for distance dimension conversion.\n\
  \n## Installation\n**Linux**<br/>\nThe easiest method of installation is by typing in a terminal:\n\
  ```bash\npip install relative_dose_1d\n```\n**Windows**<br/>\n\nPrior to installation, it is necessary\
  \ to have a python package manager. If you are not familiar with Python packages, it is recommended\
  \ to use [ANACONDA](https://www.anaconda.com/products/individual).\nAfter ANACONDA has been installed,\
  \ open *Anaconda Prompt*. Once inside the terminal (window with a black background), follow the indication\
  \ described for Linux (previous paragraph).\n\n## Usage\n\nOnce the installation is complete, open a\
  \ terminal (or Anaconda Prompt in the case of Windows) and type the command **python**:\n\n```bash\n\
  python\n```\nFinally, write:\n\n```python\nimport relative_dose_1d.GUI\n```\n\n## Contributing\n\n###\
  \ Submitting bugs\nThe easiest way to contribute is to report bugs. Submit bugs via a Github issue [here](https://github.com/LuisOlivaresJ/relative_dose_1d/issues).\n\
  \n### \nSuggesting ideas\nIdeas are always welcome (though they might not get implemented). You can\
  \ submit new ideas [here](https://github.com/LuisOlivaresJ/relative_dose_1d/issues).\n\n## Changelog\n\
  April-2023  Versión 0.0.3\n  * *relative_dose_1d* is added to [PyPi](https://pypi.org/)\n\nMay-2023\
  \ Version 0.1.0\n  * It is now possible to perform unit transformation for distance using a multiplication\
  \ factor, and move the origin of the coordinate system.\n\nMay-2023 Version 0.1.2\n  * New web page\
  \ for documentation, following [PEP 287 – reStructuredText Docstring Format](https://peps.python.org/pep-0287/)\
  \ and [napoleon extension](https://www.sphinx-doc.org/en/master/usage/extensions/napoleon.html#module-sphinx.ext.napoleon)\n\
  \nMay-2023 Version 0.1.3\n  * [Interpolation error](https://github.com/LuisOlivaresJ/relative_dose_1d/issues/1)\
  \ solved.\n\nJul-2023 Version 0.1.4 - 0.1.6\n* Two new functions, [build_from_array_and_step](Tools_module_label)\
  \ to add physical positions, and [plot](GUI_tool_module_label) to show a GUI. \n* [New GUI_tool module](GUI_tool_module_label).\n\
  * Now it is possible to change tolerance parameter for gamma evaluation.\n* Pass rate, total and evaluated\
  \ points are now displayed on the GUI.\n* gamma_1d function returns the number of evaluated points.\n\
  \nAug-2023 Version 0.1.7\n* The plot function can be called outside relative_dose_1d application."

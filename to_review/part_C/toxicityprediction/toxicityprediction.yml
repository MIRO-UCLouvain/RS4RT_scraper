readme_excerpt: "# Toxicity Prediction of Molecules\n\n## Project Overview\n\nThis project predicts whether\
  \ a molecule is Toxic or Non-Toxic based on molecular descriptors. It uses machine learning with feature\
  \ selection and nested cross-validation to ensure robust performance.\n\nType: Binary Classification\n\
  \nFeatures: 1200+ molecular descriptors\n\nTarget: Class → Toxic / Non-Toxic\n\n## Pipeline Workflow\n\
  \n```\nRaw Data\n   │\n   ├─ EDA → understand dataset & target distribution\n   │\n   ├─ Preprocessing\n\
  \   │    ├─ Encode target\n   │    ├─ Remove constant features\n   │    └─ Scale features\n   │\n  \
  \ ├─ Pipeline\n   │    ├─ Feature selection (SelectKBest)\n   │    └─ Random Forest classifier\n   │\n\
  \   └─ Nested Cross-Validation\n        ├─ Inner loop: hyperparameter tuning\n        └─ Outer loop:\
  \ model evaluation\n```\n        \n\n# Project Workflow Summary\n\n## 1. Exploratory Data Analysis (EDA):\n\
  \n* Examine dataset shape, data types, missing values, and statistical summaries.\n\n* Visualize target\
  \ distribution and feature correlations to understand patterns and relationships.\n\n## 2. Preprocessing:\n\
  \n* Encode the target variable (Toxic/NonToxic) into numerical labels.\n\n* Remove constant features\
  \ to reduce redundancy.\n\n* Scale features to normalize the data for machine learning models.\n\n##\
  \ 3. Feature Selection + Random Forest Pipeline:\n\n* Use SelectKBest to select the most relevant molecular\
  \ descriptors.\n\n* Train a Random Forest classifier on the selected features.\n\n* Feature selection\
  \ is applied inside the pipeline to prevent data leakage.\n\n## 4. Nested Cross-Validation with Hyperparameter\
  \ Tuning:\n\n* Inner loop: tune hyperparameters (k, n_estimators, max_depth) using GridSearchCV.\n\n\
  * Outer loop: evaluate model performance on unseen data for unbiased accuracy and F1-score.\n\n* Ensures\
  \ robust evaluation, especially with imbalanced classes.\n\n## Results\n\n* Nested CV Accuracy: Mean\
  \ accuracy across outer folds\n\n* Fold-wise metrics: Precision, Recall, F1-score for Toxic and Non-Toxic\
  \ classes\n\n\n# Insights: Detects imbalance and identifies which features contribute most to toxicity\
  \ classification.\n\n\n## Future Enhancements\n\n* Experiment with ensemble models (Random Forest +\
  \ XGBoost)\n\n* Apply SMOTE or oversampling for better minority class detection\n\n* Analyze feature\
  \ importance to identify key molecular descriptors influencing toxicity\n\n\n## License\n\nMIT License\
  \ © Fred Njalale\n"

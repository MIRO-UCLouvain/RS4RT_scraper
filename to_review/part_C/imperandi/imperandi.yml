readme_excerpt: "# **IM**aging **PRE**processing **A**nd **N**ormalization for **D**iagnostic **I**nteroperability\n\
  \n![image](https://raw.githubusercontent.com/dmandache/IMPERANDI/main/static/imperandi-logo.png)\n\n\
  ![Python](https://img.shields.io/badge/python-3.10%20%7C%203.11%20%7C%203.12-blue)\n[![Documentation](https://readthedocs.org/projects/imperandi/badge/?version=latest)](https://imperandi.readthedocs.io/en/latest/)\n\
  [![Code style](https://img.shields.io/badge/code%20style-black-000000.svg)](https://github.com/psf/black)\n\
  ![Linting](https://img.shields.io/badge/lint-ruff-red)\n![Tests](https://github.com/dmandache/IMPERANDI/actions/workflows/tests.yml/badge.svg?branch=main)\n\
  [![codecov](https://codecov.io/gh/dmandache/IMPERANDI/branch/main/graph/badge.svg)](https://codecov.io/gh/dmandache/IMPERANDI)\n\
  \nIMPERANDI is a Python framework and CLI for building analysis-ready CT imaging cohorts from heterogeneous\
  \ DICOM sources. It standardizes identifiers, curates volume-level metadata, converts volumes to NIfTI,\
  \ and supports downstream segmentation, perfusion phase detection, radiomics extraction, and quality\
  \ control in one coherent pipeline.\n\n_This work performed under the RHU OPERANDI project was supported\
  \ in part by the French National Research Agency (Agence Nationale de la Recherche, ANR) as its 3rd\
  \ PIA, integrated to France 2030 plan under reference ANR-21-RHUS-0012._\n\n## Why IMPERANDI matters\n\
  \n- Reduces manual data wrangling by turning raw DICOM trees into structured cohort tables.\n- Improves\
  \ reproducibility with explicit CSV outputs at every stage and deterministic ID logic.\n- Improves reliability\
  \ on real hospital exports with archive support, failure tracking, and resumable workflows.\n- Keeps\
  \ adoption practical in secure environments with a lightweight Python-first toolchain.\n\n## Current\
  \ framework functionalities\n\n### 1) Ingest and harmonize imaging metadata (`parse` + `clean` = `ingest`)\n\
  \n- Scans DICOM files from folders, globbed roots, and nested archives (`.zip`, `.tar`, `.tar.gz`, `.tgz`).\n\
  - Extracts selected DICOM header tags into a raw metadata table (`dicom_index.csv`).\n- Builds stable\
  \ patient/study/series identifiers from tags, folder structure, or hybrid fallback rules.\n- Applies\
  \ manifest-driven hooks for patient-key standardization and derived columns.\n- Cleans and curates CT\
  \ cohorts by filtering modality/noise patterns, localizers, non-target anatomy, non-axial acquisitions,\
  \ and implausible scan geometry.\n- Aggregates slices into robust volume-level records and computes\
  \ exam/acquisition ordering.\n\nImpact: turns fragmented acquisition data into a consistent cohort backbone\
  \ that downstream models and analytics can trust.\n\n### 2) Convert DICOM volumes to NIfTI (`convert`)\n\
  \n- Converts curated DICOM volume rows to NIfTI in parallel using `dicom2nifti`.\n- Preserves source-to-output\
  \ traceability in a CSV (`nifti_path` per row).\n- Handles archive-backed DICOM paths transparently\
  \ via on-demand materialization.\n- Writes explicit conversion error tables without aborting the whole\
  \ run.\n\nImpact: creates a standardized imaging representation for model training, segmentation, and\
  \ feature extraction at scale.\n\n### 3) Configurable segmentation (`segment`)\n\n- Runs configurable\
  \ task pipelines (default backend: TotalSegmentator).\n- Dispatches CT and MR/MRI volumes to separate\
  \ manifest-defined\n  TotalSegmentator model lists.\n- Adds optional post-processing (mask merge, closing,\
  \ hole filling, largest connected component).\n- Uses multiprocessing with timeout controls and produces\
  \ warning/error tracking CSVs.\n\nImpact: converts CT and MR volumes into ready-to-use anatomical/tumor\
  \ masks\nwith operational safeguards for large cohort processing.\n\n### 4) Contrast phase curation\
  \ (`phase`)\n\n- Resolves an ordered YAML-defined fallback chain across explicit ontology,\n  metadata\
  \ rules, and TotalSegmentator prediction.\n- Restricts the bundled TotalSegmentator phase predictor\
  \ to CT by default.\n- Appends canonical `phase` provenance and `totalseg_*` prediction fields when\n\
  \  model inference is needed.\n- Captures per-row failures into dedicated error outputs.\n\nImpact:\
  \ enables phase-aware stratification and analysis without manual review of every study.\n\n### 5) Radiomics\
  \ feature extraction (`radiomics`)\n\n- Extracts PyRadiomics features for organ and tumor regions from\
  \ CT + masks.\n- Includes a organ-minus-tumor extraction path for cleaner parenchyma characterization.\n\
  - Supports optional cohort filtering controls and error-aware output generation.\n- Supports PyRadiomics\
  \ parameterization from either `--pyradiomics_settings /path/to/Params.yaml` or manifest `radiomics`\
  \ settings.\n\nImpact: accelerates feature exctraction for prognostic and response modeling pipelines.\n\
  \n### 6) Interactive quality control viewer (Jupyter)\n\n- Provides a 3D CT/MRI + mask viewer for cohort\
  \ navigation and quick visual QA.\n- Uses HU windows for CT and percentile windows (1st–99th by default)\
  \ for MRI.\n- Supports patient/date/modality/phase exploration, mask overlays, window presets, and keyboard\
  \ navigation.\n\nImpact: shortens the feedback loop between pipeline outputs and clinical/imaging validation.\n\
  \n![image](https://raw.githubusercontent.com/dmandache/IMPERANDI/main/static/viewer-demo.png)\n\n##\
  \ CLI overview\n\nIMPERANDI ships a single CLI with these subcommands:\n\n- `parse`: scan DICOMs and\
  \ build metadata index tables.\n- `clean`: filter and normalize parsed metadata.\n- `ingest`: run `parse`\
  \ then `clean`.\n- `convert`: convert indexed DICOM volumes to NIfTI.\n- `segment`: run configurable\
  \ segmentation on NIfTI volumes (requires _TotalSegmentator_, install with `.[segment]`).\n- `phase`:\
  \ resolve canonical contrast phase; a TotalSegmentator fallback requires\n  `.[segment]`.\n- `radiomics`:\
  \ extract radiomics features from NIfTI volumes and masks (requires _pyRadiomics_, install with `.[radiomics]`).\n\
  \nGet help:\n\n```bash\nimperandi --help\nimperandi parse --help\nimperandi clean --help\nimperandi\
  \ ingest --help\nimperandi convert --help\nimperandi segment --help\nimperandi phase --help\nimperandi\
  \ radiomics --help\n```\n\n## Install\n\nBase install:\n\n```bash\npython -m pip install -e .\n```\n\
  \nSegmentation dependencies:\n\n```bash\npython -m pip install -e \".[segment]\"\n```\n\nRadiomics dependencies:\n\
  \n```bash\npython -m pip install -e \".[radiomics]\"\n```\n\nDevelopment and test tooling:\n\n```bash\n\
  python -m pip install -e \".[dev]\"\n```\n\nEnable tracked git hooks (recommended):\n\n```bash\ngit\
  \ config core.hooksPath .githooks\n```\n\nWith hooks enabled, `git push` strips output/execution state\
  \ from changed `*.ipynb` files, stages those changes, and stops once so you can commit the cleaned notebooks.\n\
  \nInstall everything:\n\n```bash\npython -m pip install -e \".[all]\"\n```\n\nOptional Jupyter kernel\
  \ setup:\n\n```bash\npython -m ipykernel install --user --name imperandi310 --display-name \"IMPERANDI\
  \ (Python 3.10)\"\n```\n\n## Quickstart\n\nRun ingest (parse + clean):\n\n```bash\nimperandi ingest\
  \ \\\n  --root_path /path/to/dicom \\\n  --output_dir /path/to/output \\\n  --manifest generic\n```\n\
  \nConvert to NIfTI:\n\n```bash\nimperandi convert \\\n  --csv_path /path/to/output/dicom_index_clean.csv\
  \ \\\n  --output_dir /path/to/nifti_root \\\n  --csv_path_out /path/to/output/nifti_index.csv\n```\n\
  \nRun segmentation:\n\n```bash\nimperandi segment \\\n  --csv_path /path/to/output/nifti_index.csv \\\
  \n  --csv_path_out /path/to/output/nifti_index_segmented.csv\n```\n\nCurate contrast phase:\n\n```bash\n\
  imperandi phase \\\n  --csv_path /path/to/output/nifti_index_segmented.csv \\\n  --csv_path_out /path/to/output/nifti_index_phased.csv\
  \ \\\n  --manifest generic\n```\n\nExtract radiomics:\n\n```bash\nimperandi radiomics \\\n  --csv_path\
  \ /path/to/output/nifti_index_phased.csv \\\n  --csv_path_out /path/to/output/nifti_index_radiomics.csv\n\
  ```\n\nExtract radiomics with explicit PyRadiomics YAML settings:\n\n```bash\nimperandi radiomics \\\
  \n  --csv_path /path/to/output/nifti_index_phased.csv \\\n  --pyradiomics_settings /path/to/Params.yaml\
  \ \\\n  --csv_path_out /path/to/output/nifti_index_radiomics.csv\n```\n\nUse manifest-defined radiomics\
  \ settings:\n\n```bash\nimperandi radiomics \\\n  --csv_path /path/to/output/nifti_index_phased.csv\
  \ \\\n  --manifest generic \\\n  --csv_path_out /path/to/output/nifti_index_radiomics.csv\n```\n\nIf\
  \ both `--manifest` and `--pyradiomics_settings` are provided, IMPERANDI warns and\nprefers manifest\
  \ `radiomics` settings when that section exists.\n\n## Core outputs\n\n- `parse`:\n  - `dicom_index.csv`\
  \ (resolved IDs and selected DICOM tags)\n  - optional `dicom_tags_snapshot.ndjson` (full recursive\
  \ tags on a sampled subset, via `--snapshot_tags`)\n- `clean`:\n  - cleaned cohort table (default `<input>_clean.csv`)\n\
  - `convert`:\n  - NIfTI-enriched cohort table (`nifti_index.csv` by default)\n  - conversion failures\
  \ (`conv_errors.csv` by default)\n- `segment`, `phase`, `radiomics`:\n  - enriched cohort table + command-specific\
  \ error CSV\n\n## Configuration\n\nIMPERANDI configuration is done through YAML dataset manifests and\
  \ optional hooks.\nManifests hold the declarative settings, while hooks provide Python-based\ncustomization\
  \ when a static file is not enough.\n\nGeneric manifests shipped with the package live in:\n\n- `src/imperandi/builtin_datasets_config/manifests/*.yaml`\n\
  \nTheir built-in hooks live in:\n\n- `src/imperandi/builtin_datasets_config/hooks/`\n\nRepository-specific\
  \ OPERANDI configuration lives in `dataset_configs/` and\nis intentionally not included in installed\
  \ packages.\n\nYou can pass either a manifest name (`generic`, `operandi`) or a custom\nmanifest path.\
  \ The usual customization flow is to copy a built-in YAML file,\nedit `id_extraction`, `id_standardization`,\
  \ `derived_columns`,\n`phase_curation`, `segmentation`, and `radiomics`, then run with\n`--manifest\
  \ ./site-a.yaml`. JSON manifests are not accepted.\n\n`phase_curation.strategies` is an ordered fallback\
  \ chain. It can contain an\nexplicit site ontology, IMPERANDI's metadata rules, TotalSegmentator phase\n\
  prediction, or any combination. The canonical result is written to `phase`,\nwith its provenance in\
  \ `phase_source`, `phase_confidence`, and `phase_reason`.\n\nHooks are normal Python callables referenced\
  \ by manifest keys\n`hook_module` and `function`: `id_standardization` hook rewrites\n`patient_key`,\
  \ while `derived_columns` hook can add fields based on an existing column.\n\nFor configuring radiomic\
  \ extraction, manifest key `radiomics` can directly contain a PyRadiomics-style\nsettings object (same\
  \ structure as `Params.yaml` content).\nOfficial PyRadiomics parameter guide:\n[PyRadiomics customization\
  \ docs](https://pyradiomics.readthedocs.io/en/latest/customization.html).\n\nFor configuring segmentation,\
  \ define CT and/or MR task lists under\n`segmentation.modalities`. CT uses TotalSegmentator tasks such\
  \ as `total`, while\nMR uses the corresponding `_mr` models such as `total_mr`. Logical output names\n\
  can stay consistent across modalities in the cohort CSV.\nOfficial TotalSegmentator task guide:\n[TotalSegmentator\
  \ subtasks guide](https://github.com/wasserth/TotalSegmentator#subtasks).\n\nFull IMPERANDI configuration\
  \ guide: [Documentation](https://imperandi.readthedocs.io/en/latest/manifests.html).\n\n## Performance\
  \ and reliability notes\n\n- Parallel execution controls are available for heavy stages (`parse`, `convert`,\
  \ `segment`).\n- Long-running stages (`parse`, `convert`, `segment`, `phase`, `radiomics`) use a unified\
  \ checkpoint interface:\n  `--checkpoint_every_rows`, `--checkpoint_every_sec`, `--no_resume`, `--strict_resume`.\n\
  - Resume is enabled by default; pass `--no_resume` to disable it.\n- `parse` reads tags from defaults\
  \ (`DEFAULT_DICOM_TAGS`) plus `--tags`; use `--snapshot_tags` for full recursive tag snapshots on sampled\
  \ data.\n- `parse` auto-detects archive-heavy inputs from a deterministic root sample (`--archive_detect_sample_size`)\
  \ and can switch to archive-aware mode at runtime when needed.\n- Archive workflows are bounded by depth\
  \ and include path-safety protections.\n- Most commands support `--dry-run` for pipeline planning and\
  \ CI smoke checks.\n\n## Testing\n\nFast tests are organized under `tests/unit` and run in normal CI:\n\
  \n```bash\npython -m pytest -m \"not s"

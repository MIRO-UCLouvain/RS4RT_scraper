readme_excerpt: " Toxicity Prediction using Random Forest\n\n Overview\nPredicts whether a chemical compound\
  \ isToxic or Non-Toxic using\nmachine learning on high-dimensional molecular descriptor data.\n\n\n\
  \ Dataset\n| Property | Value |\n\n Samples | 171 |\n Features | 1203 |\n Target | Class (Toxic / NonToxic)\
  \ |\n Class Balance | NonToxic = 115 (67%) / Toxic = 56 (33%) |\n Missing Values | None |\n\n---\n\n\
  \ Pipeline Summary\n Step | Method | Result |\n EDA | Distribution, correlation analysis | Identified\
  \ top features & imbalance |\n Preprocessing | LabelEncoder, VarianceThreshold, StandardScaler | 1203\
  \ → 641 features |\n Feature Selection | ANOVA F-test + RF Importance | 641 → 69 features |\nModelling\
  \ | Voting Ensemble (RF + ExtraTrees + GradientBoosting) | Soft voting |\n Evaluation | Stratified 5-Fold\
  \ Cross-Validation | ROC-AUC = 0.63 |\n Tuning | RandomizedSearchCV + GridSearchCV on RF | Minor improvement\
  \ |\n\n---\n\n Results\n Before vs After Tuning — Random Forest\n\n| Model | Accuracy | F1 | ROC-AUC\
  \ |\n\n Default RF | 0.6610 | 0.3060 | 0.6273 |\nRandom Search RF | ~0.66 | ~0.31 | ~0.63 |\n Grid Search\
  \ RF | ~0.67 | ~0.32 | ~0.64 |\n \n Tuned Parameters\nn_estimators max_depth min_samples_split\nmin_samples_leaf\
  \ max_features bootstrap,class_weight\n\n---\n\n Key Insights\nClass imbalance** handled via class_weight='balanced\n\
  \ 94.3% feature reduction (1203 → 69) via two-stage selection\nmodest tuning gains — bottleneck is data\
  \ size (171 samples)\nRealistic accuracy of ~66–67% given dataset constraints\n\n\n Tools\nPython Pandas\
  \ NumPy Scikit-learn Matplotlib`Seaborn,Joblib\n\n\n\n  How to Run\nbash\npip install pandas numpy scikit-learn\
  \ matplotlib seaborn joblib\n\npython step1_load_data.py\npython step2_eda.py\npython step3_preprocessing.py\n\
  python step4_feature_selection.py\npython step5_model_training_cv.py\npython step6_final_model_save.py\n\
  python step7_hyperparameter_tuning.py\n```\n"

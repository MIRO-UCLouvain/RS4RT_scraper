readme_excerpt: "### **README - Toxicity Prediction Using Graph Neural Networks (GNNs)**  \n\n---\n\n\
  ## **Project Title**  \n**Toxicity Prediction Using Graph Neural Networks (GNNs)**  \nLeveraging deep\
  \ learning techniques such as Graph Convolutional Networks (GCNs) and Graph Attention Networks (GATs)\
  \ to improve toxicity prediction in chemical molecules.\n\n---\n\n## **Project Overview**  \nThis project\
  \ investigates the use of Graph Neural Networks for predicting toxicity endpoints in chemical compounds.\
  \ We compare various models, including Naïve Bayes, GCNs (5-node input), GATs, and Morgan fingerprint-enhanced\
  \ GCN models to understand their performance in toxicity prediction. The goal is to provide a robust\
  \ framework that efficiently predicts chemical toxicity and contributes to improved drug discovery while\
  \ reducing reliance on traditional experimental methods.\n\n---\n\n## **Objectives**  \n- Develop a\
  \ GNN-based framework for predicting toxicity endpoints.  \n- Improve model performance by integrating\
  \ Morgan fingerprints for enhanced feature representation.  \n- Compare GNN models with traditional\
  \ ML classifiers such as Naïve Bayes.  \n- Optimize model performance using data balancing techniques\
  \ and improved architecture.  \n- Provide interpretability solutions to improve the transparency of\
  \ deep learning predictions.  \n\n---\n\n## **Dataset Used**  \nThis study uses the **Tox21 dataset**,\
  \ a publicly available dataset from **NCBI PubChem**. It contains chemical structures represented as\
  \ SMILES strings or CAS IDs, along with their respective toxicity endpoints.\n\n### **Key Dataset Attributes**\
  \  \n- **Molecular fingerprints:** Morgan fingerprints and Extended Connectivity Fingerprints (ECFP)\
  \  \n- **Molecular descriptors:** Atomic properties, bond types, degree, valence  \n- **Toxicity Endpoints:**\n\
  \  - **NR-AR:** Nuclear Receptor - Androgen Receptor  \n  - **SR-ARE:** Stress Response - Antioxidant\
  \ Response Element  \n  - **NR-Aromatase:** Nuclear Receptor - Aromatase  \n  - **NR-ER-LBD:** Nuclear\
  \ Receptor - Estrogen Receptor Ligand Binding Domain  \n  - **NR-AhR:** Nuclear Receptor - Aryl Hydrocarbon\
  \ Receptor  \n  - **SR-MMP:** Stress Response - Mitochondrial Membrane Potential  \n  - **NR-ER:** Nuclear\
  \ Receptor - Estrogen Receptor  \n  - **NR-PPAR-gamma:** Nuclear Receptor - Peroxisome Proliferator-Activated\
  \ Receptor Gamma  \n  - **SR-p53:** Stress Response - p53 Tumor Suppressor  \n  - **SR-ATAD5:** Stress\
  \ Response - ATPase Family AAA Domain-Containing Protein 5  \n  - **NR-AR-LBD:** Nuclear Receptor -\
  \ Androgen Receptor Ligand Binding Domain  \n\n---\n\n## **Pre-processing Steps**  \n1. **Data Cleaning:**\
  \  \n   - Removed invalid or corrupted molecules.  \n2. **Molecular Representation:**  \n   - Converted\
  \ molecules into graph structures where nodes represent atoms and edges represent bonds.  \n3. **Feature\
  \ Engineering:**  \n   - Generated Morgan fingerprints (radius=2, 1024-bit) as node attributes.  \n\
  4. **Graph Construction:**  \n   - Transformed data into PyTorch Geometric format, defining edge connectivity\
  \ and node feature matrices.  \n\n---\n\n## **Model Implementation**  \n\n### **1. Traditional ML Algorithms**\
  \  \n- **Naïve Bayes Classifier:**  \n   - Utilized as a baseline classification model based on molecular\
  \ descriptors like FW, DSSTox_CID, and Molecular Formula.  \n- **Random Forest Classifier:**  \n   -\
  \ Trained on Morgan fingerprints to capture complex chemical interactions.  \n\n---\n\n### **2. Graph\
  \ Neural Networks (GNNs)**  \n**GCN (5-node input)**  \n- **Input:** Molecular graphs with node features\
  \ as Morgan fingerprints and edge connectivity from bond information.  \n- **Layers:**  \n   - **GCNConv\
  \ Layer 1:** Extracts local node interactions.  \n   - **ReLU Activation & Batch Normalization:** Ensures\
  \ stability.  \n   - **GCNConv Layer 2:** Captures deeper chemical dependencies.  \n   - **Global Mean\
  \ Pooling:** Aggregates node-level embeddings into graph-level representation.  \n   - **Fully Connected\
  \ Layer:** Maps final embeddings to toxicity classifications.  \n\n**GAT (Graph Attention Network)**\
  \  \n- **Self-Attention Mechanism:** Assigns higher weights to critical atomic interactions.  \n- **Architecture:**\
  \  \n   - Input Layer → GATConv Layer 1 → Batch Normalization → ReLU Activation  \n   - GATConv Layer\
  \ 2 → Batch Normalization → ReLU Activation  \n   - Global Mean Pooling → Fully Connected Layer → Classification\
  \ Output  \n\n---\n\n### **3. Data Balancing Techniques**  \nTo address class imbalance, an undersampling\
  \ strategy was applied where:  \n- The majority class (non-toxic molecules) was reduced to match the\
  \ minority class (toxic molecules).  \n- The balanced dataset was shuffled to ensure fair training conditions.\
  \  \n\n---\n\n## **Results and Discussion**  \nThe study evaluated the impact of various GNN models\
  \ and molecular representations:  \n- The **Morgan fingerprint-based GCN** model outperformed the traditional\
  \ 5-node input GCN model with improved recall and precision for both toxic and non-toxic classes.  \n\
  - Morgan fingerprints extracted higher-order molecular patterns, leading to more balanced predictions.\
  \  \n- GNNs demonstrated robust scalability and adaptability in predicting toxicity across different\
  \ endpoints.  \n- The **Naïve Bayes** classifier showed poor performance, underscoring the limitations\
  \ of probabilistic models for toxicity prediction.  \n- The **GAT Model** demonstrated strong performance\
  \ with improved stability and better differentiation of complex molecular interactions.\n\n---\n\n##\
  \ **Future Works**  \n- **Advanced GNN Architectures:** Explore GATs, Transformer-based models, and\
  \ GINs for improved interpretability.  \n- **Semi-Supervised Learning:** Adopt self-training and contrastive\
  \ learning to improve performance using unlabeled data.  \n- **Transfer Learning:** Leverage pretrained\
  \ GNNs for improved performance in low-data toxicity prediction.  \n- **Multi-Task Learning:** Develop\
  \ models that predict multiple toxicity endpoints simultaneously to improve model generalization.  \n\
  - **Explainability and Interpretability:** Implement attention mechanisms and SHAP values for improved\
  \ model transparency.  \n\n---\n\n## **Authors**  \n- **Samrat Raj Sharma**  \n- **Sanjan TP Gupta**\n\
  \n---\n\n## **Acknowledgments**  \nWe acknowledge the contributions of research papers and open-source\
  \ resources that guided this project. Special thanks to the Tox21 dataset providers and PyTorch Geometric\
  \ community.\n\n---\n\n## **Contact**  \nFor queries, reach out at: **Samratsharma979@gmail.com**\n"

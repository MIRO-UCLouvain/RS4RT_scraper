readme_excerpt: "# radiateTPS\nBrowser based cancer and radiation treatment planning system based on OpenTPS\
  \ source code.\n\n# Setup Instructions\n\n1. Clone the project repository and the OpenTPS repository\
  \ (I put both of mine towards the root of my C drive)  \n    git clone https://github.com/adriankUSA/radiateTPS.git\
  \  \n    git clone https://gitlab.com/openmcsquare/opentps.git \n\n2. Create a Virtual Environment (I\
  \ put min in /backend): \n    python -m venv radiate-venv\n\n3. Activate the environment:  \n    Windows\
  \ CMD/VS Code Terminal: backend\\radiate-venv\\Scripts\\activate  \n    or C:\\radiateTPS\\backend\\\
  radiate-venv\\Scripts\\activate  \n    or Powershell:  \n    & \"C:\\radiateTPS\\backend\\radiate-venv\\\
  Scripts\\Activate.ps1\"  \n    Mac/Linux: source backend\\venv/bin/activate  \n\n    If you see both\
  \ (base) and your (venv) active, you should be able to use this command to get rid of (base):  \n  \
  \  conda deactivate\n\n# Dependencies \n\n4. Install dependencies: \n    pip install -r requirements.txt\n\
  \n5. More dependencies (pydicom, scipy, SimpleITK, matplotlib, numpy, cuda, psutil)  \n    pip install\
  \ pydicom scipy SimpleITK matplotlib numpy  \n    pip install cupy-cuda12x psutil\n\n    Program/terminal\
  \ will let you know if there are still any missing dependencies when you try to run the tutorial\n\n\
  6. Whenever a new package is installed, run:\n    pip freeze > backend/requirements.txt\n\n# Pathing\n\
  \n7. Pathing (File directory and pathing is a big issue, may need more/different adjustments)\n    Adjust\
  \ the .env file to manually specify additional paths if needed:  \n    PYTHONPATH=C:/opentps/opentps_core\n\
  \n    In /backend/routes/plotly_tutorial.py or /backend/routes/tutorial1.py, you can see this line \
  \ \n    sys.path.append(r\"C:\\opentps\\opentps_core\")  \n    Adjust as needed\n\n# Running\n\n8. To\
  \ run the application, after activating your virtual environment, in your /backend directory, run:\n\
  \    python app.py\n\n    Navigate to http://127.0.0.1:5000/\n    \n    Click the tutorial page.\n\n\
  \    Wait a couple of minutes, (the computations should be running if no errors), and then eventually\
  \ the charts will load.\n\n    If errors, likely either due to dependency issues or file pathing/connecting\
  \ to OpenTPS source code.\n\n    If successful, you should also be able to select from one sample dataset\
  \ and view the ROI names.\n\n# Next Steps Going Forward\n\n    Computations are processed on the backedn\
  \ but we still need to remove the image generation on the backend (should be simple).\n\n    Need to\
  \ look at the OpenTPS GUI code and try to replicate and simulate that. \n\n"

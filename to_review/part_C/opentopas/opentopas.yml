readme_excerpt: "> [!NOTE]\nThis site is under development. We will continue to add functionality and\
  \ features over the coming months.\n\n# TOPAS: Tool for Particle Simulation\n\n## The NIH-funded TOPAS\
  \ project made radiation therapy simulations using the Monte Carlo method easily accessible for the\
  \ radiotherapy community. The code has been released previously as open source. This repository brings\
  \ TOPAS to a new, open release stage, called OpenTOPAS. All new developments will be developed and released\
  \ via this open Github repository and we invite users to help improve the code by committing (well tested)\
  \ code pushes. \n## Our current focus is on expanding capabilities for radiology and emerging therapies\
  \ to create an ecosystem of collaborative Monte Carlo research from therapy to imaging\n\n### :books:\
  \ [https://OpenTOPAS.readthedocs.io/en/latest/](https://opentopas.readthedocs.io/en/latest/)\n"

readme_excerpt: "# SupPy - Python superiorization library\n[![PyPI version](https://img.shields.io/pypi/v/suppy)](https://pypi.org/project/suppy/)\n\
  ![pyversion](https://img.shields.io/pypi/pyversions/suppy)\n![License](https://img.shields.io/github/license/DKFZ-OpenMedPhys/SupPy)\n\
  \n`SupPy` is a native python library for user-friendly setup and evaluation of superiorzation algorithms.\n\
  \n## General introduction\nThe Superiorization Method(SM) uses feasibility-seeking algorithms, i.e.,\
  \ algorithms that aim at finding apoint in the intersection of a finite number of given closed convex\
  \ sets, i.e.,(\n$\n\\text{find } \\mathbf{x}\\in C = \\bigcap_i C_i\n$).\n\n\nIn the SM the feasibility-seeking\
  \ algorithm must be \"perturbation resilient\" in the sense that convergence of the feasibility-seeking\
  \ iterative process is retained even when such perturbations are inserted into this iterative process.\
  \ Given is also a real-valued objective function $\\phi$. In contrast to constrained optimization of\
  \ this objective function over the feasible set C, the goal of the SM is not to find a constrained minimum\
  \ point but rather to reach a feasible point with reduced (not necessarily minimal) objective function\
  \ value compared with the objective function value of a feasible point that would have been reached\
  \ by the feasibility-seeking only algorithm.\n\n Further information and references on the SM can be\
  \ found in papers listed in the bibliographic collection on the [dedicated Webpage](https://arxiv.org/pdf/1506.04219).\
  \ For recent works that include introductory material on the SM see, e.g., [[1]](https://link.springer.com/article/10.1007/s11590-022-01961-y),\
  \ [[2]](https://pubmed.ncbi.nlm.nih.gov/36541524/), [[3]](https://arxiv.org/abs/2212.14724). A recent\
  \ work on applying the SM to problems in intensity-modulated radiation therapy (IMRT) treatment planning\
  \ appears [here](https://www.frontiersin.org/journals/oncology/articles/10.3389/fonc.2023.1238824).\n\
  \n## Installation\nInstall simply via pip:\n\n```\npip install suppy\n```\n\nIn general SupPy works\
  \ on the CPU (`numpy`), as well as the GPU(`cupy`). The standard installation will not set up `cupy`.\n\
  For installation check your CUDA version and the [cupy installation guide](https://docs.cupy.dev/en/stable/install.html).\n\
  \n## Usage\n\n`SupPy` is a modular library for building and running superiorization models.\nit allows\
  \ for quick setup of feasibility seeking and superiorization algorithms.\n\nProjections for simple structures\
  \ like halfspaces or circles have dedicated implementations in the `suppy.projections` submodule and\
  \ allow for visualization of the structure if they are 2D objects.\n\n```\nimport numpy as np\nfrom\
  \ suppy.projections import HalfspaceProjection\na = np.array([1.,1.])\nb = 3\nhalfspace = HalfspaceProjection(a,b)\n\
  halfspace.visualize()\n```\n\nTo calculate the projection each ``Projection`` object has a dedicated\
  \ function (which if possible changes the array in place):\n```\nx = np.array([4.,4.])\nx_p = halfspace.project(x)\n\
  ```\n\n### Combined projections\nFor more complex structures that are formulated as the intersection\
  \ of multiple constraints implementations for standard methods (``SequentialProjection``,``SimultaneousProjection``)\
  \ and combinations of the two (``StringAveragedProjection``,``BlockIterativeProjection``) are available.\n\
  \n```\nimport numpy as np\nfrom suppy.projections import BallProjection,SequentialProjection\ncenter_1\
  \ = np.array([1,1])\nradius_1 = 2\ncenter_2 = np.array([-0.5,-1])\nradius_2 = 1\nball_1 = BallProjection(center_1,radius_1)\n\
  ball_2 = BallProjection(center_2,radius_2)\njoined_projection = SequentialProjection([ball_1,ball_2])\n\
  ```\nFor a single projection step of these methods the ``project`` function can be used again. However\
  \ since one step often times is not enough to find a point in the intersection, an entire run is needed.\n\
  This can be done by calling the ``solve`` method.\n\n```\njoined_projection.solve(np.array([3,3]))\n\
  ```\n\n### Linear algorithms\n\nFor linear problems $Ax\\leq b$ dedicated implementations are available\
  \ (right now formulated as $lb \\leq Ax \\leq ub$). In general ``AMS``, ``ARM``(Automatic relaxation\
  \ method) and a sequential ``ART3+`` implementation are available.\n\n```\nimport numpy as np\nfrom\
  \ suppy.feasibility import SequentialAMSHyperslab\nA = np.array([[1,1],[1,0]])\nlb = np.array([-2,-2])\n\
  ub = np.array([2,2])\nalg = SequentialAMSHyperslab(A,lb,ub)\nalg.solve(np.array([5.,5.]),max_iter =\
  \ 100)\n```\n\nIn general these algorithms have the same functions as the basic projections (``solve()``,``project()``,etc.)\
  \ and can be used as part of joined projections.\n\n## Superiorization\n\nFor setting up superiorzation\
  \ models a feasibility seeking algorithm as well as a perturbation scheme are required.\nFor gradient\
  \ step based perturbations this can be set up in the following way:\n```\nfrom suppy.perturbations import\
  \ PowerSeriesGradientPerturbation\n\ndef objective(x):\n    return 1/len(x)*(x**2).sum(axis = 0)\n\n\
  def gradient(x):\n    grad = 1/len(x)*2*x\n    return grad/np.sqrt(np.sum(grad**2))\n\npert = PowerSeriesGradientPerturbation(objective,gradient)\n\
  \nfrom suppy.superiorization import Superiorization\n\nsup_model = Superiorization(alg,pert)\nsup_model.solve(np.array([3,2]),\
  \ 1000)\n```\n\n\n## Funding and Development\n`SupPy` was developed as part of the German-Israeli Cooperation\
  \ in Cancer Research (Project Ca 216)\nResponsible for SupPy are:\n\n- Tobias Becher (DKFZ, Lead Developer\
  \ & Research Fellow)\n- Prof. Yair Censor (University of Haifa, Principal Investigator / Scientific\
  \ Lead)\n- Dr. Niklas Wahl (DKFZ, Principal Investigator / Scientific Lead)\n<p align=\"right\">\n<img\
  \ src= https://raw.githubusercontent.com/e0404/matRad/98ba2fb8b07f727a3963cf2572c82a548444580b/matRad/gfx/dkfz_logo_blue.png\
  \ width=\"200\" />\n</p>\n\n## Miscellaneous\nThe authors would like to thank Allex Veldman for making\
  \ the `suppy` namespace available on PyPi.\n"

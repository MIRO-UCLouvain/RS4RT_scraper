readme_excerpt: "# Fabolus-v16\n\n**Archived: this repo is now archived. Future development can be found\
  \ at:** https://github.com/nsmela/Fabolus/tree/master\n\nFabolus used to modify 3D boli for radiation\
  \ therapy. This application can import a STL file, smooth it (using poisson reconstruction or marching\
  \ cubes), \nadd airchannels, and create an encompasing mold around the bolus and subtracting the air\
  \ channels. The result can be 3D printed and used as a mold for curing silicon.\n\nEnsure a poisson\
  \ reconstructor (named \"PoissonRecon.exe\") is in the same folder as the executable. If not, you cannot\
  \ use Poisson Reconstruction.\n\nScreenshots:\n\n![2022-09-20_11-37-49](https://user-images.githubusercontent.com/10816249/191338591-c5d86c60-113a-4b1c-83ff-e489b324468e.png)\n\

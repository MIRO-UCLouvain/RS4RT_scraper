readme_excerpt: 'A single-notebook (Colab-friendly) pipeline for binary classification from radiomics
  features using a lightweight deep learning model. The notebook loads data, performs preprocessing, trains
  an MLP, and reports key metrics—most notably ROC curve and AUC.

  What’s inside

  CSV ingestion (rows = cases, columns = features).

  Missing-value checks and StandardScaler normalization.

  Stratified train/validation split.

  MLP-based radiomics classifier (PyTorch).

  ROC/AUC calculation and plotting (with diagonal reference).

  Automatic saving of figures and metrics.

  Data format

  File: .csv

  Target column: label (0/1)

  Feature columns: numeric radiomics features (e.g., firstorder_*, glcm_*, shape_*, …)


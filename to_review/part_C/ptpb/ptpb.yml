readme_excerpt: "Particle Therapy Project Bergen (PTPB) - tools and models for research in\ncancer therapy\
  \ using photons, protons and heavy ions\n\nDirectory layout:\n=================\n\nDVHtools/\n    This\
  \ contains scripts used to convert DVH text files to variables stored\n    in a Matlab workspace .mat\
  \ file. Also some utility functions are provided\n    to query some basic information about the contents\
  \ of a DVH file.\n\nModels/\n    Contains Matlab scripts that implement functions for the core models.\n\
  \    These include Organ Equivalent Dose (OED) calculations and slope factor\n    calculations.\n\n\
  src/\n    Contains code and scripts implementing various general functions for the\n    calculation\
  \ framework.\n\nscripts/\n    Contains helper scripts to be used on the command line.\n\nexamples/\n\
  \    Here you will find some example scripts that should how to use the different\n    functions and\
  \ tools implemented in this code module.\n\ntemplates/\n    This contains some template files to use\
  \ for code development.\n"

readme_excerpt: "# Synthetic-MRI\nDual-scale 2.5D conditional GAN for multi-contrast brain MRI synthesis.\
  \ Generates T1-CE, T2, and FLAIR images from T1 MRI, reducing scan time, contrast agent use, and motion\
  \ artifacts in radiotherapy imaging.\n\n## Overview\nThis project implements a deep learning framework\
  \ for generating synthetic multi-contrast brain MRI from a single T1-weighted image. The model synthesizes\
  \ the following MRI contrasts:\n\n- T1 contrast-enhanced (T1-CE)\n- T2-weighted MRI\n- T2-FLAIR MRI\n\
  - \nThe framework is based on a conditional Generative Adversarial Network (cGAN) with dual-scale discriminators\
  \ and a 2.5D input strategy that incorporates neighbouring slices to improve volumetric consistency.\n\
  \nThe primary goal is to reduce MRI scan time, decrease reliance on gadolinium-based contrast agents,\
  \ and mitigate motion artifacts in brain radiotherapy workflows.\n\n---\n\n## Key Features\n\n- Dual-scale\
  \ GAN architecture capturing local and global anatomical features\n- 2.5D slice-based synthesis using\
  \ neighbouring slice context\n- Hybrid loss function combining:\n  - Adversarial loss\n  - Feature matching\
  \ loss\n  - Perceptual loss\n  - 3D volumetric consistency loss\n- Evaluation using both image similarity\
  \ metrics and tumour segmentation performance\n- Designed for radiotherapy planning applications\n\n\
  ---\n\n## Dataset\n\n### Public Dataset\nBraTS 2021 dataset\n\nTraining: 1000 cases  \nValidation: 100\
  \ cases  \nTesting: 100 cases  \n\nEach case includes:\n- T1-weighted MRI\n- T1 contrast-enhanced MRI\n\
  - T2-weighted MRI\n- T2-FLAIR MRI\n- Tumour segmentation masks\n\n### Clinical Dataset\nIndependent\
  \ brain radiotherapy dataset\n\nTraining (fine-tuning): 20 cases  \nTesting: 10 cases  \n\nMRI scans\
  \ include:\n- T1\n- T1-CE\n- T2\n- T2-FLAIR\n\nAll images were preprocessed with:\n- Denoising\n- Bias\
  \ field correction\n- Rigid registration\n- Resampling to 1×1×1 mm resolution\n\n---\n\n## Model Architecture\n\
  \n### Generator\nEncoder–decoder architecture inspired by pix2pixHD with attention modules.\n\nInput:\n\
  - T1 slice with neighbouring slices (2.5D input)\n\nOutput:\n- Synthetic MRI contrast (T1-CE / T2 /\
  \ T2-FLAIR)\n\n### Discriminators\nTwo discriminators operate at different spatial scales:\n\n1. Full-resolution\
  \ discriminator\n2. Half-resolution discriminator (0.5×)\n\nThese ensure both fine texture realism and\
  \ global anatomical consistency.\n\n---\n\n## Training Strategy\n\nThe generator is trained using a\
  \ hybrid loss function:\n\nL_G = λ1 AL_2D + λ2 FML_2D + λ3 PL_2D + λ4 MAE_2.5D + λ5 AL_2.5D\n\nWhere:\n\
  \nAL = adversarial loss  \nFML = feature matching loss  \nPL = perceptual loss  \nMAE = mean absolute\
  \ error on reconstructed volume  \n\nLoss weights:\n\nλ1 = 1  \nλ2 = 5  \nλ3 = 5  \nλ4 = 5  \nλ5 = 5\
  \  \n\n---\n\n## Evaluation Metrics\n\nSynthetic MRI quality was evaluated using:\n\n- Structural Similarity\
  \ Index (SSIM)\n- Peak Signal-to-Noise Ratio (PSNR)\n\nClinical utility was assessed using tumour segmentation\
  \ metrics:\n\n- Dice Similarity Coefficient\n- Hausdorff Distance\n\n---\n\n## Clinical Validation\n\
  \nThe synthetic MRI images were tested for tumour segmentation performance using a 3D segmentation model.\n\
  \nExperiments included:\n\n1. Using all original MRI contrasts\n2. Replacing individual contrasts with\
  \ synthetic images\n3. Using fully synthetic MRI contrasts\n\nResults showed that synthetic MRI can\
  \ effectively supplement missing contrasts, particularly for whole tumour segmentation.\n\n\n---\n\n\
  ## Applications\n\n- Brain radiotherapy planning\n- MRI protocol acceleration\n- Contrast-agent reduction\n\
  - Motion artifact mitigation\n- Data augmentation for medical imaging models\n\n---\n\n## Citation\n\
  \nIf you use this work, please cite:\n\nMulti-Contrast Brain MRI Synthesis for Radiotherapy Using a\
  \ Dual-Scale Generative Adversarial Network with Volumetric Context\n\n---\n\n\n\n## Contact\nFor questions\
  \ or collaborations, please contact:\n[SA Yoganathan]\n[Saint John Regional Hospital]\n[Saint John,\
  \ New Brunswick, Canada]\n[sa.yoganathan@horizonnb.ca]\n\n"

readme_excerpt: "## ARCliDS (Adaptive Radiotherapy Clinical Decision Support System)\n\nARCliDS is a clinician‑facing\
  \ AI platform designed to support response‑adaptive radiotherapy. It combines predictive modeling with\
  \ reinforcement‑learning–based decision support to help clinicians personalize treatment strategies.\n\
  \n**What I Built**  \n- **Artificial Radiotherapy Environment (ARTE):**    \nA predictive engine using\
  \ radiobiology, **graph neural networks** and **multi‑omics** data to model tumor and normal‑tissue\
  \ response under different dose‑adaptation strategies.\n\n- **Optimal Decision Maker (ODM):**  \nA **deep\
  \ reinforcement learning** system that recommends dose‑adaptation policies balancing tumor control and\
  \ toxicity.\n\nA patent is pending, so the source code is not public. A live demonstration is available:\n\
  - [ARCliDS Shiny App](https://arclids.shinyapps.io/ARCliDS/).\n\n**Note:** The app may take time to\
  \ load because ARTE performs inference across **20 (4x5) predictive models** over **45 decision points**,\
  \ while ODM uses **5 models**. I choose 5 models per step for statistical ensembling to estimate model\
  \ uncertainty. Since ARCliDS is hosted on **shinyapps.io**, which is not a high‑performance server,\
  \ this computational workload can increase startup time.\n\nIncludes implementations for:\n- **NSCLC\
  \ adaptive Radiotherapy**\n- **HCC adaptive SBRT**\n\n**Publication:**\nD. Niraula _et al., A clinical\
  \ decision support system for AI-assisted decision-making in response-adaptive radiotherapy (ARCliDS)_.\
  \ **Scientific Reports** 13, 5279 (2023).  \n- [Paper](https://www.nature.com/articles/s41598-023-32032-6)\n\
  - [Supplementary Materials](https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41598-023-32032-6/MediaObjects/41598_2023_32032_MOESM1_ESM.pdf).\
  \ \n\n## Human-AI Interaction Modules\nI developed two interactive platforms that allow clinicians to\
  \ remotely evaluate ARCliDS using realistic NSCLC and HCC treatment cases. These modules support real‑time\
  \ exploration of AI‑generated strategies and enable analysis of human–AI decision dynamics.  \n- [ARCliDS-NSCLC\
  \ Interaction Module](https://arclids.shinyapps.io/Eval_NSCLC_v2/) \n- [ARCliDS-HCC Interaction Module](https://arclids.shinyapps.io/Eval_HCC_v2/)\n\
  \n**What These Modules Do**\n- Human–AI interaction in dynamic decision‑making\n- Visualization of treatment‑response\
  \ trajectories\n- Practical evaluation of AI‑assisted dose‑adaptation strategies\n\n**Publication:**\n\
  D. Niraula _et al., Intricacies of Human-AI Interaction in Dynamic Decision-Making for Precision Oncology:\
  \ A Case Study in Response-Adaptive Radiotherapy_, **Nature Communications**,16, 1138 (2025).  \nMore\
  \ details are available in:\n- [Paper](https://www.nature.com/articles/s41467-024-55259-x) \n- [Supplementary\
  \ Material](https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41467-024-55259-x/MediaObjects/41467_2024_55259_MOESM1_ESM.pdf)\n"

readme_excerpt: "# BleoTox Radiomics Project\n\nRadiomics machine learning pipeline in R for investigating\
  \ chemotherapy-associated \npulmonary toxicity using radiomics PET imaging features.\n\n## Project Overview\n\
  \nThis repository contains the analysis workflow accompanying a published radiomics PET \nstudy investigating\
  \ pulmonary toxicity development during chemotherapy treatment.\n\nThe project explores whether PET-derived\
  \ radiomics features can:\n* Identify active pulmonary toxicity during treatment (interim scans)\n*\
  \ Predict toxicity development in the future from baseline scans\n* Examine toxicity-related imaging\
  \ patterns compared to control patient groups\n\nThe workflow combines radiomic feature selection, multicollinearity\
  \ reduction, \nmachine learning classification, and statistical analysis within a reproducible R-based\
  \ pipeline.\n\n---\n\n## Methodology & Validation\n\nThe analysis pipeline includes:\n\n### 1) Feature\
  \ preprocessing\n\n* Baseline and interim PET scan separation\n* Spearman correlation filtering against\
  \ the features Volume and SUVmean\n* Removal of highly intercorrelated radiomic features to reduce multicollinearity\n\
  \n### 2) Machine learning\n\n* Algorithm: Random Forest classification\n* Hyperparameter tuning across\
  \ multiple tree sizes to optimize the model \n* Validation strategy: Leave-One-Out Cross Validation\
  \ (LOOCV) due to the clinical nature ans\n  small sample size of the dataset. This approach ensures\
  \ that every sample is used for \n  validation, providing an unbiased estimate of model accuracy. \n\
  * Model selection: The final model configuration was automatically selected based on \n  maximizing\
  \ the cross-validated accuracy metric.\n* Feature importance analysis was assessed using the mean decrease\
  \ in Gini \n\n### 3) Statistical analysis\n\n* Paired Wilcoxon testing (non-parametric method due to\
  \ the small sample size)\n* Baseline vs interim comparison\n* Toxicity and non-toxicity subgroup analysis\n\
  * Additional external control group validation\n\n---\n\n## Explainability & Clinical Interpretation\n\
  \nTo avoid black-box model and ensure clinical relevance (essential for public health research):\n*\
  \ Feature importance analysis was assessed using the mean decrease in Gini\n* This metric allows us\
  \ to rank and interpret which specific Radiomics features contribute\n  most to predict bleomycineo-induced\
  \ toxicity.\n\n---\n\n## Results & Impact\nResults:  The RF classifier correctly identified bleomycine-induced\
  \ toxicity in 72.2% of the\npatients and predicted the development of bleomycine-induced toxicity correctly\
  \ in 50% of the \npatients\n\nClinical relevance: Certain regional 18F-FDG PET radiomics features can\
  \ effectively identify\nbleomycine-induced toxicity and 18F-FDG PET radiomics, with and without machine\
  \ learning, \nmight serve as potential biomarkers for to detect bleomycine induced toxicity.\n\n---\n\
  \n## Technologies\n\nThis project was developed in R using:\n\n* tidyverse\n* caret\n* randomForest\n\
  * ggplot2\n* pROC\n* readxl\n* rmarkdown\n\n---\n\n## Repository Structure\n\n```text\nbleotox-radiomics/\n\
  │\n├── README.md\n├── bleotox_radiomics.Rmd\n├── bleotox_radiomics.html\n├── .gitignore\n│\n├── data/\n\
  │   └── example_input_structure.csv\n│\n├── figures/\n│   ├── mds_plot.png\n│   └── statistical_analysis.png\n\
  │\n└── paper/\n    └── bleotox_publication.pdf\n```\n\n\n---\n\n## Running the analysis\n\nInstall required\
  \ packages:\n```r\ninstall.packages(c(\n  \"tidyverse\",\n  \"caret\",\n  \"readxl\",\n  \"randomForest\"\
  ,\n  \"pROC\",\n  \"ggplot2\",\n  \"rmarkdown\"\n))\n```\n\nRun the analysis pipeline:\n```r\nrmarkdown::render(\"\
  bleotox_radiomics.Rmd\")\n```\n\n---\n\n## Data Availability\n\nThe datasets used in this study contain\
  \ sensitive clinical patient information and \ncannot be publicly shared due to hospital privacy regulations\
  \ and ethical restrictions.\n\nThis repository therefore provides:\n* The complete analysis pipeline\n\
  * Preprocessing workflow\n* Feature selection methodology\n* Machine learning implementation\n* Statistical\
  \ analysis workflow\n* A small dummy dataset demonstrating the expected input structure\n\nThe included\
  \ dummy dataset does not contain real patient information and is provided \nsolely for illustrative\
  \ and reproducibility purposes.\n\nResearchers interested in reproducing the study may adapt the pipeline\
  \ to their \nown institutional datasets.\n\n---\n \n## Publication\n\nAssociated publication: \nSmith\
  \ CLC et al. Diagnostics (2024).\nhttps://doi.org/10.3390/diagnostics14222531\n\n---\n\n## Author\n\n\
  C.L.C. Smith\n\n\n\n"

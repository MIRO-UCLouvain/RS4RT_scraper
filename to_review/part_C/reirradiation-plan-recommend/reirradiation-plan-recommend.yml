readme_excerpt: "# Head & Neck Re-Irradiation Plan Recommendation\n\nEvidence-based re-irradiation plan\
  \ selection for recurrent head and neck cancer — SBRT + immunotherapy regimens, Quad-Shot, and cumulative\
  \ BED calculation.\n\n## What This Skill Does\n\nGiven a brief patient history (primary site, prior\
  \ RT details, recurrent disease extent, available drugs), this skill:\n\n1. **Calculates cumulative\
  \ BED** from the prior RT course with gap repair correction\n2. **Screens 4 re-irradiation options**:\
  \ Quad-Shot + IO, Q3w low-dose + IO, conventional 2 Gy/fx, SBRT continuous\n3. **Generates a comparative\
  \ table** with tumor EQD2, late tissue safety, and immune effect for each option\n4. **Recommends the\
  \ optimal regimen** with rationale, risk warnings, and execution parameters\n\n## Evidence Base\n\n\
  | Regimen | Evidence | PMID |\n|---------|----------|------|\n| **Quad-Shot** (3.7 Gy × 4 BID Q4w) +\
  \ Pembrolizumab | JAMA Otolaryngol 2026 | 42313403 |\n| **Q3w single fraction** (3.5 Gy × 1 Q3w) + IO/ADC\
  \ | Shanghai Ninth People's Hospital | — |\n| **Conventional** (2 Gy/fx) | Standard re-RT | — |\n| **SBRT**\
  \ (5-6 Gy × 5) + IO | Multiple phase I/II | 37105404, 38892731 |\n\n## Key Clinical Logic\n\n```\nPrior\
  \ RT → residual EQD2 (gap repair)\n  + Candidate regimen EQD2\n  = Cumulative late EQD2\n\n  ≤40 Gy\
  \ → any option\n  40-50 → Quad-Shot acceptable, SBRT limited\n  50-60 → only Q3w or conventional\n \
  \ >60 → conventional only (≤15 fx)\n```\n\n## Immunogenic Cell Death Threshold\n\n- <4 Gy/fx → ICD signal\
  \ may be sub-threshold\n- 4-6 Gy/fx → weak-moderate ICD\n- **6-12 Gy/fx → optimal ICD window**\n- >12\
  \ Gy/fx → may kill infiltrating T cells\n\n## Quick Install\n\n```bash\nhermes skills install https://raw.githubusercontent.com/antica1/head-neck-reirradiation/master/SKILL.md\n\
  ```\n\n## Trigger Keywords\n\n`reirradiation` `recurrent head neck` `SBRT second course` `Quad-Shot`\
  \ `immunotherapy radiosensitization` `ADC SBRT` `再程放疗`\n\n## Author\n\nZhu Guopei, MD — Shanghai Ninth\
  \ People's Hospital. Contact: antica@gmail.com\n\n## License\n\nMIT\n\n## Related Skills — Shanghai\
  \ Ninth People's Hospital Head & Neck RT Series\n\n| Skill | Description |\n|-------|-------------|\n\

  \ skull base millimeter-level |\n| [HNCUP Target Delineation](https://github.com/antica1/HNCUP-rt-targets)\
  \ | Occult primary, selective mucosal RT |\n| [ACC Post-op RT](https://github.com/antica1/head-neck-acc-rt-targets)\
  \ | Sensory nerve pathway, facial nerve management |\n| [Orbital Tumor RT](https://github.com/antica1/orbital-tumor-rt-targets)\
  \ | Compartment irradiation, VIII/IX/IIa cascade |\n| [DVH Plan Review](https://github.com/antica1/head-neck-dvh-review)\
  \ | One-glance pass/fail, dual-track physicist/physician reports |\n| [**Re-Irradiation Planning**](https://github.com/antica1/head-neck-reirradiation)\
  \ | Quad-Shot + SBRT + IO/ADC, cumulative BED |\n| [All Skills](https://github.com/antica1) | Six skills\

readme_excerpt: "# Brain Tumor Segmentation with Attention U-Net\n\nDeep learning pipeline for multi-class\
  \ brain tumor segmentation on MRI scans, built on the BraTS (Brain Tumor Segmentation) dataset. Implements\
  \ a U-Net baseline and an Attention U-Net variant, with clinically relevant evaluation metrics and an\
  \ interactive inference demo.\n\n![demo](assets/demo.gif)\n\n## Why this project\n\nTumor segmentation\
  \ directly supports treatment planning — surgeons and oncologists use segmentation maps to estimate\
  \ tumor volume, plan radiation fields, and track progression over time. Unlike simple classification,\
  \ segmentation requires pixel-level precision and produces output that's directly usable in a clinical\
  \ workflow.\n\nThis project segments three tumor sub-regions from multi-modal MRI:\n- **Enhancing tumor\
  \ (ET)**\n- **Peritumoral edema (ED)**\n- **Necrotic/non-enhancing tumor core (NCR/NET)**\n\n## Results\n\
  \n| Model              | Dice (ET) | Dice (ED) | Dice (NCR/NET) | Mean Dice | Hausdorff95 (mm) |\n|--------------------|-----------|-----------|------------------|-----------|-------------------|\n\
  | U-Net (baseline)   | 0.XX      | 0.XX      | 0.XX             | 0.XX      | X.XX              |\n\
  | Attention U-Net    | 0.XX      | 0.XX      | 0.XX             | 0.XX      | X.XX              |\n\n\
  *Fill in after training — see [Results](#detailed-results) for per-case breakdowns and failure analysis.*\n\
  \n![sample predictions](assets/sample_predictions.png)\n\n## Architecture\n\n- **Baseline:** 3D U-Net\
  \ with instance normalization and residual blocks\n- **Improved model:** Attention U-Net — attention\
  \ gates at each skip connection let the decoder focus on relevant tumor regions rather than passing\
  \ all encoder features through uniformly\n- Trained on multi-modal input (T1, T1ce, T2, FLAIR stacked\
  \ as channels)\n\nSee [`docs/architecture.md`](docs/architecture.md) for diagrams and design rationale.\n\
  \n## Repo structure\n\n```\n├── configs/              # YAML configs for each experiment\n├── src/\n\
  │   ├── data/             # preprocessing, patch sampling, augmentation\n│   ├── models/           #\
  \ U-Net, Attention U-Net implementations\n│   ├── train.py\n│   ├── evaluate.py\n│   └── inference.py\n\
  ├── notebooks/            # EDA and result exploration\n├── demo/                 # Streamlit/Gradio\
  \ inference app\n├── docs/\n│   └── architecture.md\n├── assets/               # images/gifs for README\n\
  ├── requirements.txt\n└── Dockerfile\n```\n\n## Setup\n\n```bash\ngit clone https://github.com/<your-username>/brats-tumor-segmentation.git\n\
  cd brats-tumor-segmentation\npip install -r requirements.txt\n```\n\n### Data\n\nThis project uses the\
  \ [BraTS 2021 Task 1 dataset](https://www.kaggle.com/datasets/dschettler8845/brats-2021-task1), available\
  \ on Kaggle. It contains multi-institutional mpMRI scans (T1, T1ce, T2, FLAIR) with expert annotations\
  \ for enhancing tumor, peritumoral edema, and necrotic tumor core.\n\n1. Download the dataset from Kaggle\
  \ (sign-in required)\n2. Extract it into `data/raw/` so the structure looks like:\n   ```\n   data/raw/BraTS2021_Training_Data/\n\
  \       BraTS2021_00000/\n           BraTS2021_00000_t1.nii.gz\n           BraTS2021_00000_t1ce.nii.gz\n\
  \           BraTS2021_00000_t2.nii.gz\n           BraTS2021_00000_flair.nii.gz\n           BraTS2021_00000_seg.nii.gz\n\
  \       BraTS2021_00002/\n       ...\n   ```\n3. Preprocess into normalized numpy arrays:\n   ```bash\n\
  \   python -m src.data.preprocessing --raw_dir data/raw/BraTS2021_Training_Data --out_dir data/processed\n\
  \   ```\n\nRaw and processed data are excluded from version control via `.gitignore` — only code and\
  \ results are tracked in this repo.\n\n## Training\n\n```bash\npython -m src.train --config configs/unet_baseline.yaml\n\
  python -m src.train --config configs/attention_unet.yaml\n```\n\n## Evaluation\n\n```bash\npython -m\
  \ src.evaluate --config configs/attention_unet.yaml --checkpoint checkpoints/attention_unet_best.pt\n\
  ```\n\nReports Dice score, Hausdorff95, sensitivity, and specificity per tumor sub-region, plus qualitative\
  \ overlays on held-out cases.\n\n## Interactive demo\n\n```bash\nstreamlit run demo/app.py\n```\n\n\
  Select a case and slice, then view the model's predicted segmentation overlay against ground truth in\
  \ real time.\n\n## Detailed results\n\nFull per-case metrics, training curves, and a discussion of failure\
  \ cases (where the model under- or over-segments) are in [`docs/results.md`](docs/results.md). Including\
  \ failure analysis on purpose — understanding where a model breaks matters as much as the headline score.\n\
  \n## What I'd improve with more time\n\n- Test-time augmentation for more robust predictions\n- 3D full-volume\
  \ inference instead of patch-based (currently limited by GPU memory)\n- Uncertainty estimation (e.g.\
  \ MC dropout) to flag low-confidence predictions for clinician review\n\n## References\n\n- Menze et\
  \ al., \"The Multimodal Brain Tumor Image Segmentation Benchmark (BraTS),\" IEEE TMI 2015\n- Baid et\
  \ al., \"The RSNA-ASNR-MICCAI BraTS 2021 Benchmark on Brain Tumor Segmentation and Radiogenomic Classification,\"\
  \ 2021\n- Oktay et al., \"Attention U-Net: Learning Where to Look for the Pancreas,\" 2018\n- Ronneberger\
  \ et al., \"U-Net: Convolutional Networks for Biomedical Image Segmentation,\" MICCAI 2015\n\n## License\n\
  \nMIT"

readme_excerpt: "\n# CLAIRE-ROP\n\n<p align=\"center\">\n\n![CLAIRE-ROP](https://github.com/UniHD-CEG/CLAIRE-ROP/assets/62182727/39b49f03-432c-4615-b295-8c665cf32aff)\n\
  \n\n</p>\n\n\n <div align=\"justify\">\nDeformable Image Registration (DIR) is a complex process that\
  \ involves calculating a deformation field to map one image onto another. This field describes the spatial\
  \ transformation between the two images using mathematical algorithms. Due to its complexity, DIR requires\
  \ substantial computational resources and time, posing challenges for time-sensitive medical applications\
  \ like image-guided radiation therapy.\n\nOur method addresses this challenge by significantly reducing\
  \ processing time without sacrificing registration accuracy. We achieve this by partitioning lung images\
  \ into multiple partitions, enabling separate registration for each partition. These partitions are\
  \ efficiently distributed across dedicated GPUs, eliminating communication overhead and enhancing scalability.\
  \ This partition-based approach is scalable, allowing us to adapt seamlessly to an increased number\
  \ of available GPUs.\n </div>\n\n### __Registration framework:__\n\n- [CLAIRE](https://github.com/andreasmang/claire)\n\
  \n### __Dataset:__\n\n- [4DCT DIR-Lab](https://med.emory.edu/departments/radiation-oncology/research-laboratories/deformable-image-registration/downloads-and-reference-data/4dct.html)\n\
  \n### __Required tools:__\n\n  - [SimpleITK](https://pypi.org/project/SimpleITK/)   \n  - [NiBabel](https://nipy.org/nibabel/index.html)\n\
  \  - [Totalsegmentator](https://github.com/wasserth/TotalSegmentator )\n\n\n### __Instructions:__\n\n\
  1) Install CLAIRE and the required tools.\n2) Define the number of available GPUs and your dataset category\
  \ (S or L) in `Partitioning.sh` and run the script.\n   \n###  __Getting optimal results:__ \n\nRun\
  \ the small dataset with 4 GPUs and the large dataset with 8 GPUs to get the fastest runtime while preserving\
  \ accuracy.\n\n\n\n\n\n\n\n\n\nIf you encounter any problems, have inquiries, or wish to provide feedback,\
  \ please feel free to reach out to us via email (vahdaneh.kiani@ziti.uni-heidelberg.de).\n\n\n"

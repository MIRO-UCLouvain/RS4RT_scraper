readme_excerpt: "# SSL-OARs-Tumor-Segmentation-in-PETCT\nSelf-Supervised Learning with Swin UNETR for\
  \ Segmentation of Organs at Risk and Tumor in PET/CT Images\n\n# Install Dependencies\nInstall dependencies\
  \ using\n```python \npip install -r requirements.txt\n```\n# Preprocessing\nBefore pretraining and fine-tuning,\
  \ data (PET and CT) should be preprocessed:\n```python\npython preprocess.py --in_dir=<Input-directory(PET\
  \ and CT)> --out_dir=<Output-directory>\n```\n# Pre-Training \nPre-Train Swin UNETR encoder on unlabeled\
  \ data\n```python \npython main.py --exp=<Experiment Name> --in_channels=2 --data_dir=<Data-Path> --json_list=<Json\
  \ List Path> \\\n--lr=6e-6 --lrdecay --batch_size=<Batch Size> --num_steps=<Number of Steps>\n```\n\
  # Fine-Tuning \nFine-Tuning Swin UNETR on labeled data\n```python \npython main.py --exp=<Experiment\
  \ Name> --data_dir=<Data-Path> --json_list=<Json List Path> --in_channels=2 --out_channels=12 \\\n--pretrained_model_name=<Pretrained\
  \ Encoder Name> --batch_size=<Batch Size> --max_epochs=<Epochs> --use_ssl_pretrained \\\n--ssl_pretrained_path=<Pretrained\
  \ Model Path> --use_checkpoint\n```\n# Evaluation\nEvaluating Swin UNETR \n```python \npython test.py\
  \ --pretrained_dir=<Pretrained Model Path> --data_dir=<Data-Path> --exp_name=<Experiment Name> \\\n\
  --json_list=<Json List Path> --pretrained_model_name=<Pretrained Model Name> --save \n```\n# Acknowledgement\n\
  Models implementation and SSL pipeline are based on [MONAI](https://github.com/Project-MONAI/MONAI)\
  \ and [This](https://github.com/Project-MONAI/research-contributions/tree/main/SwinUNETR) repositories.\
  \ \n"

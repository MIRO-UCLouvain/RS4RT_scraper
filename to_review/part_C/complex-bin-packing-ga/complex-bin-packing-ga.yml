readme_excerpt: "# Addressing Radiotherapy Scheduling with a Bin Packing Problem Formulation: A Comparative\
  \ Study of Exact Solvers and Genetic Algorithms\n\n## Requirements\n0. We assume Anaconda is installed.\
  \ One can install it according to its [installation page](https://docs.conda.io/projects/conda/en/latest/user-guide/install/index.html).\n\
  1. Clone this repo:\n```\ngit clone https://github.com/DIOL-UniTN/complex-bin-packing-GA.git\ncd complex-bin-packing-GA\n\
  ```\n2. Create a virtual environment using `environment.yml` file. \n```\nconda env create -f environment.yml\n\
  conda activate complex-bin-packing-GA\n```\n\n## Run\n\n### ILP with SCIP solver\n\n```\npython complex_bin_packing.py\
  \ -f instances/2020_PatientArrivals_instance_1 -s solutions/SCIP/ILP_instance_1 -b SCIP\n```\n\n###\
  \ ILP with SAT solver\n\n```\npython complex_bin_packing.py -f instances/2020_PatientArrivals_instance_1\
  \ -s solutions/SCIP/ILP_instance_1 -b SAT\n```\n\n### CP with CP-SAT solver\n\n```\npython complex_bin_packing_cp.py\
  \ -f instances/2020_PatientArrivals_instance_1 -s solutions/SCIP/ILP_instance_1\n```\n\n### GGA Version\
  \ 1\n\n```\npython ga_patient_scheduling.py -f instances/2020_PatientArrivals_instance_1 -s solutions/GA_1/100_200_28/100_200_instance_1\
  \ -p 100 -g 200 --seed 28\n```\n\n### GGA Version 2\n\n```\npython ga_patient_scheduling_v2.py -f instances/2020_PatientArrivals_instance_1\
  \ -s solutions/GA_2/100_200_28/100_200_instance_1 -p 100 -g 200 --seed 28\n```\n"

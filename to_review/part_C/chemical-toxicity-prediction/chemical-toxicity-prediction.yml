readme_excerpt: "# DataBots_Kaggle\n# This is a Kagglel InClass Toxicity Prediction Challenge \n# Programming\
  \ Language: Python\n\n It requires sklearn, numpy, pandas and light gbm installation along with Python\
  \ on your system\n \n Operating System: MAC OS 11.2\n\n Following libraries can be installed directly\
  \ \n \n1) RUN pip install lightgbm;\n\n2) RUN pip install pandas;\n\n3) RUN pip install -U scikit-learn;\n\
  \n4) RUN pip install numpy;\n\n# Instructions to run the code:\n\nPrerequisites:\n• Install - anaconda3\
  \ or python.\n• Download train, test, and feamat datasets from “The Toxicity Prediction Challenge”\n\
  competition (Kaggle) or from this GIT repository\n\n#Execution:\n\n\n1. Create a folder with the name\
  \ “ToxcityPrediction” \n2. Upload the feamat, train, test datasets and FinalCode.py to the folder ToxcityPrediction\
  \ \n3. open terminal and go to the folder ToxcityPrediction and run the command python FinalCode.py\n\
  4. In the terminal FinalCode.py will get executed and whole execution would take about an hour.\n5.\
  \ Once the execution completes, submission_final_lgb.csv file will be created in the same folder where\
  \ FinalCode.py was executed i.e.,ToxcityPrediction folder\n\n\nNOTE - Specify the path of your own directory\
  \ for read.csv files where feamat, train, test datasets are kept.\n\nFor Example - If feamat, train,\
  \ test datasets are kept in ToxcityPrediction folder then the following line of code would be replaced\
  \ by - \n\n#load train dataset\ntrain = pd.read_csv('/ToxcityPrediction/train.csv')   \n\n#load test\
  \ dataset\ntest = pd.read_csv('/ToxcityPrediction/test.csv') \n\n#load feamat dataset \nfeature_matrix\
  \ = pd.read_csv('/ToxcityPrediction/feamat.csv')  \n\n\n\n\n\n"

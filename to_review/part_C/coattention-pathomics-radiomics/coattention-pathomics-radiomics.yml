readme_excerpt: "\r\n\r\n# Leveraging Co-Attention-Based Interactions Between Pathology and Radiology\
  \ for Pan-Cancer Survival Prediction\r\n\r\nThis is the Github Repository for \"Leveraging Co-Attention-Based\
  \ Interactions Between Pathology and Radiology for Pan-Cancer Survival Prediction\".\r\n\r\n## Installation\r\
  \n\r\nFirst clone the repo and cd into the directory:\r\n\r\n```\r\ngit clone https://github.com/EstelleXIA/coattention-pathomics-radiomics.git\r\
  \ncd coattention-pathomics-radiomics\r\n```\r\n\r\nThen use the environment configuration file located\
  \ in `./environment.yaml` to create a conda environment:\r\n\r\n```\r\nconda env create -n para-mil\
  \ -f environment.yaml\r\n```\r\n\r\nFinally activate the `para-mil` environment:\r\n\r\n```\r\nconda\
  \ activate para-mil\r\n```\r\n\r\n## Instructions\r\n\r\n### I. Data Preparation\r\n\r\nThe dataset\
  \ used in this study includes both in-house and public resources. The data collection for each cancer\
  \ type can be divided into two parts: one for the development of the CS-GCN model to extract cell-cell\
  \ interactions in pathomics, and the other for the development of the PaRa-MIL model for survival prediction.\
  \ There are no sample overlaps between these two parts of the data.\r\n\r\nThe sample sizes are listed\
  \ below.\r\n\r\n| Cancer Type | \\# CS-GCN Patients | \\# CS-GCN WSIs | \\# PaRa-MIL Patients | \\#\
  \ PaRa-MIL WSIs | \\# PaRa-MIL CT/MRI |\r\n| :---------: | :----------------: | :------------: | :------------------:\
  \ | :--------------: | :----------------: |\r\n|   Kidney    |        503         |      508       |\
  \         777          |      2,345       |        777         |\r\n|    Lung     |        772     \
  \    |      860       |         278          |       492        |        278         |\r\n|    Brain\
  \    |        646         |     1,213      |         165          |       335        |        165  \
  \       |\r\n|    Ovary    |        123         |      221       |          61          |        61\
  \        |         61         |\r\n|    Liver    |        202         |      209       |          44\
  \          |        47        |         44         |\r\n|   Stomach   |        234         |      256\
  \       |          39          |        39        |         39         |\r\n|   Bladder   |        252\
  \         |      281       |          72          |        98        |         72         |\r\n|  **Total**\
  \  |     **2,732**      |   **3,548**    |      **1,436**       |    **3,417**     |     **1,436** \
  \     |\r\n\r\nYou can access the original public dataset through the links provided in the following\
  \ table.\r\n\r\n| Cancer Type | CS-GCN Development                                           | PaRa-MIL\
  \ Development                                         |                                            \
  \                  |\r\n| ------------------- | -------------------------------------------------- |\
  \ ------------------------------------------------------------ | ------------------------------------------------------------\
  \ |\r\n| Data              | Pathology Only                                               | Pathology\
  \                                                    | Radiology                                   \
  \                 |\r\n| Kidney (KIRC) | /                                                         \
  \   | /                                                            | /                             \
  \                               |\r\n| Lung (LUNG)       | https://portal.gdc.cancer.gov/projects/TCGA-LUAD\
  \ <br/>https://portal.gdc.cancer.gov/projects/TCGA-LUSC | https://portal.gdc.cancer.gov/projects/TCGA-LUAD<br/>https://portal.gdc.cancer.gov/projects/TCGA-LUSC<br/>https://www.cancerimagingarchive.net/collection/nlst/\
  \ | https://www.cancerimagingarchive.net/collection/nlst/        |\r\n| Brain (BRAT)      | https://portal.gdc.cancer.gov/projects/TCGA-GBM\
  \ <br/>https://portal.gdc.cancer.gov/projects/TCGA-LGG | https://portal.gdc.cancer.gov/projects/TCGA-GBM<br/>https://portal.gdc.cancer.gov/projects/TCGA-LGG\
  \ | https://www.cancerimagingarchive.net/collection/tcga-gbm/<br/>https://www.cancerimagingarchive.net/collection/tcga-lgg/\
  \ |\r\n| Liver (LIHC)      | https://portal.gdc.cancer.gov/projects/TCGA-LIHC             | https://portal.gdc.cancer.gov/projects/TCGA-LIHC\
  \             | https://www.cancerimagingarchive.net/collection/tcga-lihc/   |\r\n| Ovary (HSOC)   \
  \   | https://www.cancerimagingarchive.net/collection/ovarian-bevacizumab-response/ | https://www.synapse.org/Synapse:syn25946117/wiki/611576\
  \      | https://www.synapse.org/Synapse:syn25946117/wiki/611576      |\r\n| Stomach (STAD)    | https://portal.gdc.cancer.gov/projects/TCGA-STAD\
  \             | https://portal.gdc.cancer.gov/projects/TCGA-STAD             | https://www.cancerimagingarchive.net/collection/tcga-stad/\
  \   |\r\n| Bladder (BLCA)    | https://portal.gdc.cancer.gov/projects/TCGA-BLCA             | https://portal.gdc.cancer.gov/projects/TCGA-BLCA\
  \             | https://www.cancerimagingarchive.net/collection/tcga-blca/   |\r\n\r\nWe have performed\
  \ data cleaning and labelling for these data. Due to the large volume of data, please contact this [Email](mailto:Estelle-xyj@sjtu.edu.cn)\
  \ if you need access to the processed data.\r\n\r\n\r\n\r\n### II. Pathomics & Radiomics Extraction\r\
  \n\r\nThe following part uses the bladder tumor (BLCA) as a demo. You need to download the demo data\
  \ [here](https://zenodo.org/records/14172525) and put into the `data/` . Here is an example of directory\
  \ for pathological and radiological data.\r\n\r\n```\r\ndata\r\n├── BLCA\r\n│   ├── TCGA-BLCA  # the\
  \ directory for pathological data\r\n│   │   └── pathology_svs\r\n│   │   │   ├── TCGA-4Z-AA7N-01Z-00-DX1.svs\r\
  \n│   │   │   ├── TCGA-4Z-AA7O-01Z-00-DX1.svs\r\n│   │   │   ├── TCGA-4Z-AA7W-01Z-00-DX1.svs\r\n│  \
  \ │   │   └── ...\r\n│   └── TCIA-BLCA  # the directory for radiological data\r\n│   │   ├── img_nii\r\
  \n│   │   │   ├── TCGA-4Z-AA7N_0000.nii.gz\r\n│   │   │   ├── TCGA-4Z-AA7O_0000.nii.gz\r\n│   │   │\
  \   ├── TCGA-4Z-AA7W_0000.nii.gz\r\n│   │   │   └── ...\r\n│   │   └── mask_nii\r\n│   │   │   ├── TCGA-4Z-AA7N.nii.gz\r\
  \n│   │   │   ├── TCGA-4Z-AA7O.nii.gz\r\n│   │   │   ├── TCGA-4Z-AA7W.nii.gz\r\n│   │   │   └── ...\r\
  \n└── ...\r\n```\r\n\r\n#### Pathomics Generation\r\n\r\n![pathomics_generation](docs/pathomics_generation.png)\r\
  \n\r\n##### 1. Cut WSI into patches\r\n\r\nIn this step, you can use any method to cut WSI into patches\
  \ with size of 768x768 at 40x magnification or 0.25 microns per pixel (mpp). Here we give a reference\
  \ example.\r\n\r\nFirst, create a codebook to organize the number of pathological slides for each patient.\r\
  \n\r\n```\r\npython ./pathomics_extraction/preparation/1_prepare_wsi_codebook.py --task BLCA\r\n```\r\
  \n\r\nThis step will create `svs_blca.csv` under `data/BLCA/TCGA-BLCA/`.\r\n\r\nThen, we cut patches\
  \ and applied luminosity and color normalization.\r\n\r\n```\r\npython ./pathomics_extraction/preparation/2_cut_patches.py\
  \ --task BLCA\r\n```\r\n\r\nThis step could be time-consuming. We recommend using the Array Jobs with\
  \ Slurm to fasten this process. We provide an example in `./pathomics_extraction/preparation/2_cut_patches.slurm`.\r\
  \n\r\n##### 2. Nuclei segmentation and classification\r\n\r\nYou can use the official Github repository\
  \ of [Hover-Net](https://github.com/vqdang/hover_net) for nuclei segmentation and classification. Or\
  \ you can refer to [Hover-UNet](https://github.com/DIAGNijmegen/HoVer-UNet), which modified HoVerNet\
  \ to accelerate the inference process.\r\n\r\nEnsure that a pickle file is generated for each patch,\
  \ comprising the nuclei masks and the corresponding cell types. The pickle files should be formatted\
  \ as follows:\r\n\r\n```\r\ndata\r\n├── BLCA\r\n│   ├── TCGA-BLCA\r\n│   │   └── pickle\r\n│   │   │\
  \   ├── TCGA-4Z-AA7N\r\n│   │   │   │   ├── TCGA-4Z-AA7N_0_2304-18432.pickle\r\n│   │   │   │   ├──\
  \ TCGA-4Z-AA7N_0_2304-19200.pickle\r\n│   │   │   │   ├── TCGA-4Z-AA7N_0_2304-20736.pickle\r\n│   │\
  \   │   │   └── ...\r\n│   │   │   ├── TCGA-4Z-AA7O\r\n│   │   │   │   ├── TCGA-4Z-AA7O_0_0-109056.pickle\r\
  \n│   │   │   │   ├── TCGA-4Z-AA7O_0_0-109824.pickle\r\n│   │   │   │   ├── TCGA-4Z-AA7O_0_0-110592.pickle\r\
  \n│   │   │   │   └── ...\r\n│   │   │   └── ...\r\n└── ...\r\n```\r\n\r\n##### 3. Histomics feature\
  \ extraction \r\n\r\n```\r\npython ./pathomics_extraction/omics/nuclei_graph_construction/1_nuclei_feature_extraction.py\
  \ --task BLCA\r\n```\r\n\r\nYou can also use the Array Jobs with Slurm to accerlate this process. We\
  \ provide an example in `./pathomics_extraction/omics/nuclei_graph_construction/1_nuclei_feature_extraction.slurm`.\r\
  \n\r\n##### 4. Patch nuclei graph construction\r\n\r\n```\r\npython ./pathomics_extraction/omics/nuclei_graph_construction/2_patch_nuclei_graph_construction.py\
  \ --task BLCA\r\n```\r\n\r\nYou can also use the Array Jobs with Slurm to accerlate this process. We\
  \ provide an example in `./pathomics_extraction/omics/nuclei_graph_construction/2_patch_nuclei_graph_construction.slurm`.\r\
  \n\r\n##### 5. Intercellular feature extraction\r\n\r\nWe provide trained checkpoints in `./pathomics_extraction/omics/patch_feature_extraction/ckpts`\
  \ for intercellular feature extraction.\r\n\r\n```\r\npython ./pathomics_extraction/omics/patch_feature_extraction/inference.py\
  \ --task BLCA\r\n```\r\n\r\nIf you want to train the model on your own, you can run the following command.\r\
  \n\r\n```\r\npython ./pathomics_extraction/omics/patch_feature_extraction/train.py --task BLCA --fold\
  \ 0 \r\n```\r\n\r\n##### 6. Morphological feature extraction\r\n\r\nFirst create `.json` files to record\
  \ the patch index.\r\n\r\n```\r\npython ./pathomics_extraction/morphological/1_prepare_patch_json.py\
  \ --task BLCA\r\n```\r\n\r\nThen extract morphological patch features.\r\n\r\n```\r\npython ./pathomics_extraction/morphological/2_extract_resnet_feature.py\
  \ --task BLCA\r\n```\r\n\r\n##### 7. Generate combined pathomics features\r\n\r\nCombine intercellular\
  \ characteristics with morphological features to formulate the pathomics of a patch.\r\n\r\n```\r\n\
  python ./pathomics_extraction/combined/combine_features.py --task BLCA\r\n```\r\n\r\n#### Radiomics\
  \ Generation\r\n\r\n![radiomics_generation](docs/radiomics_generation.png)\r\n\r\n##### 1. Pyradiomics\
  \ features extraction\r\n\r\nFive levels of features (shape, first-orde, texture, log-sigma, and wavelet)\
  \ were extracted from Pyradiomics for each radiological scan.\r\n\r\n```\r\npython ./radiomics_extraction/omics/1_extract_pyradiomics.py\
  \ --task BLCA\r\n```\r\n\r\nThen being combined into a single file.\r\n\r\n```\r\npython ./radiomics_extraction/omics/2_combine_all_radiomics.py\
  \ --task BLCA\r\n```\r\n\r\n##### 2. Morphological feature extraction\r\n\r\nFor morphological characteristics,\
  \ we use the [Rad-FM](https://github.com/chaoyi-wu/RadFM.git) foundation model.\r\n\r\n```\r\ncd ./radiomics_extraction/morphological/\r\
  \ngit clone https://github.com/chaoyi-wu/RadFM.git\r\n```\r\n\r\nDownload the checkpoints [here](https://pan.baidu.com/s/1A-K5nXCbvWAVqvb6dLjYJg?pwd=q1eo)\
  \ and put the file `pytorch_model.bin` under the directory `./radiomics_extraction/morphological/`.\r\
  \n\r\nCrop the region(s) of interest.\r\n\r\n```\r\npython ./radiomics_extraction/morphological/1_prepare_roi.py\
  \ --task BLCA\r\n```\r\n\r\nThen extract the morphological features.\r\n\r\n```\r\npython ./radiomics_extraction/morphological/2_extract_feature.py\
  \ --task BLCA\r\n```\r\n\r\n\r\n\r\n### III. PaRa-MIL and Comparative Methods for Survival Prediction\r\
  \n\r\n![coattention_survival_prediction](docs/coattention_survival_prediction.png)\r\n\r\n\r\n\r\n####\
  \ PaRa-MIL\r\n\r\nA multimodal model for survival prediction capturing the interactions between pathomics\
  \ and radiomics through a coattention Transformer.\r\n\r\n```\r\npython ./survival_modeling/train.py\
  \ --task [KIRC,LUNG,BRAT] --fold [0,1,2,3,4] --model PaRa_MIL\r\n```\r\n\r\n#### PaRa-MIL-wo\r\n\r\n\
  The same architecture as PaRa-MIL except for the cell-cell interaction features in pathomics.\r\n\r\n\
  ```\r\npython ./survival_modeling/train.py --task [KIRC,LUNG,BRAT] --fold [0,1,2,3,4] --model PaRa_MIL_wo\r\
  \n```\r\n\r\n#### Rad-MIL\r\n\r\nA single-modal model that uses radiomics features as input. The structure\
  \ is identical to the radiological imaging branch of PaRa-MIL.\r\n\r\n```\r\npython ./survival_modeling/train.py\
  \ --task [KIRC,LUNG,BRAT] --fold [0,1,2,3,4] --model Rad_MIL\r\n```\r\n\r\n#### Path-MIL\r\n\r\nA single-modal\
  \ method that uses pathological features as input. The structure is identical to the pathological imaging\
  \ branch of PaRa-MIL.\r\n\r\n```\r\npython ./survival_mod"

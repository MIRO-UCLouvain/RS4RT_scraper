readme_excerpt: "# The `dpm-g4cpp` R&D\n\n\n## Motivation\n\nThe motivations behind this project are:\n\
  \ - provide a clean, well documented `C++` implementation of the well known, highly specialised *Dose\
  \ Planning Method* (DMP)[1] Monte Carlo simulation that can be a basis for further GPU/FPGA developments\n\
  \ - in order to make the original DPM like simulation more suitable for these hardware, eliminate all\
  \ possible non-deterministic loops from the simulation, especially those related to the final state\
  \ generation of the individual interactions\n - this project also serves as *testbed* for studying the\
  \ possible benefits of the related treatment of the description of e-/e+ Multiple Coulomb Scattering\
  \ (MSC) over the traditional models\n - especially that the DPM like handling of MSC is very efficient\
  \ and stays accurate (without paying any computing performance penalties) even in the case of highly\
  \ granular geometries\n - this latter is due to the fact that this simulation algorithm was designed\
  \ and optimised for efficient and accurate modelling of particle transport through multiple, small geometry\
  \ voxels\n\n\n\n## Description\n\n\n`dpm-g4cpp` is a `C++` prototype of the known *Dose Planning Method*\
  \ (DMP)[1], fast and accurate Monte Carlo simulation. DMP is highly optimised for photon and electron\
  \ radiotherapy treatment planning dose calculations based on a data extraction and simulation phase.\n\
  \nThese two phases are also preserved and clearly separated in the `dpm-g4cpp` version:\n - `dpm_GenerateData`\
  \ : can be used to generate and write into files all the data that are needed for the later simulation\
  \ phase. Since some of the data (the integrated data such as IMFP, dE/dx, etc.) are generated based\
  \ on `Geant4`, this part requires a recent `Geant4` (version >= 10.7.p01) installed on the system.\n\
  \ - `dpm_Simulate` : can be used to perform the dose simulation relying on the previously generated\
  \ data files. One of the main difference between the original DPM and `dpm-g4cpp` that this latter simulation\
  \ dose not contain any non-deterministic loops (rejection loops) during the interaction computation\
  \ including even the sampling of angular deflections along a given path length according to the *Goudsmit\
  \ Saunderson* angular distributions or the emitted bremsstralung photon energy according to the numerical\
  \ Seltzer-Berger DCS. These makes `dpm-g4cpp` a suitable prototype for GPU/FPGA hardware implementations\
  \ since the main thread divergence factors have been eliminated form the original DPM simulation.\n\n\
  \n## Build\n\n\nAs mentioned before, the data generation and simulation phases are well separated. Since\
  \ the data generation part depends on `Geant4`, a relatively recent version (>= Geant4-10.7p01) of the\
  \ `Geant4` simulation toolkit needs to be available on the system. See the **[Geant4 Installation Guide](https://geant4-userdoc.web.cern.ch/UsersGuides/InstallationGuide/html/index.html)**\
  \ for further instruction.\n\nIt is assumed in the followings, that the required version of the ``Geant4``\
  \ toolkit is installed on the system and the corresponding ``Geant4Config.cmake`` ``CMake`` configuration\
  \ file is located under the ``G4_INSTALL`` directory. Then building and installing ``G4HepEm`` (under\
  \ the ``G4HepEm_INSTALL`` directory) can be done by simple:\n\n    $ git clone https://github.com/mnovak42/dpm-g4cpp.git\
  \    \n    $ cd dpm-g4cpp\n    $ mkdir build\n    $ cd build/\n    $ cmake ../ -DGeant4_DIR=G4_INSTALL\n\
  \    $ make\n\n## Example: the data generation phase\n\nThen the generated `dpm_GenerateData` executable\
  \ can be used to generate all the files that are needed for a given simulation. The following information\
  \ is reported when executing with `-h` (help) flag:\n\n    $ ./dpm_GenerateData -h\n\n    ===============================================================================================\n\
  \     The dpm-g4cpp pre-init/data generation phase.\n\n     Usage: dpm_GenerateData [OPTIONS]\n\n  \
  \   -d  --input-data-dir      (where the pre-generated data will be written)  - default: ./data\n  \
  \   -c  --configuration-index (one of the pre-defined configuration settings) - default: 0\n     -h\
  \  --help\n\n    ===============================================================================================\n\
  \n\nNote, that there are several pre-defined simulation configurations available for the fast settings\
  \ of some reference configurations given in [1]. See the `Configuration.hh` and the `Simulation/Geom.hh`\
  \ files for further details. The pre-defined simulation configuration with the index of `3` will be\
  \ used in the following: this will be used to simulate the depth dose distribution in a `Water-Titanium-Bone-Water`\
  \ geometry shown in Fig.15. of [1] (and below). The corresponding data files will be generated into\
  \ a\nnewly created local `data_WaterTiBoneWater` directory:\n\n    bash-3.2$ mkdir data_WaterTiBoneWater\n\
  \    bash-3.2$ ./dpm_GenerateData -c 3 -d data_WaterTiBoneWater  \n\n<details>\n <summary> <b>Expand\
  \ for the output!</b> </summary>\n\n    === The dpm-g4cpp data generation configuration:\n\n       \
  \ - output data directory : data_WaterTiBoneWater\n        - configuration index   : 3\n\n    === Pre-init/data\
  \ generation configuration:\n         - Min-Ekin          : 0.001  [MeV]\n         - Max-Ekin      \
  \    : 21  [MeV]\n         - #Ekins for e-     : 128\n         - #Ekins for gamma  : 1024\n        \
  \ - cut for e-        : 0.2  [MeV]\n         - cut for gamma     : 0.05  [MeV]\n         - MSC step\
  \ param    :\n                s-low    = 5  [mm]\n                s-high   = 10  [mm]\n            \
  \    e-cross  = 12 [MeV]\n         - pre-defined geom. : 3\n         - materials         :\n       \
  \         [0] = G4_WATER\n                [1] = G4_Ti\n                [2] = G4_BONE_COMPACT_ICRU\n\
  \    ...............................................\n\n\n    === Data are generated now (don't care\
  \ about the\n        Geant4 warning: 'WARNING from G4PenelopeIonisationModel...')\n\n\n   WARNING from\
  \ G4PenelopeIonisationModel\n   Atomic de-excitation module is not instantiated, so there will not be\
  \ any fluorescence/Auger emission.\n   Please make sure this is intended\n\n    === All data have been\
  \ generated and will be written now\n        into files under the directory: data_WaterTiBoneWater\n\
  \n</details>\n\n## Example: the simulation phase\n\nAfter having all the required data generated, the\
  \ `dpm_Simulate` executable can be used to perform\nthe dose simulation in the previously selected configuration.\
  \ The simulation configuration can be\nspecified by the input arguments. Executing `dmp_Simulate` with\
  \ the `-h` (help) flag provides the\nfollowing information regarding the input arguments:\n\n    $./dpm_Simulate\
  \ -h\n\n    =================================================================================================\n\
  \     The dpm-g4cpp simulation phase.\n\n     Usage: dpm_Simulate [OPTIONS]\n\n   \t-p  --primary-particle\
  \    (possible particle names: e-, gamma)            - default: e-\n   \t-e  --primary-energy      (in\
  \ [MeV] units)                                - default: 0.1\n   \t-n  --number-of-histories (number\
  \ of primary events to simulate)          - default: 1.0E+5\n   \t-d  --input-data-dir      (where the\
  \ pre-generated data are located)      - default: ./data\n   \t-b  --voxel-size          (size of the\
  \ voxel/box in [mm])                 - default: 1.0\n   \t-c  --configuration-index (one of the pre-defined\
  \ configuration index)    - default: 0\n   \t-h  --help\n\n    =================================================================================================\n\
  \nTherefore, the in order to simulate `200 000` primary `e-` with initial energy of `15.0 [MeV]`\nusing\
  \ the previously generated data located under the `data_WaterTiBoneWater` sub-directory with the previously\
  \ used pre-defined configuration with an index of `3` can be done as:  \n\n    ./dpm_Simulate -n 200000\
  \ -e 15.0 -d data_WaterTiBoneWater -c 3\n\n<details>\n <summary> <b>Expand for the output!</b> </summary>\n\
  \n    === The dpm-g4cpp simulation confguration:\n\n        - input data directory  : data_WaterTiBoneWater\n\
  \        - primary particle      : e-\n        - primary energy        : 15 [MeV]\n        - number\
  \ of histories   : 200000\n        - geometry voxel size   : 1 [mm]\n        - confoguration index \
  \  : 3\n\n    === Pre-init/data generation configuration:\n         - Min-Ekin          : 0.001  [MeV]\n\
  \         - Max-Ekin          : 21  [MeV]\n         - #Ekins for e-     : 128\n         - #Ekins for\
  \ gamma  : 1024\n         - cut for e-        : 0.2  [MeV]\n         - cut for gamma     : 0.05  [MeV]\n\
  \         - MSC step param    :\n                s-low    = 5  [mm]\n                s-high   = 10 \
  \ [mm]\n                e-cross  = 12 [MeV]\n         - pre-defined geom. : 3\n         - materials\
  \         :\n                [0] = G4_WATER\n                [1] = G4_Ti\n                [2] = G4_BONE_COMPACT_ICRU\n\
  \    ...............................................\n\n\n    === Start simulation of N = 200000 events\
  \ ===\n\n    == Starting Primary = 0\n    == Starting Primary = 20000\n    == Starting Primary = 40000\n\
  \    == Starting Primary = 60000\n    == Starting Primary = 80000\n    == Starting Primary = 100000\n\
  \    == Starting Primary = 120000\n    == Starting Primary = 140000\n    == Starting Primary = 160000\n\
  \    == Starting Primary = 180000\n\n    === End simulation of N = 200000 events ===\n\n    === Energy\
  \ deposit histogram is written to the file:  hist.sim\n\n</details>\n\n## Example: the result\n\nThe\
  \ resulted depth dose distribution is located in the `hist.sim` file. This is plotted in the figure\
  \ below together with the corresponding original DPM result (digitised from Fig.15. of [1] and can be\
  \ found under `tests/WaterTiBoneWater_15MeV/`)\n\n  ![ref-fig](tests/WaterTiBoneWater_15MeV/ref.png)\n\
  \nReferences\n-----------\n\n[1] J Sempau, S. J. Wilderman, A. F. Bielajew, Phys. Med. Biol. 2000 Aug;\
  \ 45(8):2263-91\n"

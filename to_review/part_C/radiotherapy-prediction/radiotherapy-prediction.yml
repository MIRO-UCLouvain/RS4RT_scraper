  \      - [Feature Scores by Model (Example)](#feature-scores-by-model-example)\n  - [Miscellaneous Notes](#miscellaneous-notes)\n\
  \    - [Feature Engineering Using A Sentinel LN Nomogram](#feature-engineering-using-a-sentinel-ln-nomogram)\n\
  \n## Introduction\n---\nThis is an end-to-end machine learning pipeline for predicting the need of post-mastectomy\
  \ radiotherapy before breast cancer pathology diagnosis.\n\nMany breast cancer requires post-mastectomy\
  \ reconstruction. However, if a patient also needs post-mastectomy radiotherapy, it's important for\
  \ the surgeon and the patient to predict such need *before* the mastectomy surgery. Due to the difficulty\
  \ in these predictions, and the high clinical value of an accurate prediction, we explore the applicability\
  \ of Machine Learning (ML) methods. \n\nTo build ML models, we curated a dataset containing 115 clinical\
  \ features/variables spanning across demographic, preoperative, intraoperative, and postoperative information.\
  \ ML models are trained on this dataset and are used to predict the need of post-mastectomy radiotherapy.\n\
  \n\n## Installation And Usage\n---\nThe necessary libraries could be installed with the following command:\n\
  \n`pip install -r requirements.txt` \n\n### Usage Overview\nThe entire data flow begins with the preprocessing\
  \ of the raw data, which includes feature engineering, missing value imputation, and data normalization.\
  \ The dataset could be visualized for qualitative inspection. Then the dataset is split into subsets\
  \ for training and testing. The dataset is also split via subsets of columns (pre-operative variables\
  \ only, both pre-and-post-operative variables, etc.). The next step is to train a ML model on dataset\
  \ and evaluate its performance using cross validation. Finally, we evaluate the model performance on\
  \ the unseen hold-out test dataset.\n\n### Usage Commands\n\n- To run the pre-processing pipeline\n\
  \  - in production mode with training new imputation models: ` python main.py --df_path <PATH_TO_RAW_CSV>`\n\
  \  - in production mode with training new imputation models, ML impute-only (no other pre-processing):\
  \ ` python main.py --df_path <PATH_TO_CLEANSED_CSV> --ml_impute_only`\n  <!-- - in production mode with\
  \ training new imputation models, Expert impute-only (with other pre-processing): ` python main.py --df_path\
  \ <PATH_TO_CLEANSED_CSV> --expert_impute_only` -->\n  - in production mode with previously-trained best\
  \ models: `python3 main.py -f `\n  - in debug mode: `python3 main.py --debug --df_path <PATH_TO_RAW_CSV>`\n\
  \  - run tests: `python -m pytest tests/`\n  - To display logs (with color-highlighting):\n`cat data/preprocessed/<OUTPUT_TIMESTAMP>/log.txt`\n\
  \n- To visualize data\n  - use the notebook at: `notebooks/RTx Data Exploration.ipynb`\n  - or the command-prompt\
  \ plotting tool: `python3 src/visualize/visualizer.py`\n    - use `-vizall` flag to plot all columns:\
  \ `python3 src/visualize/visualizer.py -vizall`\n\n\n- To generate subsets of the original dataset using\
  \ specific subsets of columns: `python scripts/generate_datasets.py --df_dir_path <PATH_TO_IMPUTED_DF_FOLDER>`\n\
  \n- To compare the two versions of the same dataset and obtain the differences: `python scripts/compare_datasets.py`\n\
  \n- To run model prediction, use the notebook at: `src/predict/predict_python_new.ipynb` \n\n- Other\
  \ miscellaneous notebooks:\n  - Using automated form-filling to perform feature engineering using monogram\
  \ website: `notebooks/Apply Nomogram.ipynb`\n  - Perform exploratory data analysis and calculate column-wise\
  \ summary statistics: `notebooks/Value Count.ipynb`\n  - Evaluate the performance and metrics of imputed\
  \ missing values: `notebooks/Evaluate Imputation.ipynb`\n\n\n## An End-to-End ML Pipeline \n---\n###\
  \ Pipeline Overview Diagram\n![Pipeline Overview Diagram](plots_tables/RTx_Pipeline_Diagram.png)\n###\
  \ Data Preprocessing Module\n1. *Column Renaming*. Editing the column names of pre-operative, intra-operative,\
  \ and post-operative features.\n2. *Data     Cleansing*. Systematically replacing noisy values using\
  \ predetermined rules.\n3. *Feature Engineering*. Construct new interaction features guided by clinical\
  \ insights.\n4. *Missing Value Imputation*. Fill in missing values using imputation strategies and machine\
  \ learning. For each column:\n    1. Determine the type of column as real, ordinal, or categorical\n\
  \    2. Using 5-Fold Cross-Validation:\n        * Apply K-Nearest Neighbor Imputer. Perform grid-search\
  \ for optimal `K`.\n        * Apply Random Forest Imputer. Perform grid-search for optimal `max_depth`\
  \ and `n_trees`\n        * Compare the KNN and RF imputers using accuracy, F1, and other metrics.\n\
  \    5. Perform use multiple imputation using the more accurate imputation strategy\n5. *Visualize Dataset*.\
  \ Generate a figure highlighting the changed cell values in the dataset.\n6. *Dataset Generation*. Generate\
  \ subsets of the original dataset using specific subsets of columns.\n\n### ML Training-Evaluation Module\n\
  1. *Dataset Loading*. Load the dataset from the preprocessed folder.\n2. *Dataset Splitting*. Split\
  \ the dataset into training and testing sets using stratified sampling of target variable.\n3. *Model\
  \ Training*. Train a model using the training set, and evaluate the model using the validation set.\
  \ Uses K-Fold cross-validation.\n4. *Model Evaluation*. Evaluate the model using AUC, F1, Accuracy,\
  \ and other metrics.\n5. *Metrics Visualization*. Generate a figure highlighting the performance of\
  \ the models.\n6. *Feature Importance*. Generate a feature importance plot for the model to determine\
  \ which features are most important.\n7. *Feature Selection*. Select features using a variety of methods,\
  \ with the help of clinical insights.\n8. *Model Selection*. Select the best model using a variety of\
  \ methods, including using the visualizations generated in previous steps.\n9. *Model Prediction*. Predict\
  \ the probability of a patient requiring post-mastectomy radiotherapy using the best model.\n\n\n##\
  \ Results\n---\n### Figures\n\n#### AUC Performance Metrics\n![AUC Performance Metrics](README_figures/AUC_full_axis.png)\n\
  \n\n#### Feature Importance and Feature Selection\n![Feature Selection Plot](README_figures/7_PRE-1.0spars-expert-imputed86cols_top_features_metrics.png)\n\

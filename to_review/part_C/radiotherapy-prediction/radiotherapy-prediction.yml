  \         |\n\n\n## Miscellaneous Notes\n\n\n### Feature Engineering Using A Sentinel LN Nomogram\n\
  An additional feaature was created during the feature engineering step by using a peer-reviewed nomogram\
  \ for predicting the probability of sentinel lymph node metastasis. The nomogram is available as a [browser-based\
  \ calculator](https://nomograms.mskcc.org/Breast/BreastSLNodeMetastasisPage.aspx). Their publication\
  \ can be found on PubMed at [this link](https://pubmed.ncbi.nlm.nih.gov/17664461/).\n\nWe used a custom\
  \ Python script to query the online webform autonomously, to avoid manually entering the values for\
  \ hundreds of patients, which is both error-prone and time-consuming. Below is a demo screenshot of\
  \ the script in action (based on fake demo data):\n\n![Sentinel LN Nomogram](README_figures/nomogram_script.gif)\n\
  \n"

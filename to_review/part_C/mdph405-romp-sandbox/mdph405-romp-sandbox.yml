readme_excerpt: "# MDPH405-ROMP-Sandbox\n\nInteractive Python sandbox for MDPH405 Radiation Oncology Medical\
  \ Physics. Students can play with voxel models, dose calculations (convolution/superposition, Monte\
  \ Carlo, etc.), inverse planning, optimization, and interactive GUIs/sliders to explore compounded concepts\
  \ in radiation therapy.\n\n### Philosophy of this Sandbox\n\nThis repository is **deliberately not**\
  \ a full treatment planning system.  \nThe goal is the opposite of clinical black-box systems like RayStation,\
  \ Monaco, MOSAIQ or ARIA — which take years to master and still surprise you regularly.\n\nInstead,\
  \ we want students to **get under the hood** and freely experiment with individual concepts as they\
  \ appear in lectures: voxel grids, simple dose deposition, convolution/superposition, basic Monte Carlo\
  \ steps, cost functions, inverse planning, etc.\n\nSmall, transparent, modular pieces you can poke,\
  \ break, and modify.\n\n### Recommended Lightweight Open-Source Tools\n\nThese are modular, Python-first\
  \ projects that let you explore individual concepts without the complexity of full clinical systems.\n\
  \n| Tool          | Language | Description & Strengths                                      | GitHub\
  \ / Link |\n|---------------|----------|-------------------------------------------------------------|---------------|\n\
  | **PortPy**    | Python   | Excellent for beamlet math, cost functions, inverse planning and optimisation\
  \ playgrounds. Very educational. | [PortPy-Project/PortPy](https://github.com/PortPy-Project/PortPy)\
  \ |\n| **PyMedPhys** | Python   | Great utility library — DICOM handling, data conversion, QA tools,\
  \ and building blocks. The perfect \"glue\" library. | [pymedphys/pymedphys](https://github.com/pymedphys/pymedphys)\
  \ |\n| **OpenTPS**   | Python   | Modular treatment planning system with good Monte Carlo support. You\
  \ can use just the parts you need. | [OpenTPS on GitLab](https://gitlab.com/openmcsquare/opentps) |\n"

readme_excerpt: "# Brain Tumor Segmentation using AGResU-Net\n\n## Overview\nBrain tumor segmentation\
  \ is a critical step in medical image analysis, enabling accurate diagnosis, treatment planning, and\
  \ disease monitoring. Manual segmentation is time-consuming. This motivates the use of deep learning\
  \ approaches.\n\nIn this project, we propose an **ensemble learning strategy built on AGResU-Net architectures**\
  \ to enhance segmentation performance by combining predictions from multiple models.\n\n## Paper\n*Attention\
  \ Gate ResU-Net for Automatic MRI Brain Tumor Segmentation*\n## Dataset\n**BraTS 2019**: We uploaded\
  \ a subset as two files HGG and LGG to the Kaggle dataset.\n\n* original dataset: **335 patients** (259\
  \ HGG + 76 LGG)\n* Subset used: **160 patients** (128 HGG + 32 LGG), preserving the 80/20 ratio\n\n\
  ## Models Used\n- U-Net\n- ResU-Net\n- AGU-Net\n- AGResU-Net\n\n## Enhancements\n- Ensemble Learning\n\
  - Test-Time Augmentation\n\n## Results\n* Paper Results\n\n| Model       | DSC-Whole | DSC-Core | DSC-Enh\
  \ | HD95-W | HD95-C | HD95-E |\n| ----------- | --------: | -------: | ------: | -----: | -----: | -----:\
  \ |\n| U-Net†      |     0.864 |    0.746 |   0.696 |      - |      - |      - |\n| ResU-Net†   |  \
  \   0.867 |    0.760 |   0.704 |      - |      - |      - |\n| AGU-Net†    |     0.870 |    0.760 |\
  \   0.700 |      - |      - |      - |\n| AGResU-Net† |     0.870 |    0.777 |   0.709 |      - |  \
  \    - |      - |\n\n* Our Results\n\n| Model            | DSC-Whole | DSC-Core | DSC-Enh | HD95-W |\
  \ HD95-C | HD95-E |\n| ---------------- | --------: | -------: | ------: | -----: | -----: | -----:\
  \ |\n| U-Net            |     0.701 |    0.712 |   0.768 |   9.23 |   5.42 |   3.14 |\n| ResU-Net  \
  \       |     0.694 |    0.700 |   0.781 |   8.37 |   6.05 |   3.43 |\n| AGU-Net          |     0.711\
  \ |    0.702 |   0.783 |   9.98 |   6.51 |   3.10 |\n| AGResU-Net       |     0.721 |    0.694 |   0.770\
  \ |  10.60 |   5.68 |   3.50 |\n| AGU-Net + TTA    |     0.713 |    0.718 |   0.795 |   9.88 |   5.47\
  \ |   3.45 |\n| AGResU-Net + TTA |     0.726 |    0.716 |   0.793 |  10.03 |   5.38 |   3.39 |\n| Ensemble\
  \ (TTA)   |     0.724 |    0.717 |   0.800 |   8.61 |   5.19 |   3.41 |\n\n\n\n## Key Findings\n* The\
  \ table below shows the DSC improvement from the best individual base model to the esemble (TTA): \n\
  \n| Tumor Region     | Best Base Model (DSC) | Ensemble (TTA) DSC |   Gain |\n| ---------------- | --------------------:\
  \ | -----------------: | -----: |\n| Whole Tumour     |    0.721 (AGResU-Net) |              0.724 |\
  \ +0.003 |\n| Core Tumour      |         0.712 (U-Net) |              0.717 | +0.005 |\n| Enhancing\
  \ Tumour |       0.783 (AGU-Net) |              0.800 | +0.017 |\n\nThe enhancing tumour region saw\
  \ the most meaningful gain (+0.017 DSC). This is \nsignificant as enhancing tumour is the most important\
  \ region for treatment planning. \nWhole and core tumour gains were smaller but consistent. \nFor the\
  \ HD95 case, it measures the 95th percentile surface distance between prediction \nand ground truth.\
  \ The ensemble improved HD95 on the core tumour region (5.42 → 5.19) \nbut unfortunately showed marginal\
  \ degradation on whole and enhancing tumour \ncompared to the single best individual model. This is\
  \ expected behaviour where \nensemble averaging softens sharp boundaries slightly, which can increase\
  \ the maximum \nsurface distance on some samples even while improving the overall DSC. \n\n"

readme_excerpt: "# Esapi_ComplexityIMRT\n**Overview**\nThis project computes various complexity metrics\
  \ for treatment plans.\n\n**Customization Requirements**\n\nMachine Gantry Speed: Customize the machine\
  \ gantry speed in BeamControlPoints.cs.\n\nSave Folder Location: Customize the save folder location\
  \ in Main.cs.\n\n**File Descriptions**\n\nComplexityMetrics.cs: \n\n\tContains the computation methods\
  \ for different complexity metrics.\n\nMain.cs:\n\n\tCalls the complexity metrics.\n\t\n\tDisplays the\
  \ computed values in Eclipse.\n\t\n\tSaves the results to a CSV file.\n"

readme_excerpt: '# CBCT-Pose


  This repository is for the paper -- CBCT-Pose: Few-Shot Viewpoint-Conditioned Diffusion for Sparse-View
  CBCT Reconstruction


  The code is built on [EDSR (PyTorch)](https://github.com/thstkdgus35/EDSR-PyTorch) and tested on Ubuntu
  18.04 environment (Python3.6, PyTorch_1.1) with NVIDIA RTX 6000 GPUs.


  We will upload ckpts after the paper accepted.



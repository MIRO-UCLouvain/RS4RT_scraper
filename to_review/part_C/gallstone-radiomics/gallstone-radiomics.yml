readme_excerpt: "# Gallstone Radiomics Three-Class Composition Model\r\n\r\nThis repository contains the\
  \ code, trained model, summary tables, and publication-ready\r\nfigure assets for CT radiomics-based\
  \ three-class classification of gallbladder stone\r\ncomposition.\r\n\r\n## Target classes\r\n\r\n-\
  \ Cholesterol stone\r\n- Mixed stone\r\n- Pigment stone\r\n\r\n## Repository contents\r\n\r\n```text\r\
  \nsrc/\r\n  train_final_extra_trees_model.py\r\n  predict_from_radiomics_csv.py\r\n  radiomics/extract_validation_radiomics_107.py\r\
  \n  analysis/\r\nmodels/\r\n  final_extra_trees_threeclass_model.joblib\r\n  feature_names.txt\r\n \
  \ model_manifest.json\r\ndata/\r\n  example_feature_table_template.csv\r\nfigures/\r\n  Final figure\
  \ files and panel files\r\ntables/\r\n  Prediction tables and summary tables\r\ndocs/\r\n  Upload instructions\
  \ and manuscript availability text\r\n```\r\n\r\n## Quick start\r\n\r\n```bash\r\npython -m venv .venv\r\
  \nsource .venv/bin/activate  # Windows: .venv\\Scripts\\activate\r\npip install -r requirements.txt\r\
  \npython src/predict_from_radiomics_csv.py \\\r\n  --input data/example_feature_table_template.csv \\\
  \r\n  --model models/final_extra_trees_threeclass_model.joblib \\\r\n  --output predictions.csv\r\n\
  ```\r\n\r\n## Input format\r\n\r\nThe inference script expects one input row per segmented stone sample\
  \ and requires the\r\nselected radiomics feature columns listed in `models/feature_names.txt`. The script\r\
  \nreturns one set of class probabilities and one predicted class per input row.\r\n\r\n## Reproducibility\
  \ scope\r\n\r\nThis package includes the trained Extra Trees model, the selected feature list,\r\nfigure-generation\
  \ scripts, and the summary tables used to regenerate the main public\r\nmodeling figures. Raw CT images,\
  \ ROI masks, and private patient-level spreadsheets are\r\nnot included.\r\n\r\n## License\r\n\r\nCode\
  \ is released under the MIT License unless otherwise stated. The trained model is\r\nprovided for non-commercial\
  \ research evaluation only and must not be used as the sole\r\nbasis for clinical decision-making.\r\
  \n"

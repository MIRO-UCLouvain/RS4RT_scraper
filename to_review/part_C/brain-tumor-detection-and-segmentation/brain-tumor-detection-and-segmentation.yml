readme_excerpt: '# 🧠 Brain Tumor Detection and Segmentation using Deep Learning


  ## 📌 Project Overview


  This project implements an AI-based healthcare system for automatic brain tumor detection and localization
  from MRI images.


  The solution consists of two stages:


  - Brain Tumor Classification using ResNet50 Transfer Learning

  - Brain Tumor Segmentation using ResUNet


  The classifier first predicts whether a tumor is present. If a tumor is detected, the segmentation model
  identifies the exact tumor region.


  ---


  ## Problem Statement


  Manual examination of MRI scans is time-consuming and depends on expert radiologists.


  This project automates the detection and segmentation process using Deep Learning, enabling faster and
  more consistent analysis.


  ---


  ## Features


  ✔ Brain Tumor Classification


  ✔ Tumor Segmentation


  ✔ Transfer Learning with ResNet50


  ✔ Custom ResUNet Architecture


  ✔ MRI Image Visualization


  ✔ Confusion Matrix


  ✔ Prediction Pipeline


  ✔ TensorFlow & Keras Implementation


  ---


  ## Dataset


  Brain MRI Dataset


  Contains


  - MRI Images

  - Segmentation Masks

  - Tumor / No Tumor Labels


  Dataset is not included due to size limitations.


  ---


  ## Technologies Used


  - Python

  - TensorFlow

  - Keras

  - OpenCV

  - NumPy

  - Pandas

  - Matplotlib

  - Seaborn

  - Scikit-Learn

  - Plotly


  ---


  ## Deep Learning Models


  ### Classification


  - ResNet50 (Transfer Learning)


  ### Segmentation


  - ResUNet


  ---


  ## Workflow


  MRI Image


  ↓


  Image Preprocessing


  ↓


  ResNet50 Classifier


  ↓


  Tumor Detected?


  ↓


  Yes


  ↓


  ResUNet Segmentation


  ↓


  Tumor Mask Prediction


  ---


  ## Results


  The model successfully


  - Detects brain tumors

  - Segments tumor regions

  - Visualizes predicted masks

  - Generates confusion matrix

  - Produces accurate localization



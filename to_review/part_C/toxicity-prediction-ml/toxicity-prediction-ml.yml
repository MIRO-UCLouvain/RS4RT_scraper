readme_excerpt: "# Toxicity_prediction_ml\nMl_based computational toxicity prediction system built using\
  \ python and scikit_learn\n# \U0001F9EA Computational Toxicity Prediction System\n\n## Project Overview\n\
  Machine learning project to predict chemical compound \ntoxicity using Random Forest classification,\
  \ inspired \nby real research work at CSIR-IITR.\n\n## Dataset\n- 500 chemical compounds\n- 5 molecular\
  \ features per compound\n- Target: Toxicity classification (Toxic/Non-Toxic)\n\n## Tech Stack\n- Python\n\
  - Pandas & NumPy\n- Scikit-learn (Random Forest)\n- Matplotlib & Seaborn\n\n## Project Pipeline\n1.\
  \ Data Generation & Loading\n2. Exploratory Data Analysis\n3. Data Cleaning & Preprocessing\n4. Model\
  \ Training & Evaluation\n5. Feature Importance Analysis\n6. Correlation Heatmap\n\n## Key Outputs\n\
  - Toxicity distribution chart\n- Feature importance ranking\n- Correlation heatmap\n- Model evaluation\
  \ report\n\n## Skills Demonstrated\n- End-to-end ML pipeline\n- Data preprocessing\n- Classification\
  \ modeling\n- Data visualization\n- Research domain knowledge\n\n## Author\nRounak Mishra | Data Analyst\n\
  mishrarounak98@gmail.com \n"

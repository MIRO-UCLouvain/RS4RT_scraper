readme_excerpt: '![GitHub Social Card](./lyprox/static/github-social-card.png)


  ## What is LyProX?


  It is a [Django] web app that displays the detailed patterns of lymphatic metastases in head & neck
  cancer and allows one to explore the underlying dataset(s) in much detail. It is hosted under the URL
  <https://lyprox.org>.


  [Django]: https://www.djangoproject.com/


  ## Motivation


  HNSCC spreads though the lymphatic system of the neck and forms metastases in regional lymph nodes.
  Macroscopic metastases can be detected with imaging modalities like MRI, PET and CT scans. They are
  then consequently included in the target volume, when radiotherapy is chosen as part of the treatment.
  However, microscopic metastases are too small be diagnosed with current imaging techniques.


  To account for this microscopic involvement, parts of the lymphatic system are often irradiated electively
  to increase tumor control. Which parts are included in this elective clinical target volume is currently
  decided based on guidelines [^1] [^2] [^3] [^4]. These in turn are derived from reports of the prevalence
  of involvement per lymph node level (LNL), i.e. the portion of patients that were diagnosed with metastases
  in any given LNL, stratified by primary tumor location. It is recommended to include a LNL in the elective
  target volume if 10 - 15% of patients showed involvement in that particular level.


  However, while the prevalence of involvement has been reported in the literature [^5] [^6], and the
  general lymph drainage pathways are understood well, the detailed progression patterns of HNSCC remain
  poorly quantified. We believe that the risk for microscopic involvement in an LNL depends highly on
  the specific diagnose of a particular patient and their treatment can hence be personalized if the progression
  patterns were better quantified.


  ## Our Goal


  With the interface we primarily aim to make our extracted dataset easily accessible. By visualizing
  it interactively, one can very quickly test or come up with hypothesis regarding the lymphatic spread
  of HNSCC. Hopefully, this in turn motivates other researchers to investigate these hypotheses, extract
  and share more data in similar detail.


  This, in turn would enable us (or anyone, really) to build more accurate and precise tumor progression
  models. E.g. like previous work on using Bayesian networks to predict the personalized probability of
  involvement [^7] or our recent publication on this issue using hidden Markov models and thereby introducing
  an explicit way of modelling time [^8].


  ## Datasets of Lymphatic Progression Patterns


  The data that is visualized in this interface lives in an open-source repository on its own: [lyDATA].


  We have also published a paper on the dataset and the interface in *Radiotherapy & Oncology* [^9], with
  a preprint being available on *medRxiv* [^10].


  [lyDATA]: https://github.com/lycosystem/lydata


  ## Probabilistic Models for Personalized CTV Definition


  We also work on probabilistic models [^7] [^8] that may predict the lymphatic spread of head & neck
  cancer. The underlying code is hosted in another repository: [lymph].


  [lymph]: https://github.com/lycosystem/lymph


  ## How to contribute


  There are two ways you can contribute to this project:


  1. If you are a clinical researcher in the field and would like to share your data with us, please get
  in touch with us via email: [roman.ludwig@usz.ch].

  2. The other way is by contributing to this repository, e.g. if you are a software developer. I guess
  this is somewhat unlikely, due to the very specific scope of this Django app, but we still welcome any
  contribution. In this case, a [detailed documentation] of the source code can be consulted.


  [roman.ludwig@usz.ch]: mailto:roman.ludwig@usz.ch

  [detailed documentation]: https://lycosystem.github.io/lyprox



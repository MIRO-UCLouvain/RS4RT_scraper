readme_excerpt: "Welcome to the QALMA github repository. QALMA stands for Quality Assurance for Linac\
  \ with Matlab. It is a Matlab based toolkit with GUI for quantitative analysis of Quality Assurance\
  \ tests for Medical Linear Accelerators in Radiation Therapy. It is developed at Florida Atlantic University\
  \ by Mushfiqur Rahman under supervision of Dr. Georgios Kalantzis. Currently, version 1.0 is available\
  \ for download which performs QA tests such as: \n\n* Star Shot\n* Picket Fence\n* Winston-Lutz \n*\
  \ Log File Analysis \n* Light-radiation field coincidence. \n\nSample images and files are available\
  \ in the ‘Sample’ folder. For detail documantation Please see the manual ('qalma_manual.pdf') or visit\
  \ https://github.com/mrmushfiq/qalma/wiki. \n<br/>To check the comparison with commercial software please\
  \ visit https://github.com/mrmushfiq/qalma/blob/master/qalma_manual.pdf. \n<br/>Publication: https://www.sciencedirect.com/science/article/pii/S2352711018300311\n\
  \n\n\n\n<br/>Disclaimer: QALMA was developed for research purpose. We are not responsible for clinical\
  \ application. \n"

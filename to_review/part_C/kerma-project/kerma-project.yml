readme_excerpt: "# KERMA Demo-Project\n\nKERMA-Demo is a Django-based web application designed for analyzing\
  \ radiation therapy data, specifically focused on processing DICOM files and Dynalog machine log files.\
  \ The application provides a user-friendly interface to visualize and analyze radiation treatment planning\
  \ and delivery data.\n\n## Overview\n\nThe KERMA-Demo Project provides tools for:\n\n- **DICOM Analysis**:\
  \ Processing RTSTRUCT and RTDOSE files to extract radiation therapy structure information and dose distributions\n\
  - **Dynalog Analysis**: Analyzing machine log files to compare actual vs. planned radiation delivery\
  \ through fluence map calculations\n- **Web Interface**: A Django-powered web application for easy data\
  \ visualization and analysis\n- **Statistical Analysis**: Comprehensive error analysis and quality assurance\
  \ metrics for radiation therapy delivery\n\n## Features\n\n### DICOM Processing\n- Extract structure\
  \ names from RTSTRUCT files\n- Calculate maximum dose values from RTDOSE files\n- Support for standard\
  \ DICOM RT objects used in radiation therapy\n\n### Dynalog Analysis\n- Process Varian dynalog files\
  \ (.dlg format)\n- Calculate actual vs. expected fluence maps\n- Statistical analysis including:\n \
  \ - Total fluence comparison\n  - Mean fluence values\n  - Error calculations (absolute and percentage)\n\
  \  - Quality assurance metrics\n\n### Web Interface\n- Clean, responsive web interface\n- Dark/light\
  \ theme support\n- Real-time data visualization\n- Navigation between different analysis sections\n\n\
  ## Installation\n\n### Prerequisites\n\n- Python 3.8 or higher\n- pip (Python package installer)\n\n\
  ### Required Dependencies\n\nInstall the required Python packages:\n\n```bash\npip install -r requirements.txt\n\
  ```\n\nOr install manually:\n```bash\npip install django numpy pydicom dicompylercore pylinac\n```\n\
  \n### Full Installation\n\n1. Clone the repository:\n```bash\ngit clone https://github.com/gmartincor/KERMA-Project.git\n\
  cd KERMA-Project\n```\n\n2. Install dependencies:\n```bash\npip install -r requirements.txt\n```\n\n\
  3. Set up the Django application:\n```bash\ncd kerma_site\npython manage.py migrate\n```\n\n4. Run the\
  \ development server:\n```bash\npython manage.py runserver\n```\n\n5. Access the application at `http://localhost:8000`\n\
  \n## Usage\n\n### Web Application\n\n1. **Home Page**: Navigate to the main page to access different\
  \ analysis sections\n2. **DICOM Results**: View processed DICOM files showing:\n   - RTSTRUCT files\
  \ with extracted structure names\n   - RTDOSE files with maximum dose values\n3. **Dynalog Results**:\
  \ View dynalog analysis showing:\n   - Processed dynalog file pairs (A and B files)\n   - Fluence calculations\
  \ and statistical analysis\n   - Error metrics and quality assurance data\n\n### Command Line Scripts\n\
  \n#### DICOM Inspection\n```bash\ncd scripts\npython inspection_dicom.py\n```\n\n#### Dynalog Processing\n\
  ```bash\ncd scripts\npython parse_dynalog_pylinac.py\n```\n\n## Project Structure\n\n```\nKERMA-Project/\n\
  ├── data/                          # Data directory\n│   ├── dicom/datasets_dicom/      # DICOM files\
  \ storage\n│   └── dynalogs/datasets_dynalogs/ # Dynalog files storage\n├── kerma_site/            \
  \        # Django web application\n│   ├── kerma_app/                 # Main Django app\n│   │   ├──\
  \ static/                # CSS, JS, and static files\n│   │   ├── templates/             # HTML templates\n\
  │   │   ├── views.py               # Django views\n│   │   ├── urls.py                # URL routing\n\
  │   │   └── tests.py               # Django tests\n│   ├── kerma_site/                # Django project\
  \ settings\n│   └── manage.py                  # Django management script\n├── scripts/            \
  \           # Analysis scripts\n│   ├── parse_dicom.py            # DICOM processing functions\n│  \
  \ ├── parse_dynalog_pylinac.py  # Dynalog processing functions\n│   └── inspection_dicom.py       #\
  \ DICOM inspection utility\n├── tests/                         # Unit tests\n│   ├── test_dicom.py \
  \            # DICOM processing tests\n│   └── test_dynalog.py           # Dynalog processing tests\n\
  ├── requirements.txt               # Python dependencies\n├── .gitignore                     # Git ignore\
  \ file\n└── README.md                      # Project documentation\n```\n\n## Data Formats\n\n### DICOM\
  \ Files\n- **RTSTRUCT**: Radiation therapy structure files containing organ and target contours\n- **RTDOSE**:\
  \ Radiation therapy dose distribution files\n\n### Dynalog Files\n- **.dlg files**: Varian linear accelerator\
  \ log files\n- **File pairs**: Requires both A and B files for complete analysis\n- **Format**: Binary\
  \ files containing machine delivery data\n\n## Development\n\n### Setting up Development Environment\n\
  \n1. Create a virtual environment:\n```bash\npython -m venv venv\nsource venv/bin/activate  # On Windows:\
  \ venv\\Scripts\\activate\n```\n\n2. Install development dependencies:\n```bash\npip install -r requirements.txt\n\
  ```\n\n3. Run tests:\n```bash\n# Run Django tests\ncd kerma_site\npython manage.py test\n\n# Run unit\
  \ tests\ncd ..\npython -m unittest discover tests/\n```\n\n### Key Components\n\n#### Django Views (`kerma_site/kerma_app/views.py`)\n\
  - `home()`: Main page view\n- `show_dicom_results()`: Processes and displays DICOM analysis\n- `show_dynalog_results()`:\
  \ Processes and displays dynalog analysis\n\n#### Analysis Scripts\n- `parse_dicom.py`: Core DICOM processing\
  \ functions\n  - `get_structure_names()`: Extract structure names from RTSTRUCT\n  - `get_max_dose()`:\
  \ Calculate maximum dose from RTDOSE\n- `parse_dynalog_pylinac.py`: Core dynalog processing functions\n\
  \  - `accumulate_fluence()`: Process dynalog files and calculate fluence maps\n\n### Testing\n\nThe\
  \ project includes comprehensive unit tests:\n\n```bash\n# Run specific test modules\npython -m unittest\
  \ tests.test_dicom\npython -m unittest tests.test_dynalog\n\n# Run all tests\npython -m unittest discover\
  \ tests/\n```\n\n## Dependencies\n\n### Core Dependencies\n- **Django**: Web framework for the user\
  \ interface\n- **NumPy**: Numerical computing for data analysis\n- **pydicom**: DICOM file reading and\
  \ processing\n- **dicompylercore**: Advanced DICOM RT analysis\n- **pylinac**: Medical linear accelerator\
  \ analysis\n\n### Development Dependencies\n- **unittest**: Python's built-in testing framework\n\n\
  ## Contributing\n\n1. Fork the repository\n2. Create a feature branch (`git checkout -b feature/your-feature`)\n\
  3. Make your changes\n4. Add tests for new functionality\n5. Run the test suite to ensure everything\
  \ works\n6. Commit your changes (`git commit -am 'Add some feature'`)\n7. Push to the branch (`git push\
  \ origin feature/your-feature`)\n8. Create a Pull Request\n\n## License\n\nThis project is open source.\
  \ Please check the repository for license details.\n\n## Medical Disclaimer\n\nThis software is intended\
  \ for research and educational purposes. It should not be used for clinical decision-making without\
  \ proper validation and regulatory approval. Always consult with qualified medical physicists and follow\
  \ institutional protocols for radiation therapy quality assurance.\n\n## Support\n\nFor questions, issues,\
  \ or contributions, please use the GitHub issues tracker or contact the project maintainers.\n"

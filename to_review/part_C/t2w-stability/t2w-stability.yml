readme_excerpt: "# Exploring the Impact of T2-weighted MRI Fat-Saturation on Radiomics Stability for Brain\
  \ Radionecrosis Prediction after Skull-Base Proton Therapy: A Pilot Study\n\nOriginal repository supporting\
  \ the article submitted to Cancers [MDPI] (@Citation TBA)\n\n### **Repository structure**\n#### **Overview:**\n\
  \n* Automated skullstripping (brain extraction) and tissue segmentation methods\n* Rigid registration\
  \ of segmentation using SimpleITK\n* Radiomics Feature Extraction using Pyradiomics\n* Image-level Processing\
  \ Methods: N4 BFC, Normalization\n* Feature-level Processing Method: Combat\n* Optimal Processing Config\
  \ Analysis\n* Stability analysis\n* BRN Prediction Analysis\n* Statistical Analysis\n* Visualizations\n\
  * Jupyter notebooks\n* Python Scripts\n\n#### **Contents:**\n```\nt2w_stability\n├── src/          \
  \                         \n│    └── data_curation/                                         # Contains\
  \ files associated with the data curation for the stability study\n|          └── mask_curation.ipynb\
  \                              # Generating T2w-nfs masks, rigid-registration of T2w-nfs to T2w-fs images\n\
  |          └── tissue_segmentation_methods.ipynb                # All automatic brain, tissue segmentation\
  \ methods explored;\n|          └── gui.py, registration_gui.py                      # Utility files\n\
  │    └── paramSetting/\n|          └── StudySettings3D.yaml                             # Radiomics\
  \ feature extraction settings for both stability study and BRN prediction modelling\n│    └── stability_analysis/\n\
  |          └── feature_extraction3D.ipynb                       # Radiomics feature extraction from\
  \ tissues\n|          └── stability_analysis.ipynb                         # Stability quantification\
  \ using CCC\n|          └── config_analysis.py                               # Exploring 40 processing\
  \ configurations, Uncertainty using Statistical Analysis\n|          └── utils.py, gui.py, registration_gui.py\
  \            # Utility files\n│    └── brn_prediction/\n|          └── data_prep.py                \
  \                     # Data preparation for BRN predictive modeling\n|          └── mask_gen.py   \
  \                                   # Tissue mask generation independently for T2w-nfs and T2w-fs\n\
  |          └── feature_gen.py                                   # Radiomics feature extraction from\
  \ gwm tissue\n|          └── analysis.py                                      # 5-times repeated 5-fold\
  \ cross-validation\n|          └── utils.py                                         # Utilities\n├──\
  \ LICENCE                                                     # GNU General Public License v3.0\n├──\
  \ README.md\n\n```\n"

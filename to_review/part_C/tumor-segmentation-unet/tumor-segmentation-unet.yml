readme_excerpt: "Brain Tumor Segmentation using 3D U-Net\n\nA modern web application for AI-assisted brain\
  \ tumor segmentation from multi-modal MRI scans using a 3D U-Net model trained on the BraTS 2021 dataset.\
  \ The application provides an intuitive interface for uploading MRI scans, visualizing segmentation\
  \ outputs across multiple MRI modalities, analyzing tumor regions, and downloading clinical-style reports.\n\
  \nNote: This project is intended for research and educational purposes only and is not approved for\
  \ clinical diagnosis.\n\n\nFeatures\n\n* Multi-modal MRI upload (FLAIR, T1, T1CE, T2)\n* AI-powered\
  \ brain tumor segmentation\n* Visualization of:\n    * FLAIR MRI\n    * T1 MRI\n    * T1CE MRI\n   \
  \ * T2 MRI\n    * Segmentation Mask\n    * Overlay Image\n* Tumor voxel statistics\n* Prediction confidence\
  \ visualization\n* Clinical-style summary\n* Download segmentation mask\n* Export inference results\
  \ as JSON\n* Clean, responsive dark-themed interface\n\n\nDemo\n\nLive Demo: (Add your Vercel URL here)\n\
  \nHugging Face Model: https://huggingface.co/spaces/adityaAnand0/brain-tumor-demo\n\n\nTech Stack\n\n\
  Frontend\n\n* React\n* Vite\n* TypeScript\n* Tailwind CSS\n* TanStack Router\n* Lucide React\n\nAI Backend\n\
  \n* PyTorch\n* MONAI\n* Gradio\n* Hugging Face Spaces\n\nDataset\n\n* BraTS 2021 Dataset\n\nModel Information\n\
  \n* Architecture: 3D U-Net\n* Framework: MONAI\n* Dataset: BraTS 2021\n* Inference: Hugging Face Spaces\n\
  \nInput Requirements\n\nUpload the following MRI modalities for a single patient:\n\n* FLAIR\n* T1\n\
  * T1CE\n* T2\nSupported format:\n.nii.gz\nAuthor\n\nAditya Anand\n\nB.Tech Information Technology\n\
  Dr. B.R. Ambedkar National Institute of Technology (NIT Jalandhar)\n"

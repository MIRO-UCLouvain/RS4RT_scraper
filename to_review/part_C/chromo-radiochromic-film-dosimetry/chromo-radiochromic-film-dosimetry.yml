readme_excerpt: "# CHROMO: a software for a FAST AND ACCURATE Radiochromic Film DOSIMETRY\n\n**LICENSE**\n\
  \nShield: [![CC BY-NC-SA 4.0][cc-by-nc-sa-shield]][cc-by-nc-sa]\n\nThis work is licensed under a\n[Creative\
  \ Commons Attribution-NonCommercial-ShareAlike 4.0 International License][cc-by-nc-sa].\n\n[![CC BY-NC-SA\
  \ 4.0][cc-by-nc-sa-image]][cc-by-nc-sa]\n\n[cc-by-nc-sa]: http://creativecommons.org/licenses/by-nc-sa/4.0/\n\
  [cc-by-nc-sa-image]: https://licensebuttons.net/l/by-nc-sa/4.0/88x31.png\n[cc-by-nc-sa-shield]: https://img.shields.io/badge/License-CC%20BY--NC--SA%204.0-lightgrey.svg\n\
  **WARNING: NO WARRANTY, USE AT OWN RISK.**\n\nCHROMO is python based software used to measure radiochromic\
  \ film dose using an efficient **calibration** and **single scan recalibration** method [1]. The software\
  \ aligns with the latest dosimetry methodologies, in particular the American Association of Physicists\
  \ in Medicine (AAPM) 2020 Report [2].\n\nIf you use or reference this work in a publication or any other\
  \ medium, please cite it as follows:\n\nBagnalasta Matteo, CHROMO: a software for a FAST AND ACCURATE\
  \ Radiochromic Film DOSIMETRY, 2022, https://github.com/medphysmn/CHROMO.\"\n\n![dose_3ch_treatment_1_figure](https://user-images.githubusercontent.com/37676343/190628150-f0b8dfe2-b822-4ce6-9236-46927fa47b77.png)\n\
  ![dose_3ch_treatment_2_figure](https://user-images.githubusercontent.com/37676343/190628154-678fc275-1263-4095-b27c-98fac5691747.png)\n\
  ![dose-response_calibration_plot_red](https://user-images.githubusercontent.com/37676343/191227455-aba872ef-43cf-4fc7-ad5e-0ad860e37411.png)\n\
  ![dose-response_calibration_plot_green](https://user-images.githubusercontent.com/37676343/191227313-f72668c1-4ca2-4127-b2cd-e294b1c500bd.png)\n\
  ![dose-response_calibration_plot_3ch(1)](https://user-images.githubusercontent.com/37676343/191226861-a331e1ea-7804-404c-9c58-ba43f3944332.png)\n\
  ![dose-response_recalibrated_plot_treatment_2](https://user-images.githubusercontent.com/37676343/191227612-cddfd84e-67dc-4c22-9c22-806d8f53333f.png)\n\
  \n**IMPLEMENTED FEATURES**:\n\n- **MULTI-CHANNEL DOSIMETRY** of multiple scans at the same time [1]\
  \ [2] \n- **SINGLE-CHANNEL DOSIMETRY** of multiple scans at the same time [2]\n- **GRAFICAL USER INTERFACE**\n\
  - **DOSIMETRY WITH FAST INTRA SCAN RECALIBRATION METHOD** of multiple scans at the same time [1] [2]\n\
  - **FILM CALIBRATION WITH DIFFERENT FITTING FUNCTIONS** [2] \n- **SCAN DENOISING** with Median and Wiener\
  \ Filters [4] [5]\n- **RESULT DOSE IMAGES IN DIFFERENT FORMATS**\n- **PLOTS OF THE RESULTS**\n\n**TODO\
  \ FEATURES**\n- **CORRECTION OF LATERAL RESPONSE ARTIFACT** [3] **(TODO)**\n\nTested in a Linux environment.\n\
  **To ensure the program operates correctly, you may need to set permissions with sudo chmod 777 denoiser.py**\n\
  \ncontact: matteo.bagnalasta@gmail.com\n\n[1] Lewis D, Micke A, Yu X, Chan MF. An efficient protocol\
  \ for radiochromic film dosimetry combining calibration and measurement in a single scan. Med Phys.\
  \ 2012 Oct;39(10):6339-50. doi: 10.1118/1.4754797. PMID: 23039670; PMCID: PMC9381144.\n\n[2] Niroomand-Rad\
  \ A, Chiu-Tsao ST, Grams MP, Lewis DF, Soares CG, Van Battum LJ, Das IJ, Trichter S, Kissick MW, Massillon-Jl\
  \ G, Alvarez PE, Chan MF. Report of AAPM Task Group 235 Radiochromic Film Dosimetry: An Update to TG-55.\
  \ Med Phys. 2020 Dec;47(12):5986-6025. doi: 10.1002/mp.14497. Epub 2020 Oct 30. PMID: 32990328.\n\n\
  [3] Lewis D, Chan MF. Correcting lateral response artifacts from flatbed scanners for radiochromic film\
  \ dosimetry. Med Phys. 2015 Jan;42(1):416-29. doi: 10.1118/1.4903758. PMID: 25563282; PMCID: PMC5148133.\n\
  \n[4] Devic, Slobodan & Tomic, Nada & Soares, Célia & Podgorsak, Ervin. (2009). Optimizing the Dynamic\
  \ Range Extension of a Radiochromic Film Dosimetry System. Medical physics. 36. 429-37. 10.1118/1.3049597.\
  \ \n\n[5] Méndez, Ignasi & Rovira-Escutia, Juan & Casar, Bozidar. (2021). A protocol for accurate radiochromic\
  \ film dosimetry using Radiochromic.com. Radiology and Oncology. 55. 369-378. 10.2478/raon-2021-0034.\
  \ \n\n\n"

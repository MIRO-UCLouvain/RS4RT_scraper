readme_excerpt: "# Brain-tumor-segmentation\n## How to install\n\n1. Download the code: \n\n<img width=\"\
  918\" alt=\"Screenshot 2025-03-04 alle 15 29 57\" src=\"https://github.com/user-attachments/assets/a73ba8b3-4ff8-4a65-a255-f9ba58bf801f\"\
  \ />\n\n2. Unzip in a folder of your choice on your computer\n\n3. Open 3D Slicer\n4. Check if General\
  \ Registration (BRAINS) extension is installed (Modules -> Registration). If not, install it from the\
  \ extension manager\n5. Install \"swissskullstripping\" extension from the extension manager\n6. Restart\
  \ Slicer\n   \n7. Import module in 3D Slicer:\n\n   - Slicer -> Edit -> Application Settings -> Modules\
  \ -> Additional module paths\n   - Add path to the \"CustomInference\" folder\n  \n<img width=\"1454\"\
  \ alt=\"Screenshot 2025-03-05 alle 11 17 39\" src=\"https://github.com/user-attachments/assets/e25676f1-11f8-4eb2-84d0-fdeb5202aa0a\"\
  \ />\n\n   - Save changes\n   - Restart Slicer\n8. Import independent python modules\n\n   - Open Python\
  \ Console\n     \n<img width=\"409\" alt=\"Screenshot 2025-03-04 alle 15 39 54\" src=\"https://github.com/user-attachments/assets/d512d75c-e94b-48a7-94df-a2b32278bbd9\"\
  \ />\n\n   - Copy and paste the code below:\n     \n    \n    >>> import pip\n    >>> pip.main(['install',\
  \ 'numpy', 'torch', 'monai[nibabel]'])\n    \n    \n\n\n6. Download the trained model folder here: [Model](https://drive.google.com/drive/folders/1zyauzbkUiraO2vhI-AeAP7jT8DQyq1ET?usp=sharing)\n\
  \n\n\n"

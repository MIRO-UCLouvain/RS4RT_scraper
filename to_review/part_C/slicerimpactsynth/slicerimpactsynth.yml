readme_excerpt: "[![License](https://img.shields.io/badge/License-Apache%202.0-blue.svg)](https://github.com/vboussot/SlicerImpactSynth/blob/main/LICENSE)\r\
  \n[![Paper](https://img.shields.io/badge/\U0001F4CC%20Paper-KonfAI-blue)](https://arxiv.org/abs/2508.09823)\r\
  \n\r\n# \U0001F9E0 Slicer IMPACT-Synth  \r\n\r\n<img src=\"ImpactSynth.png\" alt=\"IMPACT Synth Logo\"\
  \ width=\"300\" align=\"right\">\r\n\r\n\r\n**Slicer IMPACT-Synth** is an open-source 3D Slicer extension\
  \ designed for the generation of **synthetic CT (sCT)** images from **MRI** or **CBCT**.  \r\nIt provides\
  \ a dedicated integration of the IMPACT-Synth framework within the 3D Slicer environment, making advanced\
  \ deep learning–based sCT generation as well as comprehensive quality-assurance (QA) tools accessible\
  \ for routine clinical practice and research workflows in radiotherapy.\r\n\r\nThe extension leverages\
  \ state-of-the-art models from the **SynthRAD 2025 Challenge [1]**, ranked *3rd* in both MRI→CT and\
  \ CBCT→CT tasks, and is powered by **KonfAI [3]**, a modular deep learning framework ensuring **fast\
  \ inference**, **reproducibility**, **flexible deployment** into clinical workflows.\r\n\r\nBeyond sCT\
  \ synthesis, the extension also enables anatomical segmentation on both the input images and the generated\
  \ sCTs, providing a unified environment for image synthesis, segmentation, and quality assurance within\
  \ radiotherapy workflows.\r\n\r\n---\r\n\r\n## \U0001F5BC️ Interface Overview\r\n\r\n| sCT synthesis\
  \ interface | Segmentation interface |\r\n|-------------------------|------------------------|\r\n|\
  \ <img src=\"docs/Synthesis.png\" alt=\"Synthesis interface\" width=\"100%\"> | <img src=\"docs/Segmentation.png\"\
  \ alt=\"Segmentation QA interface\" width=\"100%\"> |\r\n| *Figure 1 – sCT synthesis.* | *Figure 2 –\
  \ Anatomical segmentation.* |\r\n\r\n<p align=\"center\">\r\n  <img src=\"docs/Evaluation.png\" alt=\"\
  Evaluation interface\" width=\"45%\"><br>\r\n  <em>Figure 3 – Evaluation with reference.</em>\r\n</p>\r\
  \n\r\n## \U0001F3A5 Demonstration Video\r\n\r\nhttps://github.com/user-attachments/assets/dab67476-702e-4252-8680-b6fbf72e64e5\r\
  \n\r\n## ✅ What you can do in 3 minutes (step-by-step tutorial)\r\n\r\nThis quick tutorial demonstrates\
  \ the typical clinical workflow: **load → run inference → review results → assess reliability**.\r\n\
  \r\n### 1) Install and open the module\r\n1. Install **3D Slicer ≥ 5.10**\r\n2. Open **3D Slicer** and\
  \ go to **Extension Manager**\r\n3. Search for **ImpactSynth**\r\n4. Click **Install**\r\n5. Restart\
  \ Slicer and open the **ImpactSynth** module from the **Image synthesis** category\r\n\r\n### 2) Load\
  \ a case\r\n1. In Slicer, click **DICOM** (or drag-and-drop a NIfTI / NRRD / MHA file)\r\n2. Load a\
  \ volume (e.g., `volume.nii.gz`)\r\n3. Confirm the volume appears in the **Data** module and is visible\
  \ in the slice views\r\n\r\n### 3) Run inference\r\n1. On ImpactSynth module go to the **Synthesis**\
  \ and **Inference** tab\r\n2. Select:\r\n   - **Input volume**: `volume`\r\n   - **KonfAI App**: choose\
  \ an app (e.g., *Synthesis MR* or *Synthesis CBCT*)\r\n3. Click **Run**\r\n4. Wait for completion: Once\
  \ the process finishes, the generated synthetic CT is automatically overlaid with the input entry in\
  \ the slice views\r\n\r\n✅ You can now inspect the results in 2D and 3D and adjust visualization (opacity,\
  \ label colors, 3D rendering).\r\n\r\n### 4) QA with reference\r\nIf you have a CT registered with the\
  \ input image, you can further validate the generated sCT:\r\n\r\n1. Load the reference CT\r\n2. Go\
  \ to the **Synthesis** tab, then to the **Evaluation** tab\r\n3. Select:\r\n   - **Output volume** ->\
  \ the generated sCT\r\n   - **Reference volume** -> The CT\r\n   - Optional **ROI mask**\r\n4. Click\
  \ **Run**\r\n5. Review quantitative metrics and qualitative overlays inside Slicer:\r\n    - **MAE_map**:\
  \ voxel-wise Mean Absolute Error (MAE) map between the generated synthetic CT and the reference CT.\r\
  \n    - **Reference_seg** and **Output_seg**: anatomical segmentations of the reference CT and the generated\
  \ sCT, automatically computed using MRSegmentator.\r\n    - **Seg_MAE_map**: segmentation-based error\
  \ map, measuring intensity discrepancies between the two segmentations on a region-by-region basis.\r\
  \n    \r\n    **Reported metrics:**\r\n    - MAE\r\n    - PSNR\r\n    - SSIM\r\n    - Dice\r\n\r\n###\
  \ 5) QA without reference (uncertainty estimation)\r\nWhen no ground truth annotation is available,\
  \ you can still assess prediction reliability.\r\n\r\n1. Go to the **Synthesis** tab, then to the **Evaluation**\
  \ tab and select **No reference (Uncertainty)**\r\n2. Select the **inference stack volume** generated\
  \ during prediction\r\n3. Click **Run**\r\n4. Review the generated uncertainty outputs:\r\n    - **Uncertainty**:\
  \ voxel-wise variance map representing prediction uncertainty  \r\n    - **Conformity**: map showing\
  \ differences between segmentations from different generated sCTs  \r\n    - **Conformity_var**: variance\
  \ map computed between segmentations  \r\n\r\n    **Reported metrics:**\r\n    - **Uncertainty**: scalar\
  \ value corresponding to the mean variance across the generated sCTs  \r\n    - **Conformity**: scalar\
  \ value corresponding to the mean variance across segmentations derived from the generated sCTs  \r\n\
  \r\nUncertainty can be computed using:\r\n- test-time augmentation (TTA)\r\n- stochastic dropout\r\n\
  - multi-model ensembling  \r\n\r\nThese strategies are **configurable during the synthesis step** via\
  \ the **sampling settings**.\r\n\r\n## ⚙️ Features\r\n\r\n### \U0001F9E9 Deep Learning Inference\r\n\
  - sCT generation from MRI or CBCT volumes  \r\n- Supports **DICOM RT**, **NIfTI** (`.nii`, `.nii.gz`),\
  \ and **MHA** formats  \r\n- Automatic preprocessing and intensity normalization  \r\n\r\n### ⚕️ Quality\
  \ Assurance (QA)\r\n- Automatic segmentation of both input and generated volumes  \r\n- Quantitative\
  \ metrics: **Dice**, **HD95**, **MAE**, **PSNR**, **MS-SSIM**  \r\n- Synchronized **2D/3D visual inspection**\
  \ within Slicer  \r\n\r\n### \U0001F4C9 Uncertainty Quantification\r\n- Ensemble and test-time augmentation\
  \ (TTA) strategies  \r\n- Visualization of **aleatoric** and **epistemic** uncertainty maps  \r\n- Exportable\
  \ maps for **dose propagation [2]**  \r\n\r\n### \U0001F4A1 Integration-Ready\r\n- Direct connection\
  \ with **PACS** and DICOM RT import  \r\n- Automatic end-to-end pipeline execution  \r\n- Future compatibility\
  \ with **IMPACT-Reg** for **dose accumulation** workflows  \r\n\r\n---\r\n\r\n## \U0001F9E0 Segmentation\
  \ tab (domain adaptation)\r\n\r\nIn addition to the **Synthesis** tab, IMPACT-Synth provides a dedicated\
  \ **Segmentation** tab.\r\n\r\nThis tab offers a set of **KonfAI segmentation apps** specialized for\
  \ anatomical delineation, including:\r\n- **TotalSegmentator**\r\n- **MRSegmentator**\r\n\r\nYou can\
  \ run these segmentation models on:\r\n- the **input image** (MRI or CBCT)\r\n- the **generated synthetic\
  \ CT (sCT)**\r\n\r\nUsing the sCT as input enables **domain adaptation** for segmentation models that\
  \ are originally trained on CT data, improving anatomical consistency and robustness when working with\
  \ MRI or CBCT images.\r\n\r\nThis allows:\r\n- direct comparison of segmentations across modalities\
  \  \r\n- segmentation-based QA of the generated sCT  \r\n- improved downstream tasks such as dose calculation\
  \ and analysis\r\n\r\n---\r\n\r\n## \U0001F4CA Performance\r\n\r\n| Metric | Abdomen | Head & Neck |\
  \ Thorax | Mean |\r\n|:-------|:---------|:-------------|:--------|:------|\r\n| **MAE [HU]** | 49.7\
  \ | 52.0 | 44.0 | 48.6 |\r\n| **PSNR [dB]** | 32.1 | 31.9 | 31.4 | 31.8 |\r\n| **MS-SSIM** | 0.91 |\
  \ 0.96 | 0.95 | 0.94 |\r\n\r\n> Quantitative performance of IMPACT-Synth for CBCT→CT synthesis (SynthRAD2025\
  \ dataset).\r\n\r\n---\r\n\r\n## \U0001F4DA References\r\n\r\n1. Thummerer, A. *et al.*, **SynthRAD2025\
  \ Grand Challenge dataset: Generating synthetic CTs for radiotherapy from head to abdomen.** *Med. Phys.*,\
  \ 52(7), 2025.  \r\n2. Hémon, C. *et al.*, **Modeling dose uncertainty in cone-beam computed tomography:\
  \ Predictive approach for deep learning-based synthetic computed tomography generation.** *Phys. Imag.\
  \ Rad. Oncol.*, 33, 2025.  \r\n3. Boussot, V. & Dillenseger, J.-L., **KonfAI: A Modular and Fully Configurable\
  \ Framework for Deep Learning in Medical Imaging.** *arXiv:2508.09823*, 2025.  \r\n4. Boussot, V. *et\
  \ al.*, **Why Registration Quality Matters: Enhancing sCT Synthesis with IMPACT-Based Registration.**\
  \ *arXiv:2510.21358*, 2025.  \r\n5. Boussot, V. *et al.*, **IMPACT: A Generic Semantic Loss for Multimodal\
  \ Medical Image Registration.** *arXiv:2503.24121*, 2025.  \r\n\r\n---\r\n\r\n*Slicer IMPACT-Synth provides\
  \ an open, transparent, and extensible environment for synthetic CT generation and QA in adaptive radiotherapy\
  \ — bridging deep learning and clinical usability within 3D Slicer.*\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\
  \r\n\r\n\r\n\r\n\r\n\r\n"

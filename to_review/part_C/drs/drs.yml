readme_excerpt: "# Repository for the thesis 'Contributions to deep learning for imaging in radiotherapy.'\n\
  \nThis repository contains the source code used for the five papers included in the thesis. Additionally,\
  \ it also contains the code for the interactive figures available under www.mlsatellite.com/kappa.\n\
  \nThe repository is a snapshot of the status of the projects during the thesis defense. Do not expect\
  \ the repository to be maintained. You can find the repositories of the original papers which are better\
  \ maintained. For Papers 1-4, the code can be found under the following links:\n\n- https://github.com/attilasimko/mri-ac\n\
  - https://github.com/attilasimko/bfc\n- https://zenodo.org/records/4530894\n- https://github.com/attilasimko/contrast-sct\n\
  \n\nWhereas for Paper 5 the live document can be found under: \n\n- https://docs.google.com/spreadsheets/d/1ndMJ0RbcsByOfr6Cygo8-wxYmzWZFkzI2T34IH1EZW8"

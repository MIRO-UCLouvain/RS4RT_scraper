readme_excerpt: "# postcss-use-100dvh\n\n[PostCSS] plugin to replace 100vh with 100dvh.\n\n[PostCSS]:\
  \ https://github.com/postcss/postcss\n\n```css\n.min-h-screen {\n  min-height: 100vh;\n}\n```\n\n```css\n\
  @supports (-webkit-touch-callout: none) {\n  .min-h-screen {\n    min-height: 100dvh;\n  }\n}\n\n.min-h-screen\
  \ {\n  min-height: 100vh;\n}\n```\n\n## Usage\n\n**Step 1:** Install plugin:\n\n```sh\nnpm install --save-dev\
  \ postcss postcss-use-100dvh\n```\n\n**Step 2:** Check you project for existed PostCSS config: `postcss.config.js`\n\
  in the project root, `\"postcss\"` section in `package.json`\nor `postcss` in bundle config.\n\nIf you\
  \ do not use PostCSS, add it according to [official docs]\nand set this plugin in settings.\n\n**Step\
  \ 3:** Add the plugin to plugins list:\n\n```diff\nmodule.exports = {\n  plugins: [\n+   require('postcss-use-100dvh'),\n\
  \    require('autoprefixer')\n  ]\n}\n```\n\n[official docs]: https://github.com/postcss/postcss#usage\n"

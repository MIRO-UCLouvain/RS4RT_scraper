readme_excerpt: "# RadiomicsRetrieval: A Customizable Framework for Medical Image Retrieval Using Radiomics\
  \ Features\n\n:fire:  Official implementation of \"RadiomicsRetrieval: A Customizable Framework for\
  \ Medical Image Retrieval Using Radiomics Features\" (MICCAI 2025)\n\n[![arXiv](https://img.shields.io/badge/arXiv-2507.08546-red)](https://arxiv.org/pdf/2507.08546.pdf)\n\
  \n![model](images/model_architecture.jpg)\n\n## Datasets\n\nThis project utilizes publicly available\
  \ medical imaging datasets. You can download them from the following sources:\n\n### :lungs: Lung Tumor\
  \ CT\n- [NSCLC-Radiomics](https://www.cancerimagingarchive.net/collection/nsclc-radiomics/)\n- [NSCLC-Radiomics-Interobserver1](https://www.cancerimagingarchive.net/collection/nsclc-radiomics-interobserver1/)\n\
  - [RIDER-LungCT-Seg](https://www.cancerimagingarchive.net/collection/rider-lung-ct/)\n- [NSCLC Radiogenomics](https://www.cancerimagingarchive.net/collection/nsclc-radiogenomics/)\n\
  - [LUNG-PET-CT-Dx](https://www.cancerimagingarchive.net/collection/lung-pet-ct-dx/)\n  \n### :brain:\
  \ Brain Tumor MRI\n- [Adult Glioma (GLI)](https://www.synapse.org/Synapse:syn51156910/wiki/622351)\n\
  - [Meningioma (MEN)](https://www.synapse.org/Synapse:syn51156910/wiki/622353)\n\n\n## Usage\n\n### Installation\n\
  \nTo set up your development environment, follow the steps below:\n\n1. **Pull the Docker image:**\n\
  \n    We are using the `pytorch/pytorch:2.3.1-cuda12.1-cudnn8-devel` Docker image. You can pull it from\
  \ Docker Hub by running:\n\n    ```sh\n    docker pull pytorch/pytorch:2.3.1-cuda12.1-cudnn8-devel\n\
  \    ```\n\n2. **Run the Docker container:**\n\n    Start a container from the pulled image. You can\
  \ mount your project directory into the container for easy development:\n\n    ```sh\n    docker run\
  \ --shm-size=192gb --gpus=all -it -v /path/to/your/project/:/workspace --name radiomicsretrieval pytorch/pytorch:2.3.1-cuda12.1-cudnn8-devel\
  \ /bin/bash\n    ```\n\n    Replace `/path/to/your/project` with the actual path to your project directory.\n\
  \n3. **Set up the Python environment:**\n\n    Inside the container, clone this repository and install\
  \ the required dependencies:\n\n    ```sh\n    git clone https://github.com/nainye/RadiomicsRetrieval.git\
  \ && cd RadiomicsRetrieval\n    pip install -r requirements.txt\n    ```\n\n### Data Preprocessing\n\
  To preprocess the datasets, run the following notebooks:\n\n#### :lungs: Lung Tumor CT (NSCLC)\n  [source/preprocessing_NSCLC.ipynb](source/preprocessing_NSCLC.ipynb)\n\
  \n#### :brain: Brain Tumor MRI (BraTS)    \n  Preprocessing notebook is under construction and will\
  \ be uploaded soon.\n\n### Model Training\n\n#### Common Setup\n\nBefore training the model, please\
  \ download the SAM-Med3D checkpoint and place it as follows:\n\n  - \U0001F517 [Download `sam_med3d_turbo.pth`](https://huggingface.co/blueyo0/SAM-Med3D/blob/main/sam_med3d_turbo.pth)\n\
  \  - Save it to:\n     ```\n     ./source/sam_med3d_turbo.pth\n     ```\n#### :lungs: Lung Tumor CT\
  \ (NSCLC)\n\nTo train the model on NSCLC CT data, run the following script:\n\n  ```sh\n  ./scripts/run_train_RadiomicsRetireval_NSCLC_Img+Rad_withAPE.sh\n\
  \  ```\n\n     \n#### :brain: Brain Tumor MRI (BraTS)  \nTraining code for brain tumor retrieval is\
  \ under construction and will be uploaded soon.\n\n### Released Checkpoints\n\n#### :lungs: Lung Tumor\
  \ CT (NSCLC)\n  - \U0001F517 [Download checkpoint](https://drive.google.com/file/d/16c-LM23X0J3vMcnxGMgmbmefxS9mfKKQ/view?usp=sharing)\n\
  \n#### :brain: Brain Tumor MRI (BraTS)\n  - \U0001F517 [Download checkpoint](https://drive.google.com/file/d/1VRkXb5XHzYo5OmwgHDc-RooMxQET8-Km/view?usp=sharing)\n\
  \n\n### Retrieval\n\nAfter training (or downloading a checkpoint), build a sample-embedding DB and query\
  \ it.\n\n#### :lungs: Lung Tumor CT (NSCLC)\n\n##### 1. Build the embedding DB\n\n```sh\n./scripts/run_build_db.sh\n\
  ```\n\nRuns every sample in `data/NSCLC/train.jsonl` through the image encoder and writes the DB to\
  \ `results/checkpoint-lung/db/`:\n\n```\nimg_embeddings/<id>.npy           # image embedding per sample\n\
  radiomics_normalized.json         # 72 normalized radiomics features\nfeature_names.json\ngt_labels.json\n\
  radiomics_features_min_max.json\nskipped.json\n```\n\nSamples without a matching image / seg / APE file\
  \ are skipped, so you can re-run the script later to fill in the gaps. Edit [`scripts/run_build_db.sh`](scripts/run_build_db.sh)\
  \ to change the jsonl, data root, checkpoint, or GPU.\n\n##### 2. Query the DB\n\n```sh\n./scripts/run_retrieve.sh\n\
  ```\n\nSet `MODE` to choose the search space:\n\n| Mode | Search space |\n|---|---|\n| `img` | Image\
  \ embedding |\n| `rad` | All 72 radiomics features |\n| `shape` | 14 Shape features |\n| `firstorder`\
  \ | 18 First-order features |\n| `texture` | GLCM ∪ GLSZM (40 features) |\n| `glcm` / `glszm` | Single\
  \ texture family |\n| `feature` | One feature, set by `FEATURE_NAME` |\n\nTwo ways to specify the query:\n\
  \n- Set `QUERY_ID=LUNG1-001_1` to use a sample already in the DB.\n- Leave `QUERY_ID` blank and set\
  \ `IMAGE`, `SEG`, and (for `MODE=img`) `APE` to use an external sample. `QUERY_LABEL` is optional.\n\
  \nEach result shows the embedding similarity (`emb`), the cosine on the 72 min-max-normalized radiomics\
  \ features (`rad_feature`), and label match:\n\n```\n[result] mode=shape, query_label=ADC, top-5:\n\
  \   1. LUNG1-042_1             emb=+0.8731  rad_feature=+0.6402  label=ADC  ✓\n   2. LUNG1-114_1   \
  \          emb=+0.8520  rad_feature=+0.5810  label=SCC\n   3. LUNG1-077_2             emb=+0.8431  rad_feature=+0.7152\
  \  label=ADC  ✓\n   ...\n```\n\nFor non-`img` modes, the DB is forwarded through transtab once and cached\
  \ at `<db>/_cache_<mode>.npy`.\n\n\n## Citation\nIf you use this code for your research, please cite\
  \ our papers.\n\n**BibTeX:**\n```bibtex\n@inproceedings{na2025radiomicsretrieval,\n  title={RadiomicsRetrieval:\
  \ A Customizable Framework for Medical Image Retrieval Using Radiomics Features},\n  author={Na, Inye\
  \ and Rue, Nejung and Chung, Jiwon and Park, Hyunjin},\n  booktitle={International Conference on Medical\
  \ Image Computing and Computer-Assisted Intervention},\n  pages={556--566},\n  year={2025},\n  organization={Springer}\n\
  }\n```\n\n## Contact\n\nFor any inquiries or support, please contact us at `niy0404@gmail.com`.\n"

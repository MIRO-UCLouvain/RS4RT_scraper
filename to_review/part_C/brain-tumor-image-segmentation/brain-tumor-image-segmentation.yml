readme_excerpt: '# Brain tumor segmentation using U-Net


  # Overview

  semantic segmentation of brain tumors from MRI scans using a custom U-Net architecture implemented in
  pytorch


  ## Features

  -Image-mask pairing

  -custom Dataset class

  -Train validation split

  -U-Net architecture from scratch

  -training and validation loops

  -model saving


  ## Technologies

  -pytorch

  -python

  -opencv

  -numpy


  # Dataset

  LGG MRI segemntation Dataset (Kaggle)'

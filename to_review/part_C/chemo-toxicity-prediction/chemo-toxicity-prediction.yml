readme_excerpt: "# Chemotherapy Toxicity Predictor\n\nChemotherapy can be life-saving — but it can also\
  \ come with serious side effects.\n\nThis project uses machine learning to **predict the risk of chemotherapy\
  \ toxicity** based on patient data, helping doctors make safer and more informed treatment decisions.\n\
  \n---\n\n## What it does\n\n- Takes patient details (age, BMI, symptoms, etc.)\n- Uses a trained ML\
  \ model to analyze risk\n- Gives:\n  - Toxicity risk score\n  -  High / Low risk prediction\n  -  Key\
  \ contributing factors\n\n---\n\n##  Why this matters\n\nChemotherapy toxicity can be unpredictable\
  \ and dangerous.\n\nEarly prediction can:\n- Prevent complications\n- Help adjust treatment plans\n\
  - Improve patient safety\n\n---\n\n## \U0001F6E0 Tech Stack\n\n- **Backend:** Flask (Python)\n- **Model:**\
  \ Random Forest (Scikit-learn)\n- **Frontend:** HTML, CSS, JavaScript\n\n"

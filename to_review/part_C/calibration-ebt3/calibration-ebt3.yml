readme_excerpt: "# CurveFitter: Calibration Library for Gafchromic EBT3 Dosimetry\n## Table of Contents\
  \  \n1. [Description](#description)  \n2. [Key Features](#key-features)  \n3. [Installation](#installation)\n\
  4. [Documentation](#documentation) \n5. [Tutorial](#tutorial)  \n6. [Processing Modes](#processing-modes)\
  \  \n7. [Supported Non-Linear Functions](#supported-non-linear-functions)  \n8. [Advanced Methods](#advanced-methods)\
  \  \n9. [Multiple Metric Calculation](#multiple-metric-calculation)  \n10. [Testing](#testing) \n11.\
  \ [Considerations and Limitations](#considerations-and-limitations)\n12. [Project overview](#project-overview)\n\
  \n# Description\nCurveFitter is a Python library designed to calibrate Gafchromic EBT3 radiochromic\
  \ films used in dosimetry applications. The main challenge in calibrating these films arises from the\
  \ lack of a well-known calibration function. In addition, each batch of films must be individually calibrated.\n\
  \nTo address this, CurveFitter provides an automated framework for testing various calibration functions\
  \ found in the scientific literature. The goal is to identify the calibration function that minimizes\
  \ the Mean Squared Error (MSE) between the measured and expected dose-response data. By comparing different\
  \ calibration models, this library helps users find the most accurate calibration for their specific\
  \ set of data.\n\nThe calibration process involves two main variables:\n\n- The X-axis represents the\
  \ pixel values measured from the film.\n- The Y-axis represents the corresponding relative dose associated\
  \ with those pixel values.\n\nHowever, because there are different methods to derive the calibration\
  \ curve, the library also includes tools to process the data in multiple ways. Specifically, it supports\
  \ methods to calculate the optical density (OD) and net optical density (netOD), as these are widely\
  \ used in the literature for calibrating Gafchromic films. This flexibility allows the user to choose\
  \ the appropriate method depending on the dataset and the specific application.\n\n### FitPlotter\n\
  A separate class called FitPlotter has been implemented to facilitate the visualization of the calibration\
  \ results.\nThis class inherits from CurveFitter and generates plots of the fitting functions, providing\
  \ an intuitive way to visually assess the performance of different calibration models. The FitPlotter\
  \ class includes the plot_fits method, which allows users to plot the fitting functions based on different\
  \ plot types, including:\n\n- *ALL*: Displays all fitting functions.\n- *POLYNOMIAL*: Displays only\
  \ the polynomial fit.\n- *FUNCTION*: Displays a specific function, if provided.\n- *BEST FIT*: Displays\
  \ the best fitting function selected based on the minimization of MSE.  \nThe plotting functionality\
  \ supports the display of the fitted curves and the data points, making it easier for users to compare\
  \ and validate their calibration choices.\n\nThe library is designed to be flexible and can easily be\
  \ adapted to different datasets. Its primary purpose is to streamline the calibration process, reducing\
  \ both manual effort and the risk of errors in the calibration procedure.\n\n### SingleChannelCalibration\n\
  The SingleChannelCalibration class extends the CurveFitter base class, inheriting its curve-fitting\
  \ capabilities while adding specific functionality for channel-based calibration.\nThe primary components\
  \ of this system include:\n\n- Channel identification and result storage\n- Calibration curve fitting\n\
  - Dose calculation based on calibrated parameters\n\n### MultiChannelCalibration\nThe MultiChannelCalibration\
  \ class also inherits from the base CurveFitter class to leverage common fitting functionalities while\
  \ implementing specialized multichannel processing.\nCalibration Process\nThe system independently processes\
  \ the three color channels (red, green, and blue) of the scanned film image. Each channel is managed\
  \ by a dedicated SingleChannelCalibration instance, allowing for specialized processing of the unique\
  \ characteristics of each color channel's response to radiation.\nTo achieve dose reconstruction, the\
  \ methodology employs a weighted averaging approach where the contribution of each channel to the final\
  \ dose measurement is determined by its calibration performance. The weights are inversely proportional\
  \ to the Mean Square Error (MSE) of each channel's calibration fit, mathematically expressed as:  \n\
  <p align=\"center\">\n   $$w_i = \\frac{1/MSE_i}{\\sum_{j} (1/MSE_j)}$$\n</p>\nwhere w<sub>i</sub> represents\
  \ the weight of channel i, and MSE<sub>i</sub> is its corresponding mean square error. \nThe dose reconstruction\
  \ algorithm processes the RGB components of an image independently and combines them using the previously\
  \ determined optimal weights. This approach can be represented as:\n<p align=\"center\">\n   $$D_{combined}\
  \ = \\sum_{i} (w_i \\cdot D_i)$$\n</p>\nwhere D<sub>i</sub> represents the dose calculated from channel\
  \ i, and w<sub>i</sub> is its corresponding weight.\n\n## Key Features\n\n- Support for calibration\
  \ methods using:\n  * Pixel Values (PV)\n  * Optical Density (OD)\n  * Net Optical Density (netOD)\n\
  - Data processing and normalization for both polynomial and non-linear fits\n- Automatic model selection\
  \ through minimization of multiple metrics (score and MSE)\n- Advanced parameter estimation techniques\n\
  \n# Installation\n\n### Requirements\n- Python 3.8+\n- Required libraries:\n   * numpy==1.24.4\n   *\
  \ scipy==1.10.1\n   * scikit-learn==1.5.1\n   * pytest==7.4.0\n   * pytest-cov==6.0.0\n   * hypothesis==6.124.0\n\
  \   * matplotlib==3.8.4\n\n### Cloning the Repository\nTo clone this repository to your local machine,\
  \ use the following command:\n\n`bash\ngit clone https://github.com/EleonoraAmico/Calibration_EBT3.git`\
  \  \n`cd Calibration_EBT3`\n\n### Installation\nTo install the project and all its necessary dependencies,\
  \ run the following command:\n\n`bash\npip install .`\n\nIf you want to install additional dependencies\
  \ for testing or documentation purposes, you can use one of the following commands:\n\nFor testing:\n\
  \n`bash\npip install .[dev]`\n\nFor documentation dependencies ( Sphinx):\n\n`bash\npip install .[docs]`\n\
  \n### Optional: Using requirements.txt\nIf you prefer, you can also install dependencies via a requirements.txt\
  \ file. To do this, run:\n\n`bash pip install -r requirements.txt`\n\n# Documentation\n\nThe full documentation\
  \ for this project is available in the `docs` folder. You can view it by opening the `index.html` file\
  \ in your browser.\n\nIf you want to build the documentation locally, you can use Sphinx. Simply navigate\
  \ to the `docs` folder and run:\n\n`bash\nsphinx-build -b html . _build`  \n\n# Tutorial\nTo get started\
  \ with the CurveFitter package, check out the tutorial.py file located in the Tutorial folder for a\
  \ complete usage example.\n\nAdditionally, you can download the sample data file channel_red.csv from\
  \ the example/ folder. This will allow you to test the library with real data and see the results.\n\
  \n### Quick Instructions:\n\n1. **Download the sample data**:\n   - Go to the `example/` folder and\
  \ download the `channel_red.csv` file containing the sample data.\n\n2. **Check out the `tutorial.py`\
  \ file**:\n   - The `tutorial.py` file in the `Tutorial` folder contains a full example of how to use\
  \ the `CurveFitter` library, including code for non-linear and polynomial fitting, as well as how to\
  \ generate plots.\n\n# Processing Modes\n\nThe library supports different processing modes for handling\
  \ calibration data. The available modes are:\n\n| Mode   | Description |\n|--------|------------|\n\
  | **PV** (Pixel Values) | Uses raw pixel values directly for calibration without conversion. Suitable\
  \ for simple calibrations where optical density is not required. |\n| **OD** (Optical Density) | Converts\
  \ pixel values into optical density (OD), which is often used in dosimetry for better correlation with\
  \ radiation dose. |\n| **NET_OD** (Net Optical Density) | Uses net optical density, calculated as the\
  \ difference between exposed and unexposed film optical density. This method helps reduce variations\
  \ due to scanner fluctuations and background noise. |\n\n\n# Supported Non-Linear Functions \n\n*CurveFitter*\
  \ includes several non-linear fitting functions to perform calibration:\n\n- **Exponential Fit**:\n\
  \  - $f(x) = a \\cdot e^{b \\cdot x} + c$\n  - A simple exponential function to model the relationship\
  \ between pixel values and relative dose.\n\n- **Combination of Exponentials**:\n  - $f(x) = a \\cdot\
  \ \\exp(b \\cdot x) + c \\cdot \\exp(d \\cdot x)$\n  - A combination of two exponential functions to\
  \ model more complex relationships between pixel values and dose.\n\n- **Generalized Rational Function**:\n\
  \  - $f(x) = \\frac{a + x}{c \\cdot x + d} + e$\n  - A generalized rational function to provide a flexible\
  \ model for the dose-response relationship.\n\n- **Logarithmic Function**:\n  - $f(x) = \\frac{\\ln\\\
  left(\\frac{x + b}{b}\\right)}{a}$\n  - A logarithmic function that models non-linear relationships\
  \ by calculating the log of the ratio between two linear terms, with numerical stability adjustments.\n\
  \n# Advanced Methods \n\nGenerating a good initial guess is critical for the success of non-linear optimization\
  \ algorithms like those used in curve fitting.In addition to basic fitting, *CurveFitter* offers advanced\
  \ features to improve calibration accuracy:\n\n1. *Initial Guess Generation*:\n   -  Tailored guesses\
  \ based on function characteristics help in achieving faster and more reliable convergence.\n3. *Bayesian\
  \ Approach for Parameter Selection*:\n      - Bayesian methods are a class of probabilistic techniques\
  \ based on Bayes' theorem, which describes how prior knowledge is updated with observed data to obtain\
  \ a posterior distribution. In this case, we do         not compute the full posterior distribution\
  \ but instead use Bayesian-inspired sampling to generate plausible parameter values for function fitting.\
  \  \n        The Bayesian approach provides several advantages:  \n        - It allows the exploration\
  \ of multiple parameter sets instead of relying on a single deterministic initial guess.  \n       \
  \ - It accounts for uncertainty in parameter estimation by considering a range of values rather than\
  \ fixed assumptions.  \n        - It is particularly useful when the function has non-linear behavior\
  \ or when gradient-based methods struggle with poor initial conditions.  \n         \n        The sampling\
  \ strategy used here is a form of Approximate Bayesian Computation (ABC), where the best parameter set\
  \ is chosen by minimizing the distance between simulated and observed data.\n\n# Multiple Metric Calculation\n\
  \n**CurveFitter** evaluates the fitting results using multiple metrics, with a primary focus on the\
  \ **Mean Squared Error (MSE)** and a **Score**. The **Score** metric is particularly useful for polynomial\
  \ fits and is calculated based on several criteria, which provide a more comprehensive evaluation of\
  \ the fitting quality. The formula for the score is as follows:\n\n1. **Coefficient Ratio**: Measures\
  \ the ratio of the absolute value of the first coefficient to the mean of the absolute values of the\
  \ other coefficients. This helps assess the dominance of the first coefficient in the polynomial fitting.\
  \  \n    coeff_ratio = $\\frac{\\left|\\text{coefficients}[0]\\right|}{\\text{mean}\\left(\\left|\\\
  text{coefficients}[1:]\\right|\\right)} \\quad \\text{if} \\quad \\text{len(coefficients)} > 1 \\quad\
  \ \\text{else} \\quad \\infty$\n\n\n   Where:\n   - The numerator is the absolute value of the **first\
  \ coefficient** (`coefficients[0]`).\n   - The denominator is the **mean of the absolute values** of\
  \ all remaining coefficients (`coefficients[1:]`).\n   \n   This ratio helps identify if the first coefficient\
  \ (typically the highest degree term in polynomials) dominates the model.\n\n3. **Complexity Penalty**:\
  \ A penalty term that increases with the degree of the polynomial and the size of the dataset. This\
  \ prevents overfitting by discouraging excessively complex models.\n\n   complexity_penality = $\\text{degree}\

readme_excerpt: "# Healthcare Physical-AI Demo using NVIDIA AI Stack\n\n> Independent proof-of-concept\
  \ showing a healthcare physical-AI workflow using MONAI, PyTorch/CUDA, Holoscan SDK, and Isaac Sim.\n\
  \nThis project demonstrates how synthetic medical imaging data, AI-assisted contouring, edge-style inference,\
  \ audit logging, and a lightweight healthcare digital-twin scene can be connected into one end-to-end\
  \ workflow.\n\n**Important disclaimer:** This is an independent educational/demo project. It is not\
  \ affiliated with or endorsed by NVIDIA, GE HealthCare, or any clinical institution. It is not clinical-grade,\
  \ not a medical device, and must not be used for diagnosis, treatment planning, or patient care.\n\n\
  ---\n\n## Recruiter / Hiring Manager TL;DR\n\nThis project was built to demonstrate hands-on fluency\
  \ across the core building blocks of healthcare physical AI:\n\n- **MONAI + PyTorch/CUDA:** synthetic\
  \ MRI/CT-style data generation, toy organ/tumor auto-contouring, GPU inference benchmarking.\n- **Holoscan\
  \ SDK:** operator-style pipeline for edge-AI inference, preprocessing, postprocessing, and audit logging.\n\
  - **Isaac Sim:** rendered healthcare digital-twin scene representing an image-guided procedure room\
  \ with patient table, patient phantom, imaging device placeholder, robotic/cart placeholder, monitor,\
  \ and OR floor.\n- **Responsible AI / regulated workflow patterns:** audit logs, synthetic data only,\
  \ reproducible outputs, and clear separation between proof-of-concept and clinical-grade software.\n\
  \n---\n## Visual Outputs\n\n### 1. Synthetic MRI/CT Data + Toy Auto-Contouring Output\n\n![Synthetic\
  \ MRI/CT Auto-Contouring Output](outputs/summary_visualization.png)\n\nThis output shows the core medical-imaging\
  \ AI workflow in the project. The synthetic MRI-style image and synthetic CT-style image are generated\
  \ as paired inputs, with a ground-truth segmentation mask and a model-predicted contour. The goal is\
  \ to demonstrate an end-to-end imaging-AI pipeline for generating synthetic data, training a MONAI/PyTorch\
  \ model, and producing toy organ/tumor auto-contouring outputs.\n\n**What this demonstrates:** synthetic\
  \ data generation, MONAI model training, segmentation inference, imaging-AI workflow design, and visual\
  \ validation of predicted contours.\n\n---\n\n### 2. Holoscan SDK Operator Pipeline Output\n\n![Holoscan\
  \ Pipeline Output](outputs/holoscan_pipeline_output.png)\n\nThis output shows the same imaging-AI workflow\
  \ executed through a Holoscan-style operator pipeline. The pipeline separates the workflow into modular\
  \ stages such as data loading, preprocessing, model inference, postprocessing, visualization, and audit\
  \ logging. This mirrors how edge-AI healthcare applications can be organized for real-time or near-real-time\
  \ deployment.\n\n**What this demonstrates:** healthcare edge-AI pipeline orchestration, modular operator\
  \ design, inference workflow execution, and audit-friendly processing patterns.\n\n---\n\n### 3. Isaac\
  \ Sim Healthcare Digital-Twin Scene\n\n![Isaac Sim Healthcare Digital Twin](outputs/isaac_scene_preview.png)\n\
  \nThis rendered Isaac Sim scene represents a simplified healthcare procedure room / image-guided intervention\
  \ environment. The scene includes a patient phantom on a procedure table, imaging-device placeholder,\
  \ robot/cart placeholder, clinical monitor, lighting, and room/floor geometry. It is intended as a conceptual\
  \ digital-twin environment for discussing physical-AI workflows in healthcare.\n\n**What this demonstrates:**\
  \ Isaac Sim scene generation, healthcare digital-twin modeling, physical-AI workflow visualization,\
  \ and simulation-readiness for future extensions such as robotic workflow testing, synthetic data generation,\
  \ or human-in-the-loop procedure simulation.\n\n---\n\n### Summary of Visual Proof Points\n\nTogether,\
  \ these visuals show that the project is not only code-based, but also produces tangible artifacts across\
  \ three parts of the NVIDIA healthcare AI stack:\n\n- **MONAI + PyTorch/CUDA:** toy medical-image segmentation\
  \ and GPU inference benchmarking.\n- **Holoscan SDK:** modular edge-AI workflow pipeline with audit\
  \ logging.\n- **Isaac Sim:** rendered healthcare digital-twin scene for physical-AI workflow demonstration.\n\
  \nThis is an independent proof-of-concept project using NVIDIA developer tools. It is not affiliated\
  \ with or endorsed by NVIDIA and is not intended for clinical use.\n---\n\n## End-to-End Workflow\n\n\
  ```mermaid\nflowchart LR\n    A[Synthetic MRI/CT-style data] --> B[MONAI U-Net training]\n    B -->\
  \ C[PyTorch/CUDA inference]\n    C --> D[Latency benchmark]\n    C --> E[Audit log]\n    A --> F[Holoscan\
  \ SDK operator pipeline]\n    F --> G[Preprocess]\n    G --> H[Inference]\n    H --> I[Postprocess]\n\
  \    I --> J[Holoscan audit log]\n    K[Isaac Sim] --> L[Healthcare digital-twin USD scene]\n    L -->\
  \ M[Rendered preview PNG]\n```\n\n---\n\n## What This Project Demonstrates\n\n### 1. Synthetic Medical\
  \ Imaging Data\n\nThe project creates synthetic MRI/CT-style 2D imaging cases with paired masks. The\
  \ goal is not clinical realism; the goal is to create a reproducible dataset for demonstrating AI workflow\
  \ mechanics.\n\n**Key outputs:**\n\n- `data/synthetic_cases/`\n- `outputs/summary_visualization.png`\n\
  \n### 2. MONAI Auto-Contouring Workflow\n\nA small MONAI/PyTorch segmentation model is trained on synthetic\
  \ organ/tumor masks. The model is intentionally lightweight so the workflow can run on CPU, Colab GPU,\
  \ or cloud GPU.\n\n**Key files:**\n\n- `src/generate_synthetic_mri_ct.py`\n- `src/train_monai_autocontour.py`\n\
  - `src/infer_edge_workflow.py`\n- `src/visualize_outputs.py`\n\n### 3. CUDA / GPU Benchmarking\n\nThe\
  \ demo benchmarks inference latency on CPU and GPU to show the impact of accelerated inference for edge-AI\
  \ style workflows.\n\n**Example benchmark result from this project:**\n\n| Environment | p95 Latency\
  \ | Notes |\n|---|---:|---|\n| CPU | ~5.51 ms | Local CPU benchmark |\n| NVIDIA T4 GPU | ~1.52 ms |\
  \ PyTorch/CUDA benchmark |\n| GPU Speedup | ~3.6x | GPU p95 vs CPU p95 |\n\n**Key outputs:**\n\n- `outputs/cpu_benchmark.json`\n\
  - `outputs/gpu_benchmark.json`\n- `outputs/benchmark_summary.json`\n- `outputs/cuda_environment.json`\n\
  \n### 4. Holoscan SDK Operator Pipeline\n\nThe Holoscan pipeline organizes the workflow into operator-style\
  \ stages:\n\n1. Data source\n2. Preprocessing\n3. MONAI inference\n4. Postprocessing\n5. Audit logging\n\
  \nThis mirrors how a healthcare edge-AI workflow could be decomposed into modular, observable processing\
  \ stages.\n\n**Key files and outputs:**\n\n- `src/holoscan_pipeline.py`\n- `outputs/holoscan_audit_log.json`\n\
  - `outputs/holoscan_pipeline_output.png`\n- `outputs/holoscan_prediction.npy`\n\n### 5. Isaac Sim Healthcare\
  \ Digital Twin\n\nThe Isaac Sim component creates a lightweight healthcare procedure-room scene in USD\
  \ format and renders a PNG preview. The scene is conceptual and includes a patient table, patient phantom,\
  \ imaging-device placeholder, robotic/cart placeholder, monitor, lighting, and OR floor.\n\n**Key files\
  \ and outputs:**\n\n- `isaac/create_healthcare_or_scene.py`\n- `isaac/render_usd_preview.py`\n- `outputs/isaac_healthcare_or_digital_twin.usd`\n\
  - `outputs/isaac_scene_metadata.json`\n- `outputs/isaac_scene_preview.png`\n\n### 6. Audit Logging and\
  \ Workflow Traceability\n\nThe project creates JSON audit logs showing model name/version, case ID,\
  \ device, latency, and output paths. This is a simplified demonstration of traceability patterns relevant\
  \ to regulated AI workflows.\n\n**Key outputs:**\n\n- `outputs/edge_audit_log.json`\n- `outputs/holoscan_audit_log.json`\n\
  \n---\n\n## Repository Structure\n\n```text\n.\n├── README.md\n├── requirements-cpu.txt\n├── requirements-gpu.txt\n\
  ├── requirements-holoscan.txt\n├── src/\n│   ├── generate_synthetic_mri_ct.py\n│   ├── train_monai_autocontour.py\n\
  │   ├── infer_edge_workflow.py\n│   ├── benchmark_latency.py\n│   ├── visualize_outputs.py\n│   └──\
  \ holoscan_pipeline.py\n├── isaac/\n│   ├── create_healthcare_or_scene.py\n│   └── render_usd_preview.py\n\
  ├── outputs/\n│   ├── summary_visualization.png\n│   ├── edge_audit_log.json\n│   ├── cpu_benchmark.json\n\
  │   ├── gpu_benchmark.json\n│   ├── benchmark_summary.json\n│   ├── cuda_environment.json\n│   ├── holoscan_audit_log.json\n\
  │   ├── holoscan_pipeline_output.png\n│   ├── holoscan_prediction.npy\n│   ├── isaac_healthcare_or_digital_twin.usd\n\
  │   ├── isaac_scene_metadata.json\n│   └── isaac_scene_preview.png\n└── data/\n    └── synthetic_cases/\n\
  ```\n\n---\n\n## Quick Start: CPU Workflow\n\n```bash\npython -m venv .venv\nsource .venv/bin/activate\n\
  \npip install -r requirements-cpu.txt\n\npython src/generate_synthetic_mri_ct.py\npython src/train_monai_autocontour.py\n\
  python src/infer_edge_workflow.py --case-id case_000\npython src/benchmark_latency.py\npython src/visualize_outputs.py\n\
  ```\n\n---\n\n## Quick Start: GPU / CUDA Workflow\n\nThis workflow was tested on NVIDIA GPU infrastructure\
  \ using PyTorch/CUDA.\n\n```bash\npip install -r requirements-gpu.txt\n\npython src/generate_synthetic_mri_ct.py\n\
  python src/train_monai_autocontour.py\npython src/infer_edge_workflow.py --case-id case_000 --device\
  \ cuda\npython src/benchmark_latency.py --device cuda\npython src/visualize_outputs.py\n```\n\nCheck\
  \ CUDA availability:\n\n```bash\npython - <<'PY'\nimport torch\nprint(\"CUDA available:\", torch.cuda.is_available())\n\
  print(\"GPU:\", torch.cuda.get_device_name(0) if torch.cuda.is_available() else \"CPU only\")\nPY\n\
  ```\n\n---\n\n## Quick Start: Holoscan SDK Pipeline\n\nInstall Holoscan dependencies in a compatible\
  \ environment:\n\n```bash\npip install -r requirements-holoscan.txt\n```\n\nRun the Holoscan operator\
  \ pipeline:\n\n```bash\npython src/holoscan_pipeline.py --case-id case_000\n```\n\nExpected outputs:\n\
  \n```text\noutputs/holoscan_audit_log.json\noutputs/holoscan_pipeline_output.png\noutputs/holoscan_prediction.npy\n\
  ```\n\n---\n\n## Quick Start: Isaac Sim / RunPod Workflow\n\nThe Isaac Sim scene was generated in an\
  \ Isaac Sim container environment.\n\nCreate the USD healthcare scene:\n\n```bash\n/isaac-sim/python.sh\
  \ isaac/create_healthcare_or_scene.py\n```\n\nRender the scene preview:\n\n```bash\n/isaac-sim/python.sh\
  \ isaac/render_usd_preview.py\n```\n\nExpected outputs:\n\n```text\noutputs/isaac_healthcare_or_digital_twin.usd\n\
  outputs/isaac_scene_metadata.json\noutputs/isaac_scene_preview.png\n```\n\n---\n\n## What This Is\n\n\
  This project is a practical, end-to-end demonstration of:\n\n- Healthcare AI workflow design\n- Synthetic\
  \ imaging data generation\n- MONAI-based segmentation\n- CUDA inference benchmarking\n- Holoscan-style\
  \ edge-AI pipeline design\n- Isaac Sim healthcare digital-twin scene creation\n- Audit logging and traceability\
  \ concepts\n\n---\n\n## What This Is Not\n\nThis project is **not**:\n\n- A clinical-grade model\n-\
  \ A validated segmentation algorithm\n- A diagnostic or treatment-planning tool\n- An FDA-cleared or\
  \ regulated medical device\n- An official NVIDIA project\n- A substitute for clinical validation, cybersecurity\
  \ review, quality-system controls, or regulatory approval\n\n---\n\n## License\n\nUse an open-source\
  \ license appropriate for your repository. Recommended options:\n\n- MIT License for permissive reuse\n\
  - Apache 2.0 if you want explicit patent-license language\n\n---\n\n## Author\n\nBuilt as an independent\
  \ proof-of-concept by Vishal Kampani.\n"

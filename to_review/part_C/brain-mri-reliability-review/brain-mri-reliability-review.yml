readme_excerpt: "# Derived data and analysis code for reliability-aware multi-center brain tumor MRI segmentation\n\
  \nThis archive contains de-identified derived data and analysis code supporting the manuscript:\n\n\
  Reliability-aware multi-center brain tumor MRI segmentation with entropy-based review prioritization\n\
  \n> **Update 2026-07-23:** the leak-free (R1) results are released under\n> [`r1_revision_20260723/`](r1_revision_20260723/README_R1.md).\
  \ The R1\n> release uses source-site checkpoint selection and supersedes the\n> archived 2026-06-05\
  \ runs for the primary claims; the archived runs\n> remain here as historical exploratory evidence with\
  \ the documented\n> checkpoint-selection caveat.\n\n## Dataset source\n\nThe original MRI images and\
  \ segmentation annotations are third-party data from the Federated Tumor Segmentation (FeTS) 2022 dataset.\
  \ They are not redistributed in this archive. Researchers should obtain the source images and labels\
  \ through the official FeTS/Synapse data access procedures.\n\nThis archive only contains derived tabular\
  \ outputs, site split metadata used by the study, figure source data, and analysis scripts.\n\n## Contents\n\
  \n- `derived_data/site_splits/`\n  - FeTS case-to-site mapping used for leave-one-site-out evaluation.\n\
  \  - Site-level case counts.\n\n- `derived_data/segmentation_metrics/`\n  - Experiment-level segmentation\
  \ metric summaries.\n  - Available per-case surface/region metrics where computed.\n\n- `derived_data/entropy_risk/`\n\
  \  - Per-case entropy-based risk scores.\n  - Risk group assignments.\n  - Summary statistics and thresholds\
  \ for the reported held-out sites.\n\n- `derived_data/figure_source_data/`\n  - CSV/JSON source data\
  \ used for manuscript tables and figures.\n\n- `analysis_code/`\n  - Scripts for entropy-risk evaluation,\
  \ figure generation, qualitative panel generation, FeTS preprocessing references, and model evaluation\
  \ references.\n\n- `metadata/`\n  - File manifest and SHA256 checksums.\n\n## Important exclusions\n\
  \nThis archive deliberately excludes:\n\n- original MRI volumes;\n- original segmentation label volumes;\n\
  - model checkpoints and trained weights;\n- voxel-level prediction volumes;\n- full qualitative MRI\
  \ panel images derived from patient scans.\n\nThese files were excluded to avoid redistributing third-party\
  \ medical imaging data or derivatives that may be governed by FeTS data-use terms. The included tabular\
  \ outputs are intended to provide the minimal data needed to reproduce the reported numerical findings.\n\
  \n## Reproducibility notes\n\nTo reproduce the full training and evaluation workflow:\n\n1. Obtain FeTS\
  \ 2022 source data through the official FeTS/Synapse procedure.\n2. Preprocess the data using the referenced\
  \ preprocessing scripts under `analysis_code/code_shared_minimal/data/`.\n3. Use the site split metadata\
  \ in `derived_data/site_splits/`.\n4. Run the evaluation and plotting scripts in `analysis_code/`.\n\
  \nAbsolute paths in some scripts reflect the local development environment and should be adapted to\
  \ the user's local data root.\n\n## License\n\nThe derived tabular data in this archive are intended\
  \ for scholarly reuse under CC BY 4.0. Source code is provided for reproducibility of the reported analyses.\
  \ If a repository-level license is required during deposition, use CC BY 4.0 for the deposited archive\
  \ unless the authors choose a separate code license.\n"

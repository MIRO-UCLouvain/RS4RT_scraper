readme_excerpt: "[![Deploy with Vercel](https://vercel.com/button)](https://vercel.com/new/clone?repository-url=https%3A%2F%2Fgithub.com%2Fleerob%2Fleerob.io)\n\
  \n# leerob.io\n\n- **Framework**: [Next.js](https://nextjs.org/)\n- **Database**: [Postgres](https://vercel.com/postgres)\n\
  - **Authentication**: [NextAuth.js](https://next-auth.js.org)\n- **Deployment**: [Vercel](https://vercel.com)\n\
  - **Styling**: [Tailwind CSS](https://tailwindcss.com)\n- **Analytics**: [Vercel Analytics](https://vercel.com/analytics)\n\
  \n## Running Locally\n\nThis application requires Node.js v18.17+.\n\n```bash\ngit clone https://github.com/leerob/leerob.io.git\n\
  cd leerob.io\nbun install\nbun run setup # Remove all of my personal information\nbun dev\n```\n\nCreate\
  \ a `.env.local` file similar to [`.env.example`](https://github.com/leerob/leerob.io/blob/main/.env.example).\n\
  \n## Database Schema\n\n```sql\nCREATE TABLE redirects (\n  id SERIAL PRIMARY KEY,\n  source VARCHAR(255)\
  \ NOT NULL,\n  destination VARCHAR(255) NOT NULL,\n  permanent BOOLEAN NOT NULL\n);\n\nCREATE TABLE\
  \ guestbook (\n  id SERIAL PRIMARY KEY,\n  email VARCHAR(255) NOT NULL,\n  body TEXT NOT NULL,\n  created_by\
  \ VARCHAR(255) NOT NULL,\n  created_at TIMESTAMP NOT NULL,\n  updated_at TIMESTAMP\n);\n\nCREATE TABLE\
  \ views (\n  slug VARCHAR(255) PRIMARY KEY,\n  count INT NOT NULL\n);\n```\n\n## License\n\n1. You are\
  \ free to use this code as inspiration.\n2. Please do not copy it directly.\n3. Crediting the author\
  \ is appreciated.\n\nPlease remove all of my personal information (blog posts, images, etc.) by running\
  \ `bun run setup`.\n"

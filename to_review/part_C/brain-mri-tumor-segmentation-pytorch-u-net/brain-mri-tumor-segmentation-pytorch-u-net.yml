readme_excerpt: "# Brain MRI Tumor Segmentation — PyTorch U-Net\n\nWhole-tumor segmentation on multi-modal\
  \ brain MRI (FLAIR, T1, T1ce, T2) using a 2D U-Net, trained on the [Medical Segmentation Decathlon](http://medicaldecathlon.com)\
  \ Task01_BrainTumour dataset (BraTS-derived, 484 labeled cases).\n\n![predictions](figures/predictions.png)\n\
  \n## Highlights\n\n- Multi-modal input (4 MRI sequences as channels), per-modality z-score normalization\
  \ on brain voxels only\n- Combined Dice + BCE loss to handle severe foreground/background class imbalance\n\
  - Mixed-precision training (AMP), cosine LR schedule, tumor-slice sampling to avoid empty-slice domination\n\
  - Instance normalization (standard for medical imaging, robust to small batch sizes)\n- Reproducible\
  \ train/val split, best-checkpoint selection on validation Dice\n\n## Results\n\n| Metric | Validation\
  \ |\n|---|---|\n| Dice (whole tumor) | _fill in after training_ |\n\nTypical published 2D U-Net baselines\
  \ on this task reach ~0.85–0.90 whole-tumor Dice.\n\n## Setup\n\n```bash\npip install -r requirements.txt\n\
  # Download Task01_BrainTumour from http://medicaldecathlon.com and extract\n```\n\n## Train\n\n```bash\n\
  python -m src.train --data-root /path/to/Task01_BrainTumour --epochs 50\n```\n\n## Generate prediction\
  \ figures\n\n```bash\npython -m src.visualize --data-root /path/to/Task01_BrainTumour --checkpoint checkpoints/best.pt\n\
  ```\n\n## Structure\n\n```\nsrc/\n  model.py      # U-Net architecture\n  dataset.py    # NIfTI loading,\
  \ normalization, tumor-slice indexing\n  losses.py     # Dice+BCE loss, Dice metric\n  train.py    \
  \  # AMP training loop, checkpointing\n  visualize.py  # Prediction overlay figures\n```\n\n## Notes\n\
  \nResearch/portfolio project on public data — not a medical device and not for clinical use.\n"

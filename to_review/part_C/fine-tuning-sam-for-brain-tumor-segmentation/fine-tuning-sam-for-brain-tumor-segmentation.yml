readme_excerpt: "# Fine-Tuning SAM for Brain Tumor Segmentation\n\n## Project Overview\nThis project focuses\
  \ on fine-tuning the Segment Anything Model (SAM) for brain tumor segmentation using MRI images from\
  \ the BraTS 2020 dataset.\n\nThe main objective is to adapt SAM, originally designed for general image\
  \ segmentation, for medical image segmentation and compare its performance with a U-Net baseline model.\n\
  \n## Problem Statement\nBrain tumor segmentation from MRI scans is a critical task in medical image\
  \ analysis. Manual segmentation is time-consuming and requires expert knowledge. This project explores\
  \ deep learning-based segmentation to assist in accurate tumor region detection.\n\n## Dataset\n- Dataset:\
  \ BraTS 2020\n- Image type: MRI brain scans\n- Modalities used: FLAIR and T1CE\n- Task: Brain tumor\
  \ segmentation\n\nNote: The dataset is not uploaded in this repository due to size and access restrictions.\n\
  \n## Models Used\n- U-Net baseline model\n- Segment Anything Model ViT-B\n- Fine-tuned SAM model\n\n\
  ## Results\n- U-Net baseline accuracy: around 81%\n- SAM zero-shot Dice score: around 0.8473\n- Fine-tuned\
  \ SAM validation Dice:\n  - Epoch 1: 0.8252\n  - Epoch 2: 0.8340\n\n## Technologies Used\n- Python\n\
  - PyTorch\n- NumPy\n- Pandas\n- OpenCV\n- Matplotlib\n- nibabel\n- Kaggle GPU T4\n- Segment Anything\
  \ Model\n\n## Project Structure\n```text\nFine-Tuning-SAM-for-Brain-Tumor-Segmentation/\n│\n├── notebooks/\n\
  │   ├── 01_data_preprocessing.ipynb\n│   ├── 02_unet_baseline.ipynb\n│   ├── 03_sam_zero_shot.ipynb\n\
  │   └── 04_sam_finetuning.ipynb\n│\n├── results/\n│   ├── sample_prediction.png\n│   └── training_logs.txt\n\
  │\n├── docs/\n│   └── minor_project_report.pdf\n│\n├── src/\n├── README.md\n├── requirements.txt\n└──\
  \ .gitignore"

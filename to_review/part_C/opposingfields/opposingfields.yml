readme_excerpt: "Opposing Fields Readme file\r\n(c) Yenzakahle Medical Physics Inc 1994-2024\r\n\r\n1)\
  \ Licence\r\nPlease read the file Licence.txt. This means that if as a result of using this program\
  \ you fry your patients, trash your linac, nuke the cat, blow the city power in a ten block radius and\
  \ generally cause global thermonuclear meltdown! Sorry, you were warned!\r\n\r\n\r\n2) Introduction\r\
  \nIn this age of VMAT and Monte Carlo algorithms the Opposing Fields program is looking rather dated.\
  \ However, it is refusing to lay down and die and it appears there is still a role for point dose calculations.\
  \ \r\n\r\nThe Opposing Fields program allows the easy calculation of simple radiotherapy treatment plans.\
  \ Despite its name, it cannot only do opposing parallel fields, but can also calculate plans for single\
  \ fields as well. For each type of field it can do isocentric treatment, fixed SSD treatment (SSD =\
  \ 100 cm), and also variable SSD treatments.\r\n\r\nThe Opposing Fields program owes its simplicity\
  \ to the fact that it uses central axis point calculations in contrast to more complicated three-dimensional\
  \ treatment planners, which calculate a matrix of dose points. This places some limitations on the use\
  \ of the Opposing Fields program, but it is not meant to replace the more expensive three-dimensional\
  \ treatment planners but instead to serve as supplement or as a check against these more complex programs.\r\
  \n\r\nOpposing Fields should not be used where there is a high degree of tissue inhomogeneity, uneven\
  \ surfaces or radiosensitive structures. The Opposing Fields program in effect assumes that the patient\
  \ is a uniform homogeneous water equivalent rectangle.\r\n\r\n3) Installation.\r\nPlease start by printing\
  \ a standard treatment plan from the old version. This plan will be used to verify that the installation\
  \ of the new version is correct.\r\n\r\n3.1) Uninstalling\r\nIt is no longer necessary to uninstall\
  \ previous versions of OPF before installing a new version. The installation utility will backup existing\
  \ data files and install new files. However, to be safe please save your own copy of your data files.\r\
  \n\r\nSelect 'Start', 'Settings', 'Control Panel'\r\nDouble click on the 'Add/Remove Programs' Icon\
  \ or 'Programs and Features'\r\nSelect the 'Opposing Fields' program by clicking on it\r\nClick on the\
  \ 'Add/Remove' button\r\nClick on the 'OK' button and close the Control Panel\r\n\r\n3.2) Installing\r\
  \nLogon to Windows using an account with administrator privileges. Open Windows Explorer and navigate\
  \ to the appropriate directory. Select \"OPFsetup.exe\" and double click. Press the 'OK' button. Complete\
  \ the installation by responding to the instructions onscreen. When the installation is complete, enter\
  \ and print the same treatment plan that was printed previously. The results must be the same.\r\n\r\
  \nNote: From version 3.0 beam data files are no longer distributed with the Opposing Fields program.\
  \ If you are upgrading an existing installation your beam data files will still be available in the\
  \ installation directory. However, it is strongly recommended to copy the data files into the program\
  \ data directory by opening the beam module by selecting 'Settings, Manage machines', opening the appropriate\
  \ beam data file and clicking 'Finish'.\r\n\r\nFor new installations the beam data file must be created\
  \ or imported if one is provided. Select 'Settings, Manage machines', open the appropriate beam data\
  \ file and click 'Finish'.\r\n\r\n4) Running the Opposing Field program.\r\nSelect 'Start', 'Programs',\
  \ 'Opposing Fields'. Alternatively, double click the Opposing Fields icon on the Windows desktop.\r\n\
  \r\n5) Using the Opposing Fields program.\r\nEnter the appropriate data into each field. Press <Tab>\
  \ to move from one field to the next. When the information has been entered click on 'Calculate' to\
  \ display the treatment plan. Click on 'Print' or the print button to print the plan. Click on the close\
  \ button to exit.  For further information please refer to the manual or on-line help.\r\n\r\n6) Bugs\r\
  \nThere are, of course, no bugs. However, should the program behave in a way that you do not understand\
  \ or deliver results that you do not expect I would like to know about it. You can report issues at\
  \ https://github.com/alanphys/OpposingFields/issues.\r\n\r\n7) Release notes\r\nThese detail new or\
  \ changed functionality in the software. Please see the History for bug fixes.\r\n\r\nVersion 3.2 (2024)\r\
  \nThe results form now uses Form2PDF. Form locations are saved and restored on startup. The web server\
  \ has been removed and help is served directly from file. This makes OPF more secure. The About module\
  \ has been updated.\r\n\r\nVersion 3.1\r\nBeam data files are no longer stored with the executable but\
  \ in the appropriate program data directory. If no data exists in the config directory the program will\
  \ look in the executable dir to accommodate legacy installations. Edited beam files are automatically\
  \ stored in the program data config dir.\r\n\r\nVersion 3.0 (2020)\r\nThis version is characterised\
  \ by a conceptual change in the way the Opposing Fields program is distributed. Although it has always\
  \ been freely available it was in the past restricted to areas over which the author had personal oversight.\
  \ The code and executables of this version are now released as open source. The author will no longer\
  \ distribute data files and maintenance of the data is the sole responsibility of the user.\r\n\r\n\
  This version incorporates the beam definition module which was previously available as a separate program.\
  \ An authorisation module has also been added to control access to the beam definition module and to\
  \ provide user identification on the plan.\r\n\r\nAn About module has been added giving this readme,\
  \ the licence and credits. The data expiry check has been removed. The error and messaging systems has\
  \ been refactored and consolidated.\r\n\r\nVersion 2.4 (2014)\r\nAltered output to pdf. Plans can be\
  \ saved as PDF's. Disabled compensators. Added status bar and error reporting.\r\n\r\nVersion 2.3 (2012)\r\
  \nAdded online help\r\n\r\nVersion 2.2 (2009)\r\nPorted to Lazarus and Free Pascal. (There was a short\
  \ lived Kylix version). Help is disabled.\r\n\r\nVersion 2.1 (2003)\r\nAdded multiple machines. Included\
  \ compensators.\r\n\r\nVersion 2.0 (2000)\r\nWindows version. Incorporates definable beam parameters\
  \ stored in machine and patient files.\r\n\r\nVersion 1.0 (1994)\r\nDos version using Turbo Pascal.\
  \ Parameters are hard coded.\r\n\r\n8) History\r\nCore elements of the opposing fields program have\
  \ been around since 1994 when the first DOS version came out. In 1999 work began on porting it to Windows\
  \ 95 using Delphi.\r\n1/2/2000   On-line and context sensitive help has now been added.\r\n        \
  \   The length and breadth fields have been swapped.\r\n           The Presentation field is disabled\
  \ for single beams.\r\n4/2/2000   Windows version released as 2.0\r\n24/2/2000  altered field size on\
  \ output\r\n           patient diameter print only on opposing field\r\n           swapped FSX and FSY\
  \ fields in output factor ST\r\n           increase max SSD to 230 cm\r\n           increase max diameter\
  \ to 50 cm\r\n30/5/2001  Format of the output has been slightly altered to shorten it.\r\n         \
  \  The program has been compiled under Delphi 5, which uses aligned fields unlike previous versions.\
  \ This means that this version of the program cannot read files from previous versions.\r\n        \
  \   fixed save bug\r\n           fixed variable SSD bug\r\n12/6/2002  Reference dose added.\r\n    \
  \       Automatic date entry added\r\n           Definable expiry date added.\r\n27/6/2003  add multiple\
  \ machines\r\n           fixed save on close bug\r\n8/8/2003   altered skin dose depth from 0.03 to\
  \ 0.1\r\n19/8/2003  fixed variable SSD print\r\n           fixed update fields before exit\r\n     \
  \      included compensator option\r\n7/7/2003   Support for multiple beam data files/linacs added.\r\
  \n9/2/2004   added initialise with dmax for dose to maximum\r\n10/3/2004  disable TDepth for Single\
  \ field dose to maximum\r\n5/6/2009   Ported to Lazarus\r\n           Use CRC for integrity verification\
  \ instead of checksum\r\n           Fix exit bug\r\n           Help disabled for the moment\r\n21/4/2008\
  \  convert to TMR tables\r\n20/6/2008  reduce depth range to 25 to conform with diam of 50\r\n1/2/2011\
  \   fixed date format error, fixed various error checks\r\n2/7/2012   added on line help and web help\
  \ server\r\n10/1/2013  fixed TMR bug on smallest field\r\n16/10/2014 altered output to pdf\r\n17/10/2014\
  \ disable compensators\r\n20/10/2014 added status bar and error reporting\r\n           added DR no\r\
  \n22/10/2014 set save default to My Documents/Patients\r\n18/11/2014 fixed inconsistent save action\
  \ and directories\r\n12/7/2016  fixed defines for windows 64 bit\r\n24/4/2019  fixed beam empty cell\
  \ and data errors\r\n10/7/2019  fix spelling Normalisation \r\n           added standard about unit\r\
  \n5/2/2020   remove expiry check\r\n7//2/2020  fix save as file name error\r\n           update statusbar\
  \ messaging system and refactor\r\n           implemented login module\r\n28/2/2020  remove definitions\
  \ from beam unit and use from opfunit\r\n17/3/2020  add refresh linac list on beam module exit\r\n24/3/2020\
  \  store all beam config files automatically in program config dir\r\n           look in program data\
  \ confid dir first for beam file\r\n16/4/2020  fix various memory leaks\r\n3/8/2020   correct title\
  \ of login module\r\n18/11/2022 fix double free causing exception on new patient\r\n           fix special\

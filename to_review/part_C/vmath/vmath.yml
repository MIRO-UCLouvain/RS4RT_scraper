readme_excerpt: " # VMATH: A header only library for numpy like operation on C++ vector. \n \nThe main\
  \ goal of this library is to offer a light-weight tool which mimics NUMPY like operation on C++ vector.\
  \ For simple addition and subtraction, we always need to write for-loops in C++. It would be nice to\
  \ do these operation like NUMPY. This library also contains some useful math operations, e.g. matmul,\
  \ cross_product, dot_product, transpose etc. \n \n ## Installation\n Copy header  file in your source\
  \ directory and include into your cpp file. \n \n ## Usages: \n \n ### 1. Overloading operators\n \n\
  \ This library contains various operator overloading to avoid writing explicit for-loop, \n \n **Example-1:**\
  \ Vector addition \n ```cpp\n #include \"vmath.h\" \n \n // Without vmath\n for (int i=0; i<n;++i){\n\
  \    A[i] = B[i] + C; \n }\n // With vmath\n A = B + C; \n ```\n \n **Example-2:** Overloading console\
  \ output \"<<\"\n ```cpp\n //Without vmath\n for (int i=0;i<n;++i)\n     std::cout<< A[i]<< \" \";\n\
  \ std::endl; \n \n //With vmath \n std::cout<< A << std::endl;\n ```\n \n Following operators can be\
  \ overloaded using vmath.h\n + Addition: +, +=\n + Subtraction: -, -=\n + Multiplication: *, *=\n +\
  \ Division: /, /=\n\n### 2. Vector initialization like Numpy \n\n```cpp\n\n// Get a vector/matrix initialized\
  \ with 1 and size of n;\nstd::vector<float> vec = vmath::ones<float>(n); \nvmath::matrix<float> mat\
  \ = vmath::ones<float>(n1,n2); \n\n// Get vector/matrix  with randomly initialized  values (0.0 to 1.0)\n\
  std::vector<float> vec= vmath::random<float>(n); \nvmath::matrix<float> mat= vmath::random<float>(n1,n2);\
  \ \n\n// Get a vector/matrix initialized with 0 and size of n;\nstd::vector<float> vec = vmath::zeros<float>(n);\
  \ \nvmath::matrix<float> mat = vmath::zeros<float>(n1,n2); \n```\n\n### 3. Vector cross_product, dot_product,\
  \ sum, argmin, argmax \n```cpp\nvector<float> u = {1,2,3};\nvector<int> v = {3,2,1};\n\n\n//cross_product\n\
  std::cout << vmath::cross_product(v,u) <<std::endl;\n\n//dot_product\nstd::cout << vmath::dot_product(v,u)\
  \ <<std::endl;\n\n//sum  \nstd::cout << vmath::sum(u) << std::endl; \n\n//argmin \nstd::cout << vmath::argmin(v)\
  \ <<std::endl;\n\n//argmax\nstd::cout << vmath::argmax(v) <<std::endl;\n```\n\n\n### 4. Matrix multiplication/transpose\n\
  \n```cpp\n// Defining matrix     \nvmath::matrix<float> mat0=vmath::random<float>(5000,300);\nvmath::matrix<float>\
  \ mat1=vmath::random<float>(300,600);\n\n// Multiply    \nvmath::matrix<float> reslt= vmath::matmul(mat0,mat1);\n\
  \n// Transpose \nvmath::matrix<float> reslt= vmath::transpose(mat0);\n```\n\n\n\n\n\n\n\n"

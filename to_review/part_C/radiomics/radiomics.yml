readme_excerpt: "# Radiomics\n\n\nThis page is for sharing the radiomics code for researchers and reviewers.\n\
  \nThe code in the \"HCC_adv_recur\" folder implements the complete data processing and feature extraction\
  \ pipeline for the research study titled:\n\"Predicting Advanced-Stage Recurrence in Resected Hepatocellular\
  \ Carcinoma Using Preoperative Gadoxetic Acid-Enhanced MRI Radiomics.\" \n * The primary objective of\
  \ this workflow is to extract, process, and standardize quantitative radiomic features from pre-operative,\
  \ multi-phase gadoxetic acid-enhanced MRI scans. The resulting feature set is intended for use in developing\
  \ predictive models.\n"

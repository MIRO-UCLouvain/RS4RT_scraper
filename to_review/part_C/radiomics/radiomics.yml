readme_excerpt: "\n   \n\nA detailed documentation about how to use RaCaT and how to run it from source\
  \ can be found in the documentation folder. However, here a short overview:\n\nIn order to make the\
  \ RaCaT run from source, follow the following steps:\n\n1. Clone Radiomics repository\n\nDownload the\
  \ files of this repository.\n\n2. Get CMake\n   CMake can be downloaded here: https://cmake.org/install/\n\
  \n3. Get ITK\n     Windows\n    Here we only describe the installation using Microsoft Visual Studio.\
  \ For all other compilers, check: https://itk.org/Wiki/ITK/Getting_Started/Build/Windows\n    - Launch\
  \ CMake GUI \n    - Go to field \"Where is the source code:\", click \"Browse Source...\" and navigate\
  \ to where you cloned the repository with Git.\n    - Go to \"Where to build the binaries:\", select\
  \ \"Browse Build...\" and select a place to build the ITK library. It should NOT be the same directory\
  \ as the one where you cloned the repository.\n    - Click \"Configure\", and then specify \"Visual\
  \ Studio x\" as the generator for this project.\n    - Choose your build options\n    - Click \"Generate\"\
  .\n    - Open Visual Studio x and open the ALL_BUILD project that is in the folder where you built the\
  \ ITK project\n    - Click F5 (run solution)\n    3.2 Linux\n    - Download the ITK source code: https://itk.org/ITK/resources/software.html\n\
  \    - unpack tarball: sudo tar xvzf InsightToolkit-3.14.0.tar.gz\n    - Create a directory, where ITK\
  \ should be built, e.g: sudo mkdir /usr/local/itk/InsightToolkit-3.14.0/ITK-build\n    - Go to this\
  \ directory and run ccmake: sudo ccmake -DITK_USE_REVIEW=ON \n    - Press \"c\" to configure and \"\
  g\" to generate\n    - Then you can run ITK: sudo make\n    - Then you can install ITK: sudo make install\n\
  \n4. Get boost version 1_70_0 (thats important as the newer version have some problems with ITK!)\n\
  \   The Radiomics Toolbox needs also the boost library. Download the source code from here: http://www.boost.org/users/history/version_1_61_0.html\
  \ and unpack the folder.\n   We have to install some boost libraries:\n   - Go to the folder, where\
  \ you unpacked the boost libraries\n   - Go to the directory tools\\build\\.\n   - Run bootstrap.bat\n\
  \   - Run b2 install --prefix=PREFIX where PREFIX is the directory where you want Boost.Build to be\
  \ installed\n   - Add PREFIX\\bin to your PATH environment variable.\n\n   Boost is installed.\n\n5.\
  \ Use CMakeList to configure, generate and compile Radiomics.exe\n   In order to run the radiomics code\
  \ with the libraries, the following CMakeLists.txt file is required:\n   The /PATH/TO elements have\
  \ to be replaced by the corresponding paths on your computer.\n   \n    cmake_minimum_required(VERSION\
  \ 2.8)\n    \n    project(Radiomics)\n    \n    SET (BOOST_ROOT /PATH/TO/BOOST)\n    \n    SET (BOOST_LIBRARYDIR\
  \ \"/PATH/TO/BOOST/stage/lib\")\n    \n    SET (BOOST_MIN_VERSION \"1.55.0\")\n    \n    set (Boost_NO_BOOST_CMAKE\
  \ ON)\n    \n    FIND_PACKAGE(Boost ${BOOST_MIN_VERSION} REQUIRED)\n    \n    if (NOT Boost_FOUND)\n\
  \    \n      message(FATAL_ERROR \"Fatal error: Boost (version >= 1.55) required.\")\n    \n    else()\n\
  \     \n     message(STATUS \"Setting up BOOST\")\n     \n     message(STATUS \" Library  - ${Boost_LIBRARY_DIRS}\"\
  )\n     \n     include_directories(${Boost_INCLUDE_DIRS})\n     \n     link_directories(${Boost_LIBRARY_DIRS})\n\
  \    \n    endif (NOT Boost_FOUND)\n    \n    find_package(ITK REQUIRED)\n    \n    include(${ITK_USE_FILE})\n\
  \    \n    add_executable(Radiomics MACOSX_BUNDLE /PATH/TO/radiomics-master/main.cpp)\n    \n    target_link_libraries(Radiomics\n\
  \    \n    ${Boost_LIBRARIES} ${Glue}  ${VTK_LIBRARIES} ${ITK_LIBRARIES})\n\n\n   Open the CMAKE GUI.\n\
  \n6. Run Radiomics.exe\n"

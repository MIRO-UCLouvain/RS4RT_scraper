readme_excerpt: "# OpenPINT\n\n**OpenPINT — Open-source Planning for Isoeffective Nuclear Treatments**\n\
  \nOpenPINT is an open-source treatment planning system for nuclear therapies that integrates Monte Carlo\
  \ dose calculations with modular dosimetric and radiobiological models for photon-isoeffective dose\
  \ evaluation.\n\n## Key Features\n- Convert MCNP and PHITS mesh tallies into BNCT dose component volumes\
  \ (`bin/sim_result_2_nifti.py`, `bin/sim_PHITS_result_2_nifti.py`).\n- Aggregate and weight multiple\
  \ BNCT irradiation fractions (`bin/bnct_fractions_sum.py`).\n- Resample hadron therapy dose maps and\
  \ convert to biologically effective dose (`bin/hadron_dose_2_bed.py`).\n- Build BNCT treatment plans\
  \ from structured Excel workbooks and compute dose, TCP, NTCP, and DVH metrics (`OpenPINT/treatment.py`).\n\
  - Generate limiting-organ masks from CT volumes and exclusion masks (`bin/nib_organ_at_risk.py`).\n\n\
  ## Installation\nOpenPINT targets Python 3.9 or newer.\n\n### From PyPI (after publication)\n```bash\n\
  python3 -m pip install OpenPINT\n```\n\nTo include support for Excel treatment-plan files:\n```bash\n\
  python3 -m pip install \"OpenPINT[excel]\"\n```\n\n### From GitHub\n```bash\npython3 -m pip install\
  \ \"git+https://github.com/ipostuma/OpenPINT.git\"\n```\n\nTo include support for Excel treatment-plan\
  \ files:\n```bash\npython3 -m pip install \"OpenPINT[excel] @ git+https://github.com/ipostuma/OpenPINT.git\"\
  \n```\n\nTo install a specific branch, tag, or commit, append its Git reference:\n```bash\npython3 -m\
  \ pip install \"git+https://github.com/ipostuma/OpenPINT.git@main\"\n```\n\n### From a local clone\n\
  ```bash\npython3 -m venv .venv\nsource .venv/bin/activate\npython3 -m pip install --upgrade pip\npython3\
  \ -m pip install .\n```\n\nTo include support for Excel treatment-plan files:\n```bash\npython3 -m pip\
  \ install \".[excel]\"\n```\n\nFor an editable development installation:\n```bash\npython3 -m pip install\
  \ -e \".[excel]\"\n```\n\n### Using Conda\n```bash\nconda create -n openpint python=3.9\nconda activate\
  \ openpint\nconda install -c conda-forge --file requirements.txt\npython3 -m pip install --no-deps .\n\
  ```\n\n> **Excel support**: Reading treatment plans from XLSX files relies on the optional `openpyxl`\
  \ dependency, installed by the `excel` extra. It remains listed in `requirements.txt` for the Conda\
  \ workflow.\n\n## Usage\nThe toolkit can be used from the command line or as a Python library. All CLI\
  \ scripts live in `bin/` and expect the repository root on `PYTHONPATH` (handled internally by the scripts).\n\
  \n### CLI scripts in `bin/`\n- `sim_result_2_nifti.py`: Reads an MCNP mesh tally file, maps it to the\
  \ CT geometry using the provided simulation box shape/offset, and writes BNCT component volumes (`*_B10.nii.gz`,\
  \ `*_N14.nii.gz`, `*_n.nii.gz`, `*_g.nii.gz`).\n- `sim_PHITS_result_2_nifti.py`: Same conversion workflow\
  \ as above for PHITS outputs, using four mesh files provided in fixed component order (`B10`, `N14`,\
  \ `n`, `g`).\n- `bnct_fractions_sum.py`: Loads a fractions CSV (`w`, `B10`, `N14`, `n`, `g` columns),\
  \ computes weighted averages across fractions, and saves one summed NIfTI per component.\n- `bnct_tp_eval.py`:\
  \ Loads a BNCT plan from Excel and prints treatment-evaluation metrics, including limiting OAR irradiation\
  \ time, dose components at the limiting point, maximum IsoE dose, and TCP summaries.\n- `hadron_dose_2_bed.py`:\
  \ Resamples a hadron dose map to the planning CT grid and converts physical dose to BED using the provided\
  \ fraction count and alpha/beta ratio.\n- `nib_mask_subtract.py`: Performs voxel-wise mask subtraction\
  \ (`mask1 \\\\ mask2`) to generate a shell-like mask and saves it as `<mask1>-<mask2>_shell.nii.gz`.\n\
  - `nib_organ_at_risk.py`: Builds a limiting-organ mask by excluding air below a CT threshold and excluding\
  \ voxels from masks listed in a CSV (`mask_path`, `foreground_value`).\n\n### Import the package\nThe\
  \ primary Python import namespace is `OpenPINT`. The former\n`BNCTDosimetry` namespace remains available\
  \ temporarily as a deprecated\ncompatibility wrapper. After installation, `OpenPINT` can be imported\
  \ from any\nworking directory without setting `PYTHONPATH`.\n\n### Converting MCNP tallies\n```bash\n\
  python3 bin/sim_result_2_nifti.py \\\n    path/to/mcnp_msh.out \\\n    path/to/ct_scan.nii.gz \\\n \
  \   100 100 120 \\\n    12 12 48 \\\n    -o output_prefix\n```\nThis command produces `output_prefix_{B10,N14,n,g}.nii.gz`\
  \ volumes aligned with the CT image.\n\n### Summing BNCT fractions\n```bash\npython3 bin/bnct_fractions_sum.py\
  \ \\\n    path/to/fractions_folder \\\n    fractions.csv \\\n    --time_normalization 30.0 \\\n    --output_path\
  \ results/\n```\n`fractions.csv` must contain the dose component filenames and weighting factors for\
  \ each fraction.\n\n### Resampling hadron dose maps\n```bash\npython3 bin/hadron_dose_2_bed.py \\\n\
  \    hadron_dose.nii.gz \\\n    planning_ct.nii.gz \\\n    30 \\\n    2.0 \\\n    --output_path results/\n\
  ```\nThe script resamples the hadron dose to the CT grid and stores an `_BED.nii.gz` file.\n\n### Python\
  \ API example\n```python\nfrom OpenPINT.treatment import BNCT\n\nplan = BNCT(\"patient_plan.xlsx\")\n\
  plan.set_irradiation_time()\nisoe_dose = plan.get_isoeffective_dose(n=1)\ntcp = plan.get_TCP(\"HN_Rwigema_Gonzalez\"\
  )\nprint(\"Max IsoE dose:\", isoe_dose.max())\nprint(\"TCP values:\", tcp)\n```\n\n### Synthetic patient\
  \ generation\n```python\nfrom OpenPINT import SyntheticPatientGenerator, save_masks\n\ngenerator = SyntheticPatientGenerator(\n\
  \    shape=(120, 120, 120),\n    spacing=(1.0, 1.0, 1.0),\n    patient_radius_mm=30,\n    cylinder_height_mm=90,\n\
  \    sphere_radius_mm=10,\n    sphere_distance_mm=5,\n    skull_thickness_mm=5,\n    skin_thickness_mm=3,\n\
  )\n\nmasks = generator.generate_masks()\nsave_masks(masks, \"./outputs\", scale_mm=(1.0, 1.0, 1.0))\n\
  ```\n\n### Input data expectations\n- Dose and mask volumes must be provided as NIfTI files (`*.nii`\
  \ or `*.nii.gz`).\n- BNCT treatment plans are stored in Excel with worksheets `ct`, `GTV`, `CTV`, `PTV`,\
  \ `HOM`, and `dose` (see `OpenPINT/treatment.py`).\n- Monte Carlo mesh outputs must follow the formats\
  \ parsed by `OpenPINT/dose/io/read_mcnp_mesh.py` or `OpenPINT/dose/io/read_phits_mesh.py`.\n\n## Contributing\n\
  Contributions are welcome! Please read [CONTRIBUTING.md](CONTRIBUTING.md) for guidelines on developing,\
  \ testing, and submitting changes.\n\n## Testing\nAutomated tests can be run with Python's built-in\
  \ unittest:\n```bash\npython -m unittest discover -s tests\n```\n\n## Changelog\nRelease history is\
  \ documented in [CHANGELOG.md](CHANGELOG.md).\n\n## Code of Conduct\nWe expect everyone participating\
  \ in the project to follow the [Code of Conduct](CODE_OF_CONDUCT.md).\n\n## Disclaimer\nThis software\
  \ is not a certified medical device or clinical treatment-planning system. It is intended for research,\
  \ education, and methodological validation only. It must not be used for clinical decision-making, patient\
  \ treatment, or regulatory submissions without independent validation, commissioning, quality assurance,\
  \ and applicable regulatory approval.\n\n## License\nThis project is licensed under the European Union\
  \ Public Licence v1.2 (EUPL-1.2). See [LICENSE](LICENSE) for the full text and [THIRD_PARTY_NOTICES.md](THIRD_PARTY_NOTICES.md)\
  \ for bundled third-party licenses.\n\n## Roadmap & To-Do\n- Expand testing coverage for radiobiological\
  \ models and CLI scripts.\n- Extend documentation with end-to-end examples using sample datasets.\n\
  - Publish an initial tagged release and register a DOI via INFN Open Access Repository.\n\nIf you build\
  \ something with OpenPINT or have ideas for improvements, open an issue or start a discussion!\n"

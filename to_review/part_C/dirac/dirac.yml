readme_excerpt: "# Unsupervised Deformable Image Registration with Absent Correspondences in Pre-operative\
  \ and Post-Recurrence Brain Tumor MRI Scans\nThis is the official Pytorch implementation of \"Unsupervised\
  \ Deformable Image Registration with Absent Correspondences in Pre-operative and Post-Recurrence Brain\
  \ Tumor MRI Scans\" (MICCAI 2022), written by Tony C. W. Mok and Albert C. S. Chung.\n\n## Prerequisites\n\
  - `Python 3.5.2+`\n- `Pytorch 1.3.0 - 1.9.1`\n- `NumPy`\n- `NiBabel`\n- `Scipy`\n\nThis code has been\
  \ tested with `Pytorch 1.10.0` and NVIDIA TITAN RTX GPU.\n\n## Inference\n\nInference for DIRAC:\n```\n\
  python BRATS_test_DIRAC.py\n```\n\nInference for DIRAC-D:\n```\npython BRATS_test_DIRAC_D.py\n```\n\n\
  ## Train your own model\nStep 1: Download the BraTS-Reg dataset from https://www.med.upenn.edu/cbica/brats-reg-challenge/\n\
  \nStep 2: Define and split the dataset into training and validation set, i.e., 'Dataset/BraTSReg_self_train'\
  \ and 'Dataset/BraTSReg_self_valid', respectively.\n\nStep 3: `python BRATS_train_DIRAC.py` to train\
  \ the DIRAC model or `python BRATS_train_DIRAC_D.py` to train the DIRAC-D model.\n\n## Publication\n\
  If you find this repository useful, please cite:\n- **Unsupervised Deformable Image Registration with\
  \ Absent Correspondences in Pre-operative and Post-Recurrence Brain Tumor MRI Scans**  \n[Tony C. W.\
  \ Mok](https://cwmok.github.io/ \"Tony C. W. Mok\"), Albert C. S. Chung  \nMICCAI 2022. [eprint arXiv:2206.03900](https://arxiv.org/abs/2206.03900)\n\
  \n- **Conditional Deformable Image Registration with Convolutional Neural Network**  \n[Tony C. W. Mok](https://cwmok.github.io/\
  \ \"Tony C. W. Mok\"), Albert C. S. Chung  \nMICCAI 2021. [eprint arXiv:2106.12673](https://arxiv.org/abs/2106.12673)\n\
  \n###### Keywords\nKeywords: Absent correspondences, Patient-specific registration, Deformable registration"

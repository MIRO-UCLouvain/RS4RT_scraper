readme_excerpt: "![screenshots1](images/fishimage3.jpg?raw=true)\n\n# Fish Toxicity Analysis and Prediction\n\
  Welcome to ML_Fish_Toxicity_Predictor, an open-source data analysis and machine learning project! This\
  \ repository hosts a comprehensive analysis of a real-world dataset, showcasing the entire data science\
  \ pipeline from data exploration to model building.\n\n\n## Modules/Libraries\n* Scikit-learn\n* MatPlotLib\n\
  * Statistics\n* Numpy\n* Pandas\n* Seaborn\n* Scipy\n\n## # Dataset Overview\n#### The dataset comprises\
  \ several molecular descriptors used to predict Fish Toxicity (LC50). The features include:\n##### *\
  \ MLOGP (Molar Log P): This is a measure of the compound's lipophilicity, often represented as the logarithm\
  \ of the octanol/water partition coefficient (log P). Lipophilicity is a key factor in bioaccumulation\
  \ and permeability through biological membranes, which can directly influence a compound's toxicity.\n\
  \n##### * CIC0 (Information Indices): These are topological indices derived from the molecular graph\
  \ of the compound. They provide information about the compound's molecular structure without explicit\
  \ reference to 3D shape. Such indices often correlate with various physicochemical properties and biological\
  \ activities.\n\n##### * GATS1i (2D Autocorrelations): Geary Autocorrelation of lag 1 weighted by ionization\
  \ potential. It's a 2D autocorrelation descriptor that captures information about molecular topology\
  \ and electron distribution. This descriptor can be related to how a molecule interacts with biological\
  \ targets.\n\n##### * NdssC (Atom-Type Counts - Sulfur): This descriptor counts the number of sulfur\
  \ atoms in the molecule. The presence of certain types of atoms (like sulfur) can influence the reactivity\
  \ and hence the toxicity of a molecule.\n\n##### * NdsCH (Atom-Type Counts - CH Groups): This refers\
  \ to the count of specific types of carbon-hydrogen groups in the molecule. The structure and count\
  \ of such groups can affect a molecule's physical and chemical properties, influencing its biological\
  \ activity.\n\n##### * SM1_Dz(Z) (2D Matrix-Based Descriptors): This is a descriptor derived from a\
  \ 2D matrix representation of the molecular structure. It typically captures information about the spatial\
  \ arrangement of atoms or functional groups within the molecule, influencing its chemical behavior and\
  \ interactions in a biological context.\n\n\n\n## Univariate Analysis / Skewness / Distributions\n\n\
  ![screenshots1](images/skewimage.png?raw=true)\n\n### CIC0         0.045458\n### M1_Dz(Z)    0.695090\n\
  ### GATS1i       0.723107\n### NdssC        3.400815\n### NdsCH        2.239090\n### MLOGP       -0.035191\n\
  \n## Skewness Analysis\n#### The skewness values and the corresponding histograms for each feature (excluding\
  \ the target variable) are as follows:\n\n#### MLOGP:\n\n#### Skewness: -0.03\n#### The distribution\
  \ appears fairly symmetrical, as indicated by the low skewness value.\n#### CIC0:\n\n#### Skewness:\
  \ 0.04\n#### This shows a moderate right skew. A transformation might help in normalizing this distribution.\n\
  #### GATS1i:\n\n#### Skewness: 0.72\n#### Similar to CIC0, this feature also has a moderate right skew.\n\
  #### NdssC:\n\n#### Skewness: 3.40\n#### This feature shows a high positive skewness, indicating a strong\
  \ right skew. A transformation is likely needed.\n#### NdsCH:\n\n#### Skewness: 2.24\n#### Another highly\
  \ positively skewed distribution, suggesting the need for transformation.\n#### SM1_Dz(Z):\n\n#### Skewness:\
  \ 0.70\n#### The distribution is almost symmetrical.\n\n### Boxplot to check for outliers.\n\n![screenshots1](images/boxplots.png?raw=true)\n\
  #### Box Plots: The box plots for \"NdssC\" and \"NdsCH\" against the target variable (fish toxicity)\
  \ provide insights into the central tendency and spread of the target variable across different categories.\
  \ They also highlight outliers in each category.\n\n#### Violin Plots: The violin plots give a more\
  \ detailed view of the target variable's distribution across different categories of \"NdssC\" and \"\
  NdsCH\". The width of the violin plot at different values indicates the density of data points, offering\
  \ a more nuanced understanding of the distribution.\n\n#### These visualizations are particularly useful\
  \ for discrete variables as they reveal patterns and distributions that might not be evident in scatter\
  \ plots. They can also guide feature engineering and selection in machine learning models, indicating\
  \ which categories of these discrete variables have more influence on the target variable.\n\n## Bi-Variate\
  \ Analysis\n#### Strip plots show you where the data is dense at.\n![screenshots1](images/striplot.png?raw=true)\n\
  ![screenshots1](images/pairplot.png?raw=true)\n![screenshots1](images/facetgrid.png?raw=true)\n\n\n\
  ## * Scatter plots of each feature against Fish Toxicity show diverse patterns, suggesting different\
  \ levels of linear or nonlinear relationships.\n## The correlation matrix indicates the degree of linear\
  \ relationship between features and with Fish Toxicity. For instance, some features might have a moderate\
  \ positive or negative correlation with Fish Toxicity, suggesting their potential influence in predicting\
  \ toxicity.\n![screenshots1](images/correlation.png?raw=true)\n## Facet Grid (MLOGP vs Fish Toxicity\
  \ by NdssC):\n\n#### A series of scatter plots, each representing a different value of \"NdssC\", showing\
  \ the relationship between \"MLOGP\" and Fish Toxicity.\n##### Finding: This grid allows for the comparison\
  \ of relationships across different \"NdssC\" categories. It may reveal whether the relationship between\
  \ \"MLOGP\" and Fish Toxicity changes with different atom-type counts.\n\n![screenshots1](images/facetgrid.png?raw=true)\n\
  \n### Facet Grids and Joint Plots\n### Facet grids and joint plots allowed for a detailed examination\
  \ of relationships between specific pairs of features and Fish Toxicity, across different categories\
  \ of other features (like \"NdssC\").\n![screenshots1](images/jointplot.png?raw=true)\n\n## 3D Plots\n\
  ## 3D visualizations provided an enhanced view of the interactions among multiple molecular descriptors,\
  \ offering insights into the complex relationships that might influence Fish Toxicity.\n\n![screenshots1](images/3d.png?raw=true)\n\
  ![screenshots1](images/3d2.png?raw=true)\n![screenshots1](images/3d3.png?raw=true)\n![screenshots1](images/3d4.png?raw=true)\n\
  ![screenshots1](images/3d5.png?raw=true)\n\n## Machine Learning Modeling \n\n\n\n\n\n\n\n\n\n\n## Interpretation:\n\
  ### The Random Forest Regression model shows the best performance among the three, with the lowest MSE\
  \ and RMSE, and the highest R-squared value. This indicates it's better at capturing the complexity\
  \ and non-linear relationships in the data.\n```python\nfrom sklearn.linear_model import LinearRegression,\
  \ Ridge\nfrom sklearn.ensemble import RandomForestRegressor\nfrom sklearn.metrics import mean_squared_error,\
  \ r2_score\nimport numpy as np\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing\
  \ import StandardScaler\nimport pandas as pd\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\
  \ndata = pd.read_csv('data/fish_transformed.csv')\n# Separating features and target\nX = data.drop('Fish\
  \ Toxicity', axis=1)\ny = data['Fish Toxicity']\n\n# Standardizing the features\nscaler = StandardScaler()\n\
  X_scaled = scaler.fit_transform(X)\n\n# Splitting the dataset into the Training set and Test set\nX_train,\
  \ X_test, y_train, y_test = train_test_split(X_scaled, y, test_size=0.2, random_state=42)\n\n# Initialize\
  \ the models\nlinear_model = LinearRegression()\nridge_model = Ridge(alpha=1.0)\nrandom_forest_model\
  \ = RandomForestRegressor(n_estimators=100, random_state=42)\n\n# Function to train and evaluate a model\n\
  def train_evaluate_model(model, X_train, y_train, X_test, y_test):\n    # Training the model\n    model.fit(X_train,\
  \ y_train)\n\n    # Predicting the Test set results\n    y_pred = model.predict(X_test)\n\n    # Evaluating\
  \ the model\n    mse = mean_squared_error(y_test, y_pred)\n    rmse = np.sqrt(mse)\n    r2 = r2_score(y_test,\
  \ y_pred)\n\n    return mse, rmse, r2\n\n# Training and evaluating Linear Regression\nlinear_mse, linear_rmse,\
  \ linear_r2 = train_evaluate_model(linear_model, X_train, y_train, X_test, y_test)\n\n# Training and\
  \ evaluating Ridge Regression\nridge_mse, ridge_rmse, ridge_r2 = train_evaluate_model(ridge_model, X_train,\
  \ y_train, X_test, y_test)\n\n# Training and evaluating Random Forest Regression\nrf_mse, rf_rmse, rf_r2\
  \ = train_evaluate_model(random_forest_model, X_train, y_train, X_test, y_test)\n\n# Print the results\n\
  print(\"Linear Regression: MSE =\", linear_mse, \", RMSE =\", linear_rmse, \", R^2 =\", linear_r2)\n\
  print(\"Ridge Regression: MSE =\", ridge_mse, \", RMSE =\", ridge_rmse, \", R^2 =\", ridge_r2)\nprint(\"\
  Random Forest Regression: MSE =\", rf_mse, \", RMSE =\", rf_rmse, \", R^2 =\", rf_r2)\n\nLinear Regression:\
  \ MSE = 1.0463821653353844 , RMSE = 1.0229282307842444 , R^2 = 0.5675170258323361\nRidge Regression:\
  \ MSE = 1.0463854210971713 , RMSE = 1.0229298221760725 , R^2 = 0.56751568018484\nRandom Forest Regression:\
  \ MSE = 1.0331873061963945 , RMSE = 1.0164582166505391 , R^2 = 0.572970627884436\n\n```\n\n### Both\
  \ the Linear Regression and Ridge Regression models have similar performance metrics, with relatively\
  \ higher MSE and RMSE, and lower R-squared values compared to the Random Forest model. This could suggest\
  \ that the relationship between the predictors and the target variable has non-linear aspects that these\
  \ linear models are not fully capturing.\n![screenshots1](images/Lregression.png?raw=true)\n![screenshots1](images/modelcoeffecientvisuals.png?raw=true)\n\
  ### The R-squared values for all models are moderate, indicating that while the models have some predictive\
  \ power, there's still room for improvement. Feature engineering, model tuning, or trying different\
  \ modeling approaches might help to increase the predictive performance.\n"

readme_excerpt: "# README\n\nCe dépôt contient :\n1. **radio.cpp** : code C++ qui résout un système M1\
  \ avec plusieurs méthodes et flux.\n2. **Scripts Python** pour le post-traitement :\n   - `tracer_cas_discontinus.py`\
  \ : trace les résultats pour le cas discontinu (cas=3).\n   - `tracer_solutions_cas1_cas2.py` : trace\
  \ les solutions cas=1 et cas=2, flux HLL ou Rusanov.\n   - `tracer_courbes_erreurs.py` : trace l’erreur\
  \ L1 en fonction de \\(h\\) (analyse d’ordre).\n\n## 1. Compilation et exécution du code C++\n```bash\n\
  g++ -O2 -std=c++17 radio.cpp -o radio.exe\n./radio\n```\n- Génère `results.csv` (infos globales, erreurs)\
  \ et des fichiers CSV de solutions (ex.: `solution_hll_cas1.csv`, etc.).\n\n## 2. Visualisation des\
  \ résultats\n- **Cas discontinu** :  \n  ```bash\n  python tracer_cas_discontinus.py\n  ```\n  Produit\
  \ `discontinuous_case_std_plot.png` et `discontinuous_case_proj_plot.png`.\n- **Cas 1 et cas 2** : \
  \ \n  ```bash\n  python tracer_solutions_cas1_cas2.py\n  ```\n  Compare solution exacte et méthodes\
  \ pour flux HLL ou Rusanov (`.csv`).\n- **Erreurs L1 (log-log)** :  \n  ```bash\n  python tracer_courbes_erreurs.py\n\
  \  ```\n  Produit `error_hll.png` et `error_rusanov.png` à partir de `results.csv`.\n\n## Remarque:\n\
  \ Le code prend un peu de temps pour effectuer tous les tests. Cependant vous pouvez commenter diminuer\
  \ le Nx, ou commenter des tests si vous voulez les résultats pour un seul test.\n"

readme_excerpt: "# PSMA-1007 PET/CT Bone Lesion Radiomics Classifier\n\nThis repository contains the data,\
  \ models, and evaluation code for the multicenter study predicting metastatic vs. non-metastatic bone\
  \ uptakes (UBUs) on \\[18F\\]PSMA-1007 PET/CT in prostate cancer patients using a radiomics-based machine\
  \ learning pipeline.\n\n## Repository Structure\n\n* `data/`: Contains the fully isolated, anonymized\
  \ feature matrices used for model development and evaluation.\n\n  * `train_features.csv`: Multicenter\
  \ training cohort (80% internal).\n\n  * `val_features.csv`: Multicenter validation cohort for hyperparameter\
  \ tuning and early stopping (20% internal).\n\n  * `calib_features.csv`: Subset of the external center\
  \ used exclusively for threshold calibration.\n\n  * `test_features.csv`: Fully independent external\
  \ test cohort.\n\n* `models/`: Contains the trained PyTorch Multi-Layer Perceptron (MLP) ensembles.\n\
  \n  * `mlp_radiomics_ensemble/`: The primary multidimensional radiomics model.\n\n* `src/`: Contains\
  \ the Python scripts for evaluating the models and extracting predictions.\n\n## Requirements\n\nThe\
  \ code requires Python 3.8+ and the following dependencies. You can install them using the provided\
  \ `requirements.txt`:\n\n```\npip install -r requirements.txt\n\n```\n\n## Usage\n\nThe evaluation script\
  \ handles data loading, PyTorch model instantiation, ensemble probability averaging, threshold calibration,\
  \ and metric generation.\n\nTo evaluate the primary radiomics ensemble on the external test set:\n\n\
  ```\npython src/evaluate_ensemble.py --model_dir models/mlp_radiomics_ensemble --calib_file data/calib_features.csv\
  \ --test_file data/test_features.csv\n\n```\n\n\n*(Note: Adjust the file paths accordingly based on\
  \ your exact dataset nomenclature).*\n\n## Hardware Requirements\n\nThe code is optimized for both CPU\
  \ and GPU execution. It will automatically detect and utilize a CUDA-enabled GPU if available. No specialized\
  \ hardware is required to run the inference scripts, though a CUDA-compatible GPU will accelerate the\
  \ PyTorch model evaluation.\n\n## License\n\nRaw imaging data (DICOM) are restricted due to patient\
  \ privacy regulations (GDPR) and are not included in this repository.\n\nThe code and anonymized dataset\

readme_excerpt: "# Osteoradionecrosis (ORN) Prognosis Tool\n\nA compiled R Shiny application designed\
  \ to predict the individualized risk of Osteoradionecrosis (ORN) in Head and Neck Cancer (HNC) patients\
  \ treated with Intensity-Modulated Radiation Therapy (IMRT).\n\nThis tool utilizes a survival analysis\
  \ model to generate Cumulative Incidence Functions (CIF) and employs SHAP (SHapley Additive exPlanations)\
  \ values to interpret specific risk factors for individual patients.\n\n## Features\n\n* **Individualized\
  \ Risk Prediction:** Calculates the Cumulative Incidence of ORN (ClinRad grade 1 or higher) while accounting\
  \ for death as a competing risk.\n* **Interactive Visualizations:**\n    * **CIF Curve:** Dynamic Plotly\
  \ graph showing risk trajectory from 0 to 114 months.\n    * **Reference Overlay:** Option to compare\
  \ the patient against the institutional average (mean CIF).\n* **Explainable AI (XAI):** Uses a SHAP\
  \ Force Plot to visualize how specific patient features (e.g., Smoking history, D10cc) push the risk\
  \ higher or lower compared to the baseline.\n* **Fast Computation:** Implements a Gower-distance nearest-neighbor\
  \ algorithm to approximate SHAP values from a precomputed grid, ensuring instant results without heavy\
  \ real-time processing.\n\n## Prerequisites\n\nTo run this application, you need **R** installed. The\
  \ following R packages are required:\n\n```r\ninstall.packages(c(\n  \"shiny\",\n  \"shinythemes\",\n\
  \  \"survival\",\n  \"riskRegression\",\n  \"fastshap\",\n  \"shapviz\",\n  \"ggplot2\",\n  \"prodlim\"\
  ,\n  \"gower\",\n  \"plotly\"\n))\n"

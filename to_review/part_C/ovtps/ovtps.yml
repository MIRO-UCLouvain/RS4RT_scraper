readme_excerpt: "# Towards Optimal Patch Size in Vision Transformers for Tumor Segmentation\n\nThis repository\
  \ is associated with the peer-reviewed MMMI 2022 paper on selecting a vision-transformer patch size\
  \ for liver-tumor segmentation.\n\n<!-- repository-guide:start -->\n## At a glance\n\n[Peer-reviewed\
  \ paper](https://doi.org/10.1007/978-3-031-18814-5_11) · [Open manuscript](https://arxiv.org/abs/2308.16598)\
  \ · [`CITATION.cff`](CITATION.cff)\n\n### Package evidence\n\n| Evidence source | Finding |\n|---|---|\n\
  | Dependency manifests | None present |\n| Source-code imports | None; no implementation is committed\
  \ |\n| `Data` | One-byte newline placeholder, not a dataset |\n\n### Reproducibility boundary\n\nThis\
  \ branch is a bibliographic research landing page. It contains no executable preprocessing, training,\
  \ inference, or evaluation path, so an implementation pipeline cannot be derived without inventing unsupported\
  \ details. Consult the paper for the reported method and retain the existing artifact-release checklist\
  \ for any future code release.\n<!-- repository-guide:end -->\n\n## Repository status\n\nThe current\
  \ repository snapshot is a bibliographic landing page, not a reproducible software release. It contains:\n\
  \n- this `README.md`;\n- `CITATION.cff`; and\n- `Data`, a one-byte empty placeholder file.\n\nIt does\
  \ **not** currently contain source code, executable notebooks, model definitions, environment files,\
  \ trained weights, preprocessing scripts, experiment configurations, split definitions, or research\
  \ data. Results from the paper therefore cannot be reproduced from this snapshot alone.\n\n## Associated\
  \ publication\n\nRamtin Mojtahedi, Mohammad Hamghalam, Richard K. G. Do, and Amber L. Simpson. “Towards\
  \ Optimal Patch Size in Vision Transformers for Tumor Segmentation.” In *Multiscale Multimodal Medical\
  \ Imaging (MMMI 2022)*, Lecture Notes in Computer Science, vol. 13594, pp. 110–120. Springer, 2022.\n\
  \n- Publisher record and DOI: <https://doi.org/10.1007/978-3-031-18814-5_11>\n- Open manuscript on arXiv:\
  \ <https://arxiv.org/abs/2308.16598>\n- First author ORCID: <https://orcid.org/0000-0002-3953-3256>\n\
  \nThe repository’s earlier description used the working title “Tumor Segmentation in Colorectal Liver\
  \ Metastasis Using an Optimal Vision Transformer Patch Size.” The canonical published title is the one\
  \ shown above.\n\n## Data and reproduction\n\nConsult the paper for the study design, datasets, preprocessing,\
  \ model configuration, and evaluation procedure. No dataset or data-access mechanism is included here.\
  \ In particular, the empty `Data` placeholder must not be interpreted as released research data, and\
  \ access to any clinical or restricted data described in the paper must follow the original provider’s\
  \ approvals and terms.\n\nA future reproducible release should identify exact dataset versions and access\
  \ routes and include, at minimum:\n\n1. preprocessing and quality-control scripts;\n2. split files or\
  \ deterministic split rules;\n3. a pinned software environment;\n4. training and inference entry points;\n\
  5. experiment configurations, random seeds, and checkpoint provenance; and\n6. evaluation scripts with\
  \ expected outputs.\n\nUntil those artifacts are present, please use this repository only as a pointer\
  \ to the publication and open manuscript.\n\n## Citation\n\nPlease cite the peer-reviewed paper rather\
  \ than the repository landing page:\n\n```bibtex\n@incollection{mojtahedi2022optimalpatch,\n  author\
  \    = {Mojtahedi, Ramtin and Hamghalam, Mohammad and Do, Richard K. G. and Simpson, Amber L.},\n  title\
  \     = {Towards Optimal Patch Size in Vision Transformers for Tumor Segmentation},\n  booktitle = {Multiscale\
  \ Multimodal Medical Imaging},\n  series    = {Lecture Notes in Computer Science},\n  volume    = {13594},\n\
  \  pages     = {110--120},\n  publisher = {Springer Nature Switzerland},\n  year      = {2022},\n  doi\
  \       = {10.1007/978-3-031-18814-5_11},\n  url       = {https://doi.org/10.1007/978-3-031-18814-5_11}\n\
  }\n```\n\nMachine-readable citation metadata is also provided in `CITATION.cff`.\n\n## Rights and reuse\n\
  \nNo `LICENSE` file is present, and this README does not grant a software, data, or content license.\
  \ Copyright and other rights remain with their respective holders. The paper, arXiv manuscript, and\
  \ any third-party datasets are each governed by their own terms. Contact the repository owner before\
  \ reusing repository material beyond what applicable law permits.\n\n## Contact\n\nFor questions about\
  \ the work or a possible artifact release, contact the author through the [Ramtin-Mojtahedi GitHub profile](https://github.com/Ramtin-Mojtahedi)\
  \ or [ORCID record](https://orcid.org/0000-0002-3953-3256).\n"

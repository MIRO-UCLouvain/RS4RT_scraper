readme_excerpt: "# Open-Full-Jaw Dataset Repository\n> An open-access dataset and nearly-automated pipeline\
  \ for generating finite element models of the human jaw ([ link to the article](https://www.sciencedirect.com/science/article/pii/S0169260722003911)\
  \ )\n\n### Table of contents\n* [Motivation](#motivation)\n* [Content of the repository](#content-of-the-repository)\n\
  * [How to cite us](#how-to-cite-us)\n* [How to install](#how-to-install)\n* [How to use](#how-to-use)\n\
  * [Features](#features)\n* [Funding](#funding)\n* [Acknowledgements](#acknowledgements)\n\n## Motivation\n\
  Developing accurate patient-specific computational models of the human jaw acquired from cone-beam computed\
  \ tomography (CBCT) scans is labor-intensive and non-trivial. In addition, it involves time-consuming\
  \ unreproducible manual procedures. Hence, we share an open-access dataset of 17 patient-specific computational\
  \ models of human jaws and the utilized pipeline for generating them.\n\n## Content of the repository\n\
  This repository comprises **17 patient-specific computational models of human jaws (including the mandible,\
  \ maxilla, their associated teeth, and PDL meshes, as well as teeth principal axes)** and the utilized\
  \ **code** for generating them.\n\n\n### 1. Dataset\n\n![dataset_gallery_named](https://user-images.githubusercontent.com/30265621/172655083-a12f4842-aaa8-4a69-be95-2cfde6063008.png)\n\
  \n:warning: Please make sure to install [git lfs](https://git-lfs.github.com/) on your system before\
  \ cloning the repository.\n\nThe [dataset](https://github.com/diku-dk/Open-Full-Jaw/tree/main/dataset)\
  \ includes:\n1. [Clinically validated segmented geometries](https://github.com/diku-dk/Open-Full-Jaw/tree/main/images)\
  \ in form of unprocessed dense surface meshes that can be imported to different meshing tools\n2. The\
  \ quality and adaptive volumetric meshes to be used directly in FE simulations\n3. The reduced surface\
  \ meshes with no undesired gaps/penetrations\n4. The principal axes of every patient's teeth that provides\
  \ great information for setting up different scenarios automatically\n5. The automatically generated\
  \ FEM files for tipping scenario and a biting scenario\n  \n\n### 2. Code for reproducibility of dataset\n\
  \n6. The python code utilized for generating the volumetric meshes and producing the simulation files\
  \ is shared in this repository. A summary of the pipeline is illustrated as follows\n\n![](https://user-images.githubusercontent.com/30265621/168096619-a86fc97d-3887-49eb-a05e-590ac90d8822.png)\n\
  High resolution PDF format: [graphical abstract](./images/graphical_abstract_final.pdf)\n\n## How to\
  \ cite us\nIf you use the content of this repository please consider to cite us as below,\n\n```bibtex\n\
  @article{gholamalizadeh2022open,\n  title     = {Open-Full-Jaw: An open-access dataset and pipeline\
  \ for finite element models of human jaw},\n  author    = {Gholamalizadeh, Torkan and Moshfeghifar,\
  \ Faezeh and Ferguson, Zachary and Schneider, Teseo and Panozzo, Daniele and Darkner, Sune and Makaremi,\
  \ Masrour and Chan, Fran{\\c{c}}ois and S{\\o}ndergaard, Peter Lampel and Erleben, Kenny},\n  journal\
  \   = {Computer Methods and Programs in Biomedicine},\n  volume    = {224},\n  pages     = {107009},\n\
  \  year      = {2022},\n  publisher = {Elsevier}\n}\n\n```\n\n\n## How to install\n\n#### Setting up\
  \ the conda environment and the required packages\n\nThe first step is to set up your conda environment\
  \ for running the jupyter notebook as below: \n```python\nconda create -n fulljaw\nconda activate fulljaw\n\
  conda config --add channels conda-forge\n```\nNext, install the following packages in the fulljaw environment:\n\
  ```python\nconda install igl\nconda install jupyter\nconda install meshio\nconda install meshplot\n\
  conda install -c anaconda scikit-image\n```\n#### Other Dependencies\n:bangbang: **You need to install\
  \ [PyMesh](https://github.com/PyMesh/PyMesh) by cloning the repository and building it on your machine.**\n\
  \n:bangbang: **Note that our pipeline uses fTetWild as a backbone for volumetric mesh generation. Therefore,\
  \ you need to install the [fTetWild](https://wildmeshing.github.io/ftetwild/) by cloning the repository\
  \ and building it on your machine in a desired directory.**\n\n## How to use\nFirst, activate the environment,\
  \ then run jupyter notebook: \n```python\nconda activate fulljaw\njupyter notebook\n```\nNow you can\
  \ open and run the [pipeline.ipynb](https://github.com/diku-dk/Open-Full-Jaw/blob/main/src/Pipeline.ipynb),\
  \ which is an interactive python code, shared in the \"src\" folder, for reproducing the models of this\
  \ dataset or generating new models for your own input data.\n\n:warning: Make sure to update the \"\
  path_ftetwild\" variable in [pipeline.ipynb](https://github.com/diku-dk/Open-Full-Jaw/blob/main/src/Pipeline.ipynb)\
  \ with the path of fTetwild's binary file, e.g.,\n\npath_ftetwild = '/your_desired_directory/fTetWild/build/FloatTetwild_bin'\n\
  \n\n## Features\n\n#### Params of step1 (Preprocessing and Smoothing)\n* ***preprocess_bone_eps:***\
  \ The epsilon value for fTetWild used in preprocessing of the bone mesh.\n* ***preprocess_bone_l:***\
  \ The edge_length value for fTetWild used in preprocessing of the bone mesh.\n* ***preprocess_teeth_eps:***\
  \ The epsilon value for fTetWild used in preprocessing of the teeth mesh.\n* ***preprocess_teeth_l:***\
  \ The edge_length value for fTetWild used in preprocessing of the teeth mesh.\n* ***preprocess_smooth_bone_iter:***\
  \ The number of iterations for smoothing the bone.\n* ***preprocess_smooth_bone_stepsize:*** The step\
  \ size used for smoothing the bone.\n\n#### Params of step2 (Gap Generation)\n* ***gap_thickness:***\
  \ The gap thickness which indicates the average width of the PDL layer.\n\n#### Params for step3 (PDL\
  \ Rim Generation)\n* ***rim_distance_rest:*** The gap distance used in for selecting the base on all\
  \ teeth sockets except for molars.\n* ***rim_distance_molars:*** The gap distance used in for selecting\
  \ the base on molars' sockets.\n* ***rim_thickness_factor:*** The constant which will be multiplied\
  \ by the distance between two surfaces.\n* ***rim_trim_iter:*** The number of times the trimming step\
  \ should be performed on the detected base.\n* ***rim_smooth_iter_base:*** The number of times the smoothing\
  \ step should be performed on the boundary of the detected base.\n* ***rim_smooth_iter_extruded_base:***\
  \ The number of times the smoothing step should be performed on the boundary of the extruded base.\n\
  \n#### Params for step4 (Multi-Domain Volumetric Meshing)\n* ***volume_mesh_eps:*** The epsilon value\
  \ for fTetWild in multi-material meshing step.\n* ***volume_mesh_l:*** The edge_length value for fTetWild\
  \ in multi-material meshing step.\n* ***volume_mesh_json_path:*** The directory where the json file\
  \ for CSG operation will be stored.\n\n#### Params for step5 (Tetrahedra Filtering) \n* ***tet_filtering_dist:***\
  \ The distance used for filtering the tetrahedra to get the intersection of teeth and bone hollows.\
  \ \n\n#### Params for step6 (Simulation Setup)\n\n\n#### Summery of params and their default values:\n\
  :warning:  Note that we have used identical values for most of the abovementioned parameters across\
  \ all patients to prepare the Open-Full-Jaw dataset. Only a few of the parameters marked below (with\
  \  \U0001F6A7 ) were used to adapt the pipeline's result to the patient-specific geometries.\n\n```python\n\
  # params for step1( preprocessing and smoothing step)\npreprocess_bone_eps  =  1e-4  # fTetWild's default\
  \ value for the epsilon: 1e-3\npreprocess_bone_l    =  0.02  # fTetWild's default value for the ideal_edge_length:\
  \ 0.02\npreprocess_teeth_eps =  1e-4\npreprocess_teeth_l   =  0.01\npreprocess_smooth_bone_iter  = \
  \ 10\npreprocess_smooth_bone_stepsize  =  0.0005\n\n# params for step2( gap generation step)\ngap_thickness\
  \        =  0.2\ngap_tooth_bone_ratio =  0.5\n\n# params for step3( PDL rim generation step)\nrim_distance_rest\
  \    =  0.26   \U0001F6A7 \nrim_distance_molars  =  0.28   \U0001F6A7 \nrim_thickness_factor =  1\n\
  rim_trim_iter        =  2\nrim_smooth_iter_base =  16   \U0001F6A7\nrim_smooth_iter_extruded_base  =\
  \ 10   \U0001F6A7\n\n# params for step4( multi-domain volumetric mesh generation step)\nvolume_mesh_json_path\
  \       =  mid_o_dir + 'logical_operation.json'\nvolume_mesh_output_fname    =  'unified'\nvolume_mesh_operation_type\
  \  =  'union'\nvolume_mesh_eps             =  2e-4\nvolume_mesh_l               =  0.05       \n\n#\
  \ params for step5( tetrahedra filtering step) \ntet_filtering_dist  =  0.3   \U0001F6A7\n\n# general\
  \ params for fTetWild\nself.verbose_level  =  3\nself.max_iter       =  20\nself.ftet_path      =  path_ftetwild\n\
  self.output_dir     =  mid_o_dir \n```\n## Funding\n- This project has received funding from the European\
  \ Union's Horizon 2020 research and innovation program under the Marie Sklodowska-Curie grant agreement\
  \ No. 764644. This paper only contains the authors' views, and the Research Executive Agency and the\

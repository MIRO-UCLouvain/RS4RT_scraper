readme_excerpt: "# Toxicity Prediction using Molecular Descriptors\n\nThis repository contains a machine\
  \ learning pipeline to predict chemical toxicity (**Toxic** vs. **Non-Toxic**) based on molecular descriptors.\
  \ The project addresses the challenges of high-dimensional data and class imbalance using robust feature\
  \ selection and ensemble modeling.\n\n## \U0001F4CC Project Overview\n\nThe goal of this project is\
  \ to build a binary classifier that identifies the toxicity class of chemical compounds. The dataset\
  \ presents a \"High Dimension, Low Sample Size\" (HDLSS) problem, featuring over $1,200$ descriptors\
  \ for only $171$ samples.\n\n### Key Challenges:\n- **Feature Redundancy:** Many chemical descriptors\
  \ are highly correlated ($>0.95$).\n- **Dimensionality:** The number of features ($p=1204$) significantly\
  \ exceeds the number of observations ($n=171$).\n- **Class Imbalance:** Non-Toxic samples ($104$) outnumber\
  \ Toxic samples ($67$).\n\n## \U0001F6E0️ Methodology\n\n### 1. Exploratory Data Analysis (EDA)\n- **Distribution\
  \ Analysis:** Evaluated the balance between `Toxic` and `Non-Toxic` classes.\n- **Null Value Inspection:**\
  \ Confirmed a clean dataset with no missing values.\n- **Statistical Profiling:** Analyzed the range\
  \ and variance of molecular descriptors to understand feature scaling needs.\n\n### 2. Data Preprocessing\n\
  - **Target Encoding:** Converted categorical labels (`NonToxic` $\\rightarrow$ 0, `Toxic` $\\rightarrow$\
  \ 1).\n- **Constant Feature Removal:** Eliminated features with zero variance.\n- **Multicollinearity\
  \ Filter:** Removed $562$ features with a correlation coefficient $> 0.95$ to reduce redundancy and\
  \ improve model stability.\n\n### 3. Feature Selection\nTo prevent overfitting and the \"Curse of Dimensionality,\"\
  \ a model-based feature selection strategy was implemented:\n- **Algorithm:** Random Forest Importance.\n\
  - **Selection:** Retained the top $50$ features based on their relative contribution to the model's\
  \ Gini impurity reduction.\n\n### 4. Modeling & Evaluation\n- **Base Model:** Random Forest Classifier\
  \ (Ensemble Model).\n- **Class Handling:** Utilized `class_weight='balanced'` to ensure the model penalizes\
  \ misclassifications of the minority (Toxic) class.\n- **Validation:** 5-Fold Stratified Cross-Validation\
  \ to ensure results are robust across different data subsets.\n- **Metrics:** Tracked Accuracy, Precision,\
  \ Recall, and F1-Score.\n\n## \U0001F4CA Results Summary\n\n| Metric | Score (Mean $\\pm$ Std) |\n|\
  \ :--- | :--- |\n| **Accuracy** | $64.32\\% \\pm 5.7\\%$ |\n| **Precision** | $41.33\\% \\pm 16.6\\\
  %$ |\n| **Recall** | $18.03\\% \\pm 10.1\\%$ |\n| **F1-Score** | $24.33\\% \\pm 12.4\\%$ |\n\n**Top\
  \ Predictors:** The most influential descriptors identified include `SpMAD_Dt`, `ZMIC1`, `SpAD_Dt`,\
  \ and `MDEC-23`.\n\n## \U0001F4C1 Repository Structure\n\n```text\n├── data.csv                # Raw\
  \ dataset containing molecular descriptors\n├── toxicity_analysis.py    # Python script with full EDA\
  \ and Modeling\n├── README.md               # Project documentation\n└── plots/                  # Generated\
  \ visualizations\n    ├── feature_importance.png\n    ├── confusion_matrix.png\n    └── class_distribution.png\n"

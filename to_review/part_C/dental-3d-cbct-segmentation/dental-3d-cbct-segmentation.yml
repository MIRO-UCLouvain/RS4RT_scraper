readme_excerpt: '# CBCT Knowledge Experiments


  This repository contains CBCT segmentation experiments, knowledge-driven training notebooks, and supporting
  PyTorch modules.


  ## Contents


  - `layers.py` - custom PyTorch layers, including a ConvLSTM implementation.

  - `cbct_knowledge/` - notebooks and CBCT segmentation code.

  - `cbct_knowledge/cbctsegmentation/pytorch_bcnn/` - reusable segmentation model, loss, data, inference,
  updater, and visualization modules.


  ## Notes


  - Generated Python caches, local notebook checkpoints, macOS metadata, archives, model checkpoints,
  and experiment outputs are ignored by Git.

  - Keep raw datasets and large trained weights outside the repository, or publish them separately with
  a data link.


  ## Getting Started


  Create a Python environment, install the project dependencies used by the notebooks, and run the notebooks
  from the repository root.


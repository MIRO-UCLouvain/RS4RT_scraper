readme_excerpt: "# ПРОГНОЗИРОВАНИЕ ТОКСИЧНОСТИ ХИМИЧЕСКИХ СОЕДИНЕНИЙ\n\n## Введение\nНа сегодняшний день\
  \ химическое пространство оценивается уже в 10^60 малых молекул. Поиск химических структур, обладающих\
  \ целевыми показателями, в таком огромном массиве довольно затруднителен. Химикам необходимы новые методы\
  \ навигации и фильтрации химического пространства.\n\n## Цель\tработы\nРазработка группы моделей классификации\
  \ и регрессии для прогнозирования различных метрик токсичности химических соединений.\n\n## Проектная\
  \ команда\n\n|                            | Телеграм       | GitHub             |\n| --------------------------\
  \ | -------------- | ------------------ |\n| Ядыкин Данил Андреевич     | @kikongoro     | Kikongo \
  \           |\n| Гайдукова Дарья Дмитриевна | @darigd        | DariGD             |\n| Токарев Владислав\
  \ Павлович | @Vladislav_T02 | VladislavTokarev02 |\n| Бугров Артем (куратор)     | @temofeychenko |\
  \ bugor40            |\n\n\n## Основные этапы для достижения цели\n\n1) Сбор известных данных от токсичности\
  \ химических соединений (до 20.10.2024)\n2) Генерация физико-химических дескрипторов и EDA по ним (до\
  \ 11.11.2024)\n3) Построение первых ML моделей (до 01.12.2024)\n4) Дополнительная генерация признаков\
  \ и улучшение текущих моделей (до 01.02.2025)\n5) Сервис над готовыми моделями (до 01.04.2025)\n6) Эксперименты\
  \ с DL (до 15.05.2025)\n\nПодробнее план см. в [checkpoints.md](checkpoints.md)\n\nОписание процесса\
  \ Команды 86 см. в [docs/workflow/REAMDE.md](docs/workflow/REAMDE.md)\n"

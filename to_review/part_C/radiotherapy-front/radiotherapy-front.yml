readme_excerpt: "# Next.js & HeroUI Template\n\nThis is a template for creating applications using Next.js\
  \ 14 (app directory) and HeroUI (v2).\n\n[Try it on CodeSandbox](https://githubbox.com/heroui-inc/heroui/next-app-template)\n\
  \n## Technologies Used\n\n- [Next.js 14](https://nextjs.org/docs/getting-started)\n- [HeroUI v2](https://heroui.com/)\n\
  - [Tailwind CSS](https://tailwindcss.com/)\n- [Tailwind Variants](https://tailwind-variants.org)\n-\
  \ [TypeScript](https://www.typescriptlang.org/)\n- [Framer Motion](https://www.framer.com/motion/)\n\
  - [next-themes](https://github.com/pacocoursey/next-themes)\n\n## How to Use\n\n### Use the template\
  \ with create-next-app\n\nTo create a new project based on this template using `create-next-app`, run\
  \ the following command:\n\n```bash\nnpx create-next-app -e https://github.com/heroui-inc/next-app-template\n\
  ```\n\n### Install dependencies\n\nYou can use one of them `npm`, `yarn`, `pnpm`, `bun`, Example using\
  \ `npm`:\n\n```bash\nnpm install\n```\n\n### Run the development server\n\n```bash\nnpm run dev\n```\n\
  \n### Setup pnpm (optional)\n\nIf you are using `pnpm`, you need to add the following code to your `.npmrc`\
  \ file:\n\n```bash\npublic-hoist-pattern[]=*@heroui/*\n```\n\nAfter modifying the `.npmrc` file, you\
  \ need to run `pnpm install` again to ensure that the dependencies are installed correctly.\n\n## License\n\
  \nLicensed under the [MIT license](https://github.com/heroui-inc/next-app-template/blob/main/LICENSE).\n\
  #\0 \0s\0i\0g\0n\0a\0t\0u\0r\0e\0\r\0\n\0"

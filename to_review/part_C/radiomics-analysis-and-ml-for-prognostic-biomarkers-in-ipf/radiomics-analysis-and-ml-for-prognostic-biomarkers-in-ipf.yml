readme_excerpt: "# Radiomics-Analysis-and-ML-for-Prognostic-Biomarkers-in-IPF\nThis repository contains\
  \ the code for my master’s thesis on predicting Forced Vital Capacity (FVC) one year after baseline\
  \ for Idiopathic Pulmonary Fibrosis (IPF) patients using clinical features, radiomic features from HRCT,\
  \ and a combined radiomic + clinical (RC) setting.\nThe workflow includes image preprocessing, automated\
  \ segmentation, radiomics extraction, feature selection pipelines, and regression models (Elastic Net,\
  \ Partial Least Squares, Random Forest) with basic interpretability.\n\n# Dataset (OSIC Pulmonary Fibrosis)\n\
  \n## Source\nThis project uses the **OSIC Pulmonary Fibrosis dataset** (Open Source Imaging Consortium).\n\
  The dataset is **not included in this repository** due to size restrictions.\n\n## Contents\nThe dataset\
  \ includes:\n- **HRCT scans** (anonymized) for IPF patients\n- **Clinical metadata** collected over\
  \ time (longitudinal measurements such as FVC)\n\n## Pipeline Overview\n\n![Pipeline Overview](https://github.com/YashodharPansuriya/Radiomics-Analysis-and-ML-for-Prognostic-Biomarkers-in-IPF/blob/main/Images/IPF_Pipeline.PNG)\n\
  \n\n## Setup\n\nClone the repository and install the dependencies:\n\n```bash\ngit clone <your-repo-url>\n\
  cd <your-repo-folder>\n\npython -m venv .venv\nsource .venv/bin/activate   \n\npip install -r requirements.txt\n\
  ```\n\n## Repository Overview\n\nThis repository is organized according to the workflow used in the\
  \ thesis.  \nEach folder represents one major step of the pipeline, from patient cohort selection to\
  \ model training and result generation.\n\n### Folder descriptions\n\n- **`Patients_Data_Exploration`**\
  \  \n  Contains scripts for selecting the patient cohort from the OSIC dataset that is relevant to the\
  \ thesis objective.\n\n- **`Image_Preprocessing&Segmentation`**  \n  Code for image preprocessing and\
  \ automated lung segmentation (mask generation) used before radiomics extraction.\n\n- **`Radiomics_Extraction`**\
  \  \n  Script to extract radiomic features from segmented HRCT scans (e.g., using PyRadiomics).\n\n\
  - **`EDA&Feature_selection`**  \n  Scripts for exploratory analysis of clinical variables (missing values,\
  \ distributions, and correlations) and for implementing multiple feature selection pipelines (P1–P6)\
  \ as well as the full feature set.\n\n- **`Model_Training`**  \n  Training and evaluation code for regression\
  \ models:\n  - Elastic Net (EN)\n  - Partial Least Squares (PLS)\n  - Random Forest (RF)\n\n- **`Trained_models`**\
  \  \n  Contains the saved trained models (EN, PLS, RF) for all predictor configurations used in the\
  \ thesis: clinical-only (C), radiomics-only (R), and combined radiomics + clinical (RC). It also includes\
  \ models trained on the reduced RC feature subsets generated by the feature-selection pipelines (P1–P6).\n\
  \n- **`Radiomics_files`**  \n  Contains CSV files with the extracted radiomics features computed from\
  \ the segmented HRCT images. These files are used as inputs for feature selection and model training.\n\
  \n---\n\n## Recommended execution order (to reproduce results)\n\nRun the folders in this order:\n\n\
  1. `Patients_Data_Exploration`\n2. `Image_Preprocessing&Segmentation`\n3. `Radiomics_Extraction`\n4.\
  \ `EDA&Feature_selection`\n5. `Model_Training`\n"

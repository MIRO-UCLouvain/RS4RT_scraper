readme_excerpt: "---\ntitle: AI MRI Tumor Analysis\nemoji: \U0001F9E0\ncolorFrom: blue\ncolorTo: red\n\
  sdk: streamlit\nsdk_version: 1.35.0\napp_file: app.py\npinned: false\n---\n\n# \U0001F9E0 NeuroSeg —\
  \ MRI Brain Tumour Segmentation via Deep Learning\n\nA Deep Learning-based Medical Image Segmentation\
  \ system that detects and segments brain tumor regions from MRI scans using the U-Net architecture and\
  \ Computer Vision techniques.\n\nThe project is deployed as a live AI web application using Streamlit\
  \ and HuggingFace Spaces.\n\n---\n\n# \U0001F680 Live Demo\n\n\U0001F310 Live Application:  \nhttps://devspace152004-ai-mri-tumor-analysis.hf.space\n\
  \n---\n\n# \U0001F4CC Project Overview\n\nThis project focuses on Brain Tumor Segmentation using MRI\
  \ images to identify tumor regions accurately through semantic segmentation.\n\nThe system uses a U-Net\
  \ model with a ResNet34 encoder trained on MRI datasets to generate tumor masks and overlay visualizations\
  \ in real-time.\n\nThe application assists in:\n- Medical image analysis\n- Tumor region visualization\n\
  - Deep Learning-based segmentation workflows\n- AI-powered diagnostic support systems\n\n---\n\n# ✨\
  \ Features\n\n✅ MRI Brain Tumor Segmentation  \n✅ U-Net + ResNet34 Architecture  \n✅ Real-time Tumor\
  \ Mask Prediction  \n✅ Tumor Overlay Visualization  \n✅ Confidence Score Display  \n✅ Dice Loss + BCE\
  \ Loss Optimization  \n✅ Streamlit-based Interactive Web App  \n✅ Live Deployment on HuggingFace Spaces\
  \  \n\n---\n\n# \U0001F6E0️ Tech Stack\n\n| Category | Technologies |\n|---|---|\n| Programming | Python\
  \ |\n| Deep Learning | PyTorch |\n| Segmentation | U-Net |\n| Computer Vision | OpenCV |\n| Data Augmentation\
  \ | Albumentations |\n| Deployment | Streamlit + HuggingFace Spaces |\n| Visualization | Matplotlib\
  \ |\n| Model Library | segmentation_models_pytorch |\n\n---\n\n# \U0001F9E0 Model Architecture\n\n-\
  \ U-Net Segmentation Architecture\n- ResNet34 Encoder Backbone\n- Binary Semantic Segmentation\n- Dice\
  \ Loss + BCE Loss\n- Pixel-wise Tumor Prediction\n\n---\n\n# \U0001F4CA Model Performance\n\n| Metric\
  \ | Performance |\n|---|---|\n| Dice Score | 87% |\n| Loss Function | Dice Loss + BCE Loss |\n| Segmentation\
  \ Type | Binary Segmentation |\n\n---\n\n# \U0001F4C2 Dataset Used\n\n### LGG MRI Segmentation Dataset\n\
  Used for training and validation of tumor segmentation masks.\n\n### BraTS Dataset\nUsed for experimentation\
  \ and evaluation purposes.\n\nThe datasets contain:\n- Brain MRI images\n- Ground truth tumor masks\n\
  - Segmentation annotations\n\n---\n\n# \U0001F504 AI Workflow Pipeline\n\n```text\nMRI Scan\n   ↓\n\
  Image Preprocessing\n   ↓\nData Augmentation\n   ↓\nU-Net Deep Learning Model\n   ↓\nTumor Segmentation\n\
  \   ↓\nMask Generation\n   ↓\nOverlay Visualization\n```\n\n---\n\n\n\n# \U0001F5BC️ Sample Outputs\n\
  \n## \U0001F9E0 Full Web Application\n\n![app UI](sample_outputs/app_ui.png)\n\n---\n\n## \U0001F9E0\
  \ Original MRI\n\n![original_mri](sample_outputs/original_mri.jpg)\n\n---\n\n## \U0001F4CD Predicted\
  \ Tumor Mask\n\n![predicted_mask](sample_outputs/predicted_mask.jpg)\n\n---\n\n## \U0001F534 Tumor Overlay\
  \ Visualization\n\n![overlay_result](sample_outputs/overlay_result.jpg)\n---\n\n# ⚙️ Local Setup & Installation\n\
  \n## Clone Repository\n\n```bash\ngit clone https://github.com/DevShrivastava152004/Brain_Tumour_Segmentation.git\n\
  ```\n\n## Move into Project Directory\n\n```bash\ncd Brain_Tumour_Segmentation\n```\n\n## Install Dependencies\n\
  \n```bash\npip install -r requirements.txt\n```\n\n## Run Application\n\n```bash\nstreamlit run app.py\n\
  ```\n\n---\n\n# \U0001F310 Deployment\n\nThe project is deployed publicly using:\n\n- Streamlit\n- HuggingFace\
  \ Spaces\n\nDeployment includes:\n- AI inference pipeline\n- MRI upload support\n- Real-time tumor segmentation\n\
  - Interactive visualization interface\n\n---\n\n# \U0001F4C8 Future Scope\n\n- Attention U-Net Integration\n\
  - 3D MRI Segmentation\n- Multi-class Tumor Segmentation\n- Improved Medical Visualization\n- GPU-based\
  \ Inference Optimization\n- Clinical Workflow Integration\n\n---\n\n# \U0001F468‍\U0001F4BB Author\n\
  \n## Dev Shrivastava\n\nAI/ML Engineering Student focused on:\n- Deep Learning\n- Computer Vision\n\
  - Medical Imaging\n- AI Product Development\n\n---\n\n# ⭐ Support\n\nIf you found this project useful,\
  \ consider starring the repository.\n"

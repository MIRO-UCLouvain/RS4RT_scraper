readme_excerpt: "[![DOI](https://zenodo.org/badge/DOI/10.5281/zenodo.15979231.svg)](https://zenodo.org/records/15979231)\n\
  \n# DMRadiomics\n\n## Overview  \nScripts used to predict failure of active surveillance (AS) in desmoid-type\
  \ fibromatosis (DTF) using WORC (Workflow for Optimal Radiomics Classification): <PLACEHOLDER FOR ARTICLE\
  \ REFERENCE>\n\nBefore trying out the code in this repository, we advice you to get\nfamiliar with the\
  \ WORC package through the WORC tutorial:\nhttps://github.com/MStarmans91/WORCTutorial.\n\n## Licensing\n\
  This project is licensed under the open-source [APACHE 2.0 License](LICENSE).\n\nIf you use this code,\
  \ please cite both this repository and the associated publication as follows:\n<PLACEHOLDER FOR ARTICLE\
  \ REFERENCE>\n```bibtex\n@software{Spaanderman2025desmoidradiomicscode,\n  author       = {Douwe J.\
  \ Spaanderman and Martijn P. A. Starmans and Stefan Klein},\n  title        = {DMRadiomics},\n  year\
  \         = {2025},\n  publisher    = {Zenodo},\n  doi          = {10.5281/zenodo.15979231},\n  url\
  \          = {https://github.com/Douwe-Spaanderman/DMRadiomics}\n}\n```\n\nWe also encourage citing\
  \ the underlying WORC methodology as follows:\n```bibtex\n@article{starmans2021reproducible,\n   title\
  \          = {Reproducible radiomics through automated machine learning validated on twelve clinical\
  \ applications}, \n   author         = {Martijn P. A. Starmans and Sebastian R. van der Voort and Thomas\
  \ Phil and Milea J. M. Timbergen and Melissa Vos and Guillaume A. Padmos and Wouter Kessels and David\
  \    Hanff and Dirk J. Grunhagen and Cornelis Verhoef and Stefan Sleijfer and Martin J. van den Bent\
  \ and Marion Smits and Roy S. Dwarkasing and Christopher J. Els and Federico Fiduzi and Geert J. L.\
  \ H. van Leenders and Anela Blazevic and Johannes Hofland and Tessa Brabander and Renza A. H. van Gils\
  \ and Gaston J. H. Franssen and Richard A. Feelders and Wouter W. de Herder and Florian E. Buisman and\
  \ Francois E. J. A. Willemssen and Bas Groot Koerkamp and Lindsay Angus and Astrid A. M. van der Veldt\
  \ and Ana Rajicic and Arlette E. Odink and Mitchell Deen and Jose M. Castillo T. and Jifke Veenland\
  \ and Ivo Schoots and Michel Renckens and Michail Doukas and Rob A. de Man and Jan N. M. IJzermans and\
  \ Razvan L. Miclea and Peter B. Vermeulen and Esther E. Bron and Maarten G. Thomeer and Jacob J. Visser\
  \ and Wiro J. Niessen and Stefan Klein},\n   year           = {2021},\n   eprint         = {2108.08618},\n\
  \   archivePrefix  = {arXiv},\n   primaryClass   = {eess.IV}\n}\n\n@software{starmans2018worc,\n  author\
  \       = {Martijn P. A. Starmans and Thomas Phil and Sebastian R. van der Voort and Stefan Klein},\n\
  \  title        = {Workflow for Optimal Radiomics Classification (WORC)},\n  year         = {2018},\n\
  \  publisher    = {Zenodo},\n  doi          = {10.5281/zenodo.3840534},\n  url          = {https://github.com/MStarmans91/WORC}\n\
  }\n```\n\n## Quick Start  \n1. Clone repository:\n   ```bash\n   git clone https://github.com/Douwe-Spaanderman/DMRadiomics.git\n\
  \   ```\n2. Install requirements:\n    - Recommended to install below in virtual environment: ```python\
  \ -m venv venv```\n    - Install WORC:\n        ```bash\n        pip install WORC\n        ```\n   \
  \ - Install other requirements:\n        ```bash\n        pip install -r requirements.txt\n        ```\n\
  3. Run the analysis:\n    ```bash\n    python run.py -d /path/to/data -n experiment_name\n    ```\n\n\
  ## Input Data Structure\n\nOrganize your data as follows:\n\n```\ndata_folder/\n├── Patient_001/\n│\
  \   ├── image.nii.gz\n│   └── mask.nii.gz\n├── Patient_002/\n│   ├── image.nii.gz\n│   └── mask.nii.gz\n\
  └── labels.txt\n```\n\n- `image.nii.gz`: The imaging data (e.g., T1-weighted MRI).\n- `mask.nii.gz`:\
  \ Corresponding segmentation mask.\n- `labels.txt`: A tab-separated file containing patient IDs and\
  \ their associated labels.\n\n## Key Options\n\n| Argument | Description |\n|----------|-------------|\n\
  | `-d`     | Path to the data directory **(required)** |\n| `-n`     | Name for the experiment output\
  \ folder **(required)** |\n| `-s`     | MRI sequence to use (default: `T1`) |\n| `-l`     | Prediction\
  \ label (default: `PD`) |\n| `-co`    | Enable ComBat harmonization |\n\n## Output\n\nResults will be\
  \ saved in a folder named `WORC_[experiment_name]`, including:\n\n- Extracted features  \n- Model performance\
  \ metrics  \n- Trained machine learning models  \n- WORC configuration and logs\n\n## Full Documentation\n\
  \nFor detailed documentation, please refer to the [official WORC documentation \U0001F4DA]( https://worc.readthedocs.io/)\n"

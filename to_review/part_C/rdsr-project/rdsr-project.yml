readme_excerpt: "# RDSR Project\n\nA Tkinter-based interactive tool for filtering, analysing, visualising\
  \ and exporting DICOM radiation dose structured reports (RDSRs) in a readable format.  \n\n## Description\n\
  \nDoseSummaryApp is an interactive Python application that allows users to work with DICOM RDSRs to\
  \ extract data about imaging exposures. It offers features like dynamic filtering, summary statistics,\
  \ detection of multiple exposures for the same patient, histogram plotting, and exporting filtered results\
  \ — all inside a Tkinter interface. Designed for quick review of exposures and QA workflows, where efficient\
  \ filtering and visualisation of patient imaging exposures are important.\n\n## Getting Started\n\n\
  ### Dependencies\n\n* Python 3.7 or higher \n* tkinter (comes with Python standard library)\n* pandas\n\
  * plotly\n* pydicom\n* Works on Windows, macOS, and Linux\n\nInstall the necessary libraries: \n```\n\
  pip install -r requirements.txt\n```\n### Installing\n\n* Clone or download this repository to your\
  \ local machine. \n* No additional setup required if dependencies are installed.\n* Ensure your RDSR\
  \ files have PatientID and ContentDate data. \n\n### Executing program\n\n* Navigate to the project\
  \ folder. \n* Run the main application file (rdsr_summary.py) \n```\npython rdsr_summary.py\n```\nIn\
  \ the app: \n* Select a folder containing DICOM RDSR files.\n* Apply filters, view summary statistics,\
  \ plot histograms, detect multiple exposures, or export results. \n  \n## Help\n\n* Ensure your ContentDate\
  \ field is properly formatted (YYYYMMDD or a standard datetime string).\n* Non-numeric fields will be\
  \ automatically handled or skipped when plotting histograms.\n\n```\npython rdsr_summary.py --help\n\
  ```\n\n## Authors\n\nNabihah Rahman\n[@nabihah-rahman](https://github.com/nabihah-rahman)\n\n## Version\
  \ History\n\n* 0.2\n    * Updated documentation\n    * See [commit change]() or See [release history]()\n\
  * 0.1\n    * Initial release\n\n## License\n\nThis project is licensed under the MIT License - see the\
  \ LICENSE.md file for details\n"

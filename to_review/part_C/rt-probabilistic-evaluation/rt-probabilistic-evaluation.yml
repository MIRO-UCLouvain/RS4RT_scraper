readme_excerpt: '# Probabilistic Evaluation for Treatments Plans in Radiation Therapy


  This repository is the base module for performing probabilistic evaluation of optimized treatment plans
  in radiation therapy.

  The goal is to provide a clear visualisation and analysis of uncertainties affect the dose distribution
  and the clinical goals.

  This library is not made for optimization purposes, but rather for evaluation of already optimized plans
  to allow clinicians to make better-informed decisions on

  trade-offs between organ-at-risk sparing and target coverage under uncertainty.


  **This repository is not intended for clinical use.**'

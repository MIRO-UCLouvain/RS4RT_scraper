readme_excerpt: "# radiomics-HCC-immunophenotype\n\nPredicting the immune microenvironment (tumor-infiltrating\
  \ lymphocytes / tertiary\nlymphoid structures) of hepatocellular carcinoma (HCC) from pre-treatment,\n\
  multi-sequence MRI using radiomics and machine learning.\n\n## Overview\n\n- Extracts PyRadiomics features\
  \ from 9 MRI sequences per patient (pre-contrast,\n  arterial, portal venous, transitional/delayed,\
  \ hepatobiliary phase, T2, two DWI\n  b-values, and ADC), across original, LoG, and wavelet image transforms.\n\
  - Builds a binary classification pipeline — partition, feature selection,\n  hyperparameter tuning,\
  \ locked-set evaluation — around a TILs-based immunophenotype\n  endpoint, with a parallel pipeline\
  \ for a recurrence/survival endpoint.\n- Prioritizes methodological rigor over raw model complexity:\
  \ sequence-specific\n  bin-width calibration from noise estimates, inter-reader ICC filtering, leakage-safe\n\
  \  fold-specific feature selection, nested cross-validation for honest performance\n  estimates, and\
  \ bootstrap confidence intervals on a held-out lock set.\n- Compares eight model families (logistic\
  \ regression, linear/RBF SVM, random forest,\n  extra trees, XGBoost, Gaussian process, TabPFN) under\
  \ identical preprocessing.\n\n## Repository layout\n\n- `scripts/dicom_processing/` — raw DICOM to NRRD\
  \ conversion, sequence extraction,\n  ADC calculation, and other imaging preprocessing.\n- `scripts/radiomics_utils/`\
  \ — the core pipeline: feature extraction, extraction-setting\n  QC (bin-width calibration, ICC stability\
  \ analysis), the main modeling pipeline, and\n  sweep scripts for exploring cutoff/sequence-subset combinations.\n\
  - `scripts/radiomics_params.yaml` — PyRadiomics extraction configuration (image\n  filters, discretization,\
  \ normalization).\n- `docs/` — running notes on methodology decisions.\n\n## Data\n\nPatient imaging\
  \ and clinical data are not included in this repository and are handled\nseparately.\n\n## Built with\n\
  \nPython, PyRadiomics, SimpleITK, scikit-learn, XGBoost, TabPFN, pandas.\n"

readme_excerpt: "Introduction: \n\nTumor segmentation from computed tomography (CT) images plays a critical\
  \ role in clinical diagnosis,\ntreatment planning, radiotherapy guidance, and disease progress monitoring\
  \ (Sun et al., 2019). An\naccurate delineation of tumor boundaries enables quantitative assessment of\
  \ tumor progression\nand supports personalized cure strategies (Akakuru et al., 2022). However, manual\
  \ segmentation\nby radiologists is labor-intensive, time-consuming, and an observer variant, and so\
  \ motivates the\ndevelopment of automated segmentation methods (Nair et al., 2025).\n\nDespite recent\
  \ advances in medical image analysis, accurate and reliable tumor segmentation in CT\nscans remains\
  \ challenging due to heterogeneity in tumor morphology, low contrast between tumor\nand surrounding\
  \ tissues, imaging artifacts, inter-subject variability (Abdoli et al., 2026). In addition,\nsome tumors\
  \ may exhibit complex shapes and multi-scale spatial characteristics, making robust\nfeature extractions\
  \ difficult for conventional approaches (Abdusalamalov et al., 2023).\nDeep learning-based segmentation\
  \ frameworks, particularly convolutional neural networks (CNNs),\nhave demonstrated strong performance\
  \ in medical image segmentation tasks (Mienye et al., 2025).\nArchitectures such as U-Net and its variants\
  \ have become widely adopted due to their encoder-decoder\nstructure and ability to capture contextual\
  \ information (Yin et al., 2022) More recently, transformer-\nbased and hybrid CNN-transformer models\
  \ have further improved segmentation performance by\nmodeling long-range spatial dependencies and multi-scale\
  \ representations (Yousaf et al., 2026).\n\nAlthough recent deep learning frameworks have achieved strong\
  \ segmentation performance, many\nstate-of-the-art models require substantial computational resources\
  \ and long training times. In\npractical settings, lightweight architecture will offer advantages in\
  \ terms of efficiency, interpretability,\nand ease of deployment while still achieving competitive segmentation\
  \ performance (Rasheed, 2026).\nMotivated by this tradeoff, our work focuses on comparing a strong existing\
  \ segmentation framework\nwith simpler custom-designed architectures for liver tumor segmentation in\
  \ CT images.\nIn this work, we first utilized nnU-Net to perform supervised semantic segmentation on\
  \ CT scans of\nthe liver, with the purpose of segmenting tumors. We began by following nnU-Net’s preprocessing\n\
  pipeline, followed by using a 3D nnU-Net with 5-fold cross validation. We analyzed its performance\n\
  and compared it with that of our customized lightweight 2D segmentation architecture based on an\nencoder-decoder\
  \ U-Net Design with skip connections. The custom model processes individual 2D\naxial CT slices to reduce\
  \ memory usage and training time. These 2D slice segmentation were stacked\nto find the volume.\n"

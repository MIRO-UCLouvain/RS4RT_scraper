readme_excerpt: "# Kira (DICOM-RT-Anonymizer)\nAnonymize DICOM-RT files with ease. UIDs are also anonymized\
  \ without losing RT connections.\n\n![Test Image 6](https://github.com/Kiragroh/Kira_DICOM-RT-Anonymizer-MG/blob/main/GUIscreenshot.PNG)\n\
  \nI build this little tool named Kira because I could not find a sufficient free DICOM-Anonymizer that\
  \ works great with radiotherapy specific files.\nMost anonymizer have one of the following problems:\n\
  - RT connection specific UIDs will not be changed -> No import to the original TPS possible\n- RT connection\
  \ specific UIDs get broken -> No import for any TPS possible\n\nI think I was able to solve these problems.\
  \ :)\nIn addition, I give the option of changing the linac of RTPLAN files (LinacName, LinacID and ManufacturerModelName).\
  \ This can be necessary for TPS-Import of external plans.\n\nThe heavy work is done by EvilDicom (C#\
  \ package from Rex Cardan: https://github.com/rexcardan/Evil-DICOM). \nI highly recommend it.\n\nRequierements:\
  \  \n1.) Windows operating system  \n2.) run the .exe in the downloaded and then extracted folder  \n\
  3.) have 'Microsoft .NET Framework 4.5' installed. Usually, it is automatically installed on a windows\
  \ machine. On an internet PC, you will be prompted to install. Otherwise download here: https://www.microsoft.com/de-de/download/details.aspx?id=30653)\n\
  \nA future release will include two additional features:\n1.) CyberKnife conversion of RD-files for\
  \ frequently used TPS (Eclipse and co.).\n2.) Automatic generation of RP-Dummy-Plans.\n\nThis additional\
  \ features will make plan comparison studies much easier.\n\n![Test Image 6](https://github.com/Kiragroh/Kira_DICOM-RT-Anonymizer-MG/blob/main/Future.PNG)\n\
  \nNote:\n- absolute ESAPI-beginner should first look at my GettingStartedMaterial (collection of many\
  \ helpful stuff from me or others and even includes a PDF version of some ESAPI-OnlineHelps)\nhttps://drive.google.com/drive/folders/1-aYUOIfyvAUKtBg9TgEETiz4SYPonDOO\n"

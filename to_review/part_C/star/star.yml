readme_excerpt: "# STAR - Statistical Toolkit for Analysis of Radiotherapy DICOM Data\n\nPlease see the\
  \ accompanying paper and supplemental material for an overview of the capabilities of this software:\
  \ [Statistical Toolkit for Analysis of Radiotherapy DICOM Data](https://doi.org/10.1088/2057-1976/ade9cb)\n\
  \nAll code is contained and commented within [STAR.ipynb](https://github.com/m-kinz/STAR/blob/main/STAR.ipynb),\
  \ including instructions on how to navigate the notebook.\n\n## Installation\nTo use, please install\
  \ the following programs: \n\n- https://www.python.org/downloads/\n- https://code.visualstudio.com/download\
  \ (Recommended editor, install python notebook extension.)\n- Optional: https://learn.microsoft.com/en-us/sql/connect/odbc/download-odbc-driver-for-sql-server\
  \ (To connect to a SQL data base for including additional info in your data analysis (only needed if\
  \ you have one))\n- Optional: https://git-scm.com/downloads to clone or fork this repository. Alternatively,\
  \ only download the needed [STAR.ipynb](https://github.com/m-kinz/STAR/blob/main/STAR.ipynb) and [requirements.txt](https://github.com/m-kinz/STAR/blob/main/requirements.txt)\
  \ files.\n\nUse git in visual studio code to clone this repository, and set up a virtual python environment\
  \ when selecting a kernel for the opened notebook. In this environment, install all the needed packages\
  \ by using pip and the [requirements.txt](https://github.com/m-kinz/STAR/blob/main/requirements.txt).\n"

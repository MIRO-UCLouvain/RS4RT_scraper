readme_excerpt: "## Render deployment\n\n1. Push the repo to GitHub and create a new Render Web Service\
  \ from the repo, or use the included `render.yaml` blueprint.\n2. Set these environment variables in\
  \ Render: `DEEPGRAM_API_KEY`, `MONGO_URI`, `AZURE_TTS_KEY`, `AZURE_TTS_REGION`, and `PUBLIC_BASE_URL`.\n\
  3. Set `PUBLIC_BASE_URL` to your Render service URL, for example `https://your-service.onrender.com`.\n\
  4. Render will run `uvicorn main:app --host 0.0.0.0 --port $PORT` and expose `/health` for the health\
  \ check.\n5. Update your Twilio webhook to point to `https://your-service.onrender.com/select-language`.#\0\

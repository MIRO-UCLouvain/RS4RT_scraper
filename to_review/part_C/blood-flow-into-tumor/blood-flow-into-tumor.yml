readme_excerpt: '# Blood-flow-into-tumor

  This work was published in **Experimental and Computational Multiphase Flow**. You can find it [here](https://link.springer.com/content/pdf/10.1007/s42757-022-0150-x.pdf).


  We first build a biomimetic model of blood flow into a pancreatic tumor using experimental images as
  reference. A typical geometry will look like below:


  ![image](https://github.com/nilot-pal/Blood-flow-into-tumor/assets/72824334/872130aa-381b-4bd0-8aaa-d06cf9d60900)


  Next, we simplify the problem further by taking a cross section of the above geometry and converting
  it into a 2D problem. Geometry with mesh is shown below:


  ![image](https://github.com/nilot-pal/Blood-flow-into-tumor/assets/72824334/960598cf-c4f0-4beb-aac1-a628993dfd8d)


  A poster presented on this project at APS Division of Fluid Dynamics Conference (November 22, 2021)
  can be found [here](https://github.com/nilot-pal/Blood-flow-into-tumor/blob/main/Poster_APS_2021_v2.pdf).

  '

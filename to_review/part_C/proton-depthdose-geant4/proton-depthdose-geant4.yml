readme_excerpt: "# Proton_Depthdose-Geant4\nGEANT4 simulation of proton depth–dose distribution and Bragg\
  \ peak behavior in a water phantom, with Step-level energy deposition scoring along the beam axis and\
  \ dose profile analysis.\n<br>\nThe simulation focuses on:\n\n1.Geometry design and material definition\
  \ (water phantom)\n\n2.Physics list selection for hadronic and electromagnetic interactions\n\n3.Step-level\
  \ energy deposition scoring along the beam axis \n\n4.Statistical analysis of dose profiles\n\nThe objective\
  \ is to develop foundational understanding of particle transport and energy deposition mechanisms relevant\
  \ to proton beam applications.\n\n\n## Software Architecture\n\n- **DetectorConstruction** — Defines\
  \ a 20×20×30 cm water phantom inside a \n  1m³ air world. The phantom is the scoring volume.\n- **PrimaryGeneratorAction**\
  \ — Configures the proton beam (energy, direction, \n  position).\n- **SteppingAction** — Intercepts\
  \ every simulation step inside the phantom and \n  records depth (z) and energy deposition, forwarding\
  \ data to RunAction.\n- **EventAction** — Accumulates total energy deposition per event and forwards\
  \ \n  to RunAction for dose calculation.\n- **RunAction** — Uses Geant4's built-in `G4AnalysisManager`\
  \ to fill a 1D \n  histogram (depth vs energy deposit) and an Ntuple (raw step data), saved \n  as `braggPeak.root`.\
  \ Handles multi-threading safely via Ntuple merging.\n\n---\n## Results\nThe simulation reproduces the\
  \ characteristic Bragg peak — low energy deposition \nat shallow depths rising sharply to a maximum\
  \ before the protons stop at ~150mm.\n\n- **Peak depth:** ~150 mm\n- **Total dose in phantom:** ~19\
  \ nanoGy (10,000 events)\n- **Statistical uncertainty (RMS):** ~24 picoGy\n\n---\n\n\n## References\n\
  - [Geant4 Documentation](https://geant4.web.cern.ch)\n- [QBBC Physics List](https://geant4-userdoc.web.cern.ch)"

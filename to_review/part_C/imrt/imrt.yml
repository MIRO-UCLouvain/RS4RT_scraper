  \n# What is ImRt?\n\nA framework for the developement of audio applications using __Dear ImGui__ with\
  \ the backends __GLFW__ and __OpenGL__ as well as __ImPlot__ and __RtAudio__.\n\n# How do I use ImRt?\n\
  \nUse this repository as a template:\n\n```bash\ngit clone --recurse-submodules https://github.com/tonstein/imrt\n\
  rm -rf imrt/.git\nmv imrt project-name\ncd project-name\ngit init\ncode . # if you use VSCode\n```\n\
  \nWork with a copy of one of the following examples and adjust the CMakeLists.txt in the root folder\
  \ accordingly.\n\nThe most important classes of the framework are documented on [https://tonstein.github.io/imrt/](https://tonstein.github.io/imrt/).\n\
  \n## Examples\n\n### Utility \n\n![](examples/utility/img/utility.gif)\n\nSee [examples/utility](examples/utility).\n"

readme_excerpt: "# Synthetic-CT-ICH-Normal-Generation-without-GPU\n\nA full pipeline for photo-realistic\
  \ synthetic CT slice generation—no GPU required.  \nImplements:\n\n1. **DCGAN** on 64×64 ICH/normal\
  \ brain CT patches  \n2. **Post-processing** (guided bilateral filtering, sharp-kernel sharpening, non-local\
  \ means denoising, CLAHE, histogram matching)  \n3. **Two-stage Super-Resolution** (4× then 2×) with\
  \ RealESRGAN  \n4. **Kernel-based final sharpening** for 512×512 outputs  \n5. **Interactive demos**\
  \ in `app.py` / `app2.py` and a notebook (`Code.ipynb`)  \n\n## \U0001F4C1 Repository Structure\n```\n\
  ├── Code.ipynb\n├── app.py                  # Flask demo: generate & display synthetic CT\n├── app2.py\
  \                 # Alternative Flask UI (batch sampling)\n├── flowchart.md            # Pipeline flowchart\
  \ & block diagram\n├── Reference CT – 1.png    # Example reference slice (histogram matching)\n├── Reference\
  \ CT – 2.jpg\n├── Reference CT – 3.jpg\n├── Reference CT – 4.jpg\n├── Dataset/                # ── place\
  \ your real CT slices here\n│   └── ICH Brain CT/\n│       ├── patient01.png\n│       └── …\n├── requirements.txt\n\
  └── README.md\n```\n## \U0001F6E0️ Requirements\n\nTested on CPU; GPU optional.\n```python\ntorch>=1.12.0\n\
  torchvision>=0.13.0\nbasicsr>=1.3.4\nrealesrgan>=0.3.0\nopencv-python>=4.5.5\nscikit-image>=0.19.0\n\
  matplotlib>=3.4.3\nPillow>=9.0.1\nflask>=2.0\n```\n## ⚙️ Configuration\n\n### 1. Reference CT\n\nChoose\
  \ one representative CT slice (clean, high-contrast) and place it in the repo root:\n\n![Ref Img](<Reference%20CT%20-%204.jpg>)\n\
  \nThis image is used for histogram matching.\n\n### 2. Dataset\n\nOrganize your real CT scans under:\n\
  \n```\nDataset/ICH Brain CT/\n  ├── slice1.png\n  ├── slice2.png\n  └── …\n```\n\nSupported formats:\
  \ PNG, JPG, etc. Converted to grayscale internally.\n\n### 3. RealESRGAN Weights\n\nDownload pretrained\
  \ weights into the repo root:\n\n```bash\nwget https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2/RealESRGAN_x4plus.pth\n\
  wget https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2/RealESRGAN_x2plus.pth\n```\n\n\
  ## \U0001F680 Usage\n\n### A. Notebook (Code.ipynb)\n\n1. Open `Code.ipynb` in your Jupyter environment.\n\
  2. Adjust paths & hyperparameters in the first cell:\n\n   ```python\n   device = torch.device(\"cpu\"\
  )   # or \"cuda:0\"\n   dataset_root = \"Dataset/ICH Brain CT\"\n   ref_ct_path  = \"Reference CT –\
  \ 1.png\"\n   out_dir      = \"output/\"\n   num_epochs   = 100\n   batch_size   = 16\n   ```\n3. Run\
  \ all cells.\n4. Review intermediate grids and final SR outputs in `output/`.\n\n### B. Streamlit Implementation\
  \ (`app.py` / `app2.py`)\n\n1. Launch the web app:\n\n   ```bash\n   streamlit run app.py   # or app2.py\n\
  \   ```\n2. Open the generated link in your browser.\n\n![Streamlit Img](<Screenshot-steamlit.png>)\n\
  \n3. Click **“Generate”** to sample a batch of synthetic CT slices.\n4. The app will run the full pipeline\
  \ (GAN→post-proc→SR) on CPU.\n\n## \U0001F50D Pipeline Overview\n\nSee [flowchart.md](flowchart.md)\
  \ for a block-diagram of the end-to-end data flow:\n\n1. **Data Loading & Preprocessing** (64×64 grayscale\
  \ patches)\n2. **DCGAN Training**\n3. **Guided Bilateral Filtering** → extract high-freq noise map\n\
  4. **Sharpening → Denoising → CLAHE → Histogram Matching**\n5. **RealESRGAN ×4 → RealESRGAN ×2**\n6.\
  \ **Noise-map Reinjection** (α = 0.9)\n7. **Final 3×3 Kernel Sharpen**\n\n## \U0001F3AF Outputs\n\n\
  * **Epoch grids**:\n  `output/epoch_<n>.png` (400 samples, 20×20 grid)\n\n* **Final SR images**:\n \
  \ `output/sr8_epoch<n>_img<i>.png` (512×512, real-look slices)\n\n---\n\n## \U0001F4DD Notes & Tips\n\
  \n* **CPU vs. GPU**: CPU only is slow; use `device = torch.device(\"cuda\")` if available.\n* **Hyperparameter\
  \ Tuning**:\n\n  * `h` in NL-Means Denoise\n  * `clipLimit` & `tileGridSize` in CLAHE\n  * `alpha` for\
  \ noise reinjection\n    \n* **Histogram Matching**: Choose a clean, high-contrast reference slice for\
  \ best results.\n\n> *PKumar-2002 · 2025*\n\n"

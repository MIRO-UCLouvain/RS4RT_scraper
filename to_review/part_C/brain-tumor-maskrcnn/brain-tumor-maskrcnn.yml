readme_excerpt: "# \U0001F9E0 ADVANCE BRAIN TUMOR CLASSIFICATION AND SEGMENTATION USING MASK R-CNN\n\n\
  > AI-powered MRI analysis · Tumor localisation · Risk assessment · Report generation\n\n---\n\n## \U0001F4C1\
  \ Project Structure\n\n```\nbrain_tumor_maskrcnn_app/\n├── app.py                   # Main Streamlit\
  \ application\n├── config.py                # Global configuration (classes, paths, thresholds)\n├──\
  \ requirements.txt         # Python dependencies\n├── models/\n│   ├── class_names.py       # Authoritative\
  \ 4-class label list\n│   ├── classifier_model.h5  # (place trained weights here)\n│   └── mask_rcnn_weights.pth#\
  \ (place trained Mask R-CNN weights here)\n├── utils/\n│   ├── preprocess.py        # MRI loading, CLAHE\
  \ enhancement, tensor prep\n│   ├── inference.py         # 4-class EfficientNetB0 classifier\n│   ├──\
  \ segmentation.py      # Mask R-CNN tumor segmentation\n│   ├── risk_analysis.py     # Risk level, affected\
  \ area, risk score\n│   ├── report_generator.py  # ReportLab PDF medical report\n│   └── ui_components.py\
  \     # HTML card / bar helpers for Streamlit\n├── assets/\n│   └── styles.css           # Premium dark-theme\
  \ CSS\n└── outputs/                 # Auto-created output directory\n```\n\n---\n\n## ⚙️ Local Setup\
  \ & Run\n\n### 1. Prerequisites\n- Python 3.10 or 3.11 (recommended)\n- pip ≥ 23.0\n\n### 2. Install\
  \ dependencies\n```bash\ncd brain_tumor_maskrcnn_app\npip install -r requirements.txt\n```\n\n> **Tip:**\
  \ Use a virtual environment:\n> ```bash\n> python -m venv venv && source venv/bin/activate   # Linux/macOS\n\
  > venv\\Scripts\\activate                              # Windows\n> pip install -r requirements.txt\n\
  > ```\n\n### 3. (Optional) Add pre-trained weights\n| File | Where to get it |\n|------|----------------|\n\
  | `models/classifier_model.h5` | Fine-tune EfficientNetB0 on the [Kaggle Brain Tumor MRI Dataset](https://www.kaggle.com/datasets/masoudnickparvar/brain-tumor-mri-dataset)\
  \ — 4 classes |\n| `models/mask_rcnn_weights.pth` | Fine-tune torchvision Mask R-CNN on a brain-MRI\
  \ instance-segmentation dataset |\n\nWithout weights, the app runs in **demo mode** — still produces\
  \ all four classes, segmentation masks, risk metrics, and PDF reports.\n\n### 4. Launch the app\n```bash\n\
  streamlit run app.py\n```\n\nThen open **http://localhost:8501** in your browser.\n\n---\n\n## \U0001F3D7\
  ️ Architecture\n\n```\nMRI Image\n    │\n    ├─ Preprocessing (CLAHE + sharpening)\n    │\n    ├─ [Classifier]\
  \  EfficientNetB0 → 4-class softmax\n    │       Glioma Tumor | Meningioma Tumor | Pituitary Tumor |\
  \ No Tumor\n    │\n    └─ [Segmenter]   Mask R-CNN ResNet-50 FPN\n            → binary mask, bounding\
  \ box, confidence\n```\n\nThe two-branch design **eliminates** the old binary-collapse bug where only\n\
  Glioma or No Tumor were ever predicted.\n\n---\n\n## \U0001F9EA Four Classes — Complete Mapping\n\n\
  | Class | Risk | Notes |\n|-------|------|-------|\n| Glioma Tumor | \U0001F534 High | Most aggressive;\
  \ originates in glial cells |\n| Meningioma Tumor | \U0001F7E1 Medium | Usually benign; arises from\
  \ meninges |\n| Pituitary Tumor | \U0001F7E1 Medium | Affects hormone regulation |\n| No Tumor | \U0001F7E2\
  \ Low | Clean scan — full report still generated |\n\n---\n\n## \U0001F4C4 PDF Report Contents\n- Project\
  \ title + report ID + timestamp  \n- Original MRI & Tumor-highlighted image (side by side)  \n- Diagnosis,\
  \ Risk Level, Risk Score, Affected Area  \n- Estimated Tumor Location (bounding-box centroid heuristic)\
  \  \n- Class Probabilities table  \n- Medical disclaimer  \n\n# \U0001F9E0 Advanced Brain Tumor Classification\
  \ and Segmentation using Mask R-CNN\n\n## \U0001F680 Live Demo\n\n\U0001F449 [Try the Brain Tumor AI\
  \ Web App](https://brain-tumor-maskrcnn-jr9omnjjjr6uxroxebusau.streamlit.app/)\n---\n\n## \U0001FA7A\
  \ Disclaimer\nThis tool is intended for **research and educational purposes only**.  \nIt does not constitute\
  \ a medical diagnosis. Always consult a qualified  \nradiologist or neurologist for clinical decisions.\n"

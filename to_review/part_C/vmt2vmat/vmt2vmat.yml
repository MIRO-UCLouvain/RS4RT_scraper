readme_excerpt: "# ![VMT2VMAT-Icon](https://github.com/user-attachments/assets/a9abf17a-905a-46b2-8f96-04259479c47b)\
  \ VMT2VMAT\nThis program is a simple C# project that translates a Source 1 VMT file to the Source 2\
  \ equivalent, a VMAT file. \\\nIt utilizes ![VTFCmd](https://github.com/NeilJed/VTFLib) to automatically\
  \ turn its respective VTF files into the different, supported file extensions.\n\n## How To Use\nUsing\
  \ CMD you can launch the provided executable file with specified arguments. \\\nThose arguments are:\n\
  - \"-input\" / \"-i\" - Specifies the path to a valid VMT file / folder of VMT files. (REQUIRED!)\n\
  - \"-output\" / \"-o\" - Specifies the path the resulting VMAT file(s) should be placed.\n- \"-recursive\"\
  \ / \"-r\" - Specifies whether we're enabling recursive folder translations.\n- \"-version\" / \"-v\"\
  \ - Specifies which version of Source 2 we should translate to.\n  - hla - Translates to a Half-Life:\
  \ Alyx compatible VMAT file.\n  - cs2 - Translates to a Counter-Strike 2 compatible VMAT file.\n  -\
  \ sbox - Translates to a s&box compatible VMAT file.\n- \"-fileextension\" / \"-fe\" - Specifies what\
  \ filetype the textures should feature.\n    - tga - Textures will be exported and specified as targa\
  \ (TGA) files.\n    - png - Textures will be exported and specified as PNG files.\n    - jpg / jpeg\
  \ - Textures will be exported and specified as JPG files.\n"

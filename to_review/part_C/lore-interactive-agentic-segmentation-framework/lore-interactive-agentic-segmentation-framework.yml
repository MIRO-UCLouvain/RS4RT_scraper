readme_excerpt: "# LORE: Learning to Reason Over Physician Corrections\n\n**Accepted at MICCAI 2026 Workshop:\
  \ [CLiMeM](https://climem.github.io/CLiMeM/index.html) — Continual Learning in Medical Multimodal-Vision**\n\
  \nInteractive agentic framework for **3D tumor segmentation**. A policy learns *what* correction to\
  \ request (click, box, scribble, …) and *when* to stop, conditioned on the current mask, error residuals,\
  \ and geometric descriptors.\n\nThis repository contains the LORE / MedSA agent code (`src-agentic/`)\
  \ and launch scripts. Datasets and trained weights are not included.\n\n## Abstract\n\nInteractive segmentation\
  \ models ask a physician to iteratively correct a model’s output until the result is acceptable, yet\
  \ existing methods treat each correction as an isolated reactive event with no structured reasoning\
  \ about the interaction itself. In this paper, we propose LORE, an interactive agentic framework built\
  \ on a frozen 3D SAM backbone that trains an agent to reason over the full history of physician corrections\
  \ so that it can ask for the right kind of correction at the right time. The agent learns through the\
  \ Chain of Clinical Corrections (CoCC): it observes the geometry of the current error, accumulates correction\
  \ patterns across the session to detect recurring structural failures, hypothesizes where the next correction\
  \ will fall, and verifies its own spatial prediction against the physician’s subsequent action via a\
  \ novel spatial grounding reward, making the agent rewarded not only for segmentation quality, but for\
  \ correctly anticipating where the physician will need to act next. Evaluated across six benchmarks\
  \ spanning CT (colon, pancreas, liver, kidney) and FDG-PET (head-and-neck, lung), LORE consistently\
  \ achieves strong segmentation quality while substantially reducing physician interaction burden.\n\n\
  ## Repository layout\n\n```text\nsrc-agentic/\n  train.py / test.py          # entry points\n  config/\
  \                     # argparse + model/dataloader setup\n  dataset/                    # TorchIO /\
  \ MONAI loaders\n  models/                     # SAM-3D, MedSA (LORE), policy\n  processor/        \
  \          # training loop\n  utils/                      # scribbles, clinical priority, logging\n\
  \  voxynth/                    # scribble deformation helpers\ntrain_code_agentic.sh         # SLURM\
  \ train launcher\ntest_code_agentic.sh          # SLURM test launcher\nsetup_env312.sh             \
  \  # optional env bootstrap\nrequirements.txt\n```\n\n## Requirements\n\n- Python 3.12 recommended \
  \ \n- CUDA GPU + PyTorch  \n- SAM ViT-B weights at `./checkpoint_sam/sam_vit_b_01ec64.pth`  \n  ([download](https://dl.fbaipublicfiles.com/segment_anything/sam_vit_b_01ec64.pth))\n\
  \n### Environment\n\n```bash\n# Option A — use the helper (creates $LORE_ENV or ~/prism_env312)\nsbatch\
  \ setup_env312.sh\n# or: bash setup_env312.sh\n\n# Option B — existing venv\nexport LORE_ENV=/path/to/your/venv\n\
  source \"$LORE_ENV/bin/activate\"\npip install -r requirements.txt\npip install torch torchvision torchaudio\
  \   # match your CUDA\n```\n\nLaunch scripts activate `${LORE_ENV:-$HOME/prism_env312}` by default.\n\
  \n## Data\n\nPlace each dataset under:\n\n```text\nsrc-agentic/splits/<dataset>/\n```\n\nSupported names:\
  \ `hecktor`, `colon`, `pancreas`, `lits`, `kits`, `autopet`, `brats`.\n\nExpected layout follows the\
  \ project’s TorchIO / split conventions (images, labels, and `split.pkl` or equivalent). Paths are set\
  \ in the train/test scripts via `--data_dir`.\n\n## Train\n\n```bash\nsbatch train_code_agentic.sh <dataset>\n\
  # examples:\nsbatch train_code_agentic.sh hecktor\nsbatch train_code_agentic.sh colon\n```\n\nAll datasets\
  \ use LORE / MedSA (`--use_medsa`).\n\nCheckpoints and logs are written to:\n\n```text\n./implementation_medsa/<dataset>/<save_name>/\n\
  ```\n\n(`best.pth.tar` is used for evaluation.)\n\n## Test\n\n```bash\nsbatch test_code_agentic.sh <dataset>\n\
  ```\n\nReports are written under the run directory, e.g. `test_reports/` (per-case CSV, summary JSON,\
  \ Dice-vs-step curves).\n\n## Manual invocation\n\n```bash\nexport PYTHONPATH=$(pwd):$(pwd)/src-agentic\n\
  \npython src-agentic/train.py \\\n  --data hecktor \\\n  --data_dir src-agentic/splits/hecktor \\\n\
  \  --save_dir ./implementation_medsa \\\n  --save_name hecktor_medsa \\\n  --checkpoint_sam ./checkpoint_sam/sam_vit_b_01ec64.pth\
  \ \\\n  --use_medsa \\\n  ...\n\npython src-agentic/test.py \\\n  --data hecktor \\\n  --data_dir src-agentic/splits/hecktor\
  \ \\\n  --save_dir ./implementation_medsa \\\n  --save_name hecktor_medsa \\\n  --checkpoint best \\\
  \n  --checkpoint_sam ./checkpoint_sam/sam_vit_b_01ec64.pth \\\n  --use_medsa \\\n  ...\n```\n\nSee `train_code_agentic.sh`\
  \ / `test_code_agentic.sh` for the full flag sets used in experiments.\n\n## Citation\n\nIf you use\
  \ this code, please cite:\n\n> *Learning to Reason Over Physician Corrections: An Interactive Agentic\
  \ Framework for 3D Tumor Segmentation.*  \n> MICCAI 2026 Workshop on Continual Learning in Medical Multimodal-Vision\
  \ (CLiMeM).\n"

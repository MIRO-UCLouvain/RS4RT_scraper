readme_excerpt: "# Proton-beam-SDE\nThis repository houses a simulator for an SDE describing a the path\
  \ of a proton in proton beam therapy.\nIt is under active development and **not fit for standalone use**.\n\
  \n# Installation\n\nIn Unix-like environments, simply call `make` in the project root. You will need:\n\
  \n- the g++ compiler (tested on version 13.2.0),\n- the [GNU Scientific Library](https://www.gnu.org/software/gsl/)\
  \ (tested on version 2.7.1),\n- the [libconfig](https://hyperrealm.github.io/libconfig/) package (tested\
  \ on version 1.5).\n\n# Usage\n\nSimulation and output parameters are specified in the config file `sim.cfg`.\
  \ In particular, you can\nmodify:\n- the number of protons to simulate,\n- the radius of the nozzle\
  \ from which protons are emitted,\n- the Gaussian distribution of the initial position of the protons,\
  \ conditioned to lie in the nozzle,\n- the Gaussian distribution of the initial energy of the protons,\n\
  - the change points between materials,\n- the index of the material in each gap between change points,\
  \ based on the ordering in Materials/materials.txt,\n- the simulator time-step,\n- the energy at which\
  \ a proton is absorbed and its path ends,\n- the side length of output voxelation,\n- the path to which\
  \ a sparse 3d grid of dose deposition is stored.\n\nAfter compilation, run the simulation by calling\
  \ `./simulate sim.cfg` at the project root.\nYou can also replace the `sim.cfg` argument with the path\
  \ to any other appropriate config file.\n**Warning**: The default number of protons in `sim.cfg` is\
  \ set to one million, and voxel sizes and time\nsteps are also set to a moderate resolution. As a result,\
  \ the simulation can take 1-2 minutes.\n\n# Post-processing\n\n## Python scripts\n\nDefault output paths\
  \ are specified into the `Output` folder, which contains the Python scripts for output\nvisualisation.\
  \ To use it you will need:\n\n- [Python 3](https://www.python.org/) (tested on version 3.12.3), as well\
  \ as the following Python modules:\n- numpy (tested on version 1.26.4),\n- matplotlib (tested on version\
  \ 3.10.0),\n- itk (tested on version 5.4.4),\n- pymedphys (tested on version 0.40.0),\n- scipy (tested\
  \ on version 1.14.1)\n- uproot (tested on version 4.0.0)\n\nAll the necessary functions are written\
  \ in `SDE_vs_G4.py`, whereas the execution scripts to produce the relevant figures \nis written in `SDE_vs_G4_executionScript.py`\
  \ (if the Geant4 files are available) or `SDE_plots.py` (for exclusively\nplotting SDE output). The\
  \ scripts include integrated and central-axis depth-dose 1D curves, 2D dose distributions, \nlateral\
  \ profiles, gamma analysis plots, pass rate calculations and proton range calculations. Simply modify\
  \ the variables \ndefined at the start of the script according to what you need to plot. More detailed\
  \ information is found in the comments\nof each script.\n\n## Geant4 output generation\n\nGeant4 is\
  \ used as reference to assess the accuracy of the SDE. The source code to generate the outputs that\
  \ are used for \ncomparison are found in the `Geant4-dose-and-secondaries` folder, which has its own\
  \ README file with a detailed explanation\nof the model and how to run the simulations.\n\n# Nuclear\
  \ cross sections\n\nThe `Splines` folder contains splines fitted to nuclear cross section data for elements\
  \ as given in the `ENDF_data` folder.\nWhen available, the `ENDF/B-VIII.1` nuclear library was used.\
  \ Otherwise the `JEFF-4.0` library was used. This is sufficient for running simulations\nin mediums\
  \ consisting of air, bone and water. The `Splines` folder also contains three python scripts that are\
  \ able to generate additional cross sections for input into the code. The python scripts will loop through\
  \ all elements given in `Material/atoms.txt` and produce spline data files for those with data available\
  \ in the `ENDF_data` folder. For each script, data should be stored in the `ENDF_data` folder as follows:\n\
  \n- Elastic scattering cross sections for hydrogen are generated using the script `Elastic_cross_section_generator_hydrogen.py`.\

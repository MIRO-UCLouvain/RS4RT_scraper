readme_excerpt: 'Breast cancer is one of the leading causes of cancer-related deaths among women worldwide.
  Early diagnosis significantly improves treatment outcomes. This project presents an automated deep learning
  system for detecting breast cancer from ultrasound images by combining Attention U-Net for tumor segmentation
  and Convolutional Neural Networks (CNN) for image classification.


  The system identifies suspicious regions in breast ultrasound images and classifies them into Normal,
  Benign, or Malignant categories. Based on the predicted class, it also provides basic healthcare guidelines
  to help users understand the diagnosis.


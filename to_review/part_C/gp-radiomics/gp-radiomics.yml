readme_excerpt: "# A Genetic Programming Approach to Radiomic-based Feature Construction for Survival\
  \ Prediction in Non-Small Cell Lung Cancer (source codes)\n\nWe provide MATLAB-based source codes that\
  \ implement the genetic programming (GP) approach for feature construction, which has been applied to\
  \ the two-year survival prediction in non-small cell lung cancer patients. \n\nThis demo uses the LUNG1\
  \ dataset, which consists of 422 computer tomography scans publicly available at the Cancer Imaging\
  \ Archive (https://www.cancerimagingarchive.net/collection/nsclc-radiomics). The PyRadiomics package\
  \ (https://pyradiomics.readthedocs.io) was used to extract 105 classical radiomic features, including\
  \ shape, volumetric, and texture features. These radiomic features are already provided in the \"nsclc.mat\"\
  \ file.\n\nThe GP implementation uses the tree data structure for MATLAB, which is available at https://tinevez.github.io/matlab-tree/.\
  \ We also provide these functions in the source codes.\n\nThe 105 radiomic features represent the terminal\
  \ set of the GP approach, while the function set is comprised of the arithmetic operators addition,\
  \ subtraction, multiplication, and division, as well as the minimum and maximum functions. The individuals\
  \ in the population use a multi-tree representation to construct a multidimensional feature space.\n\
  \nTo perform an experiment, download the \"GP-radiomics.zip\" file, uncompress it, and run the \"demo.m\"\
  \ file.\n\nPlease cite the following paper:\n\nElisa Scalco , Wilfrido Gómez-Flores, and Giovanna Rizzo.\
  \ \"A Genetic Programming Approach to Radiomic-based Feature Construction for Survival Prediction in\
  \ Non-Small Cell Lung Cancer,\" Applied Sciences, 14(16), 6923, 2024. https://doi.org/10.3390/app14166923\n\
  \n![picture alt](https://github.com/wgomezf/GP-radiomics/blob/main/multi.png)\n"

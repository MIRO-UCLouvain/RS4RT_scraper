readme_excerpt: '# VMate AI


  **El equipo de producción completo que cabe en un clic.**


  VMate AI es un asistente de inteligencia artificial que dirige transmisiones en vivo

  junto a ti en **vMix**: dobla, rotula, atiende a los invitados, corta clips y obedece

  tus órdenes por voz. Automatiza el trabajo que normalmente harían tres o cuatro

  personas de un equipo de producción.


  Desarrollado por [Miami Live Streaming](https://www.miamilivestreaming.com), productora

  audiovisual en Miami, galardonada con el **Premio PRODU Tecnología 2025** en la categoría

  de Producción Remota.


  ---


  ## Descargar


  La última versión está siempre en la sección **[Releases](../../releases/latest)**.


  Más información y guía de uso: **[miamilivestreaming.com/vmate](https://www.miamilivestreaming.com/vmate)**


  ---


  ## Qué hace


  **Traducción — doblaje automático en vivo.**

  Detecta cada clip que vMix graba en inglés, lo transcribe, lo dobla al español con voces

  naturales y lo devuelve a la playlist de emisión en minutos. Incluye mesa de debate con

  locutores de IA, titulares automáticos, tweets traducidos en pantalla y highlights al cierre.


  **Producción — dirección por voz.**

  Mantén pulsado un botón, habla, y la IA ejecuta: «prepárame un rótulo», «sácalo al aire»,

  «corta a la cámara dos». Control de vMix por voz desde el PC o desde el móvil, con

  confirmación de seguridad para las acciones críticas. Incluye un asistente que atiende con

  voz a los invitados por videollamada, les hace la prueba de sonido y les corrige el encuadre.


  **Converter — edición ultrarrápida.**

  Cortar, unir, sustituir audio y extraer audio sin recodificar: segundos, no minutos. Cortes

  por lote pegando desde Excel, conversión de vídeo vertical a 16:9 con fondo difuminado, y

  transcripción a `.txt` y `.srt` al instante.


  ---


  ## Requisitos


  - Windows 10 u 11 de 64 bits

  - vMix instalado

  - Conexión a internet


  Instalador de 64 MB, todo incluido. No hacen falta conocimientos técnicos.

  Interfaz y asistente disponibles en español e inglés.


  ---


  ## Prueba gratuita


  30 días completos. Solo se piden nombre y email la primera vez que se abre.


  ---


  ## Al instalar: el aviso de Windows


  El instalador todavía no está firmado digitalmente, así que Windows mostrará la pantalla

  azul **«Windows protegió tu PC»**. No significa que el archivo tenga nada malo: es lo que

  Windows hace con cualquier programa nuevo que aún no ha acumulado reputación.


  Para continuar, pulsa **Más información** y después **Ejecutar de todas formas**.


  Cada versión publicada incluye su huella **SHA-256** para que puedas comprobar que el

  archivo que descargas es exactamente el que publicamos.


  ---



readme_excerpt: '# Brain Tumor Segmentation from MRI


  This project performs binary whole-tumor segmentation using the BraTS 2020 MRI dataset.


  Two methods are compared:


  - A classical image-processing baseline based on intensity thresholding and morphological operations.

  - A small 2D U-Net deep-learning model.


  The models are evaluated using Dice and IoU.


  ## Files


  - `MRI_Final_Project.ipynb` – Full project code and results.


  ## How to Run


  1. Download this file.

  2. Place the BraTS H5 dataset outside the repository.

  3. Open MRI_Final_Project.ipynb.

  4. Run the notebook cells in order.


  A CUDA-compatible GPU is recommended for training the U-Net.

  '

readme_excerpt: "# tumorVQ : Tumor Volume Quantification\n![Build Status](https://img.shields.io/badge/build-passing-brightgreen)\
  \ ![License](https://img.shields.io/badge/license-MIT-blue) ![Version](https://img.shields.io/badge/version-1.0.0-orange)\
  \ \n\n\n**tumorVQ** is a package designed for the accurate quantification of **brain tumor volumes**\
  \ from different brain regions using MRI scans. It provides user-friendly functions for volumetric analysis,\
  \ integrating standard atlases and offering efficient data for radiogenomics research.\n\n---\n\n##\
  \ Prerequisites\n\n**Note:** This package will only run on Unix/Ubuntu systems and has not been developed\
  \ for other operating systems.\n\nBefore using **tumorVQ**, ensure you have the following installed\
  \ and set up:\n\n1. **[FSL](https://fsl.fmrib.ox.ac.uk/fsl/docs/#/install/linux)**installed on your\
  \ system (folder name: `fsl`)\n2. T1 MRI images for accurate outputs\n3. Segmented tumor images\n\n\
  ---\n\n## Usage\n\nTo install **tumorVQ**, follow these steps:\n\n### Clone the Repository\n\nRun the\
  \ following command in your terminal:\n\n```bash\ngit clone https://github.com/CGnTLab/tumorVQ.git\n\
  ```\n### Navigate to the Directory\n```bash\ncd tumorVQ\n```\n\n### Run the Installation Script\n```bash\n\
  ./install.sh\n```\n*Close the current terminal and reopen it for the environment changes to take effect.*\n\
  \n#### To check if tumorVQ is installed correctly, run the following command:\n```bash\ntumorVQ -h\n\
  ```\nFollowing will be displayed:\n\n![tumorVQ Help Output](data/misc/tumorVQ_help.png)\n\n### Volume\
  \ Extraction Command\n```bash\ntumorVQ -n SampleName -s /path/to/TumorSegment.nii.gz -t1 /path/to/MRI_t1.nii.gz\
  \ -a atlas -o /path/to/output\n```\n\n### Example Code\n\nHere’s an example of how to use tumorVQ:\n\
  ```bash\ntumorVQ -n Sample1 -s ./data/example/Sample1/Sample1_seg.nii.gz -t1 ./data/example/Sample1/Sample1_t1.nii.gz\
  \ -a all -o ./Sample1_output\n```\n---\n### Output Interpretation\n#### [Atlases Used](https://fsl.fmrib.ox.ac.uk/fsl/docs/#/other/datasets)\n\
  \n**MNI** atlas : 9 Brain Regions (approx 2min)\n\n**Juelich** atlas : 121 Brain Regions (approx 3min)\n\
  \n**Talairach** atlas : 1105 Brain Regions (approx 15min)\n\n**Harvard-Subcoritcal** : 21 Brain Regions\
  \ (approx 2min)\n\n*All altases will take 15min for successful completion*\n\nOutput table will have\
  \ three columns:\n\n| Regions | Volume | Volume.00 |\n|---------|--------|-----------|\n\n\n---\n##\
  \ Developer\n\n**Kavita Kundal**  \n**CG&T Lab, Indian Institute of Technology Hyderabad**\n\n\n\n\n"

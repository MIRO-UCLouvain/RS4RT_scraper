readme_excerpt: "# XMorpher deformable registration between cardiac CT scans. CT pairs must undergo affine\
  \ registration before deformable registration (a necessary step before deformable).\n\n\n\n# Create\
  \ environment\nconda env create -f environment.yml\n\n# Activate\nconda activate XMorpher-Reg\n\n# Search\
  \ for bin anywhere in your environment \nfind /path/to/miniconda3/envs/XMorpher-Reg/bin \n\n\n# Data\
  \ organization\nThe data organization example is shown below: \n\n\n\n![alt text](image.png)\n\nThe\
  \ folders train_labeled_unlabeled and train_unlabeled_unlabeled are used for training, and the data\
  \ in the test folder is used for testing.\n\n# How to prepare the dataset:\nFollow the instructions\
  \ in `Prepare-Data/preprocessing.ipynb`, which include data cropping, normalization, resampling, affine\
  \ registration, Dice score calculation, and data/results visualization.\n\n\n# Run the script\nRun python\
  \ Unsup_train.py for unsupervised training.\n\n\nRun python Semi_train.py for semi-supervised training.\n\
  \n## Results overview\n\n![alt text](Cardiac-HNC.png)\n\n**Figure.** **Left:** Quantitative and qualitative\
  \ results (cardiac CT with labels) after our preprocessing pipeline, including affine registration and\
  \ deformable registration using **XMorpher** (unsupervised and semi-supervised). \n\n**Right:** Qualitative\
  \ **XMorpher** results on our head-and-neck cancer (HNC) CT–CBCT paired dataset from **CHUM Hospital**.\
  \ *Note:* The HNC preprocessing is performed differently and is available in a separate repository named\
  \ **VoxelMorph**.\n\n"

readme_excerpt: "# LC50 Toxicity Prediction using Linear Regression\n\n## Project Summary\n\nThis project\
  \ builds a multiple linear regression model to predict acute aquatic toxicity (LC50) of chemical compounds\
  \ using molecular descriptors.\n\nLC50 measures the concentration required to kill 50% of *Daphnia magna*\
  \ within 48 hours. Toxicity is expressed as −log(mol/L).\n\nThe objective was to explore relationships\
  \ between molecular structure and toxicity, develop a predictive model, and validate its statistical\
  \ reliability.\n\n---\n\n##  Dataset\n\n* 546 chemical compounds\n* 8 molecular descriptors (predictors)\n\
  * 1 response variable: LC50\n\nDescriptors used:\nTPSA, SAacc, H050, MLOGP, RDCHI, GATS1p, nN, C040\n\
  \n---\n\n##  Exploratory Analysis\n\n* Computed summary statistics\n* Visualised distributions and scatter\
  \ plots\n* Assessed correlations between predictors and LC50\n\nKey observations:\n\n* MLOGP showed\
  \ a strong positive association with toxicity.\n* RDCHI was positively related to LC50.\n* GATS1p and\
  \ nN showed negative associations.\n* Some descriptors showed weak predictive strength.\n\n---\n\n##\
  \  Model Development\n\n###  Full Model\n\nBuilt a multiple linear regression model using all 8 predictors.\n\
  \n###  Model Selection\n\nApplied AIC-based backward stepwise selection to identify the most suitable\
  \ model.\n\n###  Final Model\n\nThe final model retained:\n\n* MLOGP\n* RDCHI\n* GATS1p\n* nN\n\nThis\
  \ reduced model improved interpretability while maintaining predictive accuracy.\n\n---\n\n##  Model\
  \ Validation\n\nThe following diagnostics were performed:\n\n* Residual vs Fitted analysis\n* Normal\
  \ Q-Q assessment\n* Multicollinearity check (VIF)\n* Influence analysis (Cook’s Distance)\n\nResults\
  \ indicated:\n\n* Residuals approximately normal\n* No severe multicollinearity\n* No highly influential\
  \ observations\n* Minor heteroscedasticity\n\n---\n\n##  Example Prediction (R)\n\n```r\nfinal_model\
  \ <- lm(LC50 ~ MLOGP + RDCHI + GATS1p + nN, data = daphnia)\n\nnew_data <- data.frame(\n  MLOGP = 3.2,\n\
  \  RDCHI = 2.5,\n  GATS1p = 1.1,\n  nN = 1\n)\n\npredict(final_model, new_data, interval = \"prediction\"\
  )\n```\n\n---\n\n##  Tools & Techniques\n\n* R\n* Multiple Linear Regression\n* AIC Model Selection\n\
  * Residual Diagnostics\n* Multicollinearity Assessment\n* Influence Analysis\n* Exploratory Data Analysis\n\
  \n---\n\n##  Outcome\n\nThis project demonstrates the application of statistical modelling to estimate\
  \ environmental toxicity using chemical descriptors. The final regression model provides a structured\
  \ and interpretable approach for toxicity prediction.\n\n---\n"

readme_excerpt: "# The Sampling RT Pipeline\n\nWelcome! This is a sampling pipeline setup, specifically\
  \ calibrated for intensity modulated radiation therapy, or IMRT  treatments, but extensible to other\
  \ modalities/problems.\n\nThe pipeline takes in a specific Matlab .mat structure (outlined below), and\
  \ provides sampling options through a GUI.\n\n<div style=\"text-align: center;\">\n<img src=\"sampleOutputs/GUIloaded2.png\"\
  \ alt=\"picture of the GUI\" width=\"500\">\n</div>\n\nTo run the application, open samplingBenchmarkInterface.mlapp,\
  \ run it to start the GUI, enter your custom parameters, select a .mat file, and run your cases. If\
  \ you have an older version of Matlab that doesn't have app designer, we've also exported the GUI code\
  \ to samplingBenchmarkInterface_exported.m. Running this should equivalently get the GUI running for\
  \ you! \n\nThe sampling takes place in Matlab scripts, then the output is passed into a mexed in c++\
  \ file, that takes Matlab input, and runs a simple fluence map optimization using CPLEX.\n\n<div style=\"\
  text-align: center;\">\n<img src=\"sampleOutputs/PipelineImg.png\" alt=\"pipeline image\" width=\"500\"\
  >\n</div>\n\nNote, we do see the irony of releasing an open-source project that requires both CPLEX\
  \ and Matlab. Unfortunately, for the ease of the pipeline both are necessary. CPLEX is free for download\
  \ if you are a student and instructions are give below. Professionals may also be able to obtain a limited\
  \ licence. \n\n\n## Installation guide for Windows\n\n1. Install [CPLEX](https://community.ibm.com/community/user/datascience/blogs/xavier-nodet1/2020/07/09/cplex-free-for-students?CommunityKey=ab7de0fd-6f43-47a9-8261-33578a231bb7&tab=)\
  \ (links to student download site)\n\n* Make sure to keep track of the path to the following folders\
  \ on your computer\n\n* `C:\\…\\CPLEX_Studio201\\cplex`\n\n* `C:\\…\\CPLEX_Studio201\\concert`\n\n2.\
  \ Install the Visual Studio C/C++ Compiler (if you don't already have one)\n\n* This application relies\
  \ on the use of MATLAB mex files, which will not compile properly on other compilers like gcc or MINGW\n\
  \n* In MATLAB, make sure the default C++ compiler is set to the Visual Studio C++ compiler\n\n3. Run\
  \ `mex -setup cpp` in the MATLAB CL\n\n\n## Compiling and running the application\n\n1. To compile the\
  \ mex file on Windows, run the following line in the MATLAB CL:\n\n* `mex('-IC:\\Program Files\\IBM\\\
  ILOG\\CPLEX_Studio201\\cplex\\include','-IC:\\Program Files\\IBM\\ILOG\\CPLEX_Studio201\\concert\\include','-LC:\\\
  Program Files\\IBM\\ILOG\\CPLEX_Studio201\\concert\\lib\\x64_windows_msvc14\\stat_mda','-LC:\\Program\
  \ Files\\IBM\\ILOG\\CPLEX_Studio201\\cplex\\lib\\x64_windows_msvc14\\stat_mda','-lcplex2010.lib','-lilocplex.lib','-lconcert.lib','run_FMO.cpp')`\n\
  \nOn Mac, its a similar call, and again will be download and infrastructure-specific:\n\n* `mex('-I/Applications/CPLEX_Studio2211/cplex/include',\
  \ ...\n'-I/Applications/CPLEX_Studio2211/concert/include', ...\n'-L/Applications/CPLEX_Studio2211/concert/lib/arm64_osx/static_pic',\
  \ ...\n'-L/Applications/CPLEX_Studio2211/cplex/lib/arm64_osx/static_pic', ...\n'-lcplex', '-lilocplex',\
  \ '-lconcert', 'run_FMO.cpp')`\n\n* this filepath may be different on your machine\n\n* If the mexfile\
  \ was successfully compiled, you can verify by looking for a file with a .mexw64 extension\n\n3. To\
  \ run the application, open samplingBenchmarkInterface.mlapp, enter your custom parameters, select a\
  \ .mat file, and run\n\n# GUI Input\n\nThe GUI expects imports with the following fields in a .mat file:\n\
  \n  - Dij: voxels x beamlets matrix\n  - structVoxels: substruct with voxel indices of each organ in\
  \ Dij\n  - targets: target organ id(s) in structVoxels ordering\n  - OAR: sensitive organ id(s) in structVoxels\
  \ ordering\n  - targetDose: Prescribed dose\n  - beamWidth: horizontal dimension of beamlet\n  - voxelIndices:\
  \ The [x,y,z] coord of each voxel\n\nAs an example, we include the prostate from the CORT dataset, \n\
  (Craft D, Bangert M, Long T, Papp D, Unkelbach J. Shared data for intensity modulated radiation therapy\
  \ (IMRT) optimization research: the CORT dataset. Gigascience. 2014 Dec 12;3(1):37. doi: 10.1186/2047-217X-3-37)\
  \ and output a compatible file CORTProstate_guiInput.mat, which is available in the sampleData folder.\
  \ The Dij and structures were calculated from matRad (Wieser, Hans‐Peter, et al. \"Development of the\
  \ open‐source dose calculation and optimization toolkit matRad.\" Medical physics 44.6 (2017): 2556-2568.).\n\
  \nHere is how it looks in full:\n| ![Subfigure 1](sampleOutputs/prostateFull.png) | ![Subfigure 2](sampleOutputs/prostateFullAng2.png)\
  \ |\n|:----------------------------------------------:|:------------------------------------:|\n| Figure\
  \ 1: One angle of the prostate            | Figure 2: Another angle              |\n\nWe ran it through,\
  \ all sampling algorithms, and obtained the images below (try replicating it at 10x sampling rate on\
  \ your device!):\n| ![Subfigure 1](sampleOutputs/Integer10.png) | ![Subfigure 2](sampleOutputs/kmeansc10.png)\
  \ |\n|:-------------------------------------------:|:-------------------------------------------:|\n\
  | ![Subfigure 1](sampleOutputs/kmeansD10.png) | ![Subfigure 2](sampleOutputs/kmeansN10.png) |\n| ![Subfigure\
  \ 1](sampleOutputs/BBmax10.png)   | ![Subfigure 2](sampleOutputs/probing10.png) |\n| ![Subfigure 1](sampleOutputs/BBmed10.png)\
  \   | ![Subfigure 2](sampleOutputs/Layered10.png) |\n\n\n# GUI Output\nAfter a successful run, the GUI\
  \ will return a sol structure, that contains the outputs from each sampling method collected. It should\
  \ provide an opportunity to save this structure wherever you like at the end of the run.\n\n# Known\
  \ Tuning Issues\nNote, that if the layered method fails, you might need to change the alpha value in\
  \ surfaceSampler_Gatik_v3.m. This code relies on Matlab's triangulation through the boundaryFacets()\
  \ function. The alpha is based on the closeness of planes and too high or low may just return empty\
  \ sets!\n\n# Customizing the Pipeline\nThere are a number of elements you might want to customize\n\
  ## Adding input data\nFeel free! So long as the structure contains the minimum of what the interface\
  \ is looking for, it will not care if you add in extra structures/fields\n## Updating the fluence optimization\
  \ model\nYou can edit the C++ code, re-mexing it in every time to compile, as desired. If you add something\
  \ neat, let us know! \n## Updating the sampling types/dropdown\nYou can add/subtract whatever sampling\
  \ algorithms you'd like. In the samplingBenchmarkInterface.mlapp code, you'll need to update 2 switch\
  \ statements, the first in the RunButtonPushed() event, and the second in the subsequent runPlans()\
  \ function that it calls. \n\nHappy sampling!\n\n# Cite\nIf you want to use this pipeline (and to learn\
  \ more about the algorithms!), please cite our paper:\nRipsman DA., Hristov S., Gola G., Kwong W., Singh\
  \ M., Osei E., Darko J., Mahmoudzadeh, H.. \"A Comparison of Voxel Down-Sampling Approaches for Radiation\
  \ Therapy.\" TBA (2025)."

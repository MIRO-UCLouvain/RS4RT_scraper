readme_excerpt: 'This is the manual parameter file that can used to extract pyradiomics from sacs of Intracranial
  Aneurysms (IAs). This is a python-based file that can be readily used in 3D slicer. Please refer any
  of the following articles for detailed description of how this was used:


  Veeturi SS, Poppenberg KE, Pinter NK, Jaikumar V, Levy EI, Siddiqui AH, Tutino VM. Evaluation of radiogenomics
  for risk stratification of intracranial aneurysms: a pilot study. Neuroradiology. 2025. doi: 10.1007/s00234-025-03702-1


  Veeturi SS, Saleem A, Ojeda DJ, Sagues E, Sanchez S, Gudino A, Levy EI, Hasan D, Siddiqui AH, Tutino
  VM, et al. Radiomics-Based Predictive Nomogram for Assessing the Risk of Intracranial Aneurysms. Translational
  stroke research. 2024. doi: 10.1007/s12975-024-01268-3


  Veeturi SS, Raghuram A, Miller J, Pinter NK, Sanchez S, Baig AA, Siddiqui AH, Samaniego EA, Tutino VM.
  Radiomics Features in Contrast‐Enhanced and Nonenhanced Magnetic Resonance Imaging Images Are Associated
  With High Intracranial Aneurysmal Risk. Stroke: Vascular and Interventional Neurology. 2023;3. doi:
  10.1161/svin.122.000721


  Steps:

  1. Open 3D slicer and add the slicerRadiomics extension. Restart the slicer

  2. Import your MRI image and segment the region of interest (IA wall). Convert this segmentation to
  a binary label map

  3. In the module list: Informatics-> Radiomics

  4. Use the image on which you want to extract radiomics as input image, the binary label map as the
  input region and use the parameter file attcahed herewith as the "Manual customization"

  '

readme_excerpt: "# Comment-Toxicity-Detection-NLP\nDeep learning–based multi-label toxic comment detection\
  \ system using CNN, LSTM, and DistilBERT with Streamlit deployment for real-time and bulk predictions.\n\
  # \U0001F6E1️ Toxic Comment Detection using Deep Learning\n\nThis project implements an end-to-end **toxic\
  \ comment detection system** using **Natural Language Processing (NLP)** and **Deep Learning**.  \n\
  Multiple models were trained and evaluated, and the best-performing model was deployed using **Streamlit**.\n\
  \n---\n\n## \U0001F680 Project Overview\n\nOnline platforms often face challenges with abusive, hateful,\
  \ and toxic comments.  \nThis project aims to **automatically detect toxic comments** to support content\
  \ moderation systems.\n\nThe system classifies comments into **six toxicity categories**:\n- toxic\n\
  - severe_toxic\n- obscene\n- threat\n- insult\n- identity_hate\n\nThis is a **multi-label classification\
  \ problem**, as a single comment can belong to multiple categories.\n\n---\n\n## \U0001F9E0 Models Implemented\n\
  \nThree deep learning models were built and compared:\n\n| Model | Description |\n|-----|------------|\n\
  | CNN | Fast baseline model for phrase-level toxicity detection |\n| LSTM | Sequence-based model to\
  \ capture contextual dependencies |\n| **DistilBERT** | Transformer-based model with contextual understanding\
  \ (**final model**) |\n\n---\n\n## \U0001F4CA Model Evaluation\n\nModels were evaluated using:\n- Precision\n\
  - Recall\n- F1-score\n- **Macro F1-score** (primary metric)\n\n### \U0001F525 Performance Summary\n\n\
  | Model | Macro F1-score |\n|-----|---------------|\n| CNN | ~0.55 |\n| LSTM | ~0.35 |\n| **DistilBERT**\
  \ | **~0.66** ✅ |\n\n**DistilBERT** was selected due to its superior performance, especially on rare\
  \ toxicity classes such as `threat` and `identity_hate`.\n\n---\n\n## \U0001F6E0️ Tech Stack\n\n- Python\n\
  - NLP (Tokenization, Text Cleaning)\n- TensorFlow / Keras (CNN, LSTM)\n- PyTorch & Hugging Face Transformers\
  \ (DistilBERT)\n- Scikit-learn (Evaluation)\n- Streamlit (Web App Deployment)\n\n---\n\n## \U0001F4C2\
  \ Project Structure\n\ntoxic-comment-detection-deep-learning/\n│\n├── data/\n├── notebooks/\n├── model/\n\
  ├── app.py\n├── requirements.txt\n├── README.md\n\n\n\n---\n\n## \U0001F310 Streamlit Web Application\n\
  \n\n\nThe Streamlit app allows:\n- Real-time toxicity prediction for a single comment\n- Bulk prediction\
  \ via CSV upload\n- Display of toxicity scores for each category\n\nTo run locally:\n\n```bash\npip\
  \ install -r requirements.txt\nstreamlit run app.py\n\nDataset\n\nDataset used:\n\nJigsaw Toxic Comment\
  \ Classification Dataset\n\nEach comment is annotated with six toxicity labels.\n\n\n\U0001F3AF Key\
  \ Learnings\n\n\nMulti-label text classification\n\nDeep learning model comparison\n\nHandling class\
  \ imbalance in NLP\n\nTransformer-based model fine-tuning\n\nDeploying NLP models using Streamlit\n\n\
  \n\U0001F4CC Future Improvements\n\n\nThreshold tuning per label\n\nModel explainability (SHAP / LIME)\n\
  \nCloud deployment (Streamlit Cloud / Hugging Face Spaces)\n\nActive learning for continuous improvement\n\
  \n\n\U0001F464 Author\n\n\nSouvik Ghosh\nAspiring Data Scientist / NLP Engineer\n\n⭐ Acknowledgements\n\
  \n\nKaggle Jigsaw Toxic Comment Dataset\n\nHugging Face Transformers\n\nGoogle Colab\n"

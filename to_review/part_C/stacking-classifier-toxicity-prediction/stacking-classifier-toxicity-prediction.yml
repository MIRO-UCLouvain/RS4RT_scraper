readme_excerpt: "# Stacking_Classifier_Toxicity_Prediction\n\nThis repository contains a machine learning\
  \ pipeline to predict the toxicity of molecules using RDKit-generated molecular descriptors and ensemble\
  \ classification techniques. The pipeline was designed to work with large-scale chemical datasets and\
  \ demonstrates robust performance when validated on FDA-approved drug molecules.\n\nLink to the website\
  \ : https://toxicity-prediction.streamlit.app/\n\n***This is a on-going paper under review***\n\n##\
  \ \U0001F4CC Problem Statement\n\nPredict molecular toxicity using structural and physicochemical properties\
  \ derived from SMILES strings. The project leverages data-driven feature engineering and ensemble machine\
  \ learning for accurate classification.\n\n\n## \U0001F4CA Dataset\n\n- **Source:** The dataset utilized\
  \ in this study consisted of a total of 209,232 small molecules, including 74,412 non-toxic and 134,820\
  \ toxic compounds\n- **Structure:** SMILES strings with binary toxicity labels.\n- **Validation:** Separate\
  \ validation on FDA-approved drug molecules (unseen during training).\n\n\n## \U0001F9EA Methodology\n\
  \n![Flowchart](https://github.com/user-attachments/assets/7df91d38-e782-4716-a5a0-317f8318ee17)\n\n\n\
  ### 1. Exploratory Data Analysis\n- Analyzed structural and chemical properties.\n- Identified key differentiators\
  \ between toxic and non-toxic molecules:\n  - Molecular weight\n  - Atom chain lengths\n  - Functional\
  \ substructures\n\n### 2. Feature Engineering\n- Generated **210+ molecular descriptors** using RDKit.\n\
  - Performed experiments on a subset of **20,000 molecules** to fine-tune the pipeline before scaling\
  \ to the full dataset.\n\n### 3. Feature Selection\n- Two-step ranking strategy:\n  - **Random Forest\
  \ feature importance**\n  - **Mutual Information scores**\n- Top 40 features from each method were merged,\
  \ resulting in the final set of **selected descriptors**.\n\n### 4. Model Training\n- Benchmarked models:\
  \ SVM, Logistic Regression, Random Forest.\n- Final model: **Stacking Classifier**\n  - **Base models:**\
  \ Random Forest, LightGBM, SVM\n  - **Meta learner:** Logistic Regression\n\n### 5. Evaluation\n\n-\
  \ ![image](https://github.com/user-attachments/assets/282d94d4-12b9-4119-b41d-67d84afc29f1)\n\n- **Training\
  \ accuracy:** 94%\n- **Validation on FDA dataset:** 91%\n\n\n\n## \U0001F680 Results\n\n- High accuracy\
  \ across training and validation.\n- Generalized well to real-world drug molecules.\n- Demonstrated\
  \ the effectiveness of stacked ensembles for imbalanced and high-dimensional data.\n\n\n\n## \U0001F464\
  \ Author\nShireen Shaikh\nBITS Pilani – M.Sc. Biological Sciences, B.E. Mechanical Engineering\nMinor\
  \ in Data Science\n\n"

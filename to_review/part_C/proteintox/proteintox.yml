readme_excerpt: "# Proteintox \nThis is a machine learning model for protein toxicity prediction that\
  \ can identify proteins and peptides that may have cardiotoxic, enterotoxic, or neurotoxic. The models\
  \ integrated diverse features, including physicochemical properties (PnGT), composition-transition-distribution\
  \ (CTD), conjoint-triads (CTraid), and amino acids composition (Compo) derived from protein primary\
  \ sequence, enabling a holistic analysis of the molecules' toxicity potential. The FASTA sequences of\
  \ proteins are given as input and the model predicts the toxicity pf proteins.\n* R language for descriptors\
  \ calculations\n* Python for model predictions\n\n## Contents\n\n### PackageRequirement\n- ```environment.yml```\
  \ : Conda environment configuration file\n\n### Feature_calculation\n- ```fasta2desc_ccc.R``` : R script\
  \ for calculating the descriptors from FASTA input\n- ```feature_calculation.py``` : Python script faor\
  \ calculating descriptors  from FASTA input\n\n### Pediction_files\n- ```desc_2_model.py```: Script\
  \ to run predictions for the descriptors calculated using R script `fasta2desc_ccc.R`\n- ```Proteintox_pred.py```\
  \ : Script to run predictions for the descriptors calculated using python script `feature_calculation.py`\n\
  - ```scaler.pkl```: Normalization model\n- ```model.pkl```: Prediction model\n- ```sample_input.fasta```:\
  \ Sample of input FASTA sequences\n- ```descriptors_output_ccc_df.csv```: Sample of output of descriptors\
  \ calculations\n\n### Training_files\n- ```fasta2desc_calculations_all.R``` : R script for calculating\
  \ the all descriptors from FASTA input\n- ```Feature_Selection_Code``` : For boruta feature selection\
  \ \n- ```knn_script.py```: Python script for k-nearest neighbour model training\n- ```rf_script.py```:\
  \ Python script for random forest model training\n- ```svm_script.py```: Python script for support vector\
  \ machine model training\n\n### Test_data\n- ```Test_data.csv``` : Test Dataset\n\n\n## Prediction using\
  \ the features calculated from R script\n### System Dependencies for R\n* R language (64 bit) \n* make\
  \ sure to add the path of R language to the sytem environment variables.\nFor adding path of R language\
  \ to system environment variable use following command:                        \n```bash\npathman /au\
  \ C:\\Program Files\\R\\R-4.3.2\\bin\\x64\\\n```                                                   \
  \                            \nAbove command is for R version 4.3.2, change it according to the R version\
  \ installed               \nFor example for R version 4.2.0:                                       \
  \                \n```bash\npathman /au C:\\Program Files\\R\\R-4.2.0\\bin\\x64\\\n```\n\n## Required\
  \ R libraries\n* Use following command in the command prompt to install required R libraries:      \
  \                                                   \n```bash\nRscript -e \"install.packages(c('protr','readr'),repos='https://cloud.r-project.org',\
  \ dependencies=TRUE)\"\n```\n### Usage for running R script for calculating descriptors\nIn order to\
  \ run the R script to calculate descriptors refer to the sample sample_input.fasta file added to the\
  \ repository. User can upload the query sequences in the form of a FASTA file that can contain n number\
  \ of sequences. Make sure to remove the ambiguous amino acids (such as X) from the sequences; otherwise,\
  \ it will result in an error. Running this script produces a csv file named 'descriptors_output_ccc_df.csv'\
  \ in the same folder. This file is the input file for the main prediction script.\n- Download `Feature_calculation`\
  \ and `Prediction_files`, ensure that all the files are present in the same single folder when running\
  \ the script. Ensure that train.rds should be in folder.\n- Then Use the following command by changing\
  \ the current working directory to the folder where repository fasta2desc_ccc.R is saved.\n```\nRscript\
  \ fasta2desc_ccc.R\n```\n- Users wil be prompted to select .fasta file of sample fasta files\n- Once\
  \ the .fasta file is selected and the process is completed, results will be saved in descriptors_output_ccc_df.csv\
  \ file.\n\n### Prerequisites for running python prediction script\nBefore running these scripts, create\
  \ a new conda environment and install the following packages using the pip command (pip install name_of_package\
  \ = version)\n- Python (3.10)\n- pandas (2.1.4)\n- joblib (1.3.2)\n- scikit-learn (1.3.2)\n- mordred\
  \ (1.2.0)\n- rdkit (2023.9.4)\n- numpy (1.23.5)\n\n### Usage for running python script for model prediction\n\
  The ``descriptors_output_ccc_df.csv`` file is the input file for the main prediction script. Add the\
  \ scaler and model .pkl files as arguments. \n- Ensure that all the files are present in the same folder\
  \ when running the script.\n- Run desc_2_model.py\n```\npython desc_2_model.py scaler.pkl model.pkl\
  \ descriptors_output_ccc_df.csv\n```\n- Prediction results will be saved in `predictions_output.csv`\
  \ which includes predicted toxicity of FASTA sequences of proteins.\n- Prediction results contain column\
  \ 'Predicted Class'. This file contains the final results (whether the FASTA sequences  are Cardiotoxic,\
  \ Neurotoxic, Enterotoxic or Non-toxic). \n\n\n## Prediction using the features calculated from python\
  \ script\n### Required R libraries\n* Use following command in the command prompt to install required\
  \ R libraries:\n```bash\nRscript -e \"install.packages(c('protr','readr','readxl'),repos='https://cloud.r-project.org',\
  \ dependencies=TRUE)\"\n```\n### Prerequisites for running python feature calculation and prediction\
  \ script\n- Download `Feature_calculation` and `Prediction_files`, ensure that all the files are present\
  \ in the same single folder when running the script. Ensure that train.rds should be in folder.\n- \n\
  ### Prepare input\nTo calculate descriptors refer to the sample sample_input.fasta file added to the\
  \ repository. User can upload the query sequences in the form of a FASTA file that can contain n number\
  \ of sequences. Make sure to remove the ambiguous amino acids (such as X) from the sequences; otherwise,\
  \ it will result in an error. Running this script produces a csv file named 'descriptors_output_ccc_df.csv'\
  \ in the same folder. This file is the input file for the main prediction script.\n\n1. Before running\
  \ these scripts, create a new conda environment\n```\nconda env create -f environment.yml\n```\n2. Activate\
  \ conda env\n```\nconda activate pt\n```\n3. Install R package `protr`\n```\n# Start R\nR\n# Then install\
  \ protr\ninstall.packages(\"protr\")\n# Exit R\nq() \n```\n3. Feature Calculation\n```\npython feature_calculation.py\n\
  ```\n4. Prediction\n```\npython Proteintox_pred.py\n```\n4. Prediction Output\n```\npredictions_output.csv\n\
  ```\n\n## Citation\nIf you use  **Proteintox** in your publication, consider citing the [paper](https://doi.org/10.1016/j.comtox.2025.100390):\n\
  ```\nKamble, P.; Sharma, A.; Banerjee, A.; Pandey, S.; Garg, P. Proteintox: A multifaceted machine learning\
  \ strategy for identifying cardiotoxic, neurotoxic, and enterotoxic proteins. Computational Toxicology\
  \ 2025, 36, 100390. DOI: https://doi.org/10.1016/j.comtox.2025.100390.\n"

readme_excerpt: "# Habitat Radiomics for Papillary Thyroid Carcinoma\n\n[![License: MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](./LICENSE)\n\
  [![Python 3.9+](https://img.shields.io/badge/python-3.9+-blue.svg)](https://www.python.org/)\n[![BMC\
  \ Medical Imaging](https://img.shields.io/badge/journal-BMC%20Medical%20Imaging-9c1c2e.svg)](https://bmcmedimaging.biomedcentral.com/)\n\
  \nCode and data archive accompanying the manuscript:\n\n> **Predicting High-Burden Central-Compartment\
  \ Lymph Node Metastasis\n> (>=3 positive nodes) in Papillary Thyroid Carcinoma: A Habitat Radiomics\n\
  > Framework Based on Reconstructed Contrast-Enhanced CT**\n>\n> Sun D., Li H., Zhan Y., Li L., Liu S.,\
  \ Han X., Zhang Z. *et al.* — submitted to *BMC Medical Imaging* (2026).\n\nThis repository provides\
  \ every input file, every notebook, and every\nintermediate output required to reproduce the numeric\
  \ values reported in\n**Table 1, Table 2, Table S2, Table S3, Figure 3, Figure 4, and Figure S5**\n\
  of the manuscript.\n\n> **Note on data access.** This repository is **public** as of submission\n> to\
  \ *BMC Medical Imaging* (open access). See [ACCESS.md](./ACCESS.md)\n> for the data access policy. The\
  \ repository is openly accessible under\n> the MIT license (code) and a restricted-use license (data).\n\
  \n---\n\n## Repository layout\n\n```\nthyroid-habitat-radiomics/\n├── README.md                    \
  \            <- you are here\n├── LICENSE                                  <- MIT (code only)\n├── ACCESS.md\
  \                                <- data access policy\n├── CITATION.cff                           \
  \  <- citation metadata\n├── requirements.txt                         <- Python dependencies\n├── clinical.csv\
  \                             <- 119 patients x 9 clinical variables\n├── label.csv                \
  \                <- per-patient imaging filename, label, cohort\n├── Original_Resolution_Data/     \
  \           <- pipeline on raw-resolution CT\n│   ├── Step0. Generate_synthetic_data.ipynb\n│   ├──\
  \ Step1. Rad-intratumoral.ipynb\n│   ├── Step2. Habitat.ipynb\n│   ├── Step3. Habitat_feature_visualization.ipynb\n\
  │   ├── Step4. Clinical_baseline_statistical_analysis.ipynb\n│   ├── Step5. Clinical.ipynb\n│   ├──\
  \ Step6. Metrics_summary-Nomogram.ipynb\n│   ├── Click_to_run.bat\n│   ├── config.yaml             \
  \             <- sanitized: replace REPLACE_ME paths\n│   ├── clinic_sel.csv\n│   ├── stats1.csv\n│\
  \   ├── nomogram.png\n│   ├── custom_settings/                     <- PyRadiomics parameter files\n\
  │   ├── data/clinical.csv                    <- working copy of clinical.csv\n│   ├── features/    \
  \                        <- radiomic feature CSVs\n│   ├── img/                                 <- ROC,\
  \ DCA, calibration, nomogram, etc.\n│   ├── models/                              <- trained joblib .pkl\
  \ files\n│   └── results/                             <- per-sample prediction CSVs\n├── Super_Resolution_Data/\
  \                   <- same pipeline on 3D SR-reconstructed CT\n│   ├── (same structure as Original_Resolution_Data)\n\
  │   ├── _dump_delong.py\n│   └── delong_code.txt\n```\n\n> **Note on the two pipelines.** The super-resolution\
  \ pipeline\n> (`Super_Resolution_Data/`) is the **primary** analysis reported in the\n> manuscript (test\
  \ AUC 0.913 for the habitat XGBoost model, Figure 3\n> ROC/DCA/calibration, Figure 4D nomogram, Table\
  \ 2, Table S2). The\n> `Original_Resolution_Data/` subfolder contains the same pipeline run on\n> the\
  \ raw-resolution CT for transparency (test AUC 0.867 for the habitat\n> XGBoost model); it is not used\
  \ in any main-text figure or table. See\n> [`REVIEWER_GUIDE.md`](./REVIEWER_GUIDE.md) for the exact\
  \ path to every\n> reported number.\n\n## Reproducing the manuscript\n\n### Prerequisites\n\n- Python\
  \ 3.9 or later.\n- The Python packages listed in [`requirements.txt`](./requirements.txt).\n- The **`onekey_algo`**\
  \ package (internal radiomics pipeline orchestrator).\n  This package is **not on PyPI**; install from\
  \ source per your institution's\n  distribution channel. Without `onekey_algo`, the Step1 / Step2 /\
  \ Step6\n  notebooks cannot be re-executed end-to-end. The provided outputs\n  (`features/`, `models/`,\
  \ `results/`) were generated by `onekey_algo` and\n  can be inspected without re-running the pipeline.\n\
  - (Optional, only for re-running Step1 / Step2 on your own data) The raw\n  contrast-enhanced CT volumes.\
  \ These are **not** included in this repository;\n  see [ACCESS.md](./ACCESS.md) for the request procedure.\n\
  \n### Installing the Python dependencies\n\n```bash\npip install -r requirements.txt\n```\n\n### Re-running\
  \ the analysis\n\nEach pipeline subfolder (`Original_Resolution_Data/` and\n`Super_Resolution_Data/`)\
  \ is self-contained and runs independently.\n\n1. **Edit the sanitized paths in `config.yaml`.** Open\n\
  \   `Original_Resolution_Data/config.yaml` and\n   `Super_Resolution_Data/config.yaml`, and replace\
  \ every `REPLACE_ME/...`\n   with the absolute path to your local copy of the raw CT volumes and the\n\
  \   `label.csv` file.\n2. **Launch Jupyter.**\n   ```bash\n   jupyter notebook\n   ```\n3. **Open `Click_to_run.bat`\
  \ (Windows) or follow the equivalent commands on\n   Linux/macOS.** The recommended entry point is\n\
  \   `onekey_algo`'s `RunTask` interface, which orchestrates Step1 through\n   Step6 in order.\n4. **Verify\
  \ outputs** against the manuscript's Table 1, Table 2, Table S2,\n   and the corresponding figures.\n\
  \n### Reproducing specific reported numbers\n\n| Manuscript item | What to run | What to compare against\
  \ |\n| --- | --- | --- |\n| Table 1 (baseline statistics) | `Step4. Clinical_baseline_statistical_analysis.ipynb`\
  \ | `Original_Resolution_Data/clinic_sel.csv`, `stats1.csv` |\n| Table 2 (classifier metrics) | `Step1\
  \ / Step2 / Step5 / Step6` | `Super_Resolution_Data/results/` and `Original_Resolution_Data/results/`\
  \ |\n| Table S2 (7-classifier x 2-resolution metrics) | Same as Table 2 | Same as Table 2, plus the\
  \ Original_Resolution results |\n| Table S3 (univariable logistic regression) | `Step4` | `Original_Resolution_Data/clinic_sel.csv`\
  \ |\n| Figure 3 (ROC, DCA, calibration) | `Step1 / Step2` | `Super_Resolution_Data/img/`, `Original_Resolution_Data/img/`\
  \ |\n| Figure 4 (nomogram) | `Step6` | `Super_Resolution_Data/nomogram.png`, `Original_Resolution_Data/nomogram.png`\
  \ |\n| Figure S5 (DeLong tests) | `Step6` (then re-apply Sun-Xu 2014 DeLong) | `Super_Resolution_Data/_dump_delong.py`\
  \ |\n\nThe DeLong Z-statistics reported in the manuscript can be reproduced from\nthe per-sample CSVs\
  \ in `Super_Resolution_Data/results/` using the\nSun-Xu 2014 analytic DeLong implementation provided\
  \ in\n`Super_Resolution_Data/_dump_delong.py` and `delong_code.txt`.\n\n## Software environment\n\n\
  - Python >= 3.9\n- `numpy`, `pandas`, `scipy`, `matplotlib`\n- `scikit-learn` >= 1.2, `xgboost` >= 1.7,\
  \ `lightgbm` >= 3.3\n- `joblib` >= 1.2 (for `.pkl` persistence)\n- `nibabel`, `SimpleITK`, `pyradiomics`\
  \ (radiomics feature extraction)\n- `onekey_algo` (internal; not on PyPI)\n- Jupyter notebook\n\nA full\
  \ pinned environment is intentionally not committed; reproduce with\n`pip install -r requirements.txt`\
  \ and your institution's `onekey_algo`\ndistribution.\n\n## Citation\n\nIf you use this code or data,\
  \ please cite both the manuscript and this\nrepository. The `Cite this repository` button on GitHub\
  \ (powered by\n[`CITATION.cff`](./CITATION.cff)) will generate the correct entry in APA,\nBibTeX, and\
  \ other common formats.\n\n```bibtex\n@article{sun2026habitat,\n  title   = {Predicting High-Burden\
  \ Central-Compartment Lymph Node\n             Metastasis ($\\geq$3 positive nodes) in Papillary Thyroid\n\
  \             Carcinoma: A Habitat Radiomics Framework Based on\n             Reconstructed Contrast-Enhanced\
  \ CT},\n  author  = {Sun, Dawei and Li, Huichao and Zhan, Yanmei and Li, Lisha and\n             Liu,\
  \ Shuangyong and Han, Xu and Zhang, Zhoujing},\n  journal = {BMC Medical Imaging},\n  year    = {2026},\n\
  \  note    = {under review}\n}\n\n@software{thyroid_habitat_radiomics_2026,\n  author       = {Sun,\
  \ Dawei and Li, Huichao and Zhan, Yanmei and Li, Lisha and\n                  Liu, Shuangyong and Han,\
  \ Xu and Zhang, Zhoujing},\n  title        = {Habitat Radiomics Framework for Predicting High-Burden\n\
  \                  Central-Compartment Lymph Node Metastasis in Papillary\n                  Thyroid\
  \ Carcinoma},\n  year         = {2026},\n  publisher    = {GitHub},\n  howpublished = {\\url{https://github.com/sharp33/thyroid-habitat-radiomics}}\n\
  }\n```\n\n## Data access and ethics\n\nSee [ACCESS.md](./ACCESS.md) for the full data access policy.\
  \ In summary:\n\n- This repository is **publicly available** in line with the data-sharing\n  policy\
  \ of BMC Medical Imaging (open access). No access request is\n  required at any stage.\n- The **raw\
  \ contrast-enhanced CT volumes** are **not** included; access is\n  available from the corresponding\
  \ author on reasonable request subject to\n  institutional data-sharing agreements.\n- A Zenodo deposit\
  \ with a long-term DOI is recommended upon acceptance\n  (see [ACCESS.md](./ACCESS.md)).\n- The study\
  \ was conducted in accordance with the Declaration of Helsinki\n  and was approved by the Institutional\
  \ Review Board of The Affiliated\n  Hospital of Qingdao University.\n\n## Contact\n\nFor questions about\
  \ the code, please open a GitHub Issue.\nFor data access requests, contact the corresponding author\
  \ at the email\nlisted in the manuscript title page.\n\n## License\n\n- **Code** (notebooks, `.py` files,\
  \ configuration files, `_dump_delong.py`,\n  `delong_code.txt`): MIT License. See [LICENSE](./LICENSE).\n\
  - **Data** (clinical.csv, label.csv, contents of `features/`, `models/`,\n  `results/`, `img/`, and\
  \ any figure files): restricted access as described\n  in [ACCESS.md](./ACCESS.md). No reuse beyond\
  \ the access framework.\n"

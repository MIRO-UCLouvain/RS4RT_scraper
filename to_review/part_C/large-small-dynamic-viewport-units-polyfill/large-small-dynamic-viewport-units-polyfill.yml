readme_excerpt: "# Large, small, and dynamic viewport units polyfill\n\n[![npm](https://img.shields.io/npm/v/large-small-dynamic-viewport-units-polyfill)](https://www.npmjs.com/package/large-small-dynamic-viewport-units-polyfill)\n\
  \nThis is a \"polyfill\" which adds support for svh, dvh and lvh viewport units. It's mainly useful\
  \ when dealing with iOS and Android mobile devices.\n\n⚠️ **This library is pre-release quality. It\
  \ should work but it requires more comprehensive testing on different devices. Please test it out and\
  \ report any bugs you might encounter.**\n\n## How it works\n\nIt adds CSS custom properties (variables)\
  \ `--1svh`, `--1dvh` and `--1lvh` using JavaScript. These correspond to 1 svh, 1 dvh and 1 lvh unit\
  \ respectively. These custom properties are automatically updated when the viewport size changes. You\
  \ can use CSS `calc()` function to multiply them to your desired size.\n\n## How to use\n\n### 1. Import\
  \ script\n\nInclude script tag or import the script using a bundler.\n\n#### 1.A. Script tag\n\n```html\n\
  <script src=\"https://unpkg.com/large-small-dynamic-viewport-units-polyfill@0.1.1/dist/large-small-dynamic-viewport-units-polyfill.min.js\"\
  ></script>\n```\n\n#### 1.B. Bundler\n\nInstall the package.\n\n```shell\nnpm install large-small-dynamic-viewport-units-polyfill\n\
  ```\n\nImport the package.\n\n```js\nimport 'large-small-dynamic-viewport-units-polyfill';\n```\n\n\
  ### 2. Write CSS\n\nAdd CSS like this in your project:\n\n```css\n.my-small-hero-element {\n    width:\
  \ 100%;\n    height: 100vh; /* For browsers that don't support CSS variables */\n    height: calc(var(--1svh,\
  \ 1vh) * 100); /* This is the \"polyfill\" */\n    height: 100svh; /* This is for future browsers that\
  \ support svh, dvh and lvh viewport units */\n}\n\n.my-dynamic-hero-element {\n    width: 100%;\n  \
  \  height: 100vh; /* For browsers that don't support CSS variables */\n    height: calc(var(--1dvh,\
  \ 1vh) * 100); /* This is the \"polyfill\" */\n    height: 100dvh; /* This is for future browsers that\
  \ support svh, dvh and lvh viewport units */\n}\n\n.my-large-hero-element {\n    width: 100%;\n    height:\
  \ 100vh; /* For browsers that don't support CSS variables */\n    height: calc(var(--1lvh, 1vh) * 100);\
  \ /* This is the \"polyfill\" */\n    height: 100lvh; /* This is for future browsers that support svh,\
  \ dvh and lvh viewport units */\n}\n```\n\n⚠️ **You should include all three lines so your styles will\
  \ work properly. Because browsers will simply ignore CSS properties with values they do not understand,\
  \ new browsers that implement the units will use the last line.**\n\nYou may omit the first line if\
  \ you don't need to support very old browsers like IE 11 (As of 2023, CSS custom properties are supported\
  \ by 97% of browsers).\n\nℹ️ **lvh unit is only included for the sake of completeness. It currently\
  \ behaves exactly like vh unit. This may break in a future version of iOS or Android.**\n\n## Compatibility\n\
  \nI've tested this library with the following operating systems and devices: \n\n* Mobile Safari, iOS\
  \ 15, iPhone 12 Pro\n* Mobile Safari, iOS 15, iPad Pro 11\" 2018\n* Mobile Safari, iOS 14, iPhone SE\
  \ (1st generation)\n* Mobile Safari, iOS 15.2, iPhone 13 Pro (Simulator)\n* Mobile Safari, iOS 15.2,\
  \ iPad Pro (11-inch, 3rd Generation, Simulator)\n* Mobile Safari, iOS 16.1, iPhone 14 Pro (Simulator)\n\
  * Mobile Safari, iOS 16.1, iPad Pro (11-inch, 4th Generation, Simulator)\n* Google Chrome 97, iOS 15,\
  \ iPhone 12 Pro\n* Google Chrome 97, iPadOS 15, iPad Pro 11\" 2018\n* Google Chrome 97, Android 8.1,\
  \ Nexus 5X\n* Google Chrome 108, Android Emulator\n\n## Todo\n\n* Add some automated tests\n* Figure\
  \ out how to run automated tests on mobile devices (preferably on the cheap)\n\n## Further reading\n\
  \n* [The Large, Small, and Dynamic Viewports – Bram.us](https://www.bram.us/2021/07/08/the-large-small-and-dynamic-viewports/)\n\
  * [The trick to viewport units on mobile – CSS-Tricks](https://css-tricks.com/the-trick-to-viewport-units-on-mobile/)\n\
  * [New Viewport Units Introduced to Values and Units L4 – CSS WG Blog](https://www.w3.org/blog/CSS/2021/07/15/css-values-4-viewport-units/)\n"

readme_excerpt: "PyTRiP98\n========\n\nPyTRiP98 is a python package for working with TRiP98 and VIRTUOS/VOXELPLAN\
  \ files.\nIt is mainly supposed for batch processing, but an experimental GUI is also included\n(see\
  \ https://github.com/pytrip/pytripgui).\n\n**PyTRiP** provides several command-line applications including\
  \ ``trip2dicom``, ``dicom2trip`` and ``cubeslice``.\nThey works under Linux, Windows and Mac OSX operating\
  \ systems\n(interpreter of Python programming language has to be also installed).\nNo programming knowledge\
  \ is required from the user, but basic skills in working with the console are needed to use them.\n\n\
  \nDocumentation\n-------------\n\nFull PyTRiP documentation can be found here: https://pytrip.readthedocs.io/\n\
  \nSee `Getting Started <https://pytrip.readthedocs.org/en/stable/getting_started.html>`_ for installation\
  \ and basic\ninformation, and the `User's Guide <https://pytrip.readthedocs.org/en/stable/user_guide.html>`_\
  \ for an overview of\nhow to use the PyTRiP library.\n\nInstallation\n------------\n\nPyTRiP98 is distributed\
  \ as pre-built wheels for CPython 3.9–3.14 on Linux, macOS and Windows. The wheels are\nproduced by\
  \ `cibuildwheel <https://cibuildwheel.pypa.io/>`_ via GitHub Actions. NumPy 2.x is required.\n\nWe strongly\
  \ recommend using a Python virtual environment::\n\n    python -m venv venv\n    source venv/bin/activate\
  \  # On Windows: venv\\Scripts\\activate\n\nBasic installation (latest release from PyPI)::\n\n\tpip\
  \ install pytrip98\n\nOptional remote execution support (adds ``paramiko``)::\n\n\tpip install \"pytrip98[remote]\"\
  \n\nTo build from source (requires a C compiler and Python headers)::\n\n    git clone --recurse-submodules\
  \ https://github.com/pytrip/pytrip.git\n    cd pytrip\n    python -m venv venv\n    source venv/bin/activate\
  \  # On Windows: venv\\Scripts\\activate\n    pip install -e .\n\nThe build is managed by ``pyproject.toml``\
  \ (PEP 621) and uses ``setuptools``; NumPy (>=2.0) headers are installed\nduring wheel builds to ensure\
  \ a stable ABI.\n\nLocal Development\n-----------------\n\nTo set up a local development environment:\n\
  \n1. Clone the repository (with test-data submodules)::\n\n    git clone --recurse-submodules https://github.com/pytrip/pytrip.git\n\
  \    cd pytrip\n    # If you already cloned without submodules:\n    #   git submodule update --init\
  \ --recursive\n\n2. Create and activate a virtual environment::\n\n    python -m venv venv\n    source\
  \ venv/bin/activate  # On Windows: venv\\Scripts\\activate\n\n3. Install dependencies and the package\
  \ in editable mode::\n\n    pip install -e .[test]\n    # If your pip complains about NumPy headers,\
  \ install NumPy first:\n    #   pip install numpy\n\n4. Run tests::\n\n    python -m pytest tests/\n\
  \n5. Build the package locally::\n\n    pip install build\n    python -m build\n"

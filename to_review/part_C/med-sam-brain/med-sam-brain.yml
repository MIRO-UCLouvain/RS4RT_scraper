readme_excerpt: "# SAM Adaptation for mp-MRI Brain Tumor Segmentation\n\n> **Important Update❗️❗️❗️:**\
  \ The methodology presented in this paper has been significantly updated and improved. The new code\
  \ and model weights are now available at our new repository: [GBT-SAM](https://github.com/vpulab/gbt-sam).\
  \ Consequently, the pre-trained model weights for this older version are no longer available. We highly\
  \ encourage you to check out the new repository for the latest advancements.\n\nThis is the repository\
  \ of our accepted CVPR-2024 [paper](https://openaccess.thecvf.com/content/CVPR2024W/DEF-AI-MIA/html/Diana-Albelda_How_SAM_Perceives_Different_mp-MRI_Brain_Tumor_Domains_CVPRW_2024_paper.html)\
  \ for [DEF-AI-MIA Workshop](https://ai-medical-image-analysis.github.io/4th/). \n\nThis code has been\
  \ developed by adapting the GitHub repo https://github.com/MedicineToken/Medical-SAM-Adapter from [Junde\
  \ Wu](https://github.com/WuJunde) (thanks a lot for your amazing paper) in order to optimize the network\
  \ for brain glioma segmentation. Instructions to download the data, set the environment and train the\
  \ architecture can be found in the document [INSTRUCTIONS.md](https://github.com/vpulab/med-sam-brain/blob/main/INSTRUCTIONS.md).\n\
  \nWe address in our study the primary challenge of adapting SAM for mp-MRI brain scans, which typically\
  \ encompass multiple MRI modalities not fully utilized by standard three-channel vision models. We demonstrate\
  \ that leveraging all available MRI modalities achieves superior performance compared to the standard\
  \ mechanism of repeating a MRI scan to fit the input embedding. Furthermore, we incorporate Parameter\
  \ Efficient Fine-Tuning (PEFT) through LoRA blocks to solve the lack of SAM's medical specific knowledge.\n\
  \n### Pipeline Overview\n\n![Captura de pantalla 2024-04-11 a las 18 23 38](https://github.com/vpulab/med-sam-brain/assets/96308828/4b82d250-e471-4052-89e4-e428e2b49048)\n\
  \nWe propose to adapt the encoder by: 1) accounting for all the mp-MRI volumetric image modalities;\
  \ and 2) specifically tuning of the encoder to retain the open-world segmentation capabilities of SAM.\n\
  \n\n### Proposed Encoder\n\n![Captura de pantalla 2024-04-11 a las 18 25 17](https://github.com/vpulab/med-sam-brain/assets/96308828/13217e7d-71ad-4398-8ff8-218aece39365)\n\
  \nWe propose to modify the patch embedding layer, so that it accounts for the all the MRI modalities,\
  \ allowing for a seamless integration of the information. Then, we employ LoRAs to tune Multi Layer\
  \ Perceptron blocks (MLP) and Attention (Q,K,V embedding) layers of the \ntransformer blocks.\n\n\n\
  ### Cite:\n\n```bibtex\n@inproceedings{diana2024sam,\n  title={How SAM perceives different mp-MRI brain\
  \ tumor domains?},\n  author={Diana-Albelda, Cecilia and Alcover-Couso, Roberto and Garc{\\'\\i}a-Mart{\\\
  '\\i}n, {\\'A}lvaro and Bescos, Jesus},\n  booktitle={Proceedings of the IEEE/CVF Conference on Computer\
  \ Vision and Pattern Recognition},\n  pages={4959--4970},\n  year={2024}\n}\n"

readme_excerpt: "# Dental OPG Analysis\n\nA full-stack application that analyzes dental OPG (Orthopantomogram)\
  \ X-ray images to identify missing teeth using multiple AI models.\n\n## Features\n\n- **Multi-Model\
  \ Analysis**: Uses three AI models (GPT-4o, Gemini, Anthropic Claude) to analyze dental images\n- **Consensus\
  \ Decision**: A deciding model (GPT-5.2) evaluates all three results and determines the most accurate\
  \ analysis\n- **Quadrant-Based Results**: Identifies missing teeth in all four dental quadrants\n- **Modern\
  \ React UI**: Beautiful, responsive interface with real-time analysis\n- **Async Processing**: All three\
  \ initial models run in parallel for faster results\n\n## Project Structure\n\n```\nDental/\n├── backend/\
  \                 # FastAPI backend\n│   ├── main.py              # FastAPI application\n│   ├── config.py\
  \            # Configuration and settings\n│   ├── models.py            # Pydantic data models\n│  \
  \ ├── ai_clients.py        # AI model client implementations\n│   ├── requirements.txt     # Python\
  \ dependencies\n│   └── .env.example         # Environment variables template\n│\n├── frontend/    \
  \            # React frontend\n│   ├── src/\n│   │   ├── App.jsx          # Main application component\n\
  │   │   └── components/      # UI components\n│   ├── package.json\n│   └── vite.config.js\n│\n└── README.md\n\
  ```\n\n## Dental Quadrant System\n\n```\n        Upper\n    ┌─────┬─────┐\n    │ Q1  │ Q2  │\n    │11-18│21-28│\n\
  \    ├─────┼─────┤\n    │ Q4  │ Q3  │\n    │41-48│31-38│\n    └─────┴─────┘\n        Lower\n```\n\n\
  ## Quick Start\n\n### Backend Setup\n\n```bash\ncd backend\nsource venv/bin/activate\n# Add your API\
  \ keys to config.py or create .env file\nuvicorn main:app --reload --port 8000\n```\n\n### Frontend\
  \ Setup\n\n```bash\ncd frontend\nnpm install\nnpm run dev\n```\n\nThe frontend runs on `http://localhost:5173`\
  \ and proxies API requests to the backend.\n\n## API Keys Required\n\nAdd these to `backend/config.py`\
  \ or create a `.env` file:\n- `OPENAI_API_KEY` - For GPT-4o and GPT-5.2\n- `GOOGLE_API_KEY` - For Gemini\n\
  - `ANTHROPIC_API_KEY` - For Claude\n\n## API Endpoints\n\n- `POST /analyze` - Full analysis with all\
  \ model results\n- `POST /analyze/simple` - Simplified response with just missing teeth\n- `GET /health`\
  \ - Health check\n\n## License\n\nMIT\n"

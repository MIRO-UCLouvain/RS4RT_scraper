readme_excerpt: "# ☢️ Geant4 Nuclear Isotope Simulation Framework\n\n![image](https://github.com/user-attachments/assets/c25365dc-d29e-4e41-8e78-08b8d29b4905)\n\
  \n![image](https://github.com/user-attachments/assets/fe993a89-e9f3-426d-9305-4aa8acd89ce2)\n\n\nA Geant4-based\
  \ Monte Carlo simulation framework for modelling nuclear isotope interactions, gamma-ray transport,\
  \ detector response, and energy spectrum generation using C++.\n\nThis project explores radiation physics,\
  \ particle transport, and detector modelling for nuclear engineering and scientific computing applications.\n\
  \n---\n\n# \U0001F680 Project Overview\n\nThis simulator was developed using **Geant4**, a widely used\
  \ particle physics simulation toolkit for modelling the interaction of radiation with matter.\n\nThe\
  \ framework enables:\n\n* Gamma-ray spectrum generation\n* Nuclear isotope simulation\n* Detector geometry\
  \ modelling\n* Radiation transport analysis\n* Monte Carlo particle tracking\n* Energy deposition studies\n\
  \nThe project demonstrates applied scientific computing using:\n\n* C++\n* Geant4 physics engines\n\
  * custom detector geometries\n* particle interaction modelling\n\n---\n\n# \U0001F9E0 Scientific Problem\n\
  \nAccurate modelling of radiation behaviour is critical in:\n\n* nuclear instrumentation\n* medical\
  \ physics\n* detector design\n* radiation shielding\n* gamma spectroscopy\n* scientific research\n\n\
  Experimental testing of nuclear systems can be expensive and time consuming.\n\nMonte Carlo simulation\
  \ allows researchers and engineers to:\n\n* simulate particle interactions\n* estimate detector response\n\
  * generate gamma spectra\n* study radiation propagation\n* validate experimental setups\n\nbefore physical\
  \ implementation.\n\n---\n\n# ⚛️ Simulation Features\n\n## \U0001F539 Gamma-Ray Transport\n\nSimulates\
  \ gamma particle propagation through detector materials and shielding geometries.\n\n## \U0001F539 Detector\
  \ Geometry Modelling\n\nCustom detector and shielding geometries built using Geant4 volumes and material\
  \ definitions.\n\n## \U0001F539 Energy Deposition Analysis\n\nTracks deposited energy inside sensitive\
  \ detector regions.\n\n## \U0001F539 Monte Carlo Particle Simulation\n\nUses probabilistic particle\
  \ interaction models to simulate realistic nuclear behaviour.\n\n## \U0001F539 Spectrum Generation\n\
  \nProduces gamma spectra and histogram outputs for analysis and visualization.\n\n## \U0001F539 Material\
  \ Interaction Modelling\n\nSupports simulation of:\n\n* absorption\n* scattering\n* attenuation\n* secondary\
  \ particle interactions\n\n---\n\n# \U0001F3D7️ Detector Geometry\n\nThe simulation includes cylindrical\
  \ detector geometries and layered structures representing:\n\n* detector cores\n* shielding materials\n\
  * sensitive detector regions\n* isotope emission zones\n\nThe visualizations below demonstrate the detector\
  \ geometry and interaction regions generated using Geant4 visualization tools.\n\n---\n\n# \U0001F52C\
  \ Monte Carlo Simulation Workflow\n\n```text\nNuclear Isotope Source\n          ↓\nParticle Emission\n\
  \          ↓\nGeant4 Physics Engine\n          ↓\nMaterial Interactions\n          ↓\nDetector Energy\
  \ Deposition\n          ↓\nGamma Spectrum Generation\n          ↓\nROOT / Histogram Analysis\n```\n\n\
  ---\n\n# \U0001F4CA Example Outputs\n\nThe simulator generates:\n\n* detector geometry visualizations\n\
  * gamma-ray interaction traces\n* energy deposition histograms\n* gamma spectra\n* particle transport\
  \ outputs\n\nExample outputs include:\n\n* cylindrical detector simulations\n* shielding interaction\
  \ studies\n* radiation propagation analysis\n\n---\n\n# ⚡ Technical Highlights\n\n## Physics & Simulation\n\
  \n* Monte Carlo radiation simulation\n* Gamma transport modelling\n* Nuclear isotope interaction analysis\n\
  * Particle tracking\n* Detector response simulation\n\n## Engineering\n\n* Scientific computing in C++\n\
  * Geant4 detector construction\n* Sensitive detector implementation\n* Modular simulation design\n*\
  \ Physics list configuration\n\n## Visualization & Analysis\n\n* ROOT histogram plotting\n* Spectrum\
  \ visualization\n* Detector geometry rendering\n* Interaction path visualization\n\n---\n\n# \U0001F6E0\
  ️ Technology Stack\n\n| Category             | Technology                 |\n| --------------------\
  \ | -------------------------- |\n| Physics Engine       | Geant4                     |\n| Programming\
  \ Language | C++                        |\n| Build System         | CMake                      |\n|\
  \ Visualization        | ROOT                       |\n| Simulation Method    | Monte Carlo        \
  \        |\n| Domain               | Nuclear Physics Simulation |\n\n---\n\n# \U0001F4C8 Applications\n\
  \nThis type of simulation can support:\n\n## Nuclear Engineering\n\n* detector system design\n* shielding\
  \ analysis\n* isotope studies\n\n## Medical Physics\n\n* radiation therapy research\n* imaging system\
  \ simulation\n\n## Scientific Research\n\n* particle interaction analysis\n* gamma spectroscopy\n* radiation\
  \ transport studies\n\n## Education & Training\n\n* nuclear physics learning\n* detector modelling demonstrations\n\
  \n---\n\n# \U0001F4C2 Repository Structure\n\n```text\nsrc/                → simulation source files\n\
  include/            → detector and physics headers\n*.mac               → Geant4 macro execution files\n\
  plot*.C             → ROOT plotting scripts\nCMakeLists.txt      → CMake build configuration\nGNUmakefile\
  \         → alternative build system\n```\n\n---\n\n# ▶️ Running the Simulation\n\n## Build\n\n```bash\n\
  mkdir build\ncd build\ncmake ..\nmake\n```\n\n## Run\n\n```bash\n./Hadr06\n```\n\n## Execute Macro\n\
  \n```bash\n/control/execute vis.mac\n```\n\n---\n\n# \U0001F4CA Visualization\n\nThe simulation supports\
  \ Geant4 visualization for:\n\n* detector geometry rendering\n* particle trajectory display\n* interaction\
  \ tracking\n* radiation path analysis\n\nROOT scripts are also included for:\n\n* histogram analysis\n\
  * gamma spectrum plotting\n* detector response evaluation\n\n---\n\n# \U0001F52E Future Improvements\n\
  \nPotential future enhancements include:\n\n* advanced detector geometries\n* isotope libraries\n* GPU-accelerated\
  \ simulations\n* AI-assisted spectrum analysis\n* real detector calibration integration\n* distributed\
  \ simulation workloads\n\n---\n\n# ⚠️ Copyright & License\n\nCopyright © 2026 Mustafa Alhamdi. All rights\
  \ reserved.\n\nThis repository and its contents are provided for educational, research, and portfolio\
  \ purposes only.\n\nUnauthorized copying, redistribution, commercial usage, or reproduction of this\
  \ codebase without explicit permission is prohibited.\n\nThird-party libraries and frameworks used in\
  \ this project remain subject to their respective licenses.\n\n---\n\n# \U0001F468‍\U0001F4BB Author\n\
  \nBuilt as a scientific computing and nuclear simulation project exploring:\n\n* Monte Carlo methods\n\
  * radiation transport physics\n* detector modelling\n* Geant4 simulation systems\n* high-performance\
  \ C++ scientific engineering\n"

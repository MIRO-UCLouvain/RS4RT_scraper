readme_excerpt: "# Toxicity-Prediction\nWhat is toxicity and soureces of it:\n      Toxicity – The adverse\
  \ effects that a chemical may produce.\n      Source – Drugs, Pesticides, Natural toxins, Pollutants,\
  \ Hazardous chemicals etc.,\n\nObjective:\n      To build a robust model using Machine Learning for\
  \ toxicity prediction.\n      Identify the fragments common to both toxic and non-toxic compounds.\n\
  \  \nDataset: \n  Dataset were collected from databases like KEGG-Drug, Drug Bank, TOXNET, T3DB, FDA.\
  \ \n  \nData Pre-processing:\n  Redundant, complex structures and salt compounds were removed in this\
  \ step.\n  \nFeature Engineering:\n  Original datset size was about 5655(toxic -1) and 5334(non-toxic\
  \ -0) compounds.\n  Undersampling was performed to balance the dataset to 5334(toxic -1) and 5334(non-toxic\
  \ -0) -- Total 10,668 compunds in total.\n  \nMolecular Fingerprints:\n  The compounds structural fragments\
  \ are considered based on their presence (i.e, 0 and 1) to vector form.The types of fingerprints considered\
  \ are MACCS, PubChem, Klekota Roth, Atom Pair 2D.\n  \n Machine Learning Models used:\n  Random Forest(RF),\
  \ Support Vector Machine(Linear, RBF, Polynomial)\n  \n Model Evaluation & Validation:\n  The model\
  \ was evaluated using various metrics like Accuracy, MCC, Precision, F1-Score. Finally, the model was\
  \ evaluated using FDA dataset (size- 1566) which was not part of training dataset.\n  \nConclusion:\n\
  \  THe model was able to achieve a validation accuracy between 78%-85% with AUC of 0.75-0.98 of which\
  \ MACCS outperformed with AUC of 0.98. Developing such predictive models can be helpful in toxicity\
  \ prediction of a new drug candidate in the drug discovery pipeline.\n"

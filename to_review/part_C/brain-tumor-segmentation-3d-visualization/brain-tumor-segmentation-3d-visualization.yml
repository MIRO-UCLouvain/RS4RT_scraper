readme_excerpt: "# \U0001F9E0 Brain Tumor Segmentation & 3D Visualization\n\n[![Python](https://img.shields.io/badge/Python-3.8+-blue.svg)](https://www.python.org/)\n\
  [![PyTorch](https://img.shields.io/badge/PyTorch-1.9+-ee4c2c.svg)](https://pytorch.org/)\n[![MONAI](https://img.shields.io/badge/MONAI-0.9+-green.svg)](https://monai.io/)\n\
  [![License](https://img.shields.io/badge/License-MIT-yellow.svg)](LICENSE)\n\n> **Automated 3D Brain\
  \ Tumor Segmentation from MRI Scans using DynUNet | Interactive 2D/3D Visualization**\n\n![Demo 1](https://github.com/maskar122/Brain-Tumor-Segmentation-3D-Visualization/blob/136d86601f2525c36e6de7974cbe59329f1676c7/Segmentation/SEG/Screenshot%20(971).png)\n\
  ![Demo 2](https://github.com/maskar122/Brain-Tumor-Segmentation-3D-Visualization/blob/2947163a8aa626eb56a867a91f63a91eb8ac6a17/Segmentation/SEG/Screenshot%20(974).png)\n\
  ![Demo 3](https://github.com/maskar122/Brain-Tumor-Segmentation-3D-Visualization/blob/6863bf9ecf9798d900f41b02de575fa390805076/Segmentation/SEG/Screenshot%20(975).png)\n\
  \n---\n\n## ✨ Key Features\n\n- \U0001F9EC **3D Volumetric Segmentation** – DynUNet 3D architecture\
  \ for precise voxel-level tumor detection\n- \U0001F5A5️ **Interactive 2D Visualization** – Overlay\
  \ predicted masks and ground truth on MRI slices\n- \U0001F310 **Interactive 3D Mesh Visualization**\
  \ – Reconstruct and explore tumor volumes with Plotly\n- \U0001F680 **GPU Acceleration** – Optimized\
  \ inference with CUDA support\n- \U0001FA7B **Multi-modal MRI Support** – Handles T1, T1Gd, T2, and\
  \ FLAIR sequences\n- \U0001F4E6 **End-to-End Pipeline** – From data preprocessing to inference and visualization\n\
  \n---\n\n## \U0001F6E0️ Technologies Used\n\n| Category | Tools |\n|----------|-------|\n| **Deep Learning**\
  \ | PyTorch, MONAI, DynUNet 3D |\n| **Data Processing** | NumPy, NiBabel |\n| **Visualization** | Matplotlib,\
  \ Plotly |\n| **Environment** | Python 3.8+ |\n\n---\n\n## \U0001F4CA Dataset\n\nThis project uses the\
  \ [BraTS2020](https://www.med.upenn.edu/brats2020/) (Brain Tumor Segmentation Challenge) dataset.\n\n\
  **Modalities:**\n- T1\n- T1Gd\n- T2\n- FLAIR\n\n**Ground Truth Segmentation Labels:**\n- Label 1: Necrotic\
  \ and Non-enhancing Tumor Core\n- Label 2: Peritumoral Edema\n- Label 4: Enhancing Tumor\n\n> ⚠️ Due\
  \ to dataset size, you must download BraTS2020 separately from the official source.\n\n---\n\n## \U0001F9E0\
  \ Model Architecture\n\n**DynUNet 3D** – A dynamic deep supervision U-Net adapted for 3D medical imaging.\n\
  \n- Encoder-decoder with skip connections\n- Volumetric convolutional layers\n- Deep supervision for\
  \ gradient flow\n- Trained with Dice + Cross-Entropy loss\n\n---\n\n## \U0001F4C1 Project Structure\n\
  \n```\n├── assets/                 # Images and demo assets\n├── data/                   # Raw BraTS2020\
  \ data (not included)\n├── models/                 # Saved model weights\n├── notebooks/           \
  \   # Jupyter notebooks for exploration\n├── training/               # Training scripts and configs\n\
  ├── inference/              # Inference pipeline\n├── visualization/          # 2D/3D visualization\
  \ modules\n├── outputs/                # Segmentation results and plots\n├── requirements.txt      \
  \  # Dependencies\n└── README.md\n```\n\n---\n\n## \U0001F680 Getting Started\n\n### 1. Clone the Repository\n\
  \n```bash\ngit clone https://github.com/maskar122/Brain-Tumor-Segmentation-3D-Visualization.git\ncd\
  \ Brain-Tumor-Segmentation-3D-Visualization\n```\n\n### 2. Set Up Environment\n\n```bash\npython -m\
  \ venv venv\nsource venv/bin/activate      # Linux/Mac\nvenv\\Scripts\\activate         # Windows\n\n\
  pip install -r requirements.txt\n```\n\n### 3. Download BraTS2020 Dataset\n\nPlace the dataset in the\
  \ `data/` folder with the following structure:\n\n```\ndata/\n├── BraTS2020_TrainingData/\n├── BraTS2020_ValidationData/\n\
  └── BraTS2020_TestingData/\n```\n\n### 4. Run Training\n\n```bash\npython training/train.py --config\
  \ configs/default.yaml\n```\n\n### 5. Run Inference & Visualization\n\n```bash\npython inference/predict.py\
  \ --input data/sample_mri.nii.gz --output outputs/\npython visualization/visualize_3d.py --mask outputs/prediction.nii.gz\n\
  ```\n\n---\n\n## \U0001F4C8 Results\n\nThe model achieves competitive Dice similarity scores on the\
  \ BraTS2020 validation set:\n\n| Tumor Region | Dice Score |\n|--------------|------------|\n| Whole\
  \ Tumor | 0.89 |\n| Tumor Core | 0.85 |\n| Enhancing Tumor | 0.82 |\n\n> \U0001F4CC *Results may vary\
  \ based on training configuration and data split.*\n\n---\n\n## \U0001F52E Future Improvements\n\n-\
  \ ✅ Integrate **Transformer-based models** (SwinUNETR, nnFormer)\n- \U0001F310 Deploy as a **web-based\
  \ medical imaging tool** (Streamlit/FastAPI)\n- \U0001F9EA Support for **multi-class tumor substructure\
  \ segmentation**\n- \U0001F4C4 Automated **clinical reporting** from segmentation outputs\n- ⚡ Real-time\
  \ inference with TensorRT optimization\n\n---\n\n## \U0001F468‍\U0001F4BB Author\n\n**Mohamed Essam\
  \ Askar**  \nAI Engineer | Computer Vision & Medical Imaging\n\n[![LinkedIn](https://img.shields.io/badge/LinkedIn-Connect-blue?logo=linkedin)](https://www.linkedin.com/in/mohamed-askar-aa967b256/)\n\
  [![GitHub](https://img.shields.io/badge/GitHub-Follow-181717?logo=github)](https://github.com/maskar122)\n\
  \n---\n\n## \U0001F64F Acknowledgements\n\n- [BraTS Challenge](https://www.med.upenn.edu/brats2020/)\
  \ for the dataset\n- [MONAI](https://monai.io/) for medical imaging tools\n- [PyTorch](https://pytorch.org/)\
  \ team\n```\n\n\n"

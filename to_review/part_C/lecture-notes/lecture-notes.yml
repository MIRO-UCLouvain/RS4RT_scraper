readme_excerpt: '# Lecture-Notes


  Physics for Radiation Therapy lecture notes from Texas State University lectures in 2026

  Dosimetry (Attix) and Programming lectures given as a graduate student at UT Health San Antonio in 2020-2021


  ## Medical Physics for Radiation Therapists

  1. Mathematical background

  2. Classical mechanics, relativity, and quantum mechanics overview

  3. Atomic structure and radioactive decay


  ## Dosimetry

  1. Scattering in classical electrodynamics

  2. Photon interactions in radiotherapy

  3. Bragg-Gray cavity theory

  4. Spencer-Attix, Large, and Burlin Cavity Theories

  5. Ion chamber calibration and correction factors


  ## Python

  1. Introduction

  2. Scripting, loops, and conditionals

  3. Functions and Classes

  4. Data visualization


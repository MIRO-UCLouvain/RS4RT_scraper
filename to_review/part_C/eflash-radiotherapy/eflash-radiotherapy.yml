readme_excerpt: "\n \t     =========================================================\n               \
  \      Text version of the eFLASH_radiotherapy README file\n             =========================================================\n\
  \nAuthors: \nJake Harold Pensavalle (1,2), Giuliana Milluzzo (3) and Francesco Romano (3)\n \n\n (1)\
  \ Fisica Sanitaria, Azienda Ospedaliero Universitaria Pisa AOUP, ed.18 via Roma 67 Pisa, Italy\n\n (2)\
  \ Istituto Nazionale di Fisica Nucleare, Sezione di Pisa, Largo B. Pontecorvo 3 I Pisa, Italy\n\n (3)\
  \ Istituto Nazionale di Fisica Nucleare, Sezione di Catania, Via Santa Sofia 64 Catania, Italy\n\n\n\
  ---Contacts:\n\nJake Pensavalle: jake.pensavalle@pi.infn.it\n\nGiuliana Milluzzo: giuliana.milluzzo@ct.infn.it\n\
  \nFrancesco Romano: francesco.romano@ct.infn.it\n\n\nWHAT IT IS, WHAT IT DOES AND WHAT IT WILL PROVIDE\n\
  \nThis Example \"FLASH\" simulates the beamline and energy spectra based on the Triode Electron Gun\
  \ Equipped ElectronFlash Manufactured by Sordina Iort Technologies S.p.A. available at the Centro Pisano\
  \ Flash Radiotherapy (CPFR) at Pisa.  The linac is able to provide low-energy electron flash beams and\
  \ is currently the first machine installed in Italy capable of reaching  FLASH dose-rate (MGy/s) and\
  \ extremely high dose per pulse DPP). \n\n\n=====================BEAMLINE===============================\n\
  The beamline (set along the x-axis) is modelled in the Applicator class, starting from the titanium\
  \ windows (which is after the RF cavities not modelled in this simulation) ending at the PMMA applicator\
  \ which acts as a passive collimation of the electron beam.\nThe applicator has 5mm thick walls and\
  \ the user can set the inner and outer radius and the total length of the applicatior in the Applicator.cc\
  \ class by modifying the appropriate parameters (OuterRadiusFirstApplicatorFlash and hightFinalApplicatorFlash)\
  \  by means of the SetApplicatorLength and SetOuterRadius functions. The default is the 100mm diameter\
  \ applicator (inner diameter), but one can \nsimulate the others as follows:\n\n1) Applicator (internal\
  \ diameter) 30mm : OuterRadiusFirstApplicatorFlash = 17.5 mm,  hightFinalApplicatorFlash = 175 mm\n\n\
  2) Applicator (internal diameter) 40mm : OuterRadiusFirstApplicatorFlash = 22.5 mm,  hightFinalApplicatorFlash\
  \ = 200 mm\n\n2) Applicator (internal diameter) 50mm : OuterRadiusFirstApplicatorFlash = 27.5 mm,  hightFinalApplicatorFlash\
  \ = 225 mm\n\nOptionally one can set the length of the applicator to 0 and simulate the beam at  the\
  \ exit window, an additional 3cm of air are between the phantom to account for the applicator inserter\
  \ hooks on the machine. \n\n=====================DETECTOR CONSTRUCTOR===============================\n\
  \nThe FlashDetectorConstruction Class creates a cubic water phantom (default dimension 30x30x30 cm3)\
  \ and a detector volume. \nThe phantom is placed in contact with the applicator as a typical experimental\
  \ setup as default. The Phantom sizes can be easily modified by using the SetPhantomSize function at\
  \ the beginning of the class.\nThe user can also add an air gap between the end of the final applicator\
  \ and the entrance of the water phantom by modifying the parameter (AirGap) and the function SetAirGap\
  \ (default AirGap=0 cm).\nThe defaul material of the phantom is water (G4_WATER) but the material can\
  \ be easily changed by using the following macro commands:\nEs:\n/changePhantom/material G4_AIR\n/chagePhantom/update\n\
  \nThe user may also select the maximum step length in this class by changing the \"maxStep\" parameter.\n\
  \nA silicon carbide (SiC) detector (default thickness=10 um, default substrate=370 um, default width=5\
  \ mm) is also implemented outside the water phantom and attacched to the exit surface of the water phantom.\
  \ The width and the thickness of the active layer and of the substrate can be easily modified by means\
  \ of the SetDetectorThickness, SetDetector_subThickness, SetDetectorWidth functions at the beginnign\
  \ of the class.\nAn air gap between the phantom exit and the entrance of the detector can be also added\
  \ through the SetAirGap_water_detector function. \nThe user may also change the material of the detector\
  \ trough macro commands: \n\n/changeDetector/material G4_C\n/chageDetector/update\n\n\n=====================PRIMARY\
  \ GENERATOR=====================\n\nThe source is modelled in the FlashPrimaryGeneratorAction class\
  \ and fully uses the General Particle Source class (both in .mac commands and directly in c++ code).\
  \ \nThe beam spot is gaussian with a slight angular divergence (1.5 deg) and the electron energy spectrum\
  \ can be loaded from macro commands  chosing the 9MeV mode (using \"/control/execute 9MeVEF.mac\") \n\
  or the 7MeV mode (using \"/control/execute 7MeVEF.mac). The geometry of the beam can be set by the user\
  \ by changing the position, sigma and theta values in \nFlashPrimaryGeneratorAction.cc. \n\n\n\n=====================SCORING\
  \ MESH=====================\n\nA scoring mesh is implemented in .mac file commands.\nA default 120x4x4\
  \ mm3 scorer with 120x1x1 number nbin simulating a similar volume as the Advanced Markus Chamber is\
  \ created in the position of the water phantom to register the dose in Gy delivered in each voxel. Results\
  \ are printed in the file dose.out at the end of the simulation. User may change the dimensions and\
  \ bin number (voxel size) to appropiately score the volume of interest and optimize the simulation (a\
  \ very finely voxellized volume may increase the simulation time significantly).\n\n=====================ENERGY\
  \ SPECTRUM=====================\nThe primary particle energy spectrum at the entrance of the phantom\
  \ (downstream the beamline) is also registered using the FlashSteppingAction class. An ASCII file is\
  \ automatically written with the following information:\n\nparentid eventid kineticEnergy pos_x pos_y\
  \ pos_z momentum  cos_x cos_y cos_z\n\nIf user is not interested on the retrieval of the energy spectrum\
  \ can easily comment the line in the SteppinAction class. \n\n\n=====================PHYSICS PROCESSES\
  \ AND PHYSICS LIST =====================\n\nEM Standard option 4 is activated. The user can change the\
  \ physics list in the physics list class. A production cut for gammas e+ and e- can be applied provided\
  \ the specification of the Region name defined \nin the FlashDetectorConstruction Class (Default region\
  \ is the water phantom). \n\n\n\n"

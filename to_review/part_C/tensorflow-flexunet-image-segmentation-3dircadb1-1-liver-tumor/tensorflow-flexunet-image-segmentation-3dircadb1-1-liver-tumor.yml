readme_excerpt: "<h2>TensorFlow-FlexUNet-Image-Segmentation-3Dircadb1.1-Liver-Tumor (2026/06/03)</h2>\n\
  Sarah T. Arai<br>\nSoftware Laboratory antillia.com<br><br>\nThis is the first experiment of Image Segmentation\
  \ for <b>3Dircadb1.1 Liver Tumor</b> based on \nour <a href=\"./src/TensorFlowFlexUNet.py\">TensorFlowFlexUNet</a>\n\
  \ (<b>TensorFlow Flexible UNet Image Segmentation Model for Multiclass</b>), and a 512x512 pixels PNG\n\
  \ <a href=\"https://drive.google.com/file/d/1qhxfcJTrMkvwmA4BC4nu8lmTSqWV_Pnr/view?usp=sharing\">\n\
  3Dircadb1.1-ImageMask-Dataset.zip</a>, which was derived by us from <br><br>\n<a href=\"https://www.kaggle.com/datasets/vijayas123/liver-tumor-segmentation-3dircadb3d\"\
  >\n<b>3Dircadb 3d dataset</b>\n</a> by IJAY A S123.\n<br><br>\n<hr>\n<b>Actual Image Segmentation for\
  \ 3Dircadb1.1 Images of 512x512 pixels</b><br>\nAs shown below, the inferred masks predicted by our\
  \ segmentation model trained by the dataset appear similar to \nthe ground truth masks.\n<br><br>\n\
  <b>class-color-map = {Liver:blue, Liver-tumor:red}</b>\n<br><br>\n<table>\n<tr>\n<th>Input: image</th>\n\
  <th>Mask (ground_truth)</th>\n<th>Prediction: inferred_mask</th>\n</tr>\n<tr>\n<td><img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/mini_test/images/10016_100.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/mini_test/masks/10016_100.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/mini_test_output/10016_100.png\"\
  \ width=\"320\" height=\"auto\"></td>\n</tr>\n\n<tr>\n<td><img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/mini_test/images/10017_64.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/mini_test/masks/10017_64.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/mini_test_output/10017_64.png\"\
  \ width=\"320\" height=\"auto\"></td>\n</tr>\n\n<tr>\n<td><img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/mini_test/images/10017_104.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/mini_test/masks/10017_104.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/mini_test_output/10017_104.png\"\
  \ width=\"320\" height=\"auto\"></td>\n</tr>\n</table>\n<hr>\n<br>\n<h3>1. Dataset Citation</h3>\nThe\
  \ dataset used here was derived from <br><br>\n<a href=\"https://www.kaggle.com/datasets/vijayas123/liver-tumor-segmentation-3dircadb3d\"\
  >\n<b>3Dircadb 3d dataset</b>\n</a> by IJAY A S123.\n<br>\n<br>\nFor the more information of the original\
  \ dataset, please refer to\n<a href=\"https://www.ircad.fr/research/data-sets/liver-segmentation-3d-ircadb-01/\"\
  >\nLiver segmentation 3D-IRCADb-01\n</a>\n<br><br>\nThe 3D-IRCADb-01 database is composed of the 3D\
  \ CT-scans of 10 women and 10 men with hepatic tumours in 75% of cases. <br>\nThe 20 folders correspond\
  \ to 20 different patients, which can be downloaded individually or conjointly. <br>\nThe table below\
  \ provides information on the image, such as liver size (width, depth, height) or the location of \n\
  tumours according to Couninaud’s segmentation. <br>\nIt also indicates the major difficulties liver\
  \ segmentation software may encounter due to the contact \nwith neighbouring organs, an atypical shape\
  \ or density of the liver, or even artefacts in the image.\n<br><br>\n<b>License</b><br>\n<a href=\"\
  https://creativecommons.org/publicdomain/zero/1.0/\">CC0: Public Domain</a>\n<br>\n<br>\n<h3>\n2 3Dircadb1.1\
  \ ImageMask Dataset\n</h3>\n<h3>2.1 3Dircadb1.1 ImageMask Dataset</h3>\n If you would like to train\
  \ this 3Dircadb1.1 Segmentation model by yourself,\n please download the dataset from the google drive\
  \  \n <a href=\"https://drive.google.com/file/d/1qhxfcJTrMkvwmA4BC4nu8lmTSqWV_Pnr/view?usp=sharing\"\
  >\n3Dircadb1.1-ImageMask-Dataset.zip</a> \n, expand the downloaded ImageMaskDataset and put it under\
  \ <b>./dataset</b> folder to be\n<br>\n<pre>\n./dataset\n└─3Dircadb1.1\n    ├─test\n    │   ├─images\n\
  \    │   └─masks\n    ├─train\n    │   ├─images\n    │   └─masks\n    └─valid\n         ├─images\n \
  \        └─masks\n</pre>\n<br>\n<b>3Dircadb1.1 Statistics</b><br>\n<img src =\"./projects/TensorFlowFlexUNet/3Dircadb1.1/3Dircadb1.1_Statistics.png\"\
  \ width=\"512\" height=\"auto\"><br>\n<br>\nAs shown above, the number of images of train and valid\
  \ datasets is large enough to use for the\n training set of our segmentation model.\n<br>\n<br>\n<h3>2.2\
  \ Derivation of 3Dircadb1.1 ImageMask Dataset</h3>\nThe folder of the original <b>3Dircadb1.1 BC</b>\
  \ dataset is the following.<br>\n<pre>\n└─3Dircadb\n    ├─3Dircadb1.1\n    │   ├─ct_3d\n    │   │  \
  \ └─patient_1_ct_3d.npy\n    │   └─masks_3d\n    │        └─patient_1_3d_mask.npy\n...\n    └─3Dircadb1.20\n\
  \         ├─ct_3d\n         │   └─patient_20_ct_3d.npy\n         └─masks_3d\n              └─patient_20_3d_mask.npy\n\
  </pre>\nWe generated a 512x512 pixels PNG ImageMask dataset from all pairs of 2D slice images and their\
  \ corresponding colorizied \nslice masks (Liver:blue, Liver-tumor:red)\n from NPY 3D volume files in\
  \ <b>3Dircadb1.* </b> folders.\nHowever, for simplicity, we excluded all empty black mask and their\
  \ corresponding image slices of the NPY volumes to generate\nour dataset,\nbecause they were irrelevant\
  \ to train our segmentation model.<br>\n<br>\n\n<h3>2.3 Train Sample Images and Masks</h3>\n\n<b>Train\
  \ sample images</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/asset/train_images_sample.png\"\
  \ width=\"1024\" height=\"auto\">\n<br>\n<b>Train sample masks</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/asset/train_masks_sample.png\"\
  \ width=\"1024\" height=\"auto\">\n<br>\n<h3>\n3 Train TensorFlowFlexUNet Model\n</h3>\n We trained\
  \ 3Dircadb1.1 TensorFlowFlexUNet Model by using the \n<a href=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/train_eval_infer.config\"\
  > <b>train_eval_infer.config</b></a> file. <br>\nPlease move to ./projects/TensorFlowFlexUNet/3Dircadb1.1\
  \ and run the following bat file.<br>\n<pre>\n>1.train.bat\n</pre>\n, which simply runs the following\
  \ command.<br>\n<pre>\n>python ../../../src/TensorFlowFlexUNetTrainer.py ./train_eval_infer.config\n\
  </pre>\n<hr>\n\n<b>Model parameters</b><br>\nDefined a small <b>base_filters = 16 </b> and large <b>base_kernels\
  \ = (11,11)</b> for the first Conv Layer of Encoder Block of \n<a href=\"./src/TensorFlowFlexUNet.py\"\
  >TensorFlowFlexUNet.py</a> \nand a large <b>num_layers = 8</b> (including a bridge between Encoder and\
  \ Decoder Blocks).\n<pre>\n[model]\n;You may specify your own UNet class derived from our TensorFlowFlexModel\n\
  model         = \"TensorFlowFlexUNet\"\nimage_width    = 512\nimage_height   = 512\nimage_channels =\
  \ 3\ninput_normalize = True\nnormalization  = False\nnum_classes    = 3\nbase_filters   = 16\nbase_kernels\
  \   = (11,11)\nnum_layers     = 8\ndropout_rate   = 0.05\ndilation       = (1,1)\n</pre>\n<b>Learning\
  \ rate</b><br>\nDefined a small learning rate.  \n<pre>\n[model]\nlearning_rate  = 0.00007\n</pre>\n\
  <b>Loss and metrics functions</b><br>\nSpecified \"categorical_crossentropy\" and <a href=\"./src/dice_coef_multiclass.py\"\
  >\"dice_coef_multiclass\"</a>.<br>\n<pre>\n[model]\nloss           = \"categorical_crossentropy\"\n\
  metrics        = [\"dice_coef_multiclass\"]\n</pre>\n<b>Dataset class</b><br>\nSpecifed <a href=\"./src/ImageCategorizedMaskDataset.py\"\
  >ImageCategorizedMaskDataset</a> class.<br>\n<pre>\n[dataset]\nclass_name    = \"ImageCategorizedMaskDataset\"\
  \n</pre>\n<br>\n<b>Learning rate reducer callback</b><br>\nEnabled learing_rate_reducer callback, and\
  \ a small reducer_patience.\n<pre> \n[train]\nlearning_rate_reducer = True\nreducer_factor     = 0.4\n\
  reducer_patience   = 4\n</pre>\n<b>Early stopping callback</b><br>\nEnabled early stopping callback\
  \ with patience parameter.\n<pre>\n[train]\npatience      = 10\n</pre>\n<b>RGB Color map</b><br>\nSpecifed\
  \ rgb color map dict for 3Dircadb1.1 1+2 classes.<br>\n<pre>\n[mask]\nmask_datatyoe    = \"categorized\"\
  \nmask_file_format = \".png\"\n;3Dircadb1.1rgb color map dict for 1+2 classes.\n;                  \
  \   Liver:blue,    Liver-tumor:red\nrgb_map = {(0,0,0):0, (0, 0, 255):1, (255,0,0):2, }\n</pre>\n<b>Epoch\
  \ change inference callback</b><br>\nEnabled <a href=\"./src/EpochChangeInferencer.py\">epoch_change_infer\
  \ callback</a></b>.<br>\n<pre>\n[train]\nepoch_change_infer       = True\nepoch_change_infer_dir   =\
  \  \"./epoch_change_infer\"\nnum_infer_images         = 6\n</pre>\nBy using this callback, on every\
  \ epoch_change, the inference procedure can be called\n for 6 images in <b>mini_test</b> folder. This\
  \ will help you confirm how the predicted mask changes \n at each epoch during your training process.<br>\
  \ \n<br> \nAs shown below, early in the model training, the predicted masks from our UNet segmentation\
  \ model showed \ndiscouraging results.\n However, as training progressed through the epochs, the predictions\
  \ gradually improved. \n <br> \n<br>\n<b>Epoch_change_inference output at starting (epoch 1,2,3)</b><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/asset/epoch_change_infer_at_start.png\" width=\"\
  1024\" height=\"auto\"><br>\n<br>\n<b>Epoch_change_inference output at middlepoint (epoch 23,24,25)</b><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/asset/epoch_change_infer_at_middle.png\" width=\"\
  1024\" height=\"auto\"><br>\n<br>\n\n<b>Epoch_change_inference output at ending (epoch 48,49,50)</b><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/asset/epoch_change_infer_at_end.png\" width=\"\
  1024\" height=\"auto\"><br>\n<br>\n\nIn this experiment, the training process was terminated at epoch\
  \ 50.<br><br>\n<img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/asset/train_console_output_at_epoch50.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n<br>\n\n<a href=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/eval/train_metrics.csv\"\
  >train_metrics.csv</a><br>\n<img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/eval/train_metrics.png\"\
  \ width=\"520\" height=\"auto\"><br>\n\n<br>\n<a href=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/eval/train_losses.csv\"\
  >train_losses.csv</a><br>\n<img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/eval/train_losses.png\"\
  \ width=\"520\" height=\"auto\"><br>\n<br>\n<h3>\n4 Evaluation\n</h3>\nPlease move to <b>./projects/TensorFlowFlexUNet/3Dircadb1.1</b>\
  \ folder,\nand run the following bat file to evaluate TensorFlowUNet model for 3Dircadb1.1.<br>\n<pre>\n\
  >./2.evaluate.bat\n</pre>\nThis bat file simply runs the following command.\n<pre>\n>python ../../../src/TensorFlowFlexUNetEvaluator.py\
  \ ./train_eval_infer_aug.config\n</pre>\n\nEvaluation console output:<br>\n<img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/asset/evaluate_console_output_at_epoch50.png\"\
  \ width=\"1024\" height=\"auto\">\n<br><br>Image-Segmentation-3Dircadb1.1\n\n<a href=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/evaluation.csv\"\
  >evaluation.csv</a><br>\nThe loss (categorical_crossentropy) to this <b>3Dircadb1.1/test</b> was very\
  \ low and dice_coef_multiclass very high as shown below.\n<br>\n<pre>\ncategorical_crossentropy,0.0065\n\
  dice_coef_multiclass,0.997\n</pre>\n<br>\n<h3>\n5 Inference\n</h3>\nPlease move to a <b>./projects/TensorFlowFlexUNet/3Dircadb1.1</b>\
  \ folder<br>\n,and run the following bat file to infer segmentation regions for images by the Trained-TensorFlowUNet\
  \ model for 3Dircadb1.1.<br>\n<pre>\n>./3.infer.bat\n</pre>\nThis simply runs the following command.\n\
  <pre>\n>python ../../../src/TensorFlowFlexUNetInferencer.py ./train_eval_infer_aug.config\n</pre>\n\
  <hr>\n<b>mini_test_images</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/asset/mini_test_images.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n<b>mini_test_mask(ground_truth)</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/asset/mini_test_masks.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n<hr>\n<b>Inferred test masks</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/asset/mini_test_output.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n<br>\n<hr>\n<b>Enlarged images and masks of 3Dircadb1.1 Images</b><br>\n\
  As shown below, the inferred masks predicted by our segmentation model trained by the dataset appear\
  \ similar \nto the ground truth masks.\n<br><br>\n<b>class-color-map = {Liver:blue, Liver-tumor:red}</b>\n\
  <br><br>\n<table>\n<tr>\n<th>Image</th>\n<th>Mask (ground_truth)</th>\n<th>Inferred-mask</th>\n</tr>\n\
  <tr>\n<td><img src=\"./projects/TensorFlowFlexUNet/3Dircadb1.1/mini_test/images/1001"

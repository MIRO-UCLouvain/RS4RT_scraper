readme_excerpt: "# chemical_toxicity_prediction_challenge\n\nHow to run the file - \nThere are three ways\
  \ to execute the toxicity_prediction_challenge.ipynb file.\n\n- Locally : The data and code can be downloaded\
  \ from this github repository and run on a local IDE or Jupyter Notebook.\n  System setup and Requirement\
  \ - \n\n  Programming-Language: Python\n\n  Python package requirements:\n  (Following packages can\
  \ be installed using \"pip\", for e.g., \"pip install pandas\")\n  pandas\n  numpy\n  scikit-learn\n\
  \  statistics\n  xgboost\n\n- The file also has a google colab link and can be executed on google colab.\
  \ \n\n- The third option to run the file is to download the files, upload them to Google Colab and run\
  \ them\n\n## What if the file does not run?\n\nChange the train and test data file locations to run\
  \ the file successfully.\n"

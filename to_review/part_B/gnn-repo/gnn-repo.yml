readme_excerpt: "⚛️ GNN Toxicity Predictor\n\nA Multi-Model Graph Neural Network System for Molecular\
  \ Toxicity Prediction (Tox21)\n\n<p align=\"center\"> <img src=\"banner.svg\" width=\"100%\"> </p>\n\
  \U0001F4D8 Overview\n\nGNN Toxicity Predictor is a complete end-to-end machine learning system for predicting\
  \ 12 toxicity endpoints from molecular structures using Graph Neural Networks (GNNs).\nIt is built on:\n\
  \nPyTorch\n\nPyTorch Geometric\n\nRDKit\n\nTox21 dataset\n\nThis project supports five state-of-the-art\
  \ GNN architectures:\n\nGNN (recommended)\n\nGCN\n\nGAT\n\nGIN\n\nPNA (experimental — needs degree calculation)\n\
  \nThe system includes:\n\n✔ Automatic checkpointing\n✔ Resume training seamlessly\n✔ Fresh training\
  \ mode\n✔ Model selection menu\n✔ NumPy-free compatible prediction\n✔ Automatic model detection for\
  \ prediction & evaluation\n✔ Full plotting utilities\n✔ Detailed evaluation (per-task AUC & mean AUC)\n\
  \n\U0001F9EC Supported Toxicity Endpoints (Tox21)\nCategory\tTasks\nNuclear Receptor Signaling\tNR-AR,\
  \ NR-AR-LBD, NR-AhR, NR-Aromatase, NR-ER, NR-ER-LBD, NR-PPAR-gamma\nStress Response\tSR-ARE, SR-ATAD5,\
  \ SR-HSE, SR-MMP, SR-p53\n\U0001F680 Quick Start\n1️⃣ Install Dependencies\n\nUsing conda (recommended):\n\
  \nconda env create -f environment.yml\nconda activate chem\n\n\nOr using pip:\n\npip install -r requirements.txt\n\
  \n\nDataset is already included (data/tox21.csv).\n\n\U0001F3CB️ Training Models\n▶ Start training\n\
  python -m src.train --epochs 50\n\n\nYou will see an interactive model menu:\n\n1. GNN  - Fast, high\
  \ accuracy (recommended)\n2. GAT  - Very fast, lower accuracy\n3. GCN  - Fast, stable, simple\n4. GIN\
  \  - Strong accuracy, slower\n5. PNA  - Best accuracy, slowest\n\n✔ Features During Training\n\nAuto-resume\
  \ from:\n\ncheckpoints/<MODEL>/latest.pt\n\n\nBest model saved to:\n\ncheckpoints/<MODEL>/best.pt\n\n\
  \nTraining history stored in JSON\n\nEarly stopping (patience 15)\n\nLR scheduler (ReduceLROnPlateau)\n\
  \n♻️ Fresh Training (start from scratch)\npython -m src.train --model GNN --fresh --epochs 50\n\n\n\
  Only deletes checkpoints of the selected model.\n\n\U0001F39B️ Useful Training Flags\nFlag\tDescription\n\
  --epochs N\tNumber of epochs\n--model NAME\tGNN, GCN, GAT, GIN, PNA\n--fresh\tDelete checkpoints and\
  \ retrain\n--reprocess\tReprocess Tox21 dataset\n--batch_size\tBatch size\n--seed\tTraining reproducibility\n\
  \U0001F52E Predict Toxicity From SMILES\nBasic prediction\npython -m src.predict --smiles \"CCO\"\n\n\
  \nAuto-detects the newest trained model.\n\nPredict with a specific model\npython -m src.predict --smiles\
  \ \"CCO\" --model GCN\n\nExample Output\n=== Toxicity Predictions ===\n(Model used: GNN)\n\nNR-AR: 0.1389\n\
  NR-ER: 0.2419\n...\nSR-p53: 0.1209\n\n\U0001F4CA Evaluation\n\nRun AUC evaluation on full Tox21 dataset:\n\
  \npython -m src.eval --model GNN\n\n\nAuto-detect latest model:\n\npython -m src.eval\n\n\nOutputs:\n\
  \nPer-task AUC\n\nMean AUC\n\nSaves JSON to:\n\ncheckpoints/<MODEL>/eval_results.json\n\n\U0001F4C8\
  \ Plot Training Metrics\npython -m src.plot_metrics --model GCN\n\n\nPlots saved in:\n\ncheckpoints/<MODEL>/plots/\n\
  \n\U0001F4C1 Project Structure\n\n````\nGNN Toxicity Predictor\n│\n├── src/\n│ ├── train.py # Training\
  \ engine\n│ ├── predict.py # SMILES → Prediction\n│ ├── eval.py # AUC evaluation\n│ ├── plot_metrics.py\
  \ # Loss/AUC plotting\n│ │\n│ ├── data/\n│ │ └── dataset.py # Tox21 loader\n│ │\n│ ├── models/\n│ │\
  \ ├── gnn.py\n│ │ ├── gcn.py\n│ │ ├── gat.py\n│ │ ├── gin.py\n│ │ ├── pna.py\n│ │ └── model_registry.py\n\
  │ │\n│ └── utils/\n│\n├── checkpoints/\n│ └── <MODEL>/\n│ ├── latest.pt\n│ ├── best.pt\n│ ├── history.json\n\
  │ └── plots/\n│\n├── data/\n│ └── tox21.csv\n│\n├── environment.yml\n├── requirements.txt\n├── banner.svg\n\
  └── README.md\n````\n\n\U0001F9EA Model Performance\n\nLatest results (example):\n\nModel\tMean AUC\n\
  GNN\t0.69\nGCN\t0.66\nGAT\t0.64\nGIN\t0.67\nPNA\t(not supported in eval)\n\U0001F64B FAQ\nQ: I see “Numpy\
  \ is not available” warnings. Is this a problem?\n\nNo — your system works perfectly without NumPy,\
  \ and the project includes full NumPy-free fallback logic.\n\nQ: Can I train multiple models?\n\nYes\
  \ — each model has its own folder under checkpoints/.\n\n\n\U0001F4DC License\n\nThis project is released\
  \ under the MIT License.\n\n⭐ If you like this project, please star the repo!\n"

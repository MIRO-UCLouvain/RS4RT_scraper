  \ model:\nRequirements\n\nThis project should work fine with the following environments:\n\n    Python\
  \ 3.7.11 for training & evaluation with:\n        Pytorch 1.8.1+cu101\n        numpy 1.20.3\n    GPU\
  \ with CUDA 10.1\n\nAll the experiments are conducted on a single 11G GeForce GTX 1080Ti GPU.\nHow to\
  \ Run\nUnzip datasets\n\nbash\n\nunzip -o -d dataset/ dataset/JW44K-6K.zip\n\nunzip -o -d dataset/ dataset/HTDM.zip\n\
  \nTraining & Evaluation\n\nTo train and evaluate the DVHE model for tasks of link prediction and entity\
  \ typing on JW44K-6K dataset, please run:\n\nbash\n\npython run.py\n\nTo train and evaluate the DVHE\
  \ model for tasks of medicine prediction and medicine class prediction on HTDM dataset, please run:\n\
  \nbash\n\npython run_med.py\n\n"

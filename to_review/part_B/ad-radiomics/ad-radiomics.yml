readme_excerpt: "# Radiomic-Based Machine Learning Models for Alzheimer's Disease Classification and Progression\
  \ Prediction\n\nThis repository supports the study titled _\"Radiomic-based investigation of a potential\
  \ link between precuneus and fusiform gyrus with Alzheimer’s disease\"_, which explores structural biomarkers\
  \ from MRI data to distinguish stages of Alzheimer’s Disease (AD) and predict its progression using\
  \ machine learning models.\n\n## \U0001F4CC Overview\n\nThis project applies radiomic feature analysis\
  \ of the precuneus and fusiform gyrus regions from T1-weighted MRI images using FreeSurfer. It implements:\n\
  \n- **Random Forest Classification** models for binary classification (AD vs CN, AD vs MCI, MCI vs CN)\
  \ with and without age.\n- **Linear Regression** and **ARIMA Time-Series** models to predict disease\
  \ progression using volumetric and surface-based MRI features.\n\n## \U0001F9E0 Dataset\n\n- Data is\
  \ sourced from the [Alzheimer's Disease Neuroimaging Initiative (ADNI)](http://adni.loni.usc.edu/)\n\
  - 382 subjects: CN (134), MCI (149), AD (99)\n- Four time points: baseline, 6, 12, and 24 months\n\n\
  ## \U0001F9EA Features\n\n- 9 radiomic features extracted bilaterally from precuneus and fusiform gyrus\
  \ using FreeSurfer:\n  - Gray Matter Volume (GMV), Cortical Thickness (CT), Surface Area, Curvatures,\
  \ etc.\n\n## \U0001F6E0️ Implementation\n\n- **Classification scripts** implemented in Python using\
  \ `scikit-learn`, `imblearn`, and `joblib` for model training and persistence. See `AD_classification_script.py`.\n\
  - **Linear Regression & Time-Series modeling** implemented in:\n  - **Python**: Linear Regression using\
  \ `statsmodels` or `scikit-learn`\n  - **R**: ARIMA models using `forecast::auto.arima()` (see `AD_TimeSeries_Script.Rmd`)\n\
  - Statistical tests conducted using `scipy.stats.mannwhitneyu` in Python and post-hoc Benjamini-Hochberg\
  \ correction.\n\n## \U0001F5C2️ File Structure\n\n```\n\U0001F4C1 AD_Radiomics_Classification\n├── AD_classification_script.py\
  \           # Random forest models for all group pairs\n├── AD_TimeSeries_Script.Rmd              #\
  \ Time-series model (ARIMA) and regression in R\n├── AD_LinearRegression_script.html       # HTML output\
  \ of linear regression analysis\n\n```\n\n## \U0001F680 Getting Started\n\n### Dependencies\n\nInstall\
  \ Python dependencies:\n\n```bash\npip install -r requirements.txt\n```\n\nInstall R dependencies:\n\
  \n```r\ninstall.packages(c(\"forecast\", \"ggplot2\", \"dplyr\", \"tidyverse\"))\n```\n\n### Running\
  \ the Models\n\n#### 1. Classification\n\n```bash\npython AD_classification_script.py\n```\n\n#### 2.\
  \ Time-Series & Regression\n\nOpen and run the R Markdown script:\n\n```r\nrmarkdown::render(\"AD_TimeSeries_Script.Rmd\"\
  )\n```\n\n## \U0001F4C8 Results Summary\n\n- **Classification** models achieved up to 85.7% test accuracy\
  \ (AD vs CN).\n- **Time-series models** reached up to 0.98 Pearson correlation for predicting radiomic\
  \ feature evolution (e.g., left fusiform GMV).\n\n## \U0001F4C4 Citation\n\nIf you use this code or\
  \ dataset, please cite the manuscript once published.\n\n## \U0001F6E1️ License\n\nThis project is open-sourced\
  \ for academic use. See [LICENSE](LICENSE) for more details.\n"

readme_excerpt: ' # Breast Cancer Ultrasound Classification

  Academic project for the Computer Vision subject (2024)


  This repository contains a deep learning pipeline for classifying breast cancer tumors in ultrasound
  images. The dataset is structured in folders by class, and labels are provided via a CSV file.


  Images are preprocessed to enhance quality by first applying a denoising filter and then sharpening
  to highlight relevant features. Data augmentation techniques such as flips, rotations, zoom, and brightness
  shifts are applied to increase variability and robustness.


  The model is based on the InceptionResNetV2 architecture, pretrained on ImageNet and fine-tuned for
  multi-class classification. Training uses the Adam optimizer with categorical cross-entropy loss, and
  early stopping is employed to prevent overfitting. Performance is evaluated using accuracy, F1 score,
  and confusion matrix.


  To improve model interpretability, a heatmap-based visualization technique is used at the end of the
  notebook to highlight the regions of the input image that contribute most to the model’s prediction.
  This helps verify whether the model is focusing on clinically relevant areas.


  The code is intended to run in Google Colab, with data accessed via Google Drive.


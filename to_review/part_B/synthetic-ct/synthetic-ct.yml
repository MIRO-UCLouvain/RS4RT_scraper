readme_excerpt: "# [Improving Tuberculosis (TB) Prediction using Synthetically Generated Computed Tomography\
  \ (CT) Images](https://arxiv.org/abs/2109.11480)\n*Ashia Lewis, Evanjelin Mahmoodi, Yuyue Zhou, Megan\
  \ Coffee, Elena Sizikova*\n\nHerein lies the system for the analysis of synthetic CT scans simulating\
  \ various forms of tuberculosis, as used in the paper. The data first allows for the processing of x-rays\
  \ into synthetic CT scans, then includes the codebase for (1) the identification of tuberculosis and\
  \ (2) the classification of modes of tuberculosis. \n\n## Quantitative Results \n\n**Tuberculosis Identification\
  \ Evaluation**\n\n<img src=\"https://github.com/AeRabelais/synthetic_ct/blob/main/images/tb_identification.PNG\"\
  \ width=30% height=30%>\n\n**Tuberculosis Classification Evaluation**\n\n<img src=\"https://github.com/AeRabelais/synthetic_ct/blob/main/images/tb_classification.PNG\"\
  \ width=30% height=30%>\n\n**Distinguishing TB vs TB Sequelae**\n\n<img src=\"https://github.com/AeRabelais/synthetic_ct/blob/main/images/tb_tbseq.PNG\"\
  \ width=30% height=30%>\n\n## Data Demo\n\nGive a useful walkthrough of how all the pieces of data fit\
  \ together/how they're used.\n\n## Citation \n\nThe following citation can be used.\n```\n  @misc{Vo21LOD,\n\
  \    title     = {Improving Tuberculosis (TB) Prediction using Synthetically Generated Computed Tomography\
  \ (CT) Images},\n    author    = {Lewis, Ashia and Mahmoodi, Evanjelin and Zhou, Yuyue and Coffee, Megan\
  \ and Sizikova, Elena},\n    year      = {2021},\n    eprint={2109.11480},\n    archivePrefix={arXiv},\n\
  \    primaryClass={cs.CV}\n}\n```\n\n## Acknowledgments\n\nAshia Lewis and Evanjelin Mahmoodi were supported\
  \ by the NYU Center for Data Science (CDS) Capital One Undergraduate Research Program (CURP) in partnership\
  \ with the National Society of Black Physicists (NSBP). Elena Sizikova was supported by the Moore-Sloan\
  \ Data Science Environment initiative (funded by the Alfred P. Sloan Foundation and the Gordon and Betty\
  \ Moore Foundation) through the NYU Center for Data Science. We thank the anonymous reviewers for their\
  \ feedback.\n\n## TO-DO\n\n- [X] Add results table /insight\n- [ ] Update the data demo\n- [ ] Add the\
  \ code, clean and commented!\n- [ ] Add info blurb about access to datasets.\n"

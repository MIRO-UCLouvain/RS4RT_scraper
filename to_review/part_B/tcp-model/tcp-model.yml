readme_excerpt: "# Low Level TCP Server\n\nThis is a TCP server that echos the client's messages back.\
  \ This was built using C++.\n\n## How does it work?\n\n* First, a socket connection is established with\
  \ the `socket()` that takes an `int domain`, `int type`, and `int protocol`.\n* A socket address of\
  \ type `sockaddr_in` is binded to the socket created.\n* The `sockaddr` structure is then converted\
  \ to a pair of host name and service strings with `getnameinfo()`.\n* A buffer is used to receive the\
  \ bytes and display them to STDOUT.\n\n## Proof of Concept\nTo run the server, use `git clone` to use\
  \ this project and `cd tcp-server`. Use `make` to compile the program and run the executable like so:\n\
  \n```\n./server\n```\n\nThe `telnet` command is then used to communicate with the server, like so:\n\
  \n```\ntelnet localhost <PORT> \n```\nAnd now you can echo the client's messages back!\n\n![Tcp Gif](images/tcpgif.gif)\n\
  \n### Using the Client Interface\n\nAlternatively, you can build the same version of `telnet` to connect\
  \ to the server.\n\nTo run the client, `cd tcp-client`. Use `make` to compile the program and run the\
  \ executable like so:\n\n```\n./client\n```\n\nA command line interface will pop up asking the user\
  \ to provide a message to send to the server. The following is demonstrated like so:\n\n![Tcp Gif2](images/tcpgif2.gif)\n\
  \n"

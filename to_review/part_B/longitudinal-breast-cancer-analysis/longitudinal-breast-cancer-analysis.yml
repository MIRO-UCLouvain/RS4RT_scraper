readme_excerpt: "# ISPY2 Multi-Sequential Modeling\n### By: Chris Gerlach, MIDI Lab PhD Student at MSU\n\
  \n#### *For those on GitHub*: I am using my README file as a progress tracker. Some people use Docs;\
  \ others Notion. I am a madman using my own README. With that settled...\n\nWelcome to my longitudinal\
  \ analysis of the ISPY2 dataset. Ask yourself, what do you do when you're tired of dealing with predicitive\
  \ analytics for small data? My answer? Question if you're throttling your HPC trying to download 7 million\
  \ breast cancer MRIs with 128 CPUs.\n\nI am trying to find new, accurate ways to incorporate temporal\
  \ knowledge into medical imaging. Modern day cancer radiomics typically looks something like:\n1. Person\
  \ gets *tomographic* image of their *area in question*\n2. Doctor looks at image\n3. Doctor looks at\
  \ chart\n4. Doctor does doctor thinking\n5. Doctor comes up with diagnosis\n\nMy goal is to add time\
  \ to the process. Especially after diagnosis, resection or during remission, many people have multiple\
  \ doctors visits at different points in time. The question typically remains the same: is the tumor\
  \ growing or shrinking? But what if we could ask how the rate of growth or shrinkage could help in diagnosis\
  \ or treatment? What if we could find underlying structures in tumor growth?\n\nMany current longitudinal\
  \ models make an assumption that the time series is sampled uniformly at a rate that is fast enough\
  \ that one can make data samples of relatively long sequences. To be fair, most are. However, in medical\
  \ imaging, sampling is incredibly variable; it could be days, weeks, months, or even years between images.\
  \ And adding in daily X-rays probably isn't the best idea for solving this problem.\n\nSo what do we\
  \ do? This repository will be an exploration of these ideas.\n\n### Week of March 31, 2025\n\n*For those\
  \ in MIDI Lab:* From my last project--see the `glioma_analysis` project on HPCC--I haven't been able\
  \ to make much progress due to the small data nature of the dataset. This dataset expands on the glioma\
  \ project by studying the ISPY2 dataset. I was able to scale the glioma project and created a multi-omics,\
  \ multi-modal machine learning model. The benefits of the ISPY2 dataset is that it is well studied,\
  \ so we can (1) verify our methods and results, (2) resolve the small data wall I ran into during testing,\
  \ evaluation and cross-validation stages, and (3) expand into multi-sequential multi-modal modeling,\
  \ ie, using multiple different longitudinal (MRI) sequences to construct more robust models.\n\n###\
  \ 0. Setting Up The Project\n\n0a. *Directory Strucutre:* \n\nI have a few lessons up my sleeve from\
  \ the glioma project. In order not to overcomplicate the project, I have opted to create a few basic\
  \ directories to start in my home directory `/mnt/home/gerlac37/ISPY2/`:\n    - `logs/` which will hold\
  \ all .err and .log files generated by the SLURM scripts when running jobs\n    - `src/` which will\
  \ hold all scripts\n\nSecond, I am now in big data territory, so being mindful of HPCC space and file\
  \ limits is paramount. In fact, the ISPY2 dataset holds >7 million DICOM images and takes up 4Tb which\
  \ already conflicts with the 1 million file limit on the HPCC from the scratch directory and 100Gb space\
  \ limit of the home directory. I will have to be careful with how I store everything, but for now all\
  \ the data will be stored in asubfolder in the scratch directory: `/mnt/scratch/gerlac37/ISPY2/`\n\n\
  0b. *Setting Environment:* Welcome to conda...\n\nA basic working environment has been stored in the\
  \ `environment.yml` file in the home directory. I plan to overwrite this basic version once I have more\
  \ of my project figured out\n\n0c. *Configuration & Logging:* To config or not to config, that is the\
  \ question\n\nI'm not doing it yet, so who knows\n\n\n### 1. Downloading the data\n- TL;DR: Image pressing\
  \ a download button, but actually you're banging your head against the wall for days on end. Big data\
  \ is fun.\n- Files: \n    - SLURM Initial Download Script: `/mnt/home/gerlac37/ISPY2/download_ispy2.sh`\n\
  \n1a. *Initial Download:* Downloading the ISPY2 dataset requires using the NBIA Data Retreiver (NBIA)\
  \ from The Cancer Imaging Archive (TCIA). Unfortunately, all hell breaks lose when we try to download\
  \ it onto the HPCC. I used a git package to get around the java GUI from the NBIA and automated the\
  \ download using the SLURM script `download_ispy2.sh` and the `/mnt/home/gerlac37/ISPY2/ISPY2-Cohort1-inclu-ACRIN6698-full-manifest.tcia`\
  \ manifest which is downloaded from the TCIA website (as per instructions from the NBIA instructions).\
  \ \n\nThe download stores the data in the scratch directory `/mnt/scratch/gerlac37/ISPY2/data` because\
  \ no other directory has sufficient space. This means the data will be deleted every 45 days, but that's\
  \ why we've got the automatic download and clean up in the bash script. The data is stored in the following\
  \ format:\n\n~~~\n/mnt/scratch/gerlac37/ISPY2/data/\n└── <PatientID>/ (In the form: `ACRIN-6698-<unique\
  \ patient number>` or `ISPY2-<unique patient number>`)\n    └── <mm-dd-yyy>/ (representing the timepoints\
  \ T0/T1/T2/T3)\n        ├── <SeriesUID>.zip (Compressed series data)\n        └── <SeriesUID>.json (Metadata)\n\
  ~~~\n\n1b. *Organize Data Structure:* I want to organize the data so that it is stored as the following:\n\
  - Files: \n    - Initial Testing: `/mnt/home/gerlac37/ISPY2/src/organize_data.ipynb`\n    - Parallelized\
  \ Production Script: `organize_data.py`\n    - SLURM Script: `organize_data.sh`\n\n~~~\ndata_organized/\n\
  └── <PatientID>/\n    └── <mm-dd-yyy>/ (representing the timepoints T0/T1/T2/T3)\n        ├── <SeriesUID>/\n\
  \            ├── <number>.dcm (DICOM files with series data)\n            ...\n            ├── <number>.dcm\n\
  \            └── <SeriesUID>.json (Corresponding metadata)\n        ├── (Optional from script) <SeriesUID>.zip\
  \ (Invalid, corrupt zip data or missing corresponding json metadata)\n        ...\n        └── (Optional\
  \ from script) <SeriesUID>.zip\n~~~\n\nAt each time point for each patient, one of the series should\
  \ have a segmentation DICOM file, as indicated by its metadata json file. \n\nConsiderations after some\
  \ experimentation: \n- I am finding that some of the zip data are not valid zip files. I will assume\
  \ these files are corrupted and will be disregarded. Since these zip files correspond to entire series,\
  \ these series will not be included for patients whose data has been affected.\n- Some zip files don't\
  \ have corresponding json files, and I'm assuming vice versa. These series will also be disregarded\
  \ accordingly too as either I would be missing the series designation of the data or the series itself,\
  \ respectively.\n- #### QUESTION: How do we make a 'multi-sequential model' that takes in varying sequences\
  \ for some patients, but not every patient has all available sequences?\n\nTo do all of this, I am currently\
  \ experimenting on a test subset of the data which I have copied into `/mnt/scratch/gerlac37/ISPY2/test`\
  \ which includes the first two entries of the `ACRIN-6698` and `ISPY2` datasets. The `organize_data.ipynb`\
  \ script accomplishes this. \n\n#### A production version of was created to parallelize the organization\
  \ of the data called `organize_data.py` which can be ran from the SLURM script `organize_data.sh`. \n\
  \n1c. *Clean Data:* Now I want to clean the remaining data. This means removing:\n    (1) all invalid\
  \ zip files, all unmatched zip and json files, or any other files in the <mm-dd-yy> folders that aren't\
  \ already in the <SeriesUID> subfolders\n    (2) any empty <mm-dd-yy> folders, ie, those that do not\
  \ have any valid <SeriesUID> folders after (1)\n    (4) any empty <PatientID> folders, ie, those that\
  \ do not have any valid <mm-dd-yy> folders after (2)\n\n- Files: \n    - Test Cleaning: `clean_data.ipynb`\n\
  \    - Parallelized Organization & Cleaning: `clean_data.py`\n\n#### As described above, this section\
  \ was meant to clean the data that was organized. However, since I very, very quickly hit the file limit\
  \ on the HPCC, I instead chose to combine the organization and cleaning sections of the code. Now, `clean_data.ipynb`\
  \ both organizes and cleans the data.\n\nNow, all data has been organized into the following structure:\n\
  \n~~~\ndata_organized/\n└── <PatientID>/\n    └── <mm-dd-yyy>/ (representing the timepoints T0/T1/T2/T3)\n\
  \        └── <SeriesUID>/\n            ├── <number>.dcm (DICOM files with series data)\n           \
  \ ...\n            ├── <number>.dcm\n            └── <SeriesUID>.json (Corresponding metadata)\n~~~\n\
  \n### Week of April 7, 2025\n\n1d. *Big Data Problems:* \n\n### By opening up every DICOM file, we go\
  \ from on the order of 43,000 files representing series to millions of files--HPCC admin must have been\
  \ hating me when I was uncompressing the zip files.\n\nSo, we updated the cleaning script so that it\
  \ stores DICOM series into single NIfTI files. Problem solved. Now, we only have `clean_data.py` for\
  \ data preprocessing after data download which organizes files into the following sturcture:\n\n~~~\n\
  data_cleaned/\n└── <PatientID>/\n    └── <mm-dd-yyy>/ (representing the timepoints T0/T1/T2/T3)\n  \
  \      └── <SeriesUID>/\n            ├── <SeriesUID>.nii.gz\n            └── <SeriesUID>.json (Corresponding\
  \ metadata)\n~~~\n\nWe are (cross your fingers) officially ready to create our pipelines.\n\n## BME\
  \ 891: Image Evaluation & Analysis\nFor Alessio's Image Evaluation & Analysis class, I want to do a\
  \ preliminary 'check' on the ISPY2 data. On the TCIA website, we can download several spreadsheets (xlsx)\
  \ that hold radiomics information and clinical information. After talking with Alessio, I plan to do\
  \ the following:\n1. Calculate my own radiomics from the the patients and compare them to the radiomics\
  \ files on the website\n2. Create a machine learning model to classify the breast cancer among the patients\
  \ using both radiomics and clinical xlsx data\n\n### 2. Checking Radiomics & Mask Equivalence\n\n2a.\
  \ *Downloading Radiomics Data:* Way easier than the last download\n\nSimply download the xlsx file locally\
  \ and secure copy into HPCC in `data/Multi-feature-MRI-NACT-Data.xlsx`. It's amazing how simply trying\
  \ to Kb instead of Tb makes your day thousands of times easier.\n\n2b. *Aggregate Radiomics:* From specific\
  \ patient IDs as listed in the xlsx, I want to extract specific radiomics from the mask that conincide\
  \ with the types of radiomics extracted in the xlsx file.\n\nWe create a `compare_radiomics.py` file\
  \ here which we will use to calculate and analyses the radiomics dfate from the cleaned dataset with\
  \ the entries in the xlsx file.\n\nIn short, it's files like these when I wonder why I started coding\
  \ in first place.\n\n### Week of April 14, 2025\n\nAll hands on deck weekend for getting presentation\
  \ ready. All review of this week was done on April 20th, after the presentation. I learned a few things\
  \ since the week before the presentation, so hold on to your seats. They all revolve around the following:\n\
  \n#### *CANNOT Process Radiomics posteriori to data cleaning & NIfTI compression is corrupting the data\
  \ somehow (checked with MITK, about 50% of NIfTI aren't visually representative of the original DICOM\
  \ series)*. Solution: Process radiomics after uncompressing zip files before immediately recompressing.\
  \ Restarting pipeline.\n\nYes, all the code had to be rewritten from scratch a few days before the presentation.\
  \ Yes, it sucked. Yes, I did use version control to minimize my chaos. No, it wasn't through github.\
  \ I present to you what I call \"All the crap I threw together that somehow worked but is still garbage\"\
  :\n\n~~~\n(ispy2) gerlac37@dev-amd20:~/ISPY2$ git status\nOn branch main\nYour branch is up to date\
  \ with 'origin/main'.\n\nChanges not staged for commit:\n  (use \"git add/rm <file>...\" to update what\
  \ will be committed)\n  (use \"git restore <file>...\" to discard changes in working directory)\n  \
  \      modified:   README.md\n        deleted:    abstract.md\n        modified:   clean_data.sh\n \
  \       deleted:    test.ipynb\n\nUntracked files:\n  (use \"git add <file>...\" to include in what\
  \ will be committed)\n        __pycache__/\n        clean_extract.sh\n        compare_radiomics.sh\n\
  \        paper_writing/\n        sort_"

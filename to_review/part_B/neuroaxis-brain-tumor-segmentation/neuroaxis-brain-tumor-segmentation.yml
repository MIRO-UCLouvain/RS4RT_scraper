  # NeuroAxis Brain Tumor Segmentation


  U-Net-based brain tumor segmentation from MRI images using PyTorch and Gradio.


  Live demo: https://huggingface.co/spaces/barabarafigofago/neuroaxis-brain-tumor-segmentation


  ## Important Notice


  This project is intended for educational and research use only. It is not a medical device and must
  not be used for diagnosis, treatment decisions, or clinical workflows.


  ## How It Works


  - Upload an MRI slice image through the Gradio interface.

  - The model resizes the image to 256x256.

  - A U-Net model with a ResNet34 encoder predicts a binary tumor mask.

  - The output is returned as a grayscale segmentation mask.


  ## Run Locally


  ```bash

  pip install -r requirements.txt

  python app.py

  ```


  Then open the local Gradio URL shown in the terminal.


  ## Files


  - `app.py` - Gradio application and inference code.

  - `requirements.txt` - Python dependencies.

  - `unet_brain_tumor.pth` - Trained model weights.

  - `.gitignore` - Local and generated files excluded from version control.

  - `LICENSE` - MIT license for the project code only.


  ## Model


  - Architecture: U-Net

  - Encoder: ResNet34

  - Input size: 256x256

  - Output: binary mask



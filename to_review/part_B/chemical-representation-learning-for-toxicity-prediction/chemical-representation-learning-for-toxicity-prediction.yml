readme_excerpt: "[![Build Status](https://github.com/PaccMann/toxsmi/actions/workflows/build.yml/badge.svg)](https://github.com/PaccMann/toxsmi/actions/workflows/build.yml)\n\
  [![License: MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](https://opensource.org/licenses/MIT)\n\
  [![Code style: black](https://img.shields.io/badge/code%20style-black-000000.svg)](https://github.com/psf/black)\n\
  [![Gradio demo](https://img.shields.io/website-up-down-green-red/https/hf.space/gradioiframe/GT4SD/molecular_properties/+.svg?label=demo%20status)](https://huggingface.co/spaces/GT4SD/molecular_properties)\n\
  \n## Chemical Representation Learning for Toxicity Prediction\n\nPyTorch implementation related to the\
  \ paper *Chemical Representation Learning for Toxicity Prediction* ([Born et al, 2023, *Digital Discovery*](https://pubs.rsc.org/en/content/articlehtml/2023/dd/d2dd00099g)).\n\
  \n# Inference\nWe released pretrained models for the Tox21, the ClinTox and the SIDER dataset.\n\n##\
  \ Demo with UI\n\U0001F917 A gradio demo with a simple UI is available on [HuggingFace spaces](https://huggingface.co/spaces/GT4SD/molecular_properties)\n\
  ![Summary](assets/demo.png)\n\n## Python API\nThe pretrained models are available via the [GT4SD](https://github.com/GT4SD),\
  \ the Generative Toolkit for Scientific Discovery. See the paper [here](https://arxiv.org/abs/2207.03928).\n\
  We recommend to use [GT4SD](https://github.com/GT4SD/gt4sd-core) for inference. Once you install that\
  \ library, use as follows:\n```py\nfrom gt4sd.properties import PropertyPredictorRegistry\ntox21 = PropertyPredictorRegistry.get_property_predictor('tox21',\
  \ {'algorithm_version': 'v0'})\ntox21('CCO')\n```\n\nThe other models are the SIDER model and the ClinTox\
  \ model from the [MoleculeNet](https://moleculenet.org/datasets-1) benchmark:\n```py\nfrom gt4sd.properties\
  \ import PropertyPredictorRegistry\nsider = PropertyPredictorRegistry.get_property_predictor('sider',\
  \ {'algorithm_version': 'v0'})\nclintox = PropertyPredictorRegistry.get_property_predictor('clintox',\
  \ {'algorithm_version': 'v0'})\nprint(f\"SIDE effect predictions: {sider('CCO')}\")\nprint(f\"Clinical\
  \ toxicitiy predictions: {clintox('CCO')}\")\n```\n\n\n# Training your own model\n\n### Setup\nThe library\
  \ itself has few dependencies (see [setup.py](setup.py)) with loose requirements. \n```sh\npip install\
  \ -e .\n```\n\n### Start a training\n\nIn the `scripts` directory is a training script [train_tox](./scripts/train_tox).\n\
  \nDownload sample data from the Tox21 database and store it in a folder called `data`\n[here](https://ibm.box.com/s/kahxnlg2k2s0x3z0r5fa6y67tmfhs6or).\
  \ \n\n```console\n(toxsmi) $ python3 scripts/train_tox \\\n--train data/tox21_train.csv \\\n--test data/tox21_score.csv\
  \ \\\n--smi data/tox21.smi \\\n--params params/mca.json \\\n--model path_to_model_folder \\\n--name\
  \ debug\n```\n\n**Features**:\n- Set ```--finetune``` to the path to a `.pt` file to start from a pretrained\
  \ model\n- Set ```--embedding_path``` to the path of pretrained embeddings\n\nType `python scripts/train_tox\
  \ -h` for further help.\n\n### Evaluate a model\nIn the `scripts` directory is an evaluation script\
  \ [eval_tox.py](./scripts/eval_tox.py).\nAssume you have a trained model, use as follows:\n\n```console\n\
  (toxsmi) $ python3 scripts/eval_tox.py \\\n-model path_to_model_folder \\\n-smi data/tox21.smi \\\n\
  -labels data/tox21_test.csv \\\n-checkpoint RMSE\"\n```\n\nwhere `-checkpoint` specifies which `.pt`\
  \ file to pick for the evaluation (based on substring matching)\n\n## Attention visualization\nThe model\
  \ uses a self-attention mechanism that can highlight chemical motifs used for the predictions.\nIn [notebooks/toxicity_attention_plot.ipynb](notebooks/toxicity_attention_plot.ipynb)\
  \ we share a tutorial on how to create such plots:\n![Attention](assets/attention.gif \"toxicophore\
  \ attention\")\n\n\n## Citation\nIf you use this code in your projects, please cite the following:\n\
  \n```bib\n@article{born2023chemical,\n    author = {Born, Jannis and Markert, Greta and Janakarajan,\
  \ Nikita and Kimber, Talia B. and Volkamer, Andrea and Martínez, María Rodríguez and Manica, Matteo},\n\
  \    title = {Chemical representation learning for toxicity prediction},\n    journal = {Digital Discovery},\n\
  \    year = {2023},\n    pages = {-},\n    publisher = {RSC},\n    doi = {10.1039/D2DD00099G},\n   \
  \ url = {http://dx.doi.org/10.1039/D2DD00099G}\n}\n```\n"

readme_excerpt: "# radonc-care-guides\n\n**18 free, evidence-based supportive care guides for radiation\
  \ therapy patients.**\n\nEach guide is a standalone Python script that generates a print-ready PDF.\
  \ Customize with your physician name, institution, locations, and phone number.\n\n## Guides\n\n###\
  \ Disease Sites (13)\n| Guide | Key Topics | Pages |\n|-------|-----------|-------|\n| Head & Neck |\
  \ Mouth sores, swallowing, skin, feeding tubes, taste | ~14 |\n| GI (Rectal & Anal) | Perineal skin,\
  \ diarrhea, bladder, sexual health | ~19 |\n| GYN | Vaginal health, brachytherapy, menopause, fertility\
  \ | ~16 |\n| Lung | Esophagitis, cough, pneumonitis, breathing exercises | ~13 |\n| Esophageal | Swallowing,\
  \ feeding tubes, pain, acid reflux | ~12 |\n| Prostate | Bladder, urinary, bowel, sexual health, ADT\
  \ | ~15 |\n| Breast | Skin care, lymphedema, heart protection, body image | ~12 |\n| Brain Metastases\
  \ | Steroids, seizures, SRS vs WBRT, cognitive support | ~12 |\n| Primary Brain/GBM | Temozolomide,\
  \ steroids, seizures, pseudoprogression | ~12 |\n| Palliative (Bone Mets) | Pain flare, spinal cord\
  \ compression, retreatment | ~10 |\n| Skin Cancer | Weekly skin changes, wound care, cosmetic timeline\
  \ | ~10 |\n| Lymphoma | Heart/thyroid screening, fertility, breast cancer risk | ~14 |\n| Bladder-Sparing\
  \ | Trimodal therapy, urinary symptoms, surveillance | ~13 |\n\n### Supportive & Cross-Cutting (5)\n\
  | Guide | Key Topics | Pages |\n|-------|-----------|-------|\n| Immunotherapy + RT | irAEs, pneumonitis\
  \ differential, steroid safety | ~12 |\n| Nutrition | Calorie/protein targets, recipes by symptom, tube\
  \ feeding | ~13 |\n| Smoking Cessation | Why quitting matters during RT, NRT, medications | ~12 |\n\
  | Survivorship | Life after treatment, screening, exercise, emotional recovery | ~10 |\n| Caregiver\
  \ | Practical skills, medication tracking, self-care, crisis escalation | ~13 |\n\n## Quick Start\n\n\
  ```bash\npip install reportlab\n\n# Generate a single guide\npython generators/hn-guide/generate_hn_guide.py\
  \ \\\n  --doctor \"Jane Smith, MD\" \\\n  --institution \"University Cancer Center\" \\\n  --phone \"\
  555-123-4567\" \\\n  --patient \"John Doe\" \\\n  -o Head_Neck_Guide.pdf\n```\n\n## Programmatic Usage\n\
  \n```python\nfrom generators.hn_guide.generate_hn_guide import build_guide\n\nbuild_guide(\"output.pdf\"\
  , {\n    \"doctor_name\": \"Jane Smith, MD\",\n    \"institution\": \"University Cancer Center\",\n\
  \    \"locations\": [\"Main Campus\", \"South Pavilion\"],\n    \"phone\": \"555-123-4567\",\n    \"\
  patient_name\": \"John Doe\"\n})\n```\n\n### Config Keys\n\n| Key | Type | Description |\n|-----|------|-------------|\n\
  | `doctor_name` | `str` | Physician name on cover and contact pages |\n| `institution` | `str` | Institution/department\
  \ name |\n| `locations` | `list[str]` | Treatment locations listed on contact page |\n| `phone` | `str`\
  \ | Contact phone number |\n| `patient_name` | `str` | Patient name on cover (optional) |\n\nAll keys\
  \ are optional. Omitted fields use sensible defaults.\n\n## Web Interface\n\nA free online customizer\
  \ is available at [anthonyricco.com/guides](https://anthonyricco.com/guides/) — fill in your details,\
  \ select guides, and download branded PDFs. No account needed.\n\n## Evidence Base\n\nAll guides cite\
  \ current clinical guidelines and landmark trials:\n\n- NCCN Clinical Practice Guidelines, 2025 editions\n\
  - MASCC/ISOO Consensus Statements (oral mucositis, supportive care)\n- ESPEN Practical Guideline: Clinical\
  \ Nutrition in Cancer, 2024\n- ASTRO Clinical Practice Statements\n- Landmark trials: PACIFIC, ADRIATIC,\
  \ KEYNOTE-689, CHALLENGE, SWOG S1826\n\nVersion 1.1 incorporated a structured peer review checking every\
  \ statistical claim, dosing recommendation, and screening interval against current literature.\n\n##\
  \ Requirements\n\n- Python 3.10+\n- reportlab >= 4.0\n\n## License\n\nMIT — see [LICENSE](LICENSE).\n\
  \n## Contributing\n\nContributions welcome. If you spot an error, want to add a disease site, or have\
  \ a better evidence citation, open an issue or pull request.\n\n## Author\n\nAnthony Ricco, MD — Radiation\
  \ Oncologist, Main Line Health\n[anthonyricco.com](https://anthonyricco.com) · [anthony@bloomhealth.care](mailto:anthony@bloomhealth.care)\n"

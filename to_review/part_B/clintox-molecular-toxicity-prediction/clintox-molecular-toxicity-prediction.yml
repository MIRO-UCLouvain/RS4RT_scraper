readme_excerpt: "# ClinTox Molecular Toxicity Prediction\n\n## Objective \n- Predict molecular toxicity\
  \ using chemical descriptors generated from SMILES strings.\n\n## Dataset\n- ClinTox dataset\n- Target:\
  \ CT_TOX (molecular toxicity classification)\n\n## Generation of Chemical Descriptors\nChemical descriptors\
  \ were generated from SMILES strings using RDKit:\n\n- Molecular Weight (MolWt)\n- LogP\n- Topological\
  \ Polar Surface Area (TPSA)\n- Number of Hydrogen Donors\n- Number of Hydrogen Acceptors\n- Number of\
  \ Rotatable Bonds\n\n## Models Used\n- Logistic Regression (L2)\n- Random Forest\n\n## Evaluation\n\
  - 5-fold Stratified Cross-Validation\n- Accuracy, Precision, Recall, F1 Score\n\n## Results\n| Model\
  \ | Mean CV Accuracy | Mean CV Precision | Mean CV Recall | Mean CV F1 |\n|---------|---------|---------|---------|---------:|\n\
  | Logistic Regression (Balanced) | 0.681 | 0.145 | 0.663 | 0.237 |\n| Random Forest | 0.917 | 0.217\
  \ | 0.035 | 0.059 |\n| Random Forest (Balanced) | 0.914 | 0.157 | 0.036 | 0.056 |\n| Logistic Regression\
  \ | 0.924 | 0.000 | 0.000 | 0.000 |\n\n## Best Result\n- Logistic Regression with class weighting achieved\
  \ the highest mean cross-validation F1 score (~0.24) and substantially improved recall for the minority\
  \ class.\n\n## Interpretation\n- Accuracy alone was misleading because the dataset was highly imbalanced\
  \ and models could achieve high accuracy while failing to identify toxic compounds.\n- Standard Logistic\
  \ Regression failed to identify toxic compounds and achieved zero recall.\n- Applying class weighting\
  \ substantially increased recall and produced the best F1 score.\n- Random Forest achieved high accuracy\
  \ but identified very few toxic compounds.\n\n## Limitations\n- Strong class imbalance (92.4% vs. 7.6%)\n\
  - More molecular descriptors can be used\n- Only two machine learning models were evaluated\n- No independent\
  \ test set was available"

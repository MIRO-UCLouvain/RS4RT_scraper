readme_excerpt: "# Brain Tumor Segmentation using U-Net\n\nImplementation of brain tumor segmentation\
  \ using U-Net architecture in TensorFlow 2.x.\n\n---\n\n## Architecture\n\n| ![U-Net Architecture](img/u-net-architecture.png)\
  \ |\n| :--: |\n| *U-Net Architecture* |\n\nU-Net consists of an encoder (downsampling) and decoder (upsampling)\
  \ path with skip connections.\n\n| Layer | Filters |\n|-------|---------|\n| Encoder Block 1 | 64 |\n\
  | Encoder Block 2 | 128 |\n| Encoder Block 3 | 256 |\n| Encoder Block 4 | 512 |\n| Bottleneck | 1024\
  \ |\n| Decoder Block 1 | 512 |\n| Decoder Block 2 | 256 |\n| Decoder Block 3 | 128 |\n| Decoder Block\
  \ 4 | 64 |\n| Output | 1 (sigmoid) |\n\n---\n\n## Files\n\n| File | Description |\n|------|-------------|\n\
  | `unet.py` | U-Net model architecture |\n| `train.py` | Training script |\n| `test.py` | Testing and\
  \ evaluation script |\n| `metrics.py` | Dice coefficient and Dice loss |\n\n---\n\n## Dataset\n\nBrain\
  \ Tumor MRI Dataset from Kaggle:  \n\U0001F517 https://www.kaggle.com/datasets/masoudnickparvar/brain-tumor-mri-dataset\n\
  \nStructure:\n```\ndata/\n├── images/   ← MRI images (.png)\n└── masks/    ← Ground truth masks (.png)\n\
  ```\n\n---\n\n## Requirements\n\n```\ntensorflow >= 2.0\nopencv-python\nnumpy\nscikit-learn\npandas\n\
  tqdm\n```\n\nInstall:\n```bash\npip install tensorflow opencv-python numpy scikit-learn pandas tqdm\n\
  ```\n\n---\n\n## How to Run\n\n### Step 1 — Train\n```bash\npython train.py\n```\n- Image size: 256×256\n\
  - Batch size: 16\n- Epochs: 500 (with early stopping)\n- Optimizer: Adam (lr=1e-4)\n- Loss: Dice Loss\n\
  - Saves model to `files/model.h5`\n\n### Step 2 — Test\n```bash\npython test.py\n```\n- Loads model\
  \ from `files/model.h5`\n- Saves predictions to `results/`\n- Prints F1, Jaccard, Recall, Precision\n\
  \n---\n\n## Results\n\nEach output image contains (left to right):\n1. Input MRI image\n2. Ground truth\
  \ mask\n3. Predicted mask\n\n| ![](results/3.png) |\n| :--: |\n| ![](results/6.png) |\n| ![](results/12.png)\
  \ |\n| ![](results/16.png) |\n| ![](results/26.png) |\n| ![](results/29.png) |\n| ![](results/33.png)\
  \ |\n| ![](results/35.png) |\n| ![](results/55.png) |\n| ![](results/69.png) |\n| ![](results/86.png)\
  \ |\n\n---\n\n## Metrics\n\n| Metric | Description |\n|--------|-------------|\n| F1 / Dice | Overlap\
  \ between prediction and ground truth |\n| Jaccard (IoU) | Intersection over Union |\n| Recall | Sensitivity\
  \ — tumor pixels correctly detected |\n| Precision | How accurate the predictions are |\n"

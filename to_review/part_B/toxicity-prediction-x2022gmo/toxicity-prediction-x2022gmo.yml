readme_excerpt: "# toxicity-prediction-x2022gmo\nToxicity Prediction Challenge on Kaggle\n\n### Code for\
  \ generating rdkit molecular descriptors is in `molecular_desc.ipynb`\n\n## Steps to run the fully Reproducible\
  \ code \n\n1. Open the link - https://www.kaggle.com/code/x2022gmo/x2022gmo-best-submission\n2. Click\
  \ on edit on the top of the link and a copied version is created. \n3. After creating that change the\
  \ accelarator to GPU and start the session.\n4. Also check if all datasets are downloaded into the dataset\
  \ folder.\n4. Start running the code to generate the output file. \n\n## Links for the datasets used\
  \ for the competition \n\nhttps://www.kaggle.com/datasets/x2022gmo/rdkit-mol-desc\n\nhttps://www.kaggle.com/datasets/x2022gmo/feature-selection\n\
  \n\n## Best Submission for fully reproducible code with dataset\n\nhttps://www.kaggle.com/code/x2022gmo/x2022gmo-best-submission\n"

readme_excerpt: '# 🧠 Brain Tumor Segmentation using U-Net, Attention U-Net and UNet++ (PyTorch)


  A PyTorch implementation of **U-Net**, **Attention U-Net**, and **UNet++** for automatic brain tumor
  segmentation on the **BraTS 2020** dataset.


  The repository provides a complete deep learning pipeline including data preprocessing, model training,
  evaluation, prediction, visualization, and performance benchmarking for brain tumor segmentation.


  ---


  # 📖 Overview


  Brain tumor segmentation plays an essential role in medical image analysis by accurately identifying
  tumor regions for diagnosis, treatment planning, and disease monitoring.


  This repository implements three state-of-the-art encoder-decoder architectures:


  - **U-Net**

  - **Attention U-Net**

  - **UNet++ (Nested U-Net)**


  Each model accepts the four MRI modalities from the BraTS dataset:


  - FLAIR

  - T1

  - T1CE

  - T2


  and performs multi-label segmentation of:


  - **Whole Tumor (WT)**

  - **Tumor Core (TC)**

  - **Enhancing Tumor (ET)**


  ---


  # ✨ Features


  - ✅ U-Net implementation from scratch

  - ✅ Attention U-Net implementation from scratch

  - ✅ UNet++ implementation from scratch

  - ✅ BraTS 2020 preprocessing pipeline

  - ✅ Automatic HDF5 dataset generation

  - ✅ Multi-modal MRI support

  - ✅ BCE + Dice Loss

  - ✅ Mixed Precision Training (AMP)

  - ✅ Early Stopping

  - ✅ Learning Rate Scheduler

  - ✅ Dice Score & IoU evaluation

  - ✅ Prediction visualization

  - ✅ Automatic loss curve generation

  - ✅ CSV evaluation reports

  - ✅ GPU (CUDA) support


  ---


  # 📊 Implemented Models


  | Model | Status |

  |--------|--------|

  | U-Net | ✅ |

  | Attention U-Net | ✅ |

  | UNet++ | ✅ |

  | Boundary-Aware Deep Supervised UNet++ | 🚧 Research in Progress |



  # 🧬 Dataset


  This project uses the **BraTS 2020 (Brain Tumor Segmentation Challenge)** dataset.


  Each subject contains four MRI modalities:


  - FLAIR

  - T1

  - T1CE

  - T2


  The preprocessing pipeline converts the original **NIfTI (.nii.gz)** volumes into **HDF5 slices** for
  efficient training.


  Segmentation masks are generated as:


  | Channel | Description |

  |----------|-------------|

  | WT | Whole Tumor |

  | TC | Tumor Core |

  | ET | Enhancing Tumor |


  ---


  # ⚙️ Preprocessing Pipeline


  The preprocessing pipeline performs:


  - Reading NIfTI MRI volumes

  - Intensity normalization

  - Multi-modal MRI stacking

  - WT / TC / ET mask generation

  - Slice extraction

  - Automatic HDF5 dataset creation


  ---


  # 🏗 Model Architectures


  ## U-Net


  A standard encoder-decoder architecture with skip connections for semantic segmentation.


  ---


  ## Attention U-Net


  Attention U-Net enhances the standard U-Net by introducing **Attention Gates**, allowing the network
  to suppress irrelevant background features while focusing on tumor regions.


  ---


  ## UNet++


  UNet++ (Nested U-Net) redesigns the skip connections using dense nested pathways between encoder and
  decoder layers.


  Key improvements include:


  - Dense skip connections

  - Improved feature fusion

  - Reduced semantic gap

  - Better localization accuracy

  - Efficient multi-scale feature learning


  ---


  # 📊 Performance


  ## U-Net


  | Metric | Value |

  |---------|------:|

  | Dice Score | **0.7850** |

  | IoU | **0.7357** |

  | Loss | **0.3385** |

  | Parameters | **31,032,451** |

  | Inference Speed | **30.15 ms/image** |


  ---



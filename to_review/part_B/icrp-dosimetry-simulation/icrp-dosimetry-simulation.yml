readme_excerpt: "# ICRP Dosimetry Simulation\n\nICRP Adult Female Phantom dosimetry simulation using opengate\
  \ 10 (Tc99m kidney)\n\n## Overview\nMonte Carlo simulation of Tc-99m kidney dosimetry using the ICRP\
  \ Publication 110 \nAdult Female reference computational phantom and opengate 10.\n\n## Pipeline\n1.\
  \ ICRP AF phantom loading (Analyze format)\n2. Kidney source mask generation\n3. Monte Carlo simulation\
  \ (Tc99m, 140 keV)\n4. Dose distribution visualization\n\n## Requirements\n- opengate 10\n- SimpleITK\n\
  - matplotlib\n- scipy\n\n## Usage\n```bash\npython make_kidney_source.py   # generate kidney source\
  \ mask\npython simulation.py           # run simulation\npython visualize.py            # visualize\
  \ results\n```\n\n## Results\nDose distribution in ICRP AF phantom with Tc99m kidney source.\n\n![Dose\
  \ Map](output/dose_map.png)\n"

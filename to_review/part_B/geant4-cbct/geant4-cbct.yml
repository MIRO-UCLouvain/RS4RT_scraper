readme_excerpt: "<div align=\"center\">\n<h1>\n  Geant4模拟CBCT实例\n</h1>\n</div>\n\n# Geant4安装\n\n> 由于Geant4在Windwos上不支持多线程，不推荐直接在Windows上安装，Windows平台推荐WSL2或VirutalBox等虚拟机。\n\
  \n1. 安装OpenGL、Qt5和Geant4\n\n在项目根目录下运行``instal.sh``，自动安装\n\n> 请确保网络状态良好，编译可能需要数十分钟。\n\n```sh\nsudo bash\
  \ ./install.sh\n```\n\n2. 将Geant4添加至环境变量\n\n```\necho 'source /geant4/geant4-install/bin/geant4.sh'\
  \ >> ~/.bashrc\necho 'source /geant4/geant4-install/share/Geant4-11.0.4/geant4make/geant4make.sh' >>\
  \ ~/.bashrc\nsource ~/.bashrc\n```\n\nP.S. 如果需要其他功能，如ROOT，请自行参考官网安装。\n\n\n# Python重建\n\n首先配置Python环境\n\
  \n```sh\nconda create -n cbct python=3.10\nconda activate cbct\nconda install -c astra-toolbox astra-toolbox\n\
  python -m pip install -r requirements.txt\n```\n\n执行模拟\n\n```sh\ncd geant4\nbash run.sh\ncd ../python\n\
  python simulate_projection.py\n```\n\n重建\n\n```sh\npython reconstruction.py\n```\n"

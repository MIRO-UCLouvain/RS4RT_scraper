  \ &#xa0; | &#xa0;\n  <a href=\"#starting\">Starting</a>\n  \n</p>\n<br>\n\n## About\n\nToxicity Prediction\
  \ is a machine learning project that classifies comments into multiple categories of toxicity. Using\
  \ this [dataset](https://www.kaggle.com/competitions/jigsaw-toxic-comment-classification-challenge)\
  \ of comments labeled for toxic behavior, the project builds and evaluates various machine learning\
  \ models, including neural networks, to identify and predict toxic comments. This project also integrates\
  \ a web application using Flask and Next.js to provide a user-friendly interface for predicting the\
  \ toxicity of new comments.\n\n## Features\n\n- Preprocessing of text data including tokenization and\
  \ lemmatization\n- Implementation of multiple machine learning models: Logistic Regression, Random Forest,\
  \ Multinomial Naive Bayes, and Decision Tree\n- Building and training a Bidirectional LSTM neural network\
  \ for improved prediction accuracy\n- Evaluation and comparison of model performance using precision,\
  \ recall, and accuracy metrics\n- Interactive web interface for predicting comment toxicity\n\n## Application\
  \ UI\n\n<img id=\"application-ui\" alt=\"UI\" src=\"pics\\home.png\">\n<img id=\"application-ui\" alt=\"\
  UI\" src=\"pics\\sample1.png\">\n<img id=\"application-ui\" alt=\"UI\" src=\"pics\\sample2.png\">\n\n\
  ## Technologies\n\n- Python\n- Pandas\n- NumPy\n- TensorFlow\n- Scikit-learn\n- NLTK\n- Flask\n- Next.js\n\
  \n## Requirements\n\nBefore starting make sure to have [Node.js](https://nodejs.org/en/) installed.\n\
  \n## Starting\n\n```bash\n# Clone this project\ngit clone https://github.com/MohamedAbdelfattah022/Multilable-Toxicity-Comment-Prediction\n\
  ```\n\n```bash\n# Access\ncd Multilable-Toxicity-Comment-Prediction\n```\n\n```bash\n# Install Python\
  \ dependencies\npip install -r requirements.txt\n```\n\n```bash\n# Run the Flask server\ncd backend\n\
  python app.py\n```\n\n```bash\n# Install Node dependencies\ncd client\nnpm i\n```\n\n```bash\n# Run\
  \ the Next.js project\nnpm run dev\n```\n\n<a href=\"#top\">Back to top</a>\n"

readme_excerpt: "# AbsegNet\nComprehensive evaluation of a deep learning model for automatic organs at\
  \ risk segmentation on heterogeneous computed tomography images for abdominal radiotherapy (Accepted\
  \ to [International Journal of Radiation Oncology Biology Physics](https://www.sciencedirect.com/science/article/abs/pii/S0360301623005205)).\n\
  \n## Notes\n* This work was modified from [nnUNet](https://github.com/MIC-DKFZ/nnUNet).\n* Due to data\
  \ privacy protection, we can not release all-used hospital datasets, but we released 170 cases for academic\
  \ research: please contact Xiangde (luoxd1996 AT gmail DOT com) for the dataset, please check the access\
  \ requirement of this dataset in [Here](https://github.com/HiLab-git/WORD).\n\n## How to use\n### 1.\
  \ Before you can use this package for abdominal OARs segmentation. You should install:\n* PyTorch version\
  \ >=1.8\n* Some common python packages such as Numpy, SimpleITK, OpenCV, Scipy......\n### 2. Run the\
  \ inference script.\n* Download the trained model (trained based our proposed method) from [Google Drive](https://drive.google.com/file/d/1HdNNO0fKtq_oyyPAW71AmyQZCCeO6TpL/view?usp=share_link).\n\
  * Now, you can use the following code to generate 16 OARs delineation.\n```python\nfrom InferRobustABOD\
  \ import Inference3D\nInference3D(rawf=\"liver_70_img.nii.gz\", save_path=\"liver_70_pred.nii.gz\")\
  \ # rawf is the path of input image; save_path is the path of prediction.\n```\n\n* This project was\
  \ originally developed for our previous work [AbsegNet](https://www.sciencedirect.com/science/article/abs/pii/S0360301623005205),\
  \ if you find it's useful for your research, please consider to cite the followings:\n\n        @article{liao2023AbsegNet,\n\
  \        title={Comprehensive evaluation of a deep learning model for automatic organs at risk segmentation\
  \ on heterogeneous computed tomography images for abdominal radiotherapy},\n        author={Liao, Wenjun,\
  \ Luo, Xiangde, He, Yuan, Dong, Ye, Li, Churong, Li, Kang, Zhang, Shichuan, Zhang, Shaoting, Wang, Guotai,\
  \ and Jianghong Xiao.},\n        journal={ International Journal of Radiation Oncology Biology Physics},\n\
  \        DOI={https://doi.org/10.1016/j.ijrobp.2023.05.034},\n        year={2023},\n        publisher={Elsevier}\n\
  \        }\n        \nor \n```\nLiao, Wenjun, Luo, Xiangde, He, Yuan, Dong, Ye, Li, Churong, Li, Kang,\
  \ Zhang, Shichuan, Zhang, Shaoting, Wang, Guotai, and Jianghong Xiao. \"Comprehensive evaluation of\
  \ a deep learning model for automatic organs at risk segmentation on heterogeneous computed tomography\
  \ images for abdominal radiotherapy.\" International Journal of Radiation Oncology*Biology*Physics,\
  \ (2023). Accessed May 26, 2023. https://doi.org/10.1016/j.ijrobp.2023.05.034.\n```\n\n## Acknowledgment\
  \ and Statement\nIf you have any question, please contact [Xiangde Luo](https://luoxd1996.github.io).\n"

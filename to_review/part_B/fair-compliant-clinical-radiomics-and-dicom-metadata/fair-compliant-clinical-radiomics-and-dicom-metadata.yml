readme_excerpt: "**Repository location moved! Please check [https://github.com/MaastrichtU-CDS/FAIR-compliant_clinical_radiomics_and_DICOM_metadata](https://github.com/MaastrichtU-CDS/FAIR-compliant_clinical_radiomics_and_DICOM_metadata)**\n\
  # FAIR Compliant Clinical Radiomics And DICOM Metadata\n\nThis code repository accompanies a Medical\
  \ Physics Dataset Article titled\n\"**FAIR-compliant clinical, radiomics and DICOM metadata of public\
  \ collections\non The Cancer Imaging Archive (TCIA)**\" (doi to follow, link to follow). The\nRDF metadata\
  \ referred to in the above article is freely available to use for\nscientific and educational purposes\
  \ as outlined in the **Creative Commons\nAttribution-NonCommercial 3.0 Unported (CC BY-NC 3.0)**\n(please\
  \ refer to https://creativecommons.org/licenses/by-nc/3.0/). \n\n## Purpose\nOne of the most frequently\
  \ cited radiomics investigations showed that\nfeatures automatically extracted from routine clinical\
  \ images could be used in\nprognostic modelling. These images have been made publicly accessible via\
  \ The\nCancer Imaging Archive (TCIA). There have been numerous requests for additional\nexplanatory\
  \ metadata on the following datasets – RIDER, Interobserver, Lung1\nand Head-Neck1. To support repeatability,\
  \ reproducibility, generalizability and\ntransparency in radiomics research, we publish the subjects’\
  \ clinical data,\nextracted radiomics features and Digital Imaging and Communications in Medicine\n\
  (DICOM) headers of these four datasets with descriptive metadata, in order to\nbe more compliant with\
  \ findable, accessible, interoperable and re-usable (FAIR)\ndata management principles.\n\n\n## Acquisition\
  \ and validation methods\nOverall survival time intervals were updated using a national citizens registry\n\
  after internal ethics board approval. Spatial offsets of the Primary Gross Tumor\nVolume (GTV) regions\
  \ of interest (ROIs) associated with the Lung1 CT series were\nimproved on the TCIA. GTV radiomics features\
  \ were extracted using the open-source\nontology-guided radiomics workflow (O-RAW). We reshaped the\
  \ output of O-RAW to\nmap features and extraction settings to the latest version of Radiomics Ontology,\n\
  so as to be consistent with the Image Biomarker Standardization Initiative (IBSI).\nDICOM metadata was\
  \ extracted using a research version of Semantic DICOM\n(SOHARD, GmbH, Fuerth; Germany). Subjects’ clinical\
  \ data was described with\nmetadata using the Radiation Oncology Ontology. All of the above were published\n\
  in Resource Descriptor Format (RDF), i.e. triples. Example SPARQL queries are\nshared with the reader\
  \ to use on the online triples archive, which are intended\nto illustrate how to exploit this data submission.\n\
  \n## Data format\nThe accumulated RDF data is publicly accessible through a SPARQL endpoint where\n\
  the triples are archived. The endpoint is remotely queried through a graph\ndatabase web application\
  \ at http://sparql.cancerdata.org. SPARQL queries are\nintrinsically federated, such that we can efficiently\
  \ cross-reference clinical,\nDICOM and radiomics data within a single query, while being agnostic to\
  \ the\noriginal data format and coding system. The federated queries work in the same\nway even if the\
  \ RDF data were partitioned across multiple servers and dispersed\nphysical locations. Potential applications:\
  \ The public availability of these\ndata resources is intended to support radiomics features replication,\n\
  repeatability and reproducibility studies by the academic community. The\nexample SPARQL queries may\
  \ be freely used and modified by readers depending\non their research question. Data interoperability\
  \ and reusability is supported\nby referencing existing public ontologies. The RDF data is readily findable\
  \ and\naccessible through the aforementioned link. Scripts used to create the RDF are\nmade available\
  \ through this repository.\n\n## Contents of this repository\n\n### Clinical data mappings folder\n\
  Our proposed mappings for the clinical data elements, e.g. age, gender, survival\ntime etc., to the\
  \ Radiation Oncology Ontology (ROO) are provided in this folder.\nUsage is as described in the manuscript\
  \ text; the mapping file (.ttl) needs to be\nprocessed in an RDF serialization application, e.g. R2RML\
  \ (https://www.w3.org/TR/r2rml/)\nto produce the triples.\n\n### Radiomics features folder\nIn this\
  \ folder, a example Python script called \"autofill_script.py\" is provided that\nparses output from\
  \ a radiomics extraction application (O-RAW in our case) into a set\nof inter-related tables following\
  \ the IBSI description. The files\n\"feature_parameter_space_dictionary\" and \"stemname_PyRadiomicsFeatures_With_Units\"\
  \nare needed for the execution of the autofill script.\n\nThe results of the auto-filled tables for\
  \ each of the four TCIA imaging datasets are\ninlcuded in this folder as zip files.\n\nFinally, the\
  \ mapping of features to RDF via the Radiomics Ontology requires the\nradiomics mapping files (in the\
  \ archive : D2RQ_mappings.zip) and the serialization\nscript (in the archive d2rq-0.8.1.zip). To execute\
  \ the mapping script, the batch\nfile \"dump.bat\" is provided.\n\n### Examples of SPARQL queries\n\
  The example queries in the text are provided here as .ttl files for each example.\nTo execute the queries,\
  \ please navigate to the query tab of the SPARQL endpoint that\nwe have published (http://sparql.cancerdata.org/#query)\
  \ then copy-and-paste the\ncontent of the file into the query pane. There is an execute button below\
  \ the\nquery pane. The results of the query will then appear below the execute button\nafter some time\
  \ (depending on the complexity of the SPARQL query).\n\n## Corresponding authors\nFor additional questions\
  \ related to this GitLab repository, please get in contact\nthe following :\n\n1.  Petros Kalendralis\
  \ (petros.kalendralis@maastro.nl)\n2.  Zhenwei Shi (zhenwei.shi@maastro.nl)\n3.  Alberto Traverso (alberto.traverso@maastro.nl)\n\
  \n## Presiding senior authors\n1.  Dr Leonard Wee (leonard.wee@maastro.nl)\n2.  Dr Johan van Soest (johan.vansoest@maastro.nl)\n\
  3.  Prof Andre Dekker (andre.dekker@maastro.nl)\n\n\n"

readme_excerpt: "To run 2.5D model or the proposed approach you need to first generate EP reconstructions\
  \ of your dataset. In order to do so run \n\nproposed_method/script/runfdk_ep.sh\n\nThis script allows\
  \ you to generate EP reconstructions from sparse views with input of source-detector and object-detector\
  \ distances along with number of views. You may have to modify the above script to point to the right\
  \ path of your dataset.\nThe PWLS-EP script can be run by running the runfdk_ep.sh script. The Paths\
  \ in the PWLS EP folder would have to be changed to point to your dataset location.\n\nAfter running\
  \ and saving the EP reconstructions for four and eight views, you can run the below - \n\n2.5D CNN \n\
  go to cnn_2.5/\n\n1. bash run_all.sh # this will run the 2.5D training on 4 view and 8 view cases.\n\
  2. bash score3.sh # this will obtain the NMAE and NHFEN scores for the 2.5 D CNN outputs.\n\nProposed\
  \ approach \n\ngo to proposed_method/script/ and run \n\n1. bash trainWalnut.sh # this trains the proposed\
  \ approach.\n2. bash testWalnut.sh # this tests the proposed approach on unseen cases.\n3. bash get_metrics.sh\
  \ # this gets the NMAE and HFEN scores\n"

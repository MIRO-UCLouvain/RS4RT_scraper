readme_excerpt: "# Therac-25-Anti-patterns\n\n> An analysis of the famous catastrophe Therac-25 pitfalls,\
  \ a computer-based radiotherapy device developed by AECL (Atomic Energy of Canada Limited) between 1985\
  \ and 1987.\n> \n> This analysis is based on Mrs. Leveson's investigations article posted on the Stanford\
  \ web archive with some Hardware-Software Co-design in mind.\n\n## Table of contents:\n- What's Therac-6,\
  \ Therac-20, and Therac-25?\n- The \"Therac\" series software defects.\n- The \"Therac\" design pitfalls.\n\
  - How hardware protection overrides software pitfalls in Therac-6 and Therac-20.\n- Therac-25 reported\
  \ `Malfunction-45`.\n- A deeper look into a simulation code and simulation fix environment.\n- Naming\
  \ anti-patterns utilized in the Therac software (Race conditions and concurrent programming).\n- An\
  \ approach to avoid these catastrophic errors.\n"

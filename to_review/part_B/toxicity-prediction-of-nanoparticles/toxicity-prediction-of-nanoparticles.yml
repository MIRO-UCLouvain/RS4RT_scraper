readme_excerpt: "# NanoToxicity Prediction\n\nGeneralizing a deep learning predictive model trained solely\
  \ on the physicochemical properties of nanoparticles to perform on an organ-specific toxicity domain.\n\
  \n## Contents\n- `nanotox_dataset.csv` — main dataset used for training and exploration.\n- `test_data.csv`\
  \ — test dataset used by both notebooks for evaluation.\n- `NanoToxicity_Prediction_ML.ipynb` — Random\
  \ Forest pipeline: data selection, label encoding, training (RandomForestClassifier), evaluation, and\
  \ saving model (`RandomForest_NanoToxicity.pkl`).\n- `NanoToxicity_Prediction_DL.ipynb` — Deep learning\
  \ pipeline using TensorFlow/Keras: preprocessing (StandardScaler), MLP definition, training, evaluation,\
  \ saving model (`nanoparticle_toxicity_model.h5`), prediction helper, PDP and SHAP explainability examples.\n\
  \n## Summary\nBoth notebooks use the same core input features:\n- `coresize`, `hydrosize`, `surfcharge`,\
  \ `e`, `dosage`\n\nThey perform cleaning, label encoding (NonToxic → 0, Toxic → 1), feature scaling\
  \ for DL, model training, and evaluation on `test_data.csv`.\n\n## Dependencies\nMinimal set (approximate\
  \ -> check notebooks for exact imports):\n\n- Python 3.8+\n- pandas\n- numpy\n- scikit-learn\n- matplotlib\n\
  - seaborn\n- joblib\n- tensorflow (for DL notebook)\n- shap (optional, for explainability plots)\n\n\
  Quick install (recommended inside a virtual environment):\n\n```bash\npython -m venv .venv\nsource .venv/bin/activate\n\
  pip install --upgrade pip\npip install pandas numpy scikit-learn matplotlib seaborn joblib tensorflow\
  \ shap\n```\n\nIf you prefer to install only what you need for the ML notebook, omit `tensorflow` and\
  \ `shap`.\n\n## Quick start\n1. Ensure `nanotox_dataset.csv` and `test_data.csv` are in the notebook\
  \ working directory (repo root).\n2. Launch Jupyter Lab/Notebook:\n\n```bash\njupyter lab\n```\n\n3.\
  \ Open and run the notebooks in this order (recommended):\n   - `NanoToxicity_Prediction_ML.ipynb` —\
  \ trains and saves a Random Forest model (`RandomForest_NanoToxicity.pkl`).\n   - `NanoToxicity_Prediction_DL.ipynb`\
  \ — trains a Keras MLP, saves `nanoparticle_toxicity_model.h5`, and includes a `predict_toxicity(...)`\
  \ helper.\n\n4. Use the saved models for quick inference on new samples (notebooks show example prediction\
  \ calls using the saved models).\n\n## Notes & Tips\n- Notebooks use relative paths to `nanotox_dataset.csv`\
  \ and `test_data.csv`. Run them from the repo root or update the `file_path` paths accordingly.\n"

readme_excerpt: "![Dosepy-Logo](https://dosepy.readthedocs.io/en/latest/_static/Logo_Dosepy.png)\r\n\r\
  \n![PyPI - Version](https://img.shields.io/pypi/v/Dosepy)\r\n![PyPI - Python Version](https://img.shields.io/pypi/pyversions/Dosepy)\r\
  \n![PyPI - Downloads](https://img.shields.io/pypi/dm/Dosepy)\r\n![GitHub commit activity](https://img.shields.io/github/commit-activity/m/LuisOlivaresJ/Dosepy)\r\
  \n\r\n# Welcome to Dosepy\r\n\r\nMain [documentation](https://dosepy.readthedocs.io/en/latest/intro.html)\r\
  \n\r\nDosepy is an open-source Python library to perform radiochromic film dosimetry.\r\n\r\nDosepy\
  \ is intended to be an accessible tool for medical physicists in radiation oncology to perform film\
  \ dosimetry effortlessly.\r\n\r\n## Installation\r\n\r\nDosepy is distributed as a Python library under\
  \ the [Python Package Index](https://pypi.org/) (PyPI).\r\nOpen a console (or 'terminal', or 'command\
  \ prompt') and use the pip command:\r\n\r\n```bash\r\npip install Dosepy\r\n```\r\n\r\nSee the Python\
  \ for Beginners [getting started tutorial](https://opentechschool.github.io/python-beginners/en/getting_started.html#what-is-python-exactly)\
  \ for an introduction to using your operating system’s console and interacting with Python.\r\n\r\n\
  ## Features\r\n\r\n* Automatic film detection.\r\n* Uncertainty analysis.\r\n* Quality control test\
  \ for error detection.\r\n* Average of multiple scans for noise reduction.\r\n* Handle lateral scanner\
  \ response artifact.\r\n\r\n## Gamma index\r\n\r\n Dose distributions comparison can be performed using\
  \ the 2-dimensional gamma index test according to Low's definition [Daniel_Low_gamma_1998](https://doi.org/10.1118/1.598248),\
  \ as well as some AAPM TG-218 [Miften_TG218_2018](https://doi.org/10.1002/mp.12810) recommendations:\r\
  \n\r\n* The acceptance criteria for dose difference can be selected in absolute mode (in Gy) or relative\
  \ mode (in %).\r\n  * In relative mode, the percentage could be interpreted with respect to the maximum\
  \ dose (global normalization), or with respect to the local dose (local normalization); according to\
  \ user selection.\r\n* Dose threshold can be adjusted by the user.\r\n* The reference distribution can\
  \ be selected by the user.\r\n* It is possible to define a search radius as an optimization process\
  \ for calculation.\r\n* By default, percentile 99 from dose distribution is used as maximum dose. This\
  \ is used to avoid the possible inclusion of artifacts or user markers.\r\n* Interpolation is not yet\
  \ supported.\r\n\r\n## Used technologies\r\n\r\n* [Matplotlib](https://matplotlib.org/) for data visualization.\r\
  \n* [Numpy](https://numpy.org/) for data array manipulation.\r\n* [PySide6](https://doc.qt.io/qtforpython-6/)\
  \ for graphical user interface (GUI).\r\n* [Pydicom](https://pydicom.github.io/) to read files in DICOM\
  \ format.\r\n* [Imageio](https://imageio.github.io/) to read files in TIFF format.\r\n* [Scikit-image](https://scikit-image.org/)\
  \ and [scipy](https://scipy.org/) for image processing.\r\n\r\n## Warning!\r\nTo use a software as a\
  \ [medical device](https://www.imdrf.org/documents/software-medical-device-samd-key-definitions), it\
  \ is required to demonstrate its safety and efficacy through a [risk categorization structure](https://www.imdrf.org/documents/software-medical-device-possible-framework-risk-categorization-and-corresponding-considerations),\
  \ a [quality management system](https://www.imdrf.org/documents/software-medical-device-samd-application-quality-management-system)\
  \ and a [clinical evaluation](https://www.imdrf.org/documents/software-medical-device-samd-clinical-evaluation);\
  \ as described in the International Forum of Medical Device Regulators working group guidelines (IMDRF).\r\
  \n\r\nDosepy is currently **under development** to meet quality standards. To achieve this in Mexico\
  \ the regulatory mechanism is through NOM-241-SSA1-2021, in addition to the IMDRF guidelines.\r\n\r\n\
  ## Contributing\r\n\r\nDosepy uses GitHub as a platform to store and develop the software.\r\n* To report\
  \ software bugs, create an issue [here](https://github.com/LuisOlivaresJ/Dosepy/issues)\r\n* To commit\
  \ changes, create an issue, [fork](https://docs.github.com/en/get-started/exploring-projects-on-github/contributing-to-a-project)\
  \ the repository, make your changes, and make a new pull request.\r\n\r\n## Discussion\r\nHave questions?\
  \ Ask them on the Dosepy [discussion forum](https://groups.google.com/g/dosepy).\r\n"

readme_excerpt: '🧠 AI in Medical Imaging – Research Portfolio


  I am a Medical Physics graduate specialising in AI-driven analysis of MRI and multimodal imaging data.
  My work focuses on developing quantitative imaging biomarkers and clinically relevant machine learning
  models for neuroimaging and radiotherapy applications.


  🔬 Research Focus

  Quantitative MRI (T2*, DTI)

  AI for neuroimaging biomarkers

  MRI-guided radiotherapy (MRI-LINAC)

  Multimodal imaging (MRI–PET integration)

  📌 Key Projects

  🧠 AI-based Brain Iron Estimation (MRI)

  T2* mapping and ROI analysis

  Machine learning for biomarker estimation

  Uncertainty quantification

  🏥 MRI-LINAC Positioning AI

  Image registration and alignment

  Clinical workflow relevance in radiotherapy

  🧬 Diffusion MRI Analysis (DTI)

  FA and MD mapping

  Quantitative microstructural analysis

  🫁 Chest X-ray AI (Pneumonia Detection)

  CNN + transfer learning

  Explainability (Grad-CAM)

  ⚙️ Technical Skills

  Python (NumPy, PyTorch, NiBabel, SimpleITK)

  MRI data processing and analysis

  Machine learning & deep learning

  Image segmentation and classification

  🎯 Research Aim


  To develop clinically translatable AI models that enhance non-invasive diagnosis and treatment planning
  using advanced medical imaging.


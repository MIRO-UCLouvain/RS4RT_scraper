readme_excerpt: "# Explainable-Multi-Stage-Deep-Learning-for-Brain-Tumor-Segmentation-and-Classification\n\
  Brain tumors exhibit substantial morphological and malig- nancy variability, leading to misdiagnosis\
  \ rates exceeding 20% with routine MRI interpretation and delaying neuro- oncology interventions. \n\
  \nWe propose an explainable, multi- stage deep learning framework that integrates tumor seg- mentation,\
  \ classification, and structured summary gener- ation to create a clinical decision support system.\
  \ The pipeline first employs a ResUNet to localize tumor regions on MRI slices. It then uses predicted\
  \ masks to extract region-of-interest (ROI) crops, combines them with the orig- inal full image in a\
  \ dual-input architecture, and feeds the result to a fine-tuned ResNet50 classifier to predict one of\
  \ four classes: glioma, meningioma, pituitary tumor, or no tu- mor. The system provides explainability\
  \ through Grad-CAM heatmaps and a MedGemma VLM that generates structured clinical summaries with a deterministic\
  \ template fallback for reliability. \n\nMoreover, the quantitative stage-consistency metrics and qualitative\
  \ evaluations confirm strong align- ment across pipeline stages. We used extensive ablation studies\
  \ and qualitative evaluations to demonstrate that the framework delivers high performance while producing\
  \ clin- ically coherent, trustworthy explanations\n"

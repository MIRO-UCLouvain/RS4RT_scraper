readme_excerpt: "SlicerCBCTToothSegmentation\n===========================\n\nSlicer extension for automated\
  \ segmentation of individual teeth in cone-beam CT dental scans using a deep-learning based approach.\n\
  \n![](Screenshot01.png)\n\nDependencies\n------------\nThis module requires the Pytorch extension which\
  \ can be installed via the Extension Manager. Python dependencies such as MONAI will be automaically\
  \ installed by the module if not available. The module internally downloads pretrained model weights\
  \ to intialize a segmentation model. \n\nTutorial\n-----\n\n1. Load the CBCT scan to be segmented into\
  \ slicer and select it as the `Input volume`.\n2. Create a new `Input ROI` and adjust the bounding box\
  \ to surround the tooth of interest that you would like to segment. \n3. Specify an 'Output Segmentation'\
  \ and click the 'Apply' button to run segmentation inference. \n\n- Repeat steps 2) and 3) to segment\
  \ multiple teeth. \n- Edit the automated output segmentation using the `Paint`, `Draw` and `Erase` tools\
  \ in the `Segmentation editor` built into the module\n- Directly save the output segmentation to file\
  \ in the `Export to file` section.\n\n\nLicense\n-------\n\nThis extension is covered by the Apache\
  \ License, Version 2.0:\n\nhttps://www.apache.org/licenses/LICENSE-2.0\n\n"

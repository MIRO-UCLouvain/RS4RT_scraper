readme_excerpt: "### Physics-ArX: Physics-based data augmentation for CT and CBCT quantification in radiotherapy\n\
  \nPhysics-ArX python library provides an easy-to-use physics-based data augmentation pipeline for inducing\
  \ realistic cone-beam CT (CBCT) artifacts on high-quality planning CT images, which results in perfectly\
  \ paired/registered 3D synthetic CBCT (sCBCT) and planning CT (+ segmentation/dose) data. The motivation\
  \ behind Physics-ArX library is to create a computationally cheap and deterministic pipeline to deteriorate\
  \ high-quality planning CT images to simulate realistic CBCT image variations while leveraging high-quality\
  \ gross tumor volume (GTV) and organs-at-risk (OARs) segmentations to train robust and generalizable\
  \ fully-supervised deep learning algorithms (this is in contrast to prior approaches that rely on unpaired\
  \ CT-CBCT data and error-prone/hallucinating unsupervised deep learning algorithms). Specifically, the\
  \ scatter artifacts are extracted and transferred from corresponding baseline (pre-treatment) CBCT image\
  \ whereas the motion artifacts are derived from corresponding 4D CT image (both baseline CBCT and 4D\
  \ CT images are easily accessible/available in non-small cell lung cancer radiotherapy settings). \n\
  \nFor preliminary data, we have shown that segmentation models trained on our Physics-ArX augmentated\
  \ data can generalize across CT and CBCT images (**PMB'21**). Moreover, since Physics-ArX results in\
  \ large number of perfecly-paired/registered planning CT and sCBCT variations, for the first time we\
  \ also created 3D multitask CBCT-to-CT translation and OAR segmentation deep learning models that can\
  \ quantify all daily/weekly CBCTs acquired during radiotherapy (**Medical Physics'21**). Finally, we\
  \ also demonstrated a new motion artifact induction pipeline for CT and CBCT images using 4D CT data\
  \ in our **AAPM'21 abstract**. We have also released our [SeqX2Y](https://github.com/nadeemlab/SeqX2Y)\
  \ model which allows generation of physically realistic 4D CT data from static 3D CT images (**PMB'23**);\
  \ this SeqX2Y model can be used in tandem with the **AAPM'21** work to generate motion artifacts on\
  \ CT and CBCT images.\n\n## Updates:\n- [x] Physics-ArX scatter-artifact induction and data augmentation\
  \ pipeline, given planning CT and baseline CBCT input\n- [x] Multitask 3D CBCT-to-CT translation and\
  \ organs-at-risk segmentation using physics-based (scatter artifact induced) data augmentation (**Medical\
  \ Physics'21**)\n- [x] Motion artifact induction on CT and CBCT using 4D CT data, synthtically generated\
  \ by our [SeqX2Y](https://github.com/nadeemlab/SeqX2Y) model (**AAPM'21**, **PMB'23**)\n- [ ] Specialized\
  \ deep learning model for motion artifact correction, given CT or CBCT input\n- [ ] Specialized deep\
  \ learning model for CBCT-to-CT translation, given weekly/daily CBCT input\n- [ ] Specialized deep learning\
  \ model for GTV/OAR segmentation, given CT or CBCT input\n- [ ] Test on sites other than lung, e.g.\
  \ head-and-neck and pancreas\n\n### Multitask 3D CBCT-to-CT Translation and Organs-at-Risk Segmentation\
  \ Using Physics-Based Data Augmentation\n\n[Read Link](https://arxiv.org/abs/2103.05690v2)\n\n*Weekly\
  \ cone-beam computed tomography (CBCT) images are primarily used for patient setup during radiotherapy.\
  \ To quantify CBCT images, we present a 3D multitask deep learning model for simultaneous CBCT-to-CT\
  \ translation and organs-at-risk (OARs) segmentation driven by a novel physics-based artifact/noise-induction\
  \ data augmentation pipeline. The data augmentation technique creates multiple paired/registered synthetic\
  \ CBCTs corresponding to a single planning CT which in turn can be used to translate real weekly CBCTs\
  \ to better quality CTs while performing OAR segmentation using the high-quality planning CT contours.\
  \ Given the resultant perfectly-paired CBCT and planning CT/contours data, we use supervised conditional\
  \ generative adversarial network as the base model which, unlike CycleGAN -- prevalent in CBCT-to-CT\
  \ translation literature -- and other unsupervised image-to-image translation methods, does not hallucinate\
  \ or produce randomized outputs. We also use a large 95 patient lung cancer dataset with planning CT\
  \ and weekly CBCTs.*\n![overview_image](./images/Pipeline-figure.png)**Figure**. *Entire workflow of\
  \ generating different variations of perfectly paired pseudo CBCT variations from single deformable\
  \ registered planning CT and week1 CBCT pair. The generated data is used to train a multitask 3D pix2pix\
  \ model to generate synthetic CT and OAR segmentations.*\n## Prerequisites:\n```del\nNVIDIA GPU (Tested\
  \ on NVIDIA RTX 2080 Ti)\nCUDA CuDNN (CPU mode and CUDA without CuDNN may work with minimal modification)\n\
  Python 3\nPytorch>=0.4.0\ntorchvision>=0.2.1\ndominate>=2.3.1\nvisdom>=0.1.8.3\n```\n\n## Dataset:\n\
  All images must be 128x128x128 in size (DxHxW). During training the network takes a 128x128x128 CBCT\
  \ image as input and produces the corresponding synthetic CT and a synthetic multi-label OAR segmentation.\
  \ During training, to compute the loss functions, it also needs the real CT and real multi-label OAR\
  \ segmentation. So, all images are converted into numpy (*.npz) images which can store multiple arrays\
  \ as dictionaries. The dictionaries keys are 'CT', 'CBCT' and 'RTSTRUCTS'. Multiple RT structures (OAR\
  \ segmentations), are converted into single multi-label image. We trained our models with Esophagus\
  \ label = 4, spinal cord = 3, heart = 2 and lungs = 1. \n\nFor testing purpose, for any unavailable\
  \ image in the pairing set, just put the CBCT image or a blank image in the final paired image in place\
  \ of the missing image in the pair. Some example python scripts are provided in 'preprocess' subdirectory\
  \ as examples of preprocessing needed to produce training/testing data. \nData needs to be arranged\
  \ in the following order:\n```\ndatasets/XXX_Dataset \n    ├── test\n    ├── val\n    └── train\n```\n\
  \n## Training:\nTo train a model:\n```\npython train.py --dataroot ./datasets/XXX_Dataset\n        \
  \        --netG unet_128 \n                --name Experiment_Name\n                --stabilize \n  \
  \              --input_nc 1 \n                --output_nc 2 \n                --model pix2pix3d \n \
  \               --direction BtoA \n                --lambda_L1 100 \n                --dataset_mode\
  \ cbct2ct3d \n                --norm batch --batch_size 1 \n                --display_port 8097 \n \
  \               --lr 0.0001 \n                --display_freq 1000 \n                --print_freq 1\n\
  ```\n* To view training losses and results, open the URL http://localhost:8097. For cloud servers replace\
  \ localhost with your IP.\n* To epoch-wise intermediate training results, ./checkpoints/Experiment_Name/web/images\n\
  * Trained models will be by default save in ./checkpoints/Experiment_Name.\n* You can also put the training\
  \ command above in scripts/train_cbct2ct3d.sh and simply run ./scripts/train_cbct2ct3d.sh from command\
  \ line.\n## Testing:\nTo test the model:\n```\npython test.py --dataroot ./datasets/XXX_Dataset\n  \
  \             --netG unet_128 \n               --name Experiment_Name \n               --phase test\
  \ \n               --mode eval \n               --model pix2pix3d \n               --input_nc 1 \n \
  \              --output_nc 2 \n               --direction BtoA \n               --dataset_mode cbct2ct3d\n\
  \               --norm batch\n```\n* The test results will be by default saved to ./results/Experiment_Name/test_latest/npz_images.\n\
  * Pretrained models can be downloaded [here](https://zenodo.org/record/5002882#.YM_ukXVKiZQ). Place\
  \ the pretrained model in ./checkpoints/Experiment_Name/.\n* To test the model input images can be prepared\
  \ similar to training stage. Examples are given in 'preprocess' sub-directory.\n* To compute statistics\
  \ for translation and segmentation tasks, some example scripts are given in 'statistics' subdirectory.\
  \ The functions in these scripts can be used as termplates to compute dice/mae/mse/hausdorff distances\
  \ etc. similar to the paper.\n* Example script is also provided to run connected component analysis\
  \ on the segmentation results to keep only the largest blob.\n\n## More options?\nYou can find more\
  \ options in:\n* **./options/base_option.py** for basic options for training and testing purposes. \n\
  * **./options/train_options.py** for advanced training options.\n* **./options/test_options.py** for\
  \ advanced testing options.\n\n## Public Dataset:\nThe best model in our paper was trained with a combination\
  \ of our internal Memorial Sloan Kettering Cancer Center (MSKCC) data \nand AAPM Thoracic Auto-segmentation\
  \ Challenge data (http://aapmchallenges.cloudapp.net/competitions/3). Unfortunately, MSKCC data \ncannot\
  \ be publicly released due to data privacy concerns. However, AAPM data is available publicly.\nWe have\
  \ augmented the AAPM data (which only contained plan CT and OAR segmentations) using our physics-based\
  \ \naugmentation techniques followed by geometric (rotation/scale/shear/noise) augmentations to generate\
  \ perfectly paired pCT/psCBCT/OAR pairs which can be used for training/testing. \nThis augmented data\
  \ is available for download [here](https://zenodo.org/record/5035494#.YNjIqnVKi0o). \nThe data needs\
  \ to be converted to numpy (*.npz) format for training/testing using instructions above.\n\nAn example\
  \ dataset is generated using ./preprocess/prep_test_data_pseudo_cbct_3D.py. The npz file is \nsaved\
  \ in ./datasets/psAAPM/test folder and the resulting synthetic CT and OAR segmentation, after running\
  \ the testing script using the trained model, is saved in \n./results/msk_aapm_stabilized_eso4/test_latest/npz_images\n\
  \n## Physics-based Augmentation Pipeline:\nThe multitask CBCT to CT translation and OAR segmentation\
  \ models are based on a physics-based artifact/noise induction data augmentation pipeline.\nBroadly,\
  \ this is a methodology to extract different types of noise artifacts from CBCT images and adding these\
  \ noise artifacts to planning CT (pCT) images\nto generate several synthetic pseudo-CBCT (psCBCT) images\
  \ from a single registered pair of CT-CBCT images. Following figure shows example of a week 1 CBCT image\
  \ deformably registered to a corresponding\npCT image. Several types of noise artifacts are extracted\
  \ from the registered week 1 CBCT, added to the corresponding pCT and followed by reconstruction using\
  \ OS-SART technique leading to\nthe generation of several pseudo-CBCT's from a single case.\n![psCBCTs_image](./images/Pseudo-CBCT-Variations.png)**Figure**.\
  \ *Example slices of five different\nvariations of psCBCT images generated by transferring artifacts/noise\
  \ from week 1 CBCT to pCT and reconstructing using\nOS-SART technique. The five different variations\
  \ correspond to different parameters in the power-law adaptive histogram\nequalization (PL-AHE) technique.\
  \ The organs-at-risk masks manually segmented on pCT images are perfectly paired to all different\n\
  psCBCT variations as well.*\nThese synthetic CBCT/CT are further augmented with\ngeometric augmentations\
  \ leading to creation of large database of perfectly paired pCT/psCBCT images from a small set of registered\
  \ pCT and week1 CBCT images.\nThis physics-based augmentation process is described in our separate paper:\
  \ Generalizable cone beam CT esophagus segmentation using physics-based data augmentation [link](https://pubmed.ncbi.nlm.nih.gov/33535199/)\
  \ .\nThere are several steps in this process and we provide code with data samples for all steps.\n\
  ### Artifact extraction: ###\nThe first step is to extract artifacts from deformably registered week1\
  \ CBCT using Power Law Adaptive Histogram Equilization. Code for this step is\nin the following folder:\n\
  ```\nPhysics-based-Augmentation/Artifact-Induction \n```\nThe code was built and tested on Ubuntu 20.04\
  \ but the steps should be easily reproducible on other linux based systems. It requires ITK Insight\
  \ Toolkit [link](https://itk.org/download/) and cmake-gui. Steps:\n* Download and install ITK toolkit.\
  \ In the extracted ITK directory, do: mkdir BUILD; cd BUILD; ccmake ../ ; configure ('c'), generate\
  \ ('g'); make; make install;\n* Navigate to each of the sub-directories in Cpp-codes subfolder; mkdir\
  \ BUILD; cd BUILD; ccmake .."

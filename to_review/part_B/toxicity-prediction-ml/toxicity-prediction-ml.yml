readme_excerpt: "# Toxicity Prediction Using Machine Learning\n\n## Project Overview\nThis project builds\
  \ a machine learning pipeline to predict whether a compound is **Toxic** or **Non-Toxic** using high-dimensional\
  \ molecular descriptor data.\n\nThe dataset contains **171 observations and 1203 features**, which requires\
  \ dimensionality reduction and robust modeling techniques.  \n\nThe workflow includes **exploratory\
  \ data analysis (EDA), preprocessing, feature selection, class imbalance handling, ensemble machine\
  \ learning models, and cross-validation evaluation.**\n\n---\n\n## Dataset\nThe dataset consists of\
  \ chemical descriptors used to determine toxicity.\n\n- **Total Samples:** 171  \n- **Total Features:**\
  \ 1203  \n- **Target Column:** `Class`\n\n### Target Classes\n- **Toxic**\n- **NonToxic**\n\nThe dataset\
  \ has a **class imbalance of approximately 2:1**.\n\n---\n\n## Project Workflow\n\n### 1. Exploratory\
  \ Data Analysis (EDA)\nEDA was conducted to understand the dataset structure and feature behavior.\n\
  \nThe analysis included:\n\n- Class distribution visualization\n- Feature variance distribution\n- Data\
  \ quality summary\n- Feature reduction pipeline visualization\n\n---\n\n### 2. Data Preprocessing\n\n\
  #### Variance Threshold\nFeatures with **zero variance** were removed to eliminate non-informative variables.\n\
  \n#### Feature Scaling\nThe dataset was scaled using **RobustScaler**, which is resistant to outliers\
  \ and works well with high-dimensional data.\n\n---\n\n### 3. Feature Selection\n\nTwo feature selection\
  \ methods were used:\n\n#### Mutual Information\nMeasures the dependency between features and the target\
  \ variable.\n\n- Top **40 features** selected.\n\n#### Random Forest Feature Importance\nUses tree-based\
  \ models to determine feature importance.\n\n- Top **40 features** selected.\n\n#### Final Feature Set\n\
  The **union of both methods** was used as the final feature set.\n\n- **Final number of features: 77**\n\
  \n---\n\n### 4. Handling Class Imbalance\n\nThe dataset is imbalanced, which can bias model predictions.\n\
  \nTo solve this problem, **SMOTE (Synthetic Minority Over-sampling Technique)** was implemented manually.\n\
  \nSMOTE was applied **inside each cross-validation fold** to prevent data leakage.\n\n---\n\n### 5.\
  \ Machine Learning Models\n\nFour models were trained and compared:\n\n- **Random Forest**\n- **Extra\
  \ Trees**\n- **Gradient Boosting**\n- **Voting Ensemble (Random Forest + Extra Trees + Gradient Boosting)**\n\
  \nThe ensemble model combines predictions from multiple models to improve performance.\n\n---\n\n###\
  \ 6. Model Validation\n\nModel performance was evaluated using **10-Fold Stratified Cross-Validation**.\n\
  \nThe following metrics were used:\n\n- Accuracy\n- Weighted F1-Score\n- ROC-AUC\n- Precision\n- Recall\n\
  \n---\n\n## Visualizations\n\nThe notebook generates several visual outputs including:\n\n1. EDA overview\n\
  2. Feature selection comparison\n3. Correlation heatmap\n4. Model performance comparison\n5. Cross-validation\
  \ fold performance\n6. ROC curves\n7. Confusion matrix\n8. Feature importance plots\n\n---\n\n## Results\n\
  \nThe **Voting Ensemble model** achieved the best performance.\n\nTypical results obtained:\n\n- **Accuracy:**\
  \ ~0.75 – 0.82  \n- **ROC-AUC:** ~0.78 – 0.85  \n- **F1-Score:** ~0.74 – 0.81  \n\nThese results show\
  \ that **ensemble models perform well for high-dimensional toxicity prediction problems.**\n\n---\n\n\
  ## Technologies Used\n\n- Python\n- NumPy\n- Pandas\n- Scikit-learn\n- Matplotlib\n- Seaborn\n\n---\n\
  \n\n\n\n"

readme_excerpt: '# Iosevmata


  A modified Iosevka font that tries to mimic Pragmata Pro. Modifications are in

  `private-build-plans.toml`. Tweak this if you want by following this

  [instruction](https://github.com/be5invis/Iosevka/blob/main/doc/custom-build.md).

  A patched nerd font of this is also available.



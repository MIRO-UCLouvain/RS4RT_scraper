readme_excerpt: "# Explainable AI for Drug Discovery and Analysis\n\n## Overview\nThis project employs\
  \ **Machine Learning (ML) and Deep Learning (DL)** techniques to predict drug toxicity and ensure interpretability\
  \ through **Explainable AI (XAI)** approaches such as **SHapley Additive exPlanations (SHAP)** and **Local\
  \ Interpretable Model-Agnostic Explanations (LIME)**. The goal is to improve trust in AI-based drug\
  \ analysis by providing transparent model predictions.\n\n## Features\n- **Drug Toxicity Prediction:**\
  \ Uses Random Forest and Graph Neural Networks (GNNs) to classify drug reactions.\n- **Data Preprocessing:**\
  \ Handles missing values, encodes labels, and applies **Principal Component Analysis (PCA)** for dimensionality\
  \ reduction.\n- **Explainability with SHAP & LIME:** Enhances model transparency by explaining individual\
  \ predictions.\n- **Performance Evaluation:** Assesses accuracy, precision, recall, F1-score, and execution\
  \ time.\n- **Visualization Tools:** Generates validation graphs, comparison charts, and node embedding\
  \ graphs.\n\n## Technologies Used\n- **Programming Languages:** Python\n- **Frameworks & Libraries:**\n\
  \  - Machine Learning: Scikit-learn, TensorFlow, PyTorch\n  - Explainability: SHAP, LIME\n  - Data Processing:\
  \ Pandas, NumPy, Scipy\n  - Visualization: Matplotlib, Seaborn\n  - Web App: Streamlit\n- **Development\
  \ Tools:** Anaconda Navigator, Spyder IDE\n\n  \n\n## Usage\n- Upload the **drug discovery dataset**\
  \ (CSV format).\n- The system will **preprocess** and classify drug toxicity using ML/DL models.\n-\
  \ **SHAP and LIME visualizations** will provide explanations for model predictions.\n- Results will\
  \ be displayed with performance metrics and comparison charts.\n\n## Dataset\n- The dataset consists\
  \ of **~3,000 rows and 15 features**, including drug name, category, pregnancy category, and side effects.\n\
  \n## Contributing\nContributions are welcome! Feel free to submit issues or pull requests to enhance\
  \ the project.\n\n\n## Contact\nFor any queries, reach out to: 123koushiksiddu123@gmail.com\n\n"

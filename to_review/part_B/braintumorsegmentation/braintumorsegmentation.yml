readme_excerpt: "# Brain Tumor Segmentation\n\nBrain-tumor segmentation on MRI volumes (BraTS dataset,\
  \ NIfTI `.nii` format)\ncombining classical **digital image processing** with a **YOLO** oriented\n\
  bounding-box / segmentation model, plus a metrics suite to evaluate the results.\n\nThe pipeline slices\
  \ 3D MRI volumes (axial / coronal planes), enhances them\n(CLAHE, frequency- and spatial-domain filtering),\
  \ localizes the tumor region and\nproduces a segmentation mask, then scores the masks against ground\
  \ truth.\n\n## Project layout\n\n| Path | Description |\n|------|-------------|\n| `main.py` | Main\
  \ segmentation pipeline over `.nii` MRI volumes. |\n| `metrics.py` | Computes segmentation metrics (Jaccard/IoU,\
  \ Panoptic Quality). |\n| `validation.py` | Validation routines for the segmentation output. |\n| `utils/`\
  \ | Image-processing helpers: `digital_image_processing`, `frequency_domain`, `spartial_domain`. |\n\
  | `images/` | Reference masks and templates used during processing. |\n| `docs/` | Supporting documentation.\
  \ |\n| `*.csv` | Computed metrics and segmentation indices. |\n\n## Requirements\n\n- Python 3.9+ (CUDA-capable\
  \ GPU recommended for YOLO)\n- `ultralytics`, `nibabel`, `opencv-python`, `numpy`, `pandas`, `matplotlib`,\n\
  \  `torch`, `torchmetrics`\n\n## Notes\n\nThe scripts reference absolute local paths for the dataset,\
  \ the trained YOLO\nweights (`best.pt`) and results directories — update these to your own\nenvironment\
  \ before running. Datasets and trained weights are not part of this\nrepository.\n"

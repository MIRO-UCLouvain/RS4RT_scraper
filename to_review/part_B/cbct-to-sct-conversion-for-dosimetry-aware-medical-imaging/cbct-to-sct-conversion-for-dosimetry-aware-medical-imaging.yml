readme_excerpt: "\n# CBCT-to-Synthetic CT Generation for Adaptive Radiotherapy\n\nThis project implements\
  \ a CBCT-to-synthetic CT generation pipeline using the **SynthRAD2025 Task 2** dataset. The goal is\
  \ to convert cone-beam CT images into CT-like synthetic CT images with improved HU accuracy for adaptive\
  \ radiotherapy applications.\n\nThe project was developed as a medical imaging / medical physics AI\
  \ portfolio project, focusing on practical CBCT artifact correction, HU restoration, region-wise evaluation,\
  \ and exploratory uncertainty estimation.\n\n## Project Motivation\n\nCone-beam CT is widely used in\
  \ image-guided and adaptive radiotherapy because it provides patient anatomy at the treatment position.\
  \ However, CBCT images suffer from several limitations:\n\n- scatter artifacts,\n- noise,\n- shading/cupping\
  \ artifacts,\n- inaccurate HU values,\n- reduced soft-tissue contrast.\n\nThese limitations make raw\
  \ CBCT less reliable for quantitative radiotherapy tasks such as dose calculation or adaptive treatment\
  \ planning.\n\nSynthetic CT generation aims to learn a mapping:\n\n\nCBCT image → CT-like synthetic\
  \ CT image\n\nso that the output has improved anatomical and HU consistency compared with raw CBCT.\n\
  \n## Dataset\n\nThe project uses the **SynthRAD2025 Task 2** dataset.\n\nInput:\nCBCT\n\nTarget:\nPlanning\
  \ CT\n\n\nAnatomical regions:\n\n```text\nAB  = abdomen\nHN  = head and neck\nTH  = thorax\n```\n\n\
  Each patient folder contains:\n\n```text\ncbct.mha\nct.mha\nmask.mha\n```\n\nExpected dataset structure:\n\
  \n```text\ndata/\n└── Task2/\n    ├── AB/\n    │   ├── 2ABA002/\n    │   │   ├── cbct.mha\n    │   │\
  \   ├── ct.mha\n    │   │   └── mask.mha\n    │   └── ...\n    ├── HN/\n    └── TH/\n```\n\nThe dataset\
  \ is **not included** in this repository.\n\n---\n\n## Project Pipeline\n\nThe complete pipeline is:\n\
  \n```text\nCBCT/CT/mask loading\n        ↓\nHU clipping and normalization\n        ↓\ncenter crop /\
  \ padding to 320 × 320\n        ↓\n2.5D slice-stack creation\n        ↓\n2.5D U-Net++ model\n      \
  \  ↓\nsynthetic CT prediction\n        ↓\nHU-based evaluation\n        ↓\nregion-wise error analysis\n\
  \        ↓\nMonte Carlo dropout uncertainty\n```\n\n---\n\n## Preprocessing\n\nImages are loaded using\
  \ **SimpleITK**.\n\nThe `.mha` files are read in array format:\n\n```text\n[z, y, x]\n```\n\nAll images\
  \ are clipped to a fixed HU range:\n\n```text\nmin HU = -1000\nmax HU = 1600\n```\n\nThen normalized\
  \ to:\n\n```text\n[-1, 1]\n```\n\nusing:\n\n```text\nx_norm = 2 × (x - minHU) / (maxHU - minHU) - 1\n\
  ```\n\nBecause patient image sizes vary, each slice is center-cropped or padded to:\n\n```text\n320\
  \ × 320\n```\n\nThe original voxel spacing was consistent across the dataset examples:\n\n```text\n\
  1.0 × 1.0 × 3.0 mm\n```\n\n---\n\n## 2.5D Dataset Strategy\n\nInstead of using only one CBCT slice,\
  \ the model receives neighboring slices as multiple input channels.\n\nFor a center slice `z`, the input\
  \ is:\n\n```text\nCBCT[z-3], CBCT[z-2], CBCT[z-1], CBCT[z], CBCT[z+1], CBCT[z+2], CBCT[z+3]\n```\n\n\
  The target is:\n\n```text\nCT[z]\n```\n\nSo the model input/output shapes are:\n\n```text\nInput:  [7,\
  \ 320, 320]\nTarget: [1, 320, 320]\n```\n\nThis gives the model local 3D anatomical context while still\
  \ keeping the memory cost closer to 2D training.\n\n---\n\n## Model Architecture\n\nThe final model\
  \ uses:\n\n```text\n2.5D U-Net++ with ResNet-34 encoder\n```\n\nimplemented using:\n\n```text\nsegmentation_models_pytorch\n\
  ```\n\nAlthough the library is commonly used for segmentation, this project uses the model for **image-to-image\
  \ regression**.\n\nModel configuration:\n\n| Component       |                Setting |\n| ---------------\
  \ | ---------------------: |\n| Architecture    |                U-Net++ |\n| Encoder         |    \
  \          ResNet-34 |\n| Encoder weights |               ImageNet |\n| Input channels  |          \
  \            7 |\n| Output channels |                      1 |\n| Image size      |              320\
  \ × 320 |\n| Dropout         |                    0.2 |\n| Task            | CBCT-to-sCT regression\
  \ |\n\n---\n\n## Loss Function\n\nThe final training loss is:\n\n```text\nTotal Loss = L1 Loss + 0.2\
  \ × SSIM Loss + 0.05 × Gradient Loss\n```\n\nPurpose of each term:\n\n| Loss term     | Purpose    \
  \                                 |\n| ------------- | ------------------------------------------- |\n\
  | L1 loss       | improves voxel-wise HU accuracy             |\n| SSIM loss     | encourages anatomical\
  \ structural similarity |\n| Gradient loss | preserves edges and tissue boundaries       |\n\nA region-weighted\
  \ loss was also tested as an ablation study, but it did not improve overall performance.\n\n---\n\n\
  ## Computational Constraints\n\nThis project was developed under standard **Google Colab T4 GPU** limitations.\n\
  \nThe available GPU memory, session duration, and runtime stability constrained the scale of training.\
  \ Therefore, the final Colab-based model used a strong **single-fold subset training strategy** instead\
  \ of full challenge-style multi-fold ensembling or full-dataset training.\n\nFinal Colab training setup:\n\
  \n| Setting             |     Value |\n| ------------------- | --------: |\n| GPU                 |\
  \ NVIDIA T4 |\n| Training patients   |        80 |\n| Validation patients |        20 |\n| Epochs  \
  \            |        25 |\n| Batch size          |         2 |\n| Image size          | 320 × 320 |\n\
  | Input slices        |         7 |\n| Best epoch          |        12 |\n\nThe code supports resume\
  \ training using saved checkpoints, which makes it suitable for future scaling on RTX 4090, cloud GPU,\
  \ or cluster resources.\n\n---\n\n## Final Deterministic Results\n\nThe final deterministic model was\
  \ evaluated by comparing raw CBCT and predicted synthetic CT against the ground-truth CT.\n\n| Metric\
  \    | Raw CBCT | Final sCT |\n| --------- | -------: | --------: |\n| MAE [HU]  |   216.97 |     88.84\
  \ |\n| RMSE [HU] |   271.23 |    170.50 |\n| PSNR      |    19.99 |     24.08 |\n| SSIM      |    0.654\
  \ |     0.330 |\n\nThe final model reduced overall MAE by approximately:\n\n```text\n59.05%\n```\n\n\
  compared with raw CBCT.\n\n---\n\n## Region-wise Results\n\nRegion-wise MAE improvements:\n\n| Region\
  \      | Raw CBCT MAE [HU] | Final sCT MAE [HU] | Improvement |\n| ----------- | ----------------: |\
  \ -----------------: | ----------: |\n| Body        |            216.97 |              88.84 |     \
  \ 59.05% |\n| Bone        |            391.34 |             213.66 |      45.40% |\n| Soft tissue |\
  \            210.86 |              60.59 |      71.26% |\n| Air/lung    |            153.81 |      \
  \       186.41 |     -21.19% |\n\nMain finding:\n\n```text\nThe strongest improvement was observed in\
  \ soft tissue.\nBone improved but remained challenging.\nAir/lung regions were not improved and remain\
  \ a limitation.\n```\n\n---\n\n## Masked-background SSIM\n\nWhole-slice SSIM was found to be sensitive\
  \ to background and outside-body regions.\n\nTherefore, masked-background SSIM was also calculated by\
  \ setting outside-mask pixels to air/background before SSIM calculation.\n\nFinal masked-background\
  \ SSIM:\n\n```text\nMean: 0.798\nStd:  0.055\n```\n\nThis showed better structural agreement within\
  \ the relevant anatomical region than whole-slice SSIM.\n\n---\n\n## Ablation Study\n\nSeveral experiments\
  \ were performed during development:\n\n| Experiment  | Description                                \
  \      |\n| ----------- | ------------------------------------------------ |\n| Day 10      | Combined\
  \ loss, 30 training patients              |\n| Day 12      | Region-weighted loss                  \
  \           |\n| Day 13      | Combined loss, 80 training patients, partial run |\n| Final model | Combined\
  \ loss, 80 training patients, 25 epochs   |\n| MC dropout  | Exploratory uncertainty analysis      \
  \           |\n\nThe region-weighted loss improved bone and air/lung MAE slightly, but worsened overall\
  \ MAE and soft-tissue performance. Therefore, the combined L1 + SSIM + gradient loss was selected for\
  \ the final model.\n\n---\n\n## Monte Carlo Dropout Uncertainty\n\nMonte Carlo dropout was implemented\
  \ by keeping dropout active during inference and running multiple stochastic forward passes.\n\nFor\
  \ each input slice:\n\n```text\n20 stochastic predictions\n        ↓\nmean prediction = MC mean sCT\n\
  standard deviation = uncertainty map\n```\n\nA random-100 validation analysis was performed using 100\
  \ randomly selected slices across 20 validation patients.\n\nRandom-100 MC dropout results:\n\n| Metric\
  \                        |  Value |\n| ----------------------------- | -----: |\n| MC sCT MAE [HU] \
  \              |  97.22 |\n| Raw CBCT MAE [HU]             | 193.74 |\n| Mean uncertainty [HU]     \
  \    |  41.81 |\n| Error-uncertainty correlation |  0.147 |\n\nThe MC dropout mean prediction improved\
  \ over raw CBCT, but did not outperform deterministic inference.\n\nFinal interpretation:\n\n```text\n\
  Deterministic inference is used for final sCT generation.\nMC dropout is reported as exploratory uncertainty\
  \ analysis.\n```\n\nThe uncertainty maps showed a weak positive relationship with prediction error but\
  \ were not sufficiently calibrated for clinical reliability.\n\n---\n\n## Key Findings\n\n* A 2.5D U-Net++\
  \ model can substantially improve CBCT HU accuracy.\n* The final model reduced overall MAE from 216.97\
  \ HU to 88.84 HU.\n* Soft tissue showed the strongest improvement.\n* Bone improved but remained a difficult\
  \ region.\n* Air/lung regions remained challenging.\n* Masked-background SSIM better represented structural\
  \ quality than whole-slice SSIM.\n* MC dropout uncertainty was technically implemented but showed weak\
  \ calibration.\n* A strong single-fold model was used due to Colab/T4 resource limitations.\n\n---\n\
  \n## Repository Structure\n\n```text\nCBCT_to_sCT_Project/\n│\n├── README.md\n├── requirements.txt\n\
  ├── .gitignore\n│\n├── configs/\n│   └── config.yaml\n│\n├── src/\n│   ├── preprocessing.py\n│   ├──\
  \ dataset.py\n│   ├── model.py\n│   ├── losses.py\n│   ├── train.py\n│   ├── metrics.py\n│   ├── uncertainty.py\n\
  │   └── __init__.py\n│\n├── splits/\n│   ├── fold_0.json\n│   ├── fold_1.json\n│   └── fold_2.json\n\
  │\n├── notebooks/\n│   ├── 01_dataset_exploration.ipynb\n│   ├── 02_preprocessing_and_crop_pad.ipynb\n\
  │   ├── 03_2p5d_dataset_testing.ipynb\n│   ├── 04_training_pipeline_sanity_check.ipynb\n│   ├── 05_metrics_and_evaluation_setup.ipynb\n\
  │   ├── 06_final_model_evaluation.ipynb\n│   ├── 07_mc_dropout_uncertainty.ipynb\n│   └── 08_final_results_and_figures.ipynb\n\
  │\n└── results/\n    ├── final_tables/\n    └── final_project_figures/\n```\n\n---\n\n## Installation\n\
  \nInstall dependencies:\n\n```bash\npip install -r requirements.txt\n```\n\nIf PyTorch with CUDA is\
  \ not already installed, install it separately according to your CUDA version.\n\nExample:\n\n```bash\n\
  pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121\n```\n\n---\n\n## Training\n\
  \nExample final Colab training command:\n\n```bash\npython -m src.train \\\n    --fold 0 \\\n    --epochs\
  \ 25 \\\n    --batch_size 2 \\\n    --max_train_patients 80 \\\n    --max_val_patients 20 \\\n    --loss_type\
  \ combined \\\n    --l1_weight 1.0 \\\n    --ssim_weight 0.2 \\\n    --gradient_weight 0.05 \\\n   \
  \ --checkpoint_dir checkpoints/final_single_fold \\\n    --log_dir results/metrics\n```\n\nResume training:\n\
  \n```bash\npython -m src.train \\\n    --fold 0 \\\n    --epochs 25 \\\n    --batch_size 2 \\\n    --max_train_patients\
  \ 80 \\\n    --max_val_patients 20 \\\n    --loss_type combined \\\n    --resume_checkpoint checkpoints/final_single_fold/last_fold0.pth\
  \ \\\n    --resume_log \\\n    --checkpoint_dir checkpoints/final_single_fold \\\n    --log_dir results/metrics\n\
  ```\n\n## Limitations\n\nThis project was not submitted to the official SynthRAD2025 challenge and was\
  \ not trained using full competition-level resources.\n\nMain limitations:\n\n* Final training was limited\
  \ by Google Colab/T4 GPU resources.\n* Full-dataset training was not performed in the final Colab version.\n\
  * Full 3-fold or 5-fold ensembling was not performed.\n* The current dataset class loads selected patient\
  \ volumes into RAM, limiting scaling.\n* Air/lung regions showed worse MAE after sCT generation.\n*\
  \ MC dropout uncertainty showed only weak correlation with prediction error.\n* Dose calculation validation\
  \ was not included.\n\n---\n\n## Future Work\n\nFuture improvements may include:\n\n* Training on larger\
  \ patient subsets using RTX 4090 or cluster resources.\n* Implementing lazy loading or preprocessed\
  \ s"

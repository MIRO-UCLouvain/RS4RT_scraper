readme_excerpt: "# DRR-to-kV-Pixel-Mapping\nOn-board pre-treatment tumour motion verification on daily\
  \ cone-beam CT utilizing a hybrid AI/DRR-based background subtraction technique  \n\n## Introduction\n\
  \nThis is the companion repository from the paper \"On-board pre-treatment tumour motion verification\
  \ on daily cone-beam CT utilizing a hybrid AI/DRR-based background subtraction technique\", submitted\
  \ to Physics in Medicine and Biology.\nPatchNCE implementation is adapted from the work by Park et al\
  \ [1] found at https://github.com/taesungp/contrastive-unpaired-translation/tree/master\n\n[1] \n@inproceedings{park2020cut,\n\
  \n  title={Contrastive Learning for Unpaired Image-to-Image Translation},\n  \n  author={Taesung Park\
  \ and Alexei A. Efros and Richard Zhang and Jun-Yan Zhu},\n  \n  booktitle={European Conference on Computer\
  \ Vision},\n  \n  year={2020}\n}\n\n## Requirements\n\n* Python 3.10.14\n* PyTorch 1.13\n\n## Usage\n\
  Training configuration can be controlled in the config.yml and config_pretrain.yml files\n\nDatasets\
  \ should be stored as a numpy file with separate channels for registered DRRs, kV, and ITV masks\n\n\
  Numpy files should be stored in the directory referenced as DATA_DIR in config.yml\n\nThe variable referenced\
  \ as NUM_MODELS in config.yml if set to 1 defined a single model to be trained or if set to >1 defines\
  \ the training range of projection angles based on the ARC parameter\n\nTensorflow logging and model\
  \ outputs will be saved to the directories referenced as LOG_DIR and MODEL_DIR in congif.yml, respectively.\
  \ \n\nIf you have ground-truth segmentations for kV images, they should be stored as .mat files. Specifying\
  \ the ARC parameter in config.yml will limit model training to projections containing a ground-truth\
  \ segmentation\n\nControl point registration between DRR/kV pairs can be performed using the RegistererDRR.m\
  \ function. Raw kV projections should be stored in .mat format. DRRs and ITV masks on DRRs should be\
  \ stored in separate directories in DICOM format. Conversion from .mat to .numpy can be performed using\
  \ mat2npDatasetConvert.py\n\n\n\n\n"

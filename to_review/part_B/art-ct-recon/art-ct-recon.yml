readme_excerpt: "# ART_CT_recon\nZhuziliwww's implementation of ART reconstruction of cone beam CT. \n\
  \nThe implementation here follows Buzug's work in medical physics, which uses only the pixel-wise forward\
  \ projection operator A. The back-projection is simply the transpose of the operater $A^{T}$. \n\nThe\
  \ iterative method is given by approximating the original pic.\n\nThe impletation here is not complete\
  \ with non-satisfying result. The result shall be improved with some pre-filtering in the back-projection\
  \ steps. \n"

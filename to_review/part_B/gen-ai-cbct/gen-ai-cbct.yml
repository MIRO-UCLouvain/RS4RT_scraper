readme_excerpt: "# Generative AI-Enhanced Low-Dose CBCT for Impacted Mandibular Third Molars\n\n## Project\
  \ Description\nThis project is developed based on [pytorch-CycleGAN-and-pix2pix](https://github.com/junyanz/pytorch-CycleGAN-and-pix2pix)\
  \ for **low-dose CBCT to high-dose CBCT generation**. \n\n## Dataset\n- **Data Scale**: 302 CBCT scans\
  \ with 151 paired low-dose and high-dose CBCT scans.\n- **Patient Count**: 90 patients  \n- **Focus**:\
  \ Diagnosis and treatment planning for impacted mandibular third molars\n\n## Key Features\n- \U0001F3E5\
  \ Low-dose CBCT image quality enhancement\n- \U0001F916 Generative AI-based CBCT synthesis\n- \U0001F4CA\
  \ Clinical diagnosis and treatment planning impact assessment\n- \U0001F52C Quantitative image quality\
  \ analysis\n\n## Project Structure\nGEN-AI-CBCT/\n- ├── datasets/ # CBCT datasets\n- │ └── your_dataset_name/\n\
  - │ ├── testA/ # Low-dose CBCT images (.jpg)\n- │ └── testB/ # High-dose CBCT images (.jpg)\n- ├── scripts/\n\
  - │ └── test_cyclegan.sh # Inference script\n- ├── models/ # Model definitions\n- ├── training/ # Training\
  \ scripts\n- ├── checkpoint/ # pre-trained models\n- ├── utils/ # Utility functions\n- ├── options/\
  \ # Configuration options\n- └── results/ # Generated results\n## Environment Requirements\n\n## Base\
  \ environment\n- pip install torch torchvision torchaudio\n- pip install numpy scipy matplotlib pillow\n\
  - pip install opencv-python scikit-image\n- pip install nibabel  # For medical image processing\n- pip\
  \ install tensorboard\n\n## Or install from requirements.txt\n- pip install -r requirements.txt\n\n\n\
  ## Quick Start\n1. Prepare Test Data\n- Create directory structure\n  mkdir -p ./datasets/your_dataset_name/testA\
  \  # Low-dose CBCT\n\n2. Save your test data as JPG format in:\n- ./datasets/your_dataset_name/testA/\
  \  # Low-dose images (.jpg)\n\n3. Run Inference\n- Modify test_cyclegan.sh with your dataset name and\
  \ model name\n- Change: --dataroot ./datasets/your_dataset_name --name Axial_Low_High_CBCT\n\n4. Execute\
  \ inference\n- bash ./scripts/test_cyclegan.sh\n\n## Citation\nIf this project helps your research,\
  \ please cite:\n@article{yourpaper2024,\n  title={Impact of generative AI-enhanced low-dose CBCT on\
  \ diagnosis and treatment planning for impacted mandibular third molars},\n  author={Zhang, Rongli and\
  \ et al.},\n  journal={To be published},\n  year={2025}\n}\n\n## License and Acknowledgement\nThanks\
  \ for the project of  [pytorch-CycleGAN-and-pix2pix](https://github.com/junyanz/pytorch-CycleGAN-and-pix2pix).\
  \ \n"

readme_excerpt: "# HMP-Net: Hierarchical Multi-Prior Network for Brain Tumor Segmentation\n\n## \U0001F6E0\
  \ Server setup — PyTorch 2.3.0 + CUDA 12.1 on an NVIDIA RTX PRO 6000\n\n> The RTX PRO 6000 is a **Blackwell-architecture\
  \ (sm_120)** workstation GPU\n> that ships *after* PyTorch 2.3.0 / CUDA 12.1 went stable. Out of the\
  \ box,\n> the official PyTorch 2.3.0 wheels are compiled only up to `sm_90` (Hopper);\n> to run them\
  \ on Blackwell we let the driver **JIT-compile from the PTX\n> intermediate** that the wheels also embed\
  \ (a one-time ~30 s warm-up the\n> first time the kernels are launched). The steps below give a clean\n\
  > reproducible install. Run every command as `root` (or with `sudo`); the\n> server layout is the standard\
  \ one we used in the paper (`/root/codes/`,\n> `/root/autodl-tmp/2021/`, `/root/autodl-tmp/2018/`).\n\
  \n### 1.  NVIDIA driver (≥ 565 is required for sm_120 PTX-JIT)\n\n```bash\n# Ubuntu 22.04 / 24.04 LTS\n\
  sudo apt-get update\nsudo apt-get install -y build-essential dkms linux-headers-$(uname -r)\n\n# NVIDIA's\
  \ official .run installer (driver 565.57.01 or newer)\nwget https://us.download.nvidia.com/XFree86/Linux-x86_64/565.57.01/NVIDIA-Linux-x86_64-565.57.01.run\n\
  sudo bash NVIDIA-Linux-x86_64-565.57.01.run --silent --dkms\n\n# verify\nnvidia-smi      # should list\
  \ \"NVIDIA RTX PRO 6000\" and driver 565.57.01+\n```\n\n### 2.  CUDA 12.1 toolkit (matches the PyTorch\
  \ 2.3.0 wheel)\n\n```bash\nwget https://developer.download.nvidia.com/compute/cuda/12.1.1/local_installers/cuda_12.1.1_530.30.02_linux.run\n\
  sudo bash cuda_12.1.1_530.30.02_linux.run \\\n     --silent --toolkit --no-opengl-libs --override  \
  \   # skip the bundled (older) driver\n\n# add to PATH (append to /root/.bashrc)\nexport CUDA_HOME=/usr/local/cuda-12.1\n\
  export PATH=$CUDA_HOME/bin:$PATH\nexport LD_LIBRARY_PATH=$CUDA_HOME/lib64:$LD_LIBRARY_PATH\n\nnvcc --version\
  \  # should report release 12.1\n```\n\n### 3.  cuDNN 8.9.x for CUDA 12 (matches PyTorch 2.3.0 wheel\
  \ binding)\n\n```bash\n# Download cudnn-linux-x86_64-8.9.7.29_cuda12-archive.tar.xz from\n# https://developer.nvidia.com/rdp/cudnn-archive\
  \ (NGC login required)\ntar -xJf cudnn-linux-x86_64-8.9.7.29_cuda12-archive.tar.xz\nsudo cp cudnn-*/include/cudnn*.h\
  \          /usr/local/cuda-12.1/include\nsudo cp cudnn-*/lib/libcudnn*             /usr/local/cuda-12.1/lib64\n\
  sudo chmod a+r /usr/local/cuda-12.1/include/cudnn*.h /usr/local/cuda-12.1/lib64/libcudnn*\n```\n\n###\
  \ 4.  Python 3.12 + a clean conda env\n\n```bash\n# Miniforge / Miniconda is fine; example with Miniforge\n\
  wget https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh\n\
  bash Miniforge3-Linux-x86_64.sh -b -p /root/miniforge3\nsource /root/miniforge3/etc/profile.d/conda.sh\n\
  \nconda create -n hmpnet python=3.12 -y\nconda activate hmpnet\n```\n\n### 5.  PyTorch 2.3.0 with the\
  \ cu121 wheel + project deps\n\n```bash\npip install --upgrade pip wheel\n\n# PyTorch 2.3.0 official\
  \ wheel for CUDA 12.1\npip install torch==2.3.0 torchvision==0.18.0 torchaudio==2.3.0 \\\n         \
  \   --index-url https://download.pytorch.org/whl/cu121\n\n# Medical-imaging / augmentation stack used\
  \ in the paper\npip install nibabel SimpleITK==2.3.1 scipy==1.13.0 numpy==1.26.4 \\\n            torchio==0.19.6\
  \ tqdm pyyaml openpyxl pandas einops\n\n# Optional but very useful for FLOPs / model summary\npip install\
  \ thop ptflops fvcore\n```\n\n### 6.  Tell PyTorch to PTX-JIT for Blackwell (sm_120)\n\nThe shipped\
  \ wheel knows compute capabilities up to `9.0` (Hopper). Add the\nfollowing to `/root/.bashrc` (or the\
  \ launch script) so the runtime emits a\nforward-compatible PTX path that the 565 driver JITs to sm_120\
  \ on first use.\n\n```bash\nexport TORCH_CUDA_ARCH_LIST=\"9.0+PTX\"\nexport CUDA_DEVICE_MAX_CONNECTIONS=1\
  \        # avoids occasional Blackwell deadlocks\nexport NVIDIA_TF32_OVERRIDE=1               # TF32\
  \ enabled on Ampere/Hopper paths\n```\n\nThe very first CUDA kernel launch will print a one-time\n`ptxas:\
  \ PTX assembly via JIT for sm_120 …` message that takes ~30 seconds;\nsubsequent launches are cached\
  \ at full speed (~1.0× of native sm_120).\n\n### 7.  Sanity check\n\n```python\npython - <<'PY'\nimport\
  \ torch\nprint(\"torch         :\", torch.__version__)\nprint(\"cuda compiled :\", torch.version.cuda)\n\
  print(\"cuda runtime  :\", torch.cuda.is_available())\nprint(\"device 0      :\", torch.cuda.get_device_name(0))\n\
  print(\"capability    :\", torch.cuda.get_device_capability(0))   # → (12, 0) on Blackwell\nprint(\"\
  cuDNN         :\", torch.backends.cudnn.version())\nx = torch.randn(2, 4, 128, 128, 128, device='cuda')\n\
  print(\"alloc 256 MiB :\", torch.cuda.memory_allocated()/1e6, \"MiB\")\nprint(\"kernel test   :\", (x\
  \ * 2 + 1).sum().item())\nPY\n```\n\nExpected output:\n\n```\ntorch         : 2.3.0+cu121\ncuda compiled\
  \ : 12.1\ncuda runtime  : True\ndevice 0      : NVIDIA RTX PRO 6000\ncapability    : (12, 0)\ncuDNN\
  \         : 8907\nalloc 256 MiB : 268.4 MiB\nkernel test   : <some float close to 0>\n```\n\nIf `capability`\
  \ returns `(12, 0)` and the kernel-test line prints a number,\nthe stack is ready. Run a 1-epoch smoke\
  \ check before kicking off the real\n400-epoch training:\n\n```bash\ncd /root/codes\npython train.py\
  \ --data_dir /root/autodl-tmp/2021 --epochs 1 --batch_size 2\n```\n\nIf the smoke check finishes without\
  \ OOM (peak HBM should stay around\n29 GB at `batch_size=2`, `crop=128³`), you are good to launch the\
  \ full job:\n\n```bash\npython train.py \\\n    --data_dir /root/autodl-tmp/2021 \\\n    --save_ckpt\
  \ checkpoints/hmpnet_brats2021_best.pth \\\n    --epochs 400 --batch_size 2 \\\n    --lr 1e-4 --weight_decay\
  \ 1e-4 \\\n    --lambda_focal 1.0 --lambda_phys 0.1 --lambda_topo 0.1 --lambda_dyn 0.1\n```\n\nAnd likewise\
  \ on BraTS 2018:\n\n```bash\npython train.py \\\n    --data_dir /root/autodl-tmp/2018 \\\n    --save_ckpt\
  \ checkpoints/hmpnet_brats2018_best.pth \\\n    --epochs 400 --batch_size 2 \\\n    --lr 1e-4 --weight_decay\
  \ 1e-4\n```\n\n---\n\n> ## Erratum — corrections to Table 4 and Table 5\n>\n> Due to author negligence\
  \ while collating the spreadsheet rows into the\n> camera-ready manuscript, **part of the data in Table\
  \ 4 (Cross-dataset\n> Generalisation) and Table 5 (FullGrad explainability metrics) of the\n> published\
  \ paper carry incorrect last-two-decimal values** when rounded to\n> two decimal places. The training\
  \ and evaluation pipelines themselves are\n> unaffected — only the typeset numbers in the two tables.\
  \ All errors are\n> confined to the last decimal of the percent-scale values, so each individual\n>\
  \ deviation is below 0.5%, which does not affect the main conclusions of the\n> paper.\n>\n> To make\
  \ our results fully verifiable, we have:\n>\n> 1. **Released the complete experimental logs** with second-level\
  \ timestamps\n>    (`stdout.log`, `metrics.csv`, `metrics.jsonl` per run; per-epoch records\n>    pinned\
  \ to the best epoch within the early-stopping patience window).\n> 2. **Released the trained model weights**\
  \ for both BraTS 2018 and BraTS\n>    2021 (`hmpnet_2018.pth`, `hmpnet_2021.pth`).  We have placed them\
  \ in a\n>    single `weights/` directory and uploaded that directory to Baidu Netdisk\n>    instead\
  \ of bundling them in this repository:\n>\n>    > **weights**\n>    > link: https://pan.baidu.com/s/1OQ6SOjZ7C64yjZsB9B5QFQ?pwd=p24r\n\
  >    > password code: **p24r**\n>\n>    Download the folder, drop it next to `codes/` (i.e. at the repository\n\
  >    root) and the `--checkpoint weights/hmpnet_{2018,2021}.pth`\n>    commands in the *Inference* section\
  \ will work out of the box.  The\n>    file modification timestamps inside the archive are pinned to\
  \ the\n>    moment each best epoch was saved during training\n>    (`2025-09-13 03:13:13` for BraTS\
  \ 2018 epoch 349;\n>    `2025-11-04 00:14:16` for BraTS 2021 epoch 345), so a reader can\n>    cross-reference\
  \ them against the corresponding `stdout.log` lines.\n>\n> The **corrected** Table 4 and Table 5 follow\

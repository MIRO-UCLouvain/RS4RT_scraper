readme_excerpt: "# monaco-to-proknow-scorecard\nConvert Monaco DVH criteria (isodosesettings.xml) into\
  \ a ProKnow Scorecard Template (JSON)  \nThis program is useful if you need to quickly create a scorecard\
  \ that exactly matches your Monaco Dosimetric Criteria.  \n\nThe isodosesettings.xml file is stored\
  \ on the Monaco file system under the patient plan:  \ne.g. \\path-to-your-clinic\\PATIENT_ID\\plan\\\
  PLAN_NAME\\isodosesettings.xml  \n\nThis script will extract the relevant data and convert it into a\
  \ JSON file that can be read by ProKnow.   \n\n<img width=\"676\" height=\"685\" alt=\"image\" src=\"\
  https://github.com/user-attachments/assets/174c16a3-3740-4ab3-a70b-da4555f9ab5c\" />  \n\nTo run this\
  \ script:  \n1. Edit the config.ini file with the path to your Monaco installation folder.  \n2. Run\
  \ the Python script which will bring up the GUI.   \n3. If the installation folder in the config file\
  \ is correct, the available clinic names will appear in the drop down.  \n4. Select the patient and\
  \ plan, and generate the json file.  \n5. In ProKnow, create a scorecard on the patient with no template.\
  \ Upload the json file into it.  \n    \n\nNOTES:  \n- Compatible with Monaco versions 5 and 6.  \n\
  - WIP for Eclipse compatibility.  \n- The maximum precision for volumes in ProKnow is 0.01cc. So 0.035cc\
  \ will be rounded to 0.04cc.  \n- Proknow uses a different algorithm to calculate dose/volumes, the\
  \ computed metrics may be slighlty different despite the objectives being exactly the same. I've never\
  \ seen this take a result from pass to fail, but it's possible.  \n\n\nTypes available:  \n\"Monaco\"\
  \ : \"ProKnow\"  \n\"1\": \"MIN_DOSE_ROI\",  \n\"2\": \"MAX_DOSE_ROI\",  \n\"3\": \"MEAN_DOSE_ROI\"\
  , #min   \n\"4\": \"MEAN_DOSE_ROI\", # max  \n\"5\": \"DOSE_VOLUME_PERCENT_ROI\",  \n\"6\": \"DOSE_VOLUME_CC_ROI\"\
  ,  \n\"7\": \"DOSE_VOLUME_PERCENT_ROI\",  \n\"8\": \"DOSE_VOLUME_CC_ROI\",  \n\"9\": \"VOLUME_PERCENT_DOSE_ROI\"\
  ,  \n\"10\": \"VOLUME_CC_DOSE_ROI\",  \n\"11\": \"VOLUME_PERCENT_DOSE_ROI\",  \n\"12\": \"VOLUME_CC_DOSE_ROI\"\
  ,  \n\"13\": \"INHOMOGENEITY_INDEX\",  \n\"14\": \"CONFORMALITY_INDEX\"  \n                \n"

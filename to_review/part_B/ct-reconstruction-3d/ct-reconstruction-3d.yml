readme_excerpt: "# 3D Cone Beam Computed Tomography (CBCT) Reconstruction\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/drive/1yMaL2ncDc1oZ0aMXkispxZCXotWLNgaf?usp=sharing)\n\
  \nReconstruct object's attenuation constant data from projections captured by the detector.\n\nThis\
  \ code has been written for cone beam based geometry.\nCone beam CT is a more recent development which\
  \ emits a \"cone type\" X-ray and is detected by a flat panel sensor.\n\n<img alt=\"diagram of a typical\
  \ cone beam setup for 3D situation\" height=\"350\" src=\"https://media.aofoundation.org/-/jssmedia/surgery/9x/9x_x001_i120.png\"\
  />\n\n## Mathematical statement\n\nThe problem is expressed mathematically as: A λ = d\n\nA is the intercept\
  \ matrix containing lengths of X-ray intercepts on each voxel within the object.\nλ is the attenuation\
  \ coefficient data for each voxel, which is the desired output.\nd is the sinogram, calculated as -\n\
  \n$$d=\\ln(\\frac{I_o}{I})$$\n\nwhere,\n\n- $I_o$ is the intensity of the X-ray source.\n- $I$ is the\
  \ intensity observed by the detectors.\n\n## Methodology\n\nUsually, the FDK algorithm is used to reconstruct\
  \ the volume directly without calculating the intercept matrix A. \n\nHowever, this project aims to\
  \ calculate and study the intercept matrix specifically. A 3 dimension version of Siddon's method is\
  \ used to calculate it. The volume can be reconstructed by computing $A^{-1} d$.\n\nAs the matrix is\
  \ large and sparse, it is impossible to find its inverse simply. Therefore, we study ways to create\
  \ a more dense matrix and to efficiently approximate $A^{-1} d$. One nice method is to use pseudoinverse.\n\
  \n## Fan Beam CT Reconstruction (2D)\n\n<img alt=\"Fan Beam (Top) versus Cone Beam (Bottom) Tomography\"\
  \ height=\"250\" src=\"/assets/fan_beam_vs_cone_beam.jpg\"/>\n\nThe top is fan beam configuration for\
  \ 2D image. The figure shows how it differs from the cone beam geometry (bottom) used in this repo.\
  \ The code for 2D reconstruction is [here](https://github.com/aakashks/CT-Reconstruction-2D/blob/main/).\n\
  \n## Results\n\nGenerated projection (forward problem) for 1 rotation. [results for more rotations](results/generated_vs_projections/)\n\
  \n<img alt=\"Reconstructed projection vs the collected projection data\" height=\"350\" src=\"results/generated_vs_projections/rot1.png\"\
  />\n\nThese results assure the correctness of the generated intercept matrix (A).\n\nThe current code\
  \ can generate the 50 rows of the whole matrix, ie. for 50 rotations of the object in less than 7 hours\
  \ on a single NVIDIA P100 GPU with 16 GB RAM for 200x200 resolution.\n\n## References\n\n1. The data\
  \ has been collected from experiments conducted at DDIL, IIT Roorkee\n2. G. Aldica, Ion Tiseanu, Petre\
  \ Badica, & Rindfleisch, M. (2010, August 18). X-ray Micro-Tomography as a New and Powerful Tool for\
  \ Characterization of MgB2 Superconductor. ResearchGate\n3. Cone beam vs. fan beam CT. (2023). [Aofoundation.org](https://surgeryreference.aofoundation.org/cmf/further-reading/cas-cone-beam-vs-fan-beam-ct#introduction)\n\
  4. [Siddon's Algorithm](https://stackoverflow.com/questions/3609382/calculating-the-length-of-intersections-through-a-2d-grid)\n"

readme_excerpt: "# Radiomics-Based-Machine-Learning-Cancer-Immunotherapy\nRadiomics-Based Machine Learning\
  \ to Evaluate Immunotherapy Efficacy in Non-Small Cell Lung Cancer NSCLC Patients with Bone Metastases\
  \ \n\n# Abstract\nPurpose: Assessing treatment response in bone metastases from non–small cell lung\
  \ cancer (NSCLC) remains a major clinical challenge, particularly for patients receiving immune checkpoint\
  \ inhibitors (ICIs). Existing response criteria are not optimized for osseous disease, leading to inconsistent\
  \ evaluation. This study aimed to develop and validate a radiomics-based machine learning (ML) framework\
  \ to non-invasively distinguish immunotherapy response categories—progression, stable disease, and partial\
  \ response—in NSCLC patients with bone metastases.\nApproach: Chest CT scans from 99 NSCLC patients\
  \ were analyzed before and during ICI therapy. Bone structures were automatically segmented using TotalSegmentator,\
  \ and 1051 radiomic features were extracted per timepoint. Clinical variables were incorporated as optional\
  \ features. Three ML classifiers—Random Forest, XGBoost, and Support Vector Machine—were trained using\
  \ 5-fold cross-validation. A multistep feature selection pipeline (correlation filtering, mutual information,\
  \ recursive feature elimination, and ReliefF ranking) was applied. Model performance was evaluated using\
  \ AUC, F1-score, accuracy, sensitivity, and specificity, with additional statistical testing using Kruskal–Wallis,\
  \ Mann–Whitney U, bootstrapping, and permutation analysis.\nResults: Inter-rater agreement for radiological\
  \ response categories was high (Cohen’s kappa = 0.91). Post-treatment radiomic features yielded the\
  \ best performance. The Random Forest model achieved an AUC of 0.94, F1-score of 0.79, accuracy of 0.79,\
  \ sensitivity of 0.80, and specificity of 0.83. Clinical features did not meaningfully improve performance.\
  \ Models based on the largest lesion showed lower accuracy than those using the overall response.\n\
  Conclusions: Post-treatment CT radiomics captured therapy-induced skeletal changes and enabled differentiation\
  \ of immunotherapy response categories in NSCLC bone metastases. These findings highlight radiomics\
  \ as a non-invasive tool for response assessment and guiding personalized treatment strategies.\n\n\n\

readme_excerpt: "# attention-unet-tumor-detection\n\n## Project Overview\nThis repository implements a\
  \ 3D medical image segmentation pipeline for liver and tumor detection using attention-based U-Net architectures.\
  \ The work focuses on volumetric segmentation of CT scan data and includes preprocessing, data augmentation,\
  \ model training, evaluation, and visualization.\n\n## Dataset and Data Collection\n- Data collection\
  \ was from Kaggle.\n- The dataset used in this project is the LiTS (Liver Tumor Segmentation) dataset,\
  \ sourced from Kaggle.\n- The notebook pipeline loads NIfTI (`.nii`) image volumes and corresponding\
  \ segmentation masks.\n- Raw dataset files are not included in this repository due to size and licensing,\
  \ so download the dataset locally before running the notebooks.\n\n## Notebooks\n- `Datacleaning.ipynb`:\
  \ Data preprocessing and patch extraction.\n  - Loads CT volumes and segmentation masks.\n  - Clips\
  \ Hounsfield units, normalizes intensity, removes empty slices, and extracts 3D patches.\n- `UNet.ipynb`:\
  \ Baseline 3D U-Net implementation.\n  - Builds a 3D U-Net network in PyTorch.\n  - Trains and evaluates\
  \ the model on liver and tumor segmentation.\n- `AttentionU_net.ipynb`: 3D Attention U-Net implementation.\n\
  \  - Adds attention gates for improved focus on relevant regions.\n  - Trains and evaluates the attention-based\
  \ model.\n\n## Key Features\n- 3D volumetric segmentation using PyTorch.\n- Attention gating for liver\
  \ and tumor segmentation.\n- Data augmentation with flips, rotations, intensity scaling, noise, and\
  \ gamma adjustment.\n- Evaluation metrics including Dice score and IoU score.\n- Post-processing to\
  \ remove small false-positive predictions.\n\n## Repository Structure\n- `AttentionU_net.ipynb`: Main\
  \ attention U-Net training and evaluation.\n- `UNet.ipynb`: Baseline U-Net training and evaluation.\n\
  - `Datacleaning.ipynb`: Preprocessing and data preparation.\n- `.venv/`: Local Python environment (should\
  \ be excluded from GitHub).\n\n## Installation\n1. Create a Python virtual environment:\n   ```bash\n\
  \   python -m venv .venv\n   .\\.venv\\Scripts\\Activate.ps1\n   ```\n2. Install dependencies:\n   ```bash\n\
  \   pip install -r requirements.txt\n   ```\n3. If you have a GPU, install a CUDA-compatible version\
  \ of PyTorch.\n\n## How to Use\n1. Download the LiTS dataset from Kaggle and place it in a local folder.\n\
  2. Update the dataset paths in the notebooks, for example:\n   - `image_dir`\n   - `mask_dir`\n3. Run\
  \ `Datacleaning.ipynb` first to generate training patches.\n4. Run `UNet.ipynb` or `AttentionU_net.ipynb`\
  \ to train and evaluate the models.\n\n## Notes\n- Keep medical image data and large `.nii` files out\
  \ of version control.\n- This project is notebook-based and designed for experimentation.\n- Rename\
  \ or reorganize notebooks into Python scripts if you want a production-ready codebase.\n"

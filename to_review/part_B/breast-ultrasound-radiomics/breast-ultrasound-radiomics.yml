  \ MIT\">\n  <img src=\"https://img.shields.io/badge/GPU-XGBoost%20Accel.-orange.svg\" alt=\"GPU XGBoost\"\
  >\n</p>\n\n# Breast Ultrasound Radiomics · 乳腺超声影像组学\n\n> **Multimodal Doppler + Grayscale Analysis /\
  \ 多模态多普勒 + 灰阶分析**\n\n> **Code for:** *Multimodal Ultrasound Radiomics for Early Breast Cancer: Peritumoral\
  \ Scale Optimization and Quantitative Doppler Feature Analysis in 546 ≤2 cm Breast Lesions*\n>\n> **配套代码：**\
  \ *多模态超声影像组学用于早期乳腺癌：546 例 ≤2cm 乳腺病灶的瘤周尺度优化与定量多普勒特征分析*\n\n---\n\n## \U0001F4CB Table of Contents · 目录\n\
  \n- [Key Method / 核心方法](#-key-method)\n- [Requirements / 环境要求](#-requirements)\n- [Installation / 安装](#-installation)\n\
  - [Usage / 使用](#-usage)\n- [File Overview / 文件概述](#-file-overview)\n- [Pipeline Architecture / 流水线架构](#-pipeline-architecture)\n\
  - [Citation / 引用](#-citation)\n\n---\n\n## \U0001F9EC Key Method · 核心方法\n\nThis repository provides\
  \ a complete **five-stage nested feature selection pipeline** for multimodal ultrasound radiomics analysis.\
  \ It integrates grayscale radiomic features with quantitative Doppler features (VFA, Energy, GrayLevelNonUniformity)\
  \ at optimal peritumoral scales, validated across 546 small breast lesions (≤2 cm).\n\n本仓库提供了一个完整的**五阶段嵌套特征选择流水线**，用于多模态超声影像组学分析。它将灰阶影像组学特征与定量多普勒特征（VFA、能量、灰度非均匀性）在最优瘤周尺度上整合，并在\
  \ 546 例小乳腺癌病灶（≤2cm）中验证。\n\n---\n\n## \U0001F4C1 File Overview · 文件概述\n\n| File 文件 | Purpose 用途 |\n|-----------|-------------|\n\
  | `final_update.py` | Final model training and evaluation / 最终模型训练与评估 |\n| `reproduce_paper.py` | Reproduce\
  \ paper results / 复现论文结果 |\n| `run_1mm_pipeline_optimized.py` | 1mm peritumoral pipeline with optimization\
  \ / 1mm 瘤周流水线（优化版） |\n| `validate_busi_standard.py` | Validation on BUSI standard dataset / 在 BUSI 标准数据集上验证\
  \ |\n| `validate_pipeline.py` | Pipeline validation utilities / 流水线验证工具 |\n| `supplementary_analyses.py`\
  \ | Supplementary experiments / 补充实验分析 |\n| `pr_youden_analysis.py` | PR curve and Youden index analysis\
  \ / PR 曲线与 Youden 指数分析 |\n| `modify_draft.py` | Draft modification utilities / 草稿修改工具 |\n\n---\n\n##\
  \ \U0001F52C Pipeline Architecture · 流水线架构\n\n### Five-Stage Nested Feature Selection · 五阶段嵌套特征选择\n\n\
  ```\nStage 1: Feature Extraction / 特征提取\n  → Grayscale radiomics (shape, texture, wavelet)\n  → Quantitative\
  \ Doppler (VFA, Energy, GLNU)\n\nStage 2: Peritumoral Scale Optimization / 瘤周尺度优化\n  → 1mm / 3mm / 5mm\
  \ / 7mm / 9mm rings\n  → Select optimal scale via cross-validation\n\nStage 3: Feature Reduction / 特征降维\n\
  \  → Variance threshold → Correlation analysis → mRMR\n\nStage 4: Model Selection / 模型选择\n  → Logistic\
  \ Regression / SVM / Random Forest / XGBoost\n  → 5-fold cross-validation with AUC scoring\n\nStage\
  \ 5: Validation / 验证\n  → Internal validation → External BUSI validation\n```\n\n---\n\n## ⚙️ Requirements\
  \ · 环境要求\n\n- Python 3.9+\n- PyRadiomics\n- XGBoost (GPU acceleration recommended / 推荐 GPU 加速)\n- scikit-learn,\
  \ pandas, numpy\n- matplotlib, seaborn\n\n---\n\n## \U0001F4E6 Installation · 安装\n\n\\`\\`\\`bash\n\
  git clone https://github.com/QWQZhangErHao/breast-ultrasound-radiomics.git\ncd breast-ultrasound-radiomics\n\
  pip install -r requirements.txt\n\\`\\`\\`\n\n---\n\n## \U0001F4C4 Citation · 引用\n\nIf you use this\
  \ code in your research, please cite the associated paper.\n\n如果您在研究中使用此代码，请引用相关论文。\n\n---\n\n## \U0001F4C4\

readme_excerpt: "# RSI-Radiomics: Multi-centre CT Radiomics for Renal Sinus Invasion Prediction\n\nThis\
  \ repository contains the source code accompanying the manuscript:\n\n> **Multi-Centre CT Radiomics\
  \ for Preoperative Prediction of Renal Sinus Invasion in Clear Cell Renal Cell Carcinoma: A Bootstrap-Stabilised\
  \ Elastic Net and Graph Neural Network Approach with Radiogenomic Validation**  \n> Ye Yan†, Chao Liang†,\
  \ Peichen Duan†, Yichang Hao†, Yunhe Guan, Haibin Zhu*, Pengfei Shao*, Shudong Zhang*  \n> *eClinicalMedicine*\
  \ (under review)\n\n†Equal contribution. *Co-corresponding authors.\n\n---\n\n## Pipeline Overview\n\
  \nThe analysis pipeline is organised as sequential steps under `v2_pipeline/`:\n\n| Script | Description\
  \ |\n|--------|-------------|\n| `step1_merge_labels.py` | Merge RSI labels across four cohorts (PUTH,\
  \ JSPH-RN, PUCH, TCGA/CPTAC3) |\n| `step2_batch_effect.py` | Inter-scanner batch effect assessment and\
  \ z-score normalisation |\n| `step3_stability.py` | Bootstrap stability selection (200 iterations, threshold\
  \ ≥ 0.50) |\n| `step3_feature_selection.py` | Final 29-feature selection and coefficient extraction\
  \ |\n| `step4_gnn_train.py` | GraphSAGE graph neural network training (k=5 KNN graph) |\n| `step4_gnn_stability.py`\
  \ | GNN stability analysis across bootstrap seeds |\n| `step5_dca_delong.py` | DeLong AUC comparison\
  \ and Decision Curve Analysis |\n| `step5b_sensitivity.py` | Sensitivity / specificity analysis and\
  \ calibration |\n| `step6_shap.py` | SHAP LinearExplainer feature attribution (all four cohorts) |\n\
  | `step6b_shap_supplement.py` | Sphericity quartile stratification and waterfall plots |\n| `step7_radiogenomics_v2.py`\
  \ | GSEA (Hallmark), ssGSEA pathway correlation, genome-wide gene correlation |\n| `step7b_radiogenomics_heatmap.py`\
  \ | Radiomic–transcriptomic heatmap visualisation |\n\n## Requirements\n\n```bash\npip install -r requirements.txt\n\
  ```\n\nTested on Python 3.10. nnU-Net v2 must be installed separately following the [official instructions](https://github.com/MIC-DKFZ/nnUNet).\n\
  \n## Data Availability\n\nClinical and imaging data are available upon reasonable request to the corresponding\
  \ author (S. Zhang; shudong_zhang_PUTH@outlook.com). Public TCGA-KIRC and CPTAC-3 data are freely available\
  \ at [The Cancer Imaging Archive](https://www.cancerimagingarchive.net).\n\n## Citation\n\nIf you use\
  \ this code, please cite:\n\n```\n[Citation to be added upon acceptance]\n```\n\n## Licence\n\nMIT Licence\
  \ — see [LICENSE](LICENSE) for details.\n"

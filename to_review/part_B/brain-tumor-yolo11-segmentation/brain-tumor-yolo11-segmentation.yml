readme_excerpt: "# Brain Tumor Segmentation with YOLO11\n\nThis project uses a fine-tuned Ultralytics\
  \ YOLO11 segmentation model to detect and segment brain tumor regions in medical images.\n\n## Project\
  \ Overview\n\nThe Jupyter Notebook covers the complete computer-vision workflow:\n\n- Preparing a custom\
  \ brain tumor dataset\n- Loading a pretrained YOLO11 segmentation model\n- Fine-tuning the model on\
  \ the custom dataset\n- Validating the trained model\n- Running predictions on unseen images\n- Visualizing\
  \ the segmented tumor regions\n\n## Repository Structure\n\n| File | Description |\n| --- | --- |\n\
  | `BrainTumor_YOLO11_Segmentation_Assignment.ipynb` | Complete training, evaluation, and inference workflow\
  \ |\n| `.gitignore` | Excludes datasets, environments, weights, and generated training files |\n| `README.md`\
  \ | Project documentation |\n\n## Requirements\n\n- Python 3.10 or later\n- Jupyter Notebook\n- Ultralytics\n\
  - OpenCV\n- Matplotlib\n\nInstall the main dependencies:\n\n```bash\npip install ultralytics opencv-python\
  \ matplotlib jupyter\n```\n\n## How to Run\n\n1. Clone the repository:\n\n   ```bash\n   git clone https://github.com/mazokka/brain-tumor-yolo11-segmentation.git\n\
  \   ```\n\n2. Open the project folder:\n\n   ```bash\n   cd brain-tumor-yolo11-segmentation\n   ```\n\
  \n3. Start Jupyter Notebook:\n\n   ```bash\n   jupyter notebook\n   ```\n\n4. Open `BrainTumor_YOLO11_Segmentation_Assignment.ipynb`,\
  \ update the dataset paths if necessary, and run the cells in order.\n\n## Dataset\n\nThe dataset is\
  \ not included because of its size. It must be prepared in YOLO segmentation format before training.\n\
  \n## Model and Training Outputs\n\nPretrained weights, fine-tuned weights, datasets, the virtual environment,\
  \ and generated training outputs are excluded to keep the repository lightweight. Ultralytics can download\
  \ the required pretrained YOLO11 weights automatically when the notebook runs.\n\n## Technologies\n\n\
  Python · YOLO11 · Ultralytics · Computer Vision · Deep Learning · Image Segmentation · Jupyter Notebook\n"

  ## 💡 Why This Problem Matters


  Proton therapy treats cancer by delivering a tightly focused beam of protons that deposits **most of
  its energy at a precise depth** — the Bragg peak — then stops. This makes it far more tissue-sparing
  than X-ray radiotherapy, particularly for paediatric tumours and brain cancers near critical structures.


  But this precision is also its vulnerability.


  > **A dose deviation of just 2% or 2 mm can mean the difference between tumour control and treatment
  failure — or between sparing an optic nerve and causing blindness.**


  Current clinical practice verifies dose *offline*, after the patient has left the treatment room. This
  creates a 24-hour delay before errors are caught. For adaptive re-irradiation or FLASH proton therapy
  (ultra-high dose rates), this is clinically unacceptable.


  This project builds the ML backbone for a **real-time verification system** that:

  - Reads raw 2D scintillator detector signals frame-by-frame during beam delivery

  - Predicts the dose error in **<50 ms** per delivery window

  - Quantifies its own uncertainty and flags clinically significant deviations



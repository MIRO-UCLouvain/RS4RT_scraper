readme_excerpt: '# 🧠 Radiomics Feature Extraction (B3.2)


  This project demonstrates how to extract radiomic features from medical images using [PyRadiomics](https://pyradiomics.readthedocs.io/en/latest/).
  The script processes NIfTI images and segmentation labels (from the Medical Segmentation Decathlon)
  to extract features from both pancreas and lesion regions.


  ---


  ## 📂 Overview


  - ✅ Loads NIfTI image and label files using SimpleITK

  - ✅ Visualizes selected slices of the image and segmentation

  - ✅ Uses a YAML-based PyRadiomics configuration file

  - ✅ Extracts features from two labels (1 = pancreas, 2 = lesion)

  - ✅ Supports modifying PyRadiomics settings like bin width


  ---


  ## 📦 Requirements


  Install the necessary packages:


  ```bash

  pip install pyradiomics matplotlib numpy SimpleITK gdown

  '

readme_excerpt: "DISC: Dual-energy Image Synthesizer for Cone-beam CT\n==========\n\nDISC is an open-source\
  \ platform for quickly synthesizing, viewing, assessing, and optimizing dual-energy cone-beam CT (CBCT)\
  \ images.\nUsers can load CBCT image volumes for either conventional polychromatic scans or decomposed\
  \ basis material volumes.  DISC can compute,\nin near real time, several dual-energy based images from\
  \ these loaded images.\n\nImage types\n=========\nBlended : Blended images are computed by taking a\
  \ linear combination of the input low-energy and high-energy scans, which can be useful\nfor noise suppression\
  \ and contrast enhancement.  If this image type is selected, a slider controlling the blending ratio\
  \ is enabled so\nthe user can adjust the blending ratio manually.  Currently only constant blending\
  \ ratio is supported.\n\nVirtual Monoenergetic (VM) : Virtual monoenergetic images (VMIs) depict an\
  \ object as if it were imaged using a single, well-defined photon\nenergy instead of a polychromatic\
  \ x-ray spectrum produced by a conventional x-ray source.  VMIs can provide images at energies lower\
  \ than \ncould typically be obtained using physical x-ray tubes due to photon starvation, which can\
  \ provide enhancement in image contrast.  VMIs\nalso can suppress artifacts due to beam hardening, removing\
  \ the need for spectrum correction during scan preprocessing.  If this image \ntype is selected, a slider\
  \ controlling the energy of the VMI, ranging from 20 to 150 keV in 1 keV increments, is enabled so the\
  \ user can \nadjust the VMI energy manually.  The optimize dropdown is also enabled so the user can\
  \ automatically determine and display the VMIs that \nbest display the desired behavior (contrast-to-noise\
  \ ratio (CNR), absolute contrast, and uniformity).\n\nImage Analysis\n============\nRegions of Interest\
  \ (ROIs) : Up to two ROIs can be drawn on a displayed image in several geometries, including circular,\
  \ rectangular, \npolygonal, and freehand.  Once and ROI is drawn, DISC automatically computes and displays\
  \ the average pixel value, standard deviation, and \nsignal-to-noise ratio (SNR) within the ROI.  If\
  \ two ROIs are drawn, DISC also displays the CNR between the two ROIs.  ROIs are automatically \nredrawn\
  \ when the image is changed, allowing for easy comparison between various image types.\n\nOptimize :\
  \ When viewing VMIs, several automated optimization procedures are enabled.  Each can be performed by\
  \ selecting the appropriate\noption from the dropdown and then pressing the optimize button.  Each will\
  \ take a few seconds to assess the image quality at each VMI energy\nand display the optimal image as\
  \ well as popping out a plot showing that metric as a function of VMI energy.\n\nMaximize CNR : If this\
  \ optimization procedure is selected, DISC will compute and display the VMI that maximizes the CNR computed\
  \ between two\nselected ROIs.  Two ROIs must be drawn in order to perform this optimization procedure.\n\
  \nMinimize Contrast : If this optimization procedure is selected, DISC will compute and display the\
  \ VMI that minimizes the absoluted contrast \nin pixel value between two selected ROIs.  Two ROIs must\
  \ be drawn in order to perform this optimization procedure.\n\nUniformity : This procedure is similar\
  \ to the Minimize Contrast option above, but is designed specifically to replicate the uniformity \n\
  assessment carried out on the Catphan 500/600 quality assurance phantoms.  5 circular ROIs are drawn\
  \ and the maximum deviation of each ROI \nfrom the average of all 5 ROIs is computed.  This procedure\
  \ will work best if the active slice of the image volume is of a uniform material, \nsuch as the uniformity\
  \ module of the Catphan phantom.\n"

readme_excerpt: "# DEnse Displacement Sampling - deformable image registration\n\nThis package provides\
  \ Python wrapper around [DEEDS](https://github.com/mattiaspaul/deedsBCV), an efficient version for 3D\
  \ discrete deformable image registration which is reaching the highest accuracy in several benchmarks\
  \ [[1]](https://pubmed.ncbi.nlm.nih.gov/27254856/)[[2]](https://arxiv.org/abs/2109.11572) and serves\
  \ as a good baseline for new solutions.\n\n## Referencing and citing\nIf you use this implementation\
  \ or parts of it please cite:\n \n>\"MRF-Based Deformable Registration and Ventilation Estimation of\
  \ Lung CT.\"\n by Mattias P. Heinrich, M. Jenkinson, M. Brady and J.A. Schnabel\n IEEE Transactions\
  \ on Medical Imaging 2013, Volume 32, Issue 7, July 2013, Pages 1239-1248\n http://dx.doi.org/10.1109/TMI.2013.2246577\n\
  \ \n and\n \n>\"Multi-modal Multi-Atlas Segmentation using Discrete Optimisation and Self-Similarities\"\
  \n by Mattias P. Heinrich, Oskar Maier and Heinz Handels\n VISCERAL Challenge@ ISBI, Pages 27-30 2015\n\
  \ http://ceur-ws.org/Vol-1390/visceralISBI15-4.pdf\n \n## Installation\n```\npip install git+https://github.com/wiktorowski211/deeds-registration\n\
  ```\n\n## Usage\n```\nfrom deeds import registration\nimport SimpleITK as sitk\n\nfixed = sitk.ReadImage(PATH)\n\
  moving = sitk.ReadImage(PATH)\n\nmoved = registration(fixed, moving)\n```\n\n## Prerequesities\nInput\
  \ images must:\n- have the same dimensions,\n- be a SimpleITK image object.\n\n## Development\nBuild:\n\
  ```\npython setup.py build_ext --inplace\n```\n\nTest:\n```\npython -m unittest \n```"

readme_excerpt: "# Tumor-Motion-Tracking\n# Tumor Motion Tracking (Simulation + Kalman Filter)\n\n## 1.\
  \ Overview\nThis project simulates tumor motion in synthetic 2D medical imaging data and tracks the\
  \ tumor across frames using **Kalman filtering**.  \nThe goal is to demonstrate how classical tracking\
  \ algorithms can be applied in a medical context, where accurate tumor localization is critical for\
  \ treatments such as **radiotherapy** and **motion-compensated imaging**.  \n\nWe implemented and compared\
  \ different tracking strategies, starting with optical flow (Lucas-Kanade), then moving to centroid-based\
  \ detection combined with **Kalman filtering** for robust performance.\n\n---\n\n## 2. Methods\n\n###\
  \ 1. **Synthetic Tumor Motion Simulation**\n- A sinusoidal-like tumor trajectory is generated (`tumor_simulation.m`).\
  \  \n  **Reason:** I modeled tumor motion as a sinusoidal trajectory along the x-axis to mimic respiratory-induced\
  \ displacement. Breathing motion is approximately periodic and can be well-approximated by a sinusoidal\
  \ function, making it both clinically relevant and mathematically convenient for synthetic tumor simulation.\n\
  \n- Ground truth trajectory is saved in `trajectory_truth.csv`.  \n- A sequence of frames (`frames.mat`)\
  \ is generated to mimic real imaging.\n\n### 2. **Tumor Tracking Approaches**\n#### (a) Lucas-Kanade\
  \ Optical Flow (Explored, not suitable)\n- Implemented with `LucasKanadeOpticalFlow.m` and `LucasKanadeStep.m`.\
  \  \n- Failed in this context due to:\n  - **Small object problem** → tumor is small compared to the\
  \ image, so Lucas-Kanade’s local intensity window is unreliable.  \n  - **Low contrast** → synthetic\
  \ tumor blob has uniform intensity; optical flow assumes rich texture/gradients.  \n  - **Biological\
  \ mismatch** → tumor motion is smooth and global (respiration-driven), but Lucas-Kanade is designed\
  \ for tracking *local texture displacements*.  \n- *Kept in repo for completeness, but not used in final\
  \ results.*\n\n#### (b) Centroid Detection\n- The tumor is segmented via simple intensity thresholding.\n\
  - The centroid of the largest detected region is extracted as the tumor’s position.\n- Works, but noisy\
  \ without filtering.\n\n#### (c) Kalman Filter (Final Method)\n- Two models were tested:\n  - **Constant-Velocity\
  \ Kalman Filter**\n  - **Constant-Acceleration Kalman Filter** (improved)  \n- The constant-acceleration\
  \ model gave the best alignment with ground truth.  \n\n---\n\n## 3. Results\n\n- **Trajectory plots:**\
  \  \n  - `Kalman_plot.fig` and `Klman_plot_1.fig` compare ground truth vs. Kalman filter prediction.\
  \  \n  - The constant-acceleration Kalman filter showed smooth, realistic tracking.\n\n- **Tracked data:**\
  \  \n  - `trajectory_tracked_kalman_accel.csv` stores the predicted trajectory.  \n\n- **Simulation\
  \ Video:**  \n  - `tumor_tracking_kalman_accel.avi`  \n  - Shows frame-by-frame tumor tracking with\
  \ a red marker.\n\n---\n\n## 4. Key Insights\n\n### Why Lucas-Kanade Did Not Work \n- Tumor motion in\
  \ lungs is a **global, periodic oscillation** (caused by respiration).  \n- Lucas-Kanade assumes **local\
  \ intensity variations** (edges, texture), which tumors often lack in medical imaging.  \n- As a result,\
  \ LK produced unstable or meaningless flow fields in this setting.  \n\n### Why Constant-Acceleration\
  \ Kalman Filter Works Better \n- Real tumor motion is not uniform velocity.  \n  - During respiration,\
  \ the tumor **slows near turning points** (end-inhale/exhale) and **accelerates in between**.  \n  -\
  \ This acceleration–deceleration pattern is central to breathing motion.  \n- A **constant-velocity\
  \ model** fails to capture this change in speed, leading to drift.  \n- A **constant-acceleration model**\
  \ mimics this **biologically realistic respiratory motion**, producing more accurate tracking.  \n\n\
  ---\n\n\n## 5. File Descriptions\n- **simulate_tumor.m** – Generates synthetic sinusoidal tumor motion\
  \ and saves:\n  - `frames.mat` (synthetic frames)\n  - `trajectory_truth.csv` (ground-truth trajectory)\n\
  \n- **track_tumor.m** – Runs Lucas–Kanade optical flow tumor tracking (baseline, exploratory).  \n \
  \ → Produces `trajectory_tracked.csv`.\n\n- **kalman_tumor_track.m** – First Kalman filter tracker implementation\
  \ (constant velocity assumption).  \n\n- **track_tumor_kalman_1.m** – Improved Kalman filter tracker\
  \ (constant acceleration, better biological fit).  \n  → Produces `trajectory_tracked_kalman_accel.csv`\
  \ and `tumor_tracking_kalman_accel.avi`.\n\n- **LucasKanadeOpticalFlow.m** – Implementation of Lucas–Kanade\
  \ optical flow algorithm.  \n- **LucasKanadeStep.m** – Helper step for Lucas–Kanade updates.  \n- **WarpImage.m**\
  \ – Utility for image warping in the optical flow pipeline.  \n\n- **trajectory_truth.csv** – Ground-truth\
  \ tumor trajectory (from simulation).  \n- **trajectory_tracked.csv** – Lucas–Kanade estimated trajectory.\
  \  \n- **trajectory_tracked_kalman_accel.csv** – Kalman filter (constant acceleration) estimated trajectory.\
  \  \n\n- **frames.mat** – MATLAB data file containing generated synthetic frames.  \n- **Kalman_plot.fig**\
  \ – MATLAB figure of Kalman vs truth (velocity model).  \n- **Klman_plot_1.fig** – MATLAB figure of\
  \ improved Kalman vs truth (acceleration model).  \n- **LK.fig** – MATLAB figure of Lucas–Kanade tracking\
  \ attempt.  \n- **tumor_tracking_kalman_accel.avi** – Video demo of Kalman tracking overlay.  \n\n##\
  \ 6. Future Work\n\n- Incorporating **Physics-Informed Neural Networks (PINNs)** to model tumor dynamics\
  \ more accurately.  \n- Extending from **2D synthetic motion** to **3D volumetric tumor tracking** (closer\
  \ to clinical imaging).  \n- Testing with **real patient respiratory motion data** to validate robustness.\
  \  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n"

readme_excerpt: 'The proposed model combines Tokens-to-Token Vision Transformer (T2T-ViT) and radiomics-driven
  spatial coding and feature clinically-relevant patch embeddings to improve the reflection of the heterogeneous
  lesion features. The framework successfully captures local texture patterns and global contextual dependencies
  in medical images by incorporating domain-specific radiomic features into the positional encoding process.
  The model is tested on the five benchmark datasets, such as CBIS-DDSM, INbreast, MIAS, BUSI, and BreakHis,
  that comprise both mammographic and histopathological modalities. Experimental results show better performance
  across all datasets, with a maximum accuracy of 99.82, an AUC of 0.999, and a recall of 99.83 on the
  CBIS-DDSM dataset; the F1-score, precision, and recall remain constant. The strength and generalization
  ability of the proposed approach compared to the current state-of-the-art methods have been confirmed
  through comparative analysis. The results demonstrate the potential of integrating clinically informed
  radiomics and transformer architectures to improve computer-aided diagnosis systems, enabling reliable
  and scalable breast cancer detection in clinical practice.

  '

readme_excerpt: "<p align=\"center\">\n  <img src=\"https://github.com/BirolLab/tAMPer/blob/master/imgs/logo.png\"\
  />\n</p>\n\n# Structure-aware deep learning model for peptides toxicity prediction\n\n## Table of Contents\n\
  \n- [About](#about)\n- [Files](#files)\n- [Installation](#installation)\n- [Dependencies](#dependencies)\n\
  - [Inputs](#inputs)\n- [Usage](#usage)\n- [Acknowledgement](#acknowledgement)\n- [Citation](#Citation)\n\
  \n## About\n\ntAMPer is a multi-modal deep learning model that predicts peptide toxicity by integrating\
  \ the underlying amino acid sequence composition and the predicted three-dimensional (3D) structure.\
  \ tAMPer adopts a graph-based representation for peptides, encoding their ColabFold-predicted structures.\
  \ The model extracts structural features using graph neural networks, and employs recurrent neural networks\
  \ to capture sequential dependencies. The self-attention mechanism is utilized to integrate features\
  \ from both modalities and weighs the contribution of each amino acid in predicting toxicity.\n\n<p\
  \ align=\"center\">\n  <img src=\"https://github.com/BirolLab/tAMPer/blob/master/imgs/tAMPer.png\" />\n\
  </p>\n\n## Files\n\nThe project contains the following files and directories:\n\n- `checkpoints/`: Directory\
  \ to store trained model checkpoints.\n- `data/`: Directory for storing datasets.\n- `logs/`: Directory\
  \ for storing log files.\n- `results/`: Directory for storing prediction results.\n- `src/GConvs.py`:\
  \ Implementation of graph convolutional layers.\n- `src/embeddings.py`: Generating amino acids embeddings.\n\
  - `src/aminoacids.py`: Amino acid-related utility functions.\n- `src/dataset.py`: Dataset loading and\
  \ preprocessing.\n- `src/peptideGraph.py`: Creating graph representations of peptides.\n- `src/predict_tAMPer.py`:\
  \ Script for making toxicity predictions on new data.\n- `src/tAMPer.py`: Main implementation of the\
  \ tAMPer model.\n- `src/train_tAMPer.py`: Training pipeline.\n- `src/utils.py`: General utility functions.\n\
  \n## Installation\n\n1. Clone this repository:\n\n   ```bash\n   git clone https://github.com/BirolLab/tAMPer.git\n\
  \   ```\n2. Navigate to the project directory:\n   ```bash\n   cd tAMPer\n   ```\n\n### Conda\n\n3.\
  \ Create a conda environment (optional but recommended):\n   ```bash\n   conda env create -f environment.yml\n\
  \   conda activate tAMPer\n   ```\n\n### Pip\n\n3. Create a python virtual environment (make sure python3\
  \ is available/loaded):\n   ```bash\n   pip install --upgrade pip # upgrade pip if necessary\n   pip\
  \ install virtualenv\n   virtualenv ENV_ADDRESS\n   source ENV_ADDRESS/bin/activate\n   pip install\
  \ -r requirements.txt\n   ```\n\n## Dependencies\n\n- [DSSP](https://ssbio.readthedocs.io/en/latest/instructions/dssp.html)\n\
  - python (>= 3.9)\n- [pytorch](https://pytorch.org/get-started/previous-versions/) (>= 1.13.1)\n- [torch-geometric](https://pytorch-geometric.readthedocs.io/en/latest/install/installation.html)\n\
  - torch-cluster\n- torch-scatter\n- [fair-esm](https://github.com/facebookresearch/esm) (>= 2.0.0)\n\
  - numpy\n- pandas\n- biopython\n- wandb (optional)\n- loguru\n\n\n## Inputs\n\nProvide the peptide sequences\
  \ in the FASTA format (.faa). If a peptide has C-terminal amidation, add `_AMD` at the end of the peptide\
  \ name.\n\n#### Example FASTA Format\n\n```plaintext\n>peptide_1\nMKALIKLPGNRVNGFGRIGR\n>peptide_2_AMD\n\
  ALWKTLLKKVLKAAA\n>peptide_3\nGRRPLLLRAR\n```\n\n### 3D structures\n\nProvide the directory where the\
  \ ouput of the ColabFold (`.result.zip` files) is stored. To run ColabFold, please refer to https://github.com/sokrypton/ColabFold.\
  \ The name of each file should match to its correspoding sequence in the fasta file. Also, add `zip_results`\
  \ by ticking its corresponding box which is located within the advanced settings section of AlphaFold2.\
  \  \n\nIf you are using localcolabfold (https://github.com/YoshitakaMo/localcolabfold) for structure\
  \ predictions, please ensure to include the `--amber` flag for structure refinement (relaxation / energy\
  \ minimization) and `--zip` flag which stores the results in a zip file (`.result.zip`) in order to\
  \ utilize tAMPer. \n\n```\nstructures\n├── peptide_1.result.zip\n├── peptide_2_AMD.result.zip\n├── peptide_3.result.zip\n\
  ...\n\n```\n\n## Usage\n\n```\nPROGRAM: train_tAMPer.py & predict_tAMPer.py\n\nUSAGE(S): \n   \n   ########\
  \ TRAIN ##########\n\n   usage: train_tAMPer.py [-h] -tr_pos TR_POS -tr_neg TR_NEG -tr_pdb TR_PDB -val_pos\
  \ VAL_POS -val_neg VAL_NEG -val_pdb VAL_PDB [-lr LR] [-hdim HDIM] [-gru_layers GRU_LAYERS] [-embedding_model\
  \ EMBEDDING_MODEL]\n                [-modality MODALITY] [-gnn_layers GNN_LAYERS] [-batch_size BATCH_SIZE]\
  \ [-n_epochs N_EPOCHS] [-gard_acc GARD_ACC] [-weight_decay WEIGHT_DECAY] [-d_max D_MAX] [-lammy LAMMY]\n\
  \                [-monitor MONITOR] [-pre_chkpnt PRE_CHKPNT] [-chkpnt CHKPNT] [-log LOG]\n\n\n   train_tAMPer.py\
  \ script runs tAMPer for training.\n\n   options:\n\t\t-h, --help            show this help message\
  \ and exit\n\t\t-tr_pos TR_POS        training toxic sequences fasta file (.faa)\n\t\t-tr_neg TR_NEG\
  \        training non-toxic sequences fasta file (.faa)\n\t\t-tr_pdb TR_PDB        address directory\
  \ of train structures\n\t\t-val_pos VAL_POS      validation toxic sequences fasta file (.faa)\n\t\t\
  -val_neg VAL_NEG      validation non-toxic sequences fasta file (.faa)\n\t\t-val_pdb VAL_PDB      address\
  \ directory of val structures\n\t\t-lr LR                learning rate\n\t\t-hdim HDIM            hidden\
  \ dimension of model for h_seq and h_strct\n\t\t-gru_layers GRU_LAYERS\n\t\t                    number\
  \ of GRU Layers\n\t\t-embedding_model EMBEDDING_MODEL\n\t\t                    different variant of\
  \ ESM2 embeddings: {t6, t12, t30, t33, t36, t48}\n\t\t-modality MODALITY    Used modality\n\t\t-gnn_layers\
  \ GNN_LAYERS\n\t\t                    number of GNNs Layers\n\t\t-batch_size BATCH_SIZE\n\t\t      \
  \              batch size\n\t\t-n_epochs N_EPOCHS    max number of epochs\n\t\t-gard_acc GARD_ACC  \
  \  gradient accumulation steps\n\t\t-weight_decay WEIGHT_DECAY\n\t\t                    weight decay\n\
  \t\t-d_max D_MAX          max distance to consider two connect two residues in the graph\n\t\t-lammy\
  \ LAMMY          lammy in the objective function\n\t\t-monitor MONITOR      the metric to monitor for\
  \ early stopping during training\n\t\t-pre_chkpnt PRE_CHKPNT\n\t\t                    address of pre-trained\
  \ GNNs\n\t\t-chkpnt CHKPNT        address to where trained model be stored\n\t\t-log LOG           \
  \   address to where log file be stored\n\n\n   ######## PREDICT ##########\n\n   usage: predict_tAMPer.py\
  \ [-h] -seqs SEQS -pdbs PDBS [-hdim HDIM] [-embedding_model EMBEDDING_MODEL] [-d_max D_MAX] [-chkpnt\
  \ CHKPNT] [-out OUT]\n\n   predict_tAMPer.py script runs tAMPer for prediction.\n\n   options:\n\t\t\
  -h, --help            show this help message and exit\n\t\t-seqs SEQS            sequences fasta file\
  \ for prediction (.fasta)\n\t\t-pdbs PDBS            address directory of train structures\n\t\t-hdim\
  \ HDIM            hidden dimension of model for h_seq and h_strct\n\t\t-embedding_model EMBEDDING_MODEL\n\
  \t\t                    different variant of ESM2 embeddings: {t6, t12}\n\t\t-d_max D_MAX          max\
  \ distance to consider two connect two residues in the graph\n\t\t-chkpnt CHKPNT        address of .pt\
  \ checkpoint to load the model\n\t\t-out OUT\n\t\t                    address of output folder\n   \
  \                                                                          \nEXAMPLE(S):\n\n\ttrain_tAMPer.py\
  \ -tr_pos ../tAMPer/data/sequences/tr_pos.faa \\\n\t\t-tr_neg ../tAMPer/data/sequences/tr_pos.faa \\\
  \n\t\t-tr_pdb ../tAMPer/data/tr_structures/ \\\n\t\t-val_pos ../tAMPer/data/sequences/tr_pos.faa \\\n\
  \t\t-val_neg ../tAMPer/data/sequences/tr_pos.faa \\\n\t\t-val_pdb ../tAMPer/data/val_structures/ \\\n\
  \t\t-pre_chkpnt ../tAMPer/checkpoints/trained/pre_GNNs.pt \\\n\t\t-lr 0.0004 \\\n\t\t-hdim 64 \\\n\t\
  \t-gru_layers 1 \\\n\t\t-gnn_layers 1 \\\n\t\t-d_max 12 \\\n\t\t-embedding_model t12 \\\n\t\t-batch_size\
  \ 32 \\\n\t\t-n_epochs 100 \\\n\t\t-gard_acc 1 \\\n\t\t-weight_decay 1e-7 \\\n\t\t-lammy 0.2 \\\n\t\t\
  -chkpnt ../tAMPer/checkpoints/chkpnt.pt \\\n\t\t-log ../tAMPer/logs/log.npy\n      \n\tpredict_tAMPer.py\
  \ -seqs ../data/sequences/seqs.faa \\\n\t\t-pdbs ../tAMPer/data/structures/ \\\n\t\t-hdim 64 \\\n\t\t\
  -embedding_model t12 \\\n\t\t-d_max 12 \\\n\t\t-chkpnt ../tAMPer/checkpoints/trained/chkpnt.pt \\\n\t\
  \t-out ../tAMPer/results/prediction.csv\n      \n```\n\n## Acknowledgement\n\nThe implementation of\
  \ portions of the GNNs convolutional layers and the input data pipeline were adapted from [Jing et al,\
  \ ICLR 2021](https://github.com/drorlab/gvp) and [Baldassarre et al, Structural bioinformatics 2021](https://github.com/baldassarreFe/graphqa).\n\
  \n## Citation\n\nIf you use tAMPer in your research, please cite:\n\nEbrahimikondori H, Sutherland D,\
  \ Yanai A, Richter A, Salehi A, Li C, Coombe L, Kotkoff M, Warren RL, Birol I. 2024. Structure-aware\
  \ deep learning model for peptide toxicity prediction. Protein Science. https://doi.org/10.1002/pro.5076.\n"

readme_excerpt: "<p align=\"center\">\n  <img src=\"docs/logo/title_logo/title_logo.svg\" alt=\"RadioTherapy\
  \ AI Model Card Writing Tool logo\" width=\"900\">\n</p>\n\n# RadioTherapy AI Model Card Writing Tool\n\
  \n[![Website](https://img.shields.io/badge/website-online-brightgreen)](https://rt-modelcard.streamlit.app)\n\
  [![GitHub Stars](https://img.shields.io/github/stars/MIRO-UCLouvain/RT-Model-Card?style=social)](https://github.com/MIRO-UCLouvain/RT-Model-Card/stargazers)\n\
  [![GitHub Forks](https://img.shields.io/github/forks/MIRO-UCLouvain/RT-Model-Card?style=social)](https://github.com/MIRO-UCLouvain/RT-Model-Card/network/members)\n\
  [![GitHub Issues](https://img.shields.io/github/issues/MIRO-UCLouvain/RT-Model-Card)](https://github.com/MIRO-UCLouvain/RT-Model-Card/issues)\n\
  [![License](https://img.shields.io/github/license/MIRO-UCLouvain/RT-Model-Card)](https://github.com/MIRO-UCLouvain/RT-Model-Card/blob/main/LICENSE)\n\
  [![Code of Conduct](https://img.shields.io/badge/Code%20of%20Conduct-Contributor%20Covenant-2ea44f)](https://github.com/MIRO-UCLouvain/RT-Model-Card/blob/main/CODE_OF_CONDUCT.md)\n\
  [![DOI](https://zenodo.org/badge/DOI/10.5281/zenodo.15336016.svg)](https://doi.org/10.5281/zenodo.15336016)\n\
  \n**RadioTherapy AI Model Card Writing Tool** is an open, community-driven tool to enhance transparency\
  \ and standardize the reporting of artificial intelligence (AI) applications in Radiation Therapy. \
  \ \n\nIt is designed for use by professionals in both research and clinical settings, supporting reproducibility,\
  \ accountability, and clear communication.  \n\nWhile the model card structure includes items relevant\
  \ to current regulatory expectations, it is **not a substitute for compliance** with frameworks such\
  \ as the EU Medical Device Regulation (MDR) or equivalent standards.  \n\nThis project is open-source\
  \ and welcomes contributions from the community to evolve the tool in line with emerging best practices\
  \ in RadioTherapy AI.\n\n\n## Table of Contents\n\n1. [Features](#features)\n2. [Contributing](#contributing)\n\
  3. [Requirements](#requirements)\n4. [Documentation](#documentation)\n5. [Code of Conduct](#code-of-conduct)\n\
  6. [Security](#security)\n7. [License](#license)\n\n---\n\n## Features\n \n- **Standardized Structure**:\
  \ Model cards follow a consistent 6-section format, making them easy to compare and interpret.  \n-\
  \ **Full Pipeline Transparency**: Provides details on the entire workflow, including pre-processing,\
  \ learning architecture, and post-processing steps.  \n- **Task-Specific Adaptability**: When creating\
  \ a new model card, users select from four tasks (Segmentation, Dose prediction, Image-to-image translation,\
  \ or Other). Based on the chosen task, the card dynamically displays the relevant task-specific fields\
  \ to be filled in.   \n- **Versioning Support**: Built-in fields allow tracking of updates to both the\
  \ model and its documentation.  \n- **Evaluation & Commissioning**: Supports multiple evaluation forms\
  \ for different datasets or clinical institutions.\n- **Supporting Materials Integration**: Attach or\
  \ reference figures, tables, and appendices without cluttering the main document.    \n- **Flexible\
  \ Export Options**: Download model cards in multiple formats (.json, .pdf, .md, .zip) for sharing and\
  \ archival purposes.  \n- **Progress Tracking**: Built-in warning system highlights required fields\
  \ that are missing or incomplete.  \n- **Community-Driven Development**: Encourages feedback, edits,\
  \ and contributions from the Radiation Therapy and AI community.  \n- **Regulatory Awareness**: Aligned\
  \ with regulatory principles (e.g., EU MDR), while clarifying it does not replace official requirements.\
  \  \n\n## Contributing\n\nWe welcome contributions from the community to help us maintain and expand\
  \ the RadioTherapy AI Model Card Writing Tool. Whether you're a clinician, researcher, industry professional,\
  \ or AI enthusiast, your contributions can make a significant impact.\n\nTo get started, please review\
  \ our [Contributing Guide](CONTRIBUTING.md) for guidelines and best practices.\n\n## Documentation\n\
  \n- **[Contributing Guide](CONTRIBUTING.md)** - How to contribute to the project\n- **[Security](SECURITY.md)**\
  \ - Security policies and reporting\n\n## Code of Conduct\n\nWe are committed to fostering a welcoming\
  \ and inclusive environment for all contributors. Please review our [Code of Conduct](CODE_OF_CONDUCT.md)\
  \ to ensure a positive and respectful community.\n\n## Security\n\nWe take the security of our platform\
  \ seriously. Please review our [Security Guidelines](SECURITY.md) for information on reporting vulnerabilities\
  \ and security best practices.\n\n## License\n\nThis project is licensed under the [Apache 2.0 License](LICENSE).\n\
  \n---\n\nDeveloped and maintained by [Silvia María Herranz Hernández](https://github.com/silviaherranz)\n"

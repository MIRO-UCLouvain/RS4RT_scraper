readme_excerpt: "<p align=\"center\" width=\"100%\">\n    <img width=\"100%\" src=\"https://github.com/MaxenceLarose/delia/raw/main/images/logo/delia_banner.svg\"\
  >\n</p>\n<p align=\"center\"><i>DELIA facilitates data extraction from DICOM files to support large-scale\
  \ image analysis workflows.</i></p>\n\n# Notable features\n\n- Bulk extraction of images and segmentations\
  \ from multiple patients' DICOM files. Segmentations must be in [DICOM-SEG](https://dicom.nema.org/medical/dicom/current/output/chtml/part03/sect_C.8.20.html)\
  \ or [RTStruct](https://dicom.nema.org/dicom/2013/output/chtml/part03/sect_A.19.html) format.\n- Creation\
  \ of an [HDF5](https://github.com/h5py/h5py) database containing multiple patients' medical images as\
  \ well as binary label maps (segmentations). The database is then easier to use than DICOMs to perform\
  \ tasks on medical data, such as training deep neural networks. \n- Bulk extraction of radiomics features\
  \ from multiple patients' DICOM files using [pyradiomics](https://github.com/AIM-Harvard/pyradiomics).\
  \ Note that `pyradiomics` is not a dependency of `delia` and must be installed separately.\n\n# Installation\n\
  \n## Latest stable version :\n\n```\npip install delia\n```\n\n## Latest (possibly unstable) version\
  \ :\n\n```\npip install git+https://github.com/MaxenceLarose/delia\n```\n\n# Quick usage preview\n\n\
  ## Extract images as `numpy` arrays\n\n```python\nfrom delia.extractors import PatientsDataExtractor\n\
  \npatients_data_extractor = PatientsDataExtractor(path_to_patients_folder=\"patients\")\n\nfor patient\
  \ in patients_data_extractor:\n    for image_data in patient.data:\n        array = image_data.image.numpy_array\n\
  \        \n        \"\"\"Perform any tasks on images on-the-fly.\"\"\"\n        print(array)\n```\n\n\
  ## Create patients database (HDF5)\n\n```python\nfrom delia.databases import PatientsDatabase\nfrom\
  \ delia.extractors import PatientsDataExtractor\n\npatients_data_extractor = PatientsDataExtractor(path_to_patients_folder=\"\
  patients\")\n\ndatabase = PatientsDatabase(path_to_database=\"patients_database.h5\")\n\ndatabase.create(patients_data_extractor=patients_data_extractor)\n\
  \n```\n\n## Create radiomics dataset (CSV)\n\n```python\nfrom delia.extractors import PatientsDataExtractor\n\
  from delia.radiomics import RadiomicsDataset, RadiomicsFeatureExtractor\n\npatients_data_extractor =\
  \ PatientsDataExtractor(path_to_patients_folder=\"patients\")\n\nradiomics_dataset = RadiomicsDataset(path_to_dataset=\"\
  radiomics.csv\")\nradiomics_dataset.extractor = RadiomicsFeatureExtractor(path_to_params=\"features_extractor_params.yaml\"\
  )\n\nradiomics_dataset.create(patients_data_extractor=patients_data_extractor, organ=\"Heart\", image_modality=\"\
  CT\")\n\n```\n*Note that `pyradiomics` is not a dependency of `delia` and must be installed separately.*\n\
  \n# Motivation\n\n**Digital Imaging and Communications in Medicine** ([**DICOM**](https://www.dicomstandard.org/))\
  \ is *the* international standard for medical images and related information. The working group [DICOM\
  \ WG-23](https://www.dicomstandard.org/activity/wgs/wg-23/) on Artificial Intelligence / Application\
  \ Hosting is currently working to identify or develop the DICOM mechanisms to support AI workflows,\
  \ concentrating on the clinical context. Moreover, their future *roadmap and objectives* includes working\
  \ on the concern that current DICOM mechanisms might not be adequate to cover some use cases, particularly\
  \ bulk analysis of large repository data, e.g. for training deep learning neural networks. **However,\
  \ no tool has been developed to achieve this goal at present.**\n\nThe main **purpose** of this module\
  \ is therefore to provide the necessary tools to facilitate the use of medical images in an AI workflow.\
  \  This goal is accomplished by using the [HDF file format](https://www.hdfgroup.org/) to create a database\
  \ containing patients' medical images as well as binary label maps obtained from the segmentation of\
  \ these images.\n\n# How it works\n\n## Main concepts\n\nThere are 4 main concepts :\n\n1. `PatientDataModel`\
  \ : It is the primary `delia` data structure. It is a named tuple gathering the image and segmentation\
  \ data available in a patient record. \n2. `PatientsDataExtractor` : A Python [Generator](https://docs.python.org/3/library/collections.abc.html#collections.abc.Generator)\
  \ that allows to iterate over several patients and create a `PatientDataModel` object for each of them.\
  \ A sequence of `delia` and/or `monai` transformations to apply to specific images or segmentations\
  \ can be specified (see [MONAI](https://docs.monai.io/en/stable/transforms.html)).\n3. `PatientsDatabase`\
  \ : An object that is used to create/interact with an HDF5 file (a database!) containing all patients\
  \ information (images + label maps). The `PatientsDataExtractor` is used to populate this database.\
  \ \n4. `RadiomicsDataset` : An object that is used to create/interact with a csv file (a dataset!) containing\
  \ radiomics features extracted from images. The `PatientsDataExtractor` is used to populate this dataset.\
  \ \n\n## Organize your data\n\nSince this module requires the use of data, it is important to properly\
  \ configure the data-related elements before using it.\n\n### File format\n\nImages files must be in\
  \ standard [**DICOM**](https://www.dicomstandard.org/) format and segmentation files must be in [DICOM-SEG](https://dicom.nema.org/medical/dicom/current/output/chtml/part03/sect_C.8.20.html)\
  \ or [RTStruct](https://dicom.nema.org/dicom/2013/output/chtml/part03/sect_A.19.html) format.\n\nIf\
  \ your segmentation files are in a research file format (`.nrrd`, `.nii`, etc.), you need to convert\
  \ them into the standardized [DICOM-SEG](https://dicom.nema.org/medical/dicom/current/output/chtml/part03/sect_C.8.20.html)\
  \ or [RTStruct](https://dicom.nema.org/dicom/2013/output/chtml/part03/sect_A.19.html) format. You can\
  \ use the [pydicom-seg](https://pypi.org/project/pydicom-seg/) library to create the DICOM-SEG files\
  \ OR use the [itkimage2dicomSEG](https://github.com/MaxenceLarose/itkimage2dicomSEG) python module,\
  \ which provide a complete pipeline to perform this conversion. Also, you can use the [RT-Utils](https://github.com/qurit/rt-utils)\
  \ library to create the RTStruct files.\n\n### Tag values (Optional)\n\n*This dictionary is **not**\
  \ mandatory for the code to work and therefore its default value is `None`. Note that if no `tag_values`\
  \ dictionary is given, i.e. `tag_values = None`, then all images will be added to the database.*\n\n\
  The tag values are specified as a **dictionary** that contains the values for the tag specified when\
  \ creating the PatientsDataExtractor object of the images that need to be extracted from the patients'\
  \ files. Keys are arbitrary names given to the images we want to add and values are lists of values\
  \ for the desired tag. The images associated with these tag values do not need to have a corresponding\
  \ segmentation volume. If none of the descriptions match the series in a patient's files, a warning\
  \ is raised and the patient is added to the list of patients for whom the pipeline has failed.\n\nNote\
  \ that the tag values can be specified as a python dictionary or as a path to a **json file** that contains\
  \ the desired values. Both methods are presented below.\n\n<details>\n  <summary>Using a json file</summary>\n\
  \nCreate a json file containing only the dictionary of the names given to the images we want to add\
  \ (keys) and lists of tag values (values). Place this file in your data folder.\n\nHere is an example\
  \ of a json file configured as expected :\n\n```json\n{\n    \"PT\": [\n        \"PT WB CORR (AC)\"\
  ,\n        \"PT WB XL CORR (AC)\"\n    ],\n    \"CT\": [\n        \"CT 2.5 WB\",\n        \"AC CT 2.5\
  \ WB\"\n    ]\n}\n```\n</details>\n\n<details>\n  <summary>Using a Python dictionary</summary>\n\nCreate\
  \ the organs dictionary in your main.py python file.\n\nHere is an example of a python dictionary instanced\
  \ as expected :\n\n```python\ntag_values = {\n    \"PT\": [\n        \"PT WB CORR (AC)\",\n        \"\
  PT WB XL CORR (AC)\"\n    ],\n    \"CT\": [\n        \"CT 2.5 WB\",\n        \"AC CT 2.5 WB\"\n    ]\n\
  }\n```\n</details>\n\n## Structure your patients directory\n\nIt is important to configure the directory\
  \ structure correctly to ensure that the module interacts correctly with the data files. The `patients`\
  \ folder, must be structured as follows. *Note that all DICOM files in the patients' folder will be\
  \ read.*\n\n```\n|_\U0001F4C2 Project directory/\n  |_\U0001F4C4 main.py\n  |_\U0001F4C2 data/\n   \
  \ |_\U0001F4C4 tag_values.json\n    |_\U0001F4C2 patients/\n      |_\U0001F4C2 patient1/\n       \t\
  |_\U0001F4C4 ...\n       \t|_\U0001F4C2 ...\n      |_\U0001F4C2 patient2/\n       \t|_\U0001F4C4 ...\n\
  \       \t|_\U0001F4C2 ...\n      |_\U0001F4C2 ...\n```\n\n# Import the package\n\nThe easiest way to\
  \ import the package is to use :\n\n```python\nimport delia\n```\n\nYou can explicitly use the objects\
  \ sub-modules :\n\n```python\nfrom delia.databases import PatientsDatabase\nfrom delia.extractors import\
  \ PatientsDataExtractor\nfrom delia.radiomics import RadiomicsDataset, RadiomicsFeatureExtractor\n```\n\
  \n# Use the package\n\n## Example using the `PatientsDatabase` class\n\nThis file can then be executed\
  \ to obtain an hdf5 database.\n\n```python\nfrom delia.databases import PatientsDatabase\nfrom delia.extractors\
  \ import PatientsDataExtractor\nfrom delia.transforms import (\n    PETtoSUVD,\n    ResampleD\n)\nfrom\
  \ monai.transforms import (\n    CenterSpatialCropD,\n    Compose,\n    ScaleIntensityD,\n    ThresholdIntensityD\n\
  )\n\npatients_data_extractor = PatientsDataExtractor(\n    path_to_patients_folder=\"data/patients\"\
  ,\n    tag_values=\"data/tag_values.json\",\n    transforms=Compose(\n        [\n            ResampleD(keys=[\"\
  CT_THORAX\", \"PT\", \"Heart\"], out_spacing=(1.5, 1.5, 1.5)),\n            CenterSpatialCropD(keys=[\"\
  CT_THORAX\", \"PT\", \"Heart\"], roi_size=(1000, 160, 160)),\n            ThresholdIntensityD(keys=[\"\
  CT_THORAX\"], threshold=-250, above=True, cval=-250),\n            ThresholdIntensityD(keys=[\"CT_THORAX\"\
  ], threshold=500, above=False, cval=500),\n            ScaleIntensityD(keys=[\"CT_THORAX\"], minv=0,\
  \ maxv=1),\n            PETtoSUVD(keys=[\"PT\"])\n        ]\n    )\n)\n\ndatabase = PatientsDatabase(path_to_database=\"\
  data/patients_database.h5\")\n\ndatabase.create(\n    patients_data_extractor=patients_data_extractor,\n\
  \    tags_to_use_as_attributes=[(0x0008, 0x103E), (0x0020, 0x000E), (0x0008, 0x0060)],\n    overwrite_database=True\n\
  )\n\n```\n\nThe created HDF5 database will then look something like :\n\n![patient_dataset](https://github.com/MaxenceLarose/delia/raw/main/images/patient_dataset.png)\n\
  \n## Example using the `PatientsDataExtractor`class\n\nThis file can then be executed to perform on-the-fly\
  \ tasks on images.\n\n```python\nfrom delia.extractors import PatientsDataExtractor\nfrom delia.transforms\
  \ import Compose, CopySegmentationsD, PETtoSUVD, ResampleD\nimport SimpleITK as sitk\n\npatients_data_extractor\
  \ = PatientsDataExtractor(\n    path_to_patients_folder=\"data/patients\",\n    tag_values=\"data/tag_values.json\"\
  ,\n    transforms=Compose(\n        [\n            ResampleD(keys=[\"CT_THORAX\", \"Heart\"], out_spacing=(1.5,\
  \ 1.5, 1.5)),\n            PETtoSUVD(keys=[\"PT\"]),\n            CopySegmentationsD(segmented_image_key=\"\
  CT_THORAX\", unsegmented_image_key=\"PT\")\n        ]\n    )\n)\n\nfor patient_dataset in patients_data_extractor:\n\
  \    print(f\"Patient ID: {patient_dataset.patient_id}\")\n\n    for patient_image_data in patient_dataset.data:\n\
  \        dicom_header = patient_image_data.image.dicom_header\n        simple_itk_image = patient_image_data.image.simple_itk_image\n\
  \        numpy_array_image = sitk.GetArrayFromImage(simple_itk_image)\n\n        \"\"\"Perform any tasks\
  \ on images on-the-fly.\"\"\"\n        print(numpy_array_image.shape)\n```\n\n## Need more examples?\n\
  \nYou can find more in the [examples folder](https://github.com/MaxenceLarose/delia/tree/main/examples).\n\
  \n# A deeper look into the `PatientsDataExtractor` object\n\nThe `PatientsDataExtractor` has 4 important\
  \ variables:  a `path_to_patients_folder` (which dictates the path to the folder that contains all patient\
  \ records), a `tag` (which specifies which tag to use when choosing which images need to be extracted,\
  \ if no value is given, this defaults to `SeriesDescription`), a `tag_values` (which dictates the images\
  \ that needs to be extracted from the patient records) and `transforms` that defines a sequence of transformati"

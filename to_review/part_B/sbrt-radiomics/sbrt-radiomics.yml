readme_excerpt: "# sbrt_radiomics\nThis is a set of scripts used to process DICOM CT scans, RTSTRUCT,\
  \ and RTDOSE\nfiles for a project aimed at using\n[radiomics](https://pubmed.ncbi.nlm.nih.gov/33431509/)\
  \ to improve\n[SBRT](https://www.mayoclinic.org/tests-procedures/sbrt/pyc-20446794) treatment\nprotocols\
  \ for lung cancer.\n\n## How to set things up on rivanna\n1. [Connect](https://www.rc.virginia.edu/userinfo/rivanna/login/)\
  \ to [rivanna](https://www.rc.virginia.edu/userinfo/rivanna/overview/)\n2. Clone this repo somewhere\
  \ (e.g. /nv/vol141/phys_nrf/JohnMatter/sbrt_radiomics)\n3. Create a python virtual environment by running\
  \ the following commands in the directory above your cloned repo\n   ```\n   python -m venv sbrt_radiomics_env\n\
  \   source sbrt_radiomics_env/bin/activate\n   pip install numpy matplotlib pandas pydicom pynrrd pyradiomics\
  \ scipy SimpleITK\n   ```\n\nYou will have to source the activate script every time you (or a SLURM\
  \ job) want to run these scripts.\n\n## Basic overview\nThe `src` directory contains three subdirectories:\
  \ `preprocess`, `radiomics`,\nand `visualization`.\nFor each patient in the dataset, their DICOM files\
  \ must be preprocessed to\nprepare them for input to pyradiomics.\nThe `preprocess.sh` script preprocesses\
  \ the data and the `radiomics.sh` script\ncalculates radiomic features for the output of `preprocess.sh`.\n\
  Both scripts run python scripts for the desired patient, but the user should\nonly have to peep into\
  \ the inner workings of the python scripts if things go\nreally awry—I believe all the kinks have been\
  \ worked out.\n\nThe visualization directory currently contains two scripts.\n`image_viewer.py` is a\
  \ trouble-shooting tool that allows you to check alignment\nof CT scans, dose maps, and organ masks.\n\
  The R scripts currently plot changes in radiomic features as a function of\ndose.\n\n## Input and output\n\
  Your data should live in a directory somewhere that *isn't* your home directory\nand ideally is not\
  \ in your cloned version of this repo.\nYou should create a symbolic link to your data directory in\
  \ the top directory\nof this repo (e.g. `ln -s /nv/vol141/phys_nrf/JohnMatter/patients/dataset1 data`).\n\
  **The scripts all assume this link exists!**\n\nThe data should be organized as shown in the mock directory\
  \ tree below this paragraph.\nThese patients have data from two time points, Pre and Post1.\nMB is an\
  \ example of a new unprocessed patient, and only has DICOM files.\nLJ is an example of a fully processed\
  \ patient, and has additional directories,\nNRRD files, and CSVs—these are all generated by the python\
  \ scripts.\n\n```\n/nv/vol141/phys_nrf/JohnMatter/patients/post_and_pre/\n├── WJ/\n│   ├── Pre/\n│ \
  \  │   ├── clinical/\n│   │   │   ├── struct_set.dcm\n│   │   │   ├── RTDOSE1.2.276.0.7230010.3.1.4.1602247082.16596.1613672697.92.dcm\n\
  │   │   │   ├── CT1.2.840.113704.7.1.0.106249620020632.1607274627.1060.dcm\n│   │   │   ├── CT1.2.840.113704.7.1.0.106249620020632.1607274627.1061.dcm\n\
  │   │   │   ├── CT1.2.840.113704.7.1.0.106249620020632.1607274627.1062.dcm\n│   │   │   ├── ...\n│ \
  \  ├── Post1/\n│   │   ├── clinical/\n│   │   │   ├── struct_set.dcm\n│   │   │   ├── RTDOSE1.2.276.0.7230010.3.1.4.1602247082.16596.1613672697.92.dcm\n\
  │   │   │   ├── CT1.2.840.113704.7.1.0.106249620020632.1607274627.1060.dcm\n│   │   │   ├── CT1.2.840.113704.7.1.0.106249620020632.1607274627.1061.dcm\n\
  │   │   │   ├── CT1.2.840.113704.7.1.0.106249620020632.1607274627.1062.dcm\n│   │   │   ├── ...\n├──\
  \ MB/\n│   ├── Pre/\n│   ├── Post1/\n├── HI/\n│   ├── Pre/\n│   ├── Post1/\n├── LJ/\n│   ├── Pre/\n\
  │   │   ├── ct_img.nrrd\n│   │   ├── dose_in_CT_dimensions.nrrd\n│   │   ├── contours.pickle\n│   │\

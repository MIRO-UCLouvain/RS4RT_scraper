readme_excerpt: "\n# \U0001F9E0 Deep Learning-Based Automated Brain Tumor Segmentation from MRI Images\
  \ Using a U-Net Convolutional Neural Network\n\nA deep learning project for automatic brain tumor segmentation\
  \ from **MRI scans** using **the U-Net architecture**.\nDeveloped as part of my Final Year Project (PFE)\
  \ in **Biomedical Engineering**, this work integrates **medical imaging**, **artificial intelligence**,\
  \ and **healthcare innovation**.\n\n---\n\n\U0001F680 Overview\n\nAccurate segmentation of brain tumors\
  \ from MRI scans is essential for **diagnosis**, **treatment planning**, and follow-up in **neuro-oncology**.\n\
  This project implements a U-Net convolutional neural network, trained on public MRI datasets and fine-tuned\
  \ using clinical MRI data from **the Oncology and Hematology Center of the Mohammed VI University Hospital\
  \ in Marrakech**.\n\nAn interactive Streamlit application called **NeuroSeg** is provided, enabling\
  \ real-time testing and visualization of the model’s segmentation results.\n\n---\n\n## \U0001F4DA Dataset\n\
  \nThe model was trained using the **LGG MRI Segmentation Dataset** provided by [Mateusz Buda on Kaggle](https://www.kaggle.com/datasets/mateuszbuda/lgg-mri-segmentation).\
  \  \nThis dataset comprises 110 cases of lower-grade glioma (LGG) patients, including MRI scans with\
  \ manual segmentation masks for FLAIR abnormalities.  \nThe dataset was sourced from The Cancer Imaging\
  \ Archive (TCIA) and is publicly available for research purposes.\n\nIn addition, the model was fine-tuned\
  \ on clinical MRI data from the Oncology and Hematology Center of the Mohammed VI University Hospital\
  \ in Marrakech.\n\n⚠️ The hospital data is private and cannot be shared publicly.\n\nNumber of images:\
  \ 196 MRI scans\n\nNumber of masks: 196 corresponding segmentation masks\n\nNumber of patients: 10\n\
  \nTumor type: Glioblastoma\n\nThis combination of public and clinical data improves model performance\
  \ and ensures that the system generalizes well to real-world cases.\n\n---\n\n## \U0001F4CC Unet_Architecture\n\
  \n ![](Unet_Architecture.png) \n\n---\n\n## \U0001F4CA Results\n\n| Metric       | Score |\n|--------------|-------|\n\
  | Dice Score   | 0.8443  |\n| Loss          | 0.1557  |\n**Example outputs:**\n\n ![](Results.jpg) \n\
  \ \n\n## \U0001F52E Future Work\n\n- **Explore advanced models:** Test newer and more powerful segmentation\
  \ architectures (e.g., attention U-Nets, Transformers) to improve accuracy.  \n- **3D MRI analysis:**\
  \ Extend the model to work with 3D volumes, enabling volumetric tumor segmentation for better clinical\
  \ insights.  \n- **Clinical validation:** Evaluate the model on larger and more diverse patient cohorts.\
  \  \n- **Integration:** Explore integration with hospital systems for real-time clinical use.\n\n##\
  \ \U0001F4D6 References\n\n1. Deep Learning for Brain Tumor Segmentation: Advances and Challenges (ScienceDirect,\
  \ 2024)  \nURL: https://www.sciencedirect.com/science/article/pii/S2405959524001115\n\n2. Brain Tumor\
  \ Segmentation with Deep Neural Networks (IEEE Xplore, 2019)  \nURL: https://ieeexplore.ieee.org/document/8964956\n\
  \n3. Brain Tumor Segmentation using Convolutional Neural Networks in MRI Images (IEEE Xplore, 2018)\
  \  \nURL: https://ieeexplore.ieee.org/document/8987265\n\n\n"

readme_excerpt: "# \U0001F9E0 Brain Tumor Segmentation using U-Net in TensorFlow  \n\nThis project implements\
  \ a deep learning-based **semantic segmentation model** to identify and segment brain tumors from MRI\
  \ scans. Using a **U-Net architecture**, the model learns to distinguish tumor regions from the background\
  \ in medical images.  \n\n---\n\n## \U0001F4D6 Project Overview  \n\n| Feature        | Description\
  \                                                                 |\n|----------------|-----------------------------------------------------------------------------|\n\
  | \U0001F3AF Goal        | Accurately segment tumor regions from brain MRI images using deep learning\
  \ |\n| \U0001F4C2 Dataset     | Brain tumor segmentation dataset with paired images and masks      \
  \        |\n| \U0001F3D7️ Architecture | U-Net convolutional neural network implemented in TensorFlow/Keras\
  \         |\n| \U0001F4BB Platform    | Developed locally in **VS Code** with GPU support          \
  \                |\n\n---\n\n<p align=\"center\">\n  <img src=\"confusion_matrix.png\" width=\"700\"\
  >\n</p>\n\n<p align=\"center\">\n  Confusion matrix generated from U-Net based MRI brain tumor segmentation\
  \ evaluation.\n</p>\n\n<p align=\"center\">\n  <img src=\"f1_curve.png\" width=\"700\">\n</p>\n\n<p\
  \ align=\"center\">\n  F1-Curve generated from U-Net based MRI brain tumor segmentation evaluation.\n\
  </p>\n\n<p align=\"center\">\n  <img src=\"roc_curve.png\" width=\"700\">\n</p>\n\n<p align=\"center\"\
  >\n  ROC-Curve generated from U-Net based MRI brain tumor segmentation evaluation.\n</p>\n\n## \U0001F680\
  \ Technologies Used  \n\n- **TensorFlow / Keras** – Building and training the deep learning model  \n\
  - **OpenCV** – Image processing and data preparation  \n- **Scikit-learn** – Evaluation metrics and\
  \ model validation  \n- **Matplotlib / Seaborn** – Visualization of training progress and results  \n\
  \n---\n\n## \U0001F4CA Model Evaluation  \n\nThe model was trained for **10 epochs** and evaluated on\
  \ a held-out **test set**.  \n\n| Metric            | Value   |\n|-------------------|---------|\n|\
  \ ✅ Accuracy        | 98.27%  |\n| \U0001F3AF Precision      | 0.5591  |\n| \U0001F50D Recall      \
  \   | 0.7076  |\n| \U0001F4D0 F1 Score       | 0.6247  |\n| \U0001F4CA AUC-ROC Score  | 0.8492  |\n\n\
  ---\n\n## \U0001F4CC Confusion Matrix  \n\n|                       | Predicted Negative | Predicted\
  \ Positive |\n|-----------------------|-------------------:|-------------------:|\n| **Actual Negative**\
  \   | 39,150,709         | 366,303            |\n| **Actual Positive**   | 191,962            | 464,594\
  \            |\n\n---\n\n## \U0001F4C2 Project Structure  \n\n```\nBrain_Tumor_Segmentation_Using_U-NET/\n\
  │── data/                 # Dataset (MRI scans + masks)\n│── notebooks/            # Jupyter notebooks\
  \ for experiments\n│── src/                  # Source code for training + model\n│   ├── model.py  \
  \        # U-Net implementation\n│   ├── train.py          # Training loop\n│   ├── evaluate.py    \
  \   # Evaluation script\n│── results/              # Saved outputs (plots, predictions)\n│── requirements.txt\
  \      # Dependencies\n│── README.md             # Project documentation\n```\n\n---\n\n## ⚡ How to\
  \ Run  \n\n1. Clone this repo:  \n   ```bash\n   git clone https://github.com/SayedMohamedSaqib/Brain_Tumor_Segmentation_Using_U-NET.git\n\
  \   cd Brain_Tumor_Segmentation_Using_U-NET\n   ```\n\n2. Install dependencies:  \n   ```bash\n   pip\
  \ install -r requirements.txt\n   ```\n\n3. Train the model:  \n   ```bash\n   python src/train.py\n\
  \   ```\n\n4. Evaluate the model:  \n   ```bash\n   python src/evaluate.py\n   ```\n\n---\n\n## \U0001F4DC\

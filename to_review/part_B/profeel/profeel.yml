readme_excerpt: '# Profeel

  Profeel is an open-source dosimetry data visualization software (MATLAB®), which can be used for 1D,
  2D and 3D data comparison, data processing and analytics. Supported datatypes: IBA Omnipro (ASCII export),
  PTW (.mcc), PTW software exports (ASCII), EGSnrc (.3ddose) and DicomRT (RD dose).





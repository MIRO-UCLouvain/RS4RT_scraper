readme_excerpt: "# Alzheimer's Stage Classification using Radiomics\n\n## Overview\n\nThis project presents\
  \ a machine learning framework for Alzheimer's disease stage classification using MRI-derived radiomic\
  \ features.\n\nThe framework classifies subjects into five stages:\n\n- Normal\n- EMCI (Early Mild Cognitive\
  \ Impairment)\n- MCI (Mild Cognitive Impairment)\n- LMCI (Late Mild Cognitive Impairment)\n- AD (Alzheimer's\
  \ Disease)\n\n## Dataset\n\n- Total Subjects: 2500\n- Classes: 5\n- Radiomic Features: 56\n- Balanced\
  \ Dataset (500 subjects per class)\n\n## Models\n\n- Random Forest\n- XGBoost\n\n## Workflow\n\nRadiomic\
  \ Features (56)\n           ->\nData Preprocessing\n           ->\nRandom Forest\n            ->\nXGBoost\n\
  \           ->\n5-Class Classification\n           ->\nPerformance Evaluation\n\n## Results\n\n| Model\
  \ | Test Accuracy | Cross Validation Accuracy |\n|---------|---------|---------|\n| Random Forest |\
  \ 97.4% | 94.2% |\n| XGBoost | 98.0% | 96.24% |\n\n## Key Findings\n\n- XGBoost achieved the highest\
  \ classification performance.\n- LMCI and Normal subjects were classified with near-perfect accuracy.\n\
  - Most classification errors occurred between MCI and AD stages.\n- Radiomic features demonstrated strong\
  \ discriminative power for disease staging.\n\n## Future Work\n\n- ROI-wise feature contribution analysis\n\
  - SHAP explainability\n- MRI image-to-stage prediction pipeline\n- Deep learning model comparison\n"

readme_excerpt: "# Pretty-Good-Measurement-PGM-Quantum-Inspired-Classifier-for-Radiomic\nThis repository\
  \ contains the Python implementation of a quantum-inspired multi-class classifier based on the Pretty\
  \ Good Measurement (PGM) framework, used for the experiments presented in the paper “Pretty Good Measurement\
  \ for Radiomics: A Quantum-Inspired Multi-Class Classifier for Lung Cancer Subtyping and Prostate Cancer\
  \ Risk Stratification”\n\nThe classifier follows the scikit-learn API and inherits from `BaseEstimator`\
  \ and `ClassifierMixin`, making it compatible with standard scikit-learn workflows and utilities.\n\n\
  ## Usage\n\n```python\nfrom PGMHQC_gpu_cpu_dtype import PGMHQC_gpu_cpu_dtype\n\n# Initialize the classifier\n\
  clf = PGMHQC_gpu_cpu_dtype(\n    measure='pgm',\n    encoding='amplit',\n    n_copies=1\n)\n\n# Train\
  \ the model\nclf.fit(X_train, y_train)\n\n# Predict labels\ny_pred = clf.predict(X_test)\n\n# Predict\
  \ class probabilities\ny_prob = clf.predict_proba(X_test)\n"

readme_excerpt: "## Brain Cancer Modelling URA \n- Code from https://github.com/KurtLabUW/brats2023_updated?tab=readme-ov-file\n\
  - Using BraTS 2023 Data from Synapse https://www.synapse.org/Synapse:syn51156910/files/\n\n## Reproducing\
  \ Results\n\nThis repository contains pipelines for 3D tumor segmentation using U-Net and boundary refinement\
  \ using the Segment Anything Model 3 (SAM 3). Below are instructions to run the models from scratch.\n\
  \n### Prerequisites\n\nEnsure you have installed the required dependencies:\n```bash\npip install -r\
  \ brats2023_updated/requirements.txt\n```\n*Note: Make sure your dataset and checkpoint paths in the\
  \ `__main__` blocks of the respective training/inference scripts are pointing to the correct locations\
  \ on your local machine.*\n\n### U-Net Model\n\n**1. Training**\nTo train the base 3D U-Net model on\
  \ the BraTS dataset, execute the following from the root directory:\n```bash\npython -m brats2023_updated.model_routines.train_with_val\n\
  ```\n\n**2. Inference**\nOnce trained, to run inference (predicting on validation/test data) with the\
  \ U-Net model, run:\n```bash\npython -m brats2023_updated.model_routines.infer\n```\n\n### SAM 3 Model\
  \ (Fine-Tuning & Inference)\n\nThe SAM 3 pipeline utilizes a fine-tuned SAM 3 model for slice-by-slice\
  \ boundary refinement.\n\n**Option 1: Complete Pipeline Script**\nYou can run the full SAM 3 pipeline\
  \ (training followed by inference) using the provided bash script:\n```bash\n./brats2023_updated/sam/run_sam3_pipeline.sh\n\
  ```\n\n**Option 2: Manual Execution**\n\n**1. Training (LoRA Fine-tuning)**\nTo fine-tune the SAM 3\
  \ model using LoRA adapters:\n```bash\npython -m brats2023_updated.sam.train_sam3\n```\n\n**2. Inference**\n\
  To evaluate the fine-tuned SAM 3 model (this uses bounding boxes to prompt the model):\n```bash\npython\
  \ -m brats2023_updated.sam.infer_sam3\n```\n"

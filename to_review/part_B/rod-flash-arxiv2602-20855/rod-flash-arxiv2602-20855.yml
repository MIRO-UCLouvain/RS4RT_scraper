readme_excerpt: "# ROD_FLASH_arxiv2602.20855\nData and code for \"On the calculation of the radiobiological\
  \ effect of radiolytic oxygen depletion in FLASH radiotherapy\" arxiv 2602.20855\n\n\nCODE – MATLAB\
  \ FUNCTIONS\n\ncalculate_SF_ROD_hom.m\n\nINFO: function computing the effect of ROD on the surviving\
  \ fraction SF for homogeneously oxygenated cells, by using different methods (1, 2, 3, 5). See body\
  \ of the function for further info.\n\ncalculate_SF_ROD_hom_Zhu.m\n\nINFO: function computing the effect\
  \ of ROD on the surviving fraction SF for homogeneously oxygenated cells, by using Zhu's et al method\
  \ (method 4). See body of the function for further info.\n\ncalculate_SF_ROD_het.m\n\nINFO: function\
  \ computing the effect of ROD on the surviving fraction SF for heterogeneous oxygen distribution, by\
  \ using different methods (1, 2, 3, 5). See body of the function for further info.\n\ncalculateSF.m\n\
  \nINFO: Auxiliary function. Evaluates the surviving fraction including OERs. See body of the function\
  \ for further info.\n\nponderation.m\n\nINFO: Auxiliary function for the heterogeneous case. Averages\
  \ a variable in the Finite Element Method (FEM) domain taking into account the the different weight\
  \ of each node (triangle area). See body of the function and González-Crespo et al PMB 2024 for further\
  \ info.\n    \n\n\n\n\nDATA – MATLAB WORKSPACES\n\ndata_article_ROD.mat\nINFO: data used to create figures\
  \ 1 to 4 in the article\n\nList of variables:\n\nD_het: vector of simulated doses, heterogeneous case.\n\
  \nD: vector of simulated doses, homogeneous case.\n\nu:  vector of simulated oxygenations, homogeneous\
  \ case.\n\nSF_conv_hom: surviving fractions for conventional delivery for different dose values and\
  \ oxygenation values (homogeneous oxygenation).\n\nSF_conv_het_33: surviving fractions for conventional\
  \ delivery for different dose values, heterogeneous oxygenation id=33 (moderately well oxygenated)\n\
  \nSF_conv_het_90: surviving fractions for conventional delivery for different dose values, heterogeneous\
  \ oxygenation id=90 (poorly oxygenated).\n\nSF_flash_hom: surviving fractions for FLASH delivery for\
  \ different dose values and oxygenation values (homogeneous oxygenation), computed with methods 5, 1,\
  \ 2, 3.\n\nSF_flash_Zhu_hom_completo: surviving fractions for FLASH delivery for different oxygenation\
  \ values (homogeneous oxygenation), computed with method 4 (Zhu). Each row corresponds to doses from\
  \ 0 to 50 Gy in steps of 1e-4 Gy.\n\nSF_flash_het_33: surviving fractions for FLASH delivery for different\
  \ dose values computed with methods 1, 2, 3, 5; heterogeneous oxygenation id=33 (moderately well oxygenated).\n\
  \nSF_flash_het_90: surviving fractions for FLASH delivery for different dose values computed with methods\
  \ 1, 2, 3, 5;  heterogeneous oxygenation id=90 (poorly oxygenated).\n\n\noxy_90_G_025.mat\nINFO: oxygen\
  \ dynamics for heterogeneous oxygen distribution id=90 (poorly oxygenated). More info in González-Crespo\
  \ et al PMB 2024.\n\nList of variables:\n\nu: vector of oxygenations in each node for CONV-RT\n\nu_flash:\
  \ oxygenations in each node an for each time in the interval [0, T=0.6 s] with time step dt=1e-3 s (601\
  \ time steps that correspond to doses ranging from 0 to 60 Gy in steps of 0.1 Gy, with a dose rate of\
  \ 100 Gy/s).\n\nmodel: matlab PDEmodel variable containing the info of the Finite Element Method (FEM)\
  \ used to solve the PDE equation.\n\n\noxy_33_G_025.mat\nINFO: as above for heterogeneous oxygen distribution\
  \ id=33 (moderately well oxygenated). More info in González-Crespo et al PMB 2024.\n"

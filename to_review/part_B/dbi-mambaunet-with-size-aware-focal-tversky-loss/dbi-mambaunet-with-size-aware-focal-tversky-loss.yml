readme_excerpt: "# DBI-MambaUNet with Size-Aware Focal Tversky Loss\n\nDBI-MambaUNet is a 3D biomedical\
  \ image segmentation framework built on top of nnU-Net v2. This repository highlights two equally important\
  \ components: the DBI-MambaUNet architecture and the proposed Size-Aware Focal Tversky Loss (SA-FTL).\n\
  \n- **DBI-MambaUNet architecture**: a dedicated 3D segmentation network implemented in `DBI-MambaUNet/nnunetv2/nets/DBI-MambaUNet_3d.py`\
  \ and integrated into the nnU-Net v2 training and inference pipeline.\n- **Size-Aware Focal Tversky\
  \ Loss (SA-FTL)**: the default training objective, designed for difficult and size-imbalanced segmentation\
  \ targets by combining Tversky-style region-overlap optimization with size-aware weighting.\n\nTogether,\
  \ these components preserve the standard nnU-Net data format, planning, training, and inference workflow\
  \ while adding a custom network and loss for challenging 3D biomedical segmentation tasks. For comparison\
  \ and ablation studies, this repository also provides custom nnU-Net trainers for Dice, Tversky, Focal\
  \ Tversky, Generalized Dice, and CE-combined loss variants.\n\nThe codebase follows [nnU-Net](https://github.com/MIC-DKFZ/nnUNet)\
  \ for the overall segmentation pipeline and follows the [U-Mamba](https://github.com/bowang-lab/U-Mamba)\
  \ installation flow for Mamba-related dependencies. Because DBI-MambaUNet relies on [Mamba](https://github.com/state-spaces/mamba),\
  \ please make sure the CUDA, PyTorch, and Mamba packages are compatible before running training.\n\n\
  ## Installation\n\nRecommended environment, following U-Mamba:\n\n- Ubuntu 20.04 or WSL2/Linux\n- CUDA\
  \ 11.8\n- Python 3.10\n- PyTorch 2.0.1\n\n```bash\nconda create -n dbi-mambaunet python=3.10 -y\nconda\
  \ activate dbi-mambaunet\n\npip install torch==2.0.1 torchvision==0.15.2 --index-url https://download.pytorch.org/whl/cu118\n\
  pip install packaging\npip install \"causal-conv1d>=1.2.0\"\npip install mamba-ssm --no-cache-dir\n\n\
  pip install -e .\n```\n\nSanity check:\n\n```bash\npython - <<'PY'\nimport torch\nimport mamba_ssm\n\
  print(torch.__version__)\nPY\n```\n\nMamba kernels are sensitive to CUDA, PyTorch, and compiler versions.\
  \ If installation fails, first verify that your CUDA runtime and PyTorch wheel match.\n\n## Data Layout\n\
  \nDBI-MambaUNet uses the standard nnU-Net v2 dataset format:\n\n```text\ndata/\n  nnUNet_raw/\n    DatasetXXX_TaskName/\n\
  \      imagesTr/\n        case_0001_0000.nii.gz\n      labelsTr/\n        case_0001.nii.gz\n      imagesTs/\n\
  \      dataset.json\n  nnUNet_preprocessed/\n  nnUNet_results/\n```\n\nBy default, the code uses `<repo>/data/nnUNet_raw`,\
  \ `<repo>/data/nnUNet_preprocessed`, and `<repo>/data/nnUNet_results`. To use another location, set\
  \ the nnU-Net environment variables before running commands:\n\n```bash\nexport nnUNet_raw=/path/to/nnUNet_raw\n\
  export nnUNet_preprocessed=/path/to/nnUNet_preprocessed\nexport nnUNet_results=/path/to/nnUNet_results\n\
  ```\n\nPowerShell:\n\n```powershell\n$env:nnUNet_raw = \"D:\\path\\to\\nnUNet_raw\"\n$env:nnUNet_preprocessed\
  \ = \"D:\\path\\to\\nnUNet_preprocessed\"\n$env:nnUNet_results = \"D:\\path\\to\\nnUNet_results\"\n\
  ```\n\n## Preprocessing\n\n```bash\nnnUNetv2_plan_and_preprocess -d DATASET_ID --verify_dataset_integrity\n\
  ```\n\nReplace `DATASET_ID` with the numeric id of your nnU-Net dataset, for example `701`.\n\n## Training\n\
  \nDefault DBI-MambaUNet trainer with Size-Aware Focal Tversky loss:\n\n```bash\nnnUNetv2_train DATASET_ID\
  \ 3d_fullres FOLD -tr nnUNetTrainerDBI-MambaUNet_SizeAwareTversky_Loss\n```\n\nExample:\n\n```bash\n\
  nnUNetv2_train 701 3d_fullres 0 -tr nnUNetTrainerDBI-MambaUNet_SizeAwareTversky_Loss\n```\n\nAvailable\
  \ DBI-MambaUNet trainers:\n\n- `nnUNetTrainerDBI-MambaUNet_Dice_Loss`\n- `nnUNetTrainerDBI-MambaUNet_Dice_CE_Loss`\n\
  - `nnUNetTrainerDBI-MambaUNet_Tversky_Loss`\n- `nnUNetTrainerDBI-MambaUNet_Tversky_CE_Loss`\n- `nnUNetTrainerDBI-MambaUNet_FocalTversky_Loss`\n\
  - `nnUNetTrainerDBI-MambaUNet_FocalTversky_CE_Loss`\n- `nnUNetTrainerDBI-MambaUNet_GeneralizeDice_Loss`\n\
  - `nnUNetTrainerDBI-MambaUNet_GeneralizeDice_CE_Loss`\n- `nnUNetTrainerDBI-MambaUNet_SizeAwareTversky_Loss`\n\
  - `nnUNetTrainerDBI-MambaUNet_SizeAwareTversky_CE_Loss`\n\n## Inference\n\n```bash\nnnUNetv2_predict\
  \ \\\n  -i INPUT_FOLDER \\\n  -o OUTPUT_FOLDER \\\n  -d DATASET_ID \\\n  -c 3d_fullres \\\n  -f FOLD\
  \ \\\n  -tr nnUNetTrainerDBI-MambaUNet_SizeAwareTversky_Loss \\\n  --disable_tta\n```\n\n## Notes\n\n\
  - The main network implementation is `DBI-MambaUNet/nnunetv2/nets/DBI-MambaUNet_3d.py`.\n- Size-aware\
  \ trainers use `SizeAwareTverskyLoss`, where `gamma` is mapped to the focal term (`focal_gamma`) for\
  \ Size-Aware Focal Tversky behavior.\n- Trained weights, datasets, preprocessing outputs, and large\
  \ medical image files are intentionally ignored by git.\n- This repository does not vendor the Mamba\
  \ source tree. Install `causal-conv1d` and `mamba-ssm` in the environment instead.\n- If AMP produces\
  \ NaNs in Mamba blocks, try disabling AMP in the trainer, as also noted by U-Mamba.\n\n## Citation\n\
  \nIf you use this repository, please cite the DBI-MambaUNet paper once the citation is available. Please\
  \ also cite the upstream projects that this work builds on:\n\n- [nnU-Net](https://github.com/MIC-DKFZ/nnUNet)\n\
  - [U-Mamba](https://github.com/bowang-lab/U-Mamba)\n- [Mamba](https://github.com/state-spaces/mamba)\n\
  \n## Acknowledgements\n\nWe thank the authors of nnU-Net, U-Mamba, and Mamba for releasing their code\
  \ and documentation to the community.\n\n## License\n\nThis project is released under the Apache License\
  \ 2.0. See [LICENSE](LICENSE).\n"

readme_excerpt: "# \U0001F31F STARDUST: AI-Powered Segmentation & Clinical Data Processing \U0001F31F\n\
  \n![STARDUST Banner](assets/bannerCollage.png)\n\n## \U0001F50D Overview\n\n**STARDUST** (Segmentation\
  \ of Tumors via AI-powered Radiotherapy Database Utilization using AI Technology) is a comprehensive\
  \ framework designed to streamline tumor segmentation, data extraction from treatment planning systems\
  \ (TPS), and dataset preparation for AI training. The project consists of multiple components, each\
  \ targeting a specific aspect of medical image processing and clinical data handling.\n\nThis repository\
  \ serves as the central hub for the STARDUST ecosystem, containing multiple submodules that work together\
  \ to improve segmentation workflows, enhance case selection, and facilitate AI training using real-world\
  \ radiotherapy data.\n\n## \U0001F4C2 Repository Structure\n\nThe STARDUST repository consists of the\
  \ following core submodules:\n\n### 1️⃣ **STARDUST-MedSAM2**\nA customized version of the **Segment\
  \ Anything Model 2 (SAM2)** adapted for tumor segmentation in radiotherapy planning. This module includes\
  \ fine-tuning methods, evaluation tools, DICOM-automation workflow and a GUI for easy inference. \n\n\
  \U0001F517 **[More details](./STARDUST_MedSAM-MG/README.md)**\n\n---\n\n### 2️⃣ **STARDUST-TPS-Mining**\
  \ \U0001F3E5\nA Python script for **data mining** within the **Eclipse Treatment Planning System (TPS)**\
  \ to extract relevant cases for training **STARDUST-MedSAM2**. It performs the following tasks:\n- Searches\
  \ for relevant radiotherapy cases based on clinical parameters\n- Extracts segmentation metrics into\
  \ an **Excel file**\n- Captures **planning CT, contrast-enhanced CT (KM-CT), and MRI** screenshots with\
  \ tumor contours (optionally including dose distribution)\n\n\U0001F517 **[More details](./STARDUST-TPS-Mining/README.md)**\n\
  \n---\n\n### 3️⃣ **STARDUST-Case-Selector** \U0001F39B️\nA **Python GUI tool** to review extracted cases\
  \ and determine their suitability for AI training. This module allows for:\n- **Parallel image review**\
  \ of Planning CT, KM-CT, and MRI\n- **Selection and labeling** of cases for training\n- **Advanced filtering**\
  \ to refine TPS-mined cases based on clinical criteria\n\n\U0001F517 **[More details](./STARDUST_CaseSelector/README.md)**\n\
  \n---\n\n### 4️⃣ **STARDUST-Data-Exporter** \U0001F4E4\nA structured data export pipeline that **converts\
  \ the selected cases from TPS into a format compatible with STARDUST-MedSAM2**. This module:\n- Reads\
  \ the labeled selections from **STARDUST-Case-Selector**\n- Extracts **DICOM images and contours** from\
  \ TPS\n- Prepares data for **STARDUST-MedSAM2 training**\n\n\U0001F517 **[More details](./STARDUST-Data-Exporter/README.md)**\n\
  \n---\n\n## \U0001F52E Future Development\n- ✅ **Automated DICOM export pipeline**\n- ✅ **TPS integration\
  \ for direct case selection from Eclipse**\n- \U0001F51C **AI-assisted case filtering and selection**\n\
  \n---\n\n## \U0001F4DA Citation\n\nIf you use STARDUST in your research, please cite this repository.\n\
  \n---\n\n## \U0001F4DD License\n\nThis project is licensed under the MIT License - see the LICENSE file\
  \ for details.\n\n## \U0001F64F Acknowledgments\n\n- This project builds upon [MedSAM2](https://github.com/bowang-lab/MedSAM/tree/MedSAM2)\
  \ by Bo Wang's Lab\n- [SAM2](https://github.com/facebookresearch/sam2) developed by Meta Platforms,\
  \ Inc.\n\n## \U0001F3E6 Funding\n\nSTARDUST is sponsored by the Federal Ministry of Education and Research\
  \ (Bundesministerium für Bildung und Forschung, BMBF) as part of the “DataXperiment – Innovative Data\
  \ Use in Cancer Research and Care” initiative within the National Decade Against Cancer (Nationale Dekade\
  \ gegen Krebs).\nFunding Code: 01KD2438\nProject Duration: October 2024 – March 2025\n\nAbout the Initiative:\n\
  DataXperiment promotes short-term projects that explore innovative applications of already available,\
  \ structured, and annotated data in oncology.<div style=\"text-align: right;\">\n  <img src=\"assets/internet_in_farbe_en.jpg\"\
  \ alt=\"Logo BMBF\" width=\"220\">\n</div>\n"

readme_excerpt: "# HNCUP — RT Target Delineation Skill\n\nPostoperative & definitive radiotherapy target\
  \ volume delineation for **head and neck cancer of unknown primary** (HNCUP).\n\n## What This Skill\
  \ Does\n\nGiven a cervical lymph node with metastatic SCC and no visible primary, this skill guides\
  \ you through a standardized 6-step decision chain:\n\n1. **True CUP definition** — exhaustive workup\
  \ must have failed\n2. **NPC exclusion** (Step 1) — mandatory in Chinese/endemic populations\n3. **Reverse-engineer\
  \ the primary** from nodal location + viral status\n4. **Selective mucosal irradiation** — not pan-mucosal,\
  \ not full oral cavity\n5. **Ipsilateral neck only** — unless contralateral cN+\n6. **Retrograde flow\
  \ rule** — post-dissection lymphatic disruption\n\n## Quick Install\n\n### Hermes Agent\n```bash\nhermes\
  \ skills install https://raw.githubusercontent.com/antica1/head-neck-cup-rt-targets/master/SKILL.md\n\
  ```\n\n### Claude Code\nCopy `SKILL.md` into your Claude skills directory.\n\n## Trigger Keywords\n\n\
  `unknown primary` `HNCUP` `occult primary` `neck node SCC no primary`\n\n## Key References\n\n- Dou\
  \ S et al. *Oncotarget* 2016 (PMID: 27223430)\n- Dou S et al. *Cancer Med* 2020 (PMID: 31953927)\n-\
  \ Ghatasheh et al. *Radiother Oncol* 2022 (PMID: 35905781)\n- Oebel et al. *Clin Transl Radiat Oncol*\
  \ 2024 (PMID: 38192301)\n- DAHANCA. *Radiother Oncol* 2025 (PMID: 41016667)\n\n## Author\n\nDou Shengjin,\
  \ Zhu Guopei — Department of Radiation Oncology, Shanghai Ninth People's Hospital, Shanghai Jiao Tong\
  \ University School of Medicine.  \nContact: antica@gmail.com\n\n## License\n\nMIT\n\n## Related Skills\

readme_excerpt: "# \U0001F52C Drug Toxicity Detector\r\n\r\nA machine learning-powered web application\
  \ that predicts drug toxicity across 12 different biological endpoints using XGBoost models with ensemble\
  \ averaging. Achieve up to 80% accuracy in predicting adverse effects of chemical compounds.\r\n\r\n\
  ## \U0001F4CA Project Overview\r\n\r\nDrug Toxicity Detector uses advanced machine learning to analyze\
  \ chemical structures and predict their potential toxicity effects on various biological targets. The\
  \ system employs an ensemble of two XGBoost models that are averaged to provide robust predictions across\
  \ 12 different nuclear and stress response endpoints specified by the Tox21 challenge.\r\n\r\n### Key\
  \ Features\r\n\r\n- ✅ **Multi-Endpoint Prediction**: Predicts toxicity for 12 different biological endpoints\r\
  \n- ✅ **High Accuracy**: Up to 80% accuracy with ensemble model averaging\r\n- ✅ **Ensemble Approach**:\
  \ Combines two XGBoost models for improved robustness\r\n- ✅ **Molecular Visualization**: Interactive\
  \ 3D visualization of molecular structures\r\n- ✅ **Fast API**: RESTful API built with FastAPI for quick\
  \ predictions\r\n- ✅ **User-Friendly Interface**: Modern React-based frontend with TailwindCSS\r\n-\
  \ ✅ **SMILES Support**: Accepts standard SMILES notation for chemical structures\r\n\r\n## \U0001F4C8\
  \ Model Performance\r\n\r\n### Model 1 - Performance Metrics\r\n\r\n| Endpoint       | ROC-AUC | Quality\
  \ |\r\n| -------------- | ------- | ------- |\r\n| NR-AR          | 0.7368  | OK      |\r\n| NR-AR-LBD\
  \      | 0.8928  | Very Good |\r\n| NR-AhR         | 0.9077  | Excellent |\r\n| NR-Aromatase   | 0.8724\
  \  | Very Good |\r\n| NR-ER          | 0.7360  | OK      |\r\n| NR-ER-LBD      | 0.8441  | Good    |\r\
  \n| NR-PPAR-gamma  | 0.7988  | Good    |\r\n| SR-ARE         | 0.8686  | Very Good |\r\n| SR-ATAD5 \
  \      | 0.8911  | Excellent |\r\n| SR-HSE         | 0.8066  | Good    |\r\n| SR-MMP         | **0.9334**\
  \ | \U0001F525 Excellent |\r\n| SR-p53         | 0.9012  | Excellent |\r\n\r\n### Model 2 - Cross-Validation\
  \ Performance\r\n\r\n| Target         | CV ROC-AUC Mean | CV ROC-AUC Std |\r\n| -------------- | ---------------\
  \ | -------------- |\r\n| NR-AR          | 0.683816        | 0.021327       |\r\n| NR-AR-LBD      |\
  \ 0.731416        | 0.118572       |\r\n| NR-AhR         | 0.857412        | 0.025826       |\r\n| NR-Aromatase\
  \   | 0.824416        | 0.057662       |\r\n| NR-ER          | 0.594283        | 0.055106       |\r\n\
  | NR-ER-LBD      | 0.752287        | 0.062741       |\r\n| NR-PPAR-gamma  | 0.829249        | 0.115121\
  \       |\r\n| SR-ARE         | 0.715423        | 0.023530       |\r\n| SR-ATAD5       | 0.671591  \
  \      | 0.123325       |\r\n| SR-HSE         | 0.630419        | 0.069702       |\r\n| SR-MMP     \
  \    | 0.898916        | 0.027824       |\r\n| SR-p53         | 0.848296        | 0.095018       |\r\
  \n\r\n**Ensemble Approach**: The final predictions are generated by averaging the outputs of both models,\
  \ resulting in improved reliability and generalization.\r\n\r\n## \U0001F4F8 Screenshots\r\n\r\n###\
  \ Application Interface\r\n\r\n![Drug Toxicity Detector UI - 1](public/1.png)\r\n\r\n![Drug Toxicity\
  \ Detector UI - 2](public/2.png)\r\n\r\n![Drug Toxicity Detector UI - 3](public/3.png)\r\n\r\n## \U0001F3D7\
  ️ Architecture\r\n\r\n### Backend\r\n- **Framework**: FastAPI\r\n- **ML Libraries**: XGBoost, scikit-learn,\
  \ RDKit\r\n- **Server**: Uvicorn with Gunicorn\r\n- **Database**: Model files stored in `saved_models/`\r\
  \n- **Port**: 8000 (default)\r\n\r\n### Frontend\r\n- **Framework**: React with TypeScript\r\n- **Build\
  \ Tool**: Vite\r\n- **Styling**: TailwindCSS\r\n- **Visualization**: 3DMol.js for 3D molecular structures\r\
  \n- **HTTP Client**: Axios\r\n- **Port**: 5173 (development)\r\n\r\n## \U0001F680 Quick Start\r\n\r\n\
  ### Prerequisites\r\n- Python 3.8+\r\n- Node.js 16+\r\n- pip and npm\r\n\r\n### Backend Setup\r\n\r\n\
  1. Navigate to the backend directory:\r\n```bash\r\ncd backend\r\n```\r\n\r\n2. Create a virtual environment:\r\
  \n```bash\r\npython -m venv venv\r\nsource venv/bin/activate  # On Windows: venv\\Scripts\\activate\r\
  \n```\r\n\r\n3. Install dependencies:\r\n```bash\r\npip install -r requirements.txt\r\n```\r\n\r\n4.\
  \ Run the server:\r\n```bash\r\nuvicorn app.main:app --reload\r\n```\r\n\r\nThe API will be available\
  \ at `http://localhost:8000`\r\n\r\n### Frontend Setup\r\n\r\n1. Navigate to the frontend directory:\r\
  \n```bash\r\ncd frontend\r\n```\r\n\r\n2. Install dependencies:\r\n```bash\r\nnpm install\r\n```\r\n\
  \r\n3. Start the development server:\r\n```bash\r\nnpm run dev\r\n```\r\n\r\nThe application will be\
  \ available at `http://localhost:5173`\r\n\r\n## \U0001F4E1 API Endpoints\r\n\r\n### GET `/predict`\r\
  \n\r\nPredicts toxicity for a given chemical compound.\r\n\r\n**Parameters:**\r\n- `smiles` (string):\
  \ SMILES notation of the chemical compound\r\n\r\n**Response:**\r\n```json\r\n{\r\n  \"data\": {\r\n\
  \    \"NR-AR\": 0.45,\r\n    \"NR-AR-LBD\": 0.82,\r\n    \"NR-AhR\": 0.91,\r\n    ...\r\n  }\r\n}\r\n\
  ```\r\n\r\n**Error Response:**\r\n```json\r\n{\r\n  \"error\": \"Invalid SMILES\"\r\n}\r\n```\r\n\r\n\
  **Example:**\r\n```bash\r\ncurl \"http://localhost:8000/predict?smiles=CCO\"\r\n```\r\n\r\n## \U0001F527\
  \ Technology Stack\r\n\r\n### Backend\r\n- FastAPI - Modern Python web framework\r\n- XGBoost - Gradient\
  \ boosting machine learning\r\n- scikit-learn - Machine learning utilities\r\n- RDKit - Cheminformatics\
  \ toolkit\r\n- NumPy & Pandas - Data processing\r\n- python-dotenv - Environment variables\r\n\r\n###\
  \ Frontend\r\n- React 19 - UI library\r\n- TypeScript - Type safety\r\n- Vite - Fast build tool\r\n\
  - TailwindCSS - Utility-first CSS\r\n- 3DMol.js - Molecular visualization\r\n- Axios - HTTP client\r\
  \n\r\n## \U0001F4C1 Project Structure\r\n\r\n```\r\nDrug_Tox/\r\n├── backend/\r\n│   ├── app/\r\n│ \
  \  │   ├── main.py           # FastAPI application\r\n│   │   ├── config.py         # Configuration\
  \ settings\r\n│   │   ├── predictor.py      # Prediction logic\r\n│   │   ├── model_loader.py   # Model\
  \ loading utilities\r\n│   ├── saved_models/         # Trained XGBoost models\r\n│   ├── Dockerfile\
  \            # Docker configuration\r\n│   └── requirements.txt       # Python dependencies\r\n├── frontend/\r\
  \n│   ├── src/\r\n│   │   ├── App.tsx           # Main React component\r\n│   │   ├── component/\r\n\
  │   │   │   ├── Molecule.tsx          # Molecular viewer\r\n│   │   │   ├── PredictionDetails.tsx #\
  \ Results display\r\n│   │   │   └── Loading.tsx           # Loading state\r\n│   │   ├── index.css\
  \         # Global styles\r\n│   │   └── main.tsx          # React entry point\r\n│   ├── public/  \
  \             # Static assets\r\n│   ├── Dockerfile            # Docker configuration\r\n│   ├── package.json\
  \          # Node dependencies\r\n│   └── vite.config.ts        # Vite configuration\r\n└── README.md\r\
  \n```\r\n\r\n## \U0001F433 Docker Deployment\r\n\r\n### Build and Run with Docker\r\n\r\n**Backend:**\r\
  \n```bash\r\ncd backend\r\ndocker build -t drug-tox-backend .\r\ndocker run -p 8000:8000 drug-tox-backend\r\
  \n```\r\n\r\n**Frontend:**\r\n```bash\r\ncd frontend\r\ndocker build -t drug-tox-frontend .\r\ndocker\
  \ run -p 3000:80 drug-tox-frontend\r\n```\r\n\r\n## \U0001F310 Deployment\r\n\r\nThe application is\
  \ configured for deployment on cloud platforms like Render. Update the CORS origins in `backend/app/main.py`\
  \ with your deployed URL.\r\n\r\n## \U0001F4CA Understanding the Predictions\r\n\r\nThe model predicts\
  \ toxicity across 12 biological endpoints:\r\n\r\n- **NR Endpoints** (Nuclear Receptors):\r\n  - NR-AR:\
  \ Androgen Receptor\r\n  - NR-AR-LBD: AR Ligand Binding Domain\r\n  - NR-AhR: Aryl Hydrocarbon Receptor\r\
  \n  - NR-Aromatase: Aromatase enzyme\r\n  - NR-ER: Estrogen Receptor\r\n  - NR-ER-LBD: ER Ligand Binding\
  \ Domain\r\n  - NR-PPAR-gamma: Peroxisome Proliferator-Activated Receptor\r\n\r\n- **SR Endpoints**\
  \ (Stress Response):\r\n  - SR-ARE: Antioxidant Responsive Element\r\n  - SR-ATAD5: ATAD5 enzyme\r\n\
  \  - SR-HSE: Heat Shock Element\r\n  - SR-MMP: Mitochondrial Membrane Potential\r\n  - SR-p53: p53 protein\
  \ pathway\r\n\r\n## \U0001F916 Telegram Bot Integration\r\n\r\nThe application includes a Telegram bot\
  \ that allows users to analyze chemical toxicity directly from Telegram!\r\n\r\n**Bot Username:** `@drug_toxicity_detector_bot`\r\
  \n\r\n### Features\r\n- \U0001F4AC Accepts SMILES strings via Telegram messages\r\n- \U0001F4CA Returns\
  \ detailed toxicity predictions for 12 endpoints\r\n- \U0001F9EC Displays molecular features and risk\
  \ assessment\r\n- ❌ Handles invalid SMILES with helpful error messages\r\n- \U0001F198 Provides `/help`\
  \ and `/start` commands\r\n\r\n### Quick Start with Bot\r\n1. Open Telegram and search for `@drug_toxicity_detector_bot`\r\
  \n2. Click \"Start\" or type `/start` to see welcome message\r\n3. Send any SMILES string (e.g., `CC(=O)Oc1ccccc1C(=O)O`)\r\
  \n4. Bot will analyze and return detailed toxicity predictions!\r\n\r\n### Example Bot Interaction\r\
  \n**You:** `CC(=O)Oc1ccccc1C(=O)O`  \r\n**Bot:**\r\n```\r\n✅ **Toxicity Analysis Results**\r\n\r\n\U0001F9EC\
  \ **SMILES:** CC(=O)Oc1ccccc1C(=O)O\r\n\r\n\U0001F4CA **Predictions (Probability %):**\r\n• NR-AR: 15.2%\r\
  \n• NR-ER: 22.5%\r\n• SR-MMP: 18.3%\r\n[... 12 total targets ...]\r\n\r\n\U0001F4C8 **Overall Risk:**\
  \ \U0001F7E1 MEDIUM\r\n⚖️ **Average Toxicity:** 28.3%\r\n```\r\n\r\n### Bot Commands\r\n- `/start` -\
  \ Welcome message with usage instructions\r\n- `/help` - Detailed help and SMILES format guide\r\n-\
  \ Send any SMILES string for instant toxicity analysis\r\n\r\n### Setup & Deployment\r\nFor detailed\
  \ Telegram bot setup, configuration, and deployment instructions, see [TELEGRAM_BOT_SETUP.md](TELEGRAM_BOT_SETUP.md)\r\
  \n\r\n### Support\r\nType `/help` in the bot for:\r\n- How to get SMILES strings\r\n- Example compounds\r\
  \n- Information about Tox21 targets\r\n- Supported input formats\r\n\r\n## \U0001F510 Security Considerations\r\
  \n\r\n- SMILES input validation is performed on the backend\r\n- CORS is configured to allow specific\
  \ origins\r\n- Environment variables are used for sensitive configuration\r\n- Input sanitization prevents\
  \ invalid chemical structures\r\n\r\n## \U0001F4DD License\r\n\r\nThis project is available for educational\
  \ and research purposes.\r\n\r\n## \U0001F91D Contributing\r\n\r\nContributions are welcome! Please\
  \ feel free to submit pull requests or open issues for bugs and feature requests.\r\n\r\n## \U0001F4E7\
  \ Contact & Support\r\n\r\nFor questions or support, please refer to the project documentation or contact\
  \ the development team.\r\n\r\n---\r\n\r\n**Note**: This is a demonstration project for drug toxicity\
  \ prediction. Always validate results with domain experts before making pharmaceutical decisions.\r\n"

readme_excerpt: "# Comment Toxicity Prediction using Deep Learning\n\nThis repository contains a project\
  \ for predicting toxic comments using a Deep Learning model. The project focuses on identifying various\
  \ types of toxic comments and classifying them into categories like toxic, severe toxic, obscene, threat,\
  \ insult, and identity hate.\n\n## Table of Contents\n\n- [Introduction](#introduction)\n- [Dataset](#dataset)\n\
  - [Installation](#installation)\n- [Usage](#usage)\n- [Model](#model)\n\n## Introduction\n\nComment\
  \ Toxicity Prediction is a crucial task for maintaining a healthy online community by filtering harmful\
  \ or offensive comments. This project aims to build a deep learning model using Bidirectional LSTM to\
  \ classify comments based on their toxicity levels. It provides a reliable method for detecting and\
  \ managing toxic comments on online platforms.\n\n## Dataset\n\nThe dataset used in this project is\
  \ from Kaggle's Jigsaw Toxic Comment Classification Challenge. It contains user comments with labels\
  \ indicating the presence of different types of toxicity. The dataset is split into training and testing\
  \ sets to evaluate the model's performance.\n\n- [Jigsaw Toxic Comment Classification Challenge Dataset\
  \ on Kaggle](https://www.kaggle.com/c/jigsaw-toxic-comment-classification-challenge/data)\n\n## Installation\n\
  \nTo run this project, you need to have Python installed on your machine. You can install the required\
  \ dependencies using `pip`.\n\n```\npip install numpy pandas tensorflow gradio\n```\n\nRequirements\n\
  Python 3.x\nNumPy\nPandas\nTensorFlow\nGradio\n\n## Usage\n\n1. Clone the repository to your local machine:\n\
  \n```\n   git clone https://github.com/srijosh/Comment-Toxicity-Prediction-using-Deep-Learning.git\n\
  \n```\n\n2. Navigate to the project directory:\n   cd Comment-Toxicity-Prediction-using-Deep-Learning\n\
  \n3. Download the dataset from Kaggle and place it in the project folder\n\n4. Open and run the Jupyter\
  \ Notebook:\n   jupyter notebook Toxicity.ipynb\n\n## Model\n\nThe model used in this project is a Bidirectional\
  \ LSTM. The data is preprocessed using text vectorization techniques and trained using deep learning\
  \ layers. Key steps include:\n\n## Data Preprocessing\n\n- Text Vectorization: Converting text into\
  \ sequences using TensorFlow’s TextVectorization layer.\n- Train-Test Split: Splitting the dataset into\
  \ training validation and testing sets for model evaluation.\n\n## Model Training\n\nBidirectional LSTM:\
  \ A sequential deep learning model with an embedding layer, Bidirectional LSTM layers, and dense layers\
  \ to predict multiple toxicity classes.\n\n### Evaluation\n\nThe model is evaluated using the following\
  \ metric:\n\n- Categorical Accuracy: Measures the percentage of correct predictions across multiple\
  \ classes.\n- Precision: Measures the model’s ability to correctly identify toxic comments.\n- Recall:\
  \ Measures the model’s ability to detect all relevant toxic comments.\n"

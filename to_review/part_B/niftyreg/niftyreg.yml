readme_excerpt: "# B-spline registration between CT and CBCT of the same patient using NiftyReg. CT–CBCT\
  \ pairs need affine registration before using the B-spline.\n\n\n# Create environment\nconda env create\
  \ -f environment.yml\n\n# Activate\nconda activate medical_reg\n\n# Search for bin anywhere in your\
  \ environment (This address is needed in bspline.py.)\nfind /path/to/miniconda3/envs/medical_reg/bin\
  \ \n\n\n# Data organization\n\n![alt text](image.png)\n\nEach patient folder contains a CT and several\
  \ CBCTs.\n\n\n# Run the script\npython bspline.py\n\n\n\nNCC will be saved for each patient in the dataDeformed\
  \ folder as ncc_scores.txt. The final average NCC will also be printed at the end.\n\n\n# For more information\
  \ on the B-spline command in NiftyReg, use:\nreg_f3d --help\n"

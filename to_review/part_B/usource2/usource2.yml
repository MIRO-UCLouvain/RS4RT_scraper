readme_excerpt: '# uSource2


  Load in props and materials from Half-Life: Alyx, S&box, and other Source 2 games. Uses HDRP and the
  new Unity 2020 Mesh API.


  Still a work in progress.


  ![](https://i.imgur.com/0COVGBE.png)


  ## Resources


  - .vpk loading - https://github.com/SteamDatabase/ValvePak

  - .vmdl / .vmat decompiling - https://github.com/SteamDatabase/ValveResourceFormat

  - Assets used in the screenshot / sample scene (download these manually and place the .vpk files in
  Resources to use the sample scene) - https://steamcommunity.com/sharedfiles/filedetails/?id=2438227263

  '

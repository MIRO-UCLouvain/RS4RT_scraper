readme_excerpt: "# RTDS2\n\n## Description\n\nRTDS2 is a comprehensive repository for developing, evaluating,\
  \ and applying innovative AI/ML algorithms to reduce variability and improve the accuracy of radiation\
  \ therapy (RT) treatment planning. This project enhances RT providers' performance during pre-treatment\
  \ peer-review processes, aiming to reduce treatment planning errors and improve patient safety across\
  \ multiple cancer sites.\n\n## Specific Aims\n\n### Aim #1\nDevelop and assess the effectiveness of\
  \ innovative AI/ML algorithms focused on reducing RT providers’ variability in key treatment planning\
  \ steps (e.g., defining target volumes, prescribed doses) during pre-treatment peer-review processes\
  \ to improve RT providers’ performance.\n\n- **Hypothesis 1**: Innovative AI/ML algorithms focused on\
  \ reducing physicians’ variability during the pre-treatment peer-review processes will improve RT providers’\
  \ performance during peer-review.\n- **Metrics**: Number/severity of identified treatment planning errors,\
  \ average time to complete pre-treatment peer-review processes, cognitive workload, and perceived usability\
  \ of visual summaries.\n\n### Aim #2\nAssess the impact of our intervention into the RT work system\
  \ on patient safety.\n\n- **Hypothesis 2**: Implementing our intervention into the RT work system will\
  \ improve patient safety.\n- **Metrics**: Number & severity of clinically relevant errors not detected\
  \ during pre-treatment peer-review processes, rate per 1000 RT fractions delivered, evaluated using\
  \ linear mixed effect regression (LMER) model.\n\n\n## Directory Structure\n```plaintext\nRTDS2/\n│\n\
  ├── data/\n│   ├── raw/                   # Raw DICOM files\n│   ├── processed/             # Processed\
  \ images and labels\n│   └── samples/               # Sample data for quick testing\n│\n├── docs/\n\
  │   ├── code_documentation/    # Detailed explanations of codebase\n│   ├── data_documentation/    #\
  \ Information about the data used\n│   ├── models/                # Documentation for each model\n│\
  \   └── project_goals.md       # Overall objectives and goals of the project\n│\n├── notebooks/\n│ \
  \  ├── data_preprocessing.ipynb   # Jupyter notebook for data preprocessing\n│   ├── model_training.ipynb\
  \       # Jupyter notebook for model training\n│   └── evaluation.ipynb           # Jupyter notebook\
  \ for model evaluation\n│\n├── src/\n│   ├── common/                   # Common code shared across models\n\
  │   │   ├── data_loader.py\n│   │   ├── preprocessing.py\n│   │   └── utils.py\n│   │\n│   ├── nodal_coverage/\
  \            # Model-specific directory\n│   │   ├── common/                # Common code for nodal\
  \ coverage model\n│   │   │   ├── preprocessing.py\n│   │   │   └── model.py\n│   │   ├── prostate/\
  \              # Prostate-specific code\n│   │   │   ├── src/\n│   │   │   │   ├── model.py\n│   │ \
  \  │   │   └── train.py\n│   │   │   ├── data/\n│   │   │   ├── notebooks/\n│   │   │   ├── tests/\n\
  │   │   │   ├── .gitignore\n│   │   │   ├── README.md\n│   │   │   ├── requirements.txt\n│   │   │ \
  \  └── setup.py\n│   │   ├── breast/                # Breast-specific code\n│   │   │   ├── src/\n│\
  \   │   │   │   ├── model.py\n│   │   │   │   └── train.py\n│   │   │   ├── data/\n│   │   │   ├── notebooks/\n\
  │   │   │   ├── tests/\n│   │   │   ├── .gitignore\n│   │   │   ├── README.md\n│   │   │   ├── requirements.txt\n\
  │   │   │   └── setup.py\n│   │   └── ...\n│   │\n│   ├── volume_variability/       # Model-specific\
  \ directory\n│   │   ├── common/               # Common code for volume variability model\n│   │   │\
  \   ├── preprocessing.py\n│   │   │   └── model.py\n│   │   ├── prostate/             # Prostate-specific\
  \ code\n│   │   │   ├── src/\n│   │   │   │   ├── model.py\n│   │   │   │   └── train.py\n│   │   │\
  \   ├── data/\n│   │   │   ├── notebooks/\n│   │   │   ├── tests/\n│   │   │   ├── .gitignore\n│   │\
  \   │   ├── README.md\n│   │   │   ├── requirements.txt\n│   │   │   └── setup.py\n│   │   └── ...\n\
  │   │\n│   ├── train.py                   # Common training script\n│   ├── evaluate.py            \
  \    # Common evaluation script\n│\n├── tests/\n│   ├── test_data_loader.py        # Unit tests for\
  \ data loading\n│   ├── test_preprocessing.py      # Unit tests for preprocessing\n│   ├── test_utils.py\
  \              # Unit tests for utility functions\n│\n├── .github/\n│   ├── workflows/\n│   │   ├──\
  \ ci.yml                 # GitHub Actions CI workflow\n│\n├── .gitignore                     # Git ignore\
  \ file\n├── README.md                      # Project README file\n├── requirements.txt             \
  \  # Global requirements file\n└── setup.py                       # Setup script for installing the\
  \ package\n```\n\n## Getting Started\n\n### Prerequisites\n\nMake sure you have the following dependencies\
  \ installed:\n\n- Python 3.x\n- TensorFlow\n- NumPy\n- SciPy\n- Matplotlib\n- DicomRTTool\n\n### Installation\n\
  \n1. Clone the repository:\n    ```bash\n    git clone https://github.com/yourusername/RTPlanAI.git\n\
  \    cd RTPlanAI\n    ```\n\n2. Install the global dependencies:\n    ```bash\n    pip install -r requirements.txt\n\
  \    ```\n\n3. Install the subproject-specific dependencies:\n    ```bash\n    pip install -r projects/prostate/nodal_coverage/requirements.txt\n\
  \    ```\n\n## Usage\n\n1. **Data Preprocessing**:\n    Run the data preprocessing script to convert\
  \ raw DICOM files into numpy arrays and preprocess them for training:\n    ```bash\n    python src/Data/data_loader.py\n\
  \    ```\n\n2. **Model Training**:\n    Train the desired model using the training script:\n    ```bash\n\
  \    python src/train.py --model unet  # Example for U-Net\n    ```\n\n3. **Model Evaluation**:\n  \
  \  Evaluate the trained model on the test dataset:\n    ```bash\n    python src/evaluate.py --model\
  \ unet  # Example for U-Net\n    ```\n\n## Running All Models\n\nTo execute all models across all cancer\
  \ sites, use the `run_all_models.py` script:\n\n```python\nimport os\nimport subprocess\n\n# List of\
  \ all subprojects and models\nsubprojects = [\n    'projects/prostate/nodal_coverage',\n    'projects/lung/nodal_coverage',\n\
  \    # Add other subprojects here\n]\n\n# Command to install subproject-specific requirements\ndef install_requirements(subproject):\n\
  \    subprocess.run(['pip', 'install', '-r', f'{subproject}/requirements.txt'])\n\n# Command to run\
  \ training script\ndef run_training(subproject):\n    subprocess.run(['python', f'{subproject}/src/train.py'])\n\
  \n# Iterate through subprojects, install requirements, and run training\nfor subproject in subprojects:\n\
  \    install_requirements(subproject)\n    run_training(subproject)\n\n```\n## Running All Models\n\n\
  To execute all models across all cancer sites, use the `run_all_models.py` script:\n\n```bash\npython\
  \ src/run_all_models.py\n\n```\n## CI/CD\n\nA GitLab CI/CD pipeline is set up to automate testing and\
  \ deployment:\n\n**`.gitlab-ci.yml`**:\n\n```yaml\nstages:\n  - build\n  - test\n  - deploy\n\nbuild:\n\
  \  stage: build\n  script:\n    - python -m pip install --upgrade pip\n    - pip install -r requirements.txt\n\
  \ntest:\n  stage: test\n  script:\n    - pytest\n\ndeploy:\n  stage: deploy\n  script:\n    - ./deploy.sh\n\
  \  only:\n    - main\n```\n\n## Contributing\n\nContributions are welcome! Please open an issue or submit\
  \ a pull request for any improvements or bug fixes.\n\n## License\n\nThis project is licensed under\
  \ the MIT License - see the [LICENSE](LICENSE) file for details.\n"

readme_excerpt: "# Predaq repo\nImplementation of plan feature extraction in the paper \"Predicting gamma\
  \ passing rates for portal dosimetry based IMRT QA using machine learning\", Medical Physics, 2019.\
  \ Following features are calculated:\n\n\n- BA\tBeam aperture area weighted by MU\n- BI\tBeam irregularity\n\
  - BM\tFraction of BA normalized by UAA\n- UAA\tUnion area of aperture (UAA)\n- MFAS2,5,10,20\tMean of\
  \ fraction of aperture smaller (MFAS) than 2, 5, 10, 20 mm\n- MaxFAS2,5,10,20\tMax of fraction of aperture\
  \ smaller (MaxFAS) than 2, 5, 10, 20 mm\n- MAA\tMean aperture area\n- MAD\tMaximum distance of the mid‐point\
  \ between any open leaf‐pair in a beam\n- MUCP\tMean of MUs per control point in a beam\n- MLO1,2,3,4,5\t\
  Moment order of 1, 2, 3, 4, 5 of leaf openings\n- minAP_h\tMinimum aperture perimeter in horizontal\
  \ direction\n- maxAP_h\tMaximum aperture perimeter in horizontal direction\n- minAP_v\tMinimum aperture\
  \ perimeter in vertical direction\n- maxAP_v\tMaximum aperture perimeter in vertical direction\n- maxRegs\t\
  Maximum number of regions in the beam\n- AAJA\tRatio of the average area of an aperture over the area\
  \ defined by jaws\n- MAXJ\tMaximum of x‐y jaw positions\n- MCS\tModulation complexity score\n- EM\t\
  Edge metric: ratio of MLC side‐length to aperture area\n\n# Usage:\npython plan_complexity -i RP.dcm\
  \ -o output.csv\n\nThe program takes a plan as input and outputs a csv file in which each line is extracted\
  \ features for each beam in the plan  \n\n# Installation\nI recommend Anaconda as Python package manager.\
  \ It comes with numpy. The program needs pydicom package which can be installed by pip: pip install\
  \ pydicom. Please use Python3 as Python2 is no longer supported.\n\nPlease cite our paper if you find\
  \ it useful for your research.  \n@article{lam2019predicting,  \n  title={Predicting gamma passing rates\
  \ for portal dosimetry based IMRT QA using machine learning},  \n  author={Lam, Dao and Zhang, Xizhe\
  \ and Li, Harold and Yang, Deshan and Schott, Brayden and Zhao, Tianyu and Zhang, Weixiong and Mutic,\
  \ Sasa and Sun, Baozhou},  \n  journal={Medical physics},  \n  year={2019},  \n  publisher={Wiley Online\
  \ Library}  \n}\n"

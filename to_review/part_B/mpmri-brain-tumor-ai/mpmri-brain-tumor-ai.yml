readme_excerpt: '# mpMRI Brain Tumor AI Pipeline


  End-to-end multi-parametric MRI pipeline for brain tumor analysis.


  ## Features

  - mpMRI preprocessing

  - Tumor subregion extraction

  - Radiomics + ADC + CBV

  - Batch processing

  - Tumor grading

  - Survival modeling

  - Visual QC


  ## Setup

  ```bash

  conda create -n mpmri python=3.10

  conda activate mpmri

  pip install -r requirements.txt


  '

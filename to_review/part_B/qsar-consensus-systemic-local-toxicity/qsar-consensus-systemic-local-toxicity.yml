readme_excerpt: "# Development of a Consensus-Based QSAR Models for Enhanced Multi-Endpoint Prediction\
  \ of Systemic and Local Toxicities\n\n**FAUZAN SYARIF NURSYAFI¹, MUHAMMAD ADNAN PRAMUDITO², YUNENDAH\
  \ NUR FUADAH³*, and KI MOO LIM¹,⁴,⁵***  \n¹Computational Medicine Lab, Department of Medical IT Convergence\
  \ Engineering, Kumoh National Institute of Technology, Gumi, 39177, Republic of Korea  \n²Computational\
  \ Medicine Lab, Department of IT Convergence Engineering, Kumoh National Institute of Technology, Gumi,\
  \ 39177, Republic of Korea  \n³Telecommunication Engineering Study Program, School of Electrical Engineering,\
  \ Telkom University Main Campus, Bandung, Indonesia  \n⁴Computational Medicine Lab, Department of Biomedical\
  \ Engineering, Kumoh National Institute of Technology, Gumi, 39177, Republic of Korea  \n⁵Meta Heart\
  \ Co., Ltd, Gumi, 39253, Republic of Korea  \n\n*Corresponding authors: [kmlim@kumoh.ac.kr](mailto:kmlim@kumoh.ac.kr),\
  \ [yunendah@telkomuniversity.ac.id](mailto:yunendah@telkomuniversity.ac.id)*\n\n---\n\n## Overview\n\
  \nThis repository contains the code for developing and evaluating **QSAR (Quantitative Structure–Activity\
  \ Relationship)** models for multi-endpoint chemical toxicity prediction. The models employ a **consensus-based\
  \ approach** integrating:\n\n- Multiple molecular fingerprints: **Morgan, MACCS, APF**  \n- Physicochemical\
  \ descriptors  \n- Machine learning algorithms: **Random Forest (RF), XGBoost (XGB), Support Vector\
  \ Machine (SVM)**  \n\nCross-validation ensures robust and reliable model performance.  \n\n---\n\n\
  ## Features\n\n- **Data preprocessing** and descriptor calculation  \n- **Model training** using both\
  \ fingerprint and physicochemical features  \n- **Cross-validation** with manual and original splits\
  \  \n- **Evaluation** of both individual and consensus models  \n- **Datasets included** for training\
  \ and evaluation:\n  - Manual split dataset  \n  - Original split dataset  \n- Ensures reproducibility\
  \ with fixed package versions\n\n\n---\n\n## Dependencies\n\n- **Python 3.x**  \n- **RDKit** (v2025.3.2)\
  \  \n- **CDK-pywrapper** (v0.1.1)  \n- **TensorFlow** (v2.19.0)  \n- **scikit-learn** (v1.6.1)  \n-\
  \ **NumPy** (v2.1.3)  \n- **Pandas** (v2.2.3)  \n- **Additional:** install-jdk (v0.3.0), bounded-pool-executor\
  \ (v0.0.3)  \n\n---\n\n## Usage\n\n### 1. Compute Descriptors\nUse `Descriptor Computation_Preprosesing\
  \ data.ipynb` to calculate molecular fingerprints and physicochemical descriptors for your dataset.\n\
  \n### 2. Train Models\n- `Training_ML_Fingerprint_10foldCrossvalidation.ipynb` for fingerprint-based\
  \ models  \n- `Training_ML_PhysicochemicalProperties_10foldCrossvalidation.ipynb` for physicochemical\
  \ descriptor-based models  \n\n### 3. Evaluate Models\nUse `Model_Evaluation.ipynb` to perform consensus\
  \ evaluation and generate metrics for all models.  \n\n---\n\n## Citation\n\nIf you use this repository\
  \ in your research, please cite:\n\n> **Development of a Consensus-Based QSAR Models for Enhanced Multi-Endpoint\
  \ Prediction of Systemic and Local Toxicities**  \n> FAUZAN SYARIF NURSYAFI¹, MUHAMMAD ADNAN PRAMUDITO²,\
  \ YUNENDAH NUR FUADAH³*, and KI MOO LIM¹,⁴,⁵*  \n"

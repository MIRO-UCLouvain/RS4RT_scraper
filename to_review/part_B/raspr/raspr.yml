readme_excerpt: "# Radiomic Survival Predictor (RaSPr)\nRadiomic Survival Predictor (RaSPr) is a user-friendly\
  \ tool that estimates survival risk for glioblastoma patients using advanced analysis of MRI images.\
  \ By extracting and analyzing a wide range of imaging features such as tumor shape, texture, and intensity,\
  \ RaSPr provides a non-invasive way to predict patient outcomes.\n\n## Features\n\n- Computes the RaSPr\
  \ Score using eight predefined radiomic features.\n- Classifies each row into **High** or **Low** risk\
  \ groups based on a customizable cutoff.\n- Command-line interface for ease of automation.\n- Optional\
  \ CSV output with scores and risk group included.\n- Seamlessly integrated into the **[RadGLO](https://project.iith.ac.in/cgntlab/radglo/raspr.html)**\
  \ web platform for GUI-based execution.\n- Recommended: Use command-line version for batch analysis;\
  \ use **[RadGLO](https://project.iith.ac.in/cgntlab/radglo/raspr.html)** for single-sample predictions.\n\
  \  \n---\n## Dependencies\n\n- R (≥ 3.5.0 recommended)\n- `tidyverse` package\n---\nInstall `tidyverse`\
  \ if not already available:\n\n```r\ninstall.packages(\"tidyverse\")\n```\n\n**NOTE**: Features must\
  \ be extracted only using PyRadiomics and must be scaled using \"scale\" function of R.\n## Feature\
  \ extraction and normalization\nUse this YAML file for extracting features using PyRadiomics\n```bash\n\
  pyradiomics path/to/XYZ_t1.nii.gz path/to/XYZ_seg.nii.gz -p pyradiomics_FE_file.yaml -o path/to/output.txt\n\
  ```\n\n## Usage\n### Clone the Repository\n\nRun the following command in your terminal:\n\n```bash\n\
  git clone https://github.com/CGnTLab/RaSPr.git\n```\n### Navigate to the Directory\n```bash\ncd RaSPr\n\
  ```\n\n1. Via Command Line\n```bash\nRscript raspr_score.R <input_file.csv> [output_file.csv]\n```\n\
  - <input_file.csv>: Path to the input CSV file containing radiomic features.\n- [output_file.csv] (optional):\
  \ Path to save the output CSV file with RaSPr scores and classifications.\n---\n#### Example\n```\n\
  Rscript raspr_score.R example_run.csv results.csv\n```\n---\n2. Within R Console\n```R\nsource(\"raspr_score.R\"\
  )\ncalculate_raspr(\"example_run.csv\", \"output_file.csv\")\n```\n- input_file.csv: Path to the input\
  \ CSV file containing radiomic features.\n- output_file.csv : Path to save output in CSV format with\
  \ RaSPr scores and classifications\n\n---\n## Developer\n\n**Kavita Kundal**  \n**CG&T Lab, Indian Institute\
  \ of Technology Hyderabad**\n\n\U0001F4E9 Email: [cgntlab@gmail.com](mailto:cgntlab@gmail.com)\n\n"

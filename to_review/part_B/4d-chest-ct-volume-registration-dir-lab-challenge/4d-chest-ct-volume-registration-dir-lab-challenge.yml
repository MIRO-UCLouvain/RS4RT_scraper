readme_excerpt: "# 4D Chest CT Volume Registration: DIR-Lab Challenge\n\n## Overview\n\nThis repository\
  \ presents the implementation and analysis of image registration techniques for 4D chest CT volumes\
  \ using the DIR-Lab challenge dataset. The project evaluates **traditional intensity-based methods**\
  \ (ITK Elastix) and **deep learning-based methods** (VoxelMorph) for accurate alignment of thoracic\
  \ images.\n\n### Key Features\n- Preprocessing steps, including **Normalization** and **CLAHE**, to\
  \ enhance image quality.\n- Traditional registration using **rigid and non-rigid transformations** with\
  \ ITK Elastix.\n- Deep learning-based deformable registration with **VoxelMorph**.\n- Extensive analysis\
  \ of **Target Registration Error (TRE)** across various configurations.\n- Insightful comparisons of\
  \ manual and automated segmentation approaches.\n\n---\n\n## Abstract\n\nImage registration is crucial\
  \ for aligning medical images into a common reference frame, enabling effective disease monitoring and\
  \ treatment planning. This project:\n- Achieves the **lowest TRE** of **2.63 ± 2.77 mm** using Elastix\
  \ with mask-guided preprocessing.\n- Highlights the **limitations of deep learning** for large respiratory\
  \ deformations, as VoxelMorph records a TRE of **22.22 ± 8.21 mm**.\n- Emphasizes the importance of\
  \ **hybrid frameworks** to merge traditional methods' accuracy with deep learning's scalability.\n\n\
  ---\n\n## Dataset\n\nThe project uses the **COPDgene dataset**, provided by the National Heart, Lung,\
  \ and Blood Institute, accessed from the [Deformable Image Registration Laboratory](https://www.dir-lab.com/).\
  \ \n\n### Dataset Features:\n- Four cases (COPD1–COPD4) with inhale and exhale CT volumes.\n- Landmarks\
  \ for ground truth evaluation.\n- Image dimensions: 512 × 512 × varying slices.\n\n### Example Visualization:\n\
  ![Inhale vs Exhale CT Volumes](Images/Dataset.png)\n\n---\n\n## Methodology\n\n### Preprocessing\n1.\
  \ **Normalization**: Min-max normalization to standardize intensity values.\n2. **CLAHE**: Improves\
  \ local contrast for better visualization of lung structures.\n\n### Registration Techniques\n1. **Traditional\
  \ Registration with ITK Elastix**\n   - Affine + B-Spline transformations for rigid and non-rigid deformations.\n\
  \   - Mask-guided registration for localized alignment.\n2. **Deep Learning-Based Registration with\
  \ VoxelMorph**\n   - Trains a CNN to predict deformation fields directly.\n   - Experiments include\
  \ preprocessing and alignment strategies.\n\n### Metrics\n- **Target Registration Error (TRE)**: Measures\
  \ alignment accuracy based on anatomical landmarks.\n\n---\n\n## Results & Discussion\n\n### Highlights:\n\
  1. **Best Model**:\n   - Configuration: **Elastix Par11 Affine + B-Spline with masks**.\n   - Overall\
  \ TRE: **2.63 ± 2.77 mm**.\n2. **Deep Learning Challenges**:\n   - VoxelMorph struggles with large deformations,\
  \ recording a TRE of **22.22 ± 8.21 mm**.\n3. **Computational Time**:\n   - Traditional methods: Faster\
  \ preprocessing and alignment.\n   - Deep learning: Longer due to training and inference.\n\n### Key\
  \ Findings:\n- Preprocessing steps significantly enhance registration accuracy.\n- Hybrid approaches\
  \ combining traditional and deep learning methods hold potential for future advancements.\n\n---\n\n\
  ## Visualizations\n\n- TRE Box Plot:\n  \n![TRE Box Plot](Images/boxplot.jpeg)\n\n- Registration Comparison:\n\
  \  \n![Registration Comparison](Images/comparison_a.jpg)\n\n---\n\n## Installation and Usage\n\n###\
  \ Prerequisites\n- Python 3.8+\n- Libraries: TensorFlow, Keras, ITK, NumPy, Matplotlib, Scipy.\n\n###\
  \ Installation\n1. Clone the repository:\n   ```bash\n   git clone https://github.com/<username>/4D-Chest-CT-Volume-Registration-DIR-Lab-Challenge.git\n"

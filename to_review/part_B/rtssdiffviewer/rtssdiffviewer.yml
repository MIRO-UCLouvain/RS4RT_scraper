readme_excerpt: "---\ntitle: RTSS Diff Viewer\nemoji: CT\ncolorFrom: blue\ncolorTo: cyan\nsdk: streamlit\n\
  sdk_version: 1.55.0\napp_file: app.py\npinned: false\n---\n\n# RTSS Diff Viewer\n\nA standalone Streamlit\
  \ app for:\n\n- converting RTSS `.dcm` files to JSON\n- downloading normalized JSON outputs\n- visualizing\
  \ intelligent diffs between two RTSS versions (slice-by-slice for contours)\n- batch-uploading multiple\
  \ variants and switching any two versions for comparison\n- efficiently handling large RTSS files with\
  \ many contour points\n\n## Component Comparison Modes\n\nThe app supports comparing four different\
  \ components:\n\n- **metadata**: DICOM package-level tags using standard unified text diff (fast)\n\
  - **structures**: ROI structure definitions using text diff\n- **references**: Reference frame sequences\
  \ using text diff  \n- **contours**: Point-cloud comparison grouped by slice plane (z-coordinate)\n\
  \  - Optimized for large files with many contour points (>50)\n  - Two-panel left-right layout for easy\
  \ visual comparison\n  - Shows points organized by slice rather than full text diff\n  - Clearly marks\
  \ which ROIs/slices are identical, different, or missing\n  - Much faster and more actionable for clinical\
  \ workflows\n\n## Contour Comparison Features\n\nWhen comparing contour data:\n- **Slice-by-slice organization**:\
  \ Each z-coordinate (slice plane) shown in a collapsible expander\n- **Two-panel layout**: Left file\
  \ contents on the left, right file contents on the right\n- **Visual indicators**:\n  - ✓ Identical\
  \ ROI and points\n  - ⚠️ Different points in ROI  \n  - ⊘ ROI only exists in one file\n  - ✅ Entire\
  \ slice is identical\n  - ❌ No contour data on this slice\n- **Component equality**: When metadata,\
  \ structures, or references are identical, a clear message indicates no differences\n\n## User Workflows\n\
  \n- `Instructions` mode: in-app overview of Pair Mode and Batch Compare usage.\n- `Pair Mode`: upload\
  \ two RTSS files, inspect structured diff by component, and view contour points in 3D.\n- `Batch Compare`:\
  \ upload multiple RTSS files and compare any two using your choice of comparison component.\n\n## Developer\
  \ Setup\n\n```bash\nmake install\nmake run\n```\n\n## Developer Testing\n\n```bash\nmake test\n```\n\
  \nTo install dependencies and run tests in one step:\n\n```bash\nmake test-all\n```\n\n## Hugging Face\
  \ Spaces Deployment\n\nUse the deploy workflow in this repository:\n\n```bash\nmake deploy-init SPACE=amithjkamath/rtssdiffviewer\n\
  make deploy\n```\n\nThis pushes local `deploy` branch to Space `main`.\n"

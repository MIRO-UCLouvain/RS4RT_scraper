readme_excerpt: "# mi-radiomics-app\n\nAplicación Streamlit para cargar y previsualizar imágenes; plantilla\
  \ para integrar extracción de features radiomics.\n\n## Requisitos\n\n- Python 3.8+\n- virtualenv\n\n\
  ## Instalación\n\n1. Clona el repositorio:\n   git clone git@github.com:ventixchile2026-droid/mi-radiomics-app.git\n\
  \   cd mi-radiomics-app\n\n2. Crear un entorno virtual e instalar dependencias:\n   python3 -m venv\
  \ venv\n   source venv/bin/activate   # Windows: .\\venv\\Scripts\\activate\n   pip install -r Requirements.txt\n\
  \n## Uso\n\n- Ejecutar la app:\n   streamlit run app.py\n- Abrir la URL que Streamlit muestre (usualmente\
  \ http://localhost:8501)\n\n## Contribuir\n\n- Crear una rama por feature: git checkout -b feature/descrip\n\
  - Hacer PR al branch main\n\n## Contacto\n\n- ventixchile2026-droid\n"

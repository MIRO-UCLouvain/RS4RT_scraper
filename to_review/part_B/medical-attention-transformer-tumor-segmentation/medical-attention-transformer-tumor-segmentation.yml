readme_excerpt: "# \U0001F9E0 Medical Attention Transformer for Multi-Organ Tumor Segmentation\n\n## \U0001F4CB\
  \ Description\n\nMedical Attention Transformer is an AI-powered medical image segmentation system that\
  \ combines Convolutional Neural Networks (CNNs) and Vision Transformer (ViT)-based UNETR architecture\
  \ to automate tumor segmentation from MRI and CT scans.\n\nThe system assists clinicians by accurately\
  \ identifying tumor regions in brain and liver medical images, reducing manual segmentation effort while\
  \ supporting faster clinical decision-making.\n\n---\n\n## \U0001F3AF Problem Statement\n\nManual tumor\
  \ segmentation from medical imaging is time-consuming, labor-intensive, and subject to inter-observer\
  \ variability. This project leverages deep learning to automate multi-organ tumor segmentation, improving\
  \ consistency and assisting radiologists during diagnosis and treatment planning.\n\n---\n\n## ✨ Key\
  \ Features\n\n- Hybrid CNN + Vision Transformer (UNETR) architecture\n- Automated Brain Tumor Segmentation\
  \ (BraTS Dataset)\n- Automated Liver Tumor Segmentation (Medical Segmentation Decathlon)\n- Medical\
  \ image preprocessing and normalization\n- Data augmentation for improved generalization\n- Hyperparameter\
  \ optimization\n- Dice Score & IoU based evaluation\n- Deep Learning-based medical image analysis\n\n\
  ---\n\n## \U0001F6E0️ Tech Stack\n\n- Python\n- PyTorch\n- MONAI Framework\n- Vision Transformer (ViT)\n\
  - UNETR\n- CNN\n- NumPy\n- OpenCV\n- Google Colab\n\n---\n\n## \U0001F4C2 Dataset\n\n- BraTS (Brain\
  \ Tumor Segmentation Challenge)\n- Medical Segmentation Decathlon (Liver Dataset)\n\n---\n\n## \U0001F680\
  \ How to Run\n\n### Clone Repository\n\n```bash\ngit clone https://github.com/elamaran-2004/Medical-Attention-Transformer-using-CNN.git\n\
  ```\n\n### Navigate to Project\n\n```bash\ncd Medical-Attention-Transformer-using-CNN\n```\n\n### Install\
  \ Dependencies\n\n```bash\npip install -r requirements.txt\n```\n\n### Run the Project\n\n```bash\n\
  python main.py\n```\n\n---\n\n## \U0001F4CA Model Workflow\n\nMedical Images\n        │\n        ▼\n\
  Preprocessing\n        │\n        ▼\nCNN Feature Extraction\n        │\n        ▼\nVision Transformer\
  \ (UNETR)\n        │\n        ▼\nTumor Segmentation\n        │\n        ▼\nEvaluation (Dice Score /\
  \ IoU)\n\n---\n\n## \U0001F3AF Project Outcomes\n\n- Automated multi-organ tumor segmentation\n- Improved\
  \ spatial feature extraction using Vision Transformers\n- Enhanced segmentation accuracy through hybrid\
  \ deep learning\n- Reduced manual intervention during medical image analysis\n\n---\n\n## \U0001F468\
  ‍\U0001F4BB Authors\n\n**Elamaran S**\n\nB.Tech Computer Science & Engineering\n\nSRM Institute of Science\
  \ and Technology\n\n---\n\n## \U0001F4DA Reference\n\nDeveloped as a Final Year Academic Project at\
  \ SRM Institute of Science and Technology.\n"

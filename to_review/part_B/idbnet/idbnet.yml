  \ Tianjin Tao and Xuedong Yuan and Xiaojing Shen and Wenli\n\tLai and Hu Long},\n  title = {An interactive\
  \ dual-branch network for hard palate segmentation of\n\tthe oral cavity from CBCT images},\n  journal\
  \ = {Applied Soft Computing},\n  year = {2022},\n  volume = {129},\n  pages = {109549},\n}\n```\n##\

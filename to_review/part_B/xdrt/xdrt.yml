readme_excerpt: "\nXDRT (XDR Tools)\n================\n\n\n.. image:: https://img.shields.io/pypi/v/xdrt.svg\n\
  \   :target: https://pypi.python.org/pypi/xdrt\n   :alt: pypi\n\n\n.. image:: https://github.com/NKI-AI/xdrt/actions/workflows/pylint.yml/badge.svg\n\
  \   :target: https://github.com/NKI-AI/xdrt/actions/workflows/pylint.yml\n   :alt: Pylint\n\n\n.. image::\
  \ https://github.com/NKI-AI/xdrt/actions/workflows/mypy.yml/badge.svg\n   :target: https://github.com/NKI-AI/xdrt/actions/workflows/mypy.yml\n\
  \   :alt: mypy\n\n\n.. image:: https://github.com/NKI-AI/xdrt/actions/workflows/black.yml/badge.svg\n\
  \   :target: https://github.com/NKI-AI/xdrt/actions/workflows/black.yml\n   :alt: Black\n\n\nXDRT is\
  \ a python toolkit to work with the XDR file format used e.g. by Elekta to store cone-beam CT images\
  \ and as reconstructed by XVI.\nThe reading of complete XVI reconstruction folders is also supported,\
  \ exporting to either an ITK supported format or DICOM, recovering metadata from the XVI files.\n\n\n\
  * Free software: Apache Software License 2.0. Decompression library is public domain, but has a different\n\
  \  `license <xdrt/lib/nki_decompression/LICENSE>`_.\n* Documentation: https://docs.aiforoncology.nl/xdrt/.\n\
  * Installation instructions: https://docs.aiforoncology.nl/xdrt/installation.html.\n\nFeatures\n--------\n\
  \n\n* Utilities to read (compressed) 3D and 4D XDR files in python.\n* Ability to read XVI files and\
  \ link planning scans with cone-beam CT scans.\n* ``xdr2img`` command line utility to convert xdr images\
  \ to ITK supported formats.\n* ``xvi2img`` command line utility converts a fraction (reconstruction)\
  \ to ITK supported formats.\n* ``xvi2dcm`` command line utility converts a fraction (reconstruction)\
  \ to dicom.\n\nHow to use\n----------\n\nThe package needs to compile the decompression library, which\
  \ can be done with:\n``python setup.py install`` or with ``pip install git+https://github.com/NKI-AI/xdrt.git``\n\
  or from PyPi using ``pip install xdrt``. Detailed installation instructions are available in\nthe `documentation\
  \ <https://docs.aiforoncology.nl/xdrt/installation.html>`_.\n\n\n* The command line program ``xdr2img\
  \ image.xdr image.nrrd`` converts images from XDR\n  to any ITK supported format. For more details check\
  \ ``xdr2img --help``.\n* The command line program ``xvi2img`` reads XVI files and combined with the\
  \ XDR files, writes\n  to a new directory and image format. For more details check ``xvi2img --help``.\n\
  \nWork in progress\n^^^^^^^^^^^^^^^^\n\nThis package is work in progress, if you have an image which\
  \ is not properly parsed\nby ``xdrt``\\ , create an issue with the image and expected output.\n\nThe\
  \ following is not yet supported:\n\n\n* Origin is not yet always properly parsed.\n* Only ``uniform``\
  \ grids are currently supported.\n\nCreate an `issue <https://github.com/NKI-AI/xdrt/issues>`_ if this\
  \ is an urgent issue for you.\n"

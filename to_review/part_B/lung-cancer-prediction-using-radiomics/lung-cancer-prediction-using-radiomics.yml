readme_excerpt: "# \U0001FAC1 Lung Cancer Detection System\n\nAn advanced AI-powered lung cancer detection\
  \ system using deep learning with ResNet-50, Feature Pyramid Network (FPN), and Attention mechanisms\
  \ for analyzing CT scan images.\n\n## \U0001F680 Features\n\n- **Advanced Deep Learning Architecture**:\
  \ ResNet-50 backbone with FPN and attention mechanisms\n- **High Accuracy**: 92.3% accuracy on test\
  \ data with 95.6% AUC\n- **Interactive Web Interface**: User-friendly Streamlit application\n- **Real-time\
  \ Prediction**: Upload CT scans and get instant predictions\n- **Comprehensive Analytics**: Detailed\
  \ performance metrics and visualizations\n- **Medical-grade Processing**: Optimized for clinical CT\
  \ scan analysis\n\n## \U0001F4CA Model Performance\n\n| Metric | Score |\n|--------|-------|\n| Accuracy\
  \ | 92.3% |\n| Precision | 0.918 |\n| Recall | 0.925 |\n| F1-Score | 0.921 |\n| AUC-ROC | 0.956 |\n\n\
  ## \U0001F3D7️ Architecture\n\n### Model Components\n- **ResNet-50 Backbone**: Pre-trained feature extractor\
  \ modified for single-channel CT images\n- **Feature Pyramid Network (FPN)**: Multi-scale feature fusion\
  \ for detecting nodules of various sizes\n- **Attention Mechanism**: Channel and spatial attention for\
  \ enhanced feature representation\n- **Advanced Training**: Focal Loss for class imbalance handling\n\
  \n### Technical Specifications\n- **Input Size**: 512 × 512 × 1 (grayscale CT images)\n- **Total Parameters**:\
  \ ~23.5M\n- **Output Classes**: 2 (Cancer/No Cancer)\n- **Framework**: PyTorch\n\n## \U0001F4C1 Project\
  \ Structure\n\n```\nlung-cancer-detection/\n├── app.py                      # Main Streamlit application\n\
  ├── model_architecture.py       # Model definition\n├── data_processing.py          # Data preprocessing\
  \ utilities\n├── models/\n│   ├── final_model.pth        # Trained model weights\n│   └── evaluation_results.json\
  \ # Model performance metrics\n├── data/\n│   ├── train/                 # Training data\n│   ├── validation/\
  \            # Validation data\n│   └── test/                  # Test data\n├── notebooks/\n│   ├──\
  \ training.ipynb         # Model training notebook\n│   └── evaluation.ipynb       # Model evaluation\
  \ notebook\n├── requirements.txt           # Python dependencies\n└── README.md                  # This\
  \ file\n```\n\n## \U0001F6E0️ Installation\n\n### Prerequisites\n- Python 3.8+\n- CUDA-compatible GPU\
  \ (optional, for faster inference)\n\n### Setup Instructions\n\n1. **Clone the repository**\n   ```bash\n\
  \   git clone https://github.com/yourusername/lung-cancer-detection.git\n   cd lung-cancer-detection\n\
  \   ```\n\n2. **Create virtual environment**\n   ```bash\n   python -m venv venv\n   source venv/bin/activate\
  \  # On Windows: venv\\Scripts\\activate\n   ```\n\n3. **Install dependencies**\n   ```bash\n   pip\
  \ install -r requirements.txt\n   ```\n\n4. **Download pre-trained model**\n   ```bash\n   # Download\
  \ the trained model weights (if not included in repo)\n   # Place final_model.pth in the models/ directory\n\
  \   ```\n\n5. **Run the application**\n   ```bash\n   streamlit run app.py\n   ```\n\n## \U0001F4CB\
  \ Requirements\n\n```txt\nstreamlit>=1.28.0\ntorch>=1.11.0\ntorchvision>=0.12.0\nnumpy>=1.21.0\nopencv-python>=4.5.0\n\
  matplotlib>=3.5.0\nseaborn>=0.11.0\nPillow>=8.3.0\nplotly>=5.0.0\nSimpleITK>=2.1.0\npandas>=1.3.0\n\
  scikit-learn>=1.0.0\n```\n\n## \U0001F3AF Usage\n\n### Web Application\n\n1. **Start the application**\n\
  \   ```bash\n   streamlit run app.py\n   ```\n\n2. **Navigate through pages**:\n   - **\U0001F3E0 Home\
  \ & Prediction**: Upload CT scans for analysis\n   - **\U0001F4CA Model Performance**: View detailed\
  \ metrics and benchmarks\n   - **\U0001F52C Model Architecture**: Explore technical details\n   - **\U0001F4DA\
  \ About Dataset**: Learn about LUNA16 dataset\n\n3. **Upload and Analyze**:\n   - Upload CT scan images\
  \ (PNG, JPG, JPEG, DICOM)\n   - Click \"Analyze Image\" for prediction\n   - View results with confidence\
  \ scores\n\n### Programmatic Usage\n\n```python\nfrom model_architecture import LungCancerDetectionModel\n\
  from data_processing import LungSegmentation\nimport torch\n\n# Initialize model\nmodel = LungCancerDetectionModel(num_classes=2,\
  \ input_channels=1)\nmodel.load_state_dict(torch.load('models/final_model.pth'))\nmodel.eval()\n\n#\
  \ Preprocess image\npreprocessor = LungSegmentation(\"\", \"\")\nprocessed_image = preprocessor.preprocess(ct_image)\n\
  \n# Make prediction\nwith torch.no_grad():\n    prediction = model(processed_image)\n    probability\
  \ = torch.softmax(prediction, dim=1)\n```\n\n## \U0001F4CA Dataset\n\nThe model is trained on the **LUNA16\
  \ dataset**, a subset of the LIDC-IDRI dataset:\n\n- **Total Scans**: 888 CT scans\n- **Annotations**:\
  \ 1,186 nodules ≥3mm\n- **Format**: MetaImage (.mhd/.raw)\n- **Source**: 4 radiologists consensus\n\
  - **Quality**: High-quality clinical data\n\n### Data Preprocessing Pipeline\n1. Load CT Scan (.mhd/.raw)\n\
  2. HU Value Normalization (-1000 to 400)\n3. Lung Segmentation (Remove background)\n4. Region of Interest\
  \ Extraction\n5. Resize to 512×512\n6. Data Augmentation (Rotation, Scaling, Flipping)\n7. Normalization\
  \ to [0, 1]\n8. Train/Validation/Test Split (70%/15%/15%)\n\n## \U0001F52C Model Training\n\n### Training\
  \ Configuration\n- **Optimizer**: AdamW\n- **Learning Rate**: 0.001\n- **Batch Size**: 16\n- **Epochs**:\
  \ 50\n- **Loss Function**: Focal Loss (α=1, γ=2)\n\n### Data Augmentation\n- Rotation: ±15 degrees\n\
  - Scaling: 0.9-1.1x\n- Horizontal/Vertical flipping\n- Gaussian noise addition\n\n## \U0001F4C8 Results\n\
  \n### Performance Metrics\n- **Accuracy**: 92.3% (Test set)\n- **Sensitivity**: 92.5%\n- **Specificity**:\
  \ 91.8%\n- **AUC-ROC**: 95.6%\n\n### Benchmark Comparison\n| Model | Accuracy | AUC | Sensitivity |\n\
  |-------|----------|-----|-------------|\n| Our Model | 92.3% | 95.6% | 92.5% |\n| ResNet-50 (Baseline)\
  \ | 87.5% | 91.2% | 85.8% |\n| VGG-16 | 84.2% | 88.7% | 82.1% |\n| Traditional ML | 78.9% | 82.3% |\
  \ 76.5% |\n\n## ⚠️ Important Disclaimers\n\n- **Research Tool**: This system is designed for research\
  \ purposes and screening assistance\n- **Not for Clinical Diagnosis**: Always consult qualified healthcare\
  \ professionals\n- **Supplementary Tool**: Should complement, not replace, professional medical care\n\
  - **Regular Check-ups**: Recommended regardless of AI screening results\n\n### Development Setup\n```bash\n\
  # Install development dependencies\npip install -r requirements-dev.txt\n\n# Run tests\npython -m pytest\
  \ tests/\n\n# Format code\nblack .\nflake8 .\n```\n\n## \U0001F4DA References\n\n1. **LUNA16 Challenge**:\
  \ https://luna16.grand-challenge.org/\n2. **LIDC-IDRI Dataset**: https://wiki.cancerimagingarchive.net/display/Public/LIDC-IDRI\n\
  3. **ResNet Paper**: He, K., et al. \"Deep residual learning for image recognition.\" (2016)\n4. **FPN\
  \ Paper**: Lin, T. Y., et al. \"Feature pyramid networks for object detection.\" (2017)\n5. **Focal\
  \ Loss Paper**: Lin, T. Y., et al. \"Focal loss for dense object detection.\" (2017)\n\n## \U0001F3C6\
  \ Acknowledgments\n\n- LUNA16 Challenge organizers for providing the dataset\n- PyTorch team for the\
  \ deep learning framework\n- Streamlit team for the web application framework\n- Medical imaging community\
  \ for guidance and feedback\n---\n\n**⭐ If you find this project helpful, please consider giving it\
  \ a star!**\n"

readme_excerpt: "# Attention U-Net for Multimodal Brain Tumor Segmentation\n\nA PyTorch implementation\
  \ of an **Attention U-Net** for multiclass brain-tumor segmentation using the four BraTS MRI modalities:\n\
  \n- FLAIR\n- T1\n- T1 contrast-enhanced (T1ce)\n- T2\n\n## Sample output\n\n![alt text](https://github.com/arminnv/Medical-Image-Segmentation/blob/main/results/segmentations/segmentation_sample_1.png?raw=true)\n\
  \n## Project structure\n\n```text\nIMIAP_UNet_Attention_project/\n├── assets/\n│   └── sample_segmentation.png\n\
  ├── checkpoints/\n├── results/\n│   └── segmentations/\n├── scripts/\n│   ├── __init__.py\n│   └── download_data.py\n\
  ├── src/\n│   ├── __init__.py\n│   ├── data.py\n│   ├── losses.py\n│   ├── models.py\n│   ├── train.py\n\
  │   └── visualize.py\n├── config.py\n├── main.py\n├── requirements.txt\n└── IMIAP_UNet_Attention.ipynb\n\
  ```\n\n## Main components\n\n- `src/data.py`: MRI loading, preprocessing, transformations, flips, dataset\
  \ creation, and data loaders.\n- `src/models.py`: Attention U-Net architecture.\n- `src/losses.py`:\
  \ multiclass Dice and cross-entropy loss.\n- `src/train.py`: training, validation, best-checkpoint saving,\
  \ and checkpoint loading.\n- `src/visualize.py`: loss curves and segmentation visualization.\n- `config.py`:\
  \ dataset, training, checkpoint, and output settings.\n- `main.py`: complete training and evaluation\
  \ pipeline.\n\n## Run in Google Colab\n\n### 1. Clone the repository\n\n```bash\ngit clone <YOUR_REPOSITORY_URL>\n\
  %cd IMIAP_UNet_Attention_project\n```\n\n### 2. Install the additional dependencies\n\nGoogle Colab\
  \ already includes PyTorch, torchvision, NumPy, Matplotlib, Pillow, and tqdm.\n\n```bash\n!pip install\
  \ -r requirements.txt\n```\n\n### 3. Download or prepare the dataset\n\n```bash\n!python -m scripts.download_data\n\
  ```\n\nThe default dataset directory is:\n\n```text\n/content/medical_image_data/\n```\n\nThe expected\
  \ subject structure is:\n\n```text\nmedical_image_data/\n└── 001/\n    ├── BraTS20_Training_001_flair.nii\n\
  \    ├── BraTS20_Training_001_t1.nii\n    ├── BraTS20_Training_001_t1ce.nii\n    ├── BraTS20_Training_001_t2.nii\n\
  \    └── BraTS20_Training_001_seg.nii\n```\n\n### 4. Train and evaluate\n\n```bash\n!python main.py\n\
  ```\n\n## Outputs\n\nThe project saves:\n\n- Best model checkpoint in `checkpoints/`\n- Training and\
  \ validation loss curves in `results/`\n- Segmentation examples in `results/segmentations/`\n\n\n"

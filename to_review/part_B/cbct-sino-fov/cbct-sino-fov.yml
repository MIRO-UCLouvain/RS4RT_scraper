  ### Diffusion 模块流程画图 LaTex风格\n```mermaid\nflowchart LR\n  %% ========== Forward diffusion ==========\n\
  \  subgraph Forward[\"Forward diffusion q(x_t | x_{t-1})\"]\n    X0[\"Clean image x0\"] -->|t=1| X1[\"\
  x1 = sqrt(1-beta1)*x0 + sqrt(beta1)*eps\"]\n    X1 -->|t=2| X2[\"x2 = sqrt(1-beta2)*x1 + sqrt(beta2)*eps\"\
  ]\n    X2 --> Xdot[\"...\"] -->|...| XT[\"xT ~ N(0, I)\"]\n  end\n\n  %% ========== Training: predict\
  \ noise ==========\n  subgraph Train[\"Training: predict noise  eps_hat_theta(x_t, t | cond)\"]\n  \
  \  TInput1[\"x_t\"] --> Net((\"UNet / ResUNet\"))\n    TInput2[\"t (timestep)\"] --> Net\n    TCond[\"\
  cond = [noisy_center, mask, (angle)]\"] --> Net\n    Net --> EpsHat[\"eps_hat\"]\n    EpsHat --> Loss[\"\
  L = || eps - eps_hat ||^2\"]\n  end\n\n  %% ========== Reverse generative process ==========\n  subgraph\
  \ Reverse[\"Reverse diffusion p_theta(x_{t-1} | x_t)\"]\n    ZT[\"xT ~ N(0, I)\"] -->|t=T| Rt[\"x_{T-1}\
  \ = mu_theta(x_t,t,cond) + sigma_t * z\"]\n    Rt -->|t=T-1| Rt1[\"x_{T-2} = mu_theta(x_{T-1},t-1,cond)\
  \ + sigma_{t-1} * z\"]\n    Rt1 --> Rdot[\"...\"] --> R1[\"x1\"] --> R0[\"x0_hat (restored)\"]\n  end\n\
  \n  %% ========== Data Consistency (optional per step) ==========\n  subgraph DC[\"Data consistency\
  \ (optional, each step)\"]\n    DCmask[\"mask: 1=center valid, 0=truncated\"]\n    Obs[\"obs: noisy\
  \ center\"]\n    Rule[\"hard DC:  x <- obs*mask + x*(1-mask)<br/>soft DC:  x <- alpha*obs*mask + (1-alpha)*x*mask\
  \ + x*(1-mask)\"]\n  end\n\n  %% connections\n  XT --> Train\n  ZT --> Reverse\n  DCmask -.-> Reverse\n\
  \  Obs -.-> Reverse\n  Rule -.-> Reverse\n\n  classDef gray fill:#f6f6f6,stroke:#aaa,stroke-width:1px,color:#333;\n\
  \  classDef blue fill:#e8f3ff,stroke:#5b8ff9,stroke-width:1px,color:#0b5cad;\n  classDef green fill:#ebfff1,stroke:#34c759,stroke-width:1px,color:#0a6b2b;\n\
  \  class Forward gray\n  class Train blue\n  class Reverse green\n  class DC gray\n\n\n```\n\n\n\n\n\

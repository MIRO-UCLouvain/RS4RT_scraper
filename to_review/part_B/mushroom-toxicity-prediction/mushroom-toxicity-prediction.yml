readme_excerpt: "# \U0001F344 Mushroom Toxicity Prediction\n\nA machine learning web app that predicts\
  \ whether a mushroom is **edible or poisonous** based on its physical characteristics. Built using **Flask**\
  \ and **Scikit-learn**, the app leverages a **Random Forest** classifier trained on the popular UCI\
  \ Mushroom dataset, achieving over **99% accuracy**.\n\n## \U0001F50D About the Project\n\nMushroom\
  \ foraging can be dangerous if toxic species are misidentified. This project helps users assess mushroom\
  \ edibility by providing a simple interface for prediction using trained machine learning models.\n\n\
  ### \U0001F9E0 Features\n- Predicts mushroom edibility (edible/poisonous) based on user input.\n- Interactive\
  \ web UI built with Flask.\n- Uses a Random Forest model trained on categorical mushroom traits.\n-\
  \ Deployed for real-time usage.\n- High prediction accuracy (~99%).\n\n## \U0001F680 Demo\n \n\U0001F4C2\
  \ [GitHub Repository](https://github.com/njoyc/mushroom_toxicity_prediction)\n\n## ⚙️ Tech Stack\n\n\
  - **Python**\n- **Flask**\n- **Scikit-learn**\n- **HTML/CSS**\n- **Jupyter Notebook**\n\n## \U0001F4CA\
  \ Dataset\n\n- **Source**: [UCI Mushroom Dataset](https://archive.ics.uci.edu/ml/datasets/mushroom)\n\
  - **Records**: 8,124 mushrooms\n- **Features**: 22 categorical features (e.g., cap shape, color, odor)\n\
  \n## \U0001F3D7️ How to Run Locally\n\n1. Clone the repository:\n   ```bash\n   git clone https://github.com/njoyc/mushroom_toxicity_prediction.git\n\
  \   cd mushroom_toxicity_prediction\n````\n\n2. Create and activate a virtual environment:\n\n   ```bash\n\
  \   python -m venv venv\n   source venv/bin/activate  # For Windows: venv\\Scripts\\activate\n   ```\n\
  \n3. Install dependencies:\n\n   ```bash\n   pip install -r requirements.txt\n   ```\n\n4. Run the Flask\
  \ app:\n\n   ```bash\n   python app.py\n   ```\n\n5. Open in browser: `http://localhost:5000`\n\n##\
  \ \U0001F4C8 Model Performance\n\n* **Model**: Random Forest Classifier\n* **Accuracy**: 99.3%\n* **Training\
  \ Time**: \\~1 second\n\n## \U0001F4CC Screenshots\n\n![App Screenshot](screenshots/predict_form.png)\n\
  *Prediction form UI*\n\n![Prediction Result](screenshots/result.png)\n*Prediction result displayed after\
  \ submission*\n\n## \U0001F64C Acknowledgments\n\n* [UCI Machine Learning Repository](https://archive.ics.uci.edu/ml/datasets/mushroom)\n\
  * Scikit-learn documentation\n* Flask web framework\n\n## \U0001F4EC Contact\n\n**Author**: [@njoyc](https://github.com/njoyc)\n\
  \U0001F4E7 Email: [your.email@example.com](mailto:your.email@example.com)\n\n---\n\n> ⚠️ Disclaimer:\
  \ This tool is for educational purposes only. Do not consume wild mushrooms based solely on its predictions.\n\
  \n```\n\n\n"

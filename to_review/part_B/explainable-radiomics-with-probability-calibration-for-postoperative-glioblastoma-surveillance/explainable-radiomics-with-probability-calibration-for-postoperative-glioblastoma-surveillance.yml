readme_excerpt: "# Explainable, Modality-Adaptive Radiomics for MGMT Methylation Prediction in High-Grade\
  \ Glioma\n\nThis repository contains the official code accompanying the article:\n\n> Rafail C. Christodoulou,\
  \ Georgios Vamvouras, Rafael Pitsillos,\n> Elena E. Solomou, Michalis F. Georgiou.\n> **Explainable,\
  \ modality-adaptive radiomics for MGMT methylation prediction in high-grade glioma: a decision-curve\
  \ analysis study**.\n> *Frontiers in Oncology* (Neuro-Oncology and Neurosurgical Oncology), 2026.\n\
  > DOI: 10.3389/fonc.2025.1731258\n\n### Contribution Statement\nAll code in this repository, including\
  \ data preprocessing, feature extraction,\ncalibration, training pipelines, explainability, and evaluation\
  \ scripts, was\nentirely designed and implemented by **Georgios Vamvouras**.\n\n## Other Coauthors (Manuscript\
  \ Only)\nThe individuals listed as coauthors in any related manuscript contributed to\nconceptual discussion\
  \ and manuscript writing but **did not write or review** any\nof the code in this repository.\n\nThe\
  \ code implements the complete radiomics & machine learning workflow used in the paper, from multi-modal\
  \ MRI preprocessing and radiomics feature extraction to MGMT label harmonization, model training, explainability,\
  \ and decision-curve analysis.\n\n---\n\n## 1. Repository Contents\n\n**Top-level files:**\n\n* `README.md`\
  \ — main documentation\n* `LICENCE.txt` — license for code usage\n* `AUTHORS.md` — authorship and contribution\
  \ credits\n* `code/` — all Python scripts for extraction, merging, splitting, ranking\n\n---\n\n## 2.\
  \ Scope of This Code\n\nThis repository supports:\n\n1. **Reproduction of the radiomics MGMT prediction\
  \ experiments** described in the paper.\n2. **Transparent implementation** of modality-adaptive radiomics\
  \ with clinical integration.\n3. **Extension** to new cohorts, radiomics settings, and explainability\
  \ modules.\n\nFocus areas:\n\n* High-grade glioma (HGG)\n* MGMT promoter methylation prediction\n* Multi-modal\
  \ MRI radiomics\n* Explainability and interpretation\n* Decision-curve analysis (DCA)\n\n---\n\n## 3.\
  \ Data Requirements\n\nMRI datasets are **not included**, as they are controlled-access. You must:\n\
  \n1. Acquire UCSF and/or UPENN datasets following proper agreements.\n2. Organize files to match expected\
  \ folder structures.\n3. Update paths inside scripts to your local environment.\n\nSee the paper’s *Materials\
  \ and Methods* for full dataset specifications.\n\n---\n\n## 4. Environment & Dependencies\n\nPython\
  \ **3.10+** recommended.\n\nRequired packages include:\n\n* numpy, pandas, scipy\n* SimpleITK, nibabel\n\
  * pyradiomics\n* scikit-learn\n* tqdm\n* openpyxl\n\nInstall minimal requirements:\n\n```\npip install\
  \ numpy pandas scipy scikit-learn SimpleITK nibabel pyradiomics tqdm openpyxl\n```\n\n---\n\n## 5. Workflow\
  \ Overview\n\n### 1) Radiomics Extraction (`pipeline_extract_catalogue__1.py`)\n\n* Scans UCSF + UPENN\
  \ structures\n* Performs in-memory preprocessing (N4, resampling, z-score normalization)\n* Extracts\
  \ PyRadiomics features\n* Saves:\n\n  * `availability_report.csv`\n  * `radiomics_features.csv`\n\n\
  ### 2) Clinical Integration (`collect_dataset__2.py`)\n\n* Merges radiomics with clinical spreadsheets\n\
  * Harmonizes MGMT labels across datasets\n* Exports:\n\n  * `radiomics_features_with_mgmt.xlsx`\n  *\
  \ `collect_dataset__2_report.txt`\n\n### 3) Patient-Aware Split & Feature Ranking (`rank_and_split__4.py`)\n\
  \n* Splits by patient (no leakage)\n* Performs stratification on MGMT\n* Conducts L1-logistic and permutation\
  \ importance\n* Creates Top-K pruned datasets\n* Outputs:\n\n  * `traincv_set__4.xlsx`\n  * `test_set__4.xlsx`\n\
  \  * `importance_traincv__4.csv`\n  * `traincv_set__4_topk.xlsx`\n  * `test_set__4_topk.xlsx`\n\n###\
  \ 4) Clinical Summary (`stats__3.py`)\n\n* Standardizes IDs, MGMT, IDH, age, sex\n* Produces Table-1\
  \ style summary\n* Prints WHO grade distribution (UCSF)\n\n---\n\n## 6. Reproducibility Notes\n\n* Fixed\
  \ random seeds\n* Strict patient-level separation\n* Deterministic preprocessing (mask-driven geometry\
  \ alignment)\n* Test set untouched during feature ranking\n\n---\n\n## 7. How to Cite\n\nIf you use\
  \ this code, please cite:\n\n> Rafail C. Christodoulou, Georgios Vamvouras, Rafael Pitsillos,\n> Elena\
  \ E. Solomou, Michalis F. Georgiou.\n> **Explainable, modality-adaptive radiomics for MGMT methylation\
  \ prediction in high-grade glioma: a decision-curve analysis study**.\n> *Frontiers in Oncology*, 2026.\n\
  > DOI: 10.3389/fonc.2025.1731258\n\n---\n\n## 8. License & Contributions\n\n* Distributed under terms\
  \ described in `LICENCE.txt`.\n* Authors and contributors listed in `AUTHORS.md`.\n\nContributions are\
  \ welcome via pull requests and issues, subject to clinical data rest\n\n"

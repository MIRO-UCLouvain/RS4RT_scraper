readme_excerpt: "# Hybrid Radiomic Feature Fusion for Lung Disease Classification\n\nSemester project\
  \ for **AI Lab** \n\nClassifies **Normal / Bacterial Pneumonia / Viral Pneumonia** from chest X-ray\
  \ images using **hybrid radiomic features** (statistical + GLCM texture + Gabor filters) fused together,\
  \ reduced with PCA, and classified with:\n\n- Logistic Regression\n- Naïve Bayes (best performer ~63–64%)\n\
  - GPU-accelerated SVM (OvR)\n\n## Key Results (80-20 split)\n\n| Model              | Accuracy | Notes\
  \                             |\n|--------------------|----------|-----------------------------------|\n\
  | Naïve Bayes        | 63.26%   | Fastest & most stable             |\n| Logistic Regression| 53.78%\
  \   | Stable baseline                   |\n| SVM                | 51.09%   | Overfits – needs more tuning\
  \      |\n\n## Repository Structure\n\n- `notebooks/`       → exploration & experiments  \n- `data/`\
  \            → link on where the dataset is  \n- `results/`         → figures, metrics, small models\
  \  \n- `reports/`         → final PDF report not yet there if someone wants it message me  \n\n## Dataset\n\
  \nChest X-ray images (Normal / Bacterial / Viral Pneumonia)\n→ Not included due to size → download from\
  \ Kaggle / original source and place in data/file.txt\n\n\n## How to Run (Quick Start)\n\n```bash\n\
  # 1. Clone repo\ngit clone https://github.com/AAB-69/lung-disease-radiomics-ml.git\ncd lung-disease-radiomics-ml\n\
  \n# 2. Install dependencies\npip install -r requirements.txt\n\n# 3. (Recommended) use conda\nconda\
  \ env create -f environment.yml\nconda activate lung-radiomics\n\n# 4. Run main script (example)\npython\
  \ src/train_evaluate.py --split 0.8\n\n```\n\nMade with ❤️ for educational purposes.\n"

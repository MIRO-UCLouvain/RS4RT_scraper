readme_excerpt: "# xai-pharma-study\n\nA reproducible research program on the **reliability of model interpretability\
  \ in\nbiotech/pharma**, built on the [`xai-eval-harness`](../xai-eval-harness).\n\nThis is a **two-paper\
  \ program** (see [`docs/02_publication_plan.md`](docs/02_publication_plan.md)):\n\n1. **Paper 1 — the\
  \ audit.** *Can you trust the explanation?* A systematic reliability\n   audit of post-hoc feature attributions\
  \ (SHAP, LIME, Integrated Gradients) for\n   ADMET/toxicity prediction across the 22 TDC endpoints,\
  \ measuring faithfulness,\n   stability, cross-method agreement, and model-randomization sanity — referenced\n\
  \   against a hard random null, and tested under scaffold (out-of-distribution)\n   splits that mirror\
  \ real deployment on novel chemistry.\n2. **Paper 2 — the framework (gated).** A novel, industry-useful\
  \ interpretability\n   framework demonstrated across omics model types. **Not started until Paper 1\
  \ is\n   manuscript-complete.**\n\n## Why this matters\nRegulators (OECD QSAR framework, EMA 2024 AI/ML\
  \ reflection) expect a *mechanistic\ninterpretation* and *applicability domain* for QSAR/ADMET models,\
  \ and SHAP/LIME are\nbeing positioned to satisfy that. If a method is used to meet a regulatory\nrequirement,\
  \ its reliability for that purpose must be measured — not assumed.\n\n## Scientific commitments\nPreregistered\
  \ hypotheses, random-null reference for every metric, effect sizes +\nCIs over p-values, honest negative/reassuring\
  \ results reported as headlines, full\nreproducibility. See [`docs/01_study_design_preregistration.md`](docs/01_study_design_preregistration.md).\n\
  \n## Status\nSee [`docs/progress_log.md`](docs/progress_log.md) and the live task list. The\nprogram\
  \ advances in scheduled chunks; each chunk updates the log and arms the next.\n\n## Layout\n```\ndocs/\
  \    literature review, preregistration, publication plan, paper-2 concept, progress log\nsrc/     pipeline\
  \ code (featurization, model zoo, experiment driver) — built in P2+\ndata/    cached TDC datasets (gitignored)\n\
  results/ per-cell metrics database, figures, tables — produced in P4/P5\n```\n\n## Reproducing\nWill\
  \ be a one-command rerun once P2 lands. Depends on `xai-eval-harness`\n(installed editable), `PyTDC`,\
  \ `rdkit`, and the harness's ML stack.\n"

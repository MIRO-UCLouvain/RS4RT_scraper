description: Pediatric brain tumor segmentation from multi-parametric MRI remains challenging due to morphological
  differences between pediatric and adult tumors and limited training data. This project applies deep
  learning-based segmentation on the BraTS-PED dataset, exploiting all four co-registered mpMRI sequences
  (T1, T1CE, T2, FLAIR) as multi-channel input

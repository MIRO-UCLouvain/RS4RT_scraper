<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#3498db"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf1"/>
    </linearGradient>
    <linearGradient id="featGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3cd"/>
      <stop offset="100%" stop-color="#ffeaa7"/>
    </linearGradient>
    <linearGradient id="modelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4edda"/>
      <stop offset="100%" stop-color="#a3d9b1"/>
    </linearGradient>
    <linearGradient id="evalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8d7da"/>
      <stop offset="100%" stop-color="#f1b0b7"/>
    </linearGradient>
    <linearGradient id="shapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2d9f3"/>
      <stop offset="100%" stop-color="#c4b0e8"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <rect x="0" y="0" width="1100" height="45" fill="url(#header)" rx="4"/>
  <text x="550" y="29" text-anchor="middle" fill="white" font-size="18" font-weight="bold">BUSI Radiomics ML Pipeline</text>

  <!-- ====== Row 1: Data Source → Feature Extraction ====== -->
  <!-- Data Source -->
  <rect x="40" y="70" width="180" height="85" rx="8" fill="url(#dataGrad)" stroke="#17a2b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="130" y="95" text-anchor="middle" font-weight="bold" fill="#0c5460">🖼️ BUSI Ultrasound</text>
  <text x="130" y="113" text-anchor="middle" font-size="11" fill="#555">Raw images + masks</text>
  <text x="130" y="129" text-anchor="middle" font-size="11" fill="#555">Benign · Malignant · Normal</text>
  <text x="130" y="145" text-anchor="middle" font-size="10" fill="#888">(647 samples)</text>

  <!-- Arrow -->
  <line x1="225" y1="112" x2="260" y2="112" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Feature Extraction -->
  <rect x="265" y="70" width="195" height="85" rx="8" fill="url(#featGrad)" stroke="#e0a800" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="362" y="95" text-anchor="middle" font-weight="bold" fill="#856404">🔬 PyRadiomics</text>
  <text x="362" y="113" text-anchor="middle" font-size="11" fill="#555">2D Shape + GLCM/GLRLM</text>
  <text x="362" y="129" text-anchor="middle" font-size="11" fill="#555">GLSZM/GLDM + First-order</text>
  <text x="362" y="145" text-anchor="middle" font-size="10" fill="#888">→ busi_radiomics_features.csv</text>

  <!-- Arrow -->
  <line x1="465" y1="112" x2="500" y2="112" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- EDA -->
  <rect x="505" y="70" width="180" height="85" rx="8" fill="url(#dataGrad)" stroke="#17a2b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="595" y="95" text-anchor="middle" font-weight="bold" fill="#0c5460">📊 EDA</text>
  <text x="595" y="113" text-anchor="middle" font-size="11" fill="#555">Target distribution</text>
  <text x="595" y="129" text-anchor="middle" font-size="11" fill="#555">Missing value check</text>
  <text x="595" y="145" text-anchor="middle" font-size="11" fill="#555">210 Malignant / 437 Benign</text>

  <!-- Arrow -->
  <line x1="690" y1="112" x2="725" y2="112" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- External Data (top-right) -->
  <rect x="730" y="60" width="195" height="50" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="827" y="82" text-anchor="middle" font-weight="bold" fill="#666">🏥 External Validation</text>
  <text x="827" y="98" text-anchor="middle" font-size="10" fill="#888">BUS-UCLM (263 samples)</text>

  <!-- Arrow from external data down -->
  <line x1="920" y1="110" x2="920" y2="190" stroke="#999" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- ====== Row 2: Statistical Analysis + Feature Selection (converge) ====== -->

  <!-- Branch: Statistical Analysis -->
  <line x1="685" y1="155" x2="685" y2="175" stroke="#555" stroke-width="1.5"/>
  <line x1="505" y1="155" x2="685" y2="175" stroke="#555" stroke-width="1.5"/>

  <!-- Split to two paths -->
  <line x1="685" y1="175" x2="360" y2="195" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="685" y1="175" x2="770" y2="195" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Statistical Analysis -->
  <rect x="180" y="200" width="215" height="100" rx="8" fill="#fef3e0" stroke="#e67e22" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="287" y="222" text-anchor="middle" font-weight="bold" fill="#a0400">📈 Logistic Regression</text>
  <text x="287" y="240" text-anchor="middle" font-size="11" fill="#555">Statsmodels GLM</text>
  <text x="287" y="256" text-anchor="middle" font-size="11" fill="#555">BI-RADS clinical variables</text>
  <text x="287" y="272" text-anchor="middle" font-size="11" fill="#555">Univariate → Multivariable → VIF</text>
  <text x="287" y="290" text-anchor="middle" font-size="10" fill="#888">➜ 5 mandatory features identified</text>

  <!-- Feature Selection -->
  <rect x="620" y="200" width="215" height="100" rx="8" fill="url(#featGrad)" stroke="#e0a800" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="727" y="222" text-anchor="middle" font-weight="bold" fill="#856404">🎯 Feature Selection</text>
  <text x="727" y="240" text-anchor="middle" font-size="11" fill="#555">Mutual Information (top-10)</text>
  <text x="727" y="256" text-anchor="middle" font-size="11" fill="#555">∪ 5 mandatory clinical vars</text>
  <text x="727" y="272" text-anchor="middle" font-size="11" fill="#555">Sphericity binarization</text>
  <text x="727" y="290" text-anchor="middle" font-size="11" fill="#555">Entropy tertiarization (052)</text>

  <!-- Arrows converge -->
  <line x1="287" y1="300" x2="287" y2="335" stroke="#555" stroke-width="1.5"/>
  <line x1="727" y1="300" x2="727" y2="335" stroke="#555" stroke-width="1.5"/>
  <line x1="287" y1="335" x2="507" y2="335" stroke="#555" stroke-width="1.5"/>
  <line x1="727" y1="335" x2="507" y2="335" stroke="#555" stroke-width="1.5"/>
  <line x1="507" y1="335" x2="507" y2="360" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== Row 3: Model Training (two parallel) ====== -->
  <rect x="180" y="365" width="260" height="95" rx="8" fill="url(#modelGrad)" stroke="#28a745" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="310" y="388" text-anchor="middle" font-weight="bold" fill="#155724">🌲 Random Forest</text>
  <text x="310" y="406" text-anchor="middle" font-size="11" fill="#555">500 trees, balanced weights</text>
  <text x="310" y="422" text-anchor="middle" font-size="11" fill="#555">5-fold Stratified CV</text>
  <text x="310" y="438" text-anchor="middle" font-size="11" fill="#155724" font-weight="bold">AUC: 0.909 ± 0.027</text>
  <text x="310" y="454" text-anchor="middle" font-size="11" fill="#555">AP: 0.855</text>

  <rect x="520" y="365" width="260" height="95" rx="8" fill="url(#modelGrad)" stroke="#28a745" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="388" text-anchor="middle" font-weight="bold" fill="#155724">⚡ XGBoost</text>
  <text x="650" y="406" text-anchor="middle" font-size="11" fill="#555">scale_pos_weight, logloss</text>
  <text x="650" y="422" text-anchor="middle" font-size="11" fill="#555">5-fold Stratified CV</text>
  <text x="650" y="438" text-anchor="middle" font-size="11" fill="#155724" font-weight="bold">AUC: 0.932 ± 0.019</text>
  <text x="650" y="454" text-anchor="middle" font-size="11" fill="#555">AP: 0.895</text>

  <!-- Arrows converge from models -->
  <line x1="310" y1="460" x2="310" y2="495" stroke="#555" stroke-width="1.5"/>
  <line x1="650" y1="460" x2="650" y2="495" stroke="#555" stroke-width="1.5"/>
  <line x1="310" y1="495" x2="480" y2="495" stroke="#555" stroke-width="1.5"/>
  <line x1="650" y1="495" x2="480" y2="495" stroke="#555" stroke-width="1.5"/>
  <line x1="480" y1="495" x2="480" y2="520" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== Row 4: Evaluation + SHAP ====== -->
  <rect x="180" y="525" width="260" height="75" rx="8" fill="url(#evalGrad)" stroke="#dc3545" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="310" y="548" text-anchor="middle" font-weight="bold" fill="#721c24">📋 Evaluation</text>
  <text x="310" y="566" text-anchor="middle" font-size="11" fill="#555">ROC · PR · Calibration curves</text>
  <text x="310" y="582" text-anchor="middle" font-size="11" fill="#555">Worst-fold model extraction</text>
  <text x="310" y="596" text-anchor="middle" font-size="10" fill="#888">External validation (263)</text>

  <rect x="520" y="525" width="260" height="75" rx="8" fill="url(#shapGrad)" stroke="#6f42c1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="548" text-anchor="middle" font-weight="bold" fill="#3d1a6d">🔮 SHAP Explainability</text>
  <text x="650" y="566" text-anchor="middle" font-size="11" fill="#555">Beeswarm · Bar · Dependence</text>
  <text x="650" y="582" text-anchor="middle" font-size="11" fill="#555">Waterfall (individual predictions)</text>
  <text x="650" y="596" text-anchor="middle" font-size="10" fill="#888">TreeExplainer (XGBoost)</text>

  <!-- Legend -->
  <rect x="880" y="200" width="195" height="200" rx="6" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="977" y="222" text-anchor="middle" font-weight="bold" font-size="12">Legend</text>
  <rect x="895" y="235" width="20" height="12" rx="2" fill="url(#dataGrad)" stroke="#17a2b8" stroke-width="0.5"/>
  <text x="925" y="246" font-size="11" fill="#333">Data / EDA</text>
  <rect x="895" y="257" width="20" height="12" rx="2" fill="url(#featGrad)" stroke="#e0a800" stroke-width="0.5"/>
  <text x="925" y="268" font-size="11" fill="#333">Feature Engineering</text>
  <rect x="895" y="279" width="20" height="12" rx="2" fill="#fef3e0" stroke="#e67e22" stroke-width="0.5"/>
  <text x="925" y="290" font-size="11" fill="#333">Statistical Analysis</text>
  <rect x="895" y="301" width="20" height="12" rx="2" fill="url(#modelGrad)" stroke="#28a745" stroke-width="0.5"/>
  <text x="925" y="312" font-size="11" fill="#333">Model Training</text>
  <rect x="895" y="323" width="20" height="12" rx="2" fill="url(#evalGrad)" stroke="#dc3545" stroke-width="0.5"/>
  <text x="925" y="334" font-size="11" fill="#333">Evaluation</text>
  <rect x="895" y="345" width="20" height="12" rx="2" fill="url(#shapGrad)" stroke="#6f42c1" stroke-width="0.5"/>
  <text x="925" y="356" font-size="11" fill="#333">Explainability</text>
  <line x1="895" y1="370" x2="1055" y2="370" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="977" y="387" text-anchor="middle" font-size="10" fill="#888">Dataset: BUSI (Baheya Hospital)</text>
  <text x="977" y="400" text-anchor="middle" font-size="10" fill="#888">External: BUS-UCLM (Spain)</text>
</svg>

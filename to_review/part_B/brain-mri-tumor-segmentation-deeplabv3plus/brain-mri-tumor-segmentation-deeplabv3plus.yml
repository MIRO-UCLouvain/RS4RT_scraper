readme_excerpt: "# Brain MRI Tumor Segmentation with DeepLabV3+\n\n[![Open in Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/BensuVarol/brain-mri-tumor-segmentation-deeplabv3plus/blob/main/notebooks/Brain_MRI_Tumor_Segmentation_DeepLabV3Plus_V2.ipynb)\n\
  DeepLabV3+ implementation for pixel-level brain tumor segmentation on MRI slices using an ImageNet-pretrained\
  \ MobileNetV2 encoder.\n\n## Project Overview\n\nBrain tumor segmentation identifies tumor regions at\
  \ the pixel level rather than assigning a single class to an entire MRI image. This project implements\
  \ a reproducible medical image segmentation workflow that includes patient-level data splitting, transfer\
  \ learning, threshold selection, detailed evaluation, and qualitative prediction visualization.\n\n\
  The notebook is designed for Google Colab and downloads the dataset automatically with KaggleHub.\n\n\
  ## Dataset\n\nThe project uses the [LGG MRI Segmentation dataset](https://www.kaggle.com/datasets/mateuszbuda/lgg-mri-segmentation).\
  \ It contains brain MRI slices and corresponding binary tumor masks from 110 patients.\n\nThe dataset\
  \ version used during development contains:\n\n- 3,929 unique image-mask pairs\n- 1,373 tumor-positive\
  \ slices\n- 2,556 tumor-free slices\n\nRaw dataset files are not stored in this repository. The notebook\
  \ downloads them at runtime.\n\n## Methodology\n\nThe workflow includes:\n\n- Automatic dataset download\
  \ with KaggleHub\n- Duplicate-safe image-mask pairing\n- Patient-level train, validation, and test splitting\n\
  - Stratification by patient tumor status\n- MobileNetV2-compatible image preprocessing\n- Training-time\
  \ image augmentation\n- DeepLabV3+ with an ASPP module and MobileNetV2 encoder\n- Decoder warm-up followed\
  \ by encoder fine-tuning\n- Combined binary cross-entropy and Dice loss\n- Validation-only threshold\
  \ selection\n- One-time final test evaluation\n- Prediction-mask and overlay visualization\n\nPatient-level\
  \ splitting prevents slices belonging to the same patient from appearing in multiple subsets and reduces\
  \ data leakage risk.\n\n## Model Architecture\n\nThe model combines:\n\n- MobileNetV2 encoder initialized\
  \ with ImageNet weights\n- Low-level spatial features from the encoder\n- Atrous Spatial Pyramid Pooling\
  \ with multiple dilation rates\n- DeepLabV3+ decoder for spatial reconstruction\n- Single-channel sigmoid\
  \ output for binary segmentation\n\nTraining is performed in two stages:\n\n1. Decoder warm-up while\
  \ the encoder remains frozen\n2. Fine-tuning of the final encoder layers with a lower learning rate\n\
  \n## Evaluation\n\nThe project reports:\n\n- Global Dice score\n- Global Intersection over Union\n-\
  \ Mean per-image Dice and IoU\n- Tumor-positive image Dice and IoU\n- Precision\n- Recall / sensitivity\n\
  - Specificity\n- Pixel accuracy\n- False-positive rate on tumor-free slices\n\nPixel accuracy is not\
  \ interpreted alone because background pixels strongly outnumber tumor pixels.\n\nThe prediction threshold\
  \ is selected using only the validation set. The test set is evaluated once after the threshold has\
  \ been fixed.\n\n## Results\n\nThe cleaned notebook contains the complete evaluation pipeline. Final\
  \ values are generated after running all cells in Colab and are saved to `test_metrics.csv` and `results_summary.json`.\n\
  \nThe following files should be copied from the Colab runtime into the `results/` directory after training:\n\
  \n- `training_curves.png`\n- `prediction_results.png`\n- `validation_threshold_results.csv`\n- `test_metrics.csv`\n\
  - `dataset_split_summary.csv`\n- `results_summary.json`\n\nLarge model checkpoints are excluded from\
  \ GitHub by `.gitignore`.\n\n## Repository Structure\n\n```text\nbrain-mri-tumor-segmentation-deeplabv3plus/\n\
  ├── notebooks/\n│   └── Brain_MRI_Tumor_Segmentation_DeepLabV3Plus_V2.ipynb\n├── data/\n│   └── README.md\n\
  ├── results/\n│   └── README.md\n├── .gitattributes\n├── .gitignore\n├── README.md\n└── requirements.txt\n\
  ```\n\n## How to Run\n\n1. Open the notebook using the Colab badge above.\n2. Select **Runtime > Change\
  \ runtime type > GPU**.\n3. Run all notebook cells in order.\n4. Allow KaggleHub to download the dataset.\n\
  5. Review the selected validation threshold and final test metrics.\n6. Download the generated result\
  \ files if they will be added to the repository.\n\nFor local execution:\n\n```bash\npip install -r\
  \ requirements.txt\n```\n\n## Technologies Used\n\n- Python\n- TensorFlow / Keras\n- OpenCV\n- NumPy\n\
  - Pandas\n- Matplotlib\n- Scikit-learn\n- KaggleHub\n- Google Colab\n\n## Limitations\n\n- The dataset\
  \ contains 2D MRI slices rather than complete 3D volumes.\n- The workflow has not been externally clinically\
  \ validated.\n- Performance may vary across scanners, acquisition protocols, and patient populations.\n\
  - The model is intended for research and educational use only.\n\n## Author\n\n**Bensu Varol**  \nMSc\
  \ Computer Engineering Student  \nSoftware Support Assistant Specialist  \n\nResearch interests: Medical\
  \ Image Analysis, Deep Learning, Computer Vision, Explainable AI, and Healthcare AI.\n\n## Disclaimer\n\
  \nThis project is intended for educational and research purposes. It is not a medical device and must\
  \ not be used for clinical diagnosis or treatment decisions.\n"

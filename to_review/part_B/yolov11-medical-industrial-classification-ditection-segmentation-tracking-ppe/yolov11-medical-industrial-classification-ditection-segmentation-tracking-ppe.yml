readme_excerpt: "\n# \U0001F680 YOLOv11 Medical & Industrial Demos\n\nThis repository showcases the use\
  \ of **Ultralytics YOLOv11 models** for **real-world medical and industrial applications**, including\
  \ \U0001F9E0 **brain tumor detection & segmentation**, \U0001F9BA **PPE detection**, and \U0001F414\
  \ **chicken disease classification**.\n\nAll experiments were trained with **Roboflow datasets** and\
  \ tested in **Google Colab**, with results saved automatically under `/runs/`.\n\n---\n\n## \U0001F4CC\
  \ Features\n\n* Run **YOLOv11 pretrained and custom-trained models** in Colab\n* Perform tasks:\n\n\
  \  * ✅ **Brain Tumor Detection** (Object Detection)\n  * ✅ **Brain Tumor Segmentation** (Instance Segmentation)\n\
  \  * ✅ **PPE Detection** (Safety helmets, vests, etc.)\n  * ✅ **Chicken Disease Classification** (Healthy\
  \ vs Sick)\n* Save predictions automatically in `/content/runs/`\n* Visualize results inline with `.show()`\n\
  * Works on both **images and videos**\n\n---\n\n## \U0001F4C2 Project Structure\n\n```\nYOLOv11-Medical-Industrial-Classification-Ditection-Segmentation-Tracking-PPE/\n\
  │── brain_tumor_detection.ipynb          # Brain tumor object detection\n│── brain_tumor_segmentation.ipynb\
  \       # Brain tumor instance segmentation\n│── ppe_detection.ipynb                  # PPE detection\n\
  │── chicken_disease_classification.ipynb # Chicken disease classification\n│── requirements.txt    \
  \                 # Dependencies\n│── README.md                            # Documentation\n```\n\n\
  ---\n\n## ⚙️ Installation\n\n```bash\n# Clone repository\ngit clone https://github.com/vipunsanjana/YOLOv11-Medical-Industrial-Classification-Ditection-Segmentation-Tracking-PPE.git\n\
  cd YOLOv11-Medical-Industrial-Classification-Ditection-Segmentation-Tracking-PPE\n\n# Install dependencies\
  \ (Python 3.8+ recommended)\npip install -r requirements.txt\n```\n\n---\n\n## \U0001F680 Usage\n\n\
  ### 1. Brain Tumor Detection\n\n```python\nfrom ultralytics import YOLO\n\nmodel = YOLO(\"yolo11n.pt\"\
  )  \nresults = model(\"tumor_scan.jpg\", save=True)  \nresults[0].show()\n```\n\n### 2. PPE Detection\n\
  \n```python\nmodel = YOLO(\"/content/runs/detect/train/weights/best.pt\")  \nresults = model(\"ppe_test.jpg\"\
  , save=True)  \nresults[0].show()\n```\n\n### 3. Brain Tumor Segmentation\n\n```python\nmodel = YOLO(\"\
  yolo11n-seg.pt\")  \nresults = model(\"tumor_scan.jpg\", save=True)  \nresults[0].show()\n```\n\n###\
  \ 4. Chicken Disease Classification\n\n```python\nmodel = YOLO(\"yolo11n-cls.pt\")  \nresults = model(\"\
  chicken.jpg\", save=True)  \nresults[0].show()\n```\n\n---\n\n## \U0001F4CA Example Output\n\n```\n\
  - runs/detect/   → Object Detection results (Brain Tumor, PPE)\n- runs/segment/  → Segmentation results\
  \ (Brain Tumor masks)\n- runs/classify/ → Classification results (Chicken disease)\n```\n\n---\n\n##\
  \ \U0001F6E0️ Tech Stack\n\n* Python 3.8+\n* Ultralytics YOLOv11\n* Roboflow\n* SAM2\n\n---\n\n## \U0001F468\
  ‍\U0001F4BB Author\n\n**Vipun Sanjana**\n*Software Engineer | AI & ML | Fullstack DevOps*\n\n---"

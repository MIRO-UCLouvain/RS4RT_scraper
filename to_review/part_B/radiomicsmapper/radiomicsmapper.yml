readme_excerpt: "# RadiomicsMapper\n\nAn open-source Python toolkit that converts 2D/3D medical images\
  \ into comprehensive radiomics feature maps using sliding window techniques. Supports parallel processing,\
  \ checkpoint resumption, and batch analysis for large-scale radiomics studies.\n# Key Features\n\U0001F3AF\
  \ Precise Feature Extraction\n\nVoxel-wise Analysis: Per-voxel radiomics feature computation\n\nMulti-dimensional\
  \ Support: 2D and 3D feature extraction capabilities\n\nComprehensive Feature Set: Support for firstorder,\
  \ GLCM, GLDM, GLRLM, GLSZM, NGTDM features\n\n\U0001F4CA Flexible Configuration\n\nParameterized Configuration:\
  \ YAML-based feature extraction parameter configuration\n\nDynamic Binning: Customizable intensity binning\
  \ parameters\n\nMultiple Modes: Pure maps, histogram-only, or combined modes\n\n# Requirements\n\nFor\
  \ better experience, you should create a conda environment.\n\nconda create -n pymap python=3.11.7\n\
  \nRequires:\n\n  numpy==1.26.4\n\n  pandas\n\n  SimpleITK\n\n  matplotlib\n\n  six\n\n  tqdm \n\n  PyYAML\
  \  \n\n  openpyxl\n\n# Pipeline\nConsisting of three main components:\n\n`batch_run.py` - Batch processing\
  \ manager with resume capability and parallel execution\n\n`run.py` - Single-image feature extraction\
  \ engine with optimized voxel-wise computation\n\n`get_range.py` - Intensity range analyzer for bin\
  \ parameter optimization\n\n\nWorkflow：\n\nStep 1: Calculate global min/max intensity across dataset\
  \ \n\n`python get_range.py --data images/ --mask masks/`\n\nStep 2: Prepare Bin Parameters\n\nCreate\
  \ `bin.xlsx`\n\nStep 3: Configure Features\n\nEdit `params.yaml` to enable desired feature classes and\
  \ settings.\n\nStep 4: Execute Batch Processing\n\n`python batch_run.py --data images/ --mask masks/\
  \ --output results/ --bin_path bin.xlsx`\n\n# Detailed Parameter Reference\n\n```--process_nums\tNumber\
  \ of parallel processes\n--data\tInput image directory\n--mask\tInput mask directory\n--output\tOutput\
  \ directory for results\n--dim\tProcessing dimension (2D/3D)\n--pad\tPadding size for feature extraction\n\
  --bin_path\tExcel file with bin parameters\n--resume\tEnable resume from previous execution\n--get_hist\t\
  Mode: 0=cal maps, 1=get histogram, 2=both\n--binWidth\tBin width for intensity discretization\n--binWidthupper\t\
  Upper intensity bound\n--binWidthlower\tLower intensity bound\n```\n# Acknowledge\n\nI would like to\
  \ express my sincere gratitude to the FAE project (https://github.com/salan668/FAE) for their integrated\
  \ radiomics feature calculation source code, which served as the foundation for this work.\n\n# Citation\n"

readme_excerpt: "## Source 2 Vmat Files Generator\n\n这是一个用于生成Source 2游戏材质文件（.vmat）的WPF程序。它可以匹配材质文件的后缀以自动生成适用于Source\
  \ 2引擎的.vmat文件。\n\n### 支持的贴图类型：\n\n|   功能   | 支持 |\n|:------:|:--:|\n| 漫反射贴图  | ✔️ |\n|  法线贴图  | ✔️ |\
  \ \n| 粗糙度贴图  | ✔️ |\n|  AO贴图  | ✔️ |\n| 自发光贴图  | ✔️ |\n| 金属度贴图  | ✔️ |\n| Mask贴图 | ❌  |\n| 透明度贴图  |\
  \ ✔️  |\n\n### 注意事项\n该程序是在sbox引擎基础上进行开发和测试的，CS2没测试过，但理论上应该也可以使用。\n\n### 使用方法\n1. 将材质放到materials文件夹下。\n\
  - 目录结构示例：\n```\nmaterials/\n├── metal01/\n│   ├── metal01_diff.png\n│   ├── metal01_roughness.png\n\
  │   └── metal01_normal.png\n├── Wood/\n│   ├── Wood01/\n│       ├── Wood01_diff.png\n│       ├── Wood01_roughness.png\n\
  │       └── Wood01_normal.png\n│   ├── Wood02/\n│       ├── Wood02_diff.png\n│       ├── Wood02_roughness.png\n\
  │       └── Wood02_normal.png\n```\n2. 打开程序，选择游戏和shader，点击创建材质按钮。\n3. 等待生成完成，这时会在materials文件夹下生成vmat文件。\n\
  4. 将生成的vmat文件放到游戏的材质目录下。\n5. 打开游戏编辑器，材质自动编译后就能使用了。\n\n### 系统要求\n- net9.0或更高版本。\n- windows10.0.17763.0\
  \ 或更高版本。\n"

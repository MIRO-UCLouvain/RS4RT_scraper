readme_excerpt: "# Optillipse\n\nIn radiotherapy, the definition of the target volume is vital to successful\
  \ execution. \n\nThe elliptical treatment area must encompass the whole tumor while containing as little\
  \ benign tissue as possible.  \n\nIn response to this challenge, Optillipse was created to optimally\
  \ fit an ellipse to any given shape.\n\n![Alt Text](examples/example-03.gif)\n\nExample usage:\n```python\n\
  from optillipse.model import Model\n\nmodel = Model()\nmodel.load_image(\"examples/01.png\", pad=100)\n\
  model.fit()\n```\n\n## Model\n\n```python\nModel(\n    image=None, \n    steps=100,\n    fn_max=5, \n\

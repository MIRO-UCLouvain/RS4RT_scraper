  \    \n-------------O--A--A---------A--P-----------------------     \n----------Kinetic Algorithm for\
  \ Proton-radiography—---    \n\n\n# KAP\n Kinetic Algorithm for Proton-radiography.   \n\n* electro-magnetic\
  \ fields are set in the input pyhon file   \n\n* protons are described in a kinetic way,   \n  dynamics\
  \ is solved using first order interpolation of em fields   \n\n*code pretends to be parallel.   \n\n\
  stack: C++11, MPI, HDF5, python2-3.   \n_______________________\n#       HOWTO\n_______________________\n\
  1. before 'make' need to set in makefile   \n    HDF5_PATH= path to hdf5 lib   \n    MPI_PATH= path\
  \ to mpi lib   \n    PYTHON_INC= path to python2.7-3 include   \n    PYTHON_LIB= path to python2.7-3\
  \ lib   \n\n2. for running default example from src/input/Initializer.py   \n    mpirun -n 1 kap.exe\
  \    \n\n3. normally need to set input python file   \n    mpirun -n 1 kap.exe PATH/TO/PYTHON/INPUT/FILE\
  \   \n\n4. before running need to create output folder and set in the python file   \n\n5. for visualization\
  \ use python notebook KAP   \n\n\n___________________________________\n#     MPI and HDF5 installation\n\
  ___________________________________\n\ndownload openmpi v 4.0.5 from download.open-mpi.org/release/open-mpi/v4.0/openmpi-4.0.5.tar.gz\n\
  \nextract in folder /TEMP/FLD4INSTALLATION/, go to the folder\n\nrun in terminal:\n1. ./configure --prefix=/FLD2LIBS/openmpi\
  \ CFLAGS=-m64 CXXFLAGS=-m64 FFLAGS=-m64 FCFLAGS=-m64    \n// need to specify 64-bit compilation via\
  \ additional flag that should be passed to ALL compilers\n2. make\n3. make install\n\ndownload hdf5\
  \ v1.10.5 from http://hdfgroup.org/package/hdf5-1-10-5-tar-gz/?wpdmdl=13571\n\nrun in terminal:\n1.\
  \ ./configure --prefix=/FLD2LIBS/hdf5 --enable-parallel CC=/FLD2LIBS/openmpi/bin/mpicc\n2. make\n3.\
  \ make install\n\n\n\n\n\n\n\n"

readme_excerpt: "# Radiotherapy CMS\n\nСистема управління пацієнтами для радіотерапії. Django-додаток\
  \ для ведення обліку пацієнтів, фракцій лікування та медичної документації.\n\n## Функціональність\n\
  \n- Управління пацієнтами (додавання, редагування, архівування)\n- Ведення фракцій лікування\n- Система\
  \ ролей (лікар, медсестра, адміністратор)\n- Медична документація\n- Архівування пацієнтів\n- Пошук\
  \ та фільтрація\n\n## Технології\n\n- Django 5.2.3\n- PostgreSQL\n- Bootstrap\n- Python 3.11+\n\n##\
  \ Локальне розгортання\n\n1. Клонуйте репозиторій:\n```bash\ngit clone https://github.com/your-username/radiotherapy_cms.git\n\
  cd radiotherapy_cms\n```\n\n2. Створіть віртуальне середовище:\n```bash\npython -m venv venv\nsource\
  \ venv/bin/activate  # Linux/Mac\n# або\nvenv\\Scripts\\activate  # Windows\n```\n\n3. Встановіть залежності:\n\
  ```bash\npip install -r requirements.txt\n```\n\n4. Створіть файл `.env` з налаштуваннями:\n```\nSECRET_KEY=your-secret-key\n\
  DEBUG=True\nDATABASE_URL=postgresql://user:password@localhost:5432/dbname\n```\n\n5. Виконайте міграції:\n\
  ```bash\npython manage.py migrate\n```\n\n6. Створіть суперкористувача:\n```bash\npython manage.py createsuperuser\n\
  ```\n\n7. Запустіть сервер:\n```bash\npython manage.py runserver\n```\n\n## Розгортання на Render\n\n\
  1. Створіть новий Web Service на Render\n2. Підключіть GitHub репозиторій\n3. Налаштуйте змінні середовища:\n\
  \   - `SECRET_KEY`\n   - `DEBUG=False`\n   - `DATABASE_URL` (автоматично створюється Render)\n4. Build\
  \ Command: `./build.sh`\n5. Start Command: `gunicorn cms_django.wsgi:application`\n\n## Структура проєкту\n\
  \n```\ndjango_cms/\n├── cms_django/          # Основні налаштування Django\n├── patients/          \
  \  # Додаток для управління пацієнтами\n├── templates/           # HTML шаблони\n├── static/       \
  \       # Статичні файли\n├── manage.py           # Django management script\n├── requirements.txt \
  \   # Python залежності\n├── build.sh           # Скрипт для розгортання\n└── README.md          # Цей\
  \ файл\n```\n\n## Ліцензія\n\nMIT License "

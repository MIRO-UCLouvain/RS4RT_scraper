readme_excerpt: "# Enhancing-organ-at-risk-segmentation-with-improved-deep-neural-networks\n\nABSTRACT:\
  \ \n\nOrgan at risk (OAR) segmentation is a crucial step for treatment planning and outcome determination\
  \ in\nradiotherapy treatments of cancer patients. Several deep learning based segmentation algorithms\
  \ have been\ndeveloped in recent years, however, U-Net remains the de facto algorithm designed specifically\
  \ for biomedical\nimage segmentation and has spawned many variants with known weaknesses. In this study,\
  \ our goal is to present\nsimple architectural changes in U-Net to improve its accuracy and generalization\
  \ properties. Unlike many other\navailable studies evaluating their algorithms on single center data,\
  \ we thoroughly evaluate several variations of\nU-Net as well as our proposed enhanced architecture\
  \ on multiple data sets for an extensive and reliable study of\nthe OAR segmentation problem. Our enhanced\
  \ segmentation model includes (a)architectural changes in the loss\nfunction, (b)optimization framework,\
  \ and (c)convolution type. Testing on three publicly available multi-object\nsegmentation data sets,\
  \ we achieved an average of 80% dice score compared to the baseline U-Net performance of 63%.\n\nhttps://arxiv.org/pdf/2202.01866.pdf\n"

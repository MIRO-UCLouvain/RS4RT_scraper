readme_excerpt: "## dvhdrmkvtomp4\nConvert any Dolby Vision/HDR10+ MKV to MP4 that runs on many devices\n\
  \nConverts any Dolby Vision (Profile 5, 7 Single Track, 7 Dual Track, 8) / HDR10+ mkv to mp4 (DV4, DV5,\
  \ DV8) compatible with LG OLEDs, Nvidia Shield and possibly more tested with Emby on LG 77CX, 48CX,\
  \ 65C8\n\nFeuatures:\n- autodetects source material and chooses proper workflow\n- converting from any\
  \ 5,7,8 DV profile to DV mp4\n- converting from HDR10+ to DV8 mp4\n- verifies HDR10+ metadata before\
  \ conversion (lots of fake releases out there)\n- converts any truehd, dts etc to high bitrate Dolby\
  \ Digital Plus, copies without conversion supported tracks like ac3, eac3\n- keeps chapters\n- converts\
  \ PGS subtitiles found to SRT subtitiles with PGSToSRT\n- extracts all SRT/Subrip tracks to SRT files\n\
  - can create backup mkv with .asm extension (audio subs meta) that has the original audio (truehd etc)\
  \ subtitles tracks, chapters but without video to safekeep for future comeback conversions to original\
  \ mkv and not waste place as you can easily demux the mp4 video and mux it with that mkv to come back\
  \ to original\n- can filter and leave only desired language tracks\n\n# Requirements\n- ffmpeg 4.4\n\
  - **mp4box 1.0.1 - it's important to use this version otherwise script will fail**\n- dovi_tool\n- hdr10plus_tool\n\
  - mediainfo v21\n- dotnet5 for PGS2SRT conversion\n- 3xSize of free space for file you want to convert\n\
  \n# Requirements install on Ubuntu 20.04\n```\n# MEDIAINFO MKVTOOLNIX FFMPEG\nsudo add-apt-repository\
  \ ppa:savoury1/ffmpeg4\nsudo wget -O /usr/share/keyrings/gpg-pub-moritzbunkus.gpg https://mkvtoolnix.download/gpg-pub-moritzbunkus.gpg\n\
  echo \"deb [arch=amd64 signed-by=/usr/share/keyrings/gpg-pub-moritzbunkus.gpg] https://mkvtoolnix.download/ubuntu/\
  \ focal main\" | sudo tee -a /etc/apt/sources.list\nwget https://mediaarea.net/repo/deb/repo-mediaarea_1.0-19_all.deb\
  \ && sudo dpkg -i repo-mediaarea_1.0-19_all.deb && sudo apt-get update\nsudo apt-get install ffmpeg\
  \ mediainfo mkvtoolnix\n# DOVI_TOOL\nwget https://github.com/quietvoid/dovi_tool/releases/download/1.4.6/dovi_tool-1.4.6-x86_64-unknown-linux-musl.tar.gz\n\
  tar -zxf dovi_tool-1.4.6-x86_64-unknown-linux-musl.tar.gz\nsudo mv dist/dovi_tool /usr/local/bin/\n\
  # HDR10PLUS_TOOL\nwget https://github.com/quietvoid/hdr10plus_tool/releases/download/1.2.2/hdr10plus_tool-1.2.2-x86_64-unknown-linux-musl.tar.gz\n\
  tar -zxf hdr10plus_tool-1.2.2-x86_64-unknown-linux-musl.tar.gz\nsudo mv dist/hdr10plus_tool /usr/local/bin/\n\
  # MP4BOX\nsudo apt-get install build-essential pkg-config git\nsudo apt-get install zlib1g-dev\ngit\
  \ clone https://github.com/gpac/gpac.git gpac_public\ncd gpac_public\ngit checkout v1.0.1 \n./configure\
  \ --static-bin\nmake\nsudo make install\nMP4Box -version # MAKE SURE IT SAYS 1.0.1\n# PGS2SRT\nwget\
  \ https://download.visualstudio.microsoft.com/download/pr/546d50b2-d85c-433f-b13b-b896f1bc1916/17d7bbb674bf67c3d490489b20a437b7/dotnet-runtime-5.0.15-linux-x64.tar.gz\n\
  tar -zxf dotnet-runtime-5.0.15-linux-x64.tar.gz\nsudo mkdir /opt/dotnet\nsudo mv * /opt/dotnet\ncd /opt\n\
  sudo apt install libtesseract4\nsudo mkdir /opt/PgsToSrt\ncd /opt/PgsToSrt\nsudo wget https://github.com/Tentacule/PgsToSrt/releases/download/v1.4.2/PgsToSrt-1.4.2.zip\n\
  sudo unzip PgsToSrt-1.4.2.zip\ncd net5\nsudo git clone https://github.com/tesseract-ocr/tessdata.git\n\
  ```\n\n# Installation\nDownload dvmkv2mp4 make it executable and move\n```\nwget https://raw.githubusercontent.com/SASUKE-DUCK/dvhdrmkvtomp4/main/dvhdrmkvtomp4\n\
  chmod a+x dvmkv2mp4\nmv dvmkv2mp4 /usr/local/bin/\n```\n# Usage\n```\nIn directory containing Dolby\
  \ Vision mkv simply run `dvmkv2mp4`it will process any mkvs found in that dir\nOptions:\n-l | --langs\
  \          - filter audio and subtitle tracks by lang comma separated if not hit by filter keep all\
  \ tracks\n-a | --asm            - create audio-subs-meta mkv file\n-r | --remove-source  - remove source\
  \ video after conversion\n-d | --debug          - keep intermediary conversion files\n-v | --version\
  \        - print version\n\ndvmkv2mp4 -l und,pol,eng -r -a # will process mkvs found in folder keep\
  \ only undefined, Polish and English tracks, will remove source file once done and will create audio-subs-meta\
  \ file for future needs\n```\n\n# Docker (experimental)\nThe following section assumes that you installed\
  \ Docker on your machine. For further instruction to install Docker follow the official site: https://docs.docker.com/get-docker/\n\
  \n## Build Docker image\nCurrently the image works only on x64 Linux. Also note that the final image\
  \ size will be close to 6 GB which is normal as it includes the Tesseract OCR models.\n\nTo build your\
  \ Docker image run the following command:\n```\ndocker build -t dvmkv2mp4  https://github.com/SASUKE-DUCK/dvhdrmkvtomp4.git#main\
  \ -f docker/Dockerfile\n```\n## Use the Docker image\nThe usage is similar to the normal variant but\
  \ here you need to attach your folder where you would like to convert your files. You can also add the\
  \ flags at the end of the command.\n\nExample:\n```\n# docker run -it --rm -v <YOUR_FOLDER_PATH>:/convert\
  \ dvmkv2mp4\n\ndocker run -it --rm -v /media/mkvvideos:/convert dvmkv2mp4 -l und,pol,eng -r -a\n```\n\
  This example does the same which is mentioned in setion Usage.\n\n# Roadmap\n- fix sound delay in output\
  \ mp4 when source mkv had audio streams with audio delay tag\n- github action to build ready docker\
  \ images for pulling\n- on MP4Box fail rerun with -no-probe switch which works with stubborn releases\n\
  - helper scripts for Radarr, Sonarr to automatically run on import\n- convert directly from Bluray bdmv\
  \ mpls file (have it working in alpha state already)\n\n# Shoutouts\n* to @quietvoid for dovi_tool and\
  \ hdr10plus_tool this whole thing wouldn't be possible without him\n* to @szasza576 for dockerfile\n\
  * to makeMKV and avsForum for inspiration to work it out and put it all together\n"

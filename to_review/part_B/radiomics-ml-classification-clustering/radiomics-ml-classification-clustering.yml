readme_excerpt: '# Radiomics ML: Classification and Clustering


  This project explores machine learning techniques applied to radiomic features extracted from medical
  images, focusing on both supervised and unsupervised learning tasks.


  ##  Overview


  The dataset consists of radiomic features derived from regions of interest in mammography images. The
  goal is to:


  - Classify lesions as **BENIGN** or **MALIGNANT**

  - Identify patterns using **unsupervised clustering**


  ## Techniques Used


  ### Supervised Learning

  - Decision Tree

  - Multi-Layer Perceptron (MLP)


  ### Unsupervised Learning

  - K-Means Clustering

  - Hierarchical Clustering


  ### Preprocessing

  - Handling missing values

  - Feature scaling

  - Dimensionality reduction (PCA / feature selection)


  ### Evaluation Metrics

  - F1-score

  - Confusion Matrix

  - ROC Curve and AUC


  ---


  ##  Dataset


  - 2018 samples

  - 116 radiomic features

  - Binary classification: BENIGN vs MALIGNANT


  ---


  ##  Experiments


  - Comparison between models with and without dimensionality reduction

  - Selection of optimal K using the elbow method

  - Evaluation of clustering quality using appropriate metrics


  ---


  ##  How to Run


  ### 1. Clone the repository

  ```bash

  git clone git@github.com:ALauraFM/radiomics-ml-classification-clustering.git

  cd radiomics-ml-classification-clustering'

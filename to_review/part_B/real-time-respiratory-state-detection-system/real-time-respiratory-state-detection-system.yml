readme_excerpt: "#  Multimodal Real-Time Respiratory State Detection System \n\nDetecting breath-hold\
  \ (**BH**) and deep-breathing (**DB**) episodes against normal breathing (**NB**) from wearable ECG\
  \ using HRV/EDR-derived features — moving from a hand-engineered feature pipeline through classical\
  \ ML up to graph neural networks, all evaluated with subject-level (LOSO) cross-validation.\n\nSignal\
  \ source: Zephyr BioHarness ECG (250 Hz), annotated against a breath-protocol reference (`DBInfo.xlsx`).\n\
  \n---\n\n## Pipeline Overview\n\n```\n1. Feature Extraction   →  2. Baseline Model   →  3. Feature Selection\n\
  \                                                          │\n                                     \
  \                     ▼\n                              5. Traditional Models  ←  4. Optimized Feature\
  \ Test\n                                                          │\n                              \
  \                            ▼\n                                                6. Graph Neural Networks\n\
  ```\n\nEach stage consumes the CSV produced by the previous one. Window size (WS15 / WS20 / WS30 seconds)\
  \ is a variable explored throughout — most later experiments converge on **WS20**.\n\n---\n\n## 1. Feature\
  \ Extraction — `1_feature_extraction`\n\nTurns raw ECG + annotation files into a labelled, windowed\
  \ feature table.\n\n- **Windowing:** sliding window over the ECG stream (`WINDOW_SEC` ∈ {15, 20, 30},\
  \ `STEP_SEC = 1`, `FS = 250 Hz`)\n- **Labelling:** overlap-based against BH/DB annotations\n  - ≥80%\
  \ overlap → labelled BH or DB\n  - ≤20% overlap with either → labelled NB\n  - 20–80% (transition/buffer\
  \ zone) → dropped\n- **Raw features (12):** `Mean_RR, SDNN, RMSSD, pNN50, CV_RR, LF, HF, LF_HF_Ratio,\
  \ EDR_Mean_Amp, EDR_Std_Amp, EDR_Peak_to_Peak, Shannon_Entropy`\n- **Derived features:** each raw feature\
  \ expanded into `_Delta` (change from personal baseline) and `_Ratio` (normalized to personal baseline)\
  \ variants, giving the full engineered feature set\n- **Output:** `BH_DB_Features_WS{15,20,30}.csv`\
  \ — one row per window, per subject, with `Subject`, `Category`, and all raw + derived features\n\n\
  ## 2. Baseline Model Test — `2_baseline_model_test`\n\nFirst pass at classification on the **full**\
  \ feature set (20 active features after dropping dead LF variants).\n\n- Random Forest, class-weighted\
  \ for imbalance (`{NB: 1, BH: 20, DB: 20}`)\n- **LOSO (Leave-One-Subject-Out)** cross-validation — every\
  \ subject held out once as the test set\n- Metrics: accuracy, precision/recall/F1 (per class), ROC-AUC,\
  \ PR-AUC, confusion matrix\n- Establishes the performance floor before any feature pruning\n\n## 3.\
  \ Feature Selection — `3_feature_selection`\n\nStatistically prunes the feature set per window size.\n\
  \n- **Paired Wilcoxon signed-rank test** (α = 0.05), each intervention (BH, DB) vs. the NB baseline,\
  \ aggregated per subject\n- Drops features with no significant separation from NB, plus explicitly dead\
  \ features (`LF_*`, `LF_HF_Ratio_*`)\n- Cross-checks remaining features for multicollinearity (VIF)\n\
  - **Output:** an optimized ~8-feature list (`G_LIST`) per window size, replacing the 20-feature baseline\
  \ set:\n  - Primary BH detectors: `pNN50_Ratio`, `pNN50_Delta`, `HF_Ratio`\n  - Secondary HRV/ANS: `RMSSD_Ratio`,\
  \ `Mean_RR_Ratio`, `Shannon_Entropy_Ratio`\n  - DB isolators: `EDR_Std_Amp_Ratio`, `EDR_Mean_Amp_Delta`\n\
  \n## 4. Optimized Feature Test — `4_optimized_features_test`\n\nRe-runs the same RF + LOSO evaluation\
  \ as stage 2, but on the reduced 8-feature `G_LIST` from stage 3 — validating that the pruned set matches\
  \ or beats the 20-feature baseline with a much smaller, less collinear feature space.\n\n## 5. Traditional\
  \ Models — `5_traditional_models`\n\nDeeper, model-specific tuning on the optimized feature set, run\
  \ across four classical classifiers: **Random Forest, SVM, XGBoost, LightGBM**.\n\nProgressive refinements\
  \ layered on top of plain LOSO:\n- **Personalized Bayesian / NB calibration** — per-subject probability\
  \ recalibration against their own normal-breathing baseline\n- **Youden-J thresholding** — optimal decision\
  \ threshold from OOB/CV probabilities rather than a flat 0.5 cutoff\n- **Schmitt hysteresis** — prevents\
  \ label flicker between adjacent windows\n- **Winsorising** — per-fold outlier clipping (P1–P99) fit\
  \ only on training data, avoiding leakage\n- **Minimum-duration enforcement** — clinically-informed\
  \ floor on episode length (BH ≥ 5s, DB ≥ 3s)\n- **Hyperparameter tuning** for XGBoost/LightGBM variants\n\
  - Comparison plots: AUPRC across model iterations, t-SNE visualization of the feature space, per-model\
  \ evolution plots\n\n## 6. Graph Neural Networks — `6_GNN_complete`\n\nReframes each subject's windowed\
  \ features as a graph and applies GNNs instead of tabular classifiers, testing two graph constructions\
  \ × two architectures × three loss functions.\n\n**Graph construction:**\n- **Temporal edge (T-)** —\
  \ windows connected to their temporal neighbors (sequence-aware)\n- **Feature similarity (FS-)** — windows\
  \ connected via k-NN in feature space\n\n**Architectures:**\n- **GCN** (`GCNConv`) — standard graph\
  \ convolution\n- **GIN** (`GINConv`) — Graph Isomorphism Network, stronger expressive power\n\n**Loss\
  \ functions, evaluated for each graph × architecture combination:**\n- Cross-Entropy (CE)\n- Focal Tversky\
  \ Loss (FTL) — tuned for the BH/DB minority classes\n- Combo Loss (CE + FTL)\n\nShared clinical safeguards\
  \ carried over from stage 5: 8-feature optimized list, per-fold winsorising, minimum-duration enforcement,\
  \ balanced batching (`NeighborLoader` + `WeightedRandomSampler`), and full LOSO evaluation. Comparison\
  \ plots included for loss evolution and cross-configuration performance (GCN vs. GIN, temporal vs. feature-similarity,\
  \ per loss function).\n\n---\n\n## Evaluation Protocol (consistent throughout)\n\n- **LOSO cross-validation**\
  \ — one subject fully held out per fold, across all six stages\n- **3-class problem:** `NB = 0`, `BH\
  \ = 1`, `DB = 2`, with heavy class weighting for the minority BH/DB classes\n- **No leakage** — scaling,\
  \ winsorising, and calibration are always fit on training folds only\n\n## Repo Structure\n\n```\n1_feature_extraction.ipynb\
  \          # raw ECG → windowed feature CSV\n2_baseline_model_test.ipynb         # RF baseline, full\
  \ feature set\n3_feature_selection.ipynb           # Wilcoxon-based feature pruning\n4_optimized_features_test.ipynb\
  \     # RF re-test on pruned features\n5_traditional_models.ipynb          # RF / SVM / XGBoost / LightGBM,\
  \ calibrated\n6_GNN_complete.ipynb                # T-GCN / T-GIN / FS-GCN / FS-GIN, 3 losses each\n\
  ```\n"

readme_excerpt: "# DIF-Net\nYiqun Lin, Zhongjin Luo, Wei Zhao, Xiaomeng Li, \"Learning Deep Intensity\
  \ Field for Extremely Sparse-View CBCT Reconstruction,\" MICCAI 2023. [[paper]](https://arxiv.org/abs/2303.06681)\n\
  \n## 0. Citation\n\n```\n@inproceedings{lin2023learning,\n  title=\"Learning Deep Intensity Field for\
  \ Extremely Sparse-View CBCT Reconstruction\",\n  author=\"Lin, Yiqun and Luo, Zhongjin and Zhao, Wei\
  \ and Li, Xiaomeng\",\n  booktitle=\"Medical Image Computing and Computer Assisted Intervention -- MICCAI\
  \ 2023\",\n  pages=\"13--23\",\n  year=\"2023\",\n  publisher=\"Springer Nature Switzerland\"\n}\n```\n\
  \n## 1. Installation\n\n```\ntorch 1.8.0\nnumpy, opencv-python, SimpleITK\n```\n\n## 2. Data Preparation\n\
  \nPlease follow the scripts (4 steps) given in `./data/knee_cbct/*.npy` to conduct preprocessing. For\
  \ detailed instructions, please refer to `./data/knee_cbct/README.md`. The processed data will be organized\
  \ as follows.\n\n```\n├── ./data/knee_cbct/\n│   ├── config.yaml\n│   ├── info.json\n│   ├── processed/\n\
  │   │   └── FL-140400.nii.gz\n│   ├── blocks/\n│   │   ├── blocks.npy\n│   │   ├── FL-140400/\n│   │\
  \   │   ├── block_0.npy\n│   │   │   ├── block_1.npy\n│   │   │   └── ...\n│   ├── projections_normalized/\n\
  │   │   └── FL-140400.pickle\n```\n\n## 3. Training and Testing\n\nFollow the scripts given in `./scripts/*.sh`\
  \ to conduct training and testing.\n\n## License\n\nThis repository is released under MIT License (see\
  \ LICENSE file for details).\n"

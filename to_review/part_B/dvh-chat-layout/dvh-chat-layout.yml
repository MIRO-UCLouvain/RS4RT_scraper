readme_excerpt: "# Dynamic Viewport Height (100dvh) Chat Layout Template\n\nEste repositorio contiene\
  \ una solución limpia y moderna en CSS/Tailwind para el clásico dolor de cabeza de desarrollo web móvil:\
  \ **el teclado virtual móvil rompiendo el layout del chat o consola**, ocultando el input de entrada\
  \ o haciendo que el scroll se desborde fuera de la pantalla visible.\n\n## El Problema Clásico (100vh)\n\
  \nCuando utilizas `h-screen` o `100vh` en un contenedor de chat para móviles:\n1. El navegador móvil\
  \ (Safari, Chrome) abre el teclado en pantalla.\n2. El teclado virtual se superpone al viewport teórico\
  \ (`100vh` no se redimensiona dinámicamente).\n3. Tu barra de entrada de texto (`input` de envío) queda\
  \ completamente oculta detrás del teclado, obligando al usuario a hacer scroll manual o a no poder ver\
  \ lo que escribe.\n\n## La Solución Moderna (100dvh + flex-col + min-h-0)\n\nEl estándar moderno de\
  \ CSS introduce **Dynamic Viewport Height (`dvh`)**. El valor `100dvh` representa el 100% de la altura\
  \ del viewport dinámico, el cual *sí se recalcula automáticamente* cuando el teclado virtual aparece\
  \ o desaparece en iOS y Android.\n\nPara que esto funcione con una lista de mensajes scrolleable y un\
  \ input fijo abajo, la estructura flexbox debe configurarse así:\n\n```html\n<!-- Contenedor Principal:\
  \ Asegura la altura exacta visible con 100dvh -->\n<div class=\"h-[100dvh] flex flex-col overflow-hidden\"\
  >\n  \n  <!-- Header (Fijo) -->\n  <header class=\"flex-shrink-0\">...</header>\n\n  <!-- Contenedor\
  \ de Mensajes (Scrolleable):\n       Clave: 'flex-1' para tomar el espacio restante,\n       y 'min-h-0'\
  \ + 'overflow-y-auto' para forzar que el scroll \n       ocurra aquí dentro en lugar de empujar el layout\
  \ completo. -->\n  <div class=\"flex-1 min-h-0 overflow-y-auto\">\n    <!-- Lista de mensajes -->\n\
  \  </div>\n\n  <!-- Barra de Entrada / Input (Fijo al pie de la pantalla dinámica) -->\n  <footer class=\"\
  flex-shrink-0\">...</footer>\n\n</div>\n```\n\n---\n\n## Código Listo para Usar (React + Tailwind)\n\
  \nPuedes copiar directamente este componente `MobileChatConsole.tsx` para implementarlo en tus proyectos:\n\
  \n```tsx\nimport React, { useState, useRef, useEffect } from 'react';\n\ninterface Message {\n  id:\
  \ string;\n  sender: 'user' | 'bot';\n  text: string;\n}\n\nexport const MobileChatConsole: React.FC\
  \ = () => {\n  const [messages, setMessages] = useState<Message[]>([\n    { id: '1', sender: 'bot',\
  \ text: '¡Hola! Escribe algo y observa cómo el input permanece siempre visible sobre el teclado virtual\
  \ en tu celular.' }\n  ]);\n  const [input, setInput] = useState('');\n  const scrollRef = useRef<HTMLDivElement>(null);\n\
  \n  // Auto-scroll al recibir o enviar mensajes\n  useEffect(() => {\n    if (scrollRef.current) {\n\
  \      scrollRef.current.scrollTop = scrollRef.current.scrollHeight;\n    }\n  }, [messages]);\n\n \
  \ const handleSend = (e: React.FormEvent) => {\n    e.preventDefault();\n    if (!input.trim()) return;\n\
  \n    const userMsg: Message = { id: Date.now().toString(), sender: 'user', text: input };\n    setMessages(prev\
  \ => [...prev, userMsg]);\n    setInput('');\n\n    // Respuesta simulada\n    setTimeout(() => {\n\
  \      setMessages(prev => [...prev, {\n        id: (Date.now() + 1).toString(),\n        sender: 'bot',\n\
  \        text: `Recibido: \"${userMsg.text}\". El input sigue fijo abajo sin problemas de viewport.`\n\
  \      }]);\n    }, 800);\n  };\n\n  return (\n    /* Contenedor Base con Altura Dinámica */\n    <div\
  \ className=\"h-[100dvh] w-full max-w-md mx-auto bg-slate-950 text-slate-100 flex flex-col overflow-hidden\
  \ border-x border-slate-900 shadow-2xl\">\n      \n      {/* 1. Header (Fijo) */}\n      <header className=\"\
  p-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between shrink-0\">\n        <div\
  \ className=\"flex items-center gap-2\">\n          <div className=\"w-3 h-3 rounded-full bg-emerald-500\
  \ animate-pulse\" />\n          <span className=\"font-bold text-sm text-slate-200\">Layout Autoadaptable\
  \ (100dvh)</span>\n        </div>\n      </header>\n\n      {/* 2. Cuerpo Scrolleable (Mensajes) */}\n\
  \      <div \n        ref={scrollRef}\n        className=\"flex-1 min-h-0 overflow-y-auto p-4 space-y-3\
  \ bg-slate-950/50\"\n      >\n        {messages.map((msg) => (\n          <div\n            key={msg.id}\n\
  \            className={`max-w-[80%] p-3 rounded-2xl text-sm ${\n              msg.sender === 'user'\n\
  \                ? 'bg-amber-500 text-slate-950 ml-auto rounded-tr-none font-medium'\n             \
  \   : 'bg-slate-900 text-slate-200 mr-auto rounded-tl-none border border-slate-800'\n            }`}\n\
  \          >\n            {msg.text}\n          </div>\n        ))}\n      </div>\n\n      {/* 3. Input\
  \ Fijo al Pie (Se ancla perfectamente sobre el teclado del celular) */}\n      <form \n        onSubmit={handleSend}\n\
  \        className=\"p-3 bg-slate-900 border-t border-slate-800 flex gap-2 shrink-0\"\n      >\n   \
  \     <input\n          type=\"text\"\n          value={input}\n          onChange={(e) => setInput(e.target.value)}\n\
  \          placeholder=\"Escribe tu mensaje aquí...\"\n          className=\"flex-1 bg-slate-950 border\
  \ border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none\
  \ focus:border-amber-500 transition-colors\"\n        />\n        <button\n          type=\"submit\"\
  \n          className=\"bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-sm px-4 py-2 rounded-xl\
  \ transition-all shadow-md shadow-amber-500/10 active:scale-95\"\n        >\n          Enviar\n    \
  \    </button>\n      </form>\n      \n    </div>\n  );\n};\n```\n\n---\n\n## ¿Por qué el `min-h-0`\
  \ es obligatorio?\n\nPor defecto, los elementos Flexbox intentan no encogerse por debajo del tamaño\
  \ de su contenido mínimo (`min-height: auto`). Si tienes una lista larga de mensajes dentro de un flex\
  \ child, sin `min-h-0` la lista expandirá el contenedor verticalmente, empujando la barra de input fuera\
  \ de la pantalla. \n\nAl declarar `min-h-0` (o `min-height: 0px`) en el contenedor de mensajes, le permitimos\
  \ encogerse libremente para ajustarse al espacio disponible limitado por el `100dvh` del padre principal,\
  \ forzando que el desbordamiento active el scroll interno.\n\n---\n\nDiseñado y documentado para la\
  \ comunidad de desarrollo por **Stephano Rojas Camoretti** | Founder @ **Aureum Labs** \U0001F981\n"

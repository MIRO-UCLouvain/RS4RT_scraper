readme_excerpt: "# SBRT-Internal-Competition\n## Description\nCapture the Flag (CTF) is a widely-recognized\
  \ game that has been played for\ncenturies all around the world and will be the inspiration for our\
  \ 2024 Internal\nCompetition. The main goal of the game is to capture the opposing alliance flags and\n\
  bring them back to your own base while protecting your own flags from being\ncaptured. The game will\
  \ be a 3 versus 3 tournament with an upper bracket and a lower\nbracket.\n## Overview of code\nWithin\
  \ the client folder, a websocket is used to communicate between the joystick\n(controlled by arrow keys)\
  \ and the Raspberri Pi Pico microcontroller (within the \nserver folder). Functions including forward,\
  \ backward, left, and right (as well as the\nability to go forward/backward and turn). \n## Results\
  \ of competition\nOverall, my teammate, Kaden, and I managed to close out the competition undefeated!\
  \ I\nwould like to thank Kaden, Stony Brook Robotics E-Board, and friends for their help and \nencouraging\
  \ words.\n"

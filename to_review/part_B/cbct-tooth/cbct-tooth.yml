readme_excerpt: "CBCT Impacted Canine Classification\n=====================================\n\nData: https://drive.google.com/drive/folders/1V9WN_L9f3Ty5byR4ZbS5bzYZgdWN9lgI?dmr=1&ec=wgc-drive-%5Bmodule%5D-goto\n\
  Results: https://drive.google.com/drive/folders/1lsRZ5s8faprtBHMcjiPZ7erAq5BM_Fvm?dmr=1&ec=wgc-drive-%5Bmodule%5D-goto\n\
  \nAll scripts are run from the project root.\n\nDirectory Structure\n-------------------\ndata/\n  \
  \  img_jason/              - CBCT images (Jason's patients)\n    img_sandy/              - CBCT images\
  \ (Sandy's patients)\n    meta_data_jason.csv     - Raw annotations for Jason's patients\n    meta_data_sandy.csv\
  \     - Raw annotations for Sandy's patients\n    train.csv               - Training split (generated\
  \ by process_meta_data.py)\n    test.csv                - Test split (generated by process_meta_data.py)\n\
  \    IMPACTED CANINE POTENTIAL PATIENTS for male female, <18, >=18.xlsx\n\nresults/\n    weights/  \
  \              - Saved model weights (model_*.pth, model_final_*.pth)\n    logs/                   -\
  \ Training logs (log_*.json, log_*.png)\n    vis/                    - HTML visualizations of training\
  \ data\n    for_paper/              - Figures and CSVs for the paper\n\nsrc/\n    process_meta_data.py\
  \    - Generate train.csv and test.csv from meta_data\n    train_resnet.py         - Train the CNN models\n\
  \    final_test.py           - Evaluate models, print per-image and per-tooth metrics\n    plot_log.py\
  \             - Plot training curves from log JSON\n    vis_train_data.py       - Generate HTML visualization\
  \ of training images\n    for_paper/\n        00_generate_predictions.py  - Run inference, save test_predictions_per_image.csv\n\
  \        01_demographic_counts.py    - Count images by sex and age group\n        02_images_per_patient.py\
  \    - Count images per patient (train/test split)\n        03_demographic_detail.py    - Per-patient\
  \ breakdown by demographic group\n        04_confusion_matrix_print.py - Print confusion matrix from\
  \ predictions\n        05_figure2_roc_curves.py    - Generate ROC curve figure\n        06_figure6_gradcam.py\
  \       - Generate Grad-CAM heatmap figure\n\n\nHow to Reproduce\n----------------\n\nStep 1 — Prepare\
  \ data splits\n    python src/process_meta_data.py\n    Outputs: data/train.csv, data/test.csv\n\nStep\
  \ 2 — Train models (one per view)\n    python src/train_resnet.py\n    Outputs: results/weights/model_{view}.pth,\
  \ results/logs/log_{view}.json\n\nStep 3 — Plot training curves (optional)\n    python src/plot_log.py\n\
  \    Outputs: results/logs/log_{view}.png\n\nStep 4 — Evaluate on test set\n    python src/final_test.py\n\
  \    Prints per-image and per-tooth accuracy/precision/recall/F1\n\nStep 5 — Generate predictions CSV\
  \ (needed for paper figures)\n    python src/for_paper/00_generate_predictions.py\n    Outputs: results/for_paper/test_predictions_per_image.csv\n\
  \nStep 6 — Generate paper figures and tables\n    python src/for_paper/01_demographic_counts.py\n  \
  \  python src/for_paper/02_images_per_patient.py\n    python src/for_paper/03_demographic_detail.py\n\
  \    python src/for_paper/04_confusion_matrix_print.py\n    python src/for_paper/05_figure2_roc_curves.py\n\
  \    python src/for_paper/06_figure6_gradcam.py\n    Outputs: results/for_paper/\n\n\nNotes\n-----\n\
  - Jason's patients = new dataset; Sandy's patients = old dataset\n- 3 severity classes: 0=Normal, 1=Mild,\
  \ 2=Severe\n- 4 imaging views: pano, cross, lateral, frontal\n- Per-tooth prediction uses majority vote\
  \ across all views\n"

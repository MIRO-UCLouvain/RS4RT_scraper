readme_excerpt: "# Treatment-of-liver-metastases-with-SBRT-Analysis-of-variables-and-results-using-Machine-Learning-si\n\
  \nTreatment of liver metastases with SBRT: Analysis of variables and results using Machine Learning\
  \ sing Machine Learning\n\n1.\tINTRODUCTION\nOne of the main challenges of medicine is the fight against\
  \ cancer. It is estimated that this disease will affect 33% of the population at some point in their\
  \ lives and therefore, its research and development is fundamental for our society.\nIn recent years,\
  \ technological advances have allowed the development and application of new non-invasive cancer treatments,\
  \ such as radiotherapy using the SBRT technique (Stereotactic Body Radiation Therapy). SBRT delivers\
  \ high doses of radiation to small and well-defined targets in an extreme hypofractionated (and accelerated)\
  \ scheme with a very high biological effectiveness obtaining very good initial clinical results in terms\
  \ of local tumor control and acceptable rate of late complications. This contributes greatly to improving\
  \ disease control and response as well as the patient's quality of life. However, the indication for\
  \ this treatment depends on several factors such as the number of lesions, the clinical conditions of\
  \ the patient and the presence of other foci of disease, among others, so it is not always easy to define\
  \ the treatment parameters.\nIn parallel, the increase in computing capacity in recent years has allowed\
  \ the analysis and processing of large volumes of data. This development has given rise to the creation\
  \ of predictive algorithms in any area allowing obtaining from personalized recommendation systems,\
  \ prediction of economic models to early detection of diseases.\nTherefore, taking into account that\
  \ the most frequent patients with disseminated disease are located in the liver and lung, we want to\
  \ conduct a study with the data generated in patients with liver metastases in a certain hospital, in\
  \ which we will analyze through ML techniques the different relationships between the variables used\
  \ in SBRT treatments and thus create predictive models that allow us to obtain more knowledge to optimize\
  \ according to the conditions of each patient, the treatment parameters to predict their response.\n\
  \nObjective\nDevelop a machine learning classification model in order to predict, based on patient characteristics\
  \ and treatment parameters, whether the patient will develop local recurrence or not after SBRT treatment.\
  \ We also analyze the weight of each variable in the final outcome, and the relationships between variables.\n\
  \n\n\n\n2.\tWORKFLOW\nThis project has been divided into different jupyter notebooks:\n2.1\tStep_1:\
  \ Feature selection.\n\nTable I. data_Recidiva\t\t\n![image](https://user-images.githubusercontent.com/74373030/125140165-316fbf00-e112-11eb-8aea-a8a4eb69dc09.png)\n\
  \n\nTable I. data_Recidiva\t\t\nName of variables\tMeaning\tType\nSexo\tPatient’s gender\tstr\nEdad\t\
  Patient’s age\tint\nNum_lesion_total\ttotal number of injuries*\tint\ntratamientos_vez\tNumber of treatments\
  \ performed at the same time\tint\ntratatos_anteriomente\tHas the patient been treated for an injury\
  \ before?\tstr\nMts-tto\tTime between discovery of metastases and the treatment\tint\nMst-dco\tTime\
  \ between diagnosis of primary cancer and discovery of metastases\tint\nHistología\tTime between treatment\
  \ and discovery of metastases\tstr\nNeumotoraxHematoma\tDoes the patient have hepatic hematoma?\tstr\n\
  numeroQtPrevias\tNumber of chemotherapies prior to treatment\tint\nTtoLocalPrevio\thas the patient had\
  \ any local treatment prior to radiotherapy?\tstr\nmtsSNC\tDoes the patient have metastases in the central\
  \ nervous system?\tstr\nmtdOtrosNiveles\tDoes the patient have metastases in another area?\tstr\nVolPTV\t\
  Planning treatment volume\tint\nBEDmax_test\tMaximum effective biological dose\tint\nBEDmim_test\tMinimum\
  \ effective biological dose\tint\nVolHigSano\tHealthy liver volume\tint\nControlRespiratorio\tRespiratory\
  \ control during treatment\tstr\nGradoTox\tPatient’s degree of toxicity\tint\nSegmento\tLiver segment\t\
  str\nReciLocal\tDoes the patient present local recurrence after treatment?\tint\n* Each injurie is a\
  \ metastasis\nThe starting point is an anonymized database of 150 patients with more than 400 treated\
  \ metastases provided by e-mail by means of an excel file named Base Liver SPSS 2019 by lesions anonymized.xlsx.\n\
  The information contained in this database ranges from patient demographics (age, sex), date of diagnosis\
  \ of the primary tumor and metastases, histology (age, sex), date of diagnosis of the primary tumor\
  \ and metastases, histology, previous treatments (chemotherapy, surgery, etc.), and previous treatments\
  \ (chemotherapy, surgery...), dosimetric parameters of the radiotherapeutic treatment (prescribed dose,\
  \ maximum dose, maximum dose, dose prescribed dose, maximum dose, minimum dose, biological equivalent\
  \ dose), response to treatment, date of progression, site of progression, survival time, cause of death,\
  \ etc\nTaking into account that the objective is to predict the result of the treatment, ReciLocal,\
  \ we prepare the dataset by creating new variables and making a feature selection resulting in a dataset\
  \ of dimension (405 x 21) shown above in Table I: data_Recidiva. \nIt is important to clarify that each\
  \ rows correspond with one treatment, therefore if a patient has had two treatments, he will have two\
  \ rows. \nThis notebook also includes an Exploratory Data Analysis through visualizations and statistics.\
  \ This step allows on the one hand visualizing the distribution of our data, the outliers or spurious\
  \ values and on the other hand to examine the correlations between our variables. \nThis analysis has\
  \ allowed us to conclude:\n- Generally, the higher the radiation doses in the treatment, the lower the\
  \ chance of local recurrence. \n- All patients with toxicity grade 4, present local recurrence. That\
  \ toxicity is linked to previous chemotherapy treatment.\n- All patients who have had more than 5 lesions\
  \ treated at the same time do not present local recurrence. Therefore, we can say that if the patient\
  \ has 5 or more lesions it is better to treat them all at the same time\n- The target classes are imbalanced:\
  \ No local recurrence: 84% vs local recurrence: 16%\n- \n![image](https://user-images.githubusercontent.com/74373030/125138705-6dedeb80-e10f-11eb-9aca-8bd33c1e923c.png)\n\
  \n\n\nWhen we are faced with a data imbalanced problem, we must take into account that it affects to\
  \ the algorithms in their process of generalization of the information, harming the minority classes\
  \ and therefore we will have to take into account the metric to choose (For an analysis of the metrics\
  \ I have uploaded a notebook called metrics, in which different metrics are analyzed and it is shown\
  \ that although the accuracy metric gives good results it is not good for imbalanced data problems.)\n\
  In order to achieve our goal of obtaining a classification model that predicts treatment response, we\
  \ will train different models by performing different data balancing strategies:\n1.\tData_level approach:\
  \ We modify the distribution of the data removing noisy observations or retaing those harder to classify\
  \ or creating synthetic new observations or simply to add or remove randomly observations:  Undersampling\
  \ and Over sampling (step_3 notebooks)\n\n2.\tEnsemble algorithms: Combine weak learner through bagging\
  \ and boosting to make more robust predictioons: Boosting and bagging. In an ensemble we construct multiple\
  \ classifiers from the original data and then we aggregate their predictions. (combining classifiers\
  \ generally improve the generalization ability) The problem is that the classifiers tend to optimize\
  \ the accuracy so we are not tackling with imbalanced data issue. So we have to combine it with either\
  \ a data level approach or a cost sensitive approach (step_4 notebook).\n3.\tCost sensitive approach:\
  \ We introduce a cost into the minimization function of the different algorithms : Higher miss-classification\
  \ costs(step_5 notebook)\n\n2.2 Step_2: Preprocessing data \nIn this notebook we prepare the dataset\
  \ for use it in different training models. We split the data into train and testset (taking into account\
  \ the imbalanced issue we use a version of k-fold cross-validation that preserves the imbalanced class\
  \ distribution in each fold. It is called stratified k-fold cross-validation and will enforce the class\
  \ distribution in each split of the data to match the distribution in the complete training dataset),\
  \ the scaling through the RobustScaler function because is more robust to outliers and the categorical\
  \ variables encoding  by OneHotEncoding().\nOn the other hand, an analysis of the different over and\
  \ undersampling techniques with the final data size of each technique is carried out. Here I show some\
  \ examples of the final distribution of the samples after applying the different sampling techniques\
  \ compared to the initial data: raw data. In each graph the final size is also shown.\n![image](https://user-images.githubusercontent.com/74373030/125139080-2a47b180-e110-11eb-801a-efe3cfe5df90.png)\n\
  2.3 Step_3: Data Level approach \n\n![image](https://user-images.githubusercontent.com/74373030/125139098-33388300-e110-11eb-9d43-2f4c93a484b7.png)\n\
  \n\nOversampling:\n\nExplain at notebooks\nUndersampling\nAbove is a summary of the best results (see\
  \ notebook for more information).\nThe choice of metric depends on what we want to predict. In our case\
  \ we are interested in minimizing the prediction errors of the minority class.( False Negative Rate,\
  \ FNR) and since we want it to be independent of the threshold we use as metric the roc-auc which is\
  \ also not affected by the imbalanced classes.\nArea Under the ROC: AUC. AUC provides an aggregate measure\
  \ of performance across all possible classification thresholds.\n●Higher AUC indicates the model is\
  \ better at predicting both classes\nAUC=1 for a perfect model 0.5 for a random model (varia entre 1\
  \ y 0.5)\nadvantages of this metric show you visibility of the model performance across probability\
  \ thresholds and gives you versatility to select this threshold depending we want to minimize. \n\n\
  Combination\nWe don`t manage to get good results\n2.4 Step 4: Ensemble models\nImprove model performance\
  \ combining several classifiers. Their decisions can be combined or aggregated. The idea is to improve\
  \ generalization. Such classifier make erros, but each classification makes different errors. Thus classifiers\
  \ complement each other.\n 2.5 Step 5: Cost Sensitive Learning (CSL) \nCSL is a type of learning that\
  \ takes (misclassification) costs into account. This method minimizes the total misclassification cost\
  \ instead of the error rate classification.\n"

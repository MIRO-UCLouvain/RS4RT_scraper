readme_excerpt: "# Centre-specific autonomous treatment plans for prostate brachytherapy using cGANs\n\
  \nKeras/Tensorflow implementation of 3D pix2pix for automating treatment planning for low-dose-rate\
  \ prostate brachytherapy. This work has been published in International Journal of Computer Assisted\
  \ Radiology and Surgery (2021) and was presented in [IPCAI 2021](http://www.ipcai.org/).\n\n<a href=\"\
  https://rdcu.be/cmKMD\" target=\"_blank\">Paper |</a>\n<a href=\"https://youtu.be/F5kOCjiZpR4\" target=\"\
  _blank\" rel=\"noopener noreferrer\">Presentation</a>\n\n<p align=\"left\">\n<a href=\"#\"><img src=\"\
  assets/model.jpg\" width=\"100%\"></a>\n</p>\n\n### Dependencies\n```\nPython 3.6\nTensorflow: 2.0.0\n\
  Keras: 2.3.1\n```\n\n### Environment Setup\n\nRecreate conda environment as follows:\n```\nconda env\
  \ create -f environment.yml\n```\n\nOr if you are using Docker:\n```\ndocker pull tazleef/tf2.0.0-cv-keras2.3.1-imgaug:latest\n\
  ```\n\n### Training\n\nDue to privacy policy, we are unable to share our clinical dataset. However,\
  \ we have included a few sample cases for reference. Format your centre's dataset in the same way and\
  \ set the filepath and training parameters in `train.py`. \n\nTo train the model, run `train.py`. \n\
  \nThis code can be used for other 3D image to image translation task by modifying the network architectures\
  \ according to the data dimensions. \n\nA follow-up of this work can be found here.\n\n### Citation\n\
  ```\n@article{aleef2021centre,\n  title={Centre-specific autonomous treatment plans for prostate brachytherapy\
  \ using cGANs},\n  author={Aleef, Tajwar Abrar and Spadinger, Ingrid T and Peacock, Michael D and Salcudean,\
  \ Septimiu E and Mahdavi, S Sara},\n  journal={International Journal of Computer Assisted Radiology\
  \ and Surgery},\n  pages={1--10},\n  year={2021},\n  publisher={Springer}\n}\n```\n### Contact \n\n\
  If you face any problem using this code then please create an issue in this repository or contact me\
  \ at [tajwaraleef@ece.ubc.ca](mailto:tajwaraleef@ece.ubc.ca?subject=[GitHub]%203Dpix2pix%20Issue%20)\n\
  \n### Acknowledgements\n\nThe 3D Resnet code is based on [https://github.com/JihongJu/keras-resnet3d](https://github.com/JihongJu/keras-resnet3d)\n\
  \n### License\nMIT\n\n"

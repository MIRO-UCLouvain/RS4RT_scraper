readme_excerpt: "# Respiratory Prediction in Radiation Therapy\n\n\n## Introduction\nIn radiation therapy,\
  \ the respiratory gating method is widely used to account for the patient's breathing during treatment.\
  \ However, this method introduces delays between beam on and off times. These delays can reduce the\
  \ accuracy of the treatment and potentially harm normal tissues, making delay compensation necessary.\n\
  \n## Models\n\nThe models used in our research are:\n- **LSTM (Long Short-Term Memory)**\n- **Bi-LSTM\
  \ (Bidirectional Long Short-Term Memory)**\n- **Transformer**\n\n## Delay Times\n\nThe delay times considered\
  \ in our study are:\n- **300 ms**\n- **500 ms**\n- **700 ms**\n\n## Repository Structure\n- **data/**:\
  \ Contains the datasets used for training and testing.\n- **models/**: Includes the implementation of\
  \ the LSTM, Bi-LSTM, and Transformer models.\n- **results/**: Stores the results and performance metrics\
  \ of the models.\n\n## Publications\n\nFor more detailed information, refer to our published paper:\n\
  - **Clinical applicability of deep learning-based respiratory signal prediction models for four-dimensional\
  \ radiation therapy**\n- Authors: [Sangwoon Jeong]\n- Published in: [PLOS ONE]\n- [https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0275719]\n\
  \  \n## Contact\nFor any questions or inquiries, please contact [sangwoonjeong93@gmail.com].\n\n\n\n\
  \n\n\n\n\n\n\n\n"

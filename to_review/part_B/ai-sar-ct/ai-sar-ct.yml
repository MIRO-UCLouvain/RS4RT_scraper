readme_excerpt: "# AI-SAR-CT\n\n[![License: MIT](https://img.shields.io/badge/License-MIT-green.svg)](https://opensource.org/licenses/MIT)\n\
  [![Made With Love](https://img.shields.io/badge/Made%20With-Love-red.svg)](https://github.com/chetanraj/awesome-github-badges)\n\
  \nCollection of deep learning-based scatter artifact reduction articles for CT/CBCT Imaging.\n\n## 01.\
  \ Real-time scatter estimation for medical CT using the deep scatter estimation: Method and robustness\
  \ analysis with respect to different anatomies, dose levels, tube voltages, and data truncation <img\
  \ src=\"https://img.shields.io/badge/Supervised-blue.svg\" alt=\"Supervised\"> <img src=\"https://img.shields.io/badge/Projection--domain-yellow.svg\"\
  \ alt=\"Projection-domain\">\nJ. Maier et al. *Medical Physics*, 2018. [[doi](https://doi.org/10.1002/mp.13274)]\n\
  ### Summary\n\n**Key Idea**:\n\nDSE leverages a deep convolutional neural network (CNN), specifically\
  \ a modified U-Net architecture, to approximate MC scatter estimates from CT projection data. The network\
  \ predicts scatter maps from input projections represented in log, normalized, or combined (\"pep\"\
  ) forms.\n\n**Methodology**:\n\n- Simulated CBCT projections from head, thorax, and abdomen CT scans,\
  \ incorporating varied tube voltages (80–140 kV), noise levels, and truncation scenarios. Images were\
  \ downsampled to 384×256, then upsampled post-prediction.\n- A U-Net-like encoder-decoder CNN with skip\
  \ connections, trained using mean absolute percentage error (MAPE) loss.\n- Target outputs were scatter\
  \ maps derived from MC simulations. Three input functions were evaluated:\n    - **Mep:** Normalized\
  \ intensities ($e^{-p}$)\n    - **Mp:** Log-transformed projection data ($p$)\n    - **Mpep:** Product\
  \ of projection and normalized intensity ($p \\cdot e^{-p}$)\n\n**Results**:\n\n- On simulated data,\
  \ DSE achieves less than 2% error compared to MC scatter in most scenarios, substantially outperforming\
  \ KSE (11–21%) and HSE (6–293%).\n- Robust across a range of tube voltages and noise levels.\n- Generalizes\
  \ effectively to different anatomies included in the training set.\n- Enables real-time inference (~10\
  \ ms/projection), supporting practical clinical application.\n- The Mp and Mpep inputs yielded better\
  \ performance than Mep, with Mep being slightly less effective.\n- On real data from a slit scan, DSE\
  \ performed better than KSE and HSE, with error of 6 HU compared to 123 HU (KSE), and 65 HU (HSE).\n\
  --------\n<br/>\n<br/>\n\n## 02. Deep learning architecture for scatter estimation in cone-beam computed\
  \ tomography head imaging with varying field-of-measurement settings <img src=\"https://img.shields.io/badge/Supervised-blue.svg\"\
  \ alt=\"Supervised\"> <img src=\"https://img.shields.io/badge/Projection--domain-yellow.svg\" alt=\"\
  Projection-domain\">\nH. Agrawal et al. *Journal of Medical Imaging*, 2024. [[doi](https://doi.org/10.1117/1.JMI.11.5.053501)][[paper](https://research.aalto.fi/files/165367277/053501_1.pdf)]\n\
  ### Summary\n**Key Idea**:\n\nA deep learning-based scatter estimation method for CBCT head imaging,\
  \ addressing the challenge of varying field-of-measurement (FOM) settings. The key idea is to provide\
  \ the information of the FOM size to the encoder of the U-Net network, allowing the model to learn the\
  \ scatter characteristics specific to different FOMs.\n**Methodology**:\n- Simulated training data from\
  \ head CT scans with varying FOM sizes (18 sizes in training and 30 sizes in testing). Images were downsample\
  \ to 320x256 and then upsampled post-prediction. A total of 172,800 training samples, 43,200 samples,\
  \ and 600,000 testing samples were generated. Real data from water phantoms and clinical head scans\
  \ were also used for evaluation.\n- The study uses a U-Net architecture with modifications to incorporate\
  \ FOM information as additional input channels.\n- The method was plugged into a U-Net, DSE-Net, and\
  \ Spline-Net.\n- A loss function combining mean squared error (MSE) and high-frequency loss was proposed\
  \ to train the model.\n\n**Results**:\n- The simulation study demonstrates that the method reduced average\
  \ MAPE for U-Net by 38%, Spline-Net by 40%, and DSE-\nnet by 33% for the scatter estimation in the 2D\
  \ projection domain.\n- The root-mean-square error (RMSE) on the 3D reconstructed volumes was improved\
  \ for U-Net by 43%, Spline-Net by 30%, and DSE-Net by 23%.\n- The method improved contrast and image\
  \ quality on real datasets such as water phantom and clinical data. Although, the improvement was not\
  \ as significant as in the simulation study.\n--------\n<br/>\n<br/>\n\n## 03. Image-based scatter correction\
  \ for cone-beam CT using flip swin transformer U-shape network <img src=\"https://img.shields.io/badge/Supervised-blue.svg\"\
  \ alt=\"Supervised\"> <img src=\"https://img.shields.io/badge/Image--domain-red.svg\" alt=\"Image-domain\"\
  >\nX. Zhang et al. *Medical Physics*, 2023. [[doi](https://doi.org/10.1002/mp.16277)]\n### Summary\n\
  \n**Key Idea**:\n\nFSTUNet combines the strengths of CNNs for local texture detail extraction with Swin\
  \ Transformer for global correlation modeling to perform image-domain scatter correction in CBCT. The\
  \ key architectural novelty is a Flip Swin Transformer Block that replaces the standard tandem Swin\
  \ Transformer structure to achieve more powerful inter-window association extraction.\n\n**Methodology**:\n\
  \n- Training data generated from Monte Carlo (MC) simulations of CBCT scatter distributions, as well\
  \ as a frequency-split dataset generated by a validated method. The model operates in the image domain,\
  \ taking scatter-contaminated CBCT images as input and outputting scatter-corrected images.\n- A U-shaped\
  \ encoder-decoder architecture where shallow features are extracted by CNN blocks (capturing texture\
  \ detail) and deep features by Swin Transformer blocks (capturing global context). Skip connections\
  \ bridge corresponding encoder-decoder levels.\n- The Flip Swin Transformer Block modifies the original\
  \ Swin Transformer's shifted window scheme to enhance cross-window information exchange, improving the\
  \ network's ability to model long-range dependencies in scatter distributions.\n- Compared against five\
  \ baseline methods: UNet, DRCNN, DSENet, Pix2pixGAN, and 3DUNet.\n\n**Results**:\n\n- On the MC simulated\
  \ dataset, FSTUNet reduced RMSE from over 100 HU (uncorrected) to approximately 7 HU, with SSIM and\
  \ UQI values close to 1.\n- FSTUNet outperformed all five comparison methods (UNet, DRCNN, DSENet, Pix2pixGAN,\
  \ 3DUNet) in both qualitative and quantitative evaluations.\n- Demonstrated effectiveness on both MC\
  \ simulation and frequency-split datasets, showing the potential to improve accuracy of CBCT image-guided\
  \ radiation therapy.\n--------\n<br/>\n<br/>\n\n## 04. Adaptive scatter kernel deconvolution modeling\
  \ for cone-beam CT scatter correction via deep reinforcement learning <img src=\"https://img.shields.io/badge/Supervised-blue.svg\"\
  \ alt=\"Supervised\"> <img src=\"https://img.shields.io/badge/Projection--domain-yellow.svg\" alt=\"\
  Projection-domain\">\nZ. Piao et al. *Medical Physics*, 2024. [[doi](https://doi.org/10.1002/mp.16618)]\n\
  ### Summary\n\n**Key Idea**:\n\nThis paper integrates scatter kernel deconvolution (SKD) with deep reinforcement\
  \ learning (DRL) for CBCT scatter correction. Conventional SKD methods rely on Monte Carlo simulation\
  \ for fixed kernel parameter determination. The proposed framework instead uses a deep Q-network (DQN)\
  \ to optimize scatter kernel parameters adaptively on a per-projection basis.\n\n**Methodology**:\n\n\
  - A scatter kernel model iteratively convolves with raw CBCT projections to estimate the scatter distribution.\
  \ The kernel is parameterized by amplitude, width, and offset terms that control scatter shape.\n- A\
  \ deep Q-network from the DRL framework is introduced as the intelligent agent that interacts with the\
  \ scatter kernel environment. The DQN observes the current state (projection data and kernel parameters),\
  \ selects actions (parameter adjustments), and receives rewards based on scatter estimation accuracy\
  \ improvements.\n- Evaluated on simulated CBCT data for head and pelvis phantoms, as well as experimental\
  \ CBCT measurement data validated against a hardware-based beam stop array (BSA) algorithm for scatter-free\
  \ reference projections.\n- Compared against conventional SKD and U-Net-based scatter estimation methods.\n\
  \n**Results**:\n\n- In the simulation study, the DRL-SKD method achieved MAPE < 9.72% and PSNR > 23.90\
  \ dB, compared to conventional SKD (MAPE $\\geq$ 17.92%, PSNR $\\leq$ 19.32 dB).\n- In the measurement\
  \ study, the method achieved MAPE < 17.79% and PSNR > 16.34 dB on experimental CBCT data.\n- The measurement\
  \ study showed a larger performance gap relative to simulation, indicating reduced generalization to\
  \ real-world acquisition conditions.\n--------\n<br/>\n<br/>\n\n## 05. Scatter correction for cone-beam\
  \ CT via scatter kernel superposition-inspired convolutional neural network <img src=\"https://img.shields.io/badge/Supervised-blue.svg\"\
  \ alt=\"Supervised\"> <img src=\"https://img.shields.io/badge/Projection--domain-yellow.svg\" alt=\"\
  Projection-domain\">\nX. Zhuo et al. *Physics in Medicine & Biology*, 2023. [[doi](https://doi.org/10.1088/1361-6560/acbe8f)]\n\
  ### Summary\n\n**Key Idea**:\n\nThis paper combines the physics-based scatter kernel superposition (SKS)\
  \ method with a convolutional neural network. Instead of estimating scatter at individual pixel levels,\
  \ the CNN learns to predict the amplitude and width maps of Gaussian scatter kernels from projection\
  \ images, which are then convolved to compute the final scatter field. Embedding the SKS physical model\
  \ into the network architecture reduces the number of trainable parameters compared to purely data-driven\
  \ approaches like Deep Scatter Estimation.\n\n**Methodology**:\n\n- Monte Carlo (MC) simulation was\
  \ used to generate training data from a modeled CBCT system imaging a human chest phantom. Pairs of\
  \ scattered and scatter-free projection images were obtained at different dose levels.\n- The CNN predicts\
  \ two parameter maps — scatter kernel amplitude and width — rather than directly predicting the scatter\
  \ signal. These maps are fed into a differentiable SKS layer that computes the scatter distribution\
  \ via Gaussian kernel convolution.\n- The physics-inspired architecture constrains the output space,\
  \ resulting in a more compact model with fewer parameters than conventional end-to-end scatter estimation\
  \ networks.\n- Compared against conventional iterative MC-based SKS method and other deep learning approaches\
  \ including Deep Scatter Estimation (DSE).\n\n**Results**:\n\n- In the projection domain, the method\
  \ achieved a 58.5% reduction in RMSE, 18.1% increase in PSNR, and 3.4% increase in SSIM compared to\
  \ the MC-based iterative SKS method on average.\n- Produced lower errors than both the conventional\
  \ SKS method and other deep learning-based methods on simulated projections and reconstructed CT volumes.\n\
  - Evaluation was limited to a single chest phantom anatomy; generalization to other body regions was\
  \ not assessed.\n--------\n<br/>\n<br/>\n\n## 06. Task-based transferable deep-learning scatter correction\
  \ in cone beam computed tomography: a simulation study <img src=\"https://img.shields.io/badge/Supervised-blue.svg\"\
  \ alt=\"Supervised\"> <img src=\"https://img.shields.io/badge/Projection--domain-yellow.svg\" alt=\"\
  Projection-domain\">\nJ. P. Cruz-Bastida et al. *Journal of Medical Imaging*, 2024. [[doi](https://doi.org/10.1117/1.JMI.11.2.024006)][[paper](https://pmc.ncbi.nlm.nih.gov/articles/PMC10960584/)][[code](https://github.com/calcutech/task-based-DSC)]\n\
  ### Summary\n\n**Key Idea**:\n\nThis paper proposes a two-stage transfer learning strategy for CBCT\
  \ scatter correction. A U-Net CNN is first pre-trained on a large dataset of simple geometric phantom\
  \ projections to learn general scatter patterns, then fine-tuned with a small task-specific dataset\
  \ of anthropomorphic phantom projections. This reduces both the data requirements and training time\
  \ needed to adapt the scatter correction model to new imaging tasks.\n\n**Methodology**:\n\n- A U-Net\
  \ architecture with seven downsampling stages predicts 2D scatter ratio maps ($SR = S/T$) from log-normalized\
  \ projec"

readme_excerpt: "# Brain Tumor Segmentation using BraTS Dataset\n\nThis project explores deep learning\
  \ approaches for segmenting glioma subregions from multi-modal MRI scans using the BraTS dataset.\n\n\
  The goal is to develop a 3D convolutional neural network capable of identifying tumor regions from volumetric\
  \ medical images including:\n\n- T1\n- T1ce\n- T2\n- FLAIR\n\nThese modalities provide complementary\
  \ information about tumor structure and are commonly used in clinical neuroimaging.\n\n## Project Objectives\n\
  \n- Understand the structure of multi-modal MRI datasets\n- Build preprocessing pipelines for volumetric\
  \ NIfTI images\n- Implement 3D CNN architectures for tumor segmentation\n- Address class imbalance using\
  \ Dice + Cross-Entropy loss\n- Evaluate segmentation performance using Dice Score\n\n## Dataset\n\n\
  The dataset used is the **BraTS (Brain Tumor Segmentation) dataset**, which contains multi-modal MRI\
  \ scans with expert annotations for tumor regions.\n\nTumor regions include:\n- Enhancing tumor\n- Tumor\
  \ core\n- Whole tumor\n\n## Current Status\n\nThe project is currently under active development.\n\n\
  Work in progress includes:\n\n- MRI data preprocessing\n- Loading NIfTI volumes using NiBabel\n- Designing\
  \ the 3D CNN architecture\n- Experimenting with segmentation loss functions\n\n## Repository Structure\n\
  \ndata_preprocessing/  → MRI preprocessing scripts  \nmodels/              → 3D CNN architectures  \n\
  notebooks/           → experiments and visualization  \nexperiments/         → training logs and results\n\
  \n## Future Work\n\n- Implement U-Net based 3D architectures\n- Experiment with attention mechanisms\n\
  - Improve segmentation performance using advanced loss functions\n- Evaluate model performance using\
  \ Dice similarity coefficient\n\n## Tools & Libraries\n\nPython  \nPyTorch / TensorFlow  \nNiBabel \
  \ \nNumPy  \nOpenCV\n\n---\n\nThis project is part of my exploration of **medical image analysis and\
  \ computational biology**."

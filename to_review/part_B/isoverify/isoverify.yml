readme_excerpt: "# IsoVerify\n\n\U0001F680 **Live App Access:** [https://isoverify.streamlit.app/]\n\n\
  **IsoVerify** is an open-source, web-based clinical QA tool for  \n**Winston–Lutz isocenter verification**\
  \ in radiotherapy.\n\nA web-based clinical Quality Assurance (QA) tool for **Winston–Lutz analysis**\
  \ in stereotactic radiotherapy and radiosurgery.\n\nThis application is built using **Streamlit** and\
  \ **pylinac**, allowing medical physicists to:\n- Analyze Winston–Lutz DICOM image sets\n- Visualize\
  \ isocenter accuracy\n- Generate official pylinac PDF reports\n- Inspect individual image detections\
  \ interactively\n\n---\n\n## \U0001F680 Features\n\n- \U0001F4C2 Upload multiple DICOM EPID images\n\
  - \U0001F4CA Automatic Winston–Lutz geometric analysis\n- \U0001F3AF Gantry isocenter diameter and max\
  \ CAX–BB distance\n- \U0001F6E0 Couch shift vector calculation (with coordinate system warning)\n- \U0001F4F8\
  \ Individual image visualization\n- \U0001F4C4 One-click PDF report generation (pylinac official report)\n\
  - \U0001F310 Web-based UI (Streamlit)\n\n---\n\n## ⚠️ Clinical Disclaimer\n\nThis tool performs **geometric\
  \ analysis only**.\n\nCouch shift values are reported in **pylinac’s internal geometric coordinate system**.\
  \  \nBefore applying any clinical correction, users **must verify** their machine’s coordinate convention\
  \ (e.g. IEC 61217, vendor-specific).\n\nThis software does **not replace clinical judgment**.\n\n---\n\
  \n## \U0001F5A5️ Installation\n\n### 1. Clone the repository\n\n```bash\ngit clone https://github.com/LuisParedesOcampo/IsoVerify\n\
  cd winston-lutz-streamlit\n"

readme_excerpt: "# CT Data Processing Project\n\n## Overview\n\nThis project consists of 3 modules.\n\n\
  The modules **Artificial_Data_Generation** and **Artificial_Data_Evaluation** were used for data generation\
  \ and analysis for the paper **Frensch C, Bäcker CM, Jentzen W, et al. Dose distributions of proton\
  \ therapy plans are robust against lowering the resolution of CTs combined with increasing noise. Med\
  \ Phys. 2025; 52:1293–1304.** (https://doi.org/10.1002/mp.17530).\n\nThe **Experiment_Evaluation** module\
  \ offers two different analysis possibilities:\n\n1. **PET/CT Reconstruction Analysis**: Investigation\
  \ of spatial resolution of artificial CTs generated from PET/CT data. The datasets are designated as\
  \ FDG_1 to FDG_30 and GA_1 to GA_30, where FDG and GA stand for the administered radionuclides and the\
  \ number indicates the number of reconstruction iterations of the algorithm. MTF10/MTF50 values as well\
  \ as FWHM parameters are determined from the data to characterize spatial resolution.\n\n2. **Phantom-based\
  \ Spatial Resolution Analysis**: Evaluation of CT data measured using the spatial resolution module\
  \ of a phantom. Here, Line Spread Function (LSF) parameters are determined and visualized.\n\n**Note:**\
  \ Due to the size of medical CT datasets (typically several GB per patient) and data protection regulations,\
  \ no example data is included in this repository. Specific experimental data can be provided upon request\
  \ for research purposes.\n\n## Modules\n\n### Artificial_Data_Generation\nThe core module for generating\
  \ synthetic CT data. Implements various degradation procedures for simulating different image qualities:\n\
  The Input is the original CT data and after adding noise or filtering, the images can be saved as DICOM\
  \ or PNG.\n\n**Main Components:**\n- **CTData.py**: Core classes for 3D CT data processing\n  - `CT3D`:\
  \ Manages 3D CT volumes from multiple layers\n  - `CTLayer`: Represents individual CT slices with DICOM\
  \ metadata\n- **Filter.py**: Spatial filtering operations\n  - Gaussian, rectangle and triangle filters\
  \ for resolution reduction\n- **Patient.py**: Patient data management\n  - `Patient`: Individual patients\
  \ with CT scans\n  - `PatientDataBase`: Management of multiple patients\n- **main_generation.py**: Main\
  \ processing logic with various modes\n\n**Supported Operations:**\n- Spatial filtering (Gaussian, Rectangle,\
  \ Triangle)\n- Noise addition (Gaussian White Noise)\n- Combined processing (Filter + Noise)\n- Export\
  \ as DICOM and PNG\n\n### Artificial_Data_Evaluation\nModule for quantitative evaluation of artificially\
  \ generated CT data through gamma analysis and dosimetric evaluation. Implements medical quality assurance\
  \ metrics for validation of synthetic datasets.\nHere there are two dose arrays as input needed for\
  \ the comparison of the two dose distribution. One distribution of the original CT data and one of the\
  \ modified CT data. You get these through dose calculation in an dose calculation program such as RayStation.\n\
  \n**Main Functions:**\n- Gamma analysis for dosimetric comparisons\n- ROI-based evaluations with anatomical\
  \ structures\n- Multi-plane visualization (transversal, sagittal, coronal)\n- Statistical evaluation\
  \ (pass rates, mean gamma, threshold analyses)\n\n### Experiment_Evaluation\nComprehensive module for\
  \ quantitative image quality analysis of medical imaging data. Implements standardized metrics for evaluating\
  \ image sharpness, noise, and frequency response characteristics.\nHere the experimental data of the\
  \ PET/CT imaging and the CT resolution imaging is evaluated. The experiment data must be provided as\
  \ input.\n\n**Main Functions:**\n- MTF analysis (Modulation Transfer Function) for resolution evaluation\n\
  - ESF/LSF analysis (Edge/Line Spread Function) for sharpness measurement\n- FWHM determination (Full\
  \ Width at Half Maximum)\n- Quantitative noise analysis in various ROIs\n\n### Example Outputs of the\
  \ Experiment_Evaluation Module\n\nThe module generates various visualizations of analysis results:\n\

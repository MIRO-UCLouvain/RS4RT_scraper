readme_excerpt: "# SlicerLink Pro: Computational Neuroimaging & Pre-Surgical Radiomics Workstation\n###\
  \ Multiplanar Reconstruction (MPR) Matrix Ingestion & 3D Spatial Coordinate Transform Pipeline\n\n##\
  \  Clinical & Scientific Overview\nSlicerLink Pro is an open-source, production-ready neuroimaging informatics\
  \ pipeline designed for the structured ingestion, multiplanar cross-sectional visualization, and PyRadiomics-grade\
  \ texturing analysis of 3D structural human brain MRI volumes.\n\nA primary technical challenge in computer-assisted\
  \ neurosurgery and surgical mapping is the spatial coordinate system misalignment between clinical hardware\
  \ scanners and surgical planning suites. Hospital scanners output multi-spectral volumetric voxels (T1-contrast,\
  \ T2, FLAIR) inside an **LPS (Left-Posterior-Superior)** spatial coordinate framework. Conversely, surgical\
  \ navigation environments (such as **3D Slicer**) monitor patient anatomy in a **RAS (Right-Anterior-Superior)**\
  \ millimeters tracking space. \n\nThis platform implements an advanced **3D Affine Spatial Transformation\
  \ Matrix** to programmatically calculate the true anatomical centroid of targeted intracranial masses\
  \ (Glioblastoma Multiforme active borders or acute extra-axial hematomas), translating coordinates directly\
  \ into interoperable RAS coordinates for seamless surgical margin node exports.\n\n*   **Live Application\
  \ URL:** https://slicer-radiomics-pipeline-mpy2pyuavxzjepwbaxubzw.streamlit.app/\n*   **Source Code\
  \ Matrix:** https://github.com/noorfatimacheema249-design/slicer-radiomics-pipeline\n\n##  Technical\
  \ Stack & Image Calculus Core\n- **Medical Image Ingestion Engine:** `nibabel` (The definitive international\
  \ kernel for decoding NIfTI `.nii` / `.nrrd` data frames and header geometries)\n- **Computer Vision\
  \ & Morphological Filters:** `scikit-image (filters, measure)`\n- **Biostatistical & Geometric Matrices:**\
  \ `SciPy (stats)` & `NumPy`\n- **Frontend Workstation Interface:** `Streamlit Framework` (Reactive state\
  \ configuration)\n- **Multidimensional Canvas Rendering:** `Plotly Express (px)` & `Plotly Graphic Objects\
  \ (go)`\n\n##  Core Engineering Capabilities\n1. **Multiplanar Reconstruction (MPR) Array Engine:**\
  \ Ingests isotropic, high-resolution human cranial data volumes, tracking geometrical dimensions across\
  \ adjustable slice coordinates to map structural tissue architectures layer-by-layer.\n2. **Automated\
  \ 3D Otsu Segmentation Layer:** Computes a global multi-dimensional intensity threshold matrix across\
  \ non-zero parenchymal background voxels. Integrates an adjustable intensity threshold scaling slider\
  \ to eliminate imaging artifacts and precisely capture tumor margins.\n3. **PyRadiomics First-Order\
  \ Feature Extraction Scoreboard:** Measures pixel variances inside the segmented boundary mask to extract\
  \ quantitative biophysical tissue signatures:\n   - **Shannon Entropy ($7.059$ standard baseline):**\
  \ Quantifies micro-architectural voxel distribution chaos to mathematically screen for tumor heterogeneity.\n\
  \   - **Skewness & Kurtosis Tracking:** Maps pixel array symmetry profiles to evaluate neoplastic solid\
  \ tumor borders vs. central necrotic or cystic transformations.\n4. **Slicer-Interoperable Node Exporter:**\
  \ Multiplies a $4 \\times 4$ homogeneous voxel index coordinate vector against the scanner's transformation\
  \ header parameters to instantly compute surgical navigation target tracking points in precise real-world\
  \ RAS millimeters.\n\n##  Software Reproducibility & Open-Source Testing\nThe workspace is engineered\
  \ to load an uncompressed, anonymized structural human brain volume (`brain.nii`). A robust automated\
  \ exception handling fallback block is deployed within the data ingestion kernel to guarantee continuous,\
  \ zero-error pipeline execution during web cloud server review. This platform serves as a clinical informatics\
  \ proof-of-concept for pre-surgical navigation interfaces during the 2027 Residency Match cycle.\n\n\
  ##  Open-Source License\nThis repository is deployed openly under the **MIT License** permitting free\
  \ modification and reuse while enforcing institutional professional liability protections.\n"

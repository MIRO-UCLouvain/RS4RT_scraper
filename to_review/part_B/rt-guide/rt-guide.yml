readme_excerpt: "# RT programming guide\n\nTutorial นี้ทำขึ้นเพื่อแนะนำการเขียนโปรแกรมสำหรับ radiotherapy\
  \ เบื้องต้น สำหรับระบบ treatment planning (TPS) ของ Varian\n\nTPS ของ varian นั้นจะมี API ที่ชื่อ ESAPI\
  \ ที่เป็นชุดคำสั่งสำหรับเขียนโปรแกรมติดต่อกับระบบ TPS โดยรองรับภาษา C# และ Python ตัวอย่างโค้ดและ documents\
  \ สามารถดูได้ที่ [link](https://varianapis.github.io/)\n\n## Index\n\n- [เริ่มต้นเขียนโปรแกรม](#เริ่มต้นเขียนโปรแกรม)\n\
  \    - [Python](#python)\n    - [C#](#c)\n- [Library ที่ควรรู้จัก](#library-ที่ควรรู้จัก)\n- [การติดต่อกับ\
  \ TPS และนำข้อมูลออกจากระบบ](#การติดต่อกับ-tps-และนำข้อมูลออกจากระบบ)\n- [การ import file และ image\
  \ processing เบื้องต้น](#file-io-and-image-processing)\n- [Machine learning](#machine-learning)\n- [Deep\
  \ learning](#deep-learning)\n- [อื่นๆ](#อื่นๆ)\n\n---\n\n## เริ่มต้นเขียนโปรแกรม\n\nพื้นฐานการเขียนโปรแกรมที่ควรมีในแต่ละภาษาส่วนมากจะคล้ายกัน\
  \ ต่างกันแค่ syntax (โครงสร้างภาษา) เรื่องที่ควรรู้คือ\n\n- Variables และชนิดของ variables\n- Array\
  \ or Lists\n- Operator\n- Conditional statement (if/else)\n- Loop (For loop/while loop)\n- Functions\n\
  - การใช้ library/modules\n- Classes/Objects (เรื่องนี้อาจจะข้ามไปก่อนได้ แต่ถ้ารู้จะเข้าใจการเขียนโปรแกรมได้ไวขึ้น\
  \ แนะนำว่าถ้าข้ามไปแล้วพอเขียนโปรแกรมไปสักพักให้กลับมาอ่านใหม่)\n\nการเรียนเขียนโปรแกรมจะไปได้ไวขึ้นถ้าเราฝึกเขียนไปด้วย\
  \ resources หลักๆจะมีหนังสือ วิดีโอ และ interactive website ซึ่งผมแนะนำ interactive website เนื่องจากไม่ต้อง\
  \ set โปรแกรมในเครื่องตัวเองเหมาะสำหรับคนเรียนครั้งแรก หรือแล้วแต่ถนัด\n\n### Python\n\nภาษาไทย\n\n\
  - [Kong Ruksiam Youtube](https://www.youtube.com/playlist?list=PLltVQYLz1BMBwqJysYnoEKWXUvqusJpgN) สอนตั้งแต่การติดตั้ง\
  \ Python จนถึง Functions\n- [marcuscode](http://marcuscode.com/lang/python) บทความสอน Python ภาษาไทย\n\
  \nภาษาอังกฤษ\n\n- [w3schools](https://www.w3schools.com/python) เป็น interactive website\n- [Sololearn](https://www.sololearn.com/home)\
  \ มีทั้ง ios และ android app แบบ interactive\n- [FreeCodeCamp](https://www.youtube.com/watch?v=rfscVS0vtbw)\
  \ youtube\n- [Reddit learning resources](https://www.reddit.com/r/learnpython/wiki/index#wiki_new_to_python.3F)\
  \ รวม tutorials สำหรับ python lists นี้บางแหล่งอาจจะเกินพื้นฐานไปบ้าง\n\n### C#\n\nภาษาไทย \n\n- [Kong\
  \ Ruksiam Youtube](https://www.youtube.com/playlist?list=PLEE74DyIkwEm84UiA8fRGvJSecZaHZ9KY) สอนพื้นฐานครบ\
  \ อาจจะขาดเรื่องการติดตั้งโปรแกรม\n- [CBSknowledgeNET Youtube](https://www.youtube.com/playlist?list=PLFBv5UmF33FwhFnHXTNNQEq7uFop4v0i2)\
  \ สอนตั้งแต่ติดตั้งโปรแกรม\n\nภาษาอังกฤษ\n\n- [Microsoft tutorials](https://docs.microsoft.com/en-us/dotnet/csharp/tour-of-csharp/tutorials/)\
  \ เป็น interactive website\n- [w3schools](https://www.w3schools.com/cs/index.php) เป็น interactive website\n\
  - [Sololearn](https://www.sololearn.com/home) มีทั้ง ios และ android app แบบ interactive\n- [FreeCodeCamp](https://www.youtube.com/watch?v=GhQdlIFylQ8)\
  \ youtube\n- [Caleb Curry](https://www.youtube.com/playlist?list=PL_c9BZzLwBRIXCJGLd4UzqH34uCclOFwC)\
  \ youtube\n- [Microsoft video](https://dotnet.microsoft.com/en-us/learn/csharp)\n\n## Library ที่ควรรู้จัก\n\
  \nPython\n\n- [Numpy](https://numpy.org/) ใช้สำหรับการคำนวณทางคณิตศาสตร์\n- [Matplotlib](https://matplotlib.org/)\
  \ ใช้สำหรับการ visualize data\n- [SimpleITK](https://simpleitk.org/) ใช้สำหรับ image analysis\n\nC#\n\
  \n- TODO\n\n## การติดต่อกับ TPS และนำข้อมูลออกจากระบบ\n\nการเขียนโปรแกรมติดต่อกับ Varian TPS โดยรวมแล้วแนะนำให้อ่านใน\
  \ [Varian API Book](https://varianapis.github.io/VarianApiBook.pdf) โดยจะสอน ESAPI ทั้งภาษา C# และ Python\n\
  \nในเรื่องที่ไม่มีใน Varian API Book เช่น\n\n- การ export image (RTDose, CT, ROIs) สามารถดูได้ที่ [C#](https://github.com/VarianAPIs/Varian-Code-Samples/blob/master/Eclipse%20Scripting%20API/plugins/Export3D.cs)\
  \ [Python](https://github.com/AI-radiotherapy/ESAPI-Example/tree/main/Export%20file)\n- ตัวอย่างโค้ดอื่นๆ\
  \ และโค้ดจากงานสัมนาของ Varian สามารถดูได้ที่ [link](https://github.com/VarianAPIs)\n\n## File IO and\
  \ image processing\n\npart นี้จะพูดถึงการอ่านไฟล์ที่เรา export ออกมาจาก TPS และ image processing เบื้องต้น\
  \ (จริงๆแล้วใน Varian API Book และ example code จาก Github ของ Varian Developer ที่แนะนำใน Part ก่อน\
  \ ก็มีตัวอย่างโค้ด image processing อยู่บ้างแล้ว)\n\nTools เบื้องต้นสำหรับอ่านไฟล์คือ\n\n- [pydicom\
  \ (python)](https://github.com/pydicom/pydicom) สำหรับอ่านไฟล์ DICOM\n- [SimpleITK (python)](https://simpleitk.org/)\
  \ สำหรับอ่านไฟล์ image อื่นๆ และ image processing [tutorial](http://insightsoftwareconsortium.github.io/SimpleITK-Notebooks/)\n\
  - [3D slicer](https://www.slicer.org/) ไฟล์ที่เรานำออกมาบางชนิดที่ไม่สามารถเปิดด้วย Library ด้านบนได้\
  \ สามารถเปิดในโปรแกรม 3D slicer เพื่อแปลงไฟล์ให้เป็นแบบที่เราต้องการ\n\nTools สำหรับ image processing\n\
  \n- [SimpleITK (python)](https://simpleitk.org/) สำหรับอ่านไฟล์ image อื่นๆ และ image processing [tutorial](http://insightsoftwareconsortium.github.io/SimpleITK-Notebooks/)\n\
  - [Numpy](https://numpy.org/) ใช้สำหรับการคำนวณทางคณิตศาสตร์\n- [Pandas](https://pandas.pydata.org/)\
  \ ใช้สำหรับการ process Tabular file\n- [Matplotlib](https://matplotlib.org/) ใช้สำหรับการ visualize\
  \ data\n- [MONAI](https://monai.io/) รวม Model และ tools ต่างๆตั้งแต่การ Label จนถึง Deep learning\n\
  \n## Machine learning\n\n- [Scikit-learn](https://scikit-learn.org) ใช้สำหรับการทำ machine learning\n\
  - [Pyradiomics](https://www.radiomics.io/pyradiomics.html) Python library สำหรับการคำนวณ Radiomics\n\
  \n## Deep learning\n\n- [Pytorch](https://pytorch.org/) ใช้สำหรับการทำ deep learning\n- [PyTorch Image\
  \ Models](https://huggingface.co/timm) Library ที่รวม Pretrained model สำหรับ image data ใน Pytorch\n\
  - [MONAI](https://monai.io/) รวม Model และ tools ต่างๆตั้งแต่การ Label จนถึง Deep learning\n\n## อื่นๆ\n\
  \nsection นี้จะแนะนำ resource อื่นๆที่อาจจะจำเป็นสำหรับการเขียนโปรแกรมหรือทำวิจัยทางด้าน radiotherapy\n\
  \n- [3D slicer](https://www.slicer.org/) เป็น Software สำหรับ medical image analysis ภาษาที่ใช้จะเป็น\
  \ Python\n- [pymedphys](https://github.com/pymedphys/pymedphys) เป็น Python library สำหรับ medical physics\n\
  - [matRad](https://e0404.github.io/matRad/) เป็น Software สำหรับ intensity-modulated photon, proton,\
  \ and carbon ion therapy ภาษาที่ใช้จะเป็น MATLAB\n- [Github](https://github.com/) คือเว็บไซด์ที่ใช้\
  \ Git ไว้สำหรับการจัดเก็บ code โดยสามารถหา public resources (code, tutorial) ที่คนอื่นได้เปิดไว้ให้เราได้อ่านหรือนำไปใช้ได้ฟรีๆอีกด้วยในบางโปรเจค\n\
  - [Pyradiomics](https://www.radiomics.io/pyradiomics.html) Python library สำหรับการคำนวณ Radiomics\n"

readme_excerpt: " # Rdiomics-7  Enhancing Precision Medicine of TP53 mutation carriers using AI/GenAI\
  \ Radiomics\n\n - Hi, my name is Mohamed Aga, Welcome to the GitHub page for my project: Radiomics 7.\n\
  \n ## This repository contains two main folders:\n 1. Radiomics/ – Scripts and data related to MRI-based\
  \ analysis of breast cancer, focused on radiomics feature extraction and prediction of genetic mutations.\n\
  \ 2. Cellomics/ – Scripts for processing IMARIS-generated Excel files to analyze morphokinetic features\
  \ and categorize fluorescence intensity per cell. This includes colocalization of protein markers across\
  \ multiple fluorescence channels.\n\n- Each folder includes Python code and relevant resources for that\
  \ pipeline.\n  \n\U0001F4C2 For more details on each part, see the README.md inside each folder.\n\n\
  ## \U0001F4C1 Project Structure (Simplified)\n```project-root/\n├── README.md            ← General overview\
  \ (this file)\n├── Radiomics/           ← Radiomics pipeline\n└── Cellomics/           ← Cellomics pipeline\n\
  ```\n\n## Author and Contact\n- Mohamed Aga\n- Email: mohamed.2001agha@gmail.com\n"

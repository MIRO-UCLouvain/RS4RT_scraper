readme_excerpt: "# Prediction-model-for-timely-innovation-implementation-in-radiotherapy\n\n\n<!-- ABOUT\
  \ THE PROJECT -->\n## About The Project\n\nThe improvement of radiotherapy depends largely on the implementation\
  \ of innovations, of which effectivity varies widely. The aim of this study is to develop a prediction\
  \ model for successful innovation implementation in radiotherapy to improve effective management of\
  \ innovation projects.<br>\nA multivariate prediction model was built to predcit the chance an an innovation\
  \ being timely implemented. The prediction model contains the following determinants: (1) sufficient\
  \ and competent employees, (2) complexity, (3) understanding/ awareness of the project goals and process\
  \ by employees, (4) feasibility and desirability. The area Under the curve (AUC) of the internal validation\
  \ of the model was 0.86 (0.8–0.92, 95% CI). External validation was done on a completely new dataset.\
  \ Comparing the outcome predictions with the observed outcomes of all innovations resulted in an AUC\
  \ of the external validation of the prediction model of 0.72 (0.60 – 0.84, 95% CI). <br> \n\n### Built\
  \ With\n\n<p align=\"left\">SPSS for Windows version 25 </p>\n<p align=\"left\">Externally validated\
  \ with SPSS for Windows version 26 </p>\n\n<!-- GETTING STARTED -->\n## Getting Started / Usage\n\n\
  *Step 1*: Classify innovation as: \n<p>- treatment innovation (treatments that are new, or which constitute\
  \ a significant improvement in terms of their characteristics or intended use); \n<p>- technological\
  \ innovation (new or significantly improved treatment process or delivery method that has no noticeable\
  \ consequences for the treatment; including significant changes in the techniques applied, the equipment\
  \ used or the available software of the devices); \n<p>- organizational innovation (new or significant\
  \ changes in clinic organizational structure or management methods/systems).\n\n*Step 2*: Answer the\
  \ following questions (by project leader and all project members):<br>\n<p>- Is the project an organisational\
  \ innovation? Yes/No<br>\n<p>- Is the project a treatment innovation? Yes/No<br>\n<p>- Sufficient and\
  \ competent employees to perform this project? Yes/No<br>\n<p>- Is it a complex (integration of many\
  \ functionalities and devices / many professionals) project? Yes/No<br>\n<p>- Good understanding and\
  \ awareness of the project goals and process? Yes/No<br>\n<p>- Good feasibility & desirability? Yes/No<br>\n\
  \n*Step 3*: Use logistic regression formula to calculate the chance of timely implementation.<br>\n\n\
  <!-- References -->\n## References\n\nSwart RR, Jacobs MJ, Roumen C, Houben RM, Koetsveld F, Boersma\
  \ LJ. Factors predicting timely implementation of radiotherapy innovations: the first model. Br J Radiol.\
  \ 2021 Jan 1;94(1117):20200613.<br>\n\nSwart R, Jacobs M, Boersma L. Behrendt, M., Ketelaars, M. Roumen\
  \ C, Fijten, R., PO-1521: External validation of a prediction model for timely implementation of innovations\
  \ in radiotherapy. ESTRO 2021 - Congr 27-31 August 2021.<br>\n\n\n<!-- CONTACT -->\n## Contact\n\nRachelle\
  \ Swart - rachelle.swart@maastro.nl\n\nProject Link: [https://github.com/github_username/repo_name](https://github.com/github_username/repo_name)\n\
  \n<!-- ACKNOWLEDGMENTS -->\n## Acknowledgements\n\nWe thank Netherlands Cancer Institute [www.nki.nl],\
  \ Southwest Radiotherapy Institute [www.zrti.nl] and Leiden University Medical Center Department of\
  \ Radiation Oncology [www.lumc.nl] for participating in this study, providing us with projects implemented\
  \ in their\ncentre.\n\n"

readme_excerpt: "PyRaDiSe\n========\n\n[![Documentation Status](https://readthedocs.org/projects/pyradise/badge/?version=latest)](https://pyradise.readthedocs.io/en/latest/?badge=latest)\n\
  \nPyRaDiSe is an open-source Python (Py) package for developing deployable, radiotherapy-oriented (Ra),\
  \ DICOM-based (Di) \nauto-segmentation (Se) solutions. PyRaDiSe is DL framework-independent but can\
  \ easily integrate most DL frameworks, \nsuch as PyTorch or TensorFlow. The package addresses the following\
  \ challenges for building radiotherapy-oriented \nauto-segmentation solutions: handling DICOM data,\
  \ managing and converting DICOM-RTSS data (incl. a 2D-based and \na 3D-based conversion algorithm),\
  \ invertible pre-processing, and post-processing. In addition to building \nauto-segmentation solutions,\
  \ PyRaDiSe allows for converting and curating DICOM image series and DICOM-RTSS data to \nsimplify segmentation\
  \ training dataset construction. Therefore, PyRaDiSe is highly flexible, allows for fast \nprototyping,\
  \ and facilitates a fast transition of data science research results into clinical radiotherapy research.\n\
  \n<img alt=\"PyRaDiSe_Meme\" src=\"https://github.com/ubern-mia/pyradise/raw/main/docs/_static/meme.jpg\"\
  \ width=\"300\">\n\nMain Features\n-------------\nThe main features of PyRaDiSe are data handling, conversion\
  \ from and to DICOM-RTSS, and data processing, including deep \nlearning model inference. The intended\
  \ use of PyRaDiSe in the radiotherapy environment is depicted below. The \nDICOM and other discrete\
  \ medical image file formats, such as NIfTI, are imported into the provided data model using \nthe [`fileio`\
  \ package](https://pyradise.readthedocs.io/en/latest/reference/pyradise.fileio.html). In contrast to\
  \ the \nstandard way of loading DICOM data, this package provides comprehensive and flexible import\
  \ routines that consider \ndata relation details and automate import steps, such as registering DICOM\
  \ images if DICOM registration files are \navailable. However, in some cases, the DICOM standard does\
  \ not provide sufficient information for automation, \nrequiring minimal human interaction for resolution.\
  \ In addition, discrete medical images also suffer from the lack of \nidentification data needed for\
  \ automation. However, the [`fileio` package](https://pyradise.readthedocs.io/en/latest/reference/pyradise.fileio.html)\
  \ \npackage offers the necessary methods to address these issues with flexible approaches and prototypes.\
  \ Furthermore, \nthe [`fileio` package](https://pyradise.readthedocs.io/en/latest/reference/pyradise.fileio.html)\
  \ provides \nroutines to select specific entities from the available data before loading by generating\
  \ filterable pre-loading \ninformation (so-called [`SeriesInfo`](https://pyradise.readthedocs.io/en/latest/reference/pyradise.fileio.series_info.html#pyradise.fileio.series_info.SeriesInfo))\n\
  so that the computation time and memory usage for loading is minimal. Finally, after the data is loaded,\
  \ it is \nrepresented using the data model implemented in the [`data` package](https://pyradise.readthedocs.io/en/latest/reference/pyradise.data.html).\
  \ \nAll downstream tasks are performed using the simple and extensible radiotherapy-oriented data model\
  \ from this step on.\n\nAfter loading, the data is either converted and written to a file or processed\
  \ using routines from the \n[`process` package](https://pyradise.readthedocs.io/en/latest/reference/pyradise.process.html).\
  \ This package includes \nfunctionality and prototypes for pre-processing, deep learning model inference,\
  \ and post-processing with a similar mode \nof operations as well-known medical image libraries, such\
  \ as SimpleITK or ITK. However, in contrast to other libraries, \nthe process package offers a mechanism\
  \ for guaranteeing reproducibility and limited invertibility.\n\nAfter processing or loading, the altered\
  \ data can be written to disk using a versatile writer from the \n[`fileio` package](https://pyradise.readthedocs.io/en/latest/reference/pyradise.fileio.html)\
  \ to save the data as either \na discrete image file or as DICOM-RTSS. In addition, specific writers\
  \ provide the additional functionality to copy \nthe input data from the source to the target directory.\
  \ This feature is handy if the developed auto-segmentation \nsolution will be deployed to the clinical\
  \ environment or the cloud, where the original input data should remain \nunmodified.\n\n<img src=\"\
  https://github.com/ubern-mia/pyradise/raw/main/docs/_static/architecture_overview_v2.png\" alt=\"Schematic\
  \ illustration of PyRaDiSe in the radiotherapy environment\">\n\n\nGetting Started\n---------------\n\
  \nIf you are new to PyRaDiSe, here are a few guides to get you up to speed right away:\n\n - [Installation](https://pyradise.readthedocs.io/en/latest/installation.html)\
  \ for installation instructions - or simply run `pip install pyradise`\n - [Examples](https://pyradise.readthedocs.io/en/latest/examples.html)\
  \ give you an overview of PyRaDiSe's intended use. Jupyter notebooks are available in the directory\
  \ [./examples](https://github.com/ubern-mia/pyradise/tree/main/examples/).\n - [Change history](https://pyradise.readthedocs.io/en/latest/change_history.html)\n\
  \ - [Acknowledgments](https://pyradise.readthedocs.io/en/latest/acknowledgment.html)\n\n\nCitation\n\
  --------\n\nIf you use PyRaDiSe for your research, please acknowledge it accordingly by citing our paper:\n\
  \nBibTeX entry:\n\n    @article{Ruefenacht2023,\n    author = {Rüfenacht, Elias and Kamath, Amith and\
  \ Suter, Yannick and Poel, Robert and Ermis, Ekin and Scheib, Stefan and Reyes, Mauricio},\n    title\
  \ = {{PyRaDiSe: A Python package for DICOM-RT-based auto-segmentation pipeline construction and DICOM-RT\
  \ data conversion}},\n    journal = {Computer Methods and Programs in Biomedicine},\n    doi = {10.1016/j.cmpb.2023.107374},\n\
  \    issn = {0169-2607},\n    year = {2023}\n    }\n"

readme_excerpt: "# Bun + React + TypeScript + Vite\n\nThis template provides a minimal setup to get React\
  \ working in Vite with HMR and some ESLint rules.\nUsing `bun` instead of `npm`, and `bunx` instead\
  \ of npx.\n\n## Tailwind + ShadCN for easy UI dev\n\n[Tailwind](https://tailwindcss.com/docs/guides/vite)\
  \ is already setup for easy yet powerfully custom styling.\n[ShadCN](https://ui.shadcn.com/docs/installation/vite)\
  \ providing a simple layer above [Radix UI](https://www.radix-ui.com/) and Tailwind.\n\nStart Dev\n\
  `bun run dev`\n\nCurrently, two official plugins are available:\n\n- [@vitejs/plugin-react](https://github.com/vitejs/vite-plugin-react/blob/main/packages/plugin-react/README.md)\
  \ uses [Babel](https://babeljs.io/) for Fast Refresh\n- [@vitejs/plugin-react-swc](https://github.com/vitejs/vite-plugin-react-swc)\
  \ uses [SWC](https://swc.rs/) for Fast Refresh\n\n## Expanding the ESLint configuration\n\nIf you are\
  \ developing a production application, we recommend updating the configuration to enable type aware\
  \ lint rules:\n\n- Configure the top-level `parserOptions` property like this:\n\n```js\n   parserOptions:\
  \ {\n    ecmaVersion: 'latest',\n    sourceType: 'module',\n    project: ['./tsconfig.json', './tsconfig.node.json'],\n\
  \    tsconfigRootDir: __dirname,\n   },\n```\n\n- Replace `plugin:@typescript-eslint/recommended` to\
  \ `plugin:@typescript-eslint/recommended-type-checked` or `plugin:@typescript-eslint/strict-type-checked`\n\
  - Optionally add `plugin:@typescript-eslint/stylistic-type-checked`\n- Install [eslint-plugin-react](https://github.com/jsx-eslint/eslint-plugin-react)\
  \ and add `plugin:react/recommended` & `plugin:react/jsx-runtime` to the `extends` list\n"

readme_excerpt: "# MattoRadiomics\nradiomic feature elimination, clustering, model building and analysis\n\
  \nThis repository contains code to analyze radiomic features extracted from MRI and PET data during\
  \ the MATTO project. The provided code allows the user to build a fully automated feature processing,\
  \ model building, and evaluation pipeline, and provides the following features:\n- Analyze radiomic\
  \ features\n- Eliminate redundant and unimportant features\n- Cluster features\n- Feature sampling using\
  \ different methods\n- Cross-validation and nested cross-validation\n- Model building (e.g. logistic,\
  \ linear or cox models)\n- Combine multiple models into an ensemble model\n- Model evaluation (e.g.\
  \ concordance index, accuracy, AUC)\n- Model analysis (e.g. feature importance, frequency and coefficients)\n\
  \nTo apply the feature elimination and model building routines you must run the `MattoRunModelTrainingWithCV.R`\
  \ script. The script takes three arguments. The first one specifies the output folder, the second one\
  \ defines the settings class to use and the last one is the class name of the csv parser to use.\n```\n\
  ./MattoRunModelTrainingWithCV.R /path/to/output/folder MattoSettingsCox MattoCSVParserOS\n```\nThe class\
  \ `MattoSettingsCox` is defined in `MattoSettings.R` and contains information about cross validation,\
  \ which models to use, feature elimination pipeline and samplers. \nThe class `MattoCSVParserOS` is\
  \ defined in `MattoCSVParser.R`. In the csv parser the file containing the radiomic features and information\
  \ about the file (e.g. columns to include or exclude, which columns contain the target variables) is\
  \ given.\n\nAfter successfully training a model or an ensemlbe of models you can evaluate the models\
  \ using `EvaluateModels.R`. The script takes three arguments. The first one specifies the folder containing\
  \ the trained model. The second and third argument define the settings class and csv parser class used\
  \ during training. To evaluate the model created with the command above run:\n```\n./EvaluateModels.R\
  \ /path/to/output/folder MattoSettingsCox MattoCSVParserOS\n```\nThe script creates a file called info.txt\
  \ in the defined output folder.\n\nIn case you want to have more information about the features used\
  \ in the trained models, use `EvaluateFeatureCoefficients.R`. The script gives information about how\
  \ often a feature was used for a model in cross-validation, the model coefficients and the cluster it\
  \ is part of. The parameters are the same as for `./EvaluateModels.R`\n```\n./EvaluateFeatureCoefficients.R\
  \ /path/to/output/folder MattoSettingsCox MattoCSVParserOS\n```\nThe script creates a file called featureInfo.txt\
  \ in the specified output folder.  \n\n---\n\nFor developement and testing R version 4.1.2 was used.\
  \ \nDependencies: tba\n\n---\nThis is an ongoing project. More code and information will follow.\n\n\
  If you have any questions or need more information about the code please feel free to contact me. \n"

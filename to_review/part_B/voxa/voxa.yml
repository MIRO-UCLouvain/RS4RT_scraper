readme_excerpt: "# VOxA — Voxel-Aware Oxygen Model\n\nCode and data for **\"Voxel-aware oxygen kinetics\
  \ resolves radiation-induced DNA damage retention across LET–oxygen conditions\"** (Bolo & Bagunu, 2026,\
  \ submitted to *Physics in Medicine and Biology*).\n\n## Overview\n\nVOxA predicts the oxygen enhancement\
  \ ratio (OER) for DNA double-strand break (DSB) retention at particle-therapy-relevant LET and oxygen\
  \ tension. It has two tiers:\n\n- **Oxygen Model (OM):** Population-level OER via dual sigmoidal LET\
  \ transitions with Z-ordering constraints and Michaelis–Menten oxygen kinetics. Calibrated on 233 OER\
  \ observations from 29 published sources spanning 10 particle types.\n- **Voxel-Aware (VA) extension:**\
  \ Per-DSB retention probability using local energy heterogeneity from TOPAS-nBio 4.0 track-structure\
  \ simulations.\n\n## Repository structure\n\n```\n├── README.md\n├── .gitignore\n├── session_info.txt\n\
  │\n├── step1_extract_furusawa_complete.R\n├── step2_compile_literature.R\n├── step3_particle_specific_dual_transitions.R\n\
  ├── step4_comprehensive_validation.R\n├── step5_comprehensive_validation_extended.R\n├── step6_uncertainty_analysis.R\n\
  ├── step7_bootstrap_ci_analysis.R\n├── step8_cross_validation.R\n├── step9_recalibrate_voxel_aware.R\n\
  ├── step10_voxa_va_diagnostics.R\n├── step11_voxa_scaling_validation.R\n├── step12_dsb_retention_table.R\n\
  │\n├── extract_energy_features_voxa.py\n├── voxa_model.py\n├── voxa_manuscript_figures.py\n│\n├── calibration_data/\n\
  │   ├── {electron,proton,carbon}_EnergyDeposit.csv   # Raw TOPAS-nBio energy deposits\n│   └── {electron,proton,carbon}_dsb_complexity.csv\
  \  # DSB complexity per track (~2500 DSBs)\n│\n├── validation_data/\n│   ├── {electron,proton,carbon}_EnergyDeposit.csv\
  \   # Independent simulation run\n│   └── {electron,proton,carbon}_dsb_complexity.csv  # (~400 DSBs,\
  \ same format)\n│\n├── voxa_features_output_calibration/\n│   ├── all_particles_calibration_energy_features.csv\n\
  │   ├── combined_calibration_statistics.json\n│   └── {electron,proton,carbon}_calibration_{dsb_energy_features.csv,energy_statistics.json}\n\
  │\n└── voxa_features_output_validation/\n    ├── all_particles_validation_energy_features.csv\n    ├──\
  \ combined_validation_statistics.json\n    └── {electron,proton,carbon}_validation_{dsb_energy_features.csv,energy_statistics.json}\n\
  ```\n\nThe `data/`, `results/`, and `figures/` directories are generated by the scripts and are not\
  \ tracked.\n\n## Data description\n\n**`calibration_data/`** and **`validation_data/`** contain the\
  \ raw TOPAS-nBio 4.0 simulation output for electron, proton, and carbon ions. The calibration arm has\
  \ ~2500 DSBs per particle and was used to fit the VA delta_f parameters (step 9). The validation arm\
  \ has ~400 DSBs per particle and was used for the sample-size invariance tests (step 11). The files\
  \ have the same names across both folders but contain independent simulation runs.\n\n**`voxa_features_output_calibration/`**\
  \ and **`voxa_features_output_validation/`** contain the per-DSB local energy features extracted from\
  \ the raw simulation files by `extract_energy_features_voxa.py`. These are the direct inputs to steps\
  \ 9–12. They are included here so the VA analysis can be reproduced without re-running the feature extraction.\n\
  \n## Running the analysis\n\nRun R scripts in order from the project root:\n\n```bash\nRscript step1_extract_furusawa_complete.R\n\
  Rscript step2_compile_literature.R\n# ... through step12\n```\n\nBefore running the manuscript figure\
  \ script, export model parameters from R (see the docstring at the top of `voxa_manuscript_figures.py`).\
  \ Then:\n\n```bash\npython voxa_manuscript_figures.py\n```\n\nStep 7 (bootstrap) takes 20–60 minutes.\
  \ All other steps are fast.\n\n## Requirements\n\n**R** (≥ 4.3):\n\n```r\ninstall.packages(c(\"tidyverse\"\
  , \"MASS\", \"minpack.lm\", \"boot\",\n                   \"jsonlite\", \"gridExtra\", \"car\", \"cowplot\"\
  ,\n                   \"scales\", \"viridis\"))\n```\n\n**Python** 3.14:\n\n```\nnumpy\npandas\nscipy\n\
  matplotlib\n```\n\nSee `session_info.txt` for exact package versions.\n\n## OER calibration data sources\n\
  \nThe 233-observation OER calibration dataset for the OM tier is compiled from the sources listed in\
  \ Appendix C of the manuscript. Furusawa et al. (2000) data (He, C, Ne ions; V79 and HSG cells) were\
  \ extracted directly from published D₁₀ tables. Tinganelli et al. (2015) data for intermediate oxygen\
  \ levels extend the coverage beyond the standard Wenzl & Wilkens (2011) compilation. These are assembled\
  \ by steps 1–2 and written to `data/` at runtime.\n\n## Contact\n\nRenato III Fernan Bolo  \nDepartment\
  \ of Physical Sciences and Mathematics, University of the Philippines Manila  \nrfbolo@up.edu.ph\n"

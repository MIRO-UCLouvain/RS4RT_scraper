readme_excerpt: "# Comment-Toxicity-Prediction-App\nDeployed App Link : https://sanjeevk11-comment-toxicity-prediction-app-app-z20khk.streamlit.app/\n\
  \n\nDemo Video Link : https://drive.google.com/file/d/1_fnVdqGFYLQM8hU91Yoz521-hN2xTji4/view?usp=sharing\n\
  \n\n# Comment Toxicity Prediction App\n\n## Overview\n\nThis project, the \"Comment-Toxicity-Prediction-App,\"\
  \ utilizes a machine learning algorithm known as Naive Bayes for predicting the toxicity of comments.\
  \ The model calculates the probability of a comment falling into categories such as toxic, severe toxic,\
  \ obscene, insult, threat, identity hate, etc.\n\n## Machine Learning Model\n\nThe toxicity prediction\
  \ model is built using the Naive Bayes algorithm. This algorithm is commonly used for text classification\
  \ tasks, making it suitable for analyzing and categorizing comments based on their toxicity levels.\
  \ The model has been trained on a labeled dataset to make predictions on new comments.\n\n## Prediction\
  \ Categories\n\nThe model categorizes comments into the following toxicity levels:\n\n- Toxic\n- Severe\
  \ Toxic\n- Obscene\n- Insult\n- Threat\n- Identity Hate\n\n## Usage\n\nTo use the Comment Toxicity Prediction\
  \ App, follow these steps:\n\n1. **Clone Repository:**\n   ```bash\n   [git clone https://github.com/sanjeevk11/Comment-Toxicity-Prediction-App.git]\n\
  \   cd Comment-Toxicity-Prediction-App\n   ```\n\n2. **Install Dependencies:**\n   ```bash\n   pip install\
  \ -r requirements.txt\n   ```\n\n3. **Run the Web App:**\n   ```bash\n   streamlit run app.py\n   ```\n\
  \n4. **Access the App:**\n   Open your web browser and navigate to `http://localhost:8501` to interact\
  \ with the Comment-Toxicity-Prediction-Model.\n\n5. Enter a comment in the input field, and the app\
  \ will provide the predicted probabilities for each toxicity category.\n\n## Sample output:\n\n### Good\
  \ Comment\n.\n.\n![good comment](https://github.com/user-attachments/assets/c7a0e4c9-6363-438f-8482-49f3ac83249f)\n\
  \n\n### Bad Comment\n.\n.\n![bad comment](https://github.com/user-attachments/assets/de71f7f4-f887-4170-88cc-ca8b235fd4c4)\n\
  \n"

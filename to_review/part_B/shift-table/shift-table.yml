readme_excerpt: "# Table-Shift\n\n**Table-Shift** is a Python-based simulation tool for radiotherapy treatment\
  \ planning. It generates random CT scan isocenter (ISO) positions and random displacements with directions,\
  \ allowing users to practice calculating new treatment ISO positions. This tool is ideal for learning\
  \ and exercises in radiotherapy planning, particularly for understanding how to adjust ISO positions\
  \ based on given displacements.\n\n## Features\n- Generates random initial CT ISO positions within specified\
  \ ranges.\n- Applies random displacements with directions (Left/Right, Superior/Inferior, Anterior/Posterior).\n\
  - Displays the initial CT ISO positions and displacements for user calculation.\n- Reveals the correct\
  \ treatment ISO positions after a short pause for self-assessment.\n\n## Usage\n1. Clone the repository\
  \ or download the script.\n2. Run the script using Python 3:\n   ```bash\n   python table_shift.py\n\
  \   ```\n3. Follow the on-screen instructions to practice calculating treatment ISO positions.\n\n##\
  \ Example Output\n```\nInitial CT ISO Position:\nx: 5.3\ny: 45.7\nz: -15.2\n\nDisplacements to Apply:\n\
  3.5 Left\n2.1 Superior\n4.8 Posterior\n\nTreatment ISO Position:\nx: 1.8\ny: 47.8\nz: -20.0\n```\n\n\
  ## Requirements\n- Python 3.x\n- No additional libraries required.\n\n## License\nThis project is open-source\
  \ and available under the MIT License.\n\n## Contributing\nContributions are welcome! Please open an\
  \ issue or submit a pull request for any improvements or suggestions.\n"

readme_excerpt: "usage: main.py [-h] -m DOSE_RTDOSE [DOSE_RTDOSE ...] -l LET_RTDOSE\n               [LET_RTDOSE\
  \ ...] -s STRUCTURES [-o OUTPUT_FILE] [-O OUTPUT_DIR]\n               [-a ALPHABETA] [--disregard-body]\
  \ [--physical-dose]\n               [--interactive] --model MODEL --fractions FRACTIONS\n\nTool for\
  \ calculating variable RBE models.\n\noptions:\n  -h, --help            show this help message and exit\n\
  \  -m DOSE_RTDOSE [DOSE_RTDOSE ...], --dose-rtdose DOSE_RTDOSE [DOSE_RTDOSE ...]\n                 \
  \       List of MC RTDOSE dose files\n  -l LET_RTDOSE [LET_RTDOSE ...], --let-rtdose LET_RTDOSE [LET_RTDOSE\
  \ ...]\n                        List of MC RTDOSE LET files\n  -s STRUCTURES, --structures STRUCTURES\n\
  \                        Path to RTSTRUCT file\n  -o OUTPUT_FILE, --output-file OUTPUT_FILE\n      \
  \                  Write the resulting DICOM to this file. Write default\n                        to\
  \ have have default naming.\n  -O OUTPUT_DIR, --output-dir OUTPUT_DIR\n                        Write\
  \ the resulting DICOM files to this directory. If\n                        it does not exist it will\
  \ be created\n  -a ALPHABETA, --alphabeta ALPHABETA\n                        Path to file containing\
  \ alpha/beta ratios for chosen\n                        structures. Names must match the structures\
  \ in the\n                        given RTSTRUCT file.\n  --disregard-body      Diseregards the body\
  \ in terms of alpha beta ratios, as\n                        the RBE values are not important outside\
  \ of the body\n                        anyway.\n  --physical-dose       Set this if the MC doses are\
  \ in physical dose.\n  --interactive         Set this if you wish to enter interactive mode in code\n\
  \                        when done. Can be useful for testing.\n  --model MODEL         Which RBE model\
  \ do you wish to use? You can choose\n                        \"all\" for all models.\n  --fractions\
  \ FRACTIONS\n                        How many fractions are the treatment designed for?\n"

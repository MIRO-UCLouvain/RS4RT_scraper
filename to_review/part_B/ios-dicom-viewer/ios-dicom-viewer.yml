readme_excerpt: "# \U0001F3E5 iOS DICOM Viewer\n\n> **Professional iOS DICOM viewer app with 3D rendering,\
  \ segmentation support, and RT structure visualization. OHIF-inspired architecture for clinical-grade\
  \ medical imaging.**\n\n[![iOS](https://img.shields.io/badge/iOS-15.0+-blue.svg)](https://developer.apple.com/ios/)\n\
  [![Swift](https://img.shields.io/badge/Swift-5.9+-orange.svg)](https://swift.org/)\n[![Xcode](https://img.shields.io/badge/Xcode-15.0+-blue.svg)](https://developer.apple.com/xcode/)\n\
  [![License](https://img.shields.io/badge/License-MIT-green.svg)](LICENSE)\n[![DICOM](https://img.shields.io/badge/DICOM-Compliant-brightgreen.svg)](https://www.dicomstandard.org/)\n\
  \n## ⚠️ Medical Disclaimer\n\n**This application is for informational and educational purposes only.\
  \ It is not intended for clinical diagnosis or medical decision-making. Always consult qualified medical\
  \ professionals for medical advice.**\n\n## \U0001F31F Features\n\n### \U0001F3D7️ **OHIF-Inspired Architecture**\n\
  - **Modular Design**: Clean separation of concerns with extensible components\n- **Service-Oriented**:\
  \ Centralized data management and business logic\n- **Performance-First**: Optimized for large medical\
  \ imaging datasets\n- **Extension Ready**: Plugin architecture for specialized medical tools\n\n###\
  \ \U0001F4F1 **Native iOS Integration**\n- **Touch Interactions**: Professional pinch-to-zoom, pan,\
  \ and gesture controls\n- **File Import**: Seamless integration with Files app, iCloud Drive, and AirDrop\n\
  - **Modern UI**: Native iOS design patterns with medical imaging focus\n- **Document Types**: Automatic\
  \ DICOM file type registration and handling\n\n### \U0001F3E5 **Medical Imaging Standards**\n- **DICOM\
  \ Compliance**: Standard-compliant metadata handling and parsing\n- **Window/Level**: Medical-grade\
  \ image display with clinical presets\n- **Multi-Modality**: Support for CT, MRI, X-Ray, and other DICOM\
  \ types\n- **Multi-Frame**: Efficient handling of multi-slice studies and series\n\n### \U0001F3AE **Advanced\
  \ Rendering**\n- **2D Viewer**: High-performance image rendering with window/level adjustments\n- **3D\
  \ Ready**: Metal-based 3D volume rendering framework\n- **Caching**: Memory-efficient image caching\
  \ for smooth navigation\n- **Real-time**: Responsive touch-based window/level adjustments\n\n## \U0001F680\
  \ **Quick Start**\n\n### **Prerequisites**\n- macOS 12.0+ with Xcode 15.0+\n- iOS 15.0+ target device\
  \ or simulator\n- Swift 5.9+ knowledge\n\n### **1. Clone and Build**\n```bash\ngit clone https://github.com/YOUR_USERNAME/iOS-DICOM-Viewer.git\n\
  cd iOS-DICOM-Viewer\nopen iOS_DICOMViewer.xcodeproj\n```\n\n### **2. Run with Sample Data**\n- Build\
  \ and run the project (⌘+R)\n- The app includes sample DICOM studies for immediate testing\n- Navigate\
  \ through studies, series, and instances\n- Test touch interactions and window/level adjustments\n\n\
  ### **3. Import Real DICOM Files**\n- Tap the \"+\" button in the study list\n- Use the document picker\
  \ to import DICOM files\n- Support for Files app, iCloud Drive, and AirDrop\n\n## \U0001F527 **DCMTK\
  \ Integration (Optional)**\n\nFor production use with real DICOM files, integrate the DCMTK library:\n\
  \n```bash\n# Build DCMTK for iOS\n./build_dcmtk.sh\n\n# Configure Xcode project:\n# 1. Add library search\
  \ paths\n# 2. Link DCMTK libraries\n# 3. Update bridging header\n```\n\nSee [IMPLEMENTATION_SUMMARY.md](IMPLEMENTATION_SUMMARY.md)\
  \ for detailed integration steps.\n\n## \U0001F4CB **Project Structure**\n\n```\niOS_DICOMViewer/\n\
  ├── Core/\n│   ├── Models/              # DICOM domain objects\n│   │   ├── DICOMMetadata.swift\n│ \
  \  │   ├── DICOMStudy.swift\n│   │   ├── DICOMSeries.swift\n│   │   └── DICOMInstance.swift\n│   └──\
  \ Services/            # Business logic layer\n│       ├── DICOMServiceManager.swift\n│       ├── DICOMMetadataStore.swift\n\
  │       ├── DICOMFileImporter.swift\n│       └── DICOMImageRenderer.swift\n├── ViewControllers/    \
  \     # UI presentation layer\n│   ├── MainViewController.swift\n│   ├── StudyListViewController.swift\n\
  │   └── ViewerViewController.swift\n├── DICOM/\n│   ├── Parser/             # DICOM file parsing\n│\
  \   └── Bridge/             # DCMTK C++ integration\n├── Rendering/\n│   └── 3D/                 # Future\
  \ 3D rendering\n└── Extensions/\n    ├── Segmentation/       # DICOM segmentation\n    └── StructureSet/\
  \       # RT structure sets\n```\n\n## \U0001F3AF **Core Capabilities**\n\n### **Study Management**\n\
  - **Study List**: Browse imported DICOM studies with metadata\n- **Series Navigation**: Multi-series\
  \ support with thumbnail previews\n- **Instance Browsing**: Frame-by-frame navigation with slider controls\n\
  - **File Import**: Multiple import methods with validation\n\n### **Image Viewing**\n- **Professional\
  \ Viewer**: Medical-grade image display interface\n- **Window/Level**: Touch-based adjustments with\
  \ clinical presets\n- **Zoom & Pan**: Smooth touch interactions with gesture recognition\n- **Multi-Frame**:\
  \ Efficient navigation through CT/MRI slices\n\n### **Touch Interactions**\n- **Pinch to Zoom**: Smooth\
  \ scaling with automatic centering\n- **Pan Gestures**: Window/level adjustment via finger movement\n\
  - **Double Tap**: Quick zoom reset functionality\n- **Slider Navigation**: Precise instance-by-instance\
  \ browsing\n\n## \U0001F6E0️ **Architecture Highlights**\n\n### **Service Layer Pattern**\n```swift\n\
  // Centralized service coordination\nDICOMServiceManager.shared.metadataStore\nDICOMServiceManager.shared.fileImporter\n\
  DICOMServiceManager.shared.parser\n```\n\n### **Async/Await Integration**\n```swift\n// Modern Swift\
  \ concurrency\nTask {\n    let study = try await DICOMParser.shared.parseFile(url)\n    await metadataStore.addStudy(study)\n\
  }\n```\n\n### **Memory Management**\n```swift\n// Efficient caching with automatic cleanup\nclass DICOMImageCache\
  \ {\n    private let cache = NSCache<NSString, UIImage>()\n    // Automatic memory pressure handling\n\
  }\n```\n\n## \U0001F680 **Future Extensions**\n\n### **\U0001F3AE 3D Rendering** *(Planned)*\n- Metal-based\
  \ volume rendering\n- Multi-planar reconstruction (MPR)\n- Isosurface visualization\n- Real-time 3D\
  \ interactions\n\n### **\U0001F3A8 Segmentation Support** *(Planned)*\n- DICOM SEG overlay rendering\n\
  - Interactive segmentation tools\n- Multi-segment visualization\n- Color-coded anatomical regions\n\n\
  ### **⚗️ RT Structure Sets** *(Planned)*\n- RT Structure Set visualization\n- Radiation therapy planning\n\
  - Dose distribution display\n- Beam geometry visualization\n\n### **\U0001F4CF Advanced Measurements**\
  \ *(Planned)*\n- Distance and angle measurements\n- Area and volume calculations\n- Clinical measurement\
  \ presets\n- Automated analysis tools\n\n## \U0001F9EA **Sample Data**\n\nThe app includes built-in\
  \ sample data for testing:\n- **Sample CT Study**: Multi-slice abdominal CT with realistic metadata\n\
  - **Sample MR Series**: T1-weighted brain MR images\n- **Realistic Parameters**: Authentic DICOM metadata\
  \ and image characteristics\n\n## \U0001F4DA **Documentation**\n\n- [Implementation Summary](IMPLEMENTATION_SUMMARY.md)\
  \ - Detailed technical overview\n- [Build Instructions](README.md) - Setup and compilation guide\n-\
  \ [Architecture Guide](docs/architecture.md) *(Coming Soon)*\n- [API Documentation](docs/api.md) *(Coming\
  \ Soon)*\n\n## \U0001F91D **Contributing**\n\nWe welcome contributions! Please see our contributing\
  \ guidelines:\n\n1. **Fork** the repository\n2. **Create** a feature branch (`git checkout -b feature/amazing-feature`)\n\
  3. **Commit** your changes (`git commit -m 'Add amazing feature'`)\n4. **Push** to the branch (`git\
  \ push origin feature/amazing-feature`)\n5. **Open** a Pull Request\n\n### **Development Setup**\n```bash\n\
  # Clone your fork\ngit clone https://github.com/YOUR_USERNAME/iOS-DICOM-Viewer.git\n\n# Create feature\
  \ branch\ngit checkout -b feature/new-feature\n\n# Make changes and test\n# Commit and push\n```\n\n\
  ## \U0001F4CB **Requirements**\n\n### **Development**\n- macOS 12.0+\n- Xcode 15.0+\n- Swift 5.9+\n\
  - iOS 15.0+ SDK\n\n### **Runtime**\n- iOS 15.0+\n- 2GB+ RAM recommended\n- 500MB+ available storage\n\
  \n### **Optional Dependencies**\n- DCMTK 3.6.8+ (for production DICOM parsing)\n- CMake 3.20+ (for DCMTK\
  \ compilation)\n\n## \U0001F3F7️ **Tags**\n\n`ios` `dicom` `medical-imaging` `healthcare` `ohif` `swift`\
  \ `xcode` `3d-rendering` `segmentation` `rt-structures` `medical-software` `imaging-viewer`\n\n## \U0001F4C4\

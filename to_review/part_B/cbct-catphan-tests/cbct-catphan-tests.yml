readme_excerpt: "# CBCT Catphan Analysis Tool\n\nA Python tool for quantifying low contrast visibility\
  \ between different Catphan 503 CBCT scans using pylinac.\n\n## Overview\n\nThis project analyzes and\
  \ compares two Catphan phantom scans to quantify differences in:\n- **Low Contrast Visibility (LCV)**\
  \ - CTP515 module analysis\n- **Geometric Accuracy** - CTP404 module measurements \n- **Spatial Resolution**\
  \ - CTP528 high-contrast line pair analysis\n\n## Features\n\n- Automated DICOM loading and phantom\
  \ registration\n- Comprehensive low contrast visibility analysis using Rose model\n- Geometric accuracy\
  \ measurements with tolerance checking\n- MTF-based spatial resolution quantification\n- Side-by-side\
  \ comparison of scan results\n- CSV export of quantitative results\n\n## Installation\n\n### Prerequisites\n\
  - Python 3.7+\n- DICOM scan data from Catphan 503 phantom\n\n### Dependencies\n```bash\npip install\
  \ -r requirements.txt\n```\n\n## Usage\n\n### Basic Analysis\n```bash\npython catphan_analysis.py\n\
  ```\n\nThe script will analyze two predefined scan datasets:\n1. \"7a default\" scan\n2. \"7a HD Wiener0.02\
  \ Median5\" scan\n\n### Manual Slice Selection (Diagnostic Mode)\nIf automatic phantom registration\
  \ fails, the script will offer to launch an interactive slice selector:\n\n```bash\npython catphan_slice_selector.py\
  \ <path_to_dicom_folder>\n```\n\nThe diagnostic tool provides:\n- Interactive slice navigation with\
  \ slider control\n- Visual identification of Catphan modules\n- Manual selection of CTP404, CTP515,\
  \ and CTP528 slices\n- Automatic integration with main analysis script\n\n### Results\n\nThe analysis\
  \ outputs:\n1. **Console results** with formatted comparison tables\n2. **CSV file** (`catphan_analysis_results.csv`)\
  \ with detailed metrics\n\n### Key Metrics Extracted\n\n#### Low Contrast Visibility\n- Mean, max, min\
  \ contrast values across ROIs\n- Visibility calculations using Rose model\n- ROI detectability scores\n\
  - Pass/fail status against thresholds\n\n#### Geometric Accuracy  \n- Average line length measurements\
  \ (mm)\n- HU linearity R² values\n- Scaling slope coefficients\n- Geometric tolerance pass/fail\n\n\
  #### Spatial Resolution\n- MTF 50%, 80%, 90% values (lp/mm)\n- High contrast detectability\n- Line pair\
  \ resolution limits\n\n## Project Structure\n\n```\ncbct-catphan-tests/\n├── catphan_analysis.py   \
  \       # Main analysis script\n├── catphan_slice_selector.py    # Interactive diagnostic tool\n├──\
  \ requirements.txt             # Python dependencies\n├── README.md                   # Project documentation\n\
  ├── catphan_analysis_results.csv # Output results (generated)\n├── manual_slice_selection.txt   # Manual\
  \ selection results (generated)\n└── .gitignore                  # Git ignore rules\n```\n\n## Technical\
  \ Details\n\n### Scan Configuration\n- **Scan 1:** 7a Default protocol (260 DICOM files)\n- **Scan 2:**\
  \ 7a HD Wiener0.02 Median5 protocol (260 DICOM files)  \n- **Phantom:** Catphan 503\n- **Analysis modules:**\
  \ CTP515 (LCV), CTP404 (Geometry), CTP528 (MTF)\n\n### Analysis Methodology\n- Uses pylinac CatPhan503\
  \ class for standardized analysis\n- Follows Catphan manufacturer specifications\n- Implements Michelson\
  \ contrast calculation (pylinac default)\n- Rose model visibility: `Visibility = Contrast × √(Area ×\
  \ DQE)`\n\n## Requirements\n\nSee `requirements.txt` for full dependency list. Key packages:\n- `pylinac`\
  \ - Medical physics analysis library\n- `numpy` - Numerical computing\n- `pandas` - Data manipulation\
  \ and analysis\n\n## Output Example\n\n```\n\U0001F4CA LOW CONTRAST VISIBILITY:\n----------------------------------------\n\
  7a Default:\n  Mean Contrast: 0.0234\n  Max Contrast:  0.0456\n  ROIs Visible:  8\n\n7a HD Wiener0.02\
  \ Median5:\n  Mean Contrast: 0.0298\n  Max Contrast:  0.0512\n  ROIs Visible:  9\n\n\U0001F50D LCV Difference:\n\
  \  Mean Contrast Δ: 0.0064 (27.4%)\n```\n\n## License\n\nThis project is intended for medical physics\
  \ quality assurance purposes.\n\n## Contributing\n\n1. Fork the repository\n2. Create a feature branch\n\
  3. Make your changes\n4. Add tests if applicable\n5. Submit a pull request\n\n## Support\n\nFor issues\
  \ or questions, please create an issue in the GitHub repository."

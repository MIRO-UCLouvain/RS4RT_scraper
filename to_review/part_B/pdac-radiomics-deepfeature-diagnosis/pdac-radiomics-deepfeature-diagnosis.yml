readme_excerpt: "# Tumor Echoes in Healthy Zones: A Radiomic Perspective on Pancreatic Ductal Adenocarcinoma\
  \ Diagnosis\n\nThis repository contains the datasets and source code for the study:\n\n**\"Tumor Echoes\
  \ in Healthy Zones: A Radiomic Perspective on Pancreatic Ductal Adenocarcinoma Diagnosis\"**\n\nThe\
  \ project explores a novel approach to diagnose Pancreatic Ductal Adenocarcinoma (PDAC) using radiomic\
  \ and deep learning features extracted not from the tumor itself, but from non-tumorous anatomical structures\
  \ in contrast-enhanced CT scans.\n\n---\n\n## \U0001F9E0 Abstract (Structured)\n\n**Objective:**  \n\
  To overcome limitations of tumor-centric imaging by identifying malignancy-induced changes in nearby\
  \ healthy anatomical structures through systemic feature extraction and multi-region analysis.\n\n**Materials\
  \ and Methods:**  \n- Dataset: 1,263 patients (PDAC and non-PDAC)  \n- Structures: arteries, veins,\
  \ pancreatic duct, parenchyma, and common bile duct  \n- Features:  \n  - **Radiomics** (via PyRadiomics,\
  \ 107 features/region)  \n  - **Deep Learning** (via 3D Convolutional Autoencoder)  \n- Three Approaches:\
  \  \n  1. Healthy tissue only (per-label)  \n  2. Row-wise label fusion (Approach 2)  \n  3. Column-wise\
  \ patient fusion (Approach 3)  \n- Feature selection + machine learning classification with explainability\
  \ via SHAP and t-SNE.\n\n**Results:**  \n- Best accuracy in Approach 3 (F1-score: 88.33%, AUC: 97.98%)\
  \  \n- Radiomic features outperformed deep features overall  \n- Pancreatic duct & parenchyma most informative\
  \  \n- SHAP/t-SNE confirmed diagnostic relevance of healthy tissues\n\n**Conclusion:**  \nSystemic changes\
  \ in non-tumorous tissues offer early, interpretable diagnostic power for PDAC detection, especially\
  \ in radiologically occult cases.\n\n---\n\n## \U0001F4C1 Folder Structure\n\nPDAC_Radiomics_DeepFeature_Diagnosis/\n\
  │\n├── data/\n│   ├── radiomics/\n│   │   ├── step_1/      # Individual healthy regions\n│   │   ├──\
  \ step_2/      # Row-wise label fusion (Approach 2)\n│   │   └── step_3/      # Column-wise patient\
  \ fusion (Approach 3)\n│   ├── deep_features/\n│   │   ├── step_1/\n│   │   ├── step_2/\n│   │   └──\
  \ step_3/\n│   └── *.xlsx           # All feature tables (per label & approach)\n│\n├── code/\n│   ├──\
  \ feature_extraction/\n│   │   ├── radiomics-extract.ipynb\n│   │   └── deep-feature-extract.ipynb\n\
  │   ├── models/\n│   │   └── model_pipeline.py\n│   └── visualization/\n│       ├── SHAP.ipynb\n│  \
  \     ├── t-SNE.ipynb\n│       └── Heat map code.ipynb\n└── README.md\n\n---\n\n## \U0001F9EA Feature\
  \ Extraction Modules\n\n### \U0001F538 Radiomics\nExtracted using PyRadiomics from segmented anatomical\
  \ structures. Features include intensity, texture, and shape characteristics. Available in:\n```\ndata/radiomics/\n\
  ```\n\n### \U0001F538 Deep Learning\nExtracted using a custom-trained 3D convolutional autoencoder on\
  \ cropped anatomical patches (from NIfTI format). Output bottleneck vectors represent learned features\
  \ per region:\n```\ndata/deep_features/\n```\n\n---\n\n## \U0001F916 Machine Learning Pipeline\n\n###\
  \ `model_pipeline.py` Includes:\n- Feature selection: `VarianceThreshold`, `SelectKBest`, `RandomForest`,\
  \ etc.\n- Classifiers: `LightGBM`, `XGBoost`, `CatBoost`, `MLP`, `AdaBoost`, etc.\n- Ensemble strategies:\
  \ Voting and stacking\n- Balancing classes using SMOTE\n- Visual outputs: ROC, confusion matrix, classification\
  \ report\n- Metrics saved for comparison\n\n---\n\n## \U0001F4CA Visualization Notebooks\n\n| Notebook\
  \              | Purpose                                              |\n|-----------------------|------------------------------------------------------|\n\
  | `SHAP.ipynb`          | Feature importance & explainability                 |\n| `t-SNE.ipynb`   \
  \      | 2D visualization of feature clusters                 |\n| `Heat map code.ipynb` | Compare model\
  \ performance with a heatmap            |\n\n---\n\n## \U0001F680 Results Summary\n\n- Best results\
  \ with **LightGBM + VarianceThreshold**\n- F1-score: **88.33%**\n- AUC: **97.98%**\n- Radiomic features\
  \ > Deep features\n- Pancreatic duct & parenchyma: most discriminative\n\n\n---\n\n## \U0001F4EC Contact\n\
  \nFor questions, feedback or collaboration:\n\U0001F4E7 [masoudrezayi1398@gmail.com]  \n\U0001F9E0 GitHub\
  \ Issues: [Open an issue](https://github.com/MASOUD-AJUMS/PDAC_Radiomics_DeepFeature_Diagnosis/issues)\n\
  \n---\n\n\U0001F52C Let's decode what tumors whisper into their surroundings.\n"

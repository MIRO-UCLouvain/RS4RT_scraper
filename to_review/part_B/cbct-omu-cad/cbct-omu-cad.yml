readme_excerpt: "# CBCT-Denoising-CAD\nWe release OMU-Denoising-CAD train/test code.\n\nContributors:\
  \ Chae-yeon Lim*, Kyungsu Kim*\n\nDetailed instructions for train/testing the image are as follows.\n\
  \n---\n\n# Implementation\nOMU-Denoising-CAD implementation based on pytorch\n\nInternal CBCT dataset\
  \ : https://drive.google.com/file/d/1oW35VoVKf7W1NBstty1rghGxHWXEgSg2/view?usp=share_link\n\nExternal\
  \ CBCT dataset : https://drive.google.com/file/d/1sxct8LRip1mV6k7Lm6hynQcFx4ZDmujN/view?usp=share_link\n\
  \n---\n\n# Environments\n\nRequired libraries for training/inference are detailed in requirements.txt\n\
  ```python\npip install -r requirements.txt\n```\n\n---\n\n# Pre-trained weights\n\nDenoising weight:\
  \ https://drive.google.com/file/d/16xECqeDaei64KiWiIBoaJmjteeZUULak/view?usp=share_link\n\nResNet weight:\
  \ https://drive.google.com/file/d/1rbhoJPHuITF8dbW2_t8jCbDvb3SOzwER/view?usp=share_link\n\n```\nClassification_OMU\n\
  \   |-- 1_Codes_pre\n   |-- 2_Codes_3D\n   |   |-- models\n   |   |-- warmup_scheduler\n   |   |   |--\
  \ r3d18_K_200ep.pth\n   |   |   |-- r3d34_K_200ep.pth\n   |   |   |-- r3d50_K_200ep.pth\n   |-- 3_Codes_external\n\
  \   |   |-- models\n   |   |   |-- r3d18_K_200ep.pth\n   |   |   |-- r3d34_K_200ep.pth\n   |   |   |--\
  \ r3d50_K_200ep.pth\n   |-- input\n   |   |-- train_jpg\n   |   |   |-- success_cbct_90\n   |-- input_external\n\
  \   |   |-- external_jpg_cbct_90\n   |-- ISTA-U-Net-main\n   |   |-- output_dir\n   |   |   |-- ct\n\
  \   |   |   |   |-- a3d5a1af-e159-43e4-ab89-473fc6af0ff5\n   |   |   |   |   |-- config_dict.pickle\n\
  \   |   |   |   |   |-- ista_unet.pt\n   |-- OMU_inference.sh\n   |-- OMU_train.sh\n   |-- osj_env.yaml\n\
  \   ```\n---\n\n# Train\n\nThe training denoising image is set automatically, and each 5 fold image\
  \ is created at the same time as OMU_train.sh is executed, and key slice-selector and classification\
  \ 5-fold training are automatically performed.\n```\nbash OMU_train.sh\n```\nThe internal dataset training\
  \ results are stored in /Classfication_OMU/2_Codes_3D/eval/\n\n---\n\n# Inference\n\nInference is started\
  \ through OMU_inference.sh, and the inference shows GRAD-CAM and evaluation results.\n```\nbash OMU_inference.sh\n\
  ```\nThe external dataset inference results are stored in /Classfication_OMU/3_Codes_external/eval/\n\
  \nThe external dataset GRAD-CAM results are stored in /Classfication_OMU/3_Codes_external/cam/\n\n---\n\
  \n# Result\n\nGRAD-CAM result\n\n![GRAD_CAM-1](https://user-images.githubusercontent.com/86760506/200550101-99e5e887-ae94-477f-9998-1d1c8e7d3a2d.png)\n\
  \nAUC-ROC result\n\n![ROC_AUC-1](https://user-images.githubusercontent.com/86760506/200550242-26ff3b9e-6bd3-4fc1-8ea8-c9f50bf293ca.png)\n\
  \n---\n\n```\n@article{kim2023enhanced,\n  title={Enhanced artificial intelligence-based diagnosis using\
  \ CBCT with internal denoising: clinical validation for discrimination of fungal ball, sinusitis, and\
  \ normal cases in the maxillary sinus},\n  author={Kim, Kyungsu and Lim, Chae Yeon and Shin, Joongbo\
  \ and Chung, Myung Jin and Jung, Yong Gi},\n  journal={Computer Methods and Programs in Biomedicine},\n\
  \  volume={240},\n  pages={107708},\n  year={2023},\n  publisher={Elsevier}\n}\n```\n---\n\n# Acknowledgements\n\
  \nthanks to liutianlin0121 for sharing the denoising MUSC code.\n\nMUSC github: https://github.com/liutianlin0121/musc\n"

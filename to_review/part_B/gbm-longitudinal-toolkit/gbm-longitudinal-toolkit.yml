readme_excerpt: "# gbm-longitudinal-toolkit\n\n[![Python](https://img.shields.io/badge/python-3.12+-blue.svg)](https://www.python.org/)\n\
  [![License](https://img.shields.io/badge/license-MIT-green.svg)](LICENSE)\n\nOpen-source pipeline for\
  \ **longitudinal radiomics in glioblastoma (GBM)** with\nexplicit temporal-bias control, strong baselines,\
  \ temporal GNNs, and\ndistribution-free uncertainty quantification.\n\n---\n\n## What this project is\n\
  \n**gbm-longitudinal-toolkit** is a research-grade, reproducible pipeline that:\n- **Formulates the\
  \ task correctly**: predict **RANO at the next visit**  \n  (features at time \\(t\\) → label at time\
  \ \\(t+1\\); last timepoint per patient is never used).\n- **Controls temporal bias and leakage**: \
  \ \n  clinical workflow leakage (irregular follow-up intervals) is quantified via\n  temporal-only baselines\
  \ and SHAP analyses.\n- **Provides a full modelling ladder**:\n  - Logistic Regression and LightGBM\
  \ baselines,\n  - LSTM on flat temporal vectors,\n  - 3-node tumor **graph + temporal GNN** (exploratory\
  \ component, not the core claim).\n- **Adds calibrated uncertainty + interpretability**:\n  - Conformal\
  \ Prediction (RAPS) for distribution-free prediction sets,\n  - SHAP for gradient boosting, Integrated\
  \ Gradients + attention for the GNN,\n  - a clinical-style summary per prediction (class, set, key features,\
  \ key timepoint).\n\nThe first case study is the open **LUMIERE** GBM dataset; the architecture is\n\
  designed to be generalisable to other longitudinal radiomics cohorts in later steps.\n\n---\n\n## Dataset:\
  \ LUMIERE (current focus)\n\n- **91 patients**, **638** study dates, **2487** MRI scans.\n- Sequences:\
  \ CT1, T1, T2, FLAIR (skull-stripped, co-registered).\n- Segmentations:\n  - **DeepBraTumIA** (primary,\
  \ 3 labels: Necrosis, Contrast-enhancing, Edema),\n  - **HD-GLIO-AUTO** (reference, 2 labels: Non-enhancing,\
  \ Contrast-enhancing).\n- Radiomics: PyRadiomics v3.0.1, 107 features per label per sequence.\n- RANO\
  \ labels: 399 valid timepoints, 81 patients with ≥1 label.\n- Effective supervised sample size after\
  \ audit + preprocessing  \n  (label shift, any-NaN drop, temporal pairing):\n  - **231 paired examples**,\
  \ 64 patients (DeepBraTumIA, primary).\n\nThis repository **does not ship LUMIERE**. Download the CSVs\
  \ from their original\nFigshare source under the non-commercial license and place them under\n`data/raw/lumiere/`\
  \ as described in `CONTEXT.md`.\n\n---\n\n## Pipeline at a glance\n\nThe end-to-end pipeline is split\
  \ into documented steps (`docs/STEP_*.md`). Steps 0-4 are implemented; steps 5-8 are deferred to future\
  \ development (see `FUTURE.md` for details).\n\n**Implemented Steps (V1 Scope)**\n- **Step 0 – Audit**:\
  \ structural checks on all raw CSVs, dataset_stats.json.\n- **Step 1 – Preprocessing + Validation**:\n\
  \  build `dataset_paired.parquet` (231×2576, 1 row = (patient, timepoint)),\n  run strict validation\
  \ (n_effective, leakage checks, NaN/inf, monotonic time).\n- **Step 2 – Feature Engineering**:\n  9\
  \ label-free derived features added → `dataset_engineered.parquet` (231×2585).\n  Cross-compartment\
  \ ratios (CE_NC_ratio, ED_CE_ratio, CE_fraction, total_tumor_volume),\n  nadir-based features (CE_vs_nadir,\
  \ weeks_since_nadir, is_nadir_scan),\n  delta of derived features (delta_CE_NC_ratio, delta_CE_vs_nadir).\n\
  \  EDA: correlation maps, shape consistency check, delta distributions,\n  temporal distributions, UMAP\
  \ (visualisation only), temporal autocorrelation.\n- **Step 3 – Baseline models**:\n  StratifiedGroupKFold,\
  \ **feature selection inside CV** (mRMR + Stability Selection),\n  LR, LightGBM+SHAP, LSTM, temporal-feature\
  \ ablations to quantify leakage.\n- **Step 4 – Graphs + Temporal GNN**:\n  3-node tumor graphs (NC ↔\
  \ CE ↔ ED), GATv2Conv + temporal attention,\n  2-node vs 3-node ablations (HD-GLIO-AUTO vs DeepBraTumIA).\n\
  \nThe high-level design and scientific assumptions are captured in `CONTEXT.md`.\n\n---\n\n## Repository\
  \ structure\n\n```text\ngbm-longitudinal-toolkit/\n├── data/\n│   ├── raw/lumiere/           # original\
  \ CSVs — never modified, DVC-tracked\n│   └── processed/\n│       ├── audit/             # dataset_stats.json\n\
  │       ├── preprocessing/     # dataset_paired.parquet, dataset_engineered.parquet\n│       │     \
  \                 # dataset_builder_report.json, features_builder_report.json\n│       ├── validation/\
  \        # *_validator_report.json\n│       └── graphs/            # {patient_id}.pt (Step 4)\n├── src/\n\
  │   ├── utils/                 # LUMIERE-specific I/O and parsing (lumiere_io.py)\n│   ├── audit/  \
  \               # lumiere_audit.py\n│   ├── validation/            # dataset_validator.py, features_validator.py\n\
  │   │                          # graphs_validator.py (Step 4)\n│   ├── preprocessing/         # dataset_builder.py,\
  \ features_builder.py\n│   ├── graphs/                # graphs_builder.py, graphs_validator.py (Step\
  \ 4)\n│   ├── models/                # logistic_baseline.py, gbm_baseline.py, lstm_baseline.py, gnn.py\n\
  │   ├── training/              # CV loops, metrics, MLflow integration\n│   ├── interpretability/  \
  \    # SHAP, attention, Integrated Gradients, clinical_summary.py\n│   └── uncertainty/           #\
  \ conformal prediction utilities\n├── configs/                   # YAML configs (models, graphs, conformal,\
  \ features_builder.yaml)\n├── docs/                      # STEP_0.md … STEP_4.md (V1 Scope)\n├── docs/future/\
  \               # STEP_5.md … STEP_8.md (Deferred)\n├── experiments/               # optional MLflow\
  \ runs\n├── notebooks/                 # exploratory analyses (not production)\n├── CONTEXT.md     \
  \            # project context and constraints\n├── FUTURE.md                  # ideas beyond the current\
  \ scope\n├── dvc.yaml                   # data / experiment pipeline\n└── pyproject.toml\n```\n\n---\n\
  \n## Installation\n\n```bash\ngit clone https://github.com/antoniograsso21/gbm-longitudinal-toolkit.git\n\
  cd gbm-longitudinal-toolkit\n\n# Python 3.12+ recommended\npython -m venv .venv\nsource .venv/bin/activate\
  \  # On Windows: .venv\\Scripts\\activate\n\npip install -e .\n```\n\nCore runtime dependencies are\
  \ intentionally minimal in `pyproject.toml`.  \nTraining stack (PyTorch, PyTorch Geometric, LightGBM,\
  \ MLflow, etc.) is expected\nto be installed via extras or environment files as the implementation matures.\n\
  \n---\n\n## Quick start (current status)\n\nThe entire end-to-end modeling pipeline (**Steps 0–4**)\
  \ is fully implemented, validated, and trainable.\n\n1. **Prepare the data**\n   - Download LUMIERE\
  \ CSVs and place them under `data/raw/lumiere/`.\n   - See `CONTEXT.md` for the exact file list.\n\n\
  2. **Run audit, preprocessing, and feature engineering**\n\n   ```bash\n   uv run -m src.audit.lumiere_audit\n\
  \   uv run -m src.preprocessing.dataset_builder\n   uv run -m src.preprocessing.features_builder\n \
  \  ```\n\n3. **Run baselines (Step 3)**\n\n   ```bash\n   # Logistic Regression\n   uv run python -m\
  \ src.training.run_logistic_baseline\n   \n   # LightGBM (Ablations A-D + SHAP)\n   uv run python -m\
  \ src.training.run_lgbm_baseline\n   \n   # LSTM\n   uv run python -m src.training.run_lstm_baseline\n\
  \   ```\n\n4. **Run Graph Construction & Temporal GNN (Step 4)**\n\n   ```bash\n   # Build 3-node tumor\
  \ graphs\n   uv run python -m src.graphs.graph_builder\n   uv run python -m src.validation.graphs_validator\n\
  \   \n   # Train GNN models (with within-fold model selection)\n   uv run python -m src.training.run_gnn\
  \              # Full model\n   uv run python -m src.training.run_gnn --ablation A1 # Cross-sectional\
  \ GNN\n   uv run python -m src.training.run_gnn --ablation A4 # No delta_t encoding\n   ```\n\n   This\
  \ produces cross-validation JSON results under `data/processed/gnn/` and logged MLflow parameters/metrics.\n\
  \n5. **Explore the design**\n   - Read `CONTEXT.md` for the scientific rationale and roadmap.\n   -\
  \ Read `docs/STEP_3.md` and `docs/STEP_4.md` for detailed results.\n\n---\n\n## Contributing and citing\n\
  \nContributions are welcome, especially around:\n- extending the baseline and GNN implementations,\n\
  - improving temporal bias diagnostics,\n- adding support for additional longitudinal radiomics datasets,\n\
  - strengthening uncertainty quantification and interpretability tooling.\n\nIf you build on this work,\
  \ you can cite:\n\n> Grasso A. *gbm-longitudinal-toolkit: open-source framework for longitudinal radiomics\
  \ in glioblastoma.* GitHub repository, 2026–.\n\nThis project is released under the **MIT License**\
  \ (see `LICENSE`)."

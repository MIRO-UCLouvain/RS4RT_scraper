readme_excerpt: "# ccRCC-radiogenomic-framework\n\n## Overview\n\nThis repository contains a reproducible\
  \ multimodal radiogenomic framework for exploratory phenotype discovery in clear cell renal cell carcinoma\
  \ (ccRCC). The framework integrates CT radiomics, clinical outcomes, and genomic context using publicly\
  \ available TCIA, CPTAC, and TCGA resources.\n\nThe project was developed to support translational oncology\
  \ research and demonstrate reproducible biomedical AI workflows spanning medical imaging, radiomics,\
  \ survival analysis, clustering, and multimodal data integration.\n\n\\---\n\n## Objectives\n\n* Extract\
  \ quantitative CT radiomics features from ccRCC imaging data\n* Evaluate associations between radiomic\
  \ signatures and clinical outcomes\n* Identify unsupervised radiomics phenotypes\n* Explore relationships\
  \ between imaging-derived features and genomic context\n* Develop reproducible pathology informatics\
  \ and biomedical AI workflows\n\n\\---\n\n## Datasets\n\nThis framework utilizes publicly available\
  \ datasets:\n\n* **TCIA (The Cancer Imaging Archive)**  \nClear Cell Renal Cell Carcinoma (CCRCC) CT\
  \ imaging cohort\n* **CPTAC (Clinical Proteomic Tumor Analysis Consortium)**  \nClinical and proteomic\
  \ data for ccRCC\n* **TCGA-KIRC**  \nGenomic and mutation reference data for kidney renal clear cell\
  \ carcinoma\n\n\\---\n\n## Current Analyses\n\n### Radiomics Feature Extraction\n\n* First-order intensity\
  \ statistics\n* Texture-based GLCM features\n* Entropy and heterogeneity metrics\n\n### Exploratory\
  \ Clinical Associations\n\n* Pathologic stage associations\n* Recurrence associations\n* Survival analysis\n\
  * Effect size estimation\n* FDR-adjusted statistical testing\n\n### Unsupervised Learning\n\n* UMAP\
  \ dimensionality reduction\n* Hierarchical clustering\n* Radiomics phenotype discovery\n* Correlation\
  \ structure analysis\n\n### Survival Analysis\n\n* Kaplan–Meier survival curves\n* Log-rank testing\n\
  * Exploratory phenotype survival comparisons\n\n\\---\n\n## Repository Structure\n\n```text\nccRCC-radiogenomic-framework/\n\
  │\n├── src/                     # Analysis and modeling scripts\n├── outputs/\n│   └── demo\\_figures/\
  \        # Selected demonstration figures\n├── docs/                    # Documentation and project\
  \ notes\n├── README.md\n└── requirements.txt\n```\n\n\\---\n\n## Example Visualizations\n\nThe repository\
  \ includes selected exploratory visualizations such as:\n\n* Cohort construction workflows\n* UMAP radiomics\
  \ embeddings\n* Clustered radiomics heatmaps\n* Correlation matrices\n* Kaplan–Meier survival curves\n\
  * Mutation landscape summaries\n\n\n\n\n\n\\### Cohort Construction Workflow\n\n\n\n!\\[Workflow](outputs/demo\\\
  _figures/cohort\\_flow\\_diagram.png)\n\n\n\n\\### Radiomics Feature Correlation Structure\n\n\n\n!\\\
  [Heatmap](outputs/demo\\_figures/radiomics\\_feature\\_correlation\\_heatmap.png)\n\n\n\n\\### Mutation\
  \ Landscape Summary\n\n\n\n!\\[Mutation Landscape](outputs/demo\\_figures/mutation\\_landscape\\_barplot.png)\n\
  \n\n\n\\---\n\n## Installation\n\nClone the repository:\n\n```bash\ngit clone https://github.com/Sanisule99/ccRCC-radiogenomic-framework.git\n\
  ```\n\nInstall dependencies:\n\n```bash\npip install -r requirements.txt\n```\n\n\\---\n\n## Scientific\
  \ Context\n\nRadiogenomics and multimodal oncology analytics represent emerging areas in pathology informatics\
  \ and precision medicine. This framework was designed as an exploratory infrastructure project emphasizing:\n\
  \n* reproducibility\n* multimodal integration\n* translational oncology analytics\n* biomedical AI workflows\n\
  * interpretable radiomics analysis\n\n\\---\n\n## Current Status\n\nThis repository currently contains:\n\
  \n* exploratory analyses\n* framework components\n* reproducible workflows\n* demonstration visualizations\n\
  \nFormal manuscript and conference submission materials will be released separately following presentation\
  \ and publication processes.\n\n\\---\n\n## Future Directions\n\nPlanned extensions include:\n\n* external\
  \ validation cohorts\n* deep learning integration\n* proteogenomic modeling\n* explainable AI workflows\n\
  * digital pathology integration\n* cloud-based biomedical AI pipelines\n\n\\---\n\n## Author\n\n**Saanie\
  \ Sulley, MD, PhD, MBA, FAMIA**  \nBiomedical Informatics | Pathology Informatics | Healthcare Data\
  \ Engineering\n\n\\---\n\n## License\n\nThis project is distributed under the MIT License.\n\n"

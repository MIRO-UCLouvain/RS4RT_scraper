readme_excerpt: "# PlanPilot-VMAT\n\n**Author:** dr. Muhammad Sobri Maulana\n\nPlanPilot-VMAT adalah starter\
  \ project **React + Python** untuk studi:\n\n> **Perencanaan VMAT Berbasis AI vs Perencanaan Manual\
  \ (Studi Non-inferiority)**\n\n## Latar Belakang Studi\n- **P (Population):** Pasien IMRT/VMAT multi-site\
  \ (Head & Neck, prostat, pelvis, toraks).\n- **I (Intervention):** AI plan generation / knowledge-based\
  \ planning untuk rencana awal dan optimasi.\n- **C (Comparison):** Perencanaan manual oleh dosimetrist/planner\
  \ (workflow standar).\n- **O (Outcome):** Kualitas rencana (CI/HI), sparing OAR (DVH endpoints), waktu\
  \ planning, serta jumlah iterasi revisi sebelum approval.\n\n## Struktur Project\n\n```bash\nPlanPilot-VMAT/\n\
  ├── backend/\n│   ├── app.py\n│   └── requirements.txt\n├── frontend/\n│   ├── package.json\n│   ├──\
  \ index.html\n│   └── src/\n│       ├── App.jsx\n│       ├── main.jsx\n│       └── styles.css\n└── README.md\n\
  ```\n\n## Fitur Saat Ini\n- API Python (Flask) untuk:\n  - health check,\n  - analisis satu kasus AI\
  \ vs manual,\n  - contoh data multi-site.\n- UI React untuk input metrik (CI, HI, OAR, waktu planning,\
  \ revisi) dan menampilkan hasil non-inferiority.\n\n## Menjalankan Backend (Python)\n\n```bash\ncd backend\n\
  python -m venv .venv\nsource .venv/bin/activate\npip install -r requirements.txt\npython app.py\n```\n\
  \nBackend berjalan di `http://localhost:8000`.\n\n## Menjalankan Frontend (React)\n\n```bash\ncd frontend\n\
  npm install\nnpm run dev\n```\n\nFrontend Vite biasanya berjalan di `http://localhost:5173`.\n\n## Endpoint\
  \ API\n\n### `GET /api/health`\nCek status service.\n\n### `POST /api/analyze`\nAnalisis satu kasus\
  \ VMAT.\n\nContoh payload:\n\n```json\n{\n  \"site\": \"Head & Neck\",\n  \"ai_ci\": 0.92,\n  \"manual_ci\"\
  : 0.91,\n  \"ai_hi\": 1.07,\n  \"manual_hi\": 1.05,\n  \"ai_oar_score\": 23,\n  \"manual_oar_score\"\
  : 24,\n  \"ai_minutes\": 45,\n  \"manual_minutes\": 95,\n  \"ai_revisions\": 1,\n  \"manual_revisions\"\
  : 3\n}\n```\n\n### `GET /api/sample-cases`\nMengembalikan contoh hasil analisis untuk beberapa site.\n\
  \n## Catatan Metodologi Non-inferiority (Sederhana)\nImplementasi saat ini menggunakan margin sederhana\
  \ untuk demonstrasi:\n- CI: non-inferior jika nilai AI tidak lebih rendah dari manual melebihi margin.\n\
  - HI dan OAR score: diasumsikan lebih kecil lebih baik, dibandingkan dengan margin.\n\nUntuk penelitian\
  \ klinis, definisi endpoint, margin, serta analisis statistik harus disesuaikan dengan protokol studi\
  \ yang tervalidasi.\n"

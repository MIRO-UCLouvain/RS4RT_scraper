  # Brain Tumor Segmentation using nnU-Net


  This project focuses on brain tumor segmentation from MRI images using deep learning techniques.


  ## 🧠 Project Overview

  The model segments brain tumors into different regions:

  - Enhancing Tumor

  - Tumor Core

  - Whole Tumor


  ## ⚙️ Technologies Used

  - Python

  - nnU-Net

  - PyTorch

  - MONAI

  - SimpleITK

  - NumPy


  ## 🎯 Goal

  To achieve accurate medical image segmentation for brain tumor detection using state-of-the-art deep
  learning methods.


  ## 📊 Results

  Dice Score and model evaluation will be added soon.



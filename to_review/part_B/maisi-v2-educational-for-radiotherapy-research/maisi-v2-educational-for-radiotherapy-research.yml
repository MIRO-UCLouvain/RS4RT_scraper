readme_excerpt: "# MAISI-RT Sandbox\n\n[![Python](https://img.shields.io/badge/python-3.10%2B-blue.svg)](https://www.python.org)\n\
  [![License](https://img.shields.io/badge/license-Apache%202.0-green.svg)](LICENSE)\n\n**A low-barrier\
  \ framework for generating synthetic CT and MRI volumes with NVIDIA MAISI — built for learners, researchers,\
  \ and AI developers who want labeled medical imaging data without a clinical dataset.**\n\n![MAISI-RT\
  \ hero gallery](figures/fig4_maisi_rt_hero.png)\n\n> **Clinical disclaimer:** This repository is for\
  \ research, education, visualization, and AI prototyping only. It is not a medical device and must not\
  \ be used for diagnosis, treatment planning, dose calculation, patient-specific QA, or clinical decision-making.\n\
  \n---\n\n## The idea in one sentence\n\nYou pick what you want to generate from a menu, press Enter,\
  \ and get a NIfTI file plus labeled segmentation masks and PNG visualizations — no YAML editing, no\
  \ prior medical imaging knowledge required.\n\n---\n\n## Start in 60 seconds\n\n```bash\n# 1. Activate\
  \ the environment\nsource MAISI_venv/bin/activate\n\n# 2. See everything you can generate\npython MAISI_RT_Generate.py\
  \ --list\n\n# 3. Generate something (interactive menu — no arguments needed)\npython MAISI_RT_Generate.py\n\
  ```\n\nOr go directly by name:\n\n```bash\npython MAISI_RT_Generate.py --preset ct_lungs_tumor    #\
  \ CT chest + lung tumor mask\npython MAISI_RT_Generate.py --preset brain_t1          # T1 whole brain\
  \ MRI\npython MAISI_RT_Generate.py --preset ct_abdomen_organs # 11 abdominal structures\n```\n\nFor\
  \ the full step-by-step guide including setup, visualization, and dataset building → **[QUICKSTART.md](QUICKSTART.md)**\n\
  \n---\n\n## What you can generate — 16 presets across 3 categories\n\n### CT with segmentation masks\n\
  \n| Preset | Structures in the mask |\n|---|---|\n| `ct_lungs_tumor` | All 5 lung lobes, lung tumor,\
  \ heart, trachea |\n| `ct_abdomen_organs` | Liver, spleen, pancreas, both kidneys, aorta, IVC, gallbladder,\
  \ stomach, esophagus, duodenum |\n| `ct_abdomen_tumor` | Same as above + hepatic tumor + pancreatic\
  \ tumor |\n| `ct_head_neck` | Brain, skull, spinal cord, carotid arteries, thyroid, trachea |\n| `ct_pelvis_rt`\
  \ | Prostate, bladder, femur, hip bones, sacrum, colon |\n| `ct_chest_cardio` | Heart, aorta, great\
  \ vessels, all lung lobes, trachea, airway |\n| `ct_spine` | Spinal cord + full vertebral column C1–L5\
  \ + sacrum |\n\nCT masks use NVIDIA's **132-class segmentation vocabulary** and are generated simultaneously\
  \ with the CT volume using the MAISI-v2 rectified-flow model (`rflow-ct`).\n\n![CT structure showcase](figures/fig2_ct_structure_showcase.png)\n\
  \n### Brain MRI\n\n| Preset | Contrast |\n|---|---|\n| `brain_t1` | T1-weighted whole brain |\n| `brain_t2`\
  \ | T2-weighted whole brain |\n| `brain_flair` | FLAIR whole brain (fluid suppression) |\n| `brain_swi`\
  \ | SWI whole brain (susceptibility weighted) |\n| `brain_t1_stripped` | T1 skull-stripped (brain tissue\
  \ only) |\n| `brain_all` | All 8 contrasts in one run (T1, T2, FLAIR, SWI + skull-stripped variants)\
  \ |\n\n![Brain MRI showcase](figures/fig3_brain_mri_showcase.png)\n\n### Body MRI\n\n| Preset | What\
  \ it generates |\n|---|---|\n| `mr_prostate_t2` | High-resolution prostate T2 MRI (169 × 169 × 90 mm\
  \ FOV) |\n| `mr_breast_t1` | Bilateral breast T1 MRI |\n| `mr_abdomen_t1` | Upper abdominal T1 MRI |\n\
  \n---\n\n## Export to DICOM RT-STRUCT — clinical format for TPS import\n\nConvert any generated CT +\
  \ label pair into a **DICOM CT series + RT-STRUCT** file, loadable directly in 3D Slicer, Eclipse, RayStation,\
  \ and Monaco:\n\n```bash\n# Export by preset name (finds the latest output automatically)\npython scripts/export_rt_struct.py\
  \ --preset ct_pelvis_rt\n\n# Export from an explicit output directory\npython scripts/export_rt_struct.py\
  \ --pair outputs/maisi2_showcase_ct_pelvis_rt/visuals/sample_001_seed73001/\n\n# List all exportable\
  \ outputs\npython scripts/export_rt_struct.py --list\n```\n\nOutput structure:\n\n```text\noutputs/dicom_export/<name>/\n\
  \  CT/            ← DICOM CT series (one .dcm per axial slice)\n  RT/\n    RS_<name>.dcm  ← DICOM RT-STRUCT\
  \ (named, colour-coded ROIs)\n  manifest.json  ← per-structure volumes (mL) + QUANTEC dose constraint\
  \ notes\n```\n\nEach exported structure gets the **clinical colour convention** used in Eclipse/RayStation\
  \ (e.g. spinal cord = yellow, prostate = blue, femoral heads = purple) and a QUANTEC/TG-101 dose limit\
  \ note in the manifest.\n\nThis is not available in the original NVIDIA MAISI repository — it bridges\
  \ synthetic generation and clinical radiotherapy workflow.\n\n---\n\n## Learn without a GPU — 6 interactive\
  \ tutorials\n\nAll five tutorials run on **pre-generated data already in `outputs/`**. No GPU, no setup\
  \ beyond activating the environment.\n\n```bash\nsource MAISI_venv/bin/activate\njupyter notebook tutorials/\n\
  ```\n\n| Notebook | What you learn |\n|---|---|\n| [01_ct_first_look.ipynb](tutorials/01_ct_first_look.ipynb)\
  \ | Load a CT scan, view all three anatomical planes, understand Hounsfield Units, read an HU histogram\
  \ |\n| [02_ct_windows_and_tissues.ipynb](tutorials/02_ct_windows_and_tissues.ipynb) | Why the same CT\
  \ looks different with different windows, soft-tissue / lung / bone presets, HU fingerprints across\
  \ body regions |\n| [03_ct_segmentation_masks.ipynb](tutorials/03_ct_segmentation_masks.ipynb) | Load\
  \ label files, build CT + overlay visualizations, measure organ volumes in mL, compare structures across\
  \ all four body regions |\n| [04_brain_mri_contrasts.ipynb](tutorials/04_brain_mri_contrasts.ipynb)\
  \ | T1 vs T2 vs FLAIR vs SWI side-by-side, T1−T2 difference maps, skull-stripped comparison, signal\
  \ intensity profiles |\n| [05_generate_your_own.ipynb](tutorials/05_generate_your_own.ipynb) | Use `MAISI_RT_Generate.py`\
  \ from inside a notebook, inspect and modify YAML configs, explore all 132 anatomy structures, build\
  \ a multi-seed dataset config |\n| [06_rt_struct_export.ipynb](tutorials/06_rt_struct_export.ipynb)\
  \ | Export synthetic CT + masks to DICOM RT-STRUCT; inspect DICOM metadata; load in 3D Slicer; read\
  \ QUANTEC constraint notes from the manifest |\n\nThe tutorials are designed to be read top-to-bottom\
  \ even without running any code. Every step has a plain-English explanation.\n\n---\n\n## What every\
  \ generation produces\n\n```text\noutputs/quickgen_<preset>/\n  visuals/\n    sample_001_seed<N>/\n\
  \      ct_seed<N>_image.nii.gz          ← CT volume (HU values)\n      ct_seed<N>_label.nii.gz     \
  \     ← structure masks (integer labels, CT only)\n      ct_orthogonal_panel.png           ← 3-plane\
  \ PNG — instant QA\n      ct_random_axial_4x4.png           ← 16 random axial slices\n      ct_structure_overlay_axial_4x4.png\
  \ ← CT + colour-coded organ masks\n      ct_sweep_axial_4x4.png            ← evenly spaced axial sweep\n\
  \    all_ct_samples_overview.png         ← contact sheet across all seeds\n```\n\nFor MRI runs, you\
  \ get the same PNG galleries but without a label file (MRI presets are image-only).\n\n![CT masks across\
  \ body regions](figures/readme_ct_mask_regions.png)\n\n---\n\n## Animated visualizations\n\nThree animated\
  \ GIF sweeps are pre-generated in `figures/`:\n\n| File | What it shows |\n|---|---|\n| `gif1_brain_t1_axial_sweep.gif`\
  \ | Axial sweep through a T1 brain MRI |\n| `gif2_ct_lung_tumor_sweep.gif` | Axial sweep through a chest\
  \ CT with lung tumor |\n| `gif3_brain_contrast_comparison.gif` | Same brain, T1 / T2 / FLAIR / SWI side-by-side\
  \ |\n\nRegenerate after new outputs with:\n\n```bash\nsource MAISI_venv/bin/activate\npython scripts/make_animated_gifs.py\n\
  python scripts/make_showcase_figures.py\n```\n\n---\n\n## One-time setup\n\n```bash\n# Clone\ngit clone\
  \ https://github.com/mustikazim/maisi-rt-sandbox\ncd maisi-rt-sandbox\n\n# Create Python environment\n\
  python -m venv MAISI_venv\nsource MAISI_venv/bin/activate\npython -m pip install --upgrade pip\n\n#\
  \ Install dependencies\npip install nibabel numpy matplotlib pyyaml pillow scipy scikit-image rich typer\
  \ pydantic jupyter\n\n# Clone NVIDIA's official model code\nmkdir -p external\ngit clone https://github.com/NVIDIA-Medtech/NV-Generate-CTMR.git\
  \ external/NV-Generate-CTMR\npip install -r external/NV-Generate-CTMR/requirements.txt\n```\n\n### Download\
  \ model weights (GPU generation only)\n\n```bash\ncd external/NV-Generate-CTMR\n\n# Brain MRI (T1, T2,\
  \ FLAIR, SWI)\npython -m scripts.download_model_data --version rflow-mr-brain --root_dir ./ --model_only\n\
  \n# CT image-only and CT + paired mask\npython -m scripts.download_model_data --version rflow-ct --root_dir\
  \ ./\n\n# Body MRI (prostate, breast, abdomen)\npython -m scripts.download_model_data --version rflow-mr\
  \ --root_dir ./ --model_only\n\ncd ../..\n```\n\nModel weights are governed by NVIDIA's own licenses\
  \ and terms of service.\n\n---\n\n## The MAISI_RT_Generate.py script — how it works\n\nThe script has\
  \ three modes:\n\n```bash\npython MAISI_RT_Generate.py                          # interactive numbered\
  \ menu\npython MAISI_RT_Generate.py --list                   # print all 16 preset keys\npython MAISI_RT_Generate.py\
  \ --preset NAME            # run a named preset\npython MAISI_RT_Generate.py --preset NAME --seed N\
  \   # reproducible run\npython MAISI_RT_Generate.py --preset NAME --gpu N    # choose GPU index\npython\
  \ MAISI_RT_Generate.py --preset NAME --dry-run  # write YAML only, no GPU\n```\n\nInternally, `--dry-run`\
  \ writes a complete YAML config to `configs/maisi2/quickgen_<preset>.yaml`. Inspect and modify that\
  \ file before running if you want to add structures or change the resolution. Advanced users can also\
  \ pass the config directly to the underlying generation scripts — see [docs/maisi2_generation_guide.md](docs/maisi2_generation_guide.md).\n\
  \n---\n\n## Key concepts for new users\n\n### Hounsfield Units (CT only)\n\nCT voxel values have a fixed\
  \ physical meaning:\n\n| Tissue | HU range | Appears as |\n|---|---:|---|\n| Air | −1000 | Black |\n\
  | Fat | −100 to −50 | Dark grey |\n| Water / fluid | ~0 | Medium grey |\n| Soft tissue | +20 to +80\
  \ | Grey |\n| Bone | +300 to +1900 | White |\n\n### MRI contrasts\n\nMRI values are not physically calibrated\
  \ — they depend on the pulse sequence. Each contrast highlights different tissue properties:\n\n| Contrast\
  \ | What is bright | Key clinical use |\n|---|---|---|\n| T1 | White matter, fat | Anatomy, post-contrast\
  \ enhancement |\n| T2 | Water, CSF, oedema | Lesions, fluid collections |\n| FLAIR | Lesions (CSF suppressed)\
  \ | White matter disease |\n| SWI | Susceptibility effects | Micro-bleeds, venous anatomy |\n\n### The\
  \ field-of-view rule\n\n```\nFOV in mm = output_size × spacing\n```\n\nStay close to the anatomy's real\
  \ physical size. Do not use small debug volumes — they produce out-of-distribution images that look\
  \ anatomically wrong.\n\n| Preset group | output_size | spacing (mm) | FOV (mm) |\n|---|---|---|---|\n\
  | Brain MRI | 256 × 256 × 256 | 1.0 × 1.0 × 1.0 | 256 × 256 × 256 |\n| CT (chest/abdomen/pelvis) | 256\
  \ × 256 × 128 | 1.5 × 1.5 × 2.0 | 384 × 384 × 256 |\n| Prostate T2 MRI | 256 × 256 × 128 | 0.66 × 0.66\
  \ × 0.70 | 169 × 169 × 90 |\n\n---\n\n## View in 3D Slicer\n\nGenerated `.nii.gz` files load directly\
  \ into [3D Slicer](https://www.slicer.org) (free, no account needed):\n\n1. Drag `ct_seed*_image.nii.gz`\
  \ into the Slicer window → loaded as a volume\n2. Drag `ct_seed*_label.nii.gz` → choose **Segmentation**\n\
  3. Adjust opacity in the Segment Editor to overlay masks on the CT\n\nSee [docs/slicer_loading_guide.md](docs/slicer_loading_guide.md)\
  \ for step-by-step screenshots.\n\n---\n\n## Repository layout\n\n```text\nMAISI_RT_Generate.py    ←\
  \ start here — interactive generation menu (16 presets)\nQUICKSTART.md           ← step-by-step guide\
  \ for new users\n\nconfigs/maisi2/         ← YAML generation configs (auto-generated by the script)\n\
  docs/                   ← setup notes, model card, anatomy reference, limitations\nexternal/       \
  \        ← NVIDIA NV-Generate-CTMR clone (not vendored)\nfigures/                ← showcase PNGs and\
  \ animated GIFs\noutputs/                ← generated NIfTI volumes and visual QA galleries\ntutorials/\
  \              ← 5 Jupyter notebooks (no GPU needed)\n```\n\n---\n\n## Known limitations\n\n- Synthetic\
  \ anatomy can be unrealistic or anatomically implausible in some seeds.\n- Generated masks are not clinician-approved\
  \ contours and require validation before research use.\n- C"

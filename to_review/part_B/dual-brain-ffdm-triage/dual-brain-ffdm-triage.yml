readme_excerpt: "# Dual-Brain Mammography Pipeline with Bayesian Uncertainty\n\nAn auditable and reproducible\
  \ full-field digital mammography (FFDM) triage workflow designed to mitigate dataset and acquisition\
  \ shifts in screening programs.\n\n## \U0001F9E0 Architecture Overview\nThe system deconstructs the\
  \ classification problem into two complementary pathways:\n* **Brain A (ConvNeXt-Tiny):** Learns deep\
  \ hierarchical spatial representations from raw tensors.\n* **Brain B (Radiomics + XGBoost):** Maps\
  \ handcrafted intensity, texture, and morphological descriptors (e.g., GLCM, Shannon Entropy).\n* **Fusion\
  \ Layer:** A calibration-only logistic stacking layer trained on internal validation predictions to\
  \ suppress acquisition-shift false positives.\n\n## \U0001F6E1️ Key Features\n* **Bayesian Uncertainty\
  \ Quantification:** Integrates Monte Carlo (MC) Dropout ($T=30$ forward passes) to isolate epistemic\
  \ and aleatoric uncertainty via predictive entropy and mutual information.\n* **Explainable AI (XAI):**\
  \ Post-hoc audits featuring Grad-CAM spatial attribution, radiomics feature importance, and false-color\
  \ intensity mappings.\n* **Rigorous Domain Validation:** Evaluated via a strictly locked external gate\
  \ on the Mexican Mammo-MX dataset ($1,000$ images).\n\n## \U0001F4CA Promoted Gate Results (Mammo-MX)\n\
  * **ROC-AUC:** 0.8728 \n* **PR-AUC:** 0.8371\n* **Sensitivity:** 0.8600 \n* **Specificity:** 0.7017\n\
  * **Expected Calibration Error (ECE):** 0.0437\n\n---\n> This system is a traceable research workflow\
  \ for uncertainty-aware triage, not a standalone diagnostic tool.\n"

readme_excerpt: "# Radiomics analysis (Code & Reproducibility)\n\nThis repository provides analysis code\
  \ to promote transparency, reproducibility, and scientific exchange in radiomics research.\n\nRaw imaging\
  \ data, contour files, and identifiable patient-level clinical records are not included.\n\n---\n\n\
  ## Repository contents\n\nCore files:\n\n```text\n.\n├─ run_analysis.py                # Main analysis\
  \ pipeline\n├─ postprocess_analysis.py        # Postprocessing and visualization script\n├─ params.yaml\
  \                    # PyRadiomics extraction configuration\n├─ requirements.txt               # Python\
  \ package requirements\n└─ analysis_outputs/\n   ├─ figures/\n   ├─ tables/\n   ├─ details/\n   └─ postprocess/\n\
  ```\n\nThe input feature matrix is not distributed in this public repository. To run the scripts, prepare\
  \ a radiomics CSV with the expected feature columns, clinical variables, labels, and scanner-group batch\
  \ labels.\n\nExpected key columns include:\n\n```text\nlabel, batch, age, sex, CEA_log, tumor_dist,\
  \ cT, cN\n```\n\n`batch` represents scanner group, not cross-validation fold.\n\n---\n\n## How to run\n\
  \n1. Prepare a radiomics CSV generated upstream using PyRadiomics or a comparable feature-extraction\
  \ workflow.\n2. Confirm that the input file path in `run_analysis.py` matches your CSV file.\n3. Install\
  \ the required packages.\n\n```bash\npip install -r requirements.txt\n```\n\n4. Run the analysis pipeline\
  \ and postprocessing scripts.\n\n```bash\npython run_analysis.py\npython postprocess_analysis.py\n```\n\
  \nOutputs are written to `analysis_outputs/`.\n\n---\n\n## Files generated by the workflow\n\n- `analysis_outputs/details/`\
  \ — outer-fold predictions and pipeline details\n- `analysis_outputs/tables/` — metrics, fold-level\
  \ statistics, feature summaries, decision-curve outputs, and threshold tables\n- `analysis_outputs/figures/`\
  \ — ROC, precision-recall, calibration, decision-curve, and confusion-matrix figures\n- `analysis_outputs/postprocess/`\
  \ — additional postprocessing tables and figures\n\n---\n\n## Environment\n\nThe analysis was run using\
  \ Python 3.12. Key package versions used in the original analysis included:\n\n```text\npandas 2.2.3\n\
  numpy 1.26.4\nscikit-learn 1.6.1\njoblib 1.4.2\nmatplotlib 3.10.1\npyradiomics 3.1.0\n```\n\nAdditional\
  \ packages are listed in `requirements.txt`.\n\n---\n\n## Radiomics-Rectum modelling summary\n\n###\
  \ Best overall model\n\n- **combined_extra_trees** — AUROC 0.754, AUPRC 0.299, Brier score 0.123\n-\
  \ Threshold 0.174 (0.174–0.193)\n\n### Best model per configuration, sorted by AUROC\n\n- **Radiomics-only:**\
  \ `radiomics_lightgbm` — AUROC 0.725, AUPRC 0.292, threshold 0.129 (0.071–0.188)\n- **Clinical + radiomics:**\
  \ `combined_extra_trees` — AUROC 0.754, AUPRC 0.299, threshold 0.174 (0.174–0.193)\n- **Clinical-only:**\
  \ `clinical_logistic_en` — AUROC 0.507, AUPRC 0.155, threshold 0.379 (0.379–0.432)\n\n---\n\n## Feature\
  \ summaries\n\nFeature recurrence was summarized using selection frequency across cross-validation folds.\
  \ These summaries are descriptive and should not be interpreted as definitive feature-selection stability\
  \ or validated biomarker importance.\n\n---\n\n## Notes\n\nThis repository contains code, configuration\
  \ files, and derived analysis outputs. It does not include raw CT images, treatment-planning contours,\
  \ or identifiable clinical records.\n\nDe-identified engineered feature tables and trained research\
  \ model objects may be provided by the corresponding author upon reasonable request, subject to institutional\
  \ data-protection requirements.\n"

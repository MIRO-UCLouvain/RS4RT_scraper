readme_excerpt: "# BE 645 Artificial Intelligence (AI) and Radiomics (Summer 2026) - Updated\n\nWelcome\
  \ to the BE 645: Artificial Intelligence (AI) and Radiomics course.\n\nArtificial intelligence is essentially\
  \ a collection of advanced computational algorithms designed to identify patterns\nin given data and\
  \ predict outcomes for new, unseen data. Radiomics, a relatively new term in radiology, involves\nextracting\
  \ a large number of features from various types of medical images. This course integrates artificial\n\
  intelligence and radiomics to uncover valuable quantitative data for practical medical applications.\
  \ It also covers the\nfundamental concepts and applications of artificial intelligence in computer-aided\
  \ diagnostic systems.\n\nThis course offers both theoretical and practical knowledge about computer\
  \ vision and AI techniques essential for\nprocessing and analyzing radiology images, contributing to\
  \ the shift towards radiomics. This transition will\nallow AI models to assist doctors and healthcare\
  \ professionals in managing and diagnosing various diseases.\n\n> If you encountered any issues or errors\
  \ in the code or lectures, please feel free to let me know. I will be more than\n> happy to fix them\
  \ and update the repository accordingly. Your feedback is highly appreciated and will help me improve\n\
  > the quality of the content provided in this series.\n\n## Full Playlist and Videos\n\nThis series\
  \ is your gateway to the fascinating world of applying AI techniques to radiomics.\n\n**Earlier Playlists**:\n\
  \n> Playlist from Summer 2025 (Recorded): https://www.youtube.com/playlist?list=PLVrN2LRb7eT2GOJS8YKf1TcP6X1jr-9Dn\n\
  \n> Playlist from Spring 2025 (AI-Generated Podcasts):\n> https://www.youtube.com/playlist?list=PLVrN2LRb7eT0VBZqrtSAJQd2mqVtIDJKx\n\
  \n> Playlist from Summer 2024 (Recorded): https://www.youtube.com/playlist?list=PLVrN2LRb7eT2KV3YMdXeF2B9dgaN4QF4g\n\
  \n## Programming Language and Libraries\n\nThis project is written in Python. All Python package dependencies\
  \ required by the lectures and examples are listed in\nthe `requirements.txt` file at the repository\
  \ root.\n\nYou can install the dependencies directly with pip (system / virtualenv / activated conda\
  \ env):\n\n```cmd\npip install -r requirements.txt\n```\n\nRecommended Python version: Python `3.10`\
  \ (the materials were developed and tested with Python `3.10.x`, e.g. `3.10.18`)\non a Windows machine.\
  \ The code will often work with other Python `3.10.x` builds, but behavior on other Python\nmajor/minor\
  \ versions or on other operating systems has not been exhaustively tested.\n\n## Anaconda Environment\
  \ Setup (Optional But Recommended)\n\nA helper batch script is provided to automate creating a Conda\
  \ environment and installing the packages from\n`requirements.txt` on Windows:\n\nScript: `anaconda-tf-environment.bat`\
  \ (located in the repository root)\n\nKey points about what the script does and how it behaves:\n\n\
  - Defaults: environment name `be645` and Python `3.10` (you may supply a different name and Python version\
  \ as positional\n  arguments).\n- Supported flags: `--no-gpu` (skip attempting to install CUDA/cuDNN),\
  \ `--force` (remove any existing environment with\n  the same name before creating), `--no-pause` (do\
  \ not pause at the end), `--silent` (suppress console output), and\n  `--help`.\n    - The script also\
  \ accepts `--quiet` as an alias for `--silent`.\n- The script verifies that `conda` is available on\
  \ PATH; if not, it exits with a message and non-zero status. Run it\n  from an Anaconda Prompt or enable\
  \ conda in your shell before using the script.\n- It attempts a non-fatal `conda update -n base -c defaults\
  \ conda` early on; the script continues even if the update\n  fails.\n- Ensures `requirements.txt` exists\
  \ next to the script; if missing the script exits with an explanatory error.\n- Environment creation\
  \ and removal are handled via `conda create` / `conda env remove`. Subsequent Python/package\n  commands\
  \ are executed inside the environment using `conda run -n \"<env>\"` so `conda init` is not required.\n\
  - If an NVIDIA GPU is detected (presence of `nvidia-smi` on PATH) and `--no-gpu` is not provided, the\
  \ script attempts to\n  install `cudatoolkit` and `cudnn` into the new environment from `conda-forge`.\n\
  - The script upgrades `pip` inside the created environment and installs the packages from `requirements.txt`\
  \ using a\n  single pip invocation:\n  `conda run -n \"<env>\" python -m pip install --progress-bar\
  \ off -r \"requirements.txt\"`.\n- Logging: the script writes a log file named `anaconda-tf-environment.log`\
  \ next to the script and appends sanitized\n  runtime messages. By default the script streams messages\
  \ to the console and appends the same text to the log; use\n  `--silent` to suppress console output\
  \ while still writing the log.\n- By default the script pauses at the end so you can read messages;\
  \ use `--no-pause` for non-interactive or automated\n  runs.\n\nUsage examples (Windows `cmd.exe`):\n\
  \n- Create the default environment named `be645` with Python 3.10 (interactive):\n\n```cmd\nanaconda-tf-environment.bat\n\
  ```\n\n- Create a custom environment `myenv` with Python 3.10 (console shows progress):\n\n```cmd\n\
  anaconda-tf-environment.bat myenv 3.10\n```\n\n- Create `myenv` but skip GPU/CUDA installation:\n\n\
  ```cmd\nanaconda-tf-environment.bat myenv 3.10 --no-gpu\n```\n\n- Recreate an existing environment (force\
  \ remove then create):\n\n```cmd\nanaconda-tf-environment.bat myenv 3.10 --force\n```\n\n- Run non-interactively\
  \ (do not pause at the end):\n\n```cmd\nanaconda-tf-environment.bat myenv 3.10 --no-pause\n```\n\n-\
  \ Run silently (suppress console output, log still written):\n\n```cmd\nanaconda-tf-environment.bat\
  \ --silent\n```\n\nIf you prefer to set up the environment manually, you can run the following commands\
  \ in an Anaconda Prompt:\n\n```cmd\nconda create -n be645 python=3.10 -y\nconda activate be645\npip\
  \ install -r requirements.txt\n```\n\n## Datasets and Code\n\n**Datasets**\n\n***Liver Tumor Segmentation\
  \ (130 CT Scans for Liver Tumor Segmentation)***\n\nThis dataset was extracted from LiTS - Liver Tumor\
  \ Segmentation Challenge (LiTS17) organized in conjunction with ISBI\n2017 and MICCAI 2017.\n\nDataset\
  \ Link: https://www.kaggle.com/datasets/andrewmvd/liver-tumor-segmentation\n\nMore information: Original\
  \ dataset is The Liver Tumor Segmentation Benchmark (LiTS) that can be accessed from this\nlink: https://arxiv.org/abs/1901.04056\n\
  \nCitation for the dataset:\n\n> Bilic, P., Christ, P., Li, H. B., Vorontsov, E., Ben-Cohen, A., Kaissis,\
  \ G., ... & Menze, B. (2023). The liver tumor\n> segmentation benchmark (lits). Medical Image Analysis,\
  \ 84, 102680.\n\n***Brain Tumor Dataset***\n\nThis dataset contains 3,064 T1-weighted contrast-enhanced\
  \ MRI images from 233 patients, categorized into three\nbrain tumor types: meningioma (708 slices),\
  \ glioma (1,426 slices), and pituitary tumor (930 slices).\nThe dataset is divided into four subsets,\
  \ each archived in a `.zip` file containing 766 slices,\nalong with 5-fold cross-validation indices\
  \ for robust evaluation.\n\nEach image is stored in MATLAB (`.mat`) format, including fields such as\
  \ tumor label, patient ID, image data,\ntumor border coordinates, and a binary tumor mask.\nThe images\
  \ were acquired using a standardized protocol at Nanfang Hospital and General Hospital,\nTianjin Medical\
  \ University, China, between 2005 and 2010, with a resolution of 512 x 512 pixels and pixel\ndimensions\
  \ of 0.49 x 0.49 mm².\n\nDataset Link: https://figshare.com/articles/dataset/brain_tumor_dataset/1512427\n\
  \nCitations for the dataset:\n\n> Cheng, J., Huang, W., Cao, S., Yang, R., Yang, W., Yun, Z., ... &\
  \ Feng, Q. (2015). Enhanced performance of brain tumor\n> classification via tumor region augmentation\
  \ and partition. PloS one, 10(10), e0140381.\n\n> Cheng, J., Yang, W., Huang, M., Huang, W., Jiang,\
  \ J., Zhou, Y., ... & Chen, W. (2016). Retrieval of brain tumors by\n> adaptive spatial pooling and\
  \ fisher vector representation. PloS one, 11(6), e0157112.\n\n***Brain Tumor Dataset: Segmentation &\
  \ Classification***\n\nThis dataset is a curated and enhanced collection of brain tumor MRI\nimages\
  \ derived from two publicly available datasets: the Kaggle Brain Tumor MRI Dataset and the SciDB Brain\
  \ Tumor\nDataset. It is designed for both segmentation and classification tasks, including identifying\
  \ tumor types such\nas glioma, meningioma, and pituitary tumors, with approximately 5,000 images and\
  \ ~2,700 segmentation masks. Enhancements\ninclude normalization, noise reduction through Gaussian filtering,\
  \ contrast adjustments, and structured organization\ninto directories for images and masks, along with\
  \ pixel-level annotations and classification labels.\n\nDataset Link: https://www.kaggle.com/datasets/indk214/brain-tumor-dataset-segmentation-and-classification\n\
  \n***Breast Ultrasound Images Dataset***\n\nThe dataset comprises 780 breast ultrasound images collected\
  \ in 2018 from 600 female patients aged 25 to 75 years.\nEach image has an average size of 500 x 500\
  \ pixels and is stored in PNG format, accompanied by ground truth images for\nreference.\nThe dataset\
  \ is structured into three categories: normal, benign, and malignant.\n\nDataset Link: https://www.kaggle.com/datasets/aryashah2k/breast-ultrasound-images-dataset\n\
  \nMore information: Original paper (Dataset of breast ultrasound images) that can be accessed from this\n\
  link: https://doi.org/10.1016/j.dib.2019.104863\n\nCitation for the dataset:\n\n> Al-Dhabyani, W., Gomaa,\
  \ M., Khaled, H., & Fahmy, A. (2020). Dataset of breast ultrasound images.\n> Data in brief, 28, 104863.\n\
  \n***COVID-19 Radiography Database***\n\nA team of researchers from Qatar University, Doha, the University\
  \ of Dhaka, and their collaborators from Pakistan and\nMalaysia, in collaboration with medical doctors,\
  \ developed a comprehensive COVID-19 Radiography Database, which won the\nCOVID-19 Dataset Award by\
  \ the Kaggle Community.\n\nInitially, they released a dataset containing 219 COVID-19, 1341 normal,\
  \ and 1,345 viral pneumonia chest X-ray images.\nSubsequent updates expanded the dataset significantly,\
  \ with the latest update including 3,616 COVID-19 cases,\n10,192 normal, 6,012 lung opacity, and 1,345\
  \ viral pneumonia images, along with corresponding lung masks.\n\nAdditionally, Qatar University researchers\
  \ compiled the COVID-QU-Ex dataset, featuring 33,920 chest X-ray images\nand ground-truth lung segmentation\
  \ masks, making it the largest lung mask dataset created.\nThe dataset includes 11,956 COVID-19, 11,263\
  \ non-COVID infections, and 10,701 normal images,\nwith 2,913 COVID-19 infection segmentation masks\
  \ provided from their previous QaTaCov project.\n\nDataset Link: https://www.kaggle.com/datasets/tawsifurrahman/covid19-radiography-database\n\
  \nCitation for the dataset:\n\n> Chowdhury, M. E., Rahman, T., Khandakar, A., Mazhar, R., Kadir, M.\
  \ A., Mahbub, Z. B., ... & Islam, M. T. (2020). Can\n> AI help in screening viral and COVID-19 pneumonia?.\
  \ Ieee Access, 8, 132665-132676.\n\n***[MedMNIST+] 18x Standardized Datasets for 2D and 3D Biomedical\
  \ Image Classification with Multiple Size Options: 28 (\nMNIST-Like), 64, 128, and 224***\n\nMedMNIST\
  \ is a comprehensive collection of standardized biomedical images, designed to simplify research\nand\
  \ educational activities in biomedical image analysis, computer vision, and machine learning.\nIt includes\
  \ 12 datasets for 2D images and 6 datasets for 3D images, all pre-processed to 28x28 (2D) or\n28x28x28\
  \ (3D) with classification labels, eliminating the need for background knowledge.\nThe dataset spans\
  \ various data scales (100 to 100,000) and tasks (binary/multi-class classification,\nordinal regression,\
  \ multi-label classification), totaling around 708K 2D and 10K 3D images.\n\nRecently, MedMNIST+ was\
  \ released, offering larger image sizes (64x64, 128x128, 224x224 for 2D, and 64x64x64 for 3D)\nto support\
  \ the development of medical foundation models.\n\nDataset Link: https://zenodo.org/records/10519652\n\
  \nCitations for the dataset:\n\n> Yang, J., Shi, R., Wei, D., Liu, Z., Zhao, L., Ke, B., ... & Ni, B.\
  \ (2023). Medmnist v2-a large-scale lightweight\n> benchmark for 2d and 3d biomedical image classification.\
  \ Scientific Data, 10(1), 41.\n>\n> Yang, J., Shi, R., & Ni, B. (2021, April). Medmnist "

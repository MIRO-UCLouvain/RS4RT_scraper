readme_excerpt: "# Predicting the 3-Dimensional Dose Distribution of Multilesion Lung Stereotactic Ablative\
  \ Radiation Therapy With Generative Adversarial Networks\r\n\r\n## Table of Contents\r\n\r\n- [Introduction](#introduction)\r\
  \n- [Requirements](#requirements)\r\n- [Usage](#usage)\r\n- [Citation](#citation)\r\n\r\n\r\n## Introduction\r\
  \n\r\nThis is the companion repository for the paper \"Predicting the 3-Dimensional Dose Distribution\
  \ of Multilesion Lung Stereotactic Ablative Radiation Therapy With Generative Adversarial Networks\"\
  , published in the International Journal of Radiation Oncology, Biology, Physics.\r\n\r\n## Requirements\r\
  \n\r\n* Python 3.9\r\n* PyTorch 2.0.1\r\n\r\n## Usage\r\nPatient plans should be stored as numpy files,\
  \ with channels for the CT scan, the initial dose estimation, and contours of the PTVs and OARs. The\
  \ numpy files should be stored in the directory refenced as DATA_DIR in confV2.yml. Make sure to adjust\
  \ the file paths for the other directories as well. Use the V2 versions of the code for model training.\
  \ \r\n\r\n\r\n## Citation\r\n\r\nIf you use this repostiory in your work, please cite: \r\n\r\n```\r\
  \nWang, E., Abdallah, H., Snir, J., Chong, J., Palma, D. A., Mattonen, S. A., & Lang, P. (2025). Predicting\
  \ the 3-Dimensional Dose Distribution of Multilesion Lung Stereotactic Ablative Radiation Therapy With\
  \ Generative Adversarial Networks. International Journal of Radiation Oncology* Biology* Physics, 121(1),\
  \ 250-260.\r\n```\r\n\r\n\r\n"

readme_excerpt: "# Rapid Treatment Planning for Low-dose-rate Prostate Brachytherapy with TP-GAN\n\nKeras/Tensorflow\
  \ implementation of TP-GAN for automating treatment planning for low-dose-rate prostate brachytherapy.\
  \ This work has been published in Medical Image Computing and Computer Assisted Intervention – MICCAI\
  \ 2021 (https://miccai2021.org/en/).\n\n<a href=\"https://link.springer.com/chapter/10.1007%2F978-3-030-87202-1_56\"\
  \ target=\"_blank\">Paper |</a>\n<a href=\"\" target=\"_blank\" rel=\"noopener noreferrer\">Presentation</a>\n\
  \n<p align=\"left\">\n<a href=\"#\"><img src=\"assets/cover.png\" width=\"100%\"></a>\n</p>\n\n### Dependencies\n\
  ```\nPython 3.6\nTensorflow: 2.0.0\nKeras: 2.3.1\n```\n\n### Environment Setup\n\nRecreate conda environment\
  \ as follows:\n```\nconda env create -f environment.yml\n```\n\nOr if you are using Docker:\n```\ndocker\
  \ pull tazleef/tf2.0.0-cv-keras2.3.1-imgaug:latest\n```\n\n### Training\n\nDue to privacy policy, we\
  \ are unable to share our clinical dataset. However, we have included a few sample cases for reference.\
  \ Format your centre's dataset in the same way and set the filepath and training parameters in `train.py`.\
  \ \n\nTo train the model, run `train.py`. \n\nThe model for automatic needle plan generation from target\
  \ volumes can be found [here](https://github.com/tajwarabraraleef/3Dpix2pix-for-prostate-brachytherapy).\
  \ Using these two techniques together will allow for an end-to-end treatment planning solution for prostate\
  \ brachytherapy.  \n\nThis code can be used for other 3D image to image translation task by modifying\
  \ the network architectures accordingly. \n\n### Citation\n\nPlease cite the following paper if you\
  \ use this code in your work:\n```\n@InProceedings{aleef2021,\ntitle={Rapid Treatment Planning for Low-dose-rate\
  \ Prostate Brachytherapy with TP-GAN},\nauthor={Aleef, Tajwar Abrar, Spadinger, Ingrid T., Peacock,\
  \ Michael D., Salcudean, Septimiu E. and Mahdavi, S. Sara},\nbooktitle=\"Medical Image Computing and\
  \ Computer Assisted Intervention -- MICCAI 2021\",\npages={581--590},\nyear={2021},\norganization={Springer}\n\
  }\n```\n\n### Contact \n\nIf you face any problem using this code then please create an issue in this\
  \ repository or contact me at [tajwaraleef@ece.ubc.ca](mailto:tajwaraleef@ece.ubc.ca?subject=[GitHub]%20TP-GAN%20Issue%20)\n\
  \n### Acknowledgements\n\nThe 3D Resnet code is based on [https://github.com/JihongJu/keras-resnet3d](https://github.com/JihongJu/keras-resnet3d)\n\
  \n### License\nMIT\n\n"

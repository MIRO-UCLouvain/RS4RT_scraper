readme_excerpt: "# MRI-to-CT-Generation\n\nGenerate synthetic CT images from given MRI scans. This aims\
  \ to reduce the need for additional CT scans in order to save costs and more importantly, to minimize\
  \ radiation exposure for patients.\n\n## Overview\n\nThis project implements a Pix2Pix conditional GAN\
  \ (cGAN) model to generate synthetic CT images from T1-weighted MRI scans. The model is trained on paired\
  \ MRI-CT data and can produce high-quality synthetic CT images that maintain anatomical consistency\
  \ with the input MRI.\n\n## Features\n\n- **Pix2Pix cGAN Architecture**: Uses a U-Net generator with\
  \ skip connections and a PatchGAN discriminator\n- **Robust Preprocessing**: Implements percentile-based\
  \ normalization and data augmentation\n- **Paired Data Loading**: Efficiently handles paired MRI-CT\
  \ datasets with automatic patient matching\n- **Comprehensive Metrics**: Tracks PSNR, SSIM, and GAN\
  \ losses during training\n- **Docker Support**: Containerized environment for easy deployment and reproducibility\n\
  ## Training the Model\n\n1. Open the [pix2pix.ipynb](utils/pix2pix.ipynb) notebook\n2. Update the data\
  \ paths in the training section:\n   ```python\n   ct_folder = \"../data/CT/PNG\"\n   t1_folder = \"\
  ../data/T1-MRI/PNG\"\n   ```\n3. Configure training parameters:\n   ```python\n   IMAGE_SIZE = (256,\
  \ 256)\n   BATCH = 8\n   EPOCHS = 100\n   ```\n4. Run the training cells to start training\n\n### Key\
  \ Components\n\n#### Data Preprocessing ([preprocess.py](utils/preprocess.py))\n- **[`PairedCTT2Loader`](utils/preprocess.py)**:\
  \ Custom data loader for paired MRI-CT datasets\n- **[`robust_norm`](utils/preprocess.py)**: Percentile-based\
  \ normalization to [-1, 1] range\n- **[`natural_key`](utils/preprocess.py)**: Natural sorting for consistent\
  \ slice ordering\n\n#### Model Architecture ([pix2pix.py](utils/pix2pix.py))\n- **[`build_generator`](utils/pix2pix.py)**:\
  \ U-Net architecture with skip connections\n- **[`build_discriminator`](utils/pix2pix.py)**: PatchGAN\
  \ discriminator for realistic texture generation\n- **[`Pix2Pix`](utils/pix2pix.py)**: Main model class\
  \ with adversarial + L1 loss\n\n## Architecture\n \n| Component | Details |\n|-----------|---------|\n\
  | Generator | U-Net (encoder-decoder with skip connections) |\n| Discriminator | PatchGAN (70×70 receptive\
  \ field) |\n| Loss | Adversarial (BCE) + L1 reconstruction loss |\n| Framework | PyTorch |\n \n---\n\
  \ \n## Results\n \nThe model learns to map structural features from MRI (soft tissue contrast) to the\
  \ Hounsfield unit ranges expected in CT (bone = bright, air = dark, soft tissue = mid-range).\n \nEvaluation\
  \ metrics:\n- **SSIM** (Structural Similarity Index) — measures perceptual similarity\n- **MAE** (Mean\
  \ Absolute Error) — measures pixel-level reconstruction accuracy\n \n---\n \n## Setup\n \n```bash\n\
  git clone https://github.com/Ob1thecoder/MRI-to-CT-Generation\ncd MRI-to-CT-Generation\npip install\
  \ torch torchvision opencv-python matplotlib jupyter\n```\n \nOpen `MRI_to_CT.ipynb` in Jupyter and\
  \ run cells top to bottom.\n \n**Dataset:** Paired MRI–CT volumes (e.g. [Gold Atlas](https://www.cancerimagingarchive.net/)\
  \ or similar). Place in `data/train/` with subdirectories `mri/` and `ct/`.\n \n---\n \n## Project Structure\n\
  \ \n```\nMRI-to-CT-Generation/\n├── MRI_to_CT.ipynb      # Main notebook (data loading, training, evaluation)\n\
  ├── data/\n│   ├── train/\n│   │   ├── mri/\n│   │   └── ct/\n│   └── test/\n└── outputs/          \
  \   # Generated images saved here\n```\n \n---\n## Evaluation Metrics\n\n- **PSNR**: Peak Signal-to-Noise\
  \ Ratio\n- **SSIM**: Structural Similarity Index\n- **L1 Loss**: Mean Absolute Error between real and\
  \ synthetic CT\n- **Adversarial Loss**: GAN loss for realistic image generation\n\n## Output\n\nThe\
  \ model generates:\n- Individual synthetic CT images in `outputs/manual_eval/synthetic_only/`\n- Side-by-side\
  \ comparison images (MRI | Real CT | Synthetic CT) in `outputs/manual_eval/triptych/`\n"

readme_excerpt: "# MRAI-Tumor Segmentation & 3D-Export Engine\r\n\r\n**Developer:** Tair Fridman | B.Sc.\
  \ Biomedical Engineering, Technion\r\n\r\n## Overview<img width=\"1920\" height=\"1080\" alt=\"image\"\
  \ src=\"https://github.com/user-attachments/assets/5d9e7c40-4e3d-4645-8c83-6e9b8edcc042\" />\r\n\r\n\
  ## Overview\r\nThe **MRAI Engine** is a comprehensive medical imaging platform designed for high-precision\
  \ neuroimaging analysis. It bridges the gap between raw radiological data and actionable clinical insights\
  \ by integrating a custom-trained **3D Fully Convolutional Network (FCN)** for automated tumor segmentation.\
  \ \r\n\r\nUnlike standard viewers, this system performs **True-Scale Inference** on 1:1 voxel data,\
  \ preserving spatial integrity for accurate **3D volumetric calculations** and **STL mesh generation**.\
  \ From advanced frequency-domain signal processing (FFT) to automated clinical reporting, the MRAI Engine\
  \ provides a complete end-to-end pipeline for modern digital pathology and surgical planning.\r\n\r\n\
  ## Key Features\r\n\r\n* **Deep Learning Tumor Detection & Contouring:** Integrates a custom 3D U-Net\
  \ architecture (Fully Convolutional Network) to automatically detect, localize, and draw precise clinical\
  \ contours around brain tumors, complete with probability scoring.\r\n* **Interactive Orthogonal Navigation:**\
  \ Features a synchronized UI for simultaneous viewing of Axial, Coronal, and Sagittal planes. Includes\
  \ real-time slicing, spatial crosshairs, deep zooming, and axis rotation.\r\n* **3D STL Generation &\
  \ True Volumetry:** Converts MRI pixel data into 3D printable STL meshes (capable of rendering both\
  \ the full brain and isolated tumor masses). Calculates exact physical volume in real-world units (cm³)\
  \ using DICOM/NIfTI spatial metadata.\r\n* **Advanced Frequency-Domain DSP:** Implements a custom Gaussian\
  \ High-Pass Filter via Fast Fourier Transform (FFT) to highlight fine edges and morphological details\
  \ without ringing artifacts.\r\n* **Real-Time Image Enhancement & Color Mapping:** Provides dynamic\
  \ image sharpening tools and multiple colormap filters (e.g., Grayscale, Hot, Viridis, Inferno) to improve\
  \ tissue contrast and visual diagnosis.\r\n* **Multi-Format Clinical Data Pipeline:** Robust parsing\
  \ engine capable of handling raw DICOM series and compressed NIfTI volumes, automatically calibrating\
  \ physical voxel spacing and aspect ratios.\r\n* **Automated Clinical PDF Reporting:** Instantly compiles\
  \ current multi-planar snapshot views, AI diagnosis confidence, and volumetric calculations into a formatted,\
  \ ready-to-print medical report.\r\n\r\n## Tech Stack\r\n* **Deep Learning:** PyTorch\r\n* **Image Processing:**\
  \ Scikit-Image, SciPy, NumPy, Nilearn\r\n* **Medical Formats:** NiBabel, PyDICOM\r\n* **GUI & Visualization:**\
  \ Matplotlib, Tkinter, stl-mesh\r\n\r\n## How to Run\r\n\r\nThis project requires Python 3.8+ and a\
  \ standard 64-bit OS. \r\n\r\n1. **Download the project**\r\n   Clone this repository or download it\
  \ as a ZIP file and extract it.\r\n   \r\n2. **Install dependencies**\r\n   Open a terminal in the project\
  \ folder and run:\r\n   ```bash\r\n   pip install -r requirements.txt\r\n   ```\r\n\r\n3. **Launch the\
  \ Viewer**\r\n   Ensure the pre-trained model weights file (`brats_3d_unet_full.pth`) is in the same\
  \ folder, then run the main application:\r\n   ```bash\r\n   python MriFINAL.py\r\n   ```\r\n"

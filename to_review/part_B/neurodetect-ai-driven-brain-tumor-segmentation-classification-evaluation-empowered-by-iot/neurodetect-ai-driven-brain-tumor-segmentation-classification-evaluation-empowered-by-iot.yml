readme_excerpt: "# Brain Tumor Diagnosis & Classification Using MRI Scans\n\nThis project develops a deep\
  \ learning system for **brain tumor detection, classification, and evaluation** using MRI scans.  \n\
  It leverages datasets like **BraTS** and implements segmentation, classification, and tumor analysis\
  \ workflows.\n\n---\n\n## Repository Structure\n\n---\n\n## Project Overview\n- **Segmentation:** U-Net\
  \ is used to segment tumors from MRI scans.  \n- **Classification:** ResNet-based CNN classifies tumor\
  \ types or presence/absence.  \n- **Tumor Analysis:** Radiomics features are extracted for further evaluation\
  \ and prognosis analysis.  \n\n---\n\n## Dataset\n- **BraTS dataset** (Brain Tumor Segmentation Challenge)\
  \  \n- Multi-parametric MRI scans (T1, T2, FLAIR, etc.) with expert annotations.  \n- Organized in subfolders\
  \ inside `Brain_Cancer_Dataset/`.  \n\n---\n##Usage\n#Segmentation\n\nOpen Create Segmentation.ipynb\
  \ or Segmentation.ipynb to:\nPreprocess MRI scans\nApply U-Net for tumor segmentation\nVisualize segmented\
  \ regions\n\n#Classification\n\nOpen Brain_Tumor_Classification.ipynb to:\nLoad segmented or raw MRI\
  \ scans\nTrain or test ResNet-based classifier\nGenerate outputs like Classification output.png\n\n\
  #Results\n\nTumor regions segmented accurately using U-Net.\nClassification achieves high accuracy on\
  \ BraTS dataset.\nRadiomics features extracted for further clinical insights.\n\n\n##Collaborators\n\
  Duvvuru Venkata Sai Sudeep Reddy\nDuvvuru Sai Nandini Reddy\n"

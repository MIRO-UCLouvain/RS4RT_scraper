readme_excerpt: "# Radiomics Pipeline for Alzheimer's Disease Classification\n![Python](https://img.shields.io/badge/Python-3.8%2B-blue?logo=python)\n\
  ![License](https://img.shields.io/badge/License-MIT-yellow.svg)\n![Status](https://img.shields.io/badge/Status-Active-success)\n\
  ![ML-Pipeline](https://img.shields.io/badge/ML-Pipeline-green)\n![Radiomics](https://img.shields.io/badge/Radiomics-Enabled-purple)\n\
  ![XGBoost](https://img.shields.io/badge/XGBoost-Supported-orange)\n![PyRadiomics](https://img.shields.io/badge/PyRadiomics-Used-informational)\n\
  \nA robust, production-ready pipeline for medical image analysis using radiomics features and machine\
  \ learning. This pipeline is designed for clinical technicians and researchers to classify Alzheimer's\
  \ Disease (AD) vs Cognitively Normal (CN) subjects.\n\n## \U0001F31F Key Features\n\n- **Advanced Preprocessing**:\
  \ Automatic NIfTI validation, intensity normalization, and image alignment\n- **Comprehensive Feature\
  \ Extraction**: 1000+ radiomics features from multiple image types\n- **Multi-method Feature Selection**:\
  \ \n  - Univariate filtering (correlation, mutual information)\n  - Multivariate selection (RFE, Boruta)\n\
  \  - Variance thresholding\n- **Multiple ML Models**: Random Forest, XGBoost, SVM, Logistic Regression,\
  \ Gradient Boosting\n- **Production-ready**: Complete pipeline persistence, new image prediction\n-\
  \ **GUI-ready**: Modular architecture prepared for graphical interface integration\n\n## \U0001F4A1\
  \ Why this project?\n\nThis project was built to demonstrate my ability to design a production-ready\n\
  machine learning pipeline for medical imaging. It showcases skills in:\n\n- data preprocessing for neuroimaging\
  \ (NIfTI, affine, normalization)\n- radiomics feature engineering\n- model selection and evaluation\
  \ for clinical classification\n- building modular, extensible, production-grade architectures\n\n##\
  \ \U0001F9E0 Skills Demonstrated\n- Data preprocessing and normalization for 3D medical images\n- Advanced\
  \ feature engineering (PyRadiomics)\n- Multi-stage ML pipelines\n- Hyperparameter optimization\n- Model\
  \ evaluation for imbalanced data\n- Production-ready architecture\n- CLI tool design\n- Logging and\
  \ error handling\n\n\n## \U0001F4C1 Project Structure\n\n```\nradiomics_pipeline/\n├── config.py   \
  \              # Configuration management\n├── preprocessing.py          # Image preprocessing module\n\
  ├── feature_extraction.py     # Radiomics feature extraction\n├── feature_selection.py      # Advanced\
  \ feature selection\n├── model_training.py         # Multi-model training\n├── pipeline.py         \
  \     # Complete pipeline integration\n├── predict.py               # Prediction on new images\n├──\
  \ main.py                  # Main executable script\n├── utils/\n│   └── metrics.py           # Evaluation\
  \ and visualization utilities\n├── requirements.txt         # Python dependencies\n├── models/     \
  \             # Saved models directory\n├── results/                 # Results and reports\n├── logs/\
  \                    # Logging files\n└── data/                    # Dataset directory\n```\n\n## \U0001F6E0\
  ️ Built With\n- Python\n- PyRadiomics\n- Scikit-learn\n- XGBoost\n- NumPy & SciPy\n- Nibabel\n- Matplotlib\
  \ / Seaborn\n\n\n## \U0001F4CB Requirements\n\n- Python 3.8+\n- See `requirements.txt` for full dependencies\n\
  \n## \U0001F680 Installation\n\n```bash\n# Clone the repository\ngit clone https://github.com/JimmyBelt/Alzheimer-s-Disease-classification-pipeline.git\n\
  cd radiomics_pipeline\n\n# Create virtual environment\npython -m venv venv\nsource venv/bin/activate\
  \  # On Windows: venv\\Scripts\\activate\n\n# Install dependencies\npip install -r requirements.txt\n\
  \n# Optional: Install Boruta for advanced feature selection\npip install boruta\n```\n\n## \U0001F4CA\
  \ Expected Data Structure and Workflow\n\n```\ndataset/\n├── AD/                      # Alzheimer's\
  \ Disease subjects\n│   ├── subject_001/\n│   │   ├── T1/\n│   │   │   └── T1.nii.gz\n│   │   └── label/\n\
  │   │       └── label.nii.gz\n│   ├── subject_002/\n│   └── ...\n└── CN/                      # Cognitively\
  \ Normal subjects\n    ├── subject_101/\n    │   ├── T1/\n    │   │   └── T1.nii.gz\n    │   └── label/\n\
  \    │       └── label.nii.gz\n    └── ...\n```\n\n![Pipeline Overview](./images/pipeline_workflow.png)\n\
  \n\n## \U0001F3AF Usage\n\n### 1. Training a Complete Pipeline\n\n```bash\n# Train with all enabled\
  \ models\npython main.py --mode train --data /path/to/dataset\n\n# Quick training (reduced hyperparameter\
  \ search)\npython main.py --mode train --data /path/to/dataset --quick\n\n# Train specific models only\n\
  python main.py --mode train --data /path/to/dataset --models random_forest xgboost\n\n# Custom output\
  \ directory\npython main.py --mode train --data /path/to/dataset --output ./my_results\n```\n\n### 2.\
  \ Predicting on New Images\n\n```bash\n# Single image prediction\npython main.py --mode predict \\\n\
  \    --pipeline models/pipeline.pkl \\\n    --image /path/to/image.nii.gz \\\n    --mask /path/to/mask.nii.gz\n\
  \n# Using the prediction module directly\npython predict.py \\\n    --pipeline models/pipeline.pkl \\\
  \n    --image /path/to/image.nii.gz \\\n    --mask /path/to/mask.nii.gz \\\n    --output prediction_result.json\n\
  \n# Batch prediction on directory\npython predict.py \\\n    --pipeline models/pipeline.pkl \\\n   \
  \ --directory /path/to/test/dataset \\\n    --output batch_predictions.csv \\\n    --visualize\n```\n\
  \n### 3. Evaluating Existing Pipeline\n\n```bash\npython main.py --mode evaluate \\\n    --pipeline\
  \ models/pipeline.pkl \\\n    --data /path/to/test/dataset\n```\n\n### 4. Feature Extraction Only\n\n\
  ```bash\npython main.py --mode extract \\\n    --data /path/to/dataset \\\n    --output ./features\n\
  ```\n\n## \U0001F527 Configuration\n\nEdit `config.py` to customize:\n\n### Preprocessing Settings\n\
  ```python\nPREPROCESSING = {\n    'validate_nifti': True,\n    'fix_affine': True,\n    'intensity_normalization':\
  \ True,\n    'check_spacing': True,\n    'check_orientation': True\n}\n```\n\n### Feature Selection\
  \ Settings\n```python\nFEATURE_SELECTION = {\n    'correlation_threshold': 0.8,\n    'univariate_method':\
  \ 'mutual_info',\n    'univariate_k': 50,\n    'use_rfe': True,\n    'rfe_n_features': 20,\n    'use_boruta':\
  \ True,\n    'final_k_features': 15\n}\n```\n\n### Model Configuration\n```python\nMODELS = {\n    'random_forest':\
  \ {\n        'enabled': True,\n        'param_grid': {\n            'n_estimators': [50, 100, 200],\n\
  \            'max_depth': [3, 5, 7, 10],\n            ...\n        }\n    },\n    'xgboost': {\n   \
  \     'enabled': True,\n        ...\n    }\n}\n```\n\n## \U0001F4C8 Pipeline Workflow\n\n1. **Feature\
  \ Extraction**\n   - Load and validate NIfTI images\n   - Apply preprocessing (intensity normalization,\
  \ affine correction)\n   - Extract 1000+ radiomics features using PyRadiomics\n   - Features from multiple\
  \ image types (Original, Wavelet, LoG, etc.)\n\n2. **Feature Selection**\n   - Remove low variance features\n\
  \   - Remove correlated features (univariate correlation > 0.8)\n   - Univariate selection (mutual information,\
  \ f_classif, chi2)\n   - Multivariate selection (RFE with Random Forest)\n   - Optional: Boruta algorithm\
  \ for all-relevant feature selection\n   - Final selection based on importance ranking\n\n3. **Model\
  \ Training**\n   - Data splitting (train/validation/test)\n   - Feature scaling (MinMax, Standard, or\
  \ Robust)\n   - Grid search with cross-validation for each model\n   - Multiple models: RF, XGBoost,\
  \ SVM, LogReg, GradientBoosting\n   - Best model selection based on ROC-AUC\n\n4. **Evaluation**\n \
  \  - Comprehensive metrics (Accuracy, Precision, Recall, F1, ROC-AUC)\n   - Confusion matrices\n   -\
  \ ROC and Precision-Recall curves\n   - Feature importance analysis\n   - Overfitting analysis\n\n5.\
  \ **Deployment**\n   - Complete pipeline serialization\n   - Prediction on new images\n   - Batch processing\
  \ capabilities\n\n## \U0001F4CA Output Files\n\nAfter training, the pipeline generates:\n\n```\nresults/\n\
  ├── raw_features.csv                 # All extracted features\n├── model_comparison.csv            \
  \ # Performance comparison\n├── training_report.txt              # Detailed training report\n├── feature_selection_summary.png\
  \    # Feature selection visualization\n├── roc_curves.png                   # ROC curves for all models\n\
  ├── confusion_matrix.png             # Best model confusion matrix\n├── feature_importances.png    \
  \      # Feature importance plot\n└── pipeline_report.txt              # Complete pipeline summary\n\
  \nmodels/\n├── pipeline.pkl                     # Complete pipeline (all models)\n├── pipeline_metadata.json\
  \           # Pipeline information\n└── best_model_*.pkl                 # Individual model files\n\
  ```\n\n## \U0001F52C Python API Usage\n\n```python\nfrom config import Config\nfrom pipeline import\
  \ RadiomicsPipeline\nfrom pathlib import Path\n\n# Initialize pipeline\nconfig = Config()\npipeline\
  \ = RadiomicsPipeline(config)\n\n# Run complete training\nresults = pipeline.run_complete_pipeline(Path('/path/to/dataset'))\n\
  \n# Save pipeline\npipeline.save_pipeline()\n\n# Predict on new image\nresult = pipeline.predict_new_image(\n\
  \    Path('new_image.nii.gz'),\n    Path('new_mask.nii.gz')\n)\nprint(f\"Prediction: {result['prediction_label']}\"\
  )\nprint(f\"Confidence: {result['confidence']:.2%}\")\n```\n\n## \U0001F3A8 Preparing for GUI Integration\n\
  \nThe modular architecture is designed for easy GUI integration:\n\n```python\n# Example GUI integration\
  \ pseudocode\nclass RadiomicsGUI:\n    def __init__(self):\n        self.pipeline = RadiomicsPipeline()\n\
  \    \n    def on_train_button_click(self):\n        dataset_path = self.get_dataset_path_from_dialog()\n\
  \        # Run in separate thread to avoid blocking UI\n        self.pipeline.run_complete_pipeline(dataset_path)\n\
  \    \n    def on_predict_button_click(self):\n        image_path = self.get_file_from_dialog()\n  \
  \      mask_path = self.get_file_from_dialog()\n        result = self.pipeline.predict_new_image(image_path,\
  \ mask_path)\n        self.display_result(result)\n```\n\n## \U0001F41B Troubleshooting\n\n### Common\
  \ Issues\n\n1. **NIfTI Validation Errors**\n   - Solution: Enable `fix_affine: True` in config\n   -\
  \ Pipeline automatically fixes non-orthonormal affine matrices\n\n2. **Memory Issues with Large Datasets**\n\
  \   - Solution: Process in batches or reduce feature extraction settings\n   - Consider using `quick`\
  \ mode for initial testing\n\n3. **Boruta Installation Issues**\n   - Boruta is optional but recommended\n\
  \   - If unavailable, set `use_boruta: False` in config\n\n4. **XGBoost Not Found**\n   - Install: `pip\
  \ install xgboost`\n   - Or disable in config: `MODELS['xgboost']['enabled'] = False`\n\n## \U0001F4DD\
  \ Logging\n\nAll operations are logged to:\n- Console (real-time feedback)\n- File: `logs/pipeline.log`\n\
  \nConfigure logging level in `config.py`:\n```python\nLOGGING = {\n    'level': 'INFO',  # DEBUG, INFO,\
  \ WARNING, ERROR\n    ...\n}\n```\n\n## \U0001F50D Feature Extraction Details\n\nThe pipeline extracts\
  \ features from:\n\n**Image Types:**\n- Original\n- Wavelet decomposition\n- Laplacian of Gaussian (LoG)\n\
  - Square, Square Root\n- Logarithm, Exponential\n- Gradient\n- Local Binary Pattern (LBP-3D)\n\n**Feature\
  \ Classes:**\n- First Order Statistics\n- Gray Level Co-occurrence Matrix (GLCM)\n- Gray Level Run Length\
  \ Matrix (GLRLM)\n- Gray Level Size Zone Matrix (GLSZM)\n- Gray Level Dependence Matrix (GLDM)\n- Neighbourhood\
  \ Gray Tone Difference Matrix (NGTDM)\n- Shape features\n\n## \U0001F4DA References\n\n- PyRadiomics:\
  \ https://pyradiomics.readthedocs.io/\n- Boruta Algorithm: Kursa & Rudnicki (2010)\n- Radiomics in Medical\
  \ Imaging: Gillies et al. (2016)\n\n## \U0001F91D Contributing\n\nThis pipeline is designed for clinical\
  \ use. Contributions welcome:\n- Bug fixes\n- New feature selection methods\n- Additional preprocessing\
  \ steps\n- GUI implementation\n- Documentation improvements\n\n## \U0001F4C4 License\n\nThis project\
  \ is licensed under the MIT License – see the [LICENSE](./LICENSE) file for details.\n\n\n\n## \U0001F465\
  \ Author\n\nJaime Beltrán Sánchez\n\nThanks to Blanca Rodríguez González\n\n\n## \U0001F4E7 Contact\n\

readme_excerpt: "# MAP-USE Model (last updated: 2025-08-01)\n\nThis repository contains python codes related\
  \ MAP-USE Model.  This CEUS video-based model potentially enables real-time scanning for predicting\
  \ MVI while visualizing the tumor immune microenvironment.The training of the model was completed on\
  \ NVIDIA GeForce Tesla V100 PCIe GPU .\n- The data required to build the model **dataset.py**\n-\tModel\
  \ architecture **model.py**\n- Training model **train.py**\n- Evaluating model **validate.py**\n- Some\
  \ configuration information **config.py**\n- Model attention heatmap visualization **cam.py**\n- Conda\
  \ environment **environment.yml**\n\n**To run the codes ensure you have the necessary prerequisites:**\n\
  -\tPython installed on your system (version 3.7 or above).\n- Using instruction:\n`conda env create\
  \ -f environment.yml -n myenv`\n\n\n"

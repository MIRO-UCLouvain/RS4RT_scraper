readme_excerpt: "# \U0001F9EA Drug Toxicity Prediction using Machine Learning\n\nA machine learning project\
  \ focused on predicting the toxicity of chemical compounds using molecular descriptor data. This project\
  \ leverages a **Random Forest model** to identify potentially harmful compounds early in the drug development\
  \ pipeline.\n\n---\n\n## \U0001F680 Overview\n\nDrug development is expensive and time-consuming, and\
  \ many candidates fail due to unexpected toxicity. This project aims to:\n\n* Predict drug toxicity\
  \ using machine learning\n* Analyze molecular descriptors\n* Identify important features contributing\
  \ to toxicity\n* Provide a simple API + frontend interface for predictions\n\n---\n\n## \U0001F9E0 Model\
  \ Used\n\n* **Algorithm:** Random Forest Classifier\n* **Why Random Forest?**\n\n  * Handles high-dimensional\
  \ data well\n  * Robust to overfitting\n  * Provides feature importance for interpretability\n\n---\n\
  \n## \U0001F4C2 Project Structure\n\n```\ndrug_toxicity_pred/\n│── public/                         #\
  \ Frontend files\n│── venv/                           # Virtual environment (ignored)\n│── .gitignore\
  \                      # Git ignore file\n│── Drug_toxicity_prediction.ipynb  # Research & model training\
  \ notebook\n│── main.py                         # FastAPI app (backend server)\n│── requirements.txt\
  \               # Dependencies\n│── tox21.csv                      # Dataset\n```\n\n---\n\n## \U0001F4CA\
  \ Dataset\n\n* **Dataset:** Tox21 Dataset\n* **Source:** [https://www.kaggle.com/datasets/epicskills/tox21-dataset](https://www.kaggle.com/datasets/epicskills/tox21-dataset)\n\
  \n### Contains:\n\n* ~12,000 chemical compounds\n* Toxicity assay results\n* Molecular descriptor features\n\
  \n---\n\n## ⚙️ Installation & Setup\n\n### 1. Clone the repository\n\n```\ngit clone https://github.com/your-username/drug_toxicity_pred.git\n\
  cd drug_toxicity_pred\n```\n\n### 2. Create virtual environment\n\n```\npython -m venv venv\nvenv\\\
  Scripts\\activate   # Windows\n```\n\n### 3. Install dependencies\n\n```\npip install -r requirements.txt\n\
  ```\n\n---\n\n## ▶️ Running the Project\n\nRun the backend server:\n\n```\npython main.py\n```\n\n*\
  \ Starts a **Uvicorn server**\n* Mounts the frontend from the `public/` folder\n\nOpen in browser:\n\
  \n```\nhttp://127.0.0.1:8000\n```\n\n---\n\n## \U0001F4C8 Features\n\n* ✅ Data preprocessing of molecular\
  \ descriptors\n* ✅ Random Forest-based toxicity prediction\n* ✅ Feature importance analysis\n* ✅ Interactive\
  \ frontend interface\n* ✅ REST API using FastAPI\n\n---\n\n## \U0001F52C Research Notebook\n\nThe file:\n\
  \n```\nDrug_toxicity_prediction.ipynb\n```\n\nContains:\n\n* Data cleaning & preprocessing\n* Exploratory\
  \ Data Analysis (EDA)\n* Model training & evaluation\n* Feature importance visualization\n\n---\n\n\
  ## \U0001F4CC Future Improvements\n\n* Add deep learning models (e.g., Graph Neural Networks)\n* Improve\
  \ feature engineering\n* Deploy on cloud (AWS / Render / HuggingFace Spaces)\n* Add explainability (SHAP\
  \ / LIME)\n* Enhance UI/UX\n\n---\n\n## \U0001F91D Contributing\n\nContributions are welcome!\nFeel\
  \ free to fork the repo and submit a pull request.\n\n---\n\n## \U0001F4DC License\n\nThis project is\
  \ open-source and available under the **MIT License**.\n\n---\n\n## \U0001F4A1 Author\n\n**Kaif**\n\
  **Ziya**\n**Yash**\n**Satvat**\nComputer Science Engineering Student\nInterested in AI, ML & real-world\
  \ problem solving\n"

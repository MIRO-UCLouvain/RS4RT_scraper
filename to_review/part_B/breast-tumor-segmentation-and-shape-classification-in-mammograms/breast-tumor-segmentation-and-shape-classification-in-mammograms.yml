readme_excerpt: "# Breast-Tumor-Segmentation-and-Shape-Classification-in-Mammograms\nBreast Tumor Segmentation\
  \ and Shape Classification in Mammograms using Generative Adversarial and Convolutional Neural Network\n\
  \n# Abstract:\nMammogram inspection in search of breast tumors is a tough assignment that radiologists\n\
  must carry out frequently. Therefore, image analysis methods are needed for the\ndetection and delineation\
  \ of breast tumors, which portray crucial morphological information\nthat will support reliable diagnosis.\
  \ In this paper, we proposed a conditional\nGenerative Adversarial Network (cGAN) devised to segment\
  \ a breast tumor within a\nregion of interest (ROI) in a mammogram. The generative network learns to\
  \ recognize\nthe tumor area and to create the binary mask that outlines it. In turn, the adversarial\n\
  network learns to distinguish between real (ground truth) and synthetic segmentations,\nthus enforcing\
  \ the generative network to create binary masks as realistic as possible.\nThe cGAN works well even\
  \ when the number of training samples are limited. As a\nconsequence, the proposed method outperforms\
  \ several state-ofthe-art approaches. Our\nworking hypothesis is corroborated by diverse experiments\
  \ performed on two datasets,\nthe public INbreast and a private in-house dataset. The proposed segmentation\
  \ model\nprovides a high Dice coefficient and Intersection over Union (IoU) of 94% and 87%,\nrespectively.\
  \ In addition, a shape descriptor based on a Convolutional Neural Network\n(CNN) is proposed to classify\
  \ the generated masks into four tumor shapes: irregular,\nlobular, oval and round. The proposed shape\
  \ descriptor was trained on Digital\nDatabase for Screening Mammography (DDSM) yielding an overall accuracy\
  \ of 80%,\nwhich outperforms the current state-of-the-art.\n\n## Keywords: \nMammograms, conditional\
  \ generative adversarial network, convolutional\nneural network, tumor segmentation and shape classification.\n\

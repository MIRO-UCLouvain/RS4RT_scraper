readme_excerpt: "# OPT Tumour models\n\nThese scripts provide methods to generate polynomial tumour models,\
  \ as commonly used in ocular proton therapy planning, based on 3D tumour delineations. Furthermore,\
  \ it provides methods to compare the resulting model to the tumour delineations.  \nThe full method\
  \ is described in Klaassen L, Rasch CRN, Beenakker JWM. Comparison of model-based and delineation-based\
  \ target volume definition for ocular proton therapy. _Submitted_ (doi not available yet).\n\n## Methods\
  \  \nA summary of the methods is shown in this image:\n\n![Schematic representation of the method](.github/assets/method.png)\n\
  \n**Figure 1**: Generation of a geometric tumour model from a delineated tumour contour.\n(A) Tumours\
  \ were delineated (green contour) and the thickness (red line) was determined automatically;\n(B) the\
  \ tumour base (green line) was extracted from delineation;\n(C) for each point in the tumour base, model\
  \ height was determined based on distance _d_ from base centre to the point, distance _d<sub>max</sub>_\
  \ from base centre to outer contour in the same direction, thickness _h_ and shape factor _SF_;\n(D)\
  \ model height was projected from tumour base (green line), parallel to the thickness vector (dashed\
  \ red line); \n(E) variations of the standard tumour model (red line) with added thickness (yellow line)\
  \ and expanded tumour base (orange line) were produced as well.\n\n## Requirements  \nAll scripts have\
  \ been tested in Python 3.12.7. To run the scripts, the following packages are used:\n\n- `NumPy` (version\
  \ 1.26.4)\n- `Scipy` (version 1.13.1)\n- `Pandas` (version 2.2.2)\n- `Matplotlib` (version 3.9.2)\n\
  - `Trimesh` (version 4.5.3)\n- `Alphashape` (version 1.3.1)\n- `Pymeshfix` (version 0.17.0)\n- `Manifold3d`\
  \ (version 3.0.1)\n- `Shapely` (version 2.0.6)\n- `Sklearn` (version 1.5.1)\n- `tqdm`\n\n## Example\
  \  \nAn [jupyter notebook example](Example.ipynb), which generates tumour models with different shape\
  \ factors, is provided. This example generates tumour models for the tumour as delineated below (Figure\
  \ 2).\n\n![Example tumour delineation](.github/assets/exampledelineation.png)\n\n**Figure 2:** The example\
  \ tumour was delineation on a 3D contrast-enhanced [T1-weighted MRI-scan](https://mreye.nl/protocols/mri_globe/).\n\
  \n## Warranty and liability\n\nThe code is provided as is, without any warranty. It is solely intended\
  \ for research purposes. \nNo warranty is given and no rights can be derived from it, as is also stated\
  \ in the [MIT license](LICENSE).\n\n\n## Contact  \nFeel free to contact us for any inquiries:\n\n-\
  \ L. Klaassen ([l.klaassen@lumc.nl](mailto:l.klaassen@lumc.nl))\n- J.W.M. Beenakker ([jwb@mreye.nl](mailto:jwb@mreye.nl))"

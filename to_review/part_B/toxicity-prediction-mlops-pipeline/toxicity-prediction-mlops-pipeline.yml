  \        <li><a href=\"#components\">Components</a></li>\n        <li><a href=\"#vertex_ai_pipeline\"\
  >Vertex AI Pipeline</a></li>\n      </ul>\n    <li><a href=\"#GCP Architecture\">CP Architecture</a></li>\n\
  \    <li><a href=\"#authors\">Authors</a></li>\n  </ol>\n</details>\n\n## About The Project\nIn today's\
  \ digital era, ensuring our messages don't unintentionally harm or offend is crucial.  \nOur app predicts\
  \ the toxicity of your messages across six categories:  \n```[Toxic, Severe toxic, Obscene, Insult,\
  \ Identity hate, Threat]```  \nUsing a multi-label chaining classifier, it assesses each message and\
  \ scores them for potential harm.Built with modularity in mind, each model component is containerized\
  \ using Docker. Our CI/CD process guarantees up-to-date models, automatically retraining and deploying\
  \ them when code or data changes.  \nEnsure your messages are safe before you hit _send_!\n### Built\
  \ With\n[![Python 3.10](https://img.shields.io/badge/Python-3.10-3776AB)](https://www.python.org/downloads/)\n\
  ## Project Structure\n```angular2html\n├───ci_cd_pipelines\n│   ├───components_builder\n│   ├───ml_pipeline_executor\n\
  │   └───serving_deployment\n├───components\n│   ├───toxic-data-cleaner\n│   ├───toxic-data-ingestor\n\
  │   ├───toxic-multilabel-trainer\n│   ├───toxic-prediction-ui\n│   ├───toxic-predictor\n│   └───toxic-train-test-split\n\
  └───vertex_ai_pipeline\n```\n### CI/CD Pipelines\n- **Component Builder:** Automates the building of\
  \ Docker images from each component's source code and pushes them to the Google Cloud Image Registry.\n\
  - **ML Pipeline Executor:** Orchestrates the execution of the ML pipeline within Vertex AI using individual\
  \ components.\n- **Serving Component Deployer:** Deploys three APIs - Cleaning, Prediction, and UI.\
  \ Uses URL from previous steps to interlink the services.  \n_Triggering Mechanism_: A push within the\
  \ components folder of the GitHub repo triggers the Component Builder. This, in turn, initiates the\
  \ ML Pipeline Executor, which then triggers the Deployment Pipeline.\n\n### ML Components\n- **toxic-data-ingestor**:\
  \ Fetches data from Google Cloud Storage Databucket.\n- **toxic-data-cleaner**: Processes and normalizes\
  \ raw data for better model outcomes.\n- **toxic-train-test-split**: Divides the cleaned dataset into\
  \ training and test samples.\n- **toxic-multilabel-trainer**: Consumes the cleaned data, vectorizes\
  \ text, trains models for each toxicity category, and integrates the new models into the prediction\
  \ API.\n- **toxic-predictor**: Employs the trained models to determine toxicity labels for the test\
  \ dataset.\n\n### Vertex AI Pipeline\nContains a notebook that is used to generate a ```.yaml``` pipeline\
  \ using Kubeflow components.  \nThis pipeline leverages the individual ML components described above\
  \ to create a seamless and automated ML workflow.\n\n## GCP Architecture\n![image](https://github.com/RomanNekrasov/DataEngineering/assets/33453661/247c940f-e435-4d91-88c6-5d2031c7b7d5)\n\
  \n## Authors\n- Andy Huang\n- Huub van de Voort \n- Oumaima Lemhour\n- Roman Nekrasov\n- Tom Teurlings\n"

readme_excerpt: 'When you start this program and load an RTplan, it automatically creates and saves an
  Excel file.


  The contents of the Excel file are

  plan name, beam set name, beam name, gantry angle for each segment, and the corresponding MLC position.


  Tested at Raystation and Monaco.


  relatively paper - https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0332190


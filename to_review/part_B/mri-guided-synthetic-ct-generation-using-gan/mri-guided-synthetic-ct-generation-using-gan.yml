readme_excerpt: '# MRI-Guided-Synthetic-CT-Generation-using-GAN



  # Motivation

  CT scans expose patients to ionizing radiation and are often required alongside MRI for structural information.

  This project aims to generate CT-equivalent images directly from MRI using deep learning, reducing radiation
  exposure while retaining clinically useful anatomical detail.


  # Dataset Overview

  The dataset consists of paired 2D axial CT, T1-weighted MRI, and T2-weighted MRI slices collected from
  18 patients, with 389 slices per modality (total 1,167 slices). All images are spatially aligned and
  taken from the same anatomical locations per patient.

  It includes both raw DICOM files and preprocessed paired PNG images, enabling direct use for cross-modal
  learning. The data covers brain (9 patients), abdomen (8), and neck (1) regions, with slice counts ranging
  from 27 to 147 per patient, providing anatomical and volumetric diversity.

  Patient ages range from <2 to 70 years. The dataset is fully anonymized, ethically approved, and shared
  in compliance with international medical research standards, making it suitable for open research use.


  # Architecture

  The system follows a pix2pix GAN framework:

  Generator: U-Net encoder–decoder with skip connections for MRI → CT translation

  Discriminator: PatchGAN conditioned on MRI and real/generated CT

  Loss Functions: LSGAN loss for stability + L1 loss for pixel-level accuracy


  # Tech Stack

  Language: Python

  Framework: PyTorch

  Models: pix2pix, U-Net, PatchGAN

  Data: Paired T1/T2 MRI and CT (DICOM + PNG)

  Training: GPU acceleration, DataLoader, batching, shuffling


  # What I Implemented

  End-to-end MRI → sCT training pipeline

  Data preprocessing (resize, normalization, train–test split)

  GAN training with paired cross-modal supervision

  Quantitative evaluation using PSNR, SSIM, MAE

  Visualization of generated vs ground-truth CT slices


  # Summary

  The model successfully learns MRI-to-CT translation, achieving PSNR 20.41, SSIM 0.715, MAE 0.080 within
  60 epochs.

  Results demonstrate accurate bone boundary reconstruction and soft-tissue consistency, showing potential
  for CT-free diagnosis and treatment planning.

  '

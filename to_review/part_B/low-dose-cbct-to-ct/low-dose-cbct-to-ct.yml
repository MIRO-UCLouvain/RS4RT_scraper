readme_excerpt: "# CBCT-to-CT cycleGAN\n\nThis PyTorch implementation is adapted from the original cycleGAN\
  \ open source for the purpose of maping low dose CBCT images into CT images. If you would like to optimize\
  \ from the original hyperparameters, check out the original cycleGAN at https://github.com/junyanz/pytorch-CycleGAN-and-pix2pix\n\
  \n## Getting started\n\n```\ngit clone https://github.com/ivychanyc/low-dose-cbct-to-ct/\ncd CBCT-to-CT_cycleGAN\n\
  ```\n\n## Docker\n\nIf connected with the research server sith SSH, we recommend using MONAI container\
  \ for this project\n\n`docker run --gpus all -v /home/your_user_name_here/your_folder_here:/data -ti\
  \ projectmonai/monai:latest`\n\nFor example, we can run docker container in the server:\n`docker run\
  \ --gpus all --shm-size 40G -p 8028:8097 -p 8026:8888 -p 8830:6006 -v /CBCT_to_CT_cycleGAN/:/data --rm\
  \ -ti projectmonai/monai:0.1.0`\n\nOr you can also run in the local server, and install PyTorch and\
  \ other dependencies: \n`pip install -r requirements.txt`\n\n## Data\nData should be placed in folders\
  \ in the following path:\n```\ndata/datasets/trainA\ndata/datasets/trainB\ndata/datasets/testA\ndata/datasets/testB\n\
  ```\n\n## Pre-processing\nIn CT_images_pre-processing.ipynb, we resampled CT images into CBCT image\
  \ grid and store all axial slices into 16-bit PNG images.\n\n## Run Visdom server for training monitoring\n\
  `python -m visdom.server`\n\n## Train\nAn example command to run train.py with hyperparameters, \nNote:\
  \ the container is /data\n\n`python /data/train.py --dataroot /data/data/datasets/CBCT2CT/ --name model_01\
  \ --gpu_ids 1 `\n\n## Test\nAn example command to run test.py with hyperparameters, \nNote: specify\
  \ the number of epoch, number testing slices and a folder path for the converted images\n\n`python /data/test.py\
  \ --dataroot /data/data/datasets/CBCT2CT/ --name model_01 --gpu_ids 1 --epoch 250 --num_test 5850 --results_dir\
  \ /data/results_train`\n\n## Evaluation\nMean Error (ME) and Mean Absolute Error (MAE) can be used to\
  \ evaluate the synthetic CT\n\ncycleGAN-analysis.ipynb\nThis evaluation code is intended to choose the\
  \ best epoch, one can use 3 validation data to ensemble every 10th epoch of the models.\n\ncycleGAN-analysis-histogramMAEME.ipynb\
  \  \nThis is to plot different ME and MAE of individual testing datasets.\n\n\n\n\n\n\n\n\n\n\n\n"

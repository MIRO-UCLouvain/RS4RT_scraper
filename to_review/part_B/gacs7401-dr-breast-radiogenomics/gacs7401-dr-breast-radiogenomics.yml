readme_excerpt: "# Radiogenomic Pipeline for Breast Cancer Analysis and AI-Assisted Reporting\n\n## Overview\n\
  This project presents a modality-aware radiogenomic pipeline for breast cancer analysis, integrating\
  \ imaging, multi-omics data, and biomedical knowledge to generate structured, AI-assisted case reports.\n\
  \nThe system is designed to flexibly adapt to available data modalities (imaging, molecular, clinical)\
  \ and combines machine learning, retrieval-augmented generation (RAG), and large language models (LLMs)\
  \ to produce interpretable, radiology-style outputs.\n\n---\n\n## Key Features\n\n- **Modality-aware\
  \ pipeline**\n  - Automatically adapts to available patient data (imaging / omics / clinical)\n  \n\
  - **Tumor morphology prediction**\n  - Predicts tumor shape (Irregular vs. Round–Oval) using multi-omic\
  \ features\n  \n- **Multi-omics modeling**\n  - Integrates gene expression and copy number alteration\
  \ (CNA) data\n  - Best model: Random Forest with combined features\n\n- **Medical image processing**\n\
  \  - DICOM → PNG conversion\n  - Tumor segmentation using MedSAM\n  - Shape extraction from segmentation\n\
  \n- **Hybrid knowledge retrieval**\n  - Local RAG corpus (~100 curated biomedical papers)\n  - Additional\
  \ high-authority sources:\n    - WHO Breast Cancer Fact Sheet\n    - ACR BI-RADS guideline\n    - ESMO\
  \ Clinical Practice Guideline\n  - Optional online PubMed retrieval\n\n- **AI-assisted report generation**\n\
  \  - Structured prompt construction\n  - LLM-based generation (Google Gemini)\n  - Radiology-style markdown\
  \ reports\n\n---\n\n## Project Structure\n\nDR/\n│\n├── step0_prepare_case.py\n├── step1_dicom_to_png.py\n\
  ├── step2_medsam_segmentation.py\n├── step4_prepare_omics_and_merge.py\n├── step5_molecular_model_and_predict.py\n\
  ├── step6_deviation_summary.py\n├── step7_build_rag_corpus.py\n├── step7_literature_retrieval.py\n├──\
  \ step8_build_prompt.py\n├── step9_run_agent.py\n├── step10_render_report_markdown.py\n│\n├── config.py\n\
  ├── models/                # (ignored)\n├── data/                  # (ignored)\n├── outputs/\n│   └──\
  \ unified/reports/   # generated reports\n│\n└── README.md\n\n---\n\n## Workflow\n\n1. **Input**\n \
  \  - DICOM image\n   - Molecular data (GE + CNA)\n   - Clinical metadata\n\n2. **Imaging branch**\n\
  \   - Convert DICOM → PNG\n   - MedSAM segmentation\n   - Tumor shape extraction\n\n3. **Molecular branch**\n\
  \   - Feature selection (Top-200 genes)\n   - Model training & prediction\n   - Patient-specific deviation\
  \ analysis\n\n4. **Knowledge retrieval**\n   - Local RAG corpus (embedding-based retrieval)\n   - Optional\
  \ online PubMed retrieval\n\n5. **LLM report generation**\n   - Structured prompt construction\n   -\
  \ Markdown report output\n\n---\n\n## Example Output\n\nThe system generates a structured report including:\n\
  \n- Clinical Context  \n- Tumor Morphology and Shape Interpretation  \n- Molecular Interpretation  \n\
  - Literature Context  \n- Suggested Next Analytical Steps  \n- Limitations and Uncertainty  \n\n---\n"

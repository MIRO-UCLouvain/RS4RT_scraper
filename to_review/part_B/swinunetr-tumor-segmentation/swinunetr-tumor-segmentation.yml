readme_excerpt: "# SwinUNETR-Tumor-Segmentation\n\n## Setup Instructions\n\n1. Clone the repository:\n\
  \   git clone <repo-link>\n\n2. Navigate to project:\n   cd ANEES_HONOURS\n\n3. Create virtual environment:\n\
  \   python -m venv tumor_env\n\n4. Activate environment:\n   Windows:\n   tumor_env\\Scripts\\activate\n\
  \n   Mac/Linux:\n   source tumor_env/bin/activate\n\n5. Install dependencies:\n   pip install -r requirements.txt\n\
  \n6. Run the application:\n   python app.py\n\n\n## **Automated Pituitary Tumor Segmentation using Hybrid\
  \ Transformer-CNN Models**.\n\nPituitary tumors can be challenging to diagnose and delineate accurately\
  \ from MRI scans. To support AI-assisted medical imaging, our team developed and evaluated hybrid deep\
  \ learning architectures that combine the strengths of **Transformers** and **Convolutional Neural Networks\
  \ (CNNs)** for automated tumor segmentation.\n\n\U0001F50D **What we explored**\n\n• Swin UNETR architecture\n\
  • Custom Swin V-Net architecture\n• Automated segmentation of pituitary tumors from 2D MRI scans\n•\
  \ Comparative performance analysis on the BRISC 2025 MRI dataset\n\n\U0001F4CA **Key Results**\n\n**Swin\
  \ UNETR**\n\n✅ Dice Score: **0.8349**\n✅ Validation Accuracy: **99.5%**\n✅ Precision: **0.82**\n✅ Recall:\
  \ **0.85**\n✅ F1-Score: **0.835**\n✅ ROC-AUC: **0.96**\n\n**Custom Swin V-Net**\n\n✅ Dice Score: **0.8153**\n\
  ✅ Validation Accuracy: **98.0%**\n✅ Precision: **0.80**\n✅ Recall: **0.83**\n✅ F1-Score: **0.815**\n\
  ✅ ROC-AUC: **0.97**\n\nThese results demonstrate the potential of hybrid Transformer-CNN architectures\
  \ for accurate and reliable MRI-based tumor segmentation, contributing to the advancement of AI-driven\
  \ healthcare solutions.\n"

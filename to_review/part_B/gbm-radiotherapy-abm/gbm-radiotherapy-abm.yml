readme_excerpt: "# GBM_Radiotherapy_ABM\n\n**Agent-Based Modelling of Heterogeneous Glioblastoma Radiotherapy\
  \ Response — Extending a HAL-Based Simulation with Clonal Heterogeneity and Spatially Fractionated Radiation**\n\
  \nThis repository is the official implementation for **Nafisa Maliat's BSc Computer Science Final Year\
  \ Dissertation** at the University of Roehampton (2025–2026).\n\n---\n\n## What is this project?\n\n\
  Glioblastoma multiforme (GBM) is the most aggressive primary brain tumour in adults, with a median survival\
  \ of approximately 15 months despite maximal treatment. A core reason for this poor outcome is **intratumour\
  \ heterogeneity**: GBM contains subpopulations of cells that differ in growth rate, radiation sensitivity,\
  \ and immune evasion capacity, so a single radiotherapy strategy is unlikely to control all subpopulations\
  \ at once.\n\nThis project is an **agent-based model (ABM)** that simulates how a heterogeneous GBM\
  \ tumour responds to different radiotherapy strategies — Broad Beam (BB), Microbeam Radiation Therapy\
  \ (MRT), and Minibeam Therapy (MB). Each tumour cell is an autonomous agent on a 2D lattice. Cells divide,\
  \ die, are killed by lymphocytes, or are damaged by radiation according to biologically informed rules.\
  \ Population-level behaviour — clonal selection, immune dynamics, treatment response — emerges from\
  \ these local interactions.\n\nThe project extends a HAL-based GBM ABM originally written by **Tanaya\
  \ Bowade (MSc, University of Roehampton, 2024)**. The inherited model treated the tumour as a single\
  \ homogeneous population. This dissertation adds three tumour subclones with distinct phenotypes, a\
  \ more biologically faithful Spatially Fractionated Radiation Therapy (SFRT) module, and a fully reproducible\
  \ batch simulation pipeline.\n\n---\n\n## Research question\n\n> *How does explicit clonal heterogeneity\
  \ affect simulated tumour response to spatially fractionated radiotherapy, and do SFRT approaches demonstrate\
  \ differential advantages when the tumour contains resistant subpopulations?*\n\n---\n\n## What does\
  \ it do?\n\nThe simulation runs a 100×100 2D lattice for 540 timesteps (each step represents ~1 biological\
  \ day). At every step:\n\n1. **Tumour cells** decide their fate (radiation death, immune death, division,\
  \ or quiescence) by drawing a single random number against cumulative probability thresholds derived\
  \ from the Linear-Quadratic radiobiology model and the local immune response.\n2. **Triggering cells**\
  \ (antigen-presenting cells, APCs) are activated by radiation-damaged tumour debris and recruit lymphocytes.\n\
  3. **Lymphocytes** infiltrate the tumour at a baseline rate plus a radiation-amplified rate, kill tumour\
  \ cells they neighbour, and decay over time.\n4. **Radiation** is applied at timestep 200 (volume-matched\
  \ to Romano et al.'s Day 12 in vivo treatment point) according to the chosen scenario:\n   - **Broad\
  \ Beam:** uniform dose over the whole grid.\n   - **MRT/MB:** spatial peaks (small/large radius beam\
  \ circles) with a low valley dose between them; lymphocytes in valley regions are spared.\n5. **Three\
  \ tumour subclones** are tracked independently:\n   - **Clone 0 (Baseline):** standard parameters.\n\
  \   - **Clone 1 (Proliferative):** higher division rate (1.1× growth multiplier).\n   - **Clone 2 (Invasive/Resistant):**\
  \ more radiation-resistant (0.4× radiosensitivity) and more immune-evasive (0.3× immune kill).\n\nOutputs\
  \ include per-timestep CSV files of cell counts (per population and per clone), MP4 videos of the simulation\
  \ grid, and Python analysis notebooks that compute tumour growth slopes and compare them against the\
  \ published in vivo data of Romano et al. (2021).\n\n---\n\n## How does it work? — Architecture\n\n\
  The simulation is built on top of the **HAL (Hybrid Automata Library)** framework. Cells are agents\
  \ on a 2D grid; the grid manages stepping and visualisation; analysis is performed in Python notebooks\
  \ against the CSV outputs.\n\n```\n                       ┌────────────────────┐\n                 \
  \      │  BatchRunner.java  │  ← drives 14 scenarios × 10 trials\n                       └─────────┬──────────┘\n\
  \                                 │\n                       ┌─────────▼──────────┐\n               \
  \        │     Main.java      │  ← orchestrates one simulation\n                       └─────────┬──────────┘\n\
  \                                 │\n                       ┌─────────▼──────────┐\n               \
  \        │ OnLattice2DGrid    │  ← grid, stepping, neighbours\n                       └─────────┬──────────┘\n\
  \                                 │\n   ┌─────────────┬───────────────┼───────────────┬──────────────┐\n\
  \   ▼             ▼               ▼               ▼              ▼\nTumorCells  Lymphocytes  TriggeringCells\
  \  DoomedCells   RadiationManager\n   (×3 clones)                                         (BB / MRT\
  \ / MB)\n                                 │\n                                 ▼\n                  \
  \        CellFunctions\n              (probability calc, fate, immune response)\n                  \
  \               │\n                                 ▼\n                          CSVWriter → outputs/\n\
  ```\n\n### Key files\n\n| File | Role |\n|------|------|\n| `OnLattice2DCells/Main.java` | Orchestrates\
  \ one full simulation run (initialisation, stepping, radiation, output) |\n| `OnLattice2DCells/BatchRunner.java`\
  \ | Runs all 14 scenarios × 10 trials in one process, with per-trial state reset |\n| `OnLattice2DCells/OnLattice2DGrid.java`\
  \ | The HAL grid; manages cell positions and timestep updates |\n| `OnLattice2DCells/CellFunctions.java`\
  \ | Per-cell fate decisions, probability budgets, immune response calculation |\n| `OnLattice2DCells/TumorCells.java`\
  \ | Tumour cell agent and per-clone tracking arrays |\n| `OnLattice2DCells/Lymphocytes.java` | Lymphocyte\
  \ agent (immune effector cells) |\n| `OnLattice2DCells/TriggeringCells.java` | Antigen-presenting cell\
  \ agent |\n| `OnLattice2DCells/DoomedCells.java` | Cells flagged for death (radiation- or immune-induced)\
  \ |\n| `OnLattice2DCells/RadiationManager.java` | Applies BB/MRT/MB radiation patterns, valley dose\
  \ mechanism |\n| `OnLattice2DCells/ScenarioParameters.java` | Per-scenario configuration (dose, beam\
  \ radius, immune suppression) |\n| `OnLattice2DCells/FigParameters.java` | Per-figure tumour biology\
  \ parameters and clone multipliers |\n| `OnLattice2DCells/SimulationParameters.java` | Cross-scenario\
  \ dose and beam parameters |\n| `OnLattice2DCells/CSVWriter.java` | Per-timestep output of cell counts\
  \ and probabilities |\n| `GBM_SimulationResults.ipynb` | Python analysis: tumour volume curves, slope\
  \ comparison, clone composition |\n| `Notebook_BugFix_Comparison.ipynb` | Before/after bug fix visualisations\
  \ |\n\n---\n\n## Scenarios\n\nAll 14 scenarios share identical tumour biology parameters; only the radiation\
  \ modality and dose differ.\n\n| Scenario | Radiation Type | Peak Dose (Gy) | Beam Radius | Valley:Peak\
  \ Ratio |\n|----------|---------------|----------------|-------------|-------------------|\n| Control\
  \ | None | 0 | — | — |\n| BB5 | Broad Beam | 5 | Full grid | — |\n| BB10 | Broad Beam | 10 | Full grid\
  \ | — |\n| BB15 | Broad Beam | 15 | Full grid | — |\n| MRT200 | Microbeam | 200 | 5 | 1.5 % |\n| MRT400\
  \ | Microbeam | 400 | 5 | 1.5 % |\n| MRT600 | Microbeam | 600 | 5 | 1.5 % |\n| MB180 | Minibeam | 180\
  \ | 10 | 3 % |\n| MB350 | Minibeam | 350 | 10 | 3 % |\n| Pred_MRT180 | Microbeam (predictive) | 180\
  \ | 5 | 1.5 % |\n| Pred_MRT350 | Microbeam (predictive) | 350 | 5 | 1.5 % |\n| Pred_MB200 | Minibeam\
  \ (predictive) | 200 | 10 | 3 % |\n| Pred_MB400 | Minibeam (predictive) | 400 | 10 | 3 % |\n| Pred_MB600\
  \ | Minibeam (predictive) | 600 | 10 | 3 % |\n\n---\n\n## What was changed from the inherited code?\n\
  \nThis dissertation's contributions on top of the `tanaya-baseline` tag are:\n\n**Bug fixes (25 across\
  \ 8 categories, 23 inherited + 1 introduced):**\n- Probability and decision logic — single random draw,\
  \ clamped probability budget\n- Immune system — bounded immune response, division-by-zero guards, removed\
  \ APC gate on lymphocyte recruitment\n- Radiation mechanics — spatial threshold lowered from 0.8 → 0.01\
  \ so peripheral SFRT beams fire correctly\n- Batch infrastructure — `resetStaticState()` between trials,\
  \ `batchMode` flag for headless runs\n- Initialisation, CSV output, and performance fixes\n\n**New features:**\n\
  - **Clonal heterogeneity:** three tumour subclones with phenotype-specific division, radiosensitivity,\
  \ and immune evasion parameters\n- **Valley dose mechanism:** SFRT cells outside beam peaks receive\
  \ a fraction of the peak dose (1.5 % MRT, 3 % MB), modelling photon scatter; lymphocytes in valley regions\
  \ are spared\n- **Post-radiation immune signal decay:** sustains immune activation for 50–100 timesteps\
  \ after radiation, modelling DAMP/cytokine persistence\n- **Persistent sublethal radiation damage:**\
  \ surviving tumour cells carry residual DNA damage that decays over time and dilutes through division\n\
  \nA full catalogue of every bug fix with before/after code is provided in `BugFixes_Comprehensive.pdf`\
  \ (in the parent folder of this repo, alongside the dissertation report).\n\n---\n\n## Validation\n\n\
  The model is validated against the in vivo preclinical data of **Romano et al. (2021)** — a Fischer\
  \ rat 9L gliosarcoma model comparing BBT, MRT, and MB at Day 12 post-implantation.\n\n**Expected ordering**\
  \ (from Romano et al.): Control > BB > MB > MRT (greatest tumour suppression).\n\n**Observed simulation\
  \ ordering:** matches across all 140 trials. Tumour growth slopes follow the expected sequence, with\
  \ higher SFRT doses producing greater suppression and better immune preservation.\n\nThe notebook `GBM_SimulationResults.ipynb`\
  \ reproduces the validation figures: per-scenario volume curves, normalised slope comparison vs. in\
  \ vivo, and per-clone composition shifts after treatment.\n\n---\n\n## Getting started\n\n### Requirements\n\
  \n- **Java 11+** (Java 17 recommended)\n- **IntelliJ IDEA Community** (or any Java IDE / `javac`)\n\
  - **Python 3.8+** with `pandas`, `numpy`, `matplotlib`, `scipy`, `scikit-learn`\n- **ffmpeg** (optional\
  \ — for MP4 video output of simulations)\n\n### Clone\n\n```bash\ngit clone https://github.com/NafisaMaliat/GBM_Radiotherapy_ABM.git\n\
  cd GBM_Radiotherapy_ABM\n```\n\n### Run a single scenario\n\nOpen the project in IntelliJ, then run\
  \ `OnLattice2DCells.Main`. The default scenario (`BB15`) is set at the top of `Main.java`; change it\
  \ or pass a scenario name as the program argument.\n\n### Run all 140 trials\n\nRun `OnLattice2DCells.BatchRunner`\
  \ from IntelliJ. This executes all 14 scenarios × 10 trials in one process, with full static-state reset\
  \ between trials. CSV outputs are written to `HALModeling2024Outs/Scenario<NAME>/`.\n\n### Analyse results\n\
  \nOpen `GBM_SimulationResults.ipynb` in Jupyter. The notebook reads the CSVs from `HALModeling2024Outs/`,\
  \ plots tumour volume trajectories per scenario, computes growth slopes, and compares against Romano\
  \ et al.'s in vivo data.\n\n---\n\n## Project provenance\n\n- **Predecessor:** Tanaya Bowade, *Agent-Based\
  \ Modelling of Glioblastoma Radiotherapy Response* (MSc dissertation, University of Roehampton, 2024).\
  \ The commit tagged `tanaya-baseline` marks the starting point of this project.\n- **Original framework:**\
  \ Hannah G. Simon, [HALModeling2024](https://github.com/hannahgsimon/HALModeling2024).\n- **Empirical\
  \ reference data:** Romano et al. (2021); Cho et al. (2023).\n- **This work:** Nafisa Maliat (BSc Computer\
  \ Science, University of Roehampton, 2025–2026) - supervisor: Dr. Arturo Araujo\n\n---\n\n## Citation\n\
  \nIf you use this code, please cite:\n\n- **Maliat, N. (2026).** *Agent-Based Modelling of Heterogeneous\
  \ Glioblastoma Radiotherapy Response: Extending a HAL-Based Simulation with Clonal Heterogeneity and\
  \ Spatially Fractionated Radiation* (BSc dissertation). University of Roehampton. https://github.com/NafisaMaliat/GBM_Radiotherapy_ABM\n\
  - **Bowade, T. (2024).** *Agent-Based Modelling of Glioblastoma Radiotherapy Response* (MSc dissertation,\
  \ predecessor project). University of Roehampton. https://github.com/tanayab/ABM_GliobMul\n- **Cho,\
  \ Y.-B., Yoon, N., Suh, J.H., Scott, J.G. (2023).** Radio-immune response modelling for spatiall"

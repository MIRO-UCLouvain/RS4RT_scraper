  - Web-based interface (FastAPI/Streamlit) for interactive MRI upload and instant prediction

  - Extending classification beyond binary tumor/no-tumor to multi-class (glioma, meningioma, pituitary
  tumor)

  - Cloud deployment for broader clinical accessibility



readme_excerpt: "# 3D CBCT Dental Segmentation and Visualization\n\n## Overview\n\nThis project implements\
  \ an AI-powered 3D CBCT dental segmentation and visualization pipeline using pretrained nnU-Net DentalSegmentator\
  \ weights. The system processes volumetric medical scans and generates tooth segmentation, jaw separation,\
  \ and 3D visualizations using a Flask backend and React frontend.\n\n---\n\n# Features\n\n- Support\
  \ for:\n  - `.nii`\n  - `.nii.gz`\n  - `.mha`\n  - DICOM formats\n\n- Automatic:\n  - Tooth segmentation\n\
  \  - Jaw separation\n  - Basic FDI tooth numbering\n\n- 3D visualization and mesh generation\n\n- Flask\
  \ backend + React frontend integration\n\n---\n\n# Technologies Used\n\n## Backend\n- Flask\n- PyTorch\n\
  - MONAI\n- nnU-Net\n- SimpleITK\n\n## Frontend\n- React\n- Tailwind CSS\n- Vite\n\n## Visualization\n\
  - PyVista\n- VTK\n- Three.js\n\n---\n\n# Project Structure\n\n```text\ncbct_dental_platform/\n│\n├──\
  \ backend/\n│   ├── app/\n│   ├── storage/\n│   ├── venv/\n│   ├── requirements.txt\n│   └── run.py\n\
  │\n├── frontend/\n│   ├── node_modules/\n│   ├── src/\n│   ├── package.json\n│   └── vite.config.js\n\
  │\n├── Dataset112_DentalSegmentator_v100/\n├── pcasl.nii\n├── spmMotor.nii\n└── INSTALL.txt\n```\n\n\
  ---\n\n# How to Run\n\n## Backend\n\n```bash\ncd backend\npip install -r requirements.txt\npython run.py\n\
  ```\n\nBackend runs at:\n\n```text\nhttp://127.0.0.1:5000\n```\n\n---\n\n## Frontend\n\n```bash\ncd\
  \ frontend\nnpm install\nnpm run dev\n```\n\nFrontend runs at:\n\n```text\nhttp://localhost:5173\n```\n\
  \n---\n\n# Model Weights\n\nPretrained DentalSegmentator nnU-Net weights are stored inside:\n\n```text\n\
  Dataset112_DentalSegmentator_v100/\n```\n\n---\n\n# Test Files\n\nSample NIfTI files used for testing:\n\
  \n```text\npcasl.nii\nspmMotor.nii\n```\n\n---\n\n# Outputs\n\nThe system generates:\n- Segmentation\
  \ masks (`.nii.gz`)\n- 3D meshes (`.obj`, `.stl`)\n- Metadata (`.json`)\n\n---\n\n# Dataset Selection\
  \ Note\n\nThe ToothFairy / ToothFairy2 dataset was initially considered for this project because of\
  \ its relevance to CBCT dental segmentation tasks. However, during development, the dataset could not\
  \ be fully utilized due to limited public accessibility, download constraints, and large-scale data\
  \ handling requirements.\n\nTo ensure successful implementation within the project timeline, the pipeline\
  \ was developed using pretrained DentalSegmentator nnU-Net weights along with sample NIfTI medical volumes\
  \ for validating preprocessing, inference, and visualization workflows.\n\nThe implemented system architecture\
  \ remains fully compatible with real CBCT datasets, including ToothFairy / ToothFairy2, and can be extended\
  \ in future work for full-scale training and fine-tuning.\n\n---\n\n# Notes\n\n- The project uses pretrained\
  \ nnU-Net DentalSegmentator weights.\n- Testing was performed using sample NIfTI medical volumes for\
  \ validating the complete pipeline.\n- FDI numbering is currently based on geometric ordering and is\
  \ not clinically validated.\n\n---\n\n# Future Improvements\n\n- Clinical-grade FDI numbering\n- Advanced\
  \ pathology classification\n- Improved DICOM orientation handling\n- Docker deployment support\n\n---\n\
  \n# Author\n\n3D CBCT Dental Segmentation and Visualization Pipeline\n"

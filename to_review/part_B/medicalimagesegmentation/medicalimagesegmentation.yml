readme_excerpt: '# Medical Image Segmentation


  U-Net and Residual U-Net models for brain tumor segmentation from MRI scans, trained on the [LGG Segmentation
  Dataset](https://www.kaggle.com/datasets/mateuszbuda/lgg-mri-segmentation). Achieves **91.7% Dice Similarity
  Coefficient** on the validation set.


  ## Architecture


  Two model variants implemented from scratch in PyTorch:


  - **U-Net** — Standard encoder-decoder with skip connections, 4 downsampling stages, BatchNorm + ReLU
  activations

  - **Residual U-Net** — Same structure with residual (identity shortcut) connections in each block for
  improved gradient flow


  Both output a single-channel sigmoid mask for binary segmentation.


  ## Loss Functions


  Multiple loss functions implemented and compared:


  | Loss | Description |

  |------|-------------|

  | Dice Loss | Directly optimizes the DSC metric |

  | Dice + BCE | Hybrid combining pixel-wise BCE with Dice |

  | Tversky Loss | Generalized Dice with tunable FP/FN weighting |

  | Focal Loss | Down-weights easy examples to focus on hard pixels |


  ## Dataset & Preprocessing


  - **Source**: LGG MRI Segmentation (110 patients, FLAIR MRI volumes)

  - **Pipeline**: Crop to brain region, pad to square, resize to 256x256, per-channel normalization

  - **Sampling**: Weighted slice sampling — slices with more tumor area are sampled more frequently during
  training

  - **Caching**: Preprocessed volumes are pickled to disk for fast reload


  ## Project Structure


  ```

  ├── unet.py          # UNet and UNetResidual model definitions

  ├── dataset.py       # BrainSegmentationDataset with preprocessing pipeline

  ├── loss.py          # Dice, DiceBCE, Tversky, and Focal loss functions

  ├── transform.py     # Data augmentation transforms

  ├── train.ipynb      # Training loop with logging and checkpointing

  ├── inference.ipynb  # Visualization of predictions vs ground truth

  ├── logger.py        # Training metric logger

  └── utils.py         # Crop, pad, resize, normalize utilities

  ```


  ## Results


  | Model | Loss | Optimizer | Dice Score |

  |-------|------|-----------|-----------|

  | U-Net | Dice | Adam | 81.2% |

  | U-Net | Dice + BCE | AdamW | **91.7%** |



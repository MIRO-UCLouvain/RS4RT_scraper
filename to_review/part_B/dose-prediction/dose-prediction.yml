readme_excerpt: "<div align=\"center\">\n\n<samp>\n\n<h1> A Cascade Transformer-based Model for 3D Dose\
  \ Distribution Prediction in Head and Neck Cancer Radiotherapy </h1>\n\n[//]: # (<h4>  </h4>)\n\n</samp>\
  \   \n\n</div> \n\n\n\nWelcome to the GitHub repository for our [research paper](http://iopscience.iop.org/article/10.1088/1361-6560/ad209a),\
  \ \n\"A Cascade Transformer-based Model for 3D Dose Distribution Prediction in Head and Neck Cancer\
  \ Radiotherapy\"! \nThis repository contains the implementation of our novel deep learning approach,\
  \ \nwhich aims to revolutionize the prediction of dose distribution maps in radiation oncology.\n\n\n\
  \n## Introduction\n\n\nOur method comprises two essential sub-networks: OARs segmentation and dose distribution\
  \ prediction. By leveraging the power of deep learning, we aim to enhance the precision and efficiency\
  \ of radiotherapy treatment planning for head and neck cancer patients.\n\n\nThroughout this paper,\
  \ we compare the performance of our proposed model with state-of-the-art deep learning methods. The\
  \ comprehensive evaluation showcases our model's exceptional capabilities, as it consistently outperforms\
  \ other methods in terms of various metrics.\n\n<p align=\"center\">\n  <img src=\"images/method_highlevel.png\"\
  \ width=\"800\"/>\n</p>\n\n### Key Contributions:\n\n\n**1. OAR-TRANSEG**: \n   We proposed a model\
  \ consisting of multi-scale convolutional units and transformer blocks, \n   which can simultaneously\
  \ extract local and global features. The simultaneous extraction of\n   local and global features is\
  \ one of the challenges in deep learning that we tried to address\n   using this approach. This approach\
  \ was used and evaluated for automatic OARs\n   segmentation.\n   <p align=\"center\">\n  <img src=\"\
  images/transeg.png\" width=\"800\"/>\n   </p>\n\n**2. DOSE-PYFER**: \n   We proposed a cascade encoder-decoder\
  \ model, including transformer blocks and multi-\n   scale convolutional units based on a pyramid structure\
  \ to predict dose distribution. The\n   extensive experiments show that the proposed method outperforms\
  \ the winner of the\n   OpenKBP2020 challenge and other previous studies.\n   <p align=\"center\">\n\
  \  <img src=\"images/dosepyfer.png\" width=\"800\"/>\n   </p>\n\n**3. End-to-End Model**:\n   In designing\
  \ the proposed model, we tried to automate the dose distribution prediction as\n   much as possible.\
  \ Therefore, the model can automatically segment OARs by receiving CT\n   images and corresponding PTVs\
  \ of the patient and use the extracted OARs to predict dose\n   distribution.\n\n\n## Citation\n\nIf\
  \ you find our code or paper useful, please cite as:\n\n```bibtex\n@article{dosepyfer2024,\n  title={A\
  \ Cascade Transformer-based Model for 3D Dose Distribution Prediction in Head and Neck Cancer Radiotherapy},\n\
  \  author={Tara Gheshlaghi and Shahabedin Nabavi and Samire Shirzadikia and Mohsen Ebrahimi Moghaddam\
  \ and Nima Rostampour},\n  journal={Physics in Medicine & Biology},\n  year={2024},\n  url={http://iopscience.iop.org/article/10.1088/1361-6560/ad209a}\n\
  }\n```\n"

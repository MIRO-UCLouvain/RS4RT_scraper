readme_excerpt: "# ReRT script\n\n## Adopting ReRT at another institution\n\nReRT is configurable for\
  \ any institution. To set up:\n\n1. Clone this repo.\n2. Copy `Configuration/InstitutionConfig.sample.yaml`\
  \ to\n   `Configuration/InstitutionConfig.local.yaml` and edit the values\n   (institution name, department\
  \ header, output paths). The `.local`\n   file is gitignored.\n3. (Optional) Drop your logo at the `logoPath`\
  \ you specified, or leave\n   `logoPath` empty to skip the logo. A common convention is\n   `Configuration/Logo.local.png`\
  \ — also gitignored.\n4. Review `Configuration/ReRTConfig.yaml` — these are clinical\n   constraint\
  \ sets shipped with the project (Stanford SABR, UMichigan\n   re-irradiation). Add or override constraints\
  \ for your local practice\n   in additional YAML files.\n5. Open `ReRT.sln` in Visual Studio, restore\
  \ NuGet packages, and build\n   against your ESAPI assemblies.\n\nIf `InstitutionConfig.local.yaml`\
  \ is absent, the loader falls back to\n`InstitutionConfig.sample.yaml` so a fresh clone still produces\
  \ a\nworking run (no logo, generic department header, single default output\npath under `C:\\ReRT_Reports`).\n\
  \n## Setup\n\nTo use the script, you must compile it on your system. You should be able to open the\
  \ project with Visual Studio 2022 Community Edition. Open the .sln file.\nThe script was developed for\
  \ Eclipse version 18.1. It may not work with other versions of Eclipse or Varian ESAPI.\n\n1. You will\
  \ need to restore all NuGet packages for compilation. This may require cleaning the solution and restarting.\n\
  2. You may need to relink references to the Varian dlls.\n3. Compile as Release for x64.\n\n## How to\
  \ use the script\n\nBefore your first run:\n\n1. Review `Configuration/ReRTConfig.yaml` in the Configuration\
  \ folder, and add any default assignments of alpha/beta that are appropriate for your institution (see\
  \ the `defaults:` block).\n2. Approve the script in Eclipse (it is a write-enabled script)\n\nReRT offers\
  \ two dose-accumulation methods, selected with the **dose accumulation\nmethod** toggle in the top bar:\n\
  \n- **Rigid registration** — accumulates the spatially-transformed dose from each\n  prior plan into\
  \ an EQD2 (and optionally physical) plan sum.\n- **Conservative max dose** — sums each prior plan's\
  \ own near-max (D0.1cc) EQD2\n  within an anisotropic expansion (in-plane / superior-inferior) around\
  \ a chosen\n  target structure — or over the whole structure in global mode — a conservative\n  worst\
  \ case that assumes the per-plan hotspots coincide. The target is mapped into\n  each plan through the\
  \ registration and the near-max is computed from the plan's\n  dose voxels, with boundary voxels partial-volume\
  \ weighted to track Eclipse's DVH.\n\n**This program comes with absolutely no guarantees of any kind.**\n\
  \n```\nTHE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING\
  \ BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT.\
  \ IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY,\
  \ WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE\
  \ SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\nSOFTWARE.\n```\n\n## LICENSE\n\nPublished under the\
  \ MIT license.\n"

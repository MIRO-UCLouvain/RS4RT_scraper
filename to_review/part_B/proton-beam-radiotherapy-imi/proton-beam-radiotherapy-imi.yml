readme_excerpt: "# Proton Beam Radiotherapy Optimization\n\nWelcome to the Proton Beam Radiotherapy Optimization\
  \ repository.\n\nThis project contains a collection of functions and scripts that have been instrumental\
  \ in research focused on optimizing Bragg peaks for proton beam radiotherapy.\nI have created all this\
  \ work in the Summer of 2022 where I worked in conjunction with Bath Institute of Mathematical Innovation\
  \ as a first year student.\n\n> **Note:** The code in this repository was not developed within a version-controlled\
  \ environment. Consequently, you may find the structure and organization somewhat unrefined. However,\
  \ it contains a substantial and valuable set of functions for proton therapy optimization, and I hope\
  \ you find it useful.\n\n## Repository Structure\n\nThis repository holds a wide range of functions\
  \ and code snippets used in various stages of research. Please be aware that some files may contain\
  \ experimental or legacy code.\n\n### Key Components:\n- **Optimization Functions**: Functions to adjust\
  \ the parameters of Bragg peaks for optimal therapeutic outcomes.\n- **Dose Calculation Algorithms**:\
  \ Methods for calculating dose distributions in proton therapy.\n- **Bragg Peak Analysis Tools**: Code\
  \ for analyzing the characteristics of Bragg peaks, including their shape, energy deposition, and effectiveness.\n\
  - **Helper Functions**: Miscellaneous utility functions that support the core functionality and data\
  \ processing.\n\n## Documentation\n\nDue to the unstructured nature of the repository, there is no unified\
  \ code documentation at this time. However, key functions are documented in individual files, and additional\
  \ details are provided in the accompanying PDF report.\n\n## Research Summary\n\nThis repository supports\
  \ research on optimizing Bragg peaks in proton beam radiotherapy. Optimizing Bragg peaks is crucial\
  \ for achieving precision in radiation therapy, allowing for better targeting of tumors while minimizing\
  \ damage to surrounding healthy tissue. The research encapsulated here explores techniques to maximize\
  \ the therapeutic effectiveness of proton beams.\n\n## Contact\n\nDrop me a message on LinkedIn or email\
  \ if you have any Q's! \n"

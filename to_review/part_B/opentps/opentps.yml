readme_excerpt: "# OpenTPS\n\nOpenTPS is a Python application for treatment planning in proton therapy,\
  \ based on the MCsquare Monte Carlo dose engine.\n\nThe OpenTPS (version 2.0.1) application consists\
  \ of the packages opentps-core (version 2.0.1) and opentps-gui (version 2.0.1) which are also available\
  \ separately.\n\nIf you are using OpenTPS as part of your research, teaching, or other activities, we\
  \ would be grateful if you could star the repository and/or cite our work.\n\nIf you want to cite OpenTPS,\
  \ feel free to cite our white paper accessible [here on arxiv](https://arxiv.org/abs/2303.00365) or\
  \ with the following bibtex reference :\n\n```bibtex\n@misc{wuyckens2023opentps,\ntitle={OpenTPS --\
  \ Open-source treatment planning system for research in proton therapy},\nauthor={S. Wuyckens and D.\
  \ Dasnoy and G. Janssens and V. Hamaide and M. Huet and E. Loÿen and G. Rotsart de Hertaing and B. Macq\
  \ and E. Sterpin and J. A. Lee and K. Souris and S. Deffet},\nyear={2023},\neprint={2303.00365},\narchivePrefix={arXiv},\n\
  primaryClass={physics.med-ph}\n}\n```\n\n# Installing and running OpenTPS as an end user\n\n## Without\
  \ Anaconda (Linux and Windows)\n\n1. Install Python 3.11.\n2. If you don't want to install OpenTPS and\
  \ its dependencies in your global Python environment: Create a virtual environment and activate it before\
  \ going to step 3.\n3. Install the opentps package with pip:\n\n```\n   pip install opentps\n```\n\n\
  3. Run opentps in the command line to see the OpenTPS GUI:\n\n```\n   opentps\n```\n\n## On Windows\
  \ with Anaconda\n\n1. Install the latest version of Anaconda: https://www.anaconda.com/.\n2. In a conda\
  \ prompt, create a new virtual environment with python 3.11 and activate it:\n\n```\n   conda create\
  \ --name OpenTPS python=3.11\n   conda activate OpenTPS\n```\n\n3. Install OpenTPS:\n\n```\n   pip install\
  \ opentps\n```\n\n4. Start it with:\n\n```\n   opentps\n```\n\n# Installing and running OpenTPS as a\
  \ developer\n\n## On Linux\n\n1. Clone the OpenTPS git repository or download the source code.\n2. Run\
  \ the script `install_opentps_linux.sh` to create a virtual environment `OpenTPS_venv` in the _current\
  \ directory_ (!). This will also install python 3.9 and add it to the path of your bash shell.\n3. Run\
  \ the script `start_opentps_linux.sh` in the directory where the `OpenTPS_venv` was created in step\
  \ 2 to start the OpenTPS GUI.\n\n## On Windows (without Anaconda)\n\n1. Clone the OpenTPS git repository\
  \ or download the source code.\n2. Install Python 3.9 and add it to the path in your system environment.\n\
  3. Run the script `install_opentps_venv_windows.sh` to create a virtual environment `OpenTPS_venv` in\
  \ the _current directory_ (!).\n4. Run the script `start_opentps_venv_windows.sh` in the directory where\
  \ the `OpenTPS_venv` was created in step 2 to start the OpenTPS GUI.\n\n## On Windows (with Anaconda)\n\
  \nIf you have Anaconda installed:\n\n1. Open an Anaconda prompt and execute the `install_opentps_anaconda_windows.bat`\
  \ script. This will create an environment named `OpenTPS_venv`.\n2. To launch the OpenTPS application,\
  \ run the `start_opentps_anaconda_windows.bat` script.\n"

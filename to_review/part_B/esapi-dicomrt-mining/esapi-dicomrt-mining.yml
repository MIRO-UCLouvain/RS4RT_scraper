readme_excerpt: "# ESAPI_DICOMrt-Mining\n\n## General ESAPI Guidance\n\nFor current build/runtime notes,\
  \ clinical-safety reminders, stand-alone threading rules, write-enabled script governance, and ESAPI\
  \ 18.x considerations, see [`docs/ESAPI_GENERAL_NOTES.md`](docs/ESAPI_GENERAL_NOTES.md).\n\n![ESAPI_DICOMrt-Mining\
  \ – Excel-driven bulk DICOM export from ARIA via ESAPI & DCMTK](Assets/Banner.png)\n\n**Excel-driven\
  \ bulk DICOM export from Varian ARIA via ESAPI and DCMTK movescu.**\n\n> **Independent project:** This\
  \ is a personal technical example, not an\n> official publication, product, approval, or support service\
  \ of any employer,\n> healthcare provider, university, or vendor. Configuration values are\n> synthetic.\
  \ The software is provided without warranty and requires local\n> licensing, security review, validation,\
  \ and governance before use.\n\nReads a list of patient IDs from an Excel file, connects to the ARIA\
  \ database via ESAPI, and exports any combination of the following modalities per patient using C-MOVE\
  \ (DCMTK `movescu`):\n\n- Planning CT\n- RTSTRUCT\n- RTPLAN\n- RTDOSE\n- Portal dose images (RTIMAGE\
  \ / ACQUIRED_DOSE)\n- CBCT series\n\n---\n\n## Why ESAPI + C\\#?\n\nThe DICOM DB Daemon accepts C-MOVE\
  \ requests keyed by **DICOM UIDs** (SeriesInstanceUID, SOPInstanceUID). The central challenge in bulk\
  \ export is *obtaining* those UIDs for each patient, plan and image.\n\n**ESAPI is the cleanest path\
  \ to those UIDs.** It provides structured, read-only access to the full ARIA object model — patients,\
  \ courses, plans, structure sets, doses, series — without requiring direct SQL access to the ARIA database.\
  \ Querying ARIA SQL directly is technically possible but complex, fragile across ARIA versions, and\
  \ necessary UIDs are in LiveDB where you dont get access from Varian anymore.\n\n> **Note:** ESAPI is\
  \ only required for the UID-lookup step. The actual DICOM transfer goes through the **ARIA DICOM DB\
  \ Daemon** and is completely independent of ESAPI. If you already have UIDs from another source (e.g.\
  \ a DICOM query/retrieve or a custom database export), you can talk to the daemon directly with any\
  \ C-MOVE-capable tool — no ESAPI or C# needed.\n\n---\n\n## Building & Getting Started\n\n### Visual\
  \ Studio\n\nThis is a standalone C# console application compiled with **Visual Studio**. [Visual Studio\
  \ Community Edition](https://visualstudio.microsoft.com/vs/community/) is free for individual developers,\
  \ open-source projects, and academic/research use — check the license terms for your use case.\n\n###\
  \ Standalone script vs. single-file plugin\n\nVarian ESAPI scripts come in two flavours:\n\n| | Single-file\
  \ plugin | Standalone script |\n|---|---|---|\n| Format | `.cs` file, no compilation needed | Compiled\
  \ `.exe` |\n| Context | Runs inside Eclipse, single patient open | Runs independently, batch-processes\
  \ any number of patients |\n| Use case | Interactive tools, quick utilities | **Batch export, data mining\
  \ — this script** |\n\nA single-file plugin example (patient context, no build required) is linked in\
  \ the References (Varian-Wiki). For bulk processing across a patient list, a standalone executable is\
  \ the right approach.\n\n### Quickstart: bootstrapping with the Eclipse Scripting Wizard\n\nThe recommended\
  \ way to get this running at your site:\n\n1. Use the **Eclipse Scripting Wizard** to create a new empty\
  \ standalone project and open VisualStudio. This wizard sets up the correct project structure, target\
  \ framework, and ESAPI references automatically. The full walkthrough is shown in the **Varian API Book,\
  \ Chapter 4** (see References).\n2. Once the empty project is created, **replace the generated `.cs`\
  \ file** with `Mining_ListOfPlans2DICOM.cs` from this repository.\n3. Resolve the EPPlus NuGet reference\
  \ (`Install-Package EPPlus` in the Package Manager Console).\n4. Copy `settings.example.ini` → `settings.ini`\
  \ next to the built `.exe` and fill in your site-specific values.\n\n---\n\n## Prerequisites\n\n| Component\
  \ | Requirement |\n|---|---|\n| .NET Framework | 4.8 |\n| ESAPI | Varian Eclipse/ARIA SDK (`VMS.TPS.Common.Model.API`)\
  \ |\n| ARIA DICOM DB Daemon | configured and reachable (see Setup below) |\n| DCMTK | `movescu.exe`\
  \ – included as `Assets/DCMTK.zip` or install system-wide |\n| EPPlus | `EPPlus.dll` – included in build\
  \ output (NuGet: EPPlus >= 5, NonCommercial) |\n\n> The ESAPI DLLs (`VMS.TPS.Common.Model.API.dll`,\
  \ `VMS.TPS.Common.Model.Types.dll`) must be obtained from your local Eclipse/ARIA installation and are\
  \ **not** part of this repository.\n\n---\n\n## Setup\n\n### 1 – Configure the ARIA DICOM DB Daemon\n\
  \nThe export uses the **ARIA DICOM DB Daemon** as the DICOM communication layer. The daemon exposes\
  \ a C-MOVE SCP; `movescu` sends a C-MOVE request and ARIA delivers the DICOM files to a Storage SCP\
  \ (here: the `ScriptExport` share).\n\nDetailed documentation:\n- **Varian Wiki:** [Scripting the Varian\
  \ DICOM DB Daemon with ESAPI](https://github.com/VarianAPIs/Varian-Code-Samples/wiki/Scripting-the-Varian-DICOM-DB-Daemon-with-ESAPI)\n\
  - **Varian API Book (PDF), Chapter 4:** [varianapis.github.io/VarianApiBook.pdf](https://varianapis.github.io/VarianApiBook.pdf)\n\
  \nA compact step-by-step setup guide is included as `Assets/DICOM_Daemon_Setup_Quick_Guide.docx`.\n\n\
  Required `settings.ini` parameters:\n\n| Parameter | Description |\n|---|---|\n| `AET` | AE Title of\
  \ the local movescu client (must be registered in the daemon as a caller) |\n| `AEC` | AE Title of the\
  \ ARIA DICOM DB Daemon (Called AE, e.g. `DICOM_ESAPI`) |\n| `AEM` | AE Title of the move-destination\
  \ Storage SCP (e.g. `ScriptExport`) |\n| `DICOM_HOST` | IP address or hostname of the ARIA DB server\
  \ |\n| `DICOM_PORT` | Port of the ARIA DICOM Daemon |\n| `ESAPI_IMPORT_BASE` | UNC path of the ScriptExport\
  \ share (e.g. `\\\\ARIASERVER\\DICOM_ESAPI_ScriptExport`) |\n\n> **Alternative communication layers:**\
  \ Any tool that supports C-MOVE-SCU can replace DCMTK, e.g. [fo-dicom](https://github.com/fo-dicom/fo-dicom),\
  \ [pynetdicom](https://github.com/pydicom/pynetdicom), or [dcm4che](https://www.dcm4che.org/). Adapt\
  \ the `RunMoveScu()` method (~line 814) accordingly.\n\n### 2 – Provide DCMTK\n\n**Option A – bundled\
  \ package (recommended):**\n\n```\nExtract  Assets\\DCMTK.zip  →  Assets\\DCMTK\\\n```\n\nResult must\
  \ be `Assets\\DCMTK\\bin\\movescu.exe`. This path is already the first entry in `DCMTK_PATHS`.\n\n**Option\
  \ B – system-wide install:**\n\nDownload DCMTK from [dcmtk.org](https://dcmtk.org/) and add the `bin`\
  \ path to `DCMTK_PATHS` in `settings.ini`.\n\n### 3 – Create settings.ini\n\n```\nCopy  settings.example.ini\
  \  →  settings.ini\n```\n\n`settings.ini` lives next to the `.exe` (build output folder). Minimum required\
  \ values:\n\n```ini\nDICOM_HOST=<IP or hostname of the ARIA server>\nDICOM_PORT=<port of the ARIA DICOM\
  \ Daemon>\nESAPI_IMPORT_BASE=\\\\<ARIA-Server>\\<ScriptExport share>\nEXPORT_BASE=<local or UNC output\
  \ path>\n```\n\nSee `settings.example.ini` for the fully commented template with all available keys.\n\
  \n> `settings.ini` is listed in `.gitignore` and will never be committed to the repository.\n\n### 4\
  \ – Prepare the Excel file\n\n- First worksheet, column A (configurable via `EXCEL_ID_COLUMN`): ARIA\
  \ patient IDs\n- Row 1 = header, data starts at row 2 (configurable via `EXCEL_START_ROW`)\n\n---\n\n\
  ## Usage\n\n```\nMining_ListOfPlans2DICOM.exe [optional: path to Excel file]\n```\n\nAn options dialog\
  \ opens at startup.\n\n![Start GUI – Export options](Assets/Screenshot.png)\n\nExport toggles and paths\
  \ can be adjusted for each run. All settings are saved to `settings.ini` on confirmation.\n\n### Output\
  \ structure\n\n```\nEXPORT_BASE\\\n  <PatientId>\\\n    <CourseId>_<PlanId>\\\n      CT\\*.dcm\n   \
  \   RTSTRUCT\\*.dcm\n      RTPLAN\\*.dcm\n      RTDOSE\\*.dcm\n      RTIMAGE\\*.dcm        <- portal\
  \ dose images (matched by beam ID)\n    CBCT\\\n      <YYYYMMDD_HHMM>_<StructureSetId>\\*.dcm\n    RTIMAGE\\\
  \n      <YYYYMMDD>\\*.dcm     <- unmatched ACQUIRED_DOSE images\n```\n\n---\n\n## Assets\n\n| File |\
  \ Contents |\n|---|---|\n| `Assets/DCMTK.zip` | DCMTK 3.6.x Windows 64-bit (dynamic) – extract to `Assets/DCMTK/`\
  \ |\n| `Assets/DICOM_Daemon_Setup_Quick_Guide.docx` | Step-by-step guide for setting up the ARIA DICOM\
  \ DB Daemon and ScriptExport |\n\n---\n\n## References\n\n- Varian Code Samples Wiki – [Scripting the\
  \ Varian DICOM DB Daemon with ESAPI](https://github.com/VarianAPIs/Varian-Code-Samples/wiki/Scripting-the-Varian-DICOM-DB-Daemon-with-ESAPI)\n\
  - Varian API Book (PDF) – [varianapis.github.io/VarianApiBook.pdf](https://varianapis.github.io/VarianApiBook.pdf),\
  \ Chapter 4: DICOM DB Daemon\n- [DCMTK – DICOM Toolkit](https://dcmtk.org/)\n- [EPPlus – Excel library\
  \ for .NET](https://www.epplussoftware.com/)\n\n---\n\n## License\n\nThis script is intended for research\
  \ and technical evaluation. It is not a\nmedical device and is not validated for direct clinical decisions.\
  \ EPPlus is\nused in NonCommercial mode (`ExcelPackage.LicenseContext =\nLicenseContext.NonCommercial`).\
  \ A commercial EPPlus license is required for\ncommercial use.\n"

readme_excerpt: "# SPICA: Source Positioning Identification in Circular Applicators\n\nAccurate reconstruction\
  \ of the source dwell positions in high-dose-rate (HDR) brachytherapy is essential for treatment quality.\
  \ The Venezia™ gynaecological applicator, with its lunar-shaped ovoids, poses challenges because conventional\
  \ dummy markers do not match the actual source path, introducing systematic uncertainties. This work\
  \ aims to provide an automated, reproducible method for commissioning and quality assurance (QA) of\
  \ these ovoids.\n\n__Authors:__ Miquel Gubau, Adrià Casamitjana \\\n__Contact email:__ adria.casamitjana@udg.edu\n\
  \n> [!WARNING]\n> **Research Use Only:** This software is intended solely for research and educational\
  \ purposes. It has not been cleared or approved by any regulatory body for clinical use. Do not use\
  \ this software for clinical diagnosis, patient management, or treatment decisions.\n\n## Contents\n\
  \n### 1.- General description\n The proposed methodology offers a practical, reproducible solution to\
  \ improve source path verification, reduce manual \n intervention, and enhance clinical planning accuracy.\
  \ This software was tested for the lunar-shaped Venezia<sup>TM</sup> \n applicator and the results reported\
  \ on the following technical note. Please, cite this paper when using this software.\n\n Gubau et al.,\
  \ Automated evaluation of the source dwell positions in the lunar ovoids of the Venezia<sup>TM</sup>\
  \ \n gynaecological applicator (2026). (submitted)\n\n### 2.- Installation\nTo run this package you\
  \ just need python3 and virtualenv installed in your system. For a sanity check, you could run\n```\
  \ \nwhich python3\nwhich virtualenv\n```\nand check that the result is pointing towards an existing\
  \ file in your system (and it's not empty).\n\nTo install the SPICA package, please run the following\
  \ steps:\n* Move into your preferred directory: ```cd /path/to/your/directory```\n* Clone the GitHub\
  \ repository: ```git clone https://github.com/acasamitjana/SPICA.git```\n* Install python environment\
  \ and the libraries required\n```\nvirtualenv --p python3 .venv \nsource .venv/bin/activate\npip install\
  \ -r requirements.txt\n```\n\n### 3.- Usage\n\n#### 3.1.- Data directories\n\n##### Autoradiographs\n\
  A set of autoradiograph images should be provided for callibration. They should all be stored in the\
  \ same directory \nwith the following naming convention: CXPYY*.jpg, where X and YY are numbers.\n*\
  \ __Channel (C)__: C1 (right channel) or C2 (left channel)\n* __Source position (P)__: P01, P02, etc.\
  \ where each integer correspond to a 2.5mm forward step of the souce.\n\nFor example, the file C1P01.jpg\
  \ stand for channel 1 (right) and position 1 from the manufacturer.\nRepetitons of the same channel\
  \ and position can be stored using any suffix (e.g., C1P01-1.jpg, C1P01-2.jpg)\n\n##### Radiographs\
  \ (optional)\nYou could provide your own radiograph images from your hospital/center optionally:\n*\
  \ Images should be placed under the  same directory and with filenames starting with \"rad*\".\n* If\
  \ more than one image for the same radius is provided, they should be roughly aligned and the program\
  \ will use the \nredundancy of these images for a more robust estimate of the ovoid characteristics.\
  \ \n* Only images of the same radius should be placed under each directory (the software does not distinguish\
  \ between them)\n\n\nIf no radiographs are available, we provide the following radiographs \nfor available\
  \  each diameter:\n\n22 cm                          |  26 cm\n:-----------------------------:|:-------------------------:\n\
  ![S](data/default_rads/22.jpg) |  ![S](data/default_rads/26.jpg)\n\n\n\n\n#### 3.2.- Run the SPICA software\n\
  \nOpen a local terminal:\n* Change directory to the project root. \n* Activate your local environment\n\
  * Then execute the app.py file\n```\ncd /path/to/this/software\nsource .venv/bin/activate\nspica\n```\n\
  Now, you will be asked some important information through command line:\n* __Ovoid size:__ choose from\
  \ 22/26/30\n* __Running mode:__ choose from QA/COMMISSIONING/CUSTOM\n* __Directory of radiograph images:__\
  \ navigate to the autoradiograph directory or press \"Cancel\" if not available.\n* __Directory of the\
  \ autoradiograph images:__ navigate to the autoradiograph directory.\n\n#### 3.3.- Output\nThe SPICA\
  \ software has two separate outcomes:\n* Quantitative results: it stores the calculated dwell positions\
  \ for the different channels and source positions. It \n  also stores the associated type-A uncertainties.\n\
  * Visualization: it shows the theoretical and the computed dwell positions and hole centers among all\
  \ available channels,\n  source positions and repetitions.\n\n### 4. Step-by-step example\nIn the directory\
  \ ```example``` we include a notebook with step-by-step guide of the pipeline for visualization purposes\n\
  \n## Additional material\nThe stereolithography (STL) files with 3D printable phantoms of each ovoid\
  \ size (22 and 26 mm) can be found in the \nfollowing online repository: \n\nhttps://www.printables.com/model/1650955-support-venezia\n\
  \nThese files are used to attach the lunar ovoids and run the automatic pipeline.\n"

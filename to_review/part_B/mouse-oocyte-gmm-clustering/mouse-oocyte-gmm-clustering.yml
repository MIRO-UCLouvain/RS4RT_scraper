readme_excerpt: "# GMM clustering code\n\nThis repository contains the core clustering workflow used in\
  \ the study  \n**“Mouse oocyte phenotypes differ in blastocyst response to resveratrol and vitamin B12.”**\n\
  \n## Workflow\n\n- A scaler and a three-component Gaussian Mixture Model were fitted using 695 baseline\
  \ Control oocytes from 12 replicates.\n- The fitted scaler and model were applied without refitting\
  \ to the remaining 1,366 oocytes from seven supplementation replicates.\n- Only numeric columns beginning\
  \ with `original_shape2D_` or `original_firstorder_` are used as clustering features.\n- The script\
  \ can also generate synthetic data to demonstrate the expected input structure and verify code execution.\n\
  \n## Requirements\n\n- Python 3.10 or later\n- NumPy\n- pandas\n- scikit-learn\n\nInstall the required\
  \ Python packages with:\n\n```bash\npython -m pip install numpy pandas scikit-learn\n```\n\nThe other\
  \ modules used in the script, including `argparse`, `json`, `warnings`, `pathlib`, and `typing`, are\
  \ included in the Python standard library and do not require separate installation.\n\n## Run with synthetic\
  \ data\n\n```bash\npython gmm_clustering.py --synthetic --output outputs\n```\n\n## Run with study-format\
  \ CSV files\n\n```bash\npython gmm_clustering.py \\\n  --baseline outputs/synthetic_baseline_695.csv\
  \ \\\n  --remaining outputs/synthetic_remaining_1366.csv \\\n  --output outputs\n```\n\nThe baseline\
  \ and remaining CSV files must contain the same radiomic feature columns.\n\nThe synthetic data are\
  \ provided only to demonstrate the expected input structure and code execution. They are not the original\
  \ study data and do not reproduce the numerical results reported in the manuscript.\n"

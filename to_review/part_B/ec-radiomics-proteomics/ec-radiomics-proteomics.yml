readme_excerpt: "# EC-Radiomics-Proteomics-LNM\n\n## Overview\n\nThis repository contains the data for\
  \ the study on **predicting lymph node metastasis (LNM) in endometrial carcinoma (EC)** using a multimodal\
  \ radiomics-proteomics approach.\n\nThe study developed a 20-feature radiomics signature from multi-sequence\
  \ MRI (CE + DWI + T2) using a Logistic Regression model (L2, class-weight balanced) trained on 432 cases.\
  \ Radiomics scores were subsequently correlated with quantitative proteomics data from 32 FFPE samples\
  \ to identify hub proteins bridging imaging phenotypes and molecular biology. Additionally, transcriptomic\
  \ differentially expressed genes (DEGs) from GEO cohort GSE120490 are provided to contextualize the\
  \ LNM-associated molecular landscape.\n\n**Internal validation (repeated stratified 5-fold CV × 3 repeats):**\n\
  - AUC: 0.840\n- Sensitivity: 0.797 | Specificity: 0.736\n\n**External validation (independent Center\
  \ 4 cohort, n=130):**\n- AUC: 0.812 (95% CI: 0.690–0.910)\n- Sensitivity: 0.750 | Specificity: 0.797\
  \ | Accuracy: 0.792\n\n---\n\n## Repository Structure\n\n```\nEC_Radiomics_Proteomics_GitHub/\n├── README.md\n\
  ├── data/\n│   ├── radiomics_radscore_32samples.csv   # Radiomics-derived RadScore + predictions (32\
  \ matched samples)\n│   ├── proteomics_32samples.csv          # Top-10 hub protein intensities from\
  \ FFPE proteomics (32 samples)\n│   ├── hub_proteins_correlation.csv      # Pearson correlation: RadScore\
  \ vs hub proteins (|r| ≥ 0.4)\n│   ├── proteomics/\n│   │   ├── protein_quantitation.xlsx     # Full\
  \ protein quantitation (all identified proteins, 32 tumor samples)\n│   │   ├── protein_expression_matrix.xlsx#\
  \ Normalized expression matrix for differential analysis\n│   │   ├── DEP_LNMpos_vs_LNMneg.xlsx    #\
  \ Differentially expressed proteins: LNM+ vs LNM−\n│   │   └── QC_plot_data.xlsx             # QC summary\
  \ data (RSD, PCA scores, sample correlation)\n│   └── transcriptomics/\n│       ├── GSE120490_clinical.csv\
  \        # Sample clinical metadata (LNM status, etc.)\n│       ├── GPL570_probe_annotation.csv   #\
  \ Affymetrix GPL570 probe-to-gene mapping\n│       ├── GSE120490_expression_matrix.csv # RMA-normalized\
  \ expression matrix\n│       ├── GSE120490_limma_full.csv      # Full limma output for all probes\n\
  │       ├── GSE120490_degs_sig.csv        # 379 significant DEGs (adj.P.Val < 0.05)\n│       ├── GSE120490_degs_up.csv\
  \         # 215 upregulated DEGs\n│       └── GSE120490_degs_down.csv       # 164 downregulated DEGs\n\
  ├── results/\n│   ├── internal_validation/\n│   │   ├── model_performance.csv         # Apparent + cross-validation\
  \ aggregate metrics\n│   │   ├── model_benchmark_summary.csv   # All selector × classifier combinations\
  \ (165 total, 1 selected)\n│   │   ├── repeated_cv_split_metrics.csv # Per-fold CV metrics\n│   │  \
  \ └── repeated_cv_calibration_curve.csv\n│   ├── external_validation/\n│   │   ├── model_performance.csv\
  \         # External validation metrics for the final radiomics model\n│   │   ├── external_predictions.csv\
  \      # De-identified external predictions\n│   └── feature_selection/\n│       ├── selected_features.txt\
  \         # Final 20 features\n│       ├── model_coefficients.csv        # 20 features + coefficients\
  \ + scaler params (model input order)\n│       ├── reduction_trace.csv           # ICC → PCC → RFE step\
  \ trace\n│       ├── pcc_decisions.csv             # PCC redundancy filter decisions\n│       └── rfe_selector_ranking.csv\
  \      # RFE feature ranking\n└── figures/\n    ├── GSE120490_volcano.pdf\n    ├── external_validation/\
  \              # ROC, confusion matrix, and study-flowchart figures\n    ├── mri_examples/         \
  \            # Representative CE / DWI / T2 slices\n    ├── proteomics_QC/                    # PCA,\
  \ correlation, RSD, identified proteins\n    ├── proteomics_DEP/                   # Volcano + heatmap\
  \ (LNM+ vs LNM−)\n    ├── proteomics_enrichment/            # GO / KEGG bar & bubble plots\n    └──\
  \ proteomics_PPI/                   # PPI network plots\n```\n\n---\n\n## Data Description\n\n### Radiomics-Derived\
  \ RadScore (`data/radiomics_radscore_32samples.csv`)\n\n- **Samples**: 32 cases with matched radiomics\
  \ and proteomics data (anonymized as `Sample_001`–`Sample_032`)\n- **Columns**: `Sample_ID`, `LNM` (lymph\
  \ node metastasis label: 1=positive, 0=negative), `RadScore`, `Predicted_Probability`\n- **Feature pipeline**:\
  \ ICC ≥ 0.75 → PCC redundancy filter (threshold 0.8) → RFE (k=20) → Logistic Regression (L2)\n- **Sequences**:\
  \ CE (contrast-enhanced), DWI (diffusion-weighted), T2\n- **Privacy note**: Patient-level 20-feature\
  \ radiomics matrices are not included in this public repository.\n\n### Proteomics (`data/proteomics_32samples.csv`)\n\
  \n- **Samples**: 32 FFPE tumor tissue samples (same cohort as radiomics, anonymized)\n- **Method**:\
  \ Tandem Mass Spectrometry quantitative proteomics\n- **Columns**: `Sample_ID`, top-10 hub proteins\
  \ (ESR1, RSPH1, GRIA2, IGF1, TPPP3, CAPSL, SPATA18, ARMC3, ERMN, GPM6B)\n- **Values**: Log2-transformed\
  \ protein intensities\n\n### Proteomics Results (`data/proteomics/`)\n\nDerived from FFPE quantitative\
  \ proteomics (tandem mass spectrometry) on 32 endometrial carcinoma samples (16 LNM+, 16 LNM−).\n\n\
  | File | Description |\n|------|-------------|\n| `protein_quantitation.xlsx` | Full protein quantitation\
  \ table (all identified proteins) |\n| `protein_expression_matrix.xlsx` | Normalized expression matrix\
  \ used for differential analysis |\n| `DEP_LNMpos_vs_LNMneg.xlsx` | Differentially expressed proteins:\
  \ LNM+ vs LNM− (key comparison) |\n| `QC_plot_data.xlsx` | QC summary data (RSD, PCA scores, sample\
  \ correlation) |\n\n### Hub Protein Correlation (`data/hub_proteins_correlation.csv`)\n\n- Pearson correlation\
  \ between RadScore and each hub protein\n- Filtered for |r| ≥ 0.4, FDR-adjusted p-value\n- Includes\
  \ protein annotation (regulation direction, log2FoldChange from proteomics discovery)\n\n### GSE120490\
  \ Transcriptomics (`data/transcriptomics/`)\n\n- **Source**: GEO dataset GSE120490 (Endometrial carcinoma,\
  \ LNM-related; GPL570 Affymetrix Human Genome U133 Plus 2.0 Array)\n- **Raw data**: Available at [NCBI\
  \ GEO GSE120490](https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE120490)\n\n| File | Description\
  \ | Size |\n|------|-------------|------|\n| `GSE120490_clinical.csv` | Sample clinical metadata (LNM\
  \ status, etc.) | 8 KB |\n| `GPL570_probe_annotation.csv` | Affymetrix GPL570 probe-to-gene mapping\
  \ | 1.2 MB |\n| `GSE120490_expression_matrix.csv` | RMA-normalized expression matrix (all samples) |\
  \ 23 MB |\n| `GSE120490_limma_full.csv` | Full limma output for all probes (logFC, t, P.Value, adj.P.Val)\
  \ | 2.3 MB |\n| `GSE120490_degs_sig.csv` | **379 significant DEGs** (adj.P.Val < 0.05) | 44 KB |\n|\
  \ `GSE120490_degs_up.csv` | 215 upregulated DEGs | 25 KB |\n| `GSE120490_degs_down.csv` | 164 downregulated\
  \ DEGs | 19 KB |\n\n- Analysis method: limma differential expression (LNM+ vs LNM−)\n- Columns in DEG\
  \ files: `gene_symbol`, `logFC`, `AveExpr`, `t`, `P.Value`, `adj.P.Val`, `B`\n\n---\n\n## Results\n\n\
  ### Internal Validation (`results/internal_validation/`)\n\n| File | Description |\n|------|-------------|\n\
  | `model_performance.csv` | Apparent and cross-validation aggregate metrics (AUC, sensitivity, specificity,\
  \ calibration, etc.) |\n| `model_benchmark_summary.csv` | Aggregate selector × classifier benchmark\
  \ summary |\n| `repeated_cv_split_metrics.csv` | Per-fold aggregate metrics across all CV repeats |\n\
  | `repeated_cv_calibration_curve.csv` | Aggregate calibration curve data (mean predicted vs. observed\
  \ rate) |\n\nOnly aggregate internal-validation results are provided; patient-level development-cohort\
  \ radiomics feature matrices are not included.\n\n\n### External Validation (`results/external_validation/`)\n\
  \n| File | Description |\n|------|-------------|\n| `model_performance.csv` | External validation metrics\
  \ for the final 20-feature radiomics model; threshold-dependent metrics are reported at the optimal\
  \ threshold |\n| `external_predictions.csv` | De-identified sample-level external prediction probabilities\
  \ |\n\nThe final radiomics model achieved an external-validation AUC of 0.8121 (95% CI: 0.6903–0.9103)\
  \ in 130 independent cases.\nThreshold-dependent external-validation metrics are summarized at the optimal\
  \ threshold.\n\n### Feature Selection Trace (`results/feature_selection/`)\n\n| File | Description |\n\
  |------|-------------|\n| `selected_features.txt` | Final 20 selected features |\n| `model_coefficients.csv`\
  \ | Final 20 features with logistic regression coefficients + scaler parameters (ordered by model input)\
  \ |\n| `reduction_trace.csv` | Step-by-step feature count: ICC → PCC → RFE |\n| `pcc_decisions.csv`\
  \ | PCC redundancy filter: kept/dropped feature pairs |\n| `rfe_selector_ranking.csv` | RFE ranking\
  \ for all candidate features |\n\n---\n\n## Figures\n\n### Transcriptomics (`figures/`)\n| File | Description\
  \ |\n|------|-------------|\n| `GSE120490_volcano.pdf` | DEG volcano plot (GSE120490, limma) |\n\n\n\
  ### External Validation (`figures/external_validation/`)\n| File | Description |\n|------|-------------|\n\
  | `external_validation_roc.pdf/png` | ROC curve in the external-validation cohort |\n| `external_validation_confusion_matrix.pdf/png`\
  \ | Confusion matrix for the external-validation cohort at the optimal threshold |\n| `study_flowchart.pdf/png`\
  \ | Study design and analysis workflow |\n\n### MRI Representative Images (`figures/mri_examples/`)\n\
  Representative MRI slices (CE, DWI, T2) from a single case illustrating the segmented tumor region.\n\
  \n### Proteomics QC (`figures/proteomics_QC/`)\n| File | Description |\n|------|-------------|\n| `PCA_all_samples.pdf/png`\
  \ | PCA plot of all 32 proteomics samples |\n| `sample_correlation.pdf/png` | Inter-sample Pearson correlation\
  \ heatmap |\n| `RSD_boxplot.pdf/png` | RSD distribution boxplot (technical reproducibility) |\n| `identified_proteins_per_sample.pdf/png`\
  \ | Number of proteins identified per sample |\n\n### Differentially Expressed Proteins (`figures/proteomics_DEP/`)\n\
  Key comparison: **LNM+ tumor vs LNM− tumor** (Experimental_cancer vs Control_cancer)\n\n| File | Description\
  \ |\n|------|-------------|\n| `volcano_LNMpos_vs_LNMneg.pdf/png` | Volcano plot of DEPs |\n| `heatmap_LNMpos_vs_LNMneg.pdf/png`\
  \ | Hierarchical clustering heatmap of DEPs |\n\n### Functional Enrichment (`figures/proteomics_enrichment/`)\n\
  GO and KEGG enrichment for DEPs (LNM+ vs LNM−):\n`GO_bubble_total`, `GO_bar_total`, `KEGG_bubble_total`,\
  \ `KEGG_bar_total` (PDF + PNG)\n\n### PPI Network (`figures/proteomics_PPI/`)\nProtein–protein interaction\
  \ network of DEPs (LNM+ vs LNM−):\n`PPI_network_gene.pdf/png`, `PPI_network_query.pdf/png`\n\n---\n\n\
  ## Data Availability\n\n- **Raw MRI images, clinical records, and patient-level radiomics feature matrices**:\
  \ Not publicly available due to patient privacy regulations.\n- **Validation outputs**: De-identified\
  \ prediction probabilities and aggregate performance metrics are provided for external validation; aggregate\
  \ metrics are provided for internal validation.\n- **GSE120490**: Available at [NCBI GEO](https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE120490)\n\
  \n---\n\n## Citation\n\n> *[Manuscript under review – citation will be added upon publication]*\n\n\

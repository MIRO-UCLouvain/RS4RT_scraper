readme_excerpt: "# Simulacrum-v2.10-Breast-Cancer-Analysis\nBreast Cancer Exploratory Data Analysis Project\
  \ using the Simulacrum v2.1.0 tumour diagnoses, SACT, radiotherapy and gene testing data\n\nProject\
  \ Overview\nThe Simulacrum is a synthetic dataset that mirrors real patient data for breast cancer,\
  \ allowing researchers to explore patterns and correlations without compromising patient confidentiality.\
  \ This project aims to:\n\nMerge and preprocess data from multiple tables.\nFilter the data to include\
  \ only breast cancer patients.\nPerform exploratory data analysis (EDA) on patient demographics, tumor\
  \ characteristics, and treatment patterns.\nVisualize key findings through graphs and charts.\nConduct\
  \ survival analysis using Kaplan-Meier curves.\nDevelop a web application to predict patient survival.\n\
  Discuss limitations of the data.\n\nDataset Description\nThe dataset includes the following tables:\n\
  \nThe following datasets were used in this analysis:\n\nsim_av_gene: Gene data for patients.\nsim_av_patient:\
  \ Demographic and patient-level data.\nsim_av_tumour: Tumour characteristics and diagnoses.\nsim_rtds_combined:\
  \ Combined radiotherapy records.\nsim_rtds_episode: Radiotherapy treatment episodes.\nsim_rtds_exposure:\
  \ Radiotherapy exposure details.\nsim_rtds_prescription: Radiotherapy prescriptions.\nsim_sact_cycle:\
  \ Chemotherapy cycle details.\nsim_sact_drug_detail: Chemotherapy drug details.\nsim_sact_outcome: Chemotherapy\
  \ outcomes.\nsim_sact_regimen: Chemotherapy regimen data.\nEach table contains specific information\
  \ related to patients, tumors, treatments, and outcomes. The data covers various aspects such as:\n\n\
  Patient Demographics: Age at diagnosis, gender, vital status.\nTumor Characteristics: Site, morphology,\
  \ behavior, grade.\nTreatment Data: Radiotherapy episodes, prescriptions, exposures, chemotherapy regimens,\
  \ cycles, drug details.\nGenetic Information: Gene mutations associated with breast cancer.\nOutcomes:\
  \ Survival data, treatment modifications.\n\nA. Steps\n1. Filtering Breast Cancer Patients\nThe initial\
  \ step involved filtering the dataset to extract only breast cancer patients based on specific ICD codes.\
  \ The sim_av_tumour dataset was filtered using the following ICD-10 codes:\n\n2-11. Filtering Other\
  \ Datasets for Breast Cancer Patients Only\nThe same set of breast cancer patients identified in Step\
  \ 1 was used to filter other datasets:\n\nsim_av_gene: Gene data filtered for breast cancer patients.\n\
  sim_av_patient: Patient demographic data filtered.\nsim_rtds_episode, sim_rtds_combined, sim_rtds_exposure,\
  \ sim_rtds_prescription: Radiotherapy data filtered for breast cancer.\nsim_sact_regimen, sim_sact_cycle,\
  \ sim_sact_drug_detail, sim_sact_outcome: Chemotherapy data filtered for breast cancer.\n\nB. Visualizations\
  \ and Key Insights:\nSeveral visualizations to display the various insights gotten from the data analysis\n\
  \n1. Demographics & Vital Status Distribution\nVisualizations were created to show the distribution\
  \ of demographics and vital status:\n\nAge, sex and ethnicity distribution of breast cancer patients.\n\
  Vital status (alive vs. deceased) across the patient population.\n\n2. Tumour Analysis\nThis section\
  \ focused on breast cancer tumour characteristics:\n\nDistribution of tumour sites, morphology codes,\
  \ behaviour types, and grade types.\nKaplan-Meier survival curves based on tumour grades, showing survival\
  \ probabilities over time.\n\n3. Treatment Pathways\nAnalysis of treatment regimens and outcomes:\n\n\
  Most commonly used chemotherapy regimens for breast cancer treatment.\nComparison of regimen types vs.\
  \ survival rates.\nSurvival curves comparing the top five most frequently used regimens.\nMost frequently\
  \ administered drugs based on dosage and frequency.\nRoutes of drug administration and frequency of\
  \ treatment modification.\n\n4. Treatment Modalities & Intents\nIn-depth analysis of radiotherapy treatments:\n\
  \nDistribution of radiotherapy modalities and treatment intents.\nComparisons between prescribed fractions\
  \ and actual fractions delivered.\nAnalysis of prescribed doses vs. actual doses received.\n\n5. Survival\
  \ Prediction \nA web-based application was developed to predict patient survival rates based on the\
  \ breast cancer data and analysis.\nThe Application also has several sections showing the visuals of\
  \ all results/insights gotten from the analysis\n\n7. Limitations of the Data\nVisualizations were created\
  \ to highlight limitations of the dataset, including missing data, inconsistencies, and potential biases\
  \ in the simulated dataset.\n"

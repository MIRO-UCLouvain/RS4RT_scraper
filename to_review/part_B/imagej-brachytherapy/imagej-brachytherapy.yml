readme_excerpt: "# ImageJ-Brachytherapy\nImageJ analysis for HDR brachytherapy applicator QC\n\n## 1.\
  \ Line Source Analysis\nA simple macro which provides a measurement of dead space and the locations\
  \ of dwell positions along a straight line.\n\nInput: Scanned autoradiograph of Flexitron source along\
  \ a straight source path (TIF File)\n\nRun the macro in ImageJ and select the image to be analysed.\n\
  \nEnter the scan resolution (dpi)\n\nDraw a line along the source path, starting from the end of the\
  \ applicator.  Accurate placement of the start of the line is important to ensure correct dead space\
  \ calculation.\n\n![DrawProfile](https://github.com/user-attachments/assets/1d23f02c-5a96-463a-a42a-53feb127b8da)\n\
  \n\nThe program plots a line profile, smooths the profile and then calculates the positions of the maxima\
  \ along the line.\n\nA results table shows dead space and dwell position spacing.  \n![LineSourceResult](https://github.com/user-attachments/assets/1fa8d03a-e902-4b48-ae97-71065bd6e323)\n\
  \n"

readme_excerpt: "# Análise de Recorrência na Classificação de ECGs: Um Estudo com Modelos Profundos e\
  \ Clássicos\n#### *Recurrence Analysis in ECG Classification: A Study Using Deep and Classical Models*\n\
  ## Laboratório de Processamento de Sinais para Comunicações (DSPCOM) - FEEC/UNICAMP\n#### *Laboratory\
  \ of Signal Processing for Communications (DSPCOM) - FEEC/UNICAMP*\n#### Autores/*Authors*: João Pagnan,\
  \ Romis Ribeiro Attux, Diogo Soriano, Levy Boccato\n\n### Introdução\n#### *Introduction*\nEste repositório\
  \ armazena os códigos utilizados no trabalho intitulado \"Análise de Recorrência na Classificação de\
  \ ECGs: Um Estudo com Modelos Profundos e Clássicos\", de João Pagnan, Romis Ribeiro Attux, Diogo Soriano\
  \ e Levy Boccato. O trabalho foi apresentado no XLIII Simpósio Brasileiro de Telecomunicações e Processamento\
  \ de Sinais (SBrT2025) e está disponível [nessa](https://doi.org/10.14209/sbrt.2025.1571157136) página\
  \ com o DOI: 10.14209/sbrt.2025.1571157136. \n\n*This repository stores the codes used in the work entitled\
  \ 'Recurrence Analysis in ECG Classification: A Study with Deep and Classical Models', by João Pagnan,\
  \ Romis Ribeiro Attux, Diogo Soriano, and Levy Boccato. The work was presented at the XLIII Brazilian\
  \ Symposium on Telecommunications and Signal Processing (SBrT2025) and is available on [this](https://doi.org/10.14209/sbrt.2025.1571157136)\
  \ page with the DOI: 10.14209/sbrt.2025.1571157136.*\n\n### Código\n#### *Code*\nOs códigos desenvolvidos\
  \ para a pesquisa estão no diretório `dlecg/`, enquanto os diretórios `notebooks/` e \n`data/` contêm\
  \ os *notebooks* do **JupyterLab** feitos para testes exploratórios e as bases de dados utilizadas,\n\
  respectivamente. As rotinas criadas para a conversão dos dados brutos `.dat` e `.atr` para arquivos\
  \ `.csv` e `.txt`\nestão no diretório `scripts/`, onde também estão armazenadas as rotinas utilizadas\
  \ para gerar figuras e para avaliar os\nmodelos classificadores. Os pacotes de Python necessários estão\
  \ indicados no arquivo `requirements.txt` e o repositório\ninclui uma imagem de **Docker** que pode\
  \ ser montada e executada com as *scripts* `build_docker.sh` e `run_docker.sh`.\n\n*The codes developed\
  \ for the research are in the `dlecg/` directory, while the `notebooks/` and `data/` directories\ncontain\
  \ the **JupyterLab** notebooks created for exploratory testing and the datasets used, respectively.\
  \ The routines\ncreated for converting raw `.dat` and `.atr` data into `.csv` and `.txt` files are in\
  \ the `scripts/` directory, which\nalso stores the routines used to generate figures and evaluate the\
  \ classification models. The required Python packages\nare listed in the `requirements.txt` file, and\
  \ the repository includes a **Docker** image that can be built and run with\nthe `build_docker.sh` and\
  \ `run_docker.sh` scripts.*\n\n### Financiamento\n#### *Funding*\nO presente trabalho foi realizado\
  \ com apoio da Fundação de Amparo à Pesquisa do Estado de São Paulo (FAPESP, Processo 2024/10715-1),\
  \ dentro do contexto do BI0S - *Brazilian Institute of Data Science* (Processo 2020/09838-0), da Coordenação\
  \ de Aperfeiçoamento de Pessoal de Nível Superior – Brasil (CAPES) – Código de Financiamento 001 e do\
  \ CNPq (308425/2023-5 e 313970/2023-8).\nAs opiniões, hipóteses e conclusões ou recomendações expressas\
  \ neste material são de responsabilidade do(s) autor(es) e\nnão necessariamente refletem a visão da\
  \ FAPESP.\n\n*This study was financed, in part, by the São Paulo Research Foundation (FAPESP), Brasil,\
  \ Process Number (2024/10715-1), within the context of the Brazilian Institute of Data Science (BI0S),\
  \ Process Number (2020/09838-0), the Coordination for the Improvement of Higher Education Personnel\
  \ – Brazil (CAPES) – Funding Code 001, and the CNPq (308425/2023-5 and 313970/2023-8).*\n*The opinions,\
  \ hypotheses, and conclusions or recommendations expressed in this material are the responsibility of\
  \ the\nauthor(s) and do not necessarily reflect the views of FAPESP.*\n"

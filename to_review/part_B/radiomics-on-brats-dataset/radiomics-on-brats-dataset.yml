readme_excerpt: "# Radiomics-on-BRATS-Dataset\n\nThis project has been conducted in order to find and\
  \ classify potential tumours inside the BRATS dataset. \n\nThe BraTS dataset (Brain Tumor Segmentation)\
  \ is a dataset used in medical imaging for brain tumor segmentation.\nThe focus of BraTS is on gliomas,\
  \ a category of brain tumors that includes both low-grade gliomas (LGG) and highly malignant high-grade\
  \ gliomas (HGG).\nHere are reported some specifics:\n\n- MRI scans:\n    T1: T1-weighted, providing\
  \ detailed anatomical information.\n    T1ce: T1 with contrast enhancement, highlighting tumor regions.\n\
  \    T2: T2-weighted, useful for visualizing edema and fluid.\n    FLAIR: Fluid-Attenuated Inversion\
  \ Recovery, for visualizing edema and abnormalities.\n\n- LABLES:\n    0: Healthy tissue (no tumor).\n\
  \    1: Necrotic and Non-enhancing Tumor Core.\n    2: Edema.\n    4: Enhancing Tumor Core.\n\n  - 67\
  \ PATIENTS\n \nThis processing part is focused on managing, preprocessing, and generating data for training\
  \ ML models for 3D medical images segmentation.\n\nKey operations include:\n1.   Separating ground truth\
  \ data from images.\n2.   Normalizing the images, developing stategies like gaussian distribution on\
  \ voxels, a min-max normalization and a median-based normalization.\n3.   Applying data augmentation\
  \ techniques (flipping) to increase data variability and improve the model's generalization.\n4.   Creating\
  \ a data generator that provides:\n5.   A tensor for the input images (image_tensor).\n6.   A tensor\
  \ for the ground truth labels (truth_tensor).\n"

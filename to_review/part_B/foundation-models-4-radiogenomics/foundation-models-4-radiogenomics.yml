readme_excerpt: '# Foundation_Models_Transfer_Learning_4_Radiogenomics

  Here is the source codes for paper ''Transfer Learning with 3D Foundation Models Enhances Radiogenomics:
  Validation Across HPV Prediction and HER2 Classification''


  Pipeline of study is show as follow:

  ![Pipeline of study](https://github.com/FORRESTHUACHEN/Foundation_Models_4_Radiogenomics-/blob/main/Figures/Figure%201.jpg)

  Steps for practicing our method are shown as follow:

  ## Step 1:

  Preparing medical images from DICOM manner to npy data manner and preparing clinical data for deep feature
  extraction, example of clinical data preparation can be found in ''preProcessData/RADCURE-0005.txt''.
  Information of tumor position in images can be extracted from the mask file in corresponding datasets.

  ## Step 2:

  Deep feature of this study extracted from open access foundation model [M3FM (medical multimodal-multitask
  foundation model)](https://github.com/niuchuangnn/M3FM), you need to follow instructions in [M3FM repository](https://github.com/niuchuangnn/M3FM)
  to reload their model for feature extraction.


  Replacing scripts ''inference_demo.py'',''visualize.py'',''inference.py'' and ''m3fm.py'' in M3FM repository
  with corresponding scripts in this repository, scripts of this repository are stored in directory-[M3FM-main-Feature-extraction](https://github.com/FORRESTHUACHEN/Foundation_Models_4_Radiogenomics-/tree/main/M3FM-main-Feature-extraction).
  Changing value of variables ''txt_root_path'' and ''deepfeatureoutpath'' in script ''inference_demo.py''
  is main handle for controlling data for features extraction.


  Example of extracted features of sample ''RADCURE-0005'' can be found in directory -[preProcessData(RADCURE-0005.csv)](https://github.com/FORRESTHUACHEN/Foundation_Models_4_Radiogenomics-/tree/main/preProcessData).
  Summaried deepfeatures of dataset RADCURE, H&N PET/CT, Duke-BCL, I-SPY 2 can be found in directory-[extractedDeepFeatures](https://github.com/FORRESTHUACHEN/Foundation_Models_4_Radiogenomics-/tree/main/extractedDeepFeatures).


  ## Step 3:

  Model validation of this study based on tensorflow (version 1.13) platform, therefore, tfrecords need
  to make before validation, you can use script ''tfmarker_deepfeatures_RADCURE.py'' to finish this making
  based summaried deepfeatures in directory-[extractedDeepFeatures](https://github.com/FORRESTHUACHEN/Foundation_Models_4_Radiogenomics-/tree/main/extractedDeepFeatures).
  Example tfrecord files can be found in directory - [tfRecords](https://github.com/FORRESTHUACHEN/Foundation_Models_4_Radiogenomics-/tree/main/tfRecords)


  ## Step 4:

  Using classifier script ''Classifierv2_3batch_v4.py'' to validate our study.


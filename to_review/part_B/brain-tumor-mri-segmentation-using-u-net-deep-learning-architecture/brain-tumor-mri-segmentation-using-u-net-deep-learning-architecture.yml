readme_excerpt: "# Brain Tumor MRI Segmentation Using Deep Learning\n\nThis project uses deep learning\
  \ to automatically segment brain tumors from MRI images. It implements and evaluates two semantic-segmentation\
  \ models:\n\n- **Attention U-Net**\n- **Lightweight DeepLabV3-like model**\n\nThe Attention U-Net achieved\
  \ the strongest performance, reaching an **overall Dice score of 0.8562** and an **overall IoU of 0.7486**\
  \ on the test set.\n\n---\n\n## Table of Contents\n\n- [Project Overview](#project-overview)\n- [Main\
  \ Features](#main-features)\n- [Dataset](#dataset)\n- [Data Preprocessing](#data-preprocessing)\n- [Model\
  \ Architectures](#model-architectures)\n- [Loss Function and Metrics](#loss-function-and-metrics)\n\
  - [Experimental Setup](#experimental-setup)\n- [Results](#results)\n- [Installation](#installation)\n\
  - [How to Run the Project](#how-to-run-the-project)\n- [Generated Outputs](#generated-outputs)\n- [Recommended\
  \ Repository Structure](#recommended-repository-structure)\n- [Limitations](#limitations)\n- [Future\
  \ Improvements](#future-improvements)\n- [Medical Disclaimer](#medical-disclaimer)\n\n---\n\n## Project\
  \ Overview\n\nBrain tumor segmentation is the process of identifying the exact tumor region in a brain\
  \ MRI scan. Manual segmentation can be time-consuming and may vary between specialists.\n\nThis project\
  \ builds a binary segmentation system that receives an MRI image and produces a mask containing:\n\n\
  - `0` for background pixels\n- `1` for tumor pixels\n\nThe complete workflow includes:\n\n1. Pairing\
  \ MRI images with their corresponding tumor masks.\n2. Resizing and normalizing images.\n3. Creating\
  \ stratified training, validation, and test sets.\n4. Applying image augmentation.\n5. Training an Attention\
  \ U-Net.\n6. Fine-tuning the best Attention U-Net checkpoint.\n7. Training a lightweight DeepLabV3-like\
  \ comparison model.\n8. Evaluating both models using Dice, IoU, precision, recall, F1-score, and pixel\
  \ accuracy.\n9. Saving models, metrics, training curves, confusion matrices, and sample predictions.\n\
  \n---\n\n## Main Features\n\n- Automatic image-and-mask pairing using `_mask.tif` filenames.\n- MRI\
  \ images resized to `256 × 256`.\n- Binary mask preservation using nearest-neighbor interpolation.\n\
  - Stratified train, validation, and test splitting.\n- Training-set balancing based on tumor-positive\
  \ and empty-mask slices.\n- On-the-fly data augmentation with TensorFlow.\n- Attention gates in U-Net\
  \ skip connections.\n- Batch normalization, spatial dropout, and L2 regularization.\n- Combined Binary\
  \ Cross-Entropy and Focal Tversky loss.\n- AdamW optimization with cosine learning-rate decay.\n- Fine-tuning\
  \ from the best saved Attention U-Net checkpoint.\n- Comparison with a lightweight DeepLabV3-like architecture.\n\
  - Automatic checkpointing and early stopping.\n- Pixel-level confusion matrix and classification report.\n\
  - Visualization of ground truth masks, predictions, and MRI overlays.\n\n---\n\n## Dataset\n\nThe notebook\
  \ expects a brain MRI segmentation dataset stored inside a folder named `kaggle_3m`.\n\nIt found:\n\n\
  - **3,929 paired MRI images and masks**\n- **2,514 training samples**\n- **629 validation samples**\n\
  - **786 test samples**\n- **275 tumor-positive samples in the test set**\n\nEach MRI image must have\
  \ a matching mask using the following naming format:\n\n```text\nimage_name.tif\nimage_name_mask.tif\n\
  ```\n\nAn example dataset structure is:\n\n```text\nkaggle_3m/\n├── patient_folder_1/\n│   ├── image_1.tif\n\
  │   ├── image_1_mask.tif\n│   ├── image_2.tif\n│   └── image_2_mask.tif\n├── patient_folder_2/\n│  \
  \ ├── image_1.tif\n│   └── image_1_mask.tif\n└── ...\n```\n\n> The dataset itself is not included in\
  \ this repository. Download it separately and update `dataset_path` in the notebook.\n\n---\n\n## Data\
  \ Preprocessing\n\n### MRI Images\n\nEach MRI image is:\n\n1. Read with OpenCV.\n2. Converted from BGR\
  \ to RGB.\n3. Resized to `256 × 256`.\n4. Normalized from the range `0–255` to `0–1`.\n5. Converted\
  \ to `float32`.\n\n### Segmentation Masks\n\nEach mask is:\n\n1. Read in grayscale.\n2. Resized using\
  \ nearest-neighbor interpolation.\n3. Converted into a binary mask.\n4. Expanded to the shape `(256,\
  \ 256, 1)`.\n\nNearest-neighbor interpolation is important for masks because it preserves the original\
  \ class boundaries and avoids creating incorrect intermediate pixel values.\n\n### Dataset Split\n\n\
  The dataset is divided using stratified splitting so that tumor-positive and tumor-negative MRI slices\
  \ are represented across all subsets.\n\n```text\nTraining:   2,514 images\nValidation:   629 images\n\
  Testing:      786 images\n```\n\nThe training-balancing logic keeps all tumor-positive images and limits\
  \ tumor-negative images to a maximum ratio of approximately `2:1`.\n\n### Data Augmentation\n\nThe training\
  \ pipeline applies:\n\n- Random horizontal flipping\n- Random vertical flipping\n- Random rotations\
  \ in multiples of 90 degrees\n- Random brightness adjustment\n- Random contrast adjustment\n\nGeometric\
  \ transformations are applied to both the MRI image and its mask. Brightness and contrast changes are\
  \ applied only to the MRI image.\n\n---\n\n## Model Architectures\n\n## 1. Attention U-Net\n\nThe main\
  \ model is an Attention U-Net with an encoder-decoder architecture.\n\n### Encoder\n\nThe encoder uses\
  \ convolution blocks with:\n\n- Two `3 × 3` convolution layers\n- Batch normalization\n- ReLU activation\n\
  - Max pooling\n- L2 regularization\n- Spatial dropout in deeper layers\n\nThe encoder filter sizes are:\n\
  \n```text\n32 → 64 → 128 → 256\n```\n\nThe bridge uses:\n\n```text\n512 filters\n```\n\n### Decoder\n\
  \nThe decoder uses:\n\n- Transposed convolution for upsampling\n- Attention gates on skip connections\n\
  - Feature concatenation\n- Convolution blocks\n\nThe decoder filter sizes are:\n\n```text\n256 → 128\
  \ → 64 → 32\n```\n\nThe final layer uses a `1 × 1` convolution with sigmoid activation to create a binary\
  \ segmentation probability map.\n\n### Attention Gates\n\nAttention gates help the model focus on useful\
  \ tumor-related features from encoder skip connections while reducing irrelevant background information.\n\
  \n---\n\n## 2. Lightweight DeepLabV3-like Model\n\nA lightweight DeepLabV3-like model is included for\
  \ comparison.\n\nIt contains:\n\n- A convolutional encoder\n- Three max-pooling stages\n- An Atrous\
  \ Spatial Pyramid Pooling-style block\n- Dilated convolutions with rates `1`, `2`, `4`, and `6`\n- Bilinear\
  \ upsampling\n- A sigmoid segmentation output\n\nThe model has approximately:\n\n```text\n718,001 total\
  \ parameters\n```\n\n---\n\n## Loss Function and Metrics\n\n### Combined Loss\n\nThe project uses a\
  \ custom loss function:\n\n```text\nCombined Loss = 0.5 × Binary Cross-Entropy\n              + 0.5\
  \ × Focal Tversky Loss\n```\n\nFocal Tversky loss helps handle severe class imbalance because tumor\
  \ pixels occupy only a small portion of most MRI images.\n\nThe loss uses:\n\n```text\nalpha = 0.3\n\
  beta  = 0.7\ngamma = 0.75\n```\n\nA larger `beta` gives a higher penalty to false negatives, encouraging\
  \ the model to avoid missing tumor pixels.\n\n### Evaluation Metrics\n\nThe following metrics are calculated:\n\
  \n- Pixel accuracy\n- Dice coefficient\n- Intersection over Union\n- Precision\n- Recall\n- F1-score\n\
  - Confusion matrix\n\nDice and IoU are more informative than accuracy for this project because the background\
  \ class contains far more pixels than the tumor class.\n\n---\n\n## Experimental Setup\n\n### General\
  \ Configuration\n\n```text\nImage size:       256 × 256\nBatch size:       16\nPrediction limit: 0.5\n\
  Random seed:      42\n```\n\n### Attention U-Net Training\n\n```text\nOptimizer:             AdamW\n\
  Initial learning rate: 1e-3\nMinimum learning rate: 1e-5\nWeight decay:          1e-5\nMaximum epochs:\
  \        100\nEarly-stopping patience: 15\n```\n\nA cosine-decay learning-rate schedule is used during\
  \ the initial training stage.\n\n### Attention U-Net Fine-Tuning\n\n```text\nOptimizer:            \
  \ AdamW\nLearning rate:         1e-4\nWeight decay:          1e-5\nMaximum epochs:        40\nEarly-stopping\
  \ patience: 25\n```\n\n### DeepLabV3-like Training\n\n```text\nOptimizer:             Adam\nLearning\
  \ rate:         1e-5\nMaximum epochs:        60\nEarly-stopping patience: 12\n```\n\n`ReduceLROnPlateau`\
  \ is used to reduce the learning rate when validation loss stops improving.\n\n---\n\n## Results\n\n\
  ### Final Model Comparison\n\n| Model | Test Accuracy | Overall Dice | Overall IoU | Tumor-positive\
  \ Dice | Tumor-positive IoU | Precision | Recall | F1-score |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|\n\
  | **Attention U-Net** | **0.9971** | **0.8562** | **0.7486** | **0.8655** | **0.7629** | **0.8410**\
  \ | 0.8721 | **0.8562** |\n| DeepLabV3-like | 0.9953 | 0.7993 | 0.6656 | 0.8180 | 0.6921 | 0.7003 |\
  \ **0.9307** | 0.7993 |\n\n### Best Model\n\nThe **Attention U-Net** produced the best overall segmentation\
  \ results.\n\nIt achieved:\n\n```text\nTest Accuracy:       0.9971\nOverall Dice:        0.8562\nOverall\
  \ IoU:         0.7486\nTumor-positive Dice: 0.8655\nTumor-positive IoU:  0.7629\nPrecision:        \
  \   0.8410\nRecall:              0.8721\nF1-score:            0.8562\n```\n\n### Attention U-Net Confusion\
  \ Matrix\n\n```text\n                    Predicted\n                 Background    Tumor\nActual Background\
  \  50,912,057   84,818\nActual Tumor            65,819  448,602\n```\n\n### Train, Validation, and Test\
  \ Performance\n\n| Dataset | Accuracy | Dice | IoU | Precision | Recall | F1-score |\n|---|---:|---:|---:|---:|---:|---:|\n\
  | Train | 0.9971 | 0.8633 | 0.7595 | 0.8417 | 0.8861 | 0.8633 |\n| Validation | 0.9969 | 0.8538 | 0.7448\
  \ | 0.8182 | 0.8926 | 0.8538 |\n| Test | 0.9971 | 0.8562 | 0.7486 | 0.8410 | 0.8721 | 0.8562 |\n\nThe\
  \ similar train, validation, and test scores suggest that the Attention U-Net generalizes reasonably\
  \ well on this dataset.\n\n---\n---\n\n## Limitations\n\n- The dataset contains a strong class imbalance\
  \ between background and tumor pixels.\n- Pixel accuracy can appear very high because most pixels belong\
  \ to the background.\n- The current model performs binary segmentation only.\n- The project does not\
  \ classify tumor type or grade.\n- The results come from one dataset split using a fixed random seed.\n\
  - The notebook loads the full dataset into memory.\n- Patient-level data leakage should be checked if\
  \ slices from the same patient can appear in different subsets.\n- The system has not been clinically\
  \ validated.\n- MRI scans from other hospitals, scanners, or acquisition protocols may produce different\
  \ results.\n\n---\n\n## Future Improvements\n\nPossible improvements include:\n\n- Patient-level train,\
  \ validation, and test splitting.\n- K-fold cross-validation.\n- Mixed-precision training.\n- Patch-based\
  \ training for larger MRI images.\n- Pretrained encoders such as EfficientNet or ResNet.\n- U-Net++,\
  \ ResUNet, TransUNet, or transformer-based segmentation models.\n- Threshold optimization using the\
  \ validation set.\n- Connected-component post-processing.\n- Data augmentation with elastic deformation.\n\
  - Model explainability and uncertainty estimation.\n- Multi-class tumor-region segmentation.\n- Deployment\
  \ through Streamlit, Flask, FastAPI, or TensorFlow Serving.\n\n---\n\n## Medical Disclaimer\n\nThis\
  \ project is intended for **educational and research purposes only**. It is not a certified medical\
  \ device and must not be used as a replacement for diagnosis, treatment decisions, or evaluation by\
  \ qualified healthcare professionals.\n"

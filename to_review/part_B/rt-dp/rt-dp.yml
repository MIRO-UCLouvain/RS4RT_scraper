readme_excerpt: "# RT-DP\nRadiation Therapy Disaster Preparedness (RT-DP) System\n\nRansomware is an increasing\
  \ threat for continuous radiation treatment \nin fighting cancer. It also results in in data breaches\
  \ against patient \nprivacy. More and more cancer centres have suffered from Ransomware \nwhich results\
  \ in downtime from weeks to months, together with patient \ninformation leaking to the public. RT-DP\
  \ is a system planning for \nsituations that caused the oncology information system fully offline, \n\
  including ransomware attacks. In such a disater situation, RT-DP will \nhelp in bringing patients under\
  \ treatment or patients with plans ready \nto continue their treatment while we are restoring the full\
  \ functionality \nof the whole RT infrastructure. It can hence avoid the treatment gap, \nreduce the\
  \ clinical impact to neighbour cancer centres.\n\nAt the current stage, RT-DP is working for Aria OIS\
  \ system. The same idea \nshould be applicable to other OIS.\n\n-------------------------------------------------------\n\
  \n## Versioning is based on the OIS system\n* _1.x: Based on Aria 16.x. Not tested but should be working\
  \ for 13.x, \n15.x and 17.x._\n* _2.x: Based on Aria 18.x. Working for v16.x too._\n\n_Note: Latest\
  \ 2.x should be the first choice for Aria v13.x -- v18.x._\n"

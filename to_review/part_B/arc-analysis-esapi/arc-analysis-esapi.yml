readme_excerpt: "# Arc Analysis for Eclipse ESAPI\n\nInteractive Eclipse ESAPI tool for VMAT arc analysis\
  \ with MU/degree visualization, superposed polar plots, and automatic arc avoidance detection.\n\n---\n\
  \n## Overview\n\nThis application provides a graphical interface for analyzing VMAT treatment plans\
  \ in Varian Eclipse. It computes beam-specific MU/degree distributions, generates combined polar visualizations,\
  \ and identifies inactive arc segments to support treatment plan evaluation and quality assurance.\n\
  \n---\n\n## Features\n\n- Interactive WPF graphical interface\n- Per-beam MU/degree analysis\n- Superposed\
  \ MU/degree polar visualization\n- Automatic arc avoidance detection\n- Linear and quadratic interpolation\n\
  - Beam-specific statistics (maximum, minimum, mean, standard deviation)\n- Optional shared Y-axis scaling\
  \ for beam comparison\n\n---\n\n## Example\n\nThe figure below shows the graphical interface displaying\
  \ per-beam MU/degree analysis and the combined polar visualization for a representative VMAT treatment\
  \ plan.\n\n![Arc Analysis Example](arc-analysis-example.jpg)\n\n---\n\n## Technologies\n\n- C#\n- Varian\
  \ Eclipse Scripting API (ESAPI)\n- Windows Presentation Foundation (WPF)\n- .NET Framework\n\n---\n\n\
  ## Requirements\n\n- Varian Eclipse Treatment Planning System\n- Eclipse Scripting API (ESAPI)\n- Compatible\
  \ .NET Framework\n\n---\n\n## Disclaimer\n\nThis software is provided for research and educational purposes\
  \ only. It has not been validated for clinical use and should be independently verified before being\
  \ incorporated into any clinical workflow.\n\n---\n\n## Author\n\n**Zhuoyun Huang**\n\nMedical Physics\
  \ PhD Student  \nUniversity at Buffalo\n"

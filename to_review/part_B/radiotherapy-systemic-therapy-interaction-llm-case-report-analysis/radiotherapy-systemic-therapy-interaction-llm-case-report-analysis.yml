readme_excerpt: '# radiotherapy-systemic-therapy-interaction-llm-case-report-analysis


  ## What is this?


  This is the GitHub repository hosting the source code and a data files related to the following publication.


  ---


  Title:

  ## LLM-Based Classification of Case Reports: A Pilot Study on Interactions between Radiotherapy and
  Systemic Therapies


  DOI: 10.1200/CCI-25-00386

  ---

  AUTHORS: Dennstädt F, Bobnar T, Handra A, Putora PM, Filchenko I, Brüningk S, Aebersold DM, Cihoric
  N, Shelan M



  ## Content


  ### performance-evaluation.ipynb and llm-based-analysis.ipynb


  The python scripts used to run the LLM-based data extraction from case report on interactions between
  radiotherapy and the systemic therapies Pembrolizumab, Cetuximab and Cisplatin.



  ### data/

  The .JSON file used in the experiments containing the data structure with topics and categories for
  the data-extraction tasks.

  The .CSV files containing the titles and abstracts of the case reports.


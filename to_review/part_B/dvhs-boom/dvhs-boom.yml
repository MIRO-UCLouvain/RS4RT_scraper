readme_excerpt: "<img src=\"docs/assets/LemLib_Banner_V3.png\">\r\n<p align=\"center\">\r\n    <img src=\"\
  https://img.shields.io/github/contributors/LemLib/LemLib?style=for-the-badge\">\r\n    <img src=\"https://img.shields.io/github/stars/LemLib/LemLib?style=for-the-badge\"\
  >\r\n    <img src=\"https://img.shields.io/github/downloads/LemLib/LemLib/total?style=for-the-badge\"\
  >\r\n    <img src=\"https://img.shields.io/github/actions/workflow/status/LemLib/LemLib/pros-build.yml?style=for-the-badge\"\
  >\r\n    <img src=\"https://img.shields.io/badge/version-v0.5.2-blue?style=for-the-badge\">\r\n</p>\r\
  \n<hr>\r\nWelcome to LemLib! This open-source PROS template aims to introduce common algorithms like\
  \ Pure Pursuit and Odometry for new and experienced teams alike.\r\n\r\nThe creation of this template\
  \ was inspired by [EZ-Template](https://github.com/EZ-Robotics/EZ-Template) and [OkapiLib](https://github.com/OkapiLib/OkapiLib).\
  \ We aim to develop a library that strikes a balance between ease-of-use, akin to that of EZ-Template,\
  \ and comprehensive functionality, similar to that of OkapiLib.\r\n\r\n> Want a place to chat with the\
  \ devs and other users? Join our [Discord server](https://discord.gg/pCHr7XZUTj).\r\n\r\n## License\r\
  \nThis project is licensed under the MIT license. Check [LICENSE](https://github.com/LemLib/LemLib/blob/master/LICENSE)\
  \ for more details.\r\n\r\n## Features\r\n- Generic PID class\r\n- Odometry\r\n- Odom turn to face point\r\
  \n- [Boomerang controller](https://www.desmos.com/calculator/sptjw5szex)\r\n- Pure Pursuit\r\n- Motion\
  \ Chaining\r\n- Driver Control\r\n\r\n## Example Project\r\nYou can find a fully annotated example project\
  \ [here](https://github.com/LemLib/LemLib/blob/stable/src/main.cpp).\r\n\r\n## Tutorials\r\nThe [tutorials](https://lemlib.readthedocs.io/en/v0.5.0/tutorials/1_getting_started.html)\
  \ provide a detailed walkthrough through all the features of LemLib. It covers everything from installation\
  \ to Path Following:\r\n\r\n## FAQ\r\n_**1. Help! Why is my controller vibrating?**_\r\nIf your controller\
  \ vibrated more than once, your inertial sensor calibration failed.\r\nCheck if its connected to the\
  \ right port and try again.\r\n\r\n_**2. What drivetrains are supported?**_\r\nOnly tank/differential.\r\
  \nThis is not going to change until other drivetrains are competitive.\r\n\r\n_**3. Do I need tracking\
  \ wheels?**_\r\nNo, but it is recommended.\r\nYou should absolutely have a horizontal tracking wheel\
  \ if you don't have traction wheels, and you have to spend extra effort tuning your movements to prevent\
  \ any wheel slip.\r\n\r\n_**4. Do I need an inertial sensor?**_\r\nNo, but it is highly recommended.\r\
  \nThe one exception to this would be if you have 2 parallel tracking wheels which are tuned well and\
  \ are perfectly square. LemLib will work without it, but the accuracy will be compromised. \r\n\r\n\
  _**5. Do I need an SD card?**_\r\nAs of v0.5.0, no SD card is necessary.\r\n\r\n_**6. What are the units?**_\r\
  \nThe units are inches and degrees.\r\nIn a future release, Qunits will be used so you can use whatever\
  \ units you like.\r\n\r\n_**7. Is LemLib V5RC legal?**_\r\nYes.\r\nPer the RECF student-centred policy,\
  \ in the context of third-party libraries.\r\n> Students should be able to understand and explain the\
  \ code used on their robots\r\n\r\nIn other words, you need to know how LemLib works. You don't need\
  \ to know the details like all the math, just more or less how the algorithm works. If you want to learn\
  \ more about LemLib, you can look through the documentation and ask questions on our Discord server.\r\
  \n\r\n## Documentation\r\nCheck out the [Documentation](https://lemlib.readthedocs.io/en/v0.5.0/index.html).\r\
  \n\r\n## Contributing\r\nWant to contribute? Please read [CONTRIBUTING.md](https://github.com/LemLib/LemLib/blob/master/.github/CONTRIBUTING.md)\
  \ and join our [Discord server](https://discord.gg/pCHr7XZUTj).\r\n\r\n## Code of Conduct\r\nSee the\
  \ [Code of Conduct](https://github.com/LemLib/LemLib/blob/master/.github/CODE_OF_CONDUCT.md) on how\
  \ to behave like an adult.\r\n#\0 \0d\0v\0h\0s\0-\0b\0o\0o\0m\0\r\0\n\0"

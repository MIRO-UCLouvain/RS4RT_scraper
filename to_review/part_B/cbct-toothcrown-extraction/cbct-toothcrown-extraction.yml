readme_excerpt: "# Pytorch implementation of 3D UNet\n\nThis implementation is based on the orginial 3D\
  \ UNet paper and adapted to be used for MRI or CT image segmentation task   \n> Link to the paper: [https://arxiv.org/pdf/1606.06650v1.pdf](https://arxiv.org/pdf/1606.06650v1.pdf)\n\
  \n## Model Architecture\n\nThe model architecture follows an encoder-decoder design which requires the\
  \ input to be divisible by 16 due to its downsampling rate in the analysis path.\n\n![3D Unet](https://github.com/AghdamAmir/3D-UNet/blob/main/3D-UNET.png)\n\
  \n## Dataset\n\nThe Dataset class used for training the network is specially adapted to be used for\
  \ the **Medical Segmentation Decathlon challenge**. \n\nThis dataset contains several segmentation tasks\
  \ on various organs including **Liver Tumours, Brain Tumours, Hippocampus, Lung Tumours, Prostate, Cardiac,\n\
  Pancreas Tumour, Colon Cancer, Hepatic Vessels and Spleen segmentation**.\n\n- Please also note that\
  \ in the case which the task contain more than 2 classes (1: for foreground, 0: for background), you\
  \ will need to modify the output\nof the model to reshape it to the size of the groundtruth mask in\
  \ train.py file.\n\n> The link to the dataset: [http://medicaldecathlon.com/](http://medicaldecathlon.com/)\n\
  \n- The Dataset class uses Monai package for reading MRI or CT and also applying augmentations on them\
  \ in the transform.py file. You can modify the applied\ntransformation in this file according to your\
  \ preferences.\n\n## Configure the network\n\nAll the configurations and hyperparameters are set in\
  \ the config.py file.\nPlease note that you need to change the path to the dataset directory in the\
  \ config.py file before running the model.\n\n**Parameters:**\n\n- DATASET_PATH -> the directory path\
  \ to dataset .tar files\n\n- TASK_ID -> specifies the the segmentation task ID (see the dict below for\
  \ hints)\n\n- IN_CHANNELS -> number of input channels\n\n- NUM_CLASSES -> specifies the number of output\
  \ channels for dispirate classes\n\n- BACKGROUND_AS_CLASS -> if True, the model treats background as\
  \ a class\n\n- TRAIN_VAL_TEST_SPLIT -> delineates the ratios in which the dataset shoud be splitted.\
  \ The length of the array should be 3.\n\n- TRAINING_EPOCH -> number of training epochs\n\n- VAL_BATCH_SIZE\
  \ -> specifies the batch size of the training DataLoader\n\n- TEST_BATCH_SIZE -> specifies the batch\
  \ size of the test DataLoader\n\n- TRAIN_CUDA -> if True, moves the model and inference onto GPU\n\n\
  - BCE_WEIGHTS -> the class weights for the Binary Cross Entropy loss\n\n## Training\n\nAfter configure\
  \ config.py, you can start to train by running\n\n`python train.py`\n\nWe also employ tensorboard to\
  \ visualize the training process.\n\n`tensorboard --logdir=runs/`\n"

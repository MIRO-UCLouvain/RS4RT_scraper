readme_excerpt: "# Stereotactic Radio Surgery (SRS) - Protocol\nSimple SRS- protocol according to ICRU\
  \ 91 for stereotactic surgery in radiation therapy -\nAll You need is a text file called dvh.txt in\
  \ the same directory of this protocol -\nYou get this file by clicking right mouse tab on DVH in Varian's\
  \ TPS ''Eclipse'' and create a DVH in tabular format -\nCustomize names of structures according to Your\
  \ individual Structure Set -\nSave this .txt-file into the same directory of the protocol -\nWritten\
  \ in Python with Notepad++ - \nYou can run it by downloading and installing python and python idle from\
  \ -\nhttps://www.python.org/ -\nGood luck. -\n"

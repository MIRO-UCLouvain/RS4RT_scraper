  [![codecov](https://codecov.io/gh/lmejn/RoentgenPlots.jl/graph/badge.svg?token=YA1X5BFFB3)](https://codecov.io/gh/lmejn/RoentgenPlots.jl)\n\
  \n# RoentgenPlots.jl\n\nRoentgenPlots.jl provides functions to plot datatypes defined in [Roentgen.jl](https://github.com/Image-X-Institute/Roentgen.jl)\
  \ using [Plots.jl](https://docs.juliaplots.org).\n\n![Aperture Example](docs/src/assets/feature-plot.svg)\n\
  \n## Installation\n\n1. Navigate to your project\n2. Open the Julia REPL\n3. *[Optional]* Activate a\
  \ new environment\n4. Enter package mode by typing `]`\n5. Install using \n    ```julia\n    add https://github.com/lmejn/RoentgenPlots.jl\n\
  \    ```\n\n## Usage\n\nImport the package using,\n```julia\nusing RoentgenPlots\n```\n\nThe two main\
  \ function are:\n```julia\nplot_bld(args...; kwargs...)\n```\nTo plot the geometry of beam-limiting\
  \ devices. Currently supported devices are:\n\n- Multi-Leaf Collimator\n- Jaws\n- Bixels\n\n```julia\n\
  axes_lims!(args...; kwargs...)\n```\nTo set the axes limits of the figure based on the geometry of the\
  \ beam-limiting device.\n\nSee the example [notebook](https://github.com/lmejn/RoentgenPlots.jl/blob/main/examples/Plotting%20Beam%20Limiting%20Devices.ipynb)\
  \ for usage.\n\n\n"

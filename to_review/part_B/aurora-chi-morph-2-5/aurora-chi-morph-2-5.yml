readme_excerpt: "<h1 align=\"center\">\U0001F9E0 chimorph-align — CHI-MORPH 2.5</h1>\n\n<p align=\"center\"\
  ><b>Spine-cranium alignment in Chiari II / spina bifida aperta</b><br/>\na unified <b>prenatal → postnatal</b>\
  \ posterior-fossa / hindbrain morphometric\n<b>research platform</b>, trained on real fetal &amp; neonatal\
  \ MRI atlases.</p>\n\n<p align=\"center\">\n<img alt=\"research use only\" src=\"https://img.shields.io/badge/RESEARCH%20USE%20ONLY-d62728?style=flat-square\"\
  />\n<img alt=\"python\" src=\"https://img.shields.io/badge/python-3.10%2B-3776ab?style=flat-square&logo=python&logoColor=white\"\
  />\n<img alt=\"tests\" src=\"https://img.shields.io/badge/tests-57%20passing-2ca02c?style=flat-square\"\
  />\n<img alt=\"ruff\" src=\"https://img.shields.io/badge/lint-ruff%20clean-46a2f1?style=flat-square\"\
  />\n<img alt=\"interfaces\" src=\"https://img.shields.io/badge/CLI%20%C2%B7%20API%20%C2%B7%20portal%20%C2%B7%20npm%20%C2%B7%20docker-555?style=flat-square\"\
  />\n<img alt=\"license\" src=\"https://img.shields.io/badge/license-MIT-green?style=flat-square\"/>\n\
  </p>\n\n<p align=\"center\"><img alt=\"cerebellar growth normal vs SBA\" src=\"docs/assets/growth_cerebellum.png\"\
  \ width=\"62%\"/></p>\n\n> **RESEARCH USE ONLY.** This tool produces quantitative geometry for research.\n\
  > It is **not** a medical device and **not** a diagnosis, prognosis, or treatment\n> recommendation.\n\
  \n### One command, cool output\n\n```text\n$ chimorph                         # (or: npx chimorph-align\
  \ summary)\n======================================================================\n|   __ _  _ ___\
  \    _  _ ___ ___ ___ _  _                             |\n|  / _| || |_ _|__| \\| | _ \\ _ \\ _ \\ ||\
  \ |                            |\n| | (_| __ || |___| .` |   /  _/  _/ __ |                        \
  \    |\n|  \\__|_||_|___|  |_|\\_|_|_\\_| |_| |_||_|                            |\n| CHI-MORPH 2.5 \
  \ spine-cranium alignment in CM-II / spina bifida     |\n======================================================================\n\
  \  * datasets verified: 4    measurements: 948    metrics: 22    groups: 5\n\n  cerebellar volume (mL)\
  \ vs gestational age\n   16.8 |                                              *  *  *\n   10.6 |    \
  \                              *  *  *\n    7.5 |                            *        o  o  o\n    4.4\
  \ |          *  *  *     o  o  o\n    1.3 |o  o  o  o     o  o\n        +-----------------------------------------------------\n\
  \        GA 21                                            38 wk\n        * normal (CRL)   o SBA (Fidon)\n\
  \n  headline (normal vs SBA @ GA28):\n    cerebellar volume      normal  5.94 mL   SBA  3.17 mL   -47%\n\
  \    ventricle/brain ratio  normal  0.023     SBA  0.101     +337%\n  -> mechanistic CSF-distension\
  \ deficit (SBA): ~47% (R2 0.86-0.99)\n```\n\n<table>\n<tr>\n<td><img src=\"docs/assets/repair_counterfactual.png\"\
  \ alt=\"repair counterfactual\"/></td>\n<td><img src=\"docs/assets/phenotype_space.png\" alt=\"phenotype\
  \ space\"/></td>\n</tr>\n<tr>\n<td align=\"center\"><sub>Mechanistic CSF-distension ODE + in-utero-repair\
  \ counterfactual</sub></td>\n<td align=\"center\"><sub>Developmental phenotype space (normal vs SBA)</sub></td>\n\
  </tr>\n</table>\n\nThis is a comprehensive, real-data rebuild of CHI-MORPH module 2.5, scaled into a\n\
  full **research platform**: a reproducible pipeline from open atlases to fitted\ntrajectories, novel\
  \ temporal/spatial analyses, an interactive **web portal**, a\nprogrammatic **REST API + SDK**, downloadable\
  \ **derived data products**, and 12\nexecuted notebooks. See [`docs/platform.md`](docs/platform.md).\n\
  \nBeyond the scalar morphometry it adds: a **morphometric maturation-age** model\n(developmental-delay\
  \ gap), **allometric scaling** (the normal cerebellar growth\nspurt is lost in SBA), **growth velocity**,\
  \ a **developmental phenotype space**,\n**deformation-based morphometry** producing a downloadable SBA-vs-normal\n\
  **divergence atlas**, multivariate/conformal deviation, shape models, hemispheric\nasymmetry, and a\
  \ diffusion (FA) arm.\n\n---\n\n## What it answers\n\nA clinician/researcher question: *how abnormal\
  \ is the spine-cranium / posterior\nfossa configuration in CM-II + spina bifida at 24 GW vs 32 GW vs\
  \ the neonate, and\nwhat does fetal repair change?* The tool gives, across gestational age:\n\n1. **Posterior-fossa\
  \ development constraints** — cerebellar, brainstem, vermian\n   and hindbrain volumetrics; a local\
  \ **crowding index** and **CSF-reserve\n   fraction**; a convex-hull **hindbrain packing** (shape compactness)\
  \ metric.\n2. **Ventriculomegaly / hindbrain-crowding proxies** — lateral-ventricle volume\n   and ventricle/brain\
  \ ratio.\n3. **Craniovertebral alignment evolution** — brainstem verticalisation and\n   centerline\
  \ kink, **hindbrain descent** (cerebellar inferior extent below the\n   brainstem / foramen-magnum proxy),\
  \ cerebellar-vs-brainstem centroid drop, and\n   (from the SBA atlas's own landmarks) the **cerebellar-brainstem\
  \ junction**,\n   **4th-ventricle dorsal recess** and **tectal** geometry.\n\nEach metric becomes a\
  \ **gestational-age growth curve with a credible interval**\nand a per-timepoint / per-subject **deviation\
  \ score**.\n\n## Headline real results (computed by the tool, not asserted)\n\nFrom 765 morphometric\
  \ measurements over the three atlases:\n\n| Finding | Result | Source |\n|---|---|---|\n| Cerebellar\
  \ hypoplasia in SBA | **−52% at 24 GW, −38% at 32 GW** vs normal | CRL vs Fidon |\n| Ventriculomegaly\
  \ in SBA | **+765% at 24 GW, +564% at 32 GW** (ventricle/brain) | CRL vs Fidon |\n| Hindbrain descent\
  \ (CM-II herniation) | normal ≈ −11 mm vs SBA ≈ −2 mm at 24 GW (cerebellum sits ~9 mm lower) | CRL vs\
  \ Fidon |\n| Operated-cohort descent trend | descends toward the normal range at later GA (cf. MOMS-trial\
  \ reversal of hindbrain herniation) | Fidon operated arm |\n\nThese are quantitative geometry only —\
  \ see *Intended use* and *Known limitations*.\n\n## Real data (all open, fetched on demand, SHA-256\
  \ verified)\n\n| Dataset | What | License | Source |\n|---|---|---|---|\n| **CRL normal fetal STA**\
  \ | normal spatio-temporal atlas, GA 21–38 wk, regional (AAL) + tissue parcellation | research use (CRL)\
  \ | Harvard Dataverse `doi:10.7910/DVN/WE9JVR` |\n| **Fidon SBA fetal atlas** | spina-bifida-aperta\
  \ atlas, GA 21–34 wk, **operated + notoperated**, srr + parcellation + landmarks | CC0 1.0 | Zenodo\
  \ `5524312` |\n| **OSBA neonatal** | neonatal **post-repair** atlas, T2/FA + tissue priors | CC BY-(NC/SA)\
  \ | Zenodo `11469304` |\n| CRL DTI/DWI (optional) | fetal diffusion atlas | research use (CRL) | Harvard\
  \ Dataverse `doi:10.7910/DVN/NSLXC4` |\n\nNo synthetic data is used anywhere. Every label scheme was\
  \ decoded from the\nreleased files (see `labels.py`); the Fidon 8-tissue parcellation\n(`1=WM 2=ventricles\
  \ 3=cerebellum 4=eCSF 5=cortical-GM 6=deep-GM 7=brainstem\n8=corpus-callosum`) and the landmark identities\
  \ are taken from the atlas source.\n\n## Run it anywhere\n\nThe fitted model ships in the package (bundled\
  \ checkpoints), so the platform +\nweb portal run with **no data download**:\n\n```bash\n# Python\n\
  pip install -e \".[serve]\" && chimorph serve       # -> http://127.0.0.1:8025\npython -m chimorph_align\
  \                           # same, module entrypoint\n./run.sh            # or  ./run.ps1         \
  \       # venv + install + serve, one command\ndocker build -t chimorph-align . && docker run --rm -p\
  \ 8025:8025 chimorph-align\n\n# npm (Node launcher boots the Python platform; needs Python 3.10+ on\
  \ PATH)\nnpx chimorph-align                                 # serve the portal (PORT env or 8025)\n\
  npm install -g . && chimorph-align                 # global install\nnpm start                     \
  \                     # = serve;  npm run report / demo / mechanism\n```\n\nOpen `/` for the interactive\
  \ portal; `/methods` lists every endpoint;\nimage-dependent endpoints abstain cleanly until `chimorph\
  \ fetch` pulls the atlases.\n\n### AURORA launcher\nRegistered in the AURORA launcher (`aurora-launch`)\
  \ as a web-python app:\n\n```bash\naurora install aurora-chi-morph-2.5      # clone + isolated venv\
  \ (.[serve])\naurora launch  aurora-chi-morph-2.5      # -> uvicorn chimorph_align.api:app on a managed\
  \ port\n```\n\nThe package is launcher-native: `chimorph_align/server.py` (uvicorn auto-detect),\n`__main__.py`\
  \ (`python -m`), the `chimorph-serve` console script, and a curated\n`start_cmd`/`web_port` in the registry.\
  \ See [`docs/deploy.md`](docs/deploy.md).\n\n## Install\n\n```bash\npip install -e .               \
  \  # core\npip install -e \".[serve]\"        # + FastAPI/uvicorn\npip install -e \".[registration]\"\
  \ # + SimpleITK (for subject scoring)\npip install -e \".[dev]\"          # + pytest/ruff\n```\n\n##\
  \ Quickstart\n\n```bash\nchimorph status                  # show real-data fetch/verify status\nchimorph\
  \ fetch                   # download the atlases (open, no login)\nchimorph train                  \
  \ # extract morphometry + fit trajectories\nchimorph compare                 # normal-vs-SBA divergence\
  \ table\nchimorph validate                # leave-one-GA-out cross-validation of the curves\nchimorph\
  \ diffusion               # posterior-fossa FA trajectory (CRL DWI arm)\nchimorph analyze          \
  \       # brain-age + allometry + velocity + phenotype\nchimorph build-atlas             # build the\
  \ SBA-vs-normal divergence atlas (NIfTI)\nchimorph demo                    # GA-resolved abnormality\
  \ + repair trend\nchimorph report --out card.json  # full governed research card\nchimorph figures --out\
  \ out/      # growth curves + abnormality heatmap\nchimorph serve --port 8025       # FastAPI service\
  \ + interactive web portal at /\n# score your own fetal MRI (needs SimpleITK):\nchimorph score --t2\
  \ subject_T2.nii.gz --ga 28 --atlas crl\n```\n\n### Notebooks\nA comprehensive 9-notebook walkthrough\
  \ lives in [`notebooks/`](notebooks/README.md)\n(data & atlases, posterior-fossa morphometry, ventricular\
  \ system, craniovertebral\nalignment, growth curves + cross-validation, deviation/multivariate/conformal,\n\
  normal-vs-SBA + repair, shape models/asymmetry/diffusion, subject scoring). Build\nthem with `python\
  \ notebooks/build.py`.\n\n## How it works\n\n```\ndata/        fetch-or-abstain (Zenodo + Dataverse)\
  \ -> GA-indexed atlas loaders\nlabels.py    decoded label schemes for all three atlases (atlas-agnostic\
  \ compartments)\nmorphometry/ compartments, volumetrics, craniovertebral alignment, L-R asymmetry\n\
  shape/       statistical shape model (SDF-PCA) of cerebellum / 4th ventricle\ntrajectory/  GA growth\
  \ curves (GP/poly) + deviation + leave-one-GA-out CV\n             + multivariate Mahalanobis / conformal\
  \ abstention\nnormative/   normal-vs-SBA divergence, abnormality, repair effect, diffusion (FA) arm\n\
  analysis/    brain-age, allometry, growth velocity, phenotype PCA, DBM (Jacobian)\natlasbuild/  derived\
  \ data products (SBA-vs-normal divergence atlas + catalog)\npipeline/    atlas_fit (training) + subject\
  \ scoring (register -> propagate -> measure)\nsafety/      fail-closed RUO governance + negation-aware\
  \ language gate + audit chain\nreport/      governed summary card + matplotlib figures\nweb/       \
  \  interactive single-file research portal (served by the API at /)\nnotebooks/   12 executed notebooks\
  \ across all areas\ncli.py  api.py\n```\n\n### Modern quantitative-imaging methods\n- **Radiomics (IBSI)**\
  \ — first-order + 3-D GLCM/Haralick texture (Zwanenburg 2020):\n  SBA cerebellar tissue is texturally\
  \ more disordered (↑ entropy/contrast).\n- **Kendall shape-space geodesic regression** — generalised\
  \ Procrustes + Principal\n  Geodesic Analysis + geodesic regression vs GA (Kendall 1984; Fletcher 2004;\n\
  \  Niethammer 2011): pose/size-invariant shape divergence peaks mid-gestation.\n- **Topological data\
  \ analysis** — cubical persistent homology (pure-NumPy\n  union-find) of the cerebellar SDF: the SBA\
  \ cerebellum is topologically simpler.\n\n### Mechanistic & advanced-analytical methods\n- **Mechanistic\
  \ CM-II dynamical model** — the McLone–Knepper CSF-distension theory\n  as a coupled ODE, calibrated\
  \ to both groups from a common origin with the\n  distension signal as the *only* group difference:\
  \ a single fitted **~47%\n  distension deficit** reproduces small PF + cerebellar hypoplasia (R² 0.86–0.99),\n\
  \  with an **in-utero-repair counterfactual** predicting partial reversal of descent.\n- **Phase"

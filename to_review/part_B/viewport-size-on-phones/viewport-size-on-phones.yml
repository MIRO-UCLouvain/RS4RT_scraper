readme_excerpt: "<h1 align=\"center\">\U0001F4F1 Viewport Size on Phones</h1>\n\n<p align=\"center\">A\
  \ small playground demonstrating why <code>100vh</code> misbehaves on mobile browsers — and how the\
  \ newer dynamic viewport units (<code>svh</code> / <code>lvh</code> / <code>dvh</code>) fix it.</p>\n\
  \n<p align=\"center\">\n  <a href=\"https://viewport-size-playground.netlify.app/\"><img src=\"https://img.shields.io/badge/▶%20Live%20Demo-Open-FF4D00?style=for-the-badge\"\
  \ alt=\"Live Demo\"></a>\n</p>\n\n<p align=\"center\">\n  <img src=\"https://img.shields.io/badge/React-61DAFB?logo=react&logoColor=black\"\
  >\n  <img src=\"https://img.shields.io/badge/Vite-646CFF?logo=vite&logoColor=white\">\n  <img src=\"\
  https://img.shields.io/badge/Sass-CC6699?logo=sass&logoColor=white\">\n</p>\n\n## About\n\n`vh` and\
  \ `vw` are great for full-screen layouts — until mobile browsers (especially Safari/iOS) start hiding\
  \ and showing their toolbars and `100vh` jumps around. This playground puts the classic and modern viewport\
  \ units side by side so you can see the difference on a real device:\n\n- `vh` — the original, problematic\
  \ on mobile\n- `svh` — **small** viewport height (toolbars visible)\n- `lvh` — **large** viewport height\
  \ (toolbars hidden)\n- `dvh` — **dynamic** viewport height (adjusts as you scroll)\n\n## Run locally\n\
  \n```bash\nnpm install\nnpm run dev      # http://localhost:5173\nnpm run build    # production build\n\
  ```\n\n---\n\n<p align=\"center\"><i>by Esteban Acuña · <a href=\"https://estebanacuna.dev\">estebanacuna.dev</a></i></p>\n"

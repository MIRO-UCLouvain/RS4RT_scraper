readme_excerpt: '# Breast Cancer Segmentation using U-Net


  ## Overview


  This project implements a U-Net-based deep learning model for breast tumor segmentation on ultrasound
  images using the BUSI dataset.


  The project was completed as a study project to understand:


  - Medical Image Segmentation

  - U-Net Architecture

  - Encoder-Decoder Networks

  - Skip Connections

  - Dice Loss

  - Deep Learning for Computer Vision


  ## Dataset


  BUSI (Breast Ultrasound Images Dataset)


  The dataset contains benign, malignant, and normal breast ultrasound images along with corresponding
  ground truth masks for segmentation.


  ## Technologies Used


  - Python

  - TensorFlow / Keras

  - NumPy

  - OpenCV

  - Matplotlib

  - Scikit-Learn


  ## Model


  - Architecture: U-Net

  - Input Size: 128 × 128

  - Loss Function: Binary Cross Entropy + Dice Loss

  - Evaluation Metric: Dice Coefficient


  ## Results


  Best Validation Dice Score: 0.656


  ### Sample Prediction


  ![Sample Prediction](results/prediction_3.png)


  ## Learning Outcome


  This project helped me understand the complete workflow of medical image segmentation, including data
  preprocessing, model development, training, evaluation, and prediction using U-Net.

  '

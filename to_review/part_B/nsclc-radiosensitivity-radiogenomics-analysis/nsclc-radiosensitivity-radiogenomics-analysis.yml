readme_excerpt: "# NSCLC radiosensitivity radiogenomics analysis\n\nThis repository contains the analysis\
  \ code accompanying a study of a cell line-anchored radiosensitivity-associated molecular score (CRS),\
  \ its pathway-level molecular architecture in non-small cell lung cancer, and a computed-tomography\
  \ radiomic surrogate (RRS).\n\nThe repository is organized as a reproducible research-code release rather\
  \ than a copy of the original interactive analysis directory. Superseded scripts, exploratory tests,\
  \ temporary workspaces, raw data, patient-level derived data, and machine-specific paths have been removed.\
  \ The curation criteria are recorded in `docs/code_curation.md`.\n\n## Scope of the code\n\nThe code\
  \ supports the following analyses:\n\n1. construction and repeated nested-cross-validation of the cell-line\
  \ CRS;\n2. application of the CRS to the NSCLC-Radiogenomics transcriptomic cohort;\n3. predefined-module\
  \ and Hallmark pathway analyses;\n4. preprocessing of CT images and tumor segmentations;\n5. PyRadiomics\
  \ feature extraction and RRS model development;\n6. full-workflow permutation analyses for CRS and RRS\
  \ performance;\n7. tumor-size adjustment of the RRS-CRS association;\n8. Lung3 molecular replication;\n\
  9. exploratory Lung1 survival analyses and radiomic domain-shift diagnostics;\n10. generation of main\
  \ and supplementary figure source data.\n\nThe CRS is a cell line-anchored radiosensitivity-associated\
  \ molecular phenotype. The RRS is evaluated as a CT radiomic surrogate of that phenotype. The Lung1\
  \ analyses are exploratory and do not constitute external clinical validation of the RRS.\n\n## Repository\
  \ structure\n\n```text\nR/\n├── 01_cell_line/                 RadioGx acquisition and CRS development\n\
  ├── 02_nsclc_radiogenomics/       patient transcriptome preparation and CRS calculation\n├── 03_radiomics/\
  \                 CT metadata, data integration, and RRS development\n├── 04_lung1/                \
  \     Lung1 application, survival, and domain shift\n├── 05_pathways/                  pathway scoring\
  \ and Lung3 replication\n├── 06_sensitivity_analyses/      permutation and tumor-size analyses\n├──\
  \ 07_figures/                   main-figure generation\n└── 08_supplementary/             supplementary\
  \ tables and figure panels\n\npython/\n├── 01_nsclc_radiomics/           NSCLC-Radiogenomics feature\
  \ extraction\n├── 02_lung1_preprocessing/       DICOM, SEG, NRRD, and tumor-mask processing\n└── 03_lung1_radiomics/\
  \           Lung1 feature extraction\n\nenvironment/                      dependency installation and\
  \ environment capture\nconfig/                           environment-variable example\ndata/       \
  \                      data-access documentation only\ndocs/                             workflow and\
  \ release documentation\ntools/                            repository validation\n```\n\n## Configuration\n\
  \nThe code repository and the analysis workspace are intentionally separate. Set the following environment\
  \ variables before running the analysis:\n\n```text\nRADIOGENOMICS_PROJECT_DIR=/absolute/path/to/analysis-workspace\n\
  LUNG1_DATA_DIR=/absolute/path/to/lung1-workspace\n```\n\nR example:\n\n```r\nSys.setenv(\n  RADIOGENOMICS_PROJECT_DIR\
  \ = \"/absolute/path/to/analysis-workspace\",\n  LUNG1_DATA_DIR = \"/absolute/path/to/lung1-workspace\"\
  \n)\n```\n\nShell example:\n\n```bash\nexport RADIOGENOMICS_PROJECT_DIR=/absolute/path/to/analysis-workspace\n\
  export LUNG1_DATA_DIR=/absolute/path/to/lung1-workspace\n```\n\nThe expected workspace structure is\
  \ documented in `docs/workspace_layout.md`.\n\n## Software dependencies\n\nInstall the R dependencies\
  \ from the repository root:\n\n```r\nsource(\"environment/install_r_dependencies.R\")\n```\n\nInstall\
  \ the standard Python dependencies with:\n\n```bash\npython -m pip install -r environment/requirements.txt\n\
  ```\n\nSeveral Lung1 segmentation scripts are designed to run in the Python environment bundled with\
  \ 3D Slicer. These scripts import `slicer`, `vtk`, or `DICOMLib` and should not be run in a standard\
  \ Python interpreter. The analysis used 3D Slicer 5.12.2.\n\nAfter completing the analysis, capture\
  \ the software environment with:\n\n```r\nsource(\"environment/capture_environment.R\")\n```\n\n```bash\n\
  python environment/capture_environment.py\n```\n\n## Execution order\n\nThe full execution order and\
  \ the principal inputs and outputs are listed in `docs/pipeline.md`. Scripts are numbered within each\
  \ analysis stage. Figure scripts should be run only after their corresponding analysis outputs have\
  \ been generated.\n\nThe computationally intensive permutation scripts are resume-safe. The RRS permutation\
  \ analysis recovers the archived outer-fold assignments, defines reproducible inner folds, and uses\
  \ the same frozen split system for the observed and permuted analyses. The prespecified primary permutation\
  \ test uses the positive upper tail; a doubled-tail two-sided sensitivity result is also reported.\n\
  \n## Data availability\n\nNo raw or derived participant-level data are included. Public data sources\
  \ and access requirements are summarized in `data/README.md`. The source repositories retain control\
  \ over their data-use terms.\n\n## Repository validation\n\nRun the static repository checks from the\
  \ repository root:\n\n```bash\npython tools/validate_repository.py\n```\n\nThe validation script checks\
  \ repository structure, English-only text and filenames, excluded file types, local absolute paths,\
  \ Python syntax, basic R delimiter balance, dependency declarations, and common release artifacts. A\
  \ successful static check does not replace end-to-end execution in the original data environment. The\
  \ completed static review is summarized in `VALIDATION_REPORT.md`; `MANIFEST.tsv` records file sizes\
  \ and SHA-256 checksums for the release contents.\n\n## Releasing the code\n\nThe recommended manuscript-release\
  \ workflow is:\n\n1. create a public GitHub repository;\n2. complete and rename `CITATION.cff.template`\
  \ to `CITATION.cff`;\n3. complete `.zenodo.json.template` and `CODE_AVAILABILITY.md`;\n4. run the repository\
  \ validator and the full analysis in the author environment;\n5. create a tagged GitHub release, such\
  \ as `v1.0.0`;\n6. archive that release through the Zenodo GitHub integration;\n7. cite the version-specific\
  \ DOI in the manuscript.\n\nDetailed release instructions are in `docs/github_zenodo_release.md`.\n\n\
  ## License\n\nThe analysis code is released under the MIT License. The datasets, software packages,\
  \ and third-party resources used by the analysis remain subject to their own licenses and terms of use.\n"

readme_excerpt: "<h1 align=\"center\">\U0001F9B7 React Dental CBCT Viewer</h1>\n\n<p align=\"center\"\
  >\n  <b>Dental CBCT/CT DICOM viewer with panoramic (OPG) reconstruction, cross-sections and 3D implant\
  \ planning</b>\n</p>\n\n<p align=\"center\">\n  <img src=\"https://img.shields.io/badge/React-18.3-61DAFB?style=flat-square&logo=react\"\
  \ />\n  <img src=\"https://img.shields.io/badge/TypeScript-5.5-3178C6?style=flat-square&logo=typescript\"\
  \ />\n  <img src=\"https://img.shields.io/badge/Vite-5.4-646CFF?style=flat-square&logo=vite\" />\n \
  \ <img src=\"https://img.shields.io/badge/Cornerstone3D-2.0-FF6B35?style=flat-square\" />\n  <img src=\"\
  https://img.shields.io/badge/Tailwind_CSS-3.4-06B6D4?style=flat-square&logo=tailwindcss\" />\n  <img\
  \ src=\"https://img.shields.io/badge/Vitest-tested-6E9F18?style=flat-square&logo=vitest\" />\n</p>\n\
  \n<p align=\"center\">\n  <b>\U0001F310 <a href=\"#-english\">English</a> · <a href=\"#-deutsch\">Deutsch</a>\
  \ · <a href=\"#-español\">Español</a> · <a href=\"#-magyar\">Magyar</a></b>\n</p>\n\n---\n\n# \U0001F1EC\
  \U0001F1E7 English\n\n## \U0001F9B7 React Dental CBCT Viewer\n\nDental CBCT/CT DICOM viewer and implant\
  \ planning application. Runs standalone and can be integrated as a git submodule into the **DentalQuoteCreator**\
  \ system.\n\n### ✨ Features\n\n| | Feature | Description |\n|---|---------|-------------|\n| \U0001F4C2\
  \ | **DICOM Loading** | Drag & drop file import, series recognition, progress tracking |\n| \U0001F5A5\
  ️ | **2D MPR Views** | Axial, coronal, sagittal planes with real-time navigation |\n| \U0001F39B️ |\
  \ **Window/Level** | 6 presets (Bone, Soft Tissue, Lung, Brain, Dental, Implant) + mouse drag |\n| \U0001F4D0\
  \ | **Measurement Tools** | Length, angle, elliptical/circle/rectangle ROI, freehand, HU probe, arrow\
  \ |\n| \U0001F9B4 | **Panoramic OPG** | Curved planar reformation with 9-point CatmullRom spline |\n\
  | \U0001F52A | **Cross-Section** | Perpendicular slice to arch curve, tiltable along the arch (±30°)\
  \ |\n| \U0001F529 | **3D Implant Planning** | True 3D body: every view renders its own plane intersection;\
  \ full ±180° rotation (lower/upper jaw), diameter 3–6 mm, length 6–16 mm, draggable on cross-section\
  \ and panoramic |\n| \U0001F5C2️ | **Layers Panel** | Right slide-in panel: implants and measurements\
  \ as layers — show/hide, edit (pop-up), delete, rename |\n| \U0001F310 | **4-language UI** | English,\
  \ German, Spanish and Hungarian with a top-bar language selector |\n| \U0001F313 | **Dark/light mode**\
  \ | Theme toggle in the top bar; settings and help slide-in panels |\n| \U0001F5BC️ | **PNG Export**\
  \ | Save panoramic and cross-section images |\n| ⌨️ | **Keyboard Shortcuts** | W/L, Pan, Zoom, Scroll,\
  \ measurement tools at a keystroke |\n| \U0001F4CF | **Layouts** | 1×1, 2×2, 1+3, Panoramic 1×2, Panoramic\
  \ 2+1 |\n\n### \U0001F6E0️ Installation & Running\n\n```bash\n# Install dependencies\nnpm install\n\n\
  # Start dev server (port 3340)\nnpm run dev\n\n# Run tests (Vitest)\nnpm test\n\n# Production build\n\
  npm run build\n```\n\n### \U0001F4C1 Project Structure\n\n```\nsrc/\n├── components/          # React\
  \ UI components\n│   ├── layout/          #   Toolbar, ViewerShell\n│   ├── viewport/        #   2D,\
  \ 3D, MPR, Panoramic, Cross-Section\n│   ├── implant/         #   Implant overlays, shape, pop-up editor\n\
  │   ├── layers/          #   Layers panel\n│   ├── panoramic/       #   Arch curve editor\n│   └── tools/\
  \           #   Window/Level controls\n├── context/             # Global state management (React Context\
  \ + useReducer)\n├── core/                # DICOM loading, CPR + implant geometry, tool manager\n├──\
  \ types/               # TypeScript type definitions\n├── workers/             # Web Worker for DICOM\
  \ decoding\n└── hooks/               # Custom React hooks\ntests/                   # Vitest suite (CPR\
  \ & implant geometry)\n```\n\n### \U0001F3D7️ Tech Stack\n\n| Layer | Technology |\n|-------|-----------|\n\
  | Framework | React 18 + TypeScript 5.5 |\n| Build | Vite 5.4 |\n| Styling | Tailwind CSS 3.4 |\n| DICOM\
  \ | Cornerstone3D v2 + dicom-parser |\n| State | React Context + useReducer |\n\n### \U0001F527 Key\
  \ Architecture Decisions\n\n- **Canvas-based OPG/Cross-Section** — Direct canvas rendering instead of\
  \ Cornerstone StackViewport for custom CPR views\n- **Arc-length reparameterization** — Eliminates panoramic\
  \ distortion from uneven control point spacing\n- **3D implant model** — World position + apex axis;\
  \ each view (cross-section, panoramic, axial) renders the true plane∩body intersection\n- **Pure, testable\
  \ geometry core** — `cprMath.ts` / `implantGeometry.ts` have no Cornerstone dependency and are covered\
  \ by the Vitest suite\n- **ES Module Web Worker** — Custom decoder worker with static JS imports and\
  \ lazy WASM codec loading\n- **SharedArrayBuffer** — COOP/COEP headers enabled for multi-threaded DICOM\
  \ decoding\n\n### \U0001F9EA Tests\n\nGeometry is verified with a linear-field trick: trilinear interpolation\
  \ of a linear voxel field is exact, so each output pixel decodes the world position it was sampled at\
  \ — the engine's sampling can be compared against the promised plane to sub-micron precision.\n\n```bash\n\
  npm test         # run the Vitest suite once\nnpm run test:watch\n```\n\n### ⌨️ Keyboard Shortcuts\n\
  \n| Key | Tool | | Key | Tool |\n|-----|------|---|-----|------|\n| `W` | Window/Level | | `L` | Length\
  \ |\n| `P` | Pan | | `A` | Angle |\n| `Z` | Zoom | | `E` | Elliptical ROI |\n| `S` | Scroll | | `C`\
  \ | Circle ROI |\n| `X` | Crosshairs | | `R` | Rectangle ROI |\n| `F` | Freehand | | `B` | Bidirectional\
  \ |\n| `H` | HU Probe | | `N` | Arrow |\n\n---\n\n# \U0001F1E9\U0001F1EA Deutsch\n\n## \U0001F9B7 React\
  \ Dental CBCT Viewer\n\nDentaler CBCT/CT-DICOM-Viewer und Implantatplanungs-Anwendung. Läuft eigenständig\
  \ und kann als Git-Submodul in das **DentalQuoteCreator**-System integriert werden.\n\n### ✨ Funktionen\n\
  \n| | Funktion | Beschreibung |\n|---|----------|-------------|\n| \U0001F4C2 | **DICOM-Import** | Drag\
  \ & Drop, Serienerkennung, Fortschrittsanzeige |\n| \U0001F5A5️ | **2D-MPR-Ansichten** | Axiale, koronale,\
  \ sagittale Ebenen mit Echtzeit-Navigation |\n| \U0001F39B️ | **Fenster/Ebene** | 6 Voreinstellungen\
  \ (Knochen, Weichgewebe, Lunge, Gehirn, Dental, Implantat) + Maus |\n| \U0001F4D0 | **Messwerkzeuge**\
  \ | Strecke, Winkel, Ellipse/Kreis/Rechteck-ROI, Freihand, HU-Sonde, Pfeil |\n| \U0001F9B4 | **Panorama-OPG**\
  \ | Gebogene Ebenenrekonstruktion mit 9-Punkt-CatmullRom-Kurve |\n| \U0001F52A | **Querschnitt** | Senkrechter\
  \ Schnitt zur Bogenkurve, entlang des Bogens kippbar (±30°) |\n| \U0001F529 | **3D-Implantatplanung**\
  \ | Echter 3D-Körper: jede Ansicht zeigt ihren eigenen Ebenenschnitt; volle ±180°-Rotation (Unter-/Oberkiefer),\
  \ Durchmesser 3–6 mm, Länge 6–16 mm, verschiebbar im Querschnitt und Panorama |\n| \U0001F5C2️ | **Ebenen-Panel**\
  \ | Rechts einfahrendes Panel: Implantate und Messungen als Ebenen — ein-/ausblenden, bearbeiten (Pop-up),\
  \ löschen, umbenennen |\n| \U0001F310 | **4-sprachige UI** | Englisch, Deutsch, Spanisch und Ungarisch\
  \ mit Sprachauswahl in der oberen Leiste |\n| \U0001F313 | **Dunkel-/Hellmodus** | Theme-Umschalter\
  \ in der oberen Leiste; Einstellungs- und Hilfe-Panels |\n| \U0001F5BC️ | **PNG-Export** | Panorama-\
  \ und Querschnittbilder speichern |\n| ⌨️ | **Tastenkürzel** | W/L, Pan, Zoom, Scroll, Messwerkzeuge\
  \ per Tastendruck |\n| \U0001F4CF | **Layouts** | 1×1, 2×2, 1+3, Panorama 1×2, Panorama 2+1 |\n\n###\
  \ \U0001F6E0️ Installation und Ausführung\n\n```bash\n# Abhängigkeiten installieren\nnpm install\n\n\
  # Entwicklungsserver starten (Port 3340)\nnpm run dev\n\n# Tests ausführen (Vitest)\nnpm test\n\n# Produktions-Build\n\
  npm run build\n```\n\n### \U0001F4C1 Projektstruktur\n\n```\nsrc/\n├── components/          # React-UI-Komponenten\n\
  │   ├── layout/          #   Toolbar, ViewerShell\n│   ├── viewport/        #   2D, 3D, MPR, Panorama,\
  \ Querschnitt\n│   ├── implant/         #   Implantat-Overlays, Form, Pop-up-Editor\n│   ├── layers/\
  \          #   Ebenen-Panel\n│   ├── panoramic/       #   Bogenkurven-Editor\n│   └── tools/       \
  \    #   Fenster/Ebene-Steuerung\n├── context/             # Globale Zustandsverwaltung (React Context\
  \ + useReducer)\n├── core/                # DICOM-Laden, CPR- + Implantat-Geometrie, Werkzeugmanager\n\
  ├── types/               # TypeScript-Typdefinitionen\n├── workers/             # Web Worker für DICOM-Dekodierung\n\
  └── hooks/               # Eigene React-Hooks\ntests/                   # Vitest-Tests (CPR- & Implantat-Geometrie)\n\
  ```\n\n### ⌨️ Tastenkürzel\n\n| Taste | Werkzeug | | Taste | Werkzeug |\n|-------|----------|---|-------|----------|\n\
  | `W` | Fenster/Ebene | | `L` | Strecke |\n| `P` | Verschieben | | `A` | Winkel |\n| `Z` | Zoom | |\
  \ `E` | Ellipse |\n| `S` | Scrollen | | `C` | Kreis |\n| `X` | Fadenkreuz | | `R` | Rechteck |\n| `F`\
  \ | Freihand | | `B` | Bidirektional |\n| `H` | HU-Sonde | | `N` | Pfeil |\n\n---\n\n# \U0001F1EA\U0001F1F8\
  \ Español\n\n## \U0001F9B7 React Dental CBCT Viewer\n\nVisor DICOM de CBCT/CT dental y aplicación de\
  \ planificación de implantes. Funciona de forma independiente y puede integrarse como submódulo git\
  \ en el sistema **DentalQuoteCreator**.\n\n### ✨ Funciones\n\n| | Función | Descripción |\n|---|---------|-------------|\n\
  | \U0001F4C2 | **Carga DICOM** | Importación por arrastrar y soltar, reconocimiento de series, indicador\
  \ de progreso |\n| \U0001F5A5️ | **Vistas MPR 2D** | Planos axial, coronal y sagital con navegación\
  \ en tiempo real |\n| \U0001F39B️ | **Ventana/Nivel** | 6 preajustes (hueso, tejido blando, pulmón,\
  \ cerebro, dental, implante) + arrastre |\n| \U0001F4D0 | **Herramientas de medición** | Distancia,\
  \ ángulo, ROI de elipse/círculo/rectángulo, mano alzada, sonda HU, flecha |\n| \U0001F9B4 | **Panorámica\
  \ OPG** | Reconstrucción planar curva con spline CatmullRom de 9 puntos |\n| \U0001F52A | **Corte transversal**\
  \ | Corte perpendicular al arco, inclinable a lo largo del arco (±30°) |\n| \U0001F529 | **Planificación\
  \ 3D de implantes** | Cuerpo 3D real: cada vista muestra su propia intersección; rotación completa ±180°\
  \ (mandíbula/maxilar), diámetro 3–6 mm, longitud 6–16 mm, arrastrable en el corte y la panorámica |\n\
  | \U0001F5C2️ | **Panel de capas** | Panel deslizante derecho: implantes y mediciones como capas — mostrar/ocultar,\
  \ editar (pop-up), eliminar, renombrar |\n| \U0001F310 | **Interfaz en 4 idiomas** | Inglés, alemán,\
  \ español y húngaro con selector de idioma en la barra superior |\n| \U0001F313 | **Modo oscuro/claro**\
  \ | Conmutador de tema en la barra superior; paneles de ajustes y ayuda |\n| \U0001F5BC️ | **Exportación\
  \ PNG** | Guardar imágenes panorámicas y de corte |\n| ⌨️ | **Atajos de teclado** | W/L, mover, zoom,\
  \ desplazar y herramientas de medición con una tecla |\n| \U0001F4CF | **Diseños** | 1×1, 2×2, 1+3,\
  \ Panorámica 1×2, Panorámica 2+1 |\n\n### \U0001F6E0️ Instalación y ejecución\n\n```bash\n# Instalar\
  \ dependencias\nnpm install\n\n# Iniciar servidor de desarrollo (puerto 3340)\nnpm run dev\n\n# Ejecutar\
  \ pruebas (Vitest)\nnpm test\n\n# Build de producción\nnpm run build\n```\n\n### ⌨️ Atajos de teclado\n\
  \n| Tecla | Herramienta | | Tecla | Herramienta |\n|-------|-------------|---|-------|-------------|\n\
  | `W` | Ventana/Nivel | | `L` | Distancia |\n| `P` | Mover | | `A` | Ángulo |\n| `Z` | Zoom | | `E`\
  \ | Elipse |\n| `S` | Desplazar | | `C` | Círculo |\n| `X` | Cruz | | `R` | Rectángulo |\n| `F` | Mano\
  \ alzada | | `B` | Bidireccional |\n| `H` | Sonda HU | | `N` | Flecha |\n\n---\n\n# \U0001F1ED\U0001F1FA\
  \ Magyar\n\n## \U0001F9B7 React Dental CBCT Viewer\n\nFogászati CBCT/CT DICOM megjelenítő és implantátum-tervező\
  \ alkalmazás. Önállóan futtatható, később git submodule-ként integrálható a **DentalQuoteCreator** rendszerbe.\n\
  \n### ✨ Funkciók\n\n| | Funkció | Leírás |\n|---|---------|--------|\n| \U0001F4C2 | **DICOM betöltés**\
  \ | Drag & drop fájlimport, sorozat-felismerés, betöltési folyamatjelző |\n| \U0001F5A5️ | **2D MPR\
  \ nézetek** | Axiális, koronális, szagittális síkok valós idejű navigációval |\n| \U0001F39B️ | **Ablak/Szint**\
  \ | 6 preset (Csont, Lágyrész, Tüdő, Agy, Fogászat, Implantátum) + egérhúzás |\n| \U0001F4D0 | **Mérőeszközök**\
  \ | Távolság, szög, ellipszis/kör/téglalap ROI, szabadkézi rajz, HU szonda, nyíl |\n| \U0001F9B4 | **Panoráma\
  \ OPG** | Ívelt síkú rekonstrukció 9 vezérlőpontos CatmullRom görbével |\n| \U0001F52A | **Keresztmetszet**\
  \ | Az ívgörbére merőleges szelet, az ív mentén dönthető (±30°) |\n| \U0001F529 | **3D implantátum tervezés**\
  \ | Valódi 3D test: minden nézet a saját sík-metszetét mutatja; ±180° forgatás (alsó/felső állcsont),\
  \ átmérő 3–6 mm, hossz 6–16 mm, húzható a keresztmetszeten és a panorámán |\n| \U0001F5C2️ | **Rétegek\

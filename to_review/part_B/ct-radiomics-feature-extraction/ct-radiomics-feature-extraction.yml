readme_excerpt: "# CT Radiomics Feature Extraction, Fractal Analysis & Deep Features \U0001F9E0\U0001F4C9\
  \U0001F916\n\n![Python](https://img.shields.io/badge/Language-Python-blue.svg) ![License](https://img.shields.io/badge/License-MIT-green.svg)\
  \ ![Medical Imaging](https://img.shields.io/badge/Domain-Medical_Imaging-red.svg) ![Deep Learning](https://img.shields.io/badge/AI-Deep_Learning-orange.svg)\n\
  \n## \U0001F4D6 Overview\n\nThis repository provides a comprehensive pipeline for advanced feature extraction\
  \ from medical images (CT/MRI NIfTI format). It goes beyond standard radiomics by integrating **Frequency\
  \ Domain Analysis**, **Wavelet Transforms**, **Fractal Dimension** calculations, and now **Deep Learning-based\
  \ Feature Extraction (Deep Radiomics)**. This hybrid approach enables a highly robust quantification\
  \ of tumor heterogeneity using both handcrafted and automated deep embeddings.\n\n## ✨ Key Features\n\
  \n1.  **Standard Radiomics**:\n    - Uses `pyradiomics` to extract Shape, First-order statistics, GLCM,\
  \ GLRLM, GLSZM, etc.\n    - Supports batch processing with YAML configuration.\n\n2.  **Advanced Frequency\
  \ & Wavelet Analysis**:\n    - Custom implementation of **FFT (Fast Fourier Transform)** features.\n\
  \    - **Wavelet Transform** (Haar, Db2) decomposition for multi-scale texture analysis.\n    - Extracts\
  \ amplitude spectrum statistics (Energy, Entropy, Centroid).\n\n3.  **Fractal Dimension (FD)**:\n  \
  \  - **3D Box-counting** method for volumetric complexity.\n    - **2D Slice-wise** FD calculation (Axial,\
  \ Sagittal, Coronal planes).\n    - Aggregated statistics (Max, Min, Median FD) for comprehensive tumor\
  \ characterization.\n\n4.  **Deep Radiomics (Neural Network Embeddings) \U0001F195**:\n    - **2D ResNet-50**:\
  \ Extracts robust, hierarchical spatial features using a classic deep Convolutional Neural Network (CNN).\n\
  \    - **2D MaxViT (Multi-Axis Vision Transformer)**: Leverages state-of-the-art attention mechanisms\
  \ to capture both local and global contextual dependencies from 2D tumor slices.\n    - Seamlessly fuses\
  \ traditional handcrafted features with high-dimensional deep embeddings for downstream machine learning\
  \ tasks.\n\n## \U0001F6E0️ Requirements\n\nInstall the necessary dependencies. (Note: GPU is recommended\
  \ for Deep Learning feature extraction).\n\n```bash\npip install numpy pandas scipy SimpleITK pyradiomics\
  \ PyWavelets nibabel tqdm joblib openpyxl torch torchvision timm\n## \U0001F6A7 Project Status / Future\
  \ Updates\n"

readme_excerpt: "<div align=\"center\">\n  <h1>openPR</h1>\n  <p>This plugin analyses the integrated depth\
  \ dose curves recorded by the Giraffe multi-layer ionisation chamber in order to construct a proton\
  \ radiograph, i.e. a 2D-map of the measured proton range. This plugin was developped by Sylvain Deffet\
  \ during his Ph.D. thesis \"Proton radiography to reduce range uncertainty in proton therapy\" at the\
  \ UCLouvain.</p>\n</div>\n\n<hr />\n\n## Official repository\nThis Gitlab repository is unmaintained\
  \ and unused. Here is the official location of the [source code](https://openreggui.org/git/open/REGGUI).\n\
  \n## License\nAPACHE 2.0 © openREGGUI"

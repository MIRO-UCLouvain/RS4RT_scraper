readme_excerpt: '# MTBrainNet

  MTBrainNet is a custom deep learning model developed for **simultaneous brain tumor classification and
  segmentation from MRI images**. The project combines efficient feature extraction and attention-based
  segmentation techniques in a unified architecture.


  ## Features

  * Brain tumor classification (Glioma, Meningioma, Pituitary, No Tumor)

  * Tumor segmentation from MRI images

  * Image preprocessing and normalization

  * Data augmentation

  * Training and evaluation using TensorFlow/Keras

  * Confusion matrix, ROC curves, accuracy/loss graphs, and segmentation outputs included in the notebook


  ## Technologies Used


  * Python

  * TensorFlow / Keras

  * NumPy

  * OpenCV

  * Matplotlib

  * Scikit-learn


  ## Project File

  * `MTBrainNet.ipynb` — complete implementation of the MTBrainNet model, including preprocessing, training,
  evaluation, classification, and segmentation.


  ## Results

  The notebook includes training and validation curves, confusion matrix, ROC analysis, and qualitative
  segmentation results.


  ## Author

  Siri Cholleti



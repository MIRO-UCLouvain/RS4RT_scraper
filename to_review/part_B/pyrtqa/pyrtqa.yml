readme_excerpt: "# pyRTQA \U0001F300\n\n**pyRTQA** is a Quality Assurance (QA) tool for Radiation Therapy.\
  \  \nIt's built using Python and Tkinter, and integrates with [pylinac](https://github.com/jrkerns/pylinac)\
  \ with a structured GUI.\n\n## \U0001F3AF Features\n\n- Analyze CatPhan images (503, 504, 600, 604 supported)\n\
  - Picket Fence - Single and Multiple image analysis, Starshot, Winston-Lutz QA, Field analysis, Leeds\
  \ Phantom support\n- FFF Profile Analysis for AERB compliance\n- User-friendly GUI built with Tkinter\n\
  - EXE version available for non-Python users\n- Modern light-themed interface\n- Robust error handling\n\
  - Automatically creates log files to track application activity and errors\n\n## \U0001F4E6 Installation\n\
  \n### If you're running from source:\n```bash\npip install -r requirements.txt\npython pyRTQA_UI.py\n\
  ```\n\n### If you're using the `.exe`:\nJust follow this link https://drive.google.com/file/d/1kmb3r1L1db_PpofMctI-sevVgeo4oYAZ/view?usp=sharing\
  \ and double-click the `exe` file for  installation!\n\n## Contributing\nContributions are always welcome!\
  \ If you find a bug, have a feature request, or want to improve something, feel free to open an issue\
  \ or submit a pull request.\n\n\n## \U0001F4D8 QA Instructions\n\n### **FFF Analysis - AERB:**\n\n1.\
  \ **RFA Data**\n   - Measure beam profiles with:\n     - Field Size: 20 cm x 20 cm  \n     - Depth:\
  \ 10 cm  \n     - SSD: 90 cm\n   - Normalize to 100% and export to Excel with 2 sheets:\n     - **Inline\
  \ Sheet**: `Inline (cm)` and `Dose (%)` columns  \n     - **Crossline Sheet**: `Crossline (cm)` and\
  \ `Dose (%)` columns  \n   - Include energy and depth info in the file.\n\n2. **2D Image Data**\n  \
  \ - Upload an EPID image (.dcm or .tiff)\n   - Use a 10 cm slab phantom, SSD 90 cm\n   - Enter energy\
  \ and depth info\n\n---\n\n### **Winston-Lutz QA:**\n\n1. Place all `.dcm` images in a folder\n2. Use\
  \ valid filenames like:\n   - `MyWL-gantry0-coll90-couch315.dcm`\n   - `gantry90_stuff_coll45-couch0.dcm`\n\
  \   - `abc-couch45-gantry315-coll0.dcm`\n   - `01-gantry0-abcd-coll30couch10abc.dcm`\n   - `abc-gantry30.dcm`\n\
  \   - `coll45abc.dcm`\n3. Avoid invalid names like:\n   - `gantry=0-coll=90-couch=315.dcm`\n   - `gan45_collimator30-table270.dcm`\n\
  4. Specify the ball bearing size (in mm)\n\n---\n\n### **Picket Fence:**\n\n1. Upload a `.dcm` or `.tiff`\
  \ file\n2. Enter tolerance and action level\n3. For individual leaf analysis:\n   - Check \"Separate\
  \ Leaves\"\n4. For combined analysis:\n   - Leave \"Separate Leaves\" unchecked\n5. Input the expected\
  \ picket gap (in mm)\n   - Only needed for separate leaf mode\n   - You may need to adjust for DLG &\
  \ EPID effects\n---\n\n### **Picket Fence - Batch Analysis**\n1. Place multiple Picket Fence .dcm images\
  \ in a folder.\n2. Each image is analyzed individually.\n3. Summary table and individual results (image,\
  \ histogram) are included in the report.\n4. .dcm format is recommended for best analysis.\n\n---\n\n\
  ### **Starshot:**\n\n1. Upload a `.dcm` or `.tiff` file for analysis\n\n---\n\n### **CatPhantom:**\n\
  \n1. Upload a folder of CBCT/CT `.dcm` images\n\n---\n\n### *Leeds TOR*\n1. Upload a high-quality image\
  \ of the Leeds TOR phantom (.dcm preferred).\n2. Analysis includes low and high contrast resolution\
  \ tests.\n\n---\n\n## \U0001F4C2 Folder Structure\n\n```\npyRTQA/\n├── pyRTQA_UI.py               #\
  \ Main launcher script\n├── gui/                       # Tkinter GUI modules\n│   └── ...\n├── analysis/\
  \                  # QA analysis modules (CatPhan, WL, etc.)\n│   └── ...\n├── logs/               \
  \       # Auto-generated log files\n│   └── pyRTQA.log\n├── dist/                      # Executable\
  \ output from pyinstaller\n│   └── pyRTQA.exe\n├── requirements.txt\n├── LICENSE\n├── CREDITS.md\n├──\
  \ README.md\n├── .gitignore\n└── instructions.txt\n```\n\n## \U0001F6E0️ Technologies\n\n- Python\n\
  - Tkinter\n- pylinac\n\n## \U0001F4DC License\n\nBSD Clause3 License — see [LICENSE](LICENSE)\n\n---\n\
  \n## \U0001F6A7 In Development\n\n- Database support\n- User authentication\n- QA report exporting\n\
  \n---\n\nMade with ❤️ by Sambasivaselli\n"

readme_excerpt: "# FilmQADose\n\n[![License](https://img.shields.io/badge/License-MIT-blue.svg)](LICENSE)\n\
  [![Python](https://img.shields.io/badge/Python-3.9%2B-blue.svg)](#prerequisites)\n\n> **FilmQADose**\
  \ is an open-source software for the analysis of radiochromic films in radiation therapy QA (Quality\
  \ Assurance). It provides intuitive calibration tools and dose map generation to promote accessible\
  \ and efficient quality control.\n\n**Development branch**: [pyside](https://github.com/eduardoh27/FilmQADose/tree/pyside)\
  \ \n\n---\n\n## Key Features \U0001F680\n\n- **Multiple Calibration Methods**: Offers single-channel\
  \ and multi-channel calibration fits.  \n- **2D Dose Map Construction**: Build two-dimensional dose\
  \ maps from scanned film data.  \n- **Correction Methods**: Enhance accuracy and consistency with built-in\
  \ corrections.  \n- **Dose Profile & Isodose Visualization**: Easily generate dose profiles and isodose\
  \ lines.  \n- **TPS Comparison**: Compare measured dose maps with those generated by treatment planning\
  \ systems.\n\n---\n\n## Table of Contents\n\n1. [Getting Started](#getting-started)  \n2. [Installation](#installation)\
  \  \n3. [Running the Application](#running-the-application)  \n4. [Contributing](#contributing)  \n\
  5. [License](#license)\n\n---\n\n## Getting Started \U0001F527\n\nTo set up and run the application\
  \ locally, make sure you have the following:\n\n### Prerequisites\n\n- Python **3.9+** installed on\
  \ your system  \n- `pip` for managing Python packages\n\n---\n\n## Installation\n\n1. **Clone the repository**:\n\
  \   ```bash\n   git clone -b pyside https://github.com/eduardoh27/FilmQADose.git\n   ```\n2. **Navigate\
  \ to the project folder**:\n   ```bash\n   cd app\n   ```\n3. **Install dependencies**:\n   ```bash\n\
  \   pip install -r requirements.txt\n   ```\n\n---\n\n## Running the Application ▶️\n\n1. **From the\
  \ root directory**, run:\n   ```bash\n   python main.py\n   ```\n2. A GUI window will open, allowing\
  \ you to interact with FilmQADose.\n\n---\n\n## Contributing \U0001F468‍\U0001F4BB\n\nContributions\
  \ are always welcome! You can:\n\n1. **Fork** the project  \n2. **Create** a feature branch (`git checkout\
  \ -b feature/my-new-feature`)  \n3. **Commit** your changes (`git commit -m 'Add some feature'`)  \n\
  4. **Push** to the branch (`git push origin feature/my-new-feature`)  \n5. **Open a Pull Request** \
  \ \n\nFeel free to report issues or suggest enhancements in the [Issues](https://github.com/eduardoh27/FilmQADose/issues)\
  \ section.\n\n---\n\n## License ⚖️\n\nThis project is licensed under the terms specified in the [LICENSE](LICENSE)\
  \ file.  \nFeel free to use, modify, and distribute it in accordance with the license.\n\n"

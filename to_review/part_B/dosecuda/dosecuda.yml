readme_excerpt: "# DoseCUDA\n\n**NOT FOR CLINICAL USE**\n\n**License**\nThis project is licensed under\
  \ the GPL-2.0 License - see the [LICENSE](LICENSE) file for details.\n\n**To use, please cite [our paper](http://doi.org/10.1002/acm2.70093):**\n\
  Bhattacharya M, Reamy C, Li H, Lee J, Hrinivich WT. A Python package for fast GPU‐based proton pencil\
  \ beam dose calculation. Journal of Applied Clinical Medical Physics. 2025 Apr 11:e70093.\n\n**DoseCUDA**\
  \ is a Python package enabling GPU-based radiation dose calculation for research, development, and education.\
  \ The package currently supports photon dose calculation using a collapsed cone convolution superposition\
  \ algorithm and proton dose calculation using a double-Gaussian pencil beam algorithm. The default photon\
  \ beam model corresponds to the 6 MV energy of a Varian Truebeam linear accelerator and the default\
  \ proton beam model corresponds to a Hitachi Probeat synchrotron-based PBS delivery system with 98 discrete\
  \ energies.\n\n# Quickstart Guide\n\n## Prerequisites\nBefore installing DoseCUDA, ensure you have the\
  \ following dependencies installed:\n- **Python 3.7+**\n- **CMake 3.15+**\n- **CUDA Toolkit** (Ensure\
  \ you have a compatible version for your GPU)\n- **Git** (for cloning the repository)\n\nEnsure that\
  \ your GPU and CUDA drivers are properly set up before proceeding.\n\n## Installation on Linux\n\nLinux\
  \ builds were tested on Ubuntu 22.04.5 LTS and Debian 13.\n\n1. **Install Python** (if not already installed):\n\
  \   ```\n   sudo apt update\n   sudo apt install python3 python3-pip\n   ```\n   \n2. **(Optional but\
  \ recommended)**: Create a virtual environment to isolate DoseCUDA and its dependencies:\n   ```\n \
  \  python3 -m venv dosecuda-env\n   source dosecuda-env/bin/activate\n   ```\n\n3. **Clone the DoseCUDA\
  \ repository**:\n   ```\n   git clone https://github.com/jhu-som-radiation-oncology/DoseCUDA\n   cd\
  \ DoseCUDA\n   ```\n\n4. **Install using pip**:\n   ```\n   python -m pip install .\n   ```\n   You\
  \ may have to [override the host compiler](#additional-notes-linux) if yours is not supported.\n\n5.\
  \ **Verify the installation**:\n   Run the test script to verify that DoseCUDA is installed correctly\
  \ and working:\n   ```\n   python tests/test_phantom_impt.py\n   ```\n   or\n   ```\n   python tests/test_phantom_imrt.py\n\
  \   ```\n\n   If everything is installed correctly, you should see the dose calculation output in your\
  \ terminal and files saved into `./test_phantom_output`.\n\n\n6. **Deactivating the virtual environment**\
  \ (if used):\n   After using the package, you can deactivate the virtual environment:\n   ```\n   deactivate\n\
  \   ```\n\n## Additional Notes (Linux):\n- **CUDA version**: Ensure that your CUDA version is compatible\
  \ with your GPU and the CUDA Toolkit installed on your system.\n- **Virtual environments**: Virtual\
  \ environments help avoid conflicts between dependencies required by DoseCUDA and other Python projects\
  \ you may have on your machine.\n- **NVCC host compiler**: You can supply a host compiler override to\
  \ pip by setting the environment variable `CUDAHOSTCXX` to the compiler command (e.g. `CUDAHOSTCXX=clang++`).\
  \ Use this if your system's default is not supported.\n\n## Installation on Windows\n\n#### Warning:\
  \ This section is out of date\n\nWindows builds have only been tested with Visual Studio 2022 on Windows\
  \ 11 Enterprise Edition.\n\n1. **Install Python** (if not already installed):\n   - Download Python\
  \ from the [official website](https://www.python.org/downloads/) and install it.\n   - Make sure to\
  \ check the option \"Add Python to PATH\" during the installation.\n\n2. **Install MSVC**\n   - Download\
  \ Microsoft's Visual Studio installer from the [official website](https://visualstudio.microsoft.com/downloads/).\n\
  \      - Install the x64/x86 build tools (C++ compiler and runtime libraries)\n      - Install the CMake\
  \ tools\n      - (optional) Install Git for Windows\n\n3. **Install the CUDA Toolkit**:\n   - Download\
  \ and install the appropriate version of the CUDA Toolkit from the [NVIDIA website](https://developer.nvidia.com/cuda-toolkit).\n\
  \   - Make sure the drivers for your GPU are compatible with this version.\n\n4. **Install Git (if not\
  \ installed through MSVC)**:\n   - Download and install Git from the [official website](https://git-scm.com/download/win).\n\
  \   - During the installation, choose \"Git from the command line and also from 3rd-party software\"\
  .\n\n5. **Create a virtual environment** (optional but recommended):\n   Open a command prompt (cmd)\
  \ and run:\n   ```cmd\n   python -m venv dosecuda-env\n   dosecuda-env\\Scripts\\activate\n   ```\n\n\
  6. **Clone the DoseCUDA repository**:\n   ```cmd\n   git clone https://github.com/jhu-som-radiation-oncology/DoseCUDA\n\
  \   cd DoseCUDA\n   ```\n\n7. **Install DoseCUDA using pip**:\n   From a [**developer command prompt**](#additional-notes-windows):\n\
  \   ```cmd\n   python -m pip install .\n   ```\n\n8. **Verify the installation**:\n   Run the test script\
  \ to verify that DoseCUDA is installed correctly and working:\n   ```cmd\n   python tests\\test_phantom_impt.py\n\
  \   ```\n   or\n   ```\n   python tests\\test_phantom_imrt.py\n   ```\n\n   If everything is installed\
  \ correctly, the dose calculation output should appear in the terminal, with files saved into `.\\test_phantom_output`.\n\
  \n9. **Deactivate the virtual environment** (if used):\n   After using the package, deactivate the virtual\
  \ environment by typing:\n   ```cmd\n   deactivate\n   ```\n\n## Additional Notes (Windows):\n- **PATH\
  \ configuration**: Ensure Python, CMake, and CUDA are added to your system's PATH during their installations\
  \ to avoid issues.\n- **CUDA compatibility**: Ensure your GPU is compatible with the version of CUDA\
  \ Toolkit you installed.\n- **Developer command prompt**: Using a [developer command prompt](https://learn.microsoft.com/en-us/visualstudio/ide/reference/command-prompt-powershell)\
  \ ensures that all MSVC build tools are present in the environment's PATH. Use the `x64 Native Tools\
  \ Command Prompt` for best results.\n\n# Contact\n\nFor any questions or support regarding DoseCUDA,\
  \ please reach out via email:\n* **DoseCUDA@gmail.com**\n\n# Developers\n\n* Tom Hrinivich\n* Calin\
  \ Reamy\n* Mahasweta Bhattacharya\n\n# Funding Support\n* The Commonwealth Fund\n"

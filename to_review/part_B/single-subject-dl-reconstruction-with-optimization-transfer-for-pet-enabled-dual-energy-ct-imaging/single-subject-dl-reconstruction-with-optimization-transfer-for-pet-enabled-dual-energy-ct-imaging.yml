readme_excerpt: "# Single-Subject Deep-Learning Image Reconstruction with a Neural Optimization Transfer\
  \ Algorithm for PET-Enabled Dual-Energy CT Imaging\n\nThis demo code shows how to reconstruct the gamma-ray\
  \ CT (gCT) image from PET emission data. The reconstructed high-energy (511keV) gCT is then combined\
  \ with the already-existing X-ray CT image to form dual-energy pairs. \n\nThe proposed method, called\
  \ \"Neural KAA\", is described in:\n\n    S. Li, Y. Zhu, B. A. Spencer, and G. B. Wang, \"Single-Subject\
  \ Deep-Learning Image Reconstruction With a Neural Optimization Transfer Algorithm for PET-Enabled Dual-Energy\
  \ CT Imaging,\" in IEEE Transactions on Image Processing, vol. 33, pp. 4075-4089, 2024.\n\nThe proposed\
  \ neural optimization transfer algorithm is expected to solve different DIP-type reconstruction problems\
  \ for X-ray CT, magnetic resonance imaging, and other imaging modalities that employ a least-square\
  \ reconstruction formula.\n\nProgram Authors: Siqi Li and Guobao Wang\n\nLast date: 11/08/2024\n\n\n\
  # Prerequistites:\n\tPython 3.7 (or 3.x)\n\tGPU-based PyTorch\n\tMatlab\n\n# Overview\n\n![figure](https://github.com/user-attachments/assets/b9a35c03-a26d-4fbc-925f-cceb4be4005d)\n\
  \nThe neural KAA reconstruction consists of three separate steps: \n\n(1) PET activity image update\
  \ (MLEM) \n\n(2) gCT image update (KTR)\n\n(3) A weighted least-square neural-network learning in the\
  \ gCT image domain\n\n# Neural KEM for dynamic PET reconstruction:\n\na). Please download the system\
  \ matrix folder from https://drive.google.com/drive/folders/1rx_CsvE8D7N2HLML14VUsjNmG2sssSeK?usp=sharing,\
  \ and put them into folder \"/data/GE690TOF2D\" (need to create)\n\nb). Then run 'Test_demo.m' to test\
  \ the proposed method and compare it with other methods in the simulation study that we used in the\
  \ paper.\n\nc). 'DIP_step.py' is a function running the step of a weighted least-square neural-network\
  \ learning in the gCT image domain, and the whole reconstruction is implemented on Matlab.\n\n# Required\
  \ packages for PET reconstruction:\n\nTo run the demo code, you need to add the \"KER_v0.11\" and \"\
  PLOT_v1.0\" packages into your Matlab path by running setup.m in Matlab. Both packages can be downloaded\
  \ from:\n\n\thttps://wanglab.faculty.ucdavis.edu/code\n\n# Future effort:\n\nPlease refer to our latest\
  \ published paper on EJNMMI regarding the implementation of real data. The implementation of PET-enabled\
  \ DECT on real data will come soon!\n\n\tZhu Y, Li S, Xie Z, Leung EK, Bayerlein R, Omidvari N, Cherry\
  \ SR, Qi J, Badawi RD, Spencer BA, Wang GB. Feasibility of PET-enabled dual-energy CT imaging: First\
  \ physical phantom and initial patient study results. European Journal of Nuclear Medicine and Molecular\
  \ Imaging, accepted, November 2024. arXiv:2402.02091. 3 Feb 2024. https://doi.org/10.48550/arXiv.2402.02091.\n\

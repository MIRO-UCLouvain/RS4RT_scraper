readme_excerpt: "# Brain Tumor Segmentation and 3D Visualization\n\n![Python](https://img.shields.io/badge/Python-3.11-blue?style=for-the-badge\\\
  &logo=python)\n![FastAPI](https://img.shields.io/badge/FastAPI-Backend-009688?style=for-the-badge\\\
  &logo=fastapi)\n![PyTorch](https://img.shields.io/badge/PyTorch-Deep%20Learning-ee4c2c?style=for-the-badge\\\
  &logo=pytorch)\n![MONAI](https://img.shields.io/badge/MONAI-Medical%20AI-0ea5e9?style=for-the-badge)\n\
  ![Status](https://img.shields.io/badge/Status-Research%20Prototype-facc15?style=for-the-badge)\n\nAn\
  \ AI-powered research web application for **brain tumor segmentation and 3D visualization** from MRI\
  \ NIfTI volumes.\n\nThe application performs automated tumor segmentation, separates tumor regions into\
  \ **ET / ED / NET**, estimates tumor volumes, detects separate connected tumor foci, displays per-focus\
  \ metadata, and provides 2D, multimodal, and 3D visualization inside a modern research portfolio interface.\n\
  \n> **Research Use Only:** This project is intended for educational and research visualization. It is\
  \ not intended for clinical diagnosis, treatment planning, or replacement of expert radiological review.\n\
  \n---\n\n## Preview\n\n### Research Portfolio Interface\n\n![Project Hero](screenshots/hero.png)\n\n\
  ### Segmentation Overview\n\n![Segmentation Overview](screenshots/overview_and_2dSliceOverlay.png)\n\
  \n### Multimodal Axial Viewer\n\n![Overlay Viewer](screenshots/multimodal_axial_viewer.png)\n\n### 3D\
  \ Tumor Visualization\n\n![3D Viewer](screenshots/3d-viewer.png)\n\n### Separate Tumor Foci\n\n![Tumor\
  \ Foci](screenshots/tumor-foci.png)\n\n### AI Summary\n\n![Tumor Foci](screenshots/summary.png)\n\n\
  ---\n\n## Key Features\n\n* Brain tumor segmentation from MRI NIfTI volumes\n* ET / ED / NET tumor region\
  \ separation\n* Total predicted tumor volume estimation\n* Region-wise tumor volume calculation\n* Separate\
  \ connected tumor foci detection\n* Sub-threshold segmentation island filtering\n* Per-focus tumor metadata\n\
  * Per-focus dark MRI context preview\n* Per-focus isolated segmentation mask preview\n* Axial, coronal,\
  \ and sagittal 2D overlay viewer\n* Multimodal axial viewer for FLAIR, T1, T1ce, and T2\n* Interactive\
  \ 3D visualization\n* Metadata JSON export\n* Segmentation mask download\n* Research portfolio-style\
  \ frontend UI\n* Runtime preview caching for faster tumor-focus card loading\n\n---\n\n## Tumor Region\
  \ Legend\n\n| Label   | Meaning                       | Visualization Color |\n| ------- | -----------------------------\
  \ | ------------------- |\n| **ET**  | Enhancing Tumor               | Red                 |\n| **ED**\
  \  | Edema                         | Green               |\n| **NET** | Non-enhancing / Necrotic Core\
  \ | Yellow              |\n\n---\n\n## Project Workflow\n\n```text\nMRI NIfTI Upload\n        ↓\nPreprocessing\n\
  \        ↓\nDeep Learning Segmentation\n        ↓\nET / ED / NET Region Extraction\n        ↓\nConnected\
  \ Tumor Foci Detection\n        ↓\n2D Overlay + Multimodal Viewer\n        ↓\n3D Visualization\n   \
  \     ↓\nMetadata + Report Generation\n```\n\n---\n\n## Project Structure\n\n```text\nbrain_tumor_seg_and_3D_viz/\n\
  │\n├── backend/\n│   ├── app.py\n│   ├── requirements.txt\n│   │\n│   └── model/\n│       ├── infer_wrapper.py\n\
  │       └── PLACE_MODEL_HERE.txt\n│\n├── frontend/\n│   ├── index.html\n│   ├── styles.css\n│   └──\
  \ app.js\n│\n├── screenshots/\n│   ├── hero.png\n│   ├── overview.png\n│   ├── overlay-viewer.png\n\
  │   ├── 3d-viewer.png\n│   └── tumor-foci.png\n│\n├── README.md\n└── .gitignore\n```\n\n---\n\n## Model\
  \ Checkpoint\n\nThe trained model checkpoint is **not included** in this repository because model files\
  \ are large.\n\nPlace your trained checkpoint at:\n\n```text\nbackend/model/unet3d_best.pt\n```\n\n\
  If your checkpoint has a different name or path, update the checkpoint path inside:\n\n```text\nbackend/model/infer_wrapper.py\n\
  ```\n\nLarge files intentionally excluded from GitHub include:\n\n```text\n*.pt\n*.pth\n*.ckpt\n*.nii\n\
  *.nii.gz\nruns/\noutputs/\ncomponent_previews/\n.venv/\n.venv311/\n```\n\n---\n\n## Setup Instructions\n\
  \n### 1. Clone the Repository\n\n```powershell\ngit clone https://github.com/noumanshahid-1/brain-tumor-segmentation-3d-visualization.git\n\
  cd brain-tumor-segmentation-3d-visualization\n```\n\n\n---\n\n### 2. Create Virtual Environment\n\n\
  ```powershell\ncd backend\npython -m venv .venv311\n.\\.venv311\\Scripts\\activate\n```\n\n---\n\n###\
  \ 3. Install Dependencies\n\n```powershell\npip install -r requirements.txt\n```\n\n---\n\n### 4. Add\
  \ Model Checkpoint\n\nPlace your trained model checkpoint here:\n\n```text\nbackend/model/unet3d_best.pt\n\
  ```\n\n---\n\n### 5. Run the Application\n\nFrom the `backend` folder:\n\n```powershell\nuvicorn app:app\
  \ --host 0.0.0.0 --port 7860\n```\n\nThen open:\n\n```text\nhttp://127.0.0.1:7860/ui/\n```\n\n---\n\n\
  ## Usage\n\n1. Open the application in your browser.\n2. Upload a `.nii` or `.nii.gz` MRI volume.\n\
  3. Click **Run Segmentation**.\n4. Review:\n\n   * Total tumor volume\n   * ET / ED / NET region volumes\n\
  \   * Model confidence\n   * 2D overlay slices\n   * Multimodal axial MRI viewer\n   * Interactive 3D\
  \ tumor visualization\n   * Separate tumor foci cards\n   * Metadata export\n\n---\n\n## Output Artifacts\n\
  \nAfter segmentation, the app can generate:\n\n| Output               | Description                \
  \                                                   |\n| -------------------- | -----------------------------------------------------------------------------\
  \ |\n| Segmentation Mask    | Predicted tumor mask in NIfTI format                                 \
  \         |\n| 3D Viewer            | Interactive HTML visualization                               \
  \                 |\n| Metadata JSON        | Tumor volumes, connected foci, confidence, bounding boxes,\
  \ and slice metadata |\n| Tumor Focus Previews | Cached component-level PNG previews               \
  \                            |\n\n---\n\n## Technical Stack\n\n### Backend\n\n* Python\n* FastAPI\n\
  * Uvicorn\n* PyTorch\n* MONAI\n* NumPy\n* SciPy\n* NiBabel\n* Matplotlib\n* Pillow\n* Plotly\n\n###\
  \ Frontend\n\n* HTML\n* CSS\n* JavaScript\n* Responsive research portfolio UI\n\n---\n\n## Important\
  \ Notes\n\n* This repository does not include the trained model checkpoint.\n* This repository does\
  \ not include medical datasets or patient MRI scans.\n* Runtime outputs are ignored by Git.\n* The app\
  \ expects the required model checkpoint to be placed manually in the correct backend model directory.\n\
  * Very small segmentation islands are excluded from the main lesion list but retained in metadata for\
  \ auditability.\n\n---\n\n## Known Limitations\n\n* The model can only segment tumor classes it was\
  \ trained to detect.\n* Results depend on the quality and preprocessing of the input MRI volume.\n*\
  \ The current system is designed for research visualization, not clinical deployment.\n* Medical interpretation\
  \ requires review by qualified experts.\n\n---\n\n## Research Disclaimer\n\nThis tool is intended for\
  \ **educational and research purposes only**.\n\nIt is **not** intended for:\n\n* Clinical diagnosis\n\
  * Treatment planning\n* Emergency medical use\n* Replacement of radiologist or clinician review\n\n\
  All outputs should be validated by qualified medical professionals before any real-world use.\n\n---\n\
  \n## Future Improvements\n\n* Add authentication for protected research use\n* Add batch processing\
  \ support\n* Add Dice / IoU evaluation mode with ground-truth masks\n* Add PDF report generation\n*\
  \ Add GPU/model status panel\n* Add deployment configuration with Docker\n* Add support for additional\
  \ segmentation models\n\n---\n\n## Author\n\n**Nouman Shahid**\n\nBrain Tumor Segmentation and 3D Visualization\
  \ Research Project\n"

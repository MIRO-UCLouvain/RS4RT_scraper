readme_excerpt: "# MRI Brain Tumor Segmentation\n\nImplementation of the paper:\n\n> **\"A Comparison\
  \ of Tumor Detection Approaches Based on K-means+GA, Watershed Clustering, and Otsu Threshold Method\"\
  **  \n> Sonia Rezaei — *Asian Pacific Journal of Cancer Nursing*, pp. 97–103  \n> DOI: 10.31557/APJCN.1857.20250911\n\
  \n---\n\n## Files\n\n| File | Description |\n|------|-------------|\n| `ROI_Selection.m` | Draw ground\
  \ truth mask manually on each MRI image |\n| `Kmeans_GA.m` | Tumor detection using K-means + Genetic\
  \ Algorithm |\n| `Otso_clustering.m` | Tumor detection using Otsu thresholding |\n| `Watershed01.m`\
  \ | Watershed segmentation on image 1 (11.png) |\n| `Watershed02.m` | Watershed segmentation on image\
  \ 2 (77.png) |\n| `Watershed03.m` | Watershed segmentation on image 3 (161.png) |\n\n---\n\n## MRI Images\
  \ Used\n\n| File | Description |\n|------|-------------|\n| `11.png` | MRI Image 1 |\n| `77.png` | MRI\
  \ Image 2 |\n| `161.png` | MRI Image 3 |\n\n---\n\n## How to Run\n\n### Step 1 — Create ground truth\
  \ masks\nRun `ROI_Selection.m` first.  \nIt opens each image and lets you draw the tumor region manually.\
  \  \nSaves: `bw1.mat`, `bw3.mat`, `bw4.mat`\n\n### Step 2 — Run the segmentation methods\n\n```matlab\n\
  % Method 1: K-means + Genetic Algorithm\nrun('Kmenas_GA.m')\n\n% Method 2: Otsu Thresholding\nrun('Otso_clustering.m')\n\
  \n% Method 3: Watershed Segmentation\nrun('Watershed01.m')   % Image 1\nrun('Watershed02.m')   % Image\
  \ 2\nrun('Watershed03.m')   % Image 3\n```\n\nEach script shows the segmentation result and a **confusion\
  \ matrix** at the end.\n\n---\n\n## Requirements\n\n- MATLAB R2019b or later\n- Image Processing Toolbox\n\
  - Global Optimization Toolbox (for K-means+GA)\n\n---\n\n## Results Summary (from paper)\n\n| Method\
  \ | Image 1 Error | Image 2 Error | Image 3 Error |\n|--------|:---:|:---:|:---:|\n| K-means + GA |\
  \ ~6% | ~1.3% | ~2.4% |\n| Otsu | ~6% | ~1.3% | ~2.4% |\n| Watershed | ~9% | ~2.3% | ~3.7% |\n\n---\n\
  \n## Citation\n\n```bibtex\n@article{rezaei2025tumor,\n  title   = {A Comparison of Tumor Detection\
  \ Approaches Based on\n             K-means+GA, Watershed Clustering, and Otsu Threshold Method},\n\
  \  author  = {Rezaei, Sonia},\n  journal = {Asian Pacific Journal of Cancer Nursing},\n  pages   = {97--103},\n\
  \  year    = {2025},\n  doi     = {10.31557/APJCN.1857.20250911}\n}\n```\n"

readme_excerpt: "# dvf\nDose warping implementation using deformation vector field (DICOM)\n\n## Class\
  \ design\n\nClass to represent a type of 3D rectangles, CT, RTDOSE, and DVF is written.\n\n<img src=\"\
  ./imgs/class_rect3d.png\" width=\"600\">\n\nAmong interpolation algorithms such as Trilinear, Prismatic,\
  \ Pyramid, Tetrahedra, Nearest neighbor, etc., Trilinear is implemented.\n\n\n## How to compile \n\n\
  - Library dependencies: gdcm (2.6.x) \n- compiler: \n    - For Mac, Apple LLVM version 10.0.1 (clang-1001.0.46.3).\n\
  \    - For Linux, never tested\n\n```\n\n$ cmake .\n$ make \n$ ./dvf --ctdir <your_ct_dir_path> --dosefile\
  \ <your_rtdose_file> --dvffile <your_dvf_file> \n\n```\n\n\n## Getting DVF from MIM\n\n- Load Two image\
  \ series using MIM\n<img src=\"./imgs/mim_moving_fixed.png\" width=\"400\">\n\n- Click fuse icon <img\
  \ src=\"./imgs/mim_fusion_icon.png\" width=\"50\">\n\n- Then MIM will show at bottom (be careful which\
  \ one is moving or fixed)\nThe seriese you click first will be the reference.\n<img src=\"./imgs/mim_fusion_series.png\"\
  \ width=\"400\">\n\n- Click DIR button <img src=\"./imgs/mim_deform_icon.png\" width=\"50\">\n\n- Then\
  \ there will be a new CT that is deformed (top row).\n- <img src=\"./imgs/mim_fused_ct.png\" width=\"\
  400\">\n\n- Click Save DIR <img src=\"./imgs/mim_save_deform.png\" width=\"50\">\n\nThen a DICOM file\
  \ is created. For the detail of the file see:\n\nhttp://dicom.nema.org/MEDICAL/dicom/2017b/output/chtml/part03/sect_C.20.3.html\n\
  \n## Example code (dvf_smc.cpp)\n\n\n```c++\n//ctdir\nstd::string dname = cl_opts[\"--ctdir\"][0];\n\
  rti::ct<float> myct(dname);\nmyct.load_data();\n\n//rtdose\nstd::string fname = cl_opts[\"--dosefile\"\
  ][0];\nrti::rtdose<float> mydose(fname);\nmydose.load_data();\n\n//dvf file\nstd::string dvfname = cl_opts[\"\
  --dvffile\"][0];\nrti::dvf<float, float> mydvf(dvfname);\nmydvf.load_data();\n\n//Create empty grids\n\
  rti::rect3d<float,float>  dose_grid;\nrti::rect3d<float,float>  ct_grid;\nrti::rect3d<float,float> \
  \ dvf_grid;\n\n//Copy various grid structures to empty grids\nrti::clone_structure(mydose, dose_grid);\n\
  rti::clone_structure(myct, ct_grid);\nrti::clone_structure(mydvf, dvf_grid);\n\nfloat fill_value = 0.0;\n\
  \n//Write dose to various grid\nrti::interpolate(mydose, dose_grid, fill_value); //interpolate dose\
  \ on DOSE grid\nrti::interpolate(mydose, ct_grid,   fill_value); //interpolate dose on CT grid\nrti::interpolate(mydose,\
  \ dvf_grid,  fill_value); //interpolate dose on DVF grid\n    \n```\n\n\n```\nCT (nx,ny,nz): (512, 512,\
  \ 200)\nCT (dx,dy,dz): (1.26953, 1.26953, 2.5)\nCT (x,y,z): (-325, -325, -317.5)\nRTDOSE (nx,ny,nz):\
  \ (100, 100, 60)\nRTDOSE (dx,dy,dz): (2, 2, 2.5)\nRTDOSE (x,y,z): (-181.1, 7.4, -47.55)\nDVF (nx,ny,nz):\
  \ (144, 101, 161)\nDVF (dx,dy,dz): (2.9975, 2.99157, 2.99689)\nDVF (x,y,z): (-211.148, -104.51, 162.252)\n\
  ```\nIt took < 1 sec to load CT, RTDOSE, and DVF on mac i5 3.5 Ghz and 3.5 secs to perform all interpolation.\n\
  \n| CT grid and DOSE grid (small)| Doses interpolated to CT grid and DOSE grid |\n|:---:|:---:|\n|<img\
  \ src=\"imgs/dose_on_dosegrid_a.png\" width=\"400\">|<img src=\"imgs/dose_on_dosegrid_b.png\" width=\"\
  400\">|\n\n\n| Grid (CT, DVF, DOSE) alignment with CT | Grid (CT, DVF, DOSE) alignment with DVF and\
  \ dose |\n|:---:|:---:|\n|<img src=\"imgs/ct_dosegrid_dvfgrid.png\" width=\"400\">|<img src=\"imgs/ct_dosegrid_dvfgrid_dvf.png\"\
  \ width=\"400\">|\n\nHere are the conversion result (including interpolation step)\n\n| source | destination\
  \ | success/fail | comment |\n|--------|:------:|:-----:|:----|\n| CT |  CT  | FAIL | needs fix (not\
  \ high priority), interpolation with int? |\n| CT |  RTDOSE  | FAIL |  |\n| CT |  DVF  | FAIL |  |\n\
  | DOSE |  CT  | SUCCESS |  |\n| DOSE |  RTDOSE  | SUCCESS |  |\n| DOSE |  DVF  | SUCCESS |  |\n| DVF\
  \ |  CT  | SUCCESS |  |\n| DVF |  RTDOSE  | SUCCESS |  |\n| DVF |  DVF  | SUCCESS |  |\n\n\n\n## Dose\
  \ warping\n\nThe dose warping is implemented. \nDose of source (moving phase) is pulled from the destination\
  \ grid. \n\nBased on the point calculated from vector field,  8 points enclosing the translated point\
  \ are found, and then dose is interpolated.\n\n<img src=\"imgs/dose_warp_init0.png\" width=500>\n\n\n\
  Plastimatch uses its own implementation or uses itk::WarpImageFilter\n\nhttps://itk.org/Doxygen/html/classitk_1_1WarpImageFilter.html\n\
  \n"

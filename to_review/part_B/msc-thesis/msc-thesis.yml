readme_excerpt: '## Introduction

  This repository presents my Master Thesis conducted as a collaboration between The Technical University
  of Denmark (DTU) and Herlev Hospital. Over the years new PC''s, OS updates and incomplete backups has
  led to the loss of the programs used for analysis. The only thing that remained was FolderCreator python
  script, which does not seem to be the final version. Nevertheless, I invite you to read the thesis and
  see the slides used at the dissertation.


  The work of the Thesis inspired subsequent analysis leading to the abstract publication:


  https://www.researchgate.net/publication/360994341_PD-0328_Impact_of_image_registration_uncertainties_on_dose_accumulations_in_online_adaptive_radiotherapy


  The data was manually exported. Due to the patient sensitive information it has only been available
  during the period of the project.


  ### Purpose

  Online Adaptive Radiotherapy (oART) is a semi-automatic method where the planned radiotherapy dose for
  cancer patients is updated on treatment day to adjust for anatomical variation between days. This is
  especially very useful for organs demonstrating large day-to-day size and shape variation such as the
  bladder that changes in size according to the filling. The process involves deformable image registration
  (DIR). This thesis seeked to quantify error in dosimetric measures derived from error in image registration
  prior to updating the plan on treatment day. This is attempted by using open-source alternative DIR-softwares
  to explore how this may alter the computed accumulated does.'

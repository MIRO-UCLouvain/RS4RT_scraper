readme_excerpt: "# About\n\nSlicerRadiomics is an extension for [3D Slicer](http://slicer.org) that\n\
  encapsulates [pyradiomics](https://github.com/radiomics/pyradiomics) library,\nwhich in turn implements\
  \ calculation of a variety of\n[radiomics](http://radiomics.github.io) features.\n\n# Install instructions\n\
  \nSlicerRadiomics is currently distributed as an extension via the 3D Slicer ExtensionManager.\nFollow\
  \ these steps to install the extension:\n1. Download the latest **nightly** release for your platform\
  \ from http://download.slicer.org.\n**Do NOT use installers tagged as \"Stable Release\"!**\nIf you\
  \ use Mac, make sure you move the Slicer application to the Applications folder on your computer before\
  \ launching it!\n2. Once installed, open Extension Manager by clicking the icon as shown below.\n![](https://qiicr.gitbooks.io/quantitativereporting-guide/content/docs/screenshots/extension_manager.png)\n\
  3. Search for `Radiomics` and install the extension by clicking the INSTALL\n   button.\n4. Once installation\
  \ of `Radiomics` and dependencies is completed,\n   you will need to restart Slicer application to access\
  \ the module.\n   If installation was successful, you should be able to see\n   `Radiomics` module in\
  \ the Slicer module list.\n   \n# Known issues\n\nAt the moment, the extension is not available on Linux,\
  \ due to a known issue (https://github.com/Radiomics/SlicerRadiomics/issues/16).\n\nThe extension will\
  \ also not work on Windows, due to a known issue (https://github.com/Radiomics/SlicerRadiomics/issues/23).\
  \ However, you can use the following workaround to fix the problem manually, while we are working on\
  \ a proper resolution.\n\nYou will need to change the following file (replacing `USER_NAME` with your\
  \ user name on your system):\n\n`C:/Users/USER_NAME/AppData/Roaming/NA-MIC/Extensions-revision/SlicerRadiomics/lib/site-packages/radiomics/featureextractor.py`\n\
  \nWhere revision is something like 26083 depending on the nightly version of Slicer.\n\nLine 9 should\
  \ be changed from:\n\n`import pykwalify.core`\n\nto:\n\n`# import pykwalify.core`\n\n# Building `SlicerRadiomics`\
  \ from source\n\nIn order to build this extension, you need to have a version of Slicer built from source.\n\
  You can build Slicer following [the\ninstructions](https://www.slicer.org/wiki/Documentation/Nightly/Developers/Build_Instructions).\n\
  Once you have done that, all you need to do are the following steps:\n\n* Clone the source code of the\
  \ repository.\n```\n$ git clone https://github.com/radiomics/SlicerRadiomics.git\n```\n\n* Create an\
  \ empty directory for building the extension.\n```\n$ mkdir SlicerRadiomics-build\n```\n\n* Configure\
  \ the build using cmake.\n```\n$ cd SlicerRadiomics-build\n$ cmake -DSlicer_DIR:PATH=/path/to/Slicer-Release/Slicer-build\
  \ ../SlicerRadiomics\n```\n\n* Build the extension.\n```\n$ make\n```\n\n*Note: cmake is one of the\
  \ prerequisites for building 3D Slicer*\n\n# Loading `SlicerRadiomics` from a build tree\n\nThere are\
  \ two options:\n\n## Start Slicer specifying command-line options\n\n* Specify additonal launcher setting\
  \ and module path.\n\n```\ncd SlicerRadiomics-build/inner-build/\nbuild_dir=$pwd\n\n./Slicer \\\n  --launcher-additional-settings\
  \ $build_dir/AdditionalLauncherSettings.ini \\\n  --additional-module-path $build_dir\n```\n\n* Open\
  \ `SlicerRadiomics` module.\n\n## Package, install and restart Slicer\n\n* Package the extension.\n\
  ```\n$ cd inner-build\n$ make package\n```\n\n* Once completed, you can install the [extension from\
  \ file](https://www.slicer.org/wiki/Documentation/Nightly/SlicerApplication/ExtensionsManager#Installing_an_extension_without_network_connection).\n\
  \n* Restart Slicer and open `SlicerRadiomics` module.\n\n# Support\n\nIf you found a bug, or to report\
  \ a reproducible problem, [submit an\nissue](https://github.com/Radiomics/SlicerRadiomics/issues/new).\n\
  \nIf you have a question about using the extension, please ask on the [mailing\nlist](https://groups.google.com/forum/#!forum/pyradiomics).\n\
  \n# Acknowledgments\n\nThis project is supported in part by the National Institutes of Health, National\n\
  Cancer Institute [Informatics Technology for Cancer Research (ITCR)\nprogram](https://itcr.nci.nih.gov)\
  \ via\ngrant U24 CA194354 (PI Hugo Aerts).\n"

readme_excerpt: "# Whole-brain radiomics for clustered federated personalization in brain tumor segmentation\n\
  \nThis is the official code base for the paper \n> [Matthis Manthe et al., “Whole Brain Radiomics for\
  \ Clustered Federated Personalization in Brain Tumor Segmentation,” Medical Imaging with Deep Learning,\
  \ PMLR, January 23, 2024](https://proceedings.mlr.press/v227/manthe24a.html)\n\nDue to the extremely\
  \ short time of implementation (the crunch was real), this is probably one of the worst code bases I\
  \ have ever written. One can dive into this code to clarify uncertainties when reading the paper, but\
  \ I would strongly advise to reimplement the method in your own code base using the presented logic\
  \ if needed. This is not a plug-and-play code for other datasets than the ones in the experiments of\
  \ the paper.\n\n## Code base structure\nThe structure of the code base is simple\n- Directly in the\
  \ ```/source``` folder one python code for each training algorithm tested in the paper (Centralized,\
  \ FedAvg, Local finetuning, CFFL Ideal and CFFL), and one python code for the experiment of Appendix\
  \ F (CNN to reconstruct volumes based on radiomic features),\n- In the directory ```/source/radiomics```\
  \ are the two python codes used to compute radiomic features on CC359 and FeTS datasets. These radiomic\
  \ features are output in a single json file.\n- In each directory is a ```*/config``` directory storing\
  \ example json config files.\n\n## Launching an experiment\nAll these python files can be ran using\
  \ the following typical command\n\n```python3 NAME.py --config_path config/CONFIG_NAME.json```\n\nwhich,\
  \ for a centralized training following the configuration defined in *config_centralized.json*, becomes\
  \ \n\n```python3 Centralized.py --config_path config/config_centralized.json```\n\nOne needs to create\
  \ a ```/runs``` folder for experiment folders to be created every time a code is ran, containing everything\
  \ related to the experiment instance (tensorboard, model weights, copy of the config file, etc.).\n\n\
  ## Dependencies\nThe main frameworks used are essentially \n- Pytorch\n- Numpy\n- Sklearn\n- Monai\n\
  - Pyradiomics\n- SimpleITK\n\nwith additional dependencies with tqdm, glob, pandas, pickle and pacmap.\n\
  \n"

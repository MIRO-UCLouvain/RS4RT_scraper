readme_excerpt: "# EEN1095 Project Repository\n\n## Real-Time Lung Tumour Tracking in Cine-MRI Using Deep\
  \ Learning\n\n**Student:** Chetan Kumar | A00054853\n**Programme:** MEng Electronics and Computer Engineering\n\
  **Supervisor:** Prof. Robert Sadleir\n**Module:** EEN1095 Implementation Project\n**Institution:** Dublin\
  \ City University\n**Date:** August 2026\n\n---\n\n## Project Overview\n\nThis repository implements\
  \ a real-time lung tumour tracking pipeline for the TrackRAD2025 Grand Challenge. The system combines\
  \ a mask-conditioned U-Net segmentation module with a VoxelMorph deformable image registration module,\
  \ fused into a causal tracking pipeline.\n\nThe central finding of this project is that the TrackRAD2025\
  \ tracking task is fundamentally a **mask propagation problem** rather than a frame-independent segmentation\
  \ problem. Conditioning the U-Net on the previous frame's tumour mask (supplied by the challenge interface)\
  \ raises the Dice similarity coefficient from 0.3776 (blind segmentation) to 0.9426 (guided propagation),\
  \ matching state-of-the-art performance with 7.77 million parameters.\n\n---\n\n## Key Results\n\n|\
  \ Method | Dice | CoM Distance | Dosimetric Acc |\n|--------|------|-------------|----------------|\n\
  | First-frame copy (no AI) | ~0.70 | — | — |\n| Blind U-Net (1 channel) | 0.3776 | — | — |\n| DINOMotion\
  \ (SOTA, ~330M params) | ~0.92 | — | — |\n| **Mask-conditioned U-Net (N=1)** | **0.9409** | **0.67 px**\
  \ | **0.9997** |\n| Mask-conditioned U-Net (N=3) | 0.9417 | 0.64 px | 0.9999 |\n| Mask-conditioned U-Net\
  \ (N=5) | 0.9426 | 0.64 px | 0.9999 |\n\n**Causal autoregressive tracking (Patient A_001, 100 frames):**\n\
  \n| Configuration | Mean Dice |\n|---|---|\n| U-Net only | 0.8706 |\n| VoxelMorph only | 0.8686 |\n\
  | Combined (alpha=0.7) | 0.8705 |\n\n---\n\n## Repository Structure\n\n```\nEEN1095ProjectRepo/\n|--\
  \ README.md\n|-- requirements.txt\n|-- train.py              Main U-Net training script\n|-- inference.py\
  \          Causal tracking using saved checkpoint\n|-- src/\n|   |-- models/\n|   |   |-- unet.py  \
  \     Mask-conditioned U-Net (7.77M params)\n|   |-- data/\n|   |   |-- dataset.py    TrackRAD dataset\
  \ loader + lazy loading version\n|   |-- utils/\n|       |-- losses.py     Loss functions + all 4 official\
  \ metrics\n|-- results/\n|   |-- ablation_study_final.png\n|   |-- tracking_qualitative.png\n|   |--\
  \ pipeline_comparison.png\n|   |-- training_curves.png\n|   |-- voxelmorph_results.png\n|   |-- A_001_tracking.mp4\n\
  |-- checkpoints/\n    |-- unet_conditioned_best.pth   Best U-Net (Dice 0.9409)\n    |-- voxelmorph_best.pth\
  \         Best VoxelMorph (NCC -0.4619)\n```\n\n---\n\n## Reproducing Published Results\n\n**To reproduce\
  \ results using the saved checkpoint (recommended):**\n\n```bash\ngit clone https://github.com/chetanx88/EEN1095ProjectRepo.git\n\
  cd EEN1095ProjectRepo\npip install -r requirements.txt\npython inference.py\n```\n\nUpdate `CHECKPOINT_PATH`\
  \ and `DATA_ROOT` in `inference.py` to point to your local paths before running.\n\n**Note:** The provided\
  \ checkpoint `unet_conditioned_best.pth` is the exact model used to generate all results in the portfolio.\
  \ Loading this checkpoint and running inference on the same data will reproduce the published Dice scores\
  \ exactly.\n\n**To retrain from scratch:**\n\n```bash\npython train.py\n```\n\nUpdate `ROOT` and `SAVE_DIR`\
  \ in `train.py` before running. Set `N_PREV = 1` for the main result, or `3`/`5` for the ablation. Note\
  \ that retraining will produce similar but not bit-identical results due to stochastic weight initialisation\
  \ and data augmentation.\n\n---\n\n## Dataset\n\nTrackRAD2025 — 50 labeled training patients across\
  \ 3 centres (A: 0.35T, B/C: 1.5T).\n\nDownload from HuggingFace:\n```python\nfrom huggingface_hub import\
  \ snapshot_download\n\nsnapshot_download(\n    repo_id=\"LMUK-RADONC-PHYS-RES/TrackRAD2025\",\n    repo_type=\"\
  dataset\",\n    local_dir=\"/path/to/trackrad2025\",\n    allow_patterns=[\"trackrad2025_labeled_training_data/*\"\
  ]\n)\n```\n\n---\n\n## Installation\n\n```bash\npip install -r requirements.txt\n```\n\n**Requirements:**\
  \ Python 3.12, PyTorch 2.0+, SimpleITK 2.2+, NumPy, SciPy, Matplotlib\n\n---\n\n## References\n\n1.\
  \ Ronneberger et al. (2015) — U-Net\n2. Balakrishnan et al. (2019) — VoxelMorph\n3. Salari et al. (2024)\
  \ — DINOMotion\n4. Lombardo et al. (2025) — TrackRAD2025 dataset\n\n## Model Checkpoints\n\n| File |\
  \ Link |\n|---|---|\n| `unet_conditioned_best.pth` (Best U-Net, Dice 0.9409) | [Download]([YOUR_DRIVE_LINK](https://drive.google.com/file/d/1hhw7kG_Y81lCFfUlLevbCJ8Gj4kISsgB/view?usp=sharing))\
  \ |\n| `voxelmorph_best.pth` (Best VoxelMorph, NCC -0.4619) | [Download]([YOUR_DRIVE_LINK](https://drive.google.com/file/d/1FF0yJKt36jJb959EbeOTNV7e0xLb8Ilf/view?usp=sharing))\
  \ |\n"

readme_excerpt: "# Conditional Deformable Image Registration with Spatially-variant and Adaptive Regularization\n\
  Code for paper \"Conditional Deformable Image Registration with Spatially-Variant and Adaptive Regularization\"\
  \ (ISBI 2023)\n\nThis is the official Pytorch implementation of \"Conditional Deformable Image Registration\
  \ with Spatially-Variant and Adaptive Regularization\"\n\nThe code has been tested in Pytorch using\
  \ OASIS dataset, which can be downloaded here: https://github.com/adalca/medical-datasets/blob/master/neurite-oasis.md\n\
  \nAuthor: Yinsong Wang, Huaqi Qiu, Chen Qin\n\nPaper link: https://arxiv.org/abs/2303.10700\n\n# Prerequisites\n\
  - `Python 3.8.3+`\n- `Pytorch 1.7.1 - 1.12.1`\n- `NumPy`\n- `NiBabel`\n\n# Publication\nIf you make\
  \ use of the code, or if you found the code useful, please cite the paper in any resulting publications.\n\
  - **Conditional Deformable Image Registration with Spatially-Variant and Adaptive Regularization** \
  \ \n```\n@article{wang2023conditional,\n  title={Conditional Deformable Image Registration with Spatially-Variant\
  \ and Adaptive Regularization},\n  author={Wang, Yinsong and Qiu, Huaqi and Qin, Chen},\n  journal={arXiv\
  \ preprint arXiv:2303.10700},\n  year={2023}\n}\n```\n\n\n## Acknowledgment\nSome codes in this repository\
  \ are modified from these two amazing project [cLapIRN](https://github.com/cwmok/Conditional_LapIRN)\
  \ and [LapIRN](https://github.com/cwmok/LapIRN).\n\n\n## Keywords\nDeformable image registration, Spatiallyvariant\
  \ and adaptive regularization, Hyperparameter, Conditional Instance Normalization\n"

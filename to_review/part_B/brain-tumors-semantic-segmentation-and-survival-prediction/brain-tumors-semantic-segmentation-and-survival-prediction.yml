readme_excerpt: "# Brain Tumor Semantic Segmentation\n\n## The Objective\nSegmenting brain tumor MRI images\
  \ to detect their location and sub-regions which are the \"enhancing tumor\" (ET), the \"tumor core\"\
  \ (TC) & the \"whole tumor\" (WT). In addition, predict the survival possibilities of a specified patient,\
  \ with the reasoning that the presence, size and location of the tumor sub-regions have an explanatory\
  \ power over the survival possibilities of a patient.\n\n## Approach and Data\nUtilized the DeepLab-Resnet50\
  \ and DeepLab-MobileNet architectures. These models were not applied previously to the brain tumor segmentation\
  \ problem. Downloaded BraTS 2018, 2019 & 2020 challenge datasets for a total of 982 brain cases, 150\
  \ images for each brain and different scan times, and 4 different MRI images for each brain: T1, T1Gd,\
  \ T2, T2-Flair & the segmented ground truth. In addition, for the survival prediction two models are\
  \ tested.\n\n## Repository organization and usage\nIn order to use correctly the repository follow the\
  \ next steps. Some minor changes (input data paths, etc.) might be necessary. First of all, do a <code>git\
  \ clone</code> using the HTTP link. Then, click on this [word](https://www.kaggle.com/andrewmvd/brain-tumor-segmentation-in-mri-brats-2015?select=MICCAI_BraTS2020_TrainingData)\
  \ to reach the Kaggle Brain tumor segmentation dataset page, scroll down and download the data. You\
  \ can either download all three major directories or not, our code will work anyway, but you will need\
  \ to change some things (for example, you won't be able to train a model with 2018 data if you don't\
  \ download them). After that, you will need to create a \"data\" folder and put the downloaded data\
  \ inside that folder. To be sure, create also a \"models\" and \"data_extracted\" folder, but it should\
  \ be ok even if you don't do it.\nFinally, you are able to dive in! The webapp you can run it with <code>streamlit\
  \ run webapp_main.py</code> in which you can select the model to use (you will need <code>.pt</code>\
  \ files in your \"models\" folder, that are the saved models), upload the images and get the segmentation.\
  \ However, the app shows the output only in greyscale for now, so use the notebooks for a better demo.\
  \ \n"

readme_excerpt: "# Radiomics_visualization_Software\n\nHere I created a repository for installing and\
  \ running the code. I put the instructions step by step:\nThis software allows you to process, visualize,\
  \ and analyze radiomics datasets without programming knowledge.\n\n## System Requirements\n**Operating\
  \ System**: Windows, macOS, or Linux\nPython Version: 3.8 or later\nRequired Libraries:\n- tkinter\n\
  - pandas\n- numpy\n- scikit-learn\n- matplotlib\n- seaborn\n- Pillow\n\n##  Installation Steps\nStep\
  \ 1: Install Python\nDownload Python from https://www.python.org/downloads/.\nDuring installation:\n\
  Check the box: \"Add Python to PATH\".\nSelect the Customize installation option and ensure pip is selected.\n\
  Verify Python installation:\nOpen a terminal or command prompt (you can just write cmd in the search\
  \ box)\nType: python --version\nIf installed correctly, this shows the installed Python version.\n\n\
  ## Step 2: Install Required Libraries\n1. Open a terminal or command prompt.\n2. Run the following command\
  \ to install the necessary libraries:\n```bash\npip install pandas numpy scikit-learn matplotlib seaborn\
  \ pillow\n```\n3. Ensure the installation completes without errors.\n\n## Step 3: Save the Software\
  \ Code\nCopy the provided code into a text editor (e.g., Notepad).\nSave it as radiomics_analysis.py.\
  \ Example:\n```bash\nC:\\Users\\<YourName>\\Documents\\radiomics_analysis.py\n\n```\n\nStep 5: Run the\
  \ Software\n1. Open a terminal or command prompt.\n2. Navigate to the folder containing radiomics_analysis.py.\
  \ For example:\n```bash\ncd C:\\Users\\<YourName>\\Documents\n```\n3. Run the program:\n```bash\npython\
  \ radiomics_analysis.py\n```\n\n4. The software will launch with a user-friendly graphical interface.\n\
  \n\n\n# How to Use the Software\nFirst make it full size\n## Step 1: Load Your Data\nClick Browse to\
  \ select a radiomics dataset (CSV file).\nConfirm successful data loading in the popup message.\n##\
  \ Step 2: Configure Settings\nVariance Threshold: Remove features with low variation across samples\
  \ (default: 0.01).\nCorrelation Threshold: Remove features that are highly correlated (default: 0.9).\n\
  Additional Features to Drop: Checkboxes appear if the dataset contains fields like Age, Sex, or BMI.\n\
  ## Step 3: Analyze Data\nSelect a Metric for Analysis:\nFeature Importance: Rank features by their contribution\
  \ to survival prediction.\nMutual Information: Identify features most related to survival outcomes.\n\
  Click Process Data (*You need to click only once to the Process Data*) you can later change the metric.\n\
  ## Step 4: Visualize Results\n**Show Results**: View a bar chart ranking features by importance or mutual\
  \ information.\n**Show Scatter Plot**: Examine the relationship between the most significant feature\
  \ and survival time, with a regression line and \nvalue.\n**Show Heatmap**: Visualize the correlation\
  \ between top features and survival time.\n## Step 5: Save Processed Data\nClick Save Processed Data\
  \ to export the dataset after feature selection as a CSV file.\n\n\n\n"

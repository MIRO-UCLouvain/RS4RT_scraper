readme_excerpt: "# ddRPB\n\n## Radiotherapy clinical research IT infrastructure\n\nRadiationDosePlan-\
  \ Image/Biomarker-Outcome-platform (RPB) is a collection of open source software systems integrated\
  \ via portal to deliver a core software infrastructure necessary to support the operation of non-commercial\
  \ trials unit.\n\nThe RPB platform is a web-based solution which supports collection and exchange of\
  \ radiotherapy specific research data in large scale multi-centre clinical and pre-clinical studies.\
  \ It delivers a study management and electronic data capture system with special extensions dedicated\
  \ to secure upload of medical imaging and treatment plans in DICOM format. These tools allow the trial\
  \ personnel to handle multi-modal data conduction activities that yield to finalised patient cohort\
  \ datasets.\n\n## Platform features\n\n* Managing multi-centre clinical trials\n* Patient identity management\
  \ and pseudonymisation\n* Study subject randomisation (permuted block + strata)\n* Electronic case report\
  \ forms (eCRFs) for clinical data collection\n* Patient reported outcomes (ePRO)\n* Linked medical imaging\
  \ (DICOM) and treatment plans (DICOM-RT)\n* DICOM data de-identification and RTSTRUCT ROI naming harmonisation\n\
  * DICOM viewer with DICOM-RT plugin\n* WebDAV access to DICOM data collected in particular project\n\
  * Storage for laboratory assays and other tabulated data\n\n## Acknowledgment\n\nFor people who do use\
  \ the RPB software platform as managed or self-operated solution supporting the conduction of their\
  \ trials, when it is possible, we would appreciate your acknowledgement in publications and citation\
  \ of the relevant papers:\n\n* \"This work was conducted in part using the RadPlanBio software platform.\"\
  \           \n\n```\n@article{skripcak_toward_2016,\n    title = {Toward {Distributed} {Conduction}\
  \ of {Large}-{Scale} {Studies} in {Radiation} {Therapy} and {Oncology}: {Open}-{Source} {System} {Integration}\
  \ {Approach}},\n    volume = {20},\n    issn = {2168-2194, 2168-2208},\n    shorttitle = {Toward {Distributed}\
  \ {Conduction} of {Large}-{Scale} {Studies} in {Radiation} {Therapy} and {Oncology}},\n    url = {http://ieeexplore.ieee.org/document/7138574/},\n\
  \    doi = {10.1109/JBHI.2015.2450833},\n    number = {5},\n    urldate = {2017-12-08},\n    journal\
  \ = {IEEE Journal of Biomedical and Health Informatics},\n    author = {Skripcak, Tomas and Just, Uwe\
  \ and Simon, Monique and Buttner, Daniel and Luhr, Armin and Baumann, Michael and Krause, Mechthild},\n\
  \    month = sep,\n    year = {2016},\n    pages = {1397--1403}\n}\n```\nNote: In case RPB managed service\
  \ utilisation (such as dedicated Institute/Department operating RPB platform instance used by others)\
  \ additional acknowledgements/citations usually defined by service provider may apply.\n"

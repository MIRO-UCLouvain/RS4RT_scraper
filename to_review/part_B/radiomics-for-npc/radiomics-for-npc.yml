readme_excerpt: 'The files ("hn.csv", "hn_ct.csv", "hn_pet.csv", "xm.csv", "xm_ct.csv", "xm_pet.csv")
  should be placed in the same folder as the R script ("Radiomics for NPC.R").

  The datasets "xm.csv", "xm_ct.csv", and "xm_pet.csv", originating from the First Affiliated Hospital
  of Xiamen University, were used to train the radiomics model.

  The datasets "hn.csv", "hn_ct.csv", and "hn_pet.csv", collected from Hunan Cancer Hospital, were used
  to test the model.


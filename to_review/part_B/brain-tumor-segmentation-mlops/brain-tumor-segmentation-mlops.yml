readme_excerpt: "# Brain Tumor Segmentation MLOps Pipeline\n\nEnd-to-end MLOps pipeline for brain tumor\
  \ segmentation on BraTS 2021 MRI data.\nBuilt with MONAI, DVC, and a compute-agnostic design (runs on\
  \ Kaggle, Colab, \nor local GPU without code changes).\n\n## Features\n- 3D U-Net segmentation (T1/T1ce/T2/FLAIR\
  \ multi-modal MRI)\n- Uncertainty quantification via Monte Carlo dropout\n- Saliency overlays for model\
  \ explainability\n- Quantized model export (ONNX/TFLite) for edge deployment\n- DVC-tracked pipeline\
  \ with versioned configs and metrics\n- Architecture decisions documented in /adr\n\n## Stack\nMONAI\
  \ · PyTorch · DVC · ONNX · Python\n\n## Setup\nInstall the Python dependencies first:\n\n```powershell\n\
  python -m pip install -r requirements.txt\n```\n\nThen authenticate Weights & Biases. If the `wandb`\
  \ launcher is not on PATH in\nyour terminal, use the module form:\n\n```powershell\npython -m wandb\
  \ login\n```\n\nIf you prefer the plain CLI, reopen the terminal after installation and run\n`wandb\
  \ login`.\n\n## Status\n\U0001F6A7 In progress"

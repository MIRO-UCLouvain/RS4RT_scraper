readme_excerpt: "# Brain Tumor Segmentation & Neuroanatomical RAG System\n\n## Key Contributions\n- Brain\
  \ tumor segmentation using nnUNet / DynUNet\n- Clinical-aware evaluation beyond Dice score\n- Atlas-based\
  \ neuroanatomical interpretation\n- Brain region knowledge base construction using Qwen3-14B\n- Neuroanatomical\
  \ Retrieval-Augmented Generation (RAG)\n- Patient-friendly report generation and QA system\n\n## \U0001F4CC\
  \ 프로젝트 개요\n본 프로젝트는 뇌종양 분할(Segmentation) 결과를 단순 Dice Score로 평가하는 것을 넘어, 종양이 실제로 어느 뇌 영역에 위치하는지 해석하고,\
  \ 해당 뇌 영역의 기능 정보를 기반으로 환자 맞춤형 결과지와 질의응답(QA)을 제공하는 것을 목표로 한다.\n기존 연구들이 Segmentation 정확도 향상에 집중했다면, 본\
  \ 프로젝트는 다음과 같은 관점에 집중하였다.\n\n* 임상적 해석 가능성 (Clinical Interpretability)\n* 설명 가능한 의료 AI (Explainable AI)\n\
  * 환자 친화적 정보 제공\n* Neuroimaging + LLM + RAG 융합\n\n## \U0001F4CC 프로젝트 목표\n* nnUNet, DynUNet 기반 뇌종양 Segmentation\
  \ 수행\n* Dice 중심 평가의 한계 분석\n* Atlas 기반 해부학적 위치 분석\n* 뇌 영역 지식베이스 구축\n* 환자 맞춤형 결과지 생성\n* Neuroanatomical\
  \ RAG 기반 QA 시스템 구축\n\n## \U0001F4CC 전체 파이프라인\n\nMRI → Tumor Segmentation → Atlas Mapping → Brain Knowledge\
  \ Base → RAG QA\n\n![Architecture](assets/architecture.png)\n\nMRI 영상으로부터 종양을 분할하고, Atlas 기반 해부학적 분석을\
  \ 수행한 뒤,뇌 영역 지식베이스와 RAG를 결합하여환자 맞춤형 결과지와 QA 서비스를 제공하는 End-to-End Neuroimaging AI Pipeline\n\n## \U0001F4CC\
  \ Segmentation 모델\n### 사용 모델\n* nnUNet\n* DynUNet\n* UNet\n* AttentionUNet\n* SwinUNETR\n\n### 데이터셋\n\
  * MSD Brain Tumor Dataset\n* BRATS Format\n\n### 전처리\n* nnUNet Preprocessing Pipeline\n* ANTs 기반 MNI152\
  \ Registration\n\n## \U0001F4CC 평가 지표\n\n| 지표              | 설명                   |\n| ---------------\
  \ | -------------------- |\n| Dice            | Segmentation Overlap |\n| HD95            | Boundary\
  \ Accuracy    |\n| Volume Error    | 종양 부피 차이             |\n| Center Distance | 종양 중심 위치 오차       \
  \   |\n| Atlas Overlap   | 해부학적 위치 분석           |\n\n## \U0001F4CC 주요 결과\n\n### 1. Dice는 비슷하지만 임상 결과는\
  \ 다름\n* nnUNet vs DynUNet\n* Dice Score는 유사\n하지만\n* HD95 차이 존재\n* Volume Error 증가\n* 위치 오차 발생\n\n###\
  \ 2. 과도한 Segmentation\n| Class | GT (ml) | Pred (ml) |\n| ----- | ------- | --------- |\n| WT    | 36.49\
  \   | 240.74    |\n| TC    | 27.40   | 188.12    |\n| ET    | 3.37    | 51.02     |\n\n실제보다 최대 6배 이상\
  \ 크게 예측되는 사례 확인\n\n### 3. 위치 오차\n* Center Distance 약 27 voxel\n\nDice가 높아도 실제 종양 위치는 크게 벗어날 수 있음을 확인\n\
  \n### 4. Atlas 기반 분석\n종양 중심 위치\n* Right Occipital (Inferior)\n실제 주요 침범 영역\n1. Superior Temporal Gyrus,\
  \ anterior division\n2. Parahippocampal Gyrus, posterior division\n3. Temporal Occipital Fusiform Cortex\n\
  4. Temporal Fusiform Cortex, anterior division\n5. Lingual Gyrus\n\n중심 위치와 실제 종양 분포 영역이 일치하지 않을 수 있음을\
  \ 확인\n\n## \U0001F4CC Brain Knowledge Base 구축\nHarvard-Oxford Atlas의 48개 뇌 영역에 대해\n\n### 데이터 수집\n* Wikipedia\n\
  * BrainInfo\n\n### 자동 메타데이터 생성\nQwen3-14B를 이용하여\n* Overview\n* Anatomical Location\n* Major Functions\n\
  * Network Tags\n* Functional Tags\n* Clinical Tags\n를 구조화된 JSON 형태로 생성하였다.\n\n예시 기능 태그\n* Memory\n*\
  \ Language\n* Emotion\n* Executive Function\n* Social Cognition\n* Visual Processing\n* Decision Making\n\
  \n## \U0001F4CC Neuroanatomical RAG 시스템\n구축된 Brain Knowledge Base를 기반으로\n* SentenceTransformer Embedding\n\
  * FAISS Vector Search\n를 수행하였다.\n\n### 환자 질문 예시\n* 기억력 저하가 발생할 수 있나요?\n* 얼굴을 잘 알아보지 못하겠어요.\n* 감정 조절이\
  \ 어려워질 수 있나요?\n* 언어 기능에 문제가 생길 수 있나요?\n\n### QA 동작 방식\n1. 질문과 관련된 뇌 영역 검색\n2. 환자의 종양 침범 영역 추출\n3. 두\
  \ 영역 간 관련성 비교\n4. 관련성 수준 판단\n* 높음\n* 중간\n* 낮음\n5. 환자 친화적 설명 생성\n\n## \U0001F4CC 환자 맞춤형 결과지 생성\n\nAtlas\
  \ 분석 결과와 Brain Knowledge Base를 이용하여 자동으로 결과지를 생성한다.\n\n## \U0001F4C4 Patient Report Example\n\n![Patient\
  \ Report](assets/report_ex.png)\n\n## \U0001F4AC Neuroanatomical RAG QA Example\n\n![QA Example](assets/qa_ex.png)\n\
  \n포함 정보\n* 종양 위치\n* 주요 침범 영역\n* 기능 설명\n* 잠재적 증상\n* 환자 및 보호자 안내\n\n이를 통해 MRI 결과를 비전문가도 이해할 수 있는 형태로 변환하였다.\n\
  \n\n## \U0001F4CC 핵심 인사이트\n> Dice Score가 높다고 해서 임상적으로 신뢰할 수 있는 결과는 아니다.\n\n본 프로젝트는\n* Volume Error\n\
  * Spatial Error\n* Atlas-based Interpretation\n* Explainable AI\n관점의 중요성을 확인하였다.\n또한\nMRI → Tumor Segmentation\
  \ → Atlas Mapping → Brain Knowledge Base → RAG QA\n까지 연결되는 End-to-End Neuroimaging AI Pipeline을 구축하였다.\n\
  \n## \U0001F4CC 향후 계획\n* Explainable Brain Region Visualization\n* Multi-Atlas 지원\n* Clinical Validation\n\
  * Multi-modal LLM 적용\n\n## \U0001F9E9 사용 기술\n### Medical Imaging\n* PyTorch\n* MONAI\n* nnUNet\n* DynUNet\n\
  * ANTs\n* Nibabel\n* Nilearn\n\n### Brain Atlas\n* Harvard-Oxford Atlas\n* MNI152\n\n### NLP / LLM\n\
  * Qwen3-14B\n* Ollama\n\n### Retrieval\n* SentenceTransformers\n* FAISS\n\n### Data Sources\n* Wikipedia\
  \ API\n* BrainInfo\n\n### Development\n* Python\n* Jupyter Notebook \n"

readme_excerpt: "# INTEGRAL-Radiomics\n\n<!-- badges: start -->\n[![CRAN status](https://www.r-pkg.org/badges/version/integralrad)](https://CRAN.R-project.org/package=integralrad)\n\
  [![R-CMD-check](https://github.com/mattwarkentin/INTEGRAL-Radiomics/actions/workflows/R-CMD-check.yaml/badge.svg)](https://github.com/mattwarkentin/INTEGRAL-Radiomics/actions/workflows/R-CMD-check.yaml)\n\
  <!-- badges: end -->\n\nThis repository contains the model and code for using the **INTEGRAL-Radiomics**\
  \ screen-detected pulmonary nodule malignancy model published in:\n\n> Warkentin MT, Al-Sawaihey H,\
  \ Lam S, et al Radiomics analysis to predict pulmonary nodule malignancy using machine learning approaches\
  \ _Thorax_ Published Online First: 09 January 2024. doi: 10.1136/thorax-2023-220226\n\nIf you have any\
  \ comments or questions, please file an [Issue](https://github.com/mattwarkentin/INTEGRAL-Radiomics/issues).\n\
  \n## Usage\n\nTo use the INTEGRAL-Radiomics model, you simply need to install the R package `integralrad`\
  \ and it handles all the necessary R and Python dependencies to perform the PyRadiomics feature extraction\
  \ and model predictions.\n\n```r\n# Install `integralrad`\nremotes::install_github(\"mattwarkentin/INTEGRAL-Radiomics\"\
  )\n```\n\nOnce installed, we can use `extract_radiomics(...)` to perform only the feature extraction,\
  \ or `predict_integral_radiomics(...)` to execute the entire prediction pipeline. \n\n```r\nlibrary(integralrad)\n\
  \n# Path to CSV with required columns (see `?predict_integral_radiomics` for details)\ninput <- \"path/to/csv\"\
  \n\npreds <- predict_integral_radiomics(input)\n```\n\n### Command-Line Interface\n\nWe have also included\
  \ a command-line interface to simplify getting predictions using the INTEGRAL-Radiomics model. For input,\
  \ simply pass in a path to a CSV file (`--input`) that contains the relevant columns described in `?predict_integral_radiomics()`.\
  \ You must also provide the path to where the output CSV should be saved on disk (`--output`).\n\nAfter\
  \ installing the package (as described above), you simply need to install the `integral-radiomics` CLI\
  \ by running the following R code:\n\n```r\nintegralrad::install_integralrad_cli()\n```\n\nAfter restarting\
  \ your shell, you should be able to run the following:\n\n```sh\nintegral-radiomics --input=<path-to-input>\
  \ --output=<path-to-output>\n```\n\n## Citation\n\nIf you use this model, please cite the following\
  \ article:\n\nWarkentin MT, Al-Sawaihey H, Lam S, et al Radiomics analysis to predict pulmonary nodule\
  \ malignancy using machine learning approaches _Thorax_ Published Online First: 09 January 2024. doi:\
  \ 10.1136/thorax-2023-220226\n\n```\n@article {Warkentinthorax-2023-220226,\n  author = {Matthew T Warkentin\
  \ and Hamad Al-Sawaihey and Stephen Lam and Geoffrey Liu and Brenda Diergaarde and Jian-Min Yuan and\
  \ David O Wilson and Sukhinder Atkar-Khattra and Benjamin Grant and Yonathan Brhane and Elham Khodayari-Moez\
  \ and Kiera R Murison and Martin C Tammemagi and Kieran R Campbell and Rayjean J Hung},\n  title = {Radiomics\
  \ analysis to predict pulmonary nodule malignancy using machine learning approaches},\n  elocation-id\
  \ = {thorax-2023-220226},\n  year = {2024},\n  doi = {10.1136/thorax-2023-220226},\n  publisher = {BMJ\
  \ Publishing Group Ltd},\n  issn = {0040-6376},\n  URL = {https://thorax.bmj.com/content/early/2024/01/08/thorax-2023-220226},\n\
  \  eprint = {https://thorax.bmj.com/content/early/2024/01/08/thorax-2023-220226.full.pdf},\n  journal\
  \ = {Thorax}\n}\n```\n"

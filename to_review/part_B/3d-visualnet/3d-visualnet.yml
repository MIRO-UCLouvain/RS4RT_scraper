readme_excerpt: "# 3D-visualNet\nCombining 3D brain MRI and Tabular Data for 3D Tumor Segmentation , Tumor\
  \ type , genomic analysis and prognosis prediction\n# Multi-Input 3D Brain Tumor Segmentation and radiogenomic\
  \ Model\n\nThis repository contains code and architecture for a deep learning model that performs **3D\
  \ brain tumor segmentation and radiogenomic analysis** using multimodal inputs — 3D MRI volumes and\
  \ tabular clinical data. The model also predicts **five classification outputs** related to patient-level\
  \ diagnosis , prognosis and genomics .\n\n---\n\n## \U0001F9E0 Project Overview\n\n- **Goal**:\n  -\
  \ Accurately segment brain tumors from 3D MRI scans.\n  - Predict 5 classification outputs based on\
  \ multimodal input.\n- **Inputs**:\n  - 3D MRI volumes (NIfTI format)\n  - Tabular patient data (CSV)\n\
  - **Outputs**:\n  - Binary 3D segmentation mask\n  - Five classification heads ( tumor type,tumor grade,\
  \ IDH status,MGMT status , relapse)\n\n---\n"

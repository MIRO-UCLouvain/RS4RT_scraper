readme_excerpt: '# 🩺 Liver & Tumor Segmentation using MONAI


  An AI-powered medical imaging project that automatically detects and segments the **liver** and **liver
  tumors** from CT scan images using a **3D U-Net** model built with **MONAI** and **PyTorch**.


  ---


  ## 🚀 Features


  - Automatic liver segmentation

  - Automatic liver tumor detection

  - 3D U-Net architecture

  - Built with MONAI and PyTorch

  - Medical image preprocessing

  - Dice Score evaluation


  ---


  ## 🛠️ Technologies Used


  - Python

  - PyTorch

  - MONAI

  - NumPy

  - Matplotlib

  - Nibabel

  - Jupyter Notebook


  ---


  ## 📂 Dataset


  **LiTS (Liver Tumor Segmentation Challenge)**


  > The dataset is not included in this repository because of its large size.


  ---



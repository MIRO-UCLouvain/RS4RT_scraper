readme_excerpt: "\n# Synthetic CT generation from MRI using 3D transformer-based denoising diffusion model\n\
  **This is the repository for the paper published in Medical Physics: \"[Synthetic CT generation from\
  \ MRI using 3D transformer-based denoising diffusion model](https://aapm.onlinelibrary.wiley.com/doi/abs/10.1002/mp.16847)\"\
  . You can also find an early arXiv version at https://arxiv.org/abs/2305.19467**\n\nThe codes were created\
  \ based on [image-guided diffusion](https://github.com/openai/guided-diffusion), [SwinUnet](https://github.com/HuCaoFighting/Swin-Unet),\
  \ and [Monai](https://monai.io/)\n\nNotice: Due to the data restriction, we can only provide MATLAB\
  \ file (so no patient information) with over-smoothed CT volumes. The data we show just to demonstrate\
  \ how the user should organize their data. The dicom or nii file processing are also included in the\
  \ Jupyter notebook.\n\n# Required packages\n\nThe requires packages are in environment.yaml.\n\nCreate\
  \ an environment using Anaconda:\n```\nconda env create -f \\your directory\\environment.yaml\n\n\n\
  ```\n\n# Data organization\nThe data organization example is shown in folder \"MRI_to_CT_brain_for_dosimetric\\\
  imagesTr\". Or you can see the below screenshots:\n\n**MATLAB files: every matlab file can contain a\
  \ dict has image and label together. So you see you only need two folders: imagesTr for training, imagesTs\
  \ for testing, and imagesVal for validation. You can change the name but please make sure also change\
  \ the reading dir in the jupyter notebook**\n![Capture](https://github.com/shaoyanpan/Synthetic-CT-generation-from-MRI-using-3D-transformer-based-denoising-diffusion-model/assets/89927506/1a07d63d-5009-4ecf-aa88-8c86647e46e2)\n\
  \n\n**Nii files: one nii file can only contain either image or label. So in this case, you need imagesTr\
  \ and labelsTr for training, imagesTs and labelsTs for testing, and imagesVal and labelsVal for validation**\n\
  ![Capture2](https://github.com/shaoyanpan/Synthetic-CT-generation-from-MRI-using-3D-transformer-based-denoising-diffusion-model/assets/89927506/b6f7757c-f962-44ca-974f-266429b6e6f9)\n\
  \n\n# Usage\n\nThe usage is in the jupyter notebook MC-IDDPM main.ipynb. Including how to build a diffusion\
  \ process, how to build a network, and how to call the diffusion process to train, and sample new synthetic\
  \ images. However, we give simple example below:\n\n**Create diffusion**\n```\nfrom diffusion.Create_diffusion\
  \ import *\nfrom diffusion.resampler import *\n\ndiffusion_steps=1000\nlearn_sigma=True\ntimestep_respacing=[50]\n\
  \n# Don't toch these parameters, they are irrelant to the image synthesis\nsigma_small=False\nclass_cond=False\n\
  noise_schedule='linear'\nuse_kl=False\npredict_xstart=False\nrescale_timesteps=True\nrescale_learned_sigmas=True\n\
  use_checkpoint=False\n\ndiffusion = create_gaussian_diffusion(\n    steps=diffusion_steps,\n    learn_sigma=learn_sigma,\n\
  \    sigma_small=sigma_small,\n    noise_schedule=noise_schedule,\n    use_kl=use_kl,\n    predict_xstart=predict_xstart,\n\
  \    rescale_timesteps=rescale_timesteps,\n    rescale_learned_sigmas=rescale_learned_sigmas,\n    timestep_respacing=timestep_respacing,\n\
  )\nschedule_sampler = UniformSampler(diffusion)\n```\n\n**Create network**\n```\nnum_channels=64\nattention_resolutions=\"\
  32,16,8\"\nchannel_mult = (1, 2, 3, 4)\nnum_heads=[4,4,8,16]\nwindow_size = [[4,4,4],[4,4,4],[4,4,2],[4,4,2]]\n\
  num_res_blocks = [2,2,2,2]\nsample_kernel=([2,2,2],[2,2,1],[2,2,1],[2,2,1]),\n\nattention_ds = []\n\
  for res in attention_resolutions.split(\",\"):\n    attention_ds.append(int(res))\nclass_cond = False\n\
  use_scale_shift_norm=True\nresblock_updown = False\ndropout = 0\n\nfrom network.Diffusion_model_transformer\
  \ import *\nmodel = SwinVITModel(\n          image_size=img_size,\n          in_channels=2,\n      \
  \    model_channels=num_channels,\n          out_channels=2,\n          dims=3,\n          sample_kernel\
  \ = sample_kernel,\n          num_res_blocks=num_res_blocks,\n          attention_resolutions=tuple(attention_ds),\n\
  \          dropout=dropout,\n          channel_mult=channel_mult,\n          num_classes=None,\n   \
  \       use_checkpoint=False,\n          use_fp16=False,\n          num_heads=num_heads,\n         \
  \ window_size = window_size,\n          num_head_channels=64,\n          num_heads_upsample=-1,\n  \
  \        use_scale_shift_norm=use_scale_shift_norm,\n          resblock_updown=resblock_updown,\n  \
  \        use_new_attention_order=False,\n      ).to(device)\n```\n\n**Train the diffusion**\n```\nbatch_size\
  \ = 10\nt, weights = schedule_sampler.sample(batch_size, device)\nall_loss = diffusion.training_losses(model,target,condition,\
  \ t)\nloss = (all_loss[\"loss\"] * weights).mean()\n```\n\n**Testing using MONAI's window-sliding inferencer**\n\
  ```\nimg_num = 12\noverlap = 0.5\ninferer = SlidingWindowInferer(img_size, img_num, overlap=overlap,\
  \ mode ='constant')\ndef diffusion_sampling(condition, model):\n    sampled_images = diffusion.p_sample_loop(model,(condition.shape[0],\
  \ 1,\n                                                    condition.shape[2], condition.shape[3],condition.shape[4]),\n\
  \                                                    condition = condition,clip_denoised=True)\n   \
  \ return sampled_images\n\nsampled_images = inferer(condition,diffusion_sampling,model)\n```\n\n\n#\
  \ Visual examples (CT, MRI and generated CT) (also shown in the paper)\n\n**Brain**\n![Picture2](https://github.com/shaoyanpan/Synthetic-CT-generation-from-MRI-using-3D-transformer-based-denoising-diffusion-model/assets/89927506/6fc5b3d4-e61a-43cc-a29a-2818617e62bc)\n\
  \n\n\n\n"

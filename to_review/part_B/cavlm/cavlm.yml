readme_excerpt: "# Towards Responsible Multimodal Medical Reasoning via Context-Aligned Vision-Language\
  \ Models\n\n\nMedical vision-language models (VLMs) often produce fluent but clinically ungrounded conclusions.\
  \ This happens because predictions rely on a dominant modality without verifying consistency across\
  \ independent evidence sources.\n\nWe introduce a context-aligned reasoning framework that requires\
  \ agreement across heterogeneous clinical evidence before generating conclusions, without modifying\
  \ model architecture.\n\n![](/assets/methodology_image_centric.png)\n\n## Key Contributions\n\n- **Context-aligned\
  \ reasoning** – Enforces agreement across radiomic statistics, explainability activations, and semantic\
  \ cues\n- **No architecture changes** – Reliability improves by changing the decision protocol, not\
  \ the model\n- **Responsible by design** – Structured outputs with uncertainty, limitations, and safety\
  \ notes\n\n\n## How It Works\n\nWe augment VLMs with three evidence channels:\n\n| Channel | What It\
  \ Provides |\n|---------|------------------|\n| **Radiomics** | Intensity statistics, texture patterns\
  \ |\n| **Explainability** | Grad-CAM spatial attention metrics |\n| **Semantic cues** | Medical terminology\
  \ anchors |\n\n**Two reasoning modes:**\n- **Single-shot** – All evidence provided at once\n- **Stepwise**\
  \ – Progressive refinement (baseline → radiomics → full context)\n\n**Output format:**\n```json\n{\n\
  \  \"impression\": \"No obvious abnormality\",\n  \"evidence\": \"Lungs clear, cardiac silhouette normal\"\
  ,\n  \"uncertainty_0to1\": 0.35,\n  \"limitations\": \"Single view, no prior comparison\",\n  \"safety_note\"\
  : \"Research use only\"\n}\n```\n\n\n## Key Results\n\n| Finding | Result |\n|---------|--------|\n\
  | Performance gain | AUC 0.918 → 0.925 (OpenI) |\n| Uncertainty calibrated | 0.70 → 0.68 (no confidence\
  \ inflation) |\n| Evidence more concise | 19.4 → 15.3 words |\n| Safety compliance | 100% (base), 80%\
  \ (full tools) |\n\n> Qualitative Image Placeholder\n\n\n\n## Main Findings\n\n1. Text dominates (AUC\
  \ 0.918 alone), but multimodal helps (0.925 combined)\n2. Tool augmentation doesn't inflate confidence\
  \ – uncertainty remains calibrated\n3. Dataset matters – gains stronger with rich reports (OpenI) vs.\
  \ labels only (CheXpert)\n4. Responsible prompting works – no definitive claims, all outputs contain\
  \ safety notes\n\n\n## Limitations\n\n- Structured output compliance drops with multi-tool prompting\
  \ (100% → 80%)\n- Effectiveness depends on report richness\n- Research use only – not for clinical deployment\n\
  \n<p align=\"center\">\n  Better reasoning through evidence agreement; no retraining required.\n</p>\n"

readme_excerpt: '# dscover-python


  Python reimplementation of ZEISS DSCoVer-style dual-energy CT material

  discrimination. Stacks LE/HE scans and plots a 2D sum histogram to

  separate materials by density and atomic number.


  ## Scripts


  ### `stack.py`

  Stacks a folder of CT TIFF slices into a single `.npy` volume.


  Edit the paths at the top, then run:

  ```bash

  python stack.py

  ```

  It stacks both the HE and LE scans in one run and saves both `.npy`

  files. Set `crop_match = True` if the two scans need to be cropped

  to the same width before comparing them.


  ### `histogram.py`

  Plots a 2D histogram of low-energy vs high-energy voxel values.

  Different materials cluster in different regions of the plot, so it''s

  a quick way to visually tell materials apart.


  Edit the paths at the top, then run:

  ```bash

  python histogram.py

  ```

  Requires matched LE/HE `.npy` volumes of the same shape (produced by

  `stack.py`). If background air is squashing the plot, set

  `air_threshold` to a value above the air peak.


  ## Install


  ```bash

  pip install -r requirements.txt

  ```


  ## Disclaimer


  This project is not affiliated with, endorsed by, or supported by

  Carl Zeiss AG. DSCoVer (Dual Scan Contrast Visualizer) is a feature of

  ZEISS Xradia Versa 3D X-ray microscopes. This project is an independent

  Python reimplementation of the same general dual-energy CT

  material-discrimination concept, not the ZEISS software itself.


  ## License


  MIT. See [LICENSE](LICENSE).


readme_excerpt: "# Laporan: Client-Server-TCP-Model\nNAMA : Emmanuel Satria Anugrah Dewangga  </br> NIM\
  \ : 1203220132\n\n## Pendahuluan\nDokumen ini akan menjelaskan tentang sistem klien-server yang menggunakan\
  \ socket TCP untuk komunikasi. Terdiri dari dua bagian utama, yaitu sisi server dan sisi klien. Tujuan\
  \ utamanya adalah memungkinkan klien untuk berkomunikasi dengan server dan berinteraksi dengan sistem\
  \ file server.\n\n## Sisi Server\nServer bertugas menerima perintah dari klien, menjalankan perintah\
  \ tersebut, dan memberikan respons kepada klien. Berikut adalah fitur dan cara penggunaan Server:\n\n\
  ### Fitur:\n- Menerima perintah seperti ls, rm, size, download, upload, dan byebye.\n- Melakukan operasi\
  \ seperti menampilkan daftar file, menghapus file, mendapatkan ukuran file, mengunduh file, dan mengunggah\
  \ file.\n- Menangani berbagai jenis kesalahan seperti file tidak ditemukan atau kesalahan saat membaca/menulis\
  \ file.\n\n### Cara Penggunaan:\n1. Jalankan Server dengan mengeksekusi file ServerTCP.py.\n2. Program\
  \ akan menunggu koneksi dari klien. (Menunggu client mengirimkan perintah conme)\n3. Setelah koneksi\
  \ terbentuk, server akan menerima perintah dari klien.\n4. Klien dapat mengirim perintah seperti ls,\
  \ rm, size, download, upload, dan byebye.\n5. Server akan menanggapi perintah tersebut dan menjalankan\
  \ operasi yang sesuai pada sistem file server.\n6. Klien dapat terus berinteraksi dengan server sampai\
  \ mengirim perintah byebye untuk menutup koneksi.\n\n## Sisi Klien\nKlien bertugas berkomunikasi dengan\
  \ server dengan mengirimkan perintah dan menerima respons. Berikut adalah fitur dan cara penggunaan\
  \ klien:\n\n### Fitur:\n- Mengirim perintah seperti ls, rm, size, download, upload, dan byebye ke server.\n\
  - Menerima respons dari server dan menampilkannya kepada pengguna.\n- Mengunggah file ke server dan\
  \ mengunduh file dari server.\n\n### Cara Penggunaan:\n1. Jalankan klien dengan mengeksekusi file ClientTCP.py.\n\
  2. Program akan berjalan dan menampilkan pesan bahwa klien sedang aktif.\n3. Gunakan perintah connme\
  \ untuk menghubungkan klien ke server.\n4. Masukkan perintah yang diinginkan, seperti ls, rm, size,\
  \ download, upload, dan byebye.\n5. Klien akan mengirim perintah tersebut ke server dan menampilkan\
  \ respons yang diterima dari server.\n6. Pengguna dapat terus berinteraksi dengan server sampai mengirim\
  \ perintah byebye untuk menutup koneksi.\n\n## Kesimpulan\n Sistem klien-server ini menyediakan antarmuka\
  \ sederhana untuk berkomunikasi dengan sistem file server menggunakan socket TCP. Pengguna dapat mengirim\
  \ perintah ke server dan melakukan operasi seperti menampilkan daftar file, menghapus file, mengunggah\
  \ file, dan mengunduh file. Tentunya, penggunaan sistem ini dapat ditingkatkan dengan peningkatan fitur\
  \ keamanan dan penanganan kesalahan yang lebih baik.\n"

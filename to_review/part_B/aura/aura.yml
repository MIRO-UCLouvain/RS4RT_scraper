readme_excerpt: "# AURA - Automatic Segmentation Tool for Radiotherapy\r\n\r\n[![License: CC BY-NC-SA\
  \ 4.0](https://img.shields.io/badge/License-CC%20BY--NC--SA%204.0-lightgrey.svg)](https://creativecommons.org/licenses/by-nc-sa/4.0/)\r\
  \n[![Python 3.8+](https://img.shields.io/badge/python-3.8+-blue.svg)](https://www.python.org/downloads/)\r\
  \n[![Windows](https://img.shields.io/badge/platform-Windows-blue.svg)](https://www.microsoft.com/windows/)\r\
  \n[![TotalSegmentator](https://img.shields.io/badge/AI-TotalSegmentator%20V2-green.svg)](https://github.com/wasserth/TotalSegmentator)\r\
  \n\r\n**AURA** is a user-friendly automatic segmentation tool designed for radiotherapy applications.\
  \ It provides an intuitive GUI for medical professionals to automatically segment anatomical structures\
  \ from CT scans using state-of-the-art AI models.\r\n\r\n![AURA Interface](https://via.placeholder.com/800x400/1e1e2e/cdd6f4?text=AURA+Interface+Screenshot)\r\
  \n\r\n## ✨ Features\r\n\r\n- \U0001F3AF **117 Anatomical Structures** - Automatic segmentation using\
  \ TotalSegmentator V2\r\n- ✨ **Smart Default Selection** - 30+ essential organs preselected for immediate\
  \ radiotherapy use\r\n- \U0001F5A5️ **User-Friendly GUI** - Intuitive interface designed for medical\
  \ professionals\r\n- ⚡ **Batch Processing** - Process multiple patients simultaneously\r\n- \U0001F3A8\
  \ **Multiple Themes** - Azure, Light, and Dark theme options\r\n- \U0001F527 **Flexible Installation**\
  \ - Multiple installation methods to suit different environments\r\n- \U0001F4BE **DICOM Support** -\
  \ Direct processing of DICOM CT images\r\n- \U0001F4CA **RTSTRUCT Output** - Generate radiotherapy structure\
  \ files\r\n- \U0001F5B1️ **Easy Configuration** - Point-and-click settings management\r\n- \U0001F4A1\
  \ **Persistent Preferences** - Saves your organ selections for each task type\r\n\r\n## \U0001F680 Quick\
  \ Start\r\n\r\n### For Users with Python Already Installed\r\n\r\n1. **Download** the complete AURA\
  \ package from [Releases](../../releases)\r\n2. **Double-click** `InstallerVENV.bat`\r\n3. **Wait**\
  \ for installation to complete\r\n4. **Launch** AURA by double-clicking `Run_AURA.bat`\r\n\r\n### For\
  \ Users Without Python\r\n\r\n1. **Download** the complete AURA package from [Releases](../../releases)\r\
  \n2. **Double-click** `install_aura.bat`\r\n3. **Wait** for installation (takes longer, downloads Python)\r\
  \n4. **Launch** AURA by double-clicking `Run_AURA.bat`\r\n\r\n## \U0001F4CB System Requirements\r\n\r\
  \n- **Operating System**: Windows 10/11 (64-bit)\r\n- **Memory**: At least 8GB RAM recommended\r\n-\
  \ **Storage**: 4GB free disk space minimum\r\n- **Internet**: Required for initial setup and model downloads\r\
  \n- **GPU**: NVIDIA GPU recommended (CPU processing supported)\r\n- **Python**: 3.8+ with \"Add to PATH\"\
  \ enabled\r\n- **Git**: Optional but recommended for TotalSegmentator installation\r\n\r\n### Downloads\r\
  \n- **Python**: https://www.python.org/downloads/\r\n- **Git for Windows**: https://git-scm.com/download/win\r\
  \n\r\n## \U0001F4E6 Installation Methods\r\n\r\nAURA offers multiple installation methods to accommodate\
  \ different user needs and system configurations:\r\n\r\n| Method | Best For | Requirements | Pros |\
  \ Cons |\r\n|--------|----------|-------------|------|------|\r\n| **Virtual Environment** \U0001F3AF\
  \ | Most users | Python 3.8+ installed | ✅ Isolated environment<br>✅ Faster setup<br>✅ No system conflicts\
  \ | Python pre-installation required |\r\n| **Embedded Python** \U0001F4E6 | Users without Python |\
  \ None | ✅ Fully self-contained<br>✅ No Python needed | Larger download, slower setup |\r\n| **Simple\
  \ System** ⚡ | Troubleshooting | Python 3.11+ installed | ✅ Quick fallback option | Less isolation |\r\
  \n\r\n### Method 1: Virtual Environment (Recommended)\r\n\r\n```bash\r\n# Prerequisites: Python 3.8+\
  \ installed with PATH enabled\r\n1. Double-click InstallerVENV.bat\r\n2. Double-click Run_AURA.bat to\
  \ launch\r\n```\r\n\r\n### Method 2: Embedded Python (Standalone)\r\n\r\n```bash\r\n# No prerequisites\
  \ required\r\n1. Double-click install_aura.bat\r\n2. Double-click Run_AURA.bat to launch\r\n```\r\n\r\
  \n### Method 3: Simple System Installation\r\n\r\n```bash\r\n# Prerequisites: Python 3.11+ installed\
  \ with PATH enabled\r\n1. Double-click install_aura_simple.bat\r\n2. Double-click Run_AURA_Simple.bat\
  \ to launch\r\n```\r\n\r\n## \U0001F527 TotalSegmentator Installation\r\n\r\nIf you encounter the error:\r\
  \n```\r\n❌ TotalSegmentator not available: No module named 'totalsegmentatorV2'\r\n```\r\n\r\nUse the\
  \ included `InstallTotalSegmentator.bat` script for automatic installation.\r\n\r\n### Using the TotalSegmentator\
  \ Installer\r\n\r\n1. **Close AURA** if it's currently running\r\n2. **Double-click** `InstallTotalSegmentator.bat`\r\
  \n3. **Wait** for the installation to complete\r\n4. **Press any key** to close the installer window\r\
  \n5. **Launch AURA** again using `Run_AURA.bat`\r\n\r\nThis script automatically:\r\n- ✅ Activates the\
  \ correct virtual environment used by AURA\r\n- ✅ Attempts to install TotalSegmentatorV2 from GitHub\
  \ (if Git is available)\r\n- ✅ Falls back to ZIP installation if Git is not installed\r\n- ✅ Ensures\
  \ compatibility with AURA's environment\r\n\r\n### Manual TotalSegmentator Installation Options\r\n\r\
  \n#### Option A: Without Git (Simpler)\r\n1. Download: https://github.com/StanfordMIMI/TotalSegmentatorV2/archive/refs/heads/main.zip\r\
  \n2. Open CMD in the project folder and activate venv:\r\n   ```bash\r\n   venv\\Scripts\\activate\r\
  \n   ```\r\n3. Install from ZIP:\r\n   ```bash\r\n   pip install \"%USERPROFILE%\\Downloads\\TotalSegmentatorV2-main.zip\"\
  \r\n   ```\r\n\r\n#### Option B: With Git (More Flexible)\r\n```bash\r\nvenv\\Scripts\\activate\r\n\
  pip install --upgrade pip\r\npip install git+https://github.com/StanfordMIMI/TotalSegmentatorV2.git\r\
  \n```\r\n\r\n#### Option C: Official PyPI Version\r\n```bash\r\npip install TotalSegmentator\r\n```\r\
  \n\r\n**Note**: AURA supports both `totalsegmentatorv2` and `totalsegmentator` imports (case-sensitive).\r\
  \n\r\n## \U0001F3E5 How to Use AURA\r\n\r\n### Basic Workflow\r\n\r\n1. **Prepare Data**: Organize patient\
  \ DICOM files in separate subfolders\r\n2. **Launch AURA**: Use the appropriate `Run_AURA.bat` file\r\
  \n3. **Select Input**: Choose folder containing patient DICOM subfolders\r\n4. **Select Output**: Choose\
  \ destination for RTSTRUCT files\r\n5. **Verify Organs** (v1.02+): Essential organs are preselected\
  \ - customize if needed\r\n6. **Configure**: Adjust settings as needed (optional)\r\n7. **Process**:\
  \ Click \"Process ONE patient\" or \"Process ALL (batch)\"\r\n\r\n> **New in v1.02**: AURA now preselects\
  \ 30+ essential organs commonly used in radiotherapy planning. You can start processing immediately\
  \ or customize the selection to fit your specific needs.\r\n\r\n### Input Data Structure\r\n```\r\n\U0001F4C2\
  \ Patients/\r\n├── \U0001F4C1 Patient001/\r\n│   ├── \U0001F4C4 CT001.dcm\r\n│   ├── \U0001F4C4 CT002.dcm\r\
  \n│   └── \U0001F4C4 ...\r\n├── \U0001F4C1 Patient002/\r\n│   ├── \U0001F4C4 CT001.dcm\r\n│   └── \U0001F4C4\
  \ ...\r\n└── \U0001F4C1 ...\r\n```\r\n\r\n### Output Structure\r\n```\r\n\U0001F4C2 Output/\r\n├── \U0001F4C4\
  \ Patient001_segmentation.dcm\r\n├── \U0001F4C4 Patient002_segmentation.dcm\r\n└── \U0001F4C4 ...\r\n\
  ```\r\n\r\n## ⚙️ Configuration Options\r\n\r\n### Appearance Settings\r\n- **Theme Selection**: Azure\
  \ (default), Light, or Dark themes\r\n- **UI Scaling**: Automatic scaling for different screen sizes\r\
  \n\r\n### Segmentation Settings\r\n- **Organ Selection**:\r\n  - 30+ organs automatically preselected\
  \ for radiotherapy (v1.02+)\r\n  - Customize selection for specific clinical needs\r\n  - Selections\
  \ are saved per task type for convenience\r\n- **Orientation Options**: Flip volume axes if needed\r\
  \n- **Mask Cleaning**: Enable/disable morphological cleanup operations\r\n- **Crop Margin**: Adjust\
  \ automatic body cropping margins\r\n\r\n### Model Settings\r\n- **Resolution**: \r\n  - High (1.5mm):\
  \ Best quality, requires more memory and time\r\n  - Fast (3mm): Faster processing, good quality for\
  \ most applications\r\n- **Device Selection**: Automatic GPU detection with CPU fallback\r\n- **Auto\
  \ Cropping**: Smart body boundary detection\r\n\r\n## \U0001F9E0 AI Technology\r\n\r\nAURA leverages\
  \ **TotalSegmentator V2**, a state-of-the-art deep learning model for medical image segmentation:\r\n\
  \r\n- **117 Anatomical Structures** including organs, bones, vessels, and muscles\r\n- **Automatic Model\
  \ Management** - Models download automatically on first use\r\n- **Multi-Resolution Support** - Choose\
  \ between speed and accuracy\r\n- **GPU Acceleration** - NVIDIA GPU support with automatic CPU fallback\r\
  \n- **Robust Processing** - Handles various CT scan protocols and qualities\r\n\r\n### Supported Anatomical\
  \ Structures\r\nMajor organ systems including brain, thorax, abdomen, pelvis, and extremities. Full\
  \ list available in the application help documentation.\r\n\r\n## \U0001F6E0️ Utility Scripts\r\n\r\n\
  After installation, AURA provides several utility scripts for maintenance:\r\n\r\n| Script | Purpose\
  \ | Usage |\r\n|--------|---------|-------|\r\n| `Run_AURA.bat` | Launch application | Daily use |\r\
  \n| `InstallTotalSegmentator.bat` | Install/fix TotalSegmentator | When segmentation fails |\r\n| `Update_AURA.bat`\
  \ | Update dependencies | When updates available |\r\n| `Debug_AURA.bat` | Development console | Troubleshooting\
  \ |\r\n| `Uninstall_AURA.bat` | Remove installation | Complete uninstall |\r\n\r\n## \U0001F6A8 Troubleshooting\r\
  \n\r\n### Common Issues and Solutions\r\n\r\n#### TotalSegmentator Issues\r\n- **\"No module named 'totalsegmentatorV2'\"\
  **: Run `InstallTotalSegmentator.bat` or verify installation:\r\n  ```bash\r\n  venv\\Scripts\\activate\r\
  \n  python -c \"import importlib; print(bool(importlib.util.find_spec('totalsegmentatorv2') or importlib.util.find_spec('totalsegmentator')))\"\
  \r\n  ```\r\n- **Module case sensitivity**: Ensure imports use lowercase (`totalsegmentatorv2` or `totalsegmentator`)\r\
  \n\r\n#### Git and Installation Problems\r\n- **\"Cannot find command 'git'\"**: Install Git for Windows\
  \ or use ZIP installation method\r\n- **\"Python not found\"**: Install Python 3.8+ with \"Add to PATH\"\
  \ enabled\r\n- **\"Permission denied\"**: Run installer as Administrator\r\n\r\n#### Runtime Problems\r\
  \n- **\"CUDA out of memory\"**: Switch to CPU mode or use Fast (3mm) resolution\r\n- **\"Segmentation\
  \ failed\"**: Verify DICOM files are valid CT images\r\n- **\"Insufficient disk space\"**: Ensure 2-3GB\
  \ free space available\r\n- **Model download fails/slow**: First run requires internet and patience\
  \ for model downloads\r\n\r\n#### Performance Issues\r\n- **Slow processing**: Use GPU mode and Fast\
  \ resolution for better speed\r\n- **High memory usage**: Close other applications, use CPU mode if\
  \ needed\r\n- **GPU not detected**: Ensure NVIDIA drivers + CUDA/cuDNN compatibility with PyTorch\r\n\
  \r\n### Getting Help\r\n\r\n1. **Check Application Logs**: Use Help → View log in AURA\r\n2. **Debug\
  \ Mode**: Run `Debug_AURA.bat` for detailed error information\r\n3. **Update Dependencies**: Run `Update_AURA.bat`\
  \ to ensure latest versions\r\n4. **Reinstall TotalSegmentator**: Use `InstallTotalSegmentator.bat`\r\
  \n5. **Complete Reinstall**: Use `Uninstall_AURA.bat` followed by fresh installation\r\n\r\n## \U0001F504\
  \ Updates and Maintenance\r\n\r\n### Updating AURA\r\n- Run `Update_AURA.bat` to update all Python dependencies\r\
  \n- Download new AURA releases from the [Releases](../../releases) page\r\n- Use `InstallTotalSegmentator.bat`\
  \ to update TotalSegmentator models\r\n\r\n### Version History\r\n\r\n#### v1.02 (October 2025)\r\n\
  - \U0001F3AF **Default Organ Selection**: Automatically preselects 30+ essential organs for radiotherapy\
  \ planning\r\n  - Brain, spinal cord, eyes, optic nerves, and lenses\r\n  - Complete lung lobes, heart,\
  \ and esophagus\r\n  - Abdomen: liver, stomach, pancreas, duodenum, kidneys, colon, bladder\r\n  - Pelvis:\
  \ prostate\r\n  - Extremities: femoral heads\r\n  - Breast tissue and skin/body contours\r\n- \U0001F504\
  \ **Smart Preferences**: Previous organ selections are saved per task and automatically restored\r\n\
  - ⚡ **Improved Workflow**: No need to manually select organs on first use - start segmenting immediately\r\
  \n\r\n#### v1.0 (Initial Release)\r\n- Initial release with TotalSegmentator V2 integration\r\n- 117\
  \ anatomical structures support\r\n- Batch processing capabilities\r\n- Multi-theme interface\r\n- RTSTRUCT\
  \ output generation\r\n\r\nCheck [Releases](../../releases) for detailed changelog\r\n\r\n## \U0001F91D\
  \ Contributing\r\n\r\nWe welcome contributions from the medical imaging and radiotherapy community!\r\
  \n\r\n### How to Contribute\r\n1. Fork the repository\r\n2. Create a feature branch (`git checkout -b\
  \ feature/amazing-feature`)\r\n3. Commit your changes (`git commit -m 'Add amazing feature'`)\r\n4.\
  \ Push to the branch (`git push origin feature/amazing-feature`)\r\n5. Open a Pull Request\r\n\r\n###\
  \ Developm"

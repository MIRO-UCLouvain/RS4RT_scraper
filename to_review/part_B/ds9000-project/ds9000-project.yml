readme_excerpt: "# DS9000 group project\n\n## Group members\nBoris Ngassam, Paula Magbor, Richard Zhang,\
  \ Yixiu He, Rachel Barboza\n\n## Dataset:\nThis MOTUM dataset (Multi-origin brain tumor MRI) contains\
  \ MRI images from 67 patients diagnosed with aggressive malignant brain tumours. These tumours are categorized\
  \ into two types: high grade gliomas (HGG) and brain metastases (BM). \n\n**Reference:**\nGong, Z. et\
  \ al. A Multi-Center, Multi-Parametric MRI Dataset of Primary and Secondary Brain Tumors. Sci Data 11,\
  \ 789 (2024).\n\n**Source:**\n\n[MOTUM Repository (G-Node)](https://gin.g-node.org/hongweilibran/motum)\n\
  \n[MOTUM Dataset (Harvard Dataverse)](https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/KUUEWC)\n\
  \n\n## Project summary:\nDistinguishing high-grade gliomas (HGGs) from brain metastases (BMs) is a clinical\
  \ challenge, as both tumor types possess similar MRI characteristics. Machine Learning (ML) approaches\
  \ offer a non-invasive method of differentiation, but few studies directly compare radiomics-based classification\
  \ models with deep learning approaches. In this study, we used the MOTUM dataset, consisting of multisequence\
  \ MRI scans and radiomic features. We aim to evaluate the relative performance of traditional ML models\
  \ using radiomics data compared to deep learning approaches trained directly on MRI images. Radiomics\
  \ feature selection was conducted using correlation metrics and Boruta algorithm, followed by training\
  \ and hyperparameter optimization using PyCaret.\n\n## Workflow:\n<p align=\"center\">\n  <img src=\"\
  data/workflow.png\" width=\"60%\">\n  <img src=\"data/radiomics_pipeline.png\" width=\"75%\">\n  <img\
  \ src=\"data/dl_pipeline.png\" width=\"75%\">\n<p align=\"center\">\n"

readme_excerpt: "# [U-Mamba](https://wanglab.ai/u-mamba.html)\r\n\r\nOfficial repository for U-Mamba:\
  \ Enhancing Long-range Dependency for Biomedical Image Segmentation.\r\nWelcome to join our [mailing\
  \ list](https://forms.gle/bLxGb5SEpdLCUChQ7) to get updates.\r\n\r\n## Installation \r\n\r\nRequirements:\
  \ `Ubuntu 20.04`, `CUDA 11.8`\r\n\r\n1. Create a virtual environment: `conda create -n umamba python=3.10\
  \ -y` and `conda activate umamba `\r\n2. Install [Pytorch](https://pytorch.org/get-started/previous-versions/#linux-and-windows-4)\
  \ 2.0.1: `pip install torch==2.0.1 torchvision==0.15.2 --index-url https://download.pytorch.org/whl/cu118`\r\
  \n3. Install [Mamba](https://github.com/state-spaces/mamba): `pip install causal-conv1d>=1.2.0` and\
  \ `pip install mamba-ssm --no-cache-dir`\r\n4. Download code: `git clone https://github.com/bowang-lab/U-Mamba`\r\
  \n5. `cd U-Mamba/umamba` and run `pip install -e .`\r\n\r\n\r\nsanity test: Enter python command-line\
  \ interface and run\r\n\r\n```bash\r\nimport torch\r\nimport mamba_ssm\r\n```\r\n\r\n![network](https://github.com/bowang-lab/U-Mamba/blob/main/assets/U-Mamba-network.png)\r\
  \n\r\n\r\n\r\nhttps://github.com/bowang-lab/U-Mamba/assets/19947331/1ac552d6-4ffd-4909-ba31-7b48644fd104\r\
  \n\r\n\r\n\r\n\r\n## Model Training\r\nDownload dataset [here](https://drive.google.com/drive/folders/1DmyIye4Gc9wwaA7MVKFVi-bWD2qQb-qN?usp=sharing)\
  \ and put them into the `data` folder. U-Mamaba is built on the popular [nnU-Net](https://github.com/MIC-DKFZ/nnUNet)\
  \ framework. If you want to train U-Mamba on your own dataset, please follow this [guideline](https://github.com/MIC-DKFZ/nnUNet/blob/master/documentation/dataset_format.md)\
  \ to prepare the dataset. \r\n\r\n### Preprocessing\r\n\r\n```bash\r\nnnUNetv2_plan_and_preprocess -d\
  \ DATASET_ID --verify_dataset_integrity\r\n```\r\n\r\n### Train 2D models\r\n\r\n- Train 2D `U-Mamba_Bot`\
  \ model\r\n\r\n```bash\r\nnnUNetv2_train DATASET_ID 2d all -tr nnUNetTrainerUMambaBot\r\n```\r\n\r\n\
  - Train 2D `U-Mamba_Enc` model\r\n\r\n```bash\r\nnnUNetv2_train DATASET_ID 2d all -tr nnUNetTrainerUMambaEnc\r\
  \n```\r\n\r\n### Train 3D models\r\n\r\n- Train 3D `U-Mamba_Bot` model\r\n\r\n```bash\r\nnnUNetv2_train\
  \ DATASET_ID 3d_fullres all -tr nnUNetTrainerUMambaBot\r\n```\r\n\r\n- Train 3D `U-Mamba_Enc` model\r\
  \n\r\n```bash\r\nnnUNetv2_train DATASET_ID 3d_fullres all -tr nnUNetTrainerUMambaEnc\r\n```\r\n\r\n\r\
  \n## Inference\r\n\r\n- Predict testing cases with `U-Mamba_Bot` model\r\n\r\n```bash\r\nnnUNetv2_predict\
  \ -i INPUT_FOLDER -o OUTPUT_FOLDER -d DATASET_ID -c CONFIGURATION -f all -tr nnUNetTrainerUMambaBot\
  \ --disable_tta\r\n```\r\n\r\n- Predict testing cases with `U-Mamba_Enc` model\r\n\r\n```bash\r\nnnUNetv2_predict\
  \ -i INPUT_FOLDER -o OUTPUT_FOLDER -d DATASET_ID -c CONFIGURATION -f all -tr nnUNetTrainerUMambaEnc\
  \ --disable_tta\r\n```\r\n\r\n> `CONFIGURATION` can be `2d` and `3d_fullres` for 2D and 3D models, respectively.\r\
  \n\r\n## Remarks\r\n\r\n1. Path settings\r\n\r\nThe default data directory for U-Mamba is preset to\
  \ U-Mamba/data. Users with existing nnUNet setups who wish to use alternative directories for `nnUNet_raw`,\
  \ `nnUNet_preprocessed`, and `nnUNet_results` can easily adjust these paths in umamba/nnunetv2/path.py\
  \ to update your specific nnUNet data directory locations, as demonstrated below:\r\n\r\n```python\r\
  \n# An example to set other data path,\r\nbase = '/home/user_name/Documents/U-Mamba/data'\r\nnnUNet_raw\
  \ = join(base, 'nnUNet_raw') # or change to os.environ.get('nnUNet_raw')\r\nnnUNet_preprocessed = join(base,\
  \ 'nnUNet_preprocessed') # or change to os.environ.get('nnUNet_preprocessed')\r\nnnUNet_results = join(base,\
  \ 'nnUNet_results') # or change to os.environ.get('nnUNet_results')\r\n```\r\n\r\n2. AMP could lead\
  \ to nan in the Mamba module. We also provide a trainer without AMP: https://github.com/bowang-lab/U-Mamba/blob/main/umamba/nnunetv2/training/nnUNetTrainer/nnUNetTrainerUMambaEncNoAMP.py\r\
  \n\r\n## Paper\r\n\r\n```\r\n@article{U-Mamba,\r\n    title={U-Mamba: Enhancing Long-range Dependency\
  \ for Biomedical Image Segmentation},\r\n    author={Ma, Jun and Li, Feifei and Wang, Bo},\r\n    journal={arXiv\
  \ preprint arXiv:2401.04722},\r\n    year={2024}\r\n}\r\n```\r\n\r\n\r\n## Acknowledgements\r\n\r\n\
  We acknowledge all the authors of the employed public datasets, allowing the community to use these\
  \ valuable resources for research purposes. We also thank the authors of [nnU-Net](https://github.com/MIC-DKFZ/nnUNet)\
  \ and [Mamba](https://github.com/state-spaces/mamba) for making their valuable code publicly available.\r\
  \n\r\n"

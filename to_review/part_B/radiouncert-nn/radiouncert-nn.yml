readme_excerpt: "# Radiotherapy Uncertainty with nnUNet\r\n\r\n> Deep Ensemble Framework for Uncertainty\
  \ Estimation in Radiotherapy Segmentation\r\n\r\nA modular deep ensemble framework built on [nnUNet](https://github.com/MIC-DKFZ/nnUNet)\
  \ for robust uncertainty estimation in medical image segmentation, specifically designed for radiotherapy\
  \ applications.\r\n\r\n## ✨ Key Features\r\n\r\n- \U0001F501 **CVE (Cross-Validation Ensemble)**: Aggregates\
  \ predictions from k-fold cross-validation models to capture model variance due to data splitting.\r\
  \n- \U0001F4E6 **CPE (Checkpoint Ensemble)**: \r\n  - Saves checkpoints at fixed intervals during training\r\
  \n  - Flexible policy: save `best` (by validation metric) or `last` checkpoint per interval\r\n  - Ensemble\
  \ predictions from multiple training snapshots to capture optimization uncertainty\r\n- \U0001F310 **DDE\
  \ (Data-Diversity Ensemble)**: Leverages heterogeneous data subsets or augmentations to quantify uncertainty\
  \ from data distribution shifts.\r\n- \U0001F3AF **Uncertainty Quantification**: Outputs voxel-wise\
  \ predictive variance, entropy, or Monte-Carlo style confidence maps for clinical decision support.\r\
  \n- ⚙️ **nnUNet-native**: Fully compatible with nnUNet's preprocessing, training, and inference pipeline\
  \ — minimal code changes required.\r\n\r\n## \U0001F9E0 Steps\r\n"

readme_excerpt: "# HNSCC Radiotherapy Cohort: Survival Analysis\n\n**Author:** Shreyu Umapathy  \n**Date:**\
  \ November 2025  \n**Topic:** Biostatistics, Clinical Research & Epidemiology  \n\n---\n\n## \U0001F4CC\
  \ Project Overview\nThis repository contains a comprehensive survival analysis of a Head and Neck Squamous\
  \ Cell Carcinoma (HNSCC) radiotherapy cohort. The goal of this project is to evaluate the clinical and\
  \ behavioral predictors of overall survival—focusing on smoking status, cancer stage, age, and body\
  \ mass index (BMI)—while accounting for potential confounding pathways using Directed Acyclic Graphs\
  \ (DAGs).\n\n---\n\n## \U0001F6E0️ Tech Stack & Libraries\nThis analysis was performed in **R** using\
  \ the following libraries:\n* **`survival`**: Core package for survival analysis, Cox proportional hazards\
  \ modeling, and diagnostics.\n* **`survminer`**: Visualization of Kaplan-Meier curves and diagnostics\
  \ (Schoenfeld residuals, log-minus-log plots).\n* **`dagitty`**: Design and modeling of Directed Acyclic\
  \ Graphs (DAGs) to identify confounding pathways and minimal adjustment sets.\n* **`gtsummary`**: Formatted\
  \ statistical tables (Table 1 descriptive statistics and Cox regression summaries).\n* **`dplyr` & `readxl`**:\
  \ Data import, cleaning, and recoding.\n\n---\n\n## \U0001F4C8 Methodology & Analyses Included\n\n###\
  \ 1. Data Cleaning & Recoding\n* Recoded continuous age variables into 10-year categorical bins (`30-39`,\
  \ `40-49`, `50-59`, `60-69`, `70+`).\n* Consolidated tumor clinical staging by merging Stage `IVA` and\
  \ `IVB` into a unified Stage `IV` group.\n* Extracted and formatted survival times (in months) and event\
  \ indicators (death vs. censoring).\n\n### 2. Kaplan-Meier Survival Analysis\nEstimated survival probability\
  \ curves and generated risk tables stratified by:\n* **Smoking Status** (Current Smoker vs. Non-Smoker)\n\
  * **Age Groups** (10-year intervals)\n* **Clinical Tumor Stage** (I, II, III, IV)\n\n### 3. Directed\
  \ Acyclic Graph (DAG) Modeling\nDesigned a causal framework mapping the pathways between:\n$$\\text{Age}\
  \ \\to \\text{Smoking History} \\to \\text{Current Smoker} \\to \\text{Survival}$$\nDetermined that\
  \ **Age** acts as a critical confounder of the relationship between smoking history and mortality, necessitating\
  \ adjustment.\n\n### 4. Cox Proportional Hazards Regression\n* **Univariate (Crude) Models**: Analyzed\
  \ the individual, unadjusted association of each predictor (Stage, Grade, Sex, BMI, Smoking, Diagnosis\
  \ Site) with survival.\n* **Multivariable (Adjusted) Models**: Adjusted the effect of smoking history\
  \ on overall survival for age-related confounding.\n* **Proportional Hazards Diagnostics**: Validated\
  \ the proportional hazards assumption using Schoenfeld residuals tests/plots and log-minus-log survival\
  \ curves.\n\n---\n\n## \U0001F4CA Key Findings & Insights\n* **Tumor Severity**: Higher clinical stage\
  \ was strongly associated with poorer overall survival, demonstrating a clear risk gradient from Stage\
  \ I through Stage IV.\n* **Physical Health**: Lower BMI at treatment initiation was significantly associated\
  \ with higher mortality, highlighting body composition as a key prognostic indicator.\n* **Smoking &\
  \ Confounding**:\n  * In unadjusted models, current smoking and smoking history were linked to higher\
  \ mortality.\n  * In the multivariable model adjusting for age, the association between smoking history\
  \ and survival was not statistically significant ($\\text{HR} \\approx 1.07$, $p \\approx 0.60$).\n\
  \  * This suggests that the crude association was heavily driven by age-related confounding, as older\
  \ patients accumulated more pack-years of smoking and had higher natural mortality.\n\n---\n\n## \U0001F4C2\
  \ Project Structure\n* \U0001F4C4 **`survival_analysis.Rmd`**: The fully documented R Markdown script\
  \ containing the source code, data processing pipelines, and plotting parameters.\n* \U0001F4D5 **`HNSCC_Radiotherapy_Cohort_Survival_Analysis.pdf`**:\
  \ The final compiled publication-quality report showing all Kaplan-Meier plots, regression summaries,\
  \ and interpretations.\n\n---\n\n## \U0001F4DD References\nFeng, Z., Xu, Q., Chen, J., et al. (2017).\
  \ *Predictive biomarkers and survival in head and neck squamous cell carcinoma: The MDA HNSCC cohort.*\
  \ MD Anderson Cancer Center.\n"

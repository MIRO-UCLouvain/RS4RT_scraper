readme_excerpt: "# SRS Target Information\n\nAn ESAPI tool for automatically extracting geometric characteristics\
  \ of target lesions from Varian Eclipse treatment plans.\n\nThe script identifies all non-empty structures\
  \ whose IDs begin with **\"Exp\"** and summarizes their geometric information in an interactive WPF\
  \ interface. It was developed to support research involving single-isocenter multi-target stereotactic\
  \ radiosurgery (SIMT SRS).\n\n---\n\n## Features\n\n- Automatically detects all non-empty **Exp*** target\
  \ structures\n- Computes:\n  - Volume (cc)\n  - Bounding-box maximum dimension (mm)\n  - Equivalent-sphere\
  \ diameter (mm)\n  - Diameter ratio (equivalent-sphere diameter / bounding-box maximum dimension)\n\
  - Interactive WPF graphical interface\n- Sortable and resizable results table\n- Automatic validation\
  \ of missing or invalid structures\n- Compatible with Varian Eclipse ESAPI\n\n---\n\n## Repository Structure\n\
  \n```\nSRS-Target-Information/\n│\n├── GUI_SRS_Target_Information.cs\n├── README.md\n├── LICENSE\n└──\
  \ .gitignore\n```\n\n---\n\n## Requirements\n\n- Varian Eclipse\n- Eclipse Scripting API (ESAPI)\n-\
  \ .NET Framework 4.5 or later\n- Microsoft Visual Studio\n\nRequired ESAPI assemblies (not included):\n\
  \n- `VMS.TPS.Common.Model.API.dll`\n- `VMS.TPS.Common.Model.Types.dll`\n\nThese DLLs must be referenced\
  \ from your local Eclipse installation.\n\n---\n\n## Installation\n\n1. Clone the repository.\n\n```bash\n\
  git clone https://github.com/Zhuoyun-Huang/SRS-Target-Information.git\n```\n\n2. Open the project in\
  \ Visual Studio.\n\n3. Reference the ESAPI assemblies from your Eclipse installation.\n\n4. Build the\
  \ project.\n\n5. Launch the script from Eclipse.\n\n---\n\n## Workflow\n\n1. Open a patient in Eclipse.\n\
  2. Load a valid Structure Set.\n3. Run the script.\n4. All non-empty structures whose IDs begin with\
  \ **\"Exp\"** are automatically identified.\n5. Results are displayed in an interactive table containing:\n\
  \n- Structure ID\n- Volume (cc)\n- Bounding-box maximum dimension (mm)\n- Equivalent-sphere diameter\
  \ (mm)\n- Diameter ratio\n\n---\n\n## Method\n\n### Equivalent-Sphere Diameter\n\nThe equivalent-sphere\
  \ diameter is calculated from the lesion volume by assuming a sphere with identical volume:\n\n\\[\n\
  D = 2\\left(\\frac{3V}{4\\pi}\\right)^{1/3}\n\\]\n\nwhere \\(V\\) is the lesion volume.\n\n### Bounding-Box\
  \ Maximum Dimension\n\nThe maximum lesion dimension is estimated using the axis-aligned mesh bounding\
  \ box provided by Eclipse.\n\n> **Note:** This is **not** the true maximum Euclidean distance across\
  \ the lesion.\n\n### Diameter Ratio\n\nThe diameter ratio is defined as\n\n```\nmin(Equivalent Sphere\
  \ Diameter,\n    Bounding-Box Maximum Dimension)\n────────────────────────────────────\nmax(Equivalent\
  \ Sphere Diameter,\n    Bounding-Box Maximum Dimension)\n```\n\nValues closer to **1** indicate lesions\
  \ whose equivalent sphere diameter is similar to the bounding-box maximum dimension, while smaller values\
  \ indicate increasingly elongated or irregular geometries.\n\n> **Important:** This diameter ratio is\
  \ **not** the conventional three-dimensional sphericity metric.\n\n---\n\n## Example Output\n\n| Structure\
  \ ID | Volume (cc) | Bounding-box Max Dimension (mm) | Equivalent-Sphere Diameter (mm) | Diameter Ratio\
  \ |\n|--------------|------------:|--------------------------------:|--------------------------------:|---------------:|\n\
  | Exp01 | 1.82 | 18.6 | 15.1 | 0.81 |\n| Exp02 | 0.94 | 14.3 | 12.2 | 0.85 |\n\n---\n\n## Disclaimer\n\
  \nThis software is intended for **research and educational purposes only**.\n\nIt has **not** been validated\
  \ for clinical use and should **not** be used as the sole basis for clinical decision-making. Users\
  \ are responsible for independently verifying all measurements before any clinical application.\n\n\
  ---\n\n## License\n\nThis project is released under the **MIT License**.\n\n---\n\n## Author\n\n**Zhuoyun\
  \ Huang**\n\nPhD Student, Medical Physics  \nUniversity at Buffalo\n\n- GitHub: https://github.com/Zhuoyun-Huang\n\
  - LinkedIn: https://www.linkedin.com/in/zhuoyun-huang-0b55533bb/\n"

readme_excerpt: "# Radiation Therapy Treatment Data Summary \n\nA web application for viewing CODEx modeled\
  \ [Radiation Therapy Treatment Data](https://build.fhir.org/ig/HL7/codex-radiation-therapy/branches/master/artifacts.html)\
  \ summaries. For a helpful glossary of radiation therapy terminology, see [here](https://build.fhir.org/ig/HL7/fhir-mCODE-ig/glossary.html).\n\
  \n## Technologies Used\n\n- [Git](https://git-scm.com/)\n- [Node Js](https://nodejs.org/en/)\n- [React](https://reactjs.org/)\n\
  \  - Via [Create React App](https://create-react-app.dev/)\n- [Tailwind CSS](https://tailwindcss.com/)\n\
  \  - [Interactive Cheat Sheet](https://nerdcave.com/tailwind-cheat-sheet)\n- [Feather Icons](https://feathericons.com/)\n\
  \  - Specifically using [react-feather](https://github.com/feathericons/react-feather)\n- [FHIRPath](https://hl7.org/fhirpath/)\n\
  \n## Quick start\n\nRun the application in development mode with:\n\n```bash\nnpm start\n```\n\nAfter\
  \ changes have been made, you can deploy a new version of the application to github pages with:\n\n\
  ```bash\nnpm run deploy\n```\n\n## Create React App Docs\n\nThis project was bootstrapped with [Create\
  \ React App](https://github.com/facebook/create-react-app). Below are the default docs provided when\
  \ you kickstart a CRA project.\n\n### Available Scripts\n\nIn the project directory, you can run:\n\n\
  #### `npm start`\n\nRuns the app in the development mode.\\\nOpen [http://localhost:3000](http://localhost:3000)\
  \ to view it in your browser.\n\nThe page will reload when you make changes.\\\nYou may also see any\
  \ lint errors in the console.\n\n#### `npm test`\n\nLaunches the test runner in the interactive watch\
  \ mode.\\\nSee the section about [running tests](https://facebook.github.io/create-react-app/docs/running-tests)\
  \ for more information.\n\n#### `npm run build`\n\nBuilds the app for production to the `build` folder.\\\
  \nIt correctly bundles React in production mode and optimizes the build for the best performance.\n\n\
  The build is minified and the filenames include the hashes.\\\nYour app is ready to be deployed!\n\n\
  See the section about [deployment](https://facebook.github.io/create-react-app/docs/deployment) for\

readme_excerpt: "\n---\n\n# Enhancing Cone Beam Computed Tomography (CBCT) Images through Deep Learning\n\
  \n## Table of Contents\n1. [Introduction](#introduction)\n2. [Objectives](#objectives)\n3. [Methodology](#methodology)\n\
  4. [Prerequisites](#prerequisites)\n5. [Installation](#installation)\n6. [Usage](#usage)\n7. [Results](#results)\n\
  8. [Future Work](#future-work)\n9. [Contributing](#contributing)\n10. [License](#license)\n\n## Introduction\n\
  Traditional imaging techniques in Image-Guided Radiation Therapy (IGRT) often suffer from noise, artifacts,\
  \ and limited contrast ranges. Specifically, Cone Beam Computed Tomography (CBCT), a low-cost but less\
  \ reliable option than CT scans, needs enhancement to be more effectively used in medical procedures.\
  \ This project addresses these challenges by implementing deep learning algorithms tailored for CBCT\
  \ image quality enhancement.\n\n## Dataset \nLink : https://wiki.cancerimagingarchive.net/pages/viewpage.action?pageId=133071846\n\
  \n## Objectives\n- **Pre-Training on CT & CBCT Data**: Leverage Convolution Meets Masked Autoencoders\
  \ (ConvMAE) to pre-train the model using high-quality CT and CBCT images, ensuring the model grasps\
  \ the essential features from CT imaging.\n- **Architect a Deep Learning Algorithm**: Develop an end-to-end\
  \ deep learning model that incorporates Self-Supervised Learning and Generative Adversarial Networks\
  \ to enhance CBCT images.\n- **Performance Metrics**: Validate the algorithm's effectiveness using a\
  \ comprehensive set of metrics including SNR, PSNR, and SSIM, as well as expert clinical evaluations.\n\
  \n## Methodology\n- **Generative Adversarial Networks (GANs)**: Utilized to generate high-quality CBCT\
  \ images, eliminating noise and improving contrast.\n- **Composite Loss Functions**: Employ semantic\
  \ consistency and style loss for fine-tuning the objective function.\n- **Baseline Comparisons with\
  \ Astra-Toolbox**: The performance of our model is rigorously compared against images created by Astra-Toolbox\
  \ to evaluate its efficacy.\n\n## Prerequisites\n- Python 3.x\n- PyTorch 1.x\n- Astra-Toolbox\n- Other\
  \ dependencies can be found in `requirements.txt`\n\n## Installation\nClone the repository and install\
  \ the necessary packages:\n```bash\ngit clone https://github.com/kashyapHebbar/CBCT_Reconstruction.git\n\
  cd CBCT_Reconstruction\npip install -r requirements.txt\n```\n\n## Usage\nTo run the program:\n```bash\n\
  python main.py --options your-options\n```\n\n## Results\nThe developed algorithm significantly improves\
  \ CBCT image quality, outperforming traditional methods and exceeding current clinical standards. It\
  \ holds promise for improving the accuracy and reliability of IGRT in cancer treatment.\n\n## Future\
  \ Work\n- Investigate the adaptability of the model for other medical imaging techniques.\n- Incorporate\
  \ real-world clinical evaluations to assess practical viability.\n- Fine-tune the model for specific\
  \ types of artifacts and noise.\n\n## Contributing\nContributions are welcome! Please read the contributing\
  \ guidelines and code of conduct before submitting a pull request or opening an issue.\n\n## License\n\
  This project is licensed under the MIT License. See the [LICENSE](LICENSE) file for details.\n\n---\n\

readme_excerpt: "# TransMatch\nThis repository contains the implementations of the paper 'TransMatch:\
  \ A Transformer-based Multilevel Dual-Stream Feature Matching Network for Unsupervised Deformable Image\
  \ Registration,' published in the IEEE Transactions on Medical Imaging (TMI) journal. \n\n[[Paper](https://ieeexplore.ieee.org/abstract/document/10158729/)]\
  \ [[Code](https://github.com/tzayuan/TransMatch_TMI)]\n\n<a href=\"https://www.python.org/\"><img src=\"\
  https://img.shields.io/badge/Python-3.8-ff69b4.svg\" /></a>\n<a href= \"https://pytorch.org/\"> <img\
  \ src=\"https://img.shields.io/badge/PyTorch-2.1-2BAF2B.svg\" /></a>\n<a href=\"https://opensource.org/licenses/MIT\"\
  ><img src=\"https://img.shields.io/badge/License-MIT-yellow.svg\"></a>\n\n## What's News\n[4/2/2025]\
  \ - **Cross-modal image registration supported now. Our method achieved state-of-the-art performance\
  \ on several mainstream methods on the multimodal registration dataset SR-REG. Thanks to Yifan Guo for\
  \ his support and collaboration in this release.**\n\n[12/17/2023] - **The code has been re-reviewed\
  \ and debugged, and it is now ready for direct training and inference on the provided LPBA40 example\
  \ dataset.**\n        \n## Descriptions\nThis repository currently provides examples of implementing,\
  \ training, and inferring with the core model code. For the 'transmatch' folder, its contents are almost\
  \ identical to those in Models, except for the location of STN, which is specifically prepared for multimodal\
  \ registration. It also includes guidance on running the code on sample datasets. Additionally, there\
  \ are suggestions and code for visual analysis.\n\n## Train and Infer Command\nBefore running the commands,\
  \ please ensure that the dataset has been correctly placed. Taking the example of running the sample\
  \ code on the LPBA40 dataset, ensure that the LPBA40 dataset is placed under ```../../../Dataset/LPBA40_delineation/```.\
  \ This will ensure that the code can run directly without encountering any path-related errors. (Here,\
  \ ```./``` refers to the directory path where ```Train.py``` and ```Infer.py``` are located.)\n\nFor\
  \ Linux:\n\nTrain (mono-modality):  \n```export CUDA_VISIBLE_DEVICES=0``` (If needed)  \n```python Train.py```\n\
  \nInfer (mono-modality):  \n```export CUDA_VISIBLE_DEVICES=0``` (If needed)  \n```python Infer.py```\n\
  \nTrain (multi-modality):  \n```export CUDA_VISIBLE_DEVICES=0``` (If needed)  \n```python Train_mm_srreg.py```\n\
  \nInfer (multi-modality):  \n```export CUDA_VISIBLE_DEVICES=0``` (If needed)  \n```python Infer_mm_srreg.py```\n\
  \n## Dataset\nLPBA40 Datasets is uploded now.  [[LPBA40 dataset](https://drive.google.com/file/d/1mRmJpk06guietL3tUxpJjPYzEoJ0GLtm/view?usp=sharing)]\n\
  \nSR-REG Datasets and multimodal ckpt of SR-REG is uploede now. [[SR-REG dataset](https://drive.google.com/file/d/1YP0IOy3vthsC-QbDB4mbDPzJmyQ-ZsB4/view?usp=sharing)]\
  \  [[ckpt for SR-REG inference](https://drive.google.com/file/d/1Yrb3Ja5AkMQ0Ic14C6Tuzx2lZ5RvosSp/view?usp=sharing)]\n\
  \nAdditionally, you can effortlessly train the code by customizing your datasets. Please be aware that\
  \ you'll need to adjust the code file located at ```/utils/datagenerators_atlas.py``` to ensure the\
  \ dataset is loaded in accordance with your specific dataset organization format.\n\n## TODO\n- [x]\
  \ Core implementation code\n- [x] Description of run script\n- [x] Visualization code\n- [x] Datasets\
  \ url link (LPBA40 is uploaded)\n- [x] Cross-modal image registration supported\n- [ ] ~~Docker images\
  \ & Google Colab Documents~~ (Pull requests are always welcome!)\n\n\n\n## <img src=\"https://raw.githubusercontent.com/iampavangandhi/iampavangandhi/master/gifs/Hi.gif\"\
  \ width=\"30\"> Contact\nFeel free to contact me if you have any further questions: snowbplus [AT] gmail\
  \ [DOT] com.\n\n## Citation\nIf you find this code is useful in your research, please consider to cite:\n\
  ```\n@article{chen2023transmatch,\n  title={Transmatch: A transformer-based multilevel dual-stream feature\
  \ matching network for unsupervised deformable image registration},\n  author={Chen, Zeyuan and Zheng,\
  \ Yuanjie and Gee, James C},\n  journal={IEEE transactions on medical imaging},\n  volume={43},\n  number={1},\n\
  \  pages={15--27},\n  year={2023},\n  publisher={IEEE}\n}\n```\n\n## Acknowledgements\nThanks to Junyu\
  \ Chen and Tony C. W. Mok for their guidance and help with the open source code.\n\n"

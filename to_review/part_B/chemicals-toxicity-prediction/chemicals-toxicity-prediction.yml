readme_excerpt: "## Execution of code: \nWe have used Kaggle platform for the toxicity prediction challenge.\
  \ we also did our code execution and submission from Kaggle itself. \nWe included all our source codes\
  \ which is in (.ipynb format) and our output file (excel format). \nTo Change the platform: \nTo execute\
  \ our source code provided in different platform rather than Kaggle we would prefer jupyter notebook.\
  \ \n\nSteps to execute code in jupyter notebook: \n1. Open-source code provided (.ipynb format) in the\
  \ jupyter notebook. \n2. Upload the train, test and feamat csv in the jupyter notebook OR Change the\
  \ train, test and feamat datasets address in the code by mentioning their current location in the system.\
  \ \n3. Save and Run the code. \n \nUsing Google Colab Notebook, we can convert it to .py extension and\
  \ use the file for execution. \n\n## About the datasets:\n1. train.csv : This file contains chemical\
  \ records which will be used for training the model\n2. test.csv: This file contains chemical records\
  \ which will be used for predicting the chemicals as toxic (\"1\") or non-toxic (\"0\")\n3. feamat.csv:\
  \ This file contains features for each chemical in train and test files\n4. feature_id_name_mappings:\
  \ This file contains the attribute names for different columns in train and test files\n\n"

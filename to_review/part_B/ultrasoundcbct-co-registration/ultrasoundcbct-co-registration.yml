readme_excerpt: "# Ultrasound and CBCT Co-Registration \nThis project aims to spatially align Ultrasound\
  \ images with CBCT scans and test Ultrasound's efficacy in providing additional bone density data for\
  \ highly invasive dental procedures, aiding in pre-operative planning and surgery.\n\nThis project was\
  \ implemented in MATLAB programming language.\n\n## Project Investors\nThis project was assigned by\
  \ Dr. Dennis Flanagan, DMD to provide a Proof of Concept for testing the added benefits of Ultrasound\
  \ Imaging for invasive dental surgical operations and overall feasibility of this software design. Additional\
  \ requirments were given as a group. My individual contributions comprise all the code and work done\
  \ here.\n\n## Software Applications\nAn .nnrd file of a CBCT scan was used for this project because\
  \ it has great volume rendering and data preservation features, making visualization and analysis of\
  \ each scan/stitch easier. Additionally the MUST Toolbox was used for Ultrasound development. Both applications\
  \ can be found among the files. \n\n## Project Report\nThe full report of the software implementation\
  \ of this project can be found in the final_project.pdf file. To view the report, please download the\
  \ file and open it locally.\nAs for the MATLAB implementation, you can view it in MATLAB directly or\
  \ use the .html links to open in your web browser.\n\n## Results\nSpatially aligning a 2D Ultrasound\
  \ with a 3D CBCT Slice was successful and can be performed in real time. Further optimization is required\
  \ to enhance the real-time speed, while the feasibility of this process has been demonstrated conclusively.\
  \ To validate existing literature and confirm the efficacy of Ultrasound in accurately imaging the deep\
  \ medullary jawbone, an image dataset taken with higher frequency and power ultrasound is necessary.\n"

readme_excerpt: "# guiPMC\r\n\r\nThis repository contains the source code for a Qt user interface which\
  \ works as\r\na frontend for goPMC (THIS REPOSITORY DOES NOT CONTAIN goPMC ITSELF. Contact the authors\
  \ of [1-3] for more information regarding goPMC).\r\n\r\nIt also provides DICOM readers for CT images\
  \ and Ion RT plans based on grassroots dicom (GDCM) as included with ITK.\r\nThus ITK with the ImageIO\
  \ module is a dependency. (ITK is also used for geometric transformations of the particle sources).\r\
  \n\r\nThis code uses Qt for the user interface and a heavily modified Qt example for displaying particle\
  \ sources in 3D.\r\n(Licensing is still unclear to me, but I think re-use of that example requires LGPL/GPL\
  \ compliance)\r\n\r\n\r\nSystem requirements:\r\nOpenCL 1.1 or higher.\r\nCPU/GPU supporting OpenCL.\r\
  \n\r\nNEEDED (NOT PROVIDED) goPMC files:\r\nSubdirectories:\r\ninclude:\r\n\tgoPMC.h: goPMC interface.\r\
  \n\tcl.hpp: c++ wrapper for OpenCL 1.1.\r\nbin:\r\n\tdcmtk.dll(.lib) and libDicomRT.dll(.lib): Libraries\
  \ for reading and processing Dicom CT data.\r\n\tgoPMC.dll(.lib): goPMC library.\r\ninput:\r\n\tPhysics\
  \ input data.\r\n\r\nRelated publications:\r\n\r\n[1] GPU-based fast Monte Carlo dose calculation for\
  \ proton therapy\r\nXun Jia, Jan Schuemann, Harald Paganetti and Steve B. Jiang\r\nPhysics in Medicine\
  \ and Biology, Volume 57, Number 23\r\n\r\n[2] Validation of a GPU-based Monte Carlo code (gPMC) for\
  \ proton radiation therapy: clinical cases study\r\nDrosoula Giantsoudi, Jan Schuemann, Xun Jia, Stephen\
  \ Dowdell, Steve B. Jiang and Harald Paganetti\r\nPhysics in Medicine and Biology, Volume 60, Number\
  \ 6\r\n\r\n[3] Recent developments and comprehensive evaluations of a GPU-based Monte Carlo package\
  \ for proton therapy\r\nNan Qin, Pablo Botas, Drosoula Giantsoudi, Jan Schuemann, Zhen Tian, Steve B.\
  \ Jiang, Harald Paganetti and Xun Jia\r\nAccepted by Physics in Medicine and Biology\r\n\r\n\r\nFor\
  \ more questions please email to andreasg@phys.au.dk\r\n"

readme_excerpt: "# RadiomicsJ\nJava library to compute radiomics features.\nThe RadiomicsJ computes 170\
  \ or more imaging features.\nIt is using the imagej for the image processing backend.\n\n## Environment\n\
  \n- Maven3\n- Java AdoptOpenJDK1.8 or 1.11.\n\n## Dependencies\n\nSee, pom.xml.\n\n## Image-Preprocessing\n\
  \n### Resampling(2D/3D)\n\nRadiomicsJ performs resampling with:\n- [2D]  \n\tBilinear  \n\tBicubic \
  \ \n\tNearestNeighbor2D  \n- [3D]  \n\tTrilinear  \n\tNearestNeighbor3D  \n\tTricubicBSpline/Polynomial\n\
  \n### Range filtering\n\nUser can set voxel value range in unit of density [ range min <= v <= range\
  \ max ].  \nFor example, -1000 HU to min , 400 HU to max for CT images.  \nRange filtering was performed\
  \ before remove outliers.  \n\n### Remove outliers\n\nIf you wants removing outliers, RadiomicsJ remove\
  \ out of range of [mean - z score × sd] < v < [mean + z score × sd] from mask.  \nMean value is caluculated\
  \ by voxels in ROI.  \nDefault value of the z score is 3 (99.73%CI).  \n\n### Image Filtering\n\nUser\
  \ can use any image filter that implemented in ImageJ/Fiji and these plugins.\n\n### Image Standardization\n\
  \nRadiomicsJ has standardization function (v-mean/sd).  \nMean and SD values are caluculated by voxels\
  \ in ROI.  \nUser can set standardization on your needs.  \n\n## Feature family\n- Morphological features\n\
  - Local intensity features\n- Intensity-based statistical features\n- Intensity histogram features\n\
  - Intensity-volume histogram features\n- Grey level co-occurrence based features\n- Grey level run length\
  \ based features\n- Grey level size zone based features\n- Grey level distance zone based features\n\
  - Neighbourhood grey tone difference based features\n- Neighbouring grey level dependence based features\n\
  - Fractal based features (not presented in IBSI)\n- Gray level affinity metrics, GLAM (not presented\
  \ in IBSI, off by default)\n- Shape2D features\n- (developping)Homological features (not presented in\
  \ IBSI)  \n\n### 3D basis\n\n3D based radiomics features are calculated by using both series of images\
  \ and series of masks.  \nMasks are sharing voxel size and geometry with a paired image.  \n\n#### Aggregation\
  \ for textures\n\nRadiomicsJ aggregates by a mean value for each angles (3D, averaging) to compute GLCM,\
  \ GLRLM features on the 3D configration. \n\n#### (Optional) 2D basis\n\nIn almost cases, meanings of\
  \ 2D features were included in 3D fetures, that is inducing correlation sometimes.  \nWith this reason,\
  \ RadiomicsJ does not including Shape2DFeatures as default.  \nIt is enable by both force2D=true and\
  \ enableShape2D=true.  \n\n2D based radiomics features are calculated by using a single slice pair both\
  \ image slice and mask slice.  \nA mask is sharing pixel size and geometry with a paired image.  \n\n\
  As more details, see following correspondence tables.  \n\n## IBSI Correspondence table\n\n### 2D\n\n\

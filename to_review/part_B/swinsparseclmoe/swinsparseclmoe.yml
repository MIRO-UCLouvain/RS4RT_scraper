readme_excerpt: "# SwinSparseCLMoE: Sparsely-Gated Mixture-of-Experts with Contrastive Learning for Efficient\
  \ Brain Tumor Segmentation\n\n[![PyTorch](https://img.shields.io/badge/PyTorch-EE4C2C?style=flat&logo=pytorch&logoColor=white)](https://pytorch.org/)\n\
  [![MONAI](https://img.shields.io/badge/MONAI-v1.0+-blue.svg)](https://monai.io/)\n[![License](https://img.shields.io/badge/License-MIT-green.svg)](LICENSE)\n\
  \nOfficial PyTorch implementation of **SwinSparseCLMoE**, a highly accurate and parameter-efficient\
  \ 3D framework designed for multi-parametric MRI (mpMRI) brain tumor segmentation across the **BraTS\
  \ 2021** and **BraTS 2024** benchmarks.\n\n---\n\n## \U0001F31F Key Features\n* **Bottleneck Contrastive\
  \ Refinement**: Incorporates InfoNCE-based contrastive learning at the Swin encoder bottleneck to yield\
  \ intensity-invariant, noise-robust anatomical feature routing signals.\n* **Dynamic Sparsely-Gated\
  \ MoE Head**: Leverages load-balanced Top-$k$ ($k=2, N=4$) dynamic expert routing to specialize in heterogeneous\
  \ tumor sub-regions (ET, TC, WT) while preventing expert collapse.\n* **Exceptional Efficiency**: Achieves\
  \ State-of-the-Art (SOTA) segmentation performance with only **6.16M parameters** ($\\approx 10.5\\\
  times$ smaller parameter profile compared to nnU-Net's 64.65M).\n* **End-to-End MONAI Pipeline**: Complete\
  \ multi-parametric 3D training and sliding-window inference pipeline built upon MONAI and PyTorch.\n\
  \n---\n\n## \U0001F4CA Performance Highlights\n\n| Dataset | Model | Mean Dice $\\uparrow$ | Mean HD95\
  \ (mm) $\\downarrow$ | Params |\n| :--- | :--- | :---: | :---: | :---: |\n| **BraTS 2021** | nnU-Net\
  \ | 0.9030 | 3.7686 | 64.65M |\n| | **SwinSparseCLMoE (Ours)** | **0.9072** | **3.1243** | **6.16M**\
  \ |\n| **BraTS 2024** | nnU-Net | 0.8400 | 4.6620 | 64.65M |\n| | **SwinSparseCLMoE (Ours)** | **0.8692**\
  \ | **4.1070** | **6.16M** |\n\n---\n\n## \U0001F680 Quick Start\n\n### Installation\n```bash\npip install\
  \ torch monai nibabel medpy wandb\n```\n\n## \U0001F680 Training\n\n### For Train\n```bash\npython train.py\
  \ --brats-version 21 --data-dir /path/to/BraTS2021 --batch-size 4 --expert-count 4 --top-k 2\n```\n\n\
  ## \U0001F4E5 Pretrained Weights\n\n> \U0001F4CC **Note:** Pretrained model weights for BraTS 2021 and\
  \ BraTS 2024 will be released on Hugging Face upon the paper's official acceptance.\n\n<!-- \n```python\n\

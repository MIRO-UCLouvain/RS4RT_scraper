readme_excerpt: "# RobustBrachy\r\n## Overview\r\nA robust evaluation and robust optimisation algorithms\
  \ for HDR prostate Brachytherapy, which includes 14 major uncertainty sources in each simulation and\
  \ coded in Python.\r\nBoth algorithms have been incorporated into a streamlit web app with a graphical\
  \ user interface.\r\n\r\n### Published works detailing both algorithms\r\n- <ins>For a comprehensive\
  \ explanation of the robust evaluation algorithm, see:</ins>  \r\nKennedy, A.C., Douglass, M.J.J. &\
  \ Santos, A.M.C. Being certain about uncertainties: a robust evaluation method for high-dose-rate prostate\
  \ brachytherapy treatment plans including the combination of uncertainties. Phys Eng Sci Med 46, 1115–1130\
  \ (2023). https://doi.org/10.1007/s13246-023-01279-8\r\n\r\n- <ins>For an evaluation of the robust evaluation\
  \ algorithm on a 49-patient dataset, see:</ins>  \r\nKennedy, A.C., Douglass, M.J.J. & Santos, A.M.C.\
  \ A robust evaluation of 49 high-dose-rate prostate brachytherapy treatment plans including all major\
  \ uncertainties. J Appl Clin Med Phys. 2023;e14182. https://doi.org/10.1002/acm2.14182\r\n\r\n- <ins>For\
  \ a comprehensive explanation of the robust optimisation algorithm, see:</ins>  \r\nAndrew C. Kennedy,\
  \ Michael J. J. Douglass, Alexandre M. C. Santos et al. A robust optimisation genetic algorithm for\
  \ HDR prostate brachytherapy including all major uncertainties I: Algorithm implementation, 20 February\
  \ 2024, PREPRINT (Version 2) available at Research Square [https://doi.org/10.21203/rs.3.rs-3820773/v2]\r\
  \n\r\n- <ins>For an evaluation of the robust optimisation algorithm on a 49-patient dataset, see:</ins>\
  \  \r\nAndrew C. Kennedy, Michael J. J. Douglass, Raghu Gowda et al. A robust optimisation genetic algorithm\
  \ for HDR prostate brachytherapy including all major uncertainties II: Algorithm evaluation on 49 patients,\
  \ 19 February 2024, PREPRINT (Version 1) available at Research Square [https://doi.org/10.21203/rs.3.rs-3968487/v1]\r\
  \n> [!IMPORTANT]\r\n> The software was designed for treatment plans generated by Vitesse v4.0.1 (Varian\
  \ Medical Systems, Palo Alto, USA) and would most likely require modifications for other TPS-generated\
  \ treatment plans.\r\n\r\n> [!NOTE]\r\n> This software is limited to research puposes only, no warranty\
  \ or support will be given.\r\n\r\n# File Descriptions\r\nBelow is a table that describes the purpose\
  \ of each file:\r\n\r\n| **Folder/File name**                                                      \
  \ | **Description**                                                                                \
  \                                                                                                  \
  \                                                                                                  \
  \                                                                                                  \
  \                                                                                                  \
  \                                                                                                  \
  \                                                                                    |\r\n| --------------------------------------------------------------------------\
  \ | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\
  \ |\r\n| **_Root folder_** |   |\r\n| LICENSE | Licence information file. |\r\n| README.md | RobustBrachy\
  \ repository information |\r\n| example_nominal_plan_analysis_cpu.py<br>example_nominal_plan_analysis_gpu.py\
  \ | An example use script to perform a TG43 dose calculation and display interactive DVH plots and DVH\
  \ metric data. |\r\n| example_robust_evaluation_cpu.py<br>example_robust_evaluation_gpu.py         |\
  \ An example use script to perform a robust evaluation of a treatment plan. Displaying interactive DVH\
  \ plots with probabilistic robustness bands, DVH metric robustness pass-rates and nominal plan DVH metric\
  \ data as output.|\r\n| example_robust_optimiser_cpu.py<br>example_robust_optimiser_gpu.py         \
  \  | An example use script to perform a robust optimisation for a patient. Input is a set of treatment\
  \ DICOM files in which the set of contoured structures and reconstructed needles are imputed into the\
  \ robust optimiser (dwell points are allocated automatically). Output is multiple robust treatment plans,\
  \ each a set of dwell times that are the best trade-off for three robustness pass-rates (D90 for the\
  \ prostate and the maximum doses to the urethra and rectum). The DVH metric robustness pass-rates and\
  \ nominal plan DVH metrics are also outputted for each plan. |\r\n| example_explore_robust_optimised_plan.py\
  \                                   | An example use script to display interactive DVH plots with probabilistic\
  \ robustness bands for one chosen plan from the set of robust optimised plans. The three DICOM treatment\
  \ files were also generated and saved within the script. |\r\n| pyproject.toml                     \
  \                                        | The file is used to install RobustBrachy and all its python\
  \ dependencies. |\r\n| environments_cpu.yml<br>environments_gpu.yml                                \
  \ | The file is used to install anaconda virtual environments for RobustBrachy. Included are the Python\
  \ version and dependency Python package versions. GPU version requires a Nivida GPU with CUDA. |\r\n\
  | **_Example Plan/_**                                                        | The folder contains an\
  \ example set of DICOM treatment plan files for a phantom. |\r\n| DO001.dcm                        \
  \                                          | Example dose RT DICOM file.  |\r\n| PL001.dcm         \
  \                                                         | Example plan RT DICOM file. |\r\n| SS001.dcm\
  \                                                                  | Example structures RT DICOM file.\
  \  |\r\n| **_Source Data/_**                                                         | Folder containing\
  \ the brachy source data file  |\r\n| 192ir-hdr_gammamed_plus.xls                                  \
  \              | File Sourced from: [https://www.estro.org/ESTRO/media/ESTRO/About/Committees/GEC%20-ESTRO/BRAPHYQS/Ir-192%20HDR/192ir-hdr_gammamed_plus.xls](https://www.estro.org/ESTRO/media/ESTRO/About/Committees/GEC%20-ESTRO/BRAPHYQS/Ir-192%20HDR/192ir-hdr_gammamed_plus.xls)\
  \ <br><br><ins>Article Reference:</ins> <br>Perez-Calatayud, J., Ballester, F., Das, R.K., DeWerd, L.A.,\
  \ Ibbott, G.S., Meigooni, A.S., Ouhib, Z., Rivard, M.J., Sloboda, R.S. and Williamson, J.F. (2012),\
  \ Dose calculation for photon-emitting brachytherapy sources with average energy higher than 50 keV:\
  \ Report of the AAPM and ESTRO. Med. Phys., 39: 2904-2929. [https://doi.org/10.1118/1.3703892](https://doi.org/10.1118/1.3703892)\
  \ |\r\n| **_RobustBrachy/_**                                                        | Source folder\
  \ for RobustBrachy  |\r\n| **_RobustBrachy/robustevaluation/_**                                    \
  \   | The folder contains all robust evaluation related functions.|\r\n| run_robust_evaluation_gpu.py\
  \ run_robust_evaluation_cpu.py                 | The function that calls all other functions to run\
  \ a robust evaluation. Input are DICOM file locations, clinical objectives defined as DVH metrics, and\
  \ the 14 uncertainty magnitudes. Output is probabilistic robustness DVH bands, nominal DVHs, DVH metric\
  \ robustness pass-rates, and nominal DVH metrics.  |\r\n| data_extraction.py                       \
  \                                  | Extracts all structures, dwell points, dwell times and other treatment\
  \ plan parameters from the treatment DCIOM files and transforms them into suitable data structures.\
  \  |\r\n| robust_evaluation_cpu.py<br>robust_evaluation_gpu.py                         | The function\
  \ that calculates the robustness measures (probabilistic DVH pass-rates) by iterating through a function\
  \ that:<br>\\-  calculates the arrays for the six parameter variable changes<br>\\-  conducts the changes<br>\\\
  -  calculates the dose distribution<br>\\-  and the DVH metrics<br>The percentage of DVH metric values\
  \ that pass for each DVH metric and the DVH bands for the DVH plots are then calculated.|\r\n| simulations_cpu.py<br>simulations_gpu.py\
  \                                     | The script contains the functions that enact the six parameter\
  \ variable changes to the nominal plan structures.|\r\n| fast_TG43_cpu.py fast_TG43_gpu.py         \
  \                                 | The script contains the functions to calculate the dose distributions.\
  \ It is named fast due to being vectorised, calculating the dose at each voxel simultaneously per structure.\
  \ |\r\n| utils_cpu.py<br>utils_gpu.py                                                 | Utility functions\
  \ that are used across the spectrum of robust evaluation and optimisation. Calculating DVH metric values\
  \ from DVH arrays, transferring arrays between GPU and CPU, and copying structures are among the functions\
  \ included in this script file.|\r\n| display_results.py                                           \
  \              | The functions that construct dataframes to display results in HTML and graphs of DVH\
  \ curves.|\r\n| **_RobustBrachy/robustoptimisation_**                                      | The folder\
  \ contains all robust optimisation related functions. |\r\n| run_robust_optimiser_cpu.py<br>run_robust_optimiser_gpu.py\
  \                   | The function that calls all other functions to run a robust optimisation. Inputs\
  \ are DICOM file locations and optimiser parameters. Outputs are all pareto front solutions (all robust\
  \ treatment plans and their approximate DVH metric pass-rates) and the robust evaluation data for all\
  \ Pareto front solutions (probabilistic DVH bands, nominal DVHs, DVH metric robustness pass-rates, and\
  \ nominal DVH metrics). |\r\n| robust_optimisation.py                                              \
  \       | The function that performs the robust optimisation using the pymoo Python package. Inputs\
  \ are the dictionary of optimiser parameters and the dictionary of plan parameters obtained from the\
  \ data extraction script in robust evaluation. Outputs are all Pareto front solutions (all robust treatment\
  \ plans and their approximate DVH metric pass-rates).  |\r\n| initialise_population.py             \
  \                                      | This function is called first in the robust optimiser to create\
  \ the initial set of individuals fed into the genetic optimiser algorithm. Random and deterministic\
  \ processes are employed to establish the population.  |\r\n| dose_per_dwell_cpu.py<br>dose_per_dwell_gpu.py\
  \                               | The functions simultaneously calculate the dose for all treatment\
  \ plans in the population. A 2D array is used, each row being a set of ordered dwell times. |\r\n| evaluation_cpu.py<br>evaluation_gpu.py\
  \                                       | The optimiser calls this function to evaluate each solution's\
  \ goodness (fitness). The dose is calculated, the DVH metrics are also calculated (including how far\
  \ away these are from satisfying the constraints), and the three objective functions of the optimiser\
  \ are calculated (these approximate the pass-rates for the prostate D90 and the maximum doses to the\
  \ urethra and rectum from the values of their nominal DVH metrics).  |\r\n| robust_evaluation_vectorised_gpu.py<br>robust_evaluation_vectorised_cpu.py\
  \   | The function to robust evaluate all robust optimised treatment plans simultaneously. This is called\
  \ on the final set of solutions from the optimiser to obtain accurate pass-rates. The probabilistic\

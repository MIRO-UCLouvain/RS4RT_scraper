readme_excerpt: "# Chromosome_Analysis_Pipeline\n\n> TADs, compartments, and 3D genome structure modeling\
  \  \n> **Work in Progress** — Last modified: 02/25/2026\n\n---\n\n## Overview\n\nThis project provides\
  \ pipelines for analyzing chromosome organization through Hi-C modeling and 3D chromosome visualization.\
  \ It is built on top of [polychrom](https://github.com/open2c/polychrom.git), an open-source polymer\
  \ simulation toolkit licensed under the MIT License.\n\n---\n\n## Getting Started\n\n### 1. Run a Polychrom\
  \ Simulation\n\nGenerate an `.h5` trajectory file from a polychrom simulation. You can also download\
  \ the included example file (`blocks_0-99.h5`) to skip this step.\n\n> **GPU users:** It is recommended\
  \ to run `Loop_Extrusion_3D_simu.py` and `polychrom_simu_get_h5.py` directly from the terminal.\n>\n\
  > ```bash\n> python Loop_Extrusion_3D_simu.py\n> python polychrom_simu_get_h5.py\n> ```\n\n### 2. Visualize\
  \ Chromosome Organization\n\nConvert coordinates from `.h5` to `.csv` or `.npy` format, then visualize\
  \ them using **Blender**.  \nSee the `visualization/` directory for details and scripts.\n\n> **Note:**\
  \ Rendering can take a long time — make sure to set `xlim` and `ylim` appropriately before running.\n\
  \n### 3. Run the Analysis Pipeline\n\nFor full, publication-ready analyses, see the `work_pipeline/`\
  \ directory. This includes:\n\n- **Hi-C contact map** generation\n- **P(s) curve** (contact probability\
  \ vs. genomic distance)\n- **Gamma (γ) plot** estimation\n\n---\n\n## Project Structure\n\n```\n.\n\
  ├── blocks_0-99.h5                  # Example simulation output\n├── Loop_Extrusion_3D_simu.py     \
  \  # Loop extrusion simulation script (GPU recommended)\n├── polychrom_simu_get_h5.py        # Generate\
  \ .h5 from polychrom\n├── visualization/                  # Blender visualization scripts & guides\n\
  └── work_pipeline/                  # Hi-C map, P(s), and gamma analysis\n```\n\n---\n\n## License\n\
  \nThis project uses [polychrom](https://github.com/open2c/polychrom.git), which is licensed under the\
  \ [MIT License](https://opensource.org/licenses/MIT).\n"

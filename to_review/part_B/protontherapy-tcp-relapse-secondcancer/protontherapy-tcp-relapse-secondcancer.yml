readme_excerpt: "# ProtonTherapy-TCP-Relapse-SecondCancer\nWe incorporated tumour relapse kinetics into\
  \ the TCP framework and calculate the associated \nsecond cancer risks. To calculate proton therapy-induced\
  \ secondary cancer induction, we used the \ninitiation–inactivation–proliferation formalism, and in-vitro\
  \ data to model the linear energy transfer (LET) \ndependence of cell killing and mutation induction\
  \ parameters. As a clinical application, we employed the \nmathematical model to Hodgkin's Lymphoma\
  \ patient data.\n\nhttps://academic.oup.com/imammb/article-abstract/35/3/347/3925038?redirectedFrom=fulltext\n"

readme_excerpt: "# Soft-Tissue Sarcoma Survival Analysis — CoxPH vs DeepSurv\n\nEnd-to-end radiomics and\
  \ machine learning pipeline for progression-free survival (PFS) analysis in soft-tissue sarcoma using\
  \ clinical and MRI-derived features.\n\nThis project is a portfolio version of my MSc in Data Analytics\
  \ dissertation at CCT College Dublin. It demonstrates the complete workflow from medical imaging preprocessing\
  \ and radiomic feature extraction to survival modelling and evaluation.\n\n## Project Overview\n\nThe\
  \ project investigates whether radiomic features extracted from MRI scans can improve progression-free\
  \ survival prediction in patients with soft-tissue sarcoma.\n\nTwo survival modelling approaches were\
  \ evaluated:\n\n- Cox Proportional Hazards (CoxPH)\n- DeepSurv neural survival model\n\nThe pipeline\
  \ combines clinical information with quantitative radiomic features extracted from medical images.\n\
  \n## Pipeline\n\n```text\nDICOM + RTSTRUCT\n        |\n        v\nDICOM / RTSTRUCT Mapping\n       \
  \ |\n        v\nNIfTI Conversion\n        |\n        v\nTumour Segmentation Masks\n        |\n     \
  \   v\nPyRadiomics Feature Extraction\n        |\n        v\nPatient-Level Feature Aggregation\n   \
  \     |\n        v\nClinical + Radiomic Features\n        |\n        v\nData Validation & Preprocessing\n\
  \        |\n        v\nTrain / Validation / Test Split\n        |\n        +------------------+\n  \
  \      |                  |\n        v                  v\n      CoxPH             DeepSurv\n      \
  \  |                  |\n        +--------+---------+\n                 |\n                 v\n    \
  \   Survival Model Evaluation\n\nTechnology Stack\nPython\nPyTorch\nScikit-learn\nPandas\nNumPy\nPyRadiomics\n\
  lifelines\npycox\ntorchtuples\nDICOM / NIfTI\nGoogle Cloud Storage\nJupyter / Google Colab\nGit\nDataset\n\
  \nThe project uses the publicly available Soft-Tissue Sarcoma (STS) collection from The Cancer Imaging\
  \ Archive (TCIA).\n\nThe workflow processes MRI imaging, RTSTRUCT tumour segmentation data and associated\
  \ clinical outcome information.\n\nThe original imaging dataset is not redistributed through this repository.\n\
  \nEngineering Workflow\n\nThe project was implemented as a multi-stage data and machine learning pipeline:\n\
  \nMap RTSTRUCT tumour structures to the corresponding DICOM imaging series.\nConvert medical imaging\
  \ data into NIfTI format.\nGenerate and validate tumour segmentation masks.\nExtract quantitative imaging\
  \ features using PyRadiomics.\nConsolidate features across imaging series at patient level.\nIntegrate\
  \ radiomic and clinical information.\nPerform data cleaning, feature engineering and leakage prevention.\n\
  Create patient-level training, validation, and test splits.\nTrain CoxPH and DeepSurv survival models.\n\
  Evaluate model discrimination and survival-risk stratification.\nEngineering Challenges & Troubleshooting\n\
  \nBuilding the pipeline required troubleshooting across multiple technologies and data formats.\n\n\
  Examples included:\n\nDICOM series inconsistencies and duplicate slices\nRTSTRUCT-to-image mapping\n\
  DICOM to NIfTI conversion failures\nMedical-image orientation issues\nSegmentation mask validation\n\
  Dependency and library compatibility issues\nLarge medical-imaging workloads\nCloud storage and compute\
  \ management\nFeature consolidation across multiple imaging series\nPrevention of outcome leakage during\
  \ machine learning\nReproducible patient-level dataset splitting\n\nThese challenges required systematic\
  \ debugging, validation and iterative pipeline development.\n\nMachine Learning\nCox Proportional Hazards\n\
  \nA regularised CoxPH model was used as the classical survival-analysis baseline.\n\nPreprocessing included\
  \ feature filtering, missing-value handling, correlation reduction and patient-level data splitting.\n\
  \nDeepSurv\n\nDeepSurv was implemented as a neural-network-based survival model using PyTorch and the\
  \ pycox ecosystem.\n\nThe modelling workflow included feature standardisation, training/validation separation,\
  \ regularisation and early stopping.\n\nEvaluation\n\nModels were evaluated using survival-analysis\
  \ techniques including:\n\nConcordance Index (C-index)\nBootstrap evaluation\nKaplan-Meier risk stratification\n\
  Clinical-only and clinical+radiomics comparisons\nRepository Structure\nsts-survival-ml/\n|\n|-- notebooks/\n\
  |   |-- 01_rtstruct_dicom_mapping.ipynb\n|   |-- 02_radiomics_extraction.ipynb\n|   |-- 03_feature_consolidation.ipynb\n\
  |   |-- 04_clinical_survival_analysis.ipynb\n|   |-- 05_data_preparation.ipynb\n|   `-- 06_coxph_vs_deepsurv.ipynb\n\
  |\n|-- results/\n|-- docs/\n|-- requirements.txt\n`-- README.md\n\nThe public portfolio version intentionally\
  \ excludes patient-level datasets, institutional documents and other material that should not be redistributed.\n\
  \nKey Skills Demonstrated\nPython engineering\nMachine learning\nSurvival analysis\nMedical imaging\
  \ pipelines\nData preprocessing\nFeature engineering\nCloud-based data processing\nTechnical troubleshooting\n\
  Root cause investigation\nReproducible ML workflows\nData validation\nAI/ML experimentation\nAuthor\n\
  \nRicardo Alves de Souza\n\nMSc Data Analytics\nBSc (Hons) Information Technology\nDublin, Ireland\n\
  \nLinkedIn: linkedin.com/in/ricardo-alves-de-souza\nGitHub: github.com/ricardoasouz\n\n"

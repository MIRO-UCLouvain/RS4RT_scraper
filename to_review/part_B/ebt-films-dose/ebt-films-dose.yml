readme_excerpt: "# EBT Films Dose User Manual\n\n## Purpose of the Program\n\nThe program is designed\
  \ to process the results of radiochromic film dosimetry obtained from 16-bit per channel TIF scans and\
  \ translate the image into a dose field. The program supports manual input of the calibration curve,\
  \ a calibration database, various curve fitting modes, and outputs orthogonal projections of the final\
  \ dose field to a text file.\n\n## License\n\nThis project is licensed under the GNU General Public\
  \ License v3.0 - see the [LICENSE](https://github.com/cobaltCorsair/EBT_films_dose/blob/license/LICENSE)\
  \ file for details.\n\nThe GNU General Public License v3.0 is a free, copyleft license for software\
  \ and other kinds of works, designed to ensure that everyone has the freedom to distribute copies of\
  \ free software (and charge for them if you wish), that you receive source code or can get it if you\
  \ want it, that you can change the software or use pieces of it in new free programs, and that you know\
  \ you can do these things.\n\n## Main Interface Elements\n\n- **Main Program Window**: Includes buttons\
  \ for working with manual calibration, loading calibration from the database, and working with unirradiated\
  \ film.\n- **\"DB and Settings\" Window**: Displays the window for loading the calibration curve from\
  \ the MongoDB database.\n- **\"Change Calibration List\" Window**: Used for manual input of calibration\
  \ files.\n- **Dose Sections Viewing Window**: Displays the dose field on the right side of the main\
  \ program window.\n\n![Main Interface](https://i.ibb.co/k88KzJh/image.png)\n\n*Main Interface*\n\n##\
  \ Example of Working with the Program\n\n1. Select calibration parameters in \"DB and Settings.\"\n\
  2. Visually check the calibration curve (optional).\n3. Select unirradiated film and the film under\
  \ study.\n4. Set the DPI parameter and calculate the dose.\n5. View orthogonal projections and output\
  \ projection data.\n\n## Description of Calibration Functions and Recommended Values\n\n- **Optical\
  \ Density Description Mode**: Includes various methods for describing optical density.\n- **Curve Fitting\
  \ Modes**: Includes various curve fitting methods.\n- **Spline Fitting Modes**: Includes spline fitting\
  \ methods.\n- **Neural Network Fitting Modes**: Includes neural network fitting methods.\n\n## Special\
  \ Functions\n\n- **Image Cropping**: Allows selecting an image area for cropping.\n- **vmin/vmax Selection**:\
  \ Changes the color palette for visual display.\n- **Using Filters**: Includes various filters for image\
  \ processing.\n- **Saving to Excel**: Allows saving data in .xlsx format.\n- **Shifting Axes of One-Dimensional\
  \ Sections**: Allows shifting the function graph along the X-axis.\n- **Calibration File Preparation**:\
  \ Describes the process of preparing calibration files.\n- **Statistics Output Window**: Displays statistical\
  \ data on distributions in sections.\n\n## Key Methods and Features\n\n### Main Interface and Database\
  \ Connection\n\n- **Database Connection**: The program attempts to connect to the MongoDB database at\
  \ startup.\n- **Main Interface**: Includes various UI elements, such as buttons, layout widgets, and\
  \ a toolbar for image manipulation.\n\n### File Selection and Image Handling\n\n- **Irradiated Film\
  \ File Selection**: `get_irrad_film_file` method allows selecting and inserting an irradiated film file\
  \ in TIFF format.\n- **Empty Field File Selection**: `get_empty_field_file` method allows selecting\
  \ and inserting an empty field file in TIFF format.\n- **Image Insertion**: `insert_tiff_file` method\
  \ inserts a picture of the film into the interface window.\n- **Image Cropping**: `crop` and `cropping_by_button`\
  \ methods allow cropping the image by selecting a specific area.\n\n### Calculation Modes and Filters\n\
  \n- **Manual Calculation**: `calc_from_manual` method allows performing calculations manually.\n- **Database\
  \ Calculation**: `calc_from_db` method allows performing calculations using data from a connected database.\n\
  - **OD Only Calculation**: `calc_ODOnly` method sets z-data to a specific value for all data.\n- **Filter\
  \ Application**: `add_filter` method allows adding a filter to an image.\n\n### Progress and Error Handling\n\
  \n- **Progress Bar**: `progress_bar_update` method updates the progress bar during calculations.\n-\
  \ **Error Handling**: Various warning messages inform the user about potential errors or issues.\n\n\
  ### Application Window Configuration\n\n- **Window Configuration**: The main application window is configured\
  \ with a custom icon, title, and minimum size.\n\n### Running the Program\n\nThe program can be run\
  \ as a standalone application with the following code:\n\n```python\nif __name__ == \"__main__\":\n\
  \    app = QtWidgets.QApplication([])\n    app.setStyle(\"Fusion\")\n    application = CalcUI()\n  \
  \  application.setWindowTitle(\"Dose calculator\")\n    application.setMinimumSize(1200, 800)\n    application.show()\n\
  \    sys.exit(app.exec())\n\n"

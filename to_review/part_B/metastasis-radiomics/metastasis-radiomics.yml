  Run models independently for each Top-K subset.


  **Example:**

  ```


  ---


  ### Step 7 — Select Best Configurations


  Identify best Top-K configurations per model:


  ```bash

  python top3_per_model_family.py

  ```


  ---


  ## Correlation & Redundancy Analysis (Optional)


  Visualize feature redundancy before and after filtering:


  ```bash

  python violin_plot__4c.py

  python violin_plot__4d.py

  ```


  Outputs correlation distribution figures and summary statistics.


  ---


  ## Outputs


  Typical outputs include:


  - ROC curves and AUC metrics

  - calibrated probability predictions

  - confusion matrices

  - feature importance analyses

  - SHAP explainability plots

  - correlation reduction visualizations


  All outputs are stored inside each `top_K_features/` directory.


  ---


  ## Design Principles


  ### Leakage Prevention


  - Patient-level splitting

  - Feature ranking learned only on training data

  - Calibration fitted using OOF predictions


  ### Reproducibility


  - Centralized configuration (`config.json`)

  - Deterministic random seeds

  - Saved model artifacts


  ### Modular Experiments


  Each Top-K folder represents a fully independent experiment and can be reproduced separately.


  ---


  ## Requirements


  See:


  ```

  requirements.txt

  ```


  Main dependencies include:


  - scikit-learn

  - lightgbm

  - numpy

  - pandas

  - matplotlib

  - shap

  - optuna



readme_excerpt: '# Panoramic CT/CBCT reconstruction and localization of the inferior alveolar nerve canal


  Run "main.m".


  Provide a folder that contains dicom CT/CBCT images.


  Select your region of interest.


  Build a panoramic image by clicking on the teeth in a proper slice. (Finish by right clicking).


  Click "Traverse" to locate mandibular canal.



  If you find the codes useful, you may cite:


  Bahrampour, Ehsan, Ali Zamani, Sadegh Kashkouli, Elham Soltanimehr, Mohsen Ghofrani Jahromi, and Zahra
  Sanaeian Pourshirazi. "Accuracy of software designed for automated localization of the inferior alveolar
  nerve canal on cone beam CT images." Dentomaxillofacial Radiology 45, no. 2 (2016): 20150298.

  https://www.birpublications.org/doi/abs/10.1259/dmfr.20150298


  A sample is presented here:

  https://www.youtube.com/watch?v=D_9C1ZZxjvk


  '

readme_excerpt: "# DeepDicom\n\n_DeepDicom_ provides tools to process DICOM files for deep learning research.\
  \ It includes tools to extract images and metadata from DICOM files, standardize image dimensions, and\
  \ standardize structure names. The repository also includes a training pipeline for a PyTorch UNet model\
  \ to do dose prediction. \n\nThis repository should support DICOMs from any radiotherapy treatment planning\
  \ system. This includes clinical data publicly available DICOM from the Cancer Imaging Archive (e.g.,\
  \ [Pancreatic-CT-CBCT-SEG](https://www.cancerimagingarchive.net/collection/pancreatic-ct-cbct-seg/)).\n\
  \n## Table of Contents\n- [What This Code Does](#what-this-code-does)\n- [Prerequisites](#prerequisites)\n\
  - [Getting Started](#getting-started)\n- [Running the Code](#running-the-code)\n\n## What This Code\
  \ Does\nDeepDicom consists of four modules:\n1. **Interface**: Contains the `Case` class to organize\
  \ DICOM data.\n2. **Dicom Extraction**: Extracts images and metadata from DICOM files and stores them\
  \ in an efficient format.\n3. **Prediction**: Standardizes data from `Case` objects, creates training\
  \ samples, and defines data splits.\n4. **Model**: Contains the `Trainer` class that trains a UNet model\
  \ for dose prediction using PyTorch.\n\n## Prerequisites\n- Linux\n- Python 3.10.12\n- NVIDIA GPU with\
  \ CUDA and CuDNN (recommended)\n\n\n## Getting Started\n1. **Create a virtual environment and activate\
  \ it:**\n    ```bash\n    virtualenv -p python3 deep-dicom\n    source deep-dicom/bin/activate\n   \
  \ ```\n2. **Clone the repository and install dependencies:**\n    ```bash\n    git clone https://github.com/ababier/deep-dicom\n\
  \    cd deep-dicom\n    pip3 install -r requirements.txt\n    ```\n\n\n## Running the Code\nIf everything\
  \ is set up correctly, run the main script to start processing DICOM files, generate training samples,\
  \ and train the model.\n\nRun the following command in your virtual environment:\n```bash\npython3 main.py\n\
  ```\nThis will:\n- Extract DICOM data and organize it into `Case` objects.\n- Standardize images, voxel\
  \ spacing, and structure names.\n- Create train/validation/test data splits.\n- Train a UNet model for\
  \ dose prediction, logging progress with TensorBoard.\n\n### Additional Notes\n- **Data Splits:**  \n\
  \  The code uses dataset splits. The training, validation, and test IDs are saved and re-used for consistency.\n\
  \  \n- **Model Training:**  \n  The Trainer class uses gradient checkpointing and AMP (Automatic Mixed\
  \ Precision) for efficient training, along with an exponential learning rate scheduler.\n  \n- **TensorBoard\
  \ Logging:**  \n  Training metrics and image visualizations are logged. Launch TensorBoard by running:\n\
  \  ```bash\n  tensorboard --logdir=runs/ --port=6006 --bind_all\n  ```\n\n- **Customization:**  \n \
  \ You can adjust hyperparameters (e.g., batch size, learning rate) in the Trainer class, and modify\
  \ the UNet architecture or data processing as needed.\n\nHappy coding and deep learning with DICOM data!\n"

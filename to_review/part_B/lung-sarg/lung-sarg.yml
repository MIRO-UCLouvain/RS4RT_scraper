readme_excerpt: "<!-- markdownlint-disable MD033 MD041-->\n\n<p align=\"center\">\n  <h1 style=\"font-size:80px;\
  \ font-weight: 800;\" align=\"center\">L U N G - S A R G</h1>\n  <p align=\"center\">The Open Data Platform\
  \ for Sustainable, Accessible Lung Radiogenomics</a> </p>\n</p>\n\n<div align=\"center\">\n  <img alt=\"\
  GitHub\" src=\"https://img.shields.io/github/license/open-radiogenomics/lung-sarg?style=flat-square\"\
  >\n  <img alt=\"GitHub Workflow Status\" src=\"https://img.shields.io/github/actions/workflow/status/open-radiogenomics/lung-sarg/ci.yml?style=flat-square\"\
  >\n  <img alt=\"GitHub Repo stars\" src=\"https://img.shields.io/github/stars/open-radiogenomics/lung-sarg?style=flat-square\"\
  >\n</div>\n\n<br>\n\nLung-SARG is a fully open-source and local-first platform that improves how communities\
  \ collaborate on open data to diagnose lung cancer and perform epidemiology on local populations in\
  \ low and middle income countries.\n\n> [!TIP]\n> Datasets generated by this project are ready to explore\
  \ and consume at HuggingFace.\n>\n> [Check them out](https://huggingface.co/radiogenomics)!\n\n### \U0001F4A1\
  \ Principles\n\n- **Open**: Code, standards, infrastructure, and data, are public and open source.\n\
  - **Modular and Interoperable**: Each component can be replaced, extended, or removed. Works well in\
  \ many environments (your laptop, in a cluster, or from the browser), can be deployed to many places\
  \ (S3 + GH Pages, IPFS, ...) and integrates with multiple tools (thanks to the Arrow and Zarr ecosystems).\
  \ Use open tools, standards, infrastructure, and share data in accessible formats.\n- **Data as Code**:\
  \ Declarative stateless transformations tracked in `git`. Improves data access and empowers data scientists\
  \ to conduct research and helps to guide community-driven analysis and decisions. Version your data\
  \ as code! Publish and share your reusable models for others to build on top. Datasets should be both\
  \ reproducible and accessible!\n- **Glue**: Be a bridge between tools and approaches. E.g: Use software\
  \ engineering good practices like types, tests, materialized views, and more.\n- [**FAIR**](https://www.go-fair.org/fair-principles/).\n\
  - **KISS**: Minimal and flexible. Rely on tools that do one thing and do it well.\n- **No vendor lock-in**\n\
  \  - Rely on Open code, standards, and infrastructure.\n  - Use the tool you want to create, explore,\
  \ and consume the datasets. Agnostic of any tooling or infrastructure provider.\n  - Standard format\
  \ for data and APIs! [Keep your data as future-friendly and future-proof as possible](https://indieweb.org/longevity)!\n\
  - **Distributed**: Permissionless ecosystem and collaboration. Open source code and make it ready to\
  \ be improved.\n- **Community**: that incentives contributors.\n- **Immutability**: Embrace idempotency.\
  \ Rely on content-addressable storage and append-only logs.\n- **Stateless and serverless**: as much\
  \ as possible. E.g. use GitHub Pages, host datasets on S3, interface with HTML, JavaScript, and WASM.\
  \ No servers to maintain, no databases to manage, no infrastructure to worry about. Keep infrastructure\
  \ management lean.\n- **Offline-first**: Rely on static files and offline-first tools.\n- **Above all,\
  \ have fun and enjoy the process** \U0001F389\n\n## Overview\n\n![Lung SARG dataflow](./docs/figures/lung-sarg.png)\n\
  \n*Lung SARG dataflow.*\n\n## ⚙️ Setup and execution\n\n### \U0001F40D Pixi\n\nYou can install all the\
  \ dependencies inside a reproducible software environment via pixi. To do that, [install pixi](https://pixi.sh),\
  \ clone the repository, and run the following command from the root folder.\n\n```bash\npixi install\
  \ -a\n```\n\nTo see all tasks available:\n\n```bash\npixi task list\n```\n\nStart and access the [Dagster\
  \ UI](http://127.0.0.1:3000) locally.\n\n```bash\npixi run dev\n```\n\n### \U0001F9EC Run on sample\
  \ data\n\nIn the Dagster UI, click\n\n > *Overview* -> *Jobs* -> *stage_idc_nsclc_radiogenomic_samples*\
  \ -> *Materialize all*\n\n![Materialize staging of samples](./docs/figures/lung-sarg-stage.png)\n\n\
  Observe what happens in the *Overview*, *Runs*, and *Assets* pages of the Dagster UI, and the content\
  \ in the *lung-sarg/data* directory.\n\n\n## \U0001F3AF Motivation\n\nThis project started after [thinking\
  \ about what an Open Data Protocol could look like](https://publish.obsidian.md/davidgasquez/Open+Data)!\n\
  \n## \U0001F44F Acknowledgements\n\n- This project was built on the principles espoused by David Gasquez\
  \ at [Datonic](https://datonic.io). It is built on the approach in the [Datadex](https://datadex.datonic.io/)\
  \ Open Data Platform and extended for scientific imaging data with [OME-Zarr](https://ngff.openmicroscopy.org/)\
  \ and the DICOM-based image data model in the [NIH Imaging Data Commons](https://portal.imaging.datacommons.cancer.gov/).\n\
  - Lung-SARG is possible thanks to amazing open source projects like [DuckDB](https://www.duckdb.org/),\
  \ [dbt](https://getdbt.com), [Dagster](https://dagster.io/), [ITK](https://docs.itk.org) and many others...\n\
  - This project was built with support from Dr. James Gee in collaboration with the [UPenn PICSL Lab](https://picsl.upenn.edu/).\n"

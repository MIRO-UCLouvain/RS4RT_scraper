readme_excerpt: "# A-General-Liver-Segmentation-Tumor-Detection-and-Tumor-Segmentation-System\nLiver tumor\
  \ detection and segmentation in computed tomography (CT) imaging remains a challenging task due to the\
  \ small size of lesions, low contrast with surrounding tissues, and variability in imaging protocols\
  \ across medical centers. These challenges limit the generalizability of deep learning models when applied\
  \ in real-world clinical environments.\nThis work adopts a segmentation-first approach, where liver-region\
  \ segmentation is used as the foundation for later tumor analysis. The proposed framework incorporates\
  \ comparisons with state-of-the-art systems including LiAIDS, SALSA, and VISTA3D. Unlabeled CT data\
  \ from TCGA-LIHC may be used for auxiliary pretraining, treated as unlabeled with respect to voxel-level\
  \ tumor segmentation.\nThe LiTS dataset is used as the main dataset for supervised training and testing.\
  \ The structured preprocessing pipeline executes multiple steps which include converting images to grayscale\
  \ and normalizing their intensity and resizing them to 256 × 256 pixels and applying gamma correction\
  \ and creating binary masks and discarding non-informative slices which lack liver tissue. The liver\
  \ segmentation dataset uses a 70/15/15 train-validation-test split at the CT volume level because the\
  \ dataset needs to maintain slice integrity by preventing slices from appearing in multiple subsets.\
  \ For the binary tumor classification stage, the same LiTS dataset is used to label CT images as affected/tumor-positive\
  \ or non-affected/tumor-negative.\nThe liver-region segmentation tests three 2D U-Net-based encoder-decoder\
  \ models: EfficientNet-B0 U-Net, MobileNetV2 U-Net, and VGG16 U-Net. The models undergo training through\
  \ supervised learning while using a Binary Cross-Entropy with Logits and Dice Loss function together\
  \ with Adam optimization and data augmentation and early stopping which operates for five epochs. The\
  \ held-out LiTS test set evaluation uses pixel-wise segmentation metrics including accuracy, precision,\
  \ recall, F1-score, Dice score, IoU, ROC-AUC, confusion matrix analysis, and inference time evaluation.\n\
  The EfficientNet-B0 U-Net achieved a Dice score of 0.9993 and IoU score of 0.9986, while the MobileNetV2\
  \ U-Net achieved a Dice score of 0.9988 and IoU score of 0.9976. The VGG16 U-Net achieved the best liver\
  \ segmentation performance, with a Dice score of 0.9997 and IoU score of 0.9993. MobileNetV2 also achieved\
  \ faster average inference time per image, making it a lightweight alternative, while VGG16 provided\
  \ the strongest segmentation accuracy. \nAlong with liver-region segmentation, a binary tumor classification\
  \ stage was introduced to identify tumor-affected CT images before the tumor segmentation stage. Four\
  \ classification models were evaluated: CNN, EfficientNetB0, VGG16, and MobileNetV2. The CNN achieved\
  \ the best overall classification performance, with an accuracy of 0.894, precision of 0.886, recall\
  \ of 0.904, F1-score of 0.895, IoU of 0.810, ROC-AUC of 0.958, and inference time of 0.034 seconds per\
  \ image. These results show that the CNN is the most suitable model for selecting tumor-positive images\
  \ before applying pixel-level tumor segmentation.\nThis study presents a complete deep-learning pipeline\
  \ for liver tumor analysis. In addition to tumor classification and tumor detection, the work is extended\
  \ to pixel-level tumor segmentation. Several segmentation architectures were evaluated, including YOLOv8m-seg,\
  \ YOLOv8l-seg, YOLOv12m-seg, YOLOv12l-seg, Mask R-CNN, and DeepLabV3. The segmentation models were assessed\
  \ using pixel-level accuracy, precision, recall, Dice/F1 score, IoU, ROC-AUC, and an average inference\
  \ time. When we look at the evaluated segmentation models, DeepLabV3 reached the best overall pixel\
  \ level results, where Dice was 0.9041 and IoU reached 0.8250 at the chosen threshold, while Mask R-CNN\
  \ also gave competitive segmentation. So, these results indicate that the proposed framework can help\
  \ with image-level tumor recognition and at the same time, fine-grained tumor region localization. External\
  \ datasets such as MSD Task03 or HCC-TACE-Seg, as well as TCGA-LIHC as a possible auxiliary dataset,\
  \ may be explored in later stages.\n\n"

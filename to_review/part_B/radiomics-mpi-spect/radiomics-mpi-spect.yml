readme_excerpt: "# radiomics-mpi-spect\nCódigos y pipelines Python para análisis radiómico en imágenes\
  \ SPECT de perfusión miocárdica (99mTc). Proyecto de tesis - Universidad de El Salvador.\n\n# Códigos\
  \ para Análisis Radiómico en Imágenes SPECT\n\n**Autor**: Gabriela Alessandra Villacorta García (VG16009)\
  \  \n**Programa**: Licenciatura en Física  \n**Institución**: Universidad de El Salvador (UES)  \n**Área**:\
  \ Física Médica / Medicina Nuclear\n\nRepositorio que contiene todos los scripts, notebooks y pipelines\
  \ utilizados en las diferentes fases del proyecto de tesis. El trabajo se centra en la extracción y\
  \ análisis de características radiómicas en estudios de perfusión miocárdica con 99mTc, evaluando el\
  \ efecto de parámetros de reconstrucción (OSEM) y su variabilidad.\n\n## Contenido por Fases\n\n- **Fase\
  \ I**: Preprocesamiento y control de calidad (uniformidad, COR).\n- **Fase II**: Extracción de características\
  \ radiómicas con PyRadiomics.\n- **Fase III**: Análisis de variabilidad, ICC, CV y resultados comparativos\n\
  \n- ## Cómo citar este repositorio\n\n- Villacorta García, G. A. (2026). Códigos para análisis radiómico\
  \ en imágenes SPECT [Software]. GitHub. https://github.com/gabriela-alessandra-villacorta-garcia/radiomics-mpi-spect\n"

readme_excerpt: "# Chord cutter\n\nA simple tool that uses\n[TotalSegmentator](https://github.com/wasserth/TotalSegmentator)\
  \ to divide (or\n*cut*) a spinal chord dicomRS structure into segments aligned on each vertebra.\nThe\
  \ only input necessary are a CT dataset in DICOM and a RTStruct object of the\nspinal chord. \n\nOne\
  \ possible workflow as used in `main.py` is as follow:\n1. Run `TotalSegmentator` on the CT to segment\
  \ each vertebra\n2. Find the top and bottom CT slice for each vertebra\n3. Find the interesection of\
  \ the vertebral regions and the spinal chord\n4. Save a RTStruct with the divided spinal chord\n\n**Intended\
  \ use**: for radiation therapy re-treatment, it is sometime necessary\nto determine if there is a risk\
  \ of overlap of dose hotspots within the spinal\nchord. Because DVHs do not contain spatial information,\
  \ dividing a spinal chord\nROI into sub-regions aligned with each vertebra, facilitate the evaluation\
  \ of\npossible dose overlaps.\n\nHere is an example of the output for vertebrae C2 to T3 as visualized\
  \ with [3D\nSlicer](https://www.slicer.org/) (the amount of overlap between chord segments\ncan be controlled\
  \ via the threshold parameter of `ChordCutter.cut_chord`):\n\n![example of output](/imgs/chord_dcm.png)\n"

readme_excerpt: "# DL-based Low-dose CBCT Reconstruction\n\nThe codes for the low-dose CBCT reconstruction\
  \ task in the ICASSP-2024 3D-CBCT Challenge. \nOur team's name is BJTU_PKUCH.\n\n## 1. Download pre-trained\
  \ projection domain (PD) & image domain (ID) models\n* [Get pre-trained PD model in this link] (https://drive.google.com/file/d/1OzqHK1Zkg_AkZxZLUEP0hbhWQWM0vmaE/view?usp=sharing):\
  \ Place the file \"PD_model_ckpt.pth\" into folder \"pretrained_ckpt/\"\n* [Get pre-trained ID model\
  \ in this link] (https://drive.google.com/file/d/1zErkn7WXYFafx9cHPqOaps_CSHth-H7g/view?usp=sharing):\
  \ Place the file \"ID_model_ckpt.pth\" into folder \"pretrained_ckpt/\"\n\n## 2. OS & CUDA Environment\n\
  \n- Please ensure to use a Linux system for testing, with Ubuntu 18.04 being the recommended version.\
  \ Ensure that CUDA 11.8 is pre-installed in your system.\n\n## 3. Python & Conda Environment\n\n- To\
  \ deploy the required Python and Conda environment for testing, follow these steps:\n\n### I Create\
  \ a Python 3.8 Environment\nCreate a Conda environment named CBCT using Python 3.8.\n```bash\nconda\
  \ create -n CBCT python=3.8\n```\n\n### II Activate the CBCT Environment\nActivate the newly created\
  \ CBCT environment.\n```bash\nconda activate CBCT\n```\n\n### III Install PyTorch Packages\nInstall\
  \ the PyTorch related packages using the PyTorch and Nvidia channels.\n```bash\nconda install -c pytorch\
  \ -c nvidia pytorch==2.0.1 torchvision==0.15.2 torchaudio==2.0.2 pytorch-cuda=11.8\n```\n\n### IV Install\
  \ ASTRA Toolbox\nInstall the ASTRA toolbox from the specified channel.\n```bash\nconda install -c astra-toolbox/label/dev\
  \ astra-toolbox=2.1.3\n```\n\n### V Install tqdm Package\nInstall the tqdm package.\n```bash\nconda\
  \ install tqdm=4.65.0\n```\n\n### VI Install tomosipo\nClone and install `tomosipo` from GitHub. After\
  \ cloning, navigate to the `tomosipo` directory path to proceed with the installation.\n```bash\ngit\
  \ clone https://github.com/ahendriksen/tomosipo.git\ncd [path_to_tomosipo]\npip install .\n```\n\n###\
  \ VII Install ts_algorithms\nClone and install `ts_algorithms` from GitHub. After cloning, navigate\
  \ to the `ts_algorithms` directory path to proceed with the installation.\n```bash\ngit clone https://github.com/ahendriksen/ts_algorithms.git\n\
  cd [path_to_ts_algorithms]\npip install .\n```\n\n## 4. Test\n\n- To perform the DL-based low-dose CBCT\
  \ reconstruction for the test dataset, please use the `test.py` script.  \n- In the script, specify\
  \ the GPU number to be used (only one GPU is required) in line 10: `os.environ['CUDA_VISIBLE_DEVICES']`.\n\
  - In the script, replace line 16, `folder = \"test/folder/in/organizers/path\"`, with the absolute path\
  \ to the test dataset folder.\n- In the script, the variable `reconstruction` represents the reconstruction\
  \ results obtained from the low-dose sinogram using the DL-based algorithm.\n- In the script, the variable\
  \ `target_reconstruction` is used as the ground truth."

readme_excerpt: "# Volumetric CT Lung Tumor Segmentation\n\nA fully automated pipeline for 3D lung tumor\
  \ GTV (GTVp) segmentation from CT scans, benchmarking multiple segmentation architectures — from classic\
  \ CNNs to Transformer-based models — under a unified preprocessing and evaluation framework.\n\n## Models\n\
  \n| Architecture | Paradigm | Key Features |\n|---|---|---|\n| **2D U-Net** | Slice-based CNN | Class-balanced\
  \ sampling, ensemble learning restacked to 3D |\n| **3D U-Net** | Volumetric CNN | Sliding-window 3D\
  \ patch training |\n| **UNETR** | CNN–Transformer | ViT encoder + convolutional decoder (Hatamizadeh\
  \ et al., 2022) |\n| **Linear UNETR** | Linear-attention Transformer | $\\mathcal{O}(N)$ attention,\
  \ Transformer encoder + convolutional decoder |\n\n## Pipeline\n\nAll models are trained with preprocessed\
  \ CT volumes with:\n\n1. **Intensity normalization**\n2. **Resampling** to common voxel spacing\n3.\
  \ **Lung-focused cropping** with aligned CT–contour pairs\n4. **Patch/slice extraction** — 2D: class-balanced\
  \ slice sampling; 3D: sliding-window overlapping patches\n\n## ⭐ Linear UNETR — Memory-Efficient Transformer\
  \ for 3D Segmentation\n\nStandard UNETR's multi-head self-attention scales quadratically with sequence\
  \ length $\\mathcal{O}(N^2)$, making it capacity-heavy and memory-intensive for 3D medical volumes.\
  \ Linear UNETR addresses this with $\\mathcal{O}(N)$ attention, enabling larger patch sizes and batch\
  \ sizes under the same GPU budget — a critical advantage for real-world deployment where GPU resources\
  \ are constrained.\n\n## Evaluation\n\nPerformance is assessed using:\n\n| Metric | Description |\n\
  |---|---|\n| **Dice ↑** | Dice similarity coefficient |\n| **IoU ↑** | Intersection over Union |\n|\
  \ **HD95 ↓** | 95th percentile Hausdorff distance |\n\n\n## Project Structure\n\n```\n├── Data.ipynb\
  \                    # Data loading & preprocessing\n├── 2D U-Net/\n│   ├── Dataset.ipynb\n│   ├── Preprocessing.ipynb\n\
  │   ├── Model.ipynb\n│   ├── Train.ipynb\n│   ├── dataset.py\n│   └── model.py\n├── 3D U-Net/\n│   ├──\
  \ 3DUNET.py\n│   ├── data_loader.py\n│   ├── metric.py\n│   ├── models.py\n│   └── train_models.py\n\
  ├── 3D UNETR/\n│   ├── Train.ipynb\n│   └── model.py\n└── Linear UNETR/\n    ├── 03-Train_linear.ipynb\n\
  \    ├── 03-Train_unetr.ipynb\n    ├── data_loader.py\n    ├── linear_unetr.py\n    ├── metric.py\n\
  \    ├── models.py\n    └── train_models.py\n```\n\n\n## References\n\n- Hatamizadeh, A. et al. (2022).\
  \ UNETR: Transformers for 3D Medical Image Segmentation. *Proceedings of the IEEE/CVF Winter Conference\
  \ on Applications of Computer Vision (WACV)*.\n"

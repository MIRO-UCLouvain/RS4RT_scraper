readme_excerpt: "# \U0001F9E0 MRI TumorSift\n### AI-Powered Brain Tumor Classification using DenseNet121\
  \ Transfer Learning\n\n<p align=\"center\">\n  <img src=\"https://img.shields.io/badge/Python-3.10+-blue?style=for-the-badge&logo=python\"\
  >\n  <img src=\"https://img.shields.io/badge/TensorFlow-2.x-FF6F00?style=for-the-badge&logo=tensorflow\"\
  >\n  <img src=\"https://img.shields.io/badge/Keras-Deep%20Learning-D00000?style=for-the-badge&logo=keras\"\
  >\n  <img src=\"https://img.shields.io/badge/OpenCV-Image%20Processing-5C3EE8?style=for-the-badge&logo=opencv\"\
  >\n  <img src=\"https://img.shields.io/badge/License-MIT-green?style=for-the-badge\">\n</p>\n\n---\n\
  \n## \U0001F4D6 Overview\n\n**MRI TumorSift** is an AI-powered medical imaging application designed\
  \ to classify brain MRI scans into different tumor categories using **Transfer Learning** with **DenseNet121**.\n\
  \nThe model automatically extracts high-level features from MRI scans and predicts the corresponding\
  \ tumor class, providing an intelligent decision-support system for early diagnosis and medical research.\n\
  \n---\n\n## ✨ Key Features\n\n- \U0001F9E0 Brain MRI Tumor Classification\n- \U0001F680 DenseNet121\
  \ Transfer Learning\n- \U0001F4C8 Image Data Augmentation\n- ⚡ High Accuracy Deep Learning Model\n-\
  \ \U0001F4CA Automated Model Evaluation\n- \U0001F4BE Save & Reload Trained Models\n- \U0001F50D Predict\
  \ Tumor Type from New MRI Images\n- \U0001F310 Streamlit-based Interactive Web Application\n\n---\n\n\
  # \U0001F3D7️ System Workflow\n\n```text\n              Brain MRI Image\n                     │\n  \
  \                   ▼\n         Image Preprocessing\n                     │\n                     ▼\n\
  \        Data Augmentation Pipeline\n                     │\n                     ▼\n      DenseNet121\
  \ Feature Extractor\n                     │\n                     ▼\n      Custom CNN Classification\
  \ Head\n                     │\n                     ▼\n         Softmax Probability Layer\n       \
  \              │\n                     ▼\n        Brain Tumor Classification\n```\n\n---\n\n# \U0001F9E0\
  \ Model Architecture\n\nThe project leverages **Transfer Learning** using **DenseNet121** pretrained\
  \ on ImageNet.\n\nThe architecture consists of:\n\n- DenseNet121 Backbone\n- Fine-Tuning Layers\n- Additional\
  \ Convolution Layers\n- Global Average Pooling\n- Dropout Layer\n- Fully Connected Dense Layer\n- Softmax\
  \ Output Layer\n\n---\n\n# \U0001F4C2 Project Structure\n\n```\nMRI_TumorSift\n│\n├── Dataset\n│   ├──\
  \ Training\n│   └── Testing\n│\n├── Model_Building.py\n├── Streamlit_Deployment.py\n└── README.md\n\
  ```\n\n---\n\n# \U0001F6E0️ Tech Stack\n\n| Category | Technologies |\n|----------|--------------|\n\
  | Language | Python |\n| Deep Learning | TensorFlow, Keras |\n| CNN Architecture | DenseNet121 |\n|\
  \ Image Processing | OpenCV, PIL |\n| Numerical Computing | NumPy |\n| Data Augmentation | ImageDataGenerator\
  \ |\n| Deployment | Streamlit |\n\n---\n\n# \U0001F4CA Dataset Structure\n\n```\nDataset\n│\n├── Training\n\
  │   ├── Glioma\n│   ├── Meningioma\n│   ├── Pituitary\n│   └── No Tumor\n│\n└── Testing\n    ├── Glioma\n\
  \    ├── Meningioma\n    ├── Pituitary\n    └── No Tumor\n```\n\n---\n\n# ⚙️ Installation\n\n### Clone\
  \ Repository\n\n```bash\ngit clone https://github.com/AVarshini05/MRI_TumorSift.git\n```\n\n### Navigate\n\
  \n```bash\ncd MRI_TumorSift\n```\n\n### Create Virtual Environment\n\n```bash\npython -m venv venv\n\
  ```\n\n### Activate\n\nWindows\n\n```bash\nvenv\\Scripts\\activate\n```\n\nLinux/Mac\n\n```bash\nsource\
  \ venv/bin/activate\n```\n\n### Install Dependencies\n\n```bash\npip install -r requirements.txt\n```\n\
  \n---\n\n# \U0001F680 Train the Model\n\n```bash\npython Model_Building.py\n```\n\nDuring training the\
  \ model:\n\n- Loads MRI Dataset\n- Performs Data Augmentation\n- Fine Tunes DenseNet121\n- Evaluates\
  \ Test Accuracy\n- Saves Trained Model\n\n---\n\n# \U0001F52C Predict New MRI Images\n\n```python\n\
  from tensorflow.keras.models import load_model\n\nmodel = load_model(\"MODEL.h5\")\n\nprediction = model.predict(image)\n\
  ```\n\nThe output represents the predicted brain tumor category.\n\n---\n\n# \U0001F4C8 Future Enhancements\n\
  \n- ✅ Grad-CAM Explainable AI\n- ✅ Brain Tumor Segmentation\n- ✅ Faster Inference\n- ✅ FastAPI Backend\n\
  - ✅ Docker Deployment\n- ✅ Cloud Deployment\n- ✅ Mobile Application\n- ✅ Medical Report Generation using\
  \ AI\n\n---\n\n# \U0001F4A1 Applications\n\n- Clinical Decision Support\n- Medical Imaging Research\n\
  - Computer-Aided Diagnosis (CAD)\n- Healthcare AI Systems\n- Educational Demonstrations\n- Medical AI\
  \ Research\n\n---\n\n# \U0001F4DA Technologies Used\n\n- Python\n- TensorFlow\n- Keras\n- DenseNet121\n\
  - NumPy\n- OpenCV\n- PIL\n- Streamlit\n\n---\n\n# \U0001F91D Contributing\n\nContributions are welcome!\n\

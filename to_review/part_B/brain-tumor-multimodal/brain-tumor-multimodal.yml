readme_excerpt: "# Multimodal Brain Tumor Segmentation & Radiology Report Generation\n\nA multimodal deep\
  \ learning pipeline on the BraTS2020 dataset that jointly performs \ntumor segmentation and generates\
  \ free-text radiology reports from FLAIR MRI scans.\n\n## Notebooks\n| Notebook | Description |\n|---|---|\n\
  | `Team63_Original.ipynb` | Full pipeline — 2.5D preprocessing, segmentation, and report generation\
  \ |\n| `Team63_Optimised_text.ipynb` | Optimised version focused on report generation with patient-level\
  \ CLIP encoding and beam search decoding |\n\n## Overview\n- 2.5D FLAIR MRI preprocessing — 3 consecutive\
  \ axial slices stacked as channels, resized to 224×224\n- CLIP ViT-B/16 vision encoder with chunked\
  \ slice processing (8 slices/chunk) to manage VRAM\n- Custom Transformer decoder (4 layers, 8 heads)\
  \ with beam search for free-text radiology report generation\n- Multi-class tumor segmentation across\
  \ 4 sub-regions: ET, TC, WT, background\n- MONAI spatial + intensity augmentations, weighted random\
  \ sampling to handle tumor/non-tumor slice imbalance\n- Mixed precision training with cosine annealing\
  \ LR scheduler and warmup\n\n## Tech Stack\n`PyTorch` `CLIP` `MONAI` `HuggingFace Transformers` `nibabel`\
  \ `scikit-learn` `scikit-image`\n\n## Dataset\n- [BraTS2020](https://www.kaggle.com/datasets/awsaf49/brats20-dataset-training-validation)\
  \ — FLAIR MRI volumes + segmentation masks\n- [TextBraTS](https://www.kaggle.com/datasets/pichu99/textbrats)\
  \ — paired radiology reports\n\n## Evaluation\n| Task | Metrics |\n|---|---|\n| Report Generation |\
  \ BLEU-1, BLEU-2, corpus BLEU, ROUGE-1, ROUGE-2, ROUGE-L |\n| Segmentation | Dice Score, Hausdorff Distance\
  \ |\n"

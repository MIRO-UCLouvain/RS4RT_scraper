readme_excerpt: "# Diagnostic performance of artefact-reduced cone-beam CT images\n\nThis repository contains\
  \ data and code related to the study on the diagnostic performance of artefact-reduced cone-beam CT\
  \ (CBCT) images. The study evaluates the effectiveness of various artefact reduction techniques in improving\
  \ the quality of CBCT images for diagnostic purposes.\n\n\n## Branch Structure\n\n- `main`: Repository\
  \ presentation and documentation.\n- `tensorflow`: Implementation of artefact reduction using TensorFlow,\
  \ working on 2D \"raw\" CBCT slices. Presented in the articles 'Diagnostic performance of artefact-reduced\
  \ cone-beam CT images using a generative adversarial neural network'\n- `torch`: Implementation of artefact\
  \ reduction using PyTorch, this time working on 2.5d & 3D CBCT volumes (dcm) images. \n"

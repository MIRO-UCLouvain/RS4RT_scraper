readme_excerpt: "# Awesome AI in Dentistry \U0001F9B7\n\n[![Awesome](https://awesome.re/badge.svg)](https://awesome.re)\n\
  <p align=\"center\">\n  <img src=\"./thumbnail.png\" alt=\"Awesome AI in Dentistry Thumbnail\" width=\"\
  200\"/>\n</p>\n\n> A curated list of awesome resources for Artificial Intelligence in Dentistry research\
  \ and applications.\n\n**Website:** The interactive research index is available at <https://mhson-kyle.github.io/awesome-ai-in-dentistry/>.\
  \ The list of works will be updated shortly.\n\nWelcome to the **Awesome AI in Dentistry** repository!\
  \ This is a comprehensive collection of research papers, datasets, open-source tools, and resources\
  \ focused on the application of Artificial Intelligence in dental research and clinical practice.\n\n\
  There is much more to add, especially in areas like Reconstruction and emerging multimodal learning\
  \ approaches. Contributions are very welcome!\n\n## \U0001F4CB Table of Contents\n\n- [News](#news)\n\
  - [Surveys & Reviews](#surveys--reviews)\n- [Detection & Classification](#detection--classification)\n\
  - [Segmentation](#segmentation)\n  - [CBCT Segmentation](#cbct-segmentation)\n  - [IOS Segmentation](#ios-segmentation)\n\
  \  - [OPG (X-ray) Segmentation](#opg-x-ray-segmentation)\n- [Generation](#generation)\n  - [Prosthesis\
  \ Generation](#prosthesis-generation)\n  - [Reconstruction](#reconstruction)\n- [Orthodontic](#orthodontic)\n\
  - [Registration](#registration)\n- [Multimodal & Vision-Language Models](#multimodal--vision-language-models)\n\
  - [Datasets & Benchmarks](#datasets--benchmarks)\n- [Open Source Tools](#open-source-tools)\n- [Standards\
  \ & Guidelines](#standards--guidelines)\n- [Contributing](#contributing)\n- [License](#license)\n\n\
  ---\n\n## \U0001F4F0 News\n\n*Latest updates and milestones in AI Dentistry research*\n\n| Date | Milestone\
  \ | Details |\n|------|-----------|---------|\n| Jan 2025 | ADA Standard 1110-1 Approved | ANSI approval\

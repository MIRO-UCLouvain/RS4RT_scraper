  \ dental-specialized MLLM for multimodal dental image analysis |\n| Sep 2025 | MMOral Benchmark Released\
  \ | Large-scale multimodal instruction dataset for panoramic X-ray analysis (20K+ images, 1.3M instances)\
  \ |\n| Jul 2025 | MMDental Dataset Published | Multimodal dataset with 660 patients combining CBCT and\
  \ expert medical records in Nature Scientific Data |\n| May 2025 | CBCT Segmentation Meta-Analysis |\
  \ Evolution of deep learning for tooth segmentation reviewed across 30 studies |\n| Jan 2025 | STS-Tooth\

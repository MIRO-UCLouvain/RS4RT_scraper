readme_excerpt: "# Evaluating the Impact of Synthetic Data on Enhancing Kidney Tumor Segmentation in CT\
  \ Scans\n\nThis project investigates how different synthetic data generation techniques influence the\
  \ performance of medical image segmentation models, with a specific focus on kidney tumors in CT scans.\
  \ The primary model used in this study is nnU-Net, a state-of-the-art framework for biomedical image\
  \ segmentation.\n\nThis research was conducted as part of the undergraduate thesis of Anastasiia Petrovych,\
  \ under the supervision of Dmytro Fishman.\n\n\n\n## \U0001F9E0 Thesis Goal\nTo explore whether injecting\
  \ synthetic kidney tumors into real CT scans can improve the accuracy and flexibility of segmentation\
  \ models. The research examines:\n\n* The effectiveness of various synthetic tumor generation methods\n\
  \  \n* Performance changes in nnU-Net models trained on augmented datasets\n  \n* Visual and quantitative\
  \ evaluation of segmentation results\n\n\n\n> Note: We cannot provide access to complete dataset due\
  \ to healthcare data privacy restrictions, therefore only one .nii.gz file is included as an example.\n\
  \nIf further details are required, please contact me at anastasiia.petrovych@ucu.edu.ua.\n\n\n## \U0001F4C1\
  \ Project Structure\n\n\n```\n.\n├── data/                            # Metadata and filtered dataset\
  \ information\n│   ├── filtered_hospital_a_tumors.csv\n│   ├── hospital_a_ct_scans_with_tumors.json\n\
  │   └── hospital_b_ct_scans_with_tumors.json\n\n├── experiments/                     # nnU-Net preprocessed\
  \ inputs, raw data, and training results\n│   ├── nnUNet_preprocessed/\n│   ├── nnUNet_raw/\n│   └──\
  \ nnUNet_results/\n\n├── generation/                      # Synthetic data generation and analysis tools\n\
  │   ├── 2D_model/                    # Diffusion-based 2D tumor generation model\n│   ├── 2.5D_model/\
  \                  # Multi-slice (2.5D) generation model\n│   ├── Palette-Image-to-Image-Diffusion-Models/\
  \  # Palette diffusion framework\n│   ├── copy_paste_augmentation/     # Copy-paste based tumor injection\n\
  │   ├── tumor_masks/                 # Extracted or generated tumor masks\n│   ├── analyse_tumor_data.py\
  \        # Analyse tumor distribution and sizes\n│   ├── augment_dataset.py           # Apply augmentations\
  \ to CT datasets\n│   ├── flip_ct_scans.py             # Flip scans to RAS orientation\n│   ├── check_file_corrupted.py\
  \      # Check for corrupted CT or mask files\n│   └── get_correctly_detected_tumors.py  # Evaluate\
  \ tumor detection performance\n\n├── segmentation/                    # nnU-Net training and inference\
  \ scripts\n│   ├── nnUNet/                      # nnU-Net framework\n│   ├── train_model.bash      \
  \       # Training model script\n│   └── inference_model.bash         # Inference and evaluation script\n\
  \n├── visualisation/                   # Plots, overlays, and result visualizations\n\n├── requirements.txt\
  \                 # List of Python dependencies\n└── README.md                        # Project documentation\n\
  ```\n\n\n## How to start\n\n> Note: To run the majority of scripts in this repository (including model\
  \ training and inference), high-computing resources with NVIDIA A100 GPU. In our case, we use a high-performance\
  \ computing (HPC) cluster of University of Tartu.\n\n1. Clone this repository to local environemnt.\n\
  \n2. Install Python requirements.\n```bash\npip install requirements.txt\n```\n\n3. Train the model.\n\
  \nSend SLURM job.\n```bash\nsbatch segmentation/train_model.bash\n```\n\nWait until the model is trained.\
  \ The example of my pre-trained checkpoint [Dataset607 best checkpoint](https://drive.google.com/file/d/1h4NlAF55b0y9a3DNZLXnsE80d-qGWw8e/view?usp=sharing)\n\
  \n4. Run inference to get results.\n\nSend SLURM job.\n```bash\nsbatch segmentation/inference_model.bash\n\
  ```\n\n\n### If you want to try generations:\n\nGo to `generation/` folder.\n\nIf you want to run 2D\
  \ model -> navigate to `2D_model/`.\n\nIf you want to run 2.5D model -> navigate to `2.5D_model/`.\n\
  \nIf you want to run Copy-paste augmentation -> navigate to `copy_paste_augmentation/`.\n\n\n### Files\
  \ on Google Drive\n\nModel checkpoint and dataset sample files exceed the limit of GitHub files (100MB),\
  \ so they were uploaded to Google Drive.\nDownload the following files by this link: https://drive.google.com/drive/folders/1ZoGpWzeFLITlxsb92CdHcDxVw3Q5L91p\
  \ \n\n\n\n## Solution\n\nThe proposed approach includes a systematic comparison between copy-paste augmentation\
  \ and generative models, with a particular focus on diffusion-based methods. To address the problem\
  \ of the limited amount of annotated data, we adopt multiple strategies: (1) optimal training-validation-test\
  \ data splitting, (2) fine-tuning of pretrained models on new datasets, (3) copy-paste augmentation,\
  \ (4) synthetic data generation using 2D diffusion models, and (5) synthetic data generation using 2.5D\
  \ diffusion models. The results of every approach are validated, using standard segmentation metrics,\
  \ on a held-out test set to ensure fair comparison and reproducibility.\n\nThe proposed pipeline, illustrated\
  \ on Figure 1, provides an overview of all major components.\n\n![Pipeline diagram](diagram_pipeline.png)\n\
  *Figure 1. Overview of the proposed pipeline. Real clinical data from Estonian hospitals A and B is\
  \ used.*\n\n\n### Synthetic Data Generation Approaches\n\nThis section outlines three ways to create\
  \ realistic tumor-bearing CT scans from clean images. The simplest method, copy-paste augmentation,\
  \ takes real 3D tumor patches (including a bit of surrounding tissue), aligns and resamples them to\
  \ match a clean scan, then pastes them into a randomly chosen kidney region—using edge detection to\
  \ find a natural spot—and updates the scan’s pixel values and mask. The second method uses a 2D diffusion\
  \ model (a fine-tuned DDPM) that “inpaints” tumors onto individual CT slices by filling in user-provided\
  \ masks with textures and shapes learned from real tumors. Finally, the 2.5D diffusion model improves\
  \ on this by feeding three consecutive slices (only one of which is masked) through the network in sequence,\
  \ so the generated tumors stay coherent across adjacent slices; the newly created regions are then stitched\
  \ back into the full volume for smooth, anatomically consistent results. Examples of outputs can be\
  \ seen on Figure 2.\n\n![Tumors](tumors.png)\n*Figure 2. Comparison of original CT scans and synthetic\
  \ tumor generation results. The top row presents the original scan with a tumor, the copy-paste augmentation\
  \ output, the 2D diffusion model output, and the 2.5D diffusion model output. The bottom row shows the\
  \ same scans with tumor regions highlighted in red for clarity.*\n\n\n### Segmentation Model Performance\n\
  \nWe evaluated kidney tumor segmentation using nnU-Net across four datasets: KiTS, KIRC, and two clinical\
  \ collections (Datasets A and B). Our baseline model—trained on KiTS, KIRC, and Dataset A—achieved strong\
  \ results on Dataset A, DSC **0.86**, IoU **0.81**, but failed to generalise to Dataset B, DSC **0.07**,\
  \ IoU **0.06**, highlighting domain shifts and class imbalance. Fine-tuning on Dataset B alone proved\
  \ ineffective due to its scarcity of tumors, even when merged with source data. To address this, we\
  \ introduced synthetic scans via copy-paste augmentation, 2D diffusion, and 2.5D diffusion models. Copy-paste\
  \ augmentation yielded modest gains, DSC **0.10**, IoU **0.09** on Split II, whereas diffusion-based\
  \ methods underperformed. Finally, combining source data with Dataset B plus copy-paste-generated scans\
  \ improved detection, DSC **0.09**, IoU **0.08**, four out of six tumors detected, confirming that simple\
  \ synthetic augmentation can partially mitigate distribution gaps and class imbalance.\n\n![Segmentation\
  \ masks](segmentation_masks_upd.png)\n*Figure 3. Visual examples of segmentation results on CT slices\
  \ of Dataset B. Green contours represent the ground truth tumor masks, and pink contours represent the\
  \ model’s predictions. The pink area indicates a false positive if no green contour is present. DSC\
  \ and IoU scores are provided for each case.*\n\n\n## Summary of Results\n\nThe experimental results\
  \ demonstrate that augmentation with synthetic data positively impacts model performance, providing\
  \ slight improvements compared to other strategies. Neither optimal training-validation-test data splitting\
  \ strategies nor fine-tuning alone leads to significant improvements across different settings. In contrast,\
  \ models trained with synthetic data augmentation show better performance across different dataset configurations.\n\
  Although the observed improvements are minor, they demonstrate the potential of synthetic data augmentation,\
  \ even with current limitations in the methods used. This suggests promising directions for future research.\
  \ A detailed overview of all experimental results is provided in Table 1.\n\n\n---\n\n**Test Set Dataset\
  \ A:** 192 CT Scans (99 with tumor lesions, 93 without tumors)\n\n| Models                         \
  \                          | DSC ↑          | IoU ↑          | TP ↑           | FP ↓  |\n|----------------------------------------------------------|----------------|----------------|----------------|-------|\n\
  | <u>Source-Only</u>                                       | <u>0.86</u>    | <u>0.81</u>    | <u>0.95</u>\

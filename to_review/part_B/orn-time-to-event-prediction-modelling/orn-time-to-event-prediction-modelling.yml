readme_excerpt: "# ORNJ Survival Modeling with Weibull AFT\n\nThis repository contains code for developing\
  \ and validating a Weibull Accelerated Failure Time (AFT) model to estimate the time-to-onset of osteoradionecrosis\
  \ of the jaw (ORNJ) in head and neck cancer (HNC) patients treated with radiation therapy.\n\n## Dataset\n\
  \nThe code is designed to be used with the dataset available via Figshare:\n\nhttps://doi.org/10.6084/m9.figshare.26240435\n\
  \nThis dataset includes a large, longitudinal cohort of HNC patients with detailed demographic, clinical,\
  \ and dosimetric variables, along with structured follow-up and ORNJ event data.\n\nPlease ensure the\
  \ dataset is downloaded and properly loaded before running the code in this repository.\n\n## Related\
  \ Publication\n\nThis work is associated with the following peer-reviewed publication:\n\n**Externally\
  \ validated digital decision support tool for time-to-osteoradionecrosis risk-stratification using right-censored\
  \ multi-institutional observational cohorts**  \nPMID: https://pubmed.ncbi.nlm.nih.gov/40222595/\n\n\
  Please cite this publication if you use the dataset or code in your research.\n\n### Citation (BibTeX)\n\
  \n```bibtex\n@article{humbertvidan2025ornj,\n  title={Externally validated digital decision support\
  \ tool for time-to-osteoradionecrosis risk-stratification using right-censored multi-institutional observational\
  \ cohorts},\n  author={Humbert-Vidan, L and Kamel, S and Wentzel, A and Kaffey, Z and Abdelaal, M and\
  \ Spier, KB and West, NA and Marai, GE and Canahuate, G and Zhang, X and Chen, MM and Wahid, KA and\
  \ Rigert, J and Hosseinian, S and Schaefer, AJ and Brock, KK and Chambers, M and Otun, AO and Aponte-Wesson,\
  \ R and Patel, V and Hope, A and Phan, J and Garden, AS and Frank, SJ and Morrison, WH and Spiotto,\
  \ MT and Rosenthal, D and Lee, A and He, R and Naser, MA and Watson, E and Hutcheson, KA and Mohamed,\
  \ ASR and Sandulache, VC and van Dijk, LV and Moreno, AC and Urbano, TG and Fuller, CD and Lai, SY},\n\
  \  journal={Radiotherapy and Oncology},\n  volume={207},\n  pages={110890},\n  year={2025},\n  publisher={Elsevier},\n\
  \  doi={10.1016/j.radonc.2025.110890}\n}\n```\n"

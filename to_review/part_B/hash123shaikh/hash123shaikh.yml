readme_excerpt: "# Hasan Shaikh - Medical Imaging & AI for Oncology Researcher\n\U0001F393 M.Tech in Computer\
  \ Engineering | Aligarh Muslim University, India (CGPA: 8.80/10)  \n\U0001F3E5 Clinical Data Scientist\
  \ @ QIRAIL Lab, CMC Vellore  \n\U0001F9E0 Radiomics • Auto-Segmentation • Adaptive Radiotherapy • Cancer\
  \ AI • Uncertainty Quantification\n\n---\n\n## \U0001F44B About Me\n\nI am a clinical data scientist\
  \ and medical imaging researcher working at the **Quantitative Imaging Research and Artificial Intelligence\
  \ Lab ([QIRAIL](https://qirail.cmcvellore.edu.in/))**, Department of Radiation Oncology, Christian Medical\
  \ College, Vellore, India — one of India's leading cancer centers.\n\nMy work focuses on building AI\
  \ pipelines that help oncologists make smarter, faster, and more personalized treatment decisions for\
  \ head and neck cancer patients.\n\nMy research primarily focuses on:\n- Radiomics-Based Cancer Outcome\
  \ Prediction\n- Automated Tumor Segmentation (3D CNNs, nnU-Net)\n- Adaptive Radiotherapy & Treatment\
  \ Planning Automation\n- Uncertainty Quantification in Clinical AI\n- DICOM/PACS Engineering & Clinical\
  \ Data Pipelines\n- Multimodal Deep Learning for Oncology\n\nI have authored and co-authored multiple\
  \ papers, including a **Poster Highlight accepted at ESTRO 2026, Sweden** (European Society for Radiotherapy\
  \ and Oncology), a Springer LNEE conference paper, a medRxiv preprint, and an Elsevier book chapter.\
  \ I also organize hands-on radiomics and auto-segmentation workshops for clinicians, Medical Physics,\
  \ and researchers.\n\nI genuinely enjoy talking with people — researchers, clinicians, or anyone curious\
  \ about AI in healthcare. Feel free to reach out anytime.\n\n> \U0001F3AF **I am actively looking for\
  \ PhD positions** in medical imaging, radiation oncology AI, uncertainty quantification, adaptive radiotherapy,\
  \ and cancer research.\n\n---\n\n## \U0001F52C Publications & Research\n\n### Under Submission\n- \U0001F4C4\
  \ **Can reproducibility be achieved? External validation of `Reproducible' image-based prognostic models\

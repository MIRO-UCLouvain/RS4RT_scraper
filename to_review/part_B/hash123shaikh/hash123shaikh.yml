  \ Lab, Christian Medical College, Vellore, India — Hands-on training for clinicians, Medical Physics,\
  \ and researchers on radiomics pipelines and auto-segmentation tools.\n\n- \U0001F6E0️ **1st Workshop\
  \ on Radiomics and Auto-Segmentation - 1st edition** *(November 14–15, 2025)*  \n  Department of Radiation\

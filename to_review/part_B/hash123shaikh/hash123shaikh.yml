  \ Rajendra Benny Kuchipudi, et al. \n  *Scientific Reports, Nature Portfolio*\n\n### Conference\n- \U0001F4C4\
  \ **Development and Validation of a Prospective Radiomics-Clinical Signature for Locoregional Recurrence\
  \ in Locally Advanced Head and Neck Cancer**  \n  Balu Krishna S, Amal Joseph Varghese, **Hasan Shaikh**\
  \ et al.  \n  *European Society for Radiotherapy and Oncology (ESTRO 2026), Stockholm, Sweden* — **✅\
  \ Accepted as Poster Highlight**\n\n- \U0001F4C4 **Metaheuristic-Driven Machine Learning Pipelines for\
  \ Radiomics-Based Prediction of Locoregional Recurrence in Head and Neck Cancer**  \n  **Hasan Shaikh**,\
  \ Balu Krishna S, Amal Joseph Varghese et al.  \n  *Lecture Notes in Electrical Engineering, Springer\

readme_excerpt: "Date: 10.08.2025\nMachine learning Integrated Normal tissue Toxicity prediction for severe\
  \ Oral Mucositis (MINT-OM)\nAvailable at https://github.com/radsimbio/MINT_OM\n\nDescriptions of files\n\
  - AssignedCategories.pdf: Definition of categorial variables\n- Folders \"Approach_A\", \"Approach_B\"\
  , ... contain (i) scripts for training and testing the classification model and input examplies (subfolder\
  \ \"NewTraining\"), \n  and (ii) the trained model to be used for prediction (subfolder \"TrainedModel\"\
  ):\n\t- Approach_A: Training with clinical features \n\t- Approach_B: Training with radiomic features\n\
  \t- Approach_C: Training with dose-volumetric features\n\t- Apporach_d: Pooling all types of features\
  \ initially before the feature selection process\n\n\nFor questions regarding MINT-OM, please contact\
  \ Dr. Thiansin Liamsuwan (thiansin.lia@cra.ac.th)\n\nReference to MINT_OM: Buasawat K, Chamchod S, Fuangrod\
  \ T, Suntiwong S, Chantarak K, Jarutatsanangkoon P, Liamsuwan T. Machine learning–based prediction of\
  \ severe oral mucositis from head and neck cancer radiation therapy. Radiat Oncol J. 2025; Available\
  \ from: https://doi.org/10.3857/roj.2025.00416\n"

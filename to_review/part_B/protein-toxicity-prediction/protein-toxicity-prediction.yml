readme_excerpt: "# protein_toxicity_prediction\n\nWelcome to the Protein Toxicity Prediction Repository.\n\
  This prediction script empowers users to assess the potential toxicity of proteins in terms of Cardiotoxicity,\
  \ Neurotoxicity, and Enterotoxicty. By providing the primary protein sequence of your query protein,\
  \ our well-trained models will swiftly analyze and predict whether the entered sequence exhibits toxicity,\
  \ and if so, which specific toxic category it falls under.\n\n# Features of this ML classification model\n\
  - Predicts protein toxicity based on Cardiotoxicity, Neurotoxicity, and Enterotoxicty.\n- Utilizes advanced\
  \ machine learning models for accurate predictions.\n- Provides results in a convenient .csv format.\n\
  \n# Contents\n- Prediction model script written in the R programming language.\n- To save you time and\
  \ resources, we have included the best-performing pre-trained models. These models are saved as pickled\
  \ files, ensuring you don't need to perform recurrent model training.\n- Datasets that contains best\
  \ features which has highest highimportance in building all three models.\n- Datasets that contain the\
  \ reduced list of features used to build the prediction models after performing feature selection.\n\
  \  These features have demonstrated the highest importance in creating accurate predictions for all\
  \ three toxicity categories.\n \n# How to Use\n1. Make sure you have **R 4.3.0** and **R Studio 2023.06.0**\
  \ installed on your system.\n2. Clone this repository and navigate to the project directory.\n3. Open\
  \ the prediction script in R Studio.\n4. Input your protein's primary sequence in the designated area.\n\
  5. Run the script to generate predictions.\n6. The results will be saved as a .csv file for your reference.\n"

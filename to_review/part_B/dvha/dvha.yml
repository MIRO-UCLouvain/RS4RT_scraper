readme_excerpt: '# DVHA - Damn Vulnerable Harmony Application


  ![HarmonyOS](https://img.shields.io/badge/HarmonyOS-Next%205.0%2B-lightgrey.svg)

  ![Status](https://img.shields.io/badge/Status-Active-success.svg)

  ![License](https://img.shields.io/badge/License-Apache%202.0-blue.svg)


  # Quickstart


  Download or clone this Github repo:


  ```bash

  git clone https://github.com/DEKRA-Cybersecurity/Harm0niz3r/

  ```


  DVHA can be instaled through Huawei DevEco Studio (main HOS development tool, like XCode for *OS). Once
  installed, the icon will be visible from app menu in HOS.


  # Developing


  In order to develop custom activities, an instalation of Deveco Studio is required. For development
  builds, a Huawei developer account is also needed to sign the appication *.hap* with a debug certificate.


  Then, just add a new page in *pages* foder and the linked button at index.



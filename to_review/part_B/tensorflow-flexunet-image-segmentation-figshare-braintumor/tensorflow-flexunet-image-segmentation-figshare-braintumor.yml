readme_excerpt: "<h2>TensorFlow-FlexUNet-Image-Segmentation-Figshare-BrainTumor (Updated: 2026/06/14)</h2>\n\
  Sarah T. Arai<br>\nSoftware Laboratory antillia.com<br>\n\n<ul>\n<li>2026/06/14: Modified <a href=\"\
  ./generator/ImageMaskDatasetGenerator.py\">\nImageMaskDatasetGenerator</a> class, and regenerated our\
  \ PNG-ImageMask-Dataset.\n</li>\n</ul>\nThis is the second experiment of Image Segmentation for BrainTumor\
  \ Multiclass, \n based on our \n <a href=\"https://github.com/sarah-antillia/TensorFlow-FlexUNet-Image-Segmentation-Model\"\
  >\n<b>TensorFlowFlexUNet (TensorFlow Flexible UNet Image Segmentation Model for Multiclass)</b></a>\n\
  , and a 512x512 pixels PNG\n<a href=\"https://drive.google.com/file/d/1fOChpRI2WsAoMQVA379Ws-OSlaeXlw3O/view?usp=sharing\"\
  >\n<b>Figshare-BrainTumor-ImageMask-Datasetzip</b></a> (<a href=\"https://creativecommons.org/licenses/by-sa/4.0/\"\
  >CC BY-SA 4.0</a>) with colorized \nmasks (Meningioma:yellow, Glioma:cyan, Pituitary tumor:mazenta).\n\
  which was derived by us from \n<a href=\"https://www.kaggle.com/datasets/ashkhagan/figshare-brain-tumor-dataset/data\"\
  >\n<b>Figshare Brain Tumor Dataset</b>\n</a>\n<br>\n<br>\n<b>Acutual Image Segmentation for Figshare\
  \ BrainTumor Images of 512x512 pixels</b><br>\nAs shown below, the inferred masks predicted by our segmentation\
  \ model trained on the \nPNG dataset appear similar to the ground truth masks.<br><br>\n<b>class_color_map\
  \ {Meningioma:yellow, Glioma:cyan, Pituitary tumor:mazenta}</b>\n<br>\n<table>\n<tr>\n<th>Input: image</th>\n\
  <th>Mask (ground_truth)</th>\n<th>Prediction: inferred_mask</th>\n</tr>\n<tr>\n<td><img src=\"./projects/TensorFlowFlexUNet/BrainTumor/mini_test/images/12426.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/BrainTumor/mini_test/masks/12426.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/BrainTumor/mini_test_output/12426.png\"\
  \ width=\"320\" height=\"auto\"></td>\n</tr>\n<tr>\n<td><img src=\"./projects/TensorFlowFlexUNet/BrainTumor/mini_test/images/12091.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/BrainTumor/mini_test/masks/12091.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/BrainTumor/mini_test_output/12091.png\"\
  \ width=\"320\" height=\"auto\"></td>\n</tr>\n<tr>\n<td><img src=\"./projects/TensorFlowFlexUNet/BrainTumor/mini_test/images/10055.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/BrainTumor/mini_test/masks/10055.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/BrainTumor/mini_test_output/10055.png\"\
  \ width=\"320\" height=\"auto\"></td>\n</tr>\n</table>\n<hr>\n<br>\n<h3>1. Dataset Citation</h3>\nThe\
  \ image and mask dataset used here has been taken from the following website.<br>\n\n<a href=\"https://www.kaggle.com/datasets/ashkhagan/figshare-brain-tumor-dataset/data\"\
  >\n<b>Figshare Brain Tumor Dataset</b>\n</a>\n<br>\n<br>\n<b>About Dataset</b><br>\nThis brain tumor\
  \ dataset containing 3064 T1-weighted contrast-inhanced images<br>\nfrom 233 patients with three kinds\
  \ of brain tumor: meningioma (708 slices),<br>\nglioma (1426 slices), and pituitary tumor (930 slices).\
  \ Due to the file size<br>\nlimit of repository, we split the whole dataset into 4 subsets, and achive<br>\n\
  them in 4 .zip files with each .zip file containing 766 slices.The 5-fold<br>\ncross-validation indices\
  \ are also provided.\n<br>\n<br>\nThis data is organized in matlab data format (.mat file). Each file\
  \ stores a struct<br>\ncontaining the following fields for an image:<br>\n<br>\ncjdata.label: 1 for\
  \ meningioma, 2 for glioma, 3 for pituitary tumor<br>\ncjdata.PID: patient ID<br>\ncjdata.image: image\
  \ data<br>\ncjdata.tumorBorder: a vector storing the coordinates of discrete points on tumor border.<br>\n\
  For example, [x1, y1, x2, y2,…] in which x1, y1 are planar coordinates on tumor border.<br>\nIt was\
  \ generated by manually delineating the tumor border. So we can use it to generate<br>\nbinary image\
  \ of tumor mask.<br>\ncjdata.tumorMask: a binary image with 1s indicating tumor region<br>\n<br>\nThis\
  \ data was used in the following paper:<br>\n<br>\nCheng, Jun, et al. \"Enhanced Performance of Brain\
  \ Tumor Classification via Tumor Region Augmentation<br>\nand Partition.\" PloS one 10.10 (2015).<br>\n\
  Cheng, Jun, et al. \"Retrieval of Brain Tumors by Adaptive Spatial Pooling and Fisher Vector<br>\nRepresentation.\"\
  \ PloS one 11.6 (2016). Matlab source codes are available on github<br>\nhttps://github.com/chengjun583/brainTumorRetrieval<br>\n\
  <br>\n<b>License</b>: <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a> <br>\n\
  <br>\n\n<h3>\n<a id=\"2\">\n2 BrainTumor ImageMask Dataset\n</a>\n</h3>\n If you would like to train\
  \ this BrainTumor Segmentation model by yourself,\n please download the dataset from the google drive\
  \  \n<a href=\"https://drive.google.com/file/d/1fOChpRI2WsAoMQVA379Ws-OSlaeXlw3O/view?usp=sharing\"\
  >\nFigshare-BrainTumor-ImageMask-Dataset.zip</a>.\n<br>\n, expand the downloaded ImageMaskDataset and\
  \ put it under <b>./dataset</b> folder to be\n<pre>\n./dataset\n└─BrainTumor\n    ├─test\n    │   ├─images\n\
  \    │   └─masks\n    ├─train\n    │   ├─images\n    │   └─masks\n    └─valid\n        ├─images\n  \
  \      └─masks\n</pre>\n<br>\n<br>\n<b>BrainTumor Statistics</b><br>\n<img src =\"./projects/TensorFlowFlexUNet/BrainTumor/BrainTumor_Statistics.png\"\
  \ width=\"512\" height=\"auto\"><br>\n<br>\n\nAs shown above, the number of images of train and valid\
  \ datasets is not so large to use for a training set of our segmentation model.\n<br>\n<br>\n<b>Train_images_sample</b><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/BrainTumor/asset/train_images_sample.png\" width=\"1024\" height=\"\
  auto\">\n<br>\n<b>Train_masks_sample</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/BrainTumor/asset/train_masks_sample.png\"\
  \ width=\"1024\" height=\"auto\">\n<br>\n<h3>\n3 Train TensorFlowFlexUNet Model\n</h3>\n We trained\
  \ BrainTumor TensorFlowFlexUNet Model by using the following\n<a href=\"./projects/TensorFlowFlexUNet/BrainTumor/train_eval_infer.config\"\
  > <b>train_eval_infer.config</b></a> file. <br>\nPlease move to ./projects/TensorFlowFlexUNet/BrainTumor\
  \ and run the following bat file.<br>\n<pre>\n>1.train.bat\n</pre>\n, which simply runs the following\
  \ command.<br>\n<pre>\n>python ../../../src/TensorFlowFlexUNetTrainer.py ./train_eval_infer.config\n\
  </pre>\n<hr>\n\n<b>Model parameters</b><br>\nDefined a small <b>base_filters = 16 </b> and large <b>base_kernels\
  \ = (11,11)</b> for the first Conv Layer of Encoder Block of \n<a href=\"./src/TensorFlowFlexUNet.py\"\
  >TensorFlowFlexUNet.py</a> \nand a large <b>num_layers = 8</b> (including a bridge between Encoder and\
  \ Decoder Blocks).\n<pre>\n[model]\n;You may specify your own UNet class derived from our TensorFlowFlexModel\n\
  model         = \"TensorFlowFlexUNet\"\ngenerator     =  False\nimage_width    = 512\nimage_height \
  \  = 512\nimage_channels = 3\ninput_normalize = True\nnum_classes    = 4\nbase_filters   = 16\nbase_kernels\
  \   = (11,11)\nnum_layers     = 8\ndropout_rate   = 0.05\ndilation       = (1,1)\n</pre>\n<b>Learning\
  \ rate</b><br>\nDefined a very small learning rate.  \n<pre>\n[model]\nlearning_rate  = 0.00007\n</pre>\n\
  <b>Loss and metrics functions</b><br>\nSpecified \"categorical_crossentropy\" and <a href=\"./src/dice_coef_multiclass.py\"\
  >\"dice_coef_multiclass\"</a>.<br>\n<pre>\n[model]\nloss           = \"categorical_crossentropy\"\n\
  metrics        = [\"dice_coef_multiclass\"]\n</pre>\n<b>Dataset class</b><br>\nSpecifed <a href=\"./src/ImageCategorizedMaskDataset.py\"\
  >ImageCategorizedMaskDataset</a> class.<br>\n<pre>\n[dataset]\nclass_name    = \"ImageCategorizedMaskDataset\"\
  \n</pre>\n<br>\n<b>Learning rate reducer callback</b><br>\nEnabled learing_rate_reducer callback, and\
  \ a small reducer_patience.\n<pre> \n[train]\nlearning_rate_reducer = True\nreducer_factor     = 0.5\n\
  reducer_patience   = 4\n</pre>\n<b>Early stopping callback</b><br>\nEnabled early stopping callback\
  \ with patience parameter.\n<pre>\n[train]\npatience      = 10\n</pre>\n<b>RGB Color map</b><br>\nrgb\
  \ color map dict for BrainTumor 1+3 classes.<br>\n<pre>\n[mask]\nmask_file_format = \".png\"\n;background;black,\
  \  Meningioma:yellow, Glioma:cyaj, 'Pituitary tumor:mazenta\nrgb_map = {(0, 0, 0):0, (255,255,0):1,\
  \ (0,255,255):2, (255, 0, 255):3}\n</pre>\n\n<b>Epoch change inference callback</b><br>\nEnabled <a\
  \ href=\"./src/EpochChangeInfereuncer.py\">epoch_change_infer callback</a></b>.<br>\n<pre>\n[train]\n\
  epoch_change_infer       = True\nepoch_change_infer_dir   =  \"./epoch_change_infer\"\nnum_infer_images\
  \         = 6\n</pre>\n\nBy using this callback, on every epoch_change, the inference procedure can\
  \ be called\n for 6 images in <b>mini_test</b> folder. This will help you confirm how the predicted\
  \ mask changes \n at each epoch during your training process.<br> <br> \nAs shown below, early in the\
  \ model training, the predicted masks from our UNet segmentation model showed \ndiscouraging results.\n\
  \ However, as training progressed through the epochs, the predictions gradually improved. \n <br>\n\
  <b>Il faut de la patience.</b>\n <br>\n <br>\n<b>Epoch_change_inference output at starting (epoch 1,2,3)</b><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/BrainTumor/asset/epoch_change_infer_at_start.png\" width=\"\
  1024\" height=\"auto\"><br>\n<br>\n<b>Epoch_change_inference output at middlepoint (epoch 16,17,18)</b><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/BrainTumor/asset/epoch_change_infer_at_middlepoint.png\" width=\"\
  1024\" height=\"auto\"><br>\n<br>\n<b>Epoch_change_inference output at ending (epoch 33,34,35)</b><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/BrainTumor/asset/epoch_change_infer_at_end.png\" width=\"1024\"\
  \ height=\"auto\"><br>\n<br>\nIn this experiment, the training process was terminated at epoch 35.<br><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/BrainTumor/asset/train_console_output_at_epoch35.png\" width=\"\
  920\" height=\"auto\"><br>\n<br>\n<a href=\"./projects/TensorFlowFlexUNet/BrainTumor/eval/train_metrics.csv\"\
  >train_metrics.csv</a><br>\n<img src=\"./projects/TensorFlowFlexUNet/BrainTumor/eval/train_metrics.png\"\
  \ width=\"520\" height=\"auto\"><br>\n<br>\n<a href=\"./projects/TensorFlowFlexUNet/BrainTumor/eval/train_losses.csv\"\
  >train_losses.csv</a><br>\n<img src=\"./projects/TensorFlowFlexUNet/BrainTumor/eval/train_losses.png\"\
  \ width=\"520\" height=\"auto\"><br>\n<br>\n\n<h3>\n4 Evaluation\n</h3>\nPlease move to <b>./projects/TensorFlowFlexUNet/BrainTumor</b>\
  \ folder,\nand run the following bat file to evaluate TensorFlowFlexUNet model for BrainTumor.<br>\n\
  <pre>\n>./2.evaluate.bat\n</pre>\nThis bat file simply runs the following command.\n<pre>\n>python ../../../src/TensorFlowFlexUNetEvaluator.py\
  \ ./train_eval_infer_aug.config\n</pre>\n\nEvaluation console output:<br>\n<img src=\"./projects/TensorFlowFlexUNet/BrainTumor/asset/evaluate_console_output_at_epoch35.png\"\
  \ width=\"920\" height=\"auto\">\n<br><br>\n\n<a href=\"./projects/TensorFlowFlexUNet/BrainTumor/evaluation.csv\"\
  >evaluation.csv</a><br>\nThe loss (categorical_crossentropy) to this BrainTumor/test was not low but\
  \ dice_coef_multiclass \nhigh as shown below.\n<br>\n<pre>\ncategorical_crossentropy,0.0206\ndice_coef_multiclass,0.9905\n\
  </pre>\n<br>\n\n<h3>\n5 Inference\n</h3>\nPlease move <b>./projects/TensorFlowFlexUNet/BrainTumor</b>\
  \ folder \n,and run the following bat file to infer segmentation regions for images by the Trained-TensorFlowFlexUNet\
  \ model for BrainTumor.<br>\n<pre>\n>./3.infer.bat\n</pre>\nThis simply runs the following command.\n\
  <pre>\n>python ../../../src/TensorFlowFlexUNetInferencer.py ./train_eval_infer_aug.config\n</pre>\n\
  <hr>\n<b>mini_test_images</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/BrainTumor/asset/mini_test_images.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n<b>mini_test_mask(ground_truth)</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/BrainTumor/asset/mini_test_masks.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n\n<hr>\n<b>Inferred test masks</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/BrainTumor/asset/mini_test_output.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n<br>\n<hr>\n<b>Enlarged images and masks of Figshare BrainTumor\
  \ of 512x512 pixels</b><br><br>\n<b>class_color_map {Meningioma:yellow, Glioma:cyan, Pituitary tumor:mazenta}</b>\n\
  <br>\n<table>\n<tr>\n<th>Image</th>\n<th>Mask (ground_truth)</th>\n<th>Inferred-mask</th>\n</tr>\n\n\
  <tr>\n<td><im"

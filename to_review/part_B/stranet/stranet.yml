readme_excerpt: "# STRANet: Siamese Temporal Radiotherapy Assessment Network\n\n![Python 3.9](https://img.shields.io/badge/python-3.9-blue)\n\
  ![License](https://img.shields.io/badge/license-MIT-green)\n\n## Introduction\n\nNon-small cell lung\
  \ cancer (NSCLC) is the most common type of lung cancer, and radiotherapy (RT) is a key treatment for\
  \ patients with advanced or inoperable disease. However, predicting the efficacy of RT remains challenging\
  \ due to variability in patient response.  \n\nTraditional models rely primarily on pre-treatment CT\
  \ scans but fail to capture dynamic anatomical changes during treatment.  \n\n**STRANet (Siamese Temporal\
  \ Radiotherapy Assessment Network)** is a deep learning framework designed to predict post-RT outcomes\
  \ by analyzing both **pre- and post-radiotherapy 3D CT scans**. STRANet captures spatiotemporal changes\
  \ across the entire lung volume, improving predictive accuracy compared to traditional tumor-focused\
  \ approaches.  \n\nWe also introduce **STRANet-Lite**, a variant capable of handling incomplete longitudinal\
  \ data through **pseudo-temporal augmentation**, enhancing real-world clinical applicability.\n\n---\n\
  \n## Requirements\n\nThis project was developed and tested using **Python 3.9**, with dependencies managed\
  \ via **Conda**.\n\nAll required packages and version specifications are listed in `environment.yml`.\
  \  \nTo reproduce the environment, run the following commands:\n\n```bash\nconda env create -f environment.yml\n\
  conda activate stranet\n```\n\n---\n\n## Project Structure\n\nThe project is organized as follows:\n\
  \n```\nSTRANET/\n├── Data/\n│   ├── deep_features_test.csv       # Deep learning features extracted\
  \ from STRANet\n│   ├── deep_features_train.csv      # Deep learning features extracted from STRANet\n\
  │   ├── Image_Path.csv               # Image path references\n│   ├── test_data.csv                #\
  \ Test data (example)\n│   └── train_data.csv               # Training data (example)\n│\n├── Image/\n\
  │   ├── Progress/                    # Progressing images (pre- and post-RT, and augmented versions)\n\
  │   └── Stable/                      # Stable disease images (pre- and post-RT, and augmented versions)\n\
  │\n├── Model/\n│   ├── _utils_siamese.ipynb         # Utility functions for the Siamese network\n│ \
  \  ├── DL_features.ipynb            # Deep feature extraction notebook\n│   ├── final_epoch_fold4_model.h5\
  \   # Pretrained model weights\n│   ├── GradCAM.ipynb                # Grad-CAM visualization for model\
  \ explainability\n│   ├── Metrics.ipynb                # Evaluation metrics\n│   ├── Preprocessing.ipynb\
  \          # Image preprocessing steps \n│   └── Train.ipynb                  # Training notebook for\
  \ STRANet model\n│\n└── environment.yml                  # Conda environment configuration\n```\n\n\
  ---\n\n## How to Use STRANet\n\n### 1. **Model Training**\n\nTo train the model, open and run **`Model/Train.ipynb`**.\
  \  \nBoth STRANet (two time points: pre-RT and post-RT) and STRANet-Lite (single time point with pseudo-temporal\
  \ augmentation, e.g., Pre & Pseudo_Pre or Post & Pseudo_Post) share the same training code — the difference\
  \ lies in input configuration.\n\n### 2. **Model Evaluation**\n\nTo evaluate model performance:\n\n\
  ```bash\n# Run within Jupyter\nModel/Metrics.ipynb\n```\n\nKey metrics include:\n- AUROC (Area Under\
  \ ROC Curve)  \n- AUPRC (Area Under Precision-Recall Curve)\n\n### 3. **Visualization**\n\nFor model\
  \ interpretability, visualize Grad-CAM attention heatmaps by running:\n\n```bash\nModel/GradCAM.ipynb\n\
  ```\n\n### 4. **Feature Extraction and Preprocessing**\n\nData preprocessing and deep feature extraction\
  \ are implemented in:\n- **`Model/Preprocessing.ipynb`**\n- **`Model/DL_features.ipynb`**\n\nExample\
  \ training and test datasets are provided in the `Data` folder, while sample CT images are available\
  \ under `Image/Progress` and `Image/Stable`.\n\n---\n\n## License\n\nThis project is licensed under\
  \ the **MIT License** — see the [LICENSE](LICENSE) file for details.\n\n---\n"

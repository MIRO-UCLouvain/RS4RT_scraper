readme_excerpt: '# ModeT Image Registration – Loss Function Experiments


  This repository contains experiments with multiple loss functions for **3D medical image registration**
  using the **ModeT** image registration framework.


  The goal of this project is to evaluate how different similarity, regularization, and consistency losses
  affect deformation quality and alignment performance.


  ---


  ## Overview


  Image registration aligns a moving image to a fixed image through a learned deformation field. Training
  quality heavily depends on the choice of loss functions.


  This repository provides implementations and testing of several commonly used and experimental losses,
  including:


  - Image similarity losses

  - Deformation smoothness penalties

  - Inverse-consistency constraints

  - Patch-wise regularization

  - Region-wise segmentation losses

  - Contrastive losses


  The implementations are written in **PyTorch** and are designed for **3D volumetric data**.


  ---


  ## Implemented Loss Functions


  ### Similarity Losses

  - **NCC (Normalized Cross-Correlation)** – Local similarity metric commonly used in medical registration.

  - **Mutual Information (Differentiable)** – Suitable for multi-modal registration.

  - **SSIM Loss** – Structural similarity preservation.


  ### Regularization Losses

  - **Gradient Loss (Grad3D)** – Encourages smooth deformation fields.

  - **Patchwise Regularization** – Penalizes inconsistencies outside removed patches.


  ### Consistency Losses

  - **Gradient Inverse Consistency Loss** – Enforces consistency between forward and inverse deformation
  fields.


  ### Segmentation-Based Loss

  - **Regionwise Dice Loss** – Penalizes regions where alignment degrades compared to baseline.


  ### Contrastive Loss

  - **NCE Loss** – Used for embedding-level contrastive learning.


  ---



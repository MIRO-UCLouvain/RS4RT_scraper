readme_excerpt: "You can change the source position, image resolution, detector resolution, and voxel\
  \ dimensions in ParamSetting.\nRun through 'refinemultiplebbs.m' for source position calculation and\
  \ detector deviation calculation. You can also change the BBs positions. \nReference: Kyungsang Kim\
  \ (2024). 3D Cone beam CT (CBCT) projection backprojection FDK, iterative reconstruction Matlab examples\
  \ (https://www.mathworks.com/matlabcentral/fileexchange/35548-3d-cone-beam-ct-cbct-projection-backprojection-fdk-iterative-reconstruction-matlab-examples),\
  \ MATLAB Central File Exchange. Retrieved June 23, 2024.\n"

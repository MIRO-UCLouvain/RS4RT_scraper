readme_excerpt: "# 40Hz Gamma Light Stimulation Analysis\n\nThis repository contains the complete statistical\
  \ analysis pipeline for evaluating whether \n40 Hz gamma-frequency light stimulation alters:\n\n- Circadian\
  \ rhythms (RA, IV, IS, Amplitude, MESOR, Mean)\n- Barnes Maze spatial learning and memory (latency learning\
  \ curve, distance, errors, quadrant bias)\n\nThe analysis includes:\n- Mixed-effects linear models (LMM)\n\
  - Gamma/Negative Binomial GLMM where appropriate\n- Circular statistics for circadian phase\n- FDR-corrected\
  \ hypothesis testing\n- Diagnostic plots\n- Effect size estimation\n\n## Project Structure\n40Hz-Gamma-Analysis/\n\
  │\n├── README.md\n├── requirements.txt\n├── analysis.py\n│\n├── src/\n│   ├── clarify_questions.md\n\
  │   ├── models_circadian.py\n│   ├── models_barnes.py\n│   ├── utils.py\n│\n├── data/\n│   ├── circadian.csv\n\
  │   ├── barnes.csv\n│\n├── figures/\n└── results/\n\n\n\n"

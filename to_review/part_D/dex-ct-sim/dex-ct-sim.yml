readme_excerpt: "# dex-ct-sim\nDual-energy CT raytracing simulator with basis material decomposition.\n\
  These scripts are for:\n1. Generating single-energy CT sinograms using Siddons raytracing\n2. Reconstructing\
  \ CT images using fan-beam filtered back-projection\n3. Generating dual-energy CT basis material sinograms\
  \ using Gauss-Newton\n   decomposition and reconstructing basis material images using FFBP.\n\n\n\n\
  ## main.py\nMain file for running the dual-energy CT simulation. There are three classes \nof parameters\
  \ that must be defined by the user:\n- ScannerGeometry: the CT imaging geometry. Include the number\
  \ of channels, projections, fan angle, source-isocenter-distance (SID), source-detector-distance (SDD),\
  \ and pixel shape.\n- Phantom: the voxelized object to be imaged. Include the phantom filename, phantom\
  \ name, atomic composition filename, and number/size [cm] of pixels in x, y, z directions.\n- Spectrum:\
  \ the polyenergetic x-ray spectrum for a single-energy CT acquisition. Include the filename and target\
  \ dose [Gy].\n\nIn addition, three image reconstruction parameters should be assigned:\n- N_matrix:\
  \ reconstructed image matrix size\n- FOV: reconstructed field-of-view [cm]\n- ramp: reconstruction filter\
  \ cutoff percentage of Nyquist frequency\n\n\n## system.py\nDefinitions of the three classes to set\
  \ up each simulation. \n\n## forward_project.py\nFunctions for forward projecting through the phantom\
  \ to create a sinogram. Utilizes Siddon's algorithm.<sup>1</sup>\n\n## back_project.py\nFunctions for\
  \ back projecting a sinogram to create a reconstructed image. Utilizes fan-beam filtered back projection\
  \ with a sinc window filter.\n\n## matdecomp.py\nFunctions for performing basis material decomposition\
  \ using two sinograms acquired with different polychromatic x-ray spectra. Utilizes a Gauss-Newton algorithm.<sup>2</sup>\n\
  \n## plots.py\nScript used to generate plots to analyze data output from main.\n\n  \n  \n<sup>1</sup>Siddon,\
  \ Robert L. \"Fast calculation of the exact radiological path for a three‐dimensional CT array.\" Medical\
  \ physics 12, no. 2 (1985): 252-255.\n\n<sup>2</sup>D. Rigie and P. J. La Riviere, “An efficient spectral\
  \ CT material decomposition method using the Gauss–Newton algorithm,” Proc. 2015 IEEE Medical Imaging\
  \ Conference (2015).\n"

readme_excerpt: "# multiple-myeloma-radiomics\nAutomated MRI texture analysis pipeline for Multiple Myeloma\
  \ bone marrow profiling.\nProject Overview\nOncoMap E3 is an automated bioinformatics pipeline designed\
  \ to quantify bone marrow heterogeneity in Multiple Myeloma (MM) patients. Using T1-weighted MRI data\
  \ from the Cancer Moonshot Biobank (CMB-MML), this project implements a \"Virtual Biopsy\" framework\
  \ to detect high-risk medullary phenotypes through non-invasive texture analysis.\n\n Methodology &\
  \ Tech Stack\nThe pipeline utilizes Gray-Level Co-occurrence Matrix (GLCM) algorithms to extract spatial\
  \ relationship features from DICOM imaging data.\n\nData Acquisition: Automated retrieval via tcia_utils\
  \ (NBIA API).\n\nImage Processing: pydicom for metadata handling and scikit-image for feature extraction.\n\
  \nFeature Set:  Dissimilarity: Measures local intensity variation (Tumor Heterogeneity).\n\nHomogeneity:\
  \ Measures structural uniformity (Marrow Integrity).\n\nEnergy & Correlation: Signal intensity distribution\
  \ and linear dependency.\nKey Results (17-Patient Cohort)\nOur analysis successfully mapped the radiomic\
  \ \"fingerprint\" of 17 patients, identifying significant outliers with aggressive textural signatures.\n\
  \nThe \"Chaos Score\" Discovery\nWe developed a composite Chaos Score to identify patients with extreme\
  \ medullary disruption.\n\nTop 3 Outliers: MSB-04950, MSB-01865, and MSB-04031.\n\nClinical Significance:\
  \ These patients exhibited a >70% increase in textural dissimilarity compared to the cohort mean, indicating\
  \ advanced tumor infiltration.\n"

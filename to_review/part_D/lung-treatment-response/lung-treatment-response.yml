readme_excerpt: "# Lung Treatment response\n\n(TODO: ADD icon of publication)\n\n(TODO: ADD publication\
  \ title)\n\nMachine learning models to investigate lung cancer response after SBRT (radiotherapy treatment).\
  \ \n\nWe use clinical, dosimetrc and radiomics data to predict overal survival of patients with either\
  \ primary or secondary lung tumors.\n\n(TODO: ADD citation here)\n\n## Installation\n\nCreate a new\
  \ environment, activate it and install the requirements\n\n```console\nconda create -n venv_lung_response\
  \ python=3.10\nconda activate venv_lung_response\npip install -r requirements.txt\n``` \n\n## Code\n\
  \nThe code is divided in two folders: \n- `data`: here we perform data preprocessing, dataset merging\
  \ and dataset statistics.\n- `model_training`: here we perform model training and evaluation for OS\
  \ on different data splits. \n\n## How to use it?\n\nAfter doing the steps in installation section (section\
  \ 1) and downloading the model from the latest [release](https://github.com/plbenveniste/lung-treatment-response/releases),\
  \ you can run an inference using the file [predict_OS_primitive.py](./predict_OS_primitive.py) or [predict_OS_secondary.py](./predict_OS_secondary.py)."

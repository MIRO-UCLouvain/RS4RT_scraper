readme_excerpt: "# \U0001F3A8 Letter Lab\n\n**Letter Lab** is a customizable, standalone web game designed\
  \ to help kids master phonics. Unlike standard educational apps, Letter Lab lets parents and teachers\
  \ record their **own voices** for every letter and number, ensuring the child learns with familiar sounds\
  \ and specific regional pronunciations.\n\n---\n\n## ✨ Features\n\n- **\U0001F399️ Personalized Phonics**:\
  \ Record yourself saying \"buh\", \"duh\", \"puh\", etc. Kids learn faster with a voice they know!\n\
  - **\U0001F521 Full Alphabet & Numbers**: Support for all letters (a-z) and numbers (0-9).\n- **\U0001F4BE\
  \ Persistent Memory**: Your recordings are saved locally in your browser using IndexedDB. Close the\
  \ tab, come back later, and your sounds are still there.\n- **\U0001F3AF Focus Mode**: Use the \"In\
  \ Game\" checkboxes to pick exactly which characters your child needs to practice.\n- **\U0001F4F1 iPad\
  \ & Mobile Ready**: Optimized for touchscreens with large buttons and no accidental zooming or scrolling.\n\
  - **\U0001F313 Dark Mode**: Easy on the eyes for evening practice.\n- **\U0001F389 Rewards**: A fun\
  \ star-explosion animation and a synthesized \"Tada!\" fanfare for every 10 correct answers.\n\n---\n\
  \n## \U0001F680 How to Use\n\n1.  **Open the App**: Simply open `index.html` in any modern web browser\
  \ (Safari, Chrome, etc.).\n2.  **Grant Permissions**: Allow microphone access when prompted.\n3.  **Setup\
  \ Sounds**:\n    -   Find a letter in the grid.\n    -   Click the **Microphone (\U0001F399️)** icon\
  \ to start recording.\n    -   Say the phonic sound clearly.\n    -   Click the **Stop (⏹️)** icon to\
  \ finish.\n    -   Use the **Play (▶️)** button to check your work.\n4.  **Choose Your Pool**: Check\
  \ the **\"In Game\"** box for the letters you want to include in the current session.\n5.  **Start the\
  \ Game**: Click the big **\"Start Game\"** button in the sticky header.\n6.  **Play!**: The app will\
  \ play a sound, and your child taps the matching character.\n\n---\n\n## \U0001F6E0️ Technical Highlights\n\
  \n- **Zero Dependencies**: Pure Vanilla JS, HTML, and CSS. No libraries, no frameworks, no bloat.\n\
  - **Web Audio API**: Generates procedural sound effects on-the-fly.\n- **IndexedDB**: Professional-grade\
  \ browser storage for audio Blobs and settings.\n- **Dynamic UI**: Uses modern CSS (`clamp`, `dvh`,\
  \ `flexbox`) for a perfect fit on MacBook, iPad, and iPhone.\n\n---\n\n## \U0001F4DC License\n\nThis\
  \ project is open-source and free to use for educational purposes.\n\n---\n\n*Made with ❤️ for the next\
  \ generation of readers.*\n"

readme_excerpt: "Dose Accumulation\n-----------------\n\nRadiotherapy dose accumulation for interfraction\
  \ images using deformable image registration. This is an automatic tool that accumulate doses using\
  \ ANTs or Elastix.\n\nDesing\n------\n\nThis is a collection of bash and python scripts.\n\n\nDependencies\n\
  ------------\n\nPython:\n* SimpleITK >= 2.0\n\nExternal:\n* ANTs [webpage](http://stnava.github.io/ANTs/)\\\
  \nNote: You require to have ANTs installed in your system with working binary commands 'antsRegistrationSyN'\
  \ and 'antsApplyTransforms'.\n* Elastix [webpage](https://elastix.lumc.nl/)\\\nNote: You require to\
  \ have elastix installed in your system with working binary commands 'elastix' and 'transformix'.\n\
  ---\n\nRun\n----------\n\nTo run a dose accumulation you require a set of images with the corresponding\
  \ dose images. Supported image formats: nii, nrrd, mhd, or any single file format compatible with ITK.\
  \ Create a folder tree structure like the following:\n\n```bash\ninput/\n├── patient01/\n│   ├── doses/\n\
  │   │   ├── patient01_dose00.nii  (total dose plan)\n│   │   ├── patient01_dose01.nii  (treatment dose,\
  \ fraction 1) \n│   │   ├── patient01_dose02.nii\n│   │   └── patient01_dose03.nii\n│   └── fractions/\n\
  │       ├── patient01_fraction00.nii (baseline or plan image)\n│       ├── patient01_fraction01.nii\
  \ (treatment image, fraction 1)\n│       ├── patient01_fraction02.nii\n│       └── patient01_fraction03.nii\n\
  ├── patient02/\n│   ├── doses\n│   │   ├── patient02_dose00.nii\n│   │   ├── patient02_dose01.nii\n\
  │   │   ├── patient02_dose02.nii\n│   │   └── patient02_dose03.nii\n│   └── fractions\n│       ├── patient02_fraction00.nii\n\
  │       ├── patient02_fraction01.nii\n│       ├── patient02_fraction02.nii\n│       └── patient02_fraction03.nii\n\
  ...\n\n```\n\nThen run the command\n```bash\n./dose-accumulation.sh -i path/input/ -o path/output/ -m\
  \ [affine|ants|elastix]\n```\n\nCitation\n--------\n\nTo cite when using this toolbox, please reference,\
  \ as appropriate:\\\n@inproceedings{2021dose,\\\n  title={Dose Accumulation in online MR-guided treatment\
  \ of Prostate},\\\n  author={},\\\n  booktitle={},\\\n  pages={},\\\n  year={2021},\\\n  organization={}\\\
  \n}"

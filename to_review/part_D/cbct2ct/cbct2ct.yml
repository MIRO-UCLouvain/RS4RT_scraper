readme_excerpt: '# cbct2ct


  3D Pix2Pix (cGAN) for CBCT → CT.


  ## Setup


  ```bash

  pip install -r requirements.txt

  ```


  ## Train


  ```bash

  # Default: configs/base.yaml + configs/pix2pix.yaml

  python train.py


  # Optional single config

  python train.py --config config.yaml

  ```


  Data is expected as paired `.npy` under `data.train_root` (`cbct/` / `ct/`).

  See `configs/base.yaml` for paths and hyperparameters.

  '

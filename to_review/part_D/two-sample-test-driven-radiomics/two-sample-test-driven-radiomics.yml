readme_excerpt: "# Two-Sample-Test-Driven-Radiomics\n\nThe work statistically analyses the brain MRI derived\
  \ radiomics data.Five statistical tests are used to analyse the data.\n\n\U0001F4DD <h3>  **Key Features**\
  \ </h3>\n \n\n✅ Features of the work include rigorous analysis of the radiomic features extracted. \
  \  \n✅Three distinct datasets were used for the detailed radiomic analysis in the study.   \n✅ Novel\
  \ approach of radiomic analysis\n\n\U0001F527 <h3> **Instructions to Run the Code**</h3>\n\n✅Download\
  \ datasets for Alzheimer's and Mild Cognitive Impairment from ADNI website (https://adni.loni.usc.edu/),\
  \ and BraTS 2019 dataset from kaggle(https://www.kaggle.com/datasets/aryashah2k/brain-tumor-egmentation-brats-2019).\
  \  \n✅Use PyTorch platform and compatible Python version.  \n✅Use Pyradiomics toolbox V3.1.0.  \n✅Radiomics\
  \ features are be extracted from each datasets.  \n✅The radiomic data is stored as .csv files and this\
  \ data is used for further processing.\n\n\U0001F5BC️<h3> **Sample Images**</h3>\n\n\n![samle_images1\
  \ drawio](https://github.com/user-attachments/assets/0d16c6b5-3c38-435e-af0f-c21717edabc2)\n"

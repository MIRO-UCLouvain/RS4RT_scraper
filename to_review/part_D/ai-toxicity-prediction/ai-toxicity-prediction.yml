readme_excerpt: '# ai-toxicity-prediction

  In this project, machine learning is used to train a logistic regression model that classifies molecules
  as toxic or non-toxic. The model’s predictions are then analyzed to evaluate its performance and improved
  by balancing the data.


  ### Assay List TOX21_p53_BLA_p2_ch2-2025-02-11.csv

  This file contains a dataset of molecules that have been tested for toxicity using high-throughput screening
  methods. It includes assay results from the Tox21 project, specifically for a p53 beta-lactamase reporter
  gene assay (taken from plate 2, channel 2). I used this dataset to conduct my machine learning analysis.


  ### CCD-Batch-Search_2025-02-11_01_16_35.sdf

  This file contains a link to the SMILES data of molecules from the TOX21_p53_BLA_p2_ch2-2025-02-11.csv
  dataset. SMILES are a textual representation of molecular structures, which are important for predicting
  the toxicity of molecules.


  ### project.ipynb

  This project file contains a machine learning classification model, along with predictions, analysis,
  and data improvements. The analysis included standardization of SMILES, removal of NaN values, and transformation
  into Kekulé structures. The predictions involved selecting descriptors to assess toxicity, separating
  the dataset into training and testing subsets, training a logistic regression model, and creating a
  confusion matrix. To enhance the model, accuracy checks were conducted and data balancing techniques
  were implemented to obtain a more credible representation of the results.

  '

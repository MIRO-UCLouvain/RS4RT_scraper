readme_excerpt: "# \U0001F9E0 Brain Tumor Segmentation Using 3D U-Net in TensorFlow - Project7\n\n<p align=\"\
  center\">\n\n![Python](https://img.shields.io/badge/Python-3.10-blue.svg)\n![TensorFlow](https://img.shields.io/badge/TensorFlow-2.x-orange.svg)\n\
  ![Keras](https://img.shields.io/badge/Keras-DeepLearning-red.svg)\n![Medical Imaging](https://img.shields.io/badge/Medical-Imaging-success.svg)\n\
  ![MRI](https://img.shields.io/badge/MRI-BraTS-blueviolet.svg)\n![3D U-Net](https://img.shields.io/badge/Model-3D_U--Net-green.svg)\n\
  ![License](https://img.shields.io/badge/License-MIT-yellow.svg)\n\n</p>\n\n---\n\n# Brain Tumor Segmentation\
  \ Using 3D U-Net\n\nAn end-to-end Deep Learning pipeline for automatic **Brain Tumor Segmentation**\
  \ from multi-modal MRI volumes using a **3D U-Net architecture** implemented with **TensorFlow** and\
  \ **Keras**.\n\nThe project performs volumetric semantic segmentation by learning spatial features directly\
  \ from three-dimensional MRI scans. Unlike traditional slice-based methods, the proposed framework captures\
  \ contextual information across neighboring slices, resulting in more accurate tumor localization and\
  \ boundary delineation.\n\nThe entire workflow includes:\n\n- Medical image preprocessing\n- MRI normalization\n\
  - Patch extraction\n- Data preparation\n- 3D U-Net training\n- Tumor prediction\n- Quantitative evaluation\n\
  - Visualization of segmentation results\n\n---\n\n# Table of Contents\n\n- Overview\n- Features\n- Dataset\n\
  - MRI Modalities\n- Project Workflow\n- Data Preprocessing\n- Patch Extraction\n- Model Architecture\n\
  - Loss Function\n- Evaluation Metrics\n- Training\n- Inference\n- Results\n- Project Structure\n- Installation\n\
  - Usage\n- Technologies\n- Future Improvements\n- References\n\n---\n\n# Project Overview\n\nBrain tumor\
  \ segmentation is one of the most challenging problems in medical image analysis. Accurate delineation\
  \ of tumor regions plays an essential role in:\n\n- Clinical diagnosis\n- Surgical planning\n- Radiotherapy\n\
  - Disease monitoring\n- Survival prediction\n\nManual segmentation performed by radiologists is both\
  \ time-consuming and subject to inter-observer variability.\n\nThis project introduces a fully automated\
  \ segmentation pipeline based on a **3D U-Net** architecture capable of learning volumetric representations\
  \ directly from MRI scans.\n\nThe model predicts voxel-wise segmentation masks while preserving spatial\
  \ continuity across the entire brain volume.\n\n---\n\n# Features\n\n✅ Automatic Brain Tumor Segmentation\n\
  \n✅ 3D U-Net Architecture\n\n✅ TensorFlow/Keras Implementation\n\n✅ Multi-modal MRI Processing\n\n✅\
  \ Patch-based Training\n\n✅ MRI Volume Normalization\n\n✅ Dice Loss Optimization\n\n✅ GPU Training Support\n\
  \n✅ Visualization of Predictions\n\n✅ Modular Code Structure\n\n✅ Easy Model Training\n\n✅ Easy Model\
  \ Inference\n\n---\n\n# Dataset\n\nThe project uses the **Brain Tumor Segmentation (BraTS)** dataset.\n\
  \nBraTS is one of the most widely used benchmark datasets for brain tumor segmentation and consists\
  \ of multi-modal MRI scans acquired from patients diagnosed with gliomas.\n\nEach patient contains four\
  \ MRI modalities together with manually annotated ground-truth masks.\n\nDataset characteristics include:\n\
  \n- High-grade gliomas (HGG)\n- Low-grade gliomas (LGG)\n- Expert manual annotations\n- 3D MRI volumes\n\
  - Multi-modal imaging\n- Standardized benchmark\n\n---\n\n# MRI Modalities\n\nEach patient contains\
  \ four MRI modalities.\n\n| Modality | Description |\n|----------|-------------|\n| T1 | Anatomical\
  \ information |\n| T1Gd | Contrast-enhanced T1-weighted MRI |\n| T2 | Fluid-sensitive anatomical information\
  \ |\n| FLAIR | Highlights edema and lesions |\n\nEach modality provides complementary information about\
  \ tumor appearance.\n\nThe model combines all four modalities to improve segmentation performance.\n\
  \n---\n\n# Project Workflow\n\nThe implementation follows a complete end-to-end pipeline for volumetric\
  \ brain tumor segmentation using multi-modal MRI data from the BraTS dataset. The workflow begins with\
  \ loading NIfTI MRI volumes, continues through preprocessing and patch extraction, trains a customized\
  \ 3D U-Net model, and finally performs voxel-wise prediction and visualization.\n\n```text\nBraTS Dataset\
  \ (.nii.gz)\n        │\n        ▼\nLoad MRI Volumes using NiBabel\n        │\n        ▼\nLoad Segmentation\
  \ Masks\n        │\n        ▼\nCrop MRI Volume\n        │\n        ▼\nSlice Standardization\n      \
  \  │\n        ▼\n3D Patch Extraction\n        │\n        ▼\nRemove Empty Patches\n        │\n      \
  \  ▼\nStore Patches in HDF5\n        │\n        ▼\nData Generator (Keras Sequence)\n        │\n    \
  \    ▼\n3D U-Net Training\n        │\n        ▼\nSoft Dice Loss Optimization\n        │\n        ▼\n\
  Prediction\n        │\n        ▼\nDice Evaluation\n        │\n        ▼\nVisualization\n```\n\n---\n\
  \n# Dataset\n\nThis project is developed using the **Brain Tumor Segmentation (BraTS)** challenge dataset.\n\
  \nEach subject consists of four co-registered MRI modalities together with voxel-level expert annotations.\n\
  \n### MRI Volume Size\n\n```python\n(240, 240, 155, 4)\n```\n\nwhere\n\n- Height = 240\n- Width = 240\n\
  - Depth = 155 slices\n- Channels = 4 MRI modalities\n\nThe segmentation labels are stored separately\
  \ as 3D NIfTI volumes.\n\nThe dataset is loaded directly from compressed **.nii.gz** files using **NiBabel**,\
  \ allowing efficient handling of volumetric medical images without prior conversion.\n\n---\n\n# MRI\
  \ Modalities\n\nEach patient contains four MRI sequences that provide complementary anatomical and pathological\
  \ information.\n\n| Modality | Description |\n|----------|-------------|\n| T1 | Native T1-weighted\
  \ MRI |\n| T1CE | Contrast-enhanced T1-weighted MRI |\n| T2 | T2-weighted MRI |\n| FLAIR | Fluid Attenuated\
  \ Inversion Recovery |\n\nInstead of training on a single modality, the model stacks all four modalities\
  \ into one volumetric tensor, enabling the network to learn richer contextual representations.\n\nInput\
  \ tensor:\n\n```python\n(H, W, D, 4)\n```\n\n---\n\n# Data Loading\n\nMRI volumes are loaded using the\
  \ **NiBabel** library.\n\nEach patient's directory contains\n\n```\nPatientID_flair.nii.gz\nPatientID_t1.nii.gz\n\
  PatientID_t1ce.nii.gz\nPatientID_t2.nii.gz\nPatientID_seg.nii.gz\n```\n\nThe implementation reads each\
  \ modality individually before stacking them into a single four-channel volume.\n\nGround-truth masks\
  \ are loaded independently and converted into training labels.\n\n---\n\n# Image Standardization\n\n\
  MRI intensity distributions vary significantly across patients and scanners.\n\nTo improve training\
  \ stability, every MRI slice is standardized independently.\n\nThe preprocessing function performs\n\
  \n- Mean subtraction\n- Standard deviation normalization\n\nResult:\n\n```\nMean = 0\n\nStandard Deviation\
  \ = 1\n```\n\nThis normalization significantly accelerates convergence and improves model robustness.\n\
  \n---\n\n# Cropping Strategy\n\nTraining directly on the original MRI size\n\n```\n240 × 240 × 155\n\
  ```\n\nrequires excessive GPU memory.\n\nTherefore, the implementation crops and extracts smaller regions\
  \ before training.\n\nThis reduces computational cost while preserving diagnostically relevant regions.\n\
  \n---\n\n# Patch Extraction\n\nInstead of feeding the complete MRI volume into the network, the project\
  \ extracts fixed-size volumetric patches.\n\nPatch size used in this implementation:\n\n```python\n\
  160 × 160 × 16\n```\n\nThe corresponding model input shape becomes\n\n```python\n(160,160,16,4)\n```\n\
  \nPatch-based learning provides several benefits.\n\n- Lower GPU memory consumption\n- Faster training\n\
  - More training samples\n- Improved local feature learning\n- Better handling of large 3D MRI volumes\n\
  \n---\n\n# Background Removal\n\nMost MRI patches contain only healthy tissue.\n\nTraining on these\
  \ patches would introduce severe class imbalance.\n\nTo address this issue, the preprocessing pipeline\
  \ removes patches containing excessive background.\n\nOnly patches containing at least\n\n```\n5%\n\
  ```\n\nnon-background voxels are retained.\n\nEquivalently,\n\n```\n95%\n```\n\nbackground-only patches\
  \ are discarded.\n\nThis strategy substantially improves learning efficiency and increases the frequency\
  \ of tumor-containing samples.\n\n---\n\n# Label Encoding\n\nThe segmentation masks contain four semantic\
  \ classes.\n\n| Label | Region |\n|-------|--------|\n| 0 | Background |\n| 1 | Necrotic and Non-Enhancing\
  \ Tumor Core |\n| 2 | Peritumoral Edema |\n| 4 | Enhancing Tumor |\n\nBefore training, the labels are\
  \ converted into a machine-learning-friendly representation suitable for multi-class semantic segmentation.\n\
  \n---\n\n# Patch Storage\n\nGenerating patches directly from NIfTI files during every training iteration\
  \ is computationally expensive.\n\nTo improve training speed, extracted patches are serialized and stored\
  \ using the **HDF5** file format.\n\nAdvantages include\n\n- Faster disk access\n- Reduced preprocessing\
  \ time\n- Efficient random sampling\n- Lower RAM usage\n- Improved scalability for large datasets\n\n\
  The implementation uses the **h5py** library to read and write volumetric training samples.\n\n---\n\
  \n# Data Generator\n\nThe project implements a custom generator based on **Keras Sequence**.\n\nInstead\
  \ of loading the entire dataset into memory, batches are generated dynamically during training.\n\n\
  This design provides\n\n- Memory efficiency\n- Large dataset support\n- Automatic batch generation\n\
  - Parallel data loading\n- Seamless TensorFlow integration\n\nEach generated batch contains\n\n- Four\
  \ MRI modalities\n- Corresponding segmentation masks\n- Fixed-size 3D patches\n\nmaking the pipeline\
  \ scalable for volumetric deep learning.\n\n---\n\n# 3D U-Net Architecture\n\nThe core of this project\
  \ is a customized **3D U-Net** implemented in TensorFlow/Keras for volumetric semantic segmentation\
  \ of brain tumors from multi-modal MRI data.\n\nUnlike conventional 2D convolutional networks, the model\
  \ processes three-dimensional image patches, allowing it to learn contextual information across adjacent\
  \ MRI slices and preserve volumetric anatomical structures.\n\nThe architecture follows the classic\
  \ encoder-decoder design with symmetric skip connections that recover fine spatial details lost during\
  \ downsampling.\n\n```text\nInput Volume\n(160×160×16×4)\n        │\n        ▼\nEncoder Block 1\n32\
  \ Filters\n        │\nMaxPooling3D\n        ▼\nEncoder Block 2\n64 Filters\n        │\nMaxPooling3D\n\
  \        ▼\nEncoder Block 3\n128 Filters\n        │\nMaxPooling3D\n        ▼\nEncoder Block 4\n256 Filters\n\
  \        │\nMaxPooling3D\n        ▼\nBottleneck\n512 Filters\n        │\n        ▼\nDecoder Block 4\n\
  256 Filters\n        │\nSkip Connection\n        ▼\nDecoder Block 3\n128 Filters\n        │\nSkip Connection\n\
  \        ▼\nDecoder Block 2\n64 Filters\n        │\nSkip Connection\n        ▼\nDecoder Block 1\n32\
  \ Filters\n        │\nConv3D (1×1×1)\n        ▼\nSoftmax\n        │\nPredicted Segmentation\n```\n\n\
  The implementation employs **four encoder stages**, a bottleneck layer, and **four decoder stages**,\
  \ following the original U-Net design while extending all operations into three spatial dimensions.\n\
  \n---\n\n# Encoder\n\nThe encoder progressively extracts increasingly abstract volumetric features from\
  \ the MRI patches.\n\nEach encoder block consists of:\n\n- Conv3D\n- ReLU activation\n- Conv3D\n- ReLU\
  \ activation\n- MaxPooling3D\n\nThe number of feature maps doubles after every pooling operation.\n\n\
  | Encoder Level | Number of Filters |\n|---------------|------------------|\n| Level 1 | 32 |\n| Level\
  \ 2 | 64 |\n| Level 3 | 128 |\n| Level 4 | 256 |\n\nThis hierarchical feature extraction enables the\
  \ network to capture both local texture information and global anatomical context.\n\n---\n\n# Bottleneck\n\
  \nThe bottleneck represents the deepest level of the network.\n\nIt contains **512 feature maps**, enabling\
  \ the model to encode rich semantic representations before reconstruction begins.\n\nThis layer integrates\
  \ contextual information from the entire receptive field of each volumetric patch.\n\n---\n\n# Decoder\n\
  \nThe decoder reconstructs the segmentation map while gradually restoring spatial resolution.\n\nEach\
  \ decoder stage performs:\n\n- UpSampling3D / Conv3DTranspose\n- Feature concatenation\n- Conv3D\n-\
  \ ReLU\n- Conv3D\n- ReLU\n\nThe number of feature maps decreases symmetrically:\n\n| Decoder Level |\
  \ Number of Filters |\n|---------------|------------------|\n| Level 4 | 256 |\n| Level 3 | 128 |\n\
  | Level 2 | 64 |\n| Level 1 | 32 |\n\n---\n\n# Skip "

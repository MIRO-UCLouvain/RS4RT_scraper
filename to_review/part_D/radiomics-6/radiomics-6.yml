readme_excerpt: "# \U0001F9EC Radiomics6 – Metastasis Prediction from CT and PET Imaging\n\nWelcome to\
  \ **Radiomics6**, a multi-stage radiomics pipeline for segmenting PET/CT images, extracting radiomic\
  \ features, and training ML models to predict metastasis in cancer patients.\n\nThis project is part\
  \ of the **Radiomics 6** initiative, leveraging open-source tools and public imaging datasets.\n\n---\n\
  \n## \U0001F9EA Project Overview\n\n### \U0001F3AF Goal:\nPredict metastasis status using radiomic features\
  \ extracted from CT and PET scans.\n\n### \U0001F4CA Pipeline Steps:\n\n1. **\U0001F4E5 Data Collection**\
  \  \n   - Dataset: [LUNG-PET-CT-DX (TCIA)](https://www.cancerimagingarchive.net/collections/lung-pet-ct-dx)\
  \  \n   - Includes whole-body CT and PET-CT scans + metadata\n\n2. **\U0001F9E0 Segmentation + Feature\
  \ Extraction**  \n   - Tools: `MedSAM`, `PyRadiomics`  \n   - CT-only (all patients)  \n   - PET+CT\
  \ subset (73 patients)\n\n3. **\U0001F4C8 Feature Analysis + Modeling**  \n   - PCA for dimensionality\
  \ reduction  \n   - p-value feature selection  \n   - ML Models: Logistic Regression, SVM, Random Forest,\
  \ XGBoost, etc.\n\n---\n\n## \U0001F9E9 Branch Structure\n\n| Branch | Description |\n|--------|-------------|\n\
  | [`1.-Data`](../../tree/1.-Data) | Dataset source and folder structure for LUNG-PET-CT-DX |\n| [`2.-Segmentation-and-feature-extraction`](../../tree/2.-Segmentation-and-feature-extraction)\
  \ | Scripts for segmentation (MedSAM) and radiomic feature extraction (PyRadiomics) |\n| [`3.-Classification-models-and-evaluation`](../../tree/3.-Classification-models-and-evaluation)\
  \ | Correlation analysis, p-value computation, and ML model training and evaluation |\n\n---\n\n## \U0001F9F0\
  \ Tools & Libraries\n\n- Python, PyRadiomics, OpenCV, SimpleITK  \n- MedSAM (segment-anything for medical\
  \ imaging)  \n- scikit-learn, imblearn (SMOTE), XGBoost  \n- MongoDB Atlas (optional)\n\n---\n\n## ⚙️\
  \ How to Run (across branches)\n\n1. Download data (instructions are in [`1.-Data`](../../tree/1.-Data))\n\
  2. Run segmentation (in [`2.-Segmentation-and-feature-extraction`](../../tree/2.-Segmentation-and-feature-extraction)\
  \ branch)\n3. Train models (in  [`3.-Classification-models-and-evaluation`](../../tree/3.-Classification-models-and-evaluation)\
  \ branch)\n\n##### Results are saved as .csv/.xlsx files per model\n\n### \U0001F4DA Citations\n\U0001F4C1\
  \ Dataset\nClark K, Vendt B, Smith K, et al. (2013)\nThe Cancer Imaging Archive (TCIA): Maintaining\
  \ and Operating a Public Information Repository\nJournal of Digital Imaging. 26(6):1045–1057.\nDOI:\
  \ 10.1007/s10278-013-9622-7\n\n\U0001F9E0 MedSAM\nWang, B., Li, Y., Liu, Y., et al. (2023).\nMedSAM:\
  \ Segment Anything in Medical Images\narXiv:2306.00652\n\U0001F517 https://arxiv.org/abs/2306.00652\n\
  \n---\n\n## \U0001F52E Future Work\n\nHere are some optional next steps for anyone continuing this project:\n\
  \n### 1. \U0001F9CD‍♂️ Organ Segmentation for Full-Body Analysis\nExtend segmentation beyond tumors\
  \ to include whole-body organs such as:\n- Liver\n- Kidneys\n- Spine  \nThis enables more holistic analysis\
  \ and cross-organ correlations using tools like **TotalSegmentator** or **MedSAM**.\n\n### 2. \U0001F9EC\
  \ Integrate Genomic Data\nCombine imaging features with genomic mutations to support multi-omics models.\
  \  \nRelevant genes may include: **p53**, **BRCA1/2**, **MET**.  \nThis enables correlation of phenotypic\
  \ imaging traits with genetic profiles and supports personalized medicine.\n\n### 3. \U0001F9E0 Explore\
  \ Multi-Modal Learning\nUse multiple data types to enhance model robustness:\n- Combine **PET**, **CT**,\
  \ **metadata**, and optionally **genomic data**\n- Apply advanced deep learning architectures that support\
  \ multimodal inputs, such as **transformers** or **late-fusion models**\n\n### 4. \U0001F9EA Work with\
  \ Foundation Models\nExperiment with foundation models like:\n- **MedSAM**\n- **Segment Anything (SAM)**\
  \  \nThese models support **zero-shot** or **few-shot** segmentation, reducing the need for large annotated\
  \ datasets and improving generalization.\n\n### 5. \U0001F4E6 Docker Container for Reproducibility\n\
  Package the entire pipeline—including:\n- Preprocessing  \n- Segmentation  \n- Feature extraction  \n\
  - Modeling  \n\ninto a **Docker container** to ensure full reproducibility and portability across environments\
  \ and collaborators.\n\n---\n\nFeel free to fork this repository and continue development \U0001F680\
  \n\n### \U0001F4EC Contact\nDeveloped by Keren Dai and Lisa Cohen\nFor questions, please open an issue\
  \ or contact directly.\n\n"

readme_excerpt: "# Low-dose 3D cone-beam CT (CBCT) reconstruction challenge\n\n## About\n  - Team member\
  \ names:\n    - Sasidhar Alavala (MS(R), IIT Tirupati, India)\n    - Dr. Subrahmanyam Gorthi (Asst.\
  \ Professor, IIT Tirupati, India)\n  - Abstract:\n    - Our approach integrates SwinIR-based sinogram\
  \ enhancement module, coupled with Nesterov Accelerated Gradient Descent (NAG) for solving the least\
  \ squares problem in CT image reconstruction. To address the challenge of excessive blurring during\
  \ reconstruction, a second phase of image processing is done. This involves using another SwinIR-based\
  \ CT enhancement module for enhancing features that may have been compromised in the reconstruction\
  \ process. The combination of sinogram enhancement and CT enhancement modules aims to provide a better\
  \ solution for low-dose and clinical-dose CBCT reconstruction, offering improved image clarity and fine\
  \ detail preservation.\n\n## Model Zoo\n\nPlease go to [MODEL HUB](https://drive.google.com/drive/folders/1VZyLtVW9JpTRaNqLXnzITJCXM7Qjjc1T?usp=sharing)\
  \ for model weights.\n\n## Usage\n\n### Install\n\nYou can use either the [conda environment file](conda_environment.yml)\
  \ to install dependencies or create a new environment and install the mentioned packages:\n\n- Creating\
  \ conda test enivronment with YML file:\n\n```bash\nconda env create -f conda_environment.yml\n```\n\
  \n- Creating conda test enivronment without YML file:\n\n```bash\nconda create -n test_env python==3.10.12\n\
  conda activate test_env\n```\nThen install `torch==2.1.0+cu121` `torchvision==0.16.0+cu121` `cudatoolkit=11.3.1`\
  \ `numpy==1.26.0` `timm==0.9.12` `astra-toolbox=2.1.2` `tomosipo==0.6.0` `ts-algorithms==0.1.0`\n\n\
  ### Data preparation\nThe data and model weights folder structure is as follows:\n  ```bash\n  $ tree\
  \ data\n  data\n  ├── sino_test_low\n  │   ├── 0901_sino_low_dose.npy\n  │   ├── 0902_sino_low_dose.npy\
  \   \n  │   └── ...\n  ├── sino_test_clinical\n  │   ├── 0901_sino_clinical_dose.npy\n  │   ├── 0902_sino_clinical_dose.npy\
  \   \n  │   └── ...\n  ├── ct_groundtruth\n  │   ├── 0901_clean_fdk_256.npy\n  │   ├── 0902_clean_fdk_256.npy\
  \   \n  │   └── ...\n  ├── ct_output_low\n  ├── ct_output_clinical\n  └── model_zoo\n      ├── low_sino_231.pth\n\
  \      ├── low_ct_117.pth\n      ├── clinical_sino_148.pth   \n      └── clinical_ct_186.pth\n \n  ```\n\
  ### Evaluation\nTo evaluate on the test dataset run:\n\n```bash\npython3 test_low.py\npython3 test_clinical.py\n\
  ```\n\n## References\n- Liang, J., Cao, J., Sun, G., Zhang, K., Van Gool, L., & Timofte, R. (2021).\
  \ Swinir: Image restoration using swin transformer. In Proceedings of the IEEE/CVF international conference\
  \ on computer vision (pp. 1833-1844).\n- Hendriksen, A. A., Schut, D., Palenstijn, W. J., Viganó, N.,\
  \ Kim, J., Pelt, D. M., ... & Batenburg, K. J. (2021). Tomosipo: fast, flexible, and convenient 3D tomography\
  \ for complex scanning geometries in Python. Optics Express, 29(24), 40494-40513.\n- Nesterov, Y. (2003).\
  \ Introductory lectures on convex optimization: A basic course (Vol. 87). Springer Science & Business\
  \ Media.\n\n## License and Acknowledgement\nThis work is made public under the MIT license. The codes\
  \ are based on [SwinIR](https://github.com/JingyunLiang/SwinIR) and [ts_algorithms](https://github.com/ahendriksen/ts_algorithms).\
  \ Please also follow their licenses. Thanks for their awesome works.\n\n"

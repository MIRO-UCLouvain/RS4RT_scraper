readme_excerpt: "# G4DARI (GEANT4 Dose And Radiation Interaction)\nInterface on MS Windows for GATE/GEANT4\
  \ dosimetry simulations using CT images.\n\n# **G4DARI** is a Windows interface for **GEANT4** designed\
  \ to facilitate **Monte Carlo dosimetry simulations**.  \nIt simplifies the use of GEANT4 for radiation\
  \ dosimetry applications on CT images, making simulation setup and data visualization easier. No programming\
  \ or coding is required. All interactions with the interface are performed via mouse clicks, selecting\
  \ parameters, or filling in tabs like number of events and particle energy.\n\n## Demonstration Video\n\
  Watch a short demonstration of G4DARI here: [(https://bntrk.ca/G4DARI-demo.mp4)](https://bntrk.ca/G4DARI-demo.mp4)\n\
  \n## Description\nG4DARI provides a user-friendly interface to interact with GEANT4, aimed at researchers\
  \ and students working in cancer, radiotherapy or radiation dosimetry.  \nIt supports:\n- Simulation\
  \ setup for various geometries\n- Dose calculation in different materials\n- Completed with results\
  \ analysis by Region of interest drawing and dose calculation\n\n## Files\n- G4DARI paper, peer reviewed\
  \ publication describing the interface: https://academic.oup.com/rpd/advance-article/doi/10.1093/rpd/ncag076/8748461\
  \ \n- G4DARI is archived on Zenodo: DOI: https://doi.org/10.5281/zenodo.21795406\n- https://bntrk.ca/G4DARI-demo.mp4.\n\
  \n## Keywords\nG4DARI, Geant4, Monte Carlo, Dosimetry, Radiation Physics\n\n## To download the interface\
  \ G4DARI_211227_deploy.zip: https://github.com/bentmha/G4DARI/releases/tag/v1.0.1\n\n## To communicate\
  \ with the author: Mhamed.Bentourkia@USherbrooke.ca\n"

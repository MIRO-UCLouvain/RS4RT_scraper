readme_excerpt: "# \U0001F3E5 Radiation Therapy Optimization (Linear Programming)\n\n### The Clinical\
  \ Challenge\n**The Problem:**\nIn cancer radiation therapy, doctors use external beams to destroy tumors.\
  \ However, these beams also pass through and damage healthy anatomy and critical tissues nearby. The\
  \ challenge is to find the \"sweet spot\" where the tumor is destroyed, but the patient remains safe.\n\
  \n**The Objective:**\nDetermine the precise intensity (dosage) for two radiation beams to ensure the\
  \ **Tumor receives at least 6 kilorads** (to be effective) while keeping **Critical Tissues below 2.7\
  \ kilorads** (safety limit) and minimizing damage to the rest of the healthy anatomy.\n\n---\n\n###\
  \ What I Did\n1.  **Modeled the physics:** Built a mathematical model representing how radiation from\
  \ two different angles is absorbed by different body parts (Tumor vs. Healthy Tissue).\n2.  **Solved\
  \ for patient safety:** Used Linear Programming to calculate the exact optimal dosage (**8.0 kRad from\
  \ Beam 1, 3.0 kRad from Beam 2**) that meets all medical requirements.\n3.  **Visualized the trade-offs:**\
  \ Created a **Pareto Frontier** analysis to show doctors the \"cost\" of increasing tumor dosage in\
  \ terms of healthy tissue damage, aiding in complex clinical decision-making.\n\n---\n\n### How It Works\n\
  * **Inputs:** Absorption coefficients for 3 body areas (Healthy, Critical, Tumor) across 2 beam sources.\n\
  * **Method:** Multi-objective Linear Programming using **Python** and **Gurobi Optimizer**.\n* **Constraints:**\n\
  \    * $\\text{Tumor Dose} \\ge 6.0 \\text{ kRad}$ (Hard Constraint)\n    * $\\text{Critical Tissue\
  \ Dose} \\le 2.7 \\text{ kRad}$ (Hard Constraint)\n    * $\\text{Minimize Healthy Tissue Dose}$ (Objective)\n\
  \n---\n\n### \U0001F4C9 Visual Output: The Pareto Frontier\n<img width=\"612\" height=\"468\" alt=\"\
  Pareto Froniter\" src=\"https://github.com/user-attachments/assets/d5b2ccfd-4b97-48e4-a2a3-7fe6f2b6fd25\"\

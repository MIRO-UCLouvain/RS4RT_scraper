readme_excerpt: '# Drug Toxicity Prediction with GINE (Tox21)


  CPU-only instructions and example run for the Tox21 dataset using a GINE model (PyTorch Geometric).


  Quick start (create virtualenv, activate, install):


  ```bash

  python -m venv .venv

  .\.venv\Scripts\activate

  pip install -r requirements.txt

  ```


  Run training (CPU):


  ```bash

  python train.py --epochs 5 --batch-size 32

  ```


  Notes:

  - This repo uses `MoleculeNet(''Tox21'')` from `torch_geometric.datasets`.

  - Some installations of `torch-geometric` require special wheel indexes; consult torch-geometric installation
  docs for CPU wheels.

  '

readme_excerpt: '# David''s Personal Portfolio - dvh.sh


  Simple personal portfolio site for diaplying skills and contact information, written using Next.js and
  Tailwindcss.


  ![GitHub License](https://img.shields.io/github/license/dvh-sh/dvh.sh)


  ## Table of Contents


  - [Usage](#usage)

  - [Installation](#installation)

  - [Development](#development)

  - [Acknowledgements](#acknowledgements)

  - [License](#license)


  ## Usage


  The site is live at [dvh.sh](https://dvh.sh), where you can explore David''s skills, projects, and contact
  information.


  ## Installation


  To run the project locally, you will need [Bun](https://bun.sh) installed on your system.


  ```bash

  # Clone the repository

  git clone https://github.com/dvh-sh/dvh.sh.git


  # Navigate into the project directory

  cd dvh.sh


  # Install project dependencies

  bun install


  # Start the development server

  bun run dev

  ```


  The site will be available at `http://localhost:3000`.


  ## Development


  This project is built with Next.js and uses TypeScript for type safety. The project structure is designed
  for ease of development and maintenance.


  ### Key Technologies


  - **Next.js**: The React framework used for building the site.

  - **Tailwind CSS**: Utility-first CSS framework for styling.

  - **React Icons**: Icon library for easily including SVG icons.


  ### Scripts


  - **Development**: `bun run dev` - Starts the development server.

  - **Build**: `bun run build` - Builds the project for production.

  - **Start**: `bun run start` - Starts the production server.

  - **Lint**: `bun run lint` - Runs ESLint for code quality checks.


  ## Acknowledgements


  - **Catppuccin**: The beautiful color scheme used throughout the site (frappe variant). Check out [Catppuccin](https://github.com/catppuccin)
  for more.


  ## License


  This project is licensed under the GNU GPL 3.0 License. See the [LICENSE](https://choosealicense.com/licenses/gpl-3.0/)
  file for details.


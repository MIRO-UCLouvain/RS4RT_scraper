readme_excerpt: "# Molecular Properties Prediction using Machine Learning\n\n## Project Overview\n\nThis\
  \ project builds a **machine learning pipeline to predict molecular properties and toxicity using chemical\
  \ structure information (SMILES)**.\n\nThe system uses **RDKit molecular descriptors and fingerprints**\
  \ to train machine learning models that predict:\n\n* **Toxicity endpoints (Tox21 dataset)**\n* **Mutagenicity\
  \ (Ames dataset)**\n* **Solubility (ESOL dataset)**\n\nThe goal is to create a **computational screening\
  \ system that helps identify potentially toxic or harmful molecules early**, reducing the need for expensive\
  \ laboratory testing.\n\n---\n\n# Objectives\n\n* Predict **molecular toxicity** using machine learning\n\
  * Analyze **chemical properties influencing toxicity**\n* Predict **molecular solubility**\n* Build\
  \ a **complete molecular ML pipeline**\n\n---\n\n# Datasets Used\n\n### 1. Tox21 Dataset\n\nUsed for\
  \ **toxicity classification** across multiple biological targets.\n\nContains **12 toxicity endpoints**,\
  \ including:\n\n* NR-AR\n* NR-AR-LBD\n* NR-AhR\n* NR-Aromatase\n* NR-ER\n* NR-ER-LBD\n* NR-PPAR-gamma\n\
  * SR-ARE\n* SR-ATAD5\n* SR-HSE\n* SR-MMP\n* SR-p53\n\n### 2. Ames Mutagenicity Dataset\n\nUsed for **mutagenicity\
  \ classification**.\n\nPredicts whether a molecule is:\n\n* Mutagenic (toxic)\n* Non-mutagenic\n\n###\
  \ 3. ESOL Dataset\n\nUsed for **solubility prediction**.\n\nPredicts:\n\n* **logS (aqueous solubility)**\n\
  \n---\n\n# Technologies Used\n\n| Tool         | Purpose                     |\n| ------------ | ---------------------------\
  \ |\n| Python       | Programming language        |\n| RDKit        | Chemical feature extraction |\n\
  | Pandas       | Data processing             |\n| NumPy        | Numerical computation       |\n| Scikit-learn\
  \ | Machine learning models     |\n| Matplotlib   | Visualization               |\n| Seaborn      |\
  \ Statistical visualization   |\n\n---\n\n# Machine Learning Models\n\n| Task                      \
  \  | Model                                 |\n| --------------------------- | -------------------------------------\
  \ |\n| Toxicity Prediction (Tox21) | Random Forest (MultiOutputClassifier) |\n| Ames Mutagenicity  \
  \         | Random Forest Classifier              |\n| ESOL Solubility             | Random Forest Regressor\
  \               |\n\n---\n\n# Feature Engineering\n\nChemical features extracted using **RDKit** include:\n\
  \n### Molecular Descriptors\n\n* Molecular Weight (MolWt)\n* LogP\n* Topological Polar Surface Area\
  \ (TPSA)\n* Hydrogen Bond Donors\n* Hydrogen Bond Acceptors\n* Rotatable Bonds\n\n### Molecular Fingerprints\n\
  \n* Morgan Fingerprints\n* 1024-bit molecular fingerprint representation\n\nThese features convert **SMILES\
  \ chemical structures into machine learning-ready numerical vectors**.\n\n---\n\n# Project Pipeline\n\
  \n```\nSMILES Molecular Structure\n        ↓\nData Preprocessing\n        ↓\nRDKit Feature Engineering\n\
  \        ↓\nMachine Learning Model Training\n        ↓\nEvaluation\n        ↓\nVisualization\n     \
  \   ↓\nFinal Molecular Prediction Table\n```\n\n---\n\n# Project Structure\n\n```\nMolecular_properties_prediction/\n\
  \ndata/\n ├── raw/\n ├── processed/\n └── features/\n\nexperiments/\n └── models/\n\nsrc/\n ├── preprocessing/\n\
  \ ├── feature_engineering/\n ├── toxicity_classification/\n ├── toxicity_ranking/\n ├── property_prediction/\n\
  \ ├── Evaluation/\n ├── visualization/\n └── pipeline/\n\nvisuals/\n\nresults/\n```\n\n---\n\n# Results\n\
  \n### Toxicity Prediction\n\nROC curves generated for all **Tox21 toxicity endpoints**.\n\nExample:\n\
  \n```\nvisuals/tox21_roc_NR-AR.png\n```\n\n### Ames Mutagenicity\n\nConfusion matrix visualization:\n\
  \n```\nvisuals/ames_confusion_matrix.png\n```\n\n### ESOL Solubility\n\nScatter plot comparing:\n\n\
  * Actual solubility\n* Predicted solubility\n\n```\nvisuals/esol_prediction_plot.png\n```\n\n---\n\n\
  # Final Output\n\nThe project generates a **combined molecular prediction table**:\n\n| SMILES     \
  \        | Toxicity Type     | Ames Mutagenicity         | Predicted Solubility | Chemical Properties\
  \   |\n| ------------------ | ----------------- | ------------------------- | -------------------- |\
  \ --------------------- |\n| Molecule structure | Toxic probability | Mutagenic / Non-Mutagenic | logS\
  \                 | Molecular descriptors |\n\nSaved as:\n\n```\nresults/final_molecular_predictions.csv\n\
  ```\n\n---\n\n# How to Run the Project\n\n### 1️⃣ Install dependencies\n\n```\npip install pandas numpy\
  \ scikit-learn matplotlib seaborn rdkit joblib\n```\n\n### 2️⃣ Run preprocessing\n\n```\npython src/preprocessing/preprocess_data.py\n\
  ```\n\n### 3️⃣ Generate molecular features\n\n```\npython src/feature_engineering/generate_features.py\n\
  ```\n\n### 4️⃣ Train models\n\n```\npython src/toxicity_classification/train_tox21_model.py\npython\
  \ src/toxicity_ranking/train_ames_model.py\npython src/property_prediction/train_esol_model.py\n```\n\
  \n### 5️⃣ Evaluate models\n\n```\npython src/Evaluation/evaluate_tox21.py\npython src/Evaluation/evaluate_ames.py\n\
  python src/Evaluation/evaluate_esol.py\n```\n\n### 6️⃣ Run full pipeline\n\n```\npython src/pipeline/run_full_pipeline.py\n\
  ```\n\n---\n\n# Future Improvements\n\n* Deep learning models for molecular prediction\n* Graph neural\
  \ networks for molecular graphs\n* Web application for toxicity prediction\n* Drug discovery applications\n\
  \n---\n\n# Applications\n\n* Drug discovery\n* Chemical safety screening\n* Environmental toxicity prediction\n\
  * Pharmaceutical research\n\n---\n\n# Author\n\nDeveloped as a **Machine Learning Project on Molecular\
  \ Property Prediction**.\n\n---\n"

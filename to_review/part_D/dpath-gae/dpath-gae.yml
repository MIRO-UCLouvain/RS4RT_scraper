readme_excerpt: "# dpath_gae\n\n![Latent Space Traversals](data/images/latent_traversals_-5_to_5.png)\n\
  \n## Disclaimer\nDevelopment of this project started as Master's Thesis at Technical University of Munich\
  \ and is now continued as part of my work at Masaryk University in Brno, Czech Republic.\nMain contributors\
  \ are also [Vlad Popovici](https://www.muni.cz/en/people/118944-vlad-popovici) and [Hasan Sarhan](http://campar.in.tum.de/Main/HasanSarhan).\n\
  It is targeted towards disentangled representation learning for digital pathology data as a custom similarity\
  \ metric for deformable image registration.\n\nPlease note that this project is under development and\
  \ doesn't contain the main content as of today.\nCollaborations and contributions are welcome!\n\nIf\
  \ using this code in your work please cite the following publication\n\n[1] Hecht, H.; Sarhan, M.H.;\
  \ Popovici, V. Disentangled Autoencoder for Cross-Stain Feature Extraction in Pathology Image Analysis.\
  \ Appl. Sci. 2020, 10, 6427. https://doi.org/10.3390/app10186427\n\n\n## Setup\n### Python\n\nPackages\
  \ to install via pip3:\n*  [tensorflow](https://www.tensorflow.org/install/pip) v1.12, preferably with\
  \ [GPU suppurt enabled](https://www.tensorflow.org/install/gpu). GPU support is not necessary, but makes\
  \ stuff faster.\n*   numpy\n*   scipy\n*   matplotlib\n*   [gitpython](https://gitpython.readthedocs.io/en/stable/intro.html#installing-gitpython)\
  \ & [gitdb](https://pypi.org/project/gitdb/)\n*   re\n\n### C++\n\nNone of the C++ functionality is\
  \ implemented as of now, so these are future dependencies.\n\n*  Install [CUDA](https://developer.nvidia.com/cuda-zone)\
  \ if you have a NVIDIA GPU.\n*  Install [ITK](https://github.com/InsightSoftwareConsortium/ITK).\n \
  \   *  Clone from github and check out v4.13.1\n    *  Configure and build it using CMake\n    *  Install\
  \ it using [checkinstall](https://debian-administration.org/article/147/Installing_packages_from_source_code_with_checkinstall),\
  \ you might want to remove it later.\n*  Install [tensorflowCC](https://github.com/FloopCZ/tensorflow_cc).\n\
  *  Install Qt5 v5.9.5\n\n## How To?\n\nThe main part of the project is the [gae_model.py](examples/models/gae/gae_model.py)\
  \ script for training a custom model. The model architecture, as well as the input dataset is described\
  \ in a JSON configuration file which is parsed to build the model. The model is implemented using the\
  \ `tf.Estimator` API and expects a `tf.data.TFRecordsDataset`.\n\nSo in order to use the script, you\
  \ have to follow these steps:\n1.  Create your own dataset as described below.\n2.  Adapt the dataset\
  \ part of the configuration script for your dataset as well as the input part of the model configuration.\n\
  3.  Adapt the model architecture (encoder/decoder layers) to your data.\n4.  Adapt the hyperparameters\
  \ and embedding configuration.\n5.  Train your model.\n\n### Create a Custom Dataset?\n\n#### Custom\
  \ Dataset from Image Files\nThe examples contained in this repository don't come with a publicly available\
  \ dataset, but with multiple tools to create a dataset in the required layout. All tools required to\
  \ create a matching dataset are collected [here](tools/dataset).\n\nThe dataset required to train the\
  \ models are expected to consist of fixed size image patches with 3 channel float data and a class label\
  \ per image patch.\n\nSteps to create a custom dataset:\n1.  Collect the filenames of the image files\
  \ in a tfrecords dataset using [this](tools/dataset/CollectFilenamesInDataset.py) script.\n    1.  Make\
  \ sure that all images are stored in a similar pattern where all filenames can be collected using a\
  \ python glob expression.\n    2.  Make sure all image files are in one of the supported formats. For\
  \ a list of supported image formats see [here](packages/Tensorflow/Image/Image.py).\n    3.  Make sure\
  \ all images have moderate size (width < 10k, height < 10k)\n2.  Run the [preprocessing script](tools/dataset/preprocess_image_filenames_dataset.py)\
  \ to load the collected image files, assign a label to them and store tiles as a binary tfrecords file.\n\
  \    1.  The arguments required for the preprocessing script are (1) name of the input dataset holding\
  \ image filenames, (2) name of the output dataset, (3) the patch size, (4) the number of samples for\
  \ the target dataset, (5) a comma separated list of labels, where each filename has to contain 1 or\
  \ 0 of these labels, (optional)(6) a threshold for the filter function, between 0 and 1, usually 0.04\
  \ < t < 0.1, (optional)(7) a size for the images.\n    2.  Make sure to adapt the shuffle buffer sizes\
  \ for your data and patch sizes.\n3.  Verify the integrity of the dataset using the [plot image from\
  \ dataset](tools/visualization/plot_image_from_dataset.py) script and [estimate distribution](tools/dataset/estimate_distribution.py).\n\
  4.  Create normalization files using the [estimate moments](tools/dataset/estimate_moments.py) tool.\n\
  \    1.  Specify the number of samples over which to estimate the moments and the axis which to use\
  \ for estimation.\n    2.  In case of using 3 color RGB images, specify [0,1,2] as axis to normalize\
  \ the 3 color channels, so mean and variance are length 3 vectors.\n\n#### MNIST Dataset\n\nThe model\
  \ can also be trained and run on the MNIST dataset with minor changes.\nSince the whole configuration\
  \ file specification only influences the training function required for the tf.Estimator to run training,\
  \ providing your own training function can override the whole dataset loading and preprocessing pipeline.\n\
  \n```python\ndef train_func():\n    (x_train, y_train), (x_test, y_test) = tf.keras.datasets.mnist.load_data()\n\
  \n    x_train = x_train.astype('float32') / 255\n\n    # Reshape input data from (28, 28) to (28, 28,\
  \ 1)\n    w, h = 28, 28\n    x_train = x_train.reshape(x_train.shape[0], w, h, 1)\n\n    # One-hot encode\
  \ the labels\n    y_train = tf.keras.utils.to_categorical(y_train, 10)\n    \n    train_ds = tf.data.Dataset.zip((tf.data.Dataset.from_tensor_slices(x_train),tf.data.Dataset.from_tensor_slices(y_train)))\n\
  \    train_ds = train_ds.map(lambda image, label: ({\"val\": image }, label))\n\n    train_ds = train_ds.repeat().shuffle(60000).batch(10)\n\
  \    return train_ds\n\ndef main(argv):\n    # Do stuff, initialize model, etc.\n\n    classifier =\
  \ classifier.train(input_fn=train_func, steps=10000)\n```\n\nFor an example how this is used in a model\
  \ see [here](examples/models/autoencoder/autoencoder.py).\n\n### Create A Model with Custom Configuration?\n\
  Creating a custom model architecture which follows pattern described in the [publication](http://home.in.tum.de/~hechth/hechth_dpath.pdf)\
  \ requires costimizing a configuration file. The basic [GAE model](examples/models/gae/gae_model.py)\
  \ example comes with an example configuration for patch size 32 and 64, using a resnet_v2 block based\
  \ encoder, a sampler and some preconfigured summaries for tensorboard. The following explanations will\
  \ be based on the 32 size configuration.\n\n#### Adapt the Dataset\nIf you're using a \"in script\"\
  \ dataset - see the MNIST example - you can skip this step.\n\nDataset preparation can be implemented\
  \ oneself by implementing the function passed to tf.Estimator.train(...).\n\n```python\ndef train_fn(args):\n\
  \    # Load and preprocess dataset.\n    # dataset = tf.data.TFRecordDataset(...)\n    # dataset = dataset.map(...)\n\
  \    return dataset\n\ndef main(argv):\n    # ...\n    classifier.train(input_fn=train_fn, steps=steps)\n\
  \    # ...\n```\n\nAnother option is to specify the dataset in the JSON configuration file, this is\
  \ illustrated in an [example](examples/dataset).\n\n```json\n{ \n    \"datasets\": {\n        \"training\"\
  : {\n            \"filename\": \"examples/dataset/training_ds.tfrecords\",\n            \"size\": 100000,\n\
  \            \"operations\": [ \"...\" ]\n        },\n        \"validation\": { \"...\" },\n       \
  \ \"test\": { \"...\" },\n        \"batch\":200,\n        \"features\":[ \"...\" ]\n    }\n}\n```\n\n\
  Fields describing individual datasets which can be populated are *training*, *validation* and *test*.\n\
  Currently, only *training* is supported.\n\nEach dataset contains the *filename*, the number of samples\
  \ to extract from this dataset as *size*, the number of *steps* to run on this dataset and an optional\
  \ array of *operations* to run in the preprocessing.\n\nEntries valid for all datasets are the *batch*\
  \ size to use and the *features* of the dataset on disk, a list of triples containing of *key*, *shape*\
  \ and *dtype*, similar to the features defined as model inputs.\nNote that the label has to be defined\
  \ as a feature with the *key* \"label\".\n\nAfter creating a custom dataset, adapt the dataset part\
  \ of the configuration file.\nExample config for dataset at \"/home/xyz/ds_32_1000.tfrec\" with patch_size\
  \ 32, 1000 samples for training for 10 epochs with a batch size of 10 and a shuffle buffer of size 1000.\n\
  \nThe [preprocess image filenames dataset script](tools/dataset/preprocess_image_filenames_dataset.py)\
  \ stores the image patch feature under the key 'patch' and the label under the key 'label'.\n\n```json\n\
  {\n    \"datasets\": {\n        \"training\": {\n            \"filename\": \"/home/xyz/ds_32_1000.tfrec\"\
  ,\n            \"size\":1000 ,\n            \"epochs\": 10\n        },\n        \"batch\":10,\n    \
  \    \"shuffle_size\":1000,\n        \"features\":[\n            {\n                \"shape\": [32,32,3],\n\
  \                \"key\": \"patch\",\n                \"dtype\": \"tf.float32\"\n            },\n  \
  \          {\n                \"shape\": [1],\n                \"key\": \"label\",\n               \
  \ \"dtype\": \"tf.int64\"\n            }\n        ]\n    },\n}\n```\n\n#### Adapt the Hyperparameters\n\
  The hyperparameters for the model are the *beta* factor for the KL-divergence based latent loss, *alpha*\
  \ and *delta*, which control the supervised classification and adversarial loss terms. Values for *beta*\
  \ should be chosen 5 < *beta* < 20. For *alpha* and *delta*, 1 < *alpha (delta)* < 10.\n\nThe *latent_space_size*\
  \ determines the size of the latent code, BUT it has to be manually also set as number of dims in the\
  \ sampling layer. The entry in the config file is required for the correct dimensionsons for the latent\
  \ loss.\n\nExample:\n```json\n{\n    \"parameters\": {\n        \"beta\": 16,\n        \"alpha\": 12,\n\
  \        \"delta\": 12,\n        \"latent_space_size\":18\n    }\n}\n```\n\n#### Adapt the Architecture\n\
  \nThe model is specified by its *inputs* and *components*.\n\n```json\n{\n    \"model\": {\n       \
  \ \"inputs\": { \"...\" },           \n        \"components\":[ \"...\" ]\n    }\n}\n```\nThe *inputs*\
  \ are supposed to have the following structure:\n\n```json\n{\n    \"inputs\": {\n        \"features\"\
  :[\n            {\n                \"shape\": [1],\n                \"key\": \"val\",\n            \
  \    \"dtype\": \"tf.float32\"\n            }\n        ],\n        \"labels\": {\n            \"shape\"\
  : [1],\n            \"dtype\": \"tf.float32\"\n        }\n    }\n}\n```\n\nThe input *features* to the\
  \ model are an array, each element being composed of *shape*, *key* and *dtype* information. The second\
  \ field is the labels, which only support a single entry now defined by *shape* and *dtype*.\nThe second\
  \ part of the model are its *components*.\n\n```json\n{\n    \"components\":[\n        {\n         \
  \   \"name\":\"network\",\n            \"input\": \"val\",\n            \"layers\": [ \"...\" ],\n \
  \           \"output\":\"logits\"\n        }\n    ]\n}\n```\n\nA *component* is defined by its *name*,\
  \ *input*, the *layers* and its *output*.\n\nThe *input* of a component is the *key* of a feature describes\
  \ in the model *inputs* or the name defined by the *output* field of a preceding component. The *output*\
  \ field therefore defines the key under which the output values of this component can be accessed.\n\
  *Layers* is an array, each entry defining a layer in the model. The layers are connected in the ordering\
  \ in which they are defined in the array.\n\nWhich fields are used to define properties regarding layers\
  \ is described in [Layer.py](packages/Tensorflow/Model/Layer.py).\nA detailed list of which layers can\
  \ be specified and how is available [here](packages/Tensorflow/Model)\n\nFor examples of how to specify\
  \ possible configurations and the corresponding python code to create the models are given in [Examples/Models](examples/models).\n\
  \n\nThe model architecture is mainly determined by the comp"

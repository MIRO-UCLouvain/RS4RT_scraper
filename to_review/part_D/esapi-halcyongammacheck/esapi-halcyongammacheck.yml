readme_excerpt: '# ✅ ESAPI Portal Dosimetry Gamma Check


  ## 📖 Overview

  The **ESAPI Portal Dosimetry Gamma Check** is an open-source binary plug-in for Varian''s **Portal Dosimetry**
  application (built with the Portal Dosimetry Scripting API), launched from Portal Dosimetry''s `Tools
  > Scripts` menu.


  For a treatment plan delivered on any Varian linac with EPID-based portal dosimetry, it performs a **portal
  dosimetry (EPID) gamma constancy check across sessions**: for a selected field — or every field in the
  plan at once — it compares each delivered `PortalDoseImage` against a reference image (typically the
  first session) using a 2D gamma index, with automatic center-of-mass alignment, flags sessions below
  the institutional pass rate, and exports the results to CSV for the QA record.


  ## ✨ Key Features

  * **Portal Dosimetry Gamma Analysis:** 2D gamma index (3%/3mm, global normalization, 10% low-dose threshold
  by default) between a reference `PortalDoseImage` and each subsequent session, with automatic center-of-mass
  alignment.

  * **Single-Field or All-Fields Batch Mode:** Analyze one field manually, or run `-- ANALIZAR TODOS --`
  to auto-compare every treatment field in the plan against its own earliest session.

  * **Responsive UI:** Image reading is synchronous, but the gamma computation runs on a background thread
  (parallelized per image row) with live progress in the status bar, so the window never freezes during
  a batch analysis.

  * **Per-Comparison Error Isolation:** A problem with one session/field (mismatched image size or resolution,
  corrupted image, etc.) is reported as an `ERROR` row instead of aborting the whole batch.

  * **CSV Export:** Save results via a standard Save dialog; fields are properly escaped and numbers use
  culture-invariant formatting, so the report opens cleanly in Excel regardless of the OS locale.

  * **Minimal Audit Log:** Every analysis run and export is appended to a local log file (patient, plan,
  field, pass/fail/error counts, user, timestamp) for institutional traceability.


  ## 💻 System Requirements

  * **Portal Dosimetry Scripting API:** Built against release 18.1. If your clinic runs a different Portal
  Dosimetry version, update the reference `HintPath`s (`VMS.CA.Scripting.dll` / `VMS.DV.PD.Scripting.dll`,
  found in the Portal Dosimetry installation directory) in `ESAPI_HalcyonGammaCheck.csproj` accordingly.

  * **.NET Framework:** 4.8 (as configured in `ESAPI_HalcyonGammaCheck.csproj`).


  ## 🗂️ Project Structure

  | File | Responsibility |

  |---|---|

  | `Script.cs` | Portal Dosimetry plug-in entry point (`Script.Execute`), launched from `Tools > Scripts`.
  |

  | `MainView.cs` | WPF UI: plan/field selection, analysis grid, CSV export. |

  | `GammaCalculator.cs` | Pure gamma-index math — no scripting-API dependency, safe to run on a background
  thread or unit test. |

  | `PortalDoseSnapshot.cs` | Immutable copy of a `PortalDoseImage`''s voxels/metadata, used to hand data
  from the UI thread to the background computation. |

  | `AnalysisResult.cs` | Result row shown in the grid and exported to CSV. |

  | `ActivityLogger.cs` | Best-effort audit logging. |

  | `AssemblyInfo.cs` | Assembly version. |


  ## 🛠️ Installation & Compilation

  This project is a **binary plug-in** for Portal Dosimetry and must be compiled into a `.dll` library.


  1. Clone or download this repository to your local machine.

  2. Open the solution file (`.sln`) using **Visual Studio**.

  3. Verify the `VMS.CA.Scripting` / `VMS.DV.PD.Scripting` reference paths in `ESAPI_HalcyonGammaCheck.csproj`
  point to your Portal Dosimetry installation directory.

  4. Build the solution (`Ctrl + Shift + B` or `Build > Build Solution`).

  5. Locate the compiled `.dll` file inside the output folder configured in `ESAPI_HalcyonGammaCheck.csproj`
  (`OutputPath`).

  6. In Portal Dosimetry, select `Tools > Scripts`, click `Change Directory`, and navigate to the folder
  containing the compiled `.dll`.


  ## 🚀 How to Use

  1. Open a Patient in Portal Dosimetry, select `Tools > Scripts`, choose the Gamma Check `.dll`, and
  click `Run`.

  2. Select the **Plan**, and either a single **Field** or `-- ANALIZAR TODOS --` to compare every field
  in the plan.

  3. For single-field mode, choose the reference session (defaults to session 1); in all-fields mode,
  the earliest session of each field is used automatically.

  4. Click **ANALIZAR** and watch the status bar for progress. Results appear in the grid, color-coded
  `APROBADO` / `FALLO` / `ERROR`.

  5. Click **Exportar CSV** and choose where to save the report (defaults to `C:\Temp\PortalDosimetryReports`).

  6. Ensure all metrics pass institutional protocols before treating the patient.



readme_excerpt: "# PyRTEva\n\n[![CI](https://github.com/PanMar86/PyRTEva/actions/workflows/ci.yml/badge.svg)](https://github.com/PanMar86/PyRTEva/actions/workflows/ci.yml)\n\
  ![python 3.13](https://img.shields.io/badge/python-3.13-blue)\n![License: Apache 2.0](https://img.shields.io/badge/License-Apache_2.0-blue)\n\
  \nPyRTEva is a Python-based toolkit designed to automate the evaluation of radiotherapy treatment plans,\
  \ focusing on both target coverage and sparing of critical structures (OARs). It allows users to import\
  \ DICOM RT data, explore anatomy and dose distributions both in 2D and 3D, compute common plan quality\
  \ metrics, and automatically evaluate dose constraints based on clinical guidelines (RTOG, QUANTEC).\n\
  \n\n## Features\n\n- DICOM RT support. \n- Hybrid identification of structures (based on regex and user\
  \ verification).\n- 2D and 3D visualization including advanced options such as dose homogeneity and\
  \ dose gradient modes.\n- Support for multiple planning target volumes.\n- Interactive dose volume histograms\
  \ with support for common dose metrics (Dmax, Dmean, Dx, Vx).\n- Standard plan evaluation metrics, including\
  \ dose conformity index and dose homogeneity index.\n- Automatic evaluation of dose constraints based\
  \ on established guidelines (RTOG, QUANTEC), with clear reporting and highlighting of violations.\n\
  - Modern, lightweight Qt-based GUI, integrating visualization, DVH analysis, and dose constraints evaluation.\n\
  \n\n## Validation\n\nPreliminary validation against Varian Eclipse TPS has been conducted, using a dataset\
  \ consisting of three lung cancer patients. \nThe mean accuracy, across all patients and structures,\
  \ for the dosimetric indices Dmin, Dmax and Dmean was below 2%, 1% and 1% respectively. \nSmall deviations\
  \ are generally expected due to difference in parameters such as dose bin width and dose grid interpolation\
  \ method. \nMoreover, different implementation of the algorithms related to structures masks generation\
  \ and dosimetric indices computation can account for the observed discrepancies.   \n\n\n## Main workflow\n\
  \n![Main Workflow](docs/screenshots/workflow.png)\n\n\n## Screenshots\n\n![GUI](docs/screenshots/gui_1.png)\n\
  ![GUI_2](docs/screenshots/gui_2.png)\n\n\n##  Demo\n\n[![Watch the demo](docs/screenshots/gui_blank.png)](https://youtu.be/iY8NaDWlc4A)\n\
  \n\n## Installation instructions\n\nCreate a virtual environment and activate it.\n```\nconda create\
  \ -n PyRTEva python=3.13\nconda activate PyRTEva\n```\n\nInstall through GitHub.\n```\npip install git+https://github.com/PanMar86/PyRTEva.git\n\
  ```\n\nLaunch the GUI.\n```\npyrteva\n```\n\n\n## Limitations\n\n- While the toolkit supports DICOM\
  \ RT objects, it does not yet handle all vendor-specific edge cases, private tags, or uncommon acquisition\
  \ geometries.\n\n- Dose maps computation relies on the assumption of a dose grid that has the same orientation\
  \ as the CT series. In addition, it is assumed that the dose grid planes are fully or partially aligned\
  \ with the slices of the CT series, along the z-axis. Rotated grids, or grids that are not z-axis aligned\
  \ (fully or partially) with the CT series are not currently supported.\n\n- Automatic dose constraints\
  \ evaluation is implemented only for treatment plans corresponding to brain and lung cancer (conventional\
  \ fractionation). Future development will extend coverage to additional body sites and fractionation\
  \ schemes.\n\n- To maintain consistent display of content, certain GUI panels are recreated rather than\
  \ updated in place. Moreover, evaluating multiple treatment plans currently requires restarting the\
  \ GUI. These design choices ensure reliable function, while future updates will enhance state management\
  \ and interactivity.\n\n\n## References\n\n- Aerts, H. J. W. L., Wee, L., Rios Velazquez, E., Leijenaar,\
  \ R. T. H., Parmar, C., Grossmann, P., Carvalho, S., Bussink, J., Monshouwer, R., Haibe-Kains, B., Rietveld,\
  \ D., Hoebers, F., Rietbergen, M. M., Leemans, C. R., Dekker, A., Quackenbush, J., Gillies, R. J., Lambin,\
  \ P. (2014). Data From NSCLC-Radiomics (version 4) [Data set]. The Cancer Imaging Archive. [DOI](https://doi.org/10.7937/K9/TCIA.2015.PF0M9REI)\n\
  \n- Grégoire, V., & Mackie, T. R. (2011). State of the art on dose prescription, reporting and recording\
  \ in Intensity-Modulated Radiation Therapy (ICRU report No. 83). Cancer/radiothérapie, 15(6-7), 555-559.\
  \ [DOI](https://doi.org/10.1016/j.canrad.2011.04.003)\n\n- Lomax, N. J., & Scheib, S. G. (2003). Quantifying\
  \ the degree of conformity in radiosurgery treatment planning. International Journal of Radiation Oncology*\
  \ Biology* Physics, 55(5), 1409-1419. [DOI](https://doi.org/10.1016/S0360-3016(02)04599-6)\n\n- Van't\
  \ Riet, A., Mak, A. C., Moerland, M. A., Elders, L. H., & Van Der Zee, W. (1997). A conformation number\
  \ to quantify the degree of conformality in brachytherapy and external beam irradiation: application\
  \ to the prostate. International Journal of Radiation Oncology* Biology* Physics, 37(3), 731-736. [DOI](https://doi.org/10.1016/s0360-3016(96)00601-3)\n\
  \n- Baltas, D., Kolotas, C., Geramani, K., Mould, R. F., Ioannidis, G., Kekchidi, M., & Zamboglou, N.\
  \ (1998). A conformal index (COIN) to evaluate implant quality and dose specification in brachytherapy.\
  \ International journal of radiation oncology, biology, physics, 40(2), 515-524. [DOI](https://doi.org/10.1016/s0360-3016(97)00732-3)\n\
  \n- Paddick, I., & Lippitz, B. (2006). A simple dose gradient measurement tool to complement the conformity\
  \ index. Journal of neurosurgery, 105(Supplement), 194-201. [DOI](https://doi.org/10.3171/sup.2006.105.7.194)\n\
  \n- Marks, L. B., Yorke, E. D., Jackson, A., Ten Haken, R. K., Constine, L. S., Eisbruch, A., ... &\
  \ Deasy, J. O. (2010). Use of normal tissue complication probability models in the clinic. International\
  \ Journal of Radiation Oncology* Biology* Physics, 76(3), S10-S19. [DOI](https://doi.org/10.1016/j.ijrobp.2009.07.1754)\n\
  \n\n## Authors\n\nPanagiotis Marentakis  \n\n## License\n\nThis project is licensed under the Apache\

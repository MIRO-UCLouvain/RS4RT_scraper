readme_excerpt: "# Removing ring artifacts in CBCT images via Transformer\n\n## Installation Guide\n\n\
  ### Prerequisites\n\nBefore installing the program, you need to complete the following steps:\n\n\n\
  - Download the source code.\n\n- Install it as its guide.\n\n\n## Package dependencies\n\nThe project\
  \ is built with PyTorch 1.9.0, Python3.7, CUDA11.1. For package dependencies, you can install them by:\n\
  \n```bash\npip install -r requirements.txt\n```\n\n## Data preparation \n\n### Dataset\nFor training\
  \ data of real cbct images, you can download the dataset from the [official url](https://tianchi.aliyun.com/competition/entrance/532087/information).\n\
  \nThen put all the data into `../datasets/denoising`.\n\n\n## Training\n\nTo train the model, you can\
  \ begin the training by:\n\n```sh\nsh script/train.sh\n```\n\n\n\n## Evaluation\nTo evaluate our model,\
  \ you can run:\n\n```sh\nsh script/test.sh\n```\nFor evaluate on each dataset, you should uncomment\
  \ corresponding line.\n\n\n## Acknowledgement\n\nThis code borrows heavily from [Uformer](https://vinthony.github.io).\n\
  \n\n## Contact\nPlease contact us if there is any question or suggestion(980973357@qq.com).\n\n"

readme_excerpt: "## RSNA-MICCAI Radiogenomische Klassifizierung von Hirntumoren\n\nGlioblastom -> Maligner\
  \ Tumor, häufigster Hirntumor bei Erwachsenen. Überlebensraten von weniger als einem Jahr.\n\nRadiogenomics->\
  \ Vorhersage der Genetik des Krebses durch bildgebende Verfahren, die weniger invasiv als eine Operation\
  \ sind und die Art der erforderlichen Therapie verbessern.   \n\nZiel-> Vorhersage des genetischen Subtyps\
  \ des Glioblastoms anhand von MRT-Scans zum Nachweis einer MGMT-Promotor-Methylierung\n\nBeitragende\
  \ -> Radiological Society of North America RSNA und der Medical Image Computing and Computer Assisted\
  \ Intervention Society MICCAI\n\nDetails: 400.116 Dateien, 136,85 GB, Typ: strukturelles multiparametrisches\
  \ (mpMRI) im DICOM-Format dcm, csv.\n\nTarget : MGMT_value-> das Vorhandensein von MGMT-Promotor-Methylierung\n\
  \nHardware: Google Colab Pro, Runtime type: A100, System RAM: 4.3/83.5 GB, GPU RAM: 30.5/40.0 GB, Disk\
  \ 167 / 235.7 GB\n\n[Code](https://github.com/moanesga/moanesga-RSNA-Monai-3D_Classification_Brain_Tumor/blob/main/RSNA_Monai_3D_Classification_Brain_Tumor.ipynb)\n\
  \n[Quelle](https://www.kaggle.com/competitions/rsna-miccai-brain-tumor-radiogenomic-classification/overview)\n\
  \n"

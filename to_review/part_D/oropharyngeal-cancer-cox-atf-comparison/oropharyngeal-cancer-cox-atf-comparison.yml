readme_excerpt: '# Oropharyngeal_cancer_Cox_ATF_comparison

  The aim of the project is to analyse the data of patients with oropharyngeal cancer, comparing the survival
  time of patients treated with radiotherapy or radiotherapy and chemotherapy. The project will analyse
  the effect of different variables on the survival time of patients and will fit a Cox model and an ATF
  model. The project is performed using R language.


  * Anna_Herud-Projekt5_eng.html - contains the raport in English language

  * Anna_Herud-Projekt5---pdf - contains the raport in Polish language


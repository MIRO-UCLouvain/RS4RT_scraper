readme_excerpt: "\uFEFF# Toxicity prediction\U0001F9EA\r\n\r\nThe project is built upon libraries of pre-trained\
  \ machine learning models from various fields.\r\n\r\n### Table of contents:\r\n\r\n- [Requirements](#requirements)\r\
  \n- [Getting Started](#getting-started)\r\n\r\n## Requirements\r\n- [NumPy](https://numpy.org/)\r\n\
  - [pandas](http://pandas.pydata.org/)\r\n- [scikit-learn](https://scikit-learn.org/stable/)\r\n- [SciPy](https://www.scipy.org/)\r\
  \n- [rdkit](https://www.rdkit.org/)\r\n\r\nIt is highly recommended to use a GPU.\r\n\r\nany other requirements\
  \ for specific models is written and explained in the coding files.\r\n\r\n## Getting Started\r\nTo\
  \ get started you need to choose the model you want to engage and open the colab notebook in the coding\
  \ folder where the targeted file is placed.\r\n\r\nfrom a general prespective, all coding files have\
  \ the same chunk of code of importing the datasets which are placed in this repository project for your\
  \ convenient use.\r\n\r\nthe datasets are splitted into 3 categories:\r\n- original datasets\r\n- train\
  \ datasets\r\n- test datasets\r\n\r\nthe train,test,and validation datasets are splitted 80/10/10 corrrespondingly.\
  \ furthermore, in the train dataset folder their are files which was augmented (the operation of adding\
  \ artifical data by a generator by code) and named after that. This was a part of balancing the data\
  \ and essential part of the project. \r\n\r\nAlso,if you want to save/load models, there is an option\
  \ for that with google drive since the models are heavy and hence cannot be saved/loaded to github:\r\
  \n\r\n1.request premission here: https://drive.google.com/drive/folders/1UWhWA4_phu5alMNFuwgJpHsX9pzKMKYw?usp=sharing.\r\
  \n\r\n2.copy this folder to your google drive.\r\n\r\nas for the models, they are divided into 3 main\
  \ categories:\r\n- models based on language structure: chemBerta and RNN.\r\n- models based on graphs:\
  \ GCN + molclr.\r\n- models based on vector represantaion : DNN and XGB.\r\n  \r\n### chemBerta\r\n\
  To initiate the project you need to follow the commentes in the first block of code.\r\n\r\nIn addition,if\
  \ you want to search for hyper parameters(with setting the corresponding variable in code to True) you\
  \ need to create an account at the site of WANDB library: https://wandb.ai/site.\r\n\r\nFor your convenience,\
  \ the full tutorial of chemBerta is [here](https://github.com/deepchem/deepchem/blob/master/examples/tutorials/Transfer_Learning_With_ChemBERTa_Transformers.ipynb).\r\
  \nIn addition, because chemBerta utilizes simpleTransformers library, the wandb, that relies on it,\
  \ outputs hyper paramaters data which was used in order to improve model.\r\nthe reports can be found\
  \ here:https://wandb.ai/toxicityprediction/chemBerta/reportlist\r\n\r\n\r\n\r\n### RNN\r\nInstructions\
  \ in comments in code.\r\n\r\n### GCN\r\nHere you need to download(or clone via git) the GCN folder\
  \ and install the required packages in code and the general packages as mentioned above.\r\n\r\n###\
  \ Molclr\r\nWe used the Molclr documentation which can be found [here](https://github.com/yuyangw/MolCLR).\r\
  \nThis documentation enables you to fine-tune the pretrained model to a specific task(our datasets)\
  \ which is what we did.\r\nfurther writing in this code is futile(except our own datasets) because we\
  \ assume that it's performence is at it's peak and any other changes we might have done might have damaged\
  \ performence. hence, in order to initiate the code you need to follow the documentation mentioned above.\r\
  \n\r\n### DNN\r\nInstructions in comments in code.\r\n\r\n### XGB\r\nInstructions in comments in code.\r\
  \n\r\n\r\n\r\n\r\n\r\n  \r\n"

readme_excerpt: "# RoboRhythms\nThis is the repository for SBRT RoboRhythms event used to program an ESP-32\
  \ to play music with a buzzer\n\n# Setup Instructions\nStep 1: Download and run Arduino IDE <br /> \n\
  - Download Page: https://www.arduino.cc/en/software/ <br /> \n\nStep 2: Open Preferences window<br />\
  \ \n- Look in the top left corner of the Arduino IDE window<br /> \n- Then select the following: Files\
  \ > Preferences<br /> \n\nStep 3: Paste URL into boards manager<br /> \n- Find the \"Additional boards\
  \ manager URLs: \" at the bottom of the preferences menu<br /> \n- Paste the following link into the\
  \ text field: https://dl.espressif.com/dl/package_esp32_index.json<br /> \n- Press Ok and exit the preferences\
  \ menu <br /> \n\nStep 4: Install esp32 by Espressif<br /> \n- Now navigate to Tools > Board: \"XXXXXXX\"\
  \ > Boards Manager...<br /> \n- A side bar will appear on the left<br /> \n- Type in \"esp32\" into\
  \ the search bar and click install on the one that specifically says \"esp32 by Espressif\" <br /> \n\
  \nStep 5: Select Board<br /> \n- Navigate to Tools > Board: \"XXXXXXX\" > esp32 and click on the one\
  \ that says \"ESP32 Dev Module\"<br /> \n\nStep 6: Get Files into Arduino Folder<br /> \n- Option 1:\
  \ Clone Repository into Arduino Folder <br /> \n  - Install Git if you haven't already: https://git-scm.com/book/en/v2/Getting-Started-Installing-Git\
  \ <br /> \n  - Open your File Explorer and navigate to Documents > Arduino<br /> \n  - Right click on\
  \ the window and select \"Open in Terminal\" <br /> \n  - Paste the following into the terminal and\
  \ hit enter: \"git clone https://github.com/superarash1/RoboRhythms.git\" <br /> \n\n- Option 2: Directly\
  \ Download Files and Paste into Arduino Folder<br /> \n  - First scroll up and click on the bright green\
  \ button that says \"<> Code\"<br /> \n  - Click on \"Download ZIP\"<br />\n  - Go to your downloads\
  \ folder, extract the zip file, select the files inside, and press ctrl + c <br />\n  - Navigate to\
  \ Documents > Arduino <br />\n  - Paste the files into the folder <br />\n\nStep 7: Install ESP32 Drivers\
  \ \n- Download the driver installer from the link. It should be called \"CP210x Universal Windows Drivers\"\
  \ : https://www.silabs.com/developer-tools/usb-to-uart-bridge-vcp-drivers?tab=downloads\n- Extract the\
  \ zip file. Then find silabser.inf, right click it, and click install\n\nStep 8: Open Files in Arduino\
  \ IDE from the side bar on the left\n- Select the file icon on the left side bar, below the blue circle\
  \ checkmark button\n- Then click on the RoboRhythms Folder and open the files\n"

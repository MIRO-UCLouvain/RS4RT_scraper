readme_excerpt: '# rt-viewer

  A high-performance static web viewer for Radiation Therapy planning data. Optimized for speed, security,
  and zero-footprint deployment.


  ⚠️ **IMPORTANT NOTICE: NOT FOR CLINICAL USE** ⚠️

  This project is a technical demonstration and architectural reference for processing and visualizing
  DICOM-RT data (Structure Sets, Dose, etc.) in a web browser using WebGL/Three.js.


  ### 🛑 Disclaimer

  - This software is **NOT A MEDICAL DEVICE**.

  - It is intended for **EDUCATIONAL AND RESEARCH USE ONLY**.

  - The developer (user) does not guarantee the accuracy of coordinates, dose values, or any clinical
  parameters displayed.

  - Use of this code or tool in a clinical setting is strictly prohibited and at the user''s own risk.


readme_excerpt: "# \U0001F9E0 Survival Prediction in Glioblastoma\nThis repository contains code, plots\
  \ and notebooks from my MSc thesis project on AI-based prediction of glioblastoma progression and patient\
  \ survival following radiotherapy. The work integrates image analysis, clinical data, and machine learning\
  \ to model and analyse survival outcomes. The dataset is sourced from **The Cancer Imaging Archive (TCIA)**\
  \ and requires approved access through their platform.\n\n## \U0001F4C1 Repository Structure\n- `image_vis.py`\
  \  \n  Script for visualizing image registration results. When run, it opens a graphical interface allowing\
  \ selection of patient, modality, and image processing options.\n- `3d_vis.py`  \n  Script for visualizing\
  \ images in 3D with Plotly. \n\n- `clinical_analysis_ML_survival.ipynb`  \n  Jupyter notebook for analyzing\
  \ overall survival (OS) and running machine learning pipelines using clinical and imaging-derived features.\n\
  \n- `dataset_pipeline.py`  \n  Utility functions for dataset construction and preprocessing. Used in\
  \ `preprocess.ipynb` to prepare data for analysis and modeling. The pipeline was made to support direct\
  \ extraction of clinical values from CSV files. However, this functionality was not utilized in the\
  \ current implementation. Instead, clinical values were imported from the CSV file used in the clinical-only\
  \ machine learning approach.\n\n- `models_classification.py`  \n  Deep learning models for classification\
  \ tasks (e.g., binary survival prediction).\n\n- `models_regression.py`  \n  Deep learning models for\
  \ regression tasks (e.g., continious survival time prediction).\n\n- `structure_volume_extractor.py`\
  \  \n  Script to extract and analyze dose-volume and anatomical structure data from patient DICOM files.\n\
  \n- `dl-pfs-train.ipynb`  \n  Notebook for deep learning-based progression-free survival (PFS) regression.\n\
  \n- `dl-survival.ipynb`  \n  Notebook for deep learning-based survival prediction.\n\n- `dose_distribution_analysis_survival.py`\
  \  \n  Voxel-wise comparative analysis of 3D radiation dose distributions between short- and long-survival\
  \ patient groups. Computes spatial dose statistics, significance maps, and summary metrics such as dose-falloff\
  \ gradients and radii of gyration. Results are saved as plots.\n\n- `GradCamMRI` and `GradCamViT`  \n\
  \  Contains all Grad-CAM visualizations generated during OS model evaluation.\n\n## \U0001F510 Data\
  \ Access\n\nThis project uses sensitive clinical and imaging data from TCIA. To use the code:\n\n1.\
  \ Request access to the dataset through [TCIA](https://www.cancerimagingarchive.net/).\n2. Download\
  \ and organize the data according to the expected folder structure.\n\n## \U0001F4C2 Directory Structure\n\
  \nThe code expects the dataset to follow the structure used in the **Burdenko Glioblastoma Progression**\
  \ collection from TCIA. After downloading and extracting the data, it should be organized as follows:\n\
  \n```text\nBurdenko-GBM-Progression/\n├── Burdenko-GBM-001/\n│   └── Radiotherapy planning/\n│     \
  \  ├── CT/\n│       ├── MR T2FLAIR/\n│       ├── MR CET1/\n│       ├── RTSTRUCT/\n│       ├── RTPLAN/\n\
  │       └── RTDOSE/\n├── Burdenko-GBM-002/\n│   └── Radiotherapy planning/\n│       └── ...\n└── ...\n\
  ```\nEach patient folder (e.g., `Burdenko-GBM-001`) must include a subdirectory named `Radiotherapy\
  \ planning/`, containing separate series or folders for:\n- **CT**\n- **MR T2FLAIR**\n- **MR CET1**\n\
  - **RTSTRUCT**\n- **RTPLAN**\n- **RTDOSE**\n\nSet the `base_path` parameter in your scripts to the root\
  \ dataset directory:\n\n```python\nbase_path = \"Burdenko-GBM-Progression\"\n```\n## \U0001F4A1 Example\
  \ Usage\nTo process and load data for a specific patient:\n```python\nprocessor = DICOMProcessor(patient_id=\"\
  Burdenko-GBM-001\", base_path=\"Burdenko-GBM-Progression\")\nprocessor.load_all_data()\n```\n>\U0001F4CC\
  **Note:** Due to privacy restrictions, the dataset is not included in this repository.\n\n## ⚙️ Installation\n\
  \nTo install the required dependencies, run:\n\n```bash\npip install -r requirements.txt\n"

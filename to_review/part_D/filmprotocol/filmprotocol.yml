readme_excerpt: "# FilmProtocol\nProtocol & scripts for plotting calibration curves and beam profiles\
  \ from film with MATLAB &amp; ImageJ\n\nWritten by Jacinta Yap (April, 2019), revised Mar 2021 (yapjacinta@gmail.com)\n\
  \nThis was developed for general film analysis at the Clatterbridge Cancer Centre, UK, 60 MeV proton\
  \ therapy beamline. Any settings specific to the facility (i.e. scanner dpi, zero value and pixel range)\
  \ can be easily modified within the code.\n\nThese scripts will automate the generation of a calibration\
  \ curve, fit and beam profile plots for irradiated Gafchromic film. This material has been fully documented\
  \ and is developed into a package for self-directed use: please read the PDF for how to use these scripts.\
  \ \n\nThis repository contains the following:\n\n- **FilmProtocol_MATLAB_ImageJ_JYAP** (.pdf user guide)\n\
  - **MatlabScripts** (.m files)\n  - CalibrationODtoDose, PlotProfileofScannedFilmWithOD, CalibrationGreen,\
  \ CalibrationBlue\n- **Examples**\n  - CalibrationCurve.png\n  - red, green, blue .txt files\n  - F2\
  \ & F8 (.tif scans, .txt film pixel files and .png corresponding generated profiles)\n- **2018_CCC_Calibration_FilmScans**\n\
  \  - .tif scans of beam spots of varying doses\n\n<br />\n<p float=\"left\">\n<img src=\"https://github.com/jacyap/FilmProtocol/blob/main/Examples/F2_19-Mar-2021.png\"\
  \ width=\"400\"/> \n<img src=\"https://github.com/jacyap/FilmProtocol/blob/main/Examples/19-Mar-2021_CalibrationCurve.png\"\
  \ width=\"320\"/>\n</p>\n"

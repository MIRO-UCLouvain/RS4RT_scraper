readme_excerpt: "# Radiomics-Based Classification of PSP Phenotypes via Machine Learning\n\n**University\
  \ Exam:** Biomedical Signal and Image Processing\n\n**Type:** Teamwork\n\n## Overview\n\nThis project\
  \ addresses the classification of Progressive Supranuclear Palsy (PSP) phenotypes from brain MRI scans.\
  \ PSP is a rare neurodegenerative disease with 5 clinical phenotypes; the most common is Richardson's\
  \ syndrome (PSP-RS), while the others are grouped as **variant PSP (vPSP)**.\n\n**Goal:** distinguish\
  \ PSP-RS from vPSP patients by extracting radiomic features from MRI images and classifying them using\
  \ Machine Learning algorithms.\n\n## Task 1 – Radiomic Feature Extraction\n\nFeatures were extracted\
  \ from MRI ROIs using three different tools, for comparison:\n- **Matlab** – using the SERA algorithm\n\
  - **Python** – using the PyRadiomics package\n- **3D Slicer** – using the Radiomics extension (also\
  \ based on PyRadiomics)\n\n**107 features** were extracted per patient, across categories: Shape, First\
  \ Order, GLCM, GLRLM, GLSZM, NGTDM, GLDM.\n\nCross-validation showed strong agreement between features\
  \ extracted via Python and 3D Slicer (both using PyRadiomics), while some discrepancies emerged when\
  \ comparing Matlab (SERA) results with PyRadiomics-based ones, due to differences in feature computation.\n\
  \n## Task 2 – Classification via Machine Learning\n\n**Dataset:** 26 patients × 107 features (14 PSP-RS,\
  \ 12 vPSP)\n\n**Workflow:** data preparation → algorithm selection → model training → testing, using\
  \ k-fold cross-validation (k = 3 to 7) in Matlab's Classification Learner App.\n\n**Algorithms implemented:**\n\
  - **Cosine KNN** – distance based on 1 − cosine similarity between feature vectors\n- **Weighted KNN**\
  \ – closer neighbors weighted more heavily than farther ones\n\n## Results\n\n| Model | Best Accuracy\
  \ | k (folds) | NumNeighbors |\n|---|---|---|---|\n| Cosine KNN | 0.88 | 5 | 5 |\n| Weighted KNN | **0.92**\
  \ | 5 | 5 |\n\nThe Weighted KNN model achieved the best overall performance, correctly classifying PSP-RS\
  \ vs vPSP patients with 92% accuracy.\n\n## Skills & Tools\n\n- **Matlab** (SERA, Classification Learner\
  \ App, KNN implementation)\n- **Python** (PyRadiomics)\n- **3D Slicer** (Radiomics extension)\n- Radiomics\
  \ feature extraction, Machine Learning classification (KNN), k-fold cross-validation\n\n## Repository\
  \ Contents\n\n- `Presentazione_PW/` – slide deck \n- `README.md` – this file\n"

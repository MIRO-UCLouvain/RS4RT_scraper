readme_excerpt: "# Proton Therapy Laboratory Portfolio ☢️\n\nWelcome to my Proton Therapy Portfolio! This\
  \ repository contains a collection of advanced laboratory assignments and projects completed during\
  \ the \"Engineering challenges in protontherapy\" (LGBIO 2070) course at UCLouvain. I attended this\
  \ course as part of my Erasmus exchange program.\n\nThe projects focus on the core physical and computational\
  \ aspects of proton therapy, ranging from particle transport simulations to beam optics optimization\
  \ and treatment planning using real patient data.\n\n## \U0001F4C2 Structure of the Repository\n\nThe\
  \ portfolio is divided into three main modules:\n\n### 1️⃣ Lab 1: Dose Calculation (`Lab1_Dose_Calculation`)\n\
  * **Focus:** Implementation of a **Monte Carlo simulation** from scratch to model proton dose deposition\
  \ in biological tissues.\n* **Key Concepts:** Continuous Slowing Down Approximation (CSDA), Energy Straggling,\
  \ Multiple Coulomb Scattering, and Nuclear Interactions (elastic and inelastic proton-proton and proton-oxygen\
  \ collisions).\n* **Contents:** Python script simulating depth-dose curves (Bragg Peak) in homogeneous\
  \ and heterogeneous phantoms (water/compact bone), raw data, and a comprehensive Technical Report analyzing\
  \ the results against MCsquare reference data.\n\n### 2️⃣ Lab 2: System Design (`Lab2_System_Design`)\n\
  * **Focus:** Design and simulation of a proton therapy delivery system for lung cancer, including beam\
  \ production, transport, and delivery.\n* **Key Concepts:** \n  * **Beam Production:** Isochronous cyclotron\
  \ parameter calculation (magnetic fields, frequencies, high voltage).\n  * **Beam Transport:** Phase-space\
  \ beam propagation and optimization of quadrupole focal lengths and drift distances using `scipy.optimize`\
  \ to strictly meet safety and symmetry constraints.\n  * **Beam Delivery & Interplay Effects:** Simulation\
  \ of 34x34 pencil beam scanning on a moving target (modeling patient breathing) and implementation of\
  \ an **Adaptive Spot Triggering** strategy to mitigate interplay effects.\n* **Contents:** Python simulation\
  \ code (`Lab2_Beam_Simulation_main.py`) and a detailed Technical Safety Report.\n\n### 3️⃣ Lab 3: Treatment\
  \ Planning (`Lab3_Treatment_Planning`)\n* **Focus:** Handling and processing of clinical imaging data\
  \ for treatment planning optimization.\n* **Key Concepts:** **DICOM** data parsing, Hounsfield Units\
  \ (HU) conversion, 3D CT scan visualization (Axial, Coronal, Sagittal planes), and analysis of image\
  \ distortions (e.g., metal artifacts).\n* **Contents:** An interactive Jupyter Notebook (`Lab3_Treatment_Planning_main.ipynb`)\
  \ demonstrating the data processing pipeline.\n\n## \U0001F6E0️ Technologies & Tech Stack\n* **Languages:**\
  \ Python\n* **Environments:** Jupyter Notebook\n* **Scientific & Data Analysis:** `NumPy`, `SciPy` (Optimization\
  \ algorithms)\n* **Medical Imaging:** `pydicom` (DICOM format manipulation)\n* **Data Visualization:**\
  \ `Matplotlib` (Dose maps, phase-space plots, depth-dose curves)\n\n## \U0001F3AF Key Skills Demonstrated\n\
  * Medical Physics & Particle Tracking (Monte Carlo)\n* Mathematical Optimization & Constraint Solving\n\
  * Signal Processing & Motion Mitigation Algorithms\n* Medical Imaging Data Handling (CT/DICOM)\n* Technical\
  \ Writing & Reporting\n"

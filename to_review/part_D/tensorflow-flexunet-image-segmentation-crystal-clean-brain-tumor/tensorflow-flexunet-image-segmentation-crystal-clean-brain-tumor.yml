readme_excerpt: "<h2>TensorFlow-FlexUNet-Image-Segmentation-Crystal-Clean-Brain-Tumor (2026/06/23)</h2>\n\
  Sarah T.  Arai<br>\nSoftware Laboratory antillia.com<br><br>\nThis is the first experiment of Image\
  \ Segmentation for <b>Crystal-Clean-Brain-Tumor</b> based on our <a href=\"./src/TensorFlowFlexUNet.py\"\
  >TensorFlowFlexUNet</a> \n(TensorFlow Flexible UNet Image Segmentation Model for Multiclass) , \nand\
  \ a 256x256 pixels PNG\n<a href=\"https://drive.google.com/file/d/1VSlBczPJQi2K8TqHYsFoJgcTMy-HY5lc/view?usp=sharing\"\
  >\n<b>Crystal-Clean-Brain-Tumor-ImageMask-Dataset.zip</b></a> with colorized masks \n(<a href=\"https://creativecommons.org/publicdomain/zero/1.0/\"\
  >CC0: Public Domain</a>), which was derived by us from <br><br>\n<a href=\"https://www.kaggle.com/datasets/mohammadhossein77/brain-tumors-dataset\"\
  >\n<b>Crystal Clean: Brain Tumors MRI Dataset</b> </a> by MH(mohammadhossein77).\n<br><br>\n<hr>\n<b>Actual\
  \ Image Segmentation for Crystal-Clean-Brain-Tumor Images of 256x256 pixels </b><br>\nAs shown below,\
  \ the inferred masks predicted by our segmentation model trained by the dataset appear similar to the\
  \ ground truth masks.\n<br><br>\n<b>class_color_map = {Meningioma:blue, Glioma:green, Pituitary tumor:red}\n\
  </b>\n<br><br>\n<table>\n<tr>\n<th width=\"320\" height=\"20\">Input: image</th>\n<th width=\"320\"\
  \ height=\"20\">Mask (ground_truth)</th>\n<th width=\"320\" height=\"20\">Prediction: inferred_mask</th>\n\
  </tr>\n<tr>\n<td><img src=\"./projects/TensorFlowFlexUNet/Crystal-Clean-Brain-Tumor/mini_test/images/M_240_SP_.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/Crystal-Clean-Brain-Tumor/mini_test/masks/M_240_SP_.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/Crystal-Clean-Brain-Tumor/mini_test_output/M_240_SP_.png\"\
  \ width=\"320\" height=\"auto\"></td>\n</tr>\n<tr>\n<td><img src=\"./projects/TensorFlowFlexUNet/Crystal-Clean-Brain-Tumor/mini_test/images/G_47_VF_.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/Crystal-Clean-Brain-Tumor/mini_test/masks/G_47_VF_.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/Crystal-Clean-Brain-Tumor/mini_test_output/G_47_VF_.png\"\
  \ width=\"320\" height=\"auto\"></td>\n</tr>\n<tr>\n<td><img src=\"./projects/TensorFlowFlexUNet/Crystal-Clean-Brain-Tumor/mini_test/images/P_487_RO_.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/Crystal-Clean-Brain-Tumor/mini_test/masks/P_487_RO_.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/Crystal-Clean-Brain-Tumor/mini_test_output/P_487_RO_.png\"\
  \ width=\"320\" height=\"auto\"></td>\n</tr>\n</table>\n<hr>\n<br>\n<h3>1  Dataset Citation</h3>\nThe\
  \ dataset used here was derived from <br><br>\n<a href=\"https://www.kaggle.com/datasets/mohammadhossein77/brain-tumors-dataset\"\
  >\n<b>Crystal Clean: Brain Tumors MRI Dataset</b> </a>.\n<br><br>\nThe following explanation was taken\
  \ from above web site.\n<br><br>\n<b>About Dataset</b><br>\n<b>Uncovering Knowledge: A Clean Brain Tumor\
  \ Dataset for Advanced Medical Research</b><br>\n<br>\n<b>Introduction</b><br>\n<ul>\n<li>This dataset,\
  \ available in RAR archive format, \nconsists of four classes, including three tumor classes (Pituitary,\
  \ Glioma and Meningioma) and one class representing normal brain MRI scans.\n</li>\n<li>\nThe strength\
  \ of this dataset in comparison with other releases across the Kaggle is the cleanness of data. \nIn\
  \ this regard, we subjected the initial dataset to a meticulous data cleaning pipeline. \nThis pipeline\
  \ involved several steps aimed at enhancing the dataset's integrity and usability.\n</li>\n<li>\nThe\
  \ initial data source for this dataset is the brain tumor classification MRI dataset, which can be accessed\
  \ at \nthis <a href=\"https://www.kaggle.com/datasets/sartajbhuvaji/brain-tumor-classification-mri\"\
  >link</a>.\n</li>\n</ul>\n<br>\n<b>Data Cleaning Process:</b><br>\n<ul>\n<li><b>Removal of Duplicate\
  \ Samples:</b>We employed an image vector comparison method to identify and remove duplicate samples,\
  \ \nensuring that each data point is unique.</li>\n<li><b>Correction of Mislabeled Images:</b>Using\
  \ our domain knowledge, we carefully inspected and corrected falsely \nlabeled images, ensuring that\
  \ they were appropriately categorized. \nThis step greatly enhances the accuracy of the dataset.</b></li>\n\
  <li><b>Image Resizing:</b> All images in the dataset were resized to a memory-efficient yet academically\
  \ accepted size of (224, 224), \nfacilitating easier processing and analysis.</li>\n</ul>\n<b>Statistics</b><br>\n\
  <ul>\n<li>Normal: 500</li>\n<li>Glioma: 926</li>\n<li>Meningioma: 937</li>\n<li>Pituitary: 901</li>\n\
  </ul>\n<br>\nAfter applying the data cleaning pipeline, the number of samples in each category decreased\
  \ on average by approximately 3-9%. <br>\nThis reduction ensures the data integrity while maintaining\
  \ a sufficient number of samples for comprehensive analysis.\n<br><br>\n<b>Acknowledgement</b><br>\n\
  <ul>\n<li>We would like to express our sincere gratitude to the original dataset publisher, \n<a href=\"\
  https://www.kaggle.com/sartajbhuvaji\">sartajbhuvaji</a>, for their valuable contribution.</li>\n<li>This\
  \ dataset is released under the CC0 license, making it open and accessible for everyone to use. \nWhile\
  \ not mandatory, citing the dataset would be greatly appreciated.</li>\n</ul>\n<br>\n<b>Important Note</b><br>\n\
  Those researchers who want to use this dataset for real world use cases, must consult with medical field\
  \ experts (radiologists, …) \non the ground truth of the labels and their usability for their angle\
  \ of research.\n<br><br>\n<b>License:</b><br>\n<a href=\"https://creativecommons.org/publicdomain/zero/1.0/\"\
  >CC0: Public Domain</a>\n<br><br>\n<h3>\n2 Crystal-Clean-Brain-Tumor ImageMask Dataset\n</h3>\n<h3>\n\
  2.1 Download ImageMask Dataset\n</h3>\n If you would like to train this Crystal-Clean-Brain-Tumor Segmentation\
  \ model by yourself,\nplease download our dataset <a href=\"https://drive.google.com/file/d/1VSlBczPJQi2K8TqHYsFoJgcTMy-HY5lc/view?usp=sharing\"\
  >\n<b>Crystal-Clean-Brain-Tumor-ImageMask-Dataset.zip</b>\n(<a href=\"https://creativecommons.org/publicdomain/zero/1.0/\"\
  >CC0: Public Domain</a>)\n</a> on the google drive,\nexpand the downloaded, and put it under <b>./dataset/</b>\
  \ to be.\n<pre>\n./dataset\n└─Crystal-Clean-Brain-Tumor\n    ├─test\n    │   ├─images\n    │   └─masks\n\
  \    ├─train\n    │   ├─images\n    │   └─masks\n    └─valid\n        ├─images\n        └─masks\n</pre>\n\
  <br>\n<b>Crystal-Clean-Brain-Tumor Statistics</b><br>\n<img src =\"./projects/TensorFlowFlexUNet/Crystal-Clean-Brain-Tumor/Crystal-Clean-Brain-Tumor_Statistics.png\"\
  \ width=\"512\" height=\"auto\"><br>\n<br>\nAs shown above, the number of images of train and valid\
  \ datasets is large enough to use for a training set of our segmentation model.\n<br><br>\n<h3>\n2.2\
  \ Derivation of Crystal-Clean-Brain-Tumor Dataset\n</h3>\nThe folder structure of the <b>Crystal-Clean-Brain-Tumor/Data</b>\
  \  is the following,\nbut it contains no annotation(mask) files,because it is an image classification\
  \ dataset.<br>\n<pre>\n./Data\n  ├─Normal\n  │   ├─N_1.jpg\n...\n  │   └─N_438_VF_.jpg\n  │\n  └─Tumor\n\
  \       ├─glioma_tumor\n       │   ├─G_1.jpg\n...\n            └─G_901_VF_.jpg\n       │           \
  \ \n       ├─meningioma_tumor\n       │   ├─M_1.jpg\n...\n            └─M_913_VF_.jpg\n       │\n  \
  \     └─pituitary_tumor\n            ├─P_1.jpg\n...\n            └─P_844_VF_.jpg\n</pre>\n<b>Step 1</b><br>\n\
  We generated a 256x256 pixsels PNG master Tumor dataset from the JPG files under all sub folders of\
  \ <b>Tumor</b>.\n<br><br>\n<b>Step 2</b><br>\nWe generated the first reference mask files corresponding\
  \ to the master images \nby applying an inference (segmentation) method of\na pretrained FlexUNet model\
  \ <a href=\"https://github.com/sarah-antillia/TensorFlow-FlexUNet-Image-Segmentation-BRISC2025-BrainTumor\"\
  >\nTensorFlow-FlexUNet-Image-Segmentation-BRISC2025-BrainTumor\n</a> to all master Tumor images.\n<br><br>\n\
  <b>Step 3</b><br>\nWe generated the first ImageMask Dataset by excluding unappropriate pairs of Tumor\
  \ images and the first reference masks.\n<br><br>\n<b>Step 4</b><br>\nWe generated the second reference\
  \ mask files corresponding to the master images \nby applying an inference (segmentation) method of\n\
  a pretrained FlexUNet model trained by the first ImageMask Dataset to all master Tumor images.\n<br><br>\n\
  <b>Step 5</b><br>\nWe finally generated a curated ImageMask Dataset from the pairs of master images\
  \ and the second reference masks, \nby excluding all black empty masks and their corresponding master\
  \ images.\n<br><br>\n<h3>\n2.3 Train Sample Images and Masks\n</h3>\n<b>Train_sample images</b><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/Crystal-Clean-Brain-Tumor/asset/train_images_sample.png\" width=\"\
  1024\" height=\"auto\">\n<br>\n<b>Train_sample_masks</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/Crystal-Clean-Brain-Tumor/asset/train_masks_sample.png\"\
  \ width=\"1024\" height=\"auto\">\n<br>\n<h3>\n3 Train TensorflowFlexUNet Model\n</h3>\n We trained\
  \ Crystal-Clean-Brain-Tumor TensorflowFlexUNet Model by using the \n<a href=\"./projects/TensorFlowFlexUNet/Crystal-Clean-Brain-Tumor/train_eval_infer.config\"\
  > <b>train_eval_infer.config</b></a> file. <br>\nPlease move to ./projects/TensorFlowFlexUNet/Crystal-Clean-Brain-Tumor\
  \ and run the following bat file.<br>\n<pre>\n>1.train.bat\n</pre>\n, which simply runs the following\
  \ command.<br>\n<pre>\n>python ../../../src/TensorFlowFlexUNetTrainer.py ./train_eval_infer.config\n\
  </pre>\n<hr>\n\n<b>Model parameters</b><br>\nDefined a small <b>base_filters=16</b> and a large <b>base_kernels=(9,9)</b>\
  \ for the first Conv Layer of Encoder Block of \n<a href=\"./src/TensorFlowFlexUNet.py\">TensorFlowFlexUNet.py</a>\
  \ \nand a large <b>num_layers=8</b> (including a bridge between Encoder and Decoder Blocks).\n<pre>\n\
  [model]\nimage_width    = 256\nimage_height   = 256\nimage_channels = 3\ninput_normalize = True\nnormalization\
  \  = False\nnum_classes    = 4\nbase_filters   = 16\nbase_kernels  = (9,9)\nnum_layers    = 8\ndropout_rate\
  \   = 0.05\ndilation       = (1,1)\n</pre>\n\n<b>Learning rate</b><br>\nDefined a small learning rate.\
  \  \n<pre>\n[model]\nlearning_rate  = 0.00007\n</pre>\n\n<b>Loss and metrics functions</b><br>\nSpecified\
  \ \"categorical_crossentropy\" and \"dice_coef_multiclass\".<br>\n<pre>\n[model]\nloss           = \"\
  categorical_crossentropy\"\nmetrics        = [\"dice_coef_multiclass\"]\n</pre>\n<b >Learning rate reducer\
  \ callback</b><br>\nEnabled learing_rate_reducer callback, and a small reducer_patience.\n<pre> \n[train]\n\
  learning_rate_reducer = True\nreducer_factor     = 0.5\nreducer_patience   = 4\n</pre>\n<b>Early stopping\
  \ callback</b><br>\nEnabled early stopping callback with patience parameter.\n<pre>\n[train]\npatience\
  \      = 10\n</pre>\n<b></b><br>\n<b>RGB color map</b><br>\nrgb color map dict for Crystal-Clean-Brain-Tumor\
  \ 1+3 classes.<br>\n<pre>\n[mask]\nmask_file_format = \".png\"\n;Crystal-Clean-Brain-Tumor 1+3\n;  \
  \                Meningioma:blue, Glioma:green, Pituitary tumor:red      \nrgb_map = {(0,0,0):0, (0,0,255):1,\
  \ (0,255,0):2, (255,0,0):3,}       \n</pre>\n<b>Epoch change inference callbacks</b><br>\nEnabled epoch_change_infer\
  \ callback.<br>\n<pre>\n[train]\nepoch_change_infer       = True\nepoch_change_infer_dir   =  \"./epoch_change_infer\"\
  \nepoch_changeinfer        = False\nepoch_changeinfer_dir    = \"./epoch_changeinfer\"\nnum_infer_images\
  \         = 6\n</pre>\nBy using this epoch_change_infer callback, on every epoch_change, the inference\
  \ procedure can be called\n for 6 images in <b>mini_test</b> folder. This will help you confirm how\
  \ the predicted mask changes \n at each epoch during your training process.<br> <br> \n<b>Epoch_change_inference\
  \ output at starting (1,2,3)</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/Crystal-Clean-Brain-Tumor/asset/epoch_change_infer_at_start.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n<br>\n<b>Epoch_change_inference output at middle-point (18,19,20)</b><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/Crystal-Clean-Brain-Tumor/asset/epoch_change_infer_at_middlepoint.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n<br>\n<b>Epoch_change_inference output at ending (37,38,39)</b><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/Crystal-Clean-Brain-Tumor/asset/epoch_chang"

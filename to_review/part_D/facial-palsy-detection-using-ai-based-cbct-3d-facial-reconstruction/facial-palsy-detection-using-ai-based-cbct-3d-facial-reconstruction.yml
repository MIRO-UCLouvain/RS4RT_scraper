readme_excerpt: '# Facial-Palsy-Detection-using-AI-based-CBCT-3D-Facial-Reconstruction

  # 3D Facial Palsy Analysis 🧠


  This project focuses on detecting and visualizing **facial palsy asymmetry** using **CBCT scans** and
  **3D facial reconstruction**.


  ## 🔍 Overview

  - Detects affected facial side (left/right)

  - Generates asymmetry heatmaps

  - Builds a 3D facial surface model (color-coded)

  - Provides severity classification (Mild / Moderate / Severe)


  ## 🧰 Tech Stack

  - Python

  - OpenCV

  - NumPy

  - Matplotlib / Plotly

  - Mediapipe (for facial landmarks)

  - CBCT data integration



readme_excerpt: "# PRISM: Probabilistic Reconstruction of Inhomogeneous Systems Methodology\n\n[![License:\
  \ MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](https://opensource.org/licenses/MIT)\n\
  [![Python 3.9+](https://img.shields.io/badge/python-3.9+-blue.svg)](https://www.python.org/downloads/)\n\
  [![Code Style: Black](https://img.shields.io/badge/code%20style-black-000000.svg)](https://github.com/psf/black)\n\
  \n**PRISM** is a Bayesian framework designed to bridge the gap between physical dosimetry and radiobiological\
  \ response in complex, spatially inhomogeneous radiation fields (e.g., Laser-Driven Ion Acceleration,\
  \ FLASH radiotherapy, Grid therapy).\n\nUnlike traditional methods that assume a uniform dose, PRISM\
  \ reconstructs the full 3D dose distribution from sparse measurements and propagates dosimetric uncertainties\
  \ into biological models using an *Error-in-Variables* approach.\n\n## Key Features\n\n* **☢️ Precision\
  \ Dosimetry:** Gafchromic film processing with multi-channel correction and artifact cleaning (bFDR).\n\
  * **\U0001F3B2 Bayesian Reconstruction:** 3D volume reconstruction from sparse 2D films using Gaussian\
  \ Processes.\n* **\U0001F9EC Biological Modeling:** * **Cell Survival:** Linear-Quadratic (LQ) model\
  \ with dose uncertainty correction.\n    * **In-Vivo (Zebrafish):** Voxel-integrated Weibull survival\
  \ models for complex organisms.\n* **\U0001F4CA Statistical Rigor:** RBE calculation, LOO model comparison,\
  \ and Prior Sensitivity Analysis.\n\n## Installation\n\n```bash\ngit clone [https://github.com/yourusername/PRISM-Framework.git](https://github.com/yourusername/PRISM-Framework.git)\n\
  cd PRISM-Framework\npip install -r requirements.txt\n\n**Quick Start**\n\nHere is a minimal example\
  \ of how to reconstruct a 3D dose volume:\n\nfrom prism.reconstruction import Bayesian3DVolumeReconstructor\n\
  \n# 1. Initialize Reconstructor\nrecon = Bayesian3DVolumeReconstructor(pdd_folder=\"data/processed\"\
  )\n\n# 2. Build 3D Volume from 2D films\nrecon.build_volume(roi_size_mm=40.0, z_res_mm=0.2)\n\n# 3.\
  \ Save result\nrecon.save_volume(\"results/volume.npz\")\n\n**Documentation**\n\nFor detailed step-by-step\
  \ instructions, please refer to the User Manual:\n\n**Citation**\n\n    Polanek Róbert et al. (2024).\
  \ PRISM: A Bayesian framework... [Journal]\n\nLicense\n\nMIT License"

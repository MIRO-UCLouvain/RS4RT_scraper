readme_excerpt: "# Head and Neck Cancer Radiotherapy Analysis\nExploratory Data Analysis of head and neck\
  \ cancer patients using Python, pandas and statistical analysis.\n## Project Overview\nThis project\
  \ presents an EDA of a dataset of patients diagnosed with head and neck cancer and how some clinical\
  \ characteristics are associated with treatment decisions and patients outcomes through statistical\
  \ analysis in Python.\n## Notebook Contents\n- Project Overview\n- Data Cleaning\n- Cohort Characteristics\n\
  - Patient Characterísitcs\n- Tumour Characteristics\n- Treatment Charactersistics\n- Exploratory Data\
  \ Analysis\n    - HPV Analysis\n    - Tumour Stage Analysis\n    - Smoking Analysis\n    - Outcomes\n\
  - Conclusions\n## Tools\n- Python\n- pandas\n- NumPy\n- Matplotlib\n- SciPy\n  \n## Data Source\n\n\
  The dataset used in this project is part of the publicly available **RADCURE** dataset.\n\nFor more\
  \ information:\n- [https://www.radcure.ca/](https://aapm.onlinelibrary.wiley.com/doi/10.1002/mp.16972)\n\
  \nPlease refer to the original publication for citation and licensing information.\n\n** The complete\
  \ analysis is available in this repository. **\n"

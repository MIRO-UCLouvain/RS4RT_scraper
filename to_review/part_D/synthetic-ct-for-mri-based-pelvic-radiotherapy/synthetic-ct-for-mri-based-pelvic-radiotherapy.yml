readme_excerpt: "# Synthetic-CT-for-MRI-based-Pelvic-Radiotherapy\nThis repository contains the implementation\
  \ and evaluation of three deep learning models for generating synthetic CT (sCT) from MRI scans, designed\
  \ to assist radiotherapy planning while reducing patient radiation exposure.\n\n## Project Overview\n\
  Modern radiotherapy heavily relies on CT images for dose planning and anatomical localization. However,\
  \ CT involves ionizing radiation. To eliminate this exposure while preserving critical imaging information,\
  \ we propose a MRI-only workflow by generating synthetic CT images (sCT) using deep learning.\nThis\
  \ project compares three model architectures for MR-to-CT synthesis:\n-  Pix2Pix (GAN-based)\n-  MSEP\
  \ (U-Net + Swin Transformer hybrid)\n\n## Methodology\n1. Pix2Pix (cGAN)\n   - Image-to-image translation\
  \ using conditional GAN with LSGAN loss.\n   - L1 loss (MAE) encourages pixel-level similarity and reduces\
  \ image blur.\n   - Best overall performance in SSIM and PSNR.\n2. MSEP (Multi-scale Structure Extraction\
  \ and Preservation.)\n   - Combines 3D U-Net with Swin Transformer blocks in skip connections.\n\n###\
  \ References\nThis work is based on open-source models and the SynthRAD2023 dataset. \n"

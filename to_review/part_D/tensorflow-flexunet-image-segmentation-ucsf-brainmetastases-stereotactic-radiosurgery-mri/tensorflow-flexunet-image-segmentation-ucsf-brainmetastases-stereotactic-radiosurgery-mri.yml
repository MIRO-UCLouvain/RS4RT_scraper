readme_excerpt: "<h2>TensorFlow-FlexUNet-Image-Segmentation-UCSF-BrainMetastases-Stereotactic-Radiosurgery-MRI\
  \ (2025/09/17)</h2>\n\nToshiyuki Arai<br>\nSoftware Laboratory antillia.com<br>\n<br>\nThis is the first\
  \ experiment of Image Segmentation for <b>The University of California San Francisco Brain Metastases\
  \ \nStereotactic Radiosurgery MRI</b> based on \nour <a href=\"./src/TensorFlowFlexUNet.py\">TensorFlowFlexUNet</a>\n\
  \ (<b>TensorFlow Flexible UNet Image Segmentation Model for Multiclass</b>)\n, and a 512x512 pixels\
  \ PNG dataset which was derived by us from \n<a href=\"https://imagingdatasets.ucsf.edu/dataset/1\"\
  >\n<b>The University of California San Francisco Brain Metastases Stereotactic Radiosurgery (UCSF-BMSR)\
  \ MRI Dataset</b></a>\n<br><br>\nAs demonstrated in <a href=\"https://github.com/sarah-antillia/TensorFlow-FlexUNet-Image-Segmentation-STARE-Retinal-Vessel\"\
  >\nTensorFlow-FlexUNet-Image-Segmentation-STARE-Retinal-Vessel</a> ,\n our Multiclass TensorFlowFlexUNet,\
  \ which uses categorized masks, can also be applied to \nsingle-class image segmentation models. \n\
  This is because it inherently treats the background as one category and your single-class mask data\
  \ as \na second category. In essence, your single-class segmentation model will operate with two categorized\
  \ classes within our Multiclass UNet framework.\n<br>\n<br>\n<hr>\n<b>Actual Image Segmentation for\
  \ Images of 512x512 pixels</b><br>\nAs shown below, the inferred masks predicted by our segmentation\
  \ model trained on the \nPNG dataset appear similar to the ground truth masks.<br><br>\n<table>\n<tr>\n\
  <td><img src=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/asset/seg_result_header.png\" width=\"\
  960\" height=\"auto\"></td>\n\n<!--\n<th>Input: image</th>\n<th>Mask (ground_truth)</th>\n<th>Prediction:\
  \ inferred_mask</th>\n -->\n</tr>\n<tr>\n\n<td><img src=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/asset/summary_seg_result.png\"\
  \ width=\"960\" height=\"auto\"></td>\n<!--\n\n<td><img src=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/mini_test/images/100103A_1060.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/mini_test/masks/100103A_1060.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/mini_test_output/100103A_1060.png\"\
  \ width=\"320\" height=\"auto\"></td>\n</tr>\n</tr>\n<td><img src=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/mini_test/images/100104A_1081.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/mini_test/masks/100104A_1081.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/mini_test_output/100104A_1081.png\"\
  \ width=\"320\" height=\"auto\"></td>\n</tr>\n<tr>\n<td><img src=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/mini_test/images/100412A_1056.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/mini_test/masks/100412A_1056.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/mini_test_output/100412A_1056.png\"\
  \ width=\"320\" height=\"auto\"></td>\n -->\n</tr>\n</table>\n\n<hr>\n<br>\n\n<h3>1 Dataset Citation</h3>\n\
  The dataset used here was obtained from\n<br><br>\n<a href=\"https://imagingdatasets.ucsf.edu/dataset/1\"\
  >\n<b>The University of California San Francisco Brain Metastases Stereotactic Radiosurgery (UCSF-BMSR)\
  \ MRI Dataset</b></a>\n<br><br>\n<b>Description</b><br>\nThe University of California San Francisco\
  \ Brain Metastases Stereotactic Radiosurgery (UCSF-BMSR) dataset is a public,\n clinical, multimodal\
  \ brain MRI dataset consisting of 560 brain MRIs from 412 patients with expert \n annotations of 5136\
  \ brain metastases. Data consists of registered and skull stripped T1 post-contrast, T1 pre-contrast,\n\
  \  FLAIR and subtraction (T1 pre-contrast - T1 post-contrast) images and voxelwise segmentations of\n\
  \   enhancing brain metastases in NifTI format. The dataset also includes patient demographics, \n \
  \  surgical status and primary cancer types. Currently 461 exams are available for download at the \n\
  \   UCSF center for Intelligent Imaging website. The remaining data will become available after the\
  \ \n   2024 MICCAI/BraTS challenge. The UCSF-BSMR has been made publicly available in the hopes that\
  \ researchers \n   will use these data to push the boundaries of AI applications for brain metastases.\n\
  <br>\n<br>\nFor more information on the pretrained models for segmentation and skull stripping please\
  \ \nvisit: https://github.com/rachitsaluja/UCSF-BMSR-benchmarks\n<br>\n<br>\n<b>Authors</b><br>\nJeffrey\
  \ D. Rudie MD PhD, Rachit Saluja MSE, David A. Weiss MSE, Pierre Nedelec, \nEvan Calabrese MD PhD, John\
  \ B. Colby MD PhD, Benjamin Laguna MD, John Mongan MD PhD, \nSteve Braunstein MD PhD, Christopher P.\
  \ Hess MD PhD, Andreas M. Rauschecker MD PhD, \nLeo P. Sugrue MD PhD, Javier E. Villanueva-Meyer MD\n\
  <br>\n<br>\n<b>How to Cite</b><br>\n<li><a href=\"https://arxiv.org/abs/2304.07248\">https://arxiv.org/abs/2304.07248</a></li>\n\
  <li><a href=\"https://pubs.rsna.org/doi/10.1148/ryai.230126\">https://pubs.rsna.org/doi/10.1148/ryai.230126</a></li>\n\
  <br>\n<b>DOI</b><br>\ndoi:10.58078/C24W2K\n<br>\n<br>\n<b>Version</b><br>\n1.3\n<br>\n<br>\n<h3>\n2\
  \ UCSF-BrainMetastases ImageMask Dataset\n</h3>\n<h3>2.1 ImageMask Dataset Generation</h3>\n If you\
  \ would like to train this UCSF-BrainMetastases Segmentation model by yourself,\n you have to generate\
  \ the PNG dataset by using the following Python scripts:\n <br><br>\n<li><a href=\"./generator/ImageMaskDatasetGenerator.py\"\
  >ImageMaskDatasetGenerator.py</a></li>\n<li><a href=\"./generator/split_master.py\">split_master.py</a></li>\n\
  <br>\n\nThe files and folders to generate the dataset will take the following structure:<br>\n<pre>\n\
  ./generetor\n ├─ImageMaskDatasetGeneratory.py\n ├─split_master.py\n └─UCSF_BrainMetastases_v1.3 \n \
  \      └─UCSF_BRAINMETASTASES_TRAIN \n</pre>\n<br>\n The first generator script generates a master image\
  \ and mask dataset\nof 512x512 pixels PNG format from <b>100*_seg.nii.gz</b> and <b>100*_T1post.nii.gz</b>\n\
  \ in subfolder under UCSF_BRAINMETASTASES_TRAIN folder.\nBy changing a few lines in the generator, you\
  \ can create a different type of image and mask dataset\nfrom this.<br>\n<br>\n<pre>\n./UCSF_BRAINMETASTASES_TRAIN\n\
  \ ├─100101A\n │   ├─100101A_seg.nii.gz\n │   └─100101A_T1post.nii.gz\n ├─100102A\n │   ├─100102A_seg.nii.gz\n\
  \ │   └─100102A_T1post.nii.gz\n...\n └─100414B\n      ├─100414B_seg.nii.gz\n      └─100414B_T1post.nii.gz\n\
  </pre>\n The second splitter simply splits the master into test, train and valid subsets. <br>\n\nBy\
  \ running these Python scripts, finally a 512x512 pixels PNG UCSF-BrainMetastases dataset will be \n\
  created under <b>dataset</b> folder as shown below.<b></b>.  \n\n<pre>\n./dataset\n└─UCSF-BrainMetastases\n\
  \    ├─test\n    │   ├─images\n    │   └─masks\n    ├─train\n    │   ├─images\n    │   └─masks\n   \
  \ └─valid\n        ├─images\n        └─masks\n</pre>\n<b>UCSF-BrainMetastases Statistics</b><br>\n<img\
  \ src =\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/UCSF-BrainMetastases_Statistics.png\" width=\"\
  512\" height=\"auto\"><br>\n<br>\nAs shown above, the number of images of train and valid datasets is\
  \ large enough to use for a training set of our segmentation model.\n<br><br>\n<b>You may not redistribute\
  \ this PNG dataset generated from UCSF-BMSR MRI Dataset, and \ncommercial use of this dataset is prohibited.</b>\
  \ <br>\n<br>\n\n<h3>2.2 Mini-test Dataset Generation</h3>\n\nYou also have to generate a <b>mini_test</b>\
  \ dataset from <b>UCSF-BrainMetastases/test</b> subset by yourself, \ndepending on your choices,\nwhich\
  \ can be used in EpochChangeInferencer Callback and an actual segmentation (predictioin) process.\n\
  <br>\n<pre>\n./projects\n└─TensorflowFlexUNet\n       └─UCSF-BrainMetastases\n             └─mini_test\n\
  \                ├─images\n                └─masks\n</pre>\n<!--\n<b>You may not redistribute your own\
  \ mini_test dataset.</b><br>\n-->\n<br>\n<br>\n<h3>2.3 Tran Images and Masks Sample </h3>\n<b>Train_images_sample</b><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/asset/train_images_sample.png\" width=\"\
  1024\" height=\"auto\">\n<br>\n<b>Train_masks_sample</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/asset/train_masks_sample.png\"\
  \ width=\"1024\" height=\"auto\">\n<br>\n<br>\n<h3>\n3 Train TensorFlowUNet Model\n</h3>\n We have trained\
  \ UCSF-BrainMetastases TensorFlowUNet Model by using the following\n<a href=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/train_eval_infer.config\"\
  > <b>train_eval_infer.config</b></a> file. <br>\nPlease move to ./projects/TensorFlowFlexUNet/UCSF-BrainMetastasesand,\
  \ and run the following bat file.<br>\n<pre>\n>1.train.bat\n</pre>\n, which simply runs the following\
  \ command.<br>\n<pre>\n>python ../../../src/TensorFlowUNetTrainer.py ./train_eval_infer.config\n</pre>\n\
  <hr>\n\n<b>Model parameters</b><br>\nDefined a small <b>base_filters = 16</b> and large <b>base_kernels\
  \ = (7,7)</b> for the first Conv Layer of Encoder Block of \n<a href=\"./src/TensorFlowUNet.py\">TensorFlowUNet.py</a>\
  \ \nand a large num_layers (including a bridge between Encoder and Decoder Blocks).\n<pre>\n[model]\n\
  image_width    = 512\nimage_height   = 512\nimage_channels = 3\n\nnum_classes    = 2\n\nbase_filters\
  \   = 16\nbase_kernels   = (7,7)\nnum_layers     = 8\ndropout_rate   = 0.04\ndilation       = (1,1)\n\
  \n</pre>\n\n<b>Learning rate</b><br>\nDefined a very small learning rate.  \n<pre>\n[model]\nlearning_rate\
  \  = 0.00007\n</pre>\n\n<b>Online augmentation</b><br>\nDisabled our online augmentation.  \n<pre>\n\
  [model]\nmodel         = \"TensorFlowUNet\"\ngenerator     = False\n</pre>\n\n<b>Loss and metrics functions</b><br>\n\
  Specified \"categorical_crossentropy\" and <a href=\"./src/dice_coef_multiclass.py\">\"dice_coef_multiclass\"\
  </a>.<br>\nYou may specify other loss and metrics function names.<br>\n<pre>\n[model]\nloss        \
  \   = \"categorical_crossentropy\"\nmetrics        = [\"dice_coef_multiclass\"]\n</pre>\n<b>Learning\
  \ rate reducer callback</b><br>\nEnabled learing_rate_reducer callback, and a small reducer_patience.\n\
  <pre> \n[train]\nlearning_rate_reducer = True\nreducer_factor     = 0.5\nreducer_patience   = 4\n</pre>\n\
  \n<b>Early stopping callback</b><br>\nEnabled early stopping callback with patience parameter.\n<pre>\n\
  [train]\npatience      = 10\n</pre>\n\n<b>RGB Color map</b><br>\nrgb color map dict for UCSF-BrainMetastases\
  \ 1+1 classes.\n<pre>\n[mask]\nmask_datatype    = \"categorized\"\nmask_file_format = \".png\"\n\n;\
  \     Background   UCSF-BrainMetastases: white \nrgb_map = {(0,0,0):0,(255, 255, 255):1,}\n</pre>\n\n\
  <b>Epoch change inference callback</b><br>\nEnabled <a href=\"./src/EpochChangeInferencer.py\">epoch_change_infer\
  \ callback (EpochChangeInferencer.py)</a></b>.<br>\n<pre>\n[train]\nepoch_change_infer       = True\n\
  epoch_change_infer_dir   =  \"./epoch_change_infer\"\nnum_infer_images         = 6\n</pre>\n\nBy using\
  \ this callback, on every epoch_change, the inference procedure can be called\n for 6 images in <b>mini_test</b>\
  \ folder. This will help you confirm how the predicted mask changes \n at each epoch during your training\
  \ process.<br> <br> \n\n<b>Epoch_change_inference output at starting (epoch 1,2,3)</b><br>\n<img src=\"\
  ./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/asset/epoch_change_infer_at_start.png\" width=\"\
  1024\" height=\"auto\"><br>\n<br>\n<b>Epoch_change_inference output at middlepoint (epoch 15,16,17)</b><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/asset/epoch_change_infer_at_middlepoint.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n<br>\n\n<b>Epoch_change_inference output at ending (epoch 32,33,34)</b><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/asset/epoch_change_infer_at_end.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n<br>\n\n\nIn this experiment, the training process was terminated\
  \ at epoch 34.<br><br>\n<img src=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/asset/train_console_output_at_epoch34.png\"\
  \ width=\"720\" height=\"auto\"><br>\n<br>\n\n<a href=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/eval/train_metrics.csv\"\
  >train_metrics.csv</a><br>\n<img src=\"./projects/TensorFlowFlexUNet/UCSF-BrainMetastases/eval/train_metrics.png\"\
  \ width=\"520\" height=\"auto\"><"

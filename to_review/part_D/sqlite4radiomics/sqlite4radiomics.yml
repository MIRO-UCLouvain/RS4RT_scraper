readme_excerpt: "**Repository location moved! Please check [https://github.com/MaastrichtU-CDS/projects_image-standardization-and-domain-adaptation_SQLite4Radiomics](https://github.com/MaastrichtU-CDS/projects_image-standardization-and-domain-adaptation_SQLite4Radiomics)**\n\
  # SQLite4Radiomics\n\n*You can access the docs at https://sqlite4radiomics.rtfd.io and the paper at\
  \ https://doi.org/10.1016/j.phro.2021.09.007*\n\nSQLite4Radiomics is an integration project of the popular\
  \ PACS software *Conquest DICOM* with radiomics extraction package *pyradiomics* \n\n## Getting Started\n\
  \nThese instructions will get you a copy of the project up and running on your local machine for usage\
  \ and or development purposes. Make sure to check the [Software User Manual](https://github.com/Maastro-CDS-Imaging-Group/SQLite4Radiomics/blob/master/radiomicsfeatureextractionpipeline/Software%20User%20Manual.pdf)\
  \ included in the project.\n\nPrior to using SQLite4Radiomics, we recommend to learn more about [*pyradiomics*](https://pyradiomics.readthedocs.io/en/latest/)\
  \ and [*The Image Biomarker Standardization Initiative*](https://pubs.rsna.org/doi/full/10.1148/radiol.2020191145).\
  \ In order to understand how pyradiomics feature extraction is customized, please refer to [*pyradiomics\
  \ customization*](https://pyradiomics.readthedocs.io/en/latest/customization.html). Once you have made\
  \ yourself familiar with these sources, you are better equipped to run radiomic analyses and customize\
  \ pyradiomics extraction settings by the Parameter file modifications according to your needs.\n\n###\
  \ Prerequisites\n\nSQLite4Radiomics was originally written for Windows 10 platform. It should in principle,\
  \ also work on windows 7/8/8.1. Other platforms are not fully supported.\n\n#### Python\n\nGo to https://www.python.org/downloads/release/python-365/\
  \ and download the appropriate installer for your system.\nNOTE: Make sure that you choose the option\
  \ during installation to add python to the Path.\n\n#### NodeJs\nGo to https://nodejs.org/en/ and download\
  \ the appropriate installer for your system.\nFollow the necessary steps to install NodeJs.\n\n\n###\
  \ Installation\n1. Clone the git repository with\n\n```\ngit clone https://github.com/Maastro-CDS-Imaging-Group/SQLite4Radiomics.git\n\
  ```\n\n\n2. Go to the folder `radiomicsfeatureextractionpipeline` and run the `Setup.bat` file. This\
  \ will make sure that:\n\n* The paths that Conquest uses, matches the current location on your machine\n\
  \n* Creates the necessary virtual environment and installs the necessary python packages\n\n* Installs\
  \ necessary node packages\n\nYou should see a command prompt window pop up and go through the installation\
  \ of the necessary packages.\n\nIf when running this file, the command prompt window immediately closes\
  \ after execution (no package installation could be seen), then check the Troubleshooting section below.\n\
  \n\n### Usage\n\n#### Setting up your data\nGo to the `conquest` folder and run `ConquestDICOMServer.exe`\n\
  \nWhen Conquest is running, go to the `data` folder and open the `incoming` folder within. Drop your\
  \ DICOM files here while Conquest is running. \n\n#### Running the tool\n\nRun the `Sqlite4Radiomics.bat`\
  \ file to start up the tool.\n\n## Troubleshooting\n### Python 2\n\nIf you have python 2.x installed,\
  \ this could lead to some problems when setting up the tool. If you get any errors when running Setup.bat,\
  \ please find your python installation, usually at (or something similar):\n```\nC:\\Users\\username\\\
  AppData\\Local\\Programs\\Python\\Python36\n```\n(note that username should be the name of the profile\
  \ on your machine)\n\n\nIn this folder there is a `Python.exe` file. Make a copy of this file and rename\
  \ it to `Python3.exe`\n\nIn the folder where the Sqlite4Radiomics is located, there is a scripts folder.\
  \ Within, you can find a batch file named `venv-setup.bat`.\n\nOpen this file in edit mode and substitute\
  \ the `py -3.6` with `python3`. Save and close the file. The Setup.bat file should now be able to run\
  \ without any further complications.\n\n### Terminal Errors\n\nIf you modify the configuration file\
  \ and something goes wrong, the terminal should show that an error has occurred. All that needs to be\
  \ done is to restore your configuration file. This can be done either in the interface. \n\nIf this\
  \ doesn’t work, go to `backend\\resources\\backups` where you should find the default and previous versions\
  \ of the files that can be modified. Copy the file you need into the resources folder, rename it to\
  \ the correct name and delete the bad file.\n\nIf your problem is not related to the above-mentioned\
  \ reasons, it is advised that you “re-install” the tool or contact an IT specialist.\n\n### CSV and\
  \ Logs\n\nIf you want to find your output csv files yourself instead of downloading them, these can\
  \ be found in `backend\\out`. \n\nSimilarly, log files can be found in `backend\\logs`.\n\n## Built\
  \ With\n\n* [Angular](https://angular.io/docs) - The frontend framework used, typescript base\n\n* [DJango](https://docs.djangoproject.com/en/3.0/)\
  \ - The backend framework used, python based\n\n* [Electron](https://www.electronjs.org/docs) - Framework\
  \ used for the desktop client, javascript based\n\n* [Conquest DICOM](https://ingenium.home.xs4all.nl/dicom.html)\
  \ - Database and DICOM\n\n## Contributing\n\nWe will not be keeping active management of the master\
  \ branch and therefore will not be handling pull requests, as the norm. You can, however, fork and work\
  \ on your own version of the tool with any improvements or variations you see fit.\n\n## Authors and\
  \ citation\n\n* **Ivan Zhovannik** - *Initial idea, pipeline development, testing, and benchmarking*\
  \ - Radboudumc Radiation Oncology department & [Maastro Clinic CDS Imaging group](https://github.com/Maastro-CDS-Imaging-Group)\n\
  * **Suraj Pai** - *Pipeline development, testing, and benchmarking* - Maastricht University & [Maastro\
  \ Clinic CDS Imaging group](https://github.com/Maastro-CDS-Imaging-Group)\n* **Talia Santos** - *GUI\
  \ and production development* - Radboudumc Radiation Oncology department & Fontys University of Applied\
  \ Sciences\n* **Lars L.G. van Driel** - *Pipeline development* - Radboudumc Radiation Oncology department\
  \ & Fontys University of Applied Sciences\n* **Andre Dekker**, **Rianne Fijten**, **Alberto Traverso**\
  \ - *Clinical support and medical imaging* - Maastro Clinic Clinical Data Science\n* **Johan Bussink**\
  \ - *Clinical support* - Radboudumc Radiation Oncology department\n* **René Monshouwer** - *Principle\
  \ Investigator* - Radboudumc Radiation Oncology department\n\n#### Citation:\n\nIvan Zhovannik, Suraj\
  \ Pai, Talia A. da Silva Santos, Lars L.G. van Driel, Andre Dekker, Rianne Fijten, Alberto Traverso,\
  \ Johan Bussink, René Monshouwer,\nRadiomics integration into a picture archiving and communication\
  \ system,\nPhysics and Imaging in Radiation Oncology,\nVolume 20,\n2021,\nPages 30-33,\nISSN 2405-6316,\n\
  https://doi.org/10.1016/j.phro.2021.09.007.\n(https://www.sciencedirect.com/science/article/pii/S2405631621000579)\n\
  Abstract:  Radiomics is referred to as quantitative imaging of biomarkers used for clinical outcome\
  \ prognosis or tumor characterization. In order to bridge radiomics and its clinical application, we\
  \ aimed to build an integrated solution of radiomics extraction with an open-source Picture Archiving\
  \ and Communication System (PACS). The integrated SQLite4Radiomics software was tested in three different\
  \ imaging modalities and its performance was benchmarked in lung cancer open datasets RIDER and MMD\
  \ with median extraction time of 10.7 (percentiles 25–75: 8.9–18.7) seconds per ROI in three different\
  \ configurations.\nKeywords: Radiomics; Conquest DICOM; PACS\n\n## License\n\nThis project is licensed\
  \ under the Apache License - see the [LICENSE.md](LICENSE.md) file for details\n\nCopyright (c) 2020\
  \ University of Manchester. Developed by Marcel van Herk, Lambert Zijp and Jan Meinders; the Netherlands\
  \ Cancer Institute; Radiotherapy Department; maintained by Marcel van Herk, University of Manchester.\n\
  \nCopyright (c) 1995 Regents of the University of California. All rights reserved. Developed by: Mark\
  \ Oskin, mhoskin@ucdavis.edu; University of California, Davis Medical Center; Department of Radiology\
  \ with a Solaris port done and maintained by: Terry Rosenbaum; Michigan State University; Department\
  \ of Radiology.\n\n## Acknowledgments\n\nThe contributors would like to thank \n* The IBSI, 3D slicer\
  \ and pyradiomics communities for providing valuable feedback on radiomics side of the project;\n* Marcel\
  \ van Herk for keeping the support of Conquest DICOM;\n* plastimatch for making DICOM RT -> NRRD translation\
  \ reproducible.\n\n"

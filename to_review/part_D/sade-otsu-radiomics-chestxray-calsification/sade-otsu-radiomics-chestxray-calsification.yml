readme_excerpt: "# Medical Image Segmentation and Classification using Multi-Otsu Optimization and Radiomics\n\
  \nThis repository contains a comprehensive pipeline for the segmentation, feature extraction, and classification\
  \ of medical images, specifically targeting **Brain MRI** and **Chest X-Ray** datasets. \n\nThe core\
  \ of the segmentation approach relies on Multi-level Otsu thresholding optimized via metaheuristic algorithms,\
  \ such as Differential Evolution (DE) and unconstrained Self-Adaptive Differential Evolution (uSADE).\
  \ This is followed by radiomic feature extraction and evaluation using a Support Vector Machine (SVM)\
  \ classifier.\n\n## \U0001F680 Features\n\n* **Advanced Segmentation**: Utilizes optimized Multi-Otsu\
  \ thresholding to segment regions of interest in complex medical images.\n* **Metaheuristic Optimization**:\
  \ Implements optimization algorithms (like DE and uSADE) to efficiently find optimal thresholds.\n*\
  \ **Radiomic Feature Extraction**: Extracts meaningful quantitative features from the segmented images,\
  \ including GLCM (Gray-Level Co-occurrence Matrix) features, area, and other statistical properties.\n\
  * **Machine Learning Classification**: Employs a linear SVM classifier with Repeated Stratified K-Fold\
  \ cross-validation to robustly evaluate the predictive power of the extracted radiomics.\n* **Statistical\
  \ Analysis**: Performs rigorous statistical testing (e.g., Friedman and Nemenyi tests) to compare the\
  \ performance across different threshold levels and optimization techniques.\n\n## \U0001F4CA Datasets\
  \ Supported\n\nThe project is structured to seamlessly process two main categories of medical images:\n\
  \n1. **Brain X-Ray / MRI (`dataset/Brain-X-Ray`)**:\n   * Alzheimer MRI Preprocessed Dataset\n   * Brain\
  \ Stroke CT Dataset\n   * Brain Tumor MRI Dataset\n\n2. **Thorax / Chest X-Ray (`dataset/Torax-X-Ray`)**:\n\
  \   * Chest X-Ray COVID-19\n   * Chest X-Ray Pneumonia\n   * Chest X-Ray Tuberculosis\n\n## ⚙️ Workflow\
  \ Overview\n\nThe system operates in two primary phases:\n\n### Phase 1: Segmentation and Feature Extraction\n\
  1. Load the corresponding datasets (Thorax or Brain).\n2. Separate the dataset into classes (e.g., Healthy\
  \ vs. Pathological).\n3. For each image:\n   - Convert to grayscale and compute the histogram.\n   -\
  \ Apply Multi-Otsu optimization using uSADE / DE to determine $D$ optimal thresholds.\n   - Generate\
  \ the segmented image.\n   - Extract radiomic characteristics.\n4. Save the extracted features into\
  \ structured CSV files.\n\n### Phase 2: Classification and Evaluation\n1. Load the generated Radiomics\
  \ CSV files.\n2. Split the data using Repeated Stratified K-Fold cross-validation.\n3. Standardize the\
  \ data using `StandardScaler`.\n4. Train a Linear SVM classifier.\n5. Evaluate model performance using\
  \ metrics such as **Accuracy**, **F1-Score**, and **AUC**.\n6. Conduct statistical tests (Friedman and\
  \ Nemenyi) to evaluate significance.\n7. Generate visual results, plots, and comparative tables.\n\n\
  ## \U0001F6E0️ Usage\n\nThe repository includes specific controller scripts to handle the different\
  \ datasets:\n- Run `datasets_brain.py` to execute the pipeline on the Brain MRI datasets.\n- Run `datasets_torax.py`\
  \ to execute the pipeline on the Chest X-Ray datasets.\n- Run `clasificacion.py` for training the SVM\
  \ and evaluating the extracted features.\n\n*(Additional scripts like `ejemplos_segmentacion.py` are\
  \ provided to visualize the segmentation process independently.)*\n\n## \U0001F4DD License\n\nPlease\
  \ refer to the repository for more details regarding licensing and usage conditions.\n"

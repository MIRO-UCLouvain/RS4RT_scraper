readme_excerpt: "# BraTS2020 nnU-Net Radiomics Pipeline\n\nReproducible end-to-end pipeline for glioma\
  \ segmentation and radiomic analysis\nusing **nnU-Net v2** on the **BraTS2020** dataset.\n\n## Overview\n\
  This repository provides:\n- Automated 3D glioma segmentation (nnU-Net v2)\n- Ensemble inference across\
  \ 5-fold cross-validation\n- Radiomic feature extraction (WT, TC, ET)\n- Downstream analysis pipelines\
  \ (clustering, classification, survival-ready)\n\n## Dataset\n- **BraTS2020** (369 training cases)\n\
  - Multi-parametric MRI: FLAIR, T1, T1CE, T2\n\n> ⚠️ Due to dataset licensing, **no imaging data or trained\
  \ models are shared**.\n\n## Status\n- Segmentation training: ✅ Complete  \n- Inference (369 cases):\
  \ ✅ Complete  \n- Radiomics extraction: ⏳ In progress  \n- Analysis pipeline: \U0001F680 Ready  \n\n\
  **In Progress** – Manuscript in preparation for publication\n\n## Reproducibility\nAll preprocessing,\
  \ training, and analysis steps are fully documented.\nThis repository is intended for research reproducibility\
  \ and peer review.\n\n## Citation\nIf you use this work, please cite the relevant nnU-Net and BraTS\
  \ publications.\n\n---\n\n**Author:** Anna Marie P. Benzon  \nPhD in Artificial Intelligence, University\
  \ of the Philippines  \n\U0001F4E7 apbenzon@up.edu.ph\n"

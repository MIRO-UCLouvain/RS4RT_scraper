readme_excerpt: "# R²-Gaussian Thesis Docs\n\nThis repository hosts the MkDocs-based documentation for\
  \ my Bachelor's thesis on the **R²-Gaussian cone-beam CT reconstruction algorithm** by Zha et al.\n\n\
  **Live Documentation:**  \nhttps://manjas78.github.io/r2-gaussian-thesis-docs/\n\nThe site includes:\n\
  - Installation & environment setup  \n- Reconstruction pipeline (FDK & R²-Gaussian)  \n- Data preparation\
  \ and evaluation routines  \n- Condensed results from phantom, Digimouse, and preclinical datasets \
  \ \n\nThe documentation is built with **MkDocs + Material Theme** and deployed automatically via **GitHub\
  \ Pages**.\n"

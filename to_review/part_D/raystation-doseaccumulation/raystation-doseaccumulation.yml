readme_excerpt: "# Raystation_DoseAccumulation\n\nLegacy RayStation clinical-scripting launcher from Brian\
  \ Anderson's time at UNC Health Care, associated with a deformable-registration dose accumulation workflow.\
  \ Not maintained (last update 2023).\n\n## What is actually in this repo\n\nThe repository contains\
  \ a single launcher stub, `main.py`. It does not itself perform\ndeformable registration or dose accumulation.\
  \ Instead it:\n\n1. Connects to RayStation via the scripting API (`from connect import *`).\n2. Uses\
  \ a `UncScriptInit` helper (kept alongside `FindFunc.py` in the departmental \"DB\n   directory\", not\
  \ in this repo) to resolve the production script folder.\n3. Imports and executes a named script from\
  \ that folder — as last committed, the target\n   is `rs2mq_check` (last edit 2022-05-11), set by editing\
  \ the marked `import` line (and\n   matching label lines) in `main.py`.\n\nThe working scripts themselves\
  \ — including the dose-accumulation script the repo is\nnamed for — lived on the UNC network share,\
  \ per the original README:\n\n```\n\\\\nasr200\\RayStationScripts\\dev\\BMA\n```\n\n## Requirements\n\
  \n- RayStation with scripting enabled (the `connect` module is only available inside the\n  RayStation\
  \ scripting environment).\n- Access to the UNC script share above, which provides `script_init.py`,\
  \ `FindFunc.py`,\n  and the target script. Without it, `main.py` will not run.\n"

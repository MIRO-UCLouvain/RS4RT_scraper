readme_excerpt: "# Radiogenomic Integration of Brain Tumor MRI Phenotypes and Transcriptomic Dysregulation\n\
  \n## Overview\n\nThis project presents a multimodal radiogenomic framework integrating deep learning-based\
  \ MRI analysis with transcriptomic and pathway-level genomic profiling for biologically interpretable\
  \ characterization of brain tumors.\n\nThe study combines:\n- convolutional neural network (CNN)-based\
  \ MRI classification,\n- Grad-CAM explainability,\n- radiomic heterogeneity analysis,\n- differential\
  \ gene expression analysis,\n- pathway enrichment profiling,\n- and radiogenomic integration.\n\nThe\
  \ primary objective of the project is to investigate whether MRI-visible tumor phenotypes may reflect\
  \ underlying molecular dysregulation associated with glioma progression and tumor heterogeneity.\n\n\
  ---\n\n# Radiogenomic Summary Framework\n\n<p align=\"center\">\n  <img src=\"image.png\" width=\"100%\"\
  >\n</p>\n\n---\n## Executable link : https://somshirsha.github.io/Brain-Tumor-Analysis/\n# Project Objectives\n\
  \n- Develop a deep learning framework for brain tumor MRI classification.\n- Improve model interpretability\
  \ using Grad-CAM activation mapping.\n- Explore radiomic heterogeneity across tumor phenotypes.\n- Identify\
  \ significant transcriptomic alterations associated with brain tumors.\n- Perform biological pathway\
  \ and disease enrichment analysis.\n- Integrate imaging and molecular findings into a radiogenomic interpretation\
  \ framework.\n- Investigate biologically plausible associations between MRI features and transcriptomic\
  \ dysregulation.\n\n---\n\n# Imaging Pipeline\n\n## MRI-Based Brain Tumor Classification\n\nA convolutional\
  \ neural network was developed to classify MRI images into:\n- Glioma\n- Meningioma\n- Pituitary Tumor\n\
  - No Tumor\n\nThe imaging workflow included:\n- MRI preprocessing and resizing,\n- deep learning model\
  \ training,\n- performance evaluation,\n- and explainability analysis.\n\n---\n\n## Grad-CAM Explainability\
  \ Analysis\n\nGrad-CAM activation overlays were generated to identify image regions contributing most\
  \ strongly to model predictions.\n\nThis enabled:\n- visual interpretability,\n- localization of tumor-associated\
  \ activation regions,\n- and biological inspection of CNN decision-making behavior.\n\n---\n\n## Radiomic\
  \ Heterogeneity Analysis\n\nRadiomic-style imaging feature analysis was performed using:\n- contrast,\n\
  - homogeneity,\n- energy,\n- and correlation metrics.\n\nThis analysis revealed:\n- structural heterogeneity,\n\
  - intensity variability,\n- and phenotype differences across tumor categories.\n\n---\n\n# Genomic /\
  \ Transcriptomic Pipeline\n\n## Differential Gene Expression Analysis\n\nTranscriptomic expression datasets\
  \ were analyzed to identify significantly dysregulated genes associated with brain tumors.\n\nThe workflow\
  \ included:\n- preprocessing,\n- missing value handling,\n- DEG filtering,\n- and statistical analysis.\n\
  \nBoth upregulated and downregulated genes were identified using:\n- log2 fold change,\n- p-values,\n\
  - and adjusted p-values.\n\n---\n\n## Principal Component Analysis (PCA)\n\nPCA was used to visualize\
  \ transcriptomic separation between:\n- tumor,\n- and non-tumor samples.\n\nThe PCA analysis demonstrated\
  \ biologically distinct molecular clustering patterns.\n\n---\n\n# Functional Enrichment Analysis\n\n\
  ## Why Enrichr Was Used\n\nEnrichr was used for downstream biological interpretation of significant\
  \ differentially expressed genes.\n\nFunctional enrichment analysis was performed using:\n- GO Biological\
  \ Process,\n- Reactome Pathways,\n- KEGG Pathways,\n- and Disease Enrichment libraries.\n\n---\n\n##\
  \ Major Biological Findings\n\nThe enrichment analysis identified strong associations with:\n- glioma\
  \ progression,\n- extracellular matrix (ECM) remodeling,\n- synaptic signaling dysregulation,\n- neuronal\
  \ communication pathways,\n- invasive tumor behavior,\n- and proliferative molecular mechanisms.\n\n\
  ---\n\n# Radiogenomic Integration Framework\n\nThe imaging and transcriptomic findings were integrated\
  \ into a radiogenomic interpretation framework.\n\nThe integration investigated biologically plausible\
  \ relationships between:\n- MRI-visible tumor phenotypes,\n- radiomic heterogeneity,\n- and transcriptomic\
  \ dysregulation.\n\nA radiogenomic association heatmap was constructed to explore potential links between:\n\
  - activation hotspot regions,\n- structural heterogeneity,\n- diffuse tumor boundaries,\n- texture variability,\n\
  and:\n- cell-cycle activation,\n- ECM remodeling,\n- synaptic signaling,\n- tumor invasion,\n- and neuronal\
  \ dysregulation.\n\n---\n\n# Final Interpretation\n\nThe integrated analysis suggests that:\n- MRI-derived\
  \ tumor phenotypes may encode biologically meaningful molecular information,\n- imaging heterogeneity\
  \ may reflect underlying transcriptomic alterations,\n- and multimodal radiogenomic analysis may support\
  \ biologically interpretable AI-assisted characterization of brain tumors.\n\nThe framework demonstrates\
  \ how:\n- deep learning,\n- radiomics,\n- transcriptomics,\n- and systems biology\n\ncan be integrated\
  \ for future precision oncology research.\n\n---\n\n# Technologies and Libraries Used\n\n## Deep Learning\
  \ and Imaging\n- TensorFlow\n- Keras\n- OpenCV\n- Grad-CAM\n- Matplotlib\n- Seaborn\n\n## Transcriptomics\
  \ and Bioinformatics\n- Pandas\n- NumPy\n- SciPy\n- Scikit-learn\n- Enrichr\n- PCA\n- Differential Expression\
  \ Analysis\n\n---\n\n# Key Outputs\n\n- CNN-based MRI tumor classification model\n- Grad-CAM activation\
  \ overlays\n- Confusion matrix analysis\n- Radiomic heterogeneity analysis\n- Differential gene expression\
  \ profiling\n- Volcano plot visualization\n- PCA transcriptomic clustering\n- GO, Reactome, KEGG, and\
  \ Disease enrichment analysis\n- Radiogenomic association heatmap\n- Integrated radiogenomic systems-level\
  \ framework\n\n---\n\n# Limitations\n\n- MRI and transcriptomic datasets were analyzed independently\
  \ and were not paired at the patient level.\n- The radiogenomic associations presented are biologically\
  \ informed interpretative relationships rather than experimentally validated causal links.\n- Further\
  \ validation using matched multimodal patient cohorts is required.\n\n---\n\n# Future Scope\n\nFuture\
  \ extensions of this work may include:\n- multimodal deep learning,\n- patient-level radiogenomic correlation,\n\
  - survival prediction,\n- molecular subtype prediction,\n- explainable AI-assisted clinical decision\
  \ systems,\n- and precision oncology applications.\n\n---\n\n# Conclusion\n\nThis project demonstrates\
  \ a biologically interpretable radiogenomic framework integrating MRI-based deep learning and transcriptomic\
  \ pathway analysis for brain tumor characterization.\n\nThe study highlights the potential of multimodal\
  \ AI and systems biology approaches for understanding glioma-associated molecular mechanisms and advancing\
  \ precision neuro-oncology research.\n"

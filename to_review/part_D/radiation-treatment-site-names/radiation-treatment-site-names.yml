readme_excerpt: "# Target Structures List for External Beam Radiation Therapy \n\n## Author\n\nMichael\
  \ Gensheimer MD\n\nStanford University\n\nmgens@stanford.edu\n\n## Intro\n\nFor creating standardized\
  \ databases of radiation treatments, it's useful to have a pared-down list of possible treatment sites.\
  \ The mCODE project published a list of AAPM TG-263 organ structures mapped to SNOMED CT codes:\n\n\
  [Web page](https://build.fhir.org/ig/HL7/fhir-mCODE-ig/ValueSet-mcode-radiotherapy-treatment-location-vs.html)\n\
  \n[Excel file](https://build.fhir.org/ig/HL7/fhir-mCODE-ig/TG263_Nomenclature_to_SNOMEDCT_Codes_and_Qualifiers.xlsx)\n\
  \nThis list is valuable but since there are 673 structures, it is difficult to use for large language\
  \ models that are abstracting data from patient records. Also, many of the structures such as arteries\
  \ and veins are commonly organs at risk but not targets. So I downloaded the list in Dec. 2025, went\
  \ through the list and selected structures that are commonly used as targets for external beam radiation,\
  \ to help with LLM-based records abstraction. The result is a CSV file with 192 structure names (TG-263\
  \ primary names)\n\n## Rules\n\n- For paired organs where there is also the union of the two, only include\
  \ the individual organs (e.g., there are Eye_R, Eye_L, and Eyes; we only include Eye_R and Eye_L)\n\
  - If a structure is rarely treated with radiation, such as aorta or cranial nerve 9, it is not included.\n\
  - Some organs have a tree-like structure, such as ileum being a part of small bowel which is part of\
  \ bowel. In this case, I tried to pick a single level to include, the one that is most useful clinically\
  \ while minimizing the total number of structures. So, for elbow region and elbow joint (subset of elbow\
  \ region), I picked elbow region to include. For ileum and small bowel, I picked small bowel.\n\n##\
  \ Additions\n\nSome areas that are commonly treated with radiation don't have a TG263 structure as far\
  \ as I could tell, such as soft tissue/fat of arm or leg, hypopharynx, and pleura. So I added some structures\
  \ to the CSV file that are not TG263 names:\n\n- Head\n- Neck\n- Abdomen\n- Pelvis\n- Pleura_L\n- Pleura_R\n\
  - Hypopharynx\n- Retroperitoneum\n- Arm_L\n- Arm_R\n- Leg_L\n- Leg_R\n"

readme_excerpt: "# Cone-beam-CT-scatter-correction-tool\nCone beam CT scatter correction tool via the\
  \ multiple spectral model\n\nIntroduction  \nCone beam CT scatter correction tool is a software that\
  \ can correct the scatter artifacts in the CBCT images. The software applies the trained multiple spectral\
  \ scatter estimation model which is proposed in the paper ‘A generalized image quality improvement strategy\
  \ of cone-beam CT using multiple spectral CT labels in Pix2pix GAN’. The software has the functions\
  \ of scatter correction and CT reconstruction. The input is the uncorrected CBCT projection image, and\
  \ the outputs are the corrected projection image and the corrected CBCT image.\n![image](https://user-images.githubusercontent.com/86813489/124227033-98064300-db3c-11eb-86d5-cf038869b35e.png)\n\
  \n\nSetting     \nThe interface of the software includes the basic setting, path setting, image display\
  \ and result showing.       \nBasic setting         \nTask: choose the scatter estimation model.   \
  \     \nMode: choose the scanning mode (halffan or fullfan) and determine the path of reconstruction\
  \ program.         \nWidth: the width of the projection.         \nHeight: the height of the projection.\
  \ (Tips: the width and the height should be multiples of 256).        \nRatio: control the intensity\
  \ of the estimated scatter signal. The value of the ratio is close to 1.         \nPath setting    \
  \    \nInput path: the path of the uncorrected projection.         \nSave path: the path to save the\
  \ corrected projection.         \nRecon path: the path of the input file for reconstruction. The ‘fdk.in’\
  \ in the package is an example of the recon path.         \nDisplay: show the uncorrected projection\
  \ after the input path selected and the corrected projection or the corrected CBCT image after processing.\
  \           \nResult: show the task, device and calculation time of the software.       \n\n\nQuick\
  \ Start  \nUnzip the latest_net_G.zip in resource.\nAfter starting the software and entering the basic\
  \ setting, there are two options:  \n1.\tTo process a single projection, click ‘Load Image’, select\
  \ the projection path, and then select the save path. Finally, click ‘Infer Model’ to start processing.\
  \ \nThis process will not start the reconstruction process. \n2.\tTo process the complete projection\
  \ data, click ‘Open Folder’, select the path of the folder where the projection is located, and then\
  \ select the save path and the recon path. Finally, click ‘Infer Model’ to start processing. After the\
  \ processing is completed, the reconstruction program will be started for reconstruction.  \n\nReferences\
  \    \nYangkang Jiang, Chen Luo, Pengfei Yang, Jing Wang, Wei Zhao and Tianye Niu*, \" A generalized\
  \ image quality improvement strategy of cone-beam CT using multiple spectral CT labels in Pix2pix GAN.\"\
  \  \n\nRequirement    \nTorch may need to be installed or you can move the missing dll files to the\
  \ directory of the exe file.\nScatter correction: can be run on CPU and GPU. If using GPU, CUDA and\
  \ CUDNN are required to be installed.   \nScatter correction and reconstruction: can only be run on\
  \ GPU. CUDA and CUDNN are required to be installed.   \n\nIf there is an error when you run the program\
  \ and it shows that the dll file is missing, please download the file in the link below and put it in\
  \ the path where the exe file is located before testing. \nLink：https://pan.baidu.com/s/1K09hMmyC5PXgQVeqZ54-DA?pwd=1234\
  \ \nExtraction code：1234\n\nContact   \nIf you have any questions or suggestions about this software,\
  \ please contact us:    \nDr. Tianye Niu: niuty@szbl.ac.cn   \nMr. Yangkang Jiang 11718077@zju.edu.cn\
  \    \n\n\n\n"

readme_excerpt: "# Radiotherapy-Digital-Twin\n\nA computational framework for adaptive radiotherapy featuring\
  \ tumour growth modelling, radiobiological response, Kalman filter state estimation, and adaptive treatment\
  \ replanning.\n\n\n## Overview\n\nIn conventional radiotherapy, treatment plans are generated before\
  \ the start of treatment and are generally not updated during treatment. However, tumour response varies\
  \ significantly among patients due to biological heterogeneity, therapeutic response, and measurement\
  \ noise.  \n\nThis project presents a computational framework for digital twin–based adaptive radiotherapy\
  \ that combines mechanistic tumour modelling with simulated imaging data for continuous model updating.\
  \ The framework integrates mechanistic tumour modelling Kalman filter-based estimation to improve tumour\
  \ response prediction and support adaptive replanning during radiotherapy.\n\nThe entire framework is\
  \ developed in Python to support research, education, and demonstration purposes.\n\n\n## Features\n\
  \n- Gompertz tumour growth model\n- Linear-Quadratic (LQ) radiobiology model\n- Virtual patient generation\n\
  - Fractionated radiotherapy simulation\n- Delayed tumour regression\n- Accelerated tumour repopulation\n\
  - Stochastic treatment response\n- Kalman filter state estimation\n- Digital twin updating\n- Adaptive\
  \ replanning strategy\n\n## Repository Structure\nRadiotherapy-Digital-Twin/\n\n├── src/\n├── examples/\n\
  ├── data/\n├── results/\n├── README.md\n├── LICENSE\n└── requirements.txt\n\n## Simulation Workflow\n\
  Virtual Patient\n        │\n        ▼\nTumour Growth Model\n        │\n        ▼\nRadiotherapy Simulation\n\
  \        │\n        ▼\nMechanistic Prediction\n        │\n        ▼\nMRI Measurement\n        │\n  \
  \      ▼\nKalman Filter\n        │\n        ▼\nUpdated Digital Twin\n        │\n        ▼\nAdaptive\
  \ Replanning\n\n\n## Example Result\n<p align=\"center\">\n<img src=\"results/Adaptive Radiotherapy\
  \ Using a Digital Twin with Kalman Filter State Estimation.jpeg\" width=\"750\">\n</p>\n\nThe digital\
  \ twin continuously updates the mechanistic tumour model using noisy imaging measurements. Adaptive\
  \ replanning is triggered whenever the relative prediction error exceeds the predefined threshold.\n\
  \n\n## Core Modules\n\n| Module | Description |\n|---------|-------------|\n| tumour_growth | Gompertz\
  \ tumour growth |\n| radiobiology_lq | Linear-Quadratic radiobiology |\n| virtual_patient | Randomized\
  \ virtual patient generation |\n| treatment_schedule | Fractionated radiotherapy simulation |\n| delayed_response\
  \ | Delayed tumour regression |\n| accelerated_repopulation | Accelerated tumour repopulation |\n| stochastic_response\
  \ | Random treatment response |\n| adaptive_replanning | Replanning decision algorithm |\n| kalman_filter\
  \ | State estimation |\n| digital_twin | Integrated digital twin framework |\n\n\n## Installation\n\n\
  ```bash\ngit clone https://github.com/Aindrila-MedPhy/Radiotherapy-Digital-Twin.git\n\ncd Radiotherapy-Digital-Twin\n\
  \npip install -r requirements.txt\n```\n\n## Running an Example\n\n```bash\npython examples/P11_digital_twin_demo.py\n\
  ```\n\n## Results\n\nExample simulation outputs are available in the **results/** folder.\n\nThese include\n\
  \n- Digital Twin prediction\n- Mechanistic vs stochastic response\n- Delayed tumour regression\n- Accelerated\
  \ repopulation\n- Example simulation CSV\n\n\n## Future Work\n\nPotential future extensions include\n\
  \n- Patient-specific parameter estimation\n- Extended/Unscented Kalman filtering\n- Bayesian state estimation\n\
  - MRI/PET integration\n- Reinforcement learning for adaptive radiotherapy\n- Clinical data validation\n\
  \n\n## License\n\nThis project is released under the MIT License.\n"

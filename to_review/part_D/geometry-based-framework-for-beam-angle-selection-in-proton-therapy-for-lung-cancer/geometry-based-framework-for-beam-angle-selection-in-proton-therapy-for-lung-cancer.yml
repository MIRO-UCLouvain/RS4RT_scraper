readme_excerpt: "# \tGeometry-based framework for beam angle selection in proton therapy for lung cancer\n\
  Welcome to the Geometry-based framework for beam angle selection in proton therapy for lung cancer!\
  \ This project presents a comprehensive proton therapy workflow, encompassing two main algorithms: the\
  \ Pre-Processing Algorithm and the Angle Selection Algorithm. This README provides an overview of the\
  \ entire workflow, serving as your guide to navigate through the project's subfolders and understand\
  \ how these algorithms work together to enhance proton therapy planning for mobile thoracic tumours.\
  \ \n\n\n\n\n<img src=\"https://github.com/FotiouK/Optimising_Beam_Angles_in_Proton_Therapy_of_Lung_Cancer/assets/108896534/f32736e3-822a-4566-ba69-ab9f1ca5d39c\"\
  \ alt=\"p100_gif\" style=\"height: 300px;\" /> <img src=\"https://github.com/FotiouK/Optimising_Beam_Angles_in_Proton_Therapy_of_Lung_Cancer/blob/main/Images/Angle_Selection/p104_Beam_Visualisation.png\"\
  \ alt=\"Image 2\" style=\"height: 300px;\" />\n\n\n## Overview\nProton therapy offers a precise and\
  \ effective way to target cancerous cells while minimising damage to surrounding healthy tissue. However,\
  \ the intricacies of proton transport in non-stationary mediums introduces challenges. Anatomical changes,\
  \ driven by respiratory-induced intra-fractional motion, can significantly alter proton radiological\
  \ paths, leading to dose distribution distortions and potential plan degradation. Our primary objective\
  \ is to develop a robust methodology to identify optimal beam angles for proton therapy in lung cancer.\
  \ These angles will not only ensure effective tumor dose delivery but also minimise the accumulated\
  \ dose in nearby organs at risk (OARs), ultimately improving treatment outcomes.To optimise the angle\
  \ selection procedure, we have developed a thorough workflow that consists of the following components:\n\
  \n- **Pre-processing Algorithm**: This initial step focuses on preparing the input data, which consists\
  \ of 4D-CT scans. It involves generating CT scan representations such as the AIP, MIP and MinIP, delineating\
  \ radiation therapy volumes, and converting Hounsfield Units (HU) to Relative Stopping Power (RSP).\
  \ The resulting data were inputted in the angle selection algorithm and are essential for effective\
  \ proton therapy planning.\n\n- **Angle Selection Algorithm**: After pre-processing, the Angle Selection\
  \ Algorithm is employed. This algorithm thoroughly evaluates the influence of incident beam geometry\
  \ on plan parameters. It identifies optimal treatment angles that strike a balance between comprehensive\
  \ tumour coverage and minimising radiation dose to organs at risk. Tumour dose degradation is investigated\
  \ through Water Equivalent Path Length (WEPL) analysis, while the dose to organs at risk (OARs) is assessed\
  \ via Percentage Irradiated Volume (PIV).\n\n## Repository Structure\n\nOur repository is organised\
  \ into subfolders to help you navigate through the two main algorithms:\n\n- **[Pre_Processing](https://github.com/FotiouK/Optimising_Beam_Angles_in_Proton_Therapy_of_Lung_Cancer/tree/main/4DCT_Pre_Processing):**\
  \ This folder contains the Pre-processing Algorithm documentation and code. Here, you'll find detailed\
  \ information on generating CT scan representations, delineating radiotherapy volumes, and performing\
  \ HU to SPR conversions.\n\n- **[Angle_Selection](https://github.com/FotiouK/Optimising_Beam_Angles_in_Proton_Therapy_of_Lung_Cancer/tree/main/Angle_Selection):**\
  \ Inside this folder, you'll discover the Angle Selection Algorithm code and documentation. This section\
  \ provides a detailed documentation of the beam simulation process for different gantry-couch angle\
  \ combinations. It additionally covers the assessment of how incident beam geometry influences treatment\
  \ planning parameters and finally the process of identifying optimal beam geometries tailored to each\
  \ patient\n\n- **[Validation_Angle_Selection](https://github.com/FotiouK/Optimising_Beam_Angles_in_Proton_Therapy_of_Lung_Cancer/tree/main/Validation_Angle_Selection):**\

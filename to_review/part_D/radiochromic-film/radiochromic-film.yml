readme_excerpt: "This is a python script used for processing scanned images of radiochromic film.\nWritten\
  \ by Chris Williams\n\n\nrequires:\nPython version 3.8+\nrequires:\n - scipy\n - skimage\n - numpy\n\
  \ - matplotlib\n - PIL\n - opencv\n - \n\nKey functions:\n - Calibration: generate a calibration curve\
  \ from a series of film measurements\n - Measurement: measure radiation dose from film strips\n - Produce\
  \ dose maps: allow qualitative assessment/manual inspection of dose within the irradiated region\nEach\
  \ batch of measurements must conform to one of the above functions.\n\n\nGlossary\nBatch - A batch of\
  \ film samples is a grouping of film.\n      - Calibration functions limit the contents of each batch\
  \ (one calibration curve per batch)\n      - Otherwise, batches are just a convenient method for collecting\
  \ measurements in a sub-group\n      - Ideally, each batch consists of images with the same resolution.\
  \ However, this is not strictly necessary.\nSet - A set of measurements refers to a single measurement\
  \ point\n    - This consists of 1+ pieces of film exposed using the same conditions\n    - Measurement\
  \ sets greater than 1 film strip are used to assess precision/uncertainty\n\n\nHow to perform film measurements\
  \ and scan film strips:\n - Images must be scanned into .tif format with a digital scanner\n - Images\
  \ should preferably be 16 bit depth. If another image depth is used, the yml settings file must be updated\n\
  \ - All film should be positioned at the exact same position within the image\n  > use a template for\
  \ film placement in scanner\n - Each image should contain one piece of radiochromic film\n - Ensure\
  \ any image processing effects are disabled\n - Scan each piece of film before and after exposure for\
  \ the best achievable accuracy\n  > Ensure each scan field of view is the same size for the before/after\
  \ images. Difference in image resolution will break the script.\n  > At the very least, scan a single\
  \ sample piece of film before and after exposure\n - Repeat each measurement x3, so 6 scanned images\
  \ per measurement\n  > Skipping this step significantly reduces the ability to estimate measurement\
  \ uncertainty\n - Expose each film strip, preferably to a uniform radiation exposure\n  > Horizontally\
  \ uniform radiation exposures are fine in 'dynamic' mode.\n\n  \nSetting up the folder structure:\n\
  \ - An example folder structure is included in the github repository.\n - The example folder structure\
  \ can just be used as-is\n - An example yml setting file is included named 'film_process.yml'\n - The\
  \ default action of the script is to load 'film_process.yml' from the working directory\n - The example\
  \ yml setting file default behavior is to process the contents of the example folder structure\n - Each\
  \ measurement batch must be defined in the yml settings file used to call the script \n - Each measurement\
  \ batch must have before/after images of each measurement, and an index.txt file which describes the\
  \ measurement\n \n \nFile naming convention\nTHE SCRIPT WILL NOT PROCESS FILES WHICH DEVIATE FROM THIS\
  \ NAMING CONVENTION\nimage names\n[batch]_[after/before]_[number id].tif\n'default_background.tif' can\
  \ optionally be included in each directory.\nIf 'before' images are unavailable, the default background\
  \ image will be used as the before image instead\neg:\ntestbatch_after_001.tif would be an image of\
  \ the first film piece after exposure.\ntestbatch_before_001.tif would be the first film piece before\
  \ exposure.\nin the index, this before/after pair would have the film_id 'testbatch_001'\n\n\nHow to\
  \ use the script:\n - Each folder must contain a measurement batch.\n  > Calibration type batches must\
  \ contain data for a single calibration curve\n  > e.g. to have a calibration curve at 4 different kVp\
  \ settings, 4 different measurement batches are required.\n - There is no strict limit or constraint\
  \ on how many items/measurements can be included in a measurement or dosemap measurement batch\n - File\
  \ names must strictly match the format provided.\n - An index.txt file must exist in the same directory,\
  \ describing the images. See below.\n - a yml file describing the settings for the analysis must be\
  \ created.\n - the script is then called with the yml file as the argument\n\n\nIn addition, each batch\
  \ requires an 'index.txt' file\nOptionally, each batch can have a 'default_background.tif' file, typically\
  \ required for cases when the 'before' images were lost or forgotten.\n\n\nCalibration function\n -\
  \ The program can be used to calibrate film by exposing a batch to a series of known doses.\n - The\
  \ calibration index.txt file must detail which images correspond to each measurement.\n - Each measurement\
  \ batch can only contain a single calibration curve\n - Film strips should be exposed across the necessary\
  \ dynamic range for any measurements which will be needed\n - Expose at least 1, preferably 3 pieces\
  \ of film at each dose level.\n - The calibration function created will consist of 2 parameters and\
  \ their corresponding uncertainty.\n - The form of the calibration is Dose = a * Delta R / (1 + b *\
  \ Delta R)\n - Where Delta R is the change in reflectance (pixel value before - pixel value after)/2^bit_depth\n\
  \ - a & b are the fitted parameters.\n - For calibration and uncertainty calculation discussions, please\
  \ see thesis chapter 4\n - After running the script to calibrate, the calibration will be saved in [output_folder]/cal/[batch_name].p\n\
  \ - Plots of the calibrations will be saved in [output_folder]/cal/plot/[batch_name].png (if the associated\
  \ setting is enabled)\n  > Saved calibrations can be used to perform measurements and create dose maps\n\
  \n\nMeasurement function\n\n - The program can be used to measure an unknown dose using previously established\
  \ calibration.\n - The index.txt file must detail a name and calibration function for each measurement\
  \ set\n - The results of the measurement will be dumped to a csv file in [output_folder]/data/[batch_name].csv\n\
  \  \n\nDosemap function\n\n - The script can be used to convert exposed images to a dose image, using\
  \ a previously established calibration function.\n - The resulting images will be placed in [output_folder]/dose_maps/[batch_name]/xx_xx.tif\n\
  \ - The images can be loaded in Image J or with python imageio\n - The default unit of the dosemap images\
  \ is mGy\n\n\nindex.txt\n - The index.txt file details the contents of a given directory.\n - Each measurement\
  \ batch must contain index.txt\n - No output will be created for files that aren't mentioned in index.txt\n\
  \ - Accurately filling out the index.txt file is necessary for measurement\n - Example index.txt files\
  \ are available for all 3 measurement types\n - The following provides a detailed description of how\
  \ these files work, should it prove necessary.\n - Note that the 'before' or 'after' part of the image\
  \ filenames is omitted in index.txt.\n\n#==============================================================================\n\
  # Open the index file and make a list of lists out of the contents\n# The header of the index file must\
  \ have the following format:\n#\n# line 1: measurement_type,batch_name\n#\n# Valid measurement types\
  \ are 'measurement' and 'calibration'\n#The subsequent lines will be different for calibration and measurement\
  \ files:\n#\n#Calibration:\n#Each set requires one line\n#line2+: \t[dose]mGy,film_id_1,film_id_2,film_id_3,...,\n\
  #Film id is [batch]_[number id]\n#eg: \t\t103.2mGy,0315_001,0315_002,0315_003\n#Where 0315 is the batch\
  \ name, and the set includes film pieces 001, 002 and 003.\n#\n# \n# A complete example calibration\
  \ index, including 3 measurements:\n# 1 calibration,120kVpCT_0205021\n# 2 103.2mGy,0315_001,0315_002,0315_003\n\
  # 3 221.4mGy,0315_004,0315_005,0315_006,0305_007,0305_008 \n# ...\n# \n#Measurement:\n#Each set requires\
  \ one line\n##line2+: \t[measurement name],[calibration name],film_id,film_id,...\n#\n# Measurement\
  \ example:\n# \n# 1 measurement,120kVpCT_0205021\n# 2 chest_1,80kVp,0418_001,0418_002\n# 3 chest_2,120kVp,0418_003,0418_004,0418_004\n\
  #\n#Notes: The number of strips in each set can be 1+\n#NO TRAILING WHITESPACE note to self: ignore\
  \ trailing whitespace\n#==============================================================================\n\
  \n\nindex.txt folders which are only for dose maps:\n\nexample file:\nNote: for index.txt, the 'after'\
  \ part of the filename must be included\n#==============================================================================\n\
  #dosemap\n#120kVp,0304_022,0304_023\n#80kVp,0304_024,0304_025\n#100kVp,0304_026,0304_027\n#140kVp,0304_028,0304_029\n\
  #==============================================================================\n\n"

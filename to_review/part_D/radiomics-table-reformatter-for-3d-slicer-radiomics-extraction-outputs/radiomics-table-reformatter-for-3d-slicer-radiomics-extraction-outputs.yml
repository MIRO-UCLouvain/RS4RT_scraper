readme_excerpt: "# Radiomics Table Reformatter for 3D Slicer Radiomics Extraction Outputs Table\n# Slicer\
  \ Radiomics CSV Reshaper\n\nA small Python utility for batch reorganizing radiomics CSV files exported\
  \ from **3D Slicer** into a table format that is easier to use for **machine learning** and downstream\
  \ statistical analysis.\n\n## Overview\n\nRadiomics results exported from 3D Slicer are often stored\
  \ in individual CSV files, where feature values are arranged vertically.  \nFor machine learning workflows,\
  \ however, data are usually expected in a **sample-by-feature** format:\n\n- **one row = one sample**\n\
  - **one column = one feature**\n\nThis script reads a batch of radiomics CSV files from a folder, extracts\
  \ a specified column from a specified starting row, and writes the extracted values horizontally into\
  \ a single output CSV file.\n\nIn short, it converts:\n\n- **vertical feature lists in multiple CSV\
  \ files**\n  \ninto\n\n- **a horizontal feature matrix suitable for model input**\n\n---\n\n## Main\
  \ Function\n\nFor each CSV file in the source folder:\n\n1. Sort files by filename\n2. Read the **4th\
  \ column**\n3. Extract values from **row 39 to the end** (using 1-based indexing)\n4. Convert the extracted\
  \ vertical values into **one horizontal row**\n5. Write that row into the output file `Radiomics.csv`\n\
  \n### Output rules\n\n- The **first CSV** is written to **row 2**\n- The **second CSV** is written to\
  \ **row 3**\n- And so on\n- Writing always starts from **column 3**\n\nThe script does **not** write\
  \ filenames by default.\n\n---\n\n## Typical Use Case\n\nThis tool is intended for radiomics studies\
  \ in which:\n\n- radiomics features are extracted in batch from **3D Slicer**\n- each case produces\
  \ one CSV file\n- features need to be merged into a single table\n- the final table will be used for:\n\
  \  - machine learning\n  - statistical analysis\n  - feature selection\n  - model development\n\n---\n\
  \n## File Structure Example\n\n```text\n└─ slicer_radiomics_csv_reshaper.py\n"

readme_excerpt: "# ⚡ Morpho-Dose: Adaptive Radiotherapy Dose Predictor\n\n**An AI-driven \"Digital Twin\"\
  \ pipeline for Head & Neck Cancer Radiotherapy.**\n*Built with PyTorch, Jupyter, and OpenKBP.*\n\n[![License:\
  \ MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](https://opensource.org/licenses/MIT)\n\
  [![Python 3.8+](https://img.shields.io/badge/python-3.8+-blue.svg)](https://www.python.org/downloads/release/python-380/)\n\
  ![Status](https://img.shields.io/badge/Status-Completed-success)\n\n---\n# MorphoDose: 3D Deep Learning\
  \ for Clinical Radiotherapy Dosimetry \U0001F3E5⚛️\n\nAn end-to-end, physics-informed 3D Deep Learning\
  \ pipeline designed to predict highly accurate radiation dose distributions from sparse patient CT scans\
  \ and target masks. \n\nThis project bridges the gap between raw computer science and clinical medical\
  \ physics by implementing custom spatial data loaders, two-phase loss optimization, Monte Carlo uncertainty\
  \ mapping, and dosimetric evaluation (DVH/D95).\n\n## \U0001F680 The Clinical Problem & AI Solution\n\
  Standard AI models often fail in radiotherapy because they treat all voxels equally, leading to clinically\
  \ unacceptable \"underdosing\" of the tumor target. \n\nMorphoDose solves this by implementing a **Target-Weighted\
  \ Physics-Informed Loss Function**, forcing the U-Net architecture to aggressively penalize errors inside\
  \ the Planning Target Volume (PTV).\n\n## \U0001F9E0 Core Architecture & Engineering Features\n* **Sparse\
  \ 3D Data Engineering:** Custom, highly-optimized data loaders that reconstruct flat, sparse OpenKBP\
  \ CSV arrays into physical $128 \\times 128 \\times 128$ 3D spatial grids while handling artifact mitigation\
  \ and Hounsfield Unit scaling.\n* **3D U-Net with MC Dropout:** A custom-built 3D convolutional network\
  \ featuring Monte Carlo Dropout during inference to generate clinical Uncertainty Maps, highlighting\
  \ areas of steep dose gradients.\n* **Two-Phase Training Strategy:** Automated switching from Mean Squared\
  \ Error (MSE) for initial distribution learning to L1 (MAE) for high-gradient refinement.\n* **Hyperparameter\
  \ Optimization (HPO):** Automated learning rate and weight decay search using Optuna prior to full training.\n\
  \n## \U0001F4CA Results: The Physics-Informed Upgrade\nThe baseline model accurately learned the general\
  \ dose distribution but underdosed the target shoulder on the Dose-Volume Histogram (DVH). By engineering\
  \ a custom loss function `L_total = L_global + (λ * L_target)` and fine-tuning, the model achieved near-perfect\
  \ clinical alignment.\n\n**Quantitative Improvements (Before vs. After Fine-Tuning):**\n* **Target MAE:**\
  \ 0.1396 Gy ➡️ **0.0545 Gy** (60% Error Reduction)\n* **D95 Error:** 0.4320 Gy ➡️ **0.0480 Gy** (Nearly\
  \ 10x Improvement)\n\n\n## \U0001F6E0️ Tech Stack\n* **Deep Learning:** PyTorch, TorchIO (3D Medical\
  \ Augmentation)\n* **Optimization:** Optuna (HPO)\n* **Data Processing:** Pandas, NumPy (Sparse to Dense\
  \ 3D mapping)\n* **Evaluation:** Matplotlib (Custom DVH & Spatial Visualizations)\n\n\n\n\n\n---\n"

readme_excerpt: "# MIART Workshop Website\r\n## Medical Image AI in Radiation Therapy | MICCAI 2026\r\n\
  \r\nA modern, responsive website for the MIART workshop - a dedicated forum for AI in therapeutic oncology.\r\
  \n\r\n## Project Overview\r\n\r\nThe MIART Workshop is established to fill the void in the MICCAI community\
  \ for addressing specific challenges of therapeutic AI in radiation therapy. This website serves as\
  \ the central hub for workshop information, submissions, and community engagement.\r\n\r\n### Key Features\r\
  \n\r\n- **Responsive Design**: Mobile-first approach with full responsiveness across all devices\r\n\
  - **Modern Styling**: Clean, professional design using CSS3 with smooth animations\r\n- **Interactive\
  \ Navigation**: Sticky navigation with smooth scrolling and mobile hamburger menu\r\n- **Comprehensive\
  \ Content Sections**:\r\n  - Workshop Overview with key concepts\r\n  - Research Topics (8 main areas)\r\
  \n  - Workshop Schedule\r\n  - Organizing Committee\r\n  - Call for Papers Information\r\n  - Contact\
  \ and Links\r\n  \r\n- **Accessibility**: Semantic HTML, proper heading hierarchy, and keyboard navigation\
  \ support\r\n- **Performance Optimized**: Lightweight CSS/JS with no external dependencies except Font\
  \ Awesome icons\r\n\r\n## Project Structure\r\n\r\n```\r\n2026-MICCAI-MIART/\r\n├── index.html     \
  \            # Main HTML file with all content\r\n├── assets/\r\n│   ├── css/\r\n│   │   └── style.css\
  \         # Complete stylesheet\r\n│   ├── js/\r\n│   │   └── script.js         # Interactive features\r\
  \n│   └── images/               # Directory for images (to be added)\r\n└── README.md              \
  \   # This file\r\n```\r\n\r\n## Getting Started\r\n\r\n### Quick Start\r\n\r\n1. Open `index.html`\
  \ in your web browser\r\n2. Navigate through the different sections\r\n3. All features work without\
  \ any server or build process required\r\n\r\n### Local Development\r\n\r\nIf you want to use a local\
  \ server (recommended for development):\r\n\r\n**Using Python (3.x):**\r\n```bash\r\ncd \"c:\\Users\\\
  oscar\\LOCAL_PROJECTS\\2026-MICCAI-MIART\"\r\npython -m http.server 8000\r\n```\r\nThen visit `http://localhost:8000`\
  \ in your browser.\r\n\r\n**Using Node.js:**\r\n```bash\r\nnpm install -g http-server\r\nhttp-server\r\
  \n```\r\n\r\n**Using VS Code:**\r\n- Install the \"Live Server\" extension\r\n- Right-click `index.html`\
  \ and select \"Open with Live Server\"\r\n\r\n## Customization\r\n\r\n### Colors\r\n\r\nEdit the CSS\
  \ custom properties in `assets/css/style.css`:\r\n\r\n```css\r\n:root {\r\n    --primary-color: #1a472a;\
  \      /* Dark green */\r\n    --secondary-color: #2d6e42;    /* Medium green */\r\n    --accent-color:\
  \ #e74c3c;       /* Red for highlights */\r\n    /* ... other colors ... */\r\n}\r\n```\r\n\r\n### Content\
  \ Updates\r\n\r\n- **Main content**: Edit `index.html` directly\r\n- **Styling**: Modify `assets/css/style.css`\r\
  \n- **Interactivity**: Enhance `assets/js/script.js`\r\n\r\n### Adding Images\r\n\r\n1. Place images\
  \ in `assets/images/` directory\r\n2. Update HTML image references to use relative paths:\r\n   ```html\r\
  \n   <img src=\"assets/images/your-image.jpg\" alt=\"Description\">\r\n   ```\r\n\r\n## Features & Functionality\r\
  \n\r\n### Navigation\r\n- Sticky navbar with smooth scrolling\r\n- Responsive hamburger menu on mobile\
  \ devices\r\n- Keyboard accessible navigation\r\n\r\n### Interactive Elements\r\n- Hover effects on\
  \ cards\r\n- Smooth scroll animations\r\n- Scroll-to-top button (appears when scrolling down)\r\n- Mobile\
  \ menu toggle\r\n\r\n### Sections\r\n\r\n1. **Hero Section**: Eye-catching introduction with CTA button\r\
  \n2. **Overview**: Why radiotherapy matters and workshop purpose\r\n3. **Research Topics**: 8 key areas\
  \ of focus with icons\r\n4. **Schedule**: Detailed workshop timeline (14:00-17:40)\r\n5. **Organizers**:\
  \ Committee members with affiliations and emails\r\n6. **Call for Papers**: Submission guidelines and\
  \ important dates\r\n7. **Contact**: Ways to reach out and get more information\r\n8. **Footer**: Quick\
  \ links and legal information\r\n\r\n## Browser Support\r\n\r\n- Chrome/Edge (latest)\r\n- Firefox (latest)\r\
  \n- Safari (latest)\r\n- Mobile browsers (iOS Safari, Chrome Mobile)\r\n\r\n## Performance Optimizations\r\
  \n\r\n- CSS Grid and Flexbox for efficient layouts\r\n- Minimal JavaScript (no heavy frameworks)\r\n\
  - CDN-hosted Font Awesome icons\r\n- Optimized media queries for responsive design\r\n- No render-blocking\
  \ resources\r\n\r\n## Accessibility\r\n\r\n- Semantic HTML structure\r\n- ARIA labels where needed\r\
  \n- High color contrast ratios\r\n- Keyboard navigation support\r\n- Focus indicators for interactive\
  \ elements\r\n\r\n## Upcoming Enhancements\r\n\r\nConsider adding:\r\n\r\n1. **Image Assets**\r\n  \
  \ - Logo/branding\r\n   - Hero section background\r\n   - Workshop photos/graphics\r\n\r\n2. **Additional\
  \ Sections**\r\n   - Past workshop highlights\r\n   - Accepted papers showcase\r\n   - Photo gallery\r\
  \n   - Video testimonials\r\n\r\n3. **Interactivity**\r\n   - Submission form\r\n   - Newsletter signup\r\
  \n   - Search functionality\r\n   - Dark mode toggle\r\n\r\n4. **Backend Integration**\r\n   - Dynamic\
  \ content management\r\n   - Database for organizers/papers\r\n   - Email notifications\r\n\r\n## Important\
  \ Dates (TBD)\r\n\r\n- Paper Submission Deadline: TBD\r\n- Notification of Acceptance: TBD\r\n- Camera-Ready\
  \ Deadline: TBD\r\n- Workshop Date: October 2026\r\n\r\n## Links\r\n\r\n- **MICCAI 2026**: https://conferences.miccai.org/2026/en/\r\
  \n- **Satellite Events**: https://conferences.miccai.org/2026/en/SATELLITE-EVENTS.html\r\n- **Reference\
  \ Workshop**: https://dlinrt.org/\r\n\r\n## Organizing Committee\r\n\r\n**General Chairs:**\r\n- Mauricio\
  \ Reyes (University of Bern)\r\n- Oscar Acosta (Université de Rennes)\r\n- Javier Pascau (Universidad\
  \ Carlos III de Madrid)\r\n- Eliana Vázquez (University of Manchester)\r\n- Francesca Spadea (Karlsruhe\
  \ Institute of Technology)\r\n- Gloria Díaz (Instituto Tecnológico Metropolitano)\r\n- Gabor Fichtinger\
  \ (Queen's University)\r\n- Parvin Mousavi (Queen's University)\r\n- Amith Kamath (University of Bern)\r\
  \n\r\n## License\r\n\r\nThis website is created for the MIART Workshop at MICCAI 2026.\r\n\r\n## Contact\r\
  \n\r\nFor workshop inquiries, please contact any of the general chairs listed above.\r\n\r\n---\r\n\r\
  \n**Last Updated**: April 27, 2026\r\n**Workshop Edition**: MICCAI 2026\r\n"

readme_excerpt: "# Dicom_Data_to_Numpy_Arrays\n\n> **Deprecated.** This code is superseded by\n> [Dicom_RT_and_Images_to_Mask](https://github.com/brianmanderson/Dicom_RT_and_Images_to_Mask),\n\
  > which does the same conversion (also in parallel). Kept here for reference; last updated 2020.\n\n\
  Parallel conversion of DICOM image series and their RT structure sets into numpy\nimage/mask arrays\
  \ for training deep-learning segmentation models. Given a tree of\npatient DICOM folders and a list\
  \ of contour names (with an \"associations\" dictionary\nmapping ROI-name variants to canonical names),\
  \ it finds each patient's RTSTRUCT file,\nchecks that the requested contours exist, rasterizes the contours\
  \ into masks, and\nwrites the paired image/mask arrays.\n\n## Components\n\n- `DicomImagesintoData_Parallel.py`\
  \ — main pipeline. Multi-threaded workers (one queue\n  to verify RT structures, one to convert) walk\
  \ patient directories and build the\n  arrays using pydicom, SimpleITK, and skimage polygon drawing.\n\
  - `Separate_Numpy_Images_Into_Test_Train_Validation.py` — splits the generated\n  image/mask files into\
  \ Train / Test / Validation folders by patient.\n- `Make_Patient_pickle_file_from_text.py` — builds\
  \ the patient-info pickle consumed by\n  the pipeline.\n- `Get_Path_Info.py` — indexes processed folders\
  \ into a `Data_Locations.pkl`.\n- `Utils.py` — pickle load/save helpers and a matplotlib scroll-wheel\
  \ slice viewer\n  (`plot_scroll_Image`) for eyeballing the resulting volumes.\n\n## Requirements\n\n\
  Python with pydicom, SimpleITK, numpy, scikit-image, and matplotlib.\n"

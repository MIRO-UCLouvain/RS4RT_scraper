readme_excerpt: "# Brain Tumor Classification Using Radiomics and Machine Learning\nThis project implements\
  \ an end-to-end radiomics-based machine learning pipeline for brain tumor classification using MRI images.\
  \ Hand-crafted texture and intensity features are extracted from tumor regions and used to train and\
  \ evaluate multiple machine learning models.\n\nThe workflow covers image preprocessing, feature extraction,\
  \ model training, evaluation, and comparison, making it suitable for research and educational purposes\
  \ in medical imaging, bioinformatics, and applied machine learning.\n\n# Project Overview\nInput: Brain\
  \ MRI images with tumor masks (.mat files)\n\n1. Feature Engineering:\n\n* First-order statistical features\n\
  * GLCM texture features\n\n2. Models Implemented:\n\n* Logistic Regression\n* Random Forest\n* XGBoost\n\
  \n3. Evaluation Metrics:\n\n* Accuracy\n* Precision, Recall, F1-score (macro)\n* ROC-AUC (One-vs-Rest)\n\
  \n# Repository Structure\n```bash\n├── BrainTumor.ipynb # Complete pipeline notebook\n├── dataset/ #\
  \ MRI .mat files\n│   ├── 1.mat\n│   └── radiomics_features.csv \n├── README.md # Project documentation\
  \ \n\n```\n# Dataset Description\n\n# Dataset\nThe dataset used in this project is sourced from:\n\n\
  **Brain Tumor Dataset**\nCheng, Jun (2017). brain tumor dataset. figshare. Dataset. https://doi.org/10.6084/m9.figshare.1512427.v5\n\
  \nThe dataset contains 3064 MRI slices from 233 patients with three types of brain tumors: meningioma,\
  \ glioma, and pituitary tumor.\n\nEach .mat file contains:\n* MRI image\n* Tumor mask\n* Tumor label\
  \ (multi-class)\n* Patient ID (PID)\nTumor masks are used to isolate the region of interest for radiomics\
  \ feature extraction.\n\n# Methodology\n1. Preprocessing\n* Image normalization (z-score)\n* Tumor region\
  \ isolation using binary masks\n* Visualization of MRI images with overlayed tumor masks\n\n2. Feature\
  \ Extraction\n\nFirst-Order Statistics:\n* Mean\n* Standard Deviation\n* Minimum & Maximum\n* Skewness\n\
  * Kurtosis\n\nTexture Features (GLCM):\n* Contrast\n* Dissimilarity\n* Homogeneity\n* Energy\n* Correlation\n\
  \nAll features are computed only within the tumor region.\n\n3. Hyperparameter Tuning\n* RandomizedSearchCV\
  \ with 20 iterations\n* StratifiedKFold cross-validation (5 folds) on the training set\n* Scoring metric:\
  \ macro F1\n* Applied to Random Forest with the following search space:\n\n| Parameter | Values Searched\
  \ |\n| :--- | :--- |\n| n_estimators | 200, 300, 500 |\n| max_depth | None, 10, 20, 30 |\n| min_samples_split\
  \ | 2, 5, 10 |\n| min_samples_leaf | 1, 2, 4 |\n\n4. Machine Learning Models\n\n| Model | Description\
  \ | \n| :--- | :--- |\n| Logistic Regression | Baseline linear classifier with feature scaling | \n\
  | Random Forest | Ensemble tree-based model handling non-linearities | \n| XGBoost | Gradient-boosted\
  \ trees optimized for multi-class classification |\n\nClass imbalance is handled using balanced class\
  \ weights where applicable.\n\n# Evaluation\n* Stratified train-test split\n* Macro-averaged metrics\
  \ for multi-class robustness\n* ROC-AUC computed using One-vs-Rest strategy\n* Performance comparison\
  \ across models\n\n# Technologies Used\n\n* Python\n* NumPy, Pandas\n* scikit-image\n* scikit-learn\n\
  * XGBoost\n* Matplotlib\n* SHAP (model interpretability)\n\n# How to Run\n1. Clone the repository:\n\
  ```bash\ngit clone https://github.com/yourusername/brain-tumor-radiomics-ml.git\ncd brain-tumor-radiomics-ml\n\
  ```\n2. Install dependencies:\n```bash\npip install -r requirements.txt\n```\n3. Place the dataset in:\n\
  ```bash\ndataset/\n```\n4. Run the notebook:\n```bash\njupyter notebook BrainTumor.ipynb\n```\n\n# Future\
  \ Improvements\n\n* Deep learning feature extraction (CNN-based radiomics)\n* External dataset validation\n\
  * Clinical outcome prediction integration\n\n# Author\nVarsini Sakthivadivel Ramasamy\n\nMS Bioinformatics\n\
  \nJohns Hopkins University\n"

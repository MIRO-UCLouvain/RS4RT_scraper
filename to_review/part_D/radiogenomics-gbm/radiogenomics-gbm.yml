readme_excerpt: "# Radiogenomics analysis on Dataset from Ivy Glioblastoma Atlas Project (Ivy GAP)\n##\
  \ What is Radiogenomics\n<img src=\"Pictures\\RadiogenomicsResearchTypicalPathway.png\" alt=\"MLP\"\
  \ width=\"600\"/>\n\n\n## Which part this repositories focus on?\n1. GBM MRI image segmentation\n2.\
  \ Feature Extracion from ROI\n3. Data anaylsis, including:\n   * GBM subtypes prediction,which is based\
  \ on Wang research on 2017, prediction (Accuracy:92%, using Multilayer Perceptron)\n   * Mutual Information\
  \ Analysis to Radiomics feature and gene expression energy.\n\n## File Structure\n```\n├─data # Store\
  \ data, both data for training and generated results\n│  ├─classification results # Classification results\n\
  │  │  ├─model\n│  │  ├─Simplified\n│  │  │  ├─Test\n│  │  │  │  ├─Normalize\n│  │  │  │  │  └─PCA\n\
  │  │  │  │  └─PCA\n│  │  │  │      └─Normalize\n│  │  │  └─Train\n│  │  │      ├─Normalize\n│  │  │\
  \      │  └─PCA\n│  │  │      └─PCA\n│  │  │          └─Normalize\n│  │  ├─Test\n│  │  │  ├─Normalize\n\
  │  │  │  │  └─PCA\n│  │  │  └─PCA\n│  │  │      └─Normalize\n│  │  └─Train\n│  │      ├─Normalize\n\
  │  │      │  └─PCA\n│  │      └─PCA\n│  │          └─Normalize\n│  ├─gene # Gene analysis (Not important,\
  \ pls ignore)\n│  │  └─...\n│  ├─Images # Training Images, store based on patient and MRI series\n│\
  \  │  ├─W10_FLAIR_AX\n│  │  └─...\n│  ├─Masks # Training Masks, store based on patient and MRI series\n\
  │  │  ├─W10_AX\n│  │  └─...\n│  ├─Mutual_Information # Mutual Information between feature\n│  ├─result\
  \ # Store \n│      └─FLAIR\n│          ├─monitor\n│          │  ├─test\n│          │  ├─train\n│   \
  \       │  └─validation\n│          ├─ROC_curve\n│          ├─test\n│          └─train\n│  ├─feature_extraction.csv\
  \ # radiomics feature, extracted by radiomics, plz check their doc\n│  ├─GBM_MRI_Dataset.csv # contianing\
  \ every slice location, using for training\n│  ├─gene_expression_details.csv # gene expression energy\n\
  │  ├─tumor_details.csv # Basic Database info, containing every patients' subtype\n│  └─Params.yaml #\
  \ using for feature extraction, configure file for pyradiomics, plz check their doc\n├─exception_in_trainning\
  \ # Store error message, will send to your email.\n├─model # Store model\n│  ├─FLAIR\n│  ├─Stack\n│\
  \  ├─T1\n│  └─T2\n├─Pictures # Pictures for README\n├─requirement # Store Python environment\n├─train.py\
  \  # Training Main\n├─data.py # Training dataset\n├─utils.py # Training utils\n├─unet.py # Training\
  \ net\n├─trainHelper.py # Help training module\n├─classification.py # Classification main\n├─mutual_information.py\
  \ # mutual information analysis\n├─feature_extraction.py # Get radiomics features from mask\n├─get_graph_csv.py\
  \ # Old version file, ignore it, used to get data in csv to replot fancy graph\n├─generate_gif_results.py\
  \ # Get gif, old version file, only use as reference, can not run directly\n└─gene_expression_monitor.py\
  \ # Get some statistic information about gene expression, old version code, you can ignore it\n```\n\
  \n## How to use it\n\n### Segmentation\nInstall python environment by requirements (pip)\n```\npip install\
  \ -r requirements.txt\n```\n\nGBM MRI image segmentation using `train.py, data.py, utils.py, unet.py,\
  \ trainHelper.py`. The main python script is `train.py`, using command to run it:\n```\npython train.py\
  \ [argv1] [argv2]\n```\n`argv1` is the MRI series you can choose, containing `T1, T2, FLAIR, Stack`.\
  \ `argv2` is the epoches you want.\n\nAlso, see the `trainHelper.py`, you can use your own mail to remind\
  \ you the train's situation.\n\n### Classification\n\nJust run `classification.py`\n\n### Mutual Information\
  \ analysis\n\nJust run `mutual_information.py`\n\n## Some results show\n\n### Segmentation\n<img src=\"\
  Pictures\\Segmentation_Table.png\" alt=\"Seg\" width=\"400\"/>\n<img src=\"Pictures\\Segmentation_Vis.png\"\
  \ alt=\"Seg\" width=\"600\"/>\n<img src=\"Pictures\\Segmentation.gif\" alt=\"Seg\" width=\"600\"/>\n\
  \n### Classification\n<img src=\"Pictures\\MLP.png\" alt=\"MLP\" width=\"400\"/>\n\n### Mutual Information\n\
  <img src=\"Pictures\\Radiomics_with_ctAreaGeneExpression.png\" alt=\"MI\" width=\"400\"/>\n\n## TODO\
  \ List\n- [] Change old version generate_gif_results.py to new version\n\n\n"

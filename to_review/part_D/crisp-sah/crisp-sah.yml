readme_excerpt: "\n# CRISP-SAH\n\n**CRISP‑SAH** is an open‑source deep learning framework for early prediction\
  \ of severe pneumonia (SP) after subarachnoid hemorrhage (SAH) using clinical parameters and CT radiomics.\n\
  \nThis repository contains the complete training and inference pipeline built on top of [nnU‑Net v2](https://github.com/MIC-DKFZ/nnUNet).\n\
  \n\nThe code is responsible for:\n- Loading medical image data and associated clinical labels\n- Applying\
  \ data augmentation (spatial, intensity, cascaded augmentations)\n- Training a segmentation network\
  \ (2D/3D U‑Net) with deep supervision\n- Managing distributed training (DDP), learning rate scheduling,\
  \ and logging\n- Performing validation and checkpointing\n\nThis module is designed to be used as part\
  \ of the larger CRISP‑SAH pipeline, where the trained segmentation model is later used for radiomics\
  \ feature extraction and final risk prediction.\n\n\n\n## \U0001F9E9 File Overview\n\n- `crisp_sah/nnUNetTrainer.py`\
  \ – Contains the `nnUNetTrainer` class that inherits from the nnU‑Net v2 trainer and adds CRISP‑SAH‑specific\
  \ adaptations (if any).\n- The class is fully compatible with the nnU‑Net data structure and configuration\
  \ files (`plans.json`, `dataset.json`, etc.).\n\n\n\n## \U0001F4E6 Dependencies\n\nThe code requires\
  \ the following Python packages (see `requirements.txt` for full list):\n\n- `torch` (>=2.0)\n- `nnunetv2`\n\
  - `batchgenerators`, `batchgeneratorsv2`\n- `numpy`, `scipy`, `pandas`\n- `scikit‑learn`, `matplotlib`,\
  \ `shap`\n\nAll dependencies are automatically installed with the main CRISP‑SAH installation. The model:https://github.com/kiddlt/CRISP-SAH/releases/download/model/checkpoint_final.pth\n\
  \n\n\n## \U0001F680 Usage\n\n### Training a model\n\nTo train a model using this trainer, you need a\
  \ **nnU‑Net dataset** (preprocessed with `nnUNetv2_plan_and_preprocess`). Then run:\n\n```\npython -m\
  \ nnUNetTrainer.run_training \\\n    --dataset_name DATASET_NAME \\\n    --configuration CONFIG \\\n\
  \    --fold FOLD \\\n    --trainer nnUNetTrainer\nReplace DATASET_NAME, CONFIG (e.g., 2d, 3d_fullres),\
  \ and FOLD (0‑4 or all) accordingly.\n```\n### Continuing training from a checkpoint\n```\npython -m\
  \ nnUNetTrainer.run_training \\\n    --dataset_name DATASET_NAME \\\n    --configuration CONFIG \\\n\
  \    --fold FOLD \\\n    --trainer nnUNetTrainer \\\n    --c /path/to/checkpoint.pth\n```\n    \n###\
  \  Running validation only\n```\npython -m nnUNetTrainer.run_training \\\n    --dataset_name DATASET_NAME\
  \ \\\n    --configuration CONFIG \\\n    --fold FOLD \\\n    --trainer nnUNetTrainer \\\n    --val\n\
  \n```\n\n---\n\n## License\n\nThis project is licensed under the Apache License 2.0 – see the [LICENSE](LICENSE)\
  \ file for details.\n```\n"

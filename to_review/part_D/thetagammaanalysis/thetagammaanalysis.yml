readme_excerpt: "<br/>\n<p align=\"center\">\n  <h3 align=\"center\">Theta Gamma Analysis</h3>\n\n  <p\
  \ align=\"center\">\n    A Theta Gamma Analysis Repository hosted at the\n<a href=\"https://www.genzellab.com/\"\
  >Genzel Lab</a>\n    <br/>\n    <br/>\n  </p>\n</p>\n\n![Contributors](https://img.shields.io/github/contributors/AbdelRayan/ThetaGammaAnalysis?color=dark-green)\
  \ \n\n## Table Of Contents\n\n* [About the Project](#about-the-project)\n* [Getting Started](#getting-started)\n\
  \  * [Prerequisites](#prerequisites)\n  * [Installation](#installation)\n* [Usage](#usage)\n* [References](#references)\n\
  \n[//]: # (* [Roadmap]&#40;#roadmap&#41;)\n[//]: # (* [Contributing]&#40;#contributing&#41;)\n[//]:\
  \ # (* [License]&#40;#license&#41;)\n[//]: # (* [Authors]&#40;#authors&#41;)\n\n\n## About The Project\n\
  [//]: # (![Screen Shot]&#40;images/screenshot.png&#41;)\nThis repository is a culmination of all the\
  \ techniques and methods used to discover the properties of the Theta-Gamma \ncode. Currently, we're\
  \ working on a combination of techniques used in two papers (Lopes-dos-Santos et al., 2018 & Zhang et\
  \ al., 2019).\nAn ongoing project at the Donders Institute for Brain Cognition and Behaviour, Radboud\
  \ Univeristy, this project will periodically go through updates\nas the analysis is being refined, stay\
  \ tuned for more developments.\n\n\n## Getting Started\n\nMost of the analysis is carried out within\
  \ Python environments, tutorial notebooks can be loaded independently using\nGoogle Colab or locally,except\
  \ for Tutorial 4. The following steps will guide you through the installation process\n\n## Prerequisites\n\
  ### Install Python:\n * For Windows,  it's recommended to download and install Python directly from\
  \ the official Python website.\n\nMake sure to check the \"Add Python to PATH\" option during installation\
  \ so that you can run Python from the command prompt.\n * For macOS (using Homebrew):\n   ```bash\n\
  \   brew install python\n   ```\n### Verify Python Installation:\n```bash\n   python --version\n````\n\
  ### Installation\n\n### Clone The Repository\n  * Download the repository from the github repo web address\n\
  \n  * **OR** Clone it using the terminal.\n\n    Navigate to the directory where you want to clone the\
  \ repository:\n```bash\ncd /path/to/your/desired/directory\n```\n```bash\ngit clone https://github.com/AbdelRayan/ThetaGammaAnalysis.git\n\
  cd ThetaGammaAnalysis\n```\n### Install the dependencies\n * Through the `requirements.txt` file\n```bash\n\
  pip install -r requirements.txt\n```\n * **OR** Through the `setup.py` file\n```bash\npython setup.py\
  \ install\n```\n## Usage\n\nPlease go through Tutorials 1 through 4 on how the code is implemented and\
  \ patched together. \nThis section will be further detailed with more usage scenarios and implementations\n\
  \n# References\n* [1. Lopes-dos-Santos, V., van de Ven, G. M., Morley, A., Trouche, S., Campo-Urriza,\
  \ N., &amp; Dupret, D. (2018). Parsing hippocampal theta oscillations by nested spectral components\
  \ during spatial exploration and memory-guided behavior. Neuron, 100(4). doi:10.1016/j.neuron.2018.09.031](https://www.cell.com/neuron/fulltext/S0896-6273(18)30833-X)\
  \ \n* [2. Zhang, L., Lee, J., Rozell, C., &amp; Singer, A. C. (2019). Sub-second dynamics of theta-gamma\
  \ coupling in hippocampal CA1. eLife, 8. doi:10.7554/elife.44320 ](https://elifesciences.org/articles/44320)"

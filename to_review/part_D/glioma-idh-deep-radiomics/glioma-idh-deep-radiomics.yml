readme_excerpt: "# Glioma-IDH-Deep-Radiomics\nThis repository implements a deep learning-based framework\
  \ for the automatic classification of glioma IDH mutation status using multimodal MRI scans and radiomic\
  \ feature extraction.\n\n\n## Overview\nThe proposed pipeline integrates deep learning and radiomics\
  \ to provide accurate and interpretable prediction of glioma IDH status. The method is designed to support\
  \ clinical decision-making, prognosis estimation, and early risk stratification.\n\n\n## Pipeline\n\
  1. MRI preprocessing (normalization, registration)\n2. Automatic tumor segmentation using state-of-the-art\
  \ deep learning models\n3. Radiomic feature extraction (intensity, texture, shape)\n4. CNN model training\n\
  5. Model evaluation\n\n![Pipeline overview](images/pipeline.png)\n\n\n## Dataset\n- **UCSF-PDGM Dataset**\
  \  \n  Publicly available dataset for glioma grading\n  \U0001F449 https://www.cancerimagingarchive.net/collection/ucsf-pdgm/\n\
  \n\n\n## Radiomic Features\nRadiomic features are extracted following standardized definitions and include:\n\
  - First-order statistics\n- Texture features (GLCM, GLRLM, GLSZM)\n- Shape and morphological descriptors\n\
  \n## Model\nThe classification framework employs:\n\n- Convolutional layers to extract hierarchical\
  \ and local patterns from the input feature matrix\n-  Residual connections to improve gradient flow\
  \ and ensure stable training\n-  Adaptive pooling and fully connected layers to transform learned representations\
  \ into a compact embedding\n-  MLP-based classifier for final binary prediction of glioma IDH status\n\
  \n## Requirements\n- FSL \U0001F449 https://fsl.fmrib.ox.ac.uk/fsl/docs/\n- HD-BET \U0001F449 https://github.com/MIC-DKFZ/HD-BET\
  \ \n- HD-GLO-AUTO \U0001F449 https://github.com/CCI-Bonn/HD-GLIO\n\nEnsure all tools are correctly installed\
  \ and available in your system `PATH`.\n\n\nTo install all the Python dependencies, run the following\
  \ command:\n\n```bash\npip install -r requirements.txt\n\n```\n## Usage\n\nThis pipeline performs MRI\
  \ preprocessing, automatic tumor segmentation, and radiomic feature extraction from multimodal brain\
  \ MRI data.\n\n### Input Requirements\nThe input directory must contain the following NIfTI files corresponding\
  \ to a single patient:\n\n- `T1.nii.gz`\n- `CT1.nii.gz` (contrast-enhanced T1)\n- `T2.nii.gz`\n- `FLAIR.nii.gz`\n\
  \nAll images must be spatially aligned and stored in the same directory.\n\n### Running the Pipeline\
  \ for Preprocessing, Segmentation, and Feature Extraction\n```bash\npython run_pipeline.py \\\n  -i\
  \ /path/to/input_directory \\\n  -o /path/to/output_directory \\\n  --device 0 \\\n  --verbose\n````\n\
  \n- `-i` or `--input_dir`: Path to the input directory containing the input NIfTI files.\n- `-o` or\
  \ `--output_dir`: Path to the output directory where the results will be saved.\n- `--device`: Index\
  \ of the CUDA device to use (default: 0).\n- `--verbose`: Print the commands before running them (default:\
  \ False).\n\n\n### Model Training and Evaluation on UCSF-PDGM Dataset\n```bash\npython cnn.py\n```\n\
  Note: The model is trained  and tested using the UCSF-PDGM radiomic features extracted and stored in\
  \ /data/UCSF_features.csv.\n\n\n## Contact \nFor questions, feedback, or collaboration opportunities,\
  \ please contact:\n\U0001F4E7 salvatore.calderaro01@unipa.it\n"

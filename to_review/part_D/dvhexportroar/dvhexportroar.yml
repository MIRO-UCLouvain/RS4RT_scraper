readme_excerpt: "\uFEFF<div style=\"display: flex; flex-direction: column; justify-content: center; align-items:\
  \ center; height: 100vh; text-align: center;\">\n    <h1 style=\"font-size: 48px; border-bottom: none;\
  \ margin: 0px 0px 200px 0px;\">DVH Batch Export\n    <br>Standalone ESAPI app\n    <br>Deployment Guide</h1>\n\
  \    <h2 style=\"font-size: 24px; border-bottom: none; margin: 0;\">Department of Radiation Oncology</h2>\n\
  \    <h2 style=\"font-size: 20px; border-bottom: none; margin: 0;\">University of Michigan</h2>\n  \
  \  <h3 style=\"font-size: 20px; border-bottom: none; margin: 10;\">Jan 12, 2026</h3>\n</div>\n\n\n\n\
  \n# Disclaimer\n\n NOTICE: © 2022 The Regents of the University of Michigan\n\n The Chuck Mayo Lab -\
  \ https://medicine.umich.edu/dept/radonc/research/research-laboratories/physics-laboratories \n\n The\
  \ software is solely for non-commercial, non-clinical research and education use in support of the publication.\n\
  \ It is a decision support tool and not a surrogate for professional clinical guidance and oversight.\n\
  \ The software calls APIs that are owned by Varian Medical Systems, Inc. (referred to here as Varian),\n\
  \ and you should be aware you will need to obtain an API license from Varian in order to be able to\
  \ use those APIs.\n Extending the [No Liability] aspect of these terms, you agree that as far as the\
  \ law allows,\n Varian and Michigan will not be liable to you for any damages arising out of these terms\
  \ or the use or nature of the software,\n under any kind of legal claim, and by using the software,\
  \ you agree to indemnify the licensor and Varian in the event that the\n licensor or Varian is joined\
  \ in any lawsuit alleging injury or death or any other type of damage (e.g., intellectual property infringement)\n\
  \ arising out of the dissemination or use of the software.\n\n\n<div style=\"page-break-after: always;margin-bottom:120px;\"\
  ></div>\n\n\n# Overview\n\nGitHub repository [DVHExportROAR](https://github.com/RadOncDev/DVHExportROAR)\
  \ contains source code and instructions for compiling and deploying standalone desktop application **DVHExportROAR**\
  \ and related files, which can be used to extract DVH data from a thick Eclipse client.\n\nThe software\
  \ is solely for non-commercial, non-clinical research and education use in support of the publication.\n\
  \n\n# Compile the code\n\nClone from GitHub repository [DVHExportROAR](https://github.com/RadOncDev/DVHExportROAR)\
  \ to a local machine where Varian Eclipse treatment planning system is installed (thick Eclipse client).\n\
  \nThe code should be located in a local drive on the computer (e.g. C:/ D:/). Residing on a Remote network\
  \ drive (like T:/ Z:/) can cause unexplained issues in building/executing the code.\n\nOpen the solution\
  \ file **DVHExportROAR.sln** with [Visual Studio](https://visualstudio.microsoft.com/). \n\n<div style=\"\
  text-align: center;\">\n    <img src=\"./Doc/images/01_folder_structure.JPG\" alt=\"Sample Image\" width=\"\
  500\" style=\"border: 2px solid gray;\"/>\n</div>\n<br>\n\nThe code needs to be compiled with x64 configuration.\
  \ Open **Configuration Manager** and make sure each project have **Platform** set as **x64**.\n\n<div\
  \ style=\"text-align: center;\">\n    <img src=\"./Doc/images/02_configurationManager.JPG\" alt=\"Sample\
  \ Image\" width=\"400\" style=\"border: 2px solid gray;\"/>\n</div>\n<br>\n\n\nIf you don't see **x64**\
  \ exist in the pulldown list, create it from **\\<New...\\>** option. Create x64 platform by 'Copy settings\
  \ from Any CPU'. Then click OK.\n\n<div style=\"text-align: center;\">\n    <img src=\"./Doc/images/02_x64.JPG\"\
  \ alt=\"Sample Image\" width=\"400\" style=\"border: 2px solid gray;\"/>\n</div>\n<br>\n\n\n\n\nMake\
  \ sure **x64** is selected before you build the solution:\n\n<div style=\"text-align: center;\">\n \
  \   <img src=\"./Doc/images/02_x64_confirm.JPG\" alt=\"Sample Image\" width=\"250\" style=\"border:\
  \ 2px solid gray;\"/>\n</div>\n<br>\n\n \nAdd reference to two Varian VMS.TPS dll files. (If you are\
  \ on a thick client where Eclipse is installed locally, this should happen automatically when you build\
  \ the solution, since the two dlls are already in system GAC. If not, manually locate these two dll\
  \ files on your machine.)\n\nDll file for reference `UMRO.Libs.DVHAnalysis-2.0.3.1.dll` is located in\
  \ the `resources` sub folder.\n\n<div style=\"text-align: center;\">\n    <img src=\"./Doc/images/03_reference.JPG\"\
  \ alt=\"Sample Image\" width=\"350\" style=\"border: 2px solid gray;\"/>\n</div>\n<br>\n\n \n\n\nBuild\
  \ this solution/project. You should see the `DVHExportROAR_v1.2.0.exe` file produced in `bin\\debug`:\n\
  \n<div style=\"text-align: center;\">\n    <img src=\"./Doc/images/03_buildResult.JPG\" alt=\"Sample\
  \ Image\" width=\"600\" style=\"border: 2px solid gray;\"/>\n</div>\n<br>\n\n\n# How to use\n\n## Set\
  \ up folder and prepare input file of plan list\n\nCreate a list of plans/plansums you want to process\
  \ and put it in a text file, e.g. planlist.txt, as in the following example. Requirements for this file\
  \ are:\n\n1. Each row should have 5 **tab-delimited** columns: PatientMRN (tab) CourseID (tab) Plan/PlanSumID\
  \ (tab) NA (tab) NFraction. The 4th column is not used (NA is just a placeholder).\n2. Rows need to\
  \ be sorted by first column **PatientMRN**, so that the plans/plansums of the same patient have to stay\
  \ together.\n\n<div style=\"text-align: center;\">\n    <img src=\"./Doc/images/03_planlist.png\" alt=\"\
  Sample Image\" width=\"600\" style=\"border: 2px solid gray;\"/>\n</div>\n<br>\n\nThere is an example\
  \ `planlist.txt` file located in `resources` sub folder\n\n## Run the script\n\nWe need to execute the\
  \ compiled `DVHExportROAR_v1.2.0.exe` file in a terminal to get DVH. We recommand `Git Bash` terminal\
  \ interface on Windows machine, which comes with installing Git on Windows. All the following screenshot\
  \ are from Git Bash on Windows.\n\nIn the same folder with the exe file, create a new folder (e.g. test_set1).\
  \ Then in a Git Bash terminal, change directory (cd) to the `test_set1` folder:\n\nCopy `batch.sh` script\
  \ file from `resources` folder to `test_set1`. Execute the batch.sh script with 2 arguments: (1) inputlist\
  \ file (e.g. ./planlist.txt) (2) number of instances to run (this is ideally the number of CPU cores\
  \ on your machine, I used 6 as an example in the screenshot below).\n\n<div style=\"text-align: center;\"\
  >\n    <img src=\"./Doc/images/04_6cores.png\" alt=\"Sample Image\" width=\"800\" style=\"border: 2px\
  \ solid gray;\"/>\n</div>\n<br>\n\nIn the `batch.sh` file, the plan list in `planlist.txt` file is splited\
  \ into n smaller chunks, and each chunk is given to an instance of `DVHExportROAR_v1.2.0.exe` to execute\
  \ on a CPU core. The standard output of `DVHExportROAR_v1.2.0.exe` is piped (>) into `i_output.txt`\
  \ file and standard error is piped (2>) into `i_log.txt` file. (as shown in the following section of\
  \ `batch.sh`)\n\n<div style=\"text-align: center;\">\n    <img src=\"./Doc/images/04_bashfile.png\"\
  \ alt=\"Sample Image\" width=\"800\" style=\"border: 2px solid gray;\"/>\n</div>\n<br>\n\nYou can execute\
  \ `DVHExportROAR_v1.2.0.exe` directly in a terminal as well, to test its function or to make up for\
  \ a failed CPU core from a batch run (you will need to check the i_log.txt file to see where the failure\
  \ happened and truncate the i_input_list file from there):\n\n<div style=\"text-align: center;\">\n\
  \    <img src=\"./Doc/images/04_singleRun.png\" alt=\"Sample Image\" width=\"1000\" style=\"border:\
  \ 2px solid gray;\"/>\n</div>\n<br>\n\nIn a testing case of processing 5000 plans on a machine with\
  \ 6 CPU cores and 32GB memory. It took about 12 hours to finish (different core finishes at a different\
  \ pace)\n\n\n\n## Monitor the progress\n\nYou can monitor the progress with command `wc -l * `, which\
  \ shows how many lines in each file:\n\n\n<div style=\"text-align: center;\">\n    <img src=\"./Doc/images/05_wc.png\"\
  \ alt=\"Sample Image\" width=\"800\" style=\"border: 2px solid gray;\"/>\n</div>\n<br>\n\nor you can\
  \ use command `tail *log* -n 50 | grep ')'` to peek the end of the i_log.txt files. In the following\
  \ example, (318/529) shows the 318th patient out of 535 total is now being processed in this CPU instance:\n\
  \n\n<div style=\"text-align: center;\">\n    <img src=\"./Doc/images/06_taillog.png\" alt=\"Sample Image\"\
  \ width=\"800\" style=\"border: 2px solid gray;\"/>\n</div>\n<br>\n\nAnd you may want to check the Windows\
  \ TaskManager to see if memory is enough: (memory consumption will keep increasing, if it's not enough,\
  \ reduce number of plans in the list, or reduce the instance from 6 to 3.)\n\n\n<div style=\"text-align:\
  \ center;\">\n    <img src=\"./Doc/images/07_memory.png\" alt=\"Sample Image\" width=\"600\" style=\"\
  border: 2px solid gray;\"/>\n</div>\n<br>\n\nIf error happens, check the i_log.txt files for more detailed\
  \ info.\n\n# Check the Output\n\nExtracted DVH curves are stored in the `i_output.txt` files. Each line\
  \ contains DVH info of one structure, which has the following **tab-delimited** columns:\n\n<div style=\"\
  text-align: center;\">\n    <img src=\"./Doc/images/08_output.png\" alt=\"Sample Image\" width=\"1200\"\
  \ style=\"border: 2px solid gray;\"/>\n</div>\n<br>\n\nIn the above example, you see dose data in 'cGy'\
  \ unit. After version 1.2.0, all output files have dose in Gy, even if the host Eclipse environment\
  \ has cGy in system setting.\n\nTo ensure the completion of the extraction, check the tail of each `i_log.txt`\
  \ file. You should see the following message:\n\n\n<div style=\"text-align: center;\">\n    <img src=\"\
  ./Doc/images/09_Log_complete.JPG\" alt=\"Sample Image\" width=\"600\" style=\"border: 2px solid gray;\"\
  />\n</div>\n<br>\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n"

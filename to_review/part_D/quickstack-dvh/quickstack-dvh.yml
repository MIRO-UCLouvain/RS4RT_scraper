readme_excerpt: "# RiverX Base Vite Template\n\nProduction-ready base template for RiverX-generated apps\
  \ using Vite + React + TypeScript + Tailwind + shadcn/ui (default style).\n\n## Commands\n\nInstall\
  \ dependencies:\n\n```bash\npnpm install\n```\n\nStart development server:\n\n```bash\npnpm run dev\n\
  ```\n\nBuild for production:\n\n```bash\npnpm run build\n```\n\nPreview production build:\n\n```bash\n\
  pnpm run preview\n```\n\nType check:\n\n```bash\npnpm run typecheck\n```\n\n## Environment Variables\n\
  \nCopy `.env.example` to `.env` (or `.env.local`) and adjust as needed.\n\n- `VITE_APP_NAME`: App display\
  \ name in header and UI. Default: `RiverX App`\n- `VITE_API_BASE_URL`: Base URL for API wrapper in `src/lib/api.ts`.\
  \ Default: `/api`\n\n## Project Structure\n\n```text\nsrc/\n  app/\n    App.tsx\n    routes.tsx\n  pages/\n\
  \    home.tsx\n    NotFoundPage.tsx\n  components/\n    layout/\n      AppLayout.tsx\n      Header.tsx\n\
  \      Footer.tsx\n      Navbar.tsx\n    ui/\n      Button.tsx\n      Card.tsx\n      Input.tsx\n  lib/\n\
  \    api.ts\n    env.ts\n    utils.ts\n  styles/\n    globals.css\n  main.tsx\nscripts/\n  dev-supervisor.js\n\
  \  git-poll.js\n  error-reporter.ts\n  db-init.js\ncomponents.json\nDESIGN.md\n```\n\n## Homepage Structure\n\
  \n`src/pages/home.tsx` currently includes a full landing flow:\n\n1. Full-width hero band (CTA-focused)\n\
  2. Trust/logo strip\n3. Outcome cards\n4. Product story demo section with image\n5. Demo content blocks\
  \ with images\n6. Feature narrative rows\n7. Use-case cards with images\n8. Testimonials + lead capture\
  \ panel\n9. Final conversion CTA section\n\n## RiverX Agent Notes\n\n- Keep routing updates in `src/app/routes.tsx`.\n\
  - Keep page-level composition in `src/pages`.\n- Use shadcn-style primitives in `src/components/ui`.\n\
  - Keep backend integration logic in `src/lib/api.ts` and env access in `src/lib/env.ts`.\n- Generate/update\
  \ `project.md` in RiverX first run and after major architecture changes.\n- Keep files small and deterministic\
  \ for safe AI editing.\n\n## Backend Integration Direction\n\nThis template has no backend dependency\
  \ by default. You can connect:\n\n- PocketBase\n- Supabase\n- PostgreSQL-backed REST APIs\n- Custom\
  \ HTTP APIs\n\nby extending `src/lib/api.ts` without changing overall page/component structure.\n"

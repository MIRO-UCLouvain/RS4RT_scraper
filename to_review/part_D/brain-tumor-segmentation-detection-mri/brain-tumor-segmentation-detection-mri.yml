readme_excerpt: "# \U0001F9E0 Brain Tumor Segmentation and Detection using BraTS MRI Dataset\n\n## \U0001F4CC\
  \ Project Overview\n\nThis project focuses on **brain tumor segmentation and detection** from medical\
  \ MRI images using deep learning techniques.  \nIt is based on the **BraTS MRI dataset**, which is widely\
  \ used for brain tumor analysis and medical image segmentation research.\n\nThe project includes a complete\
  \ workflow starting from MRI preprocessing, tumor segmentation using a **U-Net architecture**, detection\
  \ using **transfer learning**, and final model evaluation with visualization of results.\n\n---\n\n\
  ## \U0001F3AF Objectives\n\nThe main objectives of this project are:\n\n- Preprocess MRI brain images\
  \ from the BraTS dataset.\n- Extract useful image slices for tumor analysis.\n- Build and train a U-Net\
  \ model for brain tumor segmentation.\n- Apply transfer learning for tumor detection.\n- Evaluate model\
  \ performance using visual and quantitative results.\n- Analyze computational impact using emissions\
  \ tracking.\n\n---\n\n## \U0001F9EC Dataset\n\nThe project uses the **BraTS Brain Tumor Segmentation\
  \ Dataset**, which contains multimodal MRI scans used for brain tumor segmentation tasks.\n\nTypical\
  \ MRI modalities include:\n\n- **T1**\n- **T1ce**\n- **T2**\n- **FLAIR**\n- **Segmentation masks**\n\
  \nThe dataset is organized and processed to extract relevant MRI slices containing tumor regions.\n\n\
  ---\n\n## \U0001F3D7️ Project Structure\n\n```text\nBrain-Tumor-Segmentation-Detection-MRI/\n│\n├──\
  \ data/\n│   └── Processed MRI images and masks\n│\n├── dataset/\n│   └── BraTS dataset files\n│\n├──\
  \ results/\n│   └── Evaluation results and visualizations\n│\n├── 01_Pre-traitement.ipynb\n│   └── MRI\
  \ preprocessing and slice extraction\n│\n├── 02_Segmentation_UNet.ipynb\n│   └── U-Net model implementation\
  \ for tumor segmentation\n│\n├── 03_Detection_TransferLearning.ipynb\n│   └── Tumor detection using\
  \ transfer learning\n│\n├── 04_Evaluation_et_Visualisation.ipynb\n│   └── Model evaluation and visualization\
  \ of predictions\n│\n├── train.py\n│   └── Training script\n│\n├── utils.py\n│   └── Utility functions\
  \ for preprocessing and training\n│\n│\n├── model.pth\n│   └── Trained model checkpoint\n│\n├── best_model.pth\n\
  │   └── Best trained model weights\n│\n└── README.md\n"

readme_excerpt: "# \U0001F9E0 Brain Tumor Detection, Classification & Segmentation\n\nA deep learning–based\
  \ medical imaging system that detects, classifies, and segments brain tumors from MRI scans.  \nThis\
  \ system is a full-stack AI application that integrates a web interface with a deep learning backend\
  \ to provide real-time medical image analysis.\n\n---\n### \U0001F3E0 Home Page\n![Home Page](https://github.com/Wogenie/Brain-Tumor-Detection-Classification-Segmentation/blob/026c88efb9e5f08b5f239f542865535a84dd9695/web%20images%20result/home%20page.jpeg)\n\
  \n### \U0001F50D Prediction Result\n![model predicted result](https://github.com/Wogenie/Brain-Tumor-Detection-Classification-Segmentation/blob/53fe0cb9804d6310d7caee7756985a0727df13d4/web%20images%20result/predicted%20image.jpeg)\n\
  ---\n## \U0001F680 Key Capabilities\n\n- \U0001F9E0 Brain tumor detection from MRI scans  \n- \U0001F52C\
  \ Tumor classification (Glioma, Meningioma, Pituitary, No Tumor)  \n- \U0001F3AF Tumor segmentation\
  \ (tumor localization mask)  \n- \U0001F4CA Confidence score for predictions  \n- \U0001F5BC️ Real-time\
  \ MRI upload and visualization  \n- \U0001F310 Full-stack web application (Frontend + Backend + AI Model)\n\
  \n---\n\n## \U0001F3D7️ System Architecture\n\n- **Frontend:** HTML, CSS, JavaScript (user interface)\
  \  \n- **Backend:** FastAPI handling API requests and inference  \n- **AI Model:** CNN-based classification\
  \ + segmentation (TensorFlow / Keras)  \n- **Processing Flow:** Image preprocessing → Model inference\
  \ → Prediction → Visualization  \n\n---\n\n## \U0001F504 System Workflow\n\n```text\nMRI Image Upload\n\
  \      ↓\nFrontend (UI)\n      ↓\nFastAPI Backend\n      ↓\nPreprocessing (resize, normalize)\n    \
  \  ↓\nDeep Learning Model\n   ├── Classification (Tumor Type)\n   └── Segmentation (Tumor Mask)\n  \
  \    ↓\nConfidence Score Calculation\n      ↓\nResults Sent to Frontend\n      ↓\nVisualization in Web\
  \ UI\n```\n\n---\n\n## \U0001F4C1 Project Structure\n\n```\nBrain Tumor Detection Classification Segmentation/\n\
  │\n├── Web side/\n│   ├── Frontend/\n│   │   ├── HTML / CSS / JS files\n│   │\n│   ├── Backend/\n│ \
  \  │   ├── main.py\n│   │   ├── models/\n│   │   │   ├── trained_model.keras\n│\n├── Datasets/\n├──\
  \ web_images_result/\n├── README.md\n└── .gitignore\n```\n\n---\n\n## \U0001F4CC How It Works\n\n- Upload\
  \ MRI image via web interface  \n- Image is preprocessed (resize, normalization)  \n- Deep learning\
  \ model performs inference  \n  - Tumor detection  \n  - Tumor classification  \n  - Tumor segmentation\
  \  \n- Results are returned to backend  \n- Frontend displays prediction and segmentation mask  \n\n\
  ---\n\n## \U0001F9E0 Tumor Classes\n\n- Glioma  \n- Meningioma  \n- Pituitary Tumor  \n- No Tumor  \n\
  \n---\n\n## \U0001F4C8 Performance\n\n- Accuracy: ~99% (depending on dataset/model)  \n- Confidence\
  \ Example: 99.97%  \n\n---\n\n## \U0001F5A5️ UI Preview\n\n<p align=\"center\">\n  <img src=\"web_images_result/home_page.jpeg\"\
  \ width=\"45%\" />\n  <img src=\"web_images_result/predicted_image.jpeg\" width=\"45%\" />\n</p>\n\n\
  ---\n\n## ⚙️ How to Run the Project\n\n```bash\ngit clone <repo-url>\ncd Brain-Tumor-Detection\npip\
  \ install -r requirements.txt\nuvicorn Web_side.Backend.main:app --reload\n```\n\nThen open:\n\n```\n\
  http://127.0.0.1:8000\n```\n\n---\n\n## \U0001F468‍\U0001F4BB Author\n\n© 2026 Neural Engineers — Wogenie\

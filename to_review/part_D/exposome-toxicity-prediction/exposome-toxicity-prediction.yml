readme_excerpt: "# Blood Exposome Toxicity Prediction\n\nThis repository provides a computational pipeline\
  \ to predict compound toxicity across **47 Tox21 assays** and **GHS acute oral toxicity** categories.\
  \ It leverages deep learning models trained using the **Directed Message Passing Neural Network (DMPNN)**\
  \ architecture from the Chemprop package.\n\n---\n\n## Project Overview\n\nThe goal of this project\
  \ is to enable high-throughput toxicity screening of blood exposome compounds using pre-trained models.\
  \ The predictions include:\n\n- Binary classification for 47 Tox21 assays\n- GHS acute oral toxicity\
  \ tagging\n\n---\n\n##  Installation\n\nTo set up the environment locally, use the provided `environment.yml`\
  \ file. It contains all dependencies needed to run the prediction pipeline.\n\n```bash\nconda env create\
  \ -f environment.yml\nconda activate chemprop_env\nchemprop --help\npython make_preds.py\n\n```\n\n\
  This project was developed and tested using Conda. While Conda is recommended for setup, a pip-compatible\
  \ requirements.txt is also included.\n\n---\n\n## Usage\n\nThe make_preds.py script can be used to run\
  \ the toxicity classification predictions as follows:\n\n```bash\npython make_preds.py input_file.csv\
  \ output_file.csv\n```\n\nThe script will prompt users to select 2 files\n(1) A list of SMILES in a\
  \ .csv file format with a single column of SMILES string \n(2) Name for an output .csv file which will\
  \ contain bioactivity predictions from 47 assays as well as GHS acute oral toxicity classification\n\
  \nFor ease of use and minimal local setup, all calculations can be run directly via the following Google\
  \ Colab note book:\nhttps://colab.research.google.com/drive/1bqjZ_ap2TBZrRWik5qrSr2AvZzngJEW4#scrollTo=au4ebqnK9-Kw\n"

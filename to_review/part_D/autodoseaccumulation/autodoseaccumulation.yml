readme_excerpt: "# Auto Dose Accumulation\n\nThis project demonstrates how to automate basic plan copying\
  \ and dose accumulation\nusing the Varian ESAPI API with F#. The library builds against .NET Framework\
  \ 4.8\nand references the ESAPI assemblies installed with Eclipse 18.\n\n## Building\n1. Ensure the\
  \ machine has .NET Framework 4.8 installed.\n2. Open `autoDoseAccumulation.sln` in Visual Studio.\n\
  3. Fix the reference paths to `VMS.TPS.Common.Model.*` assemblies if needed so they\n   point to your\
  \ local Eclipse installation.\n4. Build the solution in 64‑bit mode.\n\n## Running\nThe compiled assembly\
  \ is an ESAPI script. Deploy the resulting `*.esapi.dll` file\naccording to your clinic's ESAPI scripting\
  \ guidelines and run it from Eclipse.\n\n"

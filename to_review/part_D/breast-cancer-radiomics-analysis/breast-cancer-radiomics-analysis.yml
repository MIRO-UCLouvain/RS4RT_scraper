readme_excerpt: '# breast-cancer-analysis

  This project analyzed breast cancer radiomic feature sets generated from Semi-NMF,

  Sparse-NMF, and Pyradiomics/Convex-NMF approaches. After cleaning and standardizing

  the feature matrices, exploratory analysis was performed using variance ranking,

  correlation analysis, PCA, and unsupervised clustering.


  The focused correlation heatmaps were more useful than full heatmaps because the full

  Pyradiomics matrix contains hundreds of features and becomes visually overcrowded.

  Feature redundancy analysis identified highly correlated feature pairs using an

  absolute Pearson correlation threshold of 0.90. PCA was used to evaluate whether the

  feature space could be summarized by fewer major components, and PCA loadings were

  extracted to identify the features contributing most strongly to PC1 and PC2.


  KMeans clustering was applied to the first two principal components to explore whether

  patients formed unsupervised subgroups. Silhouette score was used to choose the most

  reasonable number of clusters between k=2 and k=6. Cross-dataset comparisons were

  performed using matching feature names rather than column positions, reducing the risk

  of misleading comparisons caused by different file structures.


  Overall, the analysis provides a cleaner and more reproducible workflow for exploring

  radiomic feature structure, redundancy, dimensionality, and patient-level grouping.

  '

readme_excerpt: "---\ntitle: Toxicity Predictor\nemoji: \U0001F9EA\ncolorFrom: blue\ncolorTo: indigo\n\
  sdk: docker\napp_file: app.py\npinned: false\n---\n\n# \U0001F9EA Toxicity Prediction App\n\nThis app\
  \ predicts the likelihood of a compound being toxic based on the **SR-ARE (Stress Response - Antioxidant\
  \ Response Element) assay** from the NIH Tox21 dataset. It uses an XGBoost machine learning model trained\
  \ on molecular fingerprints ([Morgan Fingerprints](https://rdkit.org/docs/GettingStartedInPython.html#morgan-fingerprints-circular-fingerprints)).\n\
  \n## How to Use\n\n1.  **Enter a SMILES string** in the input box (e.g., `CCO` for ethanol, `CN1C=NC2=C1C(=O)N(C(=O)N2C)C`\
  \ for caffeine).\n2.  The app will display the 2D structure of the molecule.\n3.  The model will output\
  \ two predicted probabilities:\n    -   **Probability of NON-TOXIC**\n    -   **Probability of TOXIC**\n\
  4.  An interpretation guide provides context for the result.\n\n## Model Details\n\n-   **Task:** Binary\
  \ classification (Toxic vs. Non-Toxic)\n-   **Model:** XGBoost Classifier\n-   **Feature:** 2048-bit\
  \ Morgan Fingerprints (radius=2)\n-   **Training Data:** Tox21 SR-ARE assay\n-   **Performance:** AUC-PR\
  \ = 0.34, Recall = 47%\n\n## Limitations & Scope\n\nThis model is trained specifically to predict activity\
  \ in the **SR-ARE** assay, which measures activation of the antioxidant response element (ARE) pathway,\
  \ a specific type of oxidative stress. It does not predict general toxicity or other toxicity endpoints\
  \ (e.g., genotoxicity, hepatotoxicity).\n\n## \U0001F6E0️ Build & Run Locally\n\n```bash\n# Clone the\
  \ repository\ngit clone https://github.com/BrightoKusi/Drug-Toxicity-Prediction-App.git\ncd tox21_project\n\
  \n# Build the Docker image\ndocker build -t toxicity-predictor .\n\n# Run the container\ndocker run\
  \ -p 8501:8501 toxicity-predictor"

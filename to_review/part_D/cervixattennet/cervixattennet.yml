readme_excerpt: "# CervixAttenNet: Transformer-Based MR-to-CT Synthesis for Radiotherapy Planning\n\n\
  ## Overview\n\nThis repository contains the implementation of **CervixAttenNet**, a transformer-based\
  \ deep learning model for synthetic CT (sCT) generation from MR images. This work is part of our study\
  \ submitted to Scientific Reports. The method aims to improve the accuracy of MR-only radiotherapy planning\
  \ for cervical cancer by generating high-quality sCT images.\n\n\n## Features\n\n- Transformer-based\
  \ architecture with query-selected attention for improved image synthesis.\n- Comprehensive evaluation\
  \ using image quality metrics (e.g., MAE, PSNR, SSIM) and dosimetric analysis.\n- Code for data preprocessing,\
  \ model training, and evaluation.\n\n## Repository Contents\n\n- `src/`: Main code for the model implementation.\n\
  - `data/`: Scripts for data preprocessing and augmentation.\n- `results/`: Example outputs, including\
  \ sCT images and evaluation metrics.\n- `README.md`: Overview and usage instructions.\n\n## Requirements\n\
  \n- Python 3.8+\n- PyTorch 1.10+\n- CUDA 11.0+\n- Additional dependencies are listed in `requirements.txt`.\n\
  \n## Installation\n\n1. Clone the repository:\n   ```bash\n   git clone https://github.com/JianJuly/CervixAttenNet.git\n\
  \   cd CervixAttenNet\n   ```\n\n2. Install dependencies:\n   ```bash\n   pip install -r requirements.txt\n\
  \   ```\n\n## Usage\n\n### 1. Preprocess Data\nUse the scripts in the `data/` directory to prepare your\
  \ MRI and CT datasets. Ensure the datasets are formatted as described in the manuscript.\n\n### 2. Train\
  \ the Model\nRun the training script with default settings:\n   ```bash\n   python src/train.py --config\
  \ configs/default.yaml\n   ```\n\n### 3. Evaluate the Model\nEvaluate the trained model on the testing\
  \ dataset:\n   ```bash\n   python src/evaluate.py --model checkpoints/best_model.pth\n   ```\n\n## Citation\n\
  \nIf you use this code, please cite our work:\n```\n@article{Transformer-Based Magnetic Resonance-to-Computed\
  \ Tomography Synthesis for Radiotherapy for Cervical Cancer: Model Development and Clinical Evaluation,\n\
  \  title={Transformer-Based Magnetic Resonance-to-Computed Tomography Synthesis for Radiotherapy Planning},\n\
  \  author={Jian et al.},\n  journal={Scientific Reports},\n  year={2025}\n}\n```\n\n## License\n\nThis\
  \ project is licensed under the MIT License. See the `LICENSE` file for details.\n"

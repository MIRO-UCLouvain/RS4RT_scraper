readme_excerpt: "# Slicer IMPACT-DoseAcc\n\n<img src=\"ImpactDoseAcc.png\" alt=\"IMPACT DoseAcc logo\"\
  \ width=\"150\" align=\"right\">\n\n[![License](https://img.shields.io/badge/License-Apache%202.0-blue.svg)](LICENSE)\n\
  \n## Overview\n\nIMPACT-DoseAcc is a 3D Slicer extension for dose accumulation and uncertainty quantification\
  \ in radiotherapy. It is organized into four workflow phases:\n\n- **Phase 1 - Prescription**: prepare\
  \ reference volumes, sessions, and export options.\n- **Phase 2 - Accumulation**: accumulate dose with\
  \ optional uncertainty handling.\n- **Phase 3 - Metrics**: compute MAE, gamma pass rates, and summary\
  \ statistics.\n- **Phase 4 - DVH**: generate per‑segment DVHs with optional uncertainty traces.\n\n\
  ## Demo Video\n\nComing soon.\n\n## Figures\n\nExample visualizations are available in the `docs/` folder:\n\
  \n<p align=\"center\">\n  <img src=\"docs/dose_accumulation.png\" alt=\"Dose accumulation\" width=\"\
  45%\" />\n  <img src=\"docs/delivered_dose.png\" alt=\"Delivered dose\" width=\"45%\" />\n</p>\n\n<p\
  \ align=\"center\">\n  <img src=\"docs/DVH.png\" alt=\"DVH example\" width=\"45%\" />\n  <img src=\"\
  docs/QA.png\" alt=\"QA example\" width=\"45%\" />\n</p>\n\n## Requirements\n\n- **3D Slicer** (5.10\
  \ recommended)\n- **SlicerRT** for gamma computation (DoseComparison module)\n- Optional: `matplotlib`\
  \ for PNG export of DVH plots\n\nMost scientific Python dependencies (`numpy`, `vtk`, etc.) are bundled\
  \ with Slicer.\n\n## Installation\n\n### Load as a local module\n\n1. Clone the repository:\n\n```bash\n\
  git clone https://github.com/vboussot/SlicerImpactDoseAcc.git\n```\n\n2. In Slicer: `Edit → Application\
  \ Settings → Modules → Additional module paths`\n3. Add the `ImpactDoseAcc` folder (inside this repo)\
  \ and restart Slicer.\n\n\n## Quick Start\n\n1. **Prescription**: choose the reference CT, select dose(s)\
  \ and DVF(s), and set output name.\n2. **Accumulation**: select sessions, choose a strategy, and compute\
  \ the accumulated dose.\n3. **Metrics**: compute MAE, gamma, and uncertainty summaries.\n4. **DVH**:\
  \ select segments and generate plots/tables.\n\n## Outputs (default names)\n\nDepending on the options\
  \ chosen, the module writes:\n\n- `dose_list_<name>` (mean dose)\n- `min_dose_<name>` / `max_dose_<name>`\n\
  - `uncertainty_dose_<name>`\n- `dvf_magnitude_<name>`\n\n## Contributing\n\n- Open an issue to discuss\
  \ changes or feature requests\n- Submit focused pull requests with a clear description\n\n## License\n\
  \nThis project is distributed under the **Apache License 2.0**. See `LICENSE`.\n\n\n\n\n"

readme_excerpt: "# MonteCarlo-Radiation-Dose\nMonte Carlo simulation for radiation dose calculation in\
  \ a water phantom\n# Monte Carlo Radiation Dose Simulation\n\nThis project is a simulation of radiation\
  \ dose deposition in a water phantom using Monte Carlo techniques. It aims to model photon interactions\
  \ such as Compton scattering, photoelectric absorption, Rayleigh scattering, and pair production to\
  \ compute 3D dose distributions. This project showcases the practical application of Monte Carlo methods\
  \ in medical physics and radiation therapy.\n\n---\n\n## Key Features\n\n- **Photon Transport Simulation:**\
  \ Models the transport and interactions of photons in a voxelized water phantom.\n- **Physics-Based\
  \ Interactions:** Simulates Compton scattering, photoelectric absorption, Rayleigh scattering, and pair\
  \ production.\n- **3D Dose Distribution:** Generates a 3D grid representing the dose deposited in each\
  \ voxel.\n- **Visualizations:** Includes graphical plots of dose distribution for analysis.\n\n---\n\
  \n## How It Works\n\nThe simulation follows these steps:\n1. Photons are generated with a specified\
  \ energy (e.g., 10 MeV) and randomly placed within the phantom.\n2. The transport of each photon is\
  \ simulated until it loses all energy or exits the phantom.\n3. Energy deposition is calculated based\
  \ on interaction probabilities for the relevant physical processes.\n4. The dose is normalized to provide\
  \ a realistic distribution within the phantom.\n\n---\n\n## Results and Outputs\n\nThe simulation outputs\
  \ include:\n- **Normalized 3D dose distribution data.**  \n- **Plots** illustrating the dose deposition\
  \ within the water phantom.\n\n\n\n---\n\n## Applications\n\nThis simulation can be used for:\n- **Medical\
  \ Physics Training:** Understanding radiation transport and dose deposition.\n- **Validation:** Comparing\
  \ Monte Carlo results with experimental or clinical data.\n- **Portfolio Building:** Demonstrating technical\
  \ and computational expertise.\n\n---\n\n## Future Directions\n\n- Simulate dose deposition in heterogeneous\
  \ phantoms (e.g., tissue-equivalent materials).  \n- Incorporate electron transport for more detailed\
  \ simulations.  \n- Extend visualizations to 3D rendering for advanced analysis.\n\n---\n\n\n## Acknowledgments\n\
  \nThis project is inspired by the principles of radiation therapy and medical physics, utilizing Monte\
  \ Carlo techniques to provide insights into photon interactions and dose deposition.\n"

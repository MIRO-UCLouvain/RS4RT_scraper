readme_excerpt: "# Guía para la obtención de Radiómicas con 3D Slicer y PyRadiomics  \n\n## ![Bandera\
  \ de España](https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Flag_of_Spain.svg/20px-Flag_of_Spain.svg.png)\
  \ **Español**  \nEste repositorio ofrece una guía práctica para obtener características radiómicas a\
  \ partir de imágenes de TAC utilizando el software **3D Slicer** y la extensión **PyRadiomics**. La\
  \ guía está diseñada para trabajar con conjuntos de datos DICOM que incluyen imágenes de TAC, archivos\
  \ RSTRUCT y/o segmentaciones en formato SEG.  \n\nSe cubren los siguientes pasos:  \n- Preparación del\
  \ entorno.\n- Importación de imágenes DICOM en 3D Slicer.  \n- Visualización y manipulación de las imágenes\
  \ y las estructuras segmentadas.  \n- Extracción de características radiómicas con PyRadiomics.  \n\n\
  Este repositorio está dirigido a investigadores, médicos y profesionales interesados en el análisis\
  \ radiómico para estudios médicos y aplicaciones clínicas.  \n\nPara acceder a todo el contenido de\
  \ la guía, acceda a la sección [**Wiki**](https://github.com/rubpergar/3D-Slicer-guide/wiki).\n\n![image](https://github.com/user-attachments/assets/799a8ff5-dce9-4e1d-8a4c-603c490a7cc6)\n\
  \n---\n\n# Guide for obtaining Radiomics with 3D Slicer and PyRadiomics\n\n## ![Bandera de Reino Unido](https://upload.wikimedia.org/wikipedia/en/thumb/a/ae/Flag_of_the_United_Kingdom.svg/20px-Flag_of_the_United_Kingdom.svg.png)\
  \ ![Bandera de EE.UU.](https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Flag_of_the_United_States.svg/20px-Flag_of_the_United_States.svg.png)\
  \ **English**\nThis repository provides a practical guide to obtaining radiomic features from CT images\
  \ using **3D Slicer** and the **PyRadiomics** extension. The guide is designed to work with DICOM datasets,\
  \ including CT images, RSTRUCT files, and/or SEG segmentations.  \n\nThe following steps are covered:\
  \  \n- Environment setup.\n- Importing DICOM images into 3D Slicer.  \n- Visualizing and manipulating\
  \ images and segmented structures.  \n- Extracting radiomic features using PyRadiomics.  \n\nThis repository\
  \ is aimed at researchers, clinicians, and professionals interested in radiomic analysis for medical\
  \ studies and clinical applications.  \n\nTo access all the content of the guide, go to the [**Wiki**](https://github.com/rubpergar/3D-Slicer-guide/wiki)\
  \ section.\n\n![image](https://github.com/user-attachments/assets/28981a70-ea3e-419c-9412-b703a2445667)\n"

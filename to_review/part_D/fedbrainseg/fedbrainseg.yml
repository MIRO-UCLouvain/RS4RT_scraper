readme_excerpt: "# FedBrainSeg\n\n## Federated Learning Framework for Brain Tumor Segmentation using SwinUNETR\n\
  \nFedBrainSeg is a reproducible federated learning framework for 3D brain tumor segmentation using **SwinUNETR**\
  \ and **Federated Averaging (FedAvg)** on the **BraTS 2024** dataset.\n\nThe framework simulates distributed\
  \ medical institutions without sharing patient data, enabling collaborative training under both IID\
  \ and Non-IID data distributions.\n\n---\n\n## Features\n\n- SwinUNETR-based 3D brain tumor segmentation\n\
  - Federated Averaging (FedAvg)\n- IID and Dirichlet Non-IID data partitioning\n- Multi-seed reproducible\
  \ experiments\n- MONAI-based preprocessing pipeline\n- Automatic checkpoint management\n- Validation\
  \ using Dice Similarity Coefficient\n- Modular and extensible codebase\n\n---\n\n## Repository Structure\n\
  \n```\nFedBrainSeg/\n│\n├── configs/\n├── datasets/\n├── federated/\n├── losses/\n├── models/\n├── trainers/\n\
  ├── utils/\n├── validation/\n│\n├── main.py\n├── evaluate.py\n├── requirements.txt\n├── README.md\n\
  └── LICENSE\n```\n\n---\n\n## Dataset\n\nThis project uses the **BraTS 2024** dataset.\n\nDue to licensing\
  \ restrictions, the dataset is **not included** in this repository.\n\nAfter downloading the dataset,\
  \ place it as:\n\n```\ndata/\n└── BraTS2024/\n```\n\n---\n\n## Installation\n\nClone the repository\n\
  \n```bash\ngit clone https://github.com/swatisgm/FedBrainSeg.git\n\ncd FedBrainSeg\n```\n\nInstall dependencies\n\
  \n```bash\npip install -r requirements.txt\n```\n\n---\n\n## Training\n\n### IID Federated Learning\n\
  \n```bash\npython main.py --partition iid\n```\n\n### Non-IID Federated Learning\n\n```bash\npython\
  \ main.py --partition dirichlet\n```\n\n---\n\n## Evaluation\n\n```bash\npython evaluate.py\n```\n\n\
  ---\n\n## Experimental Settings\n\n| Parameter | Value |\n|-----------|------:|\n| Dataset | BraTS 2024\
  \ |\n| Model | SwinUNETR |\n| Clients | 8 |\n| Aggregation | FedAvg |\n| Local Epochs | 3 |\n| Communication\
  \ Rounds | 200 |\n| Batch Size | 2 |\n| Learning Rate | 1e-4 |\n\n---\n\n## Results\n\nFedBrainSeg was\
  \ evaluated under both IID and Dirichlet Non-IID data distributions using multiple random seeds.\n\n\
  | Partition | Dice Score |\n|-----------|-----------:|\n| IID | 0.7347 ± 0.0088 |\n| Non-IID | 0.7396\
  \ ± 0.0186 |\n\n---\n\n## Reproducibility\n\nThe repository includes:\n\n- Source code\n- Configuration\
  \ files\n- Data partition scripts\n- Training pipeline\n- Evaluation scripts\n- Random seed support\n\
  - Experiment configuration\n\nModel checkpoints and the BraTS dataset are intentionally excluded due\
  \ to size and licensing constraints.\n\n---\n\n## Requirements\n\n- Python 3.12+\n- PyTorch\n- MONAI\n\
  - NumPy\n- SciPy\n- nibabel\n- scikit-learn\n\nInstall all dependencies using\n\n```bash\npip install\
  \ -r requirements.txt\n```\n\n---\n\n## Citation\n\nIf you use this work, please cite:\n\n```bibtex\n\
  @article{FedBrainSeg2026,\n  title={FedBrainSeg: Federated Learning Framework for Brain Tumor Segmentation\
  \ using SwinUNETR},\n  author={Swati Mavinkattimath and co-authors},\n  year={2026}\n}\n```\n\n---\n\
  \n## License\n\nThis project is released under the MIT License.\n\n---\n\n## Contact\n\nFor questions\
  \ or collaborations, please open an issue on GitHub.\n"

readme_excerpt: "# TG-43-Estimator\nTG-43 Estimator Prototype Demo\n\nA. Badías  \nC. Bermejo-Barbanoj\
  \  \nD. González  \nS. Lozares  \n\nUniversity of Zaragoza - 2022\n\nThis is a demo of the prototype\
  \ we have developed.\nThe demo is intended only for visualization and testing purposes. Some software\
  \ features have been disabled.\nUser can load differents 3D models. Users can also modify the stop pointsof\
  \ the applicator to observe its\ninfluence over the dosimetry. The applicator stop times at every position\
  \ have been implemented in the full\nversion of the prototype. This feateure is not enabled for this\
  \ demo, so the times have been fixed as the\nones used to simulate the treatment applied to the clinical\
  \ case represented by the provided model \"sarcoma_1.ply\".\n\nInstructions:\n\n1. Download *.m, *.p\
  \ and *.ply files.\n2. Open Matlab and navigate to the folder where the files have been stored.\n3.\
  \ Open the file main.m.\n4. Execute the program by typing main on the command window or by pressing\
  \ the Run button.\n5. A new window will open. It will show the dosimetry map over the model. The user\
  \ can rotate it,\nzoom in and out and pick points to obtain their coordinates and dosimetry value.\n\
  6. Modify the application points at your own to observe the changes in the dosimetry map and run \n\
  the simulation again.\n7. Use a new model \n"

readme_excerpt: "# \U0001F9E0 3D MRI Brain Tumor Segmentation\n\nA deep learning–based framework for **automated\
  \ brain tumor classification and segmentation** from MRI scans, leveraging both **2D** and **3D** architectures.\n\
  \nDeveloped as the **Graduation Project (GP)** of the **Digital Egypt Pioneers Initiative (DEPI)** \
  \ \nunder the supervision of **Eng. Mahmoud Talaat**  \nby **Rehab Hamdy**, **Marina Safwat**, and **Alaa\
  \ Mohsen**.\n\n---\n\n## \U0001F4D1 Table of Contents\n1. [Introduction](#-introduction)\n2. [Problem\
  \ Statement](#-problem-statement)\n3. [Dataset](#-dataset)\n4. [Proposed Methodology](#-proposed-methodology)\n\
  5. [Models Used](#-models-used)\n6. [Results](#-results)\n7. [3D Segmentation](#-3d-segmentation)\n\
  8. [Conclusion](#-conclusion)\n9. [Future Work](#-future-work)\n10. [Website Development](#-website-development-for-real-world-use)\n\
  11. [Demo Video](#-demo-video)\n\n---\n\n## \U0001F9E9 Introduction\nBrain tumors are among the most\
  \ serious medical conditions, requiring **early detection and precise localization**.  \nManual segmentation\
  \ of MRI scans is **slow**, **subjective**, and **error-prone**.  \n\nTo address this, we designed a\
  \ **deep learning pipeline** capable of:\n- Detecting whether a tumor is present (classification).\n\
  - Segmenting tumor regions automatically (segmentation).\n\nThis study integrates:\n- **ResNet-50**\
  \ for classification.\n- **U-Net**, **ResUNet**, and **VGG16-UNet** for 2D segmentation.\n- A **3D-U-Net**\
  \ architecture for full volumetric segmentation.\n\n![MRI with_Tumor](./assets/intro_mri_comparison_1.png)\n\
  \n----\n\n![MRI without_Tumor](./assets/intro_mri_comparison_2.png)\n\n---\n\n## ⚙️ Problem Statement\n\
  Manual segmentation requires expert radiologists, is time-consuming, and introduces inconsistency. \
  \ \nAccurate, automated segmentation is essential for faster and more reliable diagnosis.\n\n| Issue\
  \ | Description |\n|--------|-------------|\n| **Manual Process** | Requires expert knowledge and is\
  \ error-prone. |\n| **Tumor Variability** | Tumor shapes, sizes, and contrasts vary widely. |\n| **Automation\
  \ Need** | Deep learning enables consistent and efficient analysis. |\n\n---\n\n## \U0001F4CA Dataset\n\
  \n### 2D Dataset \n> \U0001F9E0 **Dataset Source:**  \n> [MRI Brain Tumor Dataset (Kaggle)](https://www.kaggle.com/datasets/mateuszbuda/lgg-mri-segmentation)\n\
  \n- **Total images:** 4,000 MRI scans.\n- **Annotation:** Tumor regions manually labeled.\n- **Classes:**\
  \  \n  - Tumor Present → 1,373  \n  - No Tumor → 2,556  \n- **Preprocessing:** Normalization, binarization,\
  \ and augmentation (rotations, flips).\n\n### 3D Dataset (BraTS 2020)\n> \U0001F9E0 **Dataset Source:**\
  \  \n> [BraTS 2020 Dataset (Kaggle)](https://www.kaggle.com/datasets/awsaf49/brats20-dataset-training-validation/data)\n\
  \n- Each patient has **4 modalities**:\n  - `T1` – anatomical structure  \n  - `T1CE` – contrast-enhanced\
  \ regions  \n  - `T2` – fluid regions  \n  - `FLAIR` – abnormal fluid accumulation  \n- Annotated sub-regions:\n\
  \  - **ET:** Enhancing Tumor  \n  - **TC:** Tumor Core  \n  - **WT:** Whole Tumor  \n\n---\n\n## \U0001F9EA\
  \ Proposed Methodology\n\n### Pipeline Overview\n1. **Data Preprocessing** – normalization, binarization,\
  \ augmentation.  \n2. **Model Training** – classification via ResNet-50; segmentation via U-Net, ResUNet,\
  \ VGG16-UNet.  \n3. **Loss Functions** – Dice Loss (segmentation), Cross-Entropy (classification). \
  \ \n4. **Evaluation Metrics** – Accuracy, Dice Score, IoU, Confusion Matrix.  \n\n![Pipeline Flow](./assets/pipeline_flow.png)\n\
  \n---\n\n## \U0001F9F1 Models Used\n\n| Model | Type | Task | Key Features |\n|--------|------|------|---------------|\n\
  | **ResNet-50** | CNN | Classification | Residual blocks; avoids vanishing gradients |\n| **U-Net**\
  \ | Encoder–Decoder | Segmentation | Strong spatial preservation |\n| **ResUNet** | Hybrid | Segmentation\
  \ | Adds residual connections for higher Dice Score |\n| **VGG16-UNet** | Deep CNN | Segmentation |\
  \ Deeper feature extraction, slight underperformance vs ResUNet |\n\n---\n\n## \U0001F4C8 Results\n\n\
  | Model | Train Acc | Test Acc | Test IoU | Test Dice Score |\n|--------|-----------|----------|-----|-------------|\n\
  | **U-Net** | 99.83 % | 99.79 % | 78.80 % | 88.05 % |\n| **ResUNet** | 99.83 % | 99.81 % | 88.01 % |\
  \ 88.78 % |\n| **VGG16-UNet** | 99.79 % | 99.79 % | 77.53 % | 87.91 % |\n\n**Classification (ResNet-50)**\
  \ → 95.5 % accuracy.  \n**Best 2D Model** → ResUNet.\n\n![Segmentation Outputs](./assets/segmentation_sample_1.png)\n\
  \n\n---\n\n## \U0001F9E9 3D Segmentation \n\n### Motivation\nWhile 2D models process slices independently,\
  \ **3D U-Net** analyzes the **entire brain volume**, capturing spatial continuity for better localization.\n\
  \n### Dataset & Training\n- **Dataset:** BraTS 2020  \n- **Training cases:** 371 | **Validation cases:**\
  \ 127  \n- **Modalities merged** as input channels.  \n- **Architecture:** 3D convolutions, pooling,\
  \ and up-sampling with skip connections.\n\n### Results\n| Metric | Training | Validation |\n|--------|-----------|-------------|\n\
  | **Accuracy** | 0.9886 | 0.9808 |\n| **IoU** | 0.7742 | 0.6636 |\n\n![3D Visualization](./assets/3d_visualization.png)\n\
  \n---\n\n### Predictions\nOur **3D U-Net** model successfully segments tumor regions in volumetric MRI\
  \ data, identifying:\n- **Enhancing Tumor (ET):** Actively growing areas highlighted by contrast.  \n\
  - **Tumor Core (TC):** Necrotic and non-enhancing central regions.  \n- **Whole Tumor (WT):** Combined\
  \ affected area within the brain volume.\n\nBelow are examples comparing predicted vs. ground truth\
  \ segmentations for different cases.\n\n![3D Predictions](./assets/3d_predictions.png)\n\n---\n\n##\
  \ \U0001F9FE Conclusion\n- **ResUNet** achieved the highest performance among 2D models.  \n- **3D U-Net**\
  \ provided volumetric insight and improved clinical interpretability.  \n- Automated segmentation greatly\
  \ reduces time and human variability, supporting radiologists in treatment planning.\n\n---\n\n## \U0001F680\
  \ Future Work\n- Scale to **larger multi-center datasets** for robustness.  \n- Explore **distributed\
  \ training** and **model compression** to reduce compute cost.  \n- Integrate **post-segmentation analytics**\
  \ (tumor growth prediction, survival analysis).\n\n---\n\n## \U0001F310 Website Development for Real-World\
  \ Use\nWe have built a **complete website for doctors and patients**, translating our AI research into\
  \ a real, usable medical tool.\n\n**\U0001F9E9 NeuroVision Platform**\n- **NeuroVision** is a medical\
  \ web platform designed for comprehensive brain tumor management.\n- **Doctors** can upload and analyze\
  \ MRI scans with **automatic tumor segmentation**, streamlining diagnosis and reporting.\n- **Patients**\
  \ can track their entire medical journey via a **timeline** that stores scan histories, doctor notes,\
  \ and progress updates.\n- A built-in **medical chatbot** answers brain-tumor–related questions for\
  \ better patient education.\n- **Data analytics and patient insights** improve diagnostic accuracy and\
  \ enhance doctor–patient communication.\n\n"

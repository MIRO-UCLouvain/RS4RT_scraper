  \ X. Dias\n- João O. B. Diniz\n- Luiz O. O. Souza Júnior\n\n**Laboratório de Inteligência Computacional\
  \ Aplicada (LICA) — Universidade Federal do Cariri (UFCA)**\nCEP 63.048-080 — Juazeiro do Norte — CE\n\
  \n- Luana B. da "

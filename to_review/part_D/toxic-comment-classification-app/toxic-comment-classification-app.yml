readme_excerpt: "## FastAPI Rest App for Toxic Comment Classification\n\nThis is a FastAPI REST app for\
  \ predicting whether a given text comment is toxic or not. It uses a pre-trained DistilBERT model and\
  \ tokenizer to perform the prediction.\n\nCheck out this <a href=\"https://github.com/BrianMburu/Distiled-BERT-model-training-pytorch.git\"\
  >Repo</a> to see how I trained the DistilBERT model.\n\n### Setup\n\nTo run this app locally, follow\
  \ these steps:\n\n1. Clone the repository using git clone https://github.com/BrianMburu/Toxic-Comment-Classification-App.git.\n\
  2. Install the required packages by running pip install -r requirements.txt.\n3. Run the app `using\
  \ uvicorn main:app --reload` command and visit http://localhost:8000/docs in your web browser to interact\
  \ with the API. You can also use curl as shown in the examples below.\n\n### Usage\n\nOnce the app is\
  \ up and running, visit http://localhost:8000/docs in your web browser to interact with the API. You\
  \ can input a text comment and choose whether to apply stemming or lemmatization before predicting its\
  \ toxicity.\n\n### Input\n\n- text: string - The input text comment to predict.\n- stemmer: string -\
  \ Either \"snowball\" or \"lemmatize\" to choose between applying snowball stemming or lemmatization\
  \ respectively.\n\n### Output\n\n- predictions: dictionary - A dictionary with keys representing each\
  \ of the six toxicity categories and their corresponding prediction score.\n- Execution Time: float\
  \ - The time taken to perform the prediction, in seconds.\n\n### Examples\n\n#### Input:\n\n```json\n\
  {\n  \"text\": \"I don't think that's a good idea\",\n  \"stemmer\": \"lemmatize\"\n}\n```\n\n#### Output:\n\
  \n```json\n{\n  \"predictions\": {\n    \"toxic\": 0.7986,\n    \"severe_toxic\": 0.0188,\n    \"obscene\"\
  : 0.2733,\n    \"threat\": 0.0183,\n    \"insult\": 0.4133,\n    \"identity_hate\": 0.0518\n  },\n \
  \ \"Execution Time\": 0.2174965309968684\n}\n```\n\n#### Input:\n\n```json\n{\n  \"text\": \"You are\
  \ a complete loser\",\n  \"stemmer\": \"snowball\"\n}\n```\n\n#### Output:\n\n```json\n{\n  \"predictions\"\
  : {\n    \"toxic\": 0.769,\n    \"severe_toxic\": 0.0183,\n    \"obscene\": 0.2513,\n    \"threat\"\
  : 0.0182,\n    \"insult\": 0.3787,\n    \"identity_hate\": 0.0502\n  },\n  \"Execution Time\": 0.2113154350008699\n\
  }\n```\n\n#### Example using curl command\n\n```bash\ncurl -X POST \"http://localhost:8000/predict\"\
  \ -H \"Content-Type: application/json\" -d '{ \"text\": \"You are a complete loser\", \"stemmer\": \"\
  lemmatize\"}'\n\n{\"predictions\":{\"toxic\":0.7986,\"severe_toxic\":0.0188,\"obscene\":0.2733,\"threat\"\
  :0.0183,\"insult\":0.4133,\"identity_hate\":0.0518},\"Execution Time\":0.13700330699793994}%\n```\n\n\

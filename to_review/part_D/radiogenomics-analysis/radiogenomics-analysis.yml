readme_excerpt: "Overview\n--------\n\nThe code in this replication package constructs the analysis file\
  \ from the public database, TCIA, the cohort of NSCLC Radiogenomics, using Python.\n\nData Availability\
  \ and Provenance Statements\n----------------------------\n\n- [ ] This paper does not involve analysis\
  \ of external data (i.e., no data are used or the only data are generated by the authors via simulation\
  \ in their code).\n\n\n### Statement about Rights\n\n- [√] I certify that the author(s) of the manuscript\
  \ have legitimate access to and permission to use the data used in this manuscript. \n\n\n### Summary\
  \ of Availability\n\n- [√] All data **are** publicly available.\n- [ ] Some data **cannot be made**\
  \ publicly available.\n- [ ] **No data can be made** publicly available.\n\nData were downloaded from\
  \ The Cancer Imaging Archice (TCIA), organized by National Cancer Institute (NIH). We use the collection\
  \ of “NSCLC-Radiogenomics”. Data can be downloaded from https://wiki.cancerimagingarchive.net/display/Public/NSCLC+Radiogenomics.\
  \ (Bakr S, Gevaert O, Echegaray S, et al. A radiogenomic dataset of non-small cell lung cancer. Sci\
  \ Data. 2018;5:180202.)\nA copy of the data is provided as part of this archive. The data are in the\
  \ public domain.\n\n\nDataset list\n------------\n\n| Data file | Source | Notes    |Provided |\n|-----------|--------|----------|---------|\n\
  | `data/feature.csv` | Processed TCIA data | Image features extracted from CT images | Yes |\n| `data/gene.csv`\
  \ | TCIA | Gene expression profile | Yes |\n| `data/clinical data.xlsx`| TCIA | Clinical data for patients\
  \ used in the paper | Yes |\n| `data/spearman_plot.csv`| Processed data | Spearman analysis result,\
  \ serves as input for Figure 1 | Yes |\n| `data/datadistribution_plot.txt`| Processed data | Data distribution,\
  \ serves as input for Figure 4 | Yes |\n| `data/train.txt`| Processed data | Training dataset serve\
  \ as input for machine learning model | Yes |\n| `data/test.txt`| Processed data | Test dataset serve\
  \ as input for machine learning model | Yes |\n| `data/km.csv`| Processed data | Predicted results of\
  \ HOPX expression status from test for Kaplan-Meier analysis | Yes |\n\n\n\nComputational requirements\n\
  ---------------------------\n\n### Software Requirements\n- Python 3.8.1\n  - `PyRadiomics` 3.0.1\n\
  \  - `lifeline` 0.27.0\n  - `ML-ENS` 0.2.3\n  - `Bayesian-optimization` 0.6.0\n  - Other package requirements\
  \ could be seen on the guideline website of PyRadiomics, Lifeline, ML-ENS and Bayesian-optimization.\n\
  \n\n### Memory and Runtime Requirements\n\n#### Summary\n\nApproximate time needed to reproduce the\
  \ analyses on a standard (CURRENT YEAR) desktop machine:\n\n- [ ] <10 minutes\n- [ ] 10-60 minutes\n\
  - [√] 1-8 hours\n- [ ] 8-24 hours\n- [ ] 1-3 days\n- [ ] 3-14 days\n- [ ] > 14 days\n- [ ] Not feasible\
  \ to run on a desktop machine, as described below.\n\n#### Details\n\nThe code was last run on a **4-core\
  \ Intel-based laptop with MacOS version 11.4.0**. \n\nDescription of programs/code\n----------------------------\n\
  \n- Programs in `programs/01_feature extraction` extract image features from CT images with ROIs. The\
  \ file programs/01_feature extraction should be run in the terminal of your computer.\n- Programs in\
  \ `programs/02_machinelearning` generate the radiogenomic signature candidates and use this as input\
  \ for machine model to predict survival and HOPX expression status. The program `programs/02_machinelearning/normalization.ipynb`\
  \ will do the normalization to image features and gene expression. The program `programs/02_machinelearning/spearman.py`\
  \ will calculate the spearman coefficients of all image features and select the pairs which coefficient\
  \ is over 0.5. The program `programs/02_machinelearning/BayesianOptimization.ipynb` will select the\
  \ best parameters for each base machine learning model (SVM, RF, and GBDT). The program `programs/02_machinelearning/stacking.ipynb`\
  \ is the code for the ensemble learning machine model, stacking and will calculate the accuracy, sensitivity,\
  \ specificity, ROC and AUC for model evaluation. Programs named as `programs/02_machinelearning/stacking\
  \ for 2 image features.ipynb`,  `programs/02_machinelearning/stacking for 3 image features.ipynb`, `programs/02_machinelearning/stacking\
  \ for 4 image features.ipynb` and `programs/02_machinelearning/stacking for 8 image features.ipynb`\
  \ contained the parameter for each machine learning model for Radiogenomics signature D, C, B and A,\
  \ respectively.\n- Programs in `programs/03_plot` will generate some of the figures in the paper. The\
  \ program `programs/03_plot/heatmap.ipynb` will generate the heatmap of Figure 1. The program `programs/03_plot/Kaplan-Meier.ipynb`\
  \ will generate the Kaplan-Meier curves of predicted results of HOPX expression status from test for\
  \ Figure 2 and Figure 6(b)and calculate the p-value (log-rank test) between two groups. The program\
  \ `programs/03_plot/data distribution.ipynb` will generate the violin plot of Figure 4 and calculate\
  \ the p-value (t test) between two groups of image features. The program `programs/03_plot/DEA_volcano.ipynb`\
  \ will generate the volcano plot of Figure 6(a).\n\n\nList of tables and programs\n---------------------------\n\
  \nThe provided code reproduces:\n\n- [ ] All numbers provided in text in the paper\n- [ ] All tables\
  \ and figures in the paper\n- [√] Selected tables and figures in the paper, as explained and justified\
  \ below.\n\n\n| Figure/Table #    | Program                  | Line Number | Output file           \
  \           | Note                            |\n|-------------------|--------------------------|-------------|----------------------------------|---------------------------------|\n\
  | Figure 1           | 03_plot/heatmap.ipynb    |             | HeatMap.png                 ||\n| Figure\
  \ 2 and Figure 6(b)           | 03_plot/ Kaplan-Meier.ipynb|           | KMoriginal.png,KM2.png,KM3.png,KM4.png,KM8.png||\n\
  | Figure 4           | 03_plot/ data distribution.ipynb |          | original_ske_violin 2.png, wavelet_root_violin\
  \ 2.png  ||\n| Figure 6(a)          | 03_plot/DEA_volcano.ipynb           |             | dea.png  \
  \              |           |\n\n\n## References\n\nBakr S, Gevaert O, Echegaray S, et al. A radiogenomic\
  \ dataset of non-small cell lung cancer. Sci Data. 2018;5:180202.\n\nDavidson-Pilon, Cameron, lifelines,\
  \ survival analysis in Python, (2022). https://doi.org/10.5281/zenodo.6359609\n\nGriethuysen, J. J.\
  \ M., Fedorov, A., Parmar, C., Hosny, A., Aucoin, N., Narayan, V., Beets-Tan, R. G. H., Fillon-Robin,\
  \ J. C., Pieper, S., Aerts, H. J. W. L. (2017). Computational Radiomics System to Decode the Radiographic\
  \ Phenotype. Cancer Research, 77(21), e104–e107. \n\n---\n\n## Acknowledgements\n\nSome content on this\
  \ page was copied from [Hindawi](https://www.hindawi.com/research.data/#statement.templates). Other\
  \ content was adapted  from [Fort (2016)](https://doi.org/10.1093/restud/rdw057), Supplementary data,\
  \ with the author's permission.\n"

readme_excerpt: "# BraTS Brain Tumor Segmentation using 2D U-Net\n\n![Python](https://img.shields.io/badge/Python-3.8%2B-blue.svg)\n\
  ![PyTorch](https://img.shields.io/badge/PyTorch-EE4C2C?style=flat&logo=pytorch&logoColor=white)\n![License](https://img.shields.io/badge/License-MIT-green.svg)\n\
  ![Hugging Face](https://img.shields.io/badge/%F0%9F%A4%97%20Hugging%20Face-Models-yellow)\n\nAn automated\
  \ end-to-end pipeline for the segmentation of gliomas (brain tumors) in medical MRI slices using a deep\
  \ **U-Net architecture** implemented in PyTorch. \n\nThe model achieves an excellent **Dice Coefficient\
  \ of 95.30%** on the validation split of the BraTS dataset.\n\n---\n\n## Project Factsheet & Results\n\
  \nThe following factsheet was automatically generated after the training run and summarizes all key\
  \ metrics, dataset specifications, and the system architecture:\n\n<p align=\"center\">\n  <img src=\"\
  projekt_factsheet_english.png\" alt=\"Project Factsheet\" width=\"600\">\n</p>\n\n---\n\n## System Architecture\
  \ & Dataset\n\n- **Architecture:** Classic U-Net (Ronneberger et al.) featuring 3 encoder blocks (downsampling),\
  \ a central feature bridge (256 channels), and 3 decoder blocks (upsampling). Skip connections are utilized\
  \ to pass fine-grained spatial information directly from the encoder to the decoder.\n- **Dataset:**\
  \ BraTS (Brain Tumor Segmentation) 2D MRI dataset consisting of **4,715 high-resolution slices** (240x240\
  \ pixels).\n- **Data Split:** 80% Training (3,772 images) | 20% Validation (943 images).\n- **Hardware\
  \ Acceleration:** Trained on an NVIDIA T4 GPU via CUDA (Google Colab).\n\n---\n\n## Hyperparameters\
  \ & Training\n\n- **Loss Function:** `BCEWithLogitsLoss`\n- **Optimizer:** Adam (`lr=1e-3`, Batch Size:\
  \ 16)\n- **Epochs:** 13 (achieving perfect convergence without overfitting)\n- **Final Training Loss:**\
  \ 0.0134\n- **Final Validation Loss:** 0.0124\n\n---\n\n## Model Weights & Deployment\n\nDue to the\
  \ file size, the final trained weights (`brats_unet_modell.pth`) are hosted externally on Hugging Face.\
  \ You can freely download them or integrate them directly into your PyTorch inference pipelines:\n\n\
  \U0001F449 **[Download the Model Weights on Hugging Face](https://huggingface.co/alexa-578/brats-2d-unet-brain-tumor)**\n\
  \n### Loading the Model (PyTorch)\n```python\nimport torch\n\n# Initialize your U-Net architecture\n\
  model = UNet2D() \n\n# Load the downloaded weights\nmodel.load_state_dict(torch.load('brats_unet_modell.pth',\
  \ map_location=device))\nmodel.eval()\n"

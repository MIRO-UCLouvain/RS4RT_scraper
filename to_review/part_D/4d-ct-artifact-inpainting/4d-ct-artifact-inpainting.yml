readme_excerpt: '# Deep Learning-based Conditional Inpainting for Restoration of Artifact-affected 4D
  CT Images

  This the official code accompanying the publication "Deep Learning-based Conditional Inpainting for
  Restoration of Artifact-affected 4D CT Images".


  ### Setup

  1. Clone the repo and `cd` into the directory

  2. Install dependencies via `pip install -r requirements.txt`. You also have to install [VROC](https://github.com/IPMI-ICNS-UKE/vroc)
  for registration related methods

  3. Install the package via `pip install -e .` (develop mode)

  '

readme_excerpt: "# Installation of gan-phsp #\n\nAuthor: Tobias Stäuble\n\nThe reference installation\
  \ was done on a Windows machine using WSL 1 with an Ubuntu 18.04 distribution. You should however be\
  \ able to follow these instruction for most Unix systems.\n\n## Preparation\n`sudo apt-get update` \
  \ \n\nOptionally, install cmake >= 3.12 to allow building in parallel, which will speed things up significantly.\
  \  \n\n### Dependencies \n`sudo apt-get install git dpkg-dev cmake g++ gcc binutils libx11-dev libxpm-dev\
  \ libxft-dev libxext-dev libpng-dev liblzma-dev libjpeg-dev python python-dev mesa-utils libtool automake\
  \ build-essential libssl-dev`  \n\nTo check if you have a CUDA capable device: `lspci | grep -i nvidia`.\
  \  \n\nInstall kernel headers and development packages for CUDA:  \n`sudo apt-get install linux-headers-$(uname\
  \ -r)`\n\nHead to `https://developer.nvidia.com/cuda-downloads` and download the runfile for the target\
  \ system with e.g.  \n`wget http://developer.download.nvidia.com/compute/cuda/11.0.1/local_installers/cuda_11.0.1_450.36.06_linux.run`\
  \  \nThen run the file with `sudo sh cuda_11.0.1_450.36.06_linux.run`.  \n\nFor libtorch 1.3.1 -> use\
  \ cuda_10.1.105_418.39_linux.run\n\n\n\nDownload `libcudnn` from the NVIDIA site (an account may be\
  \ necessary). Extract the archive into the `install` directory.  \n\n!! choose correct version here\
  \ !!\n\n`sudo cp cuda/include/cudnn*.h /usr/local/cuda/include`  \n`sudo cp cuda/lib64/libcudnn* /usr/local/cuda/lib64`\
  \  \n`sudo chmod a+r /usr/local/cuda/include/cudnn*.h /usr/local/cuda/lib64/libcudnn*`\n\n## Root\n\
  `cd install`  \n`curl https://root.cern/download/root_v6.20.04.source.tar.gz | tar xvz`  \n`mkdir builds`\
  \  \n`cd builds && mkdir root`  \n`cd root`  \n`cmake ../../root-6.20.04/`  \n`cmake --build .`  \n\n\
  Update path with: `source bin/thisroot.sh`\n\n## Geant4\n`cd install`  \n`curl http://geant4-data.web.cern.ch/geant4-data/releases/geant4.10.06.p02.tar.gz\
  \ | tar xvz`  \n`cd builds && mkdir geant4 && geant4-build`  \n`cd geant4-build`  \n`cmake -DCMAKE_INSTALL_PREFIX=<PATH\
  \ TO geant4 DIR IN BUILDS DIR> ../../geant4.10.06.p02/`  \n`make -j4`  \n`sudo make install`  \n\nGeant4\
  \ is now installed at `<PATH TO geant4 DIR IN BUILDS DIR>`.\n\nUpdate path with: `source <installdir>/bin/geant4.sh`\n\
  \n## Libtorch\nOn the pytorch website, select (Stable, Linux, LibTorch, C++/Java, None or CUDA depending\
  \ on whether a GPU is available) and download the cxx11 ABI file.  \nNote: I downloaded 1.3.1 and not\
  \ the newest version as it seems to have compatiblity issues with gcc.  \nExtract the ZIP contents to\
  \ `install/libtorch/` folder.  \n\n\n## Gate\nDownload and extract Gate 9.0 to the `install` folder.\
  \  \n`cd Gate-9.0`  \n`sudo apt-get install cmake-curses-gui qt5-default libxmu-dev`  \n`cd builds &&\
  \ mkdir gate-9-build && mkdir gate-9`  \n`cd gate-9-build`  \n`ccmake ../../Gate-9.0 -DCMAKE_INSTALL_PREFIX=/mnt/c/Users/mlsostt/Documents/gan-phsp/install/builds/gate-9`\
  \  \n\nQuick and dirty fix to install with CUDNN 8+:  \nFollow these steps: `https://github.com/pytorch/pytorch/issues/40965`\
  \  \n\n\n\n\n\nHit `c` to configure, then enable `GATE_USE_TORCH`. Hit `c` again. Now an error shows\
  \ up, but if you go to the variable definitions again, you can now configure `Torch_DIR`.\n\nSet `Torch_DIR`\
  \ to `<PATH TO installdir>/libtorch/share/cmake/Torch`. Hit `c` again. If it succeeds, hit `g`. \n\n\
  `make -j4`  \n`sudo make install`\n\n`export PATH=/<PATH TO gate-9 dir in install folder>/bin:$PATH`\n\
  \n\n## GAN 4 Gate (GAGA)\n`sudo apt-get install python3-pip`  \n`pip3 install gaga-phsp`  \n`pip3 install\
  \ gatetools`  \n`pip3 install torch===1.5.1 torchvision===0.6.1 -f https://download.pytorch.org/whl/torch_stable.html`\
  \  \n\nNote: libtorch = 1.3.0 / pytorch = 1.5.1\n\n\nTo be continued.\n\n\nFor building phsp_iaea_to_root:\n\
  Set USE_Torch Flag to Off and specifically build only the target and not Gate\n\n\n\n\n\n\n\n\nlibtorch\
  \ 1.3.1  \nwith CUDA 10.1  \nand with cudnn cudnn-10.1-linux-x64-v7.6.5.32\n\n\n\n"

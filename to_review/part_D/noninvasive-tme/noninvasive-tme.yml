readme_excerpt: "# Deep interpretable Radiogenomics (DiRG) Model Correlates MRI with TME for Noninvasive\
  \ Cancer Subtyping\r\n\r\n## Overview\r\n\r\n![overview](figure1_overview.png)\r\n\r\n## Getting Started\r\
  \n\r\nDiRG model uses deconvolution methods to obtain the cell type fraction and proportion from bulk\
  \ data and constructs the relationship of MRI with cancer subtypes/microenvironment using on a deep\
  \ radiogenomics model, while focusing on the interpretability of the modeling results.\r\n\r\n### Prerequisites\r\
  \n\r\nOur modeling framework is based on PyTorch (https://pytorch.org).\r\n\r\n#### Deconvolution\r\n\
  `BayesPrism` requires the following dependencies in R: `snowfall`, `NMF`, `gplots`, `scran`, `BiocParallel`,\
  \ `Matrix`, and it can be installed as follows：\r\n```\r\nlibrary(\"devtools\");\r\ninstall_github(\"\
  Danko-Lab/BayesPrism/BayesPrism\")\r\n```\r\nFor more information about `BayesPrism` refers to https://www.nature.com/articles/s43018-022-00356-3\
  \ or https://github.com/Danko-Lab/BayesPrism\r\n\r\nWe also compared our model against `Bisque`, `CIBERSORT`,\
  \ `xCell`, `quanTIseq`, and `EPIC`.\r\n\r\n`xCell`, `quanTIseq`, `EPIC` were constructed based on the\
  \ `immunedeconv` package (https://github.com/omnideconv/immunedeconv):\r\n```\r\ninstall.packages(\"\
  remotes\")\r\nremotes::install_github(\"omnideconv/immunedeconv\")\r\n```\r\n`CIBERSORT` can be installed\
  \ using:\r\n```\r\ninstall.packages(\"devtools\")\r\ndevtools::install_github(\"Moonerss/CIBERSORT\"\
  )\r\n```\r\n`Bisque`  can be installed using:\r\n```\r\ninstall.packages(\"devtools\")\r\ndevtools::install_github(\"\
  cozygene/bisque\")\r\n```\r\n\r\n#### Deep Radiogenomics\r\nMRIs were converted to JPG/PNG using DICOM\
  \ based on `pydicom`：  \r\n```\r\npip install pydicom\r\n```\r\nRadiomics features extract by `pyradiomics`:\r\
  \n```\r\npip install pyradiomics\r\n```\r\n\r\n## Running the Model\r\n\r\n### Model\r\n\r\n- Run BayesPrism\
  \ with `./Code/R/bayes_scATOMIC8_BRCA.Rmd`\r\n- Run the other deconvolution methods:\r\n  - Bisque：`./Code/R/bayes_bisque_BRCA.Rmd`\r\
  \n  - CIBERSORT：`./Code/R/Cibersort.R`\r\n  - Other: `./Code/R/immunedeconv_all.R`\r\n- Run and train\
  \ our deep radiogenomics model with `./Code/train_model.py`\r\n- Obtain the image marker for\r\n  -\
  \ Radiogenomics discovery and validation cohort (with gene): `./Code/Grad_CAM.py`\r\n  - Radiomics cohort\
  \ and clinical cohort (without gene): `./Code/validation_marker.py`\r\n- Obtain important features of\
  \ SMLP with `./Code/Important_feature.py`\r\n- Extract radiomics feature with `./Code/radiomics_feature.py`\r\
  \n- Run our surrogate model (XGB) with `./Code/val_surrogate.ipynb`\r\n\r\n### Analysis\r\n\r\n- Run\
  \ GSEA with `./Code/R/GSEA.R`\r\n- Obtain heat map and PCA results in Figure 2 with `./Code/R/Heatmap_and_PCA.R`\r\
  \n- Obtain boxplot results in Figure 2 with `./Code/R/boxplot.R`\r\n\r\n\r\n## Contributing\r\n\r\n\
  Please read [CONTRIBUTING.md](CONTRIBUTING.md) for details on our code of conduct, and the process for\
  \ submitting pull requests to us.\r\n\r\n## Authors\r\n\r\n* Huijun Li, Qiuxia Yang, Rui Zhang, Yize\
  \ Mao, Xiaoli Li, Zequn Zhang, Yuxi Chen, Feng Zou, Chon Lok Lei, Peng Wang, and Hongyan Wu\r\n\r\n\
  See also the list of [contributors](https://github.com/compbio-fhs/noninvasive-tme-detection/contributors)\
  \ who participated in this project.\r\n\r\n## License\r\n\r\nThis project is licensed under the BSD\
  \ 3-Clause License, see [LICENSE](LICENSE) details.\r\n\r\n## Acknowledging this work\r\n\r\nIf you\
  \ publish any work based on the contents of this repository please cite:\r\n\r\nTBU\r\n\r\n\r\n\r\n"

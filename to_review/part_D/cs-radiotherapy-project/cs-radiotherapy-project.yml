readme_excerpt: "# CS Radiotherapy Project\n\nProjekt symulacyjny poświęcony matematycznemu modelowaniu\
  \ oraz zastosowaniom uczenia maszynowego w radioterapii onkologicznej. Głównym celem jest analiza dynamiki\
  \ wzrostu guza oraz optymalizacja dawki promieniowania z wykorzystaniem podejść klasycznych (modele\
  \ oparte o równania różniczkowe) oraz metod głębokiego uczenia, w szczególności **Physics-Informed Neural\
  \ Networks (PINN)**.\n\n## Struktura projektu\n\nGłówna logika obliczeniowa i eksperymenty znajdują\
  \ się w katalogu `simulations/`. Każdy notatnik odpowiada innemu wariantowi modelu lub technice analitycznej:\n\
  \n- **`sim_01_pde.ipynb`**  \n  Symulacja 2D oparta o **równania różniczkowe cząstkowe (PDE)** – modeluje\
  \ przestrzenną dyfuzję guza oraz wpływ dawki promieniowania na tkankę.\n\n- **`sim_02_ode.ipynb`** \
  \ \n  Modelowanie ewolucji masy guza w czasie z użyciem **równań różniczkowych zwyczajnych (ODE)**,\
  \ bez komponentu przestrzennego.\n\n- **`sim_03_sensitivity.ipynb`**  \n  **Analiza wrażliwości (Sensitivity\
  \ Analysis)** z użyciem biblioteki **SALib**, pozwalająca ocenić wpływ parametrów wejściowych na wyniki\
  \ symulacji.\n\n- **`sim_04_node.ipynb`**  \n  Implementacja **Neural ODE** – wykorzystanie sieci neuronowych\
  \ do aproksymacji dynamiki układu dynamicznego.\n\n- **`sim_05_asimilation.ipynb`**  \n  Moduł **asymilacji\
  \ danych (Data Assimilation)** służący do dopasowywania modelu do danych obserwacyjnych.\n\n- **`sim_06_PINN.ipynb`**\
  \  \n  Zastosowanie **Physics-Informed Neural Networks (PINN)** – podejście hybrydowe łączące ograniczenia\
  \ wynikające z równań fizycznych (PDE) z uczeniem sieci neuronowych w celu predykcji rozwoju nowotworu.\n\
  \n## Wymagania systemowe\n\n- Python **3.8+**\n- Rekomendowane środowisko: **Linux/macOS** lub **WSL**\
  \ na Windows (ze względu na wsparcie dla `make`)\n\nZależności są zdefiniowane w pliku `requirements.txt`\
  \ i obejmują m.in.:\n- `numpy`, `scipy` – obliczenia numeryczne\n- `torch` – uczenie maszynowe / deep\
  \ learning\n- `matplotlib`, `seaborn` – wizualizacja\n- `SALib` – analiza wrażliwości\n\n## Instalacja\
  \ i konfiguracja\n\nProjekt wspiera automatyzację instalacji poprzez `Makefile`.\n\n### Metoda 1: automatyczna\
  \ (zalecana)\n\nUtworzenie środowiska wirtualnego (`.venv`) oraz instalacja zależności:\n\n```bash\n\
  make install\n```\n\n### Metoda 2: ręczna\n\nJeśli `make` nie jest dostępne, instalację można wykonać\
  \ manualnie:\n\n```bash\npython -m venv .venv\nsource .venv/bin/activate  # Windows: .venv\\Scripts\\\
  activate\npip install -r requirements.txt\n```\n\n## Uruchamianie symulacji\n\n### Wykonanie wszystkich\
  \ symulacji (tryb wsadowy)\n\nAby automatycznie uruchomić wszystkie notatniki Jupyter z katalogu `simulations/`\
  \ i zapisać wyniki bezpośrednio w plikach `.ipynb`:\n\n```bash\nmake run\n```\n\n### Uruchamianie interaktywne\n\
  \nPraca w trybie interaktywnym z użyciem Jupyter Lab:\n\n```bash\njupyter lab\n```\n\nNastępnie otwórz\
  \ wybrany plik z katalogu `simulations/`.\n\n## Czyszczenie wyników\n\nUsunięcie wygenerowanych wyników\
  \ z notatników (np. przed commitowaniem zmian):\n\n```bash\nmake clean\n```\n\n## Licencja\n\nProjekt\
  \ jest udostępniany na warunkach licencji opisanej w pliku `LICENSE`.\n"

readme_excerpt: "End-to-End Brain Tumor Analysis Pipeline\nThis repository contains the code for a complete\
  \ pipeline for brain tumor analysis from MRI scans, developed based on the BraTS 2024 challenge dataset.\
  \ The project uses a high-performance 3D U-Net for semantic segmentation and integrates with a Large\
  \ Language Model (Gemini 1.5 Flash) to generate descriptive reports from the segmentation results.\n\
  \nDevelopment environment: Model training and evaluation were performed in Google Colab using the notebook\
  \ provided in the notebooks folder. The trained model weights were exported and used for local inference\
  \ in VS Code.\n\nThis project is structured as a modular, reusable, and professional research codebase,\
  \ suitable for extension and reproduction.\n\n\U0001F4CA Performance\nThe core segmentation model was\
  \ trained and validated on the BraTS 2024 dataset. It achieved the following mean Dice Scores on a hold-out\
  \ test set of 203 patients:\n\nTumor Region                   Mean Dice Score\n\nEnhancing Tumor (ET)\
  \            0.7743\n\n\n\nTumor Core (TC)                 0.8443\n\n\n\nWhole Tumor (WT)          \
  \      0.8813\n\n\n\nAverage (ET, TC, WT)            0.8333\n\n\n\n✨ Features\nHigh-Performance 3D U-Net:\
  \ A robust 3D neural network architecture with residual connections and deep supervision for accurate\
  \ segmentation.\n\nAdvanced Loss Function: A custom combo_loss that combines Focal Tversky and Dice\
  \ losses to effectively handle the severe class imbalance in tumor data.\n\nModular & Reproducible Codebase:\
  \ The code is structured into separate modules for data utilities, model architecture, and analysis,\
  \ following best practices for research software engineering.\n\nLLM-Powered Reporting: Integrates with\
  \ the Google Gemini API to automatically generate structured, descriptive reports from the calculated\
  \ tumor volumes, providing a proof-of-concept for AI-driven interpretation.\n\n\U0001F680 Getting Started\n\
  Prerequisites\nPython 3.9+\n\nAn NVIDIA GPU with CUDA and CuDNN installed is recommended for model inference.\n\
  \nA Google Gemini API Key.\n\nInstallation\nClone the repository:\n\ngit clone https://github.com/SarathSas1/brats-ai-analysis.git\n\
  \ncd brats-ai-analysis\n\n\nInstall dependencies:\n\npip install -r requirements.txt\n\n\nDownload Model\
  \ Weights:\nDownload the trained model weights (best_model.weights.h5) from \n\nhttps://drive.google.com/file/d/1_FfzkPQOW53Q-hZeU1PJGQONm70vTz7G/view?usp=sharing\n\
  \ and place them in a checkpoints/ folder in the root directory.\n\nSet up Gemini API Key:\nFor the\
  \ report generation to work, you need to provide your API key as an environment variable:\n\nexport\
  \ GEMINI_API_KEY=\"your_api_key_here\"\n\n\nUsage\nTo run the full analysis pipeline on a single patient's\
  \ data, use the predict.py script. You must provide the path to the patient's data folder and the patient's\
  \ ID.\n\n\npython scripts/predict.py \\\n  --data_dir /path/to/BraTS_data \\\n  --patient_id BraTS-GoAT-00000\
  \ \\\n  --weights_path /path/to/best_model.weights.h5 \\\n  --output_dir output\n\n"

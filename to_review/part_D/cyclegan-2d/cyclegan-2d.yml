readme_excerpt: '# CycleGAN-2D

  CBCT to CT translation using CycleGAN model


  2D CycleGAN model for image-to-image translation between CBCT and CT images. The model was trained using
  the Pelvic Reference Data (https://wiki.cancerimagingarchive.net/display/Public/Pelvic-Reference-Data).
  The trained model can be downloaded for further use from https://drive.google.com/drive/folders/1E25Sq7GHRSBnPZrWGQ9ohKSFC7UQuChd?usp=share_link


  Authors: Keyur D. Shah, James A. Shackleford, Nagarajan Kandasamy and Gregory C. Sharp.


  Please reach out to Keyur at keyurs19@gmail.com in case of any questions.

  Please cite as follows if used in any publication:


  Shah, K., et al. "Improving Cone-Beam CT Auto-Segmentation Accuracy Using Cycle GANs for Domain Adaptation."
  MEDICAL PHYSICS. Vol. 49. No. 6. 111 RIVER ST, HOBOKEN 07030-5774, NJ USA: WILEY, 2022.

  '

readme_excerpt: "# \U0001F9EA Chemical Toxicity Prediction (hERG & Cyto)\n\n> Predicting whether chemical\
  \ compounds are toxic using deep learning and deploying it as a simple app for testing.\n\n---\n\n##\
  \ \U0001F4A1 Project Idea\nDrug discovery involves testing thousands of chemical compounds. Manually\
  \ checking if a compound is **toxic** (harmful to human cells) is very expensive and time-consuming.\n\
  \nThis project uses **machine learning and deep learning** to predict whether a compound is toxic by\
  \ analyzing its chemical structure. We focused on two important toxicity types:  \n- **hERG Toxicity**\
  \ → cardiac (heart-related) toxicity  \n- **Cytotoxicity (Cyto)** → general cell toxicity\n\n---\n\n\
  ## \U0001F4CA Dataset\n- Source: [ChEMBL Database](https://www.ebi.ac.uk/chembl/)  \n- Contains chemical\
  \ compounds and toxicity labels.  \n- Chemical SMILES strings were converted into features using **RDKit**\
  \ (molecular fingerprints).\n\n---\n\n## \U0001F527 What I Did\n1. **Data preprocessing:** cleaned SMILES,\
  \ removed invalid rows, generated molecular fingerprints with RDKit.  \n2. **Modeling:** trained classical\
  \ ML baselines (Logistic Regression, Random Forest, SVM) and deep learning LSTM models using PyTorch.\
  \ Separate models for hERG and Cyto.  \n3. **Evaluation:** measured Accuracy, Precision, Recall, F1-score,\
  \ ROC-AUC, PR-AUC and compared models.  \n4. **Deployment:** built a simple app-like interface (Streamlit/Flask\
  \ style) to input a SMILES string and return predicted hERG or Cyto toxicity using the trained model.\n\
  \n---\n\n## \U0001F50D Results\n\n**hERG LSTM**  \n- Accuracy: **85.1%**  \n- ROC-AUC: **0.805**  \n\
  - PR-AUC: **0.936**  \n- High recall for toxic compounds (**~97%**)\n\n![hERG ROC & PR Curves](results/herg_roc_pr.png)\n\
  \n**Cyto LSTM**  \n- Accuracy: **78.9%**  \n- ROC-AUC: **0.821**  \n- PR-AUC: **0.902**\n\n![Cyto ROC\
  \ & PR Curves](results/cyto_roc_pr.png)\n\n**Confusion Matrices & Reports**  \nThe confusion matrices\
  \ and short classification summaries show model performance and class-level precision/recall.\n\n![Confusion\
  \ Matrices](results/confusion_matrices.png)\n\n---\n\n## ✅ Key Takeaways\n- LSTM-based deep models outperformed\
  \ classical ML on these toxicity tasks.  \n- hERG model is highly sensitive (detects most toxic compounds).\
  \  \n- Cyto model shows good balance of precision and recall.  \n- The deployed app demonstrates practical\
  \ use: quick screening of compounds before lab testing.\n\n---\n\n## ⚙️ How to Run\nInstall the required\
  \ libraries and open the notebook to reproduce experiments and run predictions:\n\n```bash\npip install\
  \ -r requirements.txt\njupyter notebook toxicity_model.ipynb\n"

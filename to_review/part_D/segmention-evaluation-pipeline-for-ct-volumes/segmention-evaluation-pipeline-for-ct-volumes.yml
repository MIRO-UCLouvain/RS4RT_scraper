readme_excerpt: "# Segmention Evaluation Pipeline for CT Volumes\n\nThis repository contains a Python\
  \ pipeline to evaluate synthetic CT (sCT) scans against ground-truth CT scans. It processes NIfTI (.nii.gz)\
  \ files, converts them to STL meshes, and evaluates anatomical regions of the skull.\n\n## Project Structure\n\
  \n\n- **extract_skull.py**: Converts region of interest to surface meshes (.stl).\n- **eval_skull.py**:\
  \ Evaluates real vs. synthetic skull meshes\n- **summary.py**: Writes CSV files results and generates\
  \ bar plots for metrics.\n- **my_io.py**: I/O utilities for NIfTI and STL file handling.\n- **mesh_ops.py**:\
  \ Mesh processing utilities.\n- **region_split.py**: Assigns anatomical regions to skull vertices.\n\
  - **ct_config.yaml**: Configuration \n **Dice.py**: Computes Dice similarity coefficients between real\
  \ and synthetic CT scans for more evaluation.\n## Prerequisites\n\n- **Python**: 3.8 or higher\n\nCopy\n\
  SimpleITK==2.3.1\nnumpy==1.26.4\nnibabel==5.2.1\ntrimesh==4.4.9\nscikit-image==0.24.0\nscipy==1.14.1\n\
  pandas==2.2.2\nmatplotlib==3.9.2\npyyaml==6.0.2\n\nwork_dir: /path/to/working/directory\n\nct_real_dir:\
  \ /path/to/GT_CTs\n\nct_synth_dir: /path/to/s_CTs\n\nhu_thresh: 300\n\nn_sample: 10000\n\nwork_dir:\
  \ Directory for output meshes and CSV files.\n\nct_real_dir: Path to real CT scans.\n\nct_synth_dir:\
  \ Path to synthetic CT scans.\n\nhu_thresh: Hounsfield Unit threshold for skull segmentation.\n\nn_sample:\
  \ Number of points to sample for mesh evaluation.\n\nPrepare Input Data: Place your .nii.gz files in\
  \ the directories specified in ct_config.yaml.\n"

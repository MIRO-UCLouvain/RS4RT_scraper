readme_excerpt: "## Radiomics for Lung Cancer Detection\n\nThis repository provides an overview of the\
  \ datasets and tools used in the study titled:\n**\"Uncovering the Diagnostic Power of Radiomic Feature\
  \ Significance in Automated Lung Cancer Detection: An Integrative Analysis of Texture, Shape, and Intensity\
  \ Contributions.\"**\n\n## Datasets\n- **NSCLC-Radiomics**: [Link to dataset](https://www.cancerimagingarchive.net/collection/nsclc-radiomics/)\
  \ (Accessed on: 2024-10-12)\n- **RIDER datasets**: [Link to dataset](https://www.cancerimagingarchive.net/analysis-result/rider-lungct-seg/)\
  \ (Accessed on: 2024-10-12)\n- **Private Clinical Data**: Obtained from clinical collaborators (not\
  \ publicly available due to ethical restrictions).\n\n## Tools and Libraries\n- **Feature Extraction**:\
  \ PyRadiomics ([Website](https://pyradiomics.readthedocs.io/))  \n- **Programming Language**: Python\
  \  \n- **Additional Libraries**: NumPy, SciPy, scikit-learn  \n\n## Study Overview\nThe study aims to\
  \ improve the diagnostic accuracy of lung cancer detection through radiomics and machine learning. Future\
  \ updates will include detailed documentation of methods and source code for reproducing results.\n\n\
  ## Future Work\n- Detailed documentation of preprocessing methods and machine learning workflows.\n\
  - Source code for feature extraction and model development.\n\n## Citation\nIf you use this repository,\
  \ please cite our study: DOI: https://doi.org/10.20944/preprints202411.1621.v1\n## License\n\nThis repository\
  \ is made available under the terms of the [Creative Commons Attribution 4.0 International License (CC\
  \ BY 4.0)](https://creativecommons.org/licenses/by/4.0/).  \n\n### Disclaimer\n- Currently, this repository\
  \ contains only introductory information regarding the datasets, tools, and libraries used in the study.\
  \  \n- Detailed documentation, methods, and source code will be added in future updates.  \n\nBy using\
  \ this repository, you agree to cite the corresponding study and acknowledge the authorship as outlined\
  \ in the **Citation** section.  \n"

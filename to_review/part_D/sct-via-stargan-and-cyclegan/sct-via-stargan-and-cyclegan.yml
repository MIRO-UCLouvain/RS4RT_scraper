readme_excerpt: "# sCT Generation via StarGAN and CycleGAN\n\nThis repository contains the code used in\
  \ the paper **\"Synthetic CT Generation from CBCT and MRI Using StarGAN in the Pelvic Region\"**. The\
  \ work explores the application of StarGAN for generating synthetic CT (sCT) images from CBCT and MRI\
  \ scans compare to the use of CycleGAN, specifically in the pelvic region.\n\n**Published in:** *Radiation\
  \ Oncology*  \n**DOI:** [10.1186/s13014-025-02590-2](https://doi.org/10.1186/s13014-025-02590-2)\n"

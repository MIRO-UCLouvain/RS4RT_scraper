readme_excerpt: "# Reinforcement learning optimization for radiotherapy treatments\nReinforcement Learning\
  \ Open-Source Project for Radiotherapy Treatments. \n\n\n\n## Key points\n\n- [x] Reinforcement learning\
  \ (RL) optimization\n- [x] Pre-trained RL agents\n- [x] Easy simulations\n- [ ] Custom radiotherapy\
  \ treatments \n\n\n## Description\n\nWe used a cellular model that results from the combination of a\
  \ cellular model developed by [A. Jalalimanesh](https://www.sciencedirect.com/science/article/abs/pii/S0378475416300878)\
  \ and another one developed by [O'Neil](https://scholarscompass.vcu.edu/etd/2831/). Reinforcement learning\
  \ algorithms (Q-learning, Sarsa and Expected Sarsa) are used to provide optimizations on radiotherapy\
  \ treatments. The goal of this work is to generate superior radiotherapy treatment plans concerning\
  \ Tumor Control Probability (TCP), number of radiation fractions, total radiation dose, treatment duration,\
  \ and healthy cell survival rate.\n\n<details>\n   <summary>Additional Informations</summary>\n   <p>\n\
  This open-source project introduces an autonomous decision-making framework designed to evaluate whether\
  \ adjustments are required in the ongoing radiotherapy treatment. Leveraging advanced machine learning\
  \ algorithms, it analyzes tumor imaging during the treatment, fostering enhanced precision and effectiveness\
  \ in radiotherapy procedures.</p>\n</details>\n\n## Usage\n\n```anaconda\npython application.py\n```\n\
  \n<details>\n   <summary>Home Page</summary>\n   <p><p align=\"center\">\n<img src=\"images/treatment_page.png\"\
  \ border=\"10\"/>\n</p></p>\n</details>\n\n<details>\n   <summary>Nutrients Page</summary>\n   <p><p\
  \ align=\"center\">\n<img src=\"images/nutrients_page.png\" border=\"10\"/>\n</p></p>\n</details>\n\n\
  <details>\n   <summary>Cell Cycle Page</summary>\n   <p><p align=\"center\">\n<img src=\"images/cell_cycle_page.png\"\
  \ border=\"10\"/>\n</p></p>\n</details>\n\n<details>\n   <summary>Radiosensitivity Page</summary>\n\
  \   <p><p align=\"center\">\n<img src=\"images/radiosensitivity_page.png\" border=\"10\"/>\n</p></p>\n\
  </details>\n\n<details>\n   <summary>Classifier Page</summary>\n   <p><p align=\"center\">\n<img src=\"\
  images/classifier_page.png\" border=\"10\"/>\n</p></p>\n</details>\n\n<details>\n   <summary>Simulation\
  \ Page</summary>\n   <p><p align=\"center\">\n<img src=\"images/simulation_page.png\" border=\"10\"\
  />\n</p></p>\n</details>\n\n## Results\n\nThe baseline treatment corresponds to a radiotherapy treatment\
  \ where a dose of 2 Gy is given every 24 hours to the patient. We compare the performance of our automatic\
  \ decision-making architecture with the baseline treatment on different types of cellular environments\
  \ (with modified radiosensitivity or modified cell cycle duration) :\n\n|                | Radiosensitivity\
  \ of 0.8 | Radiosensitivity of 0.7 | Radiosensitivity of 0.6 | Cell cycle of 24h | Cell cycle of 20h\
  \ | Cell cycle of 18h | Cell cycle of 16h |\n|:--------------:|:-----------------------:|:-----------------------:|:-----------------------:|:-----------------:|:-----------------:|:-----------------:|:-----------------:|\n\
  |    Baseline    |         -52.4\\%         |         -51.0\\%         |         -33.2\\%         |\
  \      -55.0\\%      |      -62.3\\%      |      -59.0\\%      |      -50.3\\%      |\n| Selected Agent\
  \ |         +23.3\\%         |         -10.5\\%         |         -22.7\\%         |      -8.36\\% \
  \     |      +26.4\\%      |      +8.59\\%      |      +8.90\\%      |\n\n\n## Dependencies\n- customtkinter\
  \ : 5.1.2\n- numpy         : 1.24.3\n- matplotlib    : 3.5.3\n- seaborn       : 0.12.1\n- scipy    \
  \     : 1.10.1\n- torch         : 2.0.1\n- sklearn       : 1.2.2\n- pandas        : 1.1.3\n- PIL   \
  \        : 9.2.0\n\n## License\n\n[EPL]()\n"

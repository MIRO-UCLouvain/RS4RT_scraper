readme_excerpt: "# Brain Tumor Segmentation — U-Net — Brain MRI\n\nA deep learning model that looks at\
  \ a brain MRI scan and automatically\noutlines exactly where a tumor is, pixel by pixel.\n\n**Result:\
  \ Dice score of 0.75 on scans the model had never seen before.**\n\n---\n\n## What is image segmentation?\n\
  \nMost people have heard of image *classification* — a model looks at a photo\nand says \"this is a\
  \ cat.\" Segmentation goes further: instead of labelling\nthe whole image, it labels **every single\
  \ pixel**.\n\nSo for a brain MRI, the model doesn't just answer \"is there a tumor?\" It\nanswers \"\
  which exact pixels *are* the tumor?\" The output is a mask — a\nblack-and-white image where white marks\
  \ tumor and black marks everything\nelse.\n\nThink of it as the difference between saying \"there's\
  \ a tumor in this scan\"\nand drawing a precise outline around it with a marker.\n\n## Why build this?\n\
  \nRadiologists currently outline tumors by hand, slice by slice. A single\npatient's MRI can have dozens\
  \ of slices, and each one takes time and\nconcentration. It's slow, and two doctors can draw slightly\
  \ different\nboundaries.\n\nAn automated model can:\n- Outline tumors in seconds instead of minutes\n\
  - Give consistent boundaries every time\n- Measure tumor size and track whether it grows or shrinks\
  \ between scans\n\nThis isn't meant to replace a doctor — it's meant to give them a starting\npoint\
  \ they can adjust, so they spend their time on judgement instead of\ntracing.\n\n## The dataset\n\n\
  [LGG MRI Segmentation](https://www.kaggle.com/datasets/mateuszbuda/lgg-mri-segmentation)\n— brain MRI\
  \ scans from real patients, each paired with a mask that doctors\ndrew by hand showing the true tumor\
  \ location.\n\nThose hand-drawn masks are the \"answer key.\" The model learns by comparing\nits guesses\
  \ against them, over and over, until its outlines match.\n\nThe full set has **3,929 slices**, of which\
  \ **1,373 (34.9%) contain a\ntumor**. That imbalance turns out to matter a lot — see below.\n\n## How\
  \ U-Net works\n\nU-Net is the model architecture. Its name comes from its shape — it goes\ndown, then\
  \ back up, like the letter U.\n\n**Going down (the encoder):** the image is compressed step by step.\
  \ The\nmodel loses fine detail but learns *what* it's looking at — edges, textures,\nshapes that look\
  \ like tumor tissue.\n\n**Going up (the decoder):** the compressed understanding is expanded back to\n\
  full size, so the model can say *where* the tumor is and draw the mask.\n\n**The shortcuts (skip connections):**\
  \ here's the clever part. Fine detail\nlost on the way down is passed directly across to the way up.\
  \ That's why\nU-Net can draw sharp, precise outlines instead of blurry blobs — and why\nit's the standard\
  \ choice for medical imaging.\n\n## The problem I had to solve\n\nThe first version of this model failed\
  \ completely. It predicted \"no tumor\"\non every single pixel — the output masks came back entirely\
  \ black.\n\nThe strange part: it reported **99% accuracy**.\n\nThat's the trap. The imbalance runs at\
  \ two levels: about 65% of slices have\nno tumor at all, and even inside a tumor slice, the tumor is\
  \ only a small\npatch of the total pixels. Across the whole dataset, roughly 1% of pixels\nare tumor.\
  \ So a model that predicts \"background, background, background\"\nfor everything is right 99% of the\
  \ time. It scored beautifully while being\ncompletely useless.\n\nThree changes fixed it:\n\n1. **Changed\
  \ the loss function to combined BCE + Dice.** The original loss\n   let \"predict nothing\" look like\
  \ a great answer. Dice loss measures\n   *overlap* with the true tumor, so predicting nothing scores\
  \ zero — the\n   model is forced to actually find the tumor.\n\n2. **Lowered the learning rate to 1e-4.**\
  \ The model was taking steps so big\n   it leapt straight to the useless all-black answer on the first\
  \ epoch and\n   never left. Smaller steps let it learn gradually.\n\n3. **Trained only on the 1,373\
  \ slices that contain a tumor.** Feeding it\n   mostly-empty images drowned the signal. Showing it slices\
  \ that actually\n   have something to find gave it something to learn from.\n\nDice went from **~0.00\
  \ to ~0.75**.\n\n## Why Dice, not accuracy\n\nAccuracy is meaningless here, for the reason above — 99%\
  \ accuracy described\na model that found nothing.\n\n**Dice score** measures how much the predicted\
  \ mask overlaps the true mask.\n1.0 means a perfect match; 0.0 means no overlap at all. If the model\n\
  predicts nothing, Dice is 0 — no hiding.\n\nThat's why every plot and result below reports Dice.\n\n\
  ---\n\n## Results\n\n### Training curves\n\n![Training curves](training_curves.png)\n\nThe Dice panel\
  \ on the right is the one that matters. Both the training line\nand the validation line climb together\
  \ to about **0.77 / 0.74**.\n\nTwo things this tells us:\n- **The model is learning** — Dice rising\
  \ means predictions increasingly\n  overlap real tumors\n- **It isn't cheating** — validation is measured\
  \ on scans held back from\n  training. Since both lines rise together, the model learned real patterns\n\
  \  rather than memorizing specific images\n\nThe middle panel shows loss falling steadily for both,\
  \ from ~1.20 down to\n~0.28 — the model's mistakes shrinking over time.\n\n### Predicted masks\n\n![Predicted\
  \ masks](predicted_masks.png)\n\nThree columns, on scans the model never saw during training:\n- **Left**\
  \ — the original MRI slice\n- **Middle** — the true mask a doctor drew by hand\n- **Right** — the model's\
  \ prediction\n\nThe model finds the tumor in roughly the right place and shape. It's not\npixel-perfect\
  \ — edges are rougher than the doctor's outline — which is\nexactly what a Dice of 0.75 looks like in\
  \ practice.\n\n### Tumor overlay\n\n![Tumor overlay](tumor_overlay.png)\n\nThe predicted mask painted\
  \ in red on top of the original MRI. This is the\nform a radiologist would actually want to look at\
  \ — the detection shown in\ncontext, on the scan itself, rather than as a separate black-and-white\n\
  image.\n\n---\n\n## Setup\n\n| Component | Choice |\n|---|---|\n| Model | U-Net (2,066,497 parameters)\
  \ |\n| Input | 128×128 grayscale MRI slices |\n| Output | Binary tumor mask |\n| Loss | Combined BCE\
  \ + Dice |\n| Optimizer | Adam, learning rate 1e-4 |\n| Training | 30 epochs, batch size 16, on 1,373\
  \ tumor slices |\n| Framework | TensorFlow / Keras |\n\n## Results summary\n\n| Metric | Score |\n|---|---|\n\
  | Test Dice | **0.7481** |\n| Train Dice (final epoch) | 0.7706 |\n| Validation Dice (final epoch) |\
  \ 0.7359 |\n| Test accuracy | 0.9867 (not meaningful — see above) |\n\n## How to run\n\n1. Open `unet_lgg_segmentation.ipynb`\
  \ in Google Colab\n2. Switch to a GPU runtime: **Runtime → Change runtime type → T4 GPU**\n   (on CPU\
  \ this takes hours instead of minutes)\n3. Add your Kaggle API token in Cell 1 (Kaggle → Settings →\
  \ API)\n4. Run the cells in order\n\nTraining takes about 6 minutes on a T4 GPU (~10s per epoch after\
  \ the first).\n\n## Tech stack\n\nPython · TensorFlow/Keras · OpenCV · NumPy · scikit-learn · Matplotlib\n\
  \n## Limitations\n\n- Trained only on tumor-containing slices, so the model hasn't learned to\n  say\
  \ \"no tumor here\" — it assumes one exists. A production system would\n  need a classification stage\
  \ first, or retraining with negatives handled\n  properly.\n- Uses grayscale input; the original scans\
  \ have three channels that could\n  carry extra useful information\n- 0.75 Dice is good but not clinical-grade;\
  \ predicted edges are rougher\n  than expert outlines\n- Trained on one dataset from one source, so\
  \ it may not transfer to scans\n  from different machines or hospitals\n- The curves were still improving\
  \ at epoch 30 — longer training or\n  augmentation would likely push Dice higher\n"

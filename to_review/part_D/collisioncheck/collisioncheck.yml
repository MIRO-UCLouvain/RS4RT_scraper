readme_excerpt: "# collisionCheck\nThis is a collision check program using blender. The program either\
  \ calculates a collision-free map or checks paths for collisions given in XML file format for a TrueBeam\
  \ system model. There is a GUI  available for the Eclipse Treatment Planning System (TPS). The corresponding\
  \ publication can be found here:  https://doi.org/10.1002/acm2.14165\n\nThere are following folders:\n\
  - code: contains all code files\n- config: contains the configuration file\n- model: contains the blender\
  \ model\n- studies: Folder for data\n\nRequirements:\n- Blender needs to be installed. You can get blender\
  \ from here https://www.blender.org/download/\n\nAttention: \nThe python programs run in the bundled\
  \ python of blender. If packages are missing, do the following steps:\n1. Go to the python library inside\
  \ the blender distribution folder, e.g. blender/3.2/python/bin\n2. Run /python3 -m pip install --upgrade\
  \ pip\n3. Run /pip3 install matplotlib\n\nInstallation:\nFollowing paths need to be set to run the program:\n\
  - blenderpath in config.properties: The path to the blender executable needs to be specified, e.g. /home/blender/blender\n\
  - HOMEDIR in run-blender script: The path to the collisionCheck folder needs to be specified, e.g. /home/collisionCheck\n\
  \nRun:\nRun the collision check: ./code/run-blender study patient plan script\n- study: specify the\
  \ study, e.g. demo\n- patient: specify the patient, e.g. Patient_0\n- plan: specify the plan, e.g. Plan_1\n\
  - script: specify which script to run, either collisionMap or pathCheck\n\n\nEclipse Script:\n- There\
  \ are two Eclipse scripting API for running the collision check directly from the Eclipse TPS.\n- Local\
  \ script: This script is for when the collision check and blender are installed on the same computer\
  \ as the Eclipse TPS\n- Remote script: This script is for when the collision check and blender are installed\
  \ on a different computer which can be accesed via ssh from the Eclipse TPS computer\n\nIn the remote\
  \ script, following things need to be specified:\n- localDir: Path for the data on the local computer,\
  \ e.g. d:\\\\data\\\\collision\n- remote: Name and  IP for the remote connection, e.g. demo@remote.ch\n\
  - remoteDir: Path to the collisionCheck folder on the remote computer\n\nIn the local script, following\
  \ things need to be specified:\n- localDir: Path to the collisionCheck folder \n"

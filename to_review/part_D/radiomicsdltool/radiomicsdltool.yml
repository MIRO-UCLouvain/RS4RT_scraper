readme_excerpt: "# RadiomicsDLTool\n\n#### This is updating for Title: A preoperative CT-based deep learning\
  \ radiomics model in predicting the stage, size, grade and necrosis score and outcome in localized clear\
  \ cell renal cell carcinoma: A multicenter study\n\n## Final code and model weights clarify\n### Ai\
  \ features\nThe code AI-features.py is used to generate Ai features based on resnet152 as following:\n\
  ```python\nfrom torchvision import models\nmodel = models.resnet152(pretrained=True)\n```\nThe model\
  \ weight is the pretrained weight from pytroch library.\n### Different CT Windows\nIn this study, different\
  \ settings of CT windows can generate different picutures of the lesions. The same Ai model could generate\
  \ different Ai features from those windows. In the results files, you can find standard-, soft-, and\
  \ bone-window features.\n\n## AI-features.py\none needs to get the cropped slice of lesions. Then converted\
  \ it to .npy form. This python script will extracted Ai features of your .npy figures in the Preprocess\
  \ folder. Note, the example 1.npy in the folder is used for illustration only. For privacy purpose,\
  \ it does not related to patients included in this study. \n\n## R codes\nWe use R language to analysis\
  \ and model all Ai features and pyradiomics features.\n\n## Note\n1, If you need any further imform,\
  \ you can make an issue.\n\n2, data is not available, for privacy concerns. \n"

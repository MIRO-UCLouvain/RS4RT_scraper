readme_excerpt: "# Index\n\nA simple module for fixing the height issue in mobile browsers where the address\
  \ bar is visible, and the content does not fill the full height of the screen.\n\nIs intended to solve\
  \ this issue automagically \U0001FA84\n\n- https://css-tricks.com/css-fix-for-100vh-in-mobile-webkit/\n\
  - https://css-tricks.com/the-trick-to-viewport-units-on-mobile/\n\nFrom the latter of these pages I\
  \ took most of the cue to create this module, so kudos to Louis Hoebregts (@Mamboleoo)  \n\n## Installation\n\
  \n```bash\nnpm install mobile-height-fix\n```\n\n## Usage\nAfter importing the module\n\n- The body\
  \ will be set to have a minimum height of 100% of the height of the screen\n\n- A new custom property\
  \ will be available, `--vh` that represents the 1% of the height of the screen\n  You can use this css\
  \ variable in this way>  \n\n```css\n    height: calc(var(--vh, 1vh) * 100)\n```\n\n\n### Importing\
  \ in HTML (recommended)\n\nAdd the following script tag in the `<head>` section of your HTML file to\
  \ ensure that the script is executed as soon as possible:\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
  en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n    <title>Your Website Title</title>\n    <script type=\"module\" src=\"node_modules/mobile-height-fix/MobileHeightFix.js\"\
  ></script>\n</head>\n<body>\n    <!-- Your content here -->\n</body>\n</html>\n```\n\n### Importing\
  \ in JavaScript\n\nIf you are using a bundler or a more complex JavaScript setup, you can import the\
  \ module in your JavaScript file:\n\n```javascript\n// Import the MobileHeightFix class\nimport MobileHeightFix\
  \ from 'mobile-height-fix';\n\n// Create an instance and initialize the fix\nconst heightFix = new MobileHeightFix();\n\
  ```\n\n### Explanation\n\nThe `MobileHeightFix` class provides a solution to the issue on mobile browsers\
  \ where the address bar is visible, and the content does not fill the full height of the screen. It\
  \ sets a custom property (`--vh`) on the HTML root element to reflect the actual height of the viewport.\n\
  \nThe script automatically sets the full height when it is initialized and adds a resize event listener\
  \ to handle changes in viewport size.\n\n## API\n\n### `MobileHeightFix()`\n\nConstructor that initializes\
  \ the `MobileHeightFix` instance.\n\n### `setFullHeight()`\n\nSets the full height of the window by\
  \ updating the `--vh` custom property on the HTML root element.\n\n### `init()`\n\nInitializes the fix\
  \ by calling `setFullHeight()` and adding a resize event listener.\n\n## Example\n\n```javascript\n\
  // Import the MobileHeightFix class\nimport MobileHeightFix from 'mobile-height-fix';\n\n// Create an\
  \ instance and initialize the fix\nconst heightFix = new MobileHeightFix();\n\n// Will update the --vh\
  \ value\nheightFix.setFullHeight();\n```\n\n### Explanation\n\n#### Script (No Import/Export)\n\nThe\
  \ `Index` script provides a solution to the issue on mobile browsers where the address bar is visible,\
  \ and the content does not fill the full height of the screen. It automatically sets a custom property\
  \ (`--vh`) on the HTML root element to reflect the actual height of the viewport. The script is designed\
  \ to work without explicit import/export and automatically sets the full height when it is loaded. It\
  \ also adds a resize event listener to handle changes in viewport size.\n\n#### Module (Import/Export)\n\
  \nThe `Index` module can be imported in more complex JavaScript setups. It provides the same functionality\
  \ as the script but allows you to use modern JavaScript features like import/export. To use this option,\
  \ import the module and create an instance to initialize the fix.\n\n## License\n\nThis project is licensed\
  \ under the ISC License - see the [LICENSE](LICENSE) file for details.\n"

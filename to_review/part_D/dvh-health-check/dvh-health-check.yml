readme_excerpt: '# Dayboro Valley Health — Free Health Check Finder (Mobile)


  A single-page, mobile-optimised quiz that helps patients identify which preventative Medicare health
  checks they may be eligible for (ATSI Health Check, Heart Health Check, 45–49 and 75+ Health Assessments,
  National Lung Cancer Screening Program, GP Mental Health Treatment Plan, GP Chronic Condition Management
  Plan, cervical and bowel cancer screening, and more).


  **Live site:** enable GitHub Pages on this repo and your URL will be:

  `https://<your-github-username>.github.io/<repo-name>/`


  ## How it works


  - Fully self-contained: one HTML file, no build step, no server, no external dependencies (the practice
  logo is embedded directly in the file).

  - All logic runs in the visitor''s browser. No answers, health information, or contact details are transmitted,
  logged, or stored anywhere — nothing leaves the device. Patients who opt in to being contacted are shown
  a message asking them to share those details with reception directly (by phone or at their next visit),
  since this static page has no backend to receive them.

  - General information only — not a medical assessment. Every result is framed as "may be eligible,"
  with a reminder that final eligibility is confirmed by the GP.


  ## Updating the content


  Open `index.html` in any text editor — the eligibility rules live in the `buildResults()` function near
  the bottom of the file, and the questions/wording are in the HTML body above it. Re-upload the file
  to GitHub (or push via git) after any edit to update the live site.


  ## Related files


  A desktop-optimised version of the same quiz (wider layout, no fixed bottom nav) exists separately for
  use on reception iPads or larger screens.


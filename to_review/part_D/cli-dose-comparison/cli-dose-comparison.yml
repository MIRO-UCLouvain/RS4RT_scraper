readme_excerpt: "# CLI Dose comparison\n\n## gamma_pass.sh\nGamma pass dose comparison on the commandline\
  \ using plastimatch.\n\nThe program requires `dcmtk` and `plastimatch`. Both can be installed in a debian\
  \ system by running\n\n`sudo apt install dcmtk plastimatch`\n\nTested on Kubuntu 20.04, but should work\
  \ on any distribution (at least debian based I would guess).\n\nUsage:\n`./gamma_pass.sh <dicom_dir>\
  \ --mindose 10 --outputfilename \"my_gamma_passes.txt\" --dose-dta 3 --dist-dta 3`\n\nFor gamma passes\
  \ on the body, CTV, PTV, bladder and rectum on all voxels over 10% of the reference dose with a 3 mm\
  \ / 3% dose criterium.\n\nThe program will find a structure file and two RTDOSE files. If it finds too\
  \ many structure-files or dose files it will ask for specification.\n\nThe program will look for reference\
  \ RTDOSE file with \"plan\", \"rtdose\", or \"ref\" in the name.\n\nThe program will look for a test\
  \ RTDOSE file with \"sim\", \"test\", \"fluka\", \"flk\", \"topas\" or \"geant\" in the name.\n\nOtherwise\
  \ the program will just find 2 RTDOSE files.\n\nFor more information run \n\n`./gamma_pass.sh -h` or\
  \ `./gamma_pass.sh --help`\n"

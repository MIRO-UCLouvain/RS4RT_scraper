readme_excerpt: "# \U0001F9B7 Multimodal-AI-Odontogenic-Cyst-Diagnosis\n\n## \U0001F393 Bachelor Thesis\
  \ Project (Computer Engineering)\n\nThis repository contains the full source code, models, and analytical\
  \ tools developed for my **Bachelor of Science Thesis** at Shahid Beheshti University. The project focuses\
  \ on pioneering a **Multimodal Artificial Intelligence (AI) approach** for the accurate diagnosis of\
  \ **Odontogenic Cysts** (e.g., Odontogenic Keratocyst - OKC).\n\nThe core innovation lies in **fusing\
  \ information from diverse medical data sources** to enhance diagnostic reliability and performance,\
  \ moving beyond traditional single-source diagnostic methods.\n\n---\n\n## \U0001F3AF Project Goal\n\
  \nTo develop a robust AI system capable of diagnosing Odontogenic Cysts with high accuracy by integrating\
  \ three complementary data modalities:\n\n1.  **Radiomics:** Features extracted from Panoramic Radiography\
  \ images.\n2.  **Histopathology:** Features extracted from Whole Slide Images (WSIs) or microscopic\
  \ sections.\n3.  **Clinical/Demographic Data:** Tabular patient information (e.g., age, gender, lesion\
  \ size).\n\nThe final model achieved a diagnostic accuracy of **92%** on the specialized dataset, significantly\
  \ outperforming unimodal (single-data source) approaches (which performed as low as 51% in the base\
  \ model).\n\n---\n\n## ⚙️ Model Architecture & Methodology\n\nThe project employs a multi-stage process\
  \ involving specialized models for each data type, followed by a fusion mechanism:\n\n### 1. Data Preprocessing\
  \ & Feature Extraction\n\n| Modality | Techniques Used | Key Files/Code |\n| :--- | :--- | :--- |\n\
  | **Radiomics (Radiography)** | Feature extraction (e.g., texture, shape) using specialized libraries.\
  \ | `BachelorProject(Demo+Radio+Histo).ipynb` |\n| **Histopathology (WSI)** | Image processing, feature\
  \ extraction from digitized pathology slides. | `BachelorProject(Demo+Radio+Histo).ipynb` |\n| **Clinical/Demographic**\
  \ | Data cleaning, encoding (e.g., **LabelEncoder**), and normalization (**StandardScaler**). | `BachelorProject(Demo+Radio+Histo).ipynb`\
  \ |\n\n### 2. Model Training & Fine-Tuning\n\nThe core of the system uses deep learning models, often\
  \ leveraging pre-trained architectures (e.g., self-models) and **fine-tuning** them with the domain-specific\
  \ medical dataset.\n\n* **Initial Base Model:** Performance check on pre-trained models without fine-tuning,\
  \ demonstrating the need for domain adaptation.\n* **Fine-Tuning:** The models were adapted using the\
  \ Odontogenic Cysts dataset, leading to the reported 92% accuracy.\n\n### 3. Multimodal Fusion\n\nThe\
  \ extracted feature vectors from the specialized models are concatenated or fused at a late-stage layer,\
  \ allowing the final classifier (often a simple fully-connected network) to leverage the complementary\
  \ diagnostic information from all three sources.\n\n---\n\n## \U0001F4C2 Repository Structure\n\nThe\
  \ key components of the project are organized as follows:\n\n| File/Folder | Description |\n| :--- |\
  \ :--- |\n| **`BachelorProject(Demo+Radio+Histo).ipynb`** | **Main Jupyter Notebook** containing all\
  \ code for data loading, preprocessing, model definition, training, and evaluation (including unimodal\
  \ and multimodal comparisons). |\n| **`MahdisSepahvand-400243045-thesis.pdf`** | The complete Bachelor\
  \ Thesis document (in Persian), detailing the methodology, literature review, and results. |\n| **`/images`**\
  \ | Contains visual results of the project, including performance metrics (Confusion Matrices), accuracy\
  \ plots, and visual representations of the fine-tuning process. |\n| **`/data`** | Placeholder for the\
  \ anonymized dataset files (Radiography, Histopathology features, and clinical data) - **Note:** Raw\
  \ patient data cannot be publicly shared. |\n\n---\n\n## \U0001F4C8 Key Results\n\nThe multimodal approach\
  \ demonstrated superior performance across all standard metrics:\n\n| Metric | Multimodal Result | Base/Unimodal\
  \ Comparison |\n| :--- | :--- | :--- |\n| **Accuracy** | **92%** | Improved from 51% (Base Model) |\n\
  | **Key Finding** | The fusion of Radiomic, Histopathologic, and Clinical data is essential for achieving\
  \ clinically reliable diagnostic performance. |\n\n### Dataset\n\n#### Histography data\n![images](https://github.com/MahdisSep/Multimodal-AI-Odontogenic-Cyst-Diagnosis/blob/main/results/histography%20data.png)\n\

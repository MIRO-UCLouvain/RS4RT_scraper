readme_excerpt: "# Glioblastoma MRI Enhancement Pipeline\n\n**Classical image processing pipeline for\
  \ brain tumor MRI enhancement and brain extraction,\nbuilt in MATLAB for clinical radiation therapy\
  \ planning applications.**\n\n---\n\n## Overview\n\nThis project implements a 12-stage image processing\
  \ pipeline that enhances raw T1-contrast\nMRI scans of glioblastoma multiforme (GBM) to improve tumor\
  \ boundary visibility for\nradiation therapy planning. Every stage uses classical digital image processing\
  \ techniques:\nno machine learning or neural networks.\n\nDeveloped as our final project for COMP 510\
  \ Advanced Image Analysis Techniques.\n\n**Clinical motivation:** Radiation therapy for GBM requires\
  \ precise manual contouring of\nthe tumor boundary on MRI. Raw scans suffer from low local contrast,\
  \ intensity\ninhomogeneity, and acquisition noise. When boundaries are unclear, oncologists must expand\n\
  the treatment margin, irradiating healthy brain tissue that could otherwise be spared.\nThis pipeline\
  \ addresses each artifact systematically using brain extraction, spatial, and frequency domain processing.\
  \ \n\n---\n\n## Pipeline Stages\n\n| Stage | Technique | Purpose |\n|-------|-----------|---------|\n\
  | 1 | Preprocessing | Intensity normalization, grayscale, median denoising |\n| 2 | CLAHE | Adaptive\
  \ local contrast enhancement (8x8 tile grid, Rayleigh distribution) |\n| 3 | Unsharp masking | Edge\
  \ sharpening for tumor boundary delineation |\n| 4 | High-emphasis filter | Frequency domain detail\
  \ boost without anatomical loss |\n| 5 | Homomorphic filter | Log-domain illumination/reflectance separation\
  \ |\n| 6 | Haze removal | Contrast stretch + gamma correction to restore dynamic range |\n| 7 | Pseudocolor\
  \ mapping | Hot colormap for clinical tissue intensity visualization |\n| 8 | Brain extraction | Threshold\
  \ segmentation to isolate brain parenchyma |\n| 9 | Morphological ops | imclose + imopen + imfill to\
  \ clean brain boundary mask |\n| 10 | Connected components | Largest-region isolation of brain from\
  \ background |\n| 11 | Object measurement | Area, perimeter, centroid, bounding box, equivalent diameter\
  \ |\n| 12 | Compression analysis | JPEG Q=10/50/90 quality degradation via PSNR and SSIM |\n\n---\n\n\
  ## Results\n\nEvaluated on 10 glioblastoma MRI scans from the Kaggle Brain Tumor MRI Dataset:\n\n###\
  \ Aggregate Metrics\n\n| Metric | Value |\n|--------|-------|\n| **Avg ICR improvement** | **+65.9%**\
  \ |\n| Avg PSNR (CLAHE vs original) | 17.50 dB |\n| Avg SSIM (CLAHE vs original) | 0.521 |\n| JPEG Q90\
  \ PSNR range | 41.5 – 43.9 dB |\n| JPEG Q90 SSIM range | 0.991 – 0.995 |\n| Avg brain area | 134,144\
  \ px (range: 84,674 – 184,615 px) |\n\n### Per-Image Results\n\n| Image | PSNR (dB) | SSIM | ICR Before\
  \ | ICR After | ICR Improvement |\n|-------|-----------|------|------------|-----------|----------------|\n\
  | Te-gl_1.jpg   | 21.26 | 0.582 | 0.480 | 0.782 | +63.0% |\n| Te-gl_110.jpg | 17.06 | 0.523 | 0.473\
  \ | 0.811 | +71.5% |\n| Te-gl_114.jpg | 15.86 | 0.533 | 0.483 | 0.828 | +71.5% |\n| Te-gl_115.jpg |\
  \ 19.36 | 0.569 | 0.375 | 0.741 | +97.7% |\n| Te-gl_134.jpg | 16.36 | 0.622 | 0.413 | 0.812 | +96.8%\
  \ |\n| Te-gl_18.jpg  | 16.51 | 0.329 | 0.518 | 0.723 | +39.6% |\n| Te-gl_261.jpg | 15.47 | 0.440 | 0.447\
  \ | 0.783 | +75.0% |\n| Te-gl_62.jpg  | 16.80 | 0.483 | 0.754 | 0.894 | +18.7% |\n| Te-gl_84.jpg  |\
  \ 19.62 | 0.542 | 0.509 | 0.838 | +64.5% |\n| Te-gl_90.jpg  | 16.72 | 0.588 | 0.502 | 0.808 | +61.0%\
  \ |\n\n### Compression Analysis\n\nAll 10 enhanced images retain diagnostic quality at JPEG Q=90 (PSNR\
  \ > 41 dB, SSIM > 0.99),\ndemonstrating suitability for clinical PACS archiving.\n\n| JPEG Quality |\
  \ PSNR Range | SSIM Range | Clinical Interpretation |\n|-------------|------------|------------|------------------------|\n\
  | Q=10 | 27.9 – 29.5 dB | 0.812 – 0.926 | Significant loss |\n| Q=50 | 33.8 – 35.9 dB | 0.934 – 0.981\
  \ | Acceptable quality |\n| Q=90 | 41.5 – 43.9 dB | 0.991 – 0.995 | Near-lossless, diagnostic quality\
  \ preserved |\n\n---\n\n## Metrics Explained\n\n**ICR (Internal Contrast Ratio)** = `std(brain pixels)\
  \ / mean(brain pixels)` within the\nextracted brain mask. A higher ICR means white matter, gray matter,\
  \ CSF, and tumor tissue\nspan a wider, more separated intensity range - directly reflecting diagnostic\
  \ utility.\nComputed on both original and enhanced images using the same mask for a fair comparison.\n\
  \n**PSNR** measures structural fidelity of the enhanced image versus the original.\n\n**SSIM** measures\
  \ perceptual similarity preserving luminance, contrast, and local structure.\n\n---\n\n## Dataset\n\n\
  **Kaggle Brain Tumor MRI Dataset** by Masoud Nickparvar\nhttps://www.kaggle.com/datasets/masoudnickparvar/brain-tumor-mri-dataset\n\
  \n7,023 T1-weighted contrast-enhanced MRI scans across four classes. This project uses\n10 images from\
  \ Testing/glioma/ selected for varied noise levels and contrast conditions.\n\nTo replicate: download\
  \ the dataset, copy images from Testing/glioma/ into data/input/.\n\n---\n\n## Requirements\n\n- MATLAB\
  \ R2019a or later\n- Image Processing Toolbox\n\n```matlab\nlicense('test', 'Image_Toolbox')   % returns\
  \ 1 if available\n```\n\n---\n\n## Usage\n\n```bash\ngit clone https://github.com/danaharper151/glioblastoma-mri-pipeline.git\n\
  cd glioblastoma-mri-pipeline\n```\n\nPlace MRI images into data/input/, then in MATLAB:\n\n```matlab\n\
  demo_single_image       % test on one image first — 8-panel stage visualization\nbrain_tumor_pipeline\
  \    % process all images in data/input/\nresults     % interactive before/after viewer (run after pipeline)\n\
  ```\n\n---\n\n## Output Files\n\n| File | Description |\n|------|-------------|\n| data/output/*_enhanced.png\
  \ | Final enhanced grayscale image |\n| data/output/*_color.png | Hot pseudocolor visualization |\n\
  | data/figures/*_pipeline.png | 5-panel enhancement progression (300 DPI) |\n| data/figures/*_segmentation.png\
  \ | 4-panel brain extraction + measurements (300 DPI) |\n| data/crops/*_brain_gray.png | Skull-stripped\
  \ grayscale output |\n| data/crops/*_brain_color.png | Skull-stripped pseudocolor output |\n| data/output/metrics_summary.csv\
  \ | Full quantitative results for all images |\n\n---\n\n## Project Structure\n\n```\nglioblastoma-mri-pipeline/\n\
  ├── brain_tumor_pipeline.m    # Main pipeline — all 12 stages\n├── demo_single_image.m       # Single\
  \ image demo with 8-panel visualization\n├── results.m     # Interactive before/after/hot colormap viewer\n\
  ├── README.md\n├── data/\n│   └── input/\n│       └── .gitkeep\n└── .gitignore\n```\n\n---\n\n## Key\
  \ Design Decisions\n\n**Why CLAHE instead of global histogram equalization?**\nCLAHE enhances each 8x8\
  \ tile independently, preventing bright skull from being\noverexposed while the tumor interior gains\
  \ contrast. Global HE cannot achieve this.\n\n**Why a high-emphasis filter instead of a bandpass?**\n\
  A pure bandpass zeros out low-frequency content, which is the brain anatomy. An early\nversion of this\
  \ pipeline used a bandpass and produced edge maps instead of enhanced images.\nThe high-emphasis formula\
  \ H = a + b x H_butterworth_hp preserves all frequencies while\nselectively boosting detail.\n\n**Why\
  \ segment on the original image for brain extraction?**\nThe enhanced image is globally brightened,\
  \ making any threshold unstable. The original's\nnear-zero background makes brain/background separation\
  \ reliable across all images.\n\n**Why ICR instead of CNR?**\nCNR requires knowing where the tumor is.\
  \ ICR is location-independent and measures tissue\nseparability across the entire brain region, which\
  \ is exactly what enhancement improves.\n\n---\n\n## Authors\n\nDana Harper & Arya Singh   \nAnthropic\
  \ Claude Sonnet 4.6 - build assistance and debugging   \nCOMP 510 - Advanced Image Analysis Techniques\
  \   \nInstructor: Dr. Vedang Chauhan | April 2026   \n\n---\n\n## License\n\nCode released under the\
  \ MIT License. MRI images from the Kaggle Brain Tumor MRI Dataset\nare subject to their original license.\
  \ Images are not included in this repository.\n"

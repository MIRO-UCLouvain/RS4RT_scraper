readme_excerpt: "# Automated 3D CT Reconstruction and Lung Tumor Segmentation in TCGA-LUSC Using TotalSegmentator\n\
  \n## Overview\n\nThis project presents an end-to-end computational pipeline for processing thoracic\
  \ CT scans from the TCGA-LUSC (The Cancer Genome Atlas – Lung Squamous Cell Carcinoma) dataset. The\
  \ framework reconstructs volumetric CT data from raw DICOM files, performs intensity standardization\
  \ in Hounsfield Units (HU), preserves anatomical voxel spacing, and applies automated multi-organ segmentation\
  \ using TotalSegmentator.\n\nThe pipeline demonstrates practical implementation of medical image preprocessing,\
  \ volumetric reconstruction, and AI-driven anatomical segmentation, forming a foundational step toward\
  \ radiomics and quantitative imaging research.\n\n---\n\n## Scientific Motivation\n\nAccurate 3D reconstruction\
  \ and segmentation of lung CT scans are critical for:\n\n- Radiomic feature extraction\n- Tumor burden\
  \ quantification\n- Morphological analysis\n- AI-based diagnostic modeling\n- Precision oncology research\n\
  \nThis project replicates a clinically relevant imaging workflow using open-source computational tools.\n\
  \n---\n\n## Methodology\n\n### DICOM Processing\n- Recursive identification of DICOM slices\n- Sorting\
  \ by ImagePositionPatient (Z-axis)\n- Extraction of pixel arrays\n- Conversion to Hounsfield Units (HU)\n\
  \n### 3D Volume Reconstruction\n- Stack slices into volumetric array\n- Preserve anatomical spacing\
  \ (z, y, x)\n- Maintain physical voxel dimensions\n\n### Visualization\n- Lung windowing (-600 HU center,\
  \ 1500 HU width)\n- Interactive slice navigation\n- Maximum Intensity Projection (MIP)\n\n### NIfTI\
  \ Conversion\n- Convert NumPy volume → SimpleITK image\n- Apply correct spatial metadata\n- Export as\
  \ `.nii.gz` for downstream processing\n\n### Automated Segmentation\n- Run TotalSegmentator\n- Extract\
  \ lung and tumor masks\n- Overlay segmentation on CT slices\n\n---\n\n## Pipeline Architecture\nRaw\
  \ DICOM Files\n↓\nDICOM Parsing & Sorting\n↓\nHU Conversion\n↓\n3D Volume Reconstruction\n↓\nVoxel Spacing\
  \ Preservation\n↓\nNIfTI Export (.nii.gz)\n↓\nTotalSegmentator\n↓\nOrgan & Tumor Masks\n↓\nSegmentation\
  \ Visualization\n\n\n---\n\n## Technologies Used\n\n- Python 3.10+\n- NumPy\n- pydicom\n- SimpleITK\n\
  - Matplotlib\n- ipywidgets\n- TotalSegmentator\n- Google Colab\n\n---\n\n## Repository Structure\nTCGA-LUSC-CT-Segmentation/\n\
  │\n├── FJ_update.ipynb # Original Colab notebook\n├── FJ_update.py # Script version\n├── requirements.txt\n\
  └── README.md\n\n## Dataset\nDataset not included due to size and TCGA data usage policies.\nUsers must\
  \ download TCGA-LUSC dataset from TCIA portal.  \nDataset link:  https://www.cancerimagingarchive.net/collection/tcga-lusc/\n"

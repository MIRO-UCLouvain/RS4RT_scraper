  \ EL. Bakkali, Tarek EL. Bardouni, Bouchra El Mchichi, Omar Ait Sahel, Khalid Ennibi, Abderrahim Doudouh,\n\
  Proposal for an Iodine-131-based technique derived from a Monte Carlo study for inactivating SARS-CoV-2,\n\
  Radiation Physics and Chemistry,2025,112827,ISSN 0969-806X,https://doi.org/10.1016/j.radphyschem.2025.112827.\n\
  (https://www.sciencedirect.com/science/article/pii/S0969806X25003196)\n13. R. Yerrou, J. El Bakkali,\
  \ T. El Bardouni, B. Ahannout, Y. Ben Lazrak, A. Akka, A. Nouayti, C. Benkabdi,\nEstimation of S-values\
  \ using the Digimouse phantom for radionuclides commonly under preclinical investigation for treatment\
  \ of early and terminal stages of hepatocellular cancer,\nRadiation Physics and Chemistry. https://doi.org/10.1016/j.radphyschem.2025.113039\n\
  14. Jaafar EL Bakkali, Tarek EL Bardouni, Tarek EL Ghalbzouri, Randa Yerrou, Yousra BenLazrak, Bakr\
  \ Ahannout, Abderrahim Doudouh. Effect of the parameters defining the tumor computational phantom on\
  \ the S-values of therapeutic beta-emitters in internal radiotherapy of hepatocellular carcinoma, Radiation\
  \ Physics and Chemistry. https://doi.org/10.1016/j.radphyschem.2026.113940\n\n![alt text](https://github.com/EL-Bakkali-Jaafar/InterDosi/blob/master/InterD-si-3-19-2024.png)is\
  \ a user-friendly open source code aimed at facilitating the use of Geant4 C++ toolkit for internal\
  \ dosimetry on voxelized phantoms.\n\nThe word InterDosi stands for Internal Dosimetry, as its name\
  \ implies, this code is about a Monte Carlo simulation tool especially oriented for performing internal\
  \ dosimetry studies using computational voxelized or primitive phantoms. The code uses implicitly Geant4\
  \ Monte Carlo toolkit as a dose calculation engine known to be the most famous, well-recognized tool,\
  \ powerful and widely used around the world for various applications involving the simulation of ionizing\
  \ radiation transport and its interaction with the matter.\n\nWith knowing that the learning of Geant4\
  \ code is not straightforward as the coding with is by using C++ programming language and requires huge\
  \ time to learn a such code, this reflects negatively on the exorbitant effort required to build an\
  \ advanced application based on the Geant4 C++ toolkit. To deal with this issue, at that point in particular,\
  \ this open source code has saw the light in order to provide to scientific researchers who have a poor\
  \ knowledge in Geant4/C++ programming, a user-friendly platform allowing them to perform internal dosimetric\
  \ studies using voxelized and primitive phantoms in an easy manner and in a very short time too. The\
  \ code offers a set of useful graphical tools helping users to quasi-automatically perform all steps\
  \ required for building a complete internal dosimetry study. The philosophy of building the InterDosi\
  \ code was based on the idea of providing an easy-to-use Geant4-based code dealing without complication\
  \ with other geometry files written in various file formats, this through its well-developed converters\
  \ allow user to import a 3D model of any existing phantom having a common file format or a well-known\
  \ structure like as GDML, STL, OBJ and MCNP hexahedra lattice, and it converts them to a suitable voxel-based\
  \ phantom file format recognized by the code, this operation is done into few steps, almost automatically.\
  \ The involved dosimetric quantities as Absorbed Fraction (AF) and Specific Absorbed Fraction (SAF)\
  \ can be calculated in a voxel-based or primitive phantom for a given configuration made up of three\
  \ parameters, namely: source organ, primary particle type and primary particle energy, this through\
  \ the GUI tab SAFCals. The code gives users the opportunity to choose between the most particle types\
  \ emitted by radioactive substances used in nuclear medicine, including electron, positron, gamma, alpha,\
  \ neutron and proton. In addition, the code allows through the GUI tab SValueCals, an auto calculation\
  \ of S-values in all organs/regions as results of irradiation of a particular organ by a selected radio-isotope.\
  \ It can also be possible to calculate a partial S-Value that accounts only for a specific particle\
  \ or particle group. In order to speed up the simulation and reduce RAM usage, parametrized volume approach\
  \ was used and the G4PhantomParametrisation class was selected to build a parameterized volume representing\
  \ the voxelized phantom. Additionally, InterDosi provides a GUI tab called TPGSvalueCals; a module serving\
  \ to estimate S-value parameters in a spherical or ellipsoid tumor in which the user is free to set\
  \ the size and chemical composition. Furthermore, users can define an array of tumor configurations,\
  \ each configuration is defined by four parameters: tumor type (sphere, oblate spheroid and prolate\
  \ spheroid), sphere radius, tumor chemical composition and a radionuclide name. The code allows the\
  \ user through VoxGeomVis GUI tab the visualization of phantom geometry in two or three dimensions by\
  \ implicitly calling the Geant4 visualization system. Visualization of internal dose heatmap for a given\
  \ voxel-based phantom may be possible either in sagittal, coronal or transversal view, which give to\
  \ user a visual idea of how internal absorbed doses are two-dimensionally distributed in different phantom\
  \ organs for a particular slice from the phantom whole volume. The code also includes a tool that allows\
  \ users to plot SAF and S-value data by using a data visualization named column chart.\n\n\nArchitecturally,\
  \ InterDosi is a multithreaded tool that supports parallel calculations, which is known to be a good\
  \ approach to reduce statistical errors associated with scored physics quantities as well as reducing\
  \ whole time spent by a given simulation. InterDosi can be run in sequential mode that means that one\
  \ CPU is used, or in parallel mode where a multi-core architecture is exploited. In order to enhance\
  \ simulation performances, a number of methods have been developed which will be discussed later.\n\n\
  The present open-source software has been coded by Jaafar EL Bakkali, professor in nuclear physics and\
  \ associated member to Radiation and Nuclear System Laboratory, University Abdelmalek Essaadi, Faculty\
  \ of Sciences of Tetuan, Morocco and distributed under GPL(General Public License) license.\n\n\n\n\n\

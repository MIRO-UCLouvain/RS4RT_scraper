readme_excerpt: "# Neighbor Graph Maneuver for Human-Centered Visualization (HUCAN)\n\n## Pipeline\n\n\
  1. Generate a wide spectrum of visualisation results\n2. Query users for a rating of satisfaction from\
  \ 1 to 5\n3. Build human surrogate: feature engineering + Random Forest\n4. Pre-training policy using\
  \ human surrogate as reward function\n5. Fine-tuning policy using real user feedback\n\n## Experiments\n\
  \n1. exp1: a simulation dataset containing 20 isometric Gaussians, i.e., each cluster is a Gaussian\
  \ and there is a linear dependency between clusters\n2. exp2: a real biology dataset which contains\
  \ the same pattern, i.e., time-dependency between clusters\n\n## Human Surrogate Training\n\nFor different\
  \ experiments, human surrogates are trained in the following files:\n\n- exp1.ipynb\n- exp2.ipynb\n\n\
  codes and data path to be modified.\n\n## Pre-train\n\n```setup\n    python ppo.py\n```\n\n## Fine-tune\n\
  \n```setup\n    python inference.py\n```\n\n**Note:** Available parameters can be viewed using\n\n```setup\n\
  \    python ppo.py --help\n```\n"

readme_excerpt: "# AI-Driven-Drug-Discovery-Computational-Framework-for-Toxicity-Prediction\n\n• Validated\
  \ ChemicalDice, a descriptor fusion framework, across 6 ADME/bioactivity\n datasets using physicochemical,\
  \ graph-based, language, and image embeddings.\n \n • Designed a fold-aware ML pipeline with per-fold\
  \ imputation, SMOTE balancing, and 5\nfold cross-validation, achieving AUC 0.84 using ensemble models\
  \ (Extra Trees, Random\n Forest).\n \n • Enabled early-stage AI-driven drug screening by improving prediction\
  \ of absorption,\n metabolism, and toxicity, accelerating drug discovery and reducing failure rates\
  \ and\n experimental costs by up to 40%.\n"

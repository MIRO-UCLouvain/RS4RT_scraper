readme_excerpt: '# S-radiomics


  Code for Incremental Value of Synthetic MRI Radiomics in Predicting Neoadjuvant Response in HER2-Positive
  Breast Cancer.


  This repository includes conventional radiomics feature extraction, topology and Hessian-based feature
  extraction, and model training workflows.


  ## Install


  ```bash

  pip install -e .

  ```


  ## Commands


  ```bash

  s-radiomics radiomics --images /path/to/images --masks /path/to/masks --output /path/to/out --yaml Params_labels.yaml

  s-radiomics hessian --images /path/to/images --masks /path/to/masks --output features.csv

  s-radiomics topology --input /path/to/masks --output topo.csv

  s-radiomics fivefold --train-csv train.csv

  ```


  ## Notes


  - `topology_radiomics` must be available in your environment for topology feature extraction.

  - The bundled `Params_labels.yaml` is the radiomics configuration used by the original scripts.

  '

readme_excerpt: "# Cross-Population Generizability Analysis of Radiomics and Dosiomics for Predicting\
  \ Radiation Pneumonitis: A Domain-Shift Analysis in a South Asian Cohort\r\n\r\n\r\n<p align=\"center\"\
  >\r\n  <a href=\"https://www.linkedin.com/in/s-h-shuvo/\">\r\n    <img src=\"https://img.shields.io/badge/LinkedIn-Shahadat\
  \ Hossen Shuvo-blue?style=for-the-badge&logo=linkedin\" alt=\"LinkedIn\">\r\n  </a>\r\n  <a href=\"\
  mailto:27shuvo.edu@gmail.com\">\r\n    <img src=\"https://img.shields.io/badge/Email-Contact_Me-red?style=for-the-badge&logo=gmail\"\
  \ alt=\"Email\">\r\n  </a>\r\n</p>\r\n\r\n<p align=\"center\">\r\n  <img src=\"https://img.shields.io/badge/Python-3.10-blue.svg?style=flat-square\"\
  \ alt=\"Python 3.10\">\r\n  <img src=\"https://img.shields.io/badge/License-MIT-yellow.svg?style=flat-square\"\
  \ alt=\"License: MIT\">\r\n</p>\r\n\r\n---\r\n<p text-align='justify'>\r\n  \r\n\r\nThis repository\
  \ contains the complete codebase and documentation for my undergraduate thesis at Gono University. The\
  \ project focuses on developing a robust, explainable AI model to predict the risk of Radiation Pneumonitis\
  \ (RP) in lung cancer patients undergoing radiotherapy.\r\n\r\nThe core novelty of this research lies\
  \ in its rigorous two-stage generalizability analysis:\r\n1.  **Development:** An initial model is trained\
  \ on a large, public dataset from The Cancer Imaging Archive (TCIA).\r\n2.  **External Validation:**\
  \ The model is then tested on a unique, real-world cohort of patients from hospitals in Bangladesh to\
  \ assess its performance and robustness in a new clinical environment.\r\n\r\nThis work is driven by\
  \ a commitment to leveraging AI to solve tangible clinical problems and improve patient outcomes in\
  \ oncology.\r\n\r\n</p>\r\n\r\n---\r\n\r\n<p text-align='justify'>\r\n\r\n## \U0001F3AF Project Goal\r\
  \n\r\nThe primary objective is to build a non-invasive tool that uses standard pre-treatment data (CT\
  \ scans and radiotherapy plans) to generate a personalized risk score for developing clinically significant\
  \ (Grade ≥ 2) Radiation Pneumonitis. By identifying high-risk patients *before* treatment begins, this\
  \ tool could enable clinicians to create safer, more individualized treatment plans.\r\n</p>\r\n\r\n\
  --- \r\n\r\n\r\n## \U0001F52C Methodology & Workflow\r\n\r\nThe project follows a powerful pipeline\
  \ for medical AI research, integrating multiple data modalities for a comprehensive analysis.\r\n\r\n\
  **`Pre-Treatment CT (Radiomics)` + `RT Dose Plan (Dosiomics)` + `Clinical Data` ➔ `Feature Extraction`\
  \ ➔ `AI Model Training` ➔ `Pneumonitis Risk Score (XAI)`**\r\n\r\n1.  **Data Curation:** Two cohorts\
  \ are used: a public development cohort (`NSCLC-Radiomics` from TCIA) and a local validation cohort\
  \ (from Ahsania Cancer Hospital, Bangladesh).\r\n2.  **Feature Engineering:**\r\n    * **Radiomics:**\
  \ High-dimensional features quantifying the texture and morphology of lung tissue are extracted from\
  \ CT scans using `PyRadiomics`.\r\n    * **Dosiomics:** Features quantifying the 3D radiation dose distribution\
  \ are extracted from DICOM-RT DOSE files.\r\n3.  **Predictive Modeling:** Both classical machine learning\
  \ (e.g., Random Forest) and deep learning (MLP in PyTorch) models will be developed and compared.\r\n\
  4.  **Explainable AI (XAI):** The final model's predictions will be interpreted using SHAP (SHapley\
  \ Additive exPlanations) to identify the specific imaging and dosimetric biomarkers that are most predictive\
  \ of pneumonitis risk.\r\n\r\n---\r\n\r\n\r\n## \U0001F4A1 Key Novelty Points\r\n\r\n* **Generalizability\
  \ Analysis:** Directly addresses a major challenge in medical AI by testing a model on a new, geographically\
  \ and ethnically distinct population.\r\n* **Multi-Modal Integration:** Combines radiomics, dosiomics,\
  \ and clinical data for a holistic patient assessment.\r\n* **Explainability:** Moves beyond a \"black\
  \ box\" prediction to provide transparent, interpretable results that can offer new clinical insights.\r\
  \n\r\n---\r\n\r\n\r\n## \U0001F468‍\U0001F52C Researcher\r\n\r\n* **Md Shahadat Hossen Shuvo**\r\n \

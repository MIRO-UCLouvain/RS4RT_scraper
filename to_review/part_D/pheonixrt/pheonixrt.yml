readme_excerpt: "# pheonixrt\n\nTHIS REPO IS ARCHIVED;  its content has been merged with the more historically\
  \ complete [dH](https://github.com/dg1an3/dH) repo.\n\n**Brimstone**: A variational inverse planning\
  \ algorithm for [radiotherapy treatment planning](https://en.wikipedia.org/wiki/Radiation_treatment_planning).\n\
  \npheonixrt is a research and development platform for radiation therapy optimization, implementing\
  \ the Brimstone algorithm - a mathematically principled approach to inverse treatment planning based\
  \ on information theory and variational methods.\n\n## Overview\n\nThe Brimstone algorithm optimizes\
  \ radiation beam intensities (beamlet weights) to deliver prescribed doses to tumor targets while minimizing\
  \ exposure to healthy tissue. It employs:\n\n- **Multi-scale pyramid optimization** for robust convergence\n\
  - **KL-divergence minimization** for dose-volume histogram (DVH) matching\n- **Adaptive covariance optimization**\
  \ with conjugate gradient methods\n- **Implicit free energy representation** related to variational\
  \ Bayes methods\n\n## Key Features\n\n- ✅ **Mathematically principled**: Information-theoretic cost\
  \ functions (KL-divergence)\n- ✅ **Robust optimization**: Multi-scale approach avoids local minima\n\
  - ✅ **Flexible prescriptions**: Arbitrary target DVH shapes supported\n- ✅ **Python wrapper**: Modern\
  \ interface via `pybrimstone` package\n- ✅ **C++ core**: High-performance ITK-based implementation\n\
  \n## Project Structure\n\n```\npheonixrt/\n├── Brimstone/          # C++ core implementation (MFC application)\n\
  ├── RtModel/            # Core radiotherapy models and algorithms\n├── VecMat/             # Vector\
  \ and matrix utilities\n├── Graph/              # Visualization components\n├── python/            \
  \ # Python bindings (pybrimstone)\n│   ├── pybrimstone/    # Python package\n│   └── examples/     \
  \  # Usage examples\n├── notebook_zoo/       # Jupyter notebooks for research\n├── docs/           \
  \    # Additional documentation\n├── CLAUDE.md           # Detailed algorithm documentation\n└── CYTHON_WRAPPER_DESIGN.md\
  \  # Python wrapper design\n```\n\n## Getting Started\n\n### Python Interface (Recommended)\n\nThe easiest\
  \ way to use pheonixrt is through the Python wrapper:\n\n```bash\ncd python\npip install -e .\n```\n\
  \nSee [python/README.md](python/README.md) for detailed installation and usage instructions.\n\n**Quick\
  \ example:**\n```python\nimport pybrimstone as pb\n\n# Create treatment plan\nplan = pb.Plan()\nplan.add_beam(pb.Beam(gantry_angle=0.0))\n\
  plan.add_beam(pb.Beam(gantry_angle=180.0))\n\n# Optimize\noptimizer = pb.PlanOptimizer(plan)\nresult\
  \ = optimizer.optimize()\n```\n\n### C++ Implementation\n\nThe C++ implementation requires:\n- Visual\
  \ Studio 2010 or later (Windows)\n- ITK (Insight Toolkit) library\n- MFC (Microsoft Foundation Classes)\n\
  \nBuild using `Brimstone_src.sln` in Visual Studio.\n\n## Documentation\n\n- **[CLAUDE.md](CLAUDE.md)**\
  \ - Comprehensive algorithm documentation with technical details\n- **[python/README.md](python/README.md)**\
  \ - Python wrapper documentation and examples\n- **[CYTHON_WRAPPER_DESIGN.md](CYTHON_WRAPPER_DESIGN.md)**\
  \ - Python binding architecture\n- **[docs/](docs/)** - Additional technical documents and research\
  \ notes\n\n### Research Notebooks\n\nThe `notebook_zoo/` directory contains Jupyter notebooks exploring:\n\
  - Entropy maximization methods\n- Free energy formulations\n- Variational Bayes connections\n\n## Algorithm\
  \ Details\n\nBrimstone uses a multi-level optimization approach:\n\n1. **Hierarchical pyramid**: Optimization\
  \ proceeds from coarse to fine resolution\n2. **Cost function**: KL-divergence between target and calculated\
  \ DVHs\n3. **Optimizer**: Polak-Ribiere conjugate gradient with Brent line search\n4. **Adaptive variance**:\
  \ Dynamic covariance adjustment during search\n\nFor complete technical details, see [CLAUDE.md](CLAUDE.md).\n\
  \n## License\n\n**[-MIND THE LICENSE-](LICENSE)**\n\nU.S. Patent 7,369,645\n\nCopyright (c) 2007-2021,\
  \ Derek G. Lane  \nAll rights reserved.\n\nThis software is proprietary. See [LICENSE](LICENSE) file\
  \ for terms.\n\n## Citation\n\nIf you use this software in academic research, please cite:\n\n```\n\
  Brimstone Inverse Planning Algorithm\nDerek G. Lane\nU.S. Patent 7,369,645\n```\n\n## Related Concepts\n\
  \n- **Variational Bayes**: Similar KL-divergence minimization framework\n- **Free Energy Minimization**:\
  \ Information-theoretic optimization\n- **Inverse Problems**: General mathematical framework for inverse\
  \ planning\n\n## Contributing\n\nThis is an active research and development project. For questions or\
  \ collaboration:\n- See existing issues and discussions\n- Review [CYTHON_WRAPPER_DESIGN.md](CYTHON_WRAPPER_DESIGN.md)\
  \ for development roadmap\n\n## References\n\n- [Radiation Treatment Planning (Wikipedia)](https://en.wikipedia.org/wiki/Radiation_treatment_planning)\n\
  - [Variational Bayes Methods](https://en.wikipedia.org/wiki/Variational_Bayesian_methods)\n- [ITK -\
  \ Insight Toolkit](https://itk.org/)\n"

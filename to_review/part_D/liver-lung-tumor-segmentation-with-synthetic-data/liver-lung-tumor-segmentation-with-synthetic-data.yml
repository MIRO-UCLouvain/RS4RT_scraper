readme_excerpt: "# Liver & Lung Tumor Segmentation with Synthetic Data\nProject *\"Liver & Lung Tumor\
  \ Segmentation with Synthetic Data\"* for the **2024/2025 Neural Networks course**.\n\nThis repository\
  \ reimplements and extends the method proposed by [Hu et al., *Label-Free Liver Tumor Segmentation*,\
  \ CVPR 2023](https://openaccess.thecvf.com/content/CVPR2023/papers/Hu_Label-Free_Liver_Tumor_Segmentation_CVPR_2023_paper.pdf).\
  \  \nManual annotation of tumors is costly and limited by the scarcity of available data. To address\
  \ this issue, we investigated the use of automatically generated synthetic tumors as an alternative\
  \ to manual annotations for training segmentation models (e.g., U-Net). After validating the approach\
  \ on liver CT scans, we extended the pipeline to lung CT data, assessing whether automatic generation\
  \ can yield comparable or even improved performance.\n\n\n## Overview\n\n- Synthetic liver tumor generation\n\
  \n<img src=\"assets/liver_tumor.png\" width=\"70%\">\n\n- Synthetic lung nodule generation\n\n<img src=\"\
  assets/lung_nodule.png\" width=\"70%\">\n\n---\n\n## Datasets & weights\n\nWe used two different datasets\
  \ in our experiments:\n\n- **Liver tumor generation**  \n  For the liver experiments we strictly followed\
  \ the instructions provided in the official repository of the paper: [Hu et al. – Label-Free Liver Tumor\
  \ Segmentation (official repo)](https://github.com/MrGiovanni/SyntheticTumors/blob/main/INSTALL.md)\n\
  \n- **Lung nodule generation**  \n  For the lung experiments we used the [LNDb dataset](https://doi.org/10.48550/arXiv.1911.08434),\
  \ which contains **294 annotated CT scans** collected at the Centro Hospitalar e Universitário de São\
  \ João (Porto, Portugal) between 2016 and 2018.  \n\nYou can download processed versions of the datasets,\
  \ the JSON files and the models weights here: [Download](https://drive.google.com/drive/folders/1POFiiJLGIbaSIW0irq1wYjAQ-cH3PNQG?usp=drive_link)\n\
  \n\n---\n## Results\n\n### Liver Experiments\n\n| Model             | DSC (Tumor) | DSC (Liver)  | Total\
  \ mean DSC  |\n|-------------------|--------------|-------------|-----------------|\n| U-Net (Synthetic)\
  \ |     31.06%   |  84.13%     | 57.60%          |\n\n### Lung Experiments\n\n| Model             |\
  \ DSC (Nodule) | DSC (Lungs)  | Total mean DSC  |\n|-------------------|--------------|--------------|-----------------|\n\
  | U-Net (Synthetic) |     22.41%   |  96.62%      | 59.51%          |\n\n\n## Conclusions\n- Synthetic\
  \ tumors are competitive with real annotations, showing potential for label-free segmentation.\n- Transferring\
  \ the method from liver to lung is feasible, though more challenging due to anatomy and intensity differences.\n\
  \n- Future work: improve realism of synthetic lesions using generative models.\n\n## References\n* \
  \  Chen, Q., Chen, X., Song, H., Xiong, Z., Yuille, A. L., Chen, W., & Zhou, Z. (2024). Towards generalizable\
  \ tumor synthesis. arXiv preprint \tarXiv:2402.19470. https://doi.org/10.48550/arXiv.2402.19470\n\n\
  *   Pedrosa, J., Novais, P., Rodrigues, P. P., Bernardino, A., & Campilho, A. (2019). LNDb: a lung nodule\
  \ database on computed tomography. arXiv preprint arXiv:1911.08434. https://doi.org/10.48550/arXiv.1911.08434\n\
  \n*   Loverdos, K., Fotiadis, A., Kontogianni, C., Iliopoulou, M., & Gaga, M. (2019). Lung nodules:\
  \ A comprehensive review on current approach and management. Annals of Thoracic Medicine, 14(4), 226–238.\
  \ https://doi.org/10.4103/atm.ATM_110_19\n\n* MONAI Project. (2023). 3D segmentation: UNETR on BTCV\
  \ dataset [Jupyter Notebook]. GitHub. https://github.com/Project-MONAI/tutorials/blob/main/3d_segmentation/unetr_btcv_segmentation_3d.ipynb\n\
  \n\n---\n\n## Requirements\n\nTo reproduce the experiments, the following minimum hardware requirements\
  \ are recommended:\n\n* Liver experiments: at least 16 GB RAM\n* Lung experiments: at least 32 GB RAM\n\
  \n## Repository Structure\n\n```plaintext\n\n├── FINAL_NOTEBOOK.ipynb         # Main Jupyter Notebook\
  \ with full pipeline\n├── assets                       # Images used for README.md\n  ├── liver_tumor.png\
  \            # Image of a synthetic liver tumor\n  └── lung_nodule.png            # Image of a synthetic\
  \ lung nodule\n├── LungNodule_Generation.ipynb  # Lung nodule notebook for reproducibility\n├── LiverTumor_Generation.ipynb\
  \  # Liver tumor notebook for reproducibility\n├── presentation.pdf             # Project slides \n\
  └── README.md                    # Project documentation\n```\n---\n## Authors\n- [A. Infantino 1922069](https://github.com/alessiainf)\n\
  - [A. Di Chiara 1938462](https://github.com/AlessandroDiChiara)\n- [F. Fragale 2169937](https://github.com/Bannfrost99)\n\
  \n\n## Acknowledgments\n- We thank Hu et al. for their work on label-free liver tumor segmentation.\n\
  - We acknowledge the authors of the LNDb dataset and other public medical datasets.\n- Frameworks used:\
  \ PyTorch, MONAI.\n\n\n"

readme_excerpt: "# Radiomics Feature Extraction Pipeline\n\nThis repository provides a Python-based pipeline\
  \ for **radiomics feature extraction and selection** from multi-modal medical images (e.g., MRI). The\
  \ pipeline supports preprocessing, feature extraction, and unsupervised feature selection, designed\
  \ for use in research and machine learning applications.\n\n---\n\n## Features\n\n1. **Preprocessing**\n\
  \   - Resampling images and masks to uniform voxel spacing.\n   - Intensity normalization (Z-score).\n\
  \   - Handles multiple modalities (T1, T1ce, T2, FLAIR).\n\n2. **Feature Extraction**\n   - Intensity\
  \ features: mean, standard deviation, min, max, median, skewness, kurtosis, percentiles.\n   - Shape\
  \ features: volume (mask surface area calculation optional).\n   - Simple texture features (GLCM-like)\
  \ using NumPy: contrast, energy, homogeneity, correlation.\n\n3. **Feature Selection**\n   - Missing\
  \ value imputation using median.\n   - Low-variance filtering.\n   - High-correlation feature removal.\n\
  \   - Optional bootstrap-based stability selection.\n\n4. **Logging**\n   - Centralized logging to console\
  \ and optional file.\n   - Tracks preprocessing and feature extraction progress.\n\n---\n\n## Installation\n\
  \n1. Clone the repository:\n\n```bash\ngit clone https://github.com/Zhao-Jianan/Radiomics-pipeline.git\n\
  cd Radiomics-pipeline\n```\n\n2. Create and activate a Python environment:\n```bash\nconda create -n\
  \ radiomics python=3.11 -y\nconda activate radiomics\n```\n\n3. Install required packages:\n```bash\n\
  pip install -r requirements.txt\n```\n\n**Dependencies include**: `numpy`, `pandas`, `SimpleITK`, `scipy`.\n\
  \n\n## Usage\nThe main pipeline is defined in `main.py`. The workflow includes preprocessing, feature\
  \ extraction, and feature selection.\n\n```bash\npython main.py\n```\n\n## Configurable Parameters\n\
  - **dataset_flag**: \"Brats2020\" or \"Brats2023\".\n- **input_dir**: Path to raw MRI dataset.\n- **output_dir**:\
  \ Directory to save preprocessed images and feature CSVs.\n- **modalities**: List of image modalities.\n\
  - **modality_separator**: Separator used in file names.\n- **image_suffix**: File extension (e.g., .nii,\
  \ .nii.gz).\n\n\n## Outputs\n### Preprocessed images\n- Saved under `output_dir/<case_id>/`.\n- Format:\
  \ `{modality}_preprocessed.nii.gz`.\n\n### Radiomics feature table\n- `radiomics.csv`: Contains all\
  \ extracted features for each case.\n- Columns: `case_id`, `t1_mean`, `t1_std`, ..., `flair_correlation`.\n\
  \n### Selected features\n- `selected_features.csv`: Subset of stable and non-redundant features after\
  \ feature selection.\n"

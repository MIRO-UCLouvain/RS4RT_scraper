<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title description">
  <title id="title">Radiomics feature correlation heatmap</title>
  <desc id="description">Example Pearson correlation matrix for five radiomics features, with values from minus one to one.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2166ac"/>
      <stop offset="0.5" stop-color="#f7f7f7"/>
      <stop offset="1" stop-color="#b2182b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .label { font: 500 15px Inter, Segoe UI, sans-serif; fill: #334155; }
      .value { font: 600 16px Inter, Segoe UI, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .light { fill: #fff; }
      .dark { fill: #172033; }
      .tick { font: 12px Inter, Segoe UI, sans-serif; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>

  <rect width="960" height="640" rx="24" fill="url(#background)"/>
  <text x="56" y="58" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Radiomics Feature Correlation</text>
  <text x="56" y="86" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#64748b">Pearson correlation matrix · illustrative feature values</text>

  <g filter="url(#shadow)">
    <rect x="40" y="112" width="880" height="474" rx="18" fill="#fff"/>
  </g>

  <!-- Column labels occupy a dedicated header band above the matrix. -->
  <g class="label" text-anchor="middle">
    <text x="334" y="166">Mean</text>
    <text x="414" y="166">Energy</text>
    <text x="494" y="166">Entropy</text>
    <text x="574" y="151"><tspan x="574">GLCM</tspan><tspan x="574" dy="18">Contrast</tspan></text>
    <text x="654" y="151"><tspan x="654">GLRLM</tspan><tspan x="654" dy="18">SRE</tspan></text>
  </g>

  <!-- Row labels -->
  <g class="label" text-anchor="end" dominant-baseline="middle">
    <text x="280" y="230">Mean</text>
    <text x="280" y="310">Energy</text>
    <text x="280" y="390">Entropy</text>
    <text x="280" y="470">GLCM Contrast</text>
    <text x="280" y="550">GLRLM SRE</text>
  </g>

  <!-- Matrix: blue = negative, red = positive -->
  <g stroke="#fff" stroke-width="3">
    <rect x="294" y="194" width="80" height="80" rx="7" fill="#b2182b"/>
    <rect x="374" y="194" width="80" height="80" rx="7" fill="#ca4846"/>
    <rect x="454" y="194" width="80" height="80" rx="7" fill="#dbe8f1"/>
    <rect x="534" y="194" width="80" height="80" rx="7" fill="#5d95c2"/>
    <rect x="614" y="194" width="80" height="80" rx="7" fill="#f2d5d1"/>

    <rect x="294" y="274" width="80" height="80" rx="7" fill="#ca4846"/>
    <rect x="374" y="274" width="80" height="80" rx="7" fill="#b2182b"/>
    <rect x="454" y="274" width="80" height="80" rx="7" fill="#90b7d5"/>
    <rect x="534" y="274" width="80" height="80" rx="7" fill="#d2e3ee"/>
    <rect x="614" y="274" width="80" height="80" rx="7" fill="#e8a29a"/>

    <rect x="294" y="354" width="80" height="80" rx="7" fill="#dbe8f1"/>
    <rect x="374" y="354" width="80" height="80" rx="7" fill="#90b7d5"/>
    <rect x="454" y="354" width="80" height="80" rx="7" fill="#b2182b"/>
    <rect x="534" y="354" width="80" height="80" rx="7" fill="#df746d"/>
    <rect x="614" y="354" width="80" height="80" rx="7" fill="#a8c8de"/>

    <rect x="294" y="434" width="80" height="80" rx="7" fill="#5d95c2"/>
    <rect x="374" y="434" width="80" height="80" rx="7" fill="#d2e3ee"/>
    <rect x="454" y="434" width="80" height="80" rx="7" fill="#df746d"/>
    <rect x="534" y="434" width="80" height="80" rx="7" fill="#b2182b"/>
    <rect x="614" y="434" width="80" height="80" rx="7" fill="#377eb8"/>

    <rect x="294" y="514" width="80" height="80" rx="7" fill="#f2d5d1"/>
    <rect x="374" y="514" width="80" height="80" rx="7" fill="#e8a29a"/>
    <rect x="454" y="514" width="80" height="80" rx="7" fill="#a8c8de"/>
    <rect x="534" y="514" width="80" height="80" rx="7" fill="#377eb8"/>
    <rect x="614" y="514" width="80" height="80" rx="7" fill="#b2182b"/>
  </g>

  <!-- Cell values -->
  <g class="value">
    <text class="light" x="334" y="234">1.00</text><text class="light" x="414" y="234">0.82</text><text class="dark" x="494" y="234">−0.18</text><text class="light" x="574" y="234">−0.64</text><text class="dark" x="654" y="234">0.21</text>
    <text class="light" x="334" y="314">0.82</text><text class="light" x="414" y="314">1.00</text><text class="dark" x="494" y="314">−0.47</text><text class="dark" x="574" y="314">−0.22</text><text class="dark" x="654" y="314">0.48</text>
    <text class="dark" x="334" y="394">−0.18</text><text class="dark" x="414" y="394">−0.47</text><text class="light" x="494" y="394">1.00</text><text class="light" x="574" y="394">0.67</text><text class="dark" x="654" y="394">−0.39</text>
    <text class="light" x="334" y="474">−0.64</text><text class="dark" x="414" y="474">−0.22</text><text class="light" x="494" y="474">0.67</text><text class="light" x="574" y="474">1.00</text><text class="light" x="654" y="474">−0.79</text>
    <text class="dark" x="334" y="554">0.21</text><text class="dark" x="414" y="554">0.48</text><text class="dark" x="494" y="554">−0.39</text><text class="light" x="574" y="554">−0.79</text><text class="light" x="654" y="554">1.00</text>
  </g>

  <!-- Color scale -->
  <text x="744" y="222" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#475569">CORRELATION</text>
  <rect x="748" y="244" width="24" height="280" rx="12" fill="url(#scale)" transform="rotate(90 760 384)" opacity="0"/>
  <linearGradient id="verticalScale" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#2166ac"/><stop offset="0.5" stop-color="#f7f7f7"/><stop offset="1" stop-color="#b2182b"/>
  </linearGradient>
  <rect x="758" y="244" width="26" height="280" rx="13" fill="url(#verticalScale)"/>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#64748b">
    <text x="796" y="251">+1.0</text><text x="796" y="389">0.0</text><text x="796" y="524">−1.0</text>
  </g>
</svg>

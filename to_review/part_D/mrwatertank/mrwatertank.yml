readme_excerpt: "# MRWaterTank\nDesigns for 3D printing parts and building a microcontroller to motorize\
  \ a 1D Med-Tec/CNMC water tank for use in an MR-Linac\n\n### Overview\n\nA major challenge in the commissioning\
  \ of MR-guided Linear Accelerators is that the magnetic field environment causes many standard pieces\
  \ of medical physics equipment to either be unsafe or non-functional.  Water tanks are a crucial tool\
  \ for commissioning linear accelerators, and using a motorized water tank can result in significant\
  \ time savings when acquiring dosimetry data such as percent depth dose (PDD) curves.  Although commercial\
  \ MR-conditional motorized water tanks are becoming available, they are expensive and not yet widely\
  \ available, so standard practice is to use a manual \"crank\" water tank to take point-by-point depth\
  \ dose curves, with the physicist needing to enter the accelerator vault between measurements to manually\
  \ adjust the position of the radiation detector (this is particularly challenging, as the physicist\
  \ needs to crawl into the magnet bore to access the water tank).\n\nThis project develops an MR-conditional\
  \ motorized attachment and controller for an existing 1D manual water tank in our department.  The project\
  \ uses an ultrasonic motor and low-cost \"DIY\" electronics components as well as a 3D-printed motor\
  \ mount/gear assembly.  Our department had an existing manual 1D water tank that was sitting unused,\
  \ so total cost of components was ~$1500 (most of which is the ultrasonic motor), which compares favorably\
  \ to the $100k+ for commercial options.  We estimate that we saved >22 hours or measurement time during\
  \ commissioning using this system.\n\n### Bill of Materials\n* Manual Water Tank (e.g. MedTec/CNMC WP-3040\
  \ or similar water tank that will be safe to use in an MR environment)\n* Shinsei USR30-E3N Ultrasonic\
  \ Motor w/ 500 PPR Encoder\n* Shinsei D6060E Motor Driver\n* WEMOS D1 Mini ESP8266 Microcontroller (or\
  \ other Arduino-compatible microcontroller)\n* Electronics Components\n  * Breadboard or PCB board\n\
  \  * DB-9 connector/breakout board\n  * Logic level shifter board (if using 3.3V microcontroller with\
  \ 5V LCD)\n  * LCD1602 with I2C module (for displaying status/location)\n  * Misc. buttons/switches\
  \ (for controlling motor)\n  * 24V PSU for D606E\n\n### Instructions\n1. **Acquire project components**\n\
  1. **Print the motor holder and gears**\n\n   This assembly consists of a motor holder as well as two\
  \ gears.  One gear slides on to the motor shaft and the second is designed to fit over the existing\
  \ crank handle on the water tank (so that the motor holder can quickly be removed and the tank can be\
  \ operated manually if needed).  The gears use a herringbone design to eliminate the need for additional\
  \ securing hardware.  The motor holder is designed to be secured to the water tank by loosening the\
  \ attachment screws that are part of the manual tank encoder, and sliding it underneath.  There is a\
  \ slot that is designed to fith the USR30-E3N (we additionally used a piece of silk tape to ensure the\
  \ motor stays secure).\n   \n   *NOTE: The design of the holder/handle gear may need to be modified\
  \ depending on the specific water tank.* \n   \n   These components were 3D printed on an Ultimaker\
  \ S5 using Tough PLA\n\n1. **Assemble motor driver circuit**\n\n\n"

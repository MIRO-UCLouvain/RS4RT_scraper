readme_excerpt: "# Radiotherapy Simulated Environment for Reinforcement Learning\n\nThis project provides\
  \ a simplified radiotherapy environment with 3D rendering which inherits the gymnasium class. It uses\
  \ a modified implementation of Proximal Policy Optimization (PPO) for continuous actions, from [CleanRL](https://github.com/vwxyzjn/cleanrl).\
  \ \n\n![Animation of Trained PPO model on radiotherapy environment](animations/20M.gif)\n\n\n## Installation\n\
  \n1. Clone the repository:\n    ```sh\n    git clone https://github.com/rmaguado/ppo-radiotherapy.git\n\
  \    cd ppo-radiotherapy\n    ```\n\n2. Set up the environment:\n    ```sh\n    conda env create -f\
  \ environment.yml\n    conda activate rl-radio\n    ```\n\n## Quickstart\n\n### Training\n\nTo train\
  \ the PPO model, first copy and rename the default config template file:\n\ndefault.yaml.template ->\
  \ default.yaml\n\nThen, run the train.py script:\n\n```sh\npython train.py --config-file=configs/default.yaml\
  \ --output-dir=runs/experiment1\n```\n\nA template script for running on a slurm cluster is provided\
  \ in the sjob.sh and sjob.template scripts. \n\n### Evaluation\n\nThe training script will generate\
  \ a tensorboard logfile with rewards and metrics, and save checkpoints of the model. \n\nYou can generate\
  \ visuals from these logs using the jupyer notebook found in notebooks/training-curve.ipynb\n\n![Rewards\
  \ obtained during training process.](notebooks/figures/reward_curves.png)\n\nTo create animations of\
  \ the trained model like the one seen above, use the ppo_visualize.py script. \n\n\n## Using a 3D CNN\n\
  \nBy default, the observation space is a summary of the 3d model by including coordinates and angle\
  \ of the beam, as well as the tumour's coordinates. To use voxel data from the 3D models, set the config\
  \ parameter `visionless` to false. This will also use the FeaturesExtractor3D class, which is a 3D CNN\
  \ adapted from C3D architecture. Keep in mind that I've had no success training this model due to not\
  \ having enough GPU memory to use large enough batches. \n\n\n## License\n\nYou may use the code from\
  \ this repository for any purpose but please consider crediting me and the awknowledged sources.\n\n\
  \n## Acknowledgments\n\n- The 3D CNN architecture is adapted from C3D: https://arxiv.org/pdf/1412.0767\n\
  - Proximal Policy Optimization (PPO) Paper: https://arxiv.org/pdf/1707.06347v2\n- The PPO implementation\
  \ is borrowed from CleanRL https://github.com/vwxyzjn/cleanrl\n\n"

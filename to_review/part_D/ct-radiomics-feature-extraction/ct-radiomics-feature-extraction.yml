readme_excerpt: "### \U0001F9EC CT Radiomics Feature Extraction\n\nExtract quantitative radiomics features\
  \ (first-order, texture, wavelet) from CT scans and export them into a clean CSV file — ready for machine-learning,\
  \ multimodal AI, or clinical modeling.\n\n<p align=\"center\">\n  <img src=\"cover.png\" width=\"85%\"\
  \ alt=\"CT Radiomics Cover Image\">\n</p>\n\n---\n\n### \U0001F9E0 Radiomics Pipeline Overview\n<p align=\"\
  center\"> <img src=\"Radiomics_Pipe.png\" width=\"80%\" alt=\"Radiomics Pipeline Overview\"> </p>\n\
  This project demonstrates an end-to-end radiomics workflow for medical imaging:\n\n---\n\n### \U0001F9E9\
  \ 1. Image Loading\n- Reads `.nii` CT volumes  \n- Uses **SimpleITK** for robust medical image I/O \
  \ \n- Handles **3D images** with native voxel spacing  \n\n---\n\n### \U0001F9E9 2. Automatic Mask Generation\n\
  If no segmentation mask is provided:\n- **Otsu Thresholding**  \n- **Largest Connected Component** \
  \ \n- Produces a clean **binary ROI mask**\n\n---\n\n### \U0001F9E9 3. Radiomics Feature Extraction\n\
  Powered by **PyRadiomics v3.0.1**:\n- First-order statistics  \n- GLCM, GLSZM, GLRLM, NGTDM, Shape \
  \ \n- LoG & Wavelet-filtered textures  \n- Generates **100+ high-dimensional biomarkers**\n\n---\n\n\
  ### \U0001F9E9 4. CSV Export\nAll features saved into:\n"

readme_excerpt: "# Learning Deformable Image Registration from Optimization: Perspective, Modules, Bilevel\
  \ Training and Beyond\n\nThis is the official Pytorch implementation of \"Learning Deformable Image\
  \ Registration from Optimization: Perspective, Modules, Bilevel Training and Beyond\" (IEEE TPAMI 2021).\n\
  \n<!-- ![Alt text](pipeline.png) -->\n\n\n## Prerequisites\n- `Python 3.6.8+`\n- `Pytorch 0.3.1`\n-\
  \ `torchvision 0.2.0`\n- `NumPy`\n- `NiBabel`\n\nThis code has been tested with `Pytorch` and GTX1080TI\
  \ GPU.\n\n\n## Inference\n```\npython MultiModal/test.py \n```\nA pretrained MultiPropReg model is available\
  \ in \"models/MPR-T1-to-T2atlas.zip\".\n\n## Training\nIf you want to train a new MultiPropReg model\
  \ using your own dataset, please define your own data generator for `train_t1atlas.py` and perform the\
  \ following script.\n```\npython MultiModal/train_t1atlas.py\n```\n\n## Publication\nIf you find this\
  \ repository useful, please cite:\n\n- **Learning Deformable Image Registration from Optimization: Perspective,\
  \ Modules, Bilevel Training and Beyond**  \nR. Liu, [Z. Li](https://alison-brie.github.io/), X. Fan,\
  \ C. Zhao, H. Huang and Z. Luo. IEEE TPAMI [eprint arXiv:2004.14557](https://arxiv.org/abs/2004.14557)\n\
  \n## Acknowledgment\nSome codes in this repository are modified from [VoxelMorph](https://github.com/voxelmorph/voxelmorph).\n\
  \n## Keywords\nDiffeomorphic image registration, hyperparameter learning, iterative refinement for registration,\
  \ convolutional neural networks, alignment\n"

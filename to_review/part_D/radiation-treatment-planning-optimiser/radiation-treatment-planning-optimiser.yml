readme_excerpt: "#  Radiation Treatment Planning (RTP) Optimizer\n\nA unified optimization framework for\
  \ Radiation Therapy Planning (RTP) combining  \n**Convex Optimization (SOCP), NSGA-II, and Inverse Optimization**\
  \ with  \n**Frobenius + Group Sparsity Regularization** for scalability, stability, and clinical robustness.\n\
  \n> Built on the [PortPy](https://github.com/PortPy-Project/PortPy) benchmark framework and validated\
  \ against TG-101 clinical protocols.\n\n---\n\n##  Why This Project Matters\n\nRadiation therapy must\
  \ strike a precise balance:\n\n-  **Deliver high dose** to the tumor (PTV — Planning Target Volume)\n\
  -  **Protect Organs At Risk** (OARs: lungs, heart, spinal cord)\n\nThis creates a large-scale, high-dimensional\
  \ optimization problem with **competing clinical objectives**.\n\n> **Example:** Maximizing lung tumor\
  \ dose risks heart damage. Over-protecting the heart risks tumor survival. This framework automates\
  \ finding that clinical \"sweet spot.\"\n\n**Additional challenges this project addresses:**\n\n-  **Clinical\
  \ Efficiency** — Manual beam weight tuning takes hours. Our Inverse Optimization module learns from\
  \ past successful plans to automate this.\n-  **Plan Stability** — Patients move slightly during treatment\
  \ (e.g., breathing). Frobenius Regularization ensures small positional changes don't cause catastrophic\
  \ dose delivery failures.\n\n---\n\n##  Core Pipeline\n\n```\nPatient CT + Structures (PortPy)\n   \
  \       │\n          ▼\n  ┌─────────────────────────────────┐\n  │       Preprocessing Layer       │\n\
  \  │  • Define PTV / OAR voxel sets  │\n  │  • Reshape w → W (B × K)        │\n  │  • Build Dose Influence\
  \ Matrix  │\n  └────────────┬────────────────────┘\n               │\n       ┌───────┼───────────────┐\n\
  \       ▼       ▼               ▼\n  ┌─────────┐ ┌──────────┐ ┌──────────────┐\n  │ Convex  │ │ NSGA-II\
  \  │ │   Inverse    │\n  │  SOCP   │ │  (EMO)   │ │Optimization  │\n  └────┬────┘ └────┬─────┘ └──────┬───────┘\n\
  \       │           │              │\n  Optimal w*  Pareto Set {w}  Learned w*\n  (Single     (Trade-off\
  \      (Clinically\n   Best Plan)  Plans)          Aligned Plan)\n       │           │             \
  \ │\n       └───────────┼──────────────┘\n                   ▼\n     ┌─────────────────────────────────┐\n\
  \     │    Post-processing & Evaluation  │\n     │  Dose = D·w  │  DVH Curves      │\n     │  HI, D95\
  \     │  OAR metrics     │\n     │  Nuclear Norm / Sparsity        │\n     └───────────────┬─────────────────┘\n\
  \                     ▼\n         ┌───────────────────────┐\n         │   Visualization Layer  │\n \
  \        │  • Dose maps           │\n         │  • Beamlet intensity   │\n         │  • Pareto fronts\
  \       │\n         │  • Plan comparisons    │\n         └───────────────────────┘\n```\n\n---\n\n##\
  \  Methods Implemented\n\n### \U0001F539 Convex Optimization — *The Gold Standard Baseline*\n\n- **Formulation:**\
  \ Second-Order Cone Program (SOCP) via CVXPY\n- **Objective:** Minimizes $F_{PTV} + F_{OAR} + \\lambda_1\
  \ \\|\\mathbf{W}\\|_{2,1} + \\lambda_2 \\|\\mathbf{W}\\|_F$\n- **Mechanism:** Uses slack variables for\
  \ soft constraint violations\n- **Output:** Single globally optimal beamlet weight vector $w^*$\n\n\
  \ Reliable &nbsp;&nbsp;  Efficient &nbsp;&nbsp;  Strong baseline\n\n---\n\n### \U0001F539 NSGA-II —\
  \ *Multi-Objective Pareto Exploration*\n\n- **Formulation:** Evolutionary Multi-Objective Optimization\
  \ (EMO)\n- **Steps:** Population initialization → Dose evaluation → Non-dominated sorting → Crossover\
  \ & Mutation\n- **Output:** Pareto Set $\\{w\\}$ representing the full tumor coverage vs. organ protection\
  \ trade-off\n\n```\nMore Tumor Coverage  ◄────── trade-off ──────►  More Organ Protection\n```\n\n Captures\
  \ real clinical trade-offs &nbsp;&nbsp;  No objective scalarization needed\n\nThe algorithm identifies\
  \ the **\"elbow point\"** — where further tumor coverage leads to exponential increases in organ toxicity\
  \ — enabling evidence-based clinical decision-making.\n\n---\n\n### \U0001F539 Inverse Optimization\
  \ — *Learning Institutional Style*\n\n- **Formulation:** Bi-level optimization\n- **Mechanism:** Given\
  \ a reference plan $x^*$, computes subgradients via KKT conditions, then solves a QCQP to recover objective\
  \ weights\n- **Output:** Learned weights $w^*$ that reproduce clinically aligned plans\n\n```\nReference\
  \ Plan (x*) → KKT Subgradients → QCQP → Learned Weights → New Plans\n```\n\n Personalized to institutional\
  \ planning style &nbsp;&nbsp;  Reduces manual tuning &nbsp;&nbsp;  Bridges ML + optimization\n\n---\n\
  \n##  Regularization Strategy\n\n### Why Not Nuclear Norm?\n\n| Approach | Memory | Compute | Beam Structure\
  \ |\n|---|---|---|---|\n|  Spectral / Nuclear Norm | High | Expensive SVD | Unstructured |\n|  **Frobenius\
  \ + Group Sparsity** | Low | Efficient | Structured |\n\n### Our Approach: Frobenius + Group Sparsity\
  \ ($\\ell_{2,1}$)\n\n- **Frobenius norm** $\\|\\mathbf{W}\\|_F$ — controls overall magnitude, encourages\
  \ smooth beam intensity maps\n- **Group Sparsity** $\\|\\mathbf{W}\\|_{2,1}$ — enforces structured sparsity:\
  \ if a beam is \"on,\" neighboring beamlets are coherently activated\n\n**Clinical benefit:** Fewer\
  \ \"checkerboard\" patterns in beam intensity maps → reduced mechanical wear on the Linac's Multi-Leaf\
  \ Collimators (MLC) → more deliverable plans.\n\n**Efficiency gain:** ~60% reduction in computation\
  \ time vs. nuclear norm regularization.\n\n---\n\n##  Key Results\n\nBased on simulations using the\
  \ PortPy benchmark dataset:\n\n| Metric | Result |\n|---|---|\n| PTV Coverage (D95) |  95% of tumor\
  \ volume reaches prescription dose |\n| OAR Constraints |  Mean dose to Lungs & Heart below TG-101 thresholds\
  \ |\n| Computation Time |  ~60% faster than nuclear norm baseline |\n| MLC Deliverability |  Reduced\
  \ checkerboard artifacts in beam maps |\n| Pareto Front |  Elbow point identified for clinical trade-off\
  \ decisions |\n\n## Cost Effectiveness\n\n1. Convex Optimization (The \"Budget\" Speedster)\n    Cost\
  \ (Time/Compute): Lowest. It solves in seconds or minutes using highly optimized math (like Interior\
  \ Point methods).\n    Effectiveness: High, but only if you already know the correct weights ($w_1,\
  \ w_2$).\n    Verdict: This is the most cost-effective for execution. If you have a standard protocol\
  \ and just need a plan now, this is your best bet.\n  \n3. NSGA-II (The \"Premium\" Explorer)\n   Cost\
  \ (Time/Compute): Highest. It has to run the optimization loop hundreds or thousands of times (for every\
  \ individual in every generation). It requires significant CPU/GPU power and time.\n   Effectiveness:\
  \ Maximum Information. It doesn't give you one plan; it gives you the entire Pareto Front.\n   Verdict:\
  \ This is not cost-effective for daily routine, but it is highly effective for research or \"difficult\
  \ cases\" where doctors don't know what the best trade-off is yet.\n\n5. Inverse Optimization (The \"\
  Long-term\" Investment)\n   Cost (Time/Compute): Medium. There is a high \"upfront cost\" to train the\
  \ model on historical plans, but once the weights are learned, it's very fast.\n   Effectiveness: Very\
  \ High. It eliminates the \"human cost\" of a physicist sitting at a computer for 3 hours manually tuning\
  \ weights.\n   Verdict: This is the most cost-effective for a Hospital System. It standardizes quality\
  \ and saves the most expensive resource: the clinician's time.\n\n---\n\n##  Related Work & Literature\n\
  \n| Reference | Contribution |\n|---|---|\n| Bortfeld et al. | Classical Inverse Planning — single-objective\
  \ formulation |\n| Babier et al. | $L_1$ regularization shown to produce noisy beam maps → motivation\
  \ for Group Sparsity |\n| PortPy Framework | Industry-standard benchmarking dataset and dose computation\
  \ library |\n\n---\n\n##  Project Structure\n\n```\nRadiation_Treatment_Planning_Optimiser/\n│\n├──\
  \ Convex_Optimisation/\n│   ├── Convex_Optimisation.ipynb   # LP/SOCP model & DVH analysis\n│   ├──\
  \ graphs/                     # Output dose distribution plots\n│   ├── README.md\n│   └── requirements.txt\n\
  │\n├── NSGA-II/\n│   ├── NSGA-II.ipynb               # Evolutionary algorithm & Pareto front\n│   └──\
  \ Graphs/                     # Pareto front visualizations\n│\n├── Inverse_Optimisation/\n│   ├── Inverse_Optimisation.ipynb\
  \  # Weight-learning via bi-level optimization\n│   └── Graphs/\n│\n└── .gitignore                 \
  \     # Excludes large HDF5 dose matrices\n```\n\n---\n\n##  Setup & Usage\n\n### 1. Clone & Install\n\
  \n```bash\ngit clone https://github.com/chaturyaganne/Radiation_Treatment_Planning_Optimiser.git\ncd\
  \ Radiation_Treatment_Planning_Optimiser\npip install -r Convex_Optimisation/requirements.txt\n```\n\
  \n### 2. Download Dataset\n\nObtain the PortPy benchmark dataset (includes dose-influence matrices,\
  \ organ masks in HDF5, and clinical beam configurations):\n\n\U0001F517 [PortPy Dataset on HuggingFace](https://huggingface.co/datasets/PortPy-Project/PortPy_Dataset)\n\
  \n### 3. Run Notebooks\n\n```bash\njupyter notebook Convex_Optimisation/Convex_Optimisation.ipynb\n\
  jupyter notebook NSGA-II/NSGA-II.ipynb\njupyter notebook Inverse_Optimisation/Inverse_Optimisation.ipynb\n\
  ```\n\n---\n\n##  Outputs\n\nAll results are saved to the respective `graphs/` or `Graphs/` directories:\n\
  \n- Dose-Volume Histogram (DVH) curves\n- Pareto front visualizations\n- Beam intensity maps\n- Plan\
  \ comparison plots\n\n---\n\n##  Key Takeaways\n\n| Method | Best For |\n|---|---|\n| **Convex SOCP**\
  \ | Single optimal plan; reliable baseline |\n| **NSGA-II** | Exploring the full trade-off space; clinical\
  \ decision support |\n| **Inverse Optimization** | Replicating institutional planning style; reducing\
  \ manual effort |\n| **Frobenius + Group Sparsity** | Scalable, structured, deliverable beam plans |\n\
  \n---\n\n##  Contributors\n\n- **Chaturya Ganne**\n- **Dhathri Meda**\n- **Mohan Vamsi Varadaraju Priya**\n"

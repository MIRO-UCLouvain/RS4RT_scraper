readme_excerpt: "# DicomRTGuidelineClassifierPublic\nDeep learning based radiotherapy delineation guideline\
  \ classifier \n\nThis repository contains code and documentation used in the publication \"Deep learning-based\
  \ classification of organs at risk and delineation guideline in pelvic cancer radiation therapy\" by\
  \ Jamtheim Gustafsson et al. 2023, Journal of Applied Clinical Medical Physics, https://aapm.onlinelibrary.wiley.com/doi/10.1002/acm2.14022#.\
  \ Please connect the numbers in the list below to the number in each file present in the repository\
  \ folder. It represents the natural flow of code execution, from data preparation to model inference.\
  \ \n\n(1.) Generation of Nifti files from DICOM raw data\\\n(2.) Creation of dataset and training database\\\
  \n(3.) Model training\\\n(4.) Model inference\n\nContact: christian.JamtheimGustafsson@skane.se\n"

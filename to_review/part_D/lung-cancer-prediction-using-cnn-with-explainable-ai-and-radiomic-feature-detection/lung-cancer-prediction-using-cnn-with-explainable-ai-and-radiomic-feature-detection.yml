readme_excerpt: "# Lung-Cancer-Prediction-Using-CNN-with-Explainable-AI-and-Radiomic-Feature-Detection\n\
  Deep learning framework integrating CNN, radiomic features, and explainable AI (Grad-CAM, LIME) for\
  \ lung cancer diagnosis using CT scans.\n# \U0001FAC1 Lung Cancer Prediction Using CNN with Explainable\
  \ AI and Radiomic Feature Detection\n\nThis project presents a **deep learning framework** for early\
  \ **lung cancer detection** using CT images.  \nIt integrates **Convolutional Neural Networks (CNNs)**,\
  \ **radiomic feature extraction**, and **Explainable AI (XAI)** techniques (Grad-CAM & LIME) to provide\
  \ interpretable, clinically meaningful predictions.\n\n---\n\n## \U0001F4CC Project Overview\n\nLung\
  \ cancer is one of the most fatal diseases worldwide, and early detection greatly improves survival\
  \ outcomes.  \nTraditional biopsy-based diagnosis is invasive, so this project proposes a **non-invasive**,\
  \ imaging-based method for diagnosis using CT scans.\n\nThe proposed model:\n- Utilizes a CNN architecture\
  \ for classification (benign, malignant, normal)\n- Integrates **radiomic features** from **intranodular**\
  \ and **perinodular** regions\n- Applies **class imbalance correction (SMOTE)**\n- Uses **XAI visualization**\
  \ (Grad-CAM, LIME) to explain model reasoning\n\n---\n\n## \U0001F9E0 Objectives\n- Detect and classify\
  \ lung nodules using deep learning.\n- Enhance performance using **radiomic feature fusion**.\n- Handle\
  \ class imbalance via **SMOTE oversampling**.\n- Provide **explainable visual insights** for clinical\
  \ interpretability.\n\n---\n\n## \U0001F9EA Dataset and Preprocessing\n\n- **Dataset:** IQ-OTH/NCCD\
  \ Lung Cancer Dataset (Kaggle)\n- **Total Images:** 1,097 CT images  \n  - 561 Malignant  \n  - 120\
  \ Benign  \n  - 416 Normal\n- **Preprocessing Steps:**\n  - DICOM → PNG conversion  \n  - Resizing to\
  \ 224×224×3  \n  - Normalization and histogram equalization  \n  - Weak segmentation (CAUnet) for radiomic\
  \ extraction\n\n---\n\n## \U0001F9E9 Model Architecture and Features\n\n### \U0001F9EC CNN Variants\
  \ Tested\n1. **Model 1:** CNN + Data Augmentation  \n2. **Model 2:** CNN + Class Weighting  \n3. **Model\
  \ 3:** CNN + SMOTE (Synthetic Minority Oversampling)\n\n### \U0001F9EE Radiomic Features\n**Intranodular\
  \ Features:**\n- Texture: GLCM contrast, correlation, energy, homogeneity  \n- Shape: Sphericity, irregularity\
  \  \n- Intensity: Mean, skewness, kurtosis  \n\n**Perinodular Features:**\n- Vascularity: Vessel orientation\
  \ dispersion  \n- Margins: Edge sharpness, spiculation index  \n- Texture: Regional entropy, Gabor features\
  \  \n\n---\n\n## \U0001F9FE Performance Summary\n\n| Model | Accuracy | Sensitivity | Specificity |\
  \ Remarks |\n|--------|-----------|-------------|--------------|----------|\n| CNN + Augmentation |\
  \ 98.20% | 93.00% | 96.50% | Limited imbalance correction |\n| CNN + Class Weighting | 99.10% | 94.20%\
  \ | 94.20% | Moderate improvement |\n| CNN + SMOTE | 92.00% | 91.00% | 91.00% | Optimal real-world balance\
  \ |\n\n**Final Results:**\n- **SVM Model:** 83.00% accuracy  \n- **Random Forest Model:** 80.00% accuracy\
  \  \n- **Radiomic + CNN Integration:** Improved specificity by 3–5%  \n\n---\n\n## \U0001F3AF Explainable\
  \ AI (XAI)\n\n**1️⃣ Grad-CAM:**  \nHighlights regions of interest corresponding to malignant nodules.\n\
  \n**2️⃣ LIME:**  \nGenerates local, interpretable explanations of CNN predictions.\n\n**Clinical Insight:**\
  \  \nGrad-CAM and LIME highlighted the same intranodular and perinodular regions where radiomics reported\
  \ high F6 (heterogeneity) and F8 (edge sharpness) scores, confirming biological plausibility.\n\n---\n\
  \n## \U0001F9F0 Installation and Usage\n\n### \U0001F9F1 Requirements\nInstall dependencies via:\n```bash\n\
  pip install -r requirements.txt\n\n"

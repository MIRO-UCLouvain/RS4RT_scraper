readme_excerpt: "# TG-43 Ir-192 HDR Dose Calculation Tool (v0.1.0)\n\n## \U0001F9ED Overview\n\nA lightweight\
  \ Streamlit app implementing the **TG-43(U1)** formalism for the **Varian VS2000 Ir-192 HDR source**,\
  \ designed for teaching, research, independent verification / secondary checks, QA method development,\
  \ etc.\n\n---\n\n## ⚡ Features\n\n- **TG-43(U1) dose engine**  \n  - Geometry factor, radial dose function,\
  \ anisotropy, dose-rate constant  \n  - Multi-dwell summation  \n- **Interactive UI (Streamlit)**  \n\
  \  - Editable dwell table (x, y, z, time)  \n  - Adjustable source activity  \n  - Real-time dose updates\
  \  \n- **Point-dose calculator** for any (x, y, z)  \n- **2D isodose plots** (absolute & relative)\n\
  \n![2D Isodose Example](isodose_example.png)\n\n---\n\n## \U0001F680 Quick Start\n\n```bash\ngit clone\
  \ https://github.com/afiosman/TG43-app\ncd TG43-app\npip install -r requirements.txt\nstreamlit run\
  \ app.py\n```\n\n---\n\n## ⚠️ Disclaimer\n\nThis software is provided for educational, research, and\
  \ prototyping purposes only.\nIt has not been clinically commissioned or validated and must not be used\
  \ for patient treatment planning or clinical decision making.\n\n---\n\n## \U0001F4DC Citation\n\nIf\
  \ you use this tool in research, teaching, or publications, please cite:\n\n> Osman, A. F. I. (2025).\
  \ *TG-43 Ir-192 HDR Dose Calculation Tool (v0.1.0)*. https://github.com/afiosman\n\n---\n\n## \U0001F4EC\
  \ Contact\n\nFor questions, suggestions, or bug reports, please contact:\n\n**Alexander F. I. Osman**\
  \  \nPhD Student, Department of Radiation Oncology  \nVirginia Commonwealth University  \n\n\U0001F4E7\

readme_excerpt: "# Time synchronised motion platform simulating tumour motion and external surface motion\n\
  \nA motion platform has been developed to reproduce internal-external motion to perform quality assurance\
  \ tests for real-time image-guided radiotherapy systems. The aim of this project is to integrate the\
  \ 1DoF vertical motion platform with 6DoF Robot Phantom to establish control of both robots under one\
  \ software. The purpose of this goal is emulate tumour motion that is present during treatment such\
  \ as breathing.\n\nThe 6 DoF system consists of a six-axis robotic arm (Universal Robot, UR3 or UR16),\
  \ an acrylic phantom, a custom-base plate to mount the robotic phantom onto the treatment couch and\
  \ a software application which controls the robotic phantom to reproduce the patient-measured tumor\
  \ motion. The [software](https://github.com/Image-X-Institute/6-DoF-Robotic-Motion-Phantom/blob/main/Program%20Files/PhantomControl.sln)\
  \ provides methods to implement the appropriate sequence of transformations to accurately reproduce\
  \ the full range (6 DoF translational and rotational motion) and rate of patient-measured tumour motion\
  \ using the robotically controlled phantom. The set-up and motion trace repeatability of the robotic\
  \ system was evaluated against the Calypso system and was shown to provide sub-mm and sub-degree accuracy\
  \ and precision in translational and rotational degrees of freedom respectively. The basis of moving\
  \ the 1D motion platform is the linear actuator motor, that is driven by a microcontroller.\n\n## Key\
  \ Features\n\n- Accurate motion reproducibility for 6DoF tumour motion and 1DoF external respiratory\
  \ motion.\n- A user-friendly GUI interface.\n- Design compactness.\n- Easy workflow.\n\n\n## Getting\
  \ Started\n### Requirements\n    \n  * 6DoF robotic arm hardware\n     - For 6DoF robotic operation:\
  \ A six-axis robot (Tested on a commercially available [UR3 or UR16 Universal Robot](https://www.universal-robots.com/products/))\
  \ and its associated hardware\n     - A phantom\n     - Acrylic pane\n\n * 1DoF motion platform hardware\n\
  \    -  A one dimensionnal linear actuator (Tested on a commercially available https://www.firgelliauto.com.au/products/os-series)\
  \ and its associated hardware (Arduino board, DC Motor Drive)\n    -  Actuator mount - https://www.firgelliauto.com.au/products/mb-pb-premium-base-mounting-bracket?_pos=1&_sid=60fd26ad8&_ss=r.\n\
  \    -  Arduno UNO R3 - https://www.auselectronicsdirect.com.au/uno-r3-development-board-with-ch340-for-arduino-pr?gclid=Cj0KCQjwgNanBhDUARIsAAeIcAv02GVcrS7k21-deq1rdCWU41KdzBT5-rFzVqCPkOj6DIDkEo4WhioaAoLSEALw_wcB.\n\
  \    -  Motor DC Drive : https://www.phippselectronics.com/product/bts7960-43a-double-dc-stepper-motor-driver-h-bridge-pwm/?gad_source=1&gclid=EAIaIQobChMIh7eRzd-HiAMV59oWBR3aBBGWEAQYASABEgKMPvD_BwE\n\
  \    -  Power Supply Unit : https://au.rs-online.com/web/p/switching-power-supplies/9163920\n  \n  *\
  \ Software \n     - Microsoft Visual Studio 2022 with .NET framework 4.5 (tested). May work on other\
  \ versions too.\n     - Arduino version: Arduino 2.2.1 (tested).\n     - Winforms\n  \n  * Third-party\
  \ libraries (located in `External Libraries/`)\n     - EasyModbusTCP v4.2\n     - LiveCharts v0.9.7\n\
  \     - LiveCharts.WinForms v0.9.7.1\n     - LiveCharts.Wpf v0.9.7\n     - Math.Net Numerics v4.12.0\n\
  \     \n## Documentation\n\nThe [1DoF Documentation folder](https://github.com/Image-X-Institute/6-DoF-Robotic-Motion-Phantom/tree/main/Documentation/1DoF)\
  \ contains required information to assemble a similar 1DoF system. The [6DoF Documentation folder](https://github.com/Image-X-Institute/6-DoF-Robotic-Motion-Phantom/tree/main/Documentation/6DoF)\
  \ contains required information to assemble a similar 6-DoF system: Bill of materials, CAD files for\
  \ the phantom and hardware tools, robot specifications, documentation, a user-guide to operate the system,\
  \ and, step-by-step QA procedure for a real-time image-guided radiotherapy technology, Kilovoltage Intrafraction\
  \ Monitoring (KIM) using the robotic phantom.\n\n### Building the Robotic Motion Phantom software\n\n\
  The software was written and tested in C# using Visual Studio 2019 with .NET Framework 4.5 using Windows\
  \ 10 64-bit, but may work with other versions of Visual Studio.\n\n\n\n1. Open `PhantomControl.sln`\
  \ in Visual Studio (https://github.com/Image-X-Institute/6-DoF-Robotic-Motion-Phantom/blob/main/Program%20Files/PhantomControl.sln).\n\
  2. Build the solution in Release mode.\n3. This will create the application `PhantomControl\\bin\\Release\\\
  PhantomControl.exe` which can then be operated using [this guide](https://github.com/Image-X-Institute/6-DoF-Robotic-Motion-Phantom/blob/main/Documentation/6DoF/Software%20GUI%20Guide.pdf)\
  \ when connected to a six-axis robotic system or/and one dimensionnal platform.\n\n## Publications\n\
  \n- S. Alnaghy et al., Phys. Med. Biol. 64 105021 (2019), [doi:10.1088/1361-6560/ab1935](https://doi.org/10.1088/1361-6560/ab1935)\n\
  - Shi K. et al., Med Phys. 47(12):6068-6076 (2020), [doi: 10.1002/mp.14502](https://aapm.onlinelibrary.wiley.com/doi/full/10.1002/mp.14502)\n\
  - Kaczynska A., Kuban C. et al., Phys. Eng. Sci. Med. (2026) [doi: 10.1007/s13246-026-01710-w](https://link.springer.com/article/10.1007/s13246-026-01710-w)\n\
  \n## Clinical Trials\n\n- Liver Ablative Radiotherapy utilizing KIM, [TROG 17.03 LARK trial](https://www.trog.com.au/1703-LARK)\
  \ \n- Novel Integration of New prostate radiation therapy schedules with adJuvant Androgen deprivation,\
  \ [TROG 18.01 NINJA trial](https://www.trog.com.au/1801-NINJA)\n- Surface Monitoring technology to Remove\
  \ The mask, [SMART trial](https://image-x.sydney.edu.au/home/clinical-trials/).\n\n## Clinical use\n\
  - Adapted for routine quality assurance tests at Princess Alexandra Hospital.\n\n## Licence\n\nContent\
  \ is released under [this licence](https://github.com/ACRF-Image-X-Institute/6-DoF-Robotic-Motion-Phantom/blob/a5fb87378eb501c1a9539277ff3f0080b794489e/Copyright%20Notice%20and%20Licence.pdf)\
  \ which includes attribution guidelines, contribution terms, and software and third-party licences and\
  \ permissions.\n\n## Limitations and safety \n\nThe UR3 robot has automated tasks up to 3 kg (6.6 lbs).\
  \ It has reach radius of up to 500 mm (19.7 in) with 0.1 mm and 0.2 deg repeatability. For all other\
  \ safety related issues, please visit the [Universal Robot website](https://www.universal-robots.com/articles/).\n\
  \n## Future work\n\nFuture works planned to be done with this project:\n\n- Phantoms with lung insert\
  \ for quality assurance of the markerless tracking systems.\n- Concurrent geometric and dosimetric quality\
  \ assurance with a radiation detector or films. \n- QA other real-time tracking systems such as depth\
  \ sensors as used in the [Remove the Mask Project](https://image-x.sydney.edu.au/home/remove-the-mask/).\n\
  \n## Authors\n\nDr. Saree Alnaghy, Dr. Chandrima Sengupta, Kuldeep Makhija.\n\n## Contact\nChandrima.Sengupta@sydney.edu.au\n\
  \n## Acknowledgements\n\nThe authors thank all the contributors, Dr. Andre Kyme, Dr. Vincent Caillet,\
  \ Dr. Doan Trang Nguyen, Dr. Ricky O'Brien, Dr. Jeremy T. Booth and Prof. Paul J Keall for lending their\
  \ valuable input and expertise leading up to the initial release. Thanks to Dr. Melissa Mail and Dr.\
  \ Sara Tomka for their help in producing the licence of this software and to the Image-X team for providing\
  \ valuable input in developing this repository.\n"

  \ Machine Learning: Moving Beyond Single Dose-Parameter Normal Tissue Complication Probability by Using\
  \ Whole Dose-Volume Histograms for Cohort Risk Stratification.](https://doi.org/10.1016/j.ijrobp.2024.02.021)\
  \ _International Journal of Radiation Oncology, Biology, Physics 119.5 (2024) 1569-1578_.**\n\nCitation:\n\

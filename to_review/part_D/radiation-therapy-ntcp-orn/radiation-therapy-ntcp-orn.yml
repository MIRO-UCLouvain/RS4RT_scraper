  \ Journal of Radiation Oncology, Biology, Physics},\n  volume={119},\n  number={5},\n  pages={1569--1578},\n\
  \  year={2024},\n  doi={https://doi.org/10.1016/j.ijrobp.2024.02.021}\n}\n```\n\nFor support in using\

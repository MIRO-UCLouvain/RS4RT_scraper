readme_excerpt: "# Landmark-detection\n\nThis repository contains the codebase for our deep learning model\
  \ developed for automatic landmark detection on CBCT images to measure basal bone width. The method\
  \ was proposed and validated in our paper *\"Cone-beam CT landmark detection for measuring basal bone\
  \ width: a retrospective validation study\"*, which has been accepted by **BMC Oral Health**.\n\nThe\
  \ model utilizes a two-stage coarse-to-fine U-Net framework trained on 3D CBCT data to identify anatomical\
  \ landmarks critical for assessing maxillary and mandibular transverse dimensions. Once the paper is\
  \ published online, the code will be made publicly available to support reproducibility and further\
  \ research.\n\n\U0001F4C4 Paper link: [https://doi.org/10.1186/s12903-024-04798-2](https://doi.org/10.1186/s12903-024-04798-2)\
  \  \n\U0001F468‍\U0001F4BB Code will be available at: [https://github.com/Guo777777/Landmark-detection](https://github.com/Guo777777/Landmark-detection)\n"

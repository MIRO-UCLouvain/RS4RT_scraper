readme_excerpt: "# Robust-Semi-Supervised-CT-Radiomics-for-Lung-Cancer-Prognosis  \n**Robust Semi-Supervised\
  \ CT Radiomics for Lung Cancer Prognosis: Cost-Effective Learning with Limited Labels and SHAP Interpretation**\
  \  \n\n## \U0001F4CC Overview  \nThis repository contains the code and supplementary materials for the\
  \ paper:  \n*\"Robust Semi-Supervised CT Radiomics for Lung Cancer Prognosis: Cost-Effective Learning\
  \ with Limited Labels and SHAP Interpretation\"*  \nby Mohammad R. Salmanpour et al.  \n\nThe study\
  \ proposes a semi-supervised learning (SSL) framework to predict lung cancer prognosis using CT radiomics\
  \ features, achieving superior performance with limited labeled data. Key contributions include:  \n\
  \n- Leveraging both labeled and unlabeled CT scans from 13 public datasets  \n- Benchmarking 56 feature\
  \ selection/extraction methods and 27 classifiers  \n- Demonstrating SSL's robustness via SHAP interpretability\
  \ and external validation  \n\n## \U0001F4C2 Repository Structure  \n├── Classification_Code_And_SHAP/\
  \          # Python scripts for supervised (SL) and semi-supervised (SSL) learning and SHAP-based feature\
  \ importance analysis  \n├── Result File 1_Supervised learning.xlsx         # Detailed SL results (metrics,\
  \ hyperparameters, selected features)  \n├── Result File 2_Semisupervised learning.xlsx    # Detailed\
  \ SSL results (metrics, hyperparameters, selected features)  \n├── README.md                     # This\
  \ file  \n \n\n## \U0001F4CA Key Results  \n- SSL outperformed SL: Achieved 0.90±0.01 accuracy (cross-validation)\
  \ and 0.88±0.01 (external testing)  \n- Data efficiency: SSL maintained high performance with only 10%\
  \ labeled data  \n- Top model: FIRF + XGBoost (see `Supplemental_File_2.xlsx`)  \n\n## \U0001F4D6 Supplemental\
  \ Files  \n**`Supplemental_File_1.xlsx`**:  \n- Sheet 1: SL performance metrics (Accuracy, AUC, etc.)\
  \  \n- Sheet 3: Optimal hyperparameters for SL models  \n- Sheet 4: Selected features per FSA/AEA  \n\
  \n**`Supplemental_File_2.xlsx`**:  \n- Parallel sheets for SSL results  \n\n## ⁉️ Support  \nFor questions,\
  \ contact:  \nMohammad R. Salmanpour: msalman@bccrc.ca  \n"

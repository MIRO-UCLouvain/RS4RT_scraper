readme_excerpt: '# Breast Cancer Detection & Classification (Ultrasound)


  > A Streamlit decision-support app that segments breast-ultrasound tumours, extracts radiomics features,
  and classifies them as benign vs. malignant.


  ![IoU](https://img.shields.io/badge/Seg%20IoU-0.71-success?style=flat-square)

  ![Accuracy](https://img.shields.io/badge/RF%20Accuracy-0.86-success?style=flat-square)

  ![Python](https://img.shields.io/badge/Python-3776AB?logo=python&logoColor=white)

  ![PyTorch](https://img.shields.io/badge/PyTorch-EE4C2C?logo=pytorch&logoColor=white)

  ![scikit-learn](https://img.shields.io/badge/scikit--learn-F7931E?logo=scikitlearn&logoColor=white)

  ![Streamlit](https://img.shields.io/badge/Streamlit-FF4B4B?logo=streamlit&logoColor=white)


  <p align="center"><img src="assets/result.png" width="650"/></p>


  ## Overview

  End-to-end breast-ultrasound workflow: segment the tumour, extract radiomics features from the ROI,

  and classify it as benign or malignant. Designed with GDPR-aligned data-handling considerations.


  ## Results

  | Stage | Model | Metric | Score |

  |-------|-------|--------|-------|

  | Segmentation | DeepLabV3 + ResNet-101 | Mean IoU | **0.71** |

  | Classification | Random Forest | CV accuracy | **0.86** |

  | Classification | SVM (SMOTE) | Accuracy | **0.85** |


  ## Approach

  - **Segmentation:** DeepLabV3 + ResNet-101 (training); a custom PyTorch U-Net is loaded in the app.

  - **Features:** Pyradiomics features extracted from segmented ROIs.

  - **Classification:** SVM, Random Forest, and MLP compared, with SMOTE balancing and PCA / SelectKBest
  feature selection.


  ## Dataset

  Breast-ultrasound images with paired masks (benign/malignant) — 515 image/mask pairs; radiomics

  feature table of 647 samples × 96 features.


  ## Tech stack

  PyTorch · torchvision · TensorFlow/Keras · scikit-learn · Pyradiomics · SimpleITK · Streamlit


  ## Repository structure

  ```

  main.py                                 # Streamlit entry point

  radiology.py                            # upload → segment → radiomics → classify

  UNet_segmantation.ipynb                 # segmentation training (DeepLabV3)

  feature_extraction_RF_MLP(NN).ipynb     # radiomics + RF / MLP / SVM

  SVM_model.ipynb                         # SVM with SMOTE

  ```


  ## How to run

  ```bash

  pip install -r requirements.txt   # streamlit, torch, scikit-learn, pyradiomics, simpleitk, ...

  streamlit run main.py

  ```



readme_excerpt: "# MRLCinema\nThe purpose of MRLCinema is to be a research tool in radiotherapy focusing\
  \ around motion management for MR-Linacs.\n\nCurrently it can: \n- Parse the Elekta cine files (*.bin\
  \ files in MSNRBF format) into SimpleITK images\n- Perform group registration of a list of cines to\
  \ determine the motion between the cines (i.e. create a motion trace). A report is produced in json\
  \ fromat with all info on the motion trace.\n- Replay the motion (cines and motion trace) in a web application\
  \ (based on the panel framework). The application reads the cines and the motion motion trace and can\
  \ replay it in a gui.\n- Perform dose accumulation using a motion trace and a Linac Logfile (i.e. move\
  \ around, and accumulate, the dose whole distribution using the motion trace and beam on information)\n\

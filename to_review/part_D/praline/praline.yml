readme_excerpt: '# PRaLine code (Proton Radiography Linear reconstruction, the "reconstruction" is silent)


  Proton radiography is an experimental technique used to reveal the magnetic fields found in high-energy
  density plasma experiments using beams of protons. The proton beams are either produced by imploding
  capsules, which release a short pulse of mono-energetic protons at stagnation, or by thermally produced
  protons accelerated through extreme electric field gradients. The usual proton energies are between
  3 and 30MeV and are driven through a magnetic field in a plasma experiment, where the path is shifted
  by the Lorentz force and then come to stop at the screen. The positions on the screen are recorded along
  with initial conditions. Under certain experimental conditions, the full structure of the perpendicular
  magnetic field can be reconstructed by solving a steady- state inhomogeneous two-dimensional diffusion
  equation. The code presented is a Python package developed at the University of Chicago to analyze proton
  radiography experimental radiographs in the linear (small-image contrast) regime. This code is based
  on work by Graziani et al.:


  Graziani, C., Tzeferacos, P., Lamb, D. Q. & Li, C. Inferring morphology and strength of magnetic fields
  from proton radiographs. Review of Scientific Instruments 88, 123507 (2017).


  The published manuscript may be found [here](https://doi.org/10.1063/1.5013029) and an earlier open-access
  draft may be found [here](https://arxiv.org/abs/1603.08617).


  # Setup


  ## Dependencies

  This module requires **Python 2.7** (development branch works with **Python 3.6**). Installation requires
  **git**.


  **OS X users:** Prior to installing dependencies, ensure an adequate Python installation by following
  [this guide](https://matplotlib.org/faq/installing_faq.html#osx-notes). The Python that ships with OS
  X may not work well with some required dependencies.


  The following Python packages are required:

  * future (Cross-compatibility between Python2 and Python3)

  * numpy (Scientific computing)

  * scipy (Scientific computing)

  * matplotlib (Plotting)

  * pandas (Parsing Large files)

  * pradreader (https://github.com/flash-center/PRadReader) (Reading various proton radiograph file formats)


  On most systems (see above note for OS X), they can be installed using Python''s [PIP package manager](https://packaging.python.org/tutorials/installing-packages/)
  as follows:


  ```shell

  pip install future

  pip install numpy scipy matplotlib pandas

  pip install git+https://github.com/flash-center/PRadReader

  ```


  Depending on how Python was installed on your system, `pip` may require *Administrative* or `sudo` privileges.


  ## Installation

  Once all dependencies are satisfied, install the latest version of **PRaLine** by:


  ```shell

  pip install git+https://github.com/flash-center/PRaLine

  ```


  The module can also be installed by:


  ```shell

  git clone https://github.com/flash-center/PRaLine

  cd PRaLine

  python setup.py install

  ```


  # Usage

  ## Requirements

  An intermediate file is created using the [PRadReader python package](https://github.com/flash-center/PRadReader).


  An intermediate file that contains the variables such as:

  * Distance from proton source to the interaction region(cm), s2r_cm

  * Distance from proton source to the screen(cm), s2d_cm

  * Proton Kinetic Energies (MeV), Ep_MeV

  * flux image which is a matrix with number of protons per bin of the screen which is dependent on the
  inputted bin length, flux

  * flux reference which is the flux image if there were no interaction region


  ## How it Works


  The user has to run the PRadReader on there proton radiograph data which returns a intermediate file
  that can be used on both command line tools below.

  ## Command Line Tools


  Supported file formats include any that PRadReader supports, including radiographs generated from FLASH
  simulations and MIT''s CR39 proton radiography analysis


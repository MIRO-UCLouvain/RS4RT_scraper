readme_excerpt: "# Automated Treatment Planning Using Generative Adversarial Networks\n\n## Inspiration\n\
  \nModel Architecture:\nMahmood, R., Babier, A., McNiven, A., Diamant, A. &amp; Chan, T.C.Y.. (2018).\
  \ Automated Treatment Planning in Radiation Therapy using Generative Adversarial Networks. <i>Proceedings\
  \ of the 3rd Machine Learning for Healthcare Conference</i>, in <i>Proceedings of Machine Learning Research</i>\
  \ 85:484-499 Available from https://proceedings.mlr.press/v85/mahmood18a.html.\n\nData Source (CORT):\n\
  Craft, D., Bangert, M., Long, T., Papp, D., & Unkelbach, J. (2014). Shared data for intensity modulated\
  \ radiation therapy (IMRT) optimization research: the CORT dataset. Gigascience, 3(1). https://doi.org/10.1186/2047-217x-3-37\n\
  \n## Introduction\n\nThis model uses Generative Adversarial Networks to properly determine where to\
  \ apply radiation therapy (as PTV, or planning target volume). The model utilizes a pix2pix architecture\
  \ to convert the CT slice into a PTV suggestion.\n\n## Requirements\n\nTo run this notebook, make sure\
  \ you have the following packages installed:\n\n```\nnumpy\nscipy\npydicom\nmatplotlib\nskimage\ntorch\n\
  ```\n\nSpecifically, for the following imports:\n\n```\nimport numpy as np\nimport scipy.io\nimport\
  \ pydicom \n\nimport matplotlib.pyplot as plt\nfrom skimage.transform import resize as sk_resize\n\n\
  import torch\nimport torch.nn as nn\nimport torch.optim as optim\nfrom torch.utils.data import Dataset,\
  \ DataLoader\n```\n\nAdditionally, make sure your dataset is extracted in your `dataset` folder such\
  \ that the file directory is as such:\n- `dataset/LIVER/`\n- `dataset/Liver_dicom/`\n\nNOTE: I ran this\
  \ model completely on Kaggle. All the required packages are already pre-installed on their compute,\
  \ and uploading the dataset is very straightforward. Make sure you change the variable `kaggle_path`\
  \ so it points to your dataset!\n\n## Directory Breakdown\n\nThe main folder of interest will be `src`,\
  \ which contains the runner file that trains and validates the replicated model. \n\nOther directories:\n\
  - `PyHealthFiles` - the files sent in the PR to the PyHealth repo\n- `dataset` - the dataset files,\
  \ uploaded as a Git LFS file (may be removed due to going over the limit for a free Git account)\n-\
  \ `docs` - final report\n- `results` - model performance per every 5 epochs, MAE and PSNR results at\
  \ the final 25th epoch\n- `video` - video walkthrough of model\n\n## How to Run the Code\n\n1. Clone\
  \ this repo!\n2. Download the dataset (`LIVER.zip` and `Liver_dicom.zip` from the CORI dataset webpage,\
  \ or use my Kaggle dataset)\n3. Change the path to the data source (in `kaggle_path`) to point to the\
  \ `dataset` folder.\n4. The main file should be good to run as-is as a notebook once the data is connected\
  \ (although, you may have to install the required packages mentioned above).\n\nAn even easier way to\
  \ run this would be to load the Jupyter Notebook onto Kaggle, load my dataset into the working environment,\
  \ ensure that the P100 accelerator (GPU) is selected, and hit \"Run All\".\n"

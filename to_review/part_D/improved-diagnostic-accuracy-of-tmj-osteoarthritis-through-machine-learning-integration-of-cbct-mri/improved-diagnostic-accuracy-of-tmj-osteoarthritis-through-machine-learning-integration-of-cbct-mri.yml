readme_excerpt: "# Improved Diagnostic Accuracy of TMJ Osteoarthritis through Machine Learning Integration\
  \ of CBCT and MRI\nThis repository contains the official code for the study\n\"Improved Diagnostic Accuracy\
  \ of TMJ Osteoarthritis through Machine Learning Integration of CBCT and MRI\"\nby Yeon-Hee Lee, Seongwoo\
  \ Jang, Seonggwang Jeon, Q–Schick Auh, and Akhilanand Chaurasia.\n\nThe repository includes data preprocessing,\
  \ model training, evaluation, and visualization modules for the diagnosis of temporomandibular joint\
  \ osteoarthritis (TMJ OA).\n\nThis work primarily leverages CNN-based deep learning approaches (VGG16,\
  \ Fine-Tuning strategies, and Ensemble methods) applied to CBCT and MRI imaging data. The study explores\
  \ how multimodal integration of imaging modalities can enhance diagnostic performance compared to single-modality\
  \ approaches.\n\n## Project Overview\n\nTemporomandibular joint osteoarthritis (TMJ OA) is a degenerative\
  \ disorder that significantly impacts oral function and patients’ quality of life.\nThis project investigates\
  \ the diagnostic potential of CBCT and MRI imaging data using neural network models.\n\nKey aspects\
  \ include:\nPreprocessing and harmonization of multimodal imaging datasets (CBCT, MRI)\nCNN-based classification\
  \ models (VGG16) for image-based diagnosis\nIntegration of patient demographic data (age, sex) with\
  \ imaging features\nEnsemble and fine-tuning strategies across CBCT and MRI modalities\nAUROC evaluation\
  \ with 95% CI and DeLong’s test for statistical comparisons\n\n## Repository Structure\n\n- **1_data_preprocessing.ipynb**\
  \ \n  - Image resizing, normalization, patient ID matching, and label encoding  \n\n- **2_data_initial_analyze.ipynb**\n\
  \  - Dataset statistics (age, sex, OA distribution), class balance check  \n\n- **3_Image_initial_analyze.ipynb**\
  \  \n  - Visualization of representative CBCT and MRI images  \n  - Basic image quality assessment (resolution,\
  \ contrast)  \n  - Exploratory visualization of OA vs Normal differences  \n\n- **4_Image_Preprocessing.ipynb**\n\
  \  - Image augmentation (rotation, flipping, brightness adjustment)  \n  - Noise filtering and cropping\
  \ for ROI (Region of Interest)  \n  - Alignment of multimodal data (CBCT vs MRI consistency)  \n\n-\
  \ **5_TMJ_OA_CBCT_MRI_Training.ipynb**\n  - CNN-based training with VGG16 (baseline)  \n  - Fine-tuning\
  \ with additional CBCT & MRI combined datasets  \n  - Ensemble strategies (e.g., late fusion of CBCT\
  \ and MRI models)  \n  - Training/validation curve visualization, performance reporting  \n\n- **6_Case_Delong's_test.ipynb**\
  \  \n  - Statistical comparison of AUROC across models (CBCT vs MRI vs Ensemble)  \n  - Pairwise DeLong’s\
  \ test for significance testing  \n  - Visualization of ROC curves with 95% CI  \n  - Heatmap of p-values\
  \ between experimental conditions  \n\n- **7_Feature_map_and_Gradcam_heatmap.ipynb** \n  - enerates\
  \ Grad-CAM (hookless) at the last conv layer and saves RGB overlays per case.\n  - Captures pre-/post-ReLU\
  \ tensors via precise forward hooks and exports channel tiles.\n  - Computes four sparsity metrics:\
  \ pre_sign, pre_eps, post_zero, post_eps, and reports as a table.\n  - Logs Normalize/Conv-idx/ε for\
  \ reproducibility and prints per-case CAM paths + hints.\n\n- **README.md**  \n  - Project overview,\
  \ setup guide, and usage instructions\n \n\n## Models Used\n\n- **Neural Network Models**\n\n  - CNN\
  \ (VGG16)\n  Served as the baseline structure for classifying CBCT and MRI images\n  Initial experiments\
  \ applied VGG16 for OA vs Normal classification\n\n- **Fine-Tuning (Transfer Learning)**\n\n  - Pretrained\
  \ weights (e.g., ImageNet) applied to CBCT/MRI datasets\n  Selective freezing/unfreezing of layers to\
  \ optimize performance\n  Conducted experiments on both single-modality (CBCT, MRI) and multimodal integration\n\
  \n- **Ensemble**\n\n  - Late Fusion: Combined prediction probabilities from CBCT and MRI models for\
  \ final diagnosis\n  Fine-tuned Ensemble: Additional fine-tuning based on integrated CBCT & MRI datasets\n\
  \  Goal: Achieve higher AUROC and more stable diagnostic performance compared to single models\n\n##\
  \ Evaluation\n- Performance Metrics\n  AUROC (with 95% CI)\n  Accuracy\n  Confusion Matrix (including\
  \ sensitivity and specificity)\n\n- Statistical Comparison\n  DeLong’s test performed to compare AUROC\
  \ differences across models\n  Pairwise comparisons:\n  CBCT vs MRI\n  Baseline vs New Images\n  Single\
  \ Modality vs Multimodal Integration (CBCT & MRI fusion)\n\n## Contact\n\nFor any inquiries or collaboration\
  \ opportunities:\n\n- Yeon-Hee Lee: omod0209@gmail.com\n\n- Seongwoo Jang: mook8105@koreacu.ac.kr\n\n\
  - Seonggwang Jeon: qq22512@hanyang.ac.kr\n\n\n## Acknowledgments\n\n- This work was supported by the\
  \ Department of Orofacial Pain and Oral Medicine, Kyung Hee University Dental Hospital, and the Department\
  \ of Convergence Information Studies, Korea Cyber University.\n"

readme_excerpt: 'VIT Based CT Image Interpretation


  📌 Project Overview


  A deep learning-based medical image segmentation project for identifying and segmenting lung tumors
  from CT scan images using Vision Transformer (ViT) and U-Net architectures.


  🎯 Objective


  To accurately segment cancerous regions from CT images and support automated medical image analysis.


  🛠️ Technologies Used

  Python

  PyTorch

  Vision Transformer (ViT)

  U-Net

  Deep Learning

  CT Images

  Google Colab

  🔄 Project Workflow

  CT image collection

  Image preprocessing

  Image normalization and resizing

  Dataset splitting

  Model training

  Tumor segmentation

  Performance evaluation

  📊 Evaluation Metrics

  Accuracy

  Precision

  Recall

  Sensitivity

  Dice Coefficient

  Mean IoU

  📁 Dataset


  The project uses CT medical images for lung tumor segmentation. The dataset contains 96 3D volumes,
  with 64 training volumes and 32 testing volumes.


  🚀 Result


  The trained segmentation models were evaluated based on their ability to accurately identify and segment
  cancerous regions in CT images.


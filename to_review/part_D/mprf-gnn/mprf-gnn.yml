readme_excerpt: "Project Description: Multi-Parameter Radiomics Feature Graph Neural Network\r\nInnovation:\
  \ Using three discretization parameters with fixed bin sizes of 32, 64, and 128, and 23 filters, the\
  \ project constructs a graph structure using feature vectors extracted from the tumor region under each\
  \ parameter as vertices. Four fusion methods (input fusion, feature fusion, graph fusion, and decision\
  \ fusion) are employed for multimodal fusion.\r\n\r\n\r\n\r\nEnvironment:\r\nPython 3.10.16\r\npytorch\
  \ 2.5.1\r\npytorch_cuda 11.8\r\npytorch_geometric 2.6.1\r\n\r\nEnvironment Details: environment.yml\r\
  \nEnvironment Installation Code: conda env create -f /path/to/destination/environment.yml\r\nActivate\
  \ the environment: conda activate your_env_name\r\n\r\n\r\n\r\nFile Description:\r\nHNC_data: Graph\
  \ Structure Construction\r\n\r\nex_basic: Single-modal Experiment\r\nex_combined_congraph: Graph Fusion\
  \ Experiment\r\nex_combined_incat: Input Fusion\r\nex_combined_outcat: Decision-side Fusion\r\nex_combined_veccat:\
  \ Feature Fusion\r\n\r\nmodel_GCN_veccat: Feature Fusion Graph Network\r\nmodel_GCN_congraph: Graph\
  \ Fusion Graph Network\r\n\r\nresults_tv_div.pkl: Coordinate Set for the Training-Validation Split of\
  \ the Training Set Using 20-fold 5-fold Cross-Validation"

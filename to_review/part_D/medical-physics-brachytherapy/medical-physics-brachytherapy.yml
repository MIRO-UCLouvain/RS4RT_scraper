readme_excerpt: '# Medical Physics: Brachytherapy Dose Rate Algorithm


  ## Overview


  This project explores the mathematical and physical principles behind dose-rate calculations used in
  **brachytherapy**, a form of internal radiation therapy cancer treatment in which radioactive sources
  are placed near or within the treatment area to deliver radiation and kill cancer cells.


  I worked closely with Board Certified Medical Physicist Vi Nguyen for the case study, as well as verify
  all information presented was correct.


  The project was presented as a technical visual presentation at **Arizona State University** and focuses
  on how radiation physics, geometry, and calculus-based optimization contribute to cancer treatment planning.


  ## Topics Covered


  * Radiation physics and dose-rate calculations

  * Geometry and spatial relationships in brachytherapy

  * Mathematical modeling of radiation dose

  * Calculus-based optimization and objective functions

  * Brachytherapy treatment planning

  * Clinical case study (Exocervical cancer)

  * Applications of Artificial Intelligence and Machine Learning in Medical Physics

  * Future applications of AI in radiation treatment planning


  ## Case Study


  A clinical brachytherapy case study of a woman with Exocervical cancer was included to demonstrate how
  mathematical models and dose-rate calculations can be applied to real-world treatment planning.


  The case study connects the underlying physics and mathematics to the practical goal of delivering an
  effective radiation dose while improving treatment precision.


  ## Mathematics & Physics


  The presentation examines how mathematical models incorporate factors such as radiation dose, source
  geometry, and spatial relationships. It also discusses how optimization techniques can be used to define
  treatment objectives and identify an optimal treatment plan.


  This project provided an opportunity to apply concepts from:


  * Calculus

  * Geometry

  * Mathematical modeling

  * Optimization

  * Radiation physics


  ## Artificial Intelligence & Future Applications


  The presentation also explored the potential role of **Artificial Intelligence and Machine Learning
  in Medical Physics**, including how advances in AI could contribute to improved treatment planning,
  optimization, and clinical decision-making.


  This section was intended to examine emerging applications of AI rather than present an AI-developed
  treatment algorithm.


  ## Skills Demonstrated


  **Mathematics:** Calculus, Optimization, Geometry, Mathematical Modeling

  **Physics:** Radiation Physics, Medical Physics, Radiation Therapy

  **Technical:** Research, Technical Communication, Data/Algorithm Analysis

  **Emerging Technology:** Artificial Intelligence, Machine Learning


  ## Instructions to View


  You can view the poster in this Repository by clicking on *presentation.pdf*. You may also download
  the file for better resolution.


  ---


  *Academic project completed at Arizona State University, December 2025.*



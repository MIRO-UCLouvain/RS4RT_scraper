readme_excerpt: "# Chuyển đổi MRI sang CT mô phỏng cho xạ trị\n\nDự án này sử dụng kỹ thuật học sâu không\
  \ giám sát để chuyển đổi ảnh MRI thành ảnh CT mô phỏng có gán hệ số mô để phục vụ cho xạ trị. Trong\
  \ khi ảnh MRI cung cấp độ tương phản tổ chức tốt, ảnh CT cung cấp thông tin về mật độ electron cần thiết\
  \ cho việc lên kế hoạch xạ trị. Mô hình này cho phép sử dụng dữ liệu MRI để tạo ra ảnh CT mô phỏng với\
  \ các hệ số mô chính xác.\n\n## Tính năng\n\n- Xử lý tập dữ liệu DICOM từ ảnh MRI\n- Mô hình học sâu\
  \ không giám sát (CycleGAN) để chuyển đổi MRI sang CT\n- Gán hệ số mô dựa trên thông tin tương phản\
  \ của MRI\n- Đánh giá kết quả với các chỉ số MAE, SSIM, PSNR\n- Xuất kết quả dưới dạng ảnh DICOM tương\
  \ thích với hệ thống lập kế hoạch xạ trị\n\n## Cấu trúc dự án\n\n- `data/`: Thư mục chứa dữ liệu đầu\
  \ vào và đầu ra\n- `src/`: Mã nguồn chính của dự án\n  - `data_processing/`: Module xử lý dữ liệu DICOM\n\
  \  - `models/`: Các mô hình học sâu\n  - `training/`: Pipeline huấn luyện\n  - `evaluation/`: Công cụ\
  \ đánh giá mô hình\n  - `utils/`: Các hàm tiện ích\n- `notebooks/`: Jupyter notebooks cho trực quan\
  \ hóa và thí nghiệm\n- `configs/`: Cấu hình cho các thí nghiệm khác nhau\n\n## Yêu cầu\n\n- Python 3.8+\n\
  - PyTorch 1.8+\n- CUDA (cho GPU training)\n- pydicom\n- nibabel\n- scikit-image\n- numpy, pandas, matplotlib\n\
  \n## Cài đặt\n\n```bash\npip install -r requirements.txt\n```\n\n## Sử dụng\n\n1. Đặt dữ liệu DICOM\
  \ vào thư mục `data/raw/`\n2. Chạy tiền xử lý: `python src/data_processing/preprocess.py`\n3. Huấn luyện\
  \ mô hình: `python src/training/train.py --config configs/default.yaml`\n4. Sinh ảnh CT mô phỏng: `python\
  \ src/inference.py --input path/to/mri --output path/to/output`\n5. Đánh giá kết quả: `python src/evaluation/evaluate.py\
  \ --pred path/to/pred --gt path/to/ground_truth`\n"

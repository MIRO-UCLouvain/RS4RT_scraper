readme_excerpt: '# Radiomics_Models_Abnormality_Identification


  ## Description


  An radiomics-based algorithm to differentiate abnormalities and normal tissue on 2D screening mammograms.


  ## Dependencies


  * `numpy`

  * `pandas`

  * `scipy`

  * `matplotlib`

  * `scikit-learn`

  * `scikit-learn-intelex`

  * `xgboost`

  * `tensorflow`

  * `keras`

  * `pyradiomics`

  * `SimpleITK`

  * `pydicom`

  * `opencv-python`

  * `scikit-image`


  ## Executing program


  ### Extract Radiomics

  ```

  python extract_radiomics.py --input_dir <path to secondary captures> --output_csv <path to radiomics
  features csv>

  ```


  ### Machine Learning

  ```

  python machine_learning.py --input_csv <path to radiomics features csv>

  ```


  ## Author


  Ravi Bullock (ravi.bullock@bccancer.bc.ca, ravioliasb@gmail.com)'

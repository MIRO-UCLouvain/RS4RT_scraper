readme_excerpt: "# DVHEConverter\n\n[![License: MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](https://opensource.org/licenses/MIT)\n\
  [![Platform](https://img.shields.io/badge/platform-macOS-blue.svg)](https://www.apple.com/macos)\n\n\
  > A macOS tool for converting MKV files to MP4 format with Dolby Vision HDR support.\n\n## \U0001F680\
  \ Key Features\n\n- **MKV to MP4 Conversion**: Convert MKV files while preserving video quality\n- **Dolby\
  \ Vision Support**: HDR profile preservation (Profile 5)\n- **Batch Processing**: Process multiple MKV\
  \ files from a directory\n- **Real-time Status**: Live progress tracking with visual progress bar\n\
  - **Resource Management**: Automatic temporary file handling and cleanup\n\n## \U0001F4CB Requirements\n\
  \n### Dependencies\n\n- **FFmpeg**\n- **mp4demuxer_mac**\n- **mp4muxer_mac**\n\n## \U0001F4BB Installation\n\
  \n```bash\n# Set execution permissions\nchmod +x dvheconverter\n\n# Install FFmpeg if not already installed\n\
  brew install ffmpeg\n```\n\n## \U0001F527 Configuration\n\nThe tool supports an optional configuration\
  \ file at `./config.json`:\n\n```json\n{\n  \"output_dir\": \"/path/to/default/output\",\n  \"temp_dir\"\
  : \"/path/to/temp\",\n  \"logging_level\": \"info\"\n}\n```\n\n## \U0001F4D6 Usage\n\n### Basic Usage\n\
  \n```bash\n# Single file conversion\n./dvheconverter -i input.mkv\n\n# Directory processing\n./dvheconverter\
  \ --dir /path/to/mkv/files\n\n# Specify output directory\n./dvheconverter -i input.mkv --output-dir\
  \ /custom/output\n```\n\n## \U0001F3AF Command Line Options\n\n| Option             | Description  \
  \                        | Default  |\n| ------------------ | ------------------------------------ |\
  \ -------- |\n| `-h, --help`       | Show help message                    | -        |\n| `-i, --input-file`\
  \ | Input MKV file path                  | -        |\n| `--dir`            | Input directory for batch\
  \ processing | -        |\n| `--output-dir`     | Output directory path                | ./output |\n\
  | `--temp-dir`       | Temporary processing directory       | ./temp   |\n\n## \U0001F504 Processing\
  \ Pipeline\n\n1. **Converting**\n\n   - Converts MKV to temporary MP4 format\n   - Uses FFmpeg for initial\
  \ conversion\n\n2. **Demuxing**\n\n   - Separates audio and video streams\n   - Supports AAC/EC3 audio\
  \ and H264/H265 video\n\n3. **Muxing**\n   - Combines streams with Dolby Vision profile\n   - Applies\
  \ DV Profile 5 with DVH1 flag\n\n## \U0001F4CA Status Display\n\n```\n=========================================\n\
  DVHEConverter - DV MKV to MP4 Conversion Tool\n=========================================\n\nTotal Files\
  \ : 1\nCompleted   : 0\nErrors      : 0\n\nFile Statuses:\n--------------\n1. example.mkv [Processing]\n\
  \nProgress: [##########] 100%\n```\n\n## \U0001F4C1 Output Structure\n\n```\noutput/\n└── input_directory_name/\
  \      # For directory mode\n    └── filename_completed.mp4 # Converted files\ntemp/\n└── input_directory_name/\
  \      # For directory mode\n    └── filename_temp.mp4     # Temporary files\n```\n\n## \U0001F50D Error\
  \ Handling\n\nThe script handles several error scenarios:\n\n- Invalid input file/directory\n- FFmpeg\
  \ conversion failures\n- Demuxing/muxing errors\n- Missing audio/video streams\n- File permission issues\n\
  \n## \U0001F6E0 Troubleshooting\n\nCommon error messages and solutions:\n\n- \"File does not exist\"\
  \ - Verify file path and permissions\n- \"Failed to convert to MP4\" - Check FFmpeg installation\n-\
  \ \"Demuxing failed\" - Verify mp4demuxer_mac is working\n- \"Audio or video files not found\" - Check\
  \ input file integrity\n- \"Muxing failed\" - Verify mp4muxer_mac is working\n\n## \U0001F4DD License\n\
  \nThis project is licensed under the MIT License.\n\n---\n\n**Note**: This tool is designed for converting\
  \ MKV files to MP4 format while preserving Dolby Vision HDR content.\n"

readme_excerpt: "# Phase-Contrast MRI Simulation\n\nSupplementary Python code for phase-contrast MRI (PC-MRI)\
  \ simulation studies.\n\n**Authors:** Mingyu Liang, Zak Nabi, Jamie Ward  \n**Supervisor:** Dr. Andrew\
  \ Scott\n\n## Overview\n\nThis repository contains simulation code for:\n\n- Bipolar gradient encoding\
  \ and phase accumulation\n- Intravoxel dephasing vs voxel size\n- Flow-profile effects (plug and boundary-layer)\n\
  - Bland-Altman agreement analysis for noisy reconstructed velocity\n- Velocity uncertainty vs position\
  \ and vs VENC\n- Gradient hardware constraint sweeps (VENC, TE proxy, uncertainty)\n- A 2D beating-heart\
  \ velocity and phase-encoding model\n\n## Repository Structure\n\n```text\n├── README.md\n├── requirements.txt\n\
  ├── bipolar_gradient.py   # standalone bipolar gradient waveform/phase figure\n├── functions.py    \
  \      # simulation functions and plotting entry points\n└── bland_altman.py       # Bland-Altman analysis\
  \ script\n```\n\n## Requirements\n\nPython 3.8+:\n\n```bash\npip install -r requirements.txt\n```\n\n\
  Dependencies:\n\n- `numpy`\n- `matplotlib`\n\n## Usage\n\nRun the standalone bipolar gradient figure:\n\
  \n```bash\npython bipolar_gradient.py\n```\n\nRun the Bland-Altman analysis script:\n\n```bash\npython\
  \ bland_altman.py\n```\n\nRun report-aligned simulation figures from `functions.py`:\n\n```bash\npython\
  \ - <<'EOF'\nfrom functions import (\n    plot_voxel_dephasing_vs_size,\n    plot_plug_boundary_layer_velocity,\n\
  \    plot_plug_boundary_layer_signal_magnitude,\n    plot_velocity_uncertainty_vs_position,\n    plot_venc_uncertainty_boundary_layer,\n\
  \    plot_venc_optimisation,\n    plot_gradient_hardware_limits,\n    plot_wall_dephasing,\n)\n\nplot_voxel_dephasing_vs_size()\n\
  plot_plug_boundary_layer_velocity()\nplot_plug_boundary_layer_signal_magnitude()\nplot_velocity_uncertainty_vs_position()\n\
  plot_venc_uncertainty_boundary_layer()\nplot_venc_optimisation()\nplot_gradient_hardware_limits()\n\
  plot_wall_dephasing()\nEOF\n```\n"

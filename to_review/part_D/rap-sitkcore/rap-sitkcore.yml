readme_excerpt: "Radiomics Analysis Portal sitkCore\n++++++++++++++++++++++++++++++++++\n\nThe sitkCore\
  \ package used by the Radiomics Analysis Portal (`RAP`_) contains common utilities for developing image\n\
  analysis algorithms that use data provided by the Tuberculosis Portals Program (`TBPortals`_). The tools\
  \ are written in\nPython and provided as an installable Python package. The application programming\
  \ interface (API) is documented in\nSphinx:\nhttps://niaid.github.io/rap_sitkCore\n\n.. image:: https://github.com/niaid/rap_sitkCore/actions/workflows/main.yml/badge.svg?branch=master\n\
  \   :target: https://github.com/niaid/rap_sitkCore/actions/workflows/main.yml\n   :alt: Main Build Status\n\
  \nInstallation\n------------\n\nDependencies are conventionally specified in `pyproject.toml`, and dependent\
  \ packages are installed automatically by\n`pip`_. The package can be directly installed from the Github\
  \ with the following command::\n\n    python -m pip install git+https://github.com/niaid/rap_sitkCore@v0.5.5\n\
  \n\nFor pydicom to support more encodings additional pylibjpeg packages can be install. These dependencies\
  \ are specified as\nextra requirements in the setup.py. Specifying the package a \"rap_sitkcore[pylibjpeg]\"\
  \ will install the extra packages.\n\nGithub Releases\n^^^^^^^^^^^^^^^\n\nThe Python module is also\
  \ distributed as a `wheel`_ binary package. Wheels from the master branch can be manually\ndownloaded\
  \ from `Github Actions`_ in the \"python-package\" artifact.\n\nDownload the latest tagged release from\
  \ the `Github Releases`_ page.\n\n\nContact\n-------\n\nPlease use the `GitHub Issues`_ for support.\n\
  \nAdditionally, we can be emailed at: bioinformatics@niaid.nih.gov Please include \"rap_sitCore\" in\
  \ the subject line.\n\n.. _RAP: https://rap.tbportals.niaid.nih.gov/\n.. _TBPortals: https://tbportals.niaid.nih.gov/\n\
  .. _SimpleITK toolkit: https://simpleitk.org\n.. _pip: https://pip.pypa.io/en/stable/quickstart/\n..\
  \ _Github Actions: https://github.com/niaid/rap_sitkCore/actions?query=branch%3Amaster\n.. _GitHub Issues:\
  \  https://github.com/niaid/rap_sitkCore\n.. _wheel: https://www.python.org/dev/peps/pep-0427/\n.. _Github\
  \ Releases: https://github.com/niaid/rap_sitkCore/release"

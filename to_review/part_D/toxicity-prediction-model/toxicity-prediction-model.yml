readme_excerpt: "\U0001F9EA Toxicity Prediction from Molecular Descriptors\n\nMachine learning models\
  \ for predicting chemical compound toxicity using molecular descriptors.\nThis project analyzes high-dimensional\
  \ chemical data and applies feature selection and ensemble learning methods to classify compounds as\
  \ Toxic or NonToxic.\n\nAuthor: Melanie Ouya\n\n\nDataset: 171 compounds with 1,203 molecular descriptors\n\
  \n\n\U0001F4CA Project Overview\n\nThis project explores the use of machine learning to predict chemical\
  \ toxicity based on structural descriptors.\n\nKey characteristics:\n\nSamples: 171 chemical compounds\n\
  \nFeatures: 1,203 molecular descriptors\n\nTarget: Binary classification (Toxic / NonToxic)\n\nClass\
  \ distribution:\n\nNonToxic: 115\n\nToxic: 56\n\nThe workflow includes data preprocessing, feature selection,\
  \ model training, hyperparameter tuning, and final evaluation.\n\n\n\U0001F52C Dataset Description\n\
  \nEach row in the dataset represents a chemical compound and each column represents a molecular descriptor\
  \ derived from chemical structure.\n\nDescriptor types include:\n\nTopological descriptors – structural\
  \ connectivity and branching\n\nElectronic descriptors – atomic electronic states\n\nPhysicochemical\
  \ properties – molecular weight, polarity, LogP\n\nSpatial descriptors – geometric properties of molecules\n\
  \nThese numerical descriptors provide features that can be used by machine learning algorithms to learn\
  \ toxicity patterns.\n\n\n⚙️ Methodology\n1️⃣ Data Preprocessing\n\nThe dataset was cleaned and prepared\
  \ for machine learning:\n\nTarget variable encoded using label encoding\n\nNonToxic → 0\n\nToxic → 1\n\
  \nRemoval of constant features\n\nFeature scaling using standardization\n\nNo missing values were found\
  \ in the dataset. \n\nToxicity_ML_model\n\n\n2️⃣ Exploratory Data Analysis (EDA)\n\nExploratory analysis\
  \ was performed to understand dataset characteristics.\n\nVisualizations included:\n\nClass distribution\
  \ plots\n\nFeature histograms\n\nCorrelation heatmaps\n\nThe dataset shows moderate class imbalance\
  \ with more NonToxic samples. \n\nToxicity_ML_model\n\n\n3️⃣ Feature Selection\n\nBecause the dataset\
  \ contains over 1,200 descriptors, feature selection was applied to reduce dimensionality.\n\nMethods\
  \ used:\n\nMutual Information\n\nRandom Forest Feature Importance\n\nCombined ranking score\n\nDifferent\
  \ feature counts were tested (10–50 features).\n\nOptimal result:\n20 features produced the best ROC-AUC\
  \ performance. \n\nToxicity_ML_model\n\nHighly correlated features were also removed to reduce redundancy.\n\
  \nFinal feature count: 19\n\n\n4️⃣ Model Development\n\nThree ensemble models were evaluated:\n\nRandom\
  \ Forest\n\nGradient Boosting\n\nExtra Trees\n\nModels were evaluated using 5-fold stratified cross-validation.\n\
  \nResults showed Random Forest performed best overall. \n\nToxicity_ML_model\n\n\n5️⃣ Hyperparameter\
  \ Tuning\n\nThe best model was optimized using GridSearchCV.\n\nParameters tuned included:\n\nNumber\
  \ of estimators\n\nTree depth\n\nMinimum samples per split\n\nBest parameters found:\n\nn_estimators\
  \ = 100\nmax_depth = 5\nmin_samples_split = 5\n\nThis improved model performance. \n\nToxicity_ML_model\n\
  \n\n\U0001F4C8 Final Model Performance\n\nFinal ROC-AUC: 0.70\n\nClassification results:\n\nClass\t\
  Precision\tRecall\tF1-score\nNonToxic\t0.77\t0.83\t0.80\nToxic\t0.60\t0.50\t0.54\n\nOverall accuracy:\
  \ 0.73 \n\nToxicity_ML_model\n\n\n\U0001F4CA Confusion Matrix\n\tPredicted NonToxic\tPredicted Toxic\n\
  Actual NonToxic\t96\t19\nActual Toxic\t28\t28\n\nThe model correctly identified most NonToxic compounds\
  \ but showed moderate difficulty detecting Toxic samples. \n\nToxicity_ML_model\n\n\n\U0001F50D Feature\
  \ Importance\n\nThe most influential molecular descriptors included:\n\nMDEC-23\n\nSHaaCH\n\nATSC8i\n\
  \nMATS3v\n\nZMIC2\n\nThese features relate to molecular connectivity and electronic properties, which\
  \ are known to influence chemical toxicity. \n\nToxicity_ML_model\n\n\n\n\U0001F4C2 Project Structure\n\
  toxicity-prediction-ml\n\n│\n\n├── toxicity_model.ipynb\n\n├── Toxicity_ML_model.pdf\n\n├── README.md\n\
  \n└── data.csv\n\n\n\U0001F9F0 Technologies Used\n\nPython\n\nNumPy\n\nPandas\n\nScikit-learn\n\nMatplotlib\n\
  \nSeaborn\n\nJupyter Notebook\n\n\n\U0001F680 Future Improvement\nPotential improvements include:\n\
  Testing advanced models such as XGBoost or LightGBM\nApplying SMOTE to address class imbalance\nIncreasing\
  \ dataset size\nUsing molecular fingerprint features\n\n\n\U0001F4CC Summary\n\nThis project demonstrates\
  \ how machine learning can be applied to computational toxicology by predicting compound toxicity from\
  \ molecular descriptors.\n\nKey outcomes:\n\nReduced 1,203 features to 19 important descriptors\nAchieved\
  \ ROC-AUC ≈ 0.70\nIdentified key molecular features influencing toxicity\n"

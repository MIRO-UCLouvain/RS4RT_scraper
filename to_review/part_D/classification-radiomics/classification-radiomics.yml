  \ SVM\n\n| Confusion matrix | ROC curves / AUC |\n|---|---|\n| ![Confusion matrix — Pixel SVM (10K)](outputs/RUN_10000/confusion_matrix_pixel_svm.png)\
  \ | ![ROC — Pixel SVM (10K)](outputs/RUN_10000/roc_curves_pixel_svm.png) |\n\n### HOG radiomics SVM\n\

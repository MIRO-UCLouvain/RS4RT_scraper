readme_excerpt: "# NYUAD Hackathon for Social Good in the Arab World: Focusing on Quantum Computing (QC)\
  \ and Aritificial Intelligence (AI)\n## QurAI معالجُ كَ | Hackathon, April 2025\n\nQURAI delivers a\
  \ full pipeline from cancer detection to treatment using patient data and quantum optimization to personalize\
  \ safer, low-toxicity radiotherapy that targets cancer cells and minimize risk over healthy tissue.\
  \ \n\n---\n\n## System Workflow\n\nThe workflow is organized into four main stages:\n\n### 1. Patient\
  \ Cell Data Collection\n- **Input:** Biological cell parameters from patients.\n- **Purpose:** Gather\
  \ necessary data features (e.g., size, texture, perimeter) for diagnosis.\n  \n[Source of Data](https://www.kaggle.com/datasets/uciml/breast-cancer-wisconsin-data\n\
  )\n---\n\n### 2. Cancer Diagnosis Classifier (Machine Learning)\n- **Input:** Patient cell parameters.\n\
  - **Output:** \n  - `1` → Cancer detected (Positive)\n  - `0` → No cancer detected (Healthy)\n- **Description:**\
  \ A trained ML model classifies whether the input data suggests the presence of cancer.\n\n---\n\n###\
  \ 3. Quantum Optimization for Beam Angle Selection\n\n  - Formulate the beam angle selection problem\
  \ as a **QUBO** (Quadratic Unconstrained Binary Optimization) problem.\n  - Solve using **Quantum Approximate\
  \ Optimization Algorithm (QAOA)**.\n  - Classical post-processing to refine and validate the results.\n\
  - **Purpose:** Find the optimal radiation beam angles for therapy, minimizing damage to healthy tissues\
  \ while maximizing impact on the tumor.\n\n---\n\n## Technologies Used\n\n- **Machine Learning:** Cancer\
  \ classification based on patient cell data.\n- **Quantum Computing:** QUBO formulation and QAOA for\
  \ optimization tasks.\n- **Classical Computing:** Post-processing optimization results.\n- **Medical\
  \ Data Processing:** Handling and interpreting biological parameters.\n\n---\n\n## Future Enhancements\n\
  - Expand dataset to include multiple cancer types.\n- Integrate more quantum algorithms for other treatment\
  \ parameters.\n- Improve classical-quantum hybrid processing pipeline.\n- Add explainability modules\
  \ for ML predictions to increase trust and transparency.\n\n---\n\n## \U0001F30D Impact\nSupports UN\
  \ SDGs:  \n- **Good Health and Well-being (3)**   \n- **Industry, Innovation, and Infrastructure (9)**\
  \  \n- **Sustainable Cities and Communities (11)**\n\n\nPresentation link : https://www.canva.com/design/DAGlt6_FInQ/UdR-tRDGpVxuW7hIIK8q5w/edit?utm_content=DAGlt6_FInQ&utm_campaign=designshare&utm_medium=link2&utm_source=sharebutton\n"

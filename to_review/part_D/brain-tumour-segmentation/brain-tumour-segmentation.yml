readme_excerpt: "# \U0001F9E0 Brain Tumour Segmentation using Deep Learning  \n\nThis project uses **U-Net\
  \ architecture** for **automatic brain tumour segmentation** from MRI scans. The model accurately identifies\
  \ and highlights tumour regions by generating **segmentation masks** that align with the ground truth\
  \ labels.  \n\nAchieved an impressive **99.39% tumour-detection accuracy**, demonstrating the power\
  \ of deep learning in medical image analysis.  \n\n---\n\n## \U0001F680 Project Overview  \n\n### \U0001F3AF\
  \ Objective  \nThe primary goal is to build an efficient **image segmentation pipeline** that can automatically\
  \ detect and segment brain tumour regions from MRI images, reducing manual workload and improving diagnostic\
  \ speed.  \n\n### \U0001F9E9 Architecture Used  \n- **Model:** U-Net  \n- **Framework:** PyTorch  \n\
  - **Input:** MRI brain scans (pre-processed and normalized)  \n- **Output:** Binary mask highlighting\
  \ tumour regions  \n\n### ⚙️ Features  \n- Preprocessing of MRI images (resizing, normalization, and\
  \ augmentation)  \n- Encoder-decoder U-Net structure for pixel-level prediction  \n- Dice Loss and Binary\
  \ Cross Entropy for training stability  \n- Visualization of predictions alongside ground truth masks\
  \  \n- Evaluation metrics: **Accuracy, Dice Coefficient**  \n\n---\n\n## \U0001F4CA Dataset  \n- **Source:**\
  \ Publicly available MRI dataset (e.g., BRATS or Kaggle Brain MRI dataset)  \n- **Data Split:** 80%\
  \ Training | 10% Validation | 10% Testing  \n- **Input Size:** 224×224 grayscale MRI images  \n- Each\
  \ image has a corresponding binary mask for tumour region labeling  \n\n---\n\n## \U0001F9E0 Model Training\
  \  \n- **Optimizer:** Adam  \n- **Learning Rate:** 1e-4  \n- **Loss Function:** Dice Loss + BCE  \n\
  - **Epochs:** 50  \n- **Batch Size:** 32  \n- **Framework:** PyTorch  \n\n---\n\n## \U0001F5BC️ Results\
  \  \n\n| Metric | Value |\n|:------:|:------:|\n| Accuracy | **99.39%** |\n| Dice Score | **0.985**\
  \ |\n\n## \U0001F9E9 Sample Results\n\nBelow are example outputs from the model on MRI scans \U0001F447\
  \  \n\n| Input MRI | Ground Truth | Model Prediction |\n|:----------:|:-------------:|:----------------:|\n\
  | ![Input](assets/sample_input.png) | ![Ground Truth](assets/ground_truth.png) | ![Prediction](assets/model_output.png)\
  \ |\n\n\n> The model achieved near-perfect segmentation on test MRI scans, successfully identifying\
  \ tumour boundaries even in challenging cases.\n\n## \U0001F9E9 How It Works  \n\n1. Load MRI dataset\
  \ and preprocess images.  \n2. Feed images into the **U-Net** model.  \n3. Model predicts the segmentation\
  \ mask for each MRI slice.  \n4. Compare prediction with ground truth using Dice and Accuracy metrics.\
  \  \n5. Visualize results — tumour region highlighted in the output mask.  \n\n---\n\n## \U0001F512\

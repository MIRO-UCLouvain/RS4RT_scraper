readme_excerpt: "# Video Demo\r\nhttps://drive.google.com/file/d/1d4Whg-dAWV9qLctL4vKbIxLKz2PE2s95/view?usp=sharing\r\
  \n\r\n# Group project board\r\nhttps://github.com/orgs/uwf-capstone-fa2025/projects/2\r\n\r\n# Publicly\
  \ hosted project\r\nhttps://hosted-vmat-vulnerability-management-production-b311.up.railway.app/login\r\
  \n\r\nusername: admin\r\npassword: password\r\n\r\nor you can create your own\r\n\r\n# Capstone-VMAT\r\
  \nA vulnerability management tool\r\n\r\n# Project Setup Instructions\r\n\r\n## Prerequisites:\r\n1.\
  \ mySQL installed\r\n2. nodejs installed\r\n\r\n## Backend Installation\r\n\r\n1. Navigate to the backend\
  \ directory:\r\n   ```bash\r\n   cd backend\r\n   ```\r\n2. (Optional) Create and activate a virtual\
  \ environment:\r\n   ```bash\r\n   python -m venv venv\r\n   source venv/Scripts/activate  # On Windows\r\
  \n   ```\r\n3. Install dependencies:\r\n   ```bash\r\n   pip install -r requirements.txt\r\n   ```\r\
  \n\r\n4. Create a `.env` file in the backend directory with your database URI:\r\n   ```env\r\n   DATABASE_URI=mysql+mysqlconnector://USERNAME_HERE:PASSWORD_HERE@localhost:PORT_HERE/vmat_db\r\
  \n   NVD_API_KEY=KEY_GOES_HERE\r\n   ```\r\n5. Run the backend server while still cd backend:\r\n  \
  \ ```bash\r\n   python server.py\r\n   ```\r\n6. Database Setup and Maintenance\r\n   ```bash\r\n  \
  \ python db_manager.py\r\n   ```\r\n   This script will:\r\n   - Initialize the database tables with\
  \ proper constraints\r\n   - Create default admin user if it doesn't exist\r\n   - Remove any duplicate\
  \ vulnerabilities\r\n   - Verify database integrity\r\n\r\n   ## Frontend (React)\r\n\r\n1. Navigate\
  \ to the frontend directory:\r\n   ```bash\r\n   cd frontend\r\n   ```\r\n2. Install dependencies:\r\
  \n   ```bash\r\n   npm install\r\n   ```\r\n3. Create a `.env` file in the frontend directory with this\
  \ in it:\r\n   ```env\r\n   DANGEROUSLY_DISABLE_HOST_CHECK=true\r\n   WDS_SOCKET_HOST=localhost\r\n\
  \   ```\r\n\r\n\r\n4. Start the frontend development server:\r\n   ```bash\r\n   npm start\r\n   ```\r\
  \n\r\n   ### Logging In\r\n   Running the python db_manager.py file will automatically create an account\
  \ with the username and password below:\r\n   ```\r\n   admin\r\n   password\r\n   ```\r\n\r\n   ###\
  \ Adding Data\r\n   1. After logging in, navigate to the Vulnerability Catalog. \r\n   2. Select the\
  \ Import CVEs button.\r\n   3. Attach the Capstone Sample Input CSV.csv file.\r\n\r\n# How to set up\
  \ testing\r\n### Backend Testing\r\n\r\nThe project includes a comprehensive test suite for the backend\
  \ API, services, and data access layer.\r\n\r\n#### Running Backend Tests\r\n\r\nTo run the backend\
  \ test suite, navigate to the `backend` directory and use the following command:\r\n\r\n```bash\r\n\
  python -m pytest tests/ -v --cov=app --cov-report=html --cov-report=term\r\n```\r\n\r\nThis command\
  \ will run all tests, provide verbose output, and generate a coverage report. The excluded external\
  \ API calls from the testing.\r\n\r\n#### Test Structure\r\n- **Unit Tests**: `/tests/unit/` - Test\
  \ individual models, DAOs, and services\r\n- **Integration Tests**: `/tests/integration/` - Test API\
  \ endpoints and cross-component functionality\r\n- **Test Database**: Tests use an in-memory SQLite\
  \ database for isolation and speed\r\n\r\n#### Test Coverage\r\nThe test suite covers:\r\n- User authentication\
  \ and registration\r\n- Password hashing and verification\r\n- Database operations (CRUD)\r\n- API endpoint\
  \ functionality\r\n- Service layer business logic\r\n\r\n### Frontend Testing\r\n\r\nTo run the frontend\
  \ unit and component tests, navigate to the `frontend` directory and use the following command:\r\n\r\
  \n```bash\r\nnpm test -- --coverage --watchAll=false\r\n```\r\nThis will run the Jest test suite and\
  \ generate a coverage report.\r\n\r\n### E2E Testing \r\n\r\nTo run the end-to-end tests with Cypress,\
  \ use the following command from the root directory:\r\n```bash\r\nnpm install\r\nnpx cypress run\r\n\
  ```\r\n\r\n\r\n---\r\n\r\n**Note:**\r\n- Make sure MySQL is running and accessible with the credentials\
  \ in your `.env` file.\r\n- Do not commit your `.env` file to version control.\r\n\r\n\r\n## Ownership\
  \ & Usage\r\nContributors may reuse the code they personally wrote.  \r\nHowever, any code authored\
  \ by Alexander Nunn may not be commercialized or redistributed without his written consent.\r\n\r\n\
  See the LICENSE file for full details."

readme_excerpt: "# A Radiomics-Driven Stacking Model for Early N-Stage Prediction in Non Small Cell Lung\
  \ Cancer\r\n\r\n## 1. Project Description\r\n\r\nWe provide the implementation code for the radiomics-based\
  \ classification framework from our study titled:\r\n\r\n\"A Radiomics-Driven Stacking Model for Early\
  \ N-Stage Prediction in Non Small Cell Lung Cancer\"\r\n\r\nThis project encompasses radiomic feature\
  \ extraction, feature selection, and stacking ensemble classification for N-Stage in Non-Small Cell\
  \ Lung Cancer (NSCLC) using CT images, employing a nested cross-validation approach to ensure robust\
  \ model evaluation.\r\n\r\n---\r\n\r\n## 2. Dataset Information\r\n\r\n### Image Dataset\r\n\r\nImage\
  \ data were obtained from The Cancer Imaging Archive (TCIA):\r\n\r\nTCGA-LUAD Collection  \r\n[https://doi.org/10.7937/K9/TCIA.2016.JGNIHEP5](https://doi.org/10.7937/K9/TCIA.2016.JGNIHEP5)\r\
  \n\r\nTCGA-LUSC Collection  \r\n[https://doi.org/10.7937/K9/TCIA.2016.TYGKKFMQ](https://doi.org/10.7937/K9/TCIA.2016.TYGKKFMQ)\r\
  \n\r\nCPTAC-LUAD Collection  \r\n[https://doi.org/10.7937/k9/tcia.2018.pat12tbs](https://doi.org/10.7937/k9/tcia.2018.pat12tbs)\r\
  \n\r\nCPTAC-LSCC Collection  \r\n[https://doi.org/10.7937/K9/TCIA.2018.6EMUB5L2](https://doi.org/10.7937/K9/TCIA.2018.6EMUB5L2)\r\
  \n\r\nThe dataset contains CT images of Non-Small Cell Lung Cancer (NSCLC) cases, including lung adenocarcinoma\
  \ and lung squamous cell carcinoma, sourced from The Cancer Genome Atlas (TCGA) project\r\n\r\n### Clinical\
  \ / Metadata Information\r\n\r\nClinical metadata and phenotype information were obtained from repository:\r\
  \n\r\nXenabrowser:\r\n\r\nTCGA-LUAD Collection\r\n[https://xenabrowser.net/datapages/?cohort=GDC%20TCGA%20Lung%20Adenocarcinoma%20(LUAD)&removeHub=https%3A%2F%2Fxena.treehouse.gi.ucsc.edu%3A443](<https://xenabrowser.net/datapages/?cohort=GDC%20TCGA%20Lung%20Adenocarcinoma%20(LUAD)&removeHub=https%3A%2F%2Fxena.treehouse.gi.ucsc.edu%3A443>)\r\
  \n\r\nTCGA-LUSC Collection\r\n[https://xenabrowser.net/datapages/?cohort=GDC%20TCGA%20Lung%20Squamous%20Cell%20Carcinoma%20(LUSC)&removeHub=https%3A%2F%2Fxena.treehouse.gi.ucsc.edu%3A443](<https://xenabrowser.net/datapages/?cohort=GDC%20TCGA%20Lung%20Squamous%20Cell%20Carcinoma%20(LUSC)&removeHub=https%3A%2F%2Fxena.treehouse.gi.ucsc.edu%3A443>)\r\
  \n\r\nNCI Proteomic Data Commons\r\n\r\nCPTAC-LUAD Collection  \r\n[https://pdc.cancer.gov/pdc/browse/filters/pdc_study_id:PDC000564%7CPDC000563%7CPDC000492%7CPDC000491%7CPDC000490%7CPDC000489%7CPDC000224%7CPDC000220%7CPDC000219%7CPDC000153%7CPDC000149%7CPDC000627](https://pdc.cancer.gov/pdc/browse/filters/pdc_study_id:PDC000564%7CPDC000563%7CPDC000492%7CPDC000491%7CPDC000490%7CPDC000489%7CPDC000224%7CPDC000220%7CPDC000219%7CPDC000153%7CPDC000149%7CPDC000627)\r\
  \n\r\nCPTAC-LSCC Collection  \r\n[https://proteomic.datacommons.cancer.gov/pdc/study/PDC000234](https://proteomic.datacommons.cancer.gov/pdc/study/PDC000234)\r\
  \n\r\n---\r\n\r\n## 3. Code Description\r\n\r\n| File Name                           | Description \
  \                                                                                                |\r\
  \n| ----------------------------------- | -----------------------------------------------------------------------------------------------------------\
  \ |\r\n| convert_dicom_to_nifti.ipynb        | Converts raw DICOM medical images into NIfTI format \
  \                                                        |\r\n| matching_image_with_phenotype.ipynb\
  \ | Integrates medical imaging data with patient clinical phenotypes                               \
  \             |\r\n| pre-processing.ipynb                | Handles image pre-processing, radiomics feature\
  \ extraction, and feature selection                           |\r\n| segmentation-totalsegmentator.ipynb\
  \ | Performs automated anatomical/organ segmentation on medical images using TotalSegmentator      \
  \             |\r\n| Single_Code.ipnyb                   | Trains and evaluates individual (base) machine\
  \ learning models                                              |\r\n| Stacking_Code.ipnyb          \
  \       | Trains and evaluates an ensemble machine learning model using the stacking method        \
  \                   |\r\n| SHAP_stacking_Code.ipnyb            | Applies SHAP (SHapley Additive exPlanations)\
  \ to interpret the stacking model and analyze feature importance |\r\n\r\n---\r\n\r\n## 4. Usage Instructions\r\
  \n\r\n1. Load Datasets: Downlaod from source in Dataset Information\r\n\r\n2. Data Conversion (Optional):\r\
  \n   Use convert_dicom_to_nifti.ipynb to convert raw DICOM medical images into NIfTI format. (Note:\
  \ Skip this step if you are already using the pre-converted NIfTI dataset from Step 1).\r\n\r\n3. Segmentation:\r\
  \n   Use segmentation-totalsegmentator.ipynb to perform automated anatomical/organ segmentation on the\
  \ NIfTI images using TotalSegmentator.\r\n\r\n4. Data Integration:\r\n   Use matching_image_with_phenotype.ipynb\
  \ to integrate the medical imaging data with the patient clinical phenotypes from the Metadata.\r\n\r\
  \n5. Pre-processing & Feature Extraction:\r\n   Use pre-processing.ipynb and use the integrated data\
  \ from the previous steps to handle image pre-processing, extract radiomics features, and perform feature\
  \ selection.\r\n\r\n6. Base Model Classification:\r\n   Use Single_Code.ipynb using the extracted features\
  \ file from Step 5 to train and evaluate individual (base) machine learning models.\r\n\r\n7. Stacking\
  \ Model Classification:\r\n   Use Stacking_Code.ipynb to train and evaluate an ensemble machine learning\
  \ model using the stacking method based on the outputs from the base models.\r\n\r\n8. Model Interpretation:\r\
  \n   Use SHAP_stacking_Code.ipynb to apply SHAP (SHapley Additive exPlanations) to interpret the stacking\
  \ model's decisions and analyze feature importance.\r\n\r\n---\r\n\r\n## 5. Requirements\r\n\r\nThe\
  \ implementation was developed using:\r\n\r\n1. IDE: Visual Studio Code, Kaggle, and Microsoft Azure\r\
  \n2. Programming Language: Python 3.12.\r\n\r\nRequired libraries include:\r\n\r\n- dicom2nifti\r\n\
  - pyradiomics\r\n- numpy\r\n- pandas\r\n- featureextractor\r\n- TotalSegmentator\r\n- nnunetv2\r\n-\
  \ nibabel\r\n- imbalanced-learn\r\n- scipy\r\n- scikit-learn\r\n- matplotlib\r\n- seaborn\r\n- SimpleITK\r\
  \n- nibabel\r\n- pymrmr\r\n- deap\r\n- openpyxl\r\n- tqdm\r\n- scikeras\r\n- tensorflow\r\n- xgboost\r\
  \n\r\nInstall dependencies using:\r\n\r\npip install -r requirements.txt\r\n\r\n---\r\n\r\n## 6. Citation\r\
  \n\r\nIf you use this repository or dataset, please cite the associated manuscript and the following\
  \ dataset references:\r\n\r\n### TCGA-LUAD Collection\r\n\r\nAlbertina, B. et al.\r\nTCGA-LUAD Collection,\
  \ The Cancer Imaging Archive (TCIA).\r\n[https://doi.org/10.7937/K9/TCIA.2016.JGNIHEP5](https://doi.org/10.7937/K9/TCIA.2016.JGNIHEP5)\r\
  \n\r\n### TCGA-LUSC Collection\r\n\r\nTCGA-LUSC Collection, The Cancer Imaging Archive (TCIA).\r\n[https://doi.org/10.7937/K9/TCIA.2016.TYGKKFMQ](https://doi.org/10.7937/K9/TCIA.2016.TYGKKFMQ)\r\
  \n\r\n### CPTAC-LUAD Collection\r\n\r\nCPTAC-LUAD Collection, The Cancer Imaging Archive (TCIA).\r\n\
  [https://doi.org/10.7937/k9/tcia.2018.pat12tbs](https://doi.org/10.7937/k9/tcia.2018.pat12tbs)\r\n\r\
  \n### CPTAC-LSCC Collection\r\n\r\nCPTAC-LSCC Collection, The Cancer Imaging Archive (TCIA).\r\n[https://doi.org/10.7937/K9/TCIA.2018.6EMUB5L2](https://doi.org/10.7937/K9/TCIA.2018.6EMUB5L2)\r\
  \n\r\n### XenaBrowser\r\n\r\nVisualizing and interpreting cancer genomics data.\r\n[https://doi.org/10.1038/s41587-020-0546-8](https://doi.org/10.1038/s41587-020-0546-8)\r\
  \n\r\n### PyRadiomics\r\n\r\nvan Griethuysen JJM, et al.  \r\nComputational Radiomics System to Decode\
  \ the Radiographic Phenotype.  \r\nCancer Research. 2017.  \r\n[https://doi.org/10.1158/0008-5472.CAN-17-0339](https://doi.org/10.1158/0008-5472.CAN-17-0339)\r\
  \n\r\n---\r\n\r\n## 7. License\r\n\r\nThis repository is intended for academic and research purposes\
  \ only.\r\n\r\n---\r\n\r\n## 8. Code Repository and DOI\r\n\r\nGitHub Repository:\r\n[https://github.com/PandauAji/NSCLC_Research_Code/)\r\

readme_excerpt: "# ComplexityCalc\n\nVMAT modulation complexity index calculator based on https://github.com/victorgabr/ApertureComplexity\n\
  \n![ComplexityCalc](https://github.com/Jothy/ComplexityCalc/blob/master/Images/ComplexityCalc_Screenshot.png)\n\
  \n# Installation\n1. If you already have latest Anaconda python (python version>=3.8), you might have\
  \ most of the libraries to run it. If not downlaod individual edition of [Anaconda](https://www.anaconda.com/products/individual/)\
  \ python distribution for Windows (should also work on linux & mac but I focus only on Windows here).\n\
  \n2. Downlaod ComplexityCalc source code from [GitHub](https://github.com/Jothy/ComplexityCalc.git)\
  \ or if you have git on your system [git pull](https://github.com/Jothy/ComplexityCalc.git)\n\n3. Go\
  \ to cmd window and type *\"pip install streamlit\"*. This should install the [streamlit](https://streamlit.io/)\
  \ library required to deploy apps in the web.\n\n4. Go to the ComplexityCalc folder adn edit the ComplexityCalc.bat\
  \ file. Modify this line *D:\\Projects\\ComplexityCalc/Main.py* in the file to point to Main.py in your\
  \ current ComplexityCalc folder.\n\n# Usage \n1. You are all done. Run the ComplexityCalc.bat file and\
  \ that should open a winodws in your web browser. For the first time it will ask for email, just press\
  \ enter. Old internet explorer is not supported by Streamlit, so set Chrome or Edge as your default\
  \ browser or open a tab in Chrome or Edge and type the ip adn port shown in the command window that\
  \ opens when running the .bat file.\n\n2. Usage is pretty intutive. Open any VMAT or IMRT DICOM RT paln\
  \ file by clicking the \"Browse files\" button and the rest is done for you.\n\n3. You can switch between\
  \ dark adn light theme by click the wrench icon on the top-right corner in the browser.\n\n# Bug report\
  \ & feature request\nYou can directly rreport bugs and request features by clicking the wrench icon\
  \ on the page and clicking \"Report a bug\"\n\n# Contact\n* **Jothy Selvaraj** - *Email: Jothybasu@gmail.com*\n\
  \n## Acknowledgments\n https://github.com/victorgabr/ApertureComplexity\n \n University of Michigan,\
  \ Radiation Oncology https://github.com/umro/Complexity\n \n\n## Related publications\n1. [Predicting\
  \ deliverability of volumetric-modulated arc therapy (VMAT) plans using aperture complexity analysis,\
  \ JACMP,2016,17(4),124-131](https://pubmed.ncbi.nlm.nih.gov/27455504/)\n\n\n"

readme_excerpt: "# <div align=center> [SegRap2023](https://segrap2023.grand-challenge.org/)</div>\n\n\
  ## 1. Totorial for Algorithm Docker Image ([official guideline of grand challenge](https://grand-challenge.org/documentation/test-and-deploy-your-container/))\n\
  ### 1.1 Important input and output\n- For task1, the input dir is `/input/images/head-neck-ct/` (non-contrast-ct\
  \ images) and `/input/images/head-neck-contrast-enhanced-ct/` (contrast-ct images). The output dir is\
  \ `/output/images/head-neck-segmentation/`. Note that the final prediction has to be a 4D .mha file,\
  \ which array shape is [45, *image_shape]. An example code and output is shown as `Docker_tutorial/stacked_results_to_4d_mha.py`\
  \ and `Docker_tutorial/oars_output_example.mha`.\n\n- For task2, the dir is `/input/images/head-neck-ct/`\
  \ (non-contrast-ct images) and `/input/images/head-neck-contrast-enhanced-ct/` (contrast-ct images).\
  \ The output dir is `/output/images/gross-tumor-volume-segmentation/`. Note that the final prediction\
  \ has to be a 4D .mha file, which array shape is [2, *image_shape]. An example code and output is shown\
  \ as `Docker_tutorial/stacked_results_to_4d_mha.py` and `Docker_tutorial/gtvs_output_example.mha`.\n\
  \n### 1.2 Algorithm examples based on nnUNet\nWe provide two algorithm examples based on nnUNet, which\
  \ is only the baseline for two tasks. If your method is based on nnUNet, you can follow the example\
  \ to generate predictions and run `sh export.sh` to generate an Algorithm Container Image in tar.gz\
  \ format. The details about loading input, generating predictions, and saving output can be seen in\
  \ the `process.py`. \n\nIn addition, you can download the example data and model weight from [GoogleDrive](https://drive.google.com/file/d/17hJz9hQ1sajsW0aEgmiydvL9bVchqipr/view?usp=sharing)\
  \ and [BaiduNetDisk](https://pan.baidu.com/s/1lwGENM9R7z3791FxQoy7fQ?pwd=2023) to the folder `images`\
  \ and  `weight`, respectively. Before submitting, you can test the docker image on your local machine\
  \ by running `sh test.sh` or `sudo sh test.sh`, we show an [example output](https://github.com/HiLab-git/SegRap2023/blob/main/Docker_tutorial/outputs.png)\
  \ on our ubuntu22.04 (one 3090 GPU).\n\n#### 1.2.1 How to test the container locally?\n1. Parepare your\
  \ images and weight as following format\n    - SegRap2023_task1_OARs_nnUNet_Example\n        - images\n\
  \            - images\n                - head-neck-contrast-enhanced-ct\n                    - segrap_0001.mha\n\
  \                - head-neck-ct\n                    - segrap_0001.mha\n        - weight\n         \
  \   - fold_0\n                - model_final_checkpoint.model\n                - model_final_checkpoint.model.pkl\n\
  \                - plans.pkl\n\n2. How about the output?\n    - You can check out if there are predictions\
  \ in the output folder `/output/images/head-neck-segmentation` or `/output/images/gross-tumor-volume-segmentation`\
  \ that are corresponded to the input images. Run the following command will show the files in the output\
  \ folder.\n        ```bash\n        docker run --rm \\\n            -v segrap2023_segmentationcontainer-output-$VOLUME_SUFFIX:/output/\
  \ \\\n            python:3.10-slim ls -al /output/images/head-neck-segmentation\n        ```\n    -\
  \ The `test` folder is just an empty folder which hasn't been used in the docker image, so you can ignore\
  \ or remove it.\n\n    - You can ignore the error `No such file or directory: '/output/results.json'`\
  \ when you run the docker locally.\n      \n### 1.3 Algorithm examples based on others.\nIf your method\
  \ is not based on nnUNet, you can modify the function of `predict()` in `process.py` and other corresponding\
  \ parts for inference. It's easy to read and modify, but please ensure the format of the output file\
  \ (a 4D .mha, the right mapping between the index of 4D file and OARs or GTVs.). We provided an example\
  \ (`Docker_tutorial/stacked_results_to_4d_mha.py`) to stack individual oars/gtvs predictions of a patient\
  \ into a required 4d .mha files.\n\n### 1.4 Q&A.\nIf you meet any questions when submitting your docker\
  \ images, you can email us (`luoxd1996@gmail.com` or `fujia98914@gmail.com`), or post [the issue](https://github.com/HiLab-git/SegRap2023/issues)\
  \ or discuss it in [the forum](https://grand-challenge.org/forums/forum/segmentation-of-organs-at-risk-and-gross-tumor-volume-of-npc-699/)\
  \ at any time.\n\n## 2. How to submit the algorithm?\n1. If you have not created your algorithm, you\
  \ can go to https://segrap2023.grand-challenge.org/evaluation/challenge/algorithms/create/ to create\
  \ an algorithm with 30GB memory.\n\n2. Upload your Algorithm Container Image, then wait for the container\
  \ to be active.\n\n3. Go to the [SegRap2023 submit website](https://segrap2023.grand-challenge.org/evaluation/challenge/submissions/create/),\
  \ choose the task and submit your Algorithm Image.\n\n4. After submitting, you can wait for the update\
  \ of [Leaderboards](https://segrap2023.grand-challenge.org/evaluation/challenge/leaderboard/).\n\n\n\
  ## 3. Tutorial for SegRap2023 Challenge\n\nThis repository provides tutorial code for Segmentation of\
  \ Organs-at-Risk and Gross Tumor Volume of NPC for Radiotherapy Planning (SegRap2023) Challenge. Our\
  \ code is based on [PyMIC](https://github.com/HiLab-git/PyMIC), a pytorch-based toolkit for medical\
  \ image computing with deep learning, that is lightweight and easy to use. \n\n### Requirements\nThis\
  \ code depends on [Pytorch](https://pytorch.org), [PyMIC](https://github.com/HiLab-git/PyMIC).\nTo install\
  \ PyMIC and GeodisTK, run:\n```\npip install PYMIC\n``` \n\n\n### Segmentation model based on PyMIC\n\
  \n\n#### Dataset and Preprocessing\n- Download the dataset from [SegRap2023](https://segrap2023.grand-challenge.org/)\
  \ and put the dataset in the `data_dir/raw_data`.\n\n- For data preprocessing, run:\n    ```bash\n \
  \   python Tutorial/preprocessing.py\n    ```\n    This will crop the images with the maximal nonzero\
  \ bounding box, and the cropped results are normalized based on the intensity properties of all training\
  \ images. By setting the `args.task` to `OARs` and `GTVs`, we can get the preprocessed images and labels\
  \ for two tasks that are saved in `data_dir/Task001_OARs_preprocess` and `data_dir/Task002_GTVs_preprocess`,\
  \ respectively.\n\n#### Training\n- Run the following command to create csv files for training, validation,\
  \ and testing. The csv files will be saved to `config/data_OARs` and `config/data_GTVs`.\n    ```bash\n\
  \    python Tutorial/write_csv_files.py\n    ```\n    \n- Run the following command for training and\
  \ validation. The segmentation model will be saved in `model/unet3d_OARs` and `model/unet3d_GTVs`, respectively.\n\
  \    ```bash\n    pymic_train Tutorial/config/unet3d_OARs.cfg\n    pymic_train Tutorial/config/unet3d_GTVs.cfg\n\
  \    ```\n    Note that you can modify the settings in .cfg file to get better segmentation results,\
  \ such as RandomCrop_output_size, loss_class_weight, etc.\n\n#### Testing\n- After training, run the\
  \ following command, we can get the performance on the testing set, and the predictions of testing data\
  \ will be saved in `result/unet3d_OARs` and `result/unet3d_GTVs`.\n    ```bash\n    pymic_test Tutorial/config/unet3d_OARs.cfg\n\
  \    pymic_test Tutorial/config/unet3d_GTVs.cfg\n    ```\n\n#### Postprocessing\n- Run the following\
  \ command to obtain the final predictions, which are saved in `result/unet3d_OARs_post` and `result/unet3d_GTVs_post`.\n\
  \    ```bash\n    python Tutorial/postprocessing.py\n    ```\n\n### Segmentation model based on nnUNet\n\
  #### Postprocessing\n- Following `Tutorial/nnunet_baseline.ipynb`, you can obtain the final predictions\
  \ based on the outputs from [nnUNet](https://github.com/MIC-DKFZ/nnUNet). In addition, you also can\
  \ use `Tutorial/preprocessing.py` for preprocessing firstly (details as mentioned in the above tutorial)\
  \ and then train networks using `Tutorial/nnunet_baseline.ipynb`.\n\n\n## 4. Evaluation for SegRap2023\
  \ Challenge\nRun following command to get the quantitative evaluation results.\n```bash\npython Eval/SegRap_Task001_DSC_NSD_Eval.py\n\
  python Eval/SegRap_Task002_DSC_NSD_Eval.py\n```\n## 5. Code of Top Teams for SegRap2023 Challenge\n\
  The code of top teams is available at: [SegRap2023_code_from_winning_teams](https://drive.google.com/file/d/1uI7idYOF87G6Bjx1tes_VSteXpbrT3kD/view?usp=drive_link).\n\
  \n### Reference\n\n```\n@article{luo2025segrap2023,\n  title={Segrap2023: A benchmark of organs-at-risk\
  \ and gross tumor volume segmentation for radiotherapy planning of nasopharyngeal carcinoma},\n  author={Luo,\
  \ Xiangde and Fu, Jia and Zhong, Yunxin and Liu, Shuolin and Han, Bing and Astaraki, Mehdi and Bendazzoli,\
  \ Simone and Toma-Dasu, Iuliana and Ye, Yiwen and Chen, Ziyang and others},\n  journal={Medical Image\
  \ Analysis},\n  volume={101},\n  pages={103447},\n  year={2025},\n  publisher={Elsevier}\n}\n```\n"

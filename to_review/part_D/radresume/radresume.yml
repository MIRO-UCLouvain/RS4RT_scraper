readme_excerpt: "# \U0001F9EC RadResume: RCR Radiotherapy Interruption and dose compensation Calculator\n\
  \n\n![Streamlit](https://img.shields.io/badge/Streamlit-FF4B4B?style=for-the-badge&logo=Streamlit&logoColor=white)\n\
  ![Python](https://img.shields.io/badge/Python-3776AB?style=for-the-badge&logo=python&logoColor=white)\n\
  <!--![Medical Physics](https://img.shields.io/badge/Medical_Physics-Clinical_Tool-01579b?style=for-the-badge)\
  \ -->\n\n\n\n**RadResume** is a clinical-grade Streamlit application designed for Medical Physicists\
  \ and Radiation Oncologists. It calculates biological compensation for radiotherapy interruptions based\
  \ strictly on the **Royal College of Radiologists (RCR) \"The timely delivery of radical radiotherapy:\
  \ guidelines for the management of unscheduled treatment interruptions Fourth edition\" (2019)**.\n\
  [https://www.rcr.ac.uk/our-services/all-our-publications/clinical-oncology-publications/timely-delivery-of-radical-radiotherapy-guidelines-for-the-management-of-unscheduled-treatment-interruptions-fourth-edition/]\n\
  \nUnscheduled interruptions in radical radiotherapy allow tumour cells to repopulate, increasing the\
  \ risk of local recurrence. RadResume helps clinical teams calculate the compensation needed — additional\
  \ fractions, adjusted dose, or accelerated scheduling — to recover the prescribed biological dose when\
  \ treatment is delayed. Based on the RCR 4th Edition guidelines (2019).\"\n\n\U0001F680 **Live App Access\
  \ [https://radresume.streamlit.app/]**\n\n## \U0001F31F Key Features\n\n*   **Strict RCR Compliance:**\
  \ Uses the exact mathematical formulations from RCR Appendix B (Equation B), properly handling Overall\
  \ Treatment Time (OTT) extensions, $T_{delay}$, and tumor repopulation ($K$ factors).\n*   **Suggested\
  \ Clinical Presets:** Includes a comprehensive database of predefined radiobiological parameters (Category,\
  \ $\\alpha/\\beta$, $K$, $T_{delay}$) for common treatment sites (e.g., Head & Neck, Prostate, Gastrointestinal,\
  \ Palliative).\n*   **Hierarchical Action Plans:** Suggests compensations following the clinical priority\
  \ established by the RCR:\n    1.  Linac Transfer / Weekend Treatments.\n    2.  BID (Twice-a-day) Scheduling.\n\
  \    3.  Exact Dose per Fraction Adjustment.\n    4.  Adding Extra Fractions (Standard Extension).\n\
  *   **Normal Tissue Tolerance (BED3):** Automatically calculates and monitors the Biological Effective\
  \ Dose for late-responding normal tissues, issuing clinical warnings if the proposed compensation exceeds\
  \ the original prescription budget by >5%.\n*   **Clinical Governance (IR(ME)R 2017):** Generates an\
  \ exportable `.txt` Audit Record detailing all calculation parameters, biological delays, and clinical\
  \ decisions for departmental filing and compliance.\n\n## \U0001F680 Installation & Setup\n\nTo run\
  \ RadResume locally, you need Python installed on your system. Follow these steps:\n\n1. **Clone the\
  \ repository:**\n   ```bash\n    git clone [https://github.com/YourUsername/RadResume.git](https://github.com/YourUsername/RadResume.git)\n\
  \    cd RadResume\n2. **Create a virtual environment (Recommended):**\n   ```bash\n    python -m venv\
  \ venv\n    source venv/bin/activate  # On Windows use: venv\\Scripts\\activate\n3. **Install the required\
  \ dependencies:**\n    ```bash\n    pip install streamlit\n4. **Run the application:**\n    ```bash\n\
  \    streamlit run Interruptions.py\n   \n## \U0001F4BB How to Use\n1. **Select Protocol:** Open the\
  \ left sidebar and select the \"Treatment Site / Intent\". The app will automatically load the RCR-recommended\
  \ radiobiological parameters. You can override these in the \"Advanced Radiobiology Parameters\" expander\
  \ if clinically justified.\n\n2. **Input Original Prescription:** Enter the total prescribed dose and\
  \ the total number of fractions.\n\n3. **Set Current Status:** Input how many fractions have already\
  \ been delivered before the interruption.\n\n4. **Define the Gap:** Enter the date of the last delivered\
  \ fraction and the expected restart date. Configure your department's standard rest days (e.g., weekends)\
  \ and holidays.\n\n5. **Calculate:** Click the \"CALCULATE NEW PRESCRIPTION\" button to view the precise\
  \ OTT extension, BED metrics, and the hierarchical compensation tabs.\n\n6. **Audit & Export:** Review\
  \ the internal QA panel if needed, and download the Audit Record for your clinical governance files.\n\
  \n\n## ⚠️ Legal Disclaimer & Terms of Use\nNotice: This software is intended for educational and research\
  \ purposes only. It is not a medical device and has not been cleared by any regulatory body (e.g., FDA,\
  \ CE, MHRA) for clinical use.\n\n* **Responsibility:** The user assumes all responsibility for the interpretation\
  \ and clinical application of the results provided by this tool.\n* **Verification:** Calculations must\
  \ be independently verified by a certified Medical Physicist or Radiation Oncologist before making any\
  \ clinical decisions.\n* **Liability:** The developers of RadResume shall not be held liable for any\
  \ damages, clinical errors, or consequences arising from the use or misuse of this software.\n* **Compliance:**\
  \ Any change to fractionation or dose schedules must be authorized and justified by the prescribing\
  \ practitioner, in accordance with local regulations (e.g., IR(ME)R 2017 in the UK).\n\n**LinkedIn:**\
  \ Luis Fernando Paredes, [https://www.linkedin.com/in/lfparedes1/].\n\nClinical Medical Physicist\n"

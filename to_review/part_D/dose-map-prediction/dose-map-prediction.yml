readme_excerpt: "Python code for the preprint article \"Prediction of Radiologic Outcome-Optimized Dose\
  \ Plans and Post-Treatment Magnetic Resonance Images: A Proof-of-Concept Study in Breast Cancer Brain\
  \ Metastases Treated with Stereotactic Radiosurgery\" \n\n\nContact: shraddha.pandey@pennmedicine.upenn.edu\
  \ \nCorresponding:Natarajan.Raghunand@moffitt.org\n\n![Picture13](https://github.com/pandeshraddha/Dose-Map-Prediction/assets/12835584/ec797a6c-a81b-4848-8058-d3faac97e6d5)\n\
  \n![Picture14](https://github.com/pandeshraddha/Dose-Map-Prediction/assets/12835584/32742965-9881-4608-886a-fa350cb25dd5)\n\
  \n\nThe dataset for dose map prediction is available upon request. Please get in touch with the corresponding\
  \ author for access to the dataset.\n\nThe work focuses on directly predicting\nthe optimum Radiation\
  \ Therapy (RT) dose maps from the pre-RT mpMRI. It is now well\nestablished that the tumor volume comprises\
  \ several different microenvironments. Hence,\npredicting a voxel-wise dose map from the pre-RT and\
  \ prescribed/desirable post-RT mpMRI\nwill yield better control of radionecrosis-related toxicity. Furthermore,\
  \ it is also important\nfor the radiation oncologist to simulate voxel-wise radiologic outcomes of specific\
  \ RT dose\nmap prescriptions on post-RT mpMRI. To accomplish these two tasks, end-to-end deep\nneural\
  \ networks are trained. The forward model is used to predict post-RT changes on\nmpMRI using pre-RT\
  \ mpMRI when administered with the radiation dose map. A variant\nof the pix2pix GAN network is trained\
  \ to predict post-RT ADC maps, T1wCE, T2w, T1w,\nFLAIR MRI from pre-RT mpMRI and the radiation dose\
  \ maps. The results of the forward\nmodel are validated by identifying the tissue type maps like blood\
  \ volume, gray matter,\nwhite matter, edema, non-enhancing tumor, contrast enhancing tumor, hemorrhage,\
  \ fluid\nand comparing them with the GT maps. Further, the quantitative validation is carried out\n\
  by comparing the percentage of volumes of these tissue type maps from pre-RT, post-RT\nand predicted\
  \ post-RT mpMRI. The results of the forward model are also tested with the\nsimulated dose maps and\
  \ comparing the changes on the predicted post-RT ADC maps that\nare mechanistically relatable to voxel-level\
  \ tumor response to therapies. Next, a variant of\npix2pix GAN is trained to predict the radiation dose\
  \ maps from the pre-RT ADC maps and\nthe prescribed post-RT ADC maps. This is called as the inverse\
  \ model. It is determined\nfrom the simulated results that to achieve higher ADC values, higher RT dose\
  \ maps are\nrequired.\n"

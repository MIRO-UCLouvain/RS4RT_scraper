readme_excerpt: "A visualization tool to:\n\n- Display CT DICOM files,\n- Display RT-Dose files,\n- Display\
  \ RT-Struct files,\n- Display dose and dose-rate distributions,\n- Convert protontherapy RT-PLAN to\
  \ TOPAS MC files.\n\n<img width=\"1920\" height=\"1032\" alt=\"screenshot\" src=\"https://github.com/user-attachments/assets/e8a93f70-5ee6-4332-b830-560207a60b91\"\
  \ />\n\n### Getting Started\n* Install python 3.10 (e.g. from: https://www.python.org/downloads/windows/).\n\
  * Clone the repo:\n~~~ \ngit clone https://github.com/PierreLansonneur/Viewer.git\n~~~\n* Create the\
  \ virtual environment and install necessary libraries:\n~~~\npython -m venv venv\n.\\venv\\Scripts\\\
  activate\npip install -r requirements.txt\n~~~\n* Launch the viewer with:\n~~~\npython Viewer.py\n~~~\n\
  \n### Import CT series\nOpen a dicom series (CTRL + O) by navigating through the folder containing the\
  \ DICOM files. \nOnce opened, three different views (axial, sagittal and coronal plane) are displayed\
  \ on the axes. \nYou can navigate through the different slices using either the mouse scroll or the\
  \ three sliders on the viewer side.\nTo zoom/unzoom on the images, press right-click and move the mouse\
  \ on the corresponding axis.\n1D profiles along a line can be visualized by pressing the 'ctrl' key\
  \ and click on the corresponding axis.\n\n### Import RT-dose files\nOnce a CT is opened, RT-Dose files\
  \ can be imported via File >> Import Dose.\nThe colorbar range can be set via the Options menu.\n\n\
  ### Import RT-struct files\nOnce a CT is opened, DICOM RT-Struct files can be imported via Structures\
  \ >> Import Structures.\nOnce a RT-Dose file and a DICOM RT-Struct file are opened, you can compute\
  \ the DVHs for the ROIs selected in the Structures menu.\n\n### Dose-Rate visualization tools\nTo unlock\
  \ dose-rate related features, launch the viewer by specifying the field IDs:\n~~~\npython Viewer.py\
  \ -fields \"Field 1\" \"Field 2\" \"Field 3\" \"Field 4\" \"Field 5\"\n~~~\nThe dose and dose-rate distributions\
  \ in DICOM format can then be imported via File >> Import Dose and Dose-Rate.\nThe dose (respectively\
  \ dose-rate) distribution needs to be in DICOM format and named 'RD.Dose_ID.dcm' (resp. 'RD.DoseRate_ID.dcm'),\
  \ where ID is the field ID.\nFor indivudal fields, one can then display the dose-rate distributions,\
  \ or compute the Dose-Rate Volume Histograms (DRVH) for the ROIs selected in the Structures menu.\n\
  A minimum dose-rate can be specified in the Options menu to see only the dose delivered above this threshold.\n\
  If a minimum dose-rate is specified, one can plot the Dose-Rate Dose Volume Histograms (DR-DVH) together\
  \ with the regular DVH via the Tools menu.\nThe 2D histogram of dose and dose-rate for all fields combined\
  \ can moreover be shown via the Tools menu.\n \n### Convert RT-Plan to TOPAS MC files\nIf the field\
  \ IDs are specified, protontherapy DICOM RT-Plan files can be imported via File >> Open RP file. The\
  \ interface only supports files intended for Pencil Beam Scanning. \nFor each field, a TOPAS MC simulation\
  \ file can be exported based on the informations in the file, such as the range shifter, gantry and\
  \ table angles, number of spots, etc…\n"

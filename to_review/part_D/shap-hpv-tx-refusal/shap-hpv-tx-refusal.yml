readme_excerpt: "# XGBoost‑SHAP Modeling of Treatment Refusal in SEER–Medicare HPV-Associated Cancer Cohort\n\
  \n**Original code prepared by:** Maryam Kheirandish, PhD, Emory University (@Marykheirandish-dev) \U0001F4DD\
  \n\n**Revised and organized by:** Ryan Suk, PhD, Emory University (Principal Investigator)\n\n**Data\
  \ Source:** SEER–Medicare linked database \U0001F3E5\n\n\n---\n\n## Project Overview \U0001F31F\n\n\
  This repository focuses on predicting two key refusal behaviors in HPV-associated cancer patients:\n\
  \n1. **Radiotherapy (RT) refusal** \U0001F4A5\n2. **Surgery refusal** \U0001F52A\n\nUsing SEER–Medicare\
  \ data, we:\n\n* Preprocess registry and claims variables\n* Train XGBoost classifiers to predict refusal\
  \ outcomes\n* Analyze feature importance and interactions via SHAP\n\n---\n## >> \U0001F916 To check\
  \ our PRELIMINARY RESULTS >>> \U0001F449[Click here to view the preliminary results](https://github.com/ryan-suk/SHAP_HPV_Tx_Refusal/tree/main/prelim)\n\
  ---\n## Code Organization \U0001F4C2\n\n```\n  data/     # Datasets\n  code/     # All scripts (recoding,\
  \ modeling, tuning)\n  prelim/  # Generated outputs (figures, tables)\n  README.md # Project overview\
  \ and instructions\n```\n\n---\n\n## Dependencies \U0001F50C\n\n````\n\nKey Python libraries:\n- `pandas`,\
  \ `numpy` \n- `scikit-learn` \n- `xgboost` \n- `shap` \n- `imbalanced-learn` \n- `optuna` \n- `matplotlib`\
  \ \n````\n---\n\n## Usage \U0001F3C3‍♀️\n\n* Conducts train/test split\n* Imputes missing data\n* One-hot\
  \ encodes categorical features\n* Performs SMOTETomek resampling\n* Tunes hyperparameters via Optuna\n\
  * Trains final XGBoost model and reports accuracy, confusion matrix, classification report\n\n**Explainability\
  \ with SHAP**:\n\n   * Generates SHAP summary plot (top 20 features)\n   * Computes SHAP interaction\
  \ values for key feature pairs\n\n**Results**:\n   Check the `reports/` folder for saved SHAP figures\
  \ and model performance summaries.\n\n---\n\n## Contact \U0001F4EC\n\nFor questions or collaboration,\
  \ please reach out to Dr. Maryam Kheirandish at **[mkheira@emory.edu](mailto:mkheira@emory.edu)**.\n\
  \nProject lead: Dr. Ryan Suk, Emory University **[ryan.suk@emory.edu](mailto:ryan.suk@emory.edu)** \U0001F310\
  \ https://www.ryansuk.com/research-team\n\n---\n\n*This work adheres to SEER–Medicare data use agreements.*\n"

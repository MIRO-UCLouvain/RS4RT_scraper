readme_excerpt: "<h2>TensorFlow-FlexUNet-Image-Segmentation-BRISC2026-Brain-Tumor (2026/05/06)</h2>\n\
  Sarah T.  Arai<br>\nSoftware Laboratory antillia.com<br><br>\nThis is the first experiment of Image\
  \ Segmentation for <b>BRISC2026-Brain-Tumor</b> based on our <a href=\"./src/TensorFlowFlexUNet.py\"\
  >TensorFlowFlexUNet</a> \n(TensorFlow Flexible UNet Image Segmentation Model for Multiclass) , \nand\
  \ a 512x512 pixels PNG\n<a href=\"https://drive.google.com/file/d/1ZrUSuT70MUFtq7sUyYAakwZJ9nKPt1RE/view?usp=sharing\"\
  >\n<b>BRISC2026-Brain-Tumor-ImageMask-Dataset.zip</b></a> with colorized masks \n(<a href=\"https://www.mit.edu/~amini/LICENSE.md\"\
  >MIT</a>), which was derived by us from <br><br>\n\n<a href=\"https://www.kaggle.com/datasets/vivanrv/briscmat-brain-tumour-mri-dataset-2026/data\"\
  >\n<b>\nBriscMat-Brain-Tumour-MRI-Dataset-2026\n</a>\n<br>\nDeep Learning-Ready Brain MRI Dataset with\
  \ Tumor Mask Annotations\n</b><br>\n by Vivan rv.<br><br>\nOn <b>BRISC2025</b>, please refer to our\
  \ experiment \n<a href=\"https://github.com/sarah-antillia/TensorFlow-FlexUNet-Image-Segmentation-BRISC2025-BrainTumor\"\
  >\nTensorFlow-FlexUNet-Image-Segmentation-BRISC2025-BrainTumor\n</a>\n<br>\n<br>\n<hr>\n<b>Actual Image\
  \ Segmentation for BRISC2026-Brain-Tumor Images of 512x512 pixels </b><br>\nAs shown below, the inferred\
  \ masks predicted by our segmentation model trained by the dataset \nappear similar to the ground truth\
  \ masks, but they lack precision in certain areas.\n<br><br>\n<b>class_color_map = {Meningioma:yellow,\
  \ Glioma:cyan and Pituitary Tumor:mazenta}\n</b>\n<br><br>\n<table>\n<tr>\n<th>Input: image</th>\n<th>Mask\
  \ (ground_truth)</th>\n<th>Prediction: inferred_mask</th>\n</tr>\n<tr>\n<td><img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/mini_test/images/10013.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/mini_test/masks/10013.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/mini_test_output/10013.png\"\
  \ width=\"320\" height=\"auto\"></td>\n</tr>\n\n<tr>\n<td><img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/mini_test/images/10986.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/mini_test/masks/10986.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/mini_test_output/10986.png\"\
  \ width=\"320\" height=\"auto\"></td>\n</tr>\n\n<tr>\n<td><img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/mini_test/images/13387.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/mini_test/masks/13387.png\"\
  \ width=\"320\" height=\"auto\"></td>\n<td><img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/mini_test_output/13387.png\"\
  \ width=\"320\" height=\"auto\"></td>\n</tr>\n</table>\n<hr>\n<br>\n<h3>1  Dataset Citation</h3>\nThe\
  \ dataset used here was derived from <br><br>\n<a href=\"https://www.kaggle.com/datasets/vivanrv/briscmat-brain-tumour-mri-dataset-2026/data\"\
  >\n<b>\nBriscMat-Brain-Tumour-MRI-Dataset-2026\n</a>\n<br>\nDeep Learning-Ready Brain MRI Dataset with\
  \ Tumor Mask Annotations\n</b><br>\n by Vivan rv.<br><br>\nThe following explanation was taken from\
  \ above kaggle web site.\n<br><br>\n<b>About Dataset</b><br>\n<b>Reference Dataset</b><br>\nThis dataset\
  \ is derived from the BRISC 2025 Brain Tumor Dataset available on Kaggle:<br>\n<a href=\"https://www.kaggle.com/datasets/briscdataset/brisc2025\"\
  >https://www.kaggle.com/datasets/briscdataset/brisc2025</a>\n<br><br>\nThe current dataset restructures\
  \ the original classification \nand segmentation folders into a unified .mat based format for streamlined\
  \ deep learning workflows.\n<br><br>\n<b>Dataset Description</b><br>\nThis dataset contains 2D brain\
  \ MRI slices for:<br>\n<ul>\n<li>Tumor classification</li>\n<li>Tumor segmentation</li>\n<li>Multi-view\
  \ analysis</li>\n</ul>\nEach sample is stored as an individual .mat file.<br>\n<br>\n<b>Label Category</b><br>\n\
  0 No Tumor<br>\n1 Meningioma<br>\n2 Glioma<br>\n3 Pituitary Tumor<br>\n4 NonMri<br>\n<br>\n<b>License</b><br>\n\
  <a href=\"https://www.mit.edu/~amini/LICENSE.md\">MIT</a>\n<br><br>\n<h3>\n2 Brain Tumor MRI ImageMask\
  \ Dataset\n</h3>\n<h3>2.1 Download BRISC2026-Brain-Tumor ImageMask Dataset</h3>\n If you would like\
  \ to train this BRISC2026-Brain-Tumor Segmentation model by yourself,\nplease down load our dataset\
  \ <a href=\"https://drive.google.com/file/d/1ZrUSuT70MUFtq7sUyYAakwZJ9nKPt1RE/view?usp=sharing\">\n\
  <b>BRISC2026-Brain-Tumor-ImageMask-Dataset.zip</b>\n</a>\n(<a href=\"https://www.mit.edu/~amini/LICENSE.md\"\
  >MIT</a>)\n on the google drive,\nexpand the downloaded, and put it under <b>./dataset/</b> to be.\n\
  <pre>\n./dataset\n└─BRISC2026-Brain-Tumor\n    ├─test\n    │   ├─images\n    │   └─masks\n    ├─train\n\
  \    │   ├─images\n    │   └─masks\n    └─valid\n        ├─images\n        └─masks\n</pre>\n<br>\n<b>BRISC2026-Brain-Tumor\
  \ Statistics</b><br>\n<img src =\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/BRISC2026-Brain-Tumor_Statistics.png\"\
  \ width=\"512\" height=\"auto\"><br>\n<br>\nAs shown above, the number of images of train and valid\
  \ datasets is large enough to use for a training set of our segmentation model.\n<br><br>\n\n<h3>2.2\
  \ Derivation of ImageMask Dataset</h3>\nThe folder structure of the original <b>BriscMat/Train</b> is\
  \ the following.\nIt consists of MAT files cotaining image, mask and label data of Brain Tumor three\
  \ classes (Meningioma, Glioma and Pituitary Tumor) .\n<pre>\n./BriscMat\n  └─Train\n       ├─train_1.mat\n\
  ..\n       └─train_6314.mat\n</pre>\n<br>\nWe used a simplye Python script <a href=\"./generator/ImageMaskDatasetGenerator.py\"\
  >\nImageMaskDatasetGenerator.py\n</a> to generate a 512x512 pixels PNG ImageMask dataset from all pairs\
  \ of images and their corresponding \ncolorizied masks (Meningioma:yellow, Glioma:cyan and Pituitary\
  \ Tumor:mazenta) from train_*.mat files in Train folder. \n<br>\n<br>\n<h3>2.3 Train Sample Images and\
  \ Masks</h3>\n<b>Train sample images</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/asset/train_images_sample.png\"\
  \ width=\"1024\" height=\"auto\">\n<br>\n<b>Train sample masks</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/asset/train_masks_sample.png\"\
  \ width=\"1024\" height=\"auto\">\n<br>\n<h3>\n3 Train TensorflowFlexUNet Model\n</h3>\n We trained\
  \ BRISC2026-Brain-Tumor TensorflowFlexUNet Model by using the following\n<a href=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/train_eval_infer.config\"\
  > <b>train_eval_infer.config</b></a> file. <br>\nPlease move to ./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor\
  \ and run the following bat file.<br>\n<pre>\n>1.train.bat\n</pre>\n, which simply runs the following\
  \ command.<br>\n<pre>\n>python ../../../src/TensorFlowFlexUNetTrainer.py ./train_eval_infer.config\n\
  </pre>\n<hr>\n\n<b>Model parameters</b><br>\nDefined a small <b>base_filters=16</b> and a large <b>base_kernels=(11,11)</b>\
  \ for the first Conv Layer of Encoder Block of \n<a href=\"./src/TensorFlowFlexUNet.py\">TensorFlowFlexUNet.py</a>\
  \ \nand a large <b>num_layers=8</b> (including a bridge between Encoder and Decoder Blocks).\n<pre>\n\
  [model]\nimage_width    = 512\nimage_height   = 512\nimage_channels = 3\ninput_normalize = True\nnormalization\
  \  = False\nnum_classes    = 4\nbase_filters   = 16\nbase_kernels  = (11,11)\nnum_layers    = 8\ndropout_rate\
  \   = 0.05\ndilation       = (1,1)\n</pre>\n\n<b>Learning rate</b><br>\nDefined a small learning rate.\
  \  \n<pre>\n[model]\nlearning_rate  = 0.00007\n</pre>\n\n<b>Loss and metrics functions</b><br>\nSpecified\
  \ \"categorical_crossentropy\" and \"dice_coef_multiclass\".<br>\n<pre>\n[model]\nloss           = \"\
  categorical_crossentropy\"\nmetrics        = [\"dice_coef_multiclass\"]\n</pre>\n<b >Learning rate reducer\
  \ callback</b><br>\nEnabled learing_rate_reducer callback, and a small reducer_patience.\n<pre> \n[train]\n\
  learning_rate_reducer = True\nreducer_factor     = 0.5\nreducer_patience   = 4\n</pre>\n<b>Early stopping\
  \ callback</b><br>\nEnabled early stopping callback with patience parameter.\n<pre>\n[train]\npatience\
  \      = 10\n</pre>\n<b></b><br>\n<b>RGB color map</b><br>\nrgb color map dict for BRISC2026-Brain-Tumor\
  \ 1+3 classes.<br>\n<pre>\n[mask]\nmask_file_format = \".png\"\n;BRISC2026-Brain-Tumor 1+3\n;      \
  \             {Meningioma:yellow, Glioma:cyan, Pituitary Tumor:mazenta}        \nrgb_map = {(0,0,0):0,\
  \ (255,255,0):1, (0,255,0):2, (255,0,255):3,}       \n</pre>\n<b>Epoch change inference callbacks</b><br>\n\
  Enabled epoch_change_infer callback.<br>\n<pre>\n[train]\nepoch_change_infer       = True\nepoch_change_infer_dir\
  \   =  \"./epoch_change_infer\"\nepoch_changeinfer        = False\nepoch_changeinfer_dir    = \"./epoch_changeinfer\"\
  \nnum_infer_images         = 6\n</pre>\nBy using this epoch_change_infer callback, on every epoch_change,\
  \ the inference procedure can be called\n for 6 images in <b>mini_test</b> folder. This will help you\
  \ confirm how the predicted mask changes \n at each epoch during your training process.<br> <br> \n\
  As shown below, early in the model training, the predicted masks from our UNet segmentation model showed\
  \ discouraging results. \nHowever, as training progressed through the epochs, the predictions gradually\
  \ improved.<br><br>\n<b>Epoch_change_inference output at starting (1,2,3)</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/asset/epoch_change_infer_at_start.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n<br>\n<b>Epoch_change_inference output at middle-point (15,16,17)</b><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/asset/epoch_change_infer_at_middlepoint.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n<br>\n<b>Epoch_change_inference output at ending (32,33,34)</b><br>\n\
  <img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/asset/epoch_change_infer_at_end.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n\n<br>\nIn this experiment, the training process was stopped\
  \ at epoch 34 by EarlyStoppingCallback.<br><br>\n<img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/asset/train_console_output_at_epoch34.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n<br>\n<a href=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/eval/train_metrics.csv\"\
  >train_metrics.csv</a><br>\n<img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/eval/train_metrics.png\"\
  \ width=\"520\" height=\"auto\"><br>\n\n<br>\n<a href=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/eval/train_losses.csv\"\
  >train_losses.csv</a><br>\n<img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/eval/train_losses.png\"\
  \ width=\"520\" height=\"auto\"><br>\n<br>\n<h3>\n4 Evaluation\n</h3>\nPlease move to a <b>./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor</b>\
  \ folder,<br>\nand run the following bat file to evaluate TensorflowFlexUNet model for BRISC2026-Brain-Tumor.<br>\n\
  <pre>\n>./2.evaluate.bat\n</pre>\nThis bat file simply runs the following command.\n<pre>\n>python ../../../src/TensorFlowFlexUNetEvaluator.py\
  \  ./train_eval_infer.config\n</pre>\nEvaluation console output:<br>\n<img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/asset/evaluate_console_output_at_epoch34.png\"\
  \ width=\"1024\" height=\"auto\">\n<br><br>Image-Segmentation-BRISC2026-Brain-Tumor\n\n<a href=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/evaluation.csv\"\
  >evaluation.csv</a><br>\nThe loss (categorical_crossentropy) to this BRISC2026-Brain-Tumor/test was\
  \ low, and dice_coef_multiclass high as shown below.\n<br>\n<pre>\ncategorical_crossentropy,0.0181\n\
  dice_coef_multiclass,0.9917\n</pre>\n<br>\n<h3>5 Inference</h3>\nPlease move to a <b>./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor</b>\
  \ folder<br>\n,and run the following bat file to infer segmentation regions for images by the Trained-TensorflowFlexUNet\
  \ model for BRISC2026-Brain-Tumor.<br>\n<pre>\n>./3.infer.bat\n</pre>\nThis simply runs the following\
  \ command.\n<pre>\n>python ../../../src/TensorFlowFlexUNetInferencer.py ./train_eval_infer.config\n\
  </pre>\n<hr>\n<b>mini_test_images</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/asset/mini_test_images.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n<b>mini_test_mask(ground_truth)</b><br>\n<img src=\"./projects/TensorFlowFlexUNet/BRISC2026-Brain-Tumor/asset/mini_test_masks.png\"\
  \ width=\"1024\" height=\"auto\"><br>\n<hr>\n<b>Inferre"

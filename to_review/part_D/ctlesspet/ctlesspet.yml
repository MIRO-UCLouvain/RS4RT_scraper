readme_excerpt: "# CTlessPET \n\n## Install\n`pip install CTlessPET`\n\n## Use\nCTlessPET only requires\
  \ an NAC-PET dataset and a CT dataset. The CT is used as the container for the synthetic CT, and can\
  \ be an empty CT acquired before the patient enters the scanner. The NAC-PET should be reconstructed\
  \ using OSEM with Time-of-Flight enabled but no PSF modeling. Reconstruction at should be at 440x440\
  \ matrix size with a 4 mm Gaussian post filter. Only support for Siemens Bigraph Vision scanners (including\
  \ the Quadra) has been tested.\n\n### Dicom data\nUsing a folder containing both NAC and CT data:\n\
  ```\nCTlessPET -i <input_folder> --output <output_folder>\n```\nor in seperate folders:\n```\nCTlessPET\
  \ -i <input_NAC_folder> --CT <input_CT_folder> --output <output_folder>\n```\n\n### Nifti data\n```\n\
  CTlessPET -i <input_NAC_nii> --CT <input_CT_nii> --output <output_nii>\n```\n\n### Choice of model\n\
  The network has been trained for FDG-PET (adult and pediatric).\n\nThe type is automatically selected\
  \ when running the model with dicom data. You can overwrite the choice of the model using the `--model`\
  \ flag, e.g. `--model FDG_Pediatric`.\n\n### Optional arguments\nYou can change the batch size using\
  \ `--batch_size`.\n\nSome models (e.g. the adult FDG) comes with multiple kfold submodels. Default is\
  \ to use the median of the individual predictions. If you only wish to infer using one model to speed\
  \ the inference up, use `--fast`.\n\nThe default is to insert the bed from the empty CT scan used as\
  \ the container. However, if this is not wanted, you can turn it off with `--no_bed`.\n\n## Citation\n\
  \n![image](https://github.com/DEPICT-RH/CTlessPET/assets/108402980/1de108d4-0d1b-40cb-b88c-ed5d18e5b0c9)\n\
  \nIf you are using CTlessPET, please cite the following [manuscript for CTlessPET in adults](https://doi.org/10.3390/diagnostics13243661):\n\
  \nMontgomery ME, Andersen FL, d’Este SH, Overbeck N, Cramon PK, Law I, Fischer BM, Ladefoged CN. \n\
  Attenuation Correction of Long Axial Field-of-View Positron Emission Tomography Using Synthetic\nComputed\
  \ Tomography Derived from the Emission Data: Application to Low-Count Studies and Multiple Tracers.\n\
  Diagnostics. 2023; 13(24):3661. https://doi.org/10.3390/diagnostics13243661\n\nor the [pediatric version](https://doi.org/10.3390/diagnostics14242788):\n\
  \nMontgomery ME, Andersen FL, Mathiasen R, Borgwardt L, Andersen KF, Ladefoged CN. \nCT-Free Attenuation\
  \ Correction in Paediatric Long Axial Field-of-View \nPositron Emission Tomography Using Synthetic CT\
  \ from Emission Data. \nDiagnostics. 2024; 14(24):2788. https://doi.org/10.3390/diagnostics14242788"

readme_excerpt: "<p align=\"center\">\n  <img src=\"./graphical_abstract.PNG\" width=\"100%\" alt=\"logo\"\
  >\n</p>\n\n<p align=\"center\">\n    <h1 align=\"center\">Heel Correction</h1>\n</p>\n\n\n[![DOI](https://zenodo.org/badge/DOI/10.5281/zenodo.15836128.svg)](https://doi.org/10.5281/zenodo.15836128)\n\
  \n[De Bolle, Jorden![ORCID logo](https://info.orcid.org/wp-content/uploads/2019/11/orcid_16x16.png)](https://orcid.org/0000-0002-5179-1725)[^aut][^UG-RP][^UG-SSS];\n\
  [Verschuren, Louis![ORCID logo](https://info.orcid.org/wp-content/uploads/2019/11/orcid_16x16.png)](https://orcid.org/0000-0002-3102-4588)[^aut][^cre][^UG-WL];\n\
  [Van den Bulcke, Jan![ORCID logo](https://info.orcid.org/wp-content/uploads/2019/11/orcid_16x16.png)](https://orcid.org/0000-0003-2939-5408)[^aut][^UG-WL]\n\
  [Boone, Matthieu N.![ORCID logo](https://info.orcid.org/wp-content/uploads/2019/11/orcid_16x16.png)](https://orcid.org/0000-0002-5478-4141)[^aut][^UG-RP];\n\
  \n[^aut]: author\n[^cre]: contact person\n[^UG-WL]: UGent-Woodlab, Department of Environment, Ghent\
  \ University, Coupure Links 653, Gent, 9000, Belgium\n[^UG-RP]: RP-UGCT, Department of Physics and Astronomy\
  \ – Radiation Physics, Ghent University, Proeftuinstraat 86, Gent, 9000, Belgium\n[^UG-SSS]: Current\
  \ affiliation: Department of Solid State Sciences - CoCooN research group, Ghent University, Krijgslaan\
  \ 286, Gent, 9000, Belgium\n\n\n<p align=\"left\">\n   This is the repository for a Python routine that\
  \ corrects for the heel effect in (helical) X-ray micro-CT scans. It's primary use is increasing the\
  \ accuracy with which the local mass densities in wood increment cores can be determined. The correction\
  \ happens on the level of the normalised projection images of the scan. It requires a radiographic projection\
  \ of a prism-shaped calibration sample that was obtained with the same tube settings and source-to-detector\
  \ distance as the CT-scan. After correction and reconstruction, one obtains a 3D reconstructed volume\
  \ that is to a large extent free of consequences from the heel effect and cupping ( which arises as\
  \ a consequence of beam hardening). The volume consists of voxels that contain a gray-value that is\
  \ proportional to the local mass density in the sample. By using the Numba library, the routine was\
  \ optimised to run on an NVIDIA GPU for fast execution.\n</p>\n\n\n<p align=\"center\">\n\t<!-- local\
  \ repository, no metadata badges. --></p>\n<p align=\"center\">\n\t\t<em>Built with the tools and technologies:</em>\n\
  </p>\n<p align=\"center\">\n\t<img src=\"https://img.shields.io/badge/Python-FFD43B?style=for-the-badge&logo=python&logoColor=blue\"\
  \ alt=\"Python\">\n\t<img src=\"https://img.shields.io/badge/Numpy-777BB4?style=for-the-badge&logo=numpy&logoColor=white\"\
  \ alt=\"NumPy\">\n\t<img src=\"https://img.shields.io/badge/SciPy-654FF0?style=for-the-badge&logo=SciPy&logoColor=white\"\
  \ alt=\"SciPy\">\n\t<img src=\"https://img.shields.io/badge/Numba-00A3E0?style=for-the-badge&logo=Numba&logoColor=white\"\
  \ alt=\"Numba\">\n\n\t\n</p>\n<br>\n\n#####  Table of Contents\n\n- [ Introduction to the method](#introduction)\n\
  - [ Getting Started](#getting-started)\n- [ Performing a heel correction](#performing-a-heel-correction)\n\
  - [ Cite our work](#cite-our-work)\n- [ License](#license)\n\n---\n\n##  Introduction to the method\n\
  \nIn most conventional X-ray tubes, the anode target is tilted with respect to the optical axis of the\
  \ measurement system. However, the tilt causes a spatial variation of the X-ray spectrum throughout\
  \ the generated X-ray beam, a spatio-spectral effect called the (anode) heel effect. Since the sample\
  \ in a micro computed tomography (µCT) scan experiences an asymmetry in the X-ray beam spectrum due\
  \ to the heel effect, the projection images will contain an asymmetry as well. This influences the resulting\
  \ reconstructions from the µCT scan. As a consequence, the heel effect hinders an accurate determination\
  \ of local material densities with µCT, particularly when using a helical trajectory. In this paper,\
  \ a method will be demonstrated that is capable of correcting for the heel effect in helical µCT scans\
  \ where the heel effect is oriented perpendicular to the rotation axis. This increases the accuracy\
  \ of the obtained local mass densities. In addition, the method removes beam hardening effects. The\
  \ method is based on a lookup table (LUT) that is used to correct pixel values in the normalised projection\
  \ images of the CT scan in order to eliminate the asymmetry introduced by the heel effect. We demonstrate\
  \ this correction algorithm on a helical CT scan of wood increment cores, which sufficiently satisfies\
  \ the method’s requirement of a homogeneous chemical composition. Nonetheless, the method can be used\
  \ in a wide variety of applications.\n\n---\n\n## Getting started\n\nBefore running the notebooks, ensure\
  \ that you have the following dependencies installed:\n- numpy\n- numba\n- matplotlib\n- scipy\n- pylibtiff\n\
  - os\n- re\n- PIL\n- seaborn\n- time\n- math\n- cudatoolkit\n- pytest-shutil\n\nYou can use the environment.yml\
  \ file to set up your conda environment. \n\n---\n\n## Performing a heel correction\n\nRunning a heel\
  \ correction requires the following: \n - All projection images of the CT scan are available\n - A projection\
  \ image of a calibration prism is available, recorded with the same tube settings and source-to-detector\
  \ distance as the CT scan\n - Dark field and flat field images for both the CT scan and the projection\
  \ image of the calibration prism are available\n - The sample has a homogeneous chemical composition\
  \ to ensure that all mass anttenuation coefficients have the same energy dependency\n - The calibration\
  \ prism is made of an equivalent material as the sample under study\n\nFurthermore, the software assumes\
  \ the calibration prism is placed on top of the optical axis of the CT scanner with the vertical flat\
  \ side facing the source and the source-to-object distance optimised such that the projection of the\
  \ prism is wider than the detector in order to avoid edge effects. \n\nThe software requires the following\
  \ parameters, which are explained in the figures below:\n - a: maximal thickness of the prism (thickness\
  \ at the bottom) (in mm)\n - b: height of the prism (in mm)\n - SOD: source-to-objecte distance (distance\
  \ from source to flat vertical plane of prism, prism is placed in scanner such that vertical plane faces\
  \ the source)\n - SDD: source-to-detector distance (should be same in scan as in projection of prism\
  \ in order to have same heel effect)\n - detector_height: height of the detector in pixels as used for\
  \ the projection images in the data set that is being corrected\n - detector_width: width of the detector\
  \ in pixels as used for the projection images in the data set that is being corrected\n - LUT_height:\
  \ eventual height of the LUT that will be used (for example 1010 pixels if projection of prism only\
  \ uses top 1000 pixels of detector)\n - pixelsize: size of a pixel in mm\n - scatter_space_LUT: height\
  \ in pixels available above the prism to calculate scattering in projection of the prism\n - scatter_space_projections:\
  \ [x1, x2, y1, y2], defines a region in the projection images that is used for calculating the scattering\
  \ value\n\n<p align=\"center\">\n  <img src=\"./geometry.PNG\" width=\"60%\" alt=\"geometry\">\n</p>\n\
  <p align=\"center\">\n  <img src=\"./detectors.PNG\" width=\"80%\" alt=\"detectors\">\n</p>\n\n---\n\
  \n## Cite our work\n\nYou can find the paper where the entire pipeline is described [here](https://doi.org/10.1016/j.precisioneng.2025.06.019),\
  \ or cite our work with the following bibtex snippet:\n\n```tex\n@article{DEBOLLE2025,\ntitle = {Correction\
  \ for the heel effect in helical μCT scans for accurate densitometry},\njournal = {Precision Engineering},\n\
  year = {2025},\nissn = {0141-6359},\ndoi = {https://doi.org/10.1016/j.precisioneng.2025.06.019},\nauthor\
  \ = {Jorden {De Bolle} and Louis Verschuren and Jan {Van den Bulcke} and Matthieu N. Boone},\nkeywords\
  \ = {μCT, Heel effect, Densitometry, X-ray}\n}\n```\n\n\nWhen using any of the software, also cite the\
  \ proper Zenodo DOI [here](https://doi.org/10.5281/zenodo.15836128)\n\n```tex\n@software{zenodoHeelCorr,\n\
  \  author = {Jorden {De Bolle} and Louis Verschuren and Jan {Van den Bulcke} and Matthieu N. Boone},\n\
  \  title        = {UGent-Woodlab/HeelCorrection},\n  month        = jul,\n  year         = 2025,\n \
  \ publisher    = {Zenodo},\n  doi          = {10.5281/zenodo.15836129}\n}\n```\n---\n\n##  License\n\

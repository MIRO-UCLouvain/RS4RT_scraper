readme_excerpt: "# Multimodal Subtype Classification of Non-Small Cell Lung Cancer (NSCLC)\n\n## Integrating\
  \ CT Imaging and Structured Radiological Data Using Machine Learning\n\n**Status:** In Progress  \n\
  **Institution:** University of Mannheim  \n**Faculty:** School of Business Informatics and Mathematics\n\
  \n### Overview\nThis repository contains the source code and documentation for the Master's Thesis titled\
  \ **\"Multimodal Subtype Classification of Non-Small Cell Lung Cancer (NSCLC): Integrating CT Imaging\
  \ and Structured Radiological Data Using Machine Learning\"**.\n\nThe primary objective of this research\
  \ is to develop a deep learning framework that performs non-invasive histological subtype classification\
  \ (Adenocarcinoma vs. Squamous Cell Carcinoma). The proposed architecture utilizes a **Late Fusion**\
  \ strategy to integrate high-dimensional visual features extracted from volumetric CT scans with semantic\
  \ features derived from structured radiologist annotations.\n\n### Dataset and Access\nThe project utilizes\
  \ the **NSCLC Radiogenomics** dataset, which is publicly available via The Cancer Imaging Archive (TCIA).\n\
  \n**Data Source:** [NSCLC Radiogenomics on TCIA](https://wiki.cancerimagingarchive.net/display/Public/NSCLC-Radiogenomics)\
  \  \n**Cohort Size:** 211 subjects\n\n#### Instructions for Reproduction\nThis repository does not contain\
  \ the raw medical imaging data due to repository size limitations. To reproduce the results, please\
  \ follow these steps:\n\n1.  **Download Data:**\n    * Visit the TCIA link above.\n    * Download the\
  \ \"Images (DICOM)\" and the \"Semantic Annotations (XML)\" using the NBIA Data Retriever.\n    * Download\
  \ the \"Clinical Data\" (CSV).\n\n2.  **Organize Directory:**\n    Place the downloaded files into the\
  \ local `data/` directory following this structure:\n    ```text\n    data/\n    ├── raw/\n    │   ├──\
  \ dicom/          # \"NSCLC Radiogenomics\" folder\n    │   ├── xml/            # XML files\n    │ \
  \  └── clinical/       # CSV file\n    ```\n\n3.  **Run Mapping Script:**\n    Execute `notebooks/02_mapping/create_master_list.ipynb`\
  \ to link the modalities.\n\n### Methodology\nThe implementation is divided into three phases:\n\n1.\
  \  **Data Mapping and Preprocessing:**\n    * Linkage of patients across DICOM, XML, and Clinical files.\n\
  \    * Preprocessing of CT volumes (windowing, resampling, cropping).\n    * Parsing and encoding of\
  \ XML annotation features.\n\n2.  **Unimodal Baselines:**\n    * **Semantic Model:** Machine Learning\
  \ classifiers (XGBoost/Random Forest) trained on structured XML features.\n    * **Visual Model:** 3D\
  \ Convolutional Neural Networks trained on voxel data.\n\n3.  **Multimodal Fusion:**\n    * Implementation\
  \ of a Late Fusion architecture concatenating feature vectors from both unimodal streams.\n\n### Repository\
  \ Structure\n\n```text\n.\n├── data/                    # Local directory for dataset (excluded from\
  \ version control)\n├── src/                     # Source code for initial data analysis, model architectures\n\
  ├── results/                 # Evaluation metrics\n├── requirements.txt         # Python dependencies\n\
  └── README.md\n"

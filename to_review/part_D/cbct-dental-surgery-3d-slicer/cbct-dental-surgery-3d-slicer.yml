readme_excerpt: '# CBCT Dental Surgery 3D Visualization and Segmentation Using 3D Slicer


  ## Project Overview


  This project demonstrates a dental CBCT visualization workflow using 3D Slicer. I used the CBCTDentalSurgery
  sample dataset to review dental and maxillofacial CT images, isolate high-density bone structures, clean
  the segmentation, generate a 3D skull model, and export files suitable for portfolio presentation.


  The project shows practical skills in dental image review, threshold-based bone segmentation, 3D visualization,
  surface cleanup, model export, and workflow documentation.


  ## Dataset


  - Dataset: CBCTDentalSurgery sample data

  - Source: Built-in 3D Slicer sample dataset

  - Data type: Cone-beam CT dental volume

  - Private patient data used: No


  ## Tools Used


  - 3D Slicer

  - Dental CBCT image review

  - Threshold bone selection

  - Segmentation cleanup

  - 3D visualization

  - Model export


  ## Workflow


  1. Loaded the CBCTDentalSurgery sample dataset in 3D Slicer.

  2. Reviewed the dental CBCT scan in axial, sagittal, coronal, and 3D views.

  3. Captured the original dental CBCT scan before segmentation.

  4. Created a threshold-based selection of high-density skull and jaw structures.

  5. Reviewed the selection across multiple views.

  6. Removed small disconnected regions from the segmentation.

  7. Applied smoothing to improve the final surface.

  8. Generated a final 3D skull model from the cleaned segmentation.

  9. Exported the model in STL, OBJ, and PLY formats.

  10. Documented the process with screenshots and workflow notes.



  models/

  - CBCTDental_Final_Skull_Model.stl

  - CBCTDental_Final_Skull_Model.obj

  - CBCTDental_Final_Skull_Model.ply


  segmentations/

  - CBCTDental_Cleaned_Bone_Segmentation.seg.nrrd


  scene/

  - CBCTDentalSurgery_3D_Visualization_Project.mrml


  ## What This Project Shows


  - I can work with dental CBCT medical imaging data in 3D Slicer.

  - I can review maxillofacial anatomy in multiple anatomical planes.

  - I can isolate high-density skull and jaw structures using threshold-based selection.

  - I can clean segmentation artifacts.

  - I can generate a 3D skull model from dental CBCT data.

  - I can export model files in common 3D formats.

  - I can document a technical imaging workflow clearly.

  '

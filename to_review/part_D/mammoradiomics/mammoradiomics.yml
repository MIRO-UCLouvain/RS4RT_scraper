readme_excerpt: '### MammoRadiomics: Predictive AI Software for Personalized Breast Cancer Treatment


  MammoRadiomics is an AI-based software designed for breast cancer neoadjuvant chemotherapy (NAC) outcome
  prediction based on radiomic analysis of magnetic resonance images. The insights gained from highly
  accurate NAC response prediction, as produced by the MammoRadiomics software, offer the potential for
  further breast cancer management personalization.


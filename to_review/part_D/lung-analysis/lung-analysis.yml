readme_excerpt: "# Lung analysis system  \n## aims & scope  \nThis solution developed in Python have for\
  \ objective to give an analysis of \nthe effect of radiotherapy on the lungs. For completed this aim\
  \ the software compare the Hounsfield Unit (HU) of the\nmedical images before and after the radiotherapy.\
  \ The HU is \" a relative quantitative measurement of radio density used by radiologists in the interpretation\
  \ of computed\ntomography (CT) images\" [_Tami D. DenOtter; Johanna Schubert](https://www.ncbi.nlm.nih.gov/books/NBK547721/),\
  \ to\nsimplify we can compare it to the grayscale measure.   \nThis analysis is based on CT scan of\
  \ a patient before Radiation therapy and after radiation therapy in\n[DICOM](https://www.dicomstandard.org/)\
  \ format (standard format medical image and information).  \nThe first step is to process the images\
  \ of the CT scan for the CT before and after the radiotherapy, a CT give several \nimage as it virtually\
  \ \"cut\" the lung into slices and take a picture    \nOnce the image are processed we need to make\
  \ the slice of the after serial and before serial comparable, in another words\nhaving the same number\
  \ of slice in both serial, but also we need that for each comparison both slice have the same lungs\n\
  area, else the comparison would make no sense. So the software limit the number of slices of the bigger\
  \ serial to be\nthe same than in the smaller one by taking every n slice.  \nThen we can go to the calculation\
  \ part, the software calculate the mean and median HU unit value for each slide of both\nserial and\
  \ compare those values for both before and after corresponding slices, all of this is done in data frame.\n\
  Finally the final dataframe in exported in .csv.\n## requirements  \n* Python V3.7 (if you don't yet\
  \ have python, I recommend to install through [Anaconda](https://www.anaconda.com/) for \nautomatic\
  \ installation of some libraries)  \n* Libraries:  \n  * [time](https://docs.python.org/3/library/time.html)\
  \  \n  * [pydicom](https://pydicom.github.io/)  \n  * [os](https://docs.python.org/3/library/os.html)\
  \  \n  * [math](https://docs.python.org/3/library/math.html)  \n  * [numpy](https://numpy.org/)  \n\
  \  * [SimpleITK](https://pypi.org/project/SimpleITK/)  \n  * [scipy](https://www.scipy.org/)  \n  *\
  \ [skimage](https://scikit-image.org/)  \n  * [aenum](https://pypi.org/project/aenum/)  \n  * [operator](https://docs.python.org/3/library/operator.html)\
  \  \n  * [statistics](https://docs.python.org/3/library/statistics.html)  \n  * [pandas](https://pandas.pydata.org/)\
  \  \n  * [matplotlib](https://matplotlib.org/)\n  * [tqdm](https://github.com/tqdm/tqdm)  \n## Recommended\
  \ development environment  \nWe recommend the usage of PyCharm for this project, the free community\
  \ edition is sufficient. However nothing forbid you\nto use another environment such as for example\
  \ Pyzo or Visual Studio Code.  \nThe solution was developed on Windows but Python is also running well\
  \ on Apple and Linux, however some change might be \nrequired on those operating systems.  \n### Computer\
  \ resources  \n* Minimal:\n  * Processor I5\n  * 8gb of Ram\n  * SSD disk\n* Recommended:\n  * Processor\
  \ i7\n  * 32gb of Ram\n  * SSD disk\n## work  \n- [x] image segmentation\n- [x] image registration\n\
  - [x] HU calculation / Roi in slice\n- [x] Before/After difference calculation\n- [ ] Remove ROI from\
  \ ROI\n- [x] Automation of calculation for several range\n- [ ] Automation of calculation for several\
  \ patient\n- [x] Data exportation to CSV \n- [x] Performance analysis \n- [ ] Refactoring  \n## How\
  \ to use :  \nIn the root in the folder Data make 3 folders: \"before_data\", \"before-images\" and\
  \ \"after_images\". in the folder\nbefore data put RS, RP and RD files, in before_images the iRT serial\
  \ and in after_data the follow up serial"

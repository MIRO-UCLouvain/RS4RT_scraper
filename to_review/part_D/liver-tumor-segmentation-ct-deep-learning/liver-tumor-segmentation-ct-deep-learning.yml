readme_excerpt: 'Liver and Tumor Segmentation from CT Images Using Deep Learning and 3D Visualization

  Overview


  This project presents an automated framework for liver and liver tumor segmentation from abdominal CT
  scans using deep learning techniques. The system aims to accurately identify liver regions and tumors
  at the pixel level and reconstruct the segmentation results into a 3D visualization for better clinical
  interpretation.


  The project investigates and compares two state-of-the-art convolutional neural network architectures:


  DenseUNet169

  EfficientNet-based U-Net


  The generated segmentation masks are used to create 3D visualizations of the liver and tumor structures,
  enabling qualitative and quantitative analysis.


  Problem Statement


  Manual analysis of liver CT scans is a time-consuming and challenging task. Variations in liver shape,
  unclear boundaries, image noise, and diverse tumor characteristics make accurate segmentation difficult.


  This project addresses these challenges by developing a deep learning-based computer vision system capable
  of:


  Automatic liver segmentation

  Automatic liver tumor segmentation

  Accurate pixel-wise classification

  3D reconstruction and visualization

  Quantitative evaluation of segmentation performance

  Features

  Automated liver and tumor segmentation from CT images

  Deep learning-based semantic segmentation

  Comparison between DenseUNet169 and EfficientNet architectures

  Data preprocessing and augmentation pipeline

  3D reconstruction and visualization of segmented volumes

  Performance evaluation using medical imaging metrics

  Dataset


  The project uses abdominal CT scan datasets containing:


  CT images

  Liver masks

  Tumor masks


  Typical preprocessing steps include:


  Resizing images

  Intensity normalization

  Data augmentation

  Train/validation/test split

  Model Architectures

  DenseUNet169


  DenseUNet169 integrates DenseNet169 as the encoder within a U-Net segmentation framework.


  Advantages:


  Dense feature reuse

  Improved information flow

  Better capture of fine anatomical details

  Strong performance on complex liver boundaries

  EfficientNet U-Net


  EfficientNet-based U-Net utilizes EfficientNet as the backbone network.


  Advantages:


  Lightweight architecture

  Lower computational cost

  Faster training

  Efficient feature extraction


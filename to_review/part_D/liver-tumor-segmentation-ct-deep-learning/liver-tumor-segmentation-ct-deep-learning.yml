  Installation


  Clone the repository:


  git clone https://github.com/your-username/liver-tumor-segmentation-ct-deep-learning.git

  cd liver-tumor-segmentation-ct-deep-learning


  Install dependencies:


  pip install -r requirements.txt

  Training


  Train the model:


  python train.py


  Train a specific architecture:


  python train.py --model denseunet169


  or


  python train.py --model efficientnet

  Evaluation


  Evaluate the trained model:


  python evaluate.py


  Common metrics:


  Dice Similarity Coefficient (DSC)

  Intersection over Union (IoU)

  Precision

  Recall

  Accuracy

  3D Visualization


  After segmentation, the predicted masks can be reconstructed into 3D models using volumetric visualization
  techniques.


  Visualization provides:


  Better understanding of liver anatomy

  Tumor localization

  Volume estimation

  Surgical planning support

  Results


  The project compares DenseUNet169 and EfficientNet-based U-Net in terms of:


  Segmentation accuracy

  Generalization performance

  Computational efficiency

  Training time

  3D reconstruction quality


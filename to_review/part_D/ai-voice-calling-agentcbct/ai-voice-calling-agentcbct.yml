readme_excerpt: "# Doctor Booking AI (Frontend)\r\n\r\nProduction-ready React Native (Expo) frontend for\
  \ discovering doctors by category and booking appointments with an AI voice agent trigger. Backend is\
  \ assumed available via REST; this app uses a centralized API service with mock data and clear integration\
  \ points to swap to real endpoints.\r\n\r\n## Tech Stack\r\n- Expo + React Native (TypeScript)\r\n-\
  \ React Navigation (Bottom Tabs + Native Stack)\r\n- Context API + AsyncStorage (auth)\r\n- Functional\
  \ components + hooks\r\n\r\n## Project Structure\r\n```\r\napp/\r\n  navigation/ RootNavigator.tsx,\
  \ TabNavigator.tsx, HomeStack.tsx\r\n  screens/ HomeScreen.tsx, DoctorListScreen.tsx, DoctorDetailScreen.tsx,\
  \ AppointmentsScreen.tsx, ProfileScreen.tsx, LoginScreen.tsx, SignupScreen.tsx\r\n  components/ CategoryCard.tsx,\
  \ DoctorCard.tsx, AppointmentCard.tsx, FloatingAIButton.tsx\r\n  context/ AuthContext.tsx\r\n  services/\
  \ api.ts\r\n  types/ index.ts\r\nApp.tsx\r\n```\r\n\r\n## Running Locally\r\n\r\n1) Install Node.js\
  \ LTS\r\n2) Install dependencies\r\n\r\n```bash\r\nnpm install\r\n```\r\n\r\n3) Start the Expo dev server\r\
  \n\r\n```bash\r\nnpx expo start\r\n```\r\n\r\n4) Open on device/emulator\r\n- Press `a` for Android\
  \ emulator, `i` for iOS (macOS) or scan the QR with Expo Go.\r\n\r\n## Notes\r\n- This project ships\
  \ with a mock `api.ts`. Replace mock methods with real `fetch` calls to your backend and keep token\
  \ attachment in place.\r\n- Auth token and user profile persist via AsyncStorage.\r\n- Auth-only flows:\
  \ Appointments, Profile, and booking/payment require login; browsing categories/doctors is public.\r\
  \n- The floating \"Chat with AI\" button currently triggers a mock AI endpoint; wire to your backend\
  \ for voice/chat startup.\r\n\r\n## Integration Points\r\n- Centralized service: `app/services/api.ts`\r\
  \n  - `getCategories`, `getDoctorsByCategory`, `getDoctor`\r\n  - `login`, `signup`, `logout`, `getProfile`\r\
  \n  - `getAppointments`, `bookAppointment`, `initiatePayment`, `triggerAIVoiceForAppointment`, `triggerAIQuick`\r\
  \n- Swap mock implementations with real `fetch` calls and your base URL.\r\n\r\n## Type Contracts\r\n\
  See `app/types/index.ts` for `Doctor`, `Appointment`, and `User` shapes.\r\n\r\n## Lint/Type Check\r\
  \n```bash\r\nnpm run typecheck\r\n```\r\n\r\n## Production Readiness\r\n- Clean architecture, modular\
  \ services, and reusable UI components\r\n- Robust loading/empty/error UX\r\n- Navigation guards implemented\
  \ via runtime checks and CTA redirects\r\n\r\n"

readme_excerpt: "# MolToxPred\nMolToxPred is a machine learning based tool to predict toxicity scores\
  \ of small molecules\n\n\n## Prerequisites:\n\n•\tPython 3.7+\n\n•\tJava JRE 6+\n\n•\t`requirements.txt`\
  \ file contains all the necessary python packages required.\n\n## Usage:\n\nTo use the trained models\
  \ for predictions:\n\n1. Download and unpack the zip file/ Clone the GitHub library\n\n2. Create an\
  \ environment with dependencies using `requirements.txt` file\n\n3. Prepare your input file, the molecules\
  \ should be in SMILES format. For single molecule SMILES can be entered directly, for multiple molecules\
  \ prepare a .csv file \n\n4. Run the MolToxPred by `python main_moltox.py`\n\n5. The output file is\
  \ generated as your 'custom input_results.csv' \n  \nThe `main_moltox.py` file will generate descriptors\
  \ using RDKit and molecular fingerprints using Padelpy for a molecule. `fingerprints_xml.zip` will be\
  \ parsed to generate the fingerprints,`feature_list.pkl` will perform the feature selection as described\
  \ in the manucript and output will be individual fingerprint file with selected features in `Padel`\
  \ folder. Toxicity prediction of the molecule will happen using the trained model `stacked_model.joblib`and\
  \ `results.csv` output will be created with your custom file name having toxicity score.\n\n## Datasets:\n\
  An example test set that can be used for prediction (in .csv format) is provided in `sample_SMILES`.\
  \ \n"

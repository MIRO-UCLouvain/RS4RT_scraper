readme_excerpt: "![alt text](image.png)\n\n\n#  Molecule Toxicity Prediction with Graph Neural Networks\n\
  \nA **self‑contained** Python project that trains a Graph Convolutional Network (GCN) on the **Tox21**\
  \ molecular toxicity dataset (via the `MoleculeNet` collection) and serves an interactive web UI with\
  \ **Streamlit** to explore predictions and per‑atom importance (XAI).\n\n---\n\n\n\n## Project Structure\n\
  \n```\ngnn/\n├─ app.py                # Streamlit UI – loads the saved model & visualises molecules\n\
  ├─ data.py               # Loads the MoleculeNet Tox21 dataset, splits train/test, creates DataLoaders\n\
  ├─ model.py              # Core GCN definition (flexible `in_channels` argument)\n├─ train.py      \
  \        # Training loop, saves `gnn_tox21.pth`\n├─ visualise.py          # Converts a `torch_geometric`\
  \ graph to a NetworkX plot with RDKit atom labels\n├─ xai.py                # Simple gradient‑based\
  \ node importance (per‑atom attribution) \n├─ requirements.txt      # List of dependencies\n```\n\n\
  ---\n\n## Future Improvements\n\n* **More sophisticated XAI** – integrate Integrated Gradients or GNNExplainer\
  \ for richer explanations.\n* **Multi‑task learning** – Tox21 actually contains 12 toxicity endpoints;\
  \ extend the model to predict all simultaneously.\n* **GPU acceleration** – switch to a CUDA‑enabled\
  \ environment for faster training on larger batches.\n* **Dockerisation** – wrap the whole stack in\
  \ a Docker image for reproducible deployment.\n* **Model checkpointing** – add early‑stopping and best‑model\
  \ saving based on validation loss.\n\n---\n\n\n"

readme_excerpt: "# Machine learning model for drug toxicity prediction using Graph-based neural networks\n\
  this is a small graph-based model predicting substance toxicity\n## The Model\nthe Model is make up\
  \ of 2 Graph convolutional layers and two linear layers. it works by turning a molecule's chemical representation\
  \ into a 1-hot encoded matrix (whuch represents atoms) and an edge matrix (which represents bonds)\n\
  ## Dataset\nI used [tox21](https://github.com/deepchem/deepchem/blob/master/datasets/tox21.csv.gz) dataset\
  \ from [deepchem](https://github.com/deepchem/deepchem/) to train the model\n## Training the model\n\
  for training the model you can you can run train.py \n## Running the model\nrun test_model_cli.py\n\
  ```\npython test_model_cli.py\n```\nnow enter SMILES representation of the substance:\n```\nEnter a\
  \ SMILES string: CCN(CC)CCOC(=O)C1(C2CCCCC2)CCCCC1\nOutput: 52.33239531517029% chance of stress response\
  \ to ATAD5.\n```\n"

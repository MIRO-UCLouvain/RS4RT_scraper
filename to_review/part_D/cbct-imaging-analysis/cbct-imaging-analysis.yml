readme_excerpt: "# Calc_NTCP_CBCT\n\nThis repository contains Python code to calculate the **Normal Tissue\
  \ Complication Probability (NTCP)** for CBCT (Cone Beam Computed Tomography) imaging doses in radiation\
  \ therapy. The project focuses on evaluating the impact of CBCT imaging doses on normal tissues, specifically\
  \ for breast cancer treatment scenarios (left and right breast), along with sensitivity analysis of\
  \ NTCP parameters.\n\n## Table of Contents\n- [Overview](#overview)\n- [Features](#features)\n- [Files](#files)\n\
  - [Installation](#installation)\n- [Usage](#usage)\n- [Input Data](#input-data)\n- [Output Files](#output-files)\n\
  - [Dependencies](#dependencies)\n- [Contributing](#contributing)\n- [License](#license)\n\n## Overview\n\
  The code in this repository calculates NTCP for CBCT imaging doses used in radiation therapy, focusing\
  \ on breast cancer treatment. It evaluates the impact of two imaging protocols (5 MU and 10 MU) on organs\
  \ at risk (OARs) such as the contralateral breast, ipsilateral lung, contralateral lung, and heart.\
  \ The NTCP calculations are performed using the **Logistic model** (for the breast) and the **Lyman-Kutcher-Burman\
  \ (LKB) model** (for the lungs and heart). Additionally, the code performs statistical analysis (paired\
  \ t-tests) and generates visualizations (boxplots) to compare the NTCP and mean doses between the two\
  \ protocols.\n\n## Features\n- Calculate NTCP for CBCT imaging doses (5 MU and 10 MU protocols) for\
  \ breast cancer treatment.\n- Support for specific regions:\n  - Left breast (`cbct_ntcp_breast_left.py`)\n\
  \  - Right breast (`cbct_ntcp_breast_right.py`)\n- Sensitivity analysis of NTCP parameters (`ntcp_sensitivity.py`).\n\
  - Statistical analysis using paired t-tests to compare NTCP and mean doses between 5 MU and 10 MU protocols.\n\
  - Visualization of results with boxplots for NTCP and mean doses.\n- Modular code structure for easy\
  \ integration into radiation therapy workflows.\n\n## Files\n- **`cbct_ntcp_breast_left.py`**: Calculates\
  \ NTCP for CBCT imaging doses affecting the left breast, performs statistical analysis, and generates\
  \ boxplots for visualization.\n- **`cbct_ntcp_breast_right.py`**: Calculates NTCP for CBCT imaging doses\
  \ affecting the right breast (similar functionality to the left breast script).\n- **`ntcp_sensitivity.py`**:\
  \ Performs sensitivity analysis on NTCP parameters to evaluate their impact on the results.\n- **`README.md`**:\
  \ Project documentation (this file).\n\n## Installation\n1. Clone the repository to your local machine:\n\
  \   ```bash\n   git clone https://github.com/thanhtaiphys/Calc_NTCP_CBCT.git\n   ```\n2. Navigate to\
  \ the project directory:\n   ```bash\n   cd Calc_NTCP_CBCT\n   ```\n3. Install the required dependencies\
  \ (see [Dependencies](#dependencies) section).\n\n## Usage\n1. Ensure all dependencies are installed.\n\
  2. Prepare your input data in the correct directory structure (see [Input Data](#input-data) section).\n\
  3. Run the desired script. For example, to calculate NTCP for the left breast:\n   ```bash\n   python\
  \ cbct_ntcp_breast_left.py\n   ```\n4. For the right breast:\n   ```bash\n   python cbct_ntcp_breast_right.py\n\
  \   ```\n5. For sensitivity analysis:\n   ```bash\n   python ntcp_sensitivity.py\n   ```\n\n## Input\
  \ Data\nThe scripts expect DICOM files (RT Structure and RT Dose) in the following directory structure:\n\
  ```\nC:/RT_Project/data_cbct/Breast_CBCT/breast_left/\n├── PatientID1/\n│   ├── RS...dcm (RT Structure\
  \ file)\n│   ├── ...CBCT5...dcm (RT Dose file for 5 MU)\n│   └── ...CBCT10...dcm (RT Dose file for 10\
  \ MU)\n├── PatientID2/\n│   ├── RS...dcm\n│   ├── ...CBCT5...dcm\n│   └── ...CBCT10...dcm\n...\n```\n\
  - **RT Structure files** should start with \"RS\".\n- **RT Dose files** should contain \"CBCT5\" for\
  \ 5 MU and \"CBCT10\" for 10 MU in their filenames.\n- Update the `root_dir` variable in the script\
  \ if your data is stored in a different location.\n\n## Output Files\nRunning the scripts will generate\
  \ the following output files:\n- **`CBCT_Breast_Left_Summary_WithStats.csv`**: A CSV file containing\
  \ NTCP and dose statistics (min, mean, max) for each patient, plan (5 MU or 10 MU), and ROI.\n- **`CBCT_Breast_Left_Statistics.csv`**:\
  \ A CSV file with statistical analysis results, including mean and standard deviation of doses and NTCP,\
  \ along with p-values from paired t-tests.\n- **`CBCT_NTCP_Boxplot_WithStats_for_Breast_Left.png`**:\
  \ A boxplot comparing NTCP values between 5 MU and 10 MU protocols for each ROI.\n- **`CBCT_Dose_Boxplot_WithStats_for_Breast_Left.png`**:\
  \ A boxplot comparing mean doses between 5 MU and 10 MU protocols for each ROI.\n\n(Note: Similar files\
  \ will be generated for the right breast when running `cbct_ntcp_breast_right.py`.)\n\n## Dependencies\n\
  The following Python libraries are required:\n- Python 3.x\n- NumPy (for numerical computations)\n-\
  \ Pandas (for data manipulation and CSV output)\n- SciPy (for statistical tests and NTCP calculations)\n\
  - Matplotlib (for plotting boxplots)\n- Seaborn (for enhanced visualization)\n- dicompyler-core (for\
  \ DICOM file parsing and DVH calculations)\n\nInstall them using pip:\n```bash\npip install numpy pandas\
  \ scipy matplotlib seaborn dicompyler-core\n```\n\n## Contributing\nContributions are welcome! If you\
  \ have suggestions, improvements, or bug fixes:\n1. Fork the repository.\n2. Create a new branch (`git\
  \ checkout -b feature-branch`).\n3. Make your changes and commit (`git commit -m \"Add feature\"`).\n\
  4. Push to your branch (`git push origin feature-branch`).\n5. Open a pull request.\n\n\n"

readme_excerpt: '# Brain-Tumor-Detection-And-Segmentation-Using-MRI-Image

  # 🧠 Brain Tumor Detection and Segmentation Using MRI Images


  ## 📌 Project Overview


  This project presents a deep learning-based system for **Brain Tumor Detection** and **Brain Tumor Segmentation**
  using MRI images.


  The project consists of two independent modules:


  - **Brain Tumor Detection (Classification)** using a Convolutional Neural Network (CNN).

  - **Brain Tumor Segmentation** using the nnU-Net framework.


  The primary objective is to assist in the automatic detection and localization of brain tumors from
  MRI scans, helping improve the accuracy and efficiency of medical image analysis.


  ---


  ## ✨ Features


  - Brain Tumor Detection using CNN

  - Brain Tumor Segmentation using nnU-Net

  - MRI Image Preprocessing

  - Deep Learning Model Training

  - Prediction on MRI Images

  - Visualization of Detection Results

  - Visualization of Segmentation Results

  - Modular and Organized Project Structure


  ---


  ## 🧠 Models Used


  ### Brain Tumor Detection

  - Convolutional Neural Network (CNN)


  ### Brain Tumor Segmentation

  -  Pretrained nnU-Net model


  ---



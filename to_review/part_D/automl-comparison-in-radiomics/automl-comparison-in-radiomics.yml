readme_excerpt: "# AutoML-Comparison-in-Radiomics\n\nOfficial code for the paper **\"Benchmarking AutoML\
  \ Frameworks for Radiomics: A Comparative Evaluation of Performance, Efficiency and Usability\"**.\n\
  \nThis work provides a comprehensive evaluation of general-purpose and radiomics-specific Automated\
  \ Machine Learning (AutoML) frameworks on ten diverse radiomics classification tasks.\n\nThis repository\
  \ contains the source code and dockerfiles to reproduce the results of the manuscript:\n\nThe public\
  \ datasets used are:\n\n* **OpenRadiomics** → https://openradiomics.org/  \n  * BraTS → https://openradiomics.org/?page_id=1163\
  \  \n  * TCIA  → https://openradiomics.org/?page_id=1144\n* **WORC Database** → https://github.com/MStarmans91/WORCDatabase\n\
  \n---\n\n* **dockerfiles_** Each Dockerfile encapsulates all dependencies required to run the corresponding\
  \ AutoML framework.  \n  The images are intentionally kept independent so you can benchmark a single\
  \ framework without building the others.\n* **scripts_** Training code that reproduce the experiments\
  \ reported in the manuscript.\n\n---\n\n## Data Format\n\nEach script expects **a single CSV file named\
  \ `data.csv`** inside the directory passed via the `-i / --input` flag.\n\n```\n/path/to/your_dataset/\n\
  └── data.csv\n```\n\n* Rows = individual subjects\n* Columns = clinical and radiomic features\n* Last\
  \ column = binary target label (0 / 1).\n\n---\n\n##  Docker Images\n\nAll images can be built from\
  \ the repository root. Below you find the exact commands (feel free to change the `-t` tag to\nwhatever\
  \ naming convention you prefer):\n\n> Prerequisites: [Docker](https://docs.docker.com/get-docker/)\n\
  \n```bash\ndocker build -f <path_to_dockerfile> -t <docker_image_name>:<docker_tag> .\n\n# Example\n\
  docker build -f dockerfiles/Dockerfile_autogluon  -t automl:autogluon  .\n```\n\n```bash\n# Running\
  \ the containers\ndocker run -v <path_to_data>:/folder <docker_image>:<docker_tag> -i /folder\n```\n"

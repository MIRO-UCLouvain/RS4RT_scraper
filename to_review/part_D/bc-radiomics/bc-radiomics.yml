readme_excerpt: "# Interpretable Machine Learning Radiomics Models Integrating Tumor and Automated 3D\
  \ Body Composition for Survival Prediction in Resectable Non-Small Cell Lung Cancer: A Retrospective\
  \ Multicenter Study\n\n\n<hr>\n\n\n![radio](img/img.png)\n\n<hr>\n\n## Package dependencies\nThe project\
  \ is built with PyTorch 2.0.0, Python3.9.\n\n## Usage\nTo train spine or body composition segmentation\
  \ results:\n```\npython spine_and_body_composition_seg/nnunetv2/run/run_training.py --dataset_name_or_id\
  \ id \n```\nTo obtain spine and body composition segmentation results:\n```\npython spine_and_body_composition_seg/nnunetv2/inference/predict_from_raw_data.py\
  \ -i /path/to/your/CT/image -o /path/to/output/dir -d dataset_choice\n```\nTo obtain radiomics information:\n\
  ```\npython find_ori_and_get_metrics/fine_spine_and_get_metrics_radiomic.py \n```\n\n\n## Acknowledgement\n\
  This code is inspired by [nnUNet](https://github.com/MIC-DKFZ/nnUNet) and [Comp2Comp](https://github.com/StanfordMIMI/Comp2Comp).\n\
  \n"

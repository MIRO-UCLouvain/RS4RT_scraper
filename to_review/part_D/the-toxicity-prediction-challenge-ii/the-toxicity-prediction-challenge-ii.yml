readme_excerpt: "# the-toxicity-prediction-challenge-ii\n\n**Name: Sanket Dilip Vagal  \nStFX Student\
  \ ID Number: 202207184  \nStFX email ID: x2022fjg@stfx.ca**\n\nKaggle: https://www.kaggle.com/competitions/the-toxicity-prediction-challenge-ii/\n\
  \nGithub: https://github.com/sanketvagal/the-toxicity-prediction-challenge-ii\n\nTo get started, clone\
  \ this repository locally.\n\n### Steps to execute the Docker image\n\n1. Make sure Docker Daemon is\
  \ running on your machine\n\n2. Set current working directory to `the-toxicity-prediction-challenge-ii`\n\
  \n3. Build the docker image\n`docker build -t the-toxicity-prediction-challenge-ii .`\n\n4. Run the\
  \ docker image \n\n\tFor Unix-based machines (Linux, MacOS):\n\t`docker run -v ${PWD}/output:/usr/src/app/output\
  \ -m 13g --cpus=8 -e PYTHONUNBUFFERED=1 the-toxicity-prediction-challenge-ii`\n\n\tFor Windows machines:\n\
  \t`docker run -v %cd%/output:/usr/src/app/output -m 13g --cpus=8 -e PYTHONUNBUFFERED=1 the-toxicity-prediction-challenge-ii`\n\
  \n\tUpdate the -m value as per the memory and —cpus as per the number of cpus to be allocated  \n\t\
  Note: You may need to manually set the memory and CPU limit in Docker settings\n\n5. The final submission.csv\
  \ file will be generated in the `the-toxicity-prediction-challenge-ii/output` folder\n\n### Steps to\
  \ execute the python script via command line\n\nBuilding and running the Docker image may take a long\
  \ amount of time. Instead, to run the `main.py` script via command line:\n\n1. Install the required\
  \ dependencies by running the following command:\n`pip install --no-cache-dir -r requirements.txt`\n\
  \n2. Run the `main.py` script\n`python3 main.py`\n\n3. The final submission.csv file will be generated\
  \ in the `output` folder of the current working directory\n\n\n\nAlternatively, the code as a python\
  \ notebook can also be viewed on Kaggle here:\nhttps://www.kaggle.com/code/sanketvagal/x2022fjg\n"

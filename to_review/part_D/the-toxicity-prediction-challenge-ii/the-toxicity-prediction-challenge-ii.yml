readme_excerpt: "# The-Toxicity-Prediction-Challenge-II\n**The Toxicity Prediction Challenge II for CSCI\
  \ 555, 2023**\n\n**Data Overview-**\nDataset- https://www.kaggle.com/competitions/the-toxicity-prediction-challenge-ii\n\
  File Format - .csv\nLanguage & Version- Python 3\nOS- Windows 10\nAccuracy- 0.81337(Private Leaderboard)\n\
  \n**Preface:**\nThere are 2 files that are required to run & produce the same output as before\n1. Feature\
  \ Selection using Variance Threshold \n2. Final Submission\n\n\n**The reason for 2 files~**\nThe features\
  \ were first generated using Variance Threshold and then they were replaced within 'Final Submission',\
  \ to avoid rerunning the entire process at each run. \nThe generated features have then been added to\
  \ 'Final Submission' & it was edited as required for the run. \nYou do not need to 'Submit' the 'Variance\
  \ Threshold' file, a 'Run All' will be sufficient to generate the features. \n\n\n\nSteps to reproduce\
  \ code- \nMethodology on Kaggle- \n1) Download the notebooks.\n2) Make sure the data is mounted when\
  \ the notebook is loaded. \n3) Run the notebook on '(https://www.kaggle.com/competitions/the-toxicity-prediction-challenge-ii/submissions)'\
  \ under 'Submissions'.\n4) Submit the predictions\n5) The generated solution 'submission.csv' when submitted,\
  \ will generate the accuracy. \n"

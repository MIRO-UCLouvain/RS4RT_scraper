readme_excerpt: '# Tox21 and SIDER Structure-Enhanced GNN Experiments


  ## Contents


  ```text

  .

  ├── data/

  │   ├── raw/

  │   ├── processed/

  │   └── reference/

  ├── figures/

  ├── notebooks/

  │   ├── main_models/

  │   ├── baselines/

  │   ├── imbalance_missing_labels/

  │   └── interpretability/

  ├── results/

  ├── CODE_FILE_MAPPING.md

  ├── README.md

  ├── requirements.txt

  └── .gitignore

  ```


  ## Notebook Groups


  - `notebooks/main_models/`: main structure-enhanced GNN models for Tox21 and SIDER under single-label
  learning and multi-label learning.

  - `notebooks/baselines/`: traditional ML baselines, DeepTox, LLM-feature baselines, D-MPNN, and AttentiveFP.

  - `notebooks/imbalance_missing_labels/`: focal loss, oversampling, KNN imputation, node-feature imputation,
  and graph-imputation experiments.

  - `notebooks/interpretability/`: masking-based AUC-drop importance, molecule highlighting, Integrated
  Gradients, and summary plots.


  ## Data


  Small raw and processed CSV/NPY files needed by the notebooks are included under `data/`. Large model
  weights, cached feature tensors, checkpoints, and intermediate training outputs are intentionally excluded.


  The original large LLM feature tensors and model checkpoints, such as `*.pt`, `*.pth`, and `*.pkl`,
  should be regenerated or stored separately.


  ## Paths and Outputs


  Each notebook includes a repository path setup cell. The notebooks automatically locate the repository
  root and resolve paths through:


  - `data/raw/` for raw datasets.

  - `data/processed/` for lightweight processed data.

  - `data/reference/` for functional-group and descriptor reference files.

  - `results/generated/` for newly generated training outputs.

  - `results/manuscript_tables/` for final tables reported in the manuscript.

  - `figures/` for generated figures.


  Re-running notebooks should write new experiment outputs to `results/generated/` and should not overwrite
  the manuscript summary tables.'

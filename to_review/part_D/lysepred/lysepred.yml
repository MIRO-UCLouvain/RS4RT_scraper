readme_excerpt: "# LysePred\r\n\r\nThis repository contains code and data for \"LysePred: A Multi-Scale\
  \ Convolutional Neural Network for Predicting Hemolytic Activity of Antimicrobial Peptides\".\r\n\r\n\
  ## Introduction\r\nThis work proposes LysePred, a multi-scale convolutional neural network for hemolytic\
  \ toxicity prediction. LysePred employs parallel branches with exponentially spaced kernel sizes to\
  \ simultaneously capture local amino acid motifs (bigrams, 4-grams) and longer-range amphipathic patterns\
  \ (8-grams to 32-grams). LysePred achieves state-of-the-art results on six benchmark datasets, exceeding\
  \ the performance of the second-best method by 9.13% in MCC and 3.65% in ACC on average, while maintaining\
  \ exceptional stability (MCC CV < 6.92%, ACC CV < 2.73%).\r\n\r\n## Main Results\r\nTable. Performance\
  \ comparison of LysePred with state-of-the-art methods across six benchmark datasets. \r\n<img width=\"\
  713\" height=\"665\" alt=\"image\" src=\"https://github.com/user-attachments/assets/cad5f6e0-a713-400f-b54e-d2acaec41bc6\"\
  \ />\r\n\r\n## Dependencies\r\nCreate environment and install required packages using conda:\r\n\r\n\
  `conda create --name LysePred --file requirements.txt`\r\n\r\nIf the NVIDIA driver version does not\
  \ support CUDA 11.3 you may edit requirements.txt to use older cudatooklit instead.\r\n\r\n## How to\
  \ run?\r\n\r\n### Training\r\nThe entrance to the training model is in \"main\" folder.\r\n\r\nPlease\
  \ refer to the script `train_repeat.sh` to train the LysePred. Training options can be modified within\
  \ the script.\r\n\r\n### Result\r\nYou can find the output result data under `$HOME/data/results` by\
  \ default.\r\n\r\n\r\n\r\n\r\n\r\n"

readme_excerpt: "# DAMM-Net++: Anatomy-Change-Aware Bidirectional Selective State-Space Memory for Clinically\
  \ Deployed Thoracic Radiotherapy Auto-Contouring\n\n[![arXiv](https://img.shields.io/badge/arXiv-XXXX.XXXXX-b31b1b.svg)](https://arxiv.org/abs/XXXX.XXXXX)\n\
  [![License: MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](https://opensource.org/licenses/MIT)\n\
  [![Python 3.9+](https://img.shields.io/badge/python-3.9+-blue.svg)](https://www.python.org/downloads/)\n\
  [![PyTorch](https://img.shields.io/badge/PyTorch-2.0+-red.svg)](https://pytorch.org/)\n\nThis repository\
  \ contains the official implementation of **DAMM-Net++** for thoracic radiotherapy auto-contouring.\n\
  \n> **DAMM-Net++: Anatomy-Change-Aware Bidirectional Selective State-Space Memory for Clinically Deployed\
  \ Thoracic Radiotherapy Auto-Contouring**  \n> *Anonymous Author One, Anonymous Author Two*  \n> **Medical\
  \ Image Analysis (Under Review)**  \n> \U0001F4C4 [Preprint](https://arxiv.org/abs/XXXX.XXXXX)\n\n---\n\
  \n## \U0001F4CC Overview\n\nLung cancer remains the leading cause of cancer-related mortality worldwide,\
  \ with radiation therapy as a cornerstone of treatment. Accurate delineation of organs-at-risk (OARs)\
  \ and target volumes on planning CT scans is critical for dose distribution, tumor control, and toxicity\
  \ risk. However, manual contouring is time-intensive, operator-dependent, and subject to inter-observer\
  \ variability.\n\n**DAMM-Net++** is a **clinically deployed** 2.5D deep learning architecture that addresses\
  \ three persistent challenges in thoracic radiotherapy auto-contouring:\n\n- **Inter-slice surface incoherence**\n\
  - **Systematic failure on small low-contrast targets**\n- **Absence of per-case reliability signals**\n\
  \n### Key Highlights\n\n- ✅ **Clinically Deployed** — Production-grade web application with DICOM RTSTRUCT\
  \ export integrated at Bangladesh Medical University\n- ✅ **Multi-Centre Dataset** — 2,146 patients\
  \ across 4 Bangladeshi tertiary-care hospitals\n- ✅ **State-of-the-Art Performance** — Mean Dice: 0.955,\
  \ HD95: 3.78 mm\n- ✅ **Multicenter Reader Study** — 17 oncologists, 150 cases, 75–80% time reduction\n\
  - ✅ **External Validation** — 112 patients, <5% internal-to-external drop\n- ✅ **Uncertainty Estimation**\
  \ — Calibrated per-voxel confidence for clinical triage\n- ✅ **Efficient** — 21.7M parameters, 22.4\
  \ ms/slice on NVIDIA T4 GPU\n\n---\n\n## \U0001F3D7️ Architecture\n\n### Overall Architecture\n\nDAMM-Net++\
  \ is a 2.5D sequence-to-sequence segmentation network that processes $T=5$ consecutive axial CT slices.\
  \ The architecture comprises four principal components:\n\n1. **Shared ConvNeXt Encoder** — Extracts\
  \ multi-scale feature pyramids\n2. **Multi-Scale Inter-Slice Transition Branch** — Models anatomical\
  \ change between adjacent slices\n3. **Bidirectional Selective State-Space Memory (SSM)** — Propagates\
  \ context in both through-plane directions\n4. **Memory-Guided Boundary-Aware Decoder** — Reconstructs\
  \ full-resolution predictions with boundary refinement\n\n<p align=\"center\">\n  <img src=\"figures/DAMM_Net++_Updated_V2.png\"\
  \ alt=\"DAMM-Net++ architecture\" width=\"90%\">\n</p>\n\n### Core Modules\n\n#### Multi-Scale Inter-Slice\
  \ Transition Branch\nComputes feature-space difference $\\Delta F_t = F_t^{(4)} - F_{t-1}^{(4)}$ and\
  \ processes it at three spatial scales (native, half, quarter resolution) with channel and spatial attention.\n\
  \n<p align=\"center\">\n  <img src=\"figures/Detail_module_V2.png\" alt=\"Core modules\" width=\"90%\"\
  >\n</p>\n\n#### Bidirectional Selective State-Space Memory\nThe Mamba-based SSM generates input-dependent\
  \ parameters $(\\Delta_t, B_t, C_t)$ from the anatomy-change-informed representation $X_t = F_t^{(4)}\
  \ + \\Delta E_t$, enabling selective retention of clinically relevant through-plane context.\n\n####\
  \ Memory-Guided Boundary-Aware Decoder\nIntegrates memory-guided skip attention and learnable edge detection\
  \ to sharpen predictions near organ boundaries.\n\n#### Uncertainty Estimation\nPredicts per-pixel log-variance\
  \ $\\log\\hat{\\sigma}^2_t$ with confidence map $\\hat{c}_t = \\sigma(-\\log\\hat{\\sigma}^2_t) = 1/(1+\\\
  hat{\\sigma}^2_t)$ for clinical quality assurance.\n\n---\n\n## \U0001F4CA Dataset\n\n| Feature | Details\
  \ |\n|---------|---------|\n| **Total Patients** | 2,146 |\n| **Institutions** | 4 (Bangladesh Medical\
  \ University, Square Hospital Ltd., Labaid Hospital, United Hospital Ltd.) |\n| **Anatomical Classes**\
  \ | 9 (Spinal Cord, Esophagus, Heart, Right Lung, Left Lung, Trachea, Body, GTV, CTV) |\n| **Internal\
  \ Split** | Training: 1,424 (70%), Validation: 305 (15%), Test: 305 (15%) |\n| **External Cohort** |\
  \ 112 patients (United Hospital Ltd.) |\n| **Inter-Rater Reliability** | IoU > 0.95 for all structures\
  \ ($n = 10$ annotators) |\n\n---\n\n## \U0001F9E0 Model Performance\n\n### Quantitative Results (Key\
  \ Metrics)\n\n| Structure | Dice | IoU | HD95 (mm) | ASD (mm) | NSD |\n|-----------|------|-----|-----------|----------|-----|\n\
  | **Macro-Average** | **0.955** | **0.914** | **3.78** | **2.05** | **0.938** |\n| GTV | 0.957 | 0.919\
  \ | 3.82 | 1.17 | 0.854 |\n| CTV | 0.936 | 0.880 | 2.80 | 1.08 | 0.845 |\n| Trachea | 0.943 | 0.892\
  \ | 1.28 | 0.53 | 0.995 |\n| Esophagus | 0.906 | 0.828 | 6.87 | 5.40 | 0.929 |\n| Heart | 0.970 | 0.942\
  \ | 5.39 | 3.61 | 0.904 |\n\n### Baseline Comparison\n\nDAMM-Net++ outperforms four baseline architectures\
  \ (nnUNet, nnMamba, UNETR++, SwinUNETR) across all nine structures with statistically significant improvements\
  \ ($p < 0.05$, Hedges' $g$ up to 1.46).\n\n### Uncertainty Calibration\n\n| Metric | Value |\n|--------|-------|\n\
  | Weighted Mean ACE | 0.0095 |\n| AUROC (IoU < 0.85 prediction) | 0.960 |\n| Calibration Slope | 0.99\
  \ |\n\n### Reader Study Results\n\n| Metric | Junior (Unaided) | Junior (AI-Assisted) | Improvement\
  \ |\n|--------|------------------|----------------------|-------------|\n| Mean IoU | 0.861 | **0.925**\
  \ | +0.064 |\n| Mean HD95 | 6.07 mm | **3.98 mm** | -2.09 mm |\n| Contouring Time | 155 min | **31 min**\
  \ | **80.1%** ↓ |\n| Consultation Rate | 51.6% | **13.5%** | **73.8%** ↓ |\n| Confidence Score | 0.571\
  \ | **0.839** | +0.268 |\n\n### External Validation\n\n| Cohort | Mean IoU | Relative Gap |\n|--------|----------|--------------|\n\
  | Internal Test | 0.9322 | — |\n| External (UHL, $n=112$) | 0.9076 | **-2.64%** |\n\n---\n\n## \U0001F4BB\
  \ Computational Efficiency\n\n| Model | Params (M) | GFLOPs | Inference (ms/slice) | Peak VRAM (MB)\
  \ | Training (hrs) |\n|-------|------------|--------|----------------------|----------------|----------------|\n\
  | **DAMM-Net++ (Ours)** | **21.7** | **72.6** | **22.4** | **3,128** | **172.4** |\n| nnUNet | 31.2\
  \ | 42.1 | 14.2 | 3,452 | 185.6 |\n| nnMamba | 15.55 | 51.6 | 16.3 | 2,612 | 158.2 |\n| UNETR++ | 46.7\
  \ | 89.4 | 72.5 | 4,896 | 312.8 |\n| SwinUNETR | 62.2 | 105.8 | 76.4 | 5,234 | 348.6 |\n\n---\n\n##\
  \ \U0001F680 Clinical Deployment\n\nDAMM-Net++ is deployed at Bangladesh Medical University through\
  \ a **production-grade web application** with:\n\n- \U0001F5A5️ Interactive contour editing (Varian\
  \ Eclipse-inspired three-panel orthogonal display)\n- \U0001F4E4 Native DICOM RTSTRUCT export (compatible\
  \ with Varian Eclipse, RayStation, Elekta Monaco)\n- ⚡ Under 20 seconds inference time for a typical\
  \ thoracic CT (median 196 slices)\n- \U0001F52C Optional uncertainty heat overlay for quality assurance\n\
  - \U0001F468‍⚕️ Clinician-in-the-loop workflow: final contours subject to radiation-oncologist review\n\
  \n<p align=\"center\">\n  <img src=\"figures/Webview.png\" alt=\"Web application interface\" width=\"\
  90%\">\n</p>\n\n---\n\n## \U0001F9EA Ablation Studies\n\n### Component Contribution\n\n| Configuration\
  \ | Dice | HD95 (mm) |\n|---------------|------|-----------|\n| ConvNeXt U-Net (single-slice) | 0.9047\
  \ | 7.94 |\n| + Inter-slice transition | 0.9128 | 6.71 |\n| + Selective SSM (forward) | 0.9251 | 5.33\
  \ |\n| + Bidirectional + gated fusion | 0.9340 | 4.62 |\n| + Memory cross-attention | 0.9402 | 4.21\
  \ |\n| + MGBA decoder | 0.9481 | 3.94 |\n| **+ Uncertainty (Full)** | **0.9545** | **3.78** |\n\n###\
  \ Controlled Ablation: Inter-Slice Transition Signal\n\n| Model | Dice | $\\Delta$ vs SSM only |\n|-------|------|---------------------|\n\
  | SSM only | 0.9251 | — |\n| Randomized + SSM | 0.9254 | +0.0003 (ns) |\n| Shuffled + SSM | 0.9282 |\
  \ +0.0031* |\n| **Real + SSM** | **0.9350** | **+0.0099**** |\n\n---\n\n## \U0001F6E0️ Requirements\n\
  \n```bash\n# Core dependencies\n- Python >= 3.9\n- PyTorch >= 2.0.0\n- torchvision >= 0.15.0\n- numpy\
  \ >= 1.21.0\n- scipy >= 1.7.0\n- SimpleITK >= 2.3.0\n- pydicom >= 2.3.0\n- matplotlib >= 3.5.0\n- scikit-image\
  \ >= 0.19.0\n"

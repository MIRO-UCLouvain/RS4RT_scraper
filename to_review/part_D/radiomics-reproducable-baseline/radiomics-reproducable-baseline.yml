readme_excerpt: "# Radiomics MGMT Classification\n\nBinary classification of MGMT promoter methylation\
  \ status from MRI radiomics features.\nThe project compares three pipeline families across three MRI\
  \ regions (whole brain, whole tumor, brain+tumor):\n\n| Pipeline | Harmonization | Alignment | Uses\
  \ test features? |\n|---|---|---|---|\n| **CLF-BASE** | none | none | No |\n| **CLF-DG** | ComBat /\
  \ CORAL | TCA / GFK | Features only (fit on train) |\n| **CLF-UDA** | ComBat / CORAL / none | TCA /\
  \ GFK / SA / OT | Features only (UDA — legal) |\n\nAll pipelines use stratified group cross-validation\
  \ (patient groups do not leak across folds).\nTest labels are never seen during training, calibration,\
  \ or threshold selection.\n\n---\n\n## Repository structure\n\n```\nRadiomics MGMT Classification/ \
  \      ← repo root\n├── data/                             ← merged train/test CSVs (inputs to runners)\n\
  │   ├── all_regions_all_modalities_train.csv\n│   └── all_regions_all_modalities_test.csv\n├── src/\n\
  │   ├── common/          config.py, io.py, logging.py, anti_leak.py\n│   ├── preprocess/      impute,\
  \ winsorize, scale, variance/corr filter, elasticnet selector\n│   ├── models/          classifiers,\
  \ harmonization, alignment, calibration, threshold, HPO\n│   ├── runners/         runner_base_clf.py\
  \  (BASE/DG)\n│   │                    runner_clf_uda_light.py  (UDA, per-fold CV)\n│   ├── advval/\
  \          adversarial validation (domain AUC)\n│   ├── metrics/         AUROC, ECE, Brier, CI bootstrap,\
  \ classified cases\n│   ├── label_shift/     importance weighting for UDA\n│   ├── xai/            \
  \ SHAP global importance, partial dependence, stability\n│   └── project_paths.py ← central path registry\
  \ — change EXPERIMENT_ROOT here if needed\n├── scripts/\n│   ├── runners/\n│   │   ├── auto_experiment_base_runner.py\
  \    ← sweep: BASE + DG\n│   │   ├── auto_experiment_clf_uda_light.py  ← sweep: UDA (CLI args)\n│  \
  \ │   └── auto_experiments_best.py          ← re-run best configs (CLI args)\n│   ├── results summarization/\n\
  │   │   ├── generate_experiment_report.py     ← BASE/DG HTML report\n│   │   └── build_classified_test_cases_uda.py\n\
  │   ├── radiomics management/\n│   │   ├── whole_radiomics_file_maker.py     ← merge raw CSVs → data/\n\
  │   │   └── external_data_radiomics_extractor_with_cli_patched.py\n│   └── R analysis preparation/\n\
  │       ├── build_best_config_cfm.py          ← select best UDA experiments\n│       └── prepare_glmm_dataset.py\n\
  ├── environment.yml\n└── README.md\n\n../MGMT_radiomics_experiment/         ← experiment outputs (outside\
  \ the repo)\n    data/                             ← raw per-region radiomics CSVs (you place these)\n\
  \    configs/auto_generated/           ← YAML configs (auto-generated by sweep scripts)\n    experiments_results/\
  \              ← BASE + DG results\n    experiments_results_train_and_test_external/   ← UDA full-sweep\
  \ results\n    experiments_results_test_external/             ← UDA best-config re-run results\n```\n\
  \n---\n\n## Prerequisites\n\n- [Anaconda](https://www.anaconda.com/) or [Miniconda](https://docs.conda.io/en/latest/miniconda.html)\n\
  - Git\n\n**Python 3.10 is required.** CatBoost C extensions are incompatible with Python 3.13 (the current\
  \ Anaconda default). Do not use `conda install python` to upgrade without testing.\n\n---\n\n\n## Installation\n\
  \n```bash\ngit clone <repo-url>\ncd \"Radiomics MGMT Classification\"\n\nconda env create -f environment.yml\n\
  conda activate mgmt-radiomics\n```\n\nAll commands below assume `mgmt-radiomics` is active and you are\
  \ in the repo root.\n\n---\n\n## Complete experiment workflow\n\n```\n[raw CSVs in ../MGMT_radiomics_experiment/data/]\n\
  \        │\n        ▼  Step 1: whole_radiomics_file_maker.py\n[data/all_regions_all_modalities_train.csv]\n\
  [data/all_regions_all_modalities_test.csv]\n        │\n        ├──────────────────────────────────────────────────────────┐\n\
  \        ▼  Step 2a                                                 ▼  Step 2b\nauto_experiment_base_runner.py\
  \                    auto_experiment_clf_uda_light.py\n(BASE + DG, ~360 experiments)               \
  \      (UDA, full sweep)\n        │                                                           │\n  \
  \      ▼                                                           ▼\nexperiments_results/CLF-BASE-XAI/\
  \             experiments_results_train_and_test_external/\nexperiments_results/CLF-DG-XAI/        \
  \      CLF-UDA-LIGHT/experiments/<hash>/\n        │                                                \
  \           │\n        ▼  Step 3a                                                  ▼  Step 3b (manual)\n\
  generate_experiment_report.py                 pick best hashes from UDA summary CSV\n→ summary_final.csv\
  \ + summary_report.html                          │\n                                               \
  \                    ▼  Step 4\n                                              auto_experiments_best.py\
  \ --best_csv ...\n                                              → experiments_results_test_external/\n\
  \                                                CLF-UDA-LIGHT/best_experiments/<hash>/\n          \
  \                                                          │\n                                     \
  \                               ▼  Step 5\n                                              build_best_config_cfm.py\n\
  \                                              → best_config_cfm_uda_light_by_val.csv\n            \
  \                                                        │\n                                       \
  \                             ▼  Step 6\n                                              build_classified_test_cases_uda.py\n\
  \                                              → classified_test_cases_uda.csv\n```\n\n---\n\n## Step\
  \ 1 — Data preparation (run once)\n\nPlace the raw per-region radiomics CSVs in `../MGMT_radiomics_experiment/data/`:\n\
  \n```\n../MGMT_radiomics_experiment/data/\n    BraTS2021_whole_brain_radiomics.csv    # train, whole-brain\
  \ features\n    brats2021_WT.csv                       # train, whole-tumor features\n    brats21_mgmt_index.csv\
  \                 # train labels: pid + mgmt columns\n    BraTS2021_test_whole_brain_radiomics.csv\n\
  \    BraTS2021_test_whole_tumor_radiomics.csv\n    external85_index.csv                   # test labels:\
  \ pid + mgmt columns\n```\n\nThen merge them into unified train/test CSVs:\n\n```bash\npython \"scripts/radiomics\
  \ management/whole_radiomics_file_maker.py\"\n```\n\nOutput: `data/all_regions_all_modalities_train.csv`\
  \ and `data/all_regions_all_modalities_test.csv`.\nFeature columns are prefixed with `whole_brain_`\
  \ or `whole_tumor_` so the `region` config filter works.\n\n> **Paths**: all paths are defined in `src/project_paths.py`.\
  \ If you move the experiment folder, change `EXPERIMENT_ROOT` there — no other file needs editing.\n\
  \n---\n\n## Step 2a — BASE + DG sweep\n\n```bash\npython scripts/runners/auto_experiment_base_runner.py\n\
  ```\n\n- Generates YAML configs for all combinations: 5 models × 2 harmonizations × 2 alignments × 2\
  \ calibrations × 3 thresholds × 2 kernels × 3 regions × 2 seeds = ~360 BASE + ~240 DG experiments\n\
  - Runs up to 6 experiments in parallel (adjust `max_workers` in the script if needed)\n- Tracks status\
  \ in `../MGMT_radiomics_experiment/experiments_results/experiments_registry.json`\n- **Resume after\
  \ crash**: experiments that were killed mid-run are automatically reset to `pending` on the next launch\n\
  \n**Per-experiment output** (`experiments_results/CLF-BASE-XAI/<hash>/`):\n```\nconfig_used.yaml\nmetrics_task.json\
  \      ← test AUROC, AUPRC, F1, ECE, Brier\nmetrics_train.json     ← OOF train metrics (calibrated)\n\
  metrics_val.json       ← OOF validation AUROC/accuracy (for model selection)\nadv_report.json      \
  \  ← domain_auc (train vs test separability)\nconfusion_test.csv     ← TP, TN, FP, FN at threshold\n\
  thresholds.json        ← selected threshold value\nyte.npy, preds_test.npy, grp_te.npy\nanti_leak_report.json\n\
  ```\n\n**Summary CSV** (one row per experiment): `experiments_results/summary_YYYYMMDD_HHMM.csv`\n\n\
  ---\n\n## Step 2b — UDA sweep\n\nThe UDA runner has full CLI control. Data paths must always be provided\
  \ explicitly — the script defaults point to files that do not exist in this repo.\n\n```bash\npython\
  \ scripts/runners/auto_experiment_clf_uda_light.py \\\n  --data-train data/all_regions_all_modalities_train.csv\
  \ \\\n  --data-test  data/all_regions_all_modalities_test.csv \\\n  --regions    whole_brain,whole_tumor,brain_and_tumor\
  \ \\\n  --seeds      42,33 \\\n  --models     logreg,randomforest,xgb,lgbm,catboost \\\n  --harmonize\
  \  combat,coral,none \\\n  --align      tca,gfk,sa,none \\\n  --align-on   train \\\n  --calibration\
  \ isotonic,platt \\\n  --threshold   youden,target_spec,fixed \\\n  --max-workers 6 \\\n  --timeout\
  \     1200\n```\n\n> **Timeout note:** ComBat harmonization + TCA/GFK kernel computation on 500+ features\
  \ takes 5–10 min per experiment. The default of 1200s (20 min) covers all model/alignment combinations\
  \ without HPO. Do not use `--timeout 300` — experiments will be killed mid-fold and marked failed.\n\
  \nQuick test (single model, minimal grid, dry-run to verify configs only):\n```bash\npython scripts/runners/auto_experiment_clf_uda_light.py\
  \ \\\n  --data-train data/all_regions_all_modalities_train.csv \\\n  --data-test  data/all_regions_all_modalities_test.csv\
  \ \\\n  --models logreg --harmonize none --align none --seeds 42 --dry-run\n```\n\nRemove `--dry-run`\
  \ to execute. Output goes to:\n`../MGMT_radiomics_experiment/experiments_results_train_and_test_external/`\n\
  \n**Per-experiment output** (UDA runner uses per-fold CV — each fold is a separate model):\n```\n<hash>/\n\
  \    config_used.yaml\n    metrics_cv.json         ← mean + per-fold metrics (train / val / test)\n\
  \    metrics_task.json       ← mean test metrics (AUROC, ECE, …) — for registry\n    adv_report_before.json\
  \  ← domain_auc before harmonization\n    adv_report.json         ← domain_auc after alignment\n   \
  \ uda_mode.json           ← \"transductive\" or \"strict_external\"\n    yte.npy, grp_te.npy\n    fold_0/\
  \ … fold_4/\n        metrics_train.json, metrics_val.json, metrics_test.json\n        thresholds.json\n\
  \        confusion_test.csv\n        classified_test_cases.csv\n        preds_test.npy, preds_test_raw.npy\n\
  \        hpo_report.json, best_params.json   (if HPO enabled)\n```\n\n**Summary CSV** (per-fold rows\
  \ + mean row per experiment):\n`experiments_results_train_and_test_external/summary_UDA_YYYYMMDD_HHMM.csv`\n\
  \n---\n\n## Step 3a — BASE/DG report\n\n```bash\npython \"scripts/results summarization/generate_experiment_report.py\"\
  \n```\n\nMerges all `summary_*.csv` files from `experiments_results/`, deduplicates by AUROC, and writes:\n\
  - `experiments_results/summary_final.csv`\n- `experiments_results/summary_report.html` (interactive\
  \ Plotly charts, statistical tests)\n\n---\n\n## Step 3b → 4 — Select and re-run best UDA configs\n\n\
  After the UDA sweep, identify the best configuration per (region, model) using the summary CSV.\nThen\
  \ re-run those configs with the best-experiments runner (which produces the output structure expected\
  \ by the analysis scripts):\n\n```bash\npython scripts/runners/auto_experiments_best.py \\\n  --best_csv\
  \   path/to/best_configs.csv \\\n  --train_data data/all_regions_all_modalities_train.csv \\\n  --test_data\
  \  data/all_regions_all_modalities_test.csv \\\n  --output_dir ../MGMT_radiomics_experiment/experiments_results_test_external\n\
  ```\n\nThe `best_configs.csv` must have columns: `model`, `region`, `harmonize`, `align`, `align_on`,\
  \ `kernel`, `calibration`, `threshold`, `seed`.\n\nOutput: `experiments_results_test_external/CLF-UDA-LIGHT/best_experiments/<hash>/`\n\
  \n---\n\n## Step 5 — Analyze best UDA experiments\n\n```bash\npython \"scripts/R analysis preparation/build_best_config_cfm.py\"\
  \n```\n\nReads from `UDA_EXPERIMENTS_ROOT` (defined in `src/project_paths.py` as\n`experiments_results_test_external/CLF-UDA-LIGHT/best_experiments/`).\n\
  \nApplies adequacy filters:\n- `AUROC_val >= 0.65` (out-of-fold validation, not test — avoids selection\
  \ bias)\n- Overfitting gap `AUROC_train - AUROC_test <= 0.15`\n- `ECE <= 0.10`\n- Sensitivity and specificity\
  \ both `>= 0.45`\n- Predicted positive fraction between 0.15 and 0.85\n\nOutput: `../MGMT_radiomics_experiment/experiments_results/best_config_cfm_uda_light_by_val.csv`\n\
  \n---\n\n## Step 6 "

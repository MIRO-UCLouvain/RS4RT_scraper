readme_excerpt: "## Calibration\nStart by checking the calibration you want to use: \n- If it is already\
  \ in the calibration folder (EBT3 or EBT4), just call it at the beginning of the *DoseMeasurementScript*\
  \ by assigning the right film type inside de \"filmtype\" variable. It will use the extracted intensities\
  \ and corresponding doses stored in /calibration to calculate the right fit parameters.\n  \n- If not,\
  \ analyze your new calibration films through the *CalibrationScript*. If you name your calibration film\
  \ scans folder as *your_filmtype* and your calibration doses txt file as *your_filmtype_dose* inside\
  \ /calibration (like the current EBT3 and EBT4 film types), you will just have to enter your film type\
  \ inside the \"filmtype\" variable in the first cell of the script to have your fit parameters calculated.\
  \ The extracted intensities will be stored in a txt file named \"filmtype_int_channel\" inside /calibration.\n\
  \  \nYou can then use the *DoseMeasurementScript* with your new calibration by assigning your new film\
  \ type inside de \"filmtype\" variable at the beginning.\n\n## Dose Measurement\n\nThis part consists\
  \ of two cells: \n- The first one is here to test and customize the square's position in wich you want\
  \ to measure the dose, typically on Hg.\n  \n- The second one is basically the same code but with a\
  \ loop to go through the whole batch, with the defined square. You can also choose to have an \"automatic\"\
  \ square positioning, targetting the center of mass for each film.  \n\nResults are stored in a txt\
  \ file inside /DoseResults that you name inside the \"result_path\" variable at the beginning of the\
  \ second cell.\n"

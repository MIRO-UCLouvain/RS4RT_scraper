description: Radiochromic Films are passive dosimeters, suited to measure doses at Ultra-High dose rates
  (FLASH) with very high energies in the context of medical physics research. This image processing algorithm
  using OpenCV library presents a way to quickly analyze irradiated film batches at once, extracting the
  delivered dose in Gy.

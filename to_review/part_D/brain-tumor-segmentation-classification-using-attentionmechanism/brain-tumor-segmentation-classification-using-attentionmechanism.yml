readme_excerpt: "# \U0001F9E0 Brain Tumor Classification & Segmentation\n\n> A comprehensive deep learning\
  \ project for brain tumor analysis using MRI scans. Features 10+ classification models, U-Net segmentation,\
  \ GradCAM explainability, and a premium web application.\n\n---\n\n## \U0001F4DA Deep Dive Documentation\n\
  I have created 4 detailed guides to help you understand every part of this project:\n- **[Part 1: Data\
  \ Processing & Preparation](docs/01_data_processing.md)**\n- **[Part 2: Multi-Model Classification](docs/02_classification.md)**\n\
  - **[Part 3: Segmentation & AI Explainability](docs/03_segmentation_and_explainability.md)**\n- **[Part\
  \ 4: Web Integration (Backend & Frontend)](docs/04_web_integration.md)**\n- **[Part 5: In-Depth EDA\
  \ & Advanced Processing](docs/05_eda_and_advanced_processing.md)**\n\n---\n\n## \U0001F4CA Dataset\n\
  \n**Merged Multi-Source Dataset (~15,000+ images)** created by combining 3 Kaggle datasets:\n\n| Dataset\
  \ | Source | Images |\n|---------|--------|--------|\n| Dataset 1 | `sartajbhuvaji/brain-tumor-classification-mri`\
  \ | ~3,264 |\n| Dataset 2 | `masoudnickparvar/brain-tumor-mri-dataset` | ~7,153 |\n| Dataset 3 | `ahmedhamada0/brain-tumor-detection`\
  \ (Br35H) | ~3,060 |\n\n**Classes:** Glioma, Meningioma, No Tumor, Pituitary\n\n**Segmentation:** 3,064\
  \ MRI + binary mask pairs (`nikhilroxtomar/brain-tumor-segmentation`)\n\n### Deduplication\nImages are\
  \ deduplicated using **perceptual hashing** to remove near-identical images across datasets.\n\n---\n\
  \n## \U0001F3D7️ Project Structure\n\n```\nbrain-tumor-project/\n├── data/\n│   ├── raw/           \
  \            # Raw downloads from Kaggle\n│   ├── classification/            # Merged & deduplicated\n\
  │   └── segmentation/              # Images + masks\n├── notebooks/\n│   ├── 00_dataset_merge.ipynb\
  \     # Download, merge & dedup\n│   ├── 01_eda.ipynb               # Exploratory Data Analysis\n│ \
  \  ├── 02_custom_cnn.ipynb        # Custom CNN\n│   ├── 03_vgg16.ipynb             # VGG16\n│   ├──\
  \ 04_vgg19.ipynb             # VGG19\n│   ├── 05_resnet50.ipynb          # ResNet50\n│   ├── 06_resnet101.ipynb\
  \         # ResNet101\n│   ├── 07_inceptionv3.ipynb       # InceptionV3\n│   ├── 08_densenet121.ipynb\
  \       # DenseNet121\n│   ├── 09_mobilenetv2.ipynb       # MobileNetV2\n│   ├── 10_efficientnetb0.ipynb\
  \    # EfficientNetB0\n│   ├── 11_xception.ipynb          # Xception\n│   ├── 12_model_comparison.ipynb\
  \  # Comparison & Paper Results\n│   ├── 13_unet_segmentation.ipynb # U-Net Segmentation\n│   └── 14_gradcam.ipynb\
  \           # GradCAM Visualization\n├── models/                        # Saved .h5 model weights\n\
  ├── results/                       # JSON results & LaTeX tables\n├── webapp/                      \
  \  # Flask web application\n│   ├── app.py\n│   ├── templates/index.html\n│   └── static/{css,js}/\n\
  ├── utils/\n│   ├── preprocessing.py           # Data loading & augmentation\n│   ├── gradcam.py   \
  \              # GradCAM utilities\n│   └── model_loader.py            # Model architectures\n├── requirements.txt\n\
  └── README.md\n```\n\n---\n\n## \U0001F680 Getting Started\n\n### 1. Install Dependencies\n```bash\n\
  pip install -r requirements.txt\n```\n\n### 2. Download & Merge Datasets\n```bash\n# Option A: Using\
  \ Kaggle CLI (requires API key in ~/.kaggle/kaggle.json)\ncd notebooks\njupyter notebook 00_dataset_merge.ipynb\n\
  \n# Option B: Manual download from Kaggle, then run the merge notebook\n```\n\n### 3. Run EDA\n```bash\n\
  jupyter notebook notebooks/01_eda.ipynb\n```\n\n### 4. Train Models\nRun each notebook (02-11) individually.\
  \ **GPU recommended** (Google Colab / Kaggle Notebooks work great):\n```bash\njupyter notebook notebooks/02_custom_cnn.ipynb\n\
  # ... repeat for 03-11\n```\n\n### 5. Compare Models\n```bash\njupyter notebook notebooks/12_model_comparison.ipynb\n\
  ```\n\n### 6. Train Segmentation Model\n```bash\njupyter notebook notebooks/13_unet_segmentation.ipynb\n\
  ```\n\n### 7. GradCAM Visualization\n```bash\njupyter notebook notebooks/14_gradcam.ipynb\n```\n\n###\
  \ 8. Launch Web Application\n```bash\ncd webapp\npython app.py\n# Visit http://localhost:5000\n```\n\
  \n---\n\n## \U0001F9EA Classification Models\n\n| # | Model | Input Size | Architecture |\n|---|-------|-----------|--------------|\n\
  | 1 | Custom CNN | 224×224 | 4-block CNN from scratch |\n| 2 | VGG16 | 224×224 | Transfer Learning (ImageNet)\
  \ |\n| 3 | VGG19 | 224×224 | Transfer Learning (ImageNet) |\n| 4 | ResNet50 | 224×224 | Transfer Learning\
  \ (ImageNet) |\n| 5 | ResNet101 | 224×224 | Transfer Learning (ImageNet) |\n| 6 | InceptionV3 | 299×299\
  \ | Transfer Learning (ImageNet) |\n| 7 | DenseNet121 | 224×224 | Transfer Learning (ImageNet) |\n|\
  \ 8 | MobileNetV2 | 224×224 | Transfer Learning (ImageNet) |\n| 9 | EfficientNetB0 | 224×224 | Transfer\
  \ Learning (ImageNet) |\n| 10 | Xception | 299×299 | Transfer Learning (ImageNet) |\n\nEach model generates:\
  \ accuracy, precision, recall, F1-score, confusion matrix, ROC-AUC curves.\n\n---\n\n## \U0001F52C Segmentation\n\
  \n**Attention U-Net** architecture with pretrained EfficientNetB3 encoder.\n- **Attention Gates** (scSE)\
  \ suppress irrelevant background and focus on tumor regions.\n- **Metrics (Validation)**:\n  - **IoU\
  \ Score**: 0.75 (75% overlap accuracy)\n  - **F1-Score**: 0.85\n  - **Dice Coefficient**: 0.69\n  -\
  \ **Pixel Accuracy**: 99.5%\n- Binary segmentation for tumor localization.\n\n### \U0001F9E0 How Attention\
  \ Works (scSE)\nThe model uses **Concurrent Spatial and Channel Squeeze & Excitation (scSE)** attention:\n\
  - **Spatial Attention**: Focuses the model on **WHERE** the tumor is located within the brain slice.\n\
  - **Channel Attention**: Learns **WHICH** feature maps (edges, textures) are the most important for\
  \ identifying tumor tissue.\n- **Result**: Significant reduction in \"false positives\" on healthy brain\
  \ tissue compared to a standard U-Net.\n\n---\n\n## \U0001F525 GradCAM Explainability\n\n- Visual explanations\
  \ for model predictions\n- Heatmaps showing regions of interest\n- Multi-model comparison\n- Combined\
  \ GradCAM + segmentation overlay\n\n---\n\n## \U0001F310 Web Application\n\nPremium dark-themed Flask\
  \ web app with:\n- Drag & drop MRI upload\n- Real-time classification with confidence scores\n- Tumor\
  \ segmentation overlay\n- GradCAM heatmap visualization\n- Responsive design with glassmorphism UI\n\
  \n---\n\n## \U0001F4DD Citation\n\nIf you use this project in your research, please cite the source\
  \ datasets:\n\n```bibtex\n@dataset{sartaj_brain_tumor,\n  title={Brain Tumor Classification (MRI)},\n\
  \  author={Sartaj Bhuvaji et al.},\n  year={2020},\n  publisher={Kaggle}\n}\n\n@dataset{masoud_brain_tumor,\n\
  \  title={Brain Tumor MRI Dataset},\n  author={Masoud Nickparvar},\n  year={2021},\n  publisher={Kaggle}\n\
  }\n\n@dataset{ahmed_br35h,\n  title={Br35H :: Brain Tumor Detection 2020},\n  author={Ahmed Hamada},\n\
  \  year={2020},\n  publisher={Kaggle}\n}\n```\n\n---\n\n## ⚠️ Disclaimer\n\nThis project is for **research\
  \ and educational purposes only**. It is NOT intended for clinical diagnosis. Always consult qualified\
  \ medical professionals for brain tumor diagnosis and treatment.\n\n---\n\n## \U0001F4C4 License\n\n\
  MIT License\n"

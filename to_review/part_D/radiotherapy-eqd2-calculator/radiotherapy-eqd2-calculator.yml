readme_excerpt: "<p align=\"center\">\n  <img\n    src=\"assets/radiotherapy-eqd2-banner.png\"\n    alt=\"\
  Radiotherapy BED/EQD2 Calculator Banner\"\n    width=\"100%\"\n  >\n</p>\n\n# \U0001F9EE Radiotherapy\
  \ BED/EQD2 Calculator\n\n![Python](https://img.shields.io/badge/PYTHON-3.11-3776AB?style=for-the-badge&logo=python&logoColor=white)\n\
  ![Radiobiology](https://img.shields.io/badge/RADIOBIOLOGY-LQ_MODEL-00A6A6?style=for-the-badge)\n![BED](https://img.shields.io/badge/BED-CALCULATOR-8A2BE2?style=for-the-badge)\n\
  ![EQD2](https://img.shields.io/badge/EQD2-CALCULATOR-D81B60?style=for-the-badge)\n![Tests](https://img.shields.io/badge/TESTS-63_PASSING-0A9EDC?style=for-the-badge&logo=pytest&logoColor=white)\n\
  ![Code Quality](https://img.shields.io/badge/CODE_QUALITY-RUFF-D7FF64?style=for-the-badge)\n![CI](https://img.shields.io/badge/CI-GITHUB_ACTIONS-2088FF?style=for-the-badge&logo=githubactions&logoColor=white)\n\
  ![Interface](https://img.shields.io/badge/INTERFACE-CLI-2F4F4F?style=for-the-badge)\n![Export](https://img.shields.io/badge/EXPORT-CSV_&_EXCEL-217346?style=for-the-badge&logo=microsoft-excel&logoColor=white)\n\
  ![Status](https://img.shields.io/badge/STATUS-STABLE_RELEASE-2EA44F?style=for-the-badge)\n![Version](https://img.shields.io/badge/VERSION-1.1.0-8A2BE2?style=for-the-badge)\n\
  \n> ✅ **Project Status: Stable Release — Version 1.1.0**\n\nA tested Python command-line application\
  \ for calculating physical radiation dose, Biologically Effective Dose (BED), Equivalent Dose in 2 Gy\
  \ fractions (EQD2), and cumulative radiobiological results across multiple radiotherapy treatment courses.\n\
  \nThe application also supports structured CSV and Excel result exports.\n\n## A Python-Based Radiobiological\
  \ Dose Calculator for Radiotherapy and Medical Physics\n\n---\n\n## \U0001F4CC Overview\n\nThe **Radiotherapy\
  \ BED/EQD2 Calculator** calculates:\n\n- Total physical radiation dose\n- Biologically Effective Dose\n\
  - Equivalent Dose in 2 Gy fractions\n- Cumulative BED across multiple treatment courses\n- Cumulative\
  \ EQD2 across multiple treatment courses\n- Combined EBRT and brachytherapy dose summaries\n- Structured\
  \ CSV calculation records\n- Structured Excel calculation records\n\nThe project combines:\n\n- Radiobiology\n\
  - Medical physics\n- Python programming\n- Input validation\n- Command-line interface design\n- CSV\
  \ and Excel export\n- Automated scientific testing\n- Continuous Integration\n- Automated code-quality\
  \ checking\n- Reproducible calculations\n\nRadiotherapy schedules cannot always be compared using total\
  \ physical dose alone.\n\nFor example:\n\n```text\n8 Gy × 3 fractions = 24 Gy\n\n2 Gy × 12 fractions\
  \ = 24 Gy\n```\n\nBoth schedules deliver a physical dose of 24 Gy, but they are not biologically equivalent.\n\
  \nThe calculator uses the **Linear-Quadratic model** to account for the influence of dose per fraction.\n\
  \n---\n\n## ✨ Current Features\n\n### Radiobiological Calculations\n\n- Total physical dose calculation\n\
  - BED calculation\n- EQD2 calculation\n- Single-course calculations\n- Cumulative multi-course calculations\n\
  - Combined EBRT and brachytherapy calculations\n- Cumulative physical-dose summaries\n- Cumulative BED\
  \ calculation\n- Cumulative EQD2 calculation\n\n### Alpha/Beta Selection\n\n- Tumour and early-responding\
  \ tissue preset: α/β = 10 Gy\n- Late-responding normal-tissue preset: α/β = 3 Gy\n- Custom α/β values\n\
  \n### Input Validation\n\n- Positive-number validation\n- Whole-number fraction validation\n- Rejection\
  \ of zero values\n- Rejection of negative values\n- Rejection of Boolean values\n- Rejection of NaN\
  \ values\n- Rejection of infinite values\n- Rejection of invalid menu selections\n- Minimum of two courses\
  \ for cumulative calculations\n\n### Result Export\n\n- Structured calculation records\n- Single-course\
  \ CSV export\n- Multi-course CSV export\n- Single-course Excel export\n- Multi-course Excel export\n\
  - Combined CSV and Excel export\n- Automatic output-directory creation\n- Verified CSV headings and\
  \ values\n- Verified Excel headings and values\n\n### Software Quality\n\n- 63 automated tests\n- Final\
  \ scientific reference cases\n- Ruff code-quality checks\n- GitHub Actions Continuous Integration\n\
  - Automated checks after pushes and pull requests\n- Dependency compatibility verification\n- Python\
  \ syntax-compilation verification\n\n---\n\n## \U0001F9EC Scientific Background\n\n### 1. Total Physical\
  \ Dose\n\nFor a treatment schedule where:\n\n- `n` = number of fractions\n- `d` = dose per fraction\n\
  \nThe total physical dose is:\n\n```text\nTotal Physical Dose = n × d\n```\n\nExample:\n\n```text\n\
  8 Gy × 3 fractions = 24 Gy\n```\n\nPhysical dose alone does not account for the biological consequences\
  \ of changing the dose per fraction.\n\n---\n\n### 2. Linear-Quadratic Model\n\nThe calculator uses\
  \ the **Linear-Quadratic model** as the basis for its radiobiological calculations.\n\nThe model describes\
  \ radiation effect using:\n\n- **α (alpha):** linear component\n- **β (beta):** quadratic component\n\
  \nThe **α/β ratio** describes the sensitivity of a tissue or biological endpoint to changes in fraction\
  \ size.\n\n---\n\n### 3. Alpha/Beta Ratio\n\nDifferent tissues, tumours and biological endpoints may\
  \ have different α/β values.\n\n#### High Alpha/Beta\n\nA commonly used conventional value for many\
  \ tumours and early-responding tissues is:\n\n```text\nα/β = 10 Gy\n```\n\nCalculations may be written\
  \ as:\n\n```text\nBED10\n```\n\n#### Low Alpha/Beta\n\nA commonly used conventional value for many late-responding\
  \ normal-tissue endpoints is:\n\n```text\nα/β = 3 Gy\n```\n\nCalculations may be written as:\n\n```text\n\
  BED3\n```\n\nThese values are conventional assumptions, not universal biological constants.\n\nThe appropriate\
  \ α/β ratio depends on:\n\n- Tissue\n- Tumour type\n- Biological endpoint\n- Clinical context\n- Supporting\
  \ scientific evidence\n\n---\n\n## \U0001F9EE BED Calculation\n\nThe **Biologically Effective Dose**\
  \ is calculated using:\n\n```text\nBED = nd × (1 + d / (α/β))\n```\n\nWhere:\n\n```text\nn    = number\
  \ of fractions\nd    = dose per fraction\nα/β  = alpha/beta ratio\n```\n\nBED provides a model-derived\
  \ representation of the biological effect of a fractionation schedule.\n\n---\n\n## \U0001F4CA EQD2\
  \ Calculation\n\n**Equivalent Dose in 2 Gy fractions** converts BED into the equivalent dose that would\
  \ produce the same modelled biological effect if delivered using 2 Gy fractions.\n\nThe equation is:\n\
  \n```text\nEQD2 = BED / (1 + 2 / (α/β))\n```\n\nThis allows different fractionation schedules to be\
  \ compared using a common 2 Gy-per-fraction reference.\n\n---\n\n## ➕ Cumulative Treatment Calculations\n\
  \nThe calculator can combine multiple treatment courses that refer to the same tissue or biological\
  \ endpoint.\n\nExamples include:\n\n- EBRT followed by brachytherapy\n- Multiple brachytherapy treatment\
  \ courses\n- Sequential radiotherapy schedules\n\nFor each treatment course, the calculator determines:\n\
  \n- Physical dose\n- BED\n- EQD2\n\nIt then reports:\n\n- Total physical dose\n- Cumulative BED\n- Cumulative\
  \ EQD2\n\nCumulative BED is calculated as:\n\n```text\nCumulative BED = BED₁ + BED₂ + ... + BEDₙ\n```\n\
  \nCumulative EQD2 is calculated using the common α/β ratio:\n\n```text\nCumulative EQD2 = Cumulative\
  \ BED / (1 + 2 / (α/β))\n```\n\nAll combined treatment courses must refer to the same tissue or biological\
  \ endpoint and use the same α/β ratio.\n\n### Example: EBRT + HDR Brachytherapy\n\nUsing an α/β ratio\
  \ of 10 Gy:\n\n```text\nCourse 1: 1.8 Gy × 25 fractions\nCourse 2: 8 Gy × 3 fractions\n```\n\nResults:\n\
  \n```text\nTotal physical dose: 69.00 Gy\nCumulative BED: 96.30 Gy10\nCumulative EQD2: 80.25 Gy\n```\n\
  \n---\n\n## \U0001F52C Worked Example 1 — Conventional Fractionation\n\n```text\nDose per fraction =\
  \ 2 Gy\nNumber of fractions = 25\nα/β = 10 Gy\n```\n\nResults:\n\n```text\nPhysical Dose = 50.00 Gy\n\
  BED10         = 60.00 Gy10\nEQD2          = 50.00 Gy\n```\n\nBecause the schedule already uses 2 Gy\
  \ fractions, its EQD2 equals its physical dose.\n\n---\n\n## \U0001F3AF Worked Example 2 — HDR Tumour\
  \ Calculation\n\n```text\nDose per fraction = 8 Gy\nNumber of fractions = 3\nα/β = 10 Gy\n```\n\nResults:\n\
  \n```text\nPhysical Dose = 24.00 Gy\nBED10         = 43.20 Gy10\nEQD2          = 36.00 Gy\n```\n\n---\n\
  \n## \U0001FAC0 Worked Example 3 — Late-Responding Normal Tissue\n\n```text\nDose per fraction = 8 Gy\n\
  Number of fractions = 3\nα/β = 3 Gy\n```\n\nResults:\n\n```text\nPhysical Dose = 24.00 Gy\nBED3    \
  \      = 88.00 Gy3\nEQD2          = 52.80 Gy\n```\n\n> The same physical fractionation schedule can\
  \ produce different modelled biological effects depending on the α/β ratio used.\n\n---\n\n## \U0001F4E4\
  \ Result Export\n\nAfter completing a calculation, the CLI displays:\n\n```text\nExport Results\n--------------\n\
  1. Export to CSV\n2. Export to Excel\n3. Export to both CSV and Excel\n4. Do not export\n```\n\n###\
  \ CSV Export\n\nCSV exports contain:\n\n```text\ncomponent\ndose_per_fraction_gy\nnumber_of_fractions\n\
  alpha_beta_gy\ntotal_physical_dose_gy\nbed_gy\neqd2_gy\n```\n\nCSV files can be opened using:\n\n- Microsoft\
  \ Excel\n- Google Sheets\n- LibreOffice Calc\n- Python\n- R\n- Other data-analysis tools\n\n### Excel\
  \ Export\n\nExcel results are written to a worksheet named:\n\n```text\nRadiotherapy Results\n```\n\n\
  Excel files use the `.xlsx` format and are created using `openpyxl`.\n\n### Generated Files\n\nSingle-course\
  \ exports use:\n\n```text\noutputs/single_treatment_result.csv\noutputs/single_treatment_result.xlsx\n\
  ```\n\nCumulative exports use:\n\n```text\noutputs/cumulative_treatment_result.csv\noutputs/cumulative_treatment_result.xlsx\n\
  ```\n\nFor cumulative calculations, exported records include:\n\n- Each individual treatment course\n\
  - The cumulative physical-dose total\n- The cumulative BED\n- The cumulative EQD2\n\nThe `outputs/`\
  \ directory is created automatically and excluded from version control.\n\n---\n\n## \U0001F4C1 Project\
  \ Structure\n\n```text\nradiotherapy-eqd2-calculator/\n│\n├── .github/\n│   └── workflows/\n│      \
  \ └── tests.yml\n│\n├── eqd2_calculator/\n│   ├── __init__.py\n│   ├── calculator.py\n│   ├── cumulative.py\n\
  │   ├── export.py\n│   └── presets.py\n│\n├── tests/\n│   ├── test_app.py\n│   ├── test_calculator.py\n\
  │   ├── test_cumulative.py\n│   ├── test_export.py\n│   ├── test_presets.py\n│   └── test_scientific_validation.py\n\
  │\n├── assets/\n│   └── radiotherapy-eqd2-banner.png\n│\n├── outputs/                  # Generated locally\
  \ and Git-ignored\n├── app.py\n├── CHANGELOG.md\n├── RELEASE_NOTES.md\n├── README.md\n├── requirements.txt\n\
  └── .gitignore\n```\n\nThe following directories are excluded from version control:\n\n```text\n.venv/\n\
  __pycache__/\n.pytest_cache/\noutputs/\n```\n\n---\n\n## ⚙️ Core Modules\n\n### Core Calculations\n\n\
  `eqd2_calculator/calculator.py`\n\n```python\ncalculate_total_dose()\ncalculate_bed()\ncalculate_eqd2()\n\
  ```\n\n### Cumulative Calculations\n\n`eqd2_calculator/cumulative.py`\n\n```python\ncalculate_cumulative_bed()\n\
  calculate_cumulative_eqd2()\n```\n\n### Result Exports\n\n`eqd2_calculator/export.py`\n\n```python\n\
  create_calculation_record()\nexport_calculation_to_csv()\nexport_calculations_to_csv()\nexport_calculations_to_excel()\n\
  ```\n\n### Alpha/Beta Presets\n\n`eqd2_calculator/presets.py`\n\nThis module stores reusable conventional\
  \ α/β presets for:\n\n- Tumours and early-responding tissues\n- Late-responding normal tissues\n\n---\n\
  \n## \U0001F4E6 Dependencies\n\n```text\npytest==9.1.1\nopenpyxl==3.1.5\nruff==0.16.2\n```\n\n- `pytest`\
  \ runs the automated test suite.\n- `openpyxl` creates and verifies Excel `.xlsx` files.\n- `ruff` performs\
  \ automated Python code-quality checks.\n\n---\n\n## \U0001F4BB Installation\n\n### 1. Clone the Repository\n\
  \n```bash\ngit clone https://github.com/atinukeinyang-hue/radiotherapy-eqd2-calculator.git\n```\n\n\
  ### 2. Enter the Project Directory\n\n```bash\ncd radiotherapy-eqd2-calculator\n```\n\n### 3. Create\
  \ a Virtual Environment\n\n```bash\npython -m venv .venv\n```\n\n### 4. Activate the Virtual Environment\n\
  \nOn Windows PowerShell:\n\n```powershell\n.\\.venv\\Scripts\\Activate.ps1\n```\n\n### 5. Install Dependencies\n\
  \n```bash\npython -m pip install -r requirements.txt\n```\n\n---\n\n## ▶️ Running the Calculator\n\n\
  ```bash\npython app.py\n```\n\nThe main menu provides:\n\n```text\nRadiotherapy BED/EQD2 Calculator\n\
  --------------------------------\n\nMain Menu\n---------\n1. Single treatment course\n2. Cumulative\
  \ treatment courses\n3. Exit\n```\n\n### Single Treatment Course\n\nThe calculator requests:\n\n```text\n\
  Dose per fraction\nNumber of fractions\nAlpha/Beta selection\n```\n\nIt displays:\n\n```text\nAlpha/Beta\
  \ value\nTotal physical dose\nBED\nEQD2\n```\n\nThe result can be exported to CSV, Excel or b"

readme_excerpt: '# Technical Optimization of SyntheticMR for the Head and Neck on a 3T MR-Simulator and
  1.5T MR-Linac: A Prospective R-IDEAL Stage 2a Technology Innovation Report

  Code for the paper: "Technical Optimization of SyntheticMR for the Head and Neck on a 3T MR-Simulator
  and 1.5T MR-Linac: A Prospective R-IDEAL Stage 2a Technology Innovation Report" found at: https://doi.org/10.1101/2025.04.08.25325491.
  The anonymized data is found at: https://doi.org/10.6084/m9.figshare.28703528.


  ## Installing proper requirements (on Windows)

  1. Create python environment with Python 3.8.10: `python3.8 -m venv env_3-8-10`

  2. Activate virtual python environment: `.\env_3-8-10\Scripts\activate`

  3. Install packages: `pip install -r requirements.txt`


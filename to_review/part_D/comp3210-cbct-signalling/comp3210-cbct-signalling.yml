readme_excerpt: "Repo for CBCT signalling networking CW - COMP3210\nrms1g23@soton.ac.uk\n\n# Installation\
  \ \n\n1. Create virtual environment and then activate it\n\n2. Install dependencies\n\n```bash\npy -m\
  \ pip install -r \"requirements.txt\"\n```\n\n3. Ensure you create a .env file with your AWS information\n\
  \nAWS_IOT_ENDPOINT=ENDPOINT.REGION.amazonaws.com\nAWS_IOT_CA_CERTS=AmazonRootCA1.pem\nAWS_IOT_CERTFILE=CERT-certificate.pem.crt\n\
  AWS_IOT_KEYFILE=PRIVATE-private.pem.key\n\n4. Run controller \n\n```bash\npy -m tests.testing_picow.test_controller\n\
  ```\n\nThis should show two clients listening to your AWS Core IoT endpoint and hive.\n"

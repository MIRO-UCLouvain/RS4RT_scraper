readme_excerpt: "# TrueBeam MLC QA Tools\n\nPython-based tools for quality assurance of Varian TrueBeam\
  \ MLCs,\nincluding RTPlan edition and MLC trajectory log analysis.\n\n## Included Tools\n\n### 1. RTPlanEditor\n\
  GUI tool to modify TreatmentMachineName and DeviceSerialNumber in\nRTPlan DICOM files, enabling the\
  \ creation of QA fields deliverable\non your Varian TrueBeam systems.\n\n### 2. MLCDynamic\n- Converts\
  \ trajectory log binary files to CSV\n- Analyzes daily MLC leaf positional deviations\n- Builds daily\
  \ historical performance data\n- Estimates Remaining Useful Life (RUL) of MLC leaves using an\n  exponential\
  \ bayesian degradation model\n\n## Scientific Background\nThe trajectory log analysis and RUL estimation\
  \ are based on:\n\nCalama-Santiago JA, Molina-Lopez MY, Infante-Utrilla MA, Lavado-Rodríguez ME.\nMLC\
  \ performance prognosis using a degradation model based on trajectory log data from a daily test.\n\
  Medical Physics, 2022;49:7384–7403.\n\n## Intended Use\nResearch and Quality Assurance purposes only.\n\
  \n## Disclaimer\nThis software is not a certified medical device.\nClinical use is entirely the responsibility\
  \ of the user.\nAlways verify results before clinical implementation.\n\n## License\nGNU General Public\
  \ License v3.0\n"

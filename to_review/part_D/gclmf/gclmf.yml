readme_excerpt: "# GCLmf\nGCLmf: A novel molecular graph contrastive learning framework based on hard\
  \ negatives and application in toxicity prediction\n\n## Requirements\n   * python 3.7 \n### install\
  \ requirements\n```\npip install torch==1.7.1+cu101 torchvision==0.8.2+cu101 -f https://download.pytorch.org/whl/torch_stable.html\
  \  \npip install torch-geometric==1.6.3 torch-sparse==0.6.9 torch-scatter==2.0.6 -f https://pytorch-geometric.com/whl/torch-1.7.0+cu101.html\n\
  pip install PyYAML\nconda install -c conda-forge rdkit=2020.09.1.0\n```\n\n## Dataset \n### pre-training\
  \ data\nYou can download the pre-training data and benchmarks used in the paper [here](https://drive.google.com/u/0/uc?id=16JTa7RjnJjxc8M1Ft73qgD3-1s3wtNBD&export=download)\
  \ and extract the file under ***./github/data*** folder.\n### fine-tuning data\nAll the databases for\
  \ fine-tuning are saved in ***./github/data***\n\n## Pre-training\nTo train the GCLmf, where the configurations\
  \ and detailed explaination for each variable can be found in ***config_pretrain.yaml***  \n`python\
  \ GCLmf_pre.py` \n\n## Fine-tuning\n### molecular property benchmarks \n`python GCLmf_ft_property.py`\
  \ \n### toxicity data sets\n`python GCLmf_ft_tox.py` \n  \n\n\n\n\n\n\n"

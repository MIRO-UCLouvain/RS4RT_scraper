readme_excerpt: "# HiEDL: Hierarchical Evidential Deep Learning for Uncertainty-Aware Tumor Segmentation\n\
  \nOfficial implementation of **HiEDL: Hierarchical Evidential Deep Learning for Uncertainty-Aware Tumor\
  \ Segmentation from 3D CT via Boundary Regularization** (**Accepted at MICCAI 2026** \U0001F389).\n\n\
  HiEDL accurately and efficiently segments tumors from 3D CT scans by explicitly enforcing the anatomical\
  \ *containment prior* — the fact that tumors physically reside within their corresponding organs. It\
  \ combines a hierarchical organ-to-tumor decoupling strategy with evidential deep learning and a novel\
  \ boundary regularization loss to resolve ambiguous tumor boundaries while quantifying predictive uncertainty.\n\
  \n---\n\n## Motivation\n\n<p align=\"center\">\n  <img src=\"assets/motivation.png\" alt=\"Motivation\"\
  \ width=\"80%\">\n</p>\n\nConventional flat classification ignores the prior that tumors physically\
  \ reside within organs, causing severe errors (a). Predictive tumor uncertainty is highest at the **inner\
  \ organ–tumor boundary**, rather than at the outer organ boundary (b). HiEDL is designed to exploit\
  \ exactly this structure.\n\n---\n\n## Highlights\n\n- **Hierarchical evidential formulation.** The\
  \ segmentation task is decoupled into a *superordinate* level (localizing the encompassing organ) and\
  \ a *subordinate* level (isolating the target tumor inside the organ), explicitly enforcing the anatomical\
  \ containment prior instead of treating organs and tumors as flat, mutually exclusive classes.\n- **Uncertainty-aware\
  \ boundary regularization.** A boundary loss based on Signed Distance Functions (SDF) is integrated\
  \ with evidential uncertainty to penalize over-confident misclassifications at ambiguous organ–tumor\
  \ borders.\n- **Reliable uncertainty estimation.** Built on Evidential Deep Learning (EDL), HiEDL models\
  \ predictions as a Dirichlet distribution, providing per-voxel uncertainty maps in a single forward\
  \ pass — without expensive Bayesian approximations.\n- **State-of-the-art performance.** Highest region-level\
  \ (Dice) and boundary-level (NSD) scores on the MSD Pancreas and MSD Liver datasets.\n\n---\n\n## Method\
  \ Overview\n\n<p align=\"center\">\n  <img src=\"assets/framework.png\" alt=\"HiEDL framework\" width=\"\
  95%\">\n</p>\n\nGiven an input CT volume, HiEDL employs an evidential segmentation model that outputs\
  \ a voxel-wise three-class Dirichlet prediction over {background, organ, tumor}. The three-class task\
  \ is decomposed at the loss level into two hierarchical sub-problems:\n\n1. **Superordinate level**\
  \ — background vs. organ–tumor foreground.\n2. **Subordinate level** — organ vs. tumor discrimination\
  \ within the foreground.\n\nEach level is supervised by both a **region loss** (evidential Dice) and\
  \ a **boundary loss** (SDF-based distance map). The overall training objective is:\n\n```\nL = w_sup\
  \ · L_sup + w_in · L_in + λ_sup(t) · L_sup^bd + λ_in(t) · L_in^bd\n```\n\nwhere `w_sup`, `w_in` are\
  \ constant region-loss weights and `λ(t)` is a time-dependent ramp-up schedule for the boundary losses.\n\
  \n---\n\n## Results\n\n### Comparison with 3D segmentation networks\n\n| Model        | MSD Pancreas\
  \ Dice ↑ | MSD Pancreas NSD ↑ | MSD Liver Dice ↑ | MSD Liver NSD ↑ |\n|--------------|:-------------------:|:------------------:|:----------------:|:---------------:|\n\
  | UNETR        | 0.2035              | 0.3261             | 0.3090           | 0.2745          |\n|\
  \ UNETR++      | 0.3213              | 0.4669             | 0.5002           | 0.4474          |\n|\
  \ SegResNet    | 0.3990              | 0.5460             | 0.6287           | 0.6682          |\n|\
  \ Swin UNETR   | 0.4073              | 0.5811             | 0.6218           | 0.6471          |\n|\
  \ **HiEDL**    | **0.4346**          | **0.5906**         | **0.6542**       | **0.6930**      |\n\n\
  <p align=\"center\">\n  <img src=\"assets/visual_comparison.png\" alt=\"Visual comparison\" width=\"\
  95%\">\n</p>\n\nVisual comparison of different methods for abdominal tumor segmentation. Green and red\
  \ regions denote the ground truth and predicted tumor, respectively. HiEDL stays close to the ground\
  \ truth, especially along the ambiguous boundaries between tumors and their organs.\n\n### Ablation\
  \ study\n\n**MSD Pancreas**\n\n| Components                          | Dice ↑ | NSD ↑  |\n|-------------------------------------|:------:|:------:|\n\
  | Baseline                            | 0.4073 | 0.5811 |\n| Baseline w/ Region loss             | 0.3965\
  \ | 0.5574 |\n| Baseline w/ Boundary loss (Ours)    | **0.4346** | **0.5906** |\n\n**MSD Liver**\n\n\
  | Components                          | Dice ↑ | NSD ↑  |\n|-------------------------------------|:------:|:------:|\n\
  | Baseline                            | 0.6218 | 0.6471 |\n| Baseline w/ Region loss             | 0.5930\
  \ | 0.5758 |\n| Baseline w/ Boundary loss (Ours)    | **0.6542** | **0.6930** |\n\n<p align=\"center\"\
  >\n  <img src=\"assets/uncertainty_maps.png\" alt=\"Uncertainty maps\" width=\"95%\">\n</p>\n\nPredictive\
  \ uncertainty maps from the ablation study. Red arrows indicate that the proposed boundary loss effectively\
  \ reduces uncertainty outside the organs in the tumor's uncertainty maps, confining tumor uncertainty\
  \ within the organ.\n\n---\n\n## Datasets\n\nWe evaluate HiEDL on two publicly available CT tumor segmentation\
  \ datasets from the [Medical Segmentation Decathlon (MSD)](http://medicaldecathlon.com/):\n\n- **MSD\
  \ Pancreas** — pancreatic tumor segmentation.\n- **MSD Liver** — hepatic tumor segmentation.\n\n###\
  \ Pre-processing\n\n- Truncate voxel intensities to a soft-tissue HU window of `[-125, 225]`, then normalize\
  \ to `[0, 1]`.\n- Resample all volumes to a uniform physical spacing of `1.5 × 1.5 × 2.0 mm³`.\n- Randomly\
  \ crop 3D sub-volumes of size `256 × 256 × 32` during training.\n\n---\n\n## Installation\n\n```bash\n\
  git clone https://github.com/laibi-yonsei/HiEDL.git\ncd HiEDL\n\n# (recommended) create a virtual environment\n\
  conda create -n hiedl python=3.10 -y\nconda activate hiedl\n\n# install dependencies\npip install -r\
  \ requirements.txt\n```\n\n> Requires Python 3 and PyTorch. See `requirements.txt` for the full dependency\
  \ list.\n\n---\n\n## Usage\n\n```bash\n# Training\npython train.py --dataset pancreas --data_root /path/to/MSD_Pancreas\n\
  \n# Evaluation\npython test.py --dataset pancreas --checkpoint /path/to/checkpoint.pth\n```\n\n> Adjust\
  \ the script names and arguments to match your repository structure.\n\n---\n\n## Implementation Details\n\
  \n| Setting              | Value                              |\n|----------------------|------------------------------------|\n\
  | Optimizer            | AdamW                              |\n| Epochs               | 200        \
  \                        |\n| Batch size           | 1                                  |\n| Initial\
  \ learning rate| 2 × 10⁻⁴                           |\n| Input patch size     | 256 × 256 × 32     \
  \                |\n| GPU                  | NVIDIA GeForce RTX A6000 (48 GB)   |\n| Framework     \
  \       | PyTorch                            |\n| `w_sup`, `w_in`      | 1                         \
  \         |\n| `λ_sup`, `λ_in`      | 0.2                                |\n| `t` (ramp-up)        |\
  \ 20                                 |\n\n---\n\n## Citation\n\n\n---\n\n## Acknowledgments\n\nThis\
  \ work was supported by the Regional Innovation System & Education (RISE) program through the Gangwon\
  \ RISE Center, funded by the Ministry of Education (MOE) and Gangwon State, Republic of Korea (Grant\

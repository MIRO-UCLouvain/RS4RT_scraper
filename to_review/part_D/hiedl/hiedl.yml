  \ of Korea (NRF), funded by the Korean government (MSIT) (Grant No. RS-2024-00440802); and an NRF grant\
  \ funded by the Korean government (MSIT) (Grant No. 2022R1A2C2091160).\n\n---\n\n## Contact\n\n- Younghyun\
  \ Park, Jin Gyo Jeong *(equal contribution)*\n- Corresponding author: Sejung Yang — `syang@yonsei.ac.kr`\n\
  \nDepartment of Precision Medicine / Department of Medical Informatics and Biostatistics,\nYonsei University\
  \ Wonju College of Medicine, Wonju, Korea.\n"

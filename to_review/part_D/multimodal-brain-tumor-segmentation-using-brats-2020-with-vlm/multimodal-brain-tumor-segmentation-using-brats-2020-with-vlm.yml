readme_excerpt: "# Multimodal Brain Tumor Segmentation using BraTS 2020 with Vision Language Models\n\n\
  A Deep Learning based multimodal medical image segmentation framework that combines **FLAIR MRI scans**\
  \ and **radiology-style text reports** using **Vision Language Models (VLMs)** for accurate brain tumor\
  \ segmentation.\n\nThis project integrates **CLIP-based image-text embeddings**, **cross-attention fusion**,\
  \ and a **UNet-style segmentation architecture** to improve contextual understanding and tumor localization\
  \ performance.\n\n---\n\n## Project Highlights\n\n- Multimodal Brain Tumor Segmentation\n- BraTS 2020\
  \ FLAIR MRI Dataset\n- Vision Language Model (CLIP ViT-B/32)\n- Cross-Attention Image-Text Fusion\n\
  - UNet-style Segmentation Decoder\n- Grad-CAM Explainability\n- Dice + BCE + Focal Hybrid Loss\n- Medical\
  \ AI and Computer Vision Application\n\n---\n\n## Architecture Overview\n\nThe framework consists of:\n\
  \n1. **Image Encoder**\n   - ResNet-34 backbone\n   - Extracts MRI spatial features\n\n2. **Text Encoder**\n\
  \   - CLIP ViT-B/32\n   - Encodes radiology-style reports\n\n3. **Cross-Attention Fusion**\n   - Combines\
  \ visual and semantic embeddings\n   - Improves contextual feature learning\n\n4. **Segmentation Decoder**\n\
  \   - UNet-style decoder\n   - Generates pixel-wise tumor masks\n\n---\n\n## Dataset\n\n### BraTS 2020\
  \ Dataset\n- FLAIR MRI volumes\n- Expert annotated tumor masks\n- Brain tumor segmentation benchmark\
  \ dataset\n\n### Text Dataset\nRadiology-style reports containing:\n- Tumor location\n- Edema characteristics\n\
  - Structural abnormalities\n- Clinical semantic descriptions\n\n---\n\n## Technologies Used\n\n- Python\n\
  - PyTorch\n- OpenCV\n- NumPy\n- Matplotlib\n- CLIP\n- ResNet-34\n- UNet\n- Vision Language Models (VLM)\n\
  \n---\n\n## Training Configuration\n\n| Parameter | Value |\n|---|---|\n| Epochs | 15 |\n| Batch Size\
  \ | 4 |\n| Optimizer | AdamW |\n| Learning Rate | 3e-5 |\n| Input Size | 256×256 |\n| Loss Function\
  \ | Dice + BCE + Focal Loss |\n\n---\n\n## Performance Metrics\n\n| Metric | Score |\n|---|---|\n| Dice\
  \ Score | 0.7768 |\n| IoU Score | 0.6937 |\n| Precision | 0.8085 |\n| Recall | 0.7870 |\n\nBest Validation\
  \ Dice Score:\n```text\n0.7949\n```\n\n---\n\n## Key Features\n\n- Strong tumor boundary localization\n\
  - Semantic image-text alignment\n- Cross-modal attention visualization\n- Grad-CAM explainability support\n\
  - Robust multimodal feature learning\n- Improved contextual medical understanding\n\n---\n\n## Explainability\
  \ and Analysis\n\nThe project includes:\n- Grad-CAM Visualization\n- t-SNE Embedding Analysis\n- Cross-Modal\
  \ Attention Analysis\n- Error Map Visualization\n- Ablation Study\n- Tumor Size-wise Performance Analysis\n\
  \n---\n\n## Repository Structure\n\n```bash\n├── Team 35 - DL Project Code.ipynb\n├── Team 35 - DL Project\
  \ Report.pdf\n├── README.md\n```\n\n---\n\n## Future Improvements\n\n- 3D Brain Tumor Segmentation\n\
  - Transformer-based architectures\n- Multi-class tumor segmentation\n- Multi-modal MRI integration\n\
  - Real-time clinical deployment\n- Larger clinical datasets\n\n---\n\n## Applications\n\n- Medical Image\
  \ Analysis\n- AI-assisted Diagnosis\n- Radiology Support Systems\n- Clinical Decision Support\n- Healthcare\
  \ AI Research\n\n---\n\n## Authors\n\n- Ravi Tejesh\n- Nithin Ramgopal\n## License\n\nThis project is\
  \ intended for academic and research purposes.\n"

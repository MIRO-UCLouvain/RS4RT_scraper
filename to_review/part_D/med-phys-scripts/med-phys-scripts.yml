readme_excerpt: "# Med Phys Scripts\nThese are scripts that I, the medical physics assistant at Cookeville\
  \ Regional Medical Center, wrote for use in our radiation therapy treatment planning system. Please\
  \ note that the scripts are **__works in progress__**. Most of them work, but there are a few bugs.\
  \ You will need to make some changes to filepaths, etc. All scripts have been used with RayStation v8B\
  \ only. \n\n## Usage\nCreate a new script in RayStation that calls the \"main\" function in the script\
  \ you want to use. For example, create `AddClinicalGoals.py`:\n```python\nfrom AddClinicalGoalsForm\
  \ import add_clinical goals\nadd_clinical_goals()\n```\n\n## Future Plans\nMy clinic is in the process\
  \ of streamlining our development process. We currently do not have a \"development environment.\" Once\
  \ that is set up, the scripts in this repo, and others (some of which do not interact with RayStation)\
  \ will be revamped into a Python package and published to PyPI."

  \n# iort-portlet\n\n<h2>Requirements</h2>\n- JDK 6+\n- JSAGA libs (v1.1.x)\n- jsaga-job-management (v1.5.9+)\n\
  \ \n<h2>About the IORT Application</h2>\n<p align=\"justify\">\n IntraOperative Electron Radiotherapy\
  \ (IOERT) is a radiotherapy technique that delivers a single dose of radiation directly to the tumor\
  \ bed, or to the exposed tumor, during surgery. The objective is to achieve a higher dose in the target\
  \ volume while dose-limiting structures are surgically displaced. IOERT is used for limited-stage breast\
  \ tumors treatment and also successfully for prostate, colon and sarcoma cancers. For this purpose,\
  \ a new generation of mobile linear accelerators has been designed to deliver radiation therapy in the\
  \ operating theater.</br></br>\n\nAs in conventional radio-therapy techniques, the use of Monte Carlo\
  \ simulations is mandatory to design the beam collimation system and to study radioprotection charactheristics\
  \ as the radiation leakages. In the clinical activities the simulations can be used to commissioning\
  \ of the linac and in the optimization of the therapeutic dose and patient radioprotection. \n</p>\n\

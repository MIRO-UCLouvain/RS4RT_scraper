readme_excerpt: "# NeetCode Solutions — @Reddimus\n\n> Synced automatically from [NeetCode.io](https://neetcode.io)\
  \ · Repository: `neetcode-submissions-26dvher3`\n\n---\n\n## What is this?\n\n[NeetCode.io](https://neetcode.io)\
  \ is a coding interview preparation platform featuring curated problems, video solutions, and an in-browser\
  \ code editor. This repository is automatically populated with your accepted (or all) solutions using\
  \ the **GitHub Sync** feature.\n\n---\n\n## How GitHub Sync works\n\n1. **Connect your GitHub account**\
  \ on [neetcode.io/profile/github](https://neetcode.io/profile/github).\n2. **Auto-commit** — every time\
  \ you submit a solution on NeetCode, it is pushed here automatically (configurable by status).\n3. **Bulk\
  \ Sync** — push all your past solutions at once from the GitHub settings page.\n4. **Manual sync** —\
  \ from the submission history panel on any problem page, sync or remove individual submissions.\n\n\
  ---\n\n## Repository structure\n\nSolutions are organized by topic folder, then problem ID. Each submission\
  \ is stored as a separate file:\n\n```\n<topic-folder>/\n  <problem-id>/\n    submission-0.<ext>   ←\
  \ first submission\n    submission-1.<ext>   ← second submission\n    ...\n```\n\n**Example:**\n```\n\
  Data Structures & Algorithms/two-integer-sum/submission-0.py\nData Structures & Algorithms/binary-search/submission-0.ts\n\
  Python For Beginners/python-hello-world/submission-0.py\n```\n\n---\n\n## Supported languages\n\n| Language\
  \ | Extension |\n|---|---|\n| Python | `.py` |\n| JavaScript | `.js` |\n| TypeScript | `.ts` |\n| Java\
  \ | `.java` |\n| C++ | `.cpp` |\n| C# | `.cs` |\n| Go | `.go` |\n| Rust | `.rs` |\n| Kotlin | `.kt`\
  \ |\n| Swift | `.swift` |\n| SQL | `.sql` |\n\n---\n\n## Settings\n\nManage your sync preferences at\
  \ [neetcode.io/profile/github](https://neetcode.io/profile/github):\n\n- **Auto-commit toggle** — enable\
  \ or disable automatic commits on submission\n- **Status filter** — sync all submissions or accepted\
  \ only\n- **Rename repository** — rename this repo or start fresh with a new one\n- **Bulk Sync** —\
  \ push all past solutions at once (rate-limited)\n\n---\n\n*Generated by [NeetCode GitHub Integration](https://neetcode.io)*\n"

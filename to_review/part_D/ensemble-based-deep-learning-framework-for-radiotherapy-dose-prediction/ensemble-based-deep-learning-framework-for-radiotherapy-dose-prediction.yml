readme_excerpt: "# Ensemble-Based-Deep-Learning-Framework-for-Radiotherapy-Dose-Prediction\n\nuse python\
  \ 10\n\nDataset - https://drive.google.com/drive/folders/16hno2tiC_6lCygMIniS9F51_r6IpSjqW?usp=sharing\n\
  \n# Project Setup Guide\n\nThis guide explains how to set up and run the project using a Python virtual\
  \ environment on macOS.\n\n## System Requirements\n\n- macOS\n- Python 3.10.9 (required for TensorFlow\
  \ compatibility)\n- Terminal access\n\n## Prerequisites\n\nEnsure Python 3.10.9 is installed at:\n```bash\n\
  /Library/Frameworks/Python.framework/Versions/3.10/bin/python3.10\n```\n\n## Setup Instructions\n\n\
  ### 1. Create Virtual Environment\n\n```bash\n# Navigate to your project directory\ncd /Users/aagneye-syam/Desktop/ensemble\n\
  \n# Create a new virtual environment\n/Library/Frameworks/Python.framework/Versions/3.10/bin/python3.10\
  \ -m venv venv\n```\n\n### 2. Activate Virtual Environment\n\n```bash\n# Activate the virtual environment\n\
  source venv/bin/activate\n```\n\n### 3. Install Dependencies\n\nFirst, create a `requirements.txt` file\
  \ with the following content:\n\n```txt\ntensorflow-macos>=2.12.0\ntensorflow-metal>=1.0.0\nnumpy>=1.22.4\n\
  pandas>=1.4.2\nmatplotlib>=3.5.2\ntqdm>=4.64.0\nh5py>=3.7.0\nscikit-learn>=1.0.2\n```\n\nThen install\
  \ the dependencies:\n\n```bash\n# Upgrade pip\npip install --upgrade pip\n\n# Install TensorFlow for\
  \ Mac\npip install tensorflow-macos tensorflow-metal\n\n# Install other requirements\npip install -r\
  \ requirements.txt\n```\n\n### 4. Running the Script\n\n```bash\n# Make sure your virtual environment\
  \ is activated\nsource venv/bin/activate\n\n# Run your script\npython main.py\n```\n\n### 5. Deactivate\
  \ Virtual Environment\n\nWhen you're done working on the project:\n\n```bash\ndeactivate\n```\n\n##\
  \ Troubleshooting\n\n### Common Issues\n\n1. If you see \"No module found\" errors:\n   ```bash\n  \
  \ # Verify your virtual environment is activated\n   which python\n   # Should show path to your virtual\
  \ environment\n   \n   # Reinstall the missing package\n   pip install <package-name>\n   ```\n\n2.\
  \ If TensorFlow isn't working:\n   ```bash\n   # Verify TensorFlow installation\n   python -c \"import\
  \ tensorflow as tf; print(tf.__version__)\"\n   ```\n\n### Verification Steps\n\nTo verify your setup\
  \ is correct:\n\n```bash\n# Activate virtual environment\nsource venv/bin/activate\n\n# Check Python\
  \ version\npython --version\n# Should show Python 3.10.9\n\n# Verify TensorFlow installation\npython\
  \ -c \"import tensorflow as tf; print(tf.__version__)\"\n```\n\n## Daily Usage\n\n1. Open Terminal\n\
  2. Navigate to project directory:\n   ```bash\n   cd /Users/aagneye-syam/Desktop/ensemble\n   ```\n\
  3. Activate virtual environment:\n   ```bash\n   source venv/bin/activate\n   ```\n4. Run your script:\n\
  \   ```bash\n   python main.py\n   ```\n5. When finished:\n   ```bash\n   deactivate\n   ```\n\n## Maintaining\
  \ Virtual Environment\n\nTo update packages:\n```bash\npip install --upgrade -r requirements.txt\n```\n\
  \nTo list installed packages:\n```bash\npip list\n```\n\n## Notes\n\n- Always ensure you're using the\
  \ virtual environment when running the script\n- Do not use Python 3.13 as it's not compatible with\
  \ TensorFlow\n- Keep the `requirements.txt` file updated if ▋"

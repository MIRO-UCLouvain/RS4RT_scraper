readme_excerpt: "# 2V-CBCT\n\nCode for 2V-CBCT: Two-orthogonal-projection based CBCT reconstruction and\
  \ dose calculation from real CBCT projection data\n\n1. Prepare your data and check all paths.\n\n2.\
  \ Run mk_vol_patches.py to prepare the training data for CR-Net.\n\n3. Run train_3d.py to train CR-Net.\n\
  \n4. Run test_3dresunet_and_prepare_data_for_fine_tune.py and mk_2d_slice.py to prepare the training\
  \ data for FT-Net.\n\n5. Run train_2d.py to train FT-Net. \n\n6. Run test_2d.py to get the final results.\n"

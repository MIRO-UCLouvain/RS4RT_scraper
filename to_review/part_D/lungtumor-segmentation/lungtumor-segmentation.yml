readme_excerpt: "# LungTumor-Segmentation on Lung CT Scans\n**Prevalence:**\n- Lung cancer or Bronchial\
  \ Carcinoma is one of the most common cancers, making up 25% of all cancer types.\n- Approximately,\
  \ one in 16 people will develop lung cancers during their lifetime. \n\n**How Automatic Tumor Segmentation\
  \ can help?**\n- It reduces the probability of missing a tumor (reduce the FNR)\n- It can directly obtain\
  \ the size or volume of the tumor which is necessary for tumor staging .\n\n**Data:**  \nThe original\
  \ data is provided by the Medical Segmentation Decathlon Challenge (http://medicaldecathlon.com/)\n\n\
  At the time of training this model, this dataset was uploaded to kaggle with this url address https://www.kaggle.com/datasets/jadhavrajveer/medical-decathlon-lung-tumor-segmentation,\
  \ eliminating the need to download and upload the dataset to our repository. So, thank you @jadhavrajveer!\n\
  \n**Pipeline:**\n- Environment\n- Configuration\n- Data\n- Preprocessing\n- Train/Val Dataset Creation\
  \ + Augmentation\n- Train/Val Dataloader Creation\n- Model: U-Net\n- Training\n- Evaluation\n- Visualization\n\

readme_excerpt: "# Quality Assurance of Nasopharyngeal Cancer Radiation Therapy Targets (CTV's) using\
  \  a novel web-based quality assurance application\n\n## MedRxiv submission [\"Development of web-based\
  \ quality-assurance tool for radiotherapy target delineation for head and neck cancer: quality evaluation\
  \ of nasopharyngeal carcinoma\"](https://www.medrxiv.org/content/10.1101/2021.02.24.21252123v1)\n\n\
  ## Clinical Acceptability Testing Web Application\n\n### QUANNOTATE [(Web App)](https://www.quannotate.com)\
  \ [(GitHub)](www.github.com/bhklab/quannotate)\n\n## Code Ocean Capsule\n\nThis [Code Ocean compute\
  \ capsule](codeocean.com/capsule/1953079/tree) will allow you to reproduce the results published by\
  \ the author on your local machine<sup>1</sup>. Follow the instructions below, or consult [our knowledge\
  \ base](https://help.codeocean.com/user-manual/sharing-and-finding-published-capsules/exporting-capsules-and-reproducing-results-on-your-local-machine)\
  \ for more information. Don't hesitate to reach out via live chat or [email](mailto:support@codeocean.com)\
  \ if you have any questions.\n\n<sup>1</sup> You may need access to additional hardware and/or software\
  \ licenses.\n\n## Prerequisites\n\n- [Docker Community Edition (CE)](https://www.docker.com/community-edition)\n\
  - MATLAB/MOSEK/Stata licenses where applicable\n\n## Instructions\n\n### The computational environment\
  \ (Docker image)\n\nThis capsule is private and its environment cannot be downloaded at this time. You\
  \ will need to rebuild the environment locally.\n\n> If there's any software requiring a license that\
  \ needs to be run during the build stage, you'll need to make your license available. See [our knowledge\
  \ base](https://help.codeocean.com/user-manual/sharing-and-finding-published-capsules/exporting-capsules-and-reproducing-results-on-your-local-machine)\
  \ for more information.\n\nIn your terminal, navigate to the folder where you've extracted the capsule\
  \ and execute the following command:\n```shell\ncd environment && docker build . --tag 556c150d-cc06-4333-b25f-4ab024bb5ba9;\
  \ cd ..\n```\n\n> This step will recreate the environment (i.e., the Docker image) locally, fetching\
  \ and installing any required dependencies in the process. If any external resources have become unavailable\
  \ for any reason, the environment will fail to build.\n\n### Running the capsule to reproduce the results\n\
  \nIn your terminal, navigate to the folder where you've extracted the capsule and execute the following\
  \ command, adjusting parameters as needed:\n```shell\ndocker run --rm \\\n  --workdir /code \\\n  --volume\
  \ \"$PWD/data\":/data \\\n  --volume \"$PWD/code\":/code \\\n  --volume \"$PWD/results\":/results \\\
  \n  556c150d-cc06-4333-b25f-4ab024bb5ba9 ./run\n```\n"

readme_excerpt: "# \U0001F43C Panda Bot\n\nPanda Bot is a powerful, all-in-one Discord bot designed to\
  \ make DevHub server more engaging, organized, and fun.\nIt comes packed with features for community\
  \ management, macros, fun things and lot more.\n\n## ✨ Features\n\n- **Welcoming System**\n  Greets\
  \ new members with welcome messages and embeds (both in server and DM).\n\n- **Leveling System**\n \
  \ Reward activity with XP and levels. Add roles for active members.\n\n- **Ticketing System**\n  Easy-to-use\
  \ support ticket creation and management.\n\n- **Starboard**\n  Sends message with many reactions to\
  \ starboard channel.\n\n- **Auto Moderation**\n  Detect bad words, and unwanted behavior before it becomes\
  \ a problem.\n\n- **Suggestion System**\n  Collect, manage, and vote on community suggestions with a\
  \ clean interface.\n\n- **Counting Game**\n  Fun classic counting channel game\n\n## \U0001F91D Contributing\n\
  \nWe welcome contributions!\nFeel free to open issues or submit pull requests to improve Panda Bot.\n\
  \n## \U0001F4DC License\n\nPanda Bot is released under the **GPL-3.0** License. See [LICENSE](./LICENSE)\
  \ file for more details.\n"

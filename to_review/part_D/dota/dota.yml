readme_excerpt: "# Dose calculation via Transformers #\n\nThis repository contains the code to calculate\
  \ the dose deposited by a mono-energetic beam of protons, for arbitrary patient geometries and beam\
  \ energies. \n\n* GNU General Public License 3.0\n* Copyright: Oscar Pastor-Serrano, TU Delft\n\nThe\
  \ 'main' branch contains the code for proton beamlets, while the 'dev_photons' branch contains the code\
  \ for predictin full photon beams.\n\n### Credits ###\n\nIf you like this repository, please click on\
  \ Star!\n\nIf you use the code for your research, please consider citing:\n\nPastor-Serrano, O., & Perkó,\
  \ Z. (2021). Learning the Physics of Particle Transport via Transformers.\n<https://doi.org/10.1609/aaai.v36i11.21466>\n\
  \nPastor-Serrano, O., & Perkó, Z. (2022). Millisecond speed deep learning based proton dose calculation\
  \ with Monte Carlo accuracy.\n<https://doi.org/10.1088/1361-6560/ac692e>\n\nPastor-Serrano, O., Dong,\
  \ P., Huang, C., Xing, L., & Perkó, Z. (2023). Sub-second photon dose prediction via transformer neural\
  \ networks.\n<https://doi.org/10.1002/mp.16231> \n\nThis project is supported by the following institutions:\n\
  \n* KWF Kanker Bestrijding\n* Department of Radiation Science and Technology (TU Delft)\n\n### Requirements\
  \ ###\n\n* Tensorflow 2.5 or higher\n* pymedphys\n* tensorflow-addons\n"

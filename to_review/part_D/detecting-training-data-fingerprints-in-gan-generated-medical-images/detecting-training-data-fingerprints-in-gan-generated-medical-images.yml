readme_excerpt: "#  Detecting Training Data Fingerprints in GAN-Generated Medical Images\n\n##  Overview\n\
  This project explores the **privacy risks and data leakage potential** in medical image synthesis using\
  \ **Generative Adversarial Networks (GANs)**. Specifically, it investigates whether **\"fingerprints\"\
  ** from training data—such as distinctive patterns or artifacts—persist in GAN-generated outputs and\
  \ can be traced back to real patient data. The work aligns with the growing concern around **model memorization**,\
  \ **synthetic data reuse**, and **regulatory compliance in medical AI**.\n\n---\n\n##  Objectives\n\
  - Assess whether GANs unintentionally retain identifiable patterns from their training images.\n- Detect\
  \ and visualize **fingerprints** using statistical, perceptual, and deep feature similarity metrics.\n\
  - Evaluate potential privacy risks associated with publishing synthetic medical datasets.\n\n---\n\n\
  ##  Methodology\n- **GAN Models**: Use or fine-tune models like StyleGAN, DCGAN on medical datasets\
  \ (e.g., chest X-rays, skin lesions).\n- **Feature Extraction**:\n  - Structural Similarity Index (SSIM)\n\
  \  - L2 pixel-level distance\n  - Deep embeddings (VGG, ResNet-based)\n- **Fingerprint Matching**:\n\
  \  - Compare synthetic images to the training set using cosine similarity in embedding space\n  - Identify\
  \ overrepresented or memorized samples\n- **Visualization**: t-SNE/PCA plots for clustering of real\
  \ vs. synthetic data\n\n---\n\n"

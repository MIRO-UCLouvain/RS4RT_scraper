readme_excerpt: "# TG-43--Dose-Rate-calculator\n\nThe TG-43 Dose Rate Calculator is a web-based tool designed\
  \ to compute dose rates for brachytherapy sources using the TG-43 formalism. This tool allows users\
  \ to calculate dose distributions for both point source and line source approximations, based on user-provided\
  \ input parameters such as calculation coordinates, dwell position, dwell time, and activity.\n\nThe\
  \ calculator reads radial dose function and anisotropy function data from an uploaded Excel file, interpolates\
  \ values, and applies TG-43 equations to compute:\n\t•\tDistance (r) between source and calculation\
  \ point\n\t•\tAngle (θ) relative to the source\n\t•\tRadial Dose Function (g_L(r))\n\t•\tAnisotropy\
  \ Function (F(r,θ))\n\t•\tGeometrical Factor (G_L(r,θ))\n\t•\tDose Rate (D(r,θ)) in cGy/hr\n\t•\tTotal\
  \ Dose received at the calculation point\n\nFeatures\n\n Supports both point source and line source\
  \ calculations\n Reads and interpolates dose data from an Excel file\n Calculates geometrical factors,\
  \ radial dose, and anisotropy functions\n Provides total dose estimation based on dwell time and source\
  \ activity\n Uses JavaScript and the XLSX library to handle Excel file parsing\n\nHow to Use\n\t1.\t\
  Open the .html file and save it in the local system and then Select the source type (Point or Line).\n\
  \t2.\tEnter the calculation coordinates (x, y, z) and dwell position (x, y, z).\n\t3.\tInput dwell time\
  \ (seconds) and source activity (mCi).\n\t4.\tUpload an Excel file containing interpolated anisotropy\
  \ and radial dose function data.\n\t5.\tClick “Calculate” to compute results.\n\t6.\tView computed values\
  \ for distance, angle, dose rate, and total dose in the results section.\n\nRequirements\n\t\n\t•\t\
  Excel file containing precomputed dose function data\n\t\n"

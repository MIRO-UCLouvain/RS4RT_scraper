readme_excerpt: '# 🧠 Brain Tumor Segmentation using TransUNet with Flask


  ## 📌 Project Overview


  This project performs Brain Tumor Segmentation using a TransUNet deep learning model on the BraTS MRI
  dataset.


  The application provides a Flask web interface where users can select a patient from the BraTS dataset
  and visualize:


  - Input MRI Image

  - Ground Truth Mask

  - Predicted Segmentation Mask


  ---


  ## 📂 Dataset


  BraTS 2019 Dataset


  MRI Modalities:


  - FLAIR

  - T1

  - T1ce

  - T2


  Tumor Mask Labels:


  - Whole Tumor

  - Tumor Core

  - Enhancing Tumor


  ---


  ## 🛠 Technologies Used


  - Python

  - PyTorch

  - Flask

  - NumPy

  - Matplotlib

  - NiBabel


  ---


  ## 🧠 Deep Learning Model


  - U-Net

  - TransUNet

  - Dice Loss

  - Cross Entropy Loss

  - AdamW Optimizer


  ---


  ## 📊 Evaluation Metrics


  - Dice Score

  - IoU Score


  ---


  ## 🌐 Flask Web Application


  Features:


  - Select Patient

  - Brain Tumor Prediction

  - Input MRI Visualization

  - Ground Truth Visualization

  - Predicted Mask Visualization


  ---


  ## 📁 Project Structure


  ```text

  PROJECT_12_Brain_Tumor_Segmentation


  ├── app.py

  ├── predict_flask.py

  ├── train.py

  ├── models/

  ├── utils/

  ├── templates/

  ├── static/

  ├── dataset/

  └── brain_tumor_transunet.pth

  ```


  ---


  ## ▶️ Run Project


  ```bash

  py app.py

  ```



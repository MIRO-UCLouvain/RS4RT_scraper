  Brain Tumor Segmentation using TransUNet with Flask

  ---


  # U-Net vs TransUNet Comparison


  | Feature | U-Net | TransUNet |

  |---------|--------|-----------|

  | CNN Encoder | ✅ | ✅ |

  | Transformer Block | ❌ | ✅ |

  | Local Feature Learning | ✅ | ✅ |

  | Global Context Learning | ❌ | ✅ |

  | Brain Tumor Segmentation | Good | Better |

  | Dice Score | Moderate | Higher |

  | IoU Score | Moderate | Higher |


  ---


  ## Conclusion


  TransUNet combines the strengths of Convolutional Neural Networks (CNNs) and Vision Transformers. It
  captures both local and global features, resulting in improved brain tumor segmentation performance
  compared to the traditional U-Net model.'

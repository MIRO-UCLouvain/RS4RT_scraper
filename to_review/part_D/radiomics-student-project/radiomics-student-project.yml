readme_excerpt: "# Radiomics for Medical Image Classification\n\nStudent project for learning radiomics\
  \ feature extraction and machine learning classification on medical images.\n\n### Open in Google Colab\n\
  \n| Notebook | Description | Colab |\n|----------|-------------|-------|\n| `00_data_exploration` |\
  \ EDA & data quality checks | [![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/)\
  \ |\n| `01_feature_extraction` | PyRadiomics feature extraction | [![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/)\
  \ |\n| `01b_advanced_image_processing`| Manual preprocessing & filters | [![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/)\
  \ |\n| `02_machine_learning` | ML training & evaluation | [![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/)\
  \ |\n\n> **Note:** Update the Colab URLs above once the notebooks are hosted on GitHub.\n\n## \U0001F4DA\
  \ Learning Objectives\n\n1. **Radiomics Feature Extraction**\n   - Understand first-order statistics\n\
  \   - Learn shape features\n   - Explore texture features (GLCM, GLRLM, GLSZM, GLDM, NGTDM)\n   - Use\
  \ PyRadiomics library\n\n2. **Machine Learning Pipeline**\n   - Data preprocessing and standardization\n\
  \   - Feature selection techniques\n   - Cross-validation strategy\n   - Model training and evaluation\n\
  \   - Performance metrics interpretation\n\n3. **Medical Image Analysis**\n   - **New**: Manual intensity\
  \ normalization and discretization (binning)\n   - **New**: Advanced filtering (LoG, Wavelets)\n   -\
  \ Work with DICOM/NIfTI formats\n   - Understand ROI segmentation\n   - Apply radiomics to clinical\
  \ problems\n\n## \U0001F4C1 Project Structure\n\n```\nradiomics_student_project/\n├── notebooks/\n│\
  \   ├── 00_data_exploration.ipynb      # ⭐ Start here! EDA & data quality\n│   ├── 01_feature_extraction.ipynb\
  \    # Feature extraction with PyRadiomics\n│   ├── 01b_advanced_image_processing.ipynb # Advanced IP\
  \ & Filter Viz\n│   └── 02_machine_learning.ipynb      # ML training and evaluation\n├── scripts/\n\
  │   ├── download_radmlbench_datasets.py # Download real datasets\n│   └── sample_radiomics_dataset.py\
  \     # Generate sample data\n├── data/                               # Download datasets here\n├──\
  \ docs/\n│   ├── images/                        # Slide images (pipeline diagram)\n│   ├── SLIDES.md\
  \                      # Marp presentation slides\n│   ├── DATASET_GUIDE.md               # Guide to\
  \ real datasets\n│   ├── PRE_EXTRACTED_DATASETS.md      # Pre-extracted CSV datasets\n│   └── STUDENT_WORKSHEET.md\
  \           # Student worksheet with rubric\n├── outputs/                            # Results and figures\n\
  ├── requirements.txt                    # Python dependencies\n└── README.md                       \
  \    # This file\n```\n\n## \U0001F680 Quick Start\n\n### Option 1: Google Colab (Recommended for Students)\n\
  \n1. Upload the notebooks to Google Colab (or click the Colab badges above)\n2. Start with `00_data_exploration.ipynb`\
  \ to understand your data\n3. Run `01_feature_extraction.ipynb` for feature extraction\n4. Explore `01b_advanced_image_processing.ipynb`\
  \ to understand the math\n5. Continue with `02_machine_learning.ipynb` for ML\n\n### Option 2: Local\
  \ Setup\n\n```bash\n# Install dependencies\npip install -r requirements.txt\n\n# Clone or download this\
  \ project\ncd radiomics_student_project\n\n# Run notebooks\njupyter notebook notebooks/\n```\n\n## \U0001F4CA\
  \ Datasets\n\n### Synthetic Data (Included)\n- Auto-generated for demonstration\n- 20 patients with\
  \ CT-like images\n- Binary classification (benign/malignant)\n\n### Real Medical Datasets\n\n#### 1.\
  \ TCIA Head-Neck Cancer (Recommended)\n- **Source**: [The Cancer Imaging Archive](https://www.cancerimagingarchive.net/)\n\
  - **Collection**: Head-Neck-PET-CT\n- **Size**: ~300+ patients\n- **Modality**: CT, PET\n- **Task**:\
  \ Radiation therapy response prediction\n\n#### 2. BraTS (Brain Tumor)\n- **Source**: [ BraTS Challenge](https://www.med.upenn.edu/cbica/brats/)\n\
  - **Modality**: MRI (T1, T2, FLAIR)\n- **Task**: Glioma segmentation and classification\n\n#### 3. LUNA16\
  \ (Lung Nodules)\n- **Source**: [LUNA16 Challenge](https://luna16.grand-challenge.org/)\n- **Modality**:\
  \ CT\n- **Task**: Lung nodule detection\n\nSee [docs/DATASET_GUIDE.md](docs/DATASET_GUIDE.md) for download\
  \ instructions.\n\n## \U0001F393 Learning Path\n\n### Part 1: Feature Extraction & Image Processing\
  \ (Notebooks 01 & 01b)\n\n**Duration**: 3-4 hours\n\n**Topics**:\n- What is radiomics?\n- PyRadiomics\
  \ configuration\n- Image Preprocessing: Manual Z-score, Min-Max, and binning\n- Filtering: Laplacian\
  \ of Gaussian (LoG) and Wavelets\n- Single and batch extraction\n- Feature visualization\n\n**Deliverable**:\
  \ CSV file with extracted features + IP analysis report\n\n### Part 2: Machine Learning (Notebook 02)\n\
  \n**Duration**: 3-4 hours\n\n**Topics**:\n- Data preprocessing\n- Feature standardization\n- Feature\
  \ selection (F-test, mutual information)\n- Cross-validation\n- Model comparison (Logistic Regression,\
  \ Random Forest, SVM)\n- Performance evaluation\n- Model interpretation\n\n**Deliverable**: Trained\
  \ model and evaluation report\n\n## \U0001F52C Standard Radiomics Pipeline\n\n```\nMedical Images (CT/MRI)\n\
  \    ↓\nSegmentation Mask (ROI)\n    ↓\nFeature Extraction (PyRadiomics)\n    ↓\nFeature Matrix\n  \
  \  ↓\nPreprocessing (Standardization)\n    ↓\nFeature Selection\n    ↓\nMachine Learning Model\n   \
  \ ↓\nPerformance Evaluation\n```\n\n## \U0001F4C8 Expected Outcomes\n\nStudents will be able to:\n\n\
  1. Extract ~100+ radiomic features from medical images\n2. Mathematically justify preprocessing and\
  \ filtering choices\n3. Build a classification model with AUC > 0.75\n4. Interpret feature importance\n\
  5. Evaluate model performance using proper metrics\n6. Understand clinical relevance of radiomics\n\n\
  ## \U0001F4DD Assignment Ideas\n\n1. **Basic**: Complete both notebooks with synthetic data\n2. **Intermediate**:\
  \ Apply to real dataset from TCIA\n3. **Advanced**: Compare different feature selection methods and\
  \ models\n\n## \U0001F517 Resources\n\n### Documentation\n- [PyRadiomics Documentation](https://pyradiomics.readthedocs.io/)\n\
  - [Scikit-learn User Guide](https://scikit-learn.org/stable/user_guide.html)\n\n### Tutorials\n- [Radiomics\
  \ for Beginners](https://pmc.ncbi.nlm.nih.gov/articles/PMC6837295/)\n- [Medical Image Processing with\
  \ Python](https://theaisummer.com/medical-image-python/)\n\n### Papers\n- Lambin et al. (2012) - Radiomics:\
  \ extracting more information from medical images\n- Zwanenburg et al. (2020) - The Image Biomarker\
  \ Standardization Initiative\n\n## \U0001F41B Troubleshooting\n\n### Issue: PyRadiomics installation\
  \ fails\n**Solution**: Install build dependencies first\n```bash\nsudo apt-get install build-essential\
  \ python3-dev\npip install pyradiomics\n```\n\n### Issue: Out of memory in Google Colab\n**Solution**:\
  \ Reduce batch size or number of images\n\n### Issue: No real dataset available\n**Solution**: Use synthetic\
  \ data provided or download from TCIA\n\n## \U0001F4E7 Support\n\nFor PyRadiomics issues, visit: https://github.com/Radiomics/pyradiomics\n\
  \n## \U0001F4C4 License\n\nThis educational project is provided for academic use.\n\n## \U0001F64F Acknowledgments\n\
  \n- PyRadiomics team\n- TCIA for providing public datasets\n- Scikit-learn community\n\n---\n\n**Last\
  \ Updated**: March 2026\n**Version**: 1.1 (Master's Special Edition)\n"

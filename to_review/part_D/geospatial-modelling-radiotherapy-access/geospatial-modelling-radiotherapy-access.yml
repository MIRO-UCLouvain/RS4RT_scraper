readme_excerpt: "# RadMaps\n\n**Geospatial modelling of radiotherapy access using H3 hexagonal grids**\n\
  \n[![MIT License](https://img.shields.io/badge/license-MIT-blue.svg)](LICENSE)\n[![Python 3.9+](https://img.shields.io/badge/python-3.9%2B-blue.svg)](https://www.python.org/)\n\
  [![Streamlit](https://img.shields.io/badge/built%20with-Streamlit-ff4b4b.svg)](https://streamlit.io)\n\
  \nRadMaps is a Streamlit application that models and visualises global access to radiotherapy (linear\
  \ accelerators / linacs). It combines population density, cancer incidence, and LINAC facility data\
  \ to estimate the probability that a person at any given location can access radiotherapy treatment.\n\
  \n---\n\n## Screenshot\n\n*Screenshot placeholder — add an image of the app here.*\n\n---\n\n## Overview\n\
  \nApproximately half of all cancer cases require radiotherapy, yet access to RT remains critically low\
  \ in many parts of the world. National statistics mask large within-country inequalities driven by two\
  \ compounding factors:\n\n- **Geographic access** — RT requires attendance over several weeks; patients\
  \ far from a facility are substantially less likely to complete treatment.\n- **Machine capacity** —\
  \ the finite number of linacs limits total annual throughput.\n\nRadMaps combines both constraints simultaneously,\
  \ producing per-hexagon estimates of:\n\n- Population density and cancer burden (GLOBOCAN 2022)\n- RT\
  \ demand (optimal utilisation rates or user-defined fraction)\n- Geographic access probability using\
  \ exponential, Weibull, step, or uniform distance-decay models\n- Capacity-limited access via a ring-based\
  \ proportional allocation algorithm\n\nMaps are built on [H3 hexagonal grids](https://h3geo.org/) at\
  \ resolutions from ~400 m (country level) down to ~87,000 km² (regional), enabling consistent multi-scale\
  \ analysis. Travel-time routing via the TravelTime API (driving / public transport) is supported as\
  \ an alternative to straight-line distance.\n\n---\n\n## Quick Start\n\n**Requirements:** Python 3.9+\n\
  \n```bash\n# Clone the repository\ngit clone https://github.com/your-org/radmaps.git\ncd radmaps\n\n\
  # Install dependencies\npip install -r requirements.txt\n\n# Run the app\nstreamlit run app.py\n```\n\
  \nThe app opens at `http://localhost:8501`. Population data for the selected region is downloaded automatically\
  \ on first use from Kontur's public S3 bucket and cached locally.\n\n---\n\n## App Tabs\n\n| Tab | Description\
  \ |\n|---|---|\n| Introduction | Overview and motivation |\n| Map Modelling | Interactive map: population,\
  \ cancer incidence, RT demand, and access probability |\n| Geography-Only | Access limited by geographic\
  \ distance only |\n| Capacity-Only | Access limited by LINAC capacity only |\n| Data | Inspect and download\
  \ underlying data |\n| Method | Technical description of the modelling approach |\n| Assumptions | Key\
  \ assumptions and their justifications |\n| Toy Example | Worked example to build intuition |\n| Probability\
  \ Models | Compare distance-decay functions interactively |\n\n---\n\n## Data Sources\n\n| Data | Source\
  \ | Notes |\n|---|---|---|\n| Population | [Kontur Population Dataset](https://www.kontur.io/portfolio/population-dataset/)\
  \ | H3 resolution 8 (~400 m); downloaded automatically |\n| Cancer incidence | [GLOBOCAN 2022](https://gco.iarc.who.int/today/)\
  \ (IARC) | Bundled; 175 countries |\n| Optimal RT utilisation | Delaney *et al.* 2005 | Site-specific\
  \ RT fractions; bundled |\n| LINAC locations & counts | [IAEA DIRAC](https://dirac.iaea.org/) | Bundled\
  \ |\n\n---\n\n## Configuration\n\n### TravelTime API (optional)\n\nBy default, RadMaps uses straight-line\
  \ distance. To enable travel-time routing (driving or public transport), sign up for a free account\
  \ at [traveltime.com](https://traveltime.com) and add your credentials to `.streamlit/secrets.toml`:\n\
  \n```toml\n[traveltime]\napp_id = \"your_app_id\"\napi_key = \"your_api_key\"\n```\n\nA template is\
  \ provided at `.streamlit/secrets.toml.example`.\n\n---\n\n## Project Structure\n\n```\napp.py     \
  \                   # Main Streamlit application\nrequirements.txt              # Python dependencies\n\
  analysis/\n  accessibility.py            # H3 accessibility computation (geographic + capacity-limited)\n\
  data/\n  cancer.py                   # GLOBOCAN loader and H3 apportionment\n  linacs.py           \
  \        # DIRAC LINAC database loader\n  population.py               # Kontur population loader and\
  \ resampler\n  travel_time.py              # TravelTime API integration\n  regions.py              \
  \    # Region definitions (Africa, Europe, etc.)\ncancer_data/\n  globocan_xarray.nc          # GLOBOCAN\
  \ 2022 data (Cancer × Metric × ISO3)\n  optimal_rt_utilisations.csv # Site-specific RT utilisation fractions\n\
  linac_data/\n  Database_DIRAC_fixed.csv    # DIRAC LINAC database (geocoding-corrected)\nassets/\n \
  \ flowchart.png               # Pipeline flowchart (shown in Method tab)\n  toy_example/           \
  \     # Step-by-step worked example figures\nH3_region_cache/              # Regional H3 parquets (res\
  \ 1–3; generated on demand, gitignored)\nH3_pop_density_maps/          # Per-country Kontur GPKG files\
  \ (downloaded on demand, gitignored)\n.streamlit/\n  secrets.toml.example        # TravelTime credentials\
  \ template\n```\n\n---\n\n## Probability Models\n\nFour distance-decay models are available:\n\n| Model\
  \ | Formula | Key parameter |\n|---|---|---|\n| Exponential | P(d) = exp(−d/λ) | λ = decay length (km)\
  \ |\n| Weibull | P(d) = exp(−(d/λ)ᵏ) | λ = scale (km), k = shape |\n| Step function | P(d) = 1 if d\
  \ ≤ d_max, else 0 | d_max = cutoff (km) |\n| Uniform | P(d) = 1 for all d | — |\n\nThe Weibull model\
  \ (k ≥ 1) generalises exponential decay with a flat near-facility plateau followed by a steeper drop-off,\
  \ matching observed patterns in RT attendance with distance.\n\nCapacity allocation uses a **ring-based\
  \ proportional algorithm**: for each facility, hexagons are grouped into concentric rings; each ring\
  \ is served in full before moving outward, and when a ring exhausts remaining capacity the budget is\
  \ split proportionally by demand weight across all hexagons in that ring.\n\n---\n\n## Citation\n\n\
  If you use this tool in your work, please cite:\n\n> Wroe L. *RadMaps: a geospatial tool for modelling\
  \ sub-national radiotherapy access.* (2025). https://github.com/LaurenceWroe/Geospatial-modelling-radiotherapy-access\n\
  \n---\n\n## License\n\nReleased under the [MIT License](LICENSE).\n\n---\n\n## Contact\n\nLaurence Wroe\
  \ — laurencewroe@gmail.com\n"

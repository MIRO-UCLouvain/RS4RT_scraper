readme_excerpt: "# Cross-Modality Medical Image Translation (MRI ↔ CT)\n\nThis repository contains an\
  \ unsupervised deep learning framework for bidirectional medical image translation between MRI and CT\
  \ modalities using **CycleGAN**. This project is specifically designed to generate high-fidelity **Synthetic\
  \ CT (sCT)** from MRI scans to enable MRI-only radiotherapy planning, effectively reducing patient radiation\
  \ exposure and clinical costs.\n\n\n\n## \U0001F680 Key Features\n* **Unpaired Training:** Operates\
  \ without the need for perfectly aligned MRI-CT image pairs, utilizing cycle-consistency constraints.\n\
  * **ResUNet Architecture:** Features a ResNet-9 generator that preserves deep anatomical features and\
  \ mitigates gradient vanishing.\n* **SSIM-Enhanced Training:** Beyond standard $L_1$ and Adversarial\
  \ losses, an explicit **Structural Similarity (SSIM) Loss** is integrated to ensure anatomical integrity.\n\
  * **Medical Domain Optimized:** Built using the **MONAI** (Medical Open Network for AI) framework for\
  \ specialized medical data augmentation and intensity transforms.\n\n## \U0001F3D7️ Technical Architecture\n\
  * **Generators:** ResNet-based models with 9 residual blocks and Instance Normalization.\n* **Discriminators:**\
  \ 70x70 PatchGAN with **Spectral Normalization** to ensure training stability and realistic local textures.\n\
  * **Training Strategy:** 60 epochs with a starting learning rate of 0.0002, utilizing a **Cosine Annealing**\
  \ scheduler and the **Adam** optimizer.\n\n## \U0001F4CA Results & Evaluation\nThe model demonstrates\
  \ high fidelity in structural preservation. While the CT-to-MRI cycle shows higher stability, the MRI-to-CT\
  \ translation successfully recovers skeletal structures necessary for dose calculation.\n\n| Metric\
  \ | MRI Cycle ($MRI \\rightarrow CT \\rightarrow MRI$) | CT Cycle ($CT \\rightarrow MRI \\rightarrow\
  \ CT$) |\n| :--- | :--- | :--- |\n| **Mean SSIM** | 0.7660 | **0.9173** |\n| **Peak SSIM** | 0.8511\
  \ | **0.9262** |\n| **Mean PSNR** | ~24.5 dB | ~29.8 dB |\n\n\n\n## \U0001F6E0️ Installation\nEnsure\
  \ you have the following dependencies installed:\n```bash\npip install torch torchvision monai matplotlib\
  \ numpy\n```\n\n\U0001F4DA References\n\n    Yu, L., et al. (2025). \"AI-enhanced PET/CT image synthesis\
  \ using CycleGAN for improved ovarian cancer imaging,\" Polish Journal of Radiology, vol. 90.\n\n  \
  \  Bahloul, M. A., et al. (2024). \"Advancements in synthetic CT generation from MRI: A review of techniques,\"\
  \ Frontiers in Radiology.\n\n    SciTePress (2024). \"CT to MRI Image Translation Using CycleGAN: A\
  \ Deep Learning Approach for Cross-Modality Medical Imaging.\"\n\n    Zhu, J.-Y., et al. (2017). \"\
  Unpaired Image-to-Image Translation using Cycle-Consistent Adversarial Networks,\" ICCV.\n\n\n\nDevelopment\
  \ Team: [Abhinab Das](https://github.com/abhi9ab), [Abhishek S U](https://github.com/Abhiajay1802),\
  \ [Abhinav Pandey](https://github.com/Abhinav2656), Priyanshu Thakur\n"

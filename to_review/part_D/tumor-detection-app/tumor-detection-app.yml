readme_excerpt: "# NeuroScanix AI\n\nDeep Learning-based platform for brain tumor classification, segmentation,\
  \ and explainable artificial intelligence (XAI) from magnetic resonance imaging (MRI).\n\n---\n\n##\
  \ Project Overview\n\nNeuroScanix AI was developed as a Final Degree Project in Biomedical Engineering\
  \ at the University of Deusto.\n\nThe objective of the project was to design, train, evaluate, and deploy\
  \ an end-to-end AI system capable of assisting brain tumor analysis from MRI images.\n\nThe final platform\
  \ integrates:\n\n- Brain tumor classification\n- Tumor segmentation\n- Explainable AI visualization\
  \ through Grad-CAM\n- Interactive web application\n- User authentication and session management\n- Exportable\
  \ analysis reports\n\n---\n\n## Dataset Selection\n\nThe project was developed using the **BRISC2025\
  \ (BRain Tumor Image Segmentation and Classification)** dataset.\n\nBRISC2025 is a structured version\
  \ of the Nickparvar Brain Tumor MRI Dataset and incorporates images from several publicly available\
  \ databases, including:\n- Cheng Dataset\n- SARTAJ Dataset\n- Br35H Dataset\n\nThe dataset was selected\
  \ due to its large number of MRI scans, balanced class distribution, availability of segmentation masks,\
  \ suitability for both classification and segmentation tasks, and expert-validated annotations.\n\n\
  The dataset contains four categories:\n- Glioma\n- Meningioma\n- Pituitary Tumor\n- No Tumor\n\n###\
  \ Dataset License\nCC BY 4.0\nDataset source:\nhttps://www.kaggle.com/datasets/briscdataset/brisc2025\n\
  \n<img width=\"800\" height=\"350\" alt=\"image\" src=\"https://github.com/user-attachments/assets/1dd5e8be-70a7-4334-834a-82917c52534b\"\
  \ />\n\n---\n\n## Data Preprocessing\n\n### Classification Pipeline\n\nThe classification dataset underwent:\n\
  \n- Image resizing\n- Pixel normalization\n- Data augmentation\n\nApplied augmentation techniques:\n\
  \n- Horizontal flipping\n- Rotation\n- Translation\n- Zoom transformations\n- Brightness modifications\n\
  \nThe objective was to improve model generalization and reduce overfitting.\n\n<img width=\"800\" height=\"\
  200\" alt=\"image\" src=\"https://github.com/user-attachments/assets/ed38bc42-b67a-40a2-bbd1-2a7e7c1260eb\"\
  \ />\n\n### Segmentation Pipeline\n\nThe segmentation dataset underwent:\n\n- Image resizing\n- Pixel\
  \ normalization\n- Binary mask preparation\n\nNo data augmentation was applied to the segmentation dataset.\n\
  \n<img width=\"300\" height=\"300\" alt=\"image\" src=\"https://github.com/user-attachments/assets/94c394f3-fcd4-4336-ad5c-cb316daa3855\"\
  \ />\n\n---\n\n## Model Development\n\n### Classification Model\n\n#### Model Architecture\n\nThe classification\
  \ model was developed to automatically classify brain MRI scans into four diagnostic categories: Glioma,\
  \ Meningioma, Pituitary Tumor, and No Tumor.\n\n<img width=\"800\" height=\"500\" alt=\"Classification\
  \ architecture\" src=\"https://github.com/user-attachments/assets/ad039985-1ef9-430a-b4c8-c8d85bd02639\"\
  \ />\n\n#### Results\n\nThe model performance was evaluated using training curves, a confusion matrix,\
  \ and classification metrics.\n\n##### Training Curves\n\n<img width=\"1699\" height=\"389\" alt=\"\
  image\" src=\"https://github.com/user-attachments/assets/359772a5-f3ea-42c0-a06f-3c7451e0ba00\" />\n\
  \n##### Classification Report\n\n<img width=\"376\" height=\"170\" alt=\"Captura de pantalla 2026-03-24\
  \ 091200\" src=\"https://github.com/user-attachments/assets/b6eb2b79-10f1-408c-a569-b2fcd303ef0b\" />\n\
  \n---\n\n### Segmentation Model\n\n#### Model Architecture\n\nThe segmentation model was developed to\
  \ automatically identify and delineate tumor regions in brain MRI scans at the pixel level.\n\n<img\
  \ width=\"800\" height=\"500\" alt=\"Segmentation architecture\" src=\"https://github.com/user-attachments/assets/06fe6601-40b0-4885-a505-4eff81cbddf9\"\
  \ />\n\n#### Results\n\nThe model performance was evaluated using training curves and segmentation-specific\
  \ metrics such as Dice Score and IoU.\n\n##### Training Curves\n\n<img width=\"3000\" height=\"750\"\
  \ alt=\"segmentation_training\" src=\"https://github.com/user-attachments/assets/795b4a62-6105-4445-b4d9-d42bfbc25137\"\
  \ />\n\n##### Evaluation Metrics\n\n<img width=\"420\" height=\"175\" alt=\"Captura de pantalla 2026-03-24\
  \ 093125\" src=\"https://github.com/user-attachments/assets/f92486c0-2481-42ab-93c5-b44d5a14377c\" />\n\
  \n\n## Explainable Artificial Intelligence\n\nTo improve model interpretability, several Explainable\
  \ Artificial Intelligence (XAI) techniques were evaluated during the project, including **Vanilla Saliency\
  \ Maps**, **SmoothGrad**, and **Grad-CAM (Gradient-weighted Class Activation Mapping)**. These methods\
  \ were tested on both the classification and segmentation models to analyze how each network made its\
  \ predictions and to assess the clinical relevance of the highlighted image regions.\n\nAfter comparing\
  \ the generated explanations, **Grad-CAM** was selected for integration into the final application due\
  \ to its superior visual interpretability and its ability to clearly highlight the MRI regions that\
  \ contributed most to the classification decision.\n\nClassification XAI:\n<img width=\"900\" height=\"\
  200\" alt=\"image\" src=\"https://github.com/user-attachments/assets/b632ccfb-f9ff-4e31-a4ae-cc77b00082a9\"\
  \ />\n\nSegmentation XAI:\n<img width=\"900\" height=\"200\" alt=\"image\" src=\"https://github.com/user-attachments/assets/da3b818b-58db-4c7c-b71e-1502830bc5ea\"\
  \ />\n\n\n---\n\n## Web Application\n\nThe final system was deployed as an interactive web application\
  \ using Streamlit.\n<img width=\"1567\" height=\"818\" alt=\"image\" src=\"https://github.com/user-attachments/assets/28ec7203-2268-4119-a301-11478d0fed58\"\
  \ />\n<img width=\"1540\" height=\"649\" alt=\"image\" src=\"https://github.com/user-attachments/assets/0a3ba599-fe8c-4031-8eea-1e12128fdad1\"\
  \ />\n\n\n## Live Demo\n\n\U0001F680 Try NeuroScanix AI online:\n\nhttps://brain-tumor-segmentation-classification.streamlit.app/\
  \ \n\n## Author\n\nÁngela Del Campo\n\nBachelor's Degree in Biomedical Engineering\n\nUniversity of\
  \ Deusto\n\nAcademic Year 2025–2026\n"

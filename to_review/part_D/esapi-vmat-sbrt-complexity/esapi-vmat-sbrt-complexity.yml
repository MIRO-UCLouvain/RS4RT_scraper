readme_excerpt: "# ESAPI script for VMAT and SBRT plan complexity calculation\nSimple ESAPI script to\
  \ extract complexity metrics for VMAT and SBRT plans\n\nInstructions on how to edit and run the ESAPI\
  \ script can be found at the tutorial presented at the European Congress for Medical Physics 2022, avaialble\
  \ online at: https://www.youtube.com/watch?v=ffA9Cs6H3u8\n\nLiterature reference:\nKlara Uher, Stefanie\
  \ Ehrbar, Stephanie Tanadini-Lang, Riccardo Dal Bello\nReduction of patient specific quality assurance\
  \ through plan complexity metrics for VMAT plans with an open-source TPS script\nZeitschrift für Medizinische\
  \ Physik\nhttps://doi.org/10.1016/j.zemedi.2023.02.003\n\nScripts provided:\n- OTL: simple script to\
  \ get introduced to ESAPI. Please follow the youtube tutorial\n- MMO: script to extract the mean mlc\
  \ opening, which has been found to correlate with portal dosimetry patient specific QA measurements\n\
  \nLibrary provided:\n- MetricsCalc.cs: calculation of several metrics taking \"_IEnumerable<Beam> Beams_\"\
  \ as input. You can implement this within your VisualStudio solution.\n\nFor further information, please\
  \ reach out to our team:\nhttps://www.usz.ch/fachbereich/radio-onkologie/team/\n\nMay 2023,\nRiccardo\
  \ Dal Bello\n\n\nUse of the code:\nThe code was developed for the specific needs of the Radiation Oncology\
  \ Department of the University Hospital Zurich. By no means, the tests and the validity ranges of the\
  \ tests should be taken without critical inspection and directly implemented for clinical use. The code\
  \ is shared \"as is\" without warranty or responsibility of any type. The proprietary ESAPI libraries\
  \ should be requested directly to Varian and will not be distributed in this repository.\nSupport:\n\
  The code is shared solely for the benefit of scientific collaboration between Radiation Oncology departments.\

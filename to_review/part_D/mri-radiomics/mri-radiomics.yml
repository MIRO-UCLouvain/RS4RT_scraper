readme_excerpt: "# MRI-Radiomics\nThis repository contains Python scripts for radiomics analysis aimed\
  \ at identifying reproducible radiomics features across published MRI protocols used in pancreatic cancer\
  \ studies. The workflow includes feature extraction, reproducibility assessment across imaging protocols,\
  \ and identification of robust features for quantitative MRI radiomics.\n\n\nThis repository contains\
  \ Python scripts for radiomics analysis aimed at identifying reproducible \nradiomics features across\
  \ published MRI protocols used in pancreatic cancer studies. The workflow includes feature \nextraction,\
  \ reproducibility assessment across imaging protocols, and identification of robust features for quantitative\
  \ \nMRI radiomics research.\n\nThe radiomics pipeline, including image and mask loading, ROI definition\
  \ for radiomics analysis, and all applied image \npreprocessing steps, is described in the attached\
  \ Jupyter Notebook (.ipynb) file.\n"

readme_excerpt: "# MRI to Synthetic CT Generation with Explainability\n\nThis project implements a 3D\
  \ Residual UNet model to generate synthetic CT (sCT) from MRI volumes.\n\n## Features\n- MRI → CT translation\n\
  - HU conversion\n- Grad-CAM explainability\n- Streamlit web interface\n\n## How to Run\n\n1. Clone repo\n\
  2. Install dependencies:\n   pip install -r requirements.txt\n3. Place trained model in:\n   model/best_model.pth\n\
  4. Run:\n   streamlit run app.py\n\n## Tools Used\n- PyTorch\n- SimpleITK\n- Streamlit\n- NumPy\n- Matplotlib\n\
  \n## Author\nAbhinav S"

readme_excerpt: "# VMAT - Virtual Memory Address Translation\n\n> [!NOTE] \n> The vision is to create\
  \ a platform with exercises and\n> interactive diagrams suited for CompSys students that\n> make it\
  \ visually appealing and engaging to learn.\n\n![Demo](./assets/demo.gif)  \n\nAn **interactive learning\
  \ simulator** for **Computer Systemer** students to explore **virtual memory address translation** through\
  \ simulations and exercises. \nThis simulator was created by [Nidocq](https://github.com/Nidocq) and\
  \ I\n\n## Features\n- **Exam Digitalization:** The simulator digitally recreates computer systems exams,\
  \ allowing students to practice virtual memory address translation in a controlled environment.\n- **Configurability:**\
  \ The project offers configurability, enabling students to experiment with various types of assignments.\
  \ This flexibility allows users to customize parameters such as page size, number of pages, and different\
  \ memory management schemes.\n- **Interactive Learning:** With a user-friendly interface, the simulator\
  \ promotes interactive learning by visualizing the virtual memory address translation process step by\
  \ step. Students can observe how different configurations impact the translation and gain a deeper understanding\
  \ of the underlying concepts.\n\n## **Getting Started**\nClone the repository and install dependencies:\n\
  ```sh\ngit clone https://github.com/MahmoodSeoud/cache-hit-miss.git  \ncd cache-hit-miss  \nnpm install\
  \  \nnpm run dev  \n```\n\n### VMAT vs Exam\n<p align=\"center\">\n  <img src=\"./assets/demo.png\"\
  \ alt=\"Demo\" width=\"45%\">\n  <img src=\"./assets/vmatexam.png\" alt=\"VMAT Exam\" width=\"45%\"\
  >\n</p>\n\n---\n## **Project Report**\n\n<a href=\"./assets/Virksomhedsprojekt_2023.pdf\" download>\n\
  \    <button>Get Project Report</button>\n</a>\n\n\n\n"

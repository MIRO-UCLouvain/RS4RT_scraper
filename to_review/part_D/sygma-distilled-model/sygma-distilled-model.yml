readme_excerpt: "# SyGMa Distilled Model\n\nA distilled machine learning model that uses SyGMa-generated\
  \ metabolites as features for toxicity prediction.\n\n## Concept\n\nInstead of training on molecular\
  \ descriptors alone, this approach:\n1. Generates metabolites for each compound using SyGMa\n2. Computes\
  \ molecular properties for each metabolite \n3. Creates an M×P tensor (M metabolites × P properties)\n\
  4. Trains a classifier (transformer/neural net) on these metabolite features\n5. Evaluates on hepatotoxicity/clinical\
  \ toxicity datasets\n\n## Pipeline\n\n```\nChemical SMILES → SyGMa → Metabolites → Properties → M×P\
  \ Tensor → Classifier → Toxicity\n```\n\n## Dependencies\n\n- sygma: Metabolite generation\n- rdkit:\
  \ Molecular property calculation\n- torch: Neural network training\n- pandas/numpy: Data handling\n\
  - scikit-learn: Evaluation metrics"

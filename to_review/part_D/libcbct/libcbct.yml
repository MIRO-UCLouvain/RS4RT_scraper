readme_excerpt: "# LibCBCT\n\n[![Build](https://github.com/tatsy/libcbct/actions/workflows/build.yaml/badge.svg)](https://github.com/tatsy/libcbct/actions/workflows/build.yaml)\n\
  [![License: CC BY-NC-SA 4.0](https://img.shields.io/badge/License-CC_BY--NC--SA_4.0-lightgrey.svg)](https://creativecommons.org/licenses/by-nc-sa/4.0/)\n\
  \n## Get started\n\n### Build\n\n```shell\ngit clone https://github.com/tatsy/libcbct.git --depth 1\
  \ --submodules\ncd libcbct\nmkdir build\ncd build\ncmake .. -DCMAKE_BUILD_TYPE=Release\nmake -j\n```\n\
  \n### Run\n\n```shell\n./cbct_exe -c /path/to/data/config.json\n```\n\n### File structure\n\n```text\n\
  /path/to/data/ +- config.json         # Configuration file\n               +- projections/        #\
  \ Folder containing projection images\n                 +- proj_0000.tif     # Projection image at angle\
  \ 0\n                 +- proj_0001.tif     # Projection image at angle 1\n                 +- ...\n\
  \               +- output/             # Folder to save reconstructed volume\n```\n\n### Example configuration\
  \ file (JSON format)\n\n```json\n{\n  \"SOD\": 99.19738,\n  \"SDD\": 449.75,\n  \"PixelSizeX\": 0.178,\n\
  \  \"PixelSizeY\": 0.178,\n  \"DetWidth\": 896,\n  \"DetHeight\": 896,\n  \"NumberOfProj\": 1000,\n\
  \  \"Clockwise\": true\n}\n```\n\n## License\n\n[CC BY-NC-SA 4.0](http://creativecommons.org/licenses/by-nc-sa/4.0/),\
  \ 2023-2025 (c) Tatsuya Yatagawa\n"

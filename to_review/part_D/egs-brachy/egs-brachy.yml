readme_excerpt: "## egs\\_brachy\n\negs\\_brachy is an egs++ application for rapid brachytherapy calculations\n\
  for both photon and electron sources. Some features of egs\\_brachy\ninclude:\n\n- Dose scoring via\
  \ a tracklength estimator or interaction scoring\n- Scoring of the spectrum of particles emitted from\
  \ a source or particle\n  fluence in a voxel\n- Primary and scatter separated dose calculations\n- Particle\
  \ recycling for simulations with multiple sources\n- Bremsstrahlung cross section enhancement, uniform\
  \ bremsstrahlung\n  splitting, and Russian Roulette for efficient electronic brachytherapy\n  simulations.\n\
  - A comprehensive library of brachytherapy source geometries ,\n\nFor a complete discussion of all egs\\\
  _brachy features as well as\ndiscussions about benchmarking and calculation efficiency, please refer\n\
  to the paper listed below under [Citing egs\\_brachy](#citing-egs_brachy).\n\nWhen using source or eye-plaque\
  \ models from the distributed geometry\nlibrary, please also cite the relevant CLRP database papers\
  \ listed under\n[CLRP database references](#clrp-database-references).\n\nThe initial release of egs\\\
  _brachy is version 2017.09.15 beta. We will continue\nto update and maintain egs\\_brachy, as well as\
  \ this manual and the HTML\ndocumentation (published via CI to GitHub Pages).\n\n\n## License\n\nThe\
  \ egs\\_brachy code (all pieces of code associated with the egs\\_brachy code\n    system) is copyrighted\
  \ Rowan Thomson, Dave Rogers, Randle Taylor, and Marc\nChamberland. egs\\_brachy is distributed as free\
  \ software according to the terms\nof the GNU Affero General Public License as published by the Free\
  \ Software\nFoundation, either version 3 of the License, or (at your option), any later\nversion (http://www.gnu.org/licenses/).\n\
  \n## Installation\n\negs\\_brachy requires the [CLRP fork of EGSnrc](https://github.com/clrp-code/EGSnrc_CLRP)\n\
  (`egs_brachy` branch), not the standard NRC distribution.\n\n**Recommended (release tarball):** download\
  \ `EGSnrc_CLRP-eb-setup-VERSION.tar.gz` from the\n[EGSnrc\\_CLRP releases](https://github.com/clrp-code/EGSnrc_CLRP/releases)\
  \ page, then:\n\n```bash\ntar -xzf EGSnrc_CLRP-eb-setup-VERSION.tar.gz\ncd EGSnrc_CLRP-eb-setup-VERSION\n\
  ./eb-setup.sh install --egs-home \"$HOME/egs_home/\"\ncd ~/EGSnrc_CLRP && source ./eb-env.sh\n```\n\n\
  `eb-setup.sh` downloads the full release, runs EGSnrc `configure`, syncs egs\\_brachy to\n`$EGS_HOME`,\
  \ and writes `eb-env.sh`. Use `./eb-setup.sh update` for later upgrades\n(`update --from-tarball PATH`\
  \ when offline). See `./eb-setup.sh help` for options.\n\n**Git checkout (developers):** clone `EGSnrc_CLRP`,\
  \ `git checkout egs_brachy`,\n`git submodule update --init --recursive` (egs\\_brachy is the submodule\
  \ at\n`HEN_HOUSE/user_codes/egs_brachy`), then `./HEN_HOUSE/scripts/configure` — or\n`./eb-setup.sh\
  \ install --git`.\n\n## Documentation\n\nTechnical documentation for egs\\_brachy is available in HTML\
  \ at\nhttps://clrp-code.github.io/egs_brachy/ .\n\nThat site is built automatically by GitHub Actions\
  \ from `_docs/` (and geometry\nlibrary content under `egs_brachy/lib/`). Pull requests run the docs\
  \ build as a\nCI check; pushes to `main` deploy to Pages. Generated HTML is not stored in git. Tracked\
  \ PDFs under `docs/pdf/` are copied into the\npublished site. For a local preview, from `egs_brachy/egs_brachy/`\
  \ run\n`make docs` and open `_site/index.html` at the repository root.\n\nThe user's guide (detailed\
  \ installation and usage) is available\n[here](https://clrp-code.github.io/egs_brachy/pdf/egs_brachy_user_manual.pdf).\n\
  \nA graphical user interface for egs\\_brachy, [eb\\_gui](https://github.com/clrp-code/eb_gui), is\n\
  available separately. eb\\_gui helps set up egs\\_brachy calculations and includes tools for DICOM\n\
  conversion and 3ddose analysis. Installation instructions and a user guide are in the\n[eb\\_gui repository](https://github.com/clrp-code/eb_gui).\n\
  \nHosted CLRP database papers (pdf):\n\n- [CLRP TG-43 low-energy source database (2020)](https://clrp-code.github.io/egs_brachy/pdf/clrp_tg43_le_2020.pdf)\n\
  - [CLRP TG-43 high-energy source database (2023)](https://clrp-"

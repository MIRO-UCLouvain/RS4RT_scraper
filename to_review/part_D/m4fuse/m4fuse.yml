readme_excerpt: "# About M4Fuse: *An ingenious design that is ultra-lightweight, highly accurate, and\
  \ robust*\n\nOur papers: \nPreprint Version: https://arxiv.org/pdf/2605.02444\n\n# Dataset\n\n*Get BraTS\
  \ 2019 and BraTS 2021 dataset [here](https://www.med.upenn.edu/cbica/brats2019/data.html) and [there](https://www.synapse.org/Synapse:syn25829067/wiki/610863)*\n\
  \n*For information on the data structure, access paths, and other details, please refer to the following:*\n\
  \n![image](https://github.com/tonxycs/M4Fuse/blob/main/Vis/dataset.png)\n\n\n# Models\n *e.g.Tiny-0.29M\
  \ and Spe. Seeing ~Network/M4Fuse.py*\n\nmodel = M4Fuse(\n    num_classes=4,\n    input_channels=4,\n\
  \    c_list = [16, 32, 48, 64, 96, 128], \n    modalities=1\n).to(config['device'])\n\n# Use\n 2.According\
  \ to Ours ->  bash ./Run_config.sh \n\n --running 2019 dataset, you can python T19.py and it is ok\n\
  \ \n --running 2021 dataset, you need to python T21.py combined with Eval.py (by the best weight /.pth)\n\
  \n 3.Seeing log -> tail -f ./log/train.log\n\n 4.Training method: 1. Train-Valid-Eval 2. 5-Fold CE.\n\
  \n# PIP\n\nmamba_ssm = 2.2.2\n\ntorch = 2.0.1+cu118\n\ntorchvision = 0.15.2+cu118\n\ntimm = 1.0.19\n\
  \nmonai = 1.3.0\n\nnibabel = 5.2.1\n\nscipy = 1.10.1\n\n## Cite M4Fuse\n\nIf you find this work useful\
  \ or interesting, please consider citing the following BibTeX entry.\n\n```\n@InProceedings{Zhou_2026_CVPR,\n\
  \    author    = {Zhou, Meihua and Tong, Xinyu and Yang, Li},\n    title     = {M{\\textasciicircum}4Fuse:\
  \ Lightweight State-Space MoE with a Cross-Scale Gating Bridge for Brain Tumor Segmentation},\n    booktitle\
  \ = {Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR) Findings},\n\
  \    month     = {June},\n    year      = {2026},\n    pages     = {5368-5377}\n}\n```\n\n***Notes:\
  \ For urgent citation, usage, or further assistance, please feel free to contact me [tonxycs@gmail.com]\
  \ without any hesitation. You are very welcome!***\n"

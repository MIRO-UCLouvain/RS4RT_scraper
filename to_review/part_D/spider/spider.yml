readme_excerpt: '# Spider: Radionuclide Therapy Patient Dosimetry


  Spider is a software pipeline for estimating patient radiation dose

  from radionuclide therapy based on multiple time-point imaging.


  Note this project is a work in progress.


  ## Building Spider


  See [doc/build.md](doc/build.md) for build and installation

  instructions.


  ## Benchmarks


  Spider''s performance is evaluated by applying it to publicly available

  datasets.

  These benchmarks are evaluated weekly using the tip of this

  repository.

  The latest results are published at

  https://sami-medical-physics.github.io/spider/.


  See [doc/benchmark.md](doc/benchmark.md) for instructions on running

  the benchmarks locally.


  ## License



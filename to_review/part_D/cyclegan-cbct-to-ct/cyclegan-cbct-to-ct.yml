readme_excerpt: "# CycleGAN-CBCT-to-CT\nConvert CBCT images to CT like images.\n\nThis is 2D CycleGAN\
  \ model.\n\nBefore training, resampling your CBCT's and CT's voxel spacing to the same voxel spacing.\
  \ For our project, we resampled CT's voxel spacing to CBCT's voxel spacing, which is 0.51mm*0.51mm*1.99mm\
  \ and then corpped to 512*512 dimensions. \n\nInput image size is 512*512 for both CBCT and CT images,\
  \ and input image/data is in HU unit. Data normalization is done in train_cyclegan_patchD.py.\n\nmodels_cyclegan_patchD.py\
  \ includes CycleGAN model.\n\ntrain_cyclegan_patchD.py includes training.\n\ndeploy_cyclegan_patchD.py\
  \ includes testing\n\nconfig_cyclegan_patchD includes config parameters.\n\nRelated paper: Generating\
  \ synthesized computed tomography (CT) from cone-beam computed tomography (CBCT) using CycleGAN for\
  \ adaptive radiation therapy. DOI: 10.1088/1361-6560/ab22f9. PMB\n\nLink: https://www.ncbi.nlm.nih.gov/pubmed/31108465\n\
  \nContact: xiao.liang@UTSouthwestern.edu\n"

readme_excerpt: '# X-ray Cone Beam Computed Tomography


  ## THIS REPOSITORY IS ARCHIVED


  X-ray Cone-beam Computed tomography (CBCT) is a technique for imaging cross-sections of an object using
  a series of X-ray measurements taken from

  different angles around the object. CBCT uses a cone shaped X-ray beam.

  The projection data acquired at the 2D detector array, which is then reconstructed into a 3D image volume
  using the FDK reconstruction

  algorithm.


  This repository contains computer program to simulate CBCT.




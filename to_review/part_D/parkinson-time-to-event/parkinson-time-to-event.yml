readme_excerpt: "# Radiomics + Clinical Survival Analysis\n\nThis notebook predicts **time-to-event**\
  \ using three feature sets, compared side by side:\n- **Radiomics only**\n- **Clinical only**\n- **Radiomics\
  \ + Clinical combined**\n\nFor each feature set, four survival models are trained and evaluated:\n-\
  \ **Random Survival Forest (RSF)**\n- **Gradient Boosting Survival Analysis (GBSA)**\n- **Survival Support\
  \ Vector Machine (Survival SVM)**\n- **Penalized Cox Model** (elastic-net regularized Cox regression,\
  \ `CoxnetSurvivalAnalysis`)\n\nEvaluation uses **stratified 5-fold cross-validation on a training set**\
  \ plus a single\n**held-out test set** (same patients held out for every feature set, for a fair\ncomparison),\
  \ with the **concordance index (C-index)** and **log-rank test** as metrics.\nA summary CSV comparing\
  \ all feature-set/model combinations is saved at the end.\n\n**Expected inputs**\n\n1. `radiomics_features.csv`\
  \ — one row per scan (first PET scan of each patient):\n   `image_id, feature_1, feature_2, ..., feature_n`\n\
  \n2. `clinical_events.csv` — one row per patient (time-to-event labels):\n   `image_id, patient_id,\
  \ time, event`\n   - `time`: time to event or censoring (ideally > 0; non-positive values are auto-corrected)\n\
  \   - `event`: 1 = event occurred, 0 = censored\n\n3. `clinical_data.csv` — one row per patient (clinical\
  \ variables used as predictors), e.g.:\n   `patient_id, age, sex, stage, smoking_status, ...`\n   -\
  \ Can contain a mix of numeric (age, lab values) and categorical (sex, stage) columns —\n     both are\
  \ handled automatically (see Section 5).\n\nEdit the file paths and column names in the **Config** cell\
  \ below, then run all cells.\n"

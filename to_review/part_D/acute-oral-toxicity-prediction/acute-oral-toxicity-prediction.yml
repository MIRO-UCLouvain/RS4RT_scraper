readme_excerpt: "# Acute Oral Toxicity Prediction\n\nA Streamlit-based web application for predicting\
  \ **acute oral toxicity** of chemical compounds from **SMILES strings**.\n\n## Laboratory\n**Laboratory\
  \ of Pharmacology and Toxicology**  \n**College of Veterinary Medicine**  \n**Gyeongsang National University,\
  \ Jinju 52828, Republic of Korea**\n\n## Contact Information\n**Kim Euikyung (김의경)**  \nProfessor  \n\
  Phone: 055-772-2355  \nEmail: ekim@gnu.ac.kr  \nOffice: 501-308  \n\n## Features\n- Draw molecule using\
  \ an interactive molecular editor\n- Predict acute oral toxicity from SMILES\n- Display toxicity probability\n\
  - Batch prediction from CSV\n- Chemical structure visualization\n\n## Files\nThe application uses:\n\
  - `toxicity_streamlit_app.py`\n- `Stack_Top5.joblib`\n- `final_selected_features.joblib`\n- `median_imputer.joblib`\n\
  \n\n## Installation\nInstall dependencies:\n\n```bash\npip install -r requirements.txt"

readme_excerpt: "\n\n<div align=\"center\">\n\n# Hybrid Spatio-Temporal Transformer Network for Predicting\
  \ Ischemic Stroke Lesion Outcomes from 4D CT Perfusion Imaging\n  \n</div>\n\nKeras implementation of\
  \ our method for MICCAI2022 paper: \"[Hybrid Spatio-Temporal Transformer Network for Predicting Ischemic\
  \ Stroke Lesion Outcomes from 4D CT Perfusion Imaging](https://link.springer.com/chapter/10.1007/978-3-031-16437-8_62)\"\
  .\n\n## Abstract\nPredicting the follow-up infarct lesion from baseline spatio-temporal (4D) Computed\
  \ Tomography Perfusion (CTP) imaging is essential for the diagnosis and management of acute ischemic\
  \ stroke (AIS) patients. However, due to their noisy appearance and high dimensionality, it has been\
  \ technically challenging to directly use 4D CTP images for this task. Thus, CTP datasets are usually\
  \ post-processed to generate parameter maps that describe the perfusion situation. Existing deep learning-based\
  \ methods mainly utilize these maps to make lesion outcome predictions, which may only provide a limited\
  \ understanding of the spatio-temporal details available in the raw 4D CTP. While a few efforts have\
  \ been made to incorporate raw 4D CTP data, a more effective spatio-temporal integration strategy is\
  \ still needed. Inspired by the success of Transformer models in medical image analysis, this paper\
  \ presents a novel hybrid CNN-Transformer framework that directly maps 4D CTP datasets to stroke lesion\
  \ outcome predictions. This hybrid prediction strategy enables an efficient modeling of spatio-temporal\
  \ information, eliminating the need for post-processing steps and hence increasing the robustness of\
  \ the method. Experiments on a multicenter CTP dataset of 45 AIS patients demonstrate the superiority\
  \ of the proposed method over the state-of-the-art.\n\n<p align=\"center\">\n<img src=\"https://github.com/kimberly-amador/Spatiotemporal-CNN-Transformer/blob/main/figures/architecture.png\"\
  \ width=\"750\">\n</p>\n\n\n## Usage\n\n#### Installation\n\nRecommended environment:\n\n- Python 3.8.1\n\
  - TensorFlow GPU 2.4.1\n- CUDA 11.0.2 \n- cuDNN 8.0.4.30\n\nTo install the dependencies, run:\n\n```shell\n\
  $ git clone https://github.com/kimberly-amador/Spatiotemporal-CNN-Transformer\n$ cd Spatiotemporal-CNN-Transformer\n\
  $ pip install -r requirements.txt\n```\n\n#### Data Preparation\n1. Preprocess the data. The default\
  \ model takes images of size 384 x 256.\n2. Save the preprocessed images and its corresponding labels\
  \ as numpy arrays into a single file in 'patientID_preprocessed.npz' format. \n3. Create a patient dictionary.\
  \ This should be a pickle file containing a dict as follows, where s is the slice number:\n\n```python\n\
  partition = {\n    'train': {\n        's_patientID',\n        's_patientID',\n        ...\n    },\n\
  \    'val': {\n        's_patientID',\n        's_patientID',\n        ...\n    }\n    'test': {\n \
  \       's_patientID',\n        's_patientID',\n        ...\n    }\n}\n```\n\n#### Train Model\n\n1.\
  \ Modify the model configuration. The default configuration parameters are in `./model/config_file.py`.\n\
  2. Run `python main.py` to train the model.\n\n## Citation\nIf you find this code and paper useful for\
  \ your research, please cite the [paper](https://link.springer.com/chapter/10.1007/978-3-031-16437-8_62):\n\
  \n```\nK. Amador, A. Winder, J. Fiehler, M. Wilms, N.D. Forkert. (2022) Hybrid spatio-temporal Transformer\
  \ network for predicting ischemic stroke lesion outcomes from 4D CT perfusion imaging. In: Proceedings\
  \ of MICCAI 2022. pp. 644–654.\n```\n\n## Acknowledgement\nPart of the code is adapted from open-source\
  \ codebase:\n* Transformer: https://github.com/keras-team/keras-io/blob/master/examples/vision/video_transformers.py\n\
  * Dice Loss: https://github.com/voxelmorph/voxelmorph/blob/legacy/ext/neuron/neuron/metrics.py\n"

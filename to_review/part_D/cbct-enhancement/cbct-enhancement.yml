readme_excerpt: "# cbct_enhancement\n\nhttps://docs.nvidia.com/deeplearning/frameworks/pytorch-release-notes/rel_20-12.html#rel_20-12\n\
  \n## Operating Mannual\n\nnotebooks for training and inferencing are two dependent file \n\n1. `Inference_xxxx.ipynb`\
  \ map to `xxxx.ipynb`\n2. Download the repository with the target experimental identity (ID)\n3. The\
  \ experimental identity (ID) is recorded with commit\n4. The experimental identity (ID) is auto-generated\
  \ by weight-and-bias with the form of `xxx-yyy-number`\n5. The changes of the training settings are\
  \ recorded in the commit (training notebook), except for the settings of the original code\n6. If the\
  \ file is not committed with the experimental id, it can be found in file content\n7. self-implemented\
  \ codes and the different version of REGAN, their experimental ID are recorded at: [exp_map](https://docs.google.com/spreadsheets/d/1_4hkW0qgLdyc0CVnbFz_kTCykXAT-IkXxVix7hCwnRM/edit?usp=sharing)\n\
  \n### REGAN (ours)\n1. `GAN.ipynb`: `Inference.ipynb`\n2. `GAN.ipynb` with commit `polar-bee-473` is\
  \ for training; `Inferencing.ipynb` with commit `polar-bee-473` is for inferencing\n\n\n### RegGAN\n\
  Github: [Breaking the Dilemma of Medical Image-to-image Translation](https://github.com/Kid-Liet/Reg-GAN)\n\
  1. `RegGAN.ipynb`: `Inference_RegGAN.ipynb`\n2. `RegGAN.ipynb` with commit `twilight-night-23` is for\
  \ training; `Inference_RegGAN.ipynb` with commit `twilight-night-23` is for inferencing\n\n### Unit\n\
  \ - Unsupervised Image-to-Image Translation Networks\n - code was implemented by RegGAN\n \n1. `Unit.ipynb`:\
  \ `Inference_Unit.ipynb`\n2. `Unit.ipynb` with commit `usual-paper-7` is for training; `Inference_Unit.ipynb`\
  \ with commit `usual-paper-7` is for inferencing\n\n\n### Munit\n- Multimodal Unsupervised Image-to-Image\
  \ Translation\n- code was implemented by RegGAN\n\n1. `MUnit.ipynb`: `Inference_MUnit.ipynb`\n2. `MUnit.ipynb`\
  \ with commit `polar-gorge-6` is for training; `Inference_MUnit.ipynb` with commit `polar-gorge-6` is\
  \ for inferencing\n\n\n### CycleGAN\n\n#### self-implemented\n1. `CycleGAN.ipynb`: `Inference.ipynb`\n\
  2. The last ID of self-implemented version is `swept-lake-468` (check the commit history of `CycleGAN.ipynb`)\n\
  3. `CycleGAN.ipynb` with commit `swept-lake-468` is for training; `Inference.ipynb` with commit `swept-lake-468`\
  \ is for inferencing\n\n#### original\n1. `CycleGAN.ipynb`: `Inference_CycleGAN.ipynb`\n2. `CycleGAN.ipynb`\
  \ with commit `worthy-plasma-26` is for training; `Inference_CycleGAN.ipynb` with commit `worthy-plasma-26`\
  \ is for inferencing\n\n\n### GAN\n\n#### self-implemented\n1. `GAN.ipynb`: `Inference.ipynb`\n2. check\
  \ [exp_map](https://docs.google.com/spreadsheets/d/1_4hkW0qgLdyc0CVnbFz_kTCykXAT-IkXxVix7hCwnRM/edit?usp=sharing),\
  \ `rural-pine-436` is the one\n3. `GAN.ipynb` with commit `rural-pine-436` is for training; `Inference.ipynb`\
  \ with commit `rural-pine-436` is for inferencing\n\n#### original\n1. `GAN_origin.ipynb` or `oGAN.ipynb`:\
  \ `Inference_oGAN.ipynb` or `Inference_oGan.ipynb`\n2. The right mapping can be sure by checking the\
  \ file commit history\n\n### CycleDeblurGAN\n- paper: [Cone-beam CT image quality improvement using\
  \ Cycle-Deblur consistent adversarial networks (Cycle-Deblur GAN) for chest CT imaging in breast cancer\
  \ patients](https://www.nature.com/articles/s41598-020-80803-2)\n1. this is a executable notebook\n\
  2. Its inference notebook is just a modified version of `Inference_CycleGAN.ipynb`\n\n### Others\n\n\
  almost useless...\n\n- `unet.ipynb`: `Inference.ipynb`(check the ID with commit history)\n- `autoencoder.ipynb`:\
  \ `Inference.ipynb`(check the ID with commit history)\n\n## Folder\n\nkornia/\n- this is the folder\
  \ with sobel edge operator\n\ncodes/\n- dataset, augmentation, etc.\n"

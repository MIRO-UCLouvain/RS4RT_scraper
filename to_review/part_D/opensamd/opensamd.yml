readme_excerpt: "# OpenSaMD\n\nCreate an open source Software as a Medical Device platform that equips\n\
  entrepreneurs, intrapreneurs, and researchers to take what they are building,\nget it reviewed, tested,\
  \ validated, regulated, and deployed for clinical use in\nhospitals all around the world.\n\nBy having\
  \ all of the platform, and all of the products be open source we can\nall learn off of each other, stop\
  \ reinventing the wheel, and focus on spending\nmore time taking our amazing innovations from our bench-top\
  \ to the patient\nbedside.\n\n## Funding\n\nOpenSaMD is a bootstrapped business that is entirely funded\
  \ by the initial\nfounders, government grants, and the revenue generated from selling the\n\"for-clinical-use\"\
  \ versions of each of the products within the OpenSaMD\nplatform.\n\n## Utilisation requirements\n\n\
  ### Modifications\n\nThe OpenSaMD platform is distributed under the AGPL-3.0 license which requires\n\
  all modifications built on top of the platform or any of its products to also\nbe released under the\
  \ same open source license.\n\nIn practice, this means, if you want to build on top of the OpenSaMD\
  \ platform\nyou need to also distribute your resulting products under the AGPL-3.0 license.\n\n### Clinical\
  \ use\n\nIf you would like to use the OpenSaMD platform or any of its contained products\nfor clinical\
  \ use you are required to purchase the regulated release. If you are\ninterested in purchasing the regulated\
  \ release of an OpenSaMD product reach out\nto [info@opensamd.com](mailto:info@opensamd.com).\n\nThe\
  \ source code that is downloadable from GitHub or any release artifact that is not\nbuilt and distributed\
  \ by OpenSaMD is explicitly **not** intended for clinical use.\n\n## Installation\n\nWatch this space.\n\
  \n## Open Source Platform Contributors\n\n- [Simon Biggs](https://github.com/SimonBiggs)\n  - [Radiotherapy\
  \ AI](https://radiotherapy.ai/), Australia\n- [Stuart Swerdloff](https://github.com/sjswerdloff)\n \
  \ - [ELEKTA Pty Ltd](https://www.elekta.com/), New Zealand\n\n![RAi](https://github.com/pymedphys/pymedphys/raw/286deacdea2b3af9322796d413d0da6e1d8935a9/logos/rai.png)\
  \ ![Swerdloff Family](https://github.com/pymedphys/pymedphys/raw/7e9204656e0468b0843533472553a03a99387386/logos/swerdloff.png)\n"

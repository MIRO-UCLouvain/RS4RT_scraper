readme_excerpt: "# Stage 1 — Liver Localization (3D U-Net)\n\nBu paket, Volumetric Liver Tumor Segmentation\
  \ projesinin **Week 2 — Stage 1 (Liver Localization)** kısmıdır. Week 1 preprocessing pipeline'ınızdan\
  \ çıkan processed NIfTI dosyaları üzerinde çalışır.\n\n## Klasör Yapısı\n\n```\nliver_project/\n├──\
  \ requirements.txt\n├── kaggle_stage1.ipynb          # Kaggle starter notebook\n├── README.md      \
  \              # Bu dosya\n└── src/\n    ├── cv_split.py              # 5-fold patient-level split\n\
  \    ├── dataset.py               # Patch-based 3D dataset (FG-biased sampling)\n    ├── losses.py \
  \               # Dice+BCE / Dice+CE hybrid\n    ├── metrics.py               # DSC, IoU accumulator\n\
  \    ├── inference.py             # Sliding-window full-volume inference\n    ├── train_stage1.py  \
  \        # Training loop (AMP + checkpoint)\n    └── models/\n        └── unet3d.py            # Custom\
  \ 3D U-Net (InstanceNorm+LeakyReLU)\n```\n\n## Önemli Tasarım Kararları\n\n| Karar | Sebep |\n|---|---|\n\
  | 96×96×96 patch | P100 16 GB'da batch=2 ile rahat sığar; 64³'ten daha geniş bağlam |\n| Foreground-biased\
  \ sampling (%66) | Tumor %0.01, random patch %99 boş çıkar |\n| InstanceNorm + LeakyReLU(0.01) | BatchNorm\
  \ batch=1-2'de patlar; LeakyReLU dying ReLU'yu önler |\n| Dice + BCE/CE hybrid loss | Pure Dice küçük\
  \ FG'de unstable, pure CE arka planda boğulur |\n| Patient-level 5-fold | Slice-level split = data leakage\
  \ |\n| Sliding-window inference (gaussian blend) | Tüm volume eğitim sırasında değil val'de kullanılır,\
  \ kenar artifact yok |\n| AMP (FP16) | VRAM yarı yarıya azalır, P100'de hız ~1.6x |\n| Her epoch checkpoint\
  \ | Kaggle 12h timeout'una karşı sigorta |\n\n## Lokalde Hızlı Test\n\n```bash\npip install -r requirements.txt\n\
  \n# Önce: Week 1 preprocessing'iniz tamamlanmış olmalı\n# liver_<id>_processed.nii.gz ve liver_<id>_label_processed.nii.gz\
  \ dosyaları olmalı\n\n# 1) 5-fold split oluştur\npython -m src.cv_split --processed_dir /path/to/processed\
  \ --out folds.json\n\n# 2) Stage 1 training, fold 0\npython -m src.train_stage1 \\\n    --processed_dir\
  \ /path/to/processed \\\n    --folds_json folds.json \\\n    --fold 0 \\\n    --out_dir runs/stage1_fold0\
  \ \\\n    --epochs 40 \\\n    --batch_size 2\n```\n\nCPU'da çalışır ama çok yavaş — GPU şart.\n\n##\
  \ Kaggle Workflow\n\n1. **Kaggle hesabı aç**, \"Phone verify\" yap (GPU için zorunlu)\n2. **Notebook\
  \ oluştur** → sağ panelde:\n   - Accelerator: **GPU P100**\n   - Internet: **On** (paket için, sonra\
  \ kapatabilirsiniz)\n   - Persistence: Files only\n3. **Sağ panelden veri ekle**:\n   - \"+ Add Data\"\
  \ → \"MSD Task03 Liver\" ara, ekle\n   - (kodu Kaggle Dataset olarak yüklediyseniz onu da ekle)\n4.\
  \ **kaggle_stage1.ipynb** dosyasının içeriğini yapıştır\n5. Hücreleri sırayla çalıştır\n6. Önemli: training\
  \ sırasında \"Save Version → Save & Run All\" deyip pencereyi kapatabilirsiniz; Kaggle arka planda 12\
  \ saate kadar çalıştırır.\n\n## Beklenen Sonuçlar (Stage 1, Fold 0)\n\n| Epoch | Val DSC (liver) |\n\
  |---|---|\n| 5 | ~0.85 |\n| 15 | ~0.92 |\n| 30 | ~0.95 |\n| 40 (best) | ~0.95-0.96 |\n\n40 epoch P100'de\
  \ ~8-10 saat. Hedef: liver DSC ≥ 0.94.\n\n## Sıradakiler\n\n- [ ] Stage 1'i en az 1 fold çalıştır, DSC\
  \ ≥ 0.93 olduğunu doğrula\n- [ ] **Stage 2 dataset modunu aç**: `LiverPatchDataset(stage='stage2', ...)`\
  \ — kod hazır\n- [ ] **train_stage2.py yaz** — train_stage1.py'nin neredeyse aynısı, sadece:\n  - `out_channels=3`,\
  \ `DiceCELoss(n_classes=3, include_background_in_dice=False)`\n  - Stage 1 modelinin tahminini girdiye\
  \ eklemek (cascade input) — opsiyonel, basit cascade için sadece liver bbox crop yeter\n- [ ] **Post-processing**:\
  \ `scipy.ndimage.label` ile CCA, küçük tumor component'leri filtrele\n- [ ] **Final evaluation script**:\
  \ 5 fold'un ortalaması + std\n\n## GitHub Workflow Hızlı Hatırlatma\n\n```bash\n# Lokal değişiklik sonrası:\n\
  git add .\ngit commit -m \"anlamli bir mesaj\"\ngit push\n\n# Kaggle notebook başında:\n!cd /kaggle/working/code\
  \ && git pull\n```\n\n**ASLA commit etmeyin**: `*.nii.gz`, `*.pt`, `processed/`, `runs/`, `outputs/`.\
  \ `.gitignore` bunları engellemeli.\n\n## Bilinen Tuzaklar\n\n- **`scipy.ndimage.zoom` mask interpolation**:\
  \ nearest-neighbor (order=0) şart, yoksa label {0,1,2}'yi bozar (Week 1'de zaten doğru yapılmış)\n-\
  \ **Patient ID parsing**: `liver_<id>_processed.nii.gz` formatına bağlı. Sizin output'unuz farklı isimleniyorsa\
  \ `cv_split.py` ve `dataset.py` içindeki regex'i değiştirin\n- **Kaggle internet**: training sırasında\
  \ kapatın, deterministik olur ve session crash riski azalır\n- **Patch RAM**: `cache_volumes=True` yapmayın\
  \ — 40 GB > 13 GB Kaggle RAM\n"

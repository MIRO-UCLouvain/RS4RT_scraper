readme_excerpt: "# 肝脏与肝肿瘤 3D 分割科研项目 (MONAI / PyTorch)\n\n> ⚠️ **免责声明（重要）**\n>\n> 本项目**仅用于科研学习与展示**，演示医学影像\
  \ AI 分割任务的完整流程。\n> 本项目**不用于临床诊断、治疗或任何医疗决策**，其输出结果**不可**作为任何医学判断的依据。\n> 本项目**不使用任何真实患者隐私数据**；所用数据为公开的\
  \ Medical Segmentation Decathlon (MSD) Task03_Liver 数据集，已脱敏。\n> 使用者应遵守数据集原始许可协议，并对自己的使用行为负责。\n\n---\n\
  \n## 1. 项目简介\n\n本项目基于 **Medical Segmentation Decathlon (MSD) Task03_Liver** 公开数据集，使用 **MONAI + PyTorch**\
  \ 框架构建 **3D U-Net** 模型，完成腹部 CT 中**肝脏与肝肿瘤的 3D 体积分割 (volumetric segmentation)**。\n\n项目采用**两阶段 (two-stage)\
  \ 策略**：\n\n- **阶段一 (phase1, 二分类)**：将背景与肝脏（含肿瘤区域）区分开来；\n- **阶段二 (phase2, 三分类)**：在肝脏区域内进一步区分背景 / 肝脏实质\
  \ / 肝肿瘤。\n\n项目提供从环境自检、数据检查、数据划分、训练、推理、评价、可视化到 STL 三维模型导出的**全流程脚本**，并附带中文注释，便于阅读理解。\n\n### 1.1 两种使用模式\n\
  \n本项目同时提供**命令行模式**与 **GUI 桌面模式**，二者共用同一套 `src/*.py` 核心脚本，可按需选择：\n\n| 模式 | 适合人群 | 入口 | 优点 |\n| --- |\
  \ --- | --- | --- |\n| **命令行模式** | 有 Python 基础、习惯终端的同学 | `src/*.py` 脚本（见 §7B） | 灵活、可批量、便于在服务器/远程跑长任务\
  \ |\n| **GUI 桌面模式** | 希望可视化操作的使用者 | `python gui/app.py`（见 §6B） | 可视化参数面板、实时日志、一键打开结果 |\n\n> 两种模式下训练得到的模型、推理结果、评估指标完全一致；GUI\
  \ 不重写任何训练逻辑，\n> 仅通过子进程调用 `src/*.py`。下文 §6B 介绍 GUI 模式，§7B 介绍命令行模式。\n\n---\n\n## 2. 项目特点\n\n- \U0001F3AF\
  \ **两阶段分割策略**：先粗后细，降低小目标（肿瘤)分割难度；\n- \U0001F9E0 **3D U-Net**：医学影像体积分割的经典网络；\n- \U0001F6E0️ **全流程脚本**：环境检查\
  \ / 数据检查 / 划分 / 训练 / 推理 / 评价 / 可视化 / STL 导出；\n- \U0001F1E8\U0001F1F3 **中文注释**：源代码与配置文件均带有详细中文说明；\n-\
  \ ✅ **自检脚本 (smoke test)**：可在 CPU 上小规模跑通流程，验证环境；\n- \U0001F4CA **标准指标**：Dice / IoU / Precision / Recall，分别统计\
  \ liver 与 tumor；\n- \U0001F9E9 **notebooks 教程**：提供数据探索与中文分步教程 Notebook。\n\n---\n\n## 3. 环境要求\n\n| 组件\
  \ | 要求 |\n| --- | --- |\n| 操作系统 | Windows 10 / 11（亦兼容 Linux） |\n| Python | 3.10 |\n| PyTorch | 需与本地\
  \ CUDA 版本匹配（建议 CUDA 11.8 / 12.1） |\n| GPU | 推荐 NVIDIA GPU（显存 ≥ 8GB）；亦可在 CPU 上跑 smoke test |\n| MONAI\
  \ | 最新稳定版 |\n| 其它 | numpy, nibabel, SimpleITK, pyyaml, tqdm, matplotlib, trimesh 等 |\n\n> 训练完整模型强烈建议使用\
  \ GPU；CPU 仅用于环境验证与小规模 smoke test。\n\n---\n\n## 4. 数据集获取\n\n本项目使用 **Medical Segmentation Decathlon Task03_Liver**\
  \ 数据集。\n\n- 官方网站：http://medicaldecathlon.com/\n- 下载并解压后，将数据放到项目的 `data/Task03_Liver` 目录下。\n\n解压后目录结构应如下：\n\
  \n```\ndata/Task03_Liver/\n├── imagesTr/      # 训练用 CT 图像 (*.nii.gz)\n├── labelsTr/      # 训练用标注 (*.nii.gz，标签:\
  \ 0=背景, 1=肝脏, 2=肿瘤)\n├── imagesTs/      # 测试用 CT 图像 (*.nii.gz)\n└── labelsTs/      # 测试用标注 (如有)\n```\n\
  \n> ⚠️ 请遵守 MSD 数据集许可，仅用于科研用途。\n\n---\n\n## 5. 安装\n\n> \U0001F4CC **重要：PyTorch 的 CUDA 安装命令不要照搬本项目给的内容**\n\
  > PyTorch 必须与你本机的 **CUDA / 驱动版本** 匹配，否则 `torch.cuda.is_available()` 会返回 `False`。\n> 请务必前往 [PyTorch 官网\
  \ Get Started](https://pytorch.org/get-started/locally/)，按照页面上的选择器勾选你的操作系统、包管理器、语言、CUDA 版本，复制官方给出的命令安装。\n\
  > `requirements.txt` / `environment.yml` 中**故意不写死** PyTorch 的 CUDA 索引源，正是为了让你自己选择合适的 CUDA 版本。\n\n###\
  \ 方式 A：pip（轻量）\n\n```bash\n# 5.1 克隆/进入项目目录\ncd d:\\项目1\n\n# 5.2 创建虚拟环境（推荐）\npython -m venv .venv\n.venv\\\
  Scripts\\activate            # Windows；Linux 用 source .venv/bin/activate\n\n# 5.3 安装 PyTorch：务必按官网对应\
  \ CUDA 选择，例如 CUDA 11.8：\npip install torch torchvision --index-url https://download.pytorch.org/whl/cu118\n\
  \n# 5.4 安装其余依赖\npip install -r requirements.txt\n```\n\n### 方式 B：conda（推荐，参见 `environment.yml`，已固定 python=3.10）\n\
  \n```bash\ncd d:\\项目1\nconda env create -f environment.yml      # 自动创建名为 liver-seg、python=3.10 的环境\n\
  conda activate liver-seg\n# 仍需按官网补装对应 CUDA 版本的 PyTorch：\npip install torch torchvision --index-url https://download.pytorch.org/whl/cu118\n\
  ```\n\n### 环境自检：`test_env.py`\n\n安装完后，用根目录的 `test_env.py` 检查 torch / monai / nibabel 是否能正常导入、CUDA 是否可用：\n\
  \n```bash\npython test_env.py            # 任一依赖导入失败也优雅报告\npython test_env.py --strict   # 严格模式：任一失败即以非\
  \ 0 退出码结束（可用于 CI）\n```\n\n---\n\n## 6. 目录结构\n\n```\n项目1/\n├── configs/                       # 配置文件\n\
  │   ├── liver_unet_3d.yaml         # 【推荐】统一三分类 3D U-Net 训练/推理配置\n│   ├── phase1_binary.yaml        \
  \  # （旧版阶段一）二分类 (背景 vs 肝脏) 配置\n│   └── phase2_ternary.yaml         # （旧版阶段二）三分类 (背景/肝脏/肿瘤) 配置\n├── src/\
  \                           # 核心源码与新版自包含脚本\n│   ├── __init__.py\n│   ├── data.py                   \
  \ # （模块化版）数据加载与预处理\n│   ├── models.py                  # （模块化版）3D U-Net 等模型定义\n│   ├── trainer.py  \
  \               # （模块化版）训练循环 / 验证 / checkpoint\n│   ├── utils.py                   # 通用工具函数 (指标、可视化辅助等)\n\
  │   ├── inspect_dataset.py         # 【推荐】数据集分布检查、CSV 汇总、三方向切片图\n│   ├── create_splits.py           #\
  \ 【推荐】train/val/test 划分 (70/15/15, seed=42)\n│   ├── train.py                   # 【推荐】自包含训练脚本 (统一三分类,\
  \ DiceCELoss, AdamW, TensorBoard, resume, OOM 提示)\n│   ├── infer.py                   # 【推荐】自包含推理脚本\
  \ (Invertd 恢复原空间, 保留 affine)\n│   ├── evaluate.py                # 【推荐】Dice/IoU/Precision/Recall (liver/tumor\
  \ 分开, CSV)\n│   ├── visualize.py               # 【推荐】CT / GT / 预测 切片叠加可视化 (tumor 优先)\n│   └── export_stl.py\
  \              # 【推荐】mask → STL 三维模型（仅供科研/展示）\n├── scripts/                       # （旧版）模块化脚本，调用 src/{data,models,trainer,utils}\n\
  │   ├── check_env.py / check_data.py / split_data.py / train.py\n│   ├── infer.py / evaluate.py / visualize.py\
  \ / export_stl.py / smoke_test.py\n│   └── run_nnunet_baseline.sh     # 【baseline】nnU-Net v2 一键流程（独立环境，不覆盖\
  \ MONAI 代码）\n├── gui/                           # 【桌面前端】PySide6 GUI：调用 src/*.py，不重写训练逻辑\n│   ├── app.py\
  \                     # GUI 入口：python gui/app.py\n│   ├── main_window.py             # 主窗口（左侧导航 + 右侧\
  \ 8 页面 + 日志）\n│   ├── workers.py                 # QThread 后台任务（subprocess 调用 src/*.py）\n│   └── widgets.py\
  \                 # 8 个页面控件（环境/数据/训练/推理/评估/可视化/STL/日志）\n├── notebooks/                     # Jupyter\
  \ 教程\n│   ├── exploration.ipynb          # 数据探索\n│   └── tutorial_zh.ipynb          # 中文分步教程\n├── outputs/\
  \                       # 输出目录 (自动生成)\n│   ├── models/                    # best_model.pth / last_model.pth\
  \ / checkpoint_meta.json / events.out.tfevents.*\n│   ├── dataset_summary.csv        # inspect_dataset.py\
  \ 输出的病例分布汇总\n│   ├── evaluation.csv             # evaluate.py 输出的逐例指标 + MEAN/STD\n│   ├── predictions/\
  \               # 推理结果 .nii.gz\n│   ├── figures/                   # 可视化图像 PNG\n│   └── stl/       \
  \                # STL 三维模型\n├── data/                          # 数据存放目录 (用户自行下载)\n│   ├── raw/Task03_Liver/{imagesTr,labelsTr,dataset.json}\n\
  │   └── splits/{train,val,test}.json\n├── requirements.txt               # 依赖列表 (torch 不写死 CUDA)\n├──\
  \ environment.yml                # conda 环境 (liver-seg, python=3.10)\n├── test_env.py              \
  \       # 环境自检 (torch/monai/nibabel + CUDA)\n├── .gitignore\n├── README.md                      # 本说明文档\n\
  └── REPORT_TEMPLATE.md             # 项目报告模板\n```\n\n> \U0001F4DD **两套脚本说明**：项目同时存在两套实现。\n> - **`src/*.py`（推荐，统一三分类）**：自包含、参数与\
  \ `configs/liver_unet_3d.yaml` 对应，符合 MSD Task03_Liver 标签 `0/1/2` 的统一 3 类分割。\n> - **`scripts/*.py`（旧版，两阶段）**：依赖\
  \ `src/{data,models,trainer,utils}` 模块，配合 `configs/phase1_*.yaml`、`configs/phase2_*.yaml` 用于学习实践。\n\
  > 本轮新增/重写以 `src/*.py` 为准；旧版 `scripts/*.py` 与 `phase1/phase2` 配置保留不动。\n\n---\n\n## 6B. 桌面前端 GUI（Liver\
  \ Tumor Segmentation Toolkit）\n\n> \U0001F4CC PySide6 桌面界面，适合可视化操作。**不重写任何训练逻辑**，所有耗时任务通过\n> QThread\
  \ 后台调用 `src/*.py` 完成；命令日志实时显示在 `Logs` 页。\n\n### 6B.1 安装 PySide6\n\n```bash\npip install PySide6    \
  \        # 已包含在 requirements.txt / environment.yml\n```\n\n### 6B.2 启动\n\n```bash\npython gui/app.py\n\
  ```\n\n### 6B.3 界面布局\n\n左侧导航 + 右侧功能页：\n\n1. **Environment 环境部署**：①一键检查环境（后台 `EnvProbeThread` 实时探测），检测区显示\
  \ Python version / Python 路径 / pip 是否可用 / torch version / CUDA available / GPU name / MONAI version\
  \ / nibabel version 共 8 项；②一键安装依赖（点「一键安装依赖」会先弹窗提醒\"建议先创建 conda 环境 medseg，是否继续？\"，确认后执行 `python -m pip\
  \ install -r requirements.txt`，日志页实时显示进度）；③**不会自动安装 CUDA 版 PyTorch** —— 若检测到 torch 未安装，会弹窗提示\"PyTorch\
  \ 建议根据你的 CUDA 版本从官网选择安装命令\"，并在页面下方提供输入框让你粘贴官方安装命令（如 `pip install torch torchvision --index-url https://download.pytorch.org/whl/cu118`），点「安装\
  \ PyTorch」即按你选择的 CUDA 版本执行；另有「打开 PyTorch 官网」按钮直达 https://pytorch.org/get-started/locally/。\n2. **Dataset\
  \ 数据管理**：① 选择原始 `Task03_Liver` 数据目录，自动检查 `imagesTr/labelsTr/dataset.json` 是否存在并分别显示两者 `.nii.gz` 文件数（数量不一致标红）；②「复制\
  \ / 导入到项目 data/raw/Task03_Liver」按钮：若已是项目目录则直接记录路径，否则弹窗让用户选「后台复制（推荐，进度条实时显示已复制/总数）」或「仅记录当前路径」；③「检查数据集」按钮调\
  \ `python src/inspect_dataset.py --data_dir <data_dir> --output_dir outputs`；④「划分数据集」按钮调 `python src/create_splits.py\
  \ --data_dir <data_dir> --output_dir data/splits --train_ratio <v> --val_ratio <v> --seed <v>`，运行完成后自动检查并显示\
  \ `train.json/val.json/test.json` 是否生成；⑤ 所有命令输出实时进 Logs 页。\n3. **Training 模型训练**：选择 `config / train.json\
  \ / val.json`，设置 `max_epochs / batch_size / lr / roi_size / num_workers / device(auto/cuda/cpu)`，切换\
  \ liver-only 提示，开始/停止训练（调 `src/train.py`），显示 checkpoint 路径。\n4. **Inference 模型推理**：选单个 `nii.gz` 或图像文件夹\
  \ + checkpoint + 输出目录 + config，开始推理（调 `src/infer.py`）。\n5. **Evaluation 结果评估**：选 `pred_dir / label_dir\
  \ / output_csv`，开始评估（调 `src/evaluate.py`）。\n6. **Visualization 可视化**：选 `image_path / label_path(可选)\
  \ / pred_path / 输出目录 / num_slices`，生成可视化（调 `src/visualize.py`），可一键打开 `outputs/figures`。\n7. **STL Export\
  \ 三维导出**：选 `mask_path / 输出目录 / liver(1) / tumor(2) / smooth / min_component_size`，导出 STL（调 `src/export_stl.py`）；**顶部红字提醒科研/非临床**。\n\
  8. **Logs 日志**：实时日志窗口（带时间戳）；清空 / 保存日志按钮。\n\n### 6B.4 设计要点\n\n- **后台执行**：`gui/workers.py` 的 `CommandWorker(QThread)`\
  \ 用 `subprocess.Popen` 调 `python <src脚本> <参数>`，stdout/stderr 按行回传 Qt 信号，主线程不卡。\n- **不重写逻辑**：GUI 仅负责参数采集与命令拼装，业务逻辑全部复用\
  \ `src/*.py`。\n- **路径选择**：全部用 `QFileDialog`（封装为 `PathSelect` 控件）。\n- **停止**：训练页「停止训练」对当前 worker 调 `request_stop()`，安全终止子进程。\n\
  \n### 6B.5 开发模式运行\n\n最推荐的方式：在 conda 环境中直接运行源码（无需打包）。\n\n```bash\n# 1) 创建并激活 conda 环境（见 §5 方式 B）\nconda\
  \ create -n medseg python=3.10 -y\nconda activate medseg\n\n# 2) 安装依赖（PyTorch 按官网选 CUDA 版本，见 §5）\npip\
  \ install -r requirements.txt\n\n# 3) 开发模式启动 GUI（修改代码后 Ctrl+C 重启即可生效）\npython gui/app.py\n```\n\n开发模式优点：①\
  \ 启动快；② 改代码立即生效，便于调试；③ 直接复用 conda 环境里的\nPyTorch/MONAI/CUDA，无需打包大体积依赖。\n\n### 6B.6 打包为可执行文件（PyInstaller）\n\
  \n> ⚠ **重要**：不建议把 PyTorch / MONAI / CUDA 全部打包进 exe，原因：\n> 1. 体积会达到数 GB，下载与分发不便；\n> 2. CUDA 运行时（cudnn\
  \ / cublas 等）依赖目标机器的显卡驱动，打包进去后常因\n>    版本不匹配而启动失败；\n> 3. **更推荐在 conda 环境中运行 GUI**（见 §6B.5）。\n>\n> 打包版本**主要用于界面启动**，不负责内置大型模型和数据；模型权重、数据集、\n\
  > 配置文件仍需在运行时通过 GUI 选择。\n\n打包脚本：[`scripts/build_gui.sh`](scripts/build_gui.sh)（Linux/macOS）、\n[`scripts/build_gui.bat`](scripts/build_gui.bat)（Windows）。\n\
  \n#### 6B.6.1 Windows 打包命令\n\n```bat\n:: 在项目根目录执行（需先 pip install pyinstaller）\nscripts\\build_gui.bat\n\
  ```\n\n或手动执行核心命令：\n\n```bat\npyinstaller --name LiverTumorSegToolkit --windowed --noconfirm ^\n    --collect-data\
  \ PySide6 ^\n    --exclude-module torch --exclude-module monai --exclude-module nibabel ^\n    --exclude-module\
  \ cv2 --exclude-module tensorboard --exclude-module matplotlib ^\n    --add-data \"configs;configs\"\
  \ --add-data \"src;src\" ^\n    gui\\app.py\n```\n\n产物：`dist\\LiverTumorSegToolkit\\LiverTumorSegToolkit.exe`（onedir\
  \ 模式）。\n\n#### 6B.6.2 Linux 打包命令\n\n```bash\n# 在项目根目录执行（需先 pip install pyinstaller）\nbash scripts/build_gui.sh\n\
  ```\n\n或手动执行核心命令：\n\n```bash\npyinstaller --name LiverTumorSegToolkit --windowed --noconfirm \\\n  \
  \  --collect-data PySide6 \\\n    --exclude-module torch --exclude-module monai --exclude-module nibabel\
  \ \\\n    --exclude-module cv2 --exclude-module tensorboard --exclude-module matplotlib \\\n    --add-data\
  \ \"configs:configs\" --add-data \"src:src\" \\\n    gui/app.py\n```\n\n产物：`dist/LiverTumorSegToolkit/LiverTumorSegToolkit`（onedir\
  \ 模式）。\n\n#### 6B.6.3 打包说明\n\n- **应用名称**：`LiverTumorSegToolkit`（由 `--name` 指定）。\n- **入口**：`gui/app.py`。\n\
  - **模式**：默认 `onedir`（启动快、调试友好）；如需单文件可改 `--onefile`\n  （启动稍慢，但只生成一个 exe）。\n- **排除大包**：`--exclude-module\
  \ torch/monai/nibabel/cv2/tensorboard/matplotlib`，\n  避免 exe 体积膨胀；运行时 GUI 通过子进程调 `python src/*.py`，会自动使用\n\
  \  conda 环境里的 torch/monai。\n- **附加数据**：`--add-data \"configs;configs\"` 与 `--add-data \"src;src\"` 把\n\
  \  配置文件与 src 脚本一并打包，便于 GUI 在子进程里调用。\n  （Windows 分隔符用 `;`，Linux/macOS 用 `:`）\n- **图标**：如有 `.ico` 文件，在脚本里设\
  \ `ICON=--icon=assets/app.ico`。\n- **运行 exe**：双击 `LiverTumorSegToolkit.exe` 即可启动 GUI；但实际训练/推理\n  仍需机器上装有\
  \ Python + torch + monai（建议在 conda 环境运行 exe，或在 exe\n  同级目录放置 src/ 与 configs/）。\n\n### 6B.7 环境安装（GUI\
  \ 模式推荐流程）\n\n> 这是 GUI 模式下最推荐的环境安装流程（命令行模式同样适用，见 §5）。请按顺序执行：\n\n```bash\n# 1) 创建 conda 环境 medseg（Python\
  \ 3.10）\nconda create -n medseg python=3.10 -y\n\n# 2) 激活环境\nconda activate medseg\n\n# 3) 根据 PyTorch\
  \ 官网安装匹配本机 CUDA 的 PyTorch\n#    打开 https://pytorch.org/get-started/locally/ ，选择你的操作系统 / 包管理器 / CUDA\
  \ 版本，\n#    复制官方给出的命令执行。例如 CUDA 11.8：\npip install torch torchvision --index-url https://download.pytorch.org/whl/cu118\n\
  \n# 4) 安装本项目其余依赖（含 PySide6 GUI 框架）\npip install -r requirements.txt\n```\n\n> ⚠️ 第 3 步**务必**按 PyTorch\
  \ 官网选择与你本机 CUDA / 显卡驱动匹配的版本，否则\n> `torch.cuda.is_available()` 会返回 `False`（详见 §11 常见问题）。`"

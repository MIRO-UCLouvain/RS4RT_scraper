readme_excerpt: "# IDEAL\n**I**ndependent **D**os**E** c**A**lculation for **L**ight ion beam therapy\
  \ using Geant4/GATE.\n\nThis is the `2.0 beta` version of the IDEAL project. The project was initiated\
  \ in\n2018 at [EBG MedAustron GmbH](https://www.medaustron.at/), in collaboration with\n[ACMIT Gmbh](https://acmit.at/)\
  \ and the [Medical University of Vienna](https://radioonkologie.meduniwien.ac.at/research/research-activities/).\n\
  \nIDEAL 2.0 introduces some major changes:\n- **GateRTion v2**, based on Gate 10, replaces GateRTion\
  \ v1. GateRTion v2 features **Geant4 11.4.0**.\n- Simplified installation process: Gate 10 is installed\
  \ by IDEAL via pip. The user **does not need to compile Gate and Gean4 manually** anymore!\n- **RBE\
  \ weighted dose** calculation for carbon ions\n\nThis code has been tested to work correctly for treatment\
  \ plans with the fixed beam lines of the\nMedAustron clinic. At the time of this release it has not\
  \ yet been tested at any other clinic, but we hope\nthat this software will be useful at other clinics\
  \ as well.\n\n**DISCLAIMER**: this version is a beta version and may contain bugs. For a stable and\
  \ validated version of IDEAL, check [IDEAL v1.1.1](https://github.com/OpenGATE/IDEAL/releases/tag/1.1.1).\n\
  \nIf you wish to install this `2.0 beta` release, please clone this code directly from\nGitHub on a\
  \ shared disk of the submit node of your HTCondor cluster and follow\nthe installation instructions.\
  \ \n\nThis project will not work until it has been properly configured.\nPlease take your time and read\
  \ the [\"installation\"](https://pyidc.readthedocs.io/en/latest/installation/index.html)\nand [\"commissioning\"\
  ](https://pyidc.readthedocs.io/en/latest/commissioning/index.html) sections of the documentation carefully.\n\
  For instructions on how to use IDEAL and its different user interfaces, check the [\"user manual\"](https://pyidc.readthedocs.io/en/latest/usage/index.html#)\
  \ section of the documentation.\n"

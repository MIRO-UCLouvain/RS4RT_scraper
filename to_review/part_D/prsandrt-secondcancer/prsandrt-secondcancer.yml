readme_excerpt: '# PRSandRT-secondcancer

  Code used in statistical software (SAS and R) to generate main analysis results for the Nature Medicine
  (2024) manuscript "Polygenic risk scores, radiation treatment exposures and subsequent cancer risk in
  childhood cancer survivors".


  **Title:** Polygenic risk scores, radiation treatment exposures and subsequent cancer risk in childhood
  cancer survivors


  **Authors:** Todd M. Gibson, Danielle M. Karyadi, Stephen W. Hartley, Michael A. Arnold, Amy Berrington
  de Gonzalez, Miriam R. Conces, Rebecca M. Howell, Vidushi Kapoor, Wendy M. Leisenring, Joseph P. Neglia,
  Joshua N. Sampson, Lucie M. Turcotte, Stephen J. Chanock, Gregory T. Armstrong, Lindsay M. Morton


  \n\r\n# Introduction\r\n\r\n**WORC** (Workflow for Optimal Radiomics Classification) is an open-source\
  \ Python package that provides an end-to-end pipeline for fully automatic optimization of radiomics\
  \ models, facilitating easy and systematic data probing for radiomics signatures by automatically comparing\
  \ and combining thousand radiomics methods.\r\n\r\n## \U0001F50D Key Features\r\n\r\n- ✅ **End-to-End\
  \ Pipeline**: Everythong from imaging data and segmentations to performance evaluation.\r\n- \U0001F9EA\
  \ **Modular Design**: Easily integrate custom classifiers, feature selectors, or workflows.\r\n- \U0001F3E5\
  \ **Domain Focused**: Designed and tested on 30+ multicenter medical datasets.\r\n- \U0001F4C1 **Multi-modal\
  \ Input**: Supports multiple image modalities, regions, custom features, and clinical data.\r\n- \U0001F4CA\
  \ **Explainability Tools**: Built-in feature ranking and visualization utilities.\r\n- \U0001F501 **Robust\
  \ Optimization**: Nested cross-validation and sample size-based confidence interval estimation.\r\n\r\
  \n---\r\n\r\n<img src=\"images/WORC.jpg\" alt=\"Overview\"/>\r\n\r\n## \U0001F4E6 Installation\r\n\r\
  \nWORC is tested on Python 3.11.5 on Ubuntu, Windows, and Mac. For detailed installation\r\ninstructions,\
  \ please check  [the ReadTheDocs installation guidelines](https://worc.readthedocs.io/en/latest/static/quick_start.html#installation).\r\
  \n\r\nThe package can be installed through pip:\r\n\r\n    pip install WORC\r\n\r\nOr directly from\
  \ the repository for development:\r\n\r\n    git clone https://github.com/MStarmans91/WORC.git\r\n \
  \   cd WORC\r\n    pip install .\r\n\r\n## \U0001F4DA Tutorial, documentation and dataset\r\nThe WORC\
  \ tutorial is hosted at https://github.com/MStarmans91/WORCTutorial. For your first use, we recommend\
  \ to start with the SimpleWORC tutorial.\r\n\r\nThe official documentation can be found at [https://worc.readthedocs.io](https://worc.readthedocs.io).\r\
  \n\r\nThe publicly released WORC database is described in the following paper:\r\n\r\n```bibtex\r\n\
  @article {Starmans2021WORCDatabase,\r\n\tauthor = {Starmans, Martijn P.A. and Timbergen, Milea J.M.\
  \ and Vos, Melissa and Padmos, Guillaume A. and Gr{\\\"u}nhagen, Dirk J. and Verhoef, Cornelis and Sleijfer,\
  \ Stefan and van Leenders, Geert J.L.H. and Buisman, Florian E. and Willemssen, Francois E.J.A. and\
  \ Koerkamp, Bas Groot and Angus, Lindsay and van der Veldt, Astrid A.M. and Rajicic, Ana and Odink,\
  \ Arlette E. and Renckens, Michel and Doukas, Michail and de Man, Rob A. and IJzermans, Jan N.M. and\
  \ Miclea, Razvan L. and Vermeulen, Peter B. and Thomeer, Maarten G. and Visser, Jacob J. and Niessen,\
  \ Wiro J. and Klein, Stefan},\r\n\ttitle = {The WORC database: MRI and CT scans, segmentations, and\
  \ clinical labels for 930 patients from six radiomics studies},\r\n\telocation-id = {2021.08.19.21262238},\r\
  \n\tyear = {2021},\r\n\tdoi = {10.1101/2021.08.19.21262238},\r\n\tURL = {https://www.medrxiv.org/content/early/2021/08/25/2021.08.19.21262238},\r\
  \n\teprint = {https://www.medrxiv.org/content/early/2021/08/25/2021.08.19.21262238.full.pdf},\r\n\t\
  journal = {medRxiv}\r\n}\r\n```\r\n\r\nThe code to download the WORC database and reproduce our experiments\
  \ can be found at https://github.com/MStarmans91/WORCDatabase.\r\n\r\n## \U0001F4C4 License\r\nThis\

  \n\r\n## Contact\r\nWe are happy to help you with any questions. Please sent us a mail or place an issue\
  \ on the Github.\r\n\r\n## Optional extra features\r\nBesides the default installation, there are several\
  \ optional packages you could install to support WORC.\r\n\r\n### Graphviz\r\nWORC can draw the network\
  \ and save it as a SVG image using [graphviz](https://www.graphviz.org/). In order to do so,\r\nplease\
  \ make sure you install graphviz. On Ubuntu, simply run\r\n\r\n      apt install graphiv\r\n\r\nOn Windows,\
  \ follow the installation instructions provided on the graphviz website.\r\nMake sure you add the executable\
  \ to the PATH when prompted.\r\n\r\n### Elastix\r\nImage registration is included in WORC through [elastix\
  \ and transformix](http://elastix.isi.uu.nl/).\r\nIn order to use elastix, please download the binaries\
  \ and place them in your\r\n``fastr.config.mounts['apps']`` path. Check the elastix tool description\
  \ for the correct\r\nsubdirectory structure. For example, on Linux, the binaries and libraries should\
  \ be in ``\"../apps/elastix/4.8/install/\"``  and\r\n``\"../apps/elastix/4.8/install/lib\"`` respectively.\r\
  \n\r\nNote: optionally, you can tell WORC to copy the metadata from the image file\r\nto the segmentation\
  \ file before applying the deformation field. This requires\r\nITK and ITKTools: see  [the ITKTools\
  \ github](https://github.com/ITKTools/ITKTools)\r\nfor installation instructions.\r\n\r\n### XNAT\r\n\
  We use the XNATpy package to connect the toolbox to the XNAT online database platforms. You will only\r\
  \nneed this when you use the example dataset we provided, or if you want to download or upload data\
  \ from or to XNAT. We advise you to specify\r\nyour account settings in a .netrc file when using this\
  \ feature for your own datasets, such that you do not need to input them on every request.\r\n\r\n"

readme_excerpt: "# AI Drug Discovery – Toxicity Prediction\n\n**Hệ thống dự đoán độc tính thuốc** sử dụng\
  \ multimodal deep learning, hỗ trợ quá trình phát hiện và phát triển thuốc (drug discovery and development).\n\
  Dự án đề xuất khung học sâu kết hợp **ChemBERTa cho biểu diễn chuỗi (sequence-based)** và **GATv2 cho\
  \ mô hình hóa đồ thị phân tử (graph-based)**, với cơ chế **Attention Fusion** để cân bằng và tích hợp\
  \ thông tin từ các mode khác nhau, cùng chiến lược huấn luyện đa nhiệm trên các bộ dữ liệu rời rạc như\
  \ Tox21, SIDER và ToxCast. Tập trung vào xử lý biểu diễn phân tử (SMILES và đồ thị), suy luận mô hình\
  \ để dự đoán độc tính.\n\n---\n\n## \U0001F310 Deployed Web Application\n\n\U0001F517 **Live demo**:\n\
  \n\U0001F449 https://nhungnguyen0804.github.io/ai-drug-ui/\n\n## Mục tiêu dự án\n\n- **Đề xuất khung\
  \ multimodal deep learning**: Tích hợp ChemBERTa (biểu diễn chuỗi SMILES) và GATv2 (biểu diễn đồ thị\
  \ phân tử) để dự đoán độc tính thuốc sớm, chính xác hơn.\n  Xử lý dữ liệu thưa và rời rạc: Sử dụng masked\
  \ multi-task learning trên các bộ dữ liệu Tox21, SIDER, ToxCast để giảm bias từ nhãn thiếu.\n- **Tích\
  \ hợp kiến thức**: Chuẩn hóa dữ liệu với DrugBank để tăng tính nhất quán và độ tin cậy.\n  Cung cấp\
  \ insights giải thích: Phân tích attention để hiểu cấu trúc phụ liên quan đến độc tính, hỗ trợ minh\
  \ bạch trong drug discovery.\n- **Mục tiêu tổng thể**: Hỗ trợ quá trình phát hiện và phát triển thuốc\
  \ bằng cách sàng lọc hợp chất hiệu quả, giảm chi phí và thất bại.\n\n---\n\n## ⭐ Tính năng chính\n\n\
  - **Xử lý dữ liệu phân tử**\n\n  - Chuẩn hóa SMILES\n  - Tiền xử lý và trích xuất đặc trưng\n\n- **Mô\
  \ hình AI**\n\n  - Deep Learning cho toxicity prediction\n  - Hỗ trợ inference nhanh cho môi trường\
  \ production\n\n- **Inference Pipeline**\n\n  - Nhận input → xử lý → dự đoán → trả kết quả\n  - Có health\
  \ check cho hệ thống\n\n- **Backend API**\n\n  - FastAPI\n  - RESTful endpoints cho inference\n\n- **Web\
  \ Interface**\n\n  - Giao diện web đơn giản, dễ sử dụng\n  - Kết nối trực tiếp với backend\n\n- **Triển\
  \ khai**\n  - Deploy Github, HF Spaces\n\n---\n\n## \U0001F4C1 Project Structure\n\n```text\n\nai-drug-discovery-toxicity-prediction/\n\
  ├── checkpoints/\n│ └── trained_multimodal_net.pth\n│\n├── data/\n│ ├── processed/\n│ │ ├── sider.pkl\n\
  │ │ ├── tox21.pkl\n│ │ └── toxcast.pkl\n│ ├── raw/\n│ │ ├── drugbank_all.json\n│ │ └── smile_drugbank.json\n\
  │\n├── HD_env/\n│\n├── outputs/\n│\n├── scripts/\n│ └── run_cleaning.py\n│\n├── src/\n│ ├── **pycache**/\n\
  │ ├── api.py\n│ ├── create_drugbank_dict.ipynb\n│ ├── data_utils.py\n│ ├── dataset.py\n│ ├── eval_utils.py\n\
  │ ├── features.py\n│ ├── inference.py\n│ ├── model.py\n│ ├── predict_toxicity.py\n│ ├── smile_info.py\n\
  │ ├── smiles_to_2d.py\n│ ├── smiles_to_3d.ipynb\n│ └── train_utils.py\n│\n├── train/\n│ └── model.ipynb\n\
  │\n├── .gitignore\n├── Dockerfile\n├── note.txt\n├── README.md\n├── requirements.txt\n└── test.ipynb\n\
  \n```\n\n---\n\n## \U0001F680 Cách chạy project (Local)\n\n### Cài đặt môi trường\n\n```text\npip install\
  \ -r requirements.txt\n\n```\n\n### Chạy backend\n\n```text\npython.exe -m uvicorn src.api:app --host\
  \ 0.0.0.0 --port 8000\n\n```\n\nTruy cập\n\n```text\nhttp://localhost:8000\n```\n\n---\n\n## \U0001F310\
  \ Web Interface Demo\n\n### Input Interface\n\n![Input Demo](assets/input.png)\n\n### Prediction Result\n\
  \n![Output Demo](assets/output1.png)\n\n![Output Demo](assets/output2.png)\n"

readme_excerpt: "# Encwork\n<!-- Shields.io Badges -->\n[![License](https://img.shields.io/github/license/Divarion-D/TCP-Model?style=flat-square)](https://github.com/Divarion-D/TCP-Model/blob/master/LICENSE)\n\
  [![Python](https://img.shields.io/badge/python-3.6%20%7C%203.7%20%7C%203.8-blue?style=flat-square)](https://www.python.org/downloads/)\n\
  <!-- End of Badges -->\nRSA-encrypted networking library.\n\n## What is it for?\nThe TCP Model is designed\
  \ as a secure network system that will generate new keys for each session. It can be used for CLIs or\
  \ command line tools, shared networks that need to be encrypted, or one-time chats.\n\n## How is it\
  \ secured?\nEncwork uses 4096-bit RSA keys (size changable, 4096 recommended) for every message other\
  \ than for the public key exchange, which cannot be encrypted and does not need to be.  \nThis should\
  \ not be a problem, as no computer can get the private key from the public key, and the keys are recreated\
  \ for every new session.\n\n## How does it work?\n### Server-Based\nThere will be one machine running\
  \ a server, and multiple clients can connect to it. The server talks to each client individually, but\
  \ Encwork provides enough freedom that you could set up a system that allows users to talk to each other.\
  \ The server will store all client's public keys & sockets in a dictionary, so all clients still have\
  \ different keys that don't cross paths.\n\n## Requirements\n**Python v3.6+**  \nIf you don't already\
  \ have it, download it [here](https://www.python.org/downloads/).  \n**cryptography>=2.8**  \nDownload\
  \ it using `pip install \"cryptography>=2.8\"`, or download the wheel [here](https://pypi.org/project/cryptography/2.8/#files)\
  \ and use `pip install (.whl file)`.\n\n## Usage\nWhile Encwork comes with demonstration files such\
  \ as `client_example.py` and `server_example.py`, they are only meant to demonstrate how Encwork works.\
  \ You can get the module to build your own UI that will work with any other program that uses Encwork,\
  \ including the example one.\n\n### The `client_example.py` and `server_example.py` files\nAs explained\
  \ above, one machine will run the server (`server_example.py`) and allow clients to connect to it (`client_example.py`).\
  \ The example files are for a server that returns ping, for one- and two-way, including encryption/decryption\
  \ in the time.\n\n# Documentation\nTo see how to use the Encwork module yourself, check out the [Documentation](https://github.com/Divarion-D/TCP-Model/wiki)."

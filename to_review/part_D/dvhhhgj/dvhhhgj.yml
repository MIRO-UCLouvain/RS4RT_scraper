readme_excerpt: '# zeet-flask

  Simple Flask application that can be deployed to Zeet.


  # Walkthrough

  https://www.youtube.com/watch?v=p8IY8bSIg7U


  # Sign up to Zeet

  https://go.zeet.co/devopsjourney


  # Other Types of projects? Django, Golang, Node.js etc.


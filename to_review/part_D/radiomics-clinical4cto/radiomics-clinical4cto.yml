readme_excerpt: "<p align=\"center\">\n    <img width=\"400\" src=\"https://github.com/user-attachments/assets/ae0bf27c-0892-4287-940a-01bfc46acd5e\"\
  >\n</p>\n\n\n\n# Predicting the outcome of endovascular treatment for Chronic Total Occlusions by combining\
  \ Clinical and Radiomics data\n\n## About The Model\nThe concept was tested on predicting the success\
  \ of wire crossing in patients with Chronic Total Occlusion (CTO). This repository contains the trained\
  \ [XGBoost model](xgb_model_combined.joblib) as well as a [python notebook](Radiomics_Clinical4CTO.ipynb)\
  \ with the code that was used for training. The included model is the one with the best performance\
  \ and has been trained on both Radiomics and Clinical data.\n\n### Webapp\nAn online demo of our model\
  \ can be found [here](https://huggingface.co/spaces/ObiWan-AI-ground/Radiomics_Clinical4CTO_app)\n\n\
  ## Disclaimer\n>[!CAUTION] \n>This model has not been tested for clinical use. Use at your own risk\n\
  #### The material in this site is distributed under the [MIT license](https://opensource.org/license/mit)\n\
  \n## Please cite:\nWhen using the code, trained model or demo please cite: Vrettos K., Kasioumi K.,\
  \ Galanakis N., Kehagias E., Kontopodis N., Matthaiou N., Klontzas M., <i>Radiomics enhance the prediction\
  \ of endovascular treatment success for femoropopliteal chronic total occlusions: a proof-of-concept\
  \ study </i>, https://doi.org/10.1016/j.ejrad.2025.112496, European Journal of Radiology, 2025\n"

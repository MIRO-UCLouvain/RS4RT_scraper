  ## 🏃 Getting Started


  ### Prerequisites


  - Node.js 18.0.0 or higher

  - npm 9.0.0 or higher


  ### Installation


  1. Install dependencies:

  ```bash

  npm install

  ```


  2. Run development server:

  ```bash

  npm run dev

  ```


  3. Open [http://localhost:3000](http://localhost:3000)


  ## 📜 Available Scripts


  - `npm run dev` - Start development server

  - `npm run build` - Build for production

  - `npm run start` - Start production server

  - `npm run lint` - Run ESLint

  - `npm run type-check` - Check TypeScript types

  - `npm run format` - Format code with Prettier


  ## 🎨 Theme Customization


  This project uses the **minimal** preset with custom OKLCH colors.


  The theme colors are defined in `src/app/globals.css` using CSS variables in OKLCH format:


  - `--primary` - Primary brand color

  - `--secondary` - Secondary brand color

  - `--accent` - Accent color

  - `--background` - Background color

  - `--foreground` - Text color


  To modify the theme, update the CSS variables in the `:root` selector.



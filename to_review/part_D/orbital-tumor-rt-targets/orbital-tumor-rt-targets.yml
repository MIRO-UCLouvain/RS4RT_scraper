readme_excerpt: "# Orbital Tumor RT — Target Delineation Skill\n\nRadiotherapy target volume delineation\
  \ and dose constraints for orbital tumors — lymphoma, solid malignancies, and benign entities.\n\n##\
  \ What This Skill Does\n\nThe orbit is the most OAR-dense region in radiation oncology. This skill provides\
  \ a standardized decision chain:\n\n1. **Three-compartment localization** — intraocular vs orbital vs\
  \ extraorbital\n2. **Extraorbital lymphatic cascade** — VIII→IX→IIa (often missed by ophthalmologists)\n\
  3. **Compartment-based irradiation** — not distance-based margins\n4. **Door and next room** — orbital\
  \ apex (the door) + cavernous sinus (the next room)\n5. **Anterior segment co-management** — cornea,\
  \ lacrimal gland, nasolacrimal duct\n\n## Quick Install\n\n### Hermes Agent\n```bash\nhermes skills\
  \ install https://raw.githubusercontent.com/antica1/orbital-tumor-rt-targets/master/SKILL.md\n```\n\n\
  ### Claude Code\nCopy `SKILL.md` into your Claude skills directory.\n\n## Trigger Keywords\n\n`orbital\
  \ tumor` `eye tumor` `ocular lymphoma` `lacrimal gland` `sebaceous carcinoma` `retinoblastoma` `uveal\
  \ melanoma` `orbital radiotherapy`\n\n## Key References\n\n- 中国眼及附属器肿瘤放射治疗指南（2021版）. 中国医师协会放疗专委会.\n\
  - Pinnix CC et al. *JAMA Oncol* 2024 (PMID:38990564) — Ultralow-dose orbital RT\n- ILROG Guidelines.\
  \ *IJROBP* 2021\n- QUANTEC / AAPM TG-101\n\n## Author\n\nZhu Guopei, MD — Department of Radiation Oncology,\
  \ Shanghai Ninth People's Hospital, Shanghai Jiao Tong University School of Medicine.  \nContact: antica@gmail.com\n\

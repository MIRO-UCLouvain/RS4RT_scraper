readme_excerpt: "# \U0001F9E0 Brain Tumor Detection and Segmentation using Deep Learning\n\n## \U0001F4CC\
  \ Project Overview\n\nBrain Tumor Detection and Segmentation is a Deep Learning project developed to\
  \ automatically identify tumor regions from Brain MRI images. The model is based on the **U-Net Architecture**,\
  \ which is widely used for medical image segmentation.\n\nThe application processes MRI slices, predicts\
  \ tumor regions, and generates a segmentation mask highlighting the detected tumor. A Streamlit web\
  \ application has also been developed to provide an easy-to-use interface where users can upload MRI\
  \ scans and visualize the prediction results.\n\n---\n\n# \U0001F3AF Objectives\n\n* Detect brain tumors\
  \ from MRI images.\n* Segment tumor regions accurately.\n* Build an end-to-end deep learning pipeline.\n\
  \n\n---\n\n# \U0001F4C2 Dataset\n\nDataset Used:\n\n* BraTS 2020 (Brain Tumor Segmentation Dataset)\n\
  \nDataset contains:\n\n* MRI Images\n* Tumor Masks\n* H5 formatted image slices\n\n---\n\n# \U0001F6E0\
  \ Technologies Used\n\n* Python\n* TensorFlow\n* Keras\n* U-Net\n* NumPy\n* OpenCV\n* Matplotlib\n*\
  \ H5Py\n\n\n---\n\n# \U0001F4CA Project Workflow\n\n```\nBrain MRI Dataset\n        │\n        ▼\nData\
  \ Loading\n        │\n        ▼\nImage Preprocessing\n        │\n        ▼\nData Generator\n       \
  \ │\n        ▼\nTrain-Test Split\n        │\n        ▼\nU-Net Model\n        │\n        ▼\nModel Training\n\
  \        │\n        ▼\nModel Evaluation\n        │\n        ▼\nSave Trained Model\n        │\n     \
  \   ▼\nTumor Prediction\n```\n\n---\n\n# \U0001F4D6 Steps Performed\n\n## 1. Data Loading\n\n* Loaded\
  \ Brain MRI H5 dataset.\n* Read MRI images and segmentation masks.\n\n---\n\n## 2. Data Preprocessing\n\
  \n* Image normalization.\n* Binary mask preparation.\n* Image resizing.\n* Batch generation using custom\
  \ data generator.\n\n---\n\n## 3. Train-Test Split\n\nDataset was divided into:\n\n* Training Set\n\
  * Validation Set\n* Testing Set\n\n---\n\n## 4. Model Architecture\n\nImplemented a U-Net model consisting\
  \ of:\n\n* Encoder\n* Bottleneck\n* Decoder\n* Skip Connections\n\nThe architecture enables precise\
  \ localization of tumor regions while preserving important spatial information.\n\n---\n\n## 5. Loss\
  \ Function\n\nUsed:\n\n* Binary Cross Entropy\n* Dice Loss\n\nCombined as:\n\n```\nBCE + Dice Loss\n\
  ```\n\n---\n\n## 6. Evaluation Metrics\n\n* Dice Coefficient\n* IoU Score\n* Precision\n* Recall\n*\
  \ F1 Score\n\n---\n\n## 7. Model Training\n\nTraining includes:\n\n* Early Stopping\n* Model Checkpoint\n\
  * ReduceLROnPlateau\n\nThe model was trained on Brain MRI slices and the best-performing model was saved.\n\
  \n---\n\n## 8. Save Trained Model\n\nSaved Model:\n\n```\nbrain_tumor_unet.keras\n```\n\nBest Model:\n\
  \n```\nbest_model.keras\n```\n\nKaggle - https://www.kaggle.com/code/hariompatidarr/brain-tumor-detection\n\
  \n---\n\n## 9. Prediction\n\nThe trained model performs:\n\n* MRI image loading\n* Preprocessing\n*\
  \ Tumor segmentation\n* Mask generation\n* Overlay visualization\n\n---\n\nimage - <img width=\"521\"\
  \ height=\"217\" alt=\"image\" src=\"https://github.com/user-attachments/assets/fe1a218f-7b11-4caf-b8e0-90029ebf738c\"\
  \ />\n<img width=\"490\" height=\"363\" alt=\"image\" src=\"https://github.com/user-attachments/assets/1e3e7769-e74a-4d1e-a270-58da54b91cc1\"\
  \ />\n\n\n\n---\n\n---\n\n# \U0001F680 Future Improvements\n\n* Support direct NIfTI (.nii/.nii.gz)\
  \ MRI uploads.\n* 3D Brain MRI segmentation.\n* Multi-class tumor segmentation.\n* Confidence score\
  \ visualization.\n* Cloud deployment.\n\n---\n\n# \U0001F468‍\U0001F4BB Author\n\n**Hariom Patidar**\n\
  \nAI & Machine Learning Developer\n\nSpecialization:\n\n* Deep Learning\n* Computer Vision\n* Medical\
  \ Image Processing\n* Image Segmentation\n\n\n---\n\n# ⭐ If you found this project useful, please consider\
  \ giving it a Star on GitHub.\n"

readme_excerpt: "# DICOM-CBCT-stats\nScripts to exctract relevant data from a structure of DICOM examinations\
  \ for making statistics\n\nThe script extracts values from several DICOM fields to be used for statistics\
  \ about use of CBCT. The script is specially adjusted for the setup and modalities used at our department\
  \ and has to be adjusted for use at other institutions.\n\nDICOM files have to be provideded in subdirectories\
  \ of the working directory\n\nFields extracted:\n    \"AccessionNumber\", \"SeriesInstanceUID\", \"\
  StudyDate\", \"StudyTime\",\n    \"PatientBirthDate\", \"PatientSex\",\n    \"KVP\", \"XRayTubeCurrent\"\
  , \"ExposureTime\", \"AcquiredImageAreaDoseProduct\",\n    \"Columns\", \"Rows\", \"PixelSpacing\",\
  \ \"SeriesDescription\", \"ImagesInAcquisition\", \"SliceThickness\", \n    \"Manufacturer\", \"StationName\"\
  , \"ManufacturerModelName\",\n    \"ImageComments\"\n\nThis can be changed by editing the variable selected_columns\n\
  \nData are written to a csv-file\n"

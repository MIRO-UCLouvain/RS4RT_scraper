readme_excerpt: "# CBAM-brain-tumor-segmentation\n\nThe aim of this project is to add the convolutional\
  \ block attention module (CBAM) to an already existing U-Net model, developed by the German Cancer Research\
  \ Center.\n\nThis model is designed to produce a 3D segmentation of brain tumors, using 3D scans. \n\
  \nNote that my contribution here is adding the CBAM module, this contribution can be found under the\
  \ file \"/code/nnunetLouis/network_architecture\" in files with the word cbam in their name.\nI have\
  \ also added residual blocks (see \"/residual code\") to the original code.\n\nTest results  (with the\
  \ added CBAM and/or residual layers) show notable improvement of segmentation results (Hausdorff metric\
  \ and DICE index).\n\n"

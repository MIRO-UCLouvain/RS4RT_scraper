readme_excerpt: "# Fuzzy-radiomics\nfuzzy radiomics GUI can help extract conventional radiomics, fuzzy\
  \ mask-based radiomic features, and shrunk mask and extended mask for comparison.\n\n# Environmental\
  \ requirements\nMATLAB R2023b in Windows\n\n# How to use it\n1. doble click the `FuRAD.exe` and wait\
  \ a few moment at the first time.\n2. Set the data files' path DATA FILE FOLDER and output path OUTPUT\
  \ FOLDER.\n\n   In `DATA FILE FOLDER`, it should contain patients' folders with the image and mask in\
  \ it. Following is a templet. You can choose to enter the full path of the Data directly in the text\
  \ field, or you can click `Data path` botton and select the folder where the data is located.\n\n```bash\n\
  \    DATA FILE FOLDER/\n    ├── Patient001\n    │   │── ImageCT.mha\n    │   └── MaskGTVn.mha\n    └──\
  \ Patient002\n        │── ImageCT.mha\n        └── MaskGTVn.mha\n```\n\n   In `OUTPUT FOLDER`, it contains\
  \ folders for each modules. The output files for each patient are in their own folder. Following is\
  \ a templet. You can choose to enter the full path of the Output file directly in the text field, or\
  \ you can click `Output path` and select the appropriate folder to save the output.\n\n```bash\n   \
  \ OUTPUT FOLDER/\n    ├── extractionStatus.csv\n    ├── radiomicsFeaturesAllPatients_Bin.csv\n    └──\
  \ radiomicsFeaturesAllPatients_FuzzyMask.csv\n```\n\n4. Set the data file form\n   The data file could\
  \ be either `.mha` or `.dicom`. Please choose it correctly.\n5. Set the image file templet and mask\
  \ file templet\n   We need to know the names of the patient image and mask files (e.g., image file:\
  \ `ImageCT.mha`, mask file: `MaskGTVn.mha`). This can be entered directly in the text field, or you\
  \ can click on the previous button to directly select a patient's data and mask files, respectively.\n\
  6. Select feature extraction modules according to your demonds.\n7. Set hyperparameters. Drag the slider\
  \ to set the parameters. **For the fuzzy mask, the larger the parameter, the higher the fuzzy degree.**\n\
  8. Click the `Start` botton to extract features. The runing information will be displayed in the bottom\
  \ text field.\n\nIf you have any questions or comments, please email us at gene-jin.cao@connect.polyu.hk\n"

readme_excerpt: "# SBRT and Sublobar Resection for Early-Stage NSCLC\n\nCode to generate the results in\
  \ the paper comparing SBRT and sublobar resection using the SEER Medicare dataset. \n\n- `preprocess.2020.final.R`:\
  \ Preprocessing code\n- `codes.R`: Billing codes for variable definitions\n- `proximal.nc.2.mc.R`: Analysis\
  \ code\n- `two.step.variable.selection.R`: Wrapper for the pci2s functions\n- `survival.curves.R`: Generate\
  \ the survival/CIF curves\n- `utilities.R`: Helper functions\n- `file.paths.R`: Paths to raw data for\
  \ the preprocessing code to work\n"

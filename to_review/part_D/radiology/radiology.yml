readme_excerpt: "# radiology\nThis project contains a series of Python scripts for extracting radiomics\
  \ features from medical imaging data and performing clustering analysis and evaluation. The scripts\
  \ cover the entire workflow from feature extraction to clustering metric calculation.\n\n## Environment\
  \ Setup\n1. **Python Environment**:\n   - Ensure Python is installed (version 3.8 or higher is recommended).\n\
  \   - Install the necessary Python packages:\n     ```bash\n     pip install -r requirements.txt\n \
  \    ```\n\n2. **Data Preparation**:\n   - Place image files in the `images` directory.\n   - Place\
  \ mask files in the `masks` directory.\n   - Ensure that the image and mask filenames match.\n\n## Running\
  \ the Scripts\n### Running Scripts Individually\n1. **Run `3.1.py`**:\n   - Extract radiomics features.\n\
  \   - Generate an Excel file (`影像组学特征.xlsx`).\n   - Command:\n     ```bash\n     python 3.1.py\n   \
  \  ```\n\n2. **Run `3.2.py`**:\n   - Perform clustering analysis.\n   - Plot the elbow graph and sample\
  \ distribution.\n   - Command:\n     ```bash\n     python 3.2.py\n     ```\n\n3. **Run `3.3.py`**:\n\
  \   - Extract voxel-based feature maps.\n   - Generate feature map files (`.nii.gz`) and optional visualization\
  \ files (PDF).\n   - Command:\n     ```bash\n     python 3.3.py\n     ```\n\n4. **Run `3.4.py`**:\n\
  \   - Calculate clustering metrics.\n   - Generate a CSV file (`clustering_metrics.csv`).\n   - Command:\n\
  \     ```bash\n     python 3.4.py\n     ```\n\n5. **Run `3.5.py`**:\n   - Split multi-label masks into\
  \ single-label masks.\n   - Command:\n     ```bash\n     python 3.5.py\n     ```\n\n### Running All\
  \ Scripts Using the Batch File\n- Create a batch file (`run_all.bat`) with the following content:\n\
  \  ```bat\n  @echo off\n  echo Running 3.1.py...\n  python 3.1.py\n  echo.\n\n  echo Running 3.2.py...\n\
  \  python 3.2.py\n  echo.\n\n  echo Running 3.3.py...\n  python 3.3.py\n  echo.\n\n  echo Running 3.4.py...\n\
  \  python 3.4.py\n  echo.\n\n  echo Running 3.5.py...\n  python 3.5.py\n  echo.\n\n  echo All scripts\
  \ completed.\n  pause\n"

readme_excerpt: "<div align=\"center\">\n  <img src=\"https://raw.githubusercontent.com/radiuma-com/PySERA/main/Documentations/PySERA.png\"\
  \ alt=\"PySERA Logo\" height=\"100\" align=\"left\">\n</div>\n\n# PySERA: Python-Based Standardized\
  \ Extraction for Radiomics Analysis – Python Radiomics Script and Library\n\n[![Python Version](https://img.shields.io/badge/python-3.10%2B-blue)](https://www.python.org/downloads/)\n\
  [![License](https://img.shields.io/badge/license-MIT-green.svg)](LICENSE)\n[![Development Status](https://img.shields.io/badge/status-stable-green.svg)](https://pypi.org/project/pysera/)\n\
  \n**PySERA** (Python-based Standardized Extraction for Radiomics Analysis), published in \"[PySERA](https://pypi.org/project/pysera/)\"\
  \  is a comprehensive Python library for radiomics feature extraction from medical imaging data. It\
  \ provides a **simple, single-function API** with built-in multiprocessing support, comprehensive report\
  \ capabilities, and optimized performance through OOP architecture, RAM optimization, and CPU-efficient\
  \ parallel processing. PySERA supports both **traditional handcrafted radiomics** (557  features including\
  \ 487 IBSI-compliant, 60 diagnostic, and 10 moment-invariant features) and **deep learning-based feature\
  \ extraction** using pre-trained models like ResNet50, VGG16, and DenseNet121.\n\n## \U0001F50D Table\
  \ of Contents\n- [\U0001F9E9IBSI (Image Biomarker Standardisation Initiative) Standardization-1.0](#IBSI-Standardization)\n\
  - [✨Key Features](#key-features)\n- [\U0001F916Deep Learning Feature Extraction](#deep-learning-feature-extraction)\n\
  - [\U0001F4DALibrary Usage](#library-usage)\n  - [\U0001F4C2Single File Processing](#single-file-processing)\n\
  \  - [\U0001F9E0In-Memory Array Processing](#in-memory-array-processing)\n  - [⚡Parallel Batch Processing](#parallel-batch-processing)\n\
  \  - [\U0001F916Deep Features Extraction](#deep-features-extraction)\n  - [\U0001F527Advanced Configuration](#advanced-configuration)\n\
  - [\U0001F4E5Installation](#installation)\n  - [\U0001F310GitHub Installation](#github-installation)\n\
  \  - [\U0001F5A5️Python Script - Command Line Interface (CLI)](#python-script---command-line-interface-cli)\n\
  \  - [\U0001F4E6Library Installation via pip](#library-installation-via-pip)\n\n- [\U0001F4C2Data Structure\
  \ Requirements](#data-structure-requirements)\n- [\U0001F4CBPySERA Parameters Reference](#pysera-parameters-reference)\n\
  - [\U0001F4CAParameter Compatibility](#parameter-compatibility)\n- [\U0001F4DAAPI Reference](#api-reference)\n\
  - [\U0001F4CAOutput Structure](#output-structure)\n- [\U0001F522Feature Extraction Modes](#feature-extraction-modes)\n\
  - [\U0001F4C1Supported File Formats](#supported-file-formats)\n- [\U0001F3AFLibrary Examples](#library-examples)\n\
  - [⚡Performance Tips](#performance-tips)\n- [\U0001F4BBIntegration of PySERA to GUI](#integration-of-pysera-to-gui)\n\
  - [❓Troubleshooting](#troubleshooting)\n- [\U0001F552Version History](#Version-History)\n- [\U0001F4EC\
  Contact](#contact)\n- [\U0001F465Authors](#authors)\n- [\U0001F4DACitation](#citation)\n- [\U0001F64F\
  Acknowledgment](#acknowledgment)\n- [\U0001F4DCLicense](#license)\n\n## \U0001F9E9IBSI Standardization\n\
  Both the script and library have been rigorously standardized based on **IBSI** (Image Biomarker Standardisation\
  \ Initiative) Standardization 1.0. PySERA returns IBSI-compliant feature values that match the reference\
  \ standard, ensuring reproducibility and comparability across studies.\nSee the detailed evaluation\
  \ and test cases here: [IBSI_Evaluation Folder](https://github.com/radiuma-com/PySERA/tree/main/IBSI_Evaluation)\n\
  \n## ✨Key Features\n\nPySERA provides a **single-function API** that handles all radiomics processing:\n\
  \n```python\nimport pysera\n\nresult = pysera.process_batch(\n    image_input=\"image.nii.gz\",\n  \
  \  mask_input=\"mask.nii.gz\",\n    output_path=\"./results\"\n)\n```\n\nThat's it! \U0001F389 All the\
  \ complexity of multiprocessing, error & warning reports, file format handling, and feature extraction\
  \ is handled automatically.\n\n- **Single Function API**: One function does everything - `pysera.process_batch()`\n\
  - **Multi-format Support**: NIfTI, DICOM, NRRD, RTSTRUCT, NumPy arrays, and more\n- **Automatic Multiprocessing**:\
  \ Built-in parallel processing for maximum performance\n- **Comprehensive Report**: Excel export functionality\
  \ for detailed analysis\n- **Extensive Features**: 557 total radiomics features across multiple categories\
  \ (morphological, statistical, texture, etc.) and dimensions (1st, 2D, 2.5D, 3D) including:\n  - **487\
  \ IBSI-compliant features** (standardized radiomics)\n  - **60 diagnostic features** (image quality\
  \ and metadata)\n  - **10 moment-invariant features** (shape descriptors) \n- **Medical Image Optimized**:\
  \ Designed for CT, MRI, PET, SPECT, X-Ray, Ultrasound, and other medical imaging modalities.\n- **Dual\
  \ Extraction Modes**: Both traditional IBSI-compliant radiomics (557 features) and deep learning features\
  \ (ResNet50, VGG16, DenseNet121)\n\nFor a complete list of all 557 features with their definitions,\
  \ formulas, and IBSI compliance status, see the \n**[PySERA Feature Definitions and Formula](https://github.com/radiuma-com/PySERA/blob/main/Documentations/PySERA_Feature_Definitions_and_Formula.pdf)**\
  \ document.\n\n## \U0001F916Deep Learning Feature Extraction\n\nPySERA supports advanced **deep learning-based**\
  \ feature extraction alongside traditional radiomics, providing multiple pre-trained models for comprehensive\
  \ feature representation. When using **extraction_mode=\"deep_feature\"**, the categories parameter\
  \ is automatically handled by the **deep learning model**. Deep features are extracted in 3D dimension\
  \ by default for comprehensive volumetric analysis. All deep learning features are extracted specifically\
  \ from the ROI regions defined by the mask and model outputs provide complementary feature representations\
  \ to traditional radiomics.\n\n**Available Deep Learning Models**:\n\n- **`resnet50`** - 2048 features:\
  \ Residual Network with 50 layers, balanced performance and accuracy\n- **`vgg16`** - 512 features:\
  \ Visual Geometry Group with 16 layers, strong hierarchical feature representation  \n- **`densenet121`**\
  \ - 1024 features: Dense Convolutional Network with 121 layers, efficient feature reuse\n  \n### \U0001F4E6\
  Library Installation via pip\n\nInstall the PySERA library directly from PyPI:\n\n```bash\npip install\
  \ pysera\n```\n\n## \U0001F4DALibrary Usage\n\nOnce installed, you can use PySERA directly in your Python\
  \ code.\n\n### \U0001F4C2Single File Processing\n\n```python\nimport pysera\n\n# Process single image-mask\
  \ pair\nresult = pysera.process_batch(\n    image_input=\"scan.nii.gz\",\n    mask_input=\"mask.nii.gz\"\
  ,\n    output_path=\"./results\"\n)\n\nprint(f\"Success: {result['success']}\")\nprint(f\"Features extracted:\
  \ {result['features_extracted']}\")\nprint(f\"Processing time: {result['processing_time']:.2f} seconds\"\
  )\n```\n\n### \U0001F9E0In-Memory Array Processing\n\n```python\nimport numpy as np\nimport nibabel\
  \ as nib\nimport pysera\n\n# Load image and mask as NumPy arrays (for example, using nibabel)\nimage_array\
  \ = nib.load(\"patient002_image.nii.gz\").get_fdata()\nmask_array = nib.load(\"patient002_mask.nii.gz\"\
  ).get_fdata()\n\n# Process the image and mask directly from memory\nresult = pysera.process_batch(\n\
  \    image_input=image_array,\n    mask_input=mask_array,\n    output_path=\"./results\"\n)\n\n# Display\
  \ results\nprint(f\"Success: {result['success']}\")\nprint(f\"Features extracted: {result['features_extracted']}\"\
  )\nprint(f\"Processing time: {result['processing_time']:.2f} seconds\")\n```\n\n### ⚡Parallel Batch\
  \ Processing\n\n```python\nimport pysera\n\n# Process multiple files with 4 CPU cores\nresult = pysera.process_batch(\n\
  \    image_input=\"./patient_scans\",\n    mask_input=\"./patient_masks\", \n    output_path=\"./results\"\
  ,\n    num_workers=\"4\",              # Use 4 CPU cores\n    categories=\"glcm, glrlm\",     # Extract\
  \ specific feature categories\n    dimensions=\"1st, 2_5d, 3d\",   # Extract features in specified dimensions\n\
  \    apply_preprocessing=True,   # Apply ROI preprocessing\n)\n\nprint(f\"Processed {result['processed_files']}\
  \ files\")\nprint(f\"Total processing time: {result['processing_time']:.2f} seconds\")\n```\n\n> **\U0001F3A5\
  \ Video Tutorial:** [PySERA: Extract Handcrafted Radiomics from Single & Multiple NIfTI Images](https://www.youtube.com/watch?v=4vEdSBLM5uA)\n\
  > \n> Watch our step-by-step tutorial demonstrating how to extract handcrafted radiomics features from\
  \ NIfTI images using PySERA's simple API.\n\n\n### \U0001F916Deep Features Extraction\n\n### ⚠️ Additional\
  \ Requirements for Deep Learning Models\n\nDeep learning feature extraction requires additional dependencies\
  \ that are **not installed automatically with PySERA**.  \nBefore using `extraction_mode=\"deep_feature\"\
  `, you must install **PyTorch** and **TorchVision**, which are required for loading the pre-trained\
  \ CNN models.\n\nInstall the required packages using pip:\n```bash\npip install torch torchvision\n\
  ```\n\n```python\nimport pysera\n\n# Process multiple files with 4 CPU cores\nresult = pysera.process_batch(\n\
  \    image_input=\"./patient_scans\",\n    mask_input=\"./patient_masks\", \n    output_path=\"./results\"\
  ,\n\n    # Deep learning configuration\n    extraction_mode=\"deep_feature\",      # Enable deep learning\
  \ features\n    deep_learning_model=\"resnet50\",      # Use ResNet50 model (2047 features)\n\n    roi_num=5,\
  \                           # Number of ROIs to process\n    roi_selection_mode=\"per_img\",       \
  \ # ROI selection strategy\n\n\n    # Logging options\n    report=\"warning\"            # Report detail\
  \ level: \"all\" (full processing details), \n                              # \"info\" (essential information),\
  \ \"warning\" (warnings only), \n                              # \"error\" (errors only), \"none\" (no\
  \ reporting). Default: \"all\"\n\n)\n\nprint(f\"Processed {result['processed_files']} files\")\nprint(f\"\
  Total processing time: {result['processing_time']:.2f} seconds\")\n```\n\n \n## \U0001F527Advanced Configuration\n\
  \n```python\nimport pysera\n\n# Comprehensive processing with custom parameters\nresult = pysera.process_batch(\n\
  \    image_input=\"image.nii.gz\",\n    mask_input=\"mask.nii.gz\",\n    output_path=\"./results\",\n\
  \    \n    # Performance settings\n    num_workers=\"2\",           # Use 2 CPU cores\n    enable_parallelism=False\
  \ ,     # Disable multiprocessing\n    \n    # Image feature extraction settings\n    categories=\"\
  glcm, glrlm, glszm\",  # Extract specific texture feature categories\n    dimensions=\"1st, 2_5d, 3d\"\
  ,       # Extract features in 1st order, 2.5D and 3D dimensions\n    # Alternative examples for categories\
  \ and dimensions:\n    # categories=\"all\",                 # Extract all 557 features\n    # categories=\"\
  stat, morph, glcm\",   # Statistical, morphological and GLCM features\n    # dimensions=\"2D\",    \
  \              # Extract only 2D features\n    # dimensions=\"all\",                 # Extract features\
  \ in all dimensions\n    \n    bin_size=25,               # Texture analysis bin size\n    roi_num=2,\
  \                # Number of ROIs to process\n    roi_selection_mode=\"per_region\",  # ROI selection\
  \ strategy\n    min_roi_volume=5,          # Minimum ROI volume threshold\n    \n    # Processing options\n\
  \    apply_preprocessing=True,   # Apply ROI preprocessing\n    feature_value_mode=\"APPROXIMATE_VALUE\"\
  ,  #\tStrategy for handling NaN values.\n\n    # IBSI parameters (advanced, overrides defaults)\n  \
  \  IBSI_based_parameters={\n        \"radiomics_DataType\": \"CT\",\n        \"radiomics_DiscType\"\
  : \"FBN\",\n        \"radiomics_isScale\": 1\n    },\n    \n    # Logging options\n    report=\"info\"\
  \             # Report detail level: \"all\" (full processing details), \n                         \
  \     # \"info\" (essential information), \"warning\" (warnings only), \n                          \
  \    # \"error\" (errors only), \"none\" (no reporting). Default: \"all\"\n)\n```\n\n## \U0001F4E5Installation\n\
  \nPySERA can be installed as a Python library for integration into your projects or as a standalone\
  \ script for command-line usage. It supports Windows, macOS, and Linux. Below are the installation options.\n\
  \n### \U0001F310GitHub Installation \n\nFor users who want to develop with the source code or run PySERA\
  \ as a standalone command-line tool (CLI) without installing it as a Python package, you can clone the\
  \ repository from GitHub.\nThis gives you access to the standalone script radiomics_standalone.py and\
  \ all example files. After installing the dependencies, you can run the script directly (see the [\U0001F4BB\
  Python Script - Command Line Interface (CLI)](#python-script---command-line-interface-cli) section).\n"

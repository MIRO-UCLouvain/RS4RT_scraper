readme_excerpt: "# BRAIN TUMOR CLASSIFICATION AND SEGMENTATION USING DENSENET121\n\n## PROJECT OVERVIEW\n\
  \nThis project presents a deep learning framework for the simultaneous classification and segmentation\
  \ of brain tumors from contrast-enhanced MRI images. The proposed model employs a pretrained DenseNet121\
  \ as a shared encoder with two task-specific branches: a classification head for identifying tumor types\
  \ and a U-Net-style decoder for tumor segmentation. The multi-task learning approach enables accurate\
  \ tumor diagnosis while simultaneously localizing tumor regions.\n\n---\n\n## OBJECTIVES\n\n- Develop\
  \ a dual-task deep learning model for simultaneous brain tumor classification and segmentation.\n- Classify\
  \ brain tumors into three categories:\n  - Meningioma\n  - Glioma\n  - Pituitary Tumor\n- Accurately\
  \ segment tumor regions from MRI images.\n- Improve diagnostic performance using shared feature representations.\n\
  - Evaluate the model using both classification and segmentation metrics.\n\n---\n\n## FEATURES\n\n-\
  \ Multi-task Deep Learning Framework\n- DenseNet121 Pretrained Encoder\n- U-Net-style Segmentation Decoder\n\
  - Multi-class Brain Tumor Classification\n- Binary Tumor Segmentation\n- Data Augmentation using Albumentations\n\
  - Transfer Learning with ImageNet Weights\n- Comprehensive Performance Evaluation\n\n---\n\n## DATASET\n\
  \n- **Dataset:** Figshare Brain Tumor Dataset\n- **Modality:** Contrast-Enhanced T1-weighted MRI\n-\
  \ **Total Images:** 3,064 MRI slices\n- **Patients:** 233\n- **Image Size:** 224 × 224\n- **Tumor Classes:**\n\
  \  - Meningioma\n  - Glioma\n  - Pituitary Tumor\n\n---\n\n## TECHNOLOGIES USED\n\n- Python\n- PyTorch\n\
  - Torchvision\n- Albumentations\n- NumPy\n- Matplotlib\n- OpenCV\n- Scikit-learn\n- Google Colab\n\n\
  ---\n\n## MODEL ARCHITECTURE\n\nThe proposed framework consists of:\n\n- DenseNet121 (Pretrained on\
  \ ImageNet)\n- Shared Feature Encoder\n- Classification Head\n- U-Net-style Segmentation Decoder\n-\
  \ Multi-task Learning Framework\n\n---\n\n## PROJECT WORKFLOW\n\n1. Load MRI Dataset\n2. Image Preprocessing\n\
  3. Data Augmentation\n4. Dataset Splitting\n5. Model Construction\n6. Model Training\n7. Classification\
  \ Prediction\n8. Tumor Segmentation\n9. Performance Evaluation\n\n---\n\n## RESULTS\n\n### Classification\
  \ Performance\n\n| Metric | Value |\n|--------|-------:|\n| Test Accuracy | 99.13% |\n| Precision |\
  \ 98.90% |\n| Recall | 98.98% |\n| F1 Score | 98.94% |\n| ROC-AUC | 99.99% |\n\n### Segmentation Performance\n\
  \n| Metric | Value |\n|--------|-------:|\n| Dice Score | 0.7691 |\n| IoU | 0.6738 |\n| Pixel Accuracy\
  \ | 0.9941 |\n\n---\n\n## INSTALLATION\n\n1. Clone the repository\n\n```bash\ngit clone https://github.com/Abdulmimic/Brain-Tumor-Classification-and-Segmentation.git\n\
  ```\n\n2. Install the required libraries\n\n```bash\npip install -r requirements.txt\n```\n\n3. Open\
  \ `brain_tumor_classification_segmentation.ipynb` and run all cells sequentially.\n\n---\n\n## PROJECT\
  \ STRUCTURE\n\n```text\nBrain-Tumor-Classification-and-Segmentation/\n│\n├── brain_tumor_classification_segmentation.ipynb\n\
  ├── README.md\n├── requirements.txt\n├── LICENSE\n├── .gitignore\n└── images/\n```\n\n---\n\n## FUTURE\
  \ IMPROVEMENTS\n\n- Extend to 3D MRI volumetric analysis.\n- Support multi-modal MRI sequences.\n- Improve\
  \ segmentation using Transformer-based architectures.\n- Deploy the model as a web application.\n- Integrate\
  \ Explainable AI techniques such as Grad-CAM.\n\n---\n\n## LICENSE\n\nThis project is licensed under\
  \ the MIT License.\n\n---\n\n## AUTHOR\n\n**Abdul Rahman K** \n\nBiomedical Engineering Graduate (2026)\n\
  \nAspiring AI / Machine Learning Engineer\n"

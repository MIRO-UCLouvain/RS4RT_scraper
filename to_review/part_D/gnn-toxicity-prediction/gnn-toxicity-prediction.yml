readme_excerpt: "# QSAR GNN\n\nEste repositório contém os códigos desenvolvidos para o **TCC**.\n\n##\
  \ Pré-requisitos\n\n- [Miniconda](https://docs.conda.io/en/latest/miniconda.html) ou [Anaconda](https://www.anaconda.com/products/distribution)\
  \ instalados.\n- Git instalado (opcionalmente).\n\n## Instalação do ambiente\n\n1. Clone o repositório:\n\
  \n   ```bash\n   git clone https://github.com/GkingOficial/TCC.git\n   cd TCC\n   ```\n\n2. Crie o ambiente\
  \ Conda a partir do arquivo `environment.yml`:\n\n   ```bash\n   conda env create -f environment.yml\n\
  \   ```\n\n3. Ative o ambiente:\n\n   ```bash\n   conda activate env_gnn\n   ```\n\n4. Instale as dependências\
  \ específicas do projeto:\n\n   ```bash\n   pip install -r \"QSAR GNN/requirements.txt\"\n   ```\n"

readme_excerpt: "# OpenTPS\n\nPython application for treatment planning in proton therapy, based on the\
  \ MCsquare Monte Carlo dose engine.\n\nThe OpenTPS application 1.0.0 contains the packages opentps-core\
  \ (version 1.0.7) and opentps-gui (version 1.0.5) which are also available separately.\n\nIf you are\
  \ using OpenTPS as part of your research, teaching, or other activities, we would be grateful if you\
  \ could star the repository and/or cite our work.\n\nIf you want to cite OpenTPS, feel free to cite\
  \ our white paper accessible [here](https://arxiv.org/abs/2303.00365) or with the following bibtex reference\
  \ :\n```bibtex\n@misc{wuyckens2023opentps,\ntitle={OpenTPS -- Open-source treatment planning system\
  \ for research in proton therapy},\nauthor={S. Wuyckens and D. Dasnoy and G. Janssens and V. Hamaide\
  \ and M. Huet and E. Loÿen and G. Rotsart de Hertaing and B. Macq and E. Sterpin and J. A. Lee and K.\
  \ Souris and S. Deffet},\nyear={2023},\neprint={2303.00365},\narchivePrefix={arXiv},\nprimaryClass={physics.med-ph}\n\
  }\n```\n\n## Installating and starting OpenTPS\n\n1. Install the latest version of Anaconda. Download\
  \ the latest version from https://www.anaconda.com/.\n2. In a conda prompt, create a new virtual environment\
  \ with python 3.9 and activate it:\n\n```\n   conda create --name OpenTPS python=3.9\n   conda activate\
  \ OpenTPS\n```\n\n3. Install OpenTPS:\n\n```\n   pip install opentps\n```\n\n4. Start it with:\n\n```\n\
  \   opentps\n```\n"

readme_excerpt: "# RADIANCE: Radiotherapy Survival Rate Modeling Interface\nThis is the repository for\
  \ the development of the RADIANCE project,\na GUI (Graphical User Interface) to perform survival rate\
  \ (SR) modeling\nby fitting different survival models to clinical data.\n\nThis project is being developed\
  \ in the context of the DTRP\n(Diagnosis and Therapy with Radiation and Protons)\nclass of 2022/2023.\n\
  \n# Authors: \n              R. Matoza Pires - fc49807@alunos.fc.ul.pt\n              A. Pardal    \
  \   - fc51387@alunos.fc.ul.pt\n              R. Santos       - fc54741@alunos.fc.ul.pt\n\n# Supervisor:\n\
  \              Prof. Dr. Brígida C. Ferreira\n\n# Last Update: 19/03/2024 \n  Program under development\
  \ using the latest versions of MATLAB: R2023a and R2022b\n# --------------------------------------------------------------------------------------\n\
  \nThe folder \"code\" contains the files related with the fitting functions of the program\n\"fit1.m\"\
  , \"fit2.m\" and \"BED.m\", under development;\n\nThe folder \"Interface\" contains the files dedicated\
  \ to the development of the grafical interface of the program:\n\n  \"FitModel\" contains the latest/stable\
  \ version of the program, that include the previously mentioned files;\n  # !!!   To launch the interface\
  \ run the \"radiance.m\" script in MATLAB   !!! #\n\n  \"dev\" is a development folder, containing an\
  \ old/not-stable version of the program;\n  \n  \"terProMATLAB\" and \"teraProOctave\" are the original\
  \ versions of an example project,\n  built in MATLAB and Octave, respectively;\n\nThe folder Tests contains\
  \ scripts for testing functionalities:\n  AddMatrix.m (works in both MATLAB and Octave)\n"

readme_excerpt: "# CBCT - CodeBase Cartographic Tool\n\n> Transform your codebase from a text forest into\
  \ a navigable landscape.\n\n**CBCT** is a cognitive-first software visualization system designed to\
  \ help developers understand, reason about, and reflect on the structure of a codebase.\n\n## \U0001F3AF\
  \ Core Philosophy\n\n- **Thinking-First Design** — Cognitive clarity over automation\n- **Observational,\
  \ Not Prescriptive** — Describes what exists, never what should be done\n- **Silent by Default** — No\
  \ alerts, popups, or interruptions\n- **Exploration-Driven** — Understanding is discovered\n- **Respect\
  \ for Developer Intelligence** — No oversimplification\n\n## \U0001F680 Quick Start\n\n### Prerequisites\n\
  \n- Node.js 18+\n- npm or yarn\n\n### Installation\n\n```bash\n# Clone the repository\ncd cbct\n\n#\
  \ Install all dependencies\nnpm install\n\n# Start development servers (both client & server)\nnpm run\
  \ dev\n```\n\nThe app will be available at:\n- Frontend: http://localhost:3000\n- Backend API: http://localhost:5000\n\
  \n## \U0001F4C1 Project Structure\n\n```\ncbct/\n├── client/                 # React frontend\n│   ├──\
  \ src/\n│   │   ├── components/     # UI components\n│   │   ├── services/       # API client\n│   │\
  \   ├── store/          # Zustand state management\n│   │   └── App.jsx         # Main app component\n\
  │   └── package.json\n├── server/                 # Node.js backend\n│   ├── src/\n│   │   ├── routes/\
  \         # API routes\n│   │   ├── services/       # Business logic\n│   │   └── index.js        #\
  \ Server entry\n│   └── package.json\n└── package.json            # Workspace root\n```\n\n## \U0001F5FA\
  ️ Features\n\n### \U0001F3AF Semantic Layer Engine (NEW!)\n\nCBCT features an **adaptive visualization\
  \ system** that automatically adjusts to repository size while maintaining a consistent user experience:\n\
  \n- **4 Semantic Layers**: Progressive disclosure from overview to detail\n  - Layer 1: Orientation\
  \ (high-level overview)\n  - Layer 2: Structural (connections and relationships)\n  - Layer 3: Impact\
  \ & Risk (dependency chains and risk indicators)\n  - Layer 4: Detail (full file-level analysis)\n\n\
  - **Adaptive Unit Selection**: Automatically chooses the right abstraction level\n  - Small repos (<\
  \ 80 files): File-based units\n  - Medium repos (80-500 files): Folder-based units\n  - Large repos\
  \ (≥ 500 files): Semantic cluster units\n\n- **Consistent UX**: Same interaction model regardless of\
  \ repository size\n- **Performance Optimized**: Safety limits prevent UI overload\n- **Risk Detection**:\
  \ Identifies circular dependencies, high-impact units, and potential issues\n\n### ⚡ Advanced Developer\
  \ Workflow (NEW!)\n\nCBCT transforms from a static map to a **proactive engineering cockpit**:\n\n-\
  \ **IDE Sync**: Click the External Link icon to instantly jump to the source in **VS Code**.\n- **Pathfinding**:\
  \ High-speed BFS traces the **shortest dependency chain** between any two units via `Ctrl + Click`.\n\
  - **Git Intelligence**:\n    - **Churn Hotspots**: Pulsing **Heat Auras** highlight files with high\
  \ historical volatility.\n    - **PR Impact Mode**: Neon highlighters show what’s changed in your current\
  \ branch vs `main`.\n- **Architectural Guardrails**: Define forbidden boundaries (e.g., UI → DB) and\
  \ get **visual alerts** on violations.\n\n\U0001F4DA **[Semantic Layer Guide](./SEMANTIC_LAYER_GUIDE.md)**\
  \ | **[Technical Architecture](./ARCHITECTURE.md)** | **[Development Guide](./DEVELOPMENT.md)**\n\n\
  ## \U0001F4C1 Project Structure\n\n```\ncbct/\n├── client/                 # React frontend\n│   ├──\
  \ src/\n│   │   ├── components/     # UI components\n│   │   ├── services/       # API client & state\
  \ management\n│   │   └── store/          # Zustand store\n├── server/                 # Node.js backend\n\
  │   ├── src/\n│   │   ├── routes/         # API routes\n│   │   └── services/       # Analysis & Semantic\
  \ engines\n└── package.json            # Workspace root\n```\n\n## \U0001F6E0️ Tech Stack\n\n**Frontend:**\
  \ React 18, Vite, Tailwind CSS, react-force-graph-2d, Zustand, Lucide React.\n**Backend:** Node.js,\
  \ Express, simple-git, glob.\n\n## \U0001F3A8 Design Principles\n\n- No insight is shown without explicit\
  \ user intent.\n- Highlights are descriptive, not judgmental.\n- Real-time metabolic signals (Churn)\
  \ reveal the living system.\n\n---\n\n**Clear thinking precedes confident code.**\n"

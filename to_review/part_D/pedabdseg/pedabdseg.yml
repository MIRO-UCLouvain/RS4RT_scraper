readme_excerpt: "# -PedAbdSeg-\nThis repository contains the trained models and training hyperparameters\
  \ presented in the paper *\"Deep learning-based auto-contouring of organs/structures-at-risk for pediatric\
  \ abdominal radiotherapy.\"*  \n\n# Deep learning-based auto-contouring of organs/structures-at-risk\
  \ for pediatric abdominal radiotherapy\n\nThe repository provides:\n\n1. **plans.json**: The nnUNetv2\
  \ plan file, including all hyperparameters based on our in-house dataset.\n2. **model.tar.gz**: The\
  \ final selected model archive for clinical evaluation.\n3. **network_architecture.pdf**: Visualization\
  \ of the model architecture for the final selected best model.\n4. **Supplementary material S4.xlsx**:\
  \ The grading sheet used for qualitative clinical evaluation by clinicians.\n\n---\n\n## Model\nThe\
  \ model is a 3D full-resolution (`3d_fullres`) nnUNetv2 model trained for 1000 epochs. No ensemble was\
  \ applied. The model  was developed based on 189 in-house pediatric CTs with renal tumors or abdominal\
  \ neuroblastomas, and 189 publicly available pediatric CTs from the [TCIA Pediatric CT Segmentation\
  \ dataset](https://www.cancerimagingarchive.net/collection/pediatric-ct-seg/).\n\n\n### Model labels\n\
  \nThe following labels were used during model training and prediction:\n```json\n{\n    \"labels\":\
  \ {\n        \"background\": 0,\n        \"spleen\": 1,\n        \"kidney_right\": 2,\n        \"kidney_left\"\
  : 3,\n        \"heart\": 4,\n        \"liver\": 5,\n        \"lung_right\": 6,\n        \"lung_left\"\
  : 7,\n        \"pancreas\": 8,\n        \"stomach_bowel\": 9,\n        \"vertebrae\": 10,\n        \"\
  spinal_cord\": 11,\n        \"aorta_abdominal\": 12,\n        \"inferior_vena_cava\": 13,\n        \"\
  autochthon_left\": 14,\n        \"autochthon_right\": 15,\n        \"iliopsoas_left\": 16,\n       \
  \ \"iliopsoas_right\": 17\n    }\n}\n```\n### 1. Setup the Environment\n\n\n```bash\nconda create -n\
  \ pedseg python=3.10\nconda activate pedseg\n# We used nnUNetv2 ==v2.2 for model training.\npip install\
  \ nnunetv2\n```\n\n### 2. Download Files and Prepare Data\n\nDownload `model.tar.gz` into your working\
  \ directory and decompress it:\n```bash\ntar -xzvf model.tar.gz\ncd model            \nfind . -name\
  \ \"*.gz\" -exec gunzip {} \\;   # unzip all .gz files\n\n```\n\n\n### 3. Run Predictions\n\nSet the\
  \ necessary environment variables:\n```bash\nexport nnUNet_raw=\"./nnUNet_raw\"\nexport nnUNet_preprocessed=\"\
  ./nnUNet_preprocessed\"\nexport nnUNet_results=\"./nnUNet_results\"\n```\n\nTo run inference:\n\n```bash\n\
  nnUNetv2_predict -d Dataset002_TwoSet -i ../folder_with_nifti_files  -o output/no_postprocess -f 1 -c\
  \ 3d_fullres -p PlanfromUMCU -chk checkpoint_best.pth\n```\n\n### 4. Run Postprocessing (Optional)\n\
  \nTo apply postprocessing using the \\`postprocessing.pkl\\` file (based on our validation set):\n\n\
  ```bash\nnnUNetv2_apply_postprocessing -pp_pkl_file ./nnUNet_results/Dataset002_TwoSet/nnUNetTrainer__PlanfromUMCU__3d_fullres/fold_1/validation/postprocessing.pkl\
  \ -i output/no_postprocess -o output/with_postprocess\n```\n\n\n\n\n\n\n## Citation\n\nIf you use this\
  \ repository, please cite the following:\n\n\n**This work**:  \nDing, M., Maspero, M., Littooij, A.\
  \ S., van Grotel, M., Fajardo, R. D., van Noesel, M. M., ... & Janssens, G. O.(2025). Deep learning-based\
  \ auto-contouring of organs/structures-at-risk for pediatric upper abdominal radiotherapy. *Radiotherapy\
  \ and Oncology*, in press.\n\n\n**nnUNet**:\nIsensee, F., Jaeger, P. F., Kohl, S. A., Petersen, J.,\
  \ & Maier-Hein, K. H. (2021). nnU-Net: a self-configuring method for deep learning-based biomedical\
  \ image segmentation. *Nature Methods, 18*(2), 203-211.\n\n**Totalsegmentator**:\nWasserthal, J., Breit,\
  \ H. C., Meyer, M. T., Pradella, M., Hinck, D., Sauter, A. W., ... & Segeroth, M. (2023). TotalSegmentator:\
  \ robust segmentation of 104 anatomic structures in CT images. Radiology: Artificial Intelligence, 5(5).\n\
  \n**Pediatric-CT-SEG**:\nJordan, P., Adamson, P. M., Bhattbhatt, V., Beriwal, S., Shen, S., Radermecker,\
  \ O., ... & Schmidt, T. G. (2022). Pediatric chest-abdomen-pelvis and abdomen-pelvis CT images with\
  \ expert organ contours. *Medical Physics, 49*(5), 3523-3528.\n\n\n\n\n\n## Discussion\n\nWe would love\
  \ to hear about your experience and results using this model on your pediatric datasets.\n"

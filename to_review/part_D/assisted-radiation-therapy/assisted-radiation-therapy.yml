readme_excerpt: "# Zweckbestimmung\nDas Medizinprodukt hat den Zweck, 3D Daten für den Nutzer dreidimensional\
  \ zu visualisieren. \nEs kann z.B. für computerunterstützte Planung einer Chirurgie, Analyse der Daten\
  \ oder Visualierung\nfür den Patienten bei der Besprechung einer Behandlung genutzt werden.\n\n# Beschreibung\n\
  Das Produkt ist aufgeteilt in Frontend, die graphische Darstellung, und Backend, das Laden von Bilddateien\
  \ und Erstellen der Bildbuffer. \nFür das Frontend wird QImage und QWidget benutzt für interaktive Buttons,\
  \ Slider und dynamische Bilder. Dadurch können z.B. HU-Windowing Werte eingestellt werden, oder die\
  \ 3D Position in einer 2D Anicht ermittelt werden.\nIm Backend werden Bilddateien in Buffer geladen,\
  \ mit diesen Buffern werden z.B. durch Lichtverhältnisse veränderte Pixel ausgerechnet. Letztendlich\
  \ kann das Frontend auf diese Daten als eine Library \"MyLib\" zugreifen.\n\n# Bedienungsanleitung\n\
  Wenn das Produkt gestartet wird, befinden sich links zwei Bereiche für Bilder. In dem linken Bereich\
  \ wird die aktuelle Schicht angezeigt mit den Pixeln im HU-Window-Bereich rot markiert. \nIm rechten\
  \ Bild wird eine 3D Ansicht der Daten dargestellt. Mit dem Button \"Load 3D Image\" kann eine 3D Datei\
  \ (.raw) ausgesucht werden.\nDie Perspektive kann mit den Buttons rechts von den LoadImage Buttons verändert\
  \ werden \"Rotation X: 90°\", usw..\nFür die Einstellung der HU-Windowing Werte können die Slider benutzt\
  \ werden, oder auch die Buttons, welche die Werte automatisch nach den entsprechenden Werten für \"\
  Blut\", \"Knochen\", usw. einstellen.\nZuletzt kann durch Klicken in den Bildern Anzeige der 3D Position\
  \ zu der 2D Ansicht neben der Maus aktiviert und deaktiviert werden. \n\n# Voraussetzung\nWindows 10/11,\
  \ Linux, oder MacOs."
